 use 3.0 4.5","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","基礎"]},{"id":"DIL-010","t":"num","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：住宅用途（Domestic uses）樓面的 qk 是多少 kPa？","a":2.0,"tol":0,"u":"kPa","e":"Class 1 Domestic uses：qk 2.0 kPa、Qk 2.0 kN。住宅廚房、浴室亦同為 2.0 kPa，但 Jacuzzi 須另行評估。住宅 balconies 及 utility platforms 則按 Table 3.9（Class 8）另有下限。","x":"Domestic uses 2.0 2.0","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","基礎"]},{"id":"DIL-011","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"以下哪一項用途在 Table 3.2 中 qk = 5.0 kPa？","o":["Classrooms","Restaurants","Public halls, theatres, cinemas","Childcare centers"],"a":2,"e":"Public halls、theatres、cinemas 屬 3B fixed seating 但 qk 5.0 kPa；Restaurants 4.0 kPa；Classrooms 3.0 kPa；Childcare centres 2.5 kPa。改變用途（例如商場改戲院）須重新檢核樓面荷載，屬 alteration and addition works 常見問題。","x":"Public halls, theatres, cinemas 5.0 4.5","doc":"dead-imposed-loads-2011-2021ed","pp":"6","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","中級"]},{"id":"DIL-012","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"避難層（refuge floors）按 Table 3.2 的 qk 是多少 kPa？","a":5.0,"tol":0,"u":"kPa","e":"Refuge floor 歸入 3C（Assembly areas without fixed seating）qk = 5.0 kPa。高樓設計時 refuge floor 常同時是 transfer / outrigger 層，荷載取值要與 Fire Safety Code 的 refuge floor 要求一併考慮。","x":"Assembly areas without fixed 5.0 4.5","doc":"dead-imposed-loads-2011-2021ed","pp":"6","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-013","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"舞台（Stages）的 qk 是多少 kPa？","a":7.5,"tol":0,"u":"kPa","e":"Stages、television studios used as stages：qk 7.5 kPa，Qk 9.0 kN，是 Class 3 中最高值。學校禮堂舞台常被忽略而按 5.0 kPa 設計。","x":"Stages, television studios used as 7.5 9.0 stages","doc":"dead-imposed-loads-2011-2021ed","pp":"7","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-014","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"機房（Plant rooms, boiler rooms, fan rooms, motor rooms）的最低 imposed load 是：","o":["5.0 kPa / 4.5 kN","7.5 kPa / 9.0 kN","10.0 kPa / 9.0 kN","3.0 kPa / 4.5 kN"],"a":1,"e":"Plant rooms 7.5 kPa、Qk 9.0 kN。實際設備如 chiller、transformer 往往更重，應向 BS/MEP 取得設備重量，按 3.1.2「minimum values」原則取較大者，並考慮設備基座（plinth）重量。","x":"Plant rooms, boiler rooms, fan 7.5 9.0","doc":"dead-imposed-loads-2011-2021ed","pp":"8","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","中級"]},{"id":"DIL-015","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"重型工業用途工場（workshops/factories for heavy weight loads）的 qk 是多少 kPa？","a":10.0,"tol":0,"u":"kPa","e":"工業樓面：light 5.0、medium 7.5、heavy 10.0、printing plants 12.5 kPa（Qk 均 9.0 kN）。工業大廈須按 3.11 在每層樓梯張貼 designed distributed imposed load 告示。","x":"(c) for heavy weight loads 10.0 9.0","doc":"dead-imposed-loads-2011-2021ed","pp":"8","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-016","t":"mcq","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.3","p":13,"q":"消防車（Fire engines）可到達的區域屬哪一個 Area Class？","o":["6A","6B","6C","6D"],"a":3,"e":"Table 3.3：6D 為不超過 30,000 kg 的車輛，例子包括 fire engines、refuse collection vehicles。EVA 設計另須按 3.3.3 檢核 230 kN 及 100 kN 集中荷載。","x":"30,000 kg gross weight","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","mcq","中級"]},{"id":"DIL-017","t":"scenario","d":2,"tp":"車輛荷載 Vehicular loads","c":"3.3.3","p":13,"q":"一個平台（podium）上的 Emergency Vehicular Access (EVA)，除 Table 3.5/3.6 的 6D 荷載外，還要檢核哪些集中荷載？","m":"要另外檢核：230 kN 集中荷載均布於 950 mm × 750 mm 面積，以及 100 kN 集中荷載均布於 300 mm × 300 mm 面積。","k":["230 kN over 950 mm × 750 mm","100 kN over 300 mm × 300 mm","屬額外檢核（in addition）"],"e":"3.3.3 是 EVA 板 punching shear 及局部彎矩的控制情況。常見錯誤：只按 6D 均布荷載設計，忘記消防車 outrigger/jack 的局部荷載；亦要同時考慮 soil cover 作荷載擴散。","x":"load of 230 kN uniformly distributed on plan over an area of 950 mm","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","scenario","中級"]},{"id":"DIL-018","t":"num","d":1,"tp":"車輛荷載 Vehicular loads","c":"Table 3.4","p":13,"q":"私家車停車場（Area Class 6A）的 Qk 是多少 kN？","a":20.0,"tol":0,"u":"kN","e":"Table 3.4：6A qk 3.0 kPa、Qk 20.0 kN（施加於 200 mm 方形面積）。雙層泊車（double-deck parking）時 qk 要加倍（3.3.5.3）。","x":"Class qk (kPa) Qk (kN) 6A 3.0 20.0","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","num","基礎"]},{"id":"DIL-019","t":"tf","d":2,"tp":"車輛荷載 Vehicular loads","c":"3.3.5.3","p":13,"q":"6A 停車場如需提供雙層泊車（double-deck parking），qk 應取 Table 3.4 數值的兩倍。","a":true,"e":"對。3.3.5.3 規定 double-deck parking 時 qk 取兩倍（即 6.0 kPa）。機械泊車系統的支承點荷載亦應向供應商索取並檢核。","x":"Where provision for double-deck parking is required for Area Class 6A, the uniformly distributed load, qk, shall be twice the value given in Table 3.4.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","tf","中級"]},{"id":"DIL-020","t":"num","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.5","p":13,"q":"Area Class 6C 的集中荷載 Qk 是多少 kN？","a":60.0,"tol":0,"u":"kN","e":"Table 3.5：6B 30 kN、6C 60 kN、6D 80 kN；qk 則按 Table 3.6 的 loaded length 決定。6C/6D 的 Qk 施加於 300 mm 方形（3.3.6.3）。","x":"6C See Table 3.6 60.0","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","num","中級"]},{"id":"DIL-021","t":"mcq","d":3,"tp":"車輛荷載 Vehicular loads","c":"3.3.7","p":15,"q":"Area Class 6E 如不按 HB loading 設計而採用修改後的 HA loading，knife edge load 應取：","o":["20 kN/m","40 kN/m","100 kN/m","120 kN/m"],"a":1,"e":"3.3.7(b)：knife edge load 取 40 kN/m，垂直於 loaded length；notional lane width 取 3 m；single wheel load 100 kN 另行評估。車輛的 centrifugal、braking 等次要荷載在停車場結構毋須考慮。","x":"the knife edge load shall be taken as 40 kN/m applied in the direction perpendicular to","doc":"dead-imposed-loads-2011-2021ed","pp":"11","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","mcq","進階"]},{"id":"DIL-022","t":"num","d":1,"tp":"天台荷載 Roofs","c":"Table 3.8","p":15,"q":"Class 7A 不可到達天台（inaccessible roof），坡度 ≤ 5° 時 qk 是多少 kPa？","a":0.75,"tol":0,"u":"kPa","e":"Table 3.8：7A 坡度 ≤20° 時 qk 0.75 kPa（Qk 1.5 kN），20°–40° 之間線性內插至 0，≥40° 為 0。注意 inaccessible 指只供維修進出；如有住客可上落，要按 7B/7C 取 ≥2.0 kPa。","x":"Greater than 5º but of","doc":"dead-imposed-loads-2011-2021ed","pp":"11","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","num","基礎"]},{"id":"DIL-023","t":"mcq","d":2,"tp":"天台荷載 Roofs","c":"Table 3.8","p":16,"q":"混凝土簷篷（Concrete canopy, Class 7D）的 qk 是：","o":["0.75 kPa","1.5 kPa","2.0 kPa","3.0 kPa"],"a":2,"e":"Table 3.8：lightweight canopy 0.75 kPa（不包括維修時堆積雜物），concrete canopy 2.0 kPa（已包括維修時堆積的建築物料及雜物）。常見錯誤：混凝土簷篷只用 0.75 kPa。","x":"The value of qk takes into account of additional loads due to accumulations of construction materials and","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","mcq","中級"]},{"id":"DIL-024","t":"num","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":16,"q":"Utility platforms 的 qk 不應少於多少 kPa？","a":4.0,"tol":0,"u":"kPa","e":"Table 3.9：Utility platforms「Same as the floors to which they give access but not less than 4.0」kPa，另加 2.0 kN/m 沿外緣線荷載；Balconies 下限 3.0 kPa。住宅設計常錯用 2.0 kPa。","x":"access but not less along the outer edge","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","num","中級"]},{"id":"DIL-025","t":"num","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":17,"q":"樓梯、平台及走廊（Stairs, landings and corridors）的集中荷載 Qk 是多少 kN？","a":4.5,"tol":0,"u":"kN","e":"Table 3.9：Stairs, landings and corridors qk 與所通往樓面相同，但不少於 3.0 及不多於 5.0 kPa；Qk 4.5 kN。住宅梯級板 Qk 4.5 kN 常控制薄 waist slab。","x":"Stairs, landings and corridors access but not less 4.5","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","num","中級"]},{"id":"DIL-026","t":"scenario","d":2,"tp":"間隔牆 Partitions","c":"3.6.1","p":17,"q":"某寫字樓樓面日後由租戶自行加建輕質間隔（位置未在建築圖則顯示），每米長間隔牆重 2.4 kN/m。按 3.6.1 應取多少 partition allowance？","m":"按 3.6.1：(a) 1/3 × 2.4 = 0.8 kPa；但 (b) 寫字樓用途不少於 1 kPa，故取 1.0 kPa，並作為 imposed load 疊加在 3.0 kPa 之上。","k":["1/3 牆重每米長 = 0.8 kPa","Office 最低 1 kPa → 取 1.0 kPa","屬 imposed load，不可按 3.7 折減（3.7.1(g)）"],"e":"實務上寫字樓樓面通常以 3.0 + 1.0 kPa 設計。Partition load 屬 imposed load（γf 1.6），而且在柱荷載折減時要扣除（3.7.1(g)）。","x":"(b) not less than 1 kPa if the floor is used for office purposes.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","間隔牆 Partitions","scenario","中級"]},{"id":"DIL-027","t":"mcq","d":2,"tp":"荷載折減 Reduction","c":"3.7.1","p":17,"q":"以下哪種荷載可以按 clause 3.7 折減？","o":["寫字樓的 storage and filing 荷載","車輛荷載","一般寫字樓 3.0 kPa 樓面荷載","未定位置的間隔牆荷載"],"a":2,"e":"3.7.1 列明不可折減的荷載：指定的機器、工廠 <7.5 kPa、車輛、office storage/filing、動力、storage、未定位置間隔牆、不確定永久性荷載。一般 office 3.0 kPa 則可折減。","x":"(d) floor loads from storage and filing in offices;","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","mcq","中級"]},{"id":"DIL-028","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.10","p":17,"q":"一條單跨樑承托 135 m² 樓面面積，其總分布 imposed load 可折減多少百分比？","a":15,"tol":0,"u":"%","e":"Table 3.10：<45 m² 0%、45 m² 5%、90 m² 10%、135 m² 15%、180 m² 20%（最多）。中間值可線性內插，但 45 m² 以下不可內插。樑的折減不能帶落柱（3.7.2.2）。","x":"90 10 135 15 180 20 maximum","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","num","中級"]},{"id":"DIL-029","t":"tf","d":2,"tp":"荷載折減 Reduction","c":"3.7.2.2","p":18,"q":"樑按 Table 3.10 折減後的 imposed load 可直接用於設計承托該樑的柱。","a":false,"e":"錯。3.7.2.2：樑的折減只適用於該樑本身；柱要另按 Table 3.11 以樓層數折減。電腦模型中若同時開啟兩種折減要特別留意重複折減。","x":"The reduced imposed loads on beams shall not be applicable to the design of vertical members supporting the beams.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","tf","中級"]},{"id":"DIL-030","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.11","p":18,"q":"一條柱承托 6 層（包括天台）合資格折減的樓面，total distributed imposed load 可折減多少百分比？","a":25,"tol":0,"u":"%","e":"Table 3.11：1 層 0%，每多一層加 5%，8 層 35%，超過 8 層最多 40%。只計算合資格折減的樓層（例如停車場層不計）。","x":"4 15 5 20 6 25 7 30","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","num","中級"]},{"id":"DIL-031","t":"mcq","d":3,"tp":"荷載折減 Reduction","c":"Table 3.12","p":18,"q":"工場樓面（≥7.5 kPa）按 Table 3.12 折減時，每層折減後的 imposed load 最低不可少於：","o":["5.0 kPa","7.5 kPa","10.0 kPa","沒有下限"],"a":1,"e":"Table 3.12 註：折減後每層不可低於 7.5 kPa；超過 3 層最多折減 25%。工業大廈柱設計常用此表。","x":"Note: In no case can the reduced imposed load at each floor be less than 7.5 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","mcq","進階"]},{"id":"DIL-032","t":"num","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"容易擠擁區域（Areas susceptible to overcrowding）的護欄 line load 是多少 kN/m？","a":3.0,"tol":0,"u":"kN/m","e":"Table 3.13：不預期聚集 0.75 kN/m；可聚集但不擠擁 1.5 kN/m；易擠擁 3.0 kN/m。Line load 施加於樓面以上 1.1 m 或護欄頂（取較低者）。玻璃欄河設計（Glass Code）亦引用此表。","x":"Areas susceptible to 3.0 1.5 1.5 overcrowding","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","num","中級"]},{"id":"DIL-033","t":"mcq","d":2,"tp":"護欄荷載 Barriers","c":"3.8.1.3","p":19,"q":"住宅 balconies 的護欄應屬哪一個類別？","o":["Areas where congregation of people is not expected（0.75 kN/m）","Areas where people may congregate but overcrowding is not expected（1.5 kN/m）","Areas susceptible to overcrowding（3.0 kN/m）","毋須設計水平荷載"],"a":1,"e":"3.8.1.3：balconies、utility platforms、edges of roofs、≤3 m 寬行人天橋屬 1.5 kN/m 類別。住宅室內樓梯則屬 0.75 kN/m。","x":"with fixed seating or tables; balconies; utility platforms; edges of roofs; and footbridges or","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","mcq","中級"]},{"id":"DIL-034","t":"num","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"護欄 line load 的施加高度為樓面以上多少 m（或護欄頂，取較低者）？","a":1.1,"tol":0,"u":"m","e":"Table 3.13 Note：1.1 m 或護欄頂邊，取較低者。護欄底座錨栓及 cantilever 板邊的彎矩按此高度計算。","x":"The line load is to be applied at a height of 1.1m above the floor level or the top edge of the protective barrier","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","num","中級"]},{"id":"DIL-035","t":"scenario","d":3,"tp":"車輛防撞欄 Vehicle barriers","c":"3.8.3","p":19,"q":"停車場 6A 剛性（rigid）車輛防撞欄，M = 3,000 kg，v = 3.0 m/s，δc = 100 mm，δb = 0。試計算 horizontal impact force F。","m":"F = 0.5 M v² / (δc + δb) = 0.5 × 3000 × 3.0² / (100 + 0) = 135 kN（單位按 Code 公式，M kg、v m/s、δ mm 得 kN），作用於 bumper height 600 mm，均布於任何 1.5 m 長度。","k":["F = 0.5Mv²/(δc+δb)","F = 135 kN","6A bumper height 600 mm","分布於 1.5 m 長度；斜坡旁 oblique 取一半"],"e":"停車場外牆/欄杆常被車撞，設計時須檢核 F 及連接。斜坡底 >10 m 的直斜坡須乘 γ（Table 3.15）；斜坡旁欄杆因斜撞可取一半（3.8.3.4）。","x":"minimum requirement of horizontal impact force, F (in kN),","r":[{"p":20,"c":"Table 3.14 / 3.16","x":"Class Bumper Height above Floor Level (mm) 6A 600","doc":"dead-imposed-loads-2011-2021ed","pp":"16"}],"doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","scenario","進階"]},{"id":"DIL-036","t":"num","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"Table 3.17","p":21,"q":"公共道路（Public Roads）對斜坡及擋土結構的最低附加荷載（surcharge）是多少 kPa？","a":20,"tol":0,"u":"kPa","e":"Table 3.17：Public roads 20 kPa、Private roads 10 kPa、行人路/單車徑/遊樂場 5 kPa。Geoguide 1 的擋土牆設計亦採用相同數值；淺基礎建築物無紀錄時每層不少於 10 kPa（3.9.2）。","x":"Public Roads 20","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","num","中級"]},{"id":"DIL-037","t":"num","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"3.9.2","p":21,"q":"評估淺基礎鄰近建築物對擋土結構的附加荷載，如無記錄，每層最少取多少 kPa？","a":10,"tol":0,"u":"kPa per storey","e":"3.9.2：有記錄用實際荷載；無記錄按現有用途及結構形式評估，最少每層 10 kPa。深挖工程（ELS）設計檢核鄰近舊樓時常用。","x":"structural forms with a minimum value of 10 kPa per storey.","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","num","中級"]},{"id":"DIL-038","t":"scenario","d":3,"tp":"動力荷載 Dynamic","c":"3.10.2","p":21,"q":"一幢 20 層工廠大廈，沒有機器資料。按 3.10.2 應如何考慮額外動力荷載？","m":"(a) 設計樓板及樑時加 2.5 kPa 豎向均布荷載；(b) 設計框架及基礎時，另加相等於 (a) 豎向荷載 10% 的水平力，同時作用於 N 層（N ≥ 0.2 × 受動力影響總層數 = 4 層），可假設不與風荷載同時作用。","k":["樓板/樑：額外 2.5 kPa","框架/基礎：10% 水平力","N ≥ 0.2 × 層數 = 4","不需與 wind load 同時作用"],"e":"3.10.2 適用於工業樓宇未有機器資料的情況。常見遺漏：只加 2.5 kPa 而忘記框架的水平力；此動力荷載亦不可折減（3.7.1(e)）。","x":"additional horizontal force (which may be assumed not to act together with the wind","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","動力荷載 Dynamic","scenario","進階"]},{"id":"DIL-039","t":"num","d":2,"tp":"荷載告示 Notice","c":"3.11.3","p":22,"q":"工業大廈樓面荷載告示以 kg/m² 表示時，1 kPa 應換算為多少 kg/m²？","a":102,"tol":0,"u":"kg/m²","e":"3.11.3：1 kPa = 102 kg/m²（不包括動力效應）。告示須中英文、字高 ≥15 mm，放於每層樓梯或適當位置。驗樓（Occupation Permit）時 BD 會查。","x":"1 kPa to 102 kilograms per square metre","doc":"dead-imposed-loads-2011-2021ed","pp":"18","tags":["dead-imposed-loads-2011-2021ed","荷載告示 Notice","num","中級"]},{"id":"DIL-040","t":"mcq","d":2,"tp":"表現為本 Performance based","c":"4.2.1","p":23,"q":"以 performance based approach 從量度數據推算 design imposed load 時，設計荷載在使用年期內被超越的機率不應多於：","o":["1%","5%","10%","50%"],"a":1,"e":"4.2.1(a)：probability-based analysis 下被超越機率不多於 5%，須獲 Building Authority 接納。適用於 Code 未列明的特殊用途（如數據中心）。","x":"imposed load not more than 5 percent probability of the design imposed load being","doc":"dead-imposed-loads-2011-2021ed","pp":"19","tags":["dead-imposed-loads-2011-2021ed","表現為本 Performance based","mcq","中級"]},{"id":"DIL-041","t":"num","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：鋼筋混凝土（Reinforced concrete）密度是多少 kN/m³？","a":24.5,"tol":0,"u":"kN/m³","e":"Appendix A：Plain 23.6、Reinforced 24.5、Prestressed 24.5 kN/m³。香港計算書普遍取 24.5 kN/m³；鋼 77.0、玻璃 26、泥土 20 kN/m³。","x":"Reinforced 24.5","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","num","基礎"]},{"id":"DIL-042","t":"num","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：玻璃（Glass）的密度是多少 kN/m³？","a":26,"tol":0,"u":"kN/m³","e":"Glass 26 kN/m³，幕牆及玻璃天幕 dead load 計算要用；Glass Code 設計時自重亦影響斜置玻璃的荷載組合。","x":"Other materials Glass 26","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","num","基礎"]},{"id":"FIR-001","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"C4.1 / Table C1","p":87,"q":"Table C1：Use Classification 1 Residential 的 FRR 及 compartment 面積限制？","o":["60 min；不限","120 min；2,500 m²","60 min；10,500 m²","90 min；不限"],"a":0,"e":"住宅及酒店 60 分鐘、compartment 不限，但每個單位之間要以 fire barrier 分隔。結構工程師要確保所有 element of construction（柱、樑、樓板）達到 FRR 60 的保護層和尺寸。","x":"1. Residential Not limited 60","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","基礎"]},{"id":"FIR-002","t":"num","d":1,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Carparks 的 FRR（分鐘）？","a":60,"tol":0,"u":"min","e":"停車場 60 分鐘、compartment ≤10,500 m²。注意停車場若在地庫則要按 C14 用 240 分鐘。","x":"7. Carparks Not exceeding 10,500m2 60","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","基礎"]},{"id":"FIR-003","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Mercantile facilities（4b）compartment 面積超過 2,500 m² 但不超過 10,500 m² 時的 FRR？","o":["60 min","90 min","120 min","240 min"],"a":2,"e":"商場類 ≤2,500 m² 為 60 分鐘，超過則 120 分鐘。平台商場設計時 compartment 劃分直接影響結構保護層及樓板厚度。","x":"Exceeding 2,500m2 but not 120","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","中級"]},{"id":"FIR-004","t":"num","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Industrial workplaces（6a）的 FRR（分鐘）？","a":120,"tol":0,"u":"min","e":"工業類全部 120 分鐘。舊工廈活化改建時要核實原有結構是否達標。","x":"6a. Industrial workplaces Not exceeding 10,500m2 120","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","中級"]},{"id":"FIR-005","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C1 Note 1","p":88,"q":"Fire compartment 面積超過 Table C1 所列時，一律不獲批准。","a":false,"e":"超過會按個別情況考慮，需要加強逃生、消防進出、消防裝置及耐火結構以達到同等安全水平，通常需要 fire engineering 方案。","x":"A fire compartment area/volume in excess of that given above will be dealt with on","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-006","t":"scenario","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"客戶想在地盤內建一座單層鋼結構貨倉，體積 6,500 m³、高 7 m，想不做鋼結構防火。按 FS Code 可否？條件是什麼？","m":"可以。C4.3：單層建築體積不超過 7,000 m³、高度不超過 7.5 m，並與鄰近建築或地界保持不少於 6 m 淨空，鋼結構可不作保護。","k":["single-storey","≤7,000 m³","≤7.5 m height","≥6 m clear open space to adjoining building/boundary"],"e":"三個條件缺一不可。常見陷阱是日後加建閣樓變成多層或加高，就會失去豁免。","x":"Where a single-storey building does not exceed 7,000m³ in volume and 7.5m in height, any","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","scenario","中級"]},{"id":"FIR-007","t":"num","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"C4.3 無保護鋼結構的單層建築須與鄰近建築或地界保持不少於多少 m 淨空？","a":6,"tol":0,"u":"m","e":"6 m 淨空是防止火勢蔓延到鄰近建築的條件。","x":"adjoining building or the site boundary by a clear unobstructed open space not less than 6m","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","中級"]},{"id":"FIR-008","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Structural frame、beam 或 column 須滿足哪些 FRR 準則？","o":["只需 Stability","Stability + Integrity","Stability + Integrity + Insulation","只需 Integrity"],"a":0,"e":"結構框架只需穩定性（exposed faces only）；樓板三項都要（每邊分別）。所以 FRR 60 的樓板要考慮隔熱（厚度），而樑柱則是保護層及尺寸。","x":"1 Structural frame, Y N N Exposed faces only","doc":"fire-safety-2011-2024ed","pp":"80","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","中級"]},{"id":"FIR-009","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Floor（包括 fire compartment floor）須滿足 stability、integrity 及 insulation，並每邊分別測試。","a":true,"e":"樓板作為 compartment floor，三項都要，故 Table E4 同時規定厚度及保護層。","x":"2 Floor including fire Y Y Y Each side separately","doc":"fire-safety-2011-2024ed","pp":"80","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-010","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2 Note 3","p":90,"q":"按 FS Code，curtain wall glazing 一般不需要 FRR（受 C5 及 C9.7 規限）。","a":true,"e":"幕牆玻璃本身不需 FRR，但樓層之間要有 spandrel 或水平突出（C11）及防火封堵。","x":"3. Subject to Subsection C5 and Clause C9.7, curtain wall glazing does not require to","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-011","t":"num","d":3,"tp":"耐火等級 FRR","c":"Table C2 Note 5","p":90,"q":"Smoke outlet shaft 截面面積收窄至原來的百分之幾或以下，即視為 stability 失效？","a":75,"tol":0,"u":"%","e":"排煙井的 stability 準則以截面保持為定義，與一般結構構件不同。","x":"5. Any restriction of the cross-section area of the smoke outlet shaft to 75% or less of its","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","進階"]},{"id":"FIR-012","t":"num","d":2,"tp":"防火分隔 Separation","c":"C5.2","p":90,"q":"同一地盤內兩座建築相距少於多少 m 時被視為 adjoining buildings？","a":1.8,"tol":0,"u":"m","e":"相鄰建築之間的外牆要按夾角（>135° 或 ≤135°）設置無開口的耐火外牆。","x":"apart. Fire barriers should be provided in compliance with the following requirements:","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","防火分隔 Separation","num","中級"]},{"id":"FIR-013","t":"mcq","d":2,"tp":"外部火勢蔓延 External fire spread","c":"C11.1","p":99,"q":"C11.1：上下層外牆之間的分隔可採用？","o":["900 mm spandrel 或 500 mm 水平突出","600 mm spandrel 或 300 mm 水平突出","1200 mm spandrel","無要求"],"a":0,"e":"FRR 不少於該層；單一家庭住宅或有 sprinkler 的建築不適用。結構上 spandrel 樑/牆的高度要配合建築立面設計。","x":"(a) a spandrel that is a vertical element of 900mm, with an FRR of not less than that of","doc":"fire-safety-2011-2024ed","pp":"90","tags":["fire-safety-2011-2024ed","外部火勢蔓延 External fire spread","  / 150 kPa","1000 / 500 kPa","400 / 200 kPa"],"a":0,"e":"1(c)+ 700/350、1(d)/2 300/150 kPa；灌漿或混凝土須 ≥30 MPa。風荷載屬 transient tension 可用較高值。","x":"1(c) or better 700 350","doc":"foundations-2017-2024ed","pp":"13","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","中級"]},{"id":"FDN-013","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"2.2.4","p":22,"q":"Bearing capacity equation：粒狀土的 ultimate bearing capacity qu 上限為多少 kPa？","a":3000,"tol":0,"u":"kPa","e":"公式計出的 qu 不可超過 3 000 kPa，再以 FOS ≥3 求 qa。","x":"ultimate bearing capacity of the granular soil, which should be limited","doc":"foundations-2017-2024ed","pp":"14","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-014","t":"tf","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (1)","p":23,"q":"推導 q 時，最大有效覆土深度不應大於 3 m 或 Bf，取較小者。","a":true,"e":"且不可包括設計年期內可能被移除的覆土，亦要扣除預留的地下管線空隙。","x":"greater than 3 m or Bf, whichever is the lesser, and suitable adjustments should","doc":"foundations-2017-2024ed","pp":"15","tags":["foundations-2017-2024ed","承載力 Bearing capacity","tf","進階"]},{"id":"FDN-015","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (4)","p":23,"q":"淺基礎位於斜坡頂附近時，ultimate bearing capacity 可在坡邊的值與距坡頂多遠處的值之間線性內插？","o":["2 倍基礎寬度","4 倍基礎寬度","6 倍基礎寬度","10 m"],"a":1,"e":"距坡頂 4Bf 以外可視作平地。另須檢查基礎工程對斜坡整體穩定的影響。","x":"foundation resting at the edge of the slope and that at a distance of four times","doc":"foundations-2017-2024ed","pp":"15","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","進階"]},{"id":"FDN-016","t":"num","d":2,"tp":"沉降 Settlement","c":"2.3.1(4)","p":30,"q":"設計承載壓力 ≤250 kPa 的淺基礎，無更準確資料時，粒狀土 Es（MPa）可取 SPT N 值的幾倍？","a":1,"tol":0,"u":"倍","e":"Es = 1×N（MPa）。若採用大於 1×N 的 Es，按 4.2.2(2)(c) 需做 plate load test。","x":"as one time the SPT N-value.","doc":"foundations-2017-2024ed","pp":"22","tags":["foundations-2017-2024ed","沉降 Settlement","num","中級"]},{"id":"FDN-017","t":"num","d":3,"tp":"沉降 Settlement","c":"2.3.1(3)","p":30,"q":"可假設 secondary consolidation 在 primary consolidation 達百分之幾時開始？","a":95,"tol":0,"u":"%","e":"95% 亦是 2.4.4 判斷填海地固結已大致完成的準則。","x":"when 95% of the primary consolidation is reached.","doc":"foundations-2017-2024ed","pp":"22","tags":["foundations-2017-2024ed","沉降 Settlement","num","進階"]},{"id":"FDN-018","t":"short","d":2,"tp":"沉降 Settlement","c":"2.3.2(2)","p":31,"q":"列出 CoP Foundations 對不特別敏感建築的三項沉降/轉角參考準則，以及評估時可採用的荷載折減。","m":"(a) 最大總沉降 ≤30 mm；(b) 柱/豎向構件間差異沉降 ≤1:500；(c) 風或其他短暫荷載引起的最大角轉 ≤1:500。以工作荷載評估；(a)(b) 的恆載可減至 50%，活載按 Dead and Imposed Loads Code 折減。直接坐落 1(a)–2 類岩石或打入 N ≥200 地層可視為滿足 (a)。","k":["30 mm total","1:500 differential","1:500 rotation (wind/transient)","working loads; DL 50% for (a)(b)","rock or N ≥200 deemed to satisfy (a)"],"e":"這些是 reference criteria，不是硬性限制；敏感結構（例如 transfer plate 上的結構、精密設備）要訂定個案準則。","x":"(a) The maximum total settlement should not exceed 30 mm;","doc":"foundations-2017-2024ed","pp":"23","tags":["foundations-2017-2024ed","沉降 Settlement","short","中級"]},{"id":"FDN-019","t":"num","d":2,"tp":"沉降 Settlement","c":"2.3.2(2)","p":31,"q":"評估總沉降及差異沉降準則時，dead load 可減至百分之幾？","a":50,"tol":0,"u":"%","e":"這是規範明文容許的；imposed load 則按 Dead and Imposed Loads Code 的折減。","x":"the dead loads may be reduced to 50%, and the imposed loads may be","doc":"foundations-2017-2024ed","pp":"23","tags":["foundations-2017-2024ed","沉降 Settlement","num","中級"]},{"id":"FDN-020","t":"tf","d":2,"tp":"填海地 Reclaimed land","c":"2.4.1(a)","p":32,"q":"除非另有建議，填海地上建築物的最低層樓板不應設計為 on-grade slab。","a":true,"e":"填海地長期固結沉降顯著，最低層樓板一般設計為懸空（suspended）。例外：筏式樁帽上的樓板、停車場/行人路等可修復的樓板。","x":"(a) Unless recommended otherwise, the lowest floor slabs of a building should not","doc":"foundations-2017-2024ed","pp":"24","tags":["foundations-2017-2024ed","填海地 Reclaimed land","tf","中級"]},{"id":"FDN-021","t":"mcq","d":3,"tp":"填海地 Reclaimed land","c":"2.4.4","p":33,"q":"無詳細固結評估時，海泥厚度 5 m < H ≤ 10 m（無砂夾層）達到 95% 固結所需年數？","o":["10 年","20 年","30 年","50 年"],"a":1,"e":"H ≤5 m 10 年、5–10 m 20 年、10–15 m 30 年。若會有場地平整或高壓淺基礎，此表不適用。","x":"5m < H ≤ 10m 20","doc":"foundations-2017-2024ed","pp":"25","tags":["foundations-2017-2024ed","填海地 Reclaimed land","mcq","進階"]},{"id":"FDN-022","t":"tf","d":2,"tp":"設計荷載 Design loads","c":"2.5.2","p":34,"q":"CoP Foundations 規定 imposed load 應包括 buoyancy force 及 earth pressure。","a":true,"e":"基礎設計中浮力和土壓力屬 imposed load。若以假設荷載設計基礎，上蓋開工前須證明實際荷載不超過假設值。","x":"imposed load should include buoyancy force and earth pressure. Buoyancy force","doc":"foundations-2017-2024ed","pp":"26","tags":["foundations-2017-2024ed","設計荷載 Design loads","tf","中級"]},{"id":"FDN-023","t":"short","d":2,"tp":"地下水 Groundwater","c":"2.5.3","p":35,"q":"說明 highest anticipated 與 highest possible groundwater level 的分別，以及無可靠資料時 highest possible level 一般取什麼？","m":"Highest anticipated：由可靠數據推算，考慮潮汐、風暴潮、降雨、海平面上升等，量度期至少涵蓋一個雨季。Highest possible：在所有極端情況（暴雨、水浸、水管爆裂）下地下水不會超過的水位；無可靠資料且非低窪地區時一般取地面；填海等低窪區可能高於地面。","k":["anticipated = reliable data, ≥ one wet season","possible = extreme events","generally ground surface","low-lying areas may exceed ground surface"],"e":"兩者配合不同的抗浮安全系數（1.5 vs 1.1 on groundwater）。地庫抗浮設計最常出事的位置是選錯水位或漏計臨時工況。","x":"to prove otherwise and except for low lying areas, the highest possible","doc":"foundations-2017-2024ed","pp":"27","tags":["foundations-2017-2024ed","地下水 Groundwater","short","中級"]},{"id":"FDN-024","t":"mcq","d":2,"tp":"穩定 Stability","c":"2.5.4(2)","p":35,"q":"以 highest anticipated groundwater table 設計時，抗傾覆力矩須至少為風荷載傾覆力矩的幾倍，以及風/地下水以外荷載傾覆力矩的幾倍？","o":["1.5 倍；2 倍","1.5 倍；1.5 倍","2 倍；3 倍","1.1 倍；1.5 倍"],"a":0,"e":"抗滑移、抗上浮 1.5；抗傾覆：風 1.5、地下水 1.5、其他荷載 2.0。常被忽略的是「其他荷載」的 2 倍（例如土壓力引起的傾覆）。","x":"least 1.5 times the overturning moment due to wind loads, 1.5 times the","doc":"foundations-2017-2024ed","pp":"27","tags":["foundations-2017-2024ed","穩定 Stability","mcq","中級"]},{"id":"FDN-025","t":"num","d":2,"tp":"穩定 Stability","c":"2.5.4(3)","p":36,"q":"以 highest possible groundwater table 設計時，地下水引起的 uplift 力的系數是？","a":1.1,"tol":0,"u":"","e":"最高可能水位已屬極端，故地下水只乘 1.1，其他荷載仍乘 1.5。地庫抗浮兩種水位都要檢查，取較不利。","x":"the sum of 1.1 times the uplift force due to groundwater and 1.5 times","doc":"foundations-2017-2024ed","pp":"28","tags":["foundations-2017-2024ed","穩定 Stability","num","中級"]},{"id":"FDN-026","t":"tf","d":2,"tp":"穩定 Stability","c":"2.5.4(4)","p":36,"q":"計算抗上浮的 minimum dead load 時，可移除的飾面及回填亦可計入。","a":false,"e":"Minimum dead load 只計結構構件及永久飾面/回填；可移除的飾面及回填須忽略，並用保守的厚度及密度。","x":"Finishes and backfill that could be removed should be ignored in the calculations.","doc":"foundations-2017-2024ed","pp":"28","tags":["foundations-2017-2024ed","穩定 Stability","tf","中級"]},{"id":"FDN-027","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(1)","p":37,"q":"採用 permissible stress method 時，純因風荷載引起的工作應力可提高不多於百分之幾？","a":25,"tol":0,"u":"%","e":"這是傳統容許應力法的 25% 風荷載提升，常見於樁承載力的 with-wind 情況。","x":"25% where such increase is solely due to wind loads.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-028","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"現場澆注混凝土基礎在可能遇到地下水或水下澆注時，混凝土強度應折減百分之幾？","a":20,"tol":0,"u":"%","e":"鑽孔樁、barrette 以 tremie 澆注時，設計強度要折減 20%。海事基礎水下澆注則假設為 C25。","x":"by 20% where groundwater is likely to be encountered during concreting or","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-029","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"打入式預製混凝土樁在工作荷載下的軸向壓應力不應超過？","o":["0.2fcu","0.25fcu","0.33fcu","0.45fcu"],"a":0,"e":"0.2fcu 限值考慮打樁應力及耐久性。","x":"loads should not exceed 0.2fcu.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","mcq","中級"]},{"id":"FDN-030","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"打入式鋼承重樁（打樁阻力 FOS 2）在工作荷載下軸向應力不應超過屈服應力的百分之幾？","a":30,"tol":0,"u":"%","e":"打入樁 30% fy；預鑽孔或壓入（無衝擊峰值應力）可提高至 50% fy。例如 S460 H-pile 工作應力約 138 MPa。","x":"of 2, the axial stress in the steel at working load should not exceed 30% of the","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-031","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"預鑽孔安裝或壓入的鋼樁，工作荷載下軸向應力可提高至屈服應力的百分之幾？","a":50,"tol":0,"u":"%","e":"因無打樁衝擊峰值應力，可用 50% fy，例如 socketed H-pile。","x":"steel at working loads may be increased to 50% of the yield stress.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-032","t":"mcq","d":3,"tp":"材料 Materials","c":"2.5.5(4)","p":38,"q":"鋼與灌漿（≥30 MPa）之間的 allowable bond stress（一般 / 水下灌漿）？","o":["400 / 320 kPa","600 / 480 kPa","700 / 350 kPa","800 / 640 kPa"],"a":0,"e":"400/320 kPa，加 shear studs 最多提高至 600/480 kPa。計算面積用鋼構件全外表面積。","x":"minimum characteristic strength of 30 MPa) may be taken as 400 kPa (or 320","doc":"foundations-2017-2024ed","pp":"30","tags":["foundations-2017-2024ed","材料 Materials","mcq","進階"]},{"id":"FDN-033","t":"num","d":2,"tp":"耐久性 Durability","c":"2.6.2","p":39,"q":"為避免 alkali-aggregate reaction，混凝土中 reactive alkali（以 Na2O 當量計）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"3.0 kg/m³ 限值是香港 AAR 控制的標準要求，混凝土供應商須提供計算。","x":"of concrete should not exceed 3.0 kg.","doc":"foundations-2017-2024ed","pp":"31","tags":["foundations-2017-2024ed","耐久性 Durability","num","中級"]},{"id":"FDN-034","t":"mcq","d":2,"tp":"耐久性 Durability","c":"2.6.4(1)","p":39,"q":"海事基礎混凝土的一般指引：最低等級、最大水灰比、保護層？","o":["C45、0.38、75 mm","C40、0.45、50 mm","C35、0.50、60 mm","C45、0.40、50 mm"],"a":0,"e":"另加 condensed silica fume 5–10%、膠凝材料 380–450 kg/m³；潮汐及浪濺區裂縫 ≤0.1 mm。","x":"inferior to grade C45 and the water/cement ratio should not exceed 0.38.","doc":"foundations-2017-2024ed","pp":"31","tags":["foundations-2017-2024ed","耐久性 Durability","mcq","中級"]},{"id":"FDN-035","t":"num","d":3,"tp":"耐久性 Durability","c":"2.6.4(2)","p":40,"q":"海床以下若無防腐措施，鋼材外表面合理的腐蝕損失允許值是每年多少 mm？","a":0.05,"tol":0,"u":"mm/年","e":"50 年設計年期即約 2.5 mm，須從截面扣減後再核算承載力。","x":"seabed level, an allowance for corrosion loss of 0.05 mm per year on the","doc":"foundations-2017-2024ed","pp":"32","tags":["foundations-2017-2024ed","耐久性 Durability","num","進階"]},{"id":"FDN-036","t":"num","d":2,"tp":"地盤勘探 Site investigation","c":"3.4.6(a)","p":53,"q":"遇到基岩時，應以鑽芯證明至最少多深（m），以免將孤石誤認為基岩？","a":5,"tol":0,"u":"m","e":"香港風化花崗岩常有 corestone，5 m 鑽芯是最低要求；表 2.1 的 TCR 亦要 5 m。","x":"Where bedrock is encountered, it should be proved by coring to a minimum","doc":"foundations-2017-2024ed","pp":"45","tags":["foundations-2017-2024ed","地盤勘探 Site investigation","num","中級"]},{"id":"FDN-037","t":"short","d":3,"tp":"淺基礎 Shallow foundations","c":"4.2.2(2)","p":57,"q":"何時需要為淺基礎做 plate load test？數量如何決定？","m":"(a) 按 Table 2.1 presumed value 的 qa 超過 300 kPa（除非淨增壓 qa−qo <50 kPa，category 3 除外）；(b) qa 由 bearing capacity equation 或其他方法決定（小型/臨時構築物除外）；(c) 採用的 Es 大於 1×SPT N。數量：每種土層首兩個 500 m² 各一個，其後每 1 000 m² 一個，不足一個作一個計。","k":["qa > 300 kPa (presumed)","bearing capacity equation","Es > 1×N","1 per first two 500 m², then 1 per 1000 m²","fraction = 1 test"],"e":"BD 審批時常要求在圖則註明 plate load test 數量及位置；忘記 bearing capacity equation 亦觸發測試是常見錯誤。","x":"should not be less than one per soil type for each of the first two 500 m2 and","doc":"foundations-2017-2024ed","pp":"49","tags":["foundations-2017-2024ed","淺基礎 Shallow foundations","short","進階"]},{"id":"FDN-038","t":"num","d":2,"tp":"樁基 Piles","c":"5.1.2","p":59,"q":"5 支或以上豎向受荷摩擦樁的群樁，一般可接受的 group reduction factor？","a":0.85,"tol":0,"u":"","e":"端承樁、嵌岩樁、打至基岩或 N ≥200 地層的樁，以及中心距大於 3 倍周長的樁，一般毋須折減。NSF 亦可用同一折減系數。","x":"generally acceptable for a group of 5 or more vertically loaded piles. Other values of","doc":"foundations-2017-2024ed","pp":"51","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-039","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"打入樁及主要靠摩擦的樁，最小樁距為？","o":["樁周長或 1 m，取較大","2 倍直徑或 750 mm，取較大","樁周長或 500 mm，取較大","3 倍直徑"],"a":0,"e":"距地界不少於半周長或 500 mm（取大）。H-pile 周長取 2(b+d)。嵌岩 mini-pile/socketed H-pile 為 750 mm 或 2 倍套管外徑。","x":"resistance, the minimum pile spacing shall be not less than the length of the perimeter","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-040","t":"num","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"端承鑽孔樁之間（或擴底邊緣）建議的最小淨水平距離（mm）？","a":500,"tol":0,"u":"mm","e":"考慮施工位置及垂直度偏差。樁位偏差 ±75 mm、垂直度 1:75，長樁底部可偏移相當多，要留意。","x":"recommended to provide a nominal minimum clear horizontal spacing of 500 mm","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-041","t":"scenario","d":3,"tp":"樁基 Piles","c":"5.1.6","p":60,"q":"地庫抗浮以抗拔樁設計。寫出 CoP Foundations 5.1.6 每支樁需滿足的兩條條件，並解釋各符號。","m":"(a) Dmin + 0.9Ru − 2.0Ia − 1.5Ua（或 1.1Up）− 1.5Wk ≥ 0；(b) Dmin + Ra − Ia − Ua − Wk ≥ 0。Dmin 最小恆載；Ru/Ra 樁的極限/容許錨固抗力；Ia 不利活載及土荷載；Ua/Up 最高預計/最高可能地下水位的浮力；Wk 不利風荷載。","k":["Dmin + 0.9Ru − 2.0Ia − 1.5Ua (or 1.1Up) − 1.5Wk ≥ 0","Dmin + Ra − Ia − Ua − Wk ≥ 0","Ru limited by soil cone/column weight","minimum dead load excludes removable finishes"],"e":"極限條件 (a) 的 0.9Ru 與容許條件 (b) 同時要滿足。Ru 亦受土柱/岩錐有效重量限制（5.3.3）。常見錯誤：Dmin 計入可移除回填；忘記檢查 1.1Up 情況。","x":"(a) Dmin + 0.9Ru - 2.0Ia - 1.5Ua(or 1.1Up) - 1.5Wk ≥ 0; and","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","scenario","進階"]},{"id":"FDN-042","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.1.7","p":61,"q":"主要靠樁身摩擦承托的群樁，用 equivalent raft method 計沉降時，等效筏的深度取？","o":["軟土層以下樁長的 2/3 深度","樁尖","樁帽底","樁長的 1/2"],"a":0,"e":"端承或嵌岩群樁則取樁尖水平。計算沉降要包括 NSF。","x":"depth equal to two thirds of the pile depth measured below any soft soil layer. For","doc":"foundations-2017-2024ed","pp":"53","tags":["foundations-2017-2024ed","樁基 Piles","mcq","進階"]},{"id":"FDN-043","t":"num","d":2,"tp":"負摩擦 NSF","c":"5.2.2","p":62,"q":"無更準確評估時，估算 NSF 的 shaft resistance coefficient β 經驗值？","a":0.25,"tol":0,"u":"","e":"NSF = ∫βσ'p dl。填海地及軟黏土場地必須計 NSF；Conventional Approach 將 NSF 視為 imposed load 加在樁上。","x":"absence of more accurate assessment, an empirical value of β = 0.25 may be assumed.","doc":"foundations-2017-2024ed","pp":"54","tags":["foundations-2017-2024ed","負摩擦 NSF","num","中級"]},{"id":"FDN-044","t":"scenario","d":3,"tp":"負摩擦 NSF","c":"5.2.3","p":63,"q":"填海地上的樁採用 NSF 的 Alternative Approach。列出三項設計準則及靜載試驗荷載要求。","m":"(a) 地基承載力（不含 NSF）：Pc ≥ Gk+Qk；Pcw ≥ Gk+Qk+Wk。(b) 結構強度（含 NSF）：Ps ≥ Gk+Qk+NSF；Psw ≥ Gk+Qk+Wk+NSF。(c) 含 NSF 總荷載下沉降表現須令人滿意。靜載試驗荷載不少於 2Pc + NSF。","k":["ground capacity excludes NSF","structural capacity includes NSF","settlement with NSF satisfactory","test load ≥ 2Pc + NSF"],"e":"Alternative Approach 較經濟，但試驗荷載要加 NSF，對試樁反力系統要求更高；計劃時要預早確認。","x":"for any static load testing of the piles should not be less than 2Pc + NSF.","doc":"foundations-2017-2024ed","pp":"55","tags":["foundations-2017-2024ed","負摩擦 NSF","scenario","進階"]},{"id":"FDN-045","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"一般打入樁（非 H-pile）設計 final set 的範圍？","o":["25–50 mm / 10 blows","10–25 mm / 10 blows","25–100 mm / 10 blows","50–100 mm / 10 blows"],"a":0,"e":"一般打入樁 25–50 mm/10 擊；H-pile 25–100 mm（50–100 之間取 50）；打至基岩取 10 mm/10 擊。落錘效率不大於 0.7。","x":"(a) the design final set should not be less than 25 mm per 10 blows;","doc":"foundations-2017-2024ed","pp":"56","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-046","t":"num","d":3,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"H-pile final set 計算中，(cp+cq)/L 大於多少時該計算值應作廢？","a":1.15,"tol":0,"u":"","e":"cp、cq 以 mm、L 以 m 計。比值過大表示打樁回彈異常，Hiley 公式結果不可靠。","x":"(cp+cq)/L is greater than 1.15, where cp and cq are in mm and L in m;","doc":"foundations-2017-2024ed","pp":"56","tags":["foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-047","t":"num","d":2,"tp":"樁基 Piles","c":"5.3.4","p":72,"q":"樁的側向位移超過多少 mm 時必須考慮 P-Δ effect？","a":25,"tol":0,"u":"mm","e":"側向受力樁除土抗力及結構強度外，大變形時要計二階效應。","x":"(c) where pile deflection exceeds 25mm, P-∆ effect has to be addressed.","doc":"foundations-2017-2024ed","pp":"64","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-048","t":"mcq","d":3,"tp":"樁基 Piles","c":"Table 5.2","p":72,"q":"Table 5.2：樁距/樁徑 = 3 時，群樁 nh 的折減系數？","o":["0.25","0.40","0.70 ering grades","c":"Checklist (Table 4 summary)","p":173,"q":"「Original rock texture preserved；可用手指壓碎成顆粒；slakes in water」描述哪個 decomposition grade？","o":["Grade V completely decomposed","Grade IV highly decomposed","Grade VI residual soil","Grade III moderately decomposed"],"a":0,"e":"Grade V（CDG/CDV）保留原岩紋理但已可捏碎、會 slake；Grade IV 不會 slake、需用手掰成小塊。香港 foundation 及 slope 工程中 CDG 是最常見的地層，須清楚分辨 V 與 VI。","x":"Original rock texture preserved; can be crumbled by hand and","doc":"geoguide3-rock-soil-descriptions","pp":"","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","基礎"]},{"id":"GG3-006","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":17,"q":"Geoguide 3 用 slake test 分辨 completely decomposed 與 highly decomposed rock。","a":true,"e":"正確。Slake test 需要水和小容器；飽和土樣（地下水位以下取樣）較難應用。","x":"which is used to distinguish between completely and highly decomposed rock","doc":"geoguide3-rock-soil-descriptions","pp":"16","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","tf","中級"]},{"id":"GG3-007","t":"mcq","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":19,"q":"Grade V completely decomposed rock 應如何作完整描述？","o":["以岩石術語描述，需要時補充重塑狀態的土壤術語","只用土壤術語","只寫 grade 符號","以 residual soil 術語描述"],"a":0,"e":"Grade V 保留原岩紋理，故以 rock terms 描述，括號內補充重塑土名及密實度；Grade VI 已失去原岩紋理，只能用 soil terms。","x":"Since grade V materials retain the","doc":"geoguide3-rock-soil-descriptions","pp":"18","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","中級"]},{"id":"GG3-008","t":"short","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(1)","p":16,"q":"為何香港岩石的材料風化分級慣用「decomposed」而非「weathered」？","m":"因為香港岩石的風化以化學分解（chemical decomposition）為主，故材料風化等級傳統上用 'decomposed'；'weathered' 則用於岩體（rock mass）風化分區（Section 2.4.4）。","k":["decomposition dominant in HK","material grade → decomposed","rock mass zone → weathered (Table 10)"],"e":"寫鑽孔記錄或地質報告時混用兩者是常見錯誤；材料用 grade I–VI，岩體用 PW zones。","x":"Decomposition is the dominant aspect of weathering in","doc":"geoguide3-rock-soil-descriptions","pp":"15","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","short","中級"]},{"id":"GG3-009","t":"mcq","d":1,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":29,"q":"RQD 的定義是？","o":["每段長度 > 100 mm 的 solid core 總長佔 core run 的百分比","所有回收岩芯佔 core run 的百分比","solid core 佔 core run 的百分比","每米裂隙數目"],"a":0,"e":"TCR = 全部回收；SCR = solid core；RQD = > 100 mm solid core 片；FI = 每米裂隙數。只計 natural fractures，鑽探造成的 artificial fractures 要剔除；有疑問時視為 natural。","x":"solid core pieces, each greater than 100 mm between natural","doc":"geoguide3-rock-soil-descriptions","pp":"28","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","mcq","基礎"]},{"id":"GG3-010","t":"tf","d":2,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":28,"q":"評估 fracture state 時，鑽探造成的人工裂隙應計入。","a":false,"e":"錯誤，只計天然地質裂隙；粗糙、帶新鮮解理面的斷口通常是人工裂隙。有疑問時習慣上當作 natural。","x":"Only natural geological fractures should be taken into account for the description of","doc":"geoguide3-rock-soil-descriptions","pp":"27","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","tf","中級"]},{"id":"GG3-011","t":"short","d":2,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":28,"q":"解釋 'solid core' 的定義，並說明 TCR 與 SCR 的分別。","m":"Solid core：沿岩芯軸向兩天然裂隙之間至少有一個完整直徑（不一定完整圓周）的岩芯。TCR 為所有回收岩芯（solid、無完整直徑的 intact 或 non-intact）佔 core run 的百分比；SCR 只計 solid core。","k":["at least one full diameter","not necessarily full circumference","TCR includes non-intact","SCR solid only"],"e":"Foundations Code 的岩石 bearing/socket 分類及 PNAP 要求都依賴 TCR/RQD 記錄；工程師審閱 borehole log 時要知道這些指標的定義。","x":"regarded as core with at least one full diameter (but not necessarily a full circumference)","doc":"geoguide3-rock-soil-descriptions","pp":"27","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","short","中級"]},{"id":"GG3-012","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：SPT N = 10–30 的砂/礫石 compactness 描述為？","o":["Medium dense","Loose","Dense","Very dense"],"a":0,"e":"SPT N 與密實度對應：0–4 very loose、4–10 loose、10–30 medium dense、30–50 dense、> 50 very dense。設計時用 N 值推 φ' 或樁側摩阻前，先確認描述一致。","x":"Medium dense 10 - 30","doc":"geoguide3-rock-soil-descriptions","pp":"79","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","mcq","中級"]},{"id":"GG3-013","t":"num","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：'Firm' 粉土/黏土的 undrained shear strength 下限？","a":40,"tol":0,"u":"kPa","e":"Very soft < 20、soft 20–40、firm 40–75、stiff 75–150、very stiff/hard > 150 kPa。海泥（marine deposit）多為 very soft 至 soft。","x":"Silts and Clays Firm 40 - 75","doc":"geoguide3-rock-soil-descriptions","pp":"79","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","num","中級"]},{"id":"GG3-014","t":"num","d":2,"tp":"土壤描述 Soil description","c":"3.3.4(2)","p":38,"q":"土壤（不計 boulders/cobbles）含細粒至少約多少百分比時稱為 silt 或 clay（fine soil）？","a":35,"tol":0,"u":"%","e":"≥ 約 35% fines → SILT/CLAY；< 35% → SAND/GRAVEL。工程的 'well-graded' 相當於地質的 'poorly-sorted'，兩者用詞相反。","x":"contains about 35% or more of fine material, it is","doc":"geoguide3-rock-soil-descriptions","pp":"37","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","num","中級"]},{"id":"GG3-015","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 15","p":82,"q":"Table 15：粗粒土中 silt/clay 次要成分 15–35%，前綴應為？","o":["Very (silty/clayey)","Slightly (silty/clayey)","(silty/clayey) 無修飾","With much"],"a":0,"e":"Coarse soils：slightly < 5%、無修飾 5–15%、very 15–35%。","x":"Very (silty, clayey or silty/ 15 - 35","doc":"geoguide3-rock-soil-descriptions","pp":"81","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","mcq","中級"]},{"id":"GG3-016","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"3.5","p":45,"q":"Geoguide 3 指出香港的 true residual soil 厚度通常少於 3 m，在工程上比 saprolite 次要。","a":true,"e":"正確。Saprolite（grade V，保留原岩結構）才是香港 site formation 及 foundation 的主角；relict joints 對斜坡穩定尤其重要。","x":"True residual soils are rarely developed to any significant thickness in Hong Kong","doc":"geoguide3-rock-soil-descriptions","pp":"44","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","tf","中級"]},{"id":"GG3-017","t":"mcq","d":2,"tp":"不連續面 Discontinuities","c":"Table 7","p":75,"q":"Table 7：不連續面間距 200–600 mm 描述為？","o":["Medium-spaced","Closely-spaced","Widely-spaced","Very closely-spaced"],"a":0,"e":"間距分級：> 6 m extremely widely；2–6 m very widely；0.6–2 m widely；200–600 mm medium；60–200 mm closely；20–60 mm very closely；< 20 mm extremely closely。","x":"Medium - spaced 200 mm - 600 mm","doc":"geoguide3-rock-soil-descriptions","pp":"74","tags":["geoguide3-rock-soil-descriptions","不連續面 Discontinuities","mcq","中級"]},{"id":"GG3-018","t":"mcq","d":3,"tp":"風化分級 Weathering grades","c":"Table 10","p":78,"q":"Table 10 岩體風化分區：岩石含量 50%–90% 的 zone symbol？","o":["PW 50/90","PW 30/50","PW 90/100","RS"],"a":0,"e":"RS 100% soil；PW0/30 < 30% rock；PW30/50；PW50/90（interlocked structure）；PW90/100；UW 100% rock。與 BS 5930 分區不同，Geoguide 3 特意用新符號避免混淆。","x":"Rock 50 / 90 Interlocked structure","doc":"geoguide3-rock-soil-descriptions","pp":"77","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","進階"]},{"id":"GP1-001","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"GEO Publication 1/2023 Table 6.1（GFM）：embedded wall 的 overturning/toe instability，若用 effective stress analysis，最小 global factor of safety 是多少？","o":["1.5","1.2","2.0","1.4"],"a":0,"e":"GFM（global factor method）下 effective stress 用 1.5，total stress 用 2.0（因 su 不確定性較大）。注意 Note (1)：FoS 是施加於 passive earth pressure，而水壓不打折。常見錯誤是把 FoS 同時除到水壓上，令設計過度保守。","x":"1.5 for effective stress analysis","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","mcq","中級"]},{"id":"GP1-002","t":"num","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：toe stability 若用 total stress analysis，最小 FoS？","a":2.0,"tol":0,"u":"","e":"Total stress（undrained, su）分析 FoS 要 2.0，高於 effective stress 的 1.5。軟黏土（marine deposit）開挖常以 total stress 控制，嵌固深度因此顯著加長。","x":"2.0 for total stress analysis","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","num","中級"]},{"id":"GP1-003","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1 Note (1)","p":68,"q":"按 Table 6.1 Note (1)，embedded wall 抗 moment equilibrium 的 FoS 應施加於 passive earth pressure，水壓不作 factoring。","a":true,"e":"正確。GFM 的 FoS 以折減 passive resistance 方式施加；水壓屬「確定」荷載不打折。提交 BD/GEO 的計算書要清楚列明 FoS 的施加方法，否則審批時常被追問。","x":"The factor of safety against loss of moment equilibrium of the embedded wall should","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-004","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2（PFM, ULS）：undrained shear strength su 的 partial material factor γm 預設值？","o":["2.0","1.2","1.5","1.0"],"a":0,"e":"su 預設 γm = 2.0；若有 site-specific CPT 並以實驗室測試校準，可減至 1.5。Drained c'、tan φ' 則為 1.2。PFM（partial factor method）比 GFM 更理性，但參數要配對使用，不能混用 GFM 的 FoS。","x":"In general, a partial factor of 2.0 on su is recommended in","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","mcq","中級"]},{"id":"GP1-005","t":"num","d":3,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2 PFM：temporary surcharge 的 partial load factor γl？","a":1.3,"tol":0,"u":"","e":"ELS 屬臨時工程，surcharge 較可控，故取 1.3（Geoguide 1 永久擋土牆為 1.5）。若 surcharge 對穩定有利，γl 取 0（Note 4）。","x":"The partial factor for surcharge loading is recommended to be 1.3.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","num","進階"]},{"id":"GP1-006","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"在 PFM ULS 設計中，soil unit weight 和 stiffness 的 γm 均為 1.0。","a":true,"e":"正確。只有 strength 參數打折（drained 1.2、su 2.0/1.5、rock joint 1.2），unit weight 及 stiffness 取 1.0。SLS 全部系數為 1.0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-007","t":"short","d":3,"tp":"地下水 Groundwater","c":"6.5.1","p":70,"q":"開挖深度 > 4.5 m 的 ELS 工程，ULS 設計地下水位（DGWL）一般如何決定？若監測到的地下水位低於開挖面又如何？","m":"本地慣例：以監測到的最高地下水位再加 1 至 2 m 作 ULS 的 DGWL。若監測水位低於開挖面，則假設 DGWL 在開挖深度的三分之一處。","k":["monitored highest GWL + 1–2 m","excavation depth > 4.5 m","below excavation level → one-third of excavated depth"],"e":"DGWL 只需考慮工程期間，不用考慮長期/極端事件（如氣候變化）。實務上 SI 階段要有足夠長的水位監測（包括雨季），否則「最高監測水位」根本不具代表性。","x":"For ELS works with excavation depths greater than 4.5 m, it has become normal","doc":"geo-pub-1-2023-deep-excavation","pp":"70","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","short","進階"]},{"id":"GP1-008","t":"mcq","d":3,"tp":"地下水 Groundwater","c":"6.5.1","p":70,"q":"若監測地下水位低於 excavation level，ULS 的 DGWL 應假設在哪裡？","o":["開挖深度的三分之一","地面","開挖面","開挖深度的一半"],"a":0,"e":"GEO Pub 1/2023 6.5.1：假設在 excavated depth 的 one-third。這是為暴雨後短暫升水而設的保守假設。","x":"lower than the excavation level, the DGWL for ULS is assumed to be at one-third of the","doc":"geo-pub-1-2023-deep-excavation","pp":"70","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","mcq","進階"]},{"id":"GP1-009","t":"num","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"6.5.2","p":71,"q":"SLS 地下水位觸發值：high trigger value 設於最高 ULS DGWL 以下多少米？","a":0.5,"tol":0,"u":"m","e":"High trigger 在 ULS DGWL 以下 0.5 m、low trigger 在 SLS 最低允許水位以上 0.5 m——預留反應時間。9.2.2.7 亦以「再升/降 0.5 m 便到設計水位」作 Action Level。","x":"a high trigger value at 0.5 m below the highest DGWL","doc":"geo-pub-1-2023-deep-excavation","pp":"71","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","進階"]},{"id":"GP1-010","t":"short","d":2,"tp":"地下水 Groundwater","c":"6.5.2","p":71,"q":"SLS 設計中 DHGWL 與 DLGWL 各用於甚麼檢核？","m":"DHGWL（design high GWL）是實際可能的最高水位，用於估算牆身撓度；DLGWL（design low GWL）是最低記錄水位，用於估算抽水引致的 drawdown settlement。","k":["DHGWL → wall deflection","DLGWL → drawdown settlement","SLS 用 realistic 值，不應過度保守"],"e":"若把 ULS 地下水位直接用於 SLS，會高估牆撓度（6.1 已指出），並影響 strut preload 的判斷。","x":"a high trigger value at 0.5 m below the highest DGWL","doc":"geo-pub-1-2023-deep-excavation","pp":"71","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","short","中級"]},{"id":"GP1-011","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"6.1","p":63,"q":"GEO Pub 1/2023 指出，把 ULS 地下水位用於 SLS 設計可能導致高估牆撓度。","a":true,"e":"正確。SLS 應採用「realistic」參數與水位；把 ULS 保守值套入 SLS 會令撓度、沉降估算偏大，導致過重的支撐系統。","x":"using the ULS groundwater level for SLS design may lead","doc":"geo-pub-1-2023-deep-excavation","pp":"63","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-012","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (base heave)","p":65,"q":"Base heave 主要在哪種地質條件下發生？","o":["軟黏土延伸至開挖底以下相當深度","開挖底為新鮮岩石","鬆散砂層且水頭差高","填土層很薄"],"a":0,"e":"Base heave 屬軟黏土問題（Table 6.1 要求 FoS 1.5）；砂層高水頭差則屬 piping。對填海區深厚 marine deposit 的地盤要特別檢核。","x":"primarily occurs in ground conditions where soft clay extends to a considerable depth below the excavation base","doc":"geo-pub-1-2023-deep-excavation","pp":"65","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","mcq","中級"]},{"id":"GP1-013","t":"short","d":3,"tp":"失效模式 Failure modes","c":"6.3 (piping / uplift)","p":67,"q":"低透水黏土層覆蓋於有承壓（artesian）水頭的砂層上時，開挖可能出現甚麼失效？列舉兩種補救方法。","m":"Uplift（底鼓/上舉）失效：黏土層底的承壓水壓超過上覆土重。補救：在黏土層下方抽水減壓（dewatering beneath the clay layer），或穿過黏土層開設減壓孔（pressure relief holes）。","k":["uplift","artesian pressure in sand","dewatering beneath clay","pressure relief holes","常見於填海地"],"e":"Table 6.1 要求 hydraulic failure（piping 和 uplift）FoS 1.5。PFM 下穩定作用的有效垂直應力要乘 0.67（Table 6.2 Note 1）。","x":"dewatering beneath the clay layer or forming pressure relief holes through the layer","doc":"geo-pub-1-2023-deep-excavation","pp":"67","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","short","進階"]},{"id":"GP1-014","t":"num","d":2,"tp":"失效模式 Failure modes","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：hydraulic failure（piping 及 uplifting）最小 FoS？","a":1.5,"tol":0,"u":"","e":"Base heave 及 hydraulic failure 均為 1.5；structural failure 1.4；SLS 1.0。","x":"1.5 for effective stress analysis","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","num","中級"]},{"id":"GP1-015","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (piping)","p":66,"q":"Piping 最可能在甚麼情況下發生？","o":["開挖遇上鬆散砂層且水力梯度高","開挖於軟黏土","開挖於完整岩石","地下水位低於開挖面"],"a":0,"e":"加長嵌固深度可延長 seepage path、降低出口梯度。grout curtain 滲漏亦會局部加大梯度，是本地 ELS 事故常見成因。","x":"Piping is more likely to occur when the excavation encounters a loose sandy layer with a high","doc":"geo-pub-1-2023-deep-excavation","pp":"66","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","mcq","中級"]},{"id":"GP1-016","t":"mcq","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"三級觸發機制（AAA）中，Alert 和 Alarm 一般設於 Action Level 的甚麼百分比？","o":["50% 及 75%","25% 及 50%","60% 及 80%","75% 及 90%"],"a":0,"e":"AAA = Alert-Alarm-Action，一般 50% / 75% of Action Level。敏感地盤或以 engineering approach 定 Action Level 時參照 PNAP APP-24 Appendix C 或持份者（AMO、MTR）要求。","x":"In general, the AAA Levels are set at 50% and 75% of the Action Level respectively.","doc":"geo-pub-1-2023-deep-excavation","pp":"110","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","中級"]},{"id":"GP1-017","t":"num","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"若未經工程分析評估 ELS 影響範圍（influence zone），最少應採用多少倍 He 的水平距離？","a":1.5,"tol":0,"u":"×He","e":"最少 1.5He；若周邊有厚 marine deposit，須考慮更大範圍。影響範圍內所有 sensitive receivers 均要評估並設監測點。","x":"Otherwise, a minimum horizontal distance of 1.5 times","doc":"geo-pub-1-2023-deep-excavation","pp":"110","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","中級"]},{"id":"GP1-018","t":"num","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"本地簡單開挖工程慣用的 empirical ground settlement Action Level 是多少？","a":25,"tol":0,"u":"mm","e":"25 mm 的 empirical 限值（PNAP APP-137）對簡單開挖行之有效，但深開挖若估算沉降本身已 > 25 mm 仍硬套，只會導致過重支撐或必然觸發停工。GEO Pub 1/2023 提倡按估算值（0.3%–0.5%He）設定。","x":"25 mm as the Action Level has been successfully applied for many simple excavation projects","doc":"geo-pub-1-2023-deep-excavation","pp":"111","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","中級"]},{"id":"GP1-019","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"GEO Pub 1/2023 指出，常見而恰當的 ELS 系統引致的地面沉降一般在甚麼範圍？","o":["0.3%He 至 0.5%He","0.05%He 至 0.1%He","1%He 至 2%He","固定 25 mm"],"a":0,"e":"若估算值明顯偏離 0.3–0.5%He，應嚴格覆核開挖方案；過度保守會導致不合理的支撐系統。例子：沙中綫會展站約 30 m 開挖錄得約 100 mm 沉降。","x":"systems usually result in ground settlements within a typical range of between 0.3%He and","doc":"geo-pub-1-2023-deep-excavation","pp":"111","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","進階"]},{"id":"GP1-020","t":"num","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1（5A Approach）：ground settlement marker 的 Alert 值？","a":10,"tol":0,"u":"mm","e":"5A：Alert 10 mm、Alarm 15 mm、Action Level 1 20 mm、Level 2 0.3%He（25–60 mm 範圍）、Level 3 0.5%He（30–100 mm）。只適用於道路路面。","x":"monitoring 10 mm 15 mm 20 mm","doc":"geo-pub-1-2023-deep-excavation","pp":"117","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","進階"]},{"id":"GP1-021","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1：building monitoring marker 的 angular distortion Alert 值？","o":["1:1000","1:600","1:500","1:300"],"a":0,"e":"Building：1:1000 / 1:750 / 1:600 / 1:550 / 1:500；Services：1:600 / 1:500 / 1:400 / 1:350 / 1:300。建築物比管線嚴格。","x":"monitoring 1:1000 1:750 1:600 1:550 1:500","doc":"geo-pub-1-2023-deep-excavation","pp":"117","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","進階"]},{"id":"GP1-022","t":"  net bearing + 剝落 + 施工偏差。","x":"Concrete grade 30 or above, plain or reinforced 15","doc":"precast-2016","pp":"16","tags":["precast-2016","支座 Bearings","num","進階"]},{"id":"PRC-017","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.1","p":38,"q":"Table 3.1：牆或外牆板吊點在邊緣橫跨厚度方向的建議容許偏差？","o":["5 mm","25 mm","150 mm","300 mm"],"a":0,"e":"其他：樁/樓板 150 mm、樑沿長度 300 mm、橫跨 25 mm。","x":"Wall or façade panel On the edge across the thickness 5 mm","doc":"precast-2016","pp":"30","tags":["precast-2016","施工 Construction","mcq","中級"]},{"id":"PRC-018","t":"num","d":2,"tp":"施工 Construction","c":"3.2.2","p":38,"q":"良好做法：模具大約每多少次澆注後應全面重新檢查尺寸偏差？","a":100,"tol":0,"u":"次","e":"模具反覆使用會變形，定期檢查可避免構件尺寸偏差累積。","x":"compliance be carried out after approximately 100 castings. More frequent checking may be","doc":"precast-2016","pp":"30","tags":["precast-2016","施工 Construction","num","中級"]},{"id":"PRC-019","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：一般非預應力構件、精細控制吊機吊裝的建議最低混凝土強度？","o":["10 N/mm²","15 N/mm²","20 N/mm²","25 N/mm²"],"a":0,"e":"有明顯衝擊 15；同心預應力 20；偏心預應力 25；橋樑 30 N/mm²。實際要視吊點錨固長度。","x":"None specified, fine controlled crane, non-prestressed 10 N/mm","doc":"precast-2016","pp":"32","tags":["precast-2016","施工 Construction","mcq","中級"]},{"id":"PRC-020","t":"num","d":3,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：偏心預應力構件（如 T 樑、深樓板單元）吊裝的最低混凝土強度（N/mm²）？","a":25,"tol":0,"u":"N/mm²","e":"預應力構件吊點須錨固在受壓區，除非另有設計。","x":"Eccentrically prestressed elements (tees, deep flooring units) 25 N/mm","doc":"precast-2016","pp":"32","tags":["precast-2016","施工 Construction","num","進階"]},{"id":"PRC-021","t":"num","d":2,"tp":"施工 Construction","c":"3.16.9","p":45,"q":"半預製樓板澆注面層前，以水刀清潔的最低水壓（kPa）？","a":10000,"tol":0,"u":"kPa","e":"即 100 bar。清潔後要檢查樓板底裂縫，貫穿裂縫須在澆注前修補，以確保新舊混凝土結合。","x":"by using water jet with a minimum pressure of 10,000kPa (100bar) for cleansing;","doc":"precast-2016","pp":"37","tags":["precast-2016","施工 Construction","num","中級"]},{"id":"PRC-022","t":"tf","d":2
