.5","doc":"dead-imposed-loads-2011-2021ed","tier":"常考","ex":"loads","o":["3.0 kPa","2.0 kPa","5.0 kPa","4.0 kPa"],"a":3,"q_en":"What is qk for kitchens and laundries not in domestic buildings?","e_en":"4.0 kPa; domestic kitchens are 2.0 kPa. Used in hotel and hospital briefs.","pp":"5"},{"id":"BAR-010","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"按 ASD Table 3.3，T10 @ 200 每米鋼筋面積是？","e":"79 × 1000/200 = 393。785 是 @100；1571 是誤把半徑當直徑（π × 10² = 314 每支）；157 是 2T10。另注意 Table 3.3 印 T10 @150 為 523，Table 3.4 單肢 T10 @150 印 524（精確 523.6），屬四捨五入差異。 T10（ASD Table 3.2，1–10 支）：79、157、236、314、393、471、550、628、707、785 mm²；每米（Table 3.3）：@100 785、@125 628、@150 523、@175 449、@200 393、@225 349、@250 314、@275 285、@300 262 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：1047 mm²/m。","x":"200 393 566 1006 1571 2455 4022 6283","tier":"必考","ex":"rc","o":["393 mm²/m","1571 mm²/m","785 mm²/m","157 mm²/m"],"a":0,"q_en":"Per ASD Table 3.3, what is the area per metre of T10 at 200 mm?","e_en":"79 × 1000/200 = 393. 785 is @100; 1571 comes from using the diameter as the radius (π × 10² = 314 per bar); 157 is 2T10. Note Table 3.3 prints T10 @150 as 523 while Table 3.4 prints one-leg T10 @150 as 524 (exact 523.6), a rounding difference. T10 (ASD Table 3.2, 1–10 bars): 79, 157, 236, 314, 393, 471, 550, 628, 707, 785 mm²; per metre (Table 3.3): @100 785, @125 628, @150 523, @175 449, @200 393, @225 349, @250 314, @275 285, @300 262 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 1047 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-012","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"按 ASD Table 3.2，6T12 的鋼筋面積是？","e":"6 × 113 = 679（6 × 113.1 = 678.6）。452 是 4T12；2714 是誤把半徑當直徑（6 × π × 12²）；1131 是 10T12。 T12（ASD Table 3.2，1–10 支）：113、226、339、452、566、679、792、905、1018、1131 mm²；每米（Table 3.3）：@100 1131、@125 905、@150 754、@175 646、@200 566、@225 503、@250 452、@275 411、@300 377 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：1508 mm²/m。","x":"6 471 679 1207 1885 2945 4826 7540","tier":"必考","ex":"rc","o":["2714 mm²","452 mm²","1131 mm²","679 mm²"],"a":3,"q_en":"Per ASD Table 3.2, what is the area of 6T12?","e_en":"6 × 113 = 679 (6 × 113.1 = 678.6). 452 is 4T12; 2714 uses the diameter as the radius (6 × π × 12²); 1131 is 10T12. T12 (ASD Table 3.2, 1–10 bars): 113, 226, 339, 452, 566, 679, 792, 905, 1018, 1131 mm²; per metre (Table 3.3): @100 1131, @125 905, @150 754, @175 646, @200 566, @225 503, @250 452, @275 411, @300 377 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 1508 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-016","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"按 ASD Table 3.3，T16 @ 125 每米鋼筋面積是？","e":"201 × 1000/125 = 1609（= 8 支/m）。1341 是 @150；201 是單支面積（忘記換算每米）；6434 是誤把半徑當直徑（面積 × 4）。 T16（ASD Table 3.2，1–10 支）：201、402、603、804、1006、1207、1408、1609、1810、2011 mm²；每米（Table 3.3）：@100 2011、@125 1609、@150 1341、@175 1149、@200 1006、@225 894、@250 804、@275 731、@300 670 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：2681 mm²/m。","x":"125 628 905 1609 2514 3927 6434 10053","tier":"必考","ex":"rc","o":["1341 mm²/m","1609 mm²/m","6434 mm²/m","201 mm²/m"],"a":1,"q_en":"Per ASD Table 3.3, what is the area per metre of T16 at 125 mm?","e_en":"201 × 1000/125 = 1609 (= 8 bars per metre). 1341 is @150; 201 is the single-bar area (spacing conversion forgotten); 6434 uses the diameter as the radius (area × 4). T16 (ASD Table 3.2, 1–10 bars): 201, 402, 603, 804, 1006, 1207, 1408, 1609, 1810, 2011 mm²; per metre (Table 3.3): @100 2011, @125 1609, @150 1341, @175 1149, @200 1006, @225 894, @250 804, @275 731, @300 670 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 2681 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-020","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"按 ASD Table 3.2，8T20 的鋼筋面積（按表列數值）是？","e":"表列 2514（精確 8 × 314.16 = 2513.3，表值多 1 mm²）。1885 是 6T20；10053 是誤把半徑當直徑；3142 是 10T20。 T20（ASD Table 3.2，1–10 支）：314、628、943、1257、1571、1885、2199、2514、2828、3142 mm²；每米（Table 3.3）：@100 3142、@125 2514、@150 2095、@175 1795、@200 1571、@225 1396、@250 1257、@275 1143、@300 1047 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：4189 mm²/m。","x":"8 628 905 1609 2514 3927 6434 10053","tier":"必考","ex":"rc","o":["10053 mm²","1885 mm²","3142 mm²","2514 mm²"],"a":3,"q_en":"Per ASD Table 3.2, what is the area of 8T20 (as tabulated)?","e_en":"Tabulated 2514 (exact 8 × 314.16 = 2513.3; the table is 1 mm² higher). 1885 is 6T20; 10053 uses the diameter as the radius; 3142 is 10T20. T20 (ASD Table 3.2, 1–10 bars): 314, 628, 943, 1257, 1571, 1885, 2199, 2514, 2828, 3142 mm²; per metre (Table 3.3): @100 3142, @125 2514, @150 2095, @175 1795, @200 1571, @225 1396, @250 1257, @275 1143, @300 1047 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 4189 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-025","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"單支 T25 鋼筋的截面積（ASD Table 3.2）是？","e":"π × 25²/4 = 490.9 → 491。1963 是誤把直徑當半徑（π × 25²）；625 是漏了 π/4（25²）；982 是 2T25。 T25（ASD Table 3.2，1–10 支）：491、982、1473、1964、2455、2945、3436、3927、4418、4909 mm²；每米（Table 3.3）：@100 4909、@125 3927、@150 3273、@175 2805、@200 2455、@225 2182、@250 1964、@275 1785、@300 1636 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：6545 mm²/m。","x":"1 79 113 201 314 491 804 1257","tier":"必考","ex":"rc","o":["625 mm²","1963 mm²","491 mm²","982 mm²"],"a":2,"q_en":"Cross-sectional area of a single T25 bar (ASD Table 3.2)?","e_en":"π × 25²/4 = 490.9 → 491. 1963 uses the diameter as the radius (π × 25²); 625 omits π/4 (25²); 982 is 2T25. T25 (ASD Table 3.2, 1–10 bars): 491, 982, 1473, 1964, 2455, 2945, 3436, 3927, 4418, 4909 mm²; per metre (Table 3.3): @100 4909, @125 3927, @150 3273, @175 2805, @200 2455, @225 2182, @250 1964, @275 1785, @300 1636 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 6545 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-032","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"按 ASD Table 3.2，4T32 的鋼筋面積是？","e":"4 × 804 = 3217（4 × 804.2）。12868 是誤把半徑當直徑（4 × π × 32²）；2413 是 3T32；4022 是 5T32。 T32（ASD Table 3.2，1–10 支）：804、1609、2413、3217、4022、4826、5630、6434、7239、8043 mm²；每米（Table 3.3）：@100 8043、@125 6434、@150 5362、@175 4596、@200 4022、@225 3575、@250 3217、@275 2925、@300 2681 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：10723 mm²/m。","x":"4 314 452 804 1257 1964 3217 5026","tier":"必考","ex":"rc","o":["2413 mm²","4022 mm²","12868 mm²","3217 mm²"],"a":3,"q_en":"Per ASD Table 3.2, what is the area of 4T32?","e_en":"4 × 804 = 3217 (4 × 804.2). 12868 uses the diameter as the radius (4 × π × 32²); 2413 is 3T32; 4022 is 5T32. T32 (ASD Table 3.2, 1–10 bars): 804, 1609, 2413, 3217, 4022, 4826, 5630, 6434, 7239, 8043 mm²; per metre (Table 3.3): @100 8043, @125 6434, @150 5362, @175 4596, @200 4022, @225 3575, @250 3217, @275 2925, @300 2681 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 10723 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-040","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"按 ASD Table 3.3，T40 @ 150 每米鋼筋面積是？","e":"1257 × 1000/150 = 8377。1257 是單支面積；12566 是 @100；83.8 是錯誤換算（1257/15）。 T40（ASD Table 3.2，1–10 支）：1257、2513、3770、5026、6283、7540、8796、10053、11309、12566 mm²；每米（Table 3.3）：@100 12566、@125 10053、@150 8377、@175 7181、@200 6283、@225 5585、@250 5026、@275 4569、@300 4189 mm²/m。另 @75（計算值 π d²/4 × 1000/75，ASD 表未列）：16755 mm²/m。","x":"150 523 754 1341 2095 3273 5362 8377","tier":"必考","ex":"rc","o":["8377 mm²/m","83.8 mm²/m","12566 mm²/m","1257 mm²/m"],"a":0,"q_en":"Per ASD Table 3.3, what is the area per metre of T40 at 150 mm?","e_en":"1257 × 1000/150 = 8377. 1257 is the single-bar area; 12566 is @100; 83.8 is a wrong conversion (1257/15). T40 (ASD Table 3.2, 1–10 bars): 1257, 2513, 3770, 5026, 6283, 7540, 8796, 10053, 11309, 12566 mm²; per metre (Table 3.3): @100 12566, @125 10053, @150 8377, @175 7181, @200 6283, @225 5585, @250 5026, @275 4569, @300 4189 mm²/m. Also @75 (calculated, π d²/4 × 1000/75, not in the ASD table): 16755 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-101","t":"num","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"按 ASD Table 3.3，T16 @ 150 每米鋼筋面積（mm²/m）？","e":"201 × 1000/150 = 1340.4，表列 1341。T16 @200 = 1006、@125 = 1609。","x":"150 523 754 1341 2095 3273 5362 8377","tier":"必考","ex":"rc","a":1341,"tol":0.0,"u":"mm²/m","q_en":"Per ASD Table 3.3, area per metre of T16 at 150 mm (mm²/m)?","e_en":"201 × 1000/150 = 1340.4, tabulated 1341. T16 @200 = 1006, @125 = 1609.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-102","t":"mcq","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"樑需要 As,req = 1800 mm²，只考慮面積，以下哪組最少而足夠？","e":"6T20 = 1885 ≥ 1800 且最接近；4T25 = 1964 亦足夠但較多；2T32 = 1609、3T25 = 1473 不足。實際還要檢查一層能否放得下（最小淨距）及最多 4%。","x":"6 471 679 1207 1885 2945 4826 7540","tier":"必考","ex":"rc","o":["4T25（1964 mm²）","6T20（1885 mm²）","3T25（1473 mm²）","2T32（1609 mm²）"],"a":1,"q_en":"A beam needs As,req = 1800 mm². Considering area only, which provision is sufficient with the least area?","o_en":["4T25 (1964 mm²)","6T20 (1885 mm²)","3T25 (1473 mm²)","2T32 (1609 mm²)"],"e_en":"6T20 = 1885 ≥ 1800 and closest; 4T25 = 1964 also works but uses more; 2T32 = 1609 and 3T25 = 1473 are insufficient. In practice also check that the bars fit in one layer (minimum clear spacing) and the 4% maximum.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-103","t":"mcq","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"板需要 As,req = 700 mm²/m，只考慮面積，以下哪個配筋最少而足夠？","e":"T12-150 = 754 ≥ 700 且最接近；T10-100 = 785、T16-250 = 804 亦足夠但較多；T12-175 = 646 不足。間距仍須符合 CoP 9.3.1.1(b) 及 ASD Table 7.2。","x":"150 523 754 1341 2095 3273 5362 8377","tier":"必考","ex":"rc","o":["T10-100（785 mm²/m）","T12-175（646 mm²/m）","T12-150（754 mm²/m）","T16-250（804 mm²/m）"],"a":2,"q_en":"A slab needs As,req = 700 mm²/m. Considering area only, which provision is sufficient with the least area?","o_en":["T10-100 (785 mm²/m)","T12-175 (646 mm²/m)","T12-150 (754 mm²/m)","T16-250 (804 mm²/m)"],"e_en":"T12-150 = 754 ≥ 700 and closest; T10-100 = 785 and T16-250 = 804 also work but use more; T12-175 = 646 is insufficient. Spacing must still satisfy CoP 9.3.1.1(b) and ASD Table 7.2.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-104","t":"num","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"T12 @ 75 每米鋼筋面積（mm²/m）？（ASD Table 3.3 最密只列到 @100，請由 @150 推算）","e":"間距減半面積加倍：754 × 2 = 1508（亦即 113.1 × 1000/75 = 1508）。75 mm 不在 ASD 表內，屬計算值。","x":"150 523 754 1341 2095 3273 5362 8377","tier":"必考","ex":"rc","a":1508,"tol":1.0,"u":"mm²/m","calc":true,"q_en":"Area per metre of T12 at 75 mm (mm²/m)? (ASD Table 3.3 only goes down to @100; derive from @150.)","e_en":"Halving the spacing doubles the area: 754 × 2 = 1508 (i.e. 113.1 × 1000/75 = 1508). 75 mm is not in the ASD table; this is a calculated value.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-105","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"已知單支鋼筋面積 A1（mm²）及中心間距 s（mm），每米寬的鋼筋面積是？","e":"每米有 1000/s 支：As = A1 × 1000/s。例：T16 @150 → 201 × 1000/150 = 1341 mm²/m（Table 3.3）。A1 × s/1000 是常見倒轉錯誤。","x":"TABLE 3.3 REINFORCEMENT AREAS AT SPECIFIC SPACING (mm2/m)","tier":"必考","ex":"rc","o":["A1 × 1000 / s","A1 × s / 1000","A1 / s","A1 × 1000 × s"],"a":0,"q_en":"Given the single-bar area A1 (mm²) and centre spacing s (mm), what is the area per metre width?","e_en":"There are 1000/s bars per metre: As = A1 × 1000/s. Example: T16 @150 → 201 × 1000/150 = 1341 mm²/m (Table 3.3). A1 × s/1000 is the common inverted slip.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"BAR-106","t":"mcq","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.4","p":10,"q":"按 ASD Table 3.4，T10 雙肢箍 @ 150 的 Asv/sv（mm²/m）是？","e":"2 × 78.5 × 1000/150 = 1047。524 是 1 肢；1570 是 3 肢；2093 是 4 肢。比較最少箍筋 0.92 bv（ASD 8.3，fyv 500）：bv = 400 需 368 mm²/m。","x":"2 1570 1256 1047 897 785 698 628 571 523","tier":"必考","ex":"rc","o":["524 mm²/m","1047 mm²/m","1570 mm²/m","2093 mm²/m"],"a":1,"q_en":"Per ASD Table 3.4, Asv/sv for two-leg T10 links at 150 mm (mm²/m)?","e_en":"2 × 78.5 × 1000/150 = 1047. 524 is 1 leg; 1570 is 3 legs; 2093 is 4 legs. Compare minimum links 0.92 bv (ASD 8.3, fyv 500): bv = 400 needs 368 mm²/m.","doc":"asd-drafting-manual-rc","pp":"3.2"},{"id":"BAR-107","t":"mcq","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.4","p":10,"q":"按 ASD Table 3.4，T12 雙肢箍 @ 100 的 Asv/sv（mm²/m）是？","e":"2 × 113.1 × 1000/100 = 2262。1131 是 1 肢；1508 是 2 肢 @150；4524 是 4 肢。","x":"2 2262 1810 1508 1293 1131 1005 905 823 754","tier":"必考","ex":"rc","o":["1508 mm²/m","1131 mm²/m","2262 mm²/m","4524 mm²/m"],"a":2,"q_en":"Per ASD Table 3.4, Asv/sv for two-leg T12 links at 100 mm (mm²/m)?","e_en":"2 × 113.1 × 1000/100 = 2262. 1131 is 1 leg; 1508 is 2 legs @150; 4524 is 4 legs.","doc":"asd-drafting-manual-rc","pp":"3.2"},{"id":"SSV-001","t":"mcq","d":1,"tp":"監工制度 Supervision plan system","c":"4.3","p":9,"q":"按 Code of Practice for Site Supervision，負責「engineering safety supervision」的 TCP 屬哪些級別？","e":"T1–T3 負責 routine safety supervision；T4–T5 負責 engineering safety supervision。各 stream 的 Representative 應為該 stream 最高級別的 TCP。","x":"TCPs responsible for routine safety supervision, i.e. T1 to T3 and TCPs responsible for engineering safety supervision, i.e. T4 to","tier":"偶考","ex":"constr","o":["T4 至 T5","T1 至 T3","T3 至 T5","T1 至 T2"],"a":0,"q_en":"Under the Code of Practice for Site Supervision, which TCP grades are responsible for engineering safety supervision?","o_en":["T4 to T5","T1 to T3","T3 to T5","T1 to T2"],"e_en":"T1–T3 carry out routine safety supervision; T4–T5 carry out engineering safety supervision. Each stream's Representative should be its highest-grade TCP.","doc":"site-supervision-2009-2024ed","pp":"3"},{"id":"SSV-002","t":"mcq","d":2,"tp":"臨時工程 Temporary works","c":"4.9","p":25,"q":"以下哪項臨時工程須由 RC 委任 T5 Person 核證圖則及設計計算，並在開工前提交 RSE/RGE？","e":"例子：轉換板及車道斜坡、懸臂板 > 1.5 m、樑跨 > 12 m、深樑 > 3 m 深、高架水缸；柱牆高 > 6 m、擋土牆高 > 4 m 的模板支撐；機械工作平台等。","x":"(ii) cantilevered slab exceeding 1.5m","tier":"常考","ex":"constr","o":["高 3 m 柱的模板","高 2.5 m 擋土牆的模板","懸臂板跨度超過 1.5 m 的模板及支撐","跨度 8 m 樑的模板"],"a":2,"q_en":"Which of the following temporary works requires the RC to have plans and calculations certified by a T5 Person and submitted to the RSE/RGE before commencement?","o_en":["Formwork for a 3 m high column","Formwork for a 2.5 m high retaining wall","Formwork and shoring for a cantilevered slab exceeding 1.5 m","Formwork for an 8 m span beam"],"e_en":"Examples: transfer plates and vehicular ramps, cantilevered slabs > 1.5 m, beams spanning > 12 m, deep beams > 3 m deep, elevated water tanks; formwork for columns/walls > 6 m and retaining walls > 4 m high; plant working platforms, etc.","doc":"site-supervision-2009-2024ed","pp":"19"},{"id":"SSV-003","t":"mcq","d":2,"tp":"臨時工程 Temporary works","c":"4.9","p":25,"q":"按 4.9，樑跨度超過多少時其模板及支撐屬須 T5 Person 核證的臨時工程？","e":"樑跨 > 12 m；深樑則以深度 > 3 m 為準。留意拆卸 Code 的「long span beam」是 > 10 m，兩者不同。","x":"(iii) beam with span exceeding 12m","tier":"常考","ex":"constr","o":["10 m","12 m","6 m","15 m"],"a":1,"q_en":"Under para. 4.9, formwork and shoring for beams exceeding what span need T5 Person certification?","e_en":"Beams spanning > 12 m; deep beams > 3 m deep. Note the Demolition Code's \"long span beam\" is > 10 m, a different threshold.","doc":"site-supervision-2009-2024ed","pp":"19"},{"id":"SSV-004","t":"mcq","d":2,"tp":"臨時工程 Temporary works","c":"4.9","p":25,"q":"柱及牆的模板支撐，高度超過多少屬須 T5 Person 核證的臨時工程？","e":"柱牆 > 6 m；擋土牆 > 4 m。","x":"(i) columns and walls with height exceeding 6m","tier":"常考","ex":"constr","o":["6 m","10 m","3 m","4 m"],"a":0,"q_en":"Formwork and shoring for columns and walls exceeding what height need T5 Person certification?","e_en":"Columns and walls > 6 m; retaining walls > 4 m.","doc":"site-supervision-2009-2024ed","pp":"19"},{"id":"SSV-005","t":"mcq","d":2,"tp":"臨時工程 Temporary works","c":"4.9","p":25,"q":"須 T5 Person 核證的臨時工程圖則及計算，最遲須於開工前多少天提交 RSE/RGE？","e":"開工前 21 天提交；完工後 T5 Person 親身檢查並簽發完工證明，於完工後 7 天內交 RSE。","x":"RSE/RGE not later than 21 days before the commencement of","tier":"常考","ex":"constr","o":["14 天","7 天","28 天","21 天"],"a":3,"q_en":"Temporary works plans and calculations certified by the T5 Person must be submitted to the RSE/RGE not later than how many days before commencement?","o_en":["14 days","7 days","28 days","21 days"],"e_en":"21 days before commencement; on completion the T5 Person inspects and signs a completion certificate, submitted to the RSE within 7 days.","doc":"site-supervision-2009-2024ed","pp":"19"},{"id":"SSV-006","t":"mcq","d":2,"tp":"臨時工程 Temporary works","c":"4.9","p":26,"q":"上述臨時工程完成後，完工證明須於多少天內提交 RSE 確認及存檔？","e":"完工後 7 天內。","x":"acknowledgement5 and record within 7 days after completion of","tier":"偶考","ex":"constr","o":["21 天","14 天","7 天","3 天"],"a":2,"q_en":"After completion of such temporary works, within how many days must the completion certificate be submitted to the RSE?","o_en":["21 days","14 days","7 days","3 days"],"e_en":"Within 7 days after completion.","doc":"site-supervision-2009-2024ed","pp":"20"},{"id":"SSV-007","t":"mcq","d":2,"tp":"塔式起重機基座 Tower crane supports","c":"4.12","p":27,"q":"承托塔式起重機的臨時工程，設計工程師（DE）最低資格為？","e":"DE 及獨立審核工程師（ICE）均須為 R.P.E.（civil/structural）且有最少 5 年相關經驗；Forms TW1、TW2 須於開工前 21 天提交。","x":"a registered professional engineer (civil/structural) with a minimum of 5 years relevant working experience should be appointed by the RC for the design of the temporary works.","tier":"常考","ex":"constr","o":["RSE 本人","任何 T3","大學畢業具 2 年經驗","註冊專業工程師（土木/結構），具最少 5 年相關經驗"],"a":3,"q_en":"For temporary works supporting a tower crane, what is the minimum qualification of the design engineer (DE)?","o_en":["The RSE personally","Any T3","Degree holder with 2 years' experience","Registered professional engineer (civil/structural) with at least 5 years' relevant experience"],"e_en":"Both the DE and the independent checking engineer (ICE) must be RPE (civil/structural) with at least 5 years' relevant experience; Forms TW1 and TW2 go in 21 days before commencement.","doc":"site-supervision-2009-2024ed","pp":"21"},{"id":"SSV-008","t":"mcq","d":3,"tp":"塔式起重機基座 Tower crane supports","c":"4.12","p":31,"q":"自立式塔式起重機（free-standing tower crane）臨時工程完成後，RSE 須於多少天內把相關文件交屋宇署存檔？","e":"RC 於完工後 7 天內把 TW3 等交 RSE；RSE 再於 14 天內交 BD 存檔。","x":"RSE to submit all relevant documents of the temporary works to BD for record within 14 days after completion of such works","tier":"偶考","ex":"constr","o":["21 天","7 天","14 天","28 天"],"a":2,"q_en":"For a free-standing tower crane, within how many days after completion must the RSE submit the documents to BD for record?","o_en":["21 days","7 days","14 days","28 days"],"e_en":"The RC submits TW3 etc. to the RSE within 7 days of completion; the RSE then submits to BD within 14 days.","doc":"site-supervision-2009-2024ed","pp":"25"},{"id":"SSV-009","t":"mcq","d":2,"tp":"吊運安全 Lifting safety","c":"4.14","p":33,"q":"吊運操作的危險區（danger zone）一般範圍為？","e":"一般 ≥ 7 m 半徑（由安全主任按風險評估決定）；吊運物與觸發警報裝卸區之間最少淨空一般 ≥ 3 m；流動機械危險區一般 ≥ 2 m。","x":"should be not less than 7m radius from the crane hook.","tier":"偶考","ex":"constr","o":["距吊鈎半徑不少於 10 m","距吊鈎半徑不少於 2 m","距吊鈎半徑不少於 7 m","距吊鈎半徑不少於 3 m"],"a":2,"q_en":"What is the general extent of the danger zone for lifting operations?","o_en":["Not less than 10 m radius","Not less than 2 m radius from the hook","Not less than 7 m radius from the crane hook","Not less than 3 m radius"],"e_en":"Generally ≥ 7 m radius (determined by the Safety Officer by risk assessment); clearance between the load and the loading area triggering the alarm generally ≥ 3 m; mobile plant danger zones generally ≥ 2 m.","doc":"site-supervision-2009-2024ed","pp":"27"},{"id":"SSV-010","t":"mcq","d":2,"tp":"質量監督 Quality supervision","c":"6.21","p":52,"q":"如 BA 對泥釘質量有疑慮，會要求 RGE 以非破壞性測試核實多少泥釘長度？","e":"至少 1%，每個斜坡（包括牆）最少 2 支。","x":"(NDT) of at least 1% of soil nails with a minimum of 2 nails per slope","tier":"偶考","ex":"constr","o":["至少 1%，每個斜坡最少 2 支","全部泥釘","至少 10%","至少 5%，每個斜坡最少 5 支"],"a":0,"q_en":"If the BA has concerns on soil nail quality, what NDT sampling will it require the RGE to carry out to verify nail lengths?","o_en":["At least 1%, minimum 2 nails per slope","All nails","At least 10%","At least 5%, minimum 5 per slope"],"e_en":"At least 1% of soil nails with a minimum of 2 nails per slope (including wall).","doc":"site-supervision-2009-2024ed","pp":"46"},{"id":"SSV-011","t":"mcq","d":2,"tp":"岩土工程監督 Geotechnical works","c":"7.2","p":56,"q":"按 7.2，挖掘及側向支撐（ELS）深度超過多少屬「significant geotechnical content」的工程（非敏感地盤）？","e":"ELS 深 > 4.5 m（敏感地盤 > 7.5 m）；其他例子：泥釘、> 3 m 削坡、> 5 m 填土坡、> 5 m 懸臂/重力擋土牆及 > 7.5 m 地庫牆。","x":"depth > 4.5m (depth > 7.5m in sensitive sites* - see para 7.3)","tier":"常考","ex":"ground","o":["7.5 m","4.5 m","3 m","2.5 m"],"a":1,"q_en":"Under para. 7.2, excavation and lateral support deeper than what (non-sensitive site) counts as building works with significant geotechnical content?","e_en":"ELS deeper than 4.5 m (> 7.5 m in sensitive sites); other examples: soil nails, cut slopes > 3 m, fill slopes > 5 m, cantilever/gravity walls > 5 m and basement walls > 7.5 m.","doc":"site-supervision-2009-2024ed","pp":"50"},{"id":"SSV-012","t":"mcq","d":2,"tp":"岩土工程監督 Geotechnical works","c":"7.2","p":57,"q":"地庫牆（basement wall）高度超過多少屬 significant geotechnical content？","e":"懸臂/重力擋土牆 > 5 m；screen/basement walls > 7.5 m。這類工程須 RGE 的 T3 及 T5 監督。","x":"cantilever/gravity retaining walls (height > 5m) and screen/basement walls (height > 7.5m)","tier":"常考","ex":"ground","o":["7.5 m","3 m","5 m","4.5 m"],"a":0,"q_en":"A basement wall exceeding what height counts as significant geotechnical content?","e_en":"Cantilever/gravity retaining walls > 5 m; screen/basement walls > 7.5 m. Such works require supervision by the RGE's T3 and T5.","doc":"site-supervision-2009-2024ed","pp":"51"},{"id":"SSV-013","t":"mcq","d":3,"tp":"更頻密監督 More frequent supervision","c":"9 Table 9.1","p":82,"q":"拆卸複雜結構（例如轉換板、預應力）時，RC 的 T5 及 RSE 的 T5 監督頻率分別為？","e":"關鍵工序：RC 的 T5 全職、RSE 的 T5 每周兩次；如建築物兼作擋土且地面高差 > 1.5 m，RGE 的 T5 亦須每周兩次。","x":"Demolition of complex structures, such as flat slab, Full Time Twice a week","tier":"偶考","ex":"demol","o":["兩者均每周一次","RC T5 全職；RSE T5 每周兩次","兩者均全職","RC T5 每周兩次；RSE T5 全職"],"a":1,"q_en":"For demolition of complex structures (e.g. transfer plate, prestressed concrete), what are the supervision frequencies of the RC's T5 and the RSE's T5?","o_en":["Both weekly","RC's T5 full time; RSE's T5 twice a week","Both full time","RC's T5 twice a week; RSE's T5 full time"],"e_en":"Critical stage: RC's T5 full time, RSE's T5 twice a week; if the building retains ground with a level difference > 1.5 m, the RGE's T5 also inspects twice a week.","doc":"site-supervision-2009-2024ed","pp":"76"},{"id":"SSV-014","t":"mcq","d":3,"tp":"更頻密監督 More frequent supervision","c":"9 Table 9.1","p":83,"q":"以下哪一種情況屬 Table 9.1 所指須「每周兩次」額外監督的樁基關鍵工序？","e":"樁基位於鐵路結構、公路結構或樓齡超過 40 年的建築物 5 m 內，RC T4 及 RSE T5 均須每周兩次。","x":"(ii) Piling works within 5m of Twice a week Twice a week","tier":"偶考","ex":"ground","o":["樁基工程位於鐵路結構 20 m 外","地盤內沒有任何地下設施","樁基位於 10 年樓齡建築旁 50 m","樁基工程位於鐵路結構 5 m 範圍內"],"a":3,"q_en":"Which of the following is a Table 9.1 critical stage for piling requiring supervision twice a week?","o_en":["Piling works more than 20 m from a railway structure","No underground services on site","Piling 50 m from a 10-year-old building","Piling works within 5 m of a railway structure"],"e_en":"Piling within 5 m of a railway structure, highway structure or a building completed more than 40 years ago: RC's T4 and RSE's T5 twice a week.","doc":"site-supervision-2009-2024ed","pp":"77"},{"id":"SSV-015","t":"mcq","d":2,"tp":"TCP 名冊 TCP List","c":"8.28","p":80,"q":"列入屋宇署 TCP List 的有效期為？","e":"有效期 5 年，期滿前須申請保留。","x":"The validity period for inclusion in the TCP List is 5 years.","tier":"偶考","ex":"constr","o":["1 年","5 年","3 年","10 年"],"a":1,"q_en":"What is the validity period for inclusion in the TCP List?","o_en":["1 year","5 years","3 years","10 years"],"e_en":"5 years; an application for retention should be submitted.","doc":"site-supervision-2009-2024ed","pp":"74"},{"id":"SSV-016","t":"mcq","d":2,"tp":"TCP 名冊 TCP List","c":"8.27","p":77,"q":"T3、T4、T5 的相關經驗須於過去多少年內取得，並最少一年為本地經驗？","e":"T1/T2：過去 5 年內；T3–T5：過去 8 年內；均須最少 1 年本地經驗。","x":"(d) for T418 and T5 -The relevant experience must have been gained within the previous 8 years and at least 1 year must be local experience19.","tier":"偶考","ex":"constr","o":["5 年","8 年","10 年","3 年"],"a":1,"q_en":"For T3, T4 and T5, the relevant experience must have been gained within the previous how many years (with at least 1 year local)?","o_en":["5 years","8 years","10 years","3 years"],"e_en":"T1/T2: within the previous 5 years; T3–T5: within the previous 8 years; all with at least 1 year local.","doc":"site-supervision-2009-2024ed","pp":"71"},{"id":"TMS-001","t":"mcq","d":1,"tp":"TCP 資格 TCP qualifications","c":"Table 2","p":34,"q":"按 Technical Memorandum Table 2，T5 的最低資格為？","e":"T1：證書/文憑 + 2 年；T2：高級證書/文憑 + 3 年；T3：高級文憑 + 5 年或學位 + 2 年；T4：學位 + 4 年或註冊專業人士；T5：註冊專業人士 + 5 年。","x":"T5 A registered professional with minimum total relevant working experience of 5 years","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["學位持有人，具 4 年經驗","註冊專業人士，具最少 5 年相關經驗","證書持有人，具 2 年經驗","高級文憑持有人，具 5 年經驗"],"a":1,"q_en":"Per Technical Memorandum Table 2, what is the minimum qualification of a T5?","o_en":["Degree holder with 4 years","A registered professional with at least 5 years' relevant experience","Certificate holder with 2 years","Higher diploma holder with 5 years"],"e_en":"T1: certificate/diploma + 2 years; T2: higher certificate/diploma + 3 years; T3: higher diploma + 5 years or degree + 2 years; T4: degree + 4 years or a registered professional; T5: registered professional + 5 years.","pp":"30"},{"id":"TMS-002","t":"mcq","d":2,"tp":"TCP 資格 TCP qualifications","c":"Table 2","p":34,"q":"學位持有人要具最少多少年相關經驗才符合 T3 資格？","e":"T3：高級證書/文憑 + 5 年，或學位 + 2 年。學位 + 4 年則屬 T4。","x":"or a degree holder with minimum total relevant working experience of 2 years","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["2 年","1 年","5 年","4 年"],"a":0,"q_en":"A degree holder needs at least how many years of relevant experience to qualify as a T3?","o_en":["2 years","1 year","5 years","4 years"],"e_en":"T3: higher certificate/diploma + 5 years, or degree + 2 years. Degree + 4 years is T4.","pp":"30"},{"id":"TMS-003","t":"mcq","d":1,"tp":"巡查頻率 Inspection frequency","c":"Table 1 Note 1","p":33,"q":"Technical Memorandum 的巡查頻率「Level 4」是指？","e":"Level 1：按需要；2：每月；3：每兩周；4：每周；5：工作時間全職。關鍵工序可能要求更高級 TCP 或更頻密至全職。","x":"Level 4 = Weekly inspection","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["每月巡查","工作時間內全職","每兩周巡查","每周巡查"],"a":3,"q_en":"In the Technical Memorandum, inspection frequency \"Level 4\" means?","o_en":["Monthly inspection","Full-time during working hours","Fortnightly inspection","Weekly inspection"],"e_en":"Level 1: as and when required; 2: monthly; 3: fortnightly; 4: weekly; 5: full time during site working hours. Critical stages may need higher grades or more frequent inspection.","pp":"29"},{"id":"TMS-004","t":"mcq","d":2,"tp":"TCP 缺勤 TCP absence","c":"9.1","p":27,"q":"全職 TCP 因緊急情況缺勤時，須於多少小時內派駐同等或更佳資歷的替代 TCP？","e":"48 小時內派駐替代者，並於 7 天內通知 BA 有關安排。","x":"a replacement TCP of equal or better qualifications and experience shall be posted to the site within 48 hours.","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["7 天","24 小時","72 小時","48 小時"],"a":3,"q_en":"If a full-time TCP is absent due to emergency, within how many hours must a replacement of equal or better qualifications be posted?","o_en":["7 days","24 hours","72 hours","48 hours"],"e_en":"A replacement within 48 hours; the BA is notified of the arrangements within 7 days.","pp":"23"},{"id":"TMS-005","t":"mcq","d":2,"tp":"監工計劃修訂 Revised supervision plan","c":"8","p":27,"q":"監工計劃內的 TCP 有變動時，須於多少天內向 BA 提交修訂的監工計劃？","e":"變動後 7 天內，只需提交修改部分。","x":"submit a revised supervision plan to the Building Authority within 7 days of the","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["21 天","7 天","48 小時","14 天"],"a":1,"q_en":"When there is a change in a supervision plan, within how many days must a revised plan be submitted to the BA?","o_en":["21 days","7 days","48 hours","14 days"],"e_en":"Within 7 days of the change; only the amended part needs to be submitted.","pp":"23"},{"id":"TMS-006","t":"mcq","d":3,"tp":"簡易工程準則 Simple works criteria","c":"Appendix","p":28,"q":"TM 所列可採用簡化監工要求的上蓋工程準則，包括建築物總高不超過？","e":"準則包括：總高 ≤ 10 m、層高 ≤ 5 m、構件跨度 ≤ 6 m、無 > 1 m 懸臂、無預應力、擋土高差 ≤ 1.5 m、5 m 內無其他建築或街道。","x":"• the total height of the building does not exceed 10m;","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","o":["10 m","24 m","15 m","6 m"],"a":0,"q_en":"Among the TM criteria for simplified supervision of superstructure works, the total building height must not exceed?","e_en":"Criteria include: total height ≤ 10 m, storey height ≤ 5 m, spans ≤ 6 m, no cantilevers > 1 m, no prestressing, retained level difference ≤ 1.5 m, no buildings or streets within 5 m.","pp":"24"},{"id":"TMS-007","t":"tf","d":2,"tp":"簡易工程準則 Simple works criteria","c":"Appendix","p":28,"q":"含有預應力混凝土構件的小型建築物，仍可採用 TM 的簡化監工準則。","e":"錯。準則之一是建築物內沒有預應力構件。","x":"• there are no prestressed concrete elements in the building;","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"constr","a":false,"q_en":"A small building containing prestressed concrete elements can still use the TM simplified supervision criteria.","e_en":"False. One criterion is that there are no prestressed concrete elements in the building.","pp":"24"},{"id":"TMS-008","t":"mcq","d":2,"tp":"簡易工程準則 Simple works criteria","c":"Appendix","p":29,"q":"TM 的簡化準則下，挖掘深度須少於多少？","e":"挖掘深度 < 2.5 m，且 45° 線範圍內沒有道路、建築物、陡於 30° 的斜坡或 ≥ 75 mm 水管。","x":"• the depth of excavation is less than 2.5m; and","doc":"tm-supervision-plans-2009","tier":"偶考","ex":"ground","o":["1.5 m","4.5 m", :30,"zh":"方案評估：提出兩個截然不同而可行的結構方案（包括基礎方案），以草圖說明功能佈置、荷載傳遞及穩定系統，比較後推薦其中一個並列明理由。須討論住宅剪力牆如何轉換至平台柱網。","en":"Design appraisal: propose two distinct and viable structural schemes (including the foundation scheme); use sketches to show functional framing, load transfer and stability; compare them and recommend one with reasons. Discuss how the residential shear walls are transferred onto the podium column grid.","chk":[["兩個方案真正不同（例如 RC 框架 + 核心筒 對 鋼框架 + 支撐），而非只改尺寸","The two schemes are genuinely different (e.g. RC frame + core vs steel frame + bracing), not just different sizes"],["每個方案都有平面及剖面草圖，標示柱網、跨度、轉換/懸臂位置","Plan and section sketches for each scheme showing column grid, spans, transfer/cantilever positions"],["荷載傳遞路徑：樓板 → 樑 → 柱/牆 → 轉換 → 基礎","Load path: slab → beam → column/wall → transfer → foundation"],["側向穩定系統（核心筒、剪力牆、支撐、剛架）及其位置","Lateral stability system (core, shear walls, bracing, rigid frames) and its location"],["基礎方案按地質資料（Table 2.1 類別、地下水位）選擇","Foundation scheme chosen from the ground data (Table 2.1 category, groundwater level)"],["比較表：結構效率、造價、工期、施工風險、耐火、耐久、維修","Comparison table: structural efficiency, cost, programme, construction risk, fire, durability, maintenance"],["明確推薦並給出理由","Clear recommendation with reasons"]],"topics":["loads","fdn","steel","rc"]},{"code":"A2","mk":10,"zh":"說明推薦方案如何抵抗風荷載，並按 Wind Code 2019 作詳細風荷載計算及整體穩定（傾覆/上拔）檢查。","en":"Explain how the recommended scheme resists wind load and prepare a detailed wind load calculation to the Wind Code 2019, with an overall stability (overturning/uplift) check.","chk":[["列出 Qo,z（Table 3-1）、St、Sθ、Cf、Sq,z，並說明取值理由","List Qo,z (Table 3-1), St, Sθ, Cf, Sq,z with reasons for each value"],["分段計算 Wz 及總剪力、傾覆力矩","Compute Wz by height band, total shear and overturning moment"],["扭轉偏心及 Table 2-1 組合（題目若要求）","Torsion eccentricity and Table 2-1 combinations (if required)"],["ULS 荷載系數 1.4；有利恆載 1.0 檢查上拔/傾覆","ULS factor 1.4; check uplift/overturning with beneficial dead load 1.0"],["頂部側移 H/500 概算","Estimate top deflection against H/500"]],"topics":["wind","loads"]},{"code":"B1","mk":20,"zh":"就推薦方案作計算，確定主要構件尺寸：轉換板/轉換樑、典型住宅樓板、平台柱、地庫底板（抗浮）及樁。","en":"For the recommended scheme, prepare calculations to size the principal elements: transfer plate/girders, typical residential slab, podium columns, basement slab (uplift) and piles.","chk":[["先列設計準則：規範、材料等級、保護層、FRR、荷載（Table 3.2 用途）","Start with design criteria: codes, material grades, cover, FRR, loads (Table 3.2 uses)"],["ULS 組合（1.4Gk + 1.6Qk 等）及構件荷載面積","ULS combinations (1.4Gk + 1.6Qk etc.) and tributary areas"],["跨深比檢查撓度（Table 7.3 × 修正系數）","Span/depth check for deflection (Table 7.3 × modification factors)"],["彎矩、剪力、軸力的手算並選定尺寸及配筋率","Hand calcs of moment, shear and axial load; select sizes and steel ratios"],["FRR 對最小尺寸及保護層的影響","Effect of FRR on minimum dimensions and cover"],["基礎：樁承載力、數量、樁帽","Foundation: pile capacity, number of piles, pile cap"]],"topics":["rc","loads","fire","fdn"]},{"code":"B2","mk":20,"zh":"繪畫推薦方案的結構佈置圖（主要樓層平面、剖面及立面），足以供工料測量師估算造價。","en":"Prepare framing plans, sections and elevations of the recommended scheme, sufficient for a quantity surveyor to prepare a cost estimate.","chk":[["比例、軸線、尺寸、樓層標高","Scale, grid lines, dimensions, floor levels"],["構件編號及尺寸（樑、柱、牆、板厚）","Member marks and sizes (beams, columns, walls, slab thickness)"],["轉換層、懸臂、開孔、無柱區清楚標示","Transfer level, cantilevers, openings and column-free zones clearly shown"],["基礎佈置（樁位、樁帽、地庫牆）","Foundation layout (piles, pile caps, basement walls)"],["材料及混凝土等級註釋","Notes on materials and concrete grades"]],"topics":["detail"]},{"code":"B3","mk":5,"zh":"繪畫以下結構詳圖：轉換樑與柱的接駁。","en":"Prepare structural details of: the transfer girder to column connection.","chk":[["配筋數量、直徑、間距（例如 T25-150）","Bar numbers, sizes and spacing (e.g. T25-150)"],["錨固、搭接、箍筋及保護層","Anchorage, laps, links and cover"],["連接（螺栓/焊接）及承托細節","Connections (bolts/welds) and bearing details"],["詳圖比例 1:20 或 1:10","Detail scale 1:20 or 1:10"]],"topics":["detail","rc","steel"]},{"code":"M1","mk":10,"zh":"施工方法說明：地庫深挖及側向支撐， r rockhead."],"parts":[{"code":"A1","mk":40,"zh":"方案評估：提出兩個截然不同而可行的結構方案（包括基礎方案），以草圖說明功能佈置、荷載傳遞及穩定系統，比較後推薦其中一個並列明理由。須比較兩種屋頂大跨度系統（例如空間桁架對拱/張弦樑）。","en":"Design appraisal: propose two distinct and viable structural schemes (including the foundation scheme); use sketches to show functional framing, load transfer and stability; compare them and recommend one with reasons. Compare two long-span roof systems (e.g. space truss vs arch/tied or cable-stayed beams).","chk":[["兩個方案真正不同（例如 RC 框架 + 核心筒 對 鋼框架 + 支撐），而非只改尺寸","The two schemes are genuinely different (e.g. RC frame + core vs steel frame + bracing), not just different sizes"],["每個方案都有平面及剖面草圖，標示柱網、跨度、轉換/懸臂位置","Plan and section sketches for each scheme showing column grid, spans, transfer/cantilever positions"],["荷載傳遞路徑：樓板 → 樑 → 柱/牆 → 轉換 → 基礎","Load path: slab → beam → column/wall → transfer → foundation"],["側向穩定系統（核心筒、剪力牆、支撐、剛架）及其位置","Lateral stability system (core, shear walls, bracing, rigid frames) and its location"],["基礎方案按地質資料（Table 2.1 類別、地下水位）選擇","Foundation scheme chosen from the ground data (Table 2.1 category, groundwater level)"],["比較表：結構效率、造價、工期、施工風險、耐火、耐久、維修","Comparison table: structural efficiency, cost, programme, construction risk, fire, durability, maintenance"],["明確推薦並給出理由","Clear recommendation with reasons"]],"topics":["loads","fdn","steel","rc"]},{"code":"A2","mk":10,"zh":"說明推薦方案如何抵抗風荷載，並按 Wind Code 2019 作詳細風荷載計算及整體穩定（傾覆/上拔）檢查。","en":"Explain how the recommended scheme resists wind load and prepare a detailed wind load calculation to the Wind Code 2019, with an overall stability (overturning/uplift) check.","chk":[["列出 Qo,z（Table 3-1）、St、Sθ、Cf、Sq,z，並說明取值理由","List Qo,z (Table 3-1), St, Sθ, Cf, Sq,z with reasons for each value"],["分段計算 Wz 及總剪力、傾覆力矩","Compute Wz by height band, total shear and overturning moment"],["扭轉偏心及 Table 2-1 組合（題目若要求）","Torsion eccentricity and Table 2-1 combinations (if required)"],["ULS 荷載系數 1.4；有利恆載 1.0 檢查上拔/傾覆","ULS factor 1.4; check uplift/overturning with beneficial dead l showing the critical path.","chk":[["主要階段：地基 → 地庫/ELS → 上蓋 → 轉換 → 標準層 → 屋頂","Main stages: foundations → basement/ELS → superstructure → transfer → typical floors → roof"],["合理的每層週期及混凝土養護/拆撐時間","Realistic floor cycle and concrete curing/prop removal times"],["關鍵路徑及可重疊的工序","Critical path and activities that can overlap"]],"topics":["constr"]}]},{"id":"D7","cat":"bridge","zh":"跨路口及明渠的高架道路","en":"Highway viaduct over a road junction and a drainage channel","brief":["擬建一條雙程 2 線分隔車道的高架道路（每方向行車道闊 7.3 m，另設 0.5 m 路肩，兩側設 L4 混凝土護欄，橋面總闊 19 m），全長 210 m，跨越一個現有路口（限速 70 km/h）及一條 30 m 闊的明渠。路口範圍內橋墩只可設於中央分隔帶及路口以外，最大跨度 45 m；明渠內不可設橋墩。橋下淨空按 SDM Table 13.1；明渠設計洪水位以上須留渠務署同意的出水高度。","荷載及設計按路政署 Structures Design Manual for Highways and Railways（2013 Edition，已納入 Amendment No. 3/2025）及相關 BS EN：交通荷載用 LM1 及 LM3（SV196）；風荷載用簡化程序，地點屬 Degree 3 暴露度；溫度按 Table 3.17。可忽略地震、船撞及疲勞；護欄本身的設計不需考慮。","施工限制：路口只可在晚上 23:00 至翌日 05:00 封閉最多 2 條行車線，每週最多 3 晚；雨季期間明渠不可縮窄過水斷面。","地質：填土 4 m、沖積層 8 m，其下 CDG 至地面下 25 m，然後為 Grade III 或更佳花崗岩（TCR > 85%，Foundations Code Table 2.1 Category 1(c)）。明渠兩旁基岩較淺，約在地面下 12 m。地下水位在地面下 2 m。路口地底有大型水管及電纜。"],"brief_en":["A dual 2-lane elevated highway is proposed (carriageway 7.3 m wide in each direction plus 0.5 m hard shoulders, L4 concrete parapets on both sides, overall deck width 19 m), 210 m long, crossing an existing road junction (speed limit 70 km/h) and a 30 m wide open drainage channel. Within the junction, piers may only be placed in the central median and outside the junction, with a maximum span of 45 m; no pier is allowed in the channel. Headroom under the bridge to SDM Table 13.1; above the channel design flood level, a freeboard agreed with DSD shall be provided.","Loads and design to the Highways Department Structures Design Manual for Highways and Railways (2013 Edition, incorporating Amendment No. 3/2025) and the relevant BS EN: traffic loads LM1 and LM3 (SV196); wind to the simplified procedure, site at Degree 3 exposure; temperature to Table 3.17. Earthquake, ship impact and fatigue may be ignored; design of the parapets themselves is not required.","Construction constraints: at the junction, up to 2 traffic lanes may be closed only from 23:00 to 05:00, on at most 3 nights per week; the channel waterway shall not be narrowed during the wet season.","Ground: fill 4 m, alluvium 8 m, then CDG to 25 m below ground, over Grade III or better granite (TCR > 85%, Foundations Code Table 2.1 Category 1(c)). Rockhead is shallower beside the channel, at about 12 m below ground. Groundwater 2 m below ground. Large water mains and cables lie under the junction."],"parts":[{"code":"A1","mk":30,"zh":"方案評估：提出兩個截然不同而可行的橋樑方案（上部結構、支座布置及連續性、下部結構及基礎），以草圖說明跨度布置、荷載傳遞及抵抗縱向與橫向力的方法，比較後推薦其中一個並列明理由。","en":"Design appraisal: propose two distinct and viable bridge schemes (superstructure, articulation and continuity, substructure and foundations); use sketches to show the span arrangement, load transfer and how longitudinal and transverse forces are resisted; compare them and recommend one with reasons.","chk":[["兩個方案真正不同：例如預製預應力 U 形樑再連續化 對 現澆後張連續箱樑（平衡懸臂施工）","The two schemes are genuinely different: e.g. precast prestressed U-beams made continuous vs in-situ post-tensioned continuous box girder (balanced cantilever)"],["跨度布置配合路口、中央分隔帶及明渠（明渠內不設墩），並檢查 SDM Table 13.2 水平淨距","Span arrangement suits the junction, central median and channel (no pier in the channel), with SDM Table 13.2 horizontal clearance checked"],["淨空 5100 mm（SDM Table 13.1），已計撓度及凹曲線補償；明渠出水高度","Headroom 5100 mm (SDM Table 13.1) allowing for deflection and sag compensation; channel freeboard"],["支座布置：固定、導向、自由支座位置；伸縮縫數量減至最少（SDM 9.1.1）；支座不受上拔（SDM 8.1）","Articulation: fixed, guided and free bearings; minimum number of movement joints (SDM 9.1.1); no uplift on bearings (SDM 8.1)"],["橋墩按 SDM Table 3.24 抵抗車輛撞擊（1650 / 825 kN），或以 L4 防撞欄保護","Piers resist vehicle impact to SDM Table 3.24 (1650 / 825 kN), or are protected by L4 barriers"],["基礎方案按地質（大直徑鑽孔樁對工字鋼樁），避開地底管線","Foundation schemes suited to the ground (large-diameter bored piles vs H-piles), avoiding buried utilities"],["比較表：造價、工期、封路影響、耐久性（120 年設計年限）、美觀、維修（支座更換、伸縮縫）","Comparison table: cost, programme, traffic disruption, durability (120-year working life), aesthetics, maintenance (bearing replacement, joints)"]],"topics":["bridge","fdn","loads"]},{"code":"A2","mk":10,"zh":"按 SDM 簡化程序計算推薦方案的風荷載（橫向、縱向及豎向），包括有交通及無交通兩種情況，並檢查橋墩及支座（包括上拔）。","en":"Calculate the wind actions on the recommended scheme to the SDM simplified procedure (transverse, longitudinal and vertical), with and without traffic, and check the piers and bearings (including uplift).","chk":[["按題目的暴露度取 qp（SDM Table 3.8：Degree 3 = 3.3 kN/m²，Degree 4 = 3.8 kN/m²）","Take qp for the stated exposure (SDM Table 3.8: Degree 3 = 3.3 kN/m², Degree 4 = 3.8 kN/m²)"],["交通主導組合 qp = 1.2 kN/m²（SDM 3.4.2.2）；有交通時公路橋車輛高度 2.5 m、行人橋 1.25 m（SDM 3.4.7）","Traffic leading combination qp = 1.2 kN/m² (SDM 3.4.2.2); with traffic, vehicle height 2.5 m for road bridges and 1.25 m for footbridges (SDM 3.4.7)"],["力系數按 BS EN 1991-1-4 Clause 8.3（有蓋天橋用 SDM 3.4.6.5）；cs = cd = 1.0（SDM 3.4.5）","Force coefficients to BS EN 1991-1-4 Clause 8.3 (covered footbridges SDM 3.4.6.5); cs = cd = 1.0 (SDM 3.4.5)"],["風力傳至固定/導向支座及橋墩；豎向風及傾覆下檢查支座上拔（SDM 8.1）","Wind forces carried to fixed/guided bearings and piers; check bearing uplift under vertical wind and overturning (SDM 8.1)"],["ULS 風 γQ = 1.55（Set B，簡化程序）；抵消作用 γQ = 1.0","ULS wind γQ = 1.55 (Set B, simplified procedure); relieving effects γQ = 1.0"]],"topics":["bridge","wind","loads"]},{"code":"B1","mk":20,"zh":"就推薦方案作計算，確定主要構件尺寸：主樑或箱樑、橋面板、橋墩、支座及樁。","en":"For the recommended scheme, prepare calculations to size the principal elements: main beams or box girder, deck slab, piers, bearings and piles.","chk":[["設計準則：SDM、BS EN、混凝土 ≥ Grade 40（預應力 ≥ Grade 45）、保護層（SDM Table 5.2）","Design criteria: SDM, BS EN, concrete ≥ Grade 40 (prestressing ≥ Grade 45), cover (SDM Table 5.2)"],["恆載：混凝土 25 kN/m³、瀝青 100 mm；Set B 系數：混凝土 1.35、附加恆載 1.50、路面 1.20、交通 1.35","Dead load: concrete 25 kN/m³, asphalt 100 mm; Set B factors: concrete 1.35, super-imposed dead 1.50, surfacing 1.20, traffic 1.35"],["LM1（αQ1 = 1.20、αq1 = 0.53）及 LM3 SV196 的彎矩及剪力","LM1 (αQ1 = 1.20, αq1 = 0.53) and LM3 SV196 moments and shears"],["溫度：Te,max 45 °C，T0 10 / 30 °C，計算伸縮位移、支座及伸縮縫尺寸","Temperature: Te,max 45 °C, T0 10 / 30 °C, to size movements, bearings and joints"],["橋墩撞擊 1650 kN 及樁承載力","Pier impact 1650 kN and pile capacity"]],"topics":["bridge","rc","fdn","loads"]},{"code":"B2","mk":20,"zh":"繪畫推薦方案的總體布置圖（平面、立面及典型橫截面），標示跨度、支座布置、淨空及基礎，足以供工料測量師估算造價。","en":"Prepare general arrangement drawings of the recommended scheme (plan, elevation and typical cross-section) showing spans, articulation, headroom and foundations, sufficient for a quantity surveyor to prepare a cost estimate.","chk":[["平面及立面：跨度、橋墩編號、伸縮縫及支座類型（固定、導向、自由）","Plan and elevation: spans, pier numbers, joints and bearing types (fixed, guided, free)"],["典型橫截面：行車道 7.3 m、路肩、L4 護欄、橫坡及排水","Typical cross-section: carriageways 7.3 m, hard shoulders, L4 parapets, crossfall and drainage"],["淨空 5100 mm 及明渠設計洪水位","Headroom 5100 mm and channel design flood level"],["樁位、樁帽及地底管線位置","Pile layout, pile caps and buried utilities"]],"topics":["bridge","detail"]},{"code":"M1","mk":10,"zh":"施工方法說明：在路口及明渠上方架設上部結構的方法，包括臨時交通管理及明渠過水斷面的維持。","en":"Method statement: erection of the superstructure over the junction and the channel, including temporary traffic management and maintaining the channel waterway.","chk":[["在 23:00 至 05:00 封路時段內吊裝預製構件或推進架設","Lifting precast units or launching within the 23:00 to 05:00 closure window"],["臨時淨空不少於 4700 mm 並設足夠標誌（SDM 13.1(5)）","Temporary headroom not less than 4700 mm with adequate signing (SDM 13.1(5))"],["施工期間的平衡及臨時穩定（平衡懸臂、吊裝）；失衡會危及道路使用者時考慮 EQU 系數 1.15 / 0.85","Balance and temporary stability during execution (balanced cantilever, lifting); consider EQU factors 1.15 / 0.85 where loss of equilibrium would endanger road users"],["明渠：雨季不縮窄過水斷面，臨時工程須渠務署同意","Channel: waterway not narrowed in the wet season; temporary works agreed with DSD"],["地底管線的保護及改道","Protection and diversion of buried utilities"]],"topics":["bridge","constr"]},{"code":"M2","mk":10,"zh":"擬備推薦方案的施工程序（棒形圖），標示關鍵路徑。","en":"Prepare a construction programme (bar chart) for the recommended scheme, showing the critical path.","chk":[["樁 → 樁帽 → 橋墩 → 上部結構 → 橋面及伸縮縫 → 通車","Piles → pile caps → piers → superstructure → deck finishes and joints → opening"],["封路晚數限制（每週最多 3 晚）對架設進度的影響","Effect of the closure limit (max 3 nights per week) on erection progress"],["明渠工程避開雨季","Channel works outside the wet season"],["預製構件生產與基礎工程並行","Precast production in parallel with foundation works"]],"topics":["bridge","constr"]}]}]}</script>
<script>(function () {

/* SM-2 spaced repetition for mistakes: a wrong answer (anywhere) schedules the question for today;
   later correct answers push it out (1 → 6 days → × ease). Interval ≥ 21 days = mastered. */
function sm2(rec, g) {
  rec = Object.assign({ ef: 2.5, iv: 0, reps: 0, lapses: 0 }, rec || {});
  if (g < 3) { rec.reps = 0; rec.iv = 0; rec.lapses++; rec.due = ymd(); }
  else { rec.reps++; rec.iv = rec.reps === 1 ? 1 : rec.reps === 2 ? 6 : Math.round(rec.iv * rec.ef); rec.due = addDays(ymd(), rec.iv); }
  rec.ef = Math.max(1.3, rec.ef + (0.1 - (5 - g) * (0.08 + (5 - g) * 0.02)));
  rec.last = now(); return rec;
}
function record(id, r) {
  const x = S.q[id] || (S.q[id] = { n: 0, c: 0 });
  x.n++; x.c += r; x.ok = r; x.last = now();
  if (r < 1) S.srs[id] = sm2(S.srs[id], 1); else if (S.srs[id]) S.srs[id] = sm2(S.srs[id], 4);
  bumpDay(); save();
}

/* ---------- question renderer ---------- */

  { id: 'all', n: 60, min: 90, zh: '全範圍', en: 'Full coverage', tiers: TIERS }];
function buildMock(pr) {
  const pool = Q.filter(q => pr.tiers.indexOf(q.tier) >= 0);
  const byEx = {}; pool.forEach(q => (byEx[q.ex] = byEx[q.ex] || []).push(q.id));
  const keys = Object.keys(byEx); const W = keys.reduce((a, k) => a + EX[k].w, 0); const n = Math.min(pr.n, pool.length);
  const alloc = keys.map(k => ({ k, x: n * EX[k].w / W })); alloc.forEach(a => { a.t = Math.min(byEx[a.k].length, Math.floor(a.x)); });
  let left = n - alloc.reduce((a, b) => a + b.t, 0);
  alloc.sort((a, b) => (b.x - b.t) - (a.x - a.t));
  while (left > 0) { let moved = false; for (const a of alloc) { if (left > 0 && a.t < byEx[a.k].length) { a.t++; left--; moved = true; } } if (!moved) break; }
  let ids = []; alloc.forEach(a => { ids = ids.concat(shuffle(byEx[a.k]).slice(0, a.t)); });
  return shuffle(ids);
}

/* ---------- search ---------- */
function hl(text, toks) { let s = esc(text); toks.forEach(t => { if (!t) return; const re = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); s = s.replace(re, '<mark>$1</mark>'); }); return s; }
function hlPair(zh, en, toks) { if (en == null || en === zh) return hl(zh, toks); return '<span class="zh">' + hl(zh, toks) + '</span><span class="en b" lang="en">' + hl(en, toks) + '</span>'; }
const J = v => Array.isArray(v) ? v.join(' ') : (v || '');
const IDX = Q.map(q => ({ q, low: [q.id, q.q, EN(q, 'q'), J(q.o), J(EN(q, 'o')), q.e, EN(q, 'e'), q.x, q.c, tpZh(q.tp), tpEn(q.tp), docZh(q.doc), docEn(q.doc), EX[q.ex].zh, EX[q.ex].en].join(' \n ').toLowerCase() }));
function search() {
  const qv = S.lastSearch || '';
  app.innerHTML = '<div class="card"><input type="search" id="sIn"' + phL('搜尋題目、解說、原文引句…（例如 Table 2.1、cover、風）', 'Search questions, explanations, quotes… (e.g. Table 2.1, cover, wind)') + ' value="' + esc(qv) + '" autocomplete="off"><div class="small muted" id="sInfo" style="margin-top:6px"></div></div><div class="card"><div class="list" id="sRes"></div></div>';
  const run = () => {
    const v = $('#sIn').value.trim(); S.lastSearch = v;
    const toks = v.toLowerCase().split(/\s+/).filter(Boolean);
    if (!toks.length) { $('#sInfo').innerHTML = U('共 ' + Q.length + ' 題可搜尋（中英文均可）', Q.length + ' questions searchable in Chinese or English'); $('#sRes').innerHTML = ''; return; }
    const res = IDX.filter(r => toks.every(t => r.low.indexOf(t) >= 0));
    $('#sInfo').innerHTML = U('找到 ' + res.length + ' 項', res.length + ' result(s)');
    $('#sRes').innerHTML = res.length ? res.slice(0, 150).map(r => '<div class="item" data-id="' + esc(r.q.id) + '"><div class="s">' + hlPair(r.q.q, EN(r.q, 'q'), toks) + '</div><div class="m">' + tierTag(r.q.tier) + ' ' + ty(r.q.t) + ' · ' + docName(r.q.doc) + ' · ' + esc(r.q.c) + '</div></div>').join('') : '<div class="empty">' + U('找不到相符項目', 'No matches') + '</div>';
    wireList();
  };
  let t; $('#sIn').oninput = () => { clearTimeout(t); t = setTimeout(run, 150); };
  run(); setTimeout(() => $('#sIn') && $('#sIn').focus(), 50);
}

  app.innerHTML = '<div class="warnbox">' + U('⚠ 本工具是個人溫習輔助，不能取代規範原文。所有引用已自動核對與 PDF 抽取文字一致，但解說屬學習筆記性質。', '⚠ This is a personal revision aid and does not replace the original documents. All quotations have been checked automatically against the text extracted from the PDFs, but the explanations are study notes.') + '</div>' +
    META.caveats.map(c => '<div class="card note"><h3>' + bl(c.h, c.h_en) + '</h3><p>' + bl(c.b, c.b_en) + '</p></div>').join('') +
    '<div class="card"><h2>' + u('收錄文件及題量', 'Documents and question counts') + '</h2><table><tr><th>' + u('文件 · 版本', 'Document · edition') + '</th><th class="n">' + u('題', 'Qs') + '</th></tr>' +
    DOCS.map(d => '<tr><td><b>' + il(d.zh, d.en) + '</b><br><span class="small muted">' + esc(d.title) + ' — ' + esc(d.edition) + '</span></td><td class="n">' + Q.filter(q => q.doc === d.k).length + '</td></tr>').join('') + '</table></div>';
}
function backup() {
  app.innerHTML = '<div class="card"><h2>' + u('匯出進度', 'Export progress') + '</h2><p class="small muted">' + U('下載 JSON 檔（作答紀錄、錯題排程、書籤、模擬試及設計題紀錄、語言設定），可在另一部裝置匯入。', 'Downloads a JSON file (answer history, mistake schedule, bookmarks, mock and design records, language setting) that can be imported on another device.') + '</p><button class="btn pri" id="expB">' + u('匯出 JSON', 'Export JSON') + '</button></div>' +
    '<div class="card"><h2>' + u('匯入進度', 'Import progress') + '</h2><p class="small muted">' + U('匯入會取代本機現有進度。', 'Importing replaces the progress stored on this device.') + '</p><input type="file" id="impF" accept="application/json,.json"></div>' +
    '<div class="card"><h2>' + u('重設', 'Reset') + '</h2><button class="btn bad" id="rstB">' + u('清除所有進度', 'Clear all progress') + '</button></div>';
  $('#expB').onclick = () => {
    const blob = new Blob([JSON.stringify(Object.assign({ app: 'hkie-exam', exported: new Date().toISOString() }, S), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hkie-exam-progress-' + ymd() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('已匯出', 'Exported');
  };
  $('#impF').onchange = e => {
    const file = e.target.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || typeof o.q !== 'object') throw new Error('bad'); if (!confirm(ts('確定以匯入檔取代現有進度？', 'Replace current progress with the imported file?', '\n'))) return; delete o.app; delete o.exported; if (!LANGS[o.lang]) o.lang = S.lang; S = fill(o); save(); applyLang(); toast('匯入成功', 'Import successful'); location.hash = '#home'; } catch (err) { toast('檔案格式不正確', 'Invalid file format'); } };
    rd.readAsText(file);
  };
  $('#rstB').onclick = () => { if (confirm(ts('確定清除所有進度？此操作不能復原。', 'Clear all progress? This cannot be undone.', '\n'))) { S = fill({ lang: S.lang }); save(); SESS = null; EXAM = null; toast('已清除', 'Cleared'); location.hash = '#home'; } };
}

window.HKIE = { Q, CHEATS, DRILLS, EX, state: () => S, setLang, lang: () => S.lang, skew: ms => { SKEW += ms; }, sprintOrder: () => SPRINT_ORDER.slice(), sprintPool: () => Object.keys(sprintPool()), sprintQueue: n => sprintQueue(n || S.sprintN).ids, focus: () => FOCUS.map(f => ({ k: f.k, p: f.p, ids: Q.filter(f.f).map(q => q.id) })) };
applyLang();
route();
})();
</script>
