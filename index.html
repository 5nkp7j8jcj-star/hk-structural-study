<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dde3ea;--pri:#0f2740;--acc:#f2b134;--ok:#1e8e4e;--okbg:#e5f5ec;--bad:#c0392b;--badbg:#fbeae8;--warn:#9a6700;--warnbg:#fff6dd;--link:#1a5fb4;--r:14px;--shadow:0 1px 3px rgba(15,39,64,.08),0 4px 14px rgba(15,39,64,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0d141c;--card:#16212d;--ink:#e6edf3;--mute:#9aa8b6;--line:#2a3746;--pri:#0f2740;--okbg:#12311f;--badbg:#3a1714;--warnbg:#3a2e0c;--warn:#f2c14e;--link:#7fb0ff;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;min-height:52px}
.topbar h1{flex:1;font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom));outline:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:12px;color:var(--mute);text-decoration:none}
.tabbar a span{font-size:20px;line-height:1.1}
.tabbar a.on{color:var(--pri);font-weight:700}
@media (prefers-color-scheme:dark){.tabbar a.on{color:var(--acc)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat small{color:var(--mute);font-size:12.5px}
.stat.hl{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat.hl small{color:#cfe0f5}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e7dd7,#1e8e4e)}
.docrow{padding:10px 0;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:0}
.docrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.docrow .top span:last-child{color:var(--mute);font-size:12.5px;white-space:nowrap}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.topics{margin:6px 0 2px 8px;font-size:13px;color:var(--mute)}
.topics div{display:flex;justify-content:space-between;padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc{background:var(--acc);color:#1b1300;border-color:var(--acc);font-weight:700}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
select,input[type=text],input[type=search],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink);cursor:pointer;min-height:34px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.x{background:#e8f0fe;color:#1a5fb4;border-color:transparent}
@media (prefers-color-scheme:dark){.tag.x{background:#1b2c47;color:#9cc2ff}}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qtext{font-size:17px;font-weight:600;margin:6px 0 12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.opt b{display:inline-block;width:24px;color:var(--mute)}
.opt.sel{border-color:var(--link)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.neutral{background:var(--warnbg);color:var(--warn)}
.expl{white-space:pre-wrap}
.cite{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.cite .doc{font-weight:700}
.cite .loc{color:var(--mute)}
blockquote{margin:8px 0 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;font-style:italic}
.model{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap}
.kp label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.kp input{width:20px;height:20px;margin-top:2px;flex:none}
.flash{perspective:1200px;min-height:300px;cursor:pointer;margin-bottom:12px}
.flash .inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;overflow:auto}
.flash .back{transform:rotateY(180deg)}
.flash .front .big{font-size:19px;font-weight:700;margin-top:24px}
.flash .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--mute);font-size:12.5px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades .btn{flex-direction:column;font-size:14px;padding:6px 4px;gap:0}
.grades small{font-size:11px;opacity:.85}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.navgrid button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.navgrid button.ans{background:#dbe8fb;border-color:#9dbbe8;color:#0f2740}
.navgrid button.cur{outline:2px solid var(--acc)}
.navgrid button.r{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.navgrid button.w{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.list .item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .s{font-size:14.5px}
.list .item .m{font-size:12px;color:var(--mute)}
mark{background:#ffe58a;color:#000;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px}
.menu a:last-child{border-bottom:0}
.menu a span:first-child{font-size:20px;width:28px;text-align:center}
.menu a em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.note h3{margin:0 0 4px;font-size:15.5px}
.note p{margin:0;font-size:14.5px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
#toast.show{opacity:.95}
.muted{color:var(--mute)}
.small{font-size:13px}
.bm{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute);min-width:40px;min-height:40px}
.bm.on{color:var(--acc)}
.hero{background:linear-gradient(135deg,#0f2740,#1d4d7a);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:18px}
.hero p{margin:0;color:#cfe0f5;font-size:13.5px}
.hero .row{margin-top:12px}
@media (min-width:900px){main{padding-top:22px}.qtext{font-size:18px}}

/* ---------- bilingual ---------- */
.en{opacity:.8}
.en.b{display:block;font-size:.92em;margin-top:.15em;font-weight:400}
.en.i{font-size:.9em;margin-left:.35em}
.qtext .en.b{margin-top:.35em;font-weight:500}
.expl .en.b,.model .en.b,.note p .en.b,.ansline .en.b{margin-top:.5em}
.hero .en,.stat.hl .en,.btn.pri .en,.btn.acc .en,.btn.ok .en,.btn.bad .en,.chip.on .en,.topbar .en{opacity:.85}
body.l-zh .en{display:none!important}
body.l-en .zh{display:none!important}
body.l-en .en{opacity:1;font-size:inherit;margin:0}
body.l-en .qtext .en.b{font-weight:inherit}
.btn .en.b{margin-top:0;font-size:.82em;line-height:1.2}
.btn{flex-direction:column;text-align:center;line-height:1.25}
.btn.sm{flex-direction:row;gap:0}
.btn.sm .en.b{display:inline;margin-left:.35em}
.grades .btn span{display:block}
.chip .en.i{font-size:.86em}
.opt{display:flex;gap:4px;align-items:flex-start}
.opt b{flex:none}
.opt>span{flex:1;min-width:0}
.ansline{margin:10px 0}
.stat small .en.b{font-size:.92em;margin-top:0}
.stat b .en.i{font-size:.55em;font-weight:600}
.topbar h1 .en.b{font-size:12px;font-weight:500;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{line-height:1.2}
.tabbar a b{font-weight:inherit;line-height:1.15}
.tabbar a .en.b{font-size:10px;margin-top:0}
body.l-en .tabbar a .en.b{font-size:12px}
.langbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:0 10px;height:34px;min-width:52px;cursor:pointer;white-space:nowrap}
.langbtn:hover{background:rgba(255,255,255,.22)}
.langmenu{position:absolute;top:calc(100% + 4px);right:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:210px;z-index:40}
.langmenu[hidden]{display:none}
.langmenu button,.langopts button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1.5px solid transparent;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:48px}
.langmenu button small,.langopts button small{color:var(--mute);font-size:12px}
.langmenu button:hover{background:var(--bg)}
.langmenu button.on,.langopts button.on{border-color:var(--link);background:var(--bg)}
.langmenu button.on b::after,.langopts button.on b::after{content:" ✓";color:var(--link)}
.langopts{display:grid;gap:6px}
@media (min-width:640px){.langopts{grid-template-columns:repeat(3,1fr)}}
.langopts button{border-color:var(--line)}
.flash h3{font-size:15px;margin:12px 0 6px}
.flash .front{padding-bottom:48px}
</style>
</head>

y Materials to the Code of Practice for the Structural Use of Steel 2011 explain the 2011 provisions; the current Code is the 2023 Edition. Questions citing the EM carry an \"Edition note\"; check clause numbers and values (e.g. material factors, load combinations) against the 2023 Edition."},{"h":"Wind Code 2019 的 Explanatory Notes 已於 2023 年 12 月修訂","b":"December 2023 的 Amendments 只修改 Explanatory Notes（例如新增 hoarding 及 covered walkway 的 design net pressure 等），並非修改 Code of Practice on Wind Effects in Hong Kong 2019 本身。引用 Explanatory Notes 原文的題目，請留意相關段落可能已被修訂內容取代。","h_en":"The Explanatory Notes to the Wind Code 2019 were amended in December 2023","b_en":"The December 2023 Amendments modify only the Explanatory Notes (e.g. adding design net pressures for hoardings and covered walkways); they do not amend the Code of Practice on Wind Effects in Hong Kong 2019 itself. For questions quoting the Explanatory Notes, note that the relevant paragraphs may have been superseded by the amendments."},{"h":"OCR 頁面","b":"共 153 頁 PDF 屬掃描圖像，需 OCR 才取得文字（例如 Precast Code Appendix A、Geoguide 3 部分附表及圖版、部分圖則）。OCR 文字不可靠，因此本工具不引用任何 OCR 頁面；相關內容覆蓋較少。","h_en":"OCR pages","b_en":"153 PDF pages in total are scanned images whose text is only available through OCR (e.g. Precast Code Appendix A, some tables and plates of Geoguide 3, some drawings). OCR text is unreliable, so this tool does not quote any OCR page; coverage of that content is lighter."},{"h":"版本資料","b":"Fire Safety 2011（2024 Ed）、Concrete 2013（2020 Ed）、Steel 2011（2023 Ed）、Wind 2019、Dead and Imposed Loads 2011（2021 Ed）、Foundations 2017（2024 Ed）、Glass 2018、Precast 2016、Geoguide 1（e-version 2020）、Geoguide 3（e-version 2017）、GEO Publication 1/2023。如有更新版本，請以新版為準。","h_en":"Edition information","b_en":"Fire Safety 2011 (2024 Ed), Concrete 2013 (2020 Ed), Steel 2011 (2023 Ed), Wind 2019, Dead and Imposed Loads 2011 (2021 Ed), Foundations 2017 (2024 Ed), Glass 2018, Precast 2016, Geoguide 1 (e-version 2020), Geoguide 3 (e-version 2017), GEO Publi l buckling (LTB)"],"受壓構件 Compression":["受壓構件","Compression members"],"焊接 Welds":["焊接","Welds"],"螺栓 Bolts":["螺栓","Bolts"],"組合結構 Composite":["組合結構","Composite construction"],"荷載及材料系數 Load & material factors":["荷載及材料系數","Load & material factors"],"使用極限狀態 Serviceability":["使用極限狀態","Serviceability"],"阻尼 Damping":["阻尼","Damping"],"適用範圍 Scope":["適用範圍","Scope"],"扭轉 Torsion":["扭轉","Torsion"],"Across-wind":["橫風向","Across-wind"],"臨時結構 Temporary structures":["臨時結構","Temporary structures"],"加速度 Acceleration":["加速度","Acceleration"],"參考風壓 Reference pressure":["參考風壓","Reference pressure"],"有效高度 Effective height":["有效高度","Effective height"],"力系數 Force coefficient":["力系數","Force coefficient"],"開放框架 Open framework":["開放框架","Open framework"],"尺寸及動力系數 Size & dynamic factor":["尺寸及動力系數","Size & dynamic factor"],"方向系數 Directionality":["方向系數","Directionality"],"地形 Topography":["地形","Topography"],"背景 Background":["背景","Background"],"尺寸系數 Size factor":["尺寸系數","Size factor"],"修訂 2023 Amendments":["2023 修訂","2023 Amendments"]},"counts":{"questions":552,"flashcards":212}},"q":[{"id":"CON-001","t":"mcq","d":2,"tp":"預應力 Prestressed","c":"2.2.4.4(b)","p":23,"q":"預應力混凝土 class 3 構件在非常侵蝕性環境（如海水）中，表面裂縫寬度不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.3 mm"],"a":1,"e":"Class 1 無拉應力；class 2 有拉應力但無可見裂縫；class 3 容許裂縫：very aggressive 環境 ≤0.1 mm，其他 ≤0.2 mm。海旁 PT 構件應留意。","x":"0.1 mm for members in very aggressive environments (e.g. exposure to sea) and not exceeding","q_en":"For a class 3 prestressed concrete member in a very aggressive environment (e.g. exposure to sea), the surface crack width should not exceed:","e_en":"Class 1: no tensile stress; class 2: tensile stress but no visible cracking; class 3: cracking permitted — ≤0.1 mm in very aggressive environments, ≤0.2 mm otherwise. Watch this for PT members on the waterfront.","doc":"concrete-2013-2020ed","pp":"9","tags":["concrete-2013-2020ed","預應力 Prestressed","mcq","中級"]},{"id":"CON-002","t":"tf","d":1,"tp":"荷載 Loads","c":"2.3.1.1","p":23,"q":"Concrete Code 的 characteristic wind load Wk 應按 Code of Practice on Wind Effects 取得。","a":true,"e":"對。2.3.1.1：Gk、Qk 按 Dead and Imposed Loads Code，Wk 按 Wind Code。這是 cross-code 的基本鏈接：先定 characteristic loads，再按 Table 2.1 乘 γf。","x":"characteristic wind load, Wk, as defined in the Code of Practice on Wind Effects.","q_en":"In the Concrete Code, the characteristic wind load Wk should be obtained from the Code of Practice on Wind Effects.","e_en":"True. 2.3.1.1: Gk and Qk from the Dead and Imposed Loads Code, Wk from the Wind Code. This is the basic cross-code link: first fix the characteristic loads, then multiply by γf from Table 2.1.","doc":"concrete-2013-2020ed","pp":"9","tags":["concrete-2013-2020ed","荷載 Loads","tf","基礎"]},{"id":"CON-003","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(a)","p":24,"q":"所有樓宇應能抵抗 notional horizontal load，其值為每層 characteristic dead weight 的百分之幾？","a":1.5,"tol":0,"u":"%","e":"2.3.1.4(a)：每層同時施加 1.5% Gk 的 notional horizontal load；在 load combination 2 或 3 中，design ultimate wind load 不應小於此值。低層、背風或受遮擋建築要特別檢核這個下限。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","q_en":"All buildings should be able to resist a notional horizontal load equal to what percentage of the characteristic dead weight of each floor?","e_en":"2.3.1.4(a): a notional horizontal load of 1.5% Gk applied simultaneously at each floor; in load combination 2 or 3 the design ultimate wind load should not be less than this. Check this lower bound especially for low-rise, leeward or shielded buildings.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-004","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(b)","p":24,"q":"Key element 及其連接應能承受任何方向的 design ultimate load 是多少 kN/m²（不另乘 partial safety factor）？","a":34,"tol":0,"u":"kN/m²","e":"2.3.1.4(b)：34 kN/m²，施加於構件的 projected area，不乘 γf。用於 disproportionate collapse 設計中「key element」路線，例如 transfer column 不能以移除構件方式處理時。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","q_en":"What design ultimate load in kN/m², acting in any direction, should a key element and its connections be able to withstand (with no additional partial safety factor)?","e_en":"2.3.1.4(b): 34 kN/m² applied to the projected area of the member, with no γf applied. Used for the \"key element\" route in disproportionate collapse design, e.g. when a transfer column cannot be dealt with by notional removal.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-005","t":"mcq","d":2,"tp":"荷載 Loads","c":"2.3.1.5","p":24,"q":"考慮 exceptional loads（誤用或意外）時，一般寫字樓（非儲存用途）應計入多少 imposed load？","o":["0%","三分之一","三分之二","100%"],"a":1,"e":"2.3.1.5：dead load + 1/3 wind + imposed load（儲存/工業或永久性 imposed load 取 100%，其他樓宇取 1/3），並按 2.3.2.2 取 γf = 1.05。","x":"are permanent, 100% of the imposed load; for other buildings, one-third of the imposed load.","q_en":"When considering exceptional loads (misuse or accident), how much imposed load should be included for an ordinary office building (not storage use)?","o_en":["0%","One-third","Two-thirds","100%"],"e_en":"2.3.1.5: dead load + 1/3 wind + imposed load (100% for storage/industrial or permanent imposed load, 1/3 for other buildings), with γf = 1.05 per 2.3.2.2.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","mcq","中級"]},{"id":"CON-006","t":"tf","d":2,"tp":"荷載 Loads","c":"2.3.1.6","p":24,"q":"Concrete Code 規定由 differential settlement 引起的荷載應當作 permanent 荷載處理。","a":true,"e":"對。2.3.1.6：differential settlement 引起的荷載當作 permanent；例子包括軟土上 pad footing、不同基礎類型、不同基礎深度、pile cap 剛度不足。與 Foundations Code 的沉降評估相連。","x":"Loads induced by differential settlement should be treated as permanent.","q_en":"The Concrete Code requires loads induced by differential settlement to be treated as permanent loads.","e_en":"True. 2.3.1.6: loads induced by differential settlement are treated as permanent; examples include pad footings on soft soil, different foundation types, different founding depths and pile caps of insufficient stiffness. Links to the settlement assessment in the Foundations Code.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","tf","中級"]},{"id":"CON-007","t":"scenario","d":2,"tp":"荷載組合 Load combinations","c":"Table 2.1","p":25,"q":"一幢住宅樓宇檢核 ULS。請列出 Table 2.1 三個 load combinations 的主要 γf（dead adverse/beneficial、imposed、wind）。","m":"Comb 1 (Dead + Imposed)：Dead 1.4/1.0、Imposed 1.6/0；Comb 2 (Dead + Wind)：Dead 1.4/1.0、Wind 1.4；Comb 3 (Dead + Imposed + Wind)：Dead 1.2/1.0、Imposed 1.2/0、Wind 1.2。Earth and water pressure 分別取 1.4、1.4、1.2。","k":["1.4Gk + 1.6Qk","1.4Gk(或1.0Gk) + 1.4Wk","1.2Gk + 1.2Qk + 1.2Wk","beneficial dead 取 1.0，beneficial imposed 取 0","Comb 2/3 wind 不少於 1.5% notional load"],"e":"最常見錯誤：overturning / uplift 檢核時 dead load 仍用 1.4；應取 beneficial 1.0Gk + 1.4Wk。泥土/水壓屬有利時 γf 不大於 1.0（Note 1）。","x":"Table 2.1 - Load combinations and values of γf for the ultimate limit state","q_en":"A residential building is being checked at ULS. List the main γf values (dead adverse/beneficial, imposed, wind) for the three load combinations in Table 2.1.","m_en":"Comb 1 (Dead + Imposed): Dead 1.4/1.0, Imposed 1.6/0; Comb 2 (Dead + Wind): Dead 1.4/1.0, Wind 1.4; Comb 3 (Dead + Imposed + Wind): Dead 1.2/1.0, Imposed 1.2/0, Wind 1.2. Earth and water pressure take 1.4, 1.4 and 1.2 respectively.","k_en":["1.4Gk + 1.6Qk","1.4Gk (or 1.0Gk) + 1.4Wk","1.2Gk + 1.2Qk + 1.2Wk","Beneficial dead 1.0, beneficial imposed 0","Comb 2/3 wind not less than the 1.5% notional load"],"e_en":"Most common mistake: still using 1.4 on dead load for overturning / uplift checks; use beneficial 1.0Gk + 1.4Wk instead. Where earth/water pressure is beneficial, γf should not exceed 1.0 (Note 1).","doc":"concrete-2013-2020ed","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","scenario","中級"]},{"id":"CON-008","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.2","p":25,"q":"評估 exceptional loads 或局部損毀後的持續穩定性時，γf 應取多少？","a":1.05,"tol":0,"u":"","e":"2.3.2.2：γf = 1.05；配合 2.4.3.2(b) γm：混凝土 1.3、鋼 1.0。用於 alternative load path（移除構件）分析。","x":"should be taken as 1.05 on the defined loads","q_en":"When assessing exceptional loads or continued stability after localised damage, what value of γf should be used?","e_en":"2.3.2.2: γf = 1.05; together with γm per 2.4.3.2(b): concrete 1.3, steel 1.0. Used in alternative load path (member removal) analysis.","doc":"concrete-2013-2020ed","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","num","中級"]},{"id":"CON-009","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.6","p":26,"q":"豎向構件按車輛撞擊（vehicular impact）設計時，ULS 的 γf 應取多少？","a":1.25,"tol":0,"u":"","e":"2.3.2.6：γf 1.25；撞擊力按 Building (Construction) Regulation 17（2.3.1.4(d)）。停車場柱常見檢核。","x":"Where vertical elements are to be designed for vehicular impact γ at ULS should be 1.25.","q_en":"For vertical elements designed for vehicular impact, what γf should be used at ULS?","e_en":"2.3.2.6: γf 1.25; impact force per Building (Construction) Regulation 17 (2.3.1.4(d)). A common check for car park columns.","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","荷載組合 Load combinations","num","中級"]},{"id":"CON-010","t":"mcq","d":2,"tp":"防火 Fire","c":"Table 2.2","p":26,"q":"Fire limit state 下，一般區域（非走火梯、非永久）imposed load 的 γf 是：","o":["1.00","0.80（有充分理據可降至 0.50）","0.33","1.60"],"a":1,"e":"Table 2.2：dead 1.00；永久 imposed（機器、儲存）1.00；走火梯及大堂 1.00；其他 0.80（可減至 0.50）；wind 0.33。Fire engineering 性能化設計時會用。","x":"Note: *The value may be reduced to 0.50 when suitable justification is available","q_en":"At the fire limit state, the γf for imposed load in general areas (not escape stairs, not permanent) is:","o_en":["1.00","0.80 (may be reduced to 0.50 where justified)","0.33","1.60"],"e_en":"Table 2.2: dead 1.00; permanent imposed (machinery, storage) 1.00; escape stairs and lobbies 1.00; others 0.80 (may be reduced to 0.50); wind 0.33. Used in performance-based fire engineering design.","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","防火 Fire","mcq","中級"]},{"id":"CON-011","t":"num","d":2,"tp":"撓度 Deflection","c":"2.3.3.3","p":26,"q":"計算撓度時，一般住宅或寫字樓應把多少百分比的 imposed load 視為 permanent？","a":25,"tol":0,"u":"%","e":"2.3.3.3：住宅/寫字樓 25%；儲存用途至少 75%。用於長期撓度（creep）計算，例如 transfer beam 或長跨板的 long-term deflection。","x":"occupancy, 25% of the imposed load should be considered as permanent and for structures used for","q_en":"When calculating deflection, what percentage of the imposed load should be treated as permanent for ordinary residential or office buildings?","e_en":"2.3.3.3: 25% for residential/office; at least 75% for storage use. Used in long-term (creep) deflection calculations, e.g. long-term deflection of transfer beams or long-span slabs.","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","撓度 Deflection","num","中級"]},{"id":"CON-012","t":"num","d":1,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下 reinforcement 的 γm 是多少？","a":1.15,"tol":0,"u":"","e":"Table 2.3：鋼筋 1.15（FLS 1.00）；混凝土彎曲/軸力 1.50；無箍筋抗剪 1.25；bond 1.40。所以 fy/γm = 0.87fy。","x":"Reinforcement (prestressing steel included) 1.15 1.00","q_en":"What is γm for reinforcement at ULS?","e_en":"Table 2.3: reinforcement 1.15 (FLS 1.00); concrete in flexure/axial load 1.50; shear strength without shear reinforcement 1.25; bond 1.40. Hence fy/γm = 0.87fy.","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","num","基礎"]},{"id":"CON-013","t":"num","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下無箍筋混凝土抗剪強度（concrete shear strength without shear reinforcement）的 γm 是多少？","a":1.25,"tol":0,"u":"","e":"1.25 已包含在 Table 6.3 vc 公式中（vc 除以 γm）。不要重複除。","x":"Concrete shear strength without shear 1.25 1.10","q_en":"What is γm at ULS for concrete shear strength without shear reinforcement?","e_en":"The 1.25 is already included in the vc formula of Table 6.3 (vc is divided by γm). Do not divide by it again.","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","num","中級"]},{"id":"CON-014","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"Bond strength 的 ULS γm 是：","o":["1.15","1.25","1.40","1.50"],"a":2,"e":"Bond strength γm = 1.40（FLS 1.10）。錨固長度及搭接長度表已包括此值。","x":"Bond strength 1.40 1.10","q_en":"The ULS γm for bond strength is:","e_en":"Bond strength γm = 1.40 (FLS 1.10). The anchorage length and lap length tables already include this value.","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","mcq","中級"]},{"id":"CON-015","t":"tf","d":1,"tp":"材料 Materials","c":"3.1.2","p":29,"q":"混凝土 characteristic strength 是指 28 天 cube strength，預期有 5% 試驗結果低於此值。","a":true,"e":"對。3.1.2：28-day cube strength 的 5% fractile。香港用 cube（非 cylinder），與 Eurocode 的 fck 不同，引用外國公式時要換算。","x":"of the cube strength at 28 days below which 5% of all compressive test results would be expected to","q_en":"The characteristic strength of concrete is the 28-day cube strength below which 5% of test results may be expected to fall.","e_en":"True. 3.1.2: the 5% fractile of the 28-day cube strength. Hong Kong uses cubes (not cylinders), unlike fck in the Eurocodes — convert when using foreign formulae.","doc":"concrete-2013-2020ed","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","tf","基礎"]},{"id":"CON-016","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.3","p":29,"q":"以正常重量骨料製造的鋼筋混凝土，最低應使用哪個強度等級？","o":["C15","C20","C25","C30"],"a":1,"e":"3.1.3：RC 最低 C20。但耐久性（Table 4.2）按 exposure condition 往往要求更高等級，如 moderate 需 C35 配 40 mm cover。","x":"For reinforced concrete the lowest grade that should be used is C20 for concrete made with normal","q_en":"What is the minimum strength grade for reinforced concrete made with normal-weight aggregates?","e_en":"3.1.3: minimum C20 for RC. But durability (Table 4.2) often requires a higher grade depending on the exposure condition, e.g. moderate requires C35 with 40 mm cover.","doc":"concrete-2013-2020ed","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-017","t":"num","d":2,"tp":"材料 Materials","c":"Table 3.2","p":30,"q":"Table 3.2：C40 混凝土一般用途（for general use）的 Ec 是多少 kN/mm²？","a":25.1,"tol":0,"u":"kN/mm²","e":"Ec = 3.46√fcu + 3.21：C40 → 25.1 kN/mm²；檢核整體樓宇撓度時可用較高的 26.4。香港花崗岩骨料的 Ec 偏低，比 BS 8110 值細。","x":"C35 23.7 25.1 C40 25.1 26.4","q_en":"Table 3.2: what is Ec (for general use) of C40 concrete, in kN/mm²?","e_en":"Ec = 3.46√fcu + 3.21: C40 → 25.1 kN/mm²; the higher value of 26.4 may be used when checking overall building deflection. Ec with Hong Kong granite aggregate is low, smaller than BS 8110 values.","doc":"concrete-2013-2020ed","pp":"16","tags":["concrete-2013-2020ed","材料 Materials","num","中級"]},{"id":"CON-018","t":"short","d":3,"tp":"材料 Materials","c":"Table 3.2 Note 2","p":30,"q":"Table 3.2 為何有兩欄 Ec？第二欄用於甚麼情況？","m":"第一欄「For general use」用於一般構件設計；第二欄「For checking overall building deflection」較高，用於檢核整體樓宇側向撓度，亦可用於 clause 5.5 transfer structure 層的相對側向撓度檢核。","k":["general use vs overall building deflection","第二欄數值較高","可用於 5.5 transfer 層 relative lateral deflection"],"e":"高樓 ETABS 模型 drift 檢核可用第二欄 Ec，但構件內力/撓度應用第一欄。混淆兩者會低估構件撓度。","x":"Ec value for checking overall building deflection may also be used to check the relative lateral","q_en":"Why does Table 3.2 have two columns of Ec? When is the second column used?","m_en":"The first column, \"For general use\", is for ordinary member design; the second, \"For checking overall building deflection\", is higher and is used to check the overall lateral deflection of the building; it may also be used for the relative lateral deflection check at transfer structure levels under clause 5.5.","k_en":["General use vs overall building deflection","Second column values are higher","May be used for the relative lateral deflection of transfer levels under 5.5"],"e_en":"The second-column Ec may be used for drift checks in a tall-building ETABS model, but member forces/deflections should use the first column. Mixing the two underestimates member deflections.","doc":"concrete-2013-2020ed","pp":"16","tags":["concrete-2013-2020ed","材料 Materials","short","進階"]},{"id":"CON-019","t":"num","d":1,"tp":"材料 Materials","c":"3.1.6","p":31,"q":"Linear elastic analysis 時混凝土的 Poisson's ratio 可取多少？","a":0.2,"tol":0,"u":"","e":"3.1.6：0.2。有限元素板分析（如 SAFE）常用。","x":"Where linear elastic analysis is appropriate, Poisson’s ratio may be taken as 0.2.","q_en":"What value of Poisson's ratio for concrete may be taken in linear elastic analysis?","e_en":"3.1.6: 0.2. Commonly used in finite element slab analysis (e.g. SAFE).","doc":"concrete-2013-2020ed","pp":"17","tags":["concrete-2013-2020ed","材料 Materials","num","基礎"]},{"id":"CON-020","t":"num","d":3,"tp":"材料 Materials","c":"3.1.8","p":33,"q":"Drying shrinkage 公式中，考慮香港碎花崗岩骨料的 Hong Kong modification factor cs 是多少？","a":2.5,"tol":0,"u":"","e":"3.1.8：cs = 2.5，反映本地花崗岩骨料收縮較大。長牆、大面積 podium slab 的收縮裂縫及 movement joint 設計要考慮。","x":"cs is 2.5, Hong Kong modification factor to allow for properties of the crushed granitic aggregate,","q_en":"In the drying shrinkage formula, what is the Hong Kong modification factor cs that accounts for crushed granite aggregate in Hong Kong?","e_en":"3.1.8: cs = 2.5, reflecting the higher shrinkage of local granite aggregate. Consider it for shrinkage cracking and movement joint design of long walls and large podium slabs.","doc":"concrete-2013-2020ed","pp":"19","tags":["concrete-2013-2020ed","材料 Materials","num","進階"]},{"id":"CON-021","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.9","p":34,"q":"正常重量混凝土的線性熱膨脹系數一般取：","o":["6×10⁻⁶/°C","10×10⁻⁶/°C","12×10⁻⁶/°C","20×10⁻⁶/°C"],"a":1,"e":"3.1.9：10×10⁻⁶/°C；鋼筋為 12×10⁻⁶/°C（3.2.5）。溫度應力及 movement joint 間距計算用。","x":"The linear coefficient of thermal expansion for normal weight concrete may normally be taken as","q_en":"The coefficient of linear thermal expansion of normal-weight concrete is generally taken as:","e_en":"3.1.9: 10×10⁻⁶/°C; reinforcement is 12×10⁻⁶/°C (3.2.5). Used for thermal stress and movement joint spacing calculations.","doc":"concrete-2013-2020ed","pp":"20","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-022","t":"mcq","d":1,"tp":"材料 Materials","c":"3.2.1","p":34,"q":"Concrete Code 3.2 適用的 ribbed 鋼筋等級是：","o":["Grade 460","Grade 500A 及 500B","Grade 500B 及 500C（符合 CS2）","Grade 600"],"a":2,"e":"3.2.1：plain grade 250；ribbed grade 500B、500C 符合 CS2。500A 只用於焊接鋼網（3.3.3），不可做彎矩再分配。","x":"grade 500B and grade 500C complying with CS2, or the acceptable standards as appropriate, used","q_en":"The ribbed reinforcement grades covered by Concrete Code 3.2 are:","o_en":["Grade 460","Grade 500A and 500B","Grade 500B and 500C (complying with CS2)","Grade 600"],"e_en":"3.2.1: plain grade 250; ribbed grade 500B and 500C complying with CS2. 500A is only for welded fabric (3.3.3) and does not allow moment redistribution.","doc":"concrete-2013-2020ed","pp":"20","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-023","t":"num","d":1,"tp":"材料 Materials","c":"3.2.4","p":35,"q":"鋼筋的 elastic modulus 應取多少 kN/mm²？","a":200,"tol":0,"u":"kN/mm²","e":"3.2.4：Es = 200 kN/mm²。Modular ratio αe = Es/Ec 用於裂縫及撓度計算。","x":"The elastic modulus for reinforcement should be taken as 200 kN/mm2.","q_en":"What elastic modulus of reinforcement should be taken, in kN/mm²?","e_en":"3.2.4: Es = 200 kN/mm². The modular ratio αe = Es/Ec is used in crack width and deflection calculations.","doc":"concrete-2013-2020ed","pp":"21","tags":["concrete-2013-2020ed","材料 Materials","num","基礎"]},{"id":"CON-024","t":"mcq","d":3,"tp":"鋼筋接駁 Couplers","c":"3.2.8.3","p":36,"q":"Type 1 mechanical coupler 測試：拉至 0.6fy 後的 permanent elongation 不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.5 mm"],"a":1,"e":"3.2.8.3(a)：0.1 mm；grade 500B assembly 抗拉強度 >540 N/mm²，500C >575 N/mm²。Type 2 另需 cyclic test，並用於 ductility 詳細設計（9.9）。","x":"permanent elongation after loading to 0.6fy should not exceed 0.1 mm; and","q_en":"Type 1 mechanical coupler test: after loading to 0.6fy, the permanent elongation should not exceed:","e_en":"3.2.8.3(a): 0.1 mm; tensile strength of the assembly >540 N/mm² for grade 500B and >575 N/mm² for 500C. Type 2 additionally requires a cyclic test and is used for ductility detailing (9.9).","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋接駁 Couplers","mcq","進階"]},{"id":"CON-025","t":"short","d":3,"tp":"鋼筋接駁 Couplers","c":"3.2.8.4","p":36,"q":"Type 2 mechanical coupler 的 static tension test 要求是甚麼？甚麼情況需要用 type 2？","m":"Splicing assembly 在拉力下須達到 bar 的 tensile strength Rm 的 100% 及 fy 的 125% 兩者中較大者；壓力下須達 125% fy；並須通過 Table 3.4 四階段 cyclic tension-and-compression test。Type 2 的使用須符合 clause 9.9（ductility detailing）。","k":["max(100% Rm, 125% fy)","壓力 125% fy","Cyclic test Table 3.4","用於 9.9 ductility 區域"],"e":"在需要 ductility detailing 的 beam-column 塑性鉸區，接駁器要用 type 2，確保鋼筋先於接駁器屈服。提交時要附 coupler 測試報告。","x":"of the tensile strength, Rm, of the bar, and 125 percent of the specified characteristic yield strength,","q_en":"What is the static tension test requirement for a Type 2 mechanical coupler? When is type 2 required?","m_en":"In tension, the splicing assembly must reach the greater of 100% of the bar's tensile strength Rm and 125% of fy; in compression, 125% fy; and it must pass the four-stage cyclic tension-and-compression test of Table 3.4. Use of type 2 shall comply with clause 9.9 (ductility detailing).","k_en":["max(100% Rm, 125% fy)","Compression 125% fy","Cyclic test Table 3.4","Used in 9.9 ductility zones"],"e_en":"In beam-column plastic hinge zones requiring ductility detailing, type 2 couplers are needed so that the bar yields before the coupler. Coupler test reports must accompany the submission.","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋接駁 Couplers","short","進階"]},{"id":"CON-026","t":"tf","d":2,"tp":"鋼筋 Reinforcement","c":"3.3.3","p":36,"q":"使用 Grade 500A 焊接鋼網（welded fabric）的構件可以做 moment redistribution。","a":false,"e":"錯。3.3.3：Grade 500A 鋼網直徑 8–16 mm，任何情況都不容許 moment redistribution，因其延性較低。","x":"to 16 mm. In all conditions, moment redistribution is not allowed.","q_en":"Members using Grade 500A welded fabric may be designed with moment redistribution.","e_en":"False. 3.3.3: Grade 500A fabric, 8–16 mm diameter, does not allow moment redistribution in any case, because of its lower ductility.","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋 Reinforcement","tf","中級"]},{"id":"CON-030","t":"num","d":1,"tp":"耐久性 Durability","c":"4.1.1","p":40,"q":"Concrete Code 第 4 節的耐久性指引是基於多少年的 design working life？","a":50,"tol":0,"u":"年","e":"4.1.1：50 年。如業主要求 100 年（例如公共基建），Table 4.2 的 cover 需按專門文獻加大，不能直接套用。","x":"The guidelines given in the following clauses are based on a design working life of 50 years.","q_en":"The durability guidance in Section 4 of the Concrete Code is based on a design working life of how many years?","e_en":"4.1.1: 50 years. If the client requires 100 years (e.g. public infrastructure), the Table 4.2 covers must be increased based on specialist literature and cannot be applied directly.","u_en":"years","doc":"concrete-2013-2020ed","pp":"26","tags":["concrete-2013-2020ed","耐久性 Durability","num","基礎"]},{"id":"CON-031","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.2.1","p":41,"q":"連續一次澆築的混凝土最小尺寸超過多少時，應考慮降溫措施（如低水化熱材料）？","o":["300 mm","450 mm","600 mm","1000 mm"],"a":2,"e":"4.2.2.1：>600 mm，尤其 cementitious content ≥400 kg/m³ 時。Transfer plate、pile cap 等 mass concrete 須有 thermal control plan（溫度監測、pfa/ggbs、分層澆築）。","x":"than 600 mm, and especially where the cementitious content is 400 kg/m3 or more, measures to reduce","q_en":"Above what minimum dimension of concrete placed in one continuous pour should measures to reduce temperature rise (e.g. low heat of hydration materials) be considered?","e_en":"4.2.2.1: >600 mm, especially when the cementitious content is ≥400 kg/m³. Mass concrete such as transfer plates and pile caps needs a thermal control plan (temperature monitoring, pfa/ggbs, placing in layers).","doc":"concrete-2013-2020ed","pp":"27","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-032","t":"mcq","d":1,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"浴室、廚房等高濕度的室內混凝土表面屬哪一個 exposure condition？","o":["1 Mild","2 Moderate","3 Severe","4 Very Severe"],"a":1,"e":"Table 4.1：Moderate 包括高濕度室內表面及受大雨/乾濕循環的外露表面（fair faced、乾掛幕牆背後）。有瓷磚/批盪保護的外牆屬 Mild。","x":"Internal concrete surfaces exposed to high humidity e.g. bathrooms and kitchens.","q_en":"Which exposure condition applies to interior concrete surfaces subject to high humidity, such as bathrooms and kitchens?","e_en":"Table 4.1: Moderate covers interior surfaces with high humidity and exposed surfaces subject to heavy rain / alternate wetting and drying (fair-faced, behind dry-fixed curtain walls). External walls protected by tiles/render are Mild.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","基礎"]},{"id":"CON-033","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"近海岸、受空氣中海水飛沫影響（但非直接接觸）的混凝土表面屬：","o":["Moderate","Severe","Very Severe","Abrasive"],"a":1,"e":"Table 4.1：Severe（condition 3）。潮汐區至最低低水位下 1 m 則屬 Very Severe（condition 4）。海旁項目最低 C40 配 50 mm cover。","x":"Concrete surfaces exposed to sea water spray through airborne contact but not","q_en":"A concrete surface near the coast exposed to airborne salt spray (but not in direct contact with sea water) is classified as:","e_en":"Table 4.1: Severe (condition 3). The tidal zone down to 1 m below lowest low water is Very Severe (condition 4). Waterfront projects need at least C40 with 50 mm cover.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-034","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(a)","p":42,"q":"實際保護層（actual cover）不應少於 nominal cover 減 5 mm。","a":true,"e":"對。4.2.4.1(a)：nominal cover 是設計及圖則上的數值，實際 cover ≥ nominal − 5 mm。工地驗鋼（cover meter）以此判斷是否合格。","x":"should not be less than the nominal cover minus 5 mm","q_en":"The actual cover should not be less than the nominal cover minus 5 mm.","e_en":"True. 4.2.4.1(a): nominal cover is the value used in design and on drawings; actual cover ≥ nominal − 5 mm. Site inspection of reinforcement (cover meter) uses this as the acceptance criterion.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","tf","中級"]},{"id":"CON-035","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(b)","p":42,"q":"成束（bundled）主筋的保護層不應少於：","o":["最大單支鋼筋直徑","等效截面積單支鋼筋的直徑","兩倍單支直徑","25 mm"],"a":1,"e":"4.2.4.1(b)：主筋 cover ≥ 主筋直徑；成對或成束時，用截面積等於總和的單支等效直徑，並同時保持箍筋的 nominal cover。大直徑柱筋常被忽略。","x":"a single bar of cross-sectional area equal to the sum of their cross-sectional areas","q_en":"The cover to bundled main bars should not be less than:","o_en":["The largest single bar diameter","The diameter of a single bar of equivalent area","Twice the single bar diameter","25 mm"],"e_en":"4.2.4.1(b): cover to main bars ≥ bar diameter; for pairs or bundles, use the diameter of a single bar of area equal to their total, while maintaining the nominal cover to links. Often overlooked for large-diameter column bars.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-036","t":"num","d":1,"tp":"耐久性 Durability","c":"4.2.4.1(d)","p":43,"q":"混凝土直接澆築於泥土上時，nominal cover 一般不應少於多少 mm？","a":75,"tol":0,"u":"mm","e":"4.2.4.1(d)：直接貼泥 75 mm；有足夠 blinding 時 ≥40 mm（不計 blinding）。Pile cap、地樑底筋常用 75 mm。","x":"generally be not less than 75 mm","q_en":"Where concrete is cast directly against earth, the nominal cover should generally not be less than how many mm?","e_en":"4.2.4.1(d): 75 mm directly against earth; ≥40 mm (excluding blinding) where adequate blinding is provided. 75 mm is common for bottom bars of pile caps and ground beams.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","基礎"]},{"id":"CON-037","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Exposure condition 2（Moderate）用 C35 混凝土，nominal cover 是多少 mm？","a":35,"tol":0,"u":"mm","e":"Condition 2：C30 40 mm、C35 35 mm、C40 35 mm、C45+ 30 mm。外牆 fair-faced 常用 C35/35 mm 或 C40/35 mm。另要檢核 Fire Safety Code 的 cover。","x":"Condition 2 -- 40 35 35 30 30 30","q_en":"Table 4.2: for exposure condition 2 (Moderate) with C35 concrete, what is the nominal cover in mm?","e_en":"Condition 2: C30 40 mm, C35 35 mm, C40 35 mm, C45+ 30 mm. Fair-faced external walls commonly use C35/35 mm or C40/35 mm. Also check cover under the Fire Safety Code.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-038","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Exposure condition 3（Severe）容許的最低混凝土等級及對應 nominal cover 是：","o":["C30，40 mm","C35，45 mm","C40，50 mm","C50，55 mm"],"a":2,"e":"Table 4.2：Condition 3 最低 C40（50 mm），C45 以上 45 mm；Condition 4 最低 C50（55 mm）、≥C55 50 mm。","x":"Condition 3 -- -- -- 50 45 45 45","q_en":"For exposure condition 3 (Severe), the minimum permitted concrete grade and corresponding nominal cover are:","o_en":["C30, 40 mm","C35, 45 mm","C40, 50 mm","C50, 55 mm"],"e_en":"Table 4.2: condition 3 minimum C40 (50 mm), C45 and above 45 mm; condition 4 minimum C50 (55 mm), ≥C55 50 mm.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-039","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Condition 1 樓板（slabs only）用 C30 時 nominal cover 是多少 mm？","a":30,"tol":0,"u":"mm","e":"Condition 1 slabs：C20/25–C30 30 mm；C35+ 25 mm；其他構件 C30–C40 30 mm。但 Fire Safety Code 的 FRR 要求可能更大，取兩者較大值。","x":"- slabs only 30 30 25 25 25 25 25","q_en":"Table 4.2: for condition 1 slabs (slabs only) using C30, what is the nominal cover in mm?","e_en":"Condition 1 slabs: C20/25–C30 30 mm; C35+ 25 mm; other members C30–C40 30 mm. The FRR requirement of the Fire Safety Code may be larger — take the greater of the two.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-040","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.4","p":43,"q":"Nominal cover 亦應適用於 mechanical couplers，除非接駁器採用加強抗腐蝕材料。","a":true,"e":"對。4.2.4.4：coupler 外徑較鋼筋大，詳圖時要確保 coupler 表面仍有足夠 cover，否則要加大構件或用抗腐蝕 coupler。","x":"The nominal cover should also be applied to mechanical couplers, if used,","q_en":"Nominal cover should also apply to mechanical couplers, unless the couplers are made of enhanced corrosion-resistant material.","e_en":"True. 4.2.4.4: couplers have a larger outside diameter than the bar; when detailing, ensure the coupler surface still has adequate cover, otherwise enlarge the member or use corrosion-resistant couplers.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","tf","中級"]},{"id":"CON-041","t":"mcq","d":3,"tp":"耐久性 Durability","c":"4.2.5.2","p":44,"q":"若建立系統化檢查以確保符合 w/c ratio 及 cementitious content 限制，Table 4.2 的混凝土等級最多可放寬多少？","o":["2","5","10","不可放寬"],"a":1,"e":"4.2.5.2：最多放寬 5（例如 C40→C35），但不適用於 4.2.5.5 的 pfa/ggbs 混合。實務上較少使用，需要 QA 系統支持。","x":"placed, the concrete grades specified may be relaxed by not more than 5.","q_en":"If a systematic checking regime is established to ensure compliance with the w/c ratio and cementitious content limits, by how much may the concrete grade in Table 4.2 be reduced at most?","o_en":["2","5","10","No reduction permitted"],"e_en":"4.2.5.2: reduced by up to 5 (e.g. C40→C35), but not applicable to pfa/ggbs mixes under 4.2.5.5. Rarely used in practice as it needs a QA system to support it.","doc":"concrete-2013-2020ed","pp":"30","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","進階"]},{"id":"CON-042","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.5.5","p":44,"q":"PFA 佔 total cementitious content 的一般範圍是：","o":["10%–20%","25%–35%","35%–75%","50%–80%"],"a":1,"e":"4.2.5.5：pfa 25%–35%；ggbs 35%–75%。含 pfa/ggbs 要延長養護，拆模時間亦要考慮早期強度較低。","x":"(a) 25% to 35% for pfa","q_en":"The typical range of PFA as a proportion of the total cementitious content is:","e_en":"4.2.5.5: pfa 25%–35%; ggbs 35%–75%. Mixes with pfa/ggbs need extended curing, and striking times must account for the lower early strength.","doc":"concrete-2013-2020ed","pp":"30","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-043","t":"num","d":3,"tp":"耐久性 Durability","c":"4.2.6.1","p":45,"q":"一般強度混凝土（fcu ≤ 60），total cementitious content 超過多少 kg/m³ 時須特別考慮收縮/溫度裂縫風險？","a":550,"tol":0,"u":"kg/m³","e":"4.2.6.1：>550 kg/m³ 要特別考慮；一般 cement 含量限 ≤450 kg/m³。高強度混凝土要控制水化熱及收縮徐變。","x":"and pfa or ggbs in excess of 550 kg/m3 should not be used unless special consideration has","q_en":"For normal-strength concrete (fcu ≤ 60), above what total cementitious content in kg/m³ must the risk of shrinkage/thermal cracking be specially considered?","e_en":"4.2.6.1: >550 kg/m³ requires special consideration; cement content is generally limited to ≤450 kg/m³. For high-strength concrete, control heat of hydration, shrinkage and creep.","doc":"concrete-2013-2020ed","pp":"31","tags":["concrete-2013-2020ed","耐久性 Durability","num","進階"]},{"id":"CON-044","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.5","p":47,"q":"含鋼筋混凝土的最大總氯化物含量（以水泥重量百分比計）是多少 %？","a":0.35,"tol":0,"u":"%","e":"Table 4.5：預應力/蒸汽養護 0.1%；SRPC 0.2%；鋼筋混凝土 0.35%。海砂在香港受嚴格限制，就是為了控制氯化物。","x":"Concrete with reinforcement or other embedded 0.35","q_en":"What is the maximum total chloride content (as a percentage by mass of cement) for concrete containing embedded reinforcement, in %?","e_en":"Table 4.5: prestressed/steam-cured 0.1%; SRPC 0.2%; reinforced concrete 0.35%. Sea sand is strictly restricted in Hong Kong precisely to control chlorides.","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-045","t":"num","d":2,"tp":"耐久性 Durability","c":"4.2.7.3","p":47,"q":"為減低鹼骨料反應（AAR），混凝土的 reactive alkali content（equivalent Na₂O）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"4.2.7.3(d)：≤3.0 kg/m³，供應商須提交 HOKLAS 認可測試證書。Argillaceous dolomitic limestone 骨料不應使用。","x":"should not exceed 3.0 kg;","q_en":"To minimise the risk of alkali-aggregate reaction (AAR), the reactive alkali content (equivalent Na₂O) of concrete should not exceed how many kg per cubic metre?","e_en":"4.2.7.3(d): ≤3.0 kg/m³; the supplier must submit HOKLAS-accredited test certificates. Argillaceous dolomitic limestone aggregate should not be used.","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-046","t":"tf","d":1,"tp":"防火 Fire","c":"4.3","p":47,"q":"按 Concrete Code，耐久性要求的 cover 一定足夠防火，毋須再參考 Fire Safety Code。","a":false,"e":"錯。4.3：某些情況下耐久性 cover 不足以防火，須按 Fire Safety Code 修正 nominal cover，而 Fire Safety Code 亦規定構件最小尺寸。這是典型的 cross-code 檢核。","x":"In some circumstances, the cover specified for durability will not be sufficient for fire protection.","q_en":"Under the Concrete Code, the cover required for durability is always adequate for fire, so the Fire Safety Code need not be consulted.","e_en":"False. 4.3: in some cases the durability cover is insufficient for fire and the nominal cover must be modified according to the Fire Safety Code, which also specifies minimum member dimensions. A typical cross-code check.","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","防火 Fire","tf","基礎"]},{"id":"CON-047","t":"num","d":2,"tp":"防火 Fire","c":"4.3.1.1","p":48,"q":"高強度混凝土中 silica fume 含量不應超過 total cementitious content 的百分之幾？","a":6,"tol":0,"u":"%","e":"4.3.1.1：≤6%，因 silica fume 令混凝土更密實，火災時蒸汽壓力易致 spalling。PFA/GGBS 則有助防止 spalling，沒有額外限制。","x":"should not exceed 6% by weight of the total cementitious content","q_en":"In high-strength concrete, the silica fume content should not exceed what percentage of the total cementitious content?","e_en":"4.3.1.1: ≤6%, because silica fume makes concrete denser, so vapour pressure in a fire readily causes spalling. PFA/GGBS helps prevent spalling and has no additional limit.","doc":"concrete-2013-2020ed","pp":"34","tags":["concrete-2013-2020ed","防火 Fire","num","中級"]},{"id":"CON-048","t":"scenario","d":3,"tp":"防火 Fire","c":"4.3.1.2","p":48,"q":"一幢住宅的 C80 柱需要防火爆裂（spalling）措施。按 4.3.1.2 可選用哪些方法？若改用 C90 又有何額外要求？","m":"至少採用一種：Method A 15 mm cover 的鋼網（線徑 ≥2 mm、網距 ≤50×50 mm，主筋 cover ≥40 mm）；Method B 混凝土加 ≥1.5 kg/m³ monofilament polypropylene fibres（6–12 mm 長、18–32 μm、熔點 <180°C）；Method C 經驗證的保護層；Method D 經驗證的混凝土配比。超過 C80 須至少一次火災測試，證明在設計 FRR 期間主筋不外露。","k":["Method A 鋼網","Method B ≥1.5 kg/m³ PP fibres","Method C 保護層 / Method D 配比","> C80 需 fire test"],"e":"實務上 Method B（PP fibre）最常用，要在混凝土規格及 mix design 註明。C80 本身不需 fire test，但 >C80（如 C90、C100）需要。","x":"(b) Method B: Include in the concrete mix not less than 1.5 kg/m3 of monofilament propylene fibres.","q_en":"A C80 column in a residential building needs measures against fire spalling. Which methods may be used under 4.3.1.2? What additional requirement applies if C90 is used instead?","m_en":"Adopt at least one: Method A — steel fabric at 15 mm cover (wire ≥2 mm, mesh ≤50×50 mm, main bar cover ≥40 mm); Method B — add ≥1.5 kg/m³ monofilament polypropylene fibres to the concrete (6–12 mm long, 18–32 μm, melting point <180°C); Method C — a proven protective layer; Method D — a proven concrete mix. Above C80, at least one fire test is required to demonstrate that the main bars are not exposed during the design FRR.","k_en":["Method A steel fabric","Method B ≥1.5 kg/m³ PP fibres","Method C protective layer / Method D mix design","> C80 requires a fire test"],"e_en":"In practice Method B (PP fibre) is the most common and must be stated in the concrete specification and mix design. C80 itself needs no fire test, but >C80 (e.g. C90, C100) does.","doc":"concrete-2013-2020ed","pp":"34","tags":["concrete-2013-2020ed","防火 Fire","scenario","進階"]},{"id":"CON-050","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(a)","p":50,"q":"連續（continuous）樑的跨度少於整體深度的多少倍時，應當作 deep beam？","o":["2.0","2.5","3.0","4.0"],"a":1,"e":"5.2.1.1(a)：簡支 <2h、連續 <2.5h 屬 deep beam，第 6.1.2 節一般樑設計不適用，要用 strut-and-tie 等專門方法。Transfer girder 常屬此類。","x":"simply supported spans and 2.5 times the overall depth for continuous spans. Otherwise it","q_en":"A continuous beam should be treated as a deep beam when its span is less than how many times its overall depth?","e_en":"5.2.1.1(a): simply supported <2h, continuous <2.5h is a deep beam; the general beam design of Section 6.1.2 does not apply and specialist methods such as strut-and-tie are needed. Transfer girders often fall into this category.","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","中級"]},{"id":"CON-051","t":"mcq","d":1,"tp":"結構分析 Analysis","c":"5.2.1.1(e)","p":50,"q":"按 Concrete Code，截面深度超過寬度多少倍時應當作 wall 而非 column？","o":["3","4","5","6"],"a":1,"e":"5.2.1.1(e)：depth ≤ 4 × width 為 column，否則屬 wall。影響配筋要求（9.5 vs 9.6）及 FRR 最小尺寸（Fire Code 表格分柱和牆）。","x":"(e) A column is a member for which the section depth does not exceed 4 times its width. Otherwise","q_en":"Under the Concrete Code, a section should be treated as a wall rather than a column when its depth exceeds how many times its width?","e_en":"5.2.1.1(e): depth ≤ 4 × width is a column, otherwise a wall. This affects reinforcement requirements (9.5 vs 9.6) and FRR minimum dimensions (the Fire Code tables separate columns and walls).","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","基礎"]},{"id":"CON-052","t":"tf","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(c)","p":50,"q":"四邊支承的矩形板，長短跨比大於 2 時，其中部可視為 one-way spanning。","a":true,"e":"對。5.2.1.1(c)(ii)：ly/lx > 2 可按單向板。另 5.2.1.1(b)：板的最小尺寸須 ≥5 倍板厚才算 slab。","x":"longer to shorter span greater than 2.","q_en":"For a rectangular slab supported on four sides with a long-to-short span ratio greater than 2, the central part may be considered as one-way spanning.","e_en":"True. 5.2.1.1(c)(ii): ly/lx > 2 may be treated as one-way. Also 5.2.1.1(b): a slab's minimum dimension must be ≥5 times its thickness to count as a slab.","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","tf","中級"]},{"id":"CON-053","t":"mcq","d":3,"tp":"結構分析 Analysis","c":"5.2.1.1(d)","p":50,"q":"Ribbed slab 若要毋須當作獨立構件分析，肋距（rib spacing）不應超過：","o":["900 mm","1200 mm","1500 mm","2000 mm"],"a":2,"e":"5.2.1.1(d)：肋距 ≤1500 mm、肋深 ≤4 倍肋寬、翼緣厚 ≥ max(1/10 淨距, 50 mm)、橫肋淨距 ≤10 倍板深。","x":"(i) the rib spacing does not exceed 1500 mm and the depth of the rib below the flange does","q_en":"For a ribbed slab not to require analysis as separate members, the rib spacing should not exceed:","e_en":"5.2.1.1(d): rib spacing ≤1500 mm, rib depth ≤4 times rib width, flange thickness ≥ max(1/10 clear distance, 50 mm), clear spacing of transverse ribs ≤10 times slab depth.","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","進階"]},{"id":"CON-054","t":"tf","d":3,"tp":"結構分析 Analysis","c":"5.2.1.2(b)","p":55,"q":"與支承整體澆築的樑，支座處的 critical design moment 不應少於 full fixed end moment 的 0.65 倍。","a":true,"e":"對。5.2.1.2(b) Note：取支座面彎矩，但不少於 0.65 倍 fixed end moment；圓柱取柱面內 0.2φ。防止過度削減支座彎矩。","x":"Note: The critical design moment at the support should not be less than 0.65 that of the full","q_en":"For a beam monolithic with its support, the critical design moment at the support should not be less than 0.65 times the full fixed end moment.","e_en":"True. 5.2.1.2(b) Note: take the moment at the support face, but not less than 0.65 times the fixed end moment; for circular columns take 0.2φ inside the column face. Prevents excessive reduction of support moments.","doc":"concrete-2013-2020ed","pp":"41","tags":["concrete-2013-2020ed","結構分析 Analysis","tf","進階"]},{"id":"CON-055","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.5.2","p":55,"q":"Sub-frame 分析豎向荷載時，以下哪一個不是 Code 列明的 critical loading arrangement？","o":["所有跨度 1.4Gk + 1.6Qk","隔跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","任何相鄰兩跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","所有跨度 1.0Gk + 1.6Qk"],"a":3,"e":"5.2.5.2 三種排列：全跨最大、隔跨最大、相鄰兩跨最大（其餘 1.0Gk）。Pattern loading 對連續樑跨中彎矩及柱彎矩重要。","x":"(c) any two adjacent spans loaded with the maximum design ultimate load (1.4Gk + 1.6Qk), and all","q_en":"When analysing a sub-frame for vertical loads, which of the following is NOT one of the critical loading arrangements listed in the Code?","o_en":["All spans 1.4Gk + 1.6Qk","Alternate spans 1.4Gk + 1.6Qk, other spans 1.0Gk","Any two adjacent spans 1.4Gk + 1.6Qk, other spans 1.0Gk","All spans 1.0Gk + 1.6Qk"],"e_en":"5.2.5.2 gives three arrangements: all spans maximum, alternate spans maximum, two adjacent spans maximum (others 1.0Gk). Pattern loading matters for continuous beam midspan moments and column moments.","doc":"concrete-2013-2020ed","pp":"41","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","中級"]},{"id":"CON-056","t":"num","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.2","p":57,"q":"超過四層、由框架提供側向穩定的結構，彎矩再分配最多是多少 %？","a":10,"tol":0,"u":"%","e":"5.2.9.2：限 10%，condition 3 的 70% 改為 90%。一般情況（5.2.9.1）只適用於 ≤C70，截面抗彎須 ≥70% 彈性彎矩。","x":"The provisions of clause 5.2.9.1 apply except that redistribution is limited to 10% and the value given","q_en":"For structures over four storeys where lateral stability is provided by the frame, what is the maximum moment redistribution in %?","e_en":"5.2.9.2: limited to 10%, with 70% in condition 3 changed to 90%. The general case (5.2.9.1) applies only to ≤C70, and the moment of resistance must be ≥70% of the elastic moment.","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","彎矩再分配 Redistribution","num","中級"]},{"id":"CON-057","t":"tf","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.1","p":57,"q":"C80 混凝土的構件可按 5.2.9.1 進行彎矩再分配。","a":false,"e":"錯。5.2.9.1 只適用於不超過 C70；而 70 < fcu ≤ 100 的 x ≤ 0.33d 限制亦註明「no moment redistribution」。","x":"For concrete of strength grade not exceeding C70, redistribution of the moments obtained by means","q_en":"Members of C80 concrete may have moments redistributed under 5.2.9.1.","e_en":"False. 5.2.9.1 applies only up to C70; and the x ≤ 0.33d limit for 70 < fcu ≤ 100 also states \"no moment redistribution\".","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","彎矩再分配 Redistribution","tf","中級"]},{"id":"CON-058","t":"num","d":2,"tp":"二階效應 Second order","c":"5.3","p":57,"q":"二階效應（second order effects）少於一階效應的百分之幾時可以忽略？","a":10,"tol":0,"u":"%","e":"5.3：<10% 可忽略。高樓 P-Δ 分析時用此判斷；否則要在變形狀態下驗證平衡與抗力。","x":"Second order effects may be ignored if they are less than 10% of the corresponding first order effects.","q_en":"Second order effects may be ignored when they are less than what percentage of the first order effects?","e_en":"5.3: <10% may be ignored. Used to decide on P-Δ analysis for tall buildings; otherwise equilibrium and resistance must be verified in the deformed state.","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","二階效應 Second order","num","中級"]},{"id":"CON-059","t":"scenario","d":3,"tp":"轉換結構 Transfer","c":"5.5","p":58,"q":"一幢住宅 podium 上設 transfer plate，其下層層高 Hs = 5.6 m。Transfer 層相對下層的 lateral deflection 上限是多少？分析 transfer structure 還須考慮哪些因素？","m":"上限 Hs/700 = 5600/700 = 8 mm。還須考慮：施工及澆築次序、臨時及永久荷載、支承構件不同軸向縮短、剪力牆的局部效應、上下構件剛度、transfer 撓度、transfer 上的側向剪力及 sidesway。","k":["Hs/700 = 8 mm","construction/pouring sequence","differential axial shortening","local effect of shear walls","lateral shear & sidesway"],"e":"5.5 是 BD 審批 transfer 結構的重點。常見問題：模型未考慮澆築次序（部分荷載由模板承托）及上部剪力牆與 transfer plate 的共同作用（arching）。檢核 Hs/700 時可用 Table 3.2 第二欄 Ec。","x":"should not exceed Hs/700, where Hs is the height of the storey below the transfer structure;","q_en":"A residential podium has a transfer plate; the storey height below it is Hs = 5.6 m. What is the limit on the lateral deflection of the transfer level relative to the storey below? What other factors must be considered in analysing the transfer structure?","m_en":"Limit Hs/700 = 5600/700 = 8 mm. Also consider: construction and casting sequence, temporary and permanent loads, differential axial shortening of supporting members, local effects of shear walls, stiffness of members above and below, transfer deflection, lateral shear on the transfer structure and sidesway.","e_en":"5.5 is a key focus of BD approval of transfer structures. Common problems: the model ignores the casting sequence (part of the load carried by formwork) and the interaction between shear walls above and the transfer plate (arching). The second-column Ec of Table 3.2 may be used when checking Hs/700.","doc":"concrete-2013-2020ed","pp":"44","tags":["concrete-2013-2020ed","轉換結構 Transfer","scenario","進階"]},{"id":"CON-060","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.1(d)","p":59,"q":"簡支或連續樑的側向穩定：約束點之間的淨距不應超過：","o":["40bc 或 150bc²/d（取較小）","60bc 或 250bc²/d（取較小）","25bc 或 100bc²/d（取較小）","100bc"],"a":1,"e":"6.1.2.1(d)：簡支/連續 60bc 或 250bc²/d；懸臂 25bc 或 100bc²/d。bc 為受壓翼緣寬度。長跨窄樑（如外牆 spandrel）要檢核。","x":"(i) for simply-supported or continuous beams: 60bc or 250bc2/d if less; or","q_en":"Lateral stability of simply supported or continuous beams: the clear distance between lateral restraints should not exceed:","o_en":["40bc or 150bc²/d (whichever is less)","60bc or 250bc²/d (whichever is less)","25bc or 100bc²/d (whichever is less)","100bc"],"e_en":"6.1.2.1(d): simply supported/continuous 60bc or 250bc²/d; cantilevers 25bc or 100bc²/d. bc is the compression flange width. Check long-span narrow beams (e.g. external spandrels).","doc":"concrete-2013-2020ed","pp":"45","tags":["concrete-2013-2020ed","彎曲設計 Flexure","mcq","中級"]},{"id":"CON-061","t":"short","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.3","p":59,"q":"使用 Table 6.1（均布荷載連續樑彎矩及剪力係數）有哪些前提？","m":"(a) Qk 不超過 Gk；(b) 荷載大致均布於三跨或以上；(c) 跨度差異不超過最長跨 15%。並且不可再對 Table 6.1 所得彎矩作再分配。","k":["Qk ≤ Gk","≥3 跨均布","跨度差 ≤15%","不可再分配"],"e":"Table 6.1 係數如 end span 0.09Fl、first interior support −0.11Fl。手算快速檢核時常用，但 podium 重荷載（Qk>Gk）不適用。","x":"(a) characteristic imposed load Qk may not exceed characteristic dead load Gk;","q_en":"What are the conditions for using Table 6.1 (moment and shear coefficients for continuous beams under uniform load)?","m_en":"(a) Qk does not exceed Gk; (b) loads are substantially uniformly distributed over three or more spans; (c) spans do not differ by more than 15% of the longest. The moments obtained from Table 6.1 must not be further redistributed.","k_en":["Qk ≤ Gk","Uniform load over ≥3 spans","Span difference ≤15%","No further redistribution"],"e_en":"Table 6.1 coefficients such as end span 0.09Fl and first interior support −0.11Fl. Commonly used for quick hand checks, but not applicable to heavily loaded podiums (Qk>Gk).","doc":"concrete-2013-2020ed","pp":"45","tags":["concrete-2013-2020ed","彎曲設計 Flexure","short","中級"]},{"id":"CON-062","t":"num","d":1,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"只受彎的截面，lever arm z 不應大於有效深度 d 的多少倍？","a":0.95,"tol":0,"u":"","e":"6.1.2.4(a)(v)：z ≤ 0.95d。輕彎矩時公式 6.10 算出的 z 可能 >0.95d，要封頂。","x":"to be greater than 0.95 times the effective depth.","q_en":"For a section in flexure only, the lever arm z should not be greater than how many times the effective depth d?","e_en":"6.1.2.4(a)(v): z ≤ 0.95d. For small moments, equation 6.10 may give z >0.95d, so cap it.","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","num","基礎"]},{"id":"CON-063","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(b)","p":60,"q":"C50 混凝土（45 < fcu ≤ 70），無再分配或 ≤10%，中性軸深度 x 上限是：","o":["0.5d","0.4d","0.33d","0.25d"],"a":1,"e":"6.1.2.4(b)：fcu ≤45 → 0.5d；45–70 → 0.4d；70–100 → 0.33d（且不可再分配）。高強度混凝土延性較低，所以限制更嚴。","x":"x ≤ 0.4d for 45 < fcu ≤ 70 N/mm2 ; or","q_en":"For C50 concrete (45 < fcu ≤ 70) with no redistribution or ≤10%, the upper limit of the neutral axis depth x is:","e_en":"6.1.2.4(b): fcu ≤45 → 0.5d; 45–70 → 0.4d; 70–100 → 0.33d (and no redistribution). High-strength concrete is less ductile, hence stricter limits.","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","mcq","中級"]},{"id":"CON-064","t":"num","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(c)","p":61,"q":"fcu ≤ 45 N/mm²、再分配不超過 10% 時，K' 值是多少？","a":0.156,"tol":0,"u":"","e":"K' = 0.156（fcu ≤45）、0.120（45–70）、0.094（70–100）。K = M/bd²fcu > K' 時需要受壓鋼筋。常見錯誤：C60 仍用 0.156。","x":"K’ = 0.156 for fcu ≤45 N/mm2 ; or","q_en":"For fcu ≤ 45 N/mm² and redistribution not exceeding 10%, what is K'?","e_en":"K' = 0.156 (fcu ≤45), 0.120 (45–70), 0.094 (70–100). Compression reinforcement is needed when K = M/bd²fcu > K'. Common error: still using 0.156 for C60.","doc":"concrete-2013-2020ed","pp":"47","tags":["concrete-2013-2020ed","彎曲設計 Flexure","num","中級"]},{"id":"CON-065","t":"tf","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"樑承受的設計軸向壓力不超過 0.1fcu × 截面面積時，分析時可忽略該軸力。","a":true,"e":"對。6.1.2.4(a)：≤0.1fcu·Ac 可忽略。例如 podium 樑受少量軸力；但受拉軸力（如 tie beam）不在此列，要另計。","x":"the design ultimate axial force may be ignored if it does not exceed 0.1fcu times the cross-","q_en":"When the design axial compression on a beam does not exceed 0.1fcu × cross-sectional area, the axial force may be ignored in analysis.","e_en":"True. 6.1.2.4(a): ≤0.1fcu·Ac may be ignored, e.g. podium beams with small axial forces; but axial tension (e.g. tie beams) is not covered and must be allowed for separately.","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","tf","中級"]},{"id":"CON-066","t":"mcq","d":1,"tp":"抗剪 Shear","c":"6.1.2.5(a)","p":62,"q":"樑的設計剪應力 v 無論配多少箍筋都不應超過：","o":["0.63√fcu 或 5 N/mm²","0.8√fcu 或 7.0 N/mm²（取較小）","√fcu","0.8fcu"],"a":1,"e":"6.1.2.5(a)：v ≤ min(0.8√fcu, 7.0 N/mm²)，已含 γm 1.25。超過即要加大截面，不能靠加箍筋解決。Transfer girder 常由此控制截面。","x":"In no case should v exceed 0.8√fcu or 7.0 N/mm2, whichever is the lesser, whatever shear","q_en":"Regardless of the shear reinforcement provided, the design shear stress v in a beam should not exceed:","o_en":["0.63√fcu or 5 N/mm²","0.8√fcu or 7.0 N/mm² (whichever is less)","√fcu","0.8fcu"],"e_en":"6.1.2.5(a): v ≤ min(0.8√fcu, 7.0 N/mm²), including γm 1.25. If exceeded, the section must be enlarged — adding links will not help. Transfer girder sections are often governed by this.","doc":"concrete-2013-2020ed","pp":"48","tags":["concrete-2013-2020ed","抗剪 Shear","mcq","基礎"]},{"id":"CON-067","t":"num","d":2,"tp":"抗剪 Shear","c":"Table 6.2","p":62,"q":"fcu ≤ 40 N/mm² 時，最少箍筋（minimum links）提供的設計剪力抗力 vr 是多少 N/mm²？","a":0.4,"tol":0,"u":"N/mm²","e":"Table 6.2 Note 2：vr = 0.4（fcu ≤40）；fcu >40 時 0.4(fcu/40)^(2/3)，fcu 上限取 80。所以高強度混凝土最少箍筋量會增加。","x":"Minimum links provide a design shear resistance of vr where vr = 0.4 for fcu ≤ 40 N/mm2 or","q_en":"For fcu ≤ 40 N/mm², what design shear resistance vr is provided by minimum links, in N/mm²?","e_en":"Table 6.2 Note 2: vr = 0.4 (fcu ≤40); for fcu >40, 0.4(fcu/40)^(2/3), with fcu capped at 80. Hence minimum links increase for high-strength concrete.","doc":"concrete-2013-2020ed","pp":"48","tags":["concrete-2013-2020ed","抗剪 Shear","num","中級"]},{"id":"CON-068","t":"mcq","d":2,"tp":"抗剪 Shear","c":"6.1.2.5(d)","p":63,"q":"樑的箍筋沿跨度方向間距不應超過：","o":["0.5d","0.75d","d","300 mm"],"a":1,"e":"6.1.2.5(d)：沿跨 ≤0.75d；橫向任何受拉筋距箍筋腳 ≤150 mm，且橫向間距 ≤d。闊扁樑要用多肢箍。","x":"The spacing of links in the direction of the span should not exceed 0.75d.","q_en":"The spacing of links along the span of a beam should not exceed:","e_en":"6.1.2.5(d): along the span ≤0.75d; transversely, no tension bar should be more than 150 mm from a link leg, and transverse spacing ≤d. Wide shallow beams need multi-leg links.","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","mcq","中級"]},{"id":"CON-069","t":"num","d":2,"tp":"抗剪 Shear","c":"Table 6.3","p":63,"q":"Table 6.3：100As/bvd = 1.00，有效深度 d ≥ 400 mm，vc 是多少 N/mm²（fcu = 25）？","a":0.63,"tol":0,"u":"N/mm²","e":"Table 6.3 最右欄（400 mm）1.00 → 0.63 N/mm²。fcu >25 可乘 (fcu/25)^(1/3)，fcu 上限 80。As 須延伸至少 d 過該截面才可計入。","x":"1.00 0.84 0.81 0.78 0.75 0.73 0.71 0.68 0.63","q_en":"Table 6.3: with 100As/bvd = 1.00 and effective depth d ≥ 400 mm, what is vc in N/mm² (fcu = 25)?","e_en":"Table 6.3, rightmost column (400 mm), 1.00 → 0.63 N/mm². For fcu >25 multiply by (fcu/25)^(1/3), with fcu capped at 80. As counts only if it extends at least d beyond the section.","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","num","中級"]},{"id":"CON-070","t":"tf","d":3,"tp":"抗剪 Shear","c":"Table 6.3 Note 3","p":63,"q":"計算 vc 的 (fcu/25)^(1/3) 放大系數時，fcu 可取實際等級如 C100。","a":false,"e":"錯。Table 6.3 Note 3：fcu 不應取大於 80 N/mm²。100As/bvd 不大於 3；(400/d)^(1/4) 對無箍筋構件不少於 0.67。","x":"The value of fcu should not be taken as greater than 80 N/mm2.","q_en":"When calculating the (fcu/25)^(1/3) enhancement factor for vc, fcu may be taken as the actual grade, e.g. C100.","e_en":"False. Table 6.3 Note 3: fcu should not be taken as greater than 80 N/mm². 100As/bvd not greater than 3; (400/d)^(1/4) not less than 0.67 for members without shear reinforcement.","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","tf","進階"]},{"id":"CON-071","t":"short","d":3,"tp":"抗剪 Shear","c":"6.1.2.5(g)","p":64,"q":"甚麼是「enhanced shear strength of sections close to supports」？適用條件為何？","m":"剪力破壞面一般約 30° 傾斜；若截面距支座面或集中荷載少於 2d，破壞面被迫更陡，可把 vc 提升至 2d·vc/av（av 為破壞面跨越長度），但支座面 v 仍須 < min(0.8√fcu, 7.0)。受拉鋼筋須在破壞面兩側延伸至少 d 或有等效錨固。","k":["av < 2d","vc → 2d·vc/av","支座面 v 上限不變","受拉筋兩側延伸 ≥ d"],"e":"Pile cap、corbel、近支座集中荷載的 transfer beam 常用。常見錯誤：鋼筋錨固不足仍用 enhancement；以及 rigid pile cap 簡化分析時（6.7.3.3(b)）不可用。","x":"support by increasing the design concrete shear stress vc to 2dvc/av, where av is the length of","q_en":"What is \"enhanced shear strength of sections close to supports\"? Under what conditions does it apply?","m_en":"Shear failure planes are normally inclined at about 30°; if the section is less than 2d from a support face or concentrated load, the failure plane is forced to be steeper, and vc may be increased to 2d·vc/av (av = length of the failure plane), but v at the support face must still be < min(0.8√fcu, 7.0). Tension reinforcement must extend at least d on each side of the failure plane or have equivalent anchorage.","k_en":["av < 2d","vc → 2d·vc/av","Limit on v at support face unchanged","Tension bars extend ≥ d on both sides"],"e_en":"Common for pile caps, corbels and transfer beams with concentrated loads near supports. Common errors: using the enhancement with inadequate bar anchorage; and using it in the simplified rigid pile cap analysis (6.7.3.3(b)), where it is not allowed.","doc":"concrete-2013-2020ed","pp":"50","tags":["concrete-2013-2020ed","抗剪 Shear","short","進階"]},{"id":"CON-072","t":"mcq","d":2,"tp":"沖剪 Punching","c":"6.1.5.7(f)","p":88,"q":"沖剪（punching shear）檢核首先在距加載面多遠的周界進行？","o":["0.5d","d","1.5d","2d"],"a":2,"e":"6.1.5.7(f)：先檢核 1.5d 周界，v ≤ vc 即可。需要箍筋時第一圈約在 0.5d，含 ≥40% 計算面積；周界間距 ≤0.75d，同圈間距 ≤1.5d。","x":"The shear capacity is checked first on a perimeter 1.5d from the face of the loaded area. If the","q_en":"The punching shear check is first carried out on a perimeter at what distance from the loaded area?","e_en":"6.1.5.7(f): check the 1.5d perimeter first; v ≤ vc is sufficient. Where links are needed, the first perimeter is at about 0.5d, containing ≥40% of the calculated area; perimeter spacing ≤0.75d, spacing within a perimeter ≤1.5d.","doc":"concrete-2013-2020ed","pp":"74","tags":["concrete-2013-2020ed","沖剪 Punching","mcq","中級"]},{"id":"CON-073","t":"tf","d":3,"tp":"沖剪 Punching","c":"6.1.5.7(e)","p":88,"q":"沖剪 v 超過 2vc 時，仍可直接用 equation 6.45 計算所需箍筋。","a":false,"e":"錯。6.1.5.7(e)：6.44/6.45 不適用於 v > 2vc；若用其他加強系統（如 shear studs）須另提供理據。箍筋只適用於 >200 mm 厚板。","x":"Equations 6.44 and 6.45 should not be applied where the shear stress v exceeds 2 vc.","q_en":"When punching shear v exceeds 2vc, the required links may still be calculated directly with equation 6.45.","e_en":"False. 6.1.5.7(e): 6.44/6.45 do not apply to v > 2vc; other systems (e.g. shear studs) need separate justification. Links are only effective in slabs >200 mm thick.","doc":"concrete-2013-2020ed","pp":"74","tags":["concrete-2013-2020ed","沖剪 Punching","tf","進階"]},{"id":"CON-074","t":"mcq","d":1,"tp":"柱 Columns","c":"6.2.1.1(b)","p":90,"q":"Braced column 在 lex/h 及 ley/b 均少於多少時可當作 short column？","o":["10","12","15","20"],"a":2,"e":"6.2.1.1(b)：braced <15，unbraced <10。Slender column 要計 deflection-induced additional moment（6.2.1.3）。","x":"A column may be considered as short when both ratios lex /h and ley /b are less than 15 (braced)","q_en":"A braced column may be considered short when both lex/h and ley/b are less than:","e_en":"6.2.1.1(b): braced <15, unbraced <10. Slender columns must include the deflection-induced additional moment (6.2.1.3).","doc":"concrete-2013-2020ed","pp":"76","tags":["concrete-2013-2020ed","柱 Columns","mcq","基礎"]},{"id":"CON-075","t":"num","d":2,"tp":"柱 Columns","c":"Table 6.11","p":91,"q":"Braced column 上下兩端均為 end condition 1，β 值是多少？","a":0.75,"tol":0,"u":"","e":"Table 6.11：braced 1-1 為 0.75，3-3 為 1.00；unbraced（Table 6.12）1-1 為 1.2，cantilever 4-1 為 2.2。le = β·lo。","x":"1 0.75 0.80 0.90","q_en":"For a braced column with end condition 1 at both top and bottom, what is β?","e_en":"Table 6.11: braced 1-1 is 0.75, 3-3 is 1.00; unbraced (Table 6.12) 1-1 is 1.2, cantilever 4-1 is 2.2. le = β·lo.","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-076","t":"mcq","d":2,"tp":"柱 Columns","c":"6.2.1.1(e)(ii)","p":91,"q":"柱端與兩側比柱深度淺的樑或板整體連接，屬哪一個 end condition？","o":["Condition 1","Condition 2","Condition 3","Condition 4"],"a":1,"e":"Condition 1：樑深 ≥ 柱尺寸（或設計承受彎矩的基礎）；Condition 2：較淺樑/板；Condition 3：只提供名義約束；Condition 4：無約束（懸臂柱自由端）。Flat slab 柱通常屬 condition 2。","x":"Condition 2. The end of the column is connected monolithically to beams or","q_en":"A column end connected monolithically to beams or slabs on either side that are shallower than the column dimension is which end condition?","e_en":"Condition 1: beams at least as deep as the column dimension (or a foundation designed to carry moment); Condition 2: shallower beams/slabs; Condition 3: nominal restraint only; Condition 4: unrestrained (free end of a cantilever column). Flat slab columns are usually condition 2.","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","mcq","中級"]},{"id":"CON-077","t":"num","d":2,"tp":"柱 Columns","c":"6.2.1.2(d)","p":92,"q":"柱的最小偏心 emin 取柱尺寸的 0.05 倍，但不多於多少 mm？","a":20,"tol":0,"u":"mm","e":"6.2.1.2(d)：emin = 0.05h ≤ 20 mm；雙向彎曲只需一次一軸滿足。軸心受壓柱亦必須計這個名義彎矩。","x":"0.05 times the overall dimension of the column in the plane of bending considered but not more","q_en":"The minimum eccentricity emin of a column is taken as 0.05 times the column dimension, but not more than how many mm?","e_en":"6.2.1.2(d): emin = 0.05h ≤ 20 mm; for biaxial bending it need only be satisfied about one axis at a time. Axially loaded columns must also include this nominal moment.","doc":"concrete-2013-2020ed","pp":"78","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-078","t":"num","d":2,"tp":"柱 Columns","c":"6.2.1.1(f)","p":91,"q":"一般情況下，柱端約束之間的淨高 lo 不應超過柱最小厚度的多少倍？","a":60,"tol":0,"u":"倍","e":"6.2.1.1(f)：lo ≤ 60b。懸臂 unbraced 柱另受 6.47：lo ≤ 100b²/h ≤ 60b。","x":"Generally, the clear distance, lo, between end restraints should not exceed 60 times the","q_en":"In general, the clear height lo between end restraints of a column should not exceed how many times its least lateral dimension?","e_en":"6.2.1.1(f): lo ≤ 60b. Unbraced cantilever columns are further limited by 6.47: lo ≤ 100b²/h ≤ 60b.","u_en":"times","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-079","t":"scenario","d":3,"tp":"穩健性 Robustness","c":"6.4.1.4","p":107,"q":"一幢 12 層 RC 樓宇，平均 Gk + Qk = 10 kPa，lr = 7.5 m。試求 internal tie 所需拉力（kN/m）。","m":"Ft = min(20 + 4×12, 60) = min(68, 60) = 60 kN。Internal tie = max[(Gk+Qk)/7.5 × lr/5 × Ft, 1.0Ft] = max[10/7.5 × 7.5/5 × 60, 60] = max[120, 60] = 120 kN/m。鋼筋可取 γm = 1.0（fy）。","k":["Ft = min(20+4n₀, 60) = 60","(Gk+Qk)/7.5 × lr/5 × Ft = 120 kN/m","不少於 1.0Ft","γm = 1.0"],"e":"Tie 可利用已有樓板/樑鋼筋，但要連續及妥善搭接（8.7）。常見錯誤：Ft 未封頂 60 kN、或誤用 design load 而非 characteristic Gk+Qk。","x":"Ft is the lesser of (20 + 4no) or 60, where no is the number of storeys in the structure;","q_en":"A 12-storey RC building has average Gk + Qk = 10 kPa and lr = 7.5 m. Find the required internal tie force (kN/m).","m_en":"Ft = min(20 + 4×12, 60) = min(68, 60) = 60 kN. Internal tie = max[(Gk+Qk)/7.5 × lr/5 × Ft, 1.0Ft] = max[10/7.5 × 7.5/5 × 60, 60] = max[120, 60] = 120 kN/m. Reinforcement may use γm = 1.0 (fy).","k_en":["Ft = min(20+4n₀, 60) = 60","(Gk+Qk)/7.5 × lr/5 × Ft = 120 kN/m","Not less than 1.0Ft","γm = 1.0"],"e_en":"Ties may use existing slab/beam reinforcement, but must be continuous and properly lapped (8.7). Common errors: not capping Ft at 60 kN, or using the design load instead of the characteristic Gk+Qk.","doc":"concrete-2013-2020ed","pp":"93","tags":["concrete-2013-2020ed","穩健性 Robustness","scenario","進階"]},{"id":"CON-080","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"6.4.1.5","p":108,"q":"Peripheral tie 應設於距樓宇邊緣多少範圍內（或在外牆內）？","o":["0.5 m","1.0 m","1.2 m","2.0 m"],"a":2,"e":"6.4.1.5：peripheral tie 拉力 1.0Ft，位於邊緣 1.2 m 內或外牆內。","x":"resisting a tensile force (in kN) of 1.0Ft, located within 1.2 m of the edge of the building or within the","q_en":"Within what distance of the building edge (or within the perimeter wall) should the peripheral tie be located?","e_en":"6.4.1.5: peripheral tie force 1.0Ft, located within 1.2 m of the edge or within the perimeter wall.","doc":"concrete-2013-2020ed","pp":"94","tags":["concrete-2013-2020ed","穩健性 Robustness","mcq","中級"]},{"id":"CON-081","t":"num","d":2,"tp":"穩健性 Robustness","c":"6.4.1.6","p":108,"q":"外柱的水平 tie 力取 2.0Ft（或 ls/2.5·Ft）與柱在該層總設計垂直荷載百分之幾的較大者？","a":3,"tol":0,"u":"%","e":"6.4.1.6(a)(ii)：3% of total design ultimate vertical load。角柱要在兩個方向各自滿足。","x":"(ii) 3% of the total design ultimate vertical load carried by the column or wall at that level.","q_en":"The horizontal tie force for an external column is the grea
