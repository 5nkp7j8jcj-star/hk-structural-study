b ≥ H²/9","(BD)b ≤ H/9"],"a":0,"e":"NBCC 2010 指出 (BD)b > H²/9 時 along-wind 加速度可能較大，因此 Code 設 (BD)b ≤ H²/9 為適用限制；矮胖建築舒適度一般不是問題。","x":"acceleration. However, as discussed in NBCC 2010, if","q_en":"To limit the risk that along-wind acceleration may exceed across-wind acceleration, what limit does the Code set on (BD)b?","e_en":"NBCC 2010 notes that along-wind acceleration may be larger when (BD)b > H²/9, so the Code sets (BD)b ≤ H²/9 as an applicability limit; comfort is generally not an issue for squat buildings.","doc":"wind-explanatory-notes-2019","pp":"12","ex":"wind","tier":"偶考"},{"id":"WEN-017","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)","p":2,"doc":"wind-en-amendments-2023","q":"2023 年 12 月 Explanatory Notes 修訂中，Clause 2.2.3 新增了什麼？","o":["新的 across-wind 公式","評估 across-wind 效應時如何決定 fundamental frequency 的指引","取消 1.5 放大系數限制","新的 Sθ 表"],"a":1,"e":"修訂針對多塔共用平台時怎樣取塔樓 fundamental frequency。記住修訂只改 Explanatory Notes，Code 條文本身不變。","x":"(a) Clause 2.2.3 – Addition of guidelines for determination of fundamental","q_en":"What was added to Clause 2.2.3 in the December 2023 amendment to the Explanatory Notes?","o_en":["A new across-wind formula","Guidance on determining the fundamental frequency when assessing across-wind effects","Removal of the 1.5 magnification factor limit","A new Sθ table"],"e_en":"The amendment addresses how to take the fundamental frequency of towers on a common podium. Remember that the amendment changes only the Explanatory Notes; the Code provisions themselves are unchanged.","pp":"2","ex":"wind","tier":"偶考"},{"id":"WEN-018","t":"num","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1(b)","p":4,"doc":"wind-en-amendments-2023","q":"多塔共用平台：假設塔樓與部分平台結合時，平台計入範圍由塔樓牆/柱邊量度，不超過多少 m、三個跨度及與鄰塔中線三者之最小值？","a":20,"tol":0,"u":"m","e":"這是 2023 修訂 (b) 方案，前提是該部分平台樓板沒有大開口（開口影響可另行考慮）。也可用 (a) 塔樓獨立並延伸至建築底部（不連平台）、(c) 按公認工程原則取平台部分，或整體電腦模型取主要沿 across-wind 方向振型的主導頻率，但須有工程理據。","x":"modelled tower by not exceeding the minimum of 20m, three","q_en":"Multiple towers on a common podium: when a tower is assumed to act with part of the podium, the extent of podium included, measured from the tower walls/columns, is not more than the least of how many m, three spans, and the centreline to the adjacent tower?","e_en":"This is option (b) of the 2023 amendment, provided that portion of the podium has no substantial slab openings (the effect of openings may be considered separately). Alternatively use (a) the tower standing alone and extended to the building base (not connected to the podium), (c) a podium portion per recognised engineering principles, or the dominant frequency of the mode mainly aligned with the across-wind direction from an integrated computer model, with engineering justification.","pp":"4","ex":"wind","tier":"偶考"},{"id":"WEN-019","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN 2.5)","p":5,"doc":"wind-en-amendments-2023","q":"按 2023 修訂新增的 EN Table 2-1，高度 ≤2.5 m 的地盤 hoarding / covered walkway 設計淨壓力是？","o":["0.50 kPa","0.63 kPa","0.70 kPa","1.59 kPa"],"a":1,"e":"≤2.5 m 0.63、5 m 0.70、10 m 0.77 kPa，已包含 Cp 和 Ss，可線性內插；有不利地形時仍須考慮 topography factor，可計鋼構件自重的有利作用。","x":"construction site, the design net pressure in Table 2-1 may be used.","q_en":"Per the new EN Table 2-1 added by the 2023 amendment, what is the design net pressure for site hoardings / covered walkways of height ≤2.5 m?","e_en":"≤2.5 m 0.63, 5 m 0.70, 10 m 0.77 kPa, already including Cp and Ss, with linear interpolation allowed; the topography factor must still be considered for adverse topography, and the favourable effect of the steelwork self-weight may be counted.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-020","t":"num","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – EN Table 2-1","p":5,"doc":"wind-en-amendments-2023","q":"EN Table 2-1（2023 修訂）：高度 10 m 的 hoarding 設計淨壓力（kPa）？","a":0.77,"tol":0.005,"u":"kPa","e":"這是 all-inclusive value，不要再乘 Cp 或 Ss，否則重複計算。","x":"(b) Cp and Ss have been included.","q_en":"EN Table 2-1 (2023 amendment): design net pressure (kPa) for a hoarding 10 m high?","e_en":"This is an all-inclusive value; do not multiply by Cp or Ss again, which would double count.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-021","t":"tf","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 4 (EN 6.4)","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂澄清：若無做 building removal investigation，遮擋效益限於 Standard Method 荷載的 80%，並以 total base moment 形式比較。","a":true,"e":"舊文字寫「80% of the along-wind value」，修訂改為「80% of the loads of the Standard Method」並要求以總基底彎矩比較，與 Code 6.4 一致。","x":"Method. The comparison should be in the form of total base","q_en":"The 2023 amendment clarifies that without a building removal investigation, the shielding benefit is limited to 80% of the Standard Method loads, compared in terms of total base moment.","e_en":"True. The old text said \"80% of the along-wind value\"; the amendment changes it to \"80% of the loads of the Standard Method\" and requires comparison by total base moment, consistent with Code 6.4.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-022","t":"tf","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 3 (EN 4.3.1)","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂後，accidental dominant open scenario 被描述為「不屬 Code 的強制要求」，而非「超出 Code 範圍」。","a":true,"e":"文字由 out of scope 改為 not a compulsory requirement。設計上若業主要求考慮颱風時窗戶破損，仍可按 Appendix B1 計算。","x":"compulsory requirement of this Code, as discussed in Appendix","q_en":"After the 2023 amendment, the accidental dominant open scenario is described as \"not a compulsory requirement of the Code\" rather than \"outside the scope of the Code\".","e_en":"True. The wording changed from out of scope to not a compulsory requirement. If the client requires window breakage during typhoons to be considered, it can still be calculated per Appendix B1.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-023","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)(a)","p":3,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN 2.2.3：多塔共用平台時，估算 across-wind 效應的 fundamental frequency，假設 (a) 是？","a":0,"e":"(a) 把塔樓當作獨立，並延伸至建築底部、不連接平台。(b) 為塔樓連同有限範圍平台，(c) 為按公認工程原則取平台部分；亦可用整體電腦模型。H/46 只是 EN 參數研究所用的假設週期，不是修訂的方案。","x":"assuming individual tower standing alone and extended to the","o":["塔樓獨立，並延伸至建築底部，不與平台連接","塔樓連同整個平台一併分析","只計平台以上塔樓高度，底部固定於平台頂","用週期 H/46 經驗公式估算"],"q_en":"2023 amendment EN 2.2.3: for multiple towers over a common podium, what is assumption (a) for the fundamental frequency used to estimate across-wind effects?","o_en":["Tower standing alone, extended to the building base, not connected to the podium","Tower analysed together with the whole podium","Only the tower height above the podium, fixed at podium roof","Estimate from the empirical period H/46"],"e_en":"(a) treats the tower as standing alone and extended to the building base without connecting to the podium. (b) is the tower with a limited podium portion, (c) a podium portion per recognised engineering principles; an integrated computer model is also allowed. H/46 is only the period assumed in the EN parametric study, not one of the amended options.","pp":"3","ex":"wind","tier":"偶考"},{"id":"WEN-024","t":"mcq","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3) – integrated model","p":4,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN 2.2.3：如建立塔樓及平台的整體電腦模型，估算某塔 across-wind 效應可採用哪個頻率？","a":0,"e":"取主要沿該塔 across-wind 方向振型的主導 fundamental frequency，並須有工程理據。整體模型的最低振型可能是其他塔或扭轉振型，不一定代表該塔的 across-wind 反應。","x":"mode of vibration mainly aligned with the across-wind direction","o":["主要沿該塔 across-wind 方向振型的主導 fundamental frequency（須有工程理據）","整體模型最低的扭轉頻率","所有振型頻率的平均值","平台本身的第一振型頻率"],"q_en":"2023 amendment EN 2.2.3: if an integrated computer model of the towers and podium is set up, which frequency may be adopted to estimate a tower's across-wind effects?","o_en":["The dominant fundamental frequency of the mode mainly aligned with that tower's across-wind direction (with engineering justification)","The lowest torsional frequency of the integrated model","The average of all modal frequencies","The first-mode frequency of the podium itself"],"e_en":"The dominant fundamental frequency of the mode of vibration mainly aligned with that tower's across-wind direction, based on engineering justification. The lowest mode of the integrated model may belong to another tower or be torsional, so it does not necessarily represent that tower's across-wind response.","pp":"4","ex":"wind","tier":"偶考"},{"id":"WEN-025","t":"tf","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3) – unclear tributary extent","p":4,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN 2.2.3：若按準則 (b) 無法清楚界定平台計入範圍（tributary extent），可用包含所有塔樓及平台的整體電腦模型求各塔的主導 fundamental frequency。","a":true,"e":"正確。修訂最後一段正是處理 (b) 範圍不清的情況：改用包含全部塔樓及平台的整體模型。","x":"model with all the towers and podium might be used to obtain the","q_en":"2023 amendment EN 2.2.3: where the tributary extent cannot be clearly defined under criterion (b), an integrated computer model with all the towers and podium may be used to obtain the dominant fundamental frequency of each tower.","e_en":"True. The last paragraph of the amendment covers exactly this case: use an integrated model with all towers and the podium.","pp":"4","ex":"wind","tier":"偶考"},{"id":"WEN-026","t":"tf","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)(b)","p":4,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN 2.2.3 準則 (b)：計入的平台部分樓板只要有任何開口，準則 (b) 就不能用，修訂亦不容許另行考慮開口影響。","a":false,"e":"錯誤。(b) 的前提是計入部分「沒有大開口」（no substantial openings），而修訂明言這些樓板開口的影響可另行考慮。","x":"The effect of those floor openings might be considered","q_en":"2023 amendment EN 2.2.3 criterion (b): if the integrated podium portion has any floor opening at all, criterion (b) cannot be used, and the amendment does not allow the effect of openings to be considered separately.","e_en":"False. Criterion (b) is subject to \"no substantial openings\" in the integrated portion, and the amendment states that the effect of those floor openings might be considered separately.","pp":"4","ex":"wind","tier":"偶考"},{"id":"WEN-027","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN Table 2-1)","p":5,"doc":"wind-en-amendments-2023","q":"EN Table 2-1（2023 修訂）：高度 5 m 的地盤 hoarding / covered walkway 設計淨壓力是？","a":1,"e":"Table 2-1：Z ≤ 2.5 m 0.63、5 m 0.70、10 m 0.77 kPa，全包值（all-inclusive），不要再乘 Cp 或 Ss。","x":"Table 2-1 Design net pressure for hoarding and covered walkway","o":["0.63 kPa","0.70 kPa","0.77 kPa","0.95 kPa"],"q_en":"EN Table 2-1 (2023 amendment): what is the design net pressure for a construction-site hoarding / covered walkway at a height of 5 m?","e_en":"Table 2-1: Z ≤ 2.5 m 0.63, 5 m 0.70, 10 m 0.77 kPa, all-inclusive values; do not multiply by Cp or Ss again.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-028","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN Table 2-1 Notes)","p":5,"doc":"wind-en-amendments-2023","q":"EN Table 2-1（2023 修訂）的附註，下列哪項不正確？","a":3,"e":"附註 (d)：當地地形可能令風效應不利時，須考慮 topography factor，所以地形系數並非已包含。其餘三項（線性內插、已含 Cp 及 Ss、可計鋼構件自重的有利作用）都是附註原文。","x":"(d) Topography factor should be considered in location where local topography","o":["中間高度可線性內插","已包含 Cp 及 Ss","可考慮鋼構件自重的有利作用","已包含 topography factor，任何地點都不須再考慮地形"],"q_en":"Which of the following about the Notes to EN Table 2-1 (2023 amendment) is NOT correct?","o_en":["Linear interpolation is permitted for intermediate heights","Cp and Ss are included","The beneficial effect of the self-weight of steel members may be considered","The topography factor is included, so topography never needs to be considered"],"e_en":"Note (d): where local topography may adversely affect the wind effect, the topography factor should be considered, so it is not already included. The other three (linear interpolation, Cp and Ss included, beneficial self-weight of steel members) are all in the Notes.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-029","t":"num","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN Table 2-1 Note (a))","p":5,"doc":"wind-en-amendments-2023","q":"按 EN Table 2-1（2023 修訂）線性內插，高度 7.5 m 的地盤 hoarding 設計淨壓力（kPa）？","a":0.735,"e":"0.70 + (0.77 − 0.70) × (7.5 − 5)/(10 − 5) = 0.735 kPa。附註 (a) 容許中間高度線性內插；數值已含 Cp 及 Ss。","x":"(a) For intermediate values of height, linear interpolation is permitted.","tol":0.005,"u":"kPa","calc":true,"q_en":"By linear interpolation in EN Table 2-1 (2023 amendment), what is the design net pressure (kPa) for a construction-site hoarding at a height of 7.5 m?","e_en":"0.70 + (0.77 − 0.70) × (7.5 − 5)/(10 − 5) = 0.735 kPa. Note (a) permits linear interpolation for intermediate heights; the values already include Cp and Ss.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-030","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN 2.5)","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂新增的 EN Table 2-1 全包設計淨壓力，適用於以下哪項？","a":0,"e":"修訂寫明「In particular for hoarding and covered walkway associated with construction site」。contractor shed、bamboo shed、tent/marquee 仍按 Code 2.5 取不少於 37%；停留不超過一年的非住宅臨時建築則可用永久建築設計荷載的 70%。","x":"particular for hoarding and covered walkway associated with","o":["地盤 hoarding 及 covered walkway","竹棚（bamboo shed）","帳篷或大帳幕（tent / marquee）","停留不超過一年的非住宅臨時建築"],"r":[{"doc":"wind-code-2019","p":26,"c":"2.5","x":"70% of the design loads for permanent buildings.","pp":"16"}],"q_en":"The all-inclusive design net pressures in the new EN Table 2-1 (2023 amendment) apply to which of the following?","o_en":["Construction-site hoardings and covered walkways","Bamboo sheds","Tents or marquees","Non-residential temporary buildings in place for not more than one year"],"e_en":"The amendment says \"In particular for hoarding and covered walkway associated with construction site\". Contractor sheds, bamboo sheds and tents/marquees still use not less than 37% per Code 2.5; non-residential temporary buildings in place for not more than one year may use 70% of the permanent-building design loads.","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-031","t":"mcq","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 4 (EN 6.4), current-version text","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN 6.4：沒有做 building removal investigation 時，遮擋效益上限的比較基準有何改動？","a":0,"e":"舊 EN：80% of the along-wind value in accordance with the Code；修訂：80% of the loads of the Standard Method，並以 total base moments 比較。80% 本身不變；70% 只適用於有做 building removal investigation 的情況（Code 6.4）。","x":"shelter benefit is limited to 80% of the along-wind value in","o":["由「along-wind value」改為「Standard Method 的荷載」，並以 total base moments 比較","由 70% 改為 80%","由「Standard Method 的荷載」改為「along-wind value」","由 total base moments 改為逐層剪力比較"],"r":[{"doc":"wind-en-amendments-2023","p":5,"c":"Amendments Dec 2023 – Item 4 (EN 6.4)","x":"Method. The comparison should be in the form of total base","pp":"5"}],"q_en":"2023 amendment EN 6.4: without a building removal investigation, how was the reference for the shelter-benefit limit changed?","o_en":["From \"along-wind value\" to \"loads of the Standard Method\", compared as total base moments","From 70% to 80%","From \"loads of the Standard Method\" to \"along-wind value\"","From total base moments to storey-by-storey shear"],"e_en":"Old EN: 80% of the along-wind value in accordance with the Code; amended: 80% of the loads of the Standard Method, compared in the form of total base moments. The 80% itself is unchanged; 70% applies only when a building removal investigation is carried out (Code 6.4).","pp":"5","ex":"wind","tier":"偶考"},{"id":"WEN-032","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 6 (EN Appendix C2), current-version text","p":6,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN Appendix C2：阻尼數據中錄得離群高阻尼值的那幢立方形建築，高度更正為多少？","a":0,"e":"現行版本寫 200 m，修訂欄（黃色標示）改為 250 m。這只是 EN 文字更正，Code Table C2-1 / C2-2 的阻尼值不變。","x":"Outlying high damping value was recorded for a 200m building","o":["250 m","200 m","150 m","300 m"],"q_en":"2023 amendment EN Appendix C2: the cubic building for which an outlying high damping value was recorded has its height corrected to what?","e_en":"The current version says 200 m; the amendment column (highlighted yellow) changes it to 250 m. This is only a textual correction to the EN; the Code Table C2-1 / C2-2 damping values are unchanged.","pp":"6","ex":"wind","tier":"偶考"},{"id":"WEN-033","t":"mcq","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 7 (EN Appendix E3.1 step 2)","p":6,"doc":"wind-en-amendments-2023","q":"2023 修訂 EN Appendix E3.1（多塔扭轉荷載工況）第 2 步：Flateral-1 是哪些力的向量合力？","a":0,"e":"修訂前只列 F1-1、F2-1 及 F3-1（Figure E-7(d)）；修訂後加入 F4-1，改為 F1-1、F2-1、F3-1 及 F4-1，圖號改為 Figure E-7(e)。","x":"F3-1 and F4-1, as shown in Figure E-7","o":["F1-1、F2-1、F3-1 及 F4-1","F1-1、F2-1 及 F3-1","F1-1 及 F2-1","只有 F1-1"],"q_en":"2023 amendment EN Appendix E3.1 (torsional load cases for multiple towers), step 2: Flateral-1 is the vector resultant of which forces?","o_en":["F1-1, F2-1, F3-1 and F4-1","F1-1, F2-1 and F3-1","F1-1 and F2-1","F1-1 only"],"e_en":"Before the amendment only F1-1, F2-1 and F3-1 were listed (Figure E-7(d)); the amendment adds F4-1, giving F1-1, F2-1, F3-1 and F4-1, with the figure renumbered Figure E-7(e).","pp":"6","ex":"wind","tier":"偶考"},{"id":"WEN-034","t":"tf","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 7 (EN Appendix E3.1 steps 1–3)","p":6,"doc":"wind-en-amendments-2023","q":"2023 修訂後 EN Appendix E3.1 的圖號為：各塔荷載見 Figure E-7(a) 至 (d)，Flateral 合力見 Figure E-7(e)，最大投影對角寬度 Bi 見 Figure E-7(f)。","a":true,"e":"正確。修訂前分別是 E-7(a)–(c)、E-7(d) 及 E-7(e)；新增第四座塔的荷載圖後各圖號順延一個字母。","x":"following the Code as shown in Figure E-7(a), (b)","q_en":"After the 2023 amendment, EN Appendix E3.1 refers to: loads on individual towers in Figure E-7(a) to (d), the Flateral resultants in Figure E-7(e), and the maximum projecting diagonal breadth Bi in Figure E-7(f).","e_en":"True. Before the amendment they were E-7(a)–(c), E-7(d) and E-7(e); adding the fourth tower's load figure shifts each later figure by one letter.","pp":"6","ex":"wind","tier":"偶考"},{"id":"WEN-035","t":"mcq","d":1,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – summary","p":2,"doc":"wind-en-amendments-2023","q":"2023 年 12 月的修訂屬於哪類改動？","a":0,"e":"修訂的是 Explanatory Notes：(a) EN 2.2.3 新增 across-wind 頻率指引；(b) EN 2.5 新增 hoarding/covered walkway 設計淨壓力；(c) EN 4.3.1、6.4、Figure B-1、Appendix C2、E3.1 屬文字修正。Code 本身的數值（Qo,z、γw 1.4 等）不變。","x":"Amendments to the Explanatory Notes to the Code of Practice on Wind Effects","o":["只修訂 Explanatory Notes（EN 2.2.3 指引、EN 2.5 Table 2-1，其餘為文字修正），Code 數值不變","修訂 Code Table 3-1 的 Qo,z","把 γw 由 1.4 改為 1.5","刪除 Code 的 across-wind 公式"],"q_en":"What kind of change was the December 2023 amendment?","o_en":["Explanatory Notes only (EN 2.2.3 guidance, EN 2.5 Table 2-1, the rest textual refinement); Code values unchanged","Revised the Code Table 3-1 Qo,z values","Changed γw from 1.4 to 1.5","Deleted the Code's across-wind formula"],"e_en":"It amended the Explanatory Notes: (a) EN 2.2.3 adds guidance on frequency for across-wind; (b) EN 2.5 adds design net pressures for hoardings/covered walkways; (c) EN 4.3.1, 6.4, Figure B-1, Appendix C2 and Appendix E3.1 are textual refinements. The Code's own values (Qo,z, γw 1.4 etc.) are unchanged.","pp":"2","ex":"wind","tier":"偶考"},{"id":"ASD-101","t":"mcq","d":2,"tp":"錨固及搭接 Anchorage & laps","c":"3.3 Table 3.5","p":11,"q":"ASD Table 3.5（Grade 500 鋼筋，全拉力）：C35 混凝土、T20 鋼筋的 TAL / TLL 是多少？","e":"Table 3.5：C35 TAL/TLL/CLL 一行為 T10 400、T12 450、T16 600、T20 750、T25 950、T32 1200、T40 1500 mm（約 37.5Ø）。800 mm 是 C30；600 mm 是 CAL（受壓錨固）；1050 mm 是 1.4 TLL。表值只適用於全拉力鋼筋，設計拉力較小時可按比例減少。CoP 8.4 / 8.7 以公式及 Table 8.5 表示；ASD 已換算成 mm。","x":"35 400 450 600 750 950 1200 1500","tier":"常考","ex":"detail","o":["600 mm","1050 mm","750 mm","800 mm"],"a":2,"q_en":"ASD Table 3.5 (grade 500 bars in full tension): what is TAL / TLL for a T20 bar in C35 concrete?","e_en":"Table 3.5: the C35 TAL/TLL/CLL row is T10 400, T12 450, T16 600, T20 750, T25 950, T32 1200, T40 1500 mm (about 37.5Ø). 800 mm is C30; 600 mm is CAL (compression anchorage); 1050 mm is 1.4 TLL. Values are for bars in full tension and may be reduced when the design tension is lower. CoP 8.4 / 8.7 give formulae and Table 8.5; the ASD converts them to mm.","doc":"asd-drafting-manual-rc","pp":"3.3"},{"id":"ASD-102","t":"mcq","d":2,"tp":"錨固及搭接 Anchorage & laps","c":"3.3 Table 3.5","p":11,"q":"ASD Table 3.5：C40 混凝土、T25 鋼筋，需要 1.4 倍搭接（1.4 TLL）時的長度是？","e":"C40 1.4 TLL 一行：T10 500、T12 600、T16 800、T20 1000、T25 1200、T32 1550、T40 1950 mm。900 mm 是 C40 T25 的基本 TLL；1750 mm 是 2.0 TLL；1300 mm 是 C35 T25 的 1.4 TLL。何時用 1.4 / 2.0 倍見 Figure 4.1（與 CoP 8.7.4 相同條件：頂筋保護層 < 2Ø、角筋或淨距 < 75 mm 或 6Ø）。","x":"40 500 600 800 1000 1200 1550 1950","tier":"常考","ex":"detail","o":["1200 mm","1300 mm","1750 mm","900 mm"],"a":0,"q_en":"ASD Table 3.5: for a T25 bar in C40 concrete, what is the lap length where 1.4 TLL is required?","e_en":"C40 1.4 TLL row: T10 500, T12 600, T16 800, T20 1000, T25 1200, T32 1550, T40 1950 mm. 900 mm is the basic C40 T25 TLL; 1750 mm is 2.0 TLL; 1300 mm is the C35 T25 1.4 TLL. When to use 1.4 / 2.0 is shown in Figure 4.1 (same conditions as CoP 8.7.4: top bars with cover < 2Ø, corner bars or clear gap < 75 mm or 6Ø).","doc":"asd-drafting-manual-rc","pp":"3.3"},{"id":"ASD-103","t":"mcq","d":2,"tp":"錨固及搭接 Anchorage & laps","c":"3.3 Table 3.5","p":11,"q":"ASD Table 3.5：C30 混凝土、T16 受壓錨固長度（CAL）是？","e":"C30 CAL 一行：T10 350、T12 400、T16 500、T20 650、T25 800、T32 1050、T40 1300 mm。650 mm 是 C30 T16 的 TAL/TLL；900 mm 是 C30 T16 的 1.4 TLL。受壓錨固比受拉短。","x":"30 350 400 500 650 800 1050 1300","tier":"常考","ex":"detail","o":["900 mm","650 mm","400 mm","500 mm"],"a":3,"q_en":"ASD Table 3.5: what is the compression anchorage length (CAL) for a T16 bar in C30 concrete?","e_en":"C30 CAL row: T10 350, T12 400, T16 500, T20 650, T25 800, T32 1050, T40 1300 mm. 650 mm is the C30 T16 TAL/TLL; 900 mm is the C30 T16 1.4 TLL. Compression anchorage is shorter than tension.","doc":"asd-drafting-manual-rc","pp":"3.3"},{"id":"ASD-104","t":"mcq","d":3,"tp":"錨固及搭接 Anchorage & laps","c":"3.3 Table 3.5","p":11,"q":"ASD Table 3.5：C35 混凝土、T25 鋼筋需要 2.0 倍搭接（2.0 TLL）時的長度是？","e":"C35 2.0 TLL 一行：T10 750、T12 900、T16 1200、T20 1500、T25 1850、T32 2350、T40 2950 mm。表值已四捨五入至 50 mm，所以不一定等於 2 × 950 = 1900。1300 mm 是 1.4 TLL，950 mm 是基本 TLL。2.0 倍用於頂部角筋同時符合兩個不利條件。","x":"35 750 900 1200 1500 1850 2350 2950","tier":"常考","ex":"detail","o":["1850 mm","950 mm","1300 mm","1900 mm"],"a":0,"q_en":"ASD Table 3.5: for a T25 bar in C35 concrete, what is the lap length where 2.0 TLL is required?","e_en":"C35 2.0 TLL row: T10 750, T12 900, T16 1200, T20 1500, T25 1850, T32 2350, T40 2950 mm. Table values are rounded to 50 mm, so not necessarily 2 × 950 = 1900. 1300 mm is 1.4 TLL, 950 mm the basic TLL. 2.0 applies to top corner laps where both adverse conditions apply.","doc":"asd-drafting-manual-rc","pp":"3.3"},{"id":"ASD-105","t":"mcq","d":2,"tp":"錨固及搭接 Anchorage & laps","c":"4.1 Figure 4.1","p":12,"q":"ASD Figure 4.1 判斷搭接長度倍數時，相鄰搭接的淨距 s 基準取什麼？","e":"s = max(75 mm, 6Ø)，Ø 為搭接鋼筋直徑。圖中（按圖讀取）頂筋最高倍數 2.0，豎筋及底筋最高 1.4；保護層 ≥ 2Ø 且淨距 ≥ s 時為 1.0。與 CoP 8.7.4（1.4 / 2.0，75 mm 或 6 倍）一致。","x":"s = 75mm OR 6Ø, WHICHEVER IS GREATER","tier":"常考","ex":"detail","o":["50 mm 或 4Ø，取較大者","75 mm 或 6Ø，取較大者","25 mm 或 Ø，取較大者","75 mm 或 6Ø，取較小者"],"a":1,"q_en":"In ASD Figure 4.1, what is the reference clear distance s between adjacent laps used to decide the lap multiplying factor?","o_en":["50 mm or 4Ø, whichever is greater","75 mm or 6Ø, whichever is greater","25 mm or Ø, whichever is greater","75 mm or 6Ø, whichever is less"],"e_en":"s = max(75 mm, 6Ø), Ø = diameter of the lapped bar. In the figure (read from the drawing), top bars go up to a factor of 2.0 and vertical and bottom bars up to 1.4; with cover ≥ 2Ø and clear gap ≥ s the factor is 1.0. Consistent with CoP 8.7.4 (1.4 / 2.0, 75 mm or 6 times).","doc":"asd-drafting-manual-rc","pp":"4.1"},{"id":"ASD-106","t":"mcq","d":2,"tp":"錨固及搭接 Anchorage & laps","c":"4.2 Figures 4.2–4.3","p":12,"q":"ASD Figures 4.2 / 4.3 的搭接區橫向鋼筋要求，適用於搭接鋼筋直徑多少或以上？","e":"適用於搭接鋼筋 ≥ 20 mm。按圖讀取：橫向鋼筋總量 ΣAst/2 分別放在搭接長度兩端各 l0/3 範圍內，間距 ≤ 150 mm；受壓搭接另在搭接兩端外 4Ø 內加一支。全拉力時最少橫向筋查 Table 4.1。","x":"WITH LAPPED BAR DIAMETER ≥ 20 mm WITH LAPPED BAR DIAMETER ≥ 20 mm","tier":"常考","ex":"detail","o":["16 mm","32 mm","20 mm","25 mm"],"a":2,"q_en":"ASD Figures 4.2 / 4.3 (transverse reinforcement in lap zones) apply to lapped bars of what diameter and above?","e_en":"They apply to lapped bars ≥ 20 mm. Read from the figures: ΣAst/2 is placed within each outer l0/3 of the lap, at spacing ≤ 150 mm; compression laps also get one bar within 4Ø beyond each end of the lap. For full tension the minimum transverse steel is given in Table 4.1.","doc":"asd-drafting-manual-rc","pp":"4.1"},{"id":"ASD-107","t":"mcq","d":3,"tp":"錨固及搭接 Anchorage & laps","c":"4.2 Table 4.1","p":13,"q":"ASD Table 4.1：C40 混凝土，T32 鋼筋以 TLL（或 CLL）搭接，搭接區最少橫向鋼筋是？","e":"C40、32 mm：TLL/CLL T16-150、1.4 TLL T12-125、2.0 TLL T12-150。搭接越長，所需橫向筋越少。表值用於全拉力 / 全壓力，設計力較小時可減少。","x":"32 T16 - 150 T12 - 125 T12 - 150 T16 - 150 T12 - 100 T12 - 150","tier":"常考","ex":"detail","o":["T16-150","T16-100","T10-125","T12-125"],"a":0,"q_en":"ASD Table 4.1: in C40 concrete, T32 bars lapped at TLL (or CLL): minimum transverse reinforcement in the lap zone?","e_en":"C40, 32 mm: TLL/CLL T16-150, 1.4 TLL T12-125, 2.0 TLL T12-150. The longer the lap, the less transverse steel is needed. Values are for full tension / compression and may be reduced for lower design forces.","doc":"asd-drafting-manual-rc","pp":"4.2"},{"id":"ASD-108","t":"mcq","d":1,"tp":"彎曲半徑 Bend radii","c":"4.3 Table 4.2","p":13,"q":"ASD Table 4.2：T16 鋼筋的最小內彎半徑是？","e":"Table 4.2：T10、T12 為 2Ø（20、24 mm）；T16 為 3Ø（48 mm）；T20–T40 為 4Ø（80、100、128、160 mm）。與 CoP Table 8.2（Ø ≤ 12 mm 2Ø；< 20 mm 3Ø；≥ 20 mm 4Ø）相同。","x":"(mm) 20 24 48 80 100 128 160","tier":"常考","ex":"detail","o":["5Ø = 80 mm","2Ø = 32 mm","4Ø = 64 mm","3Ø = 48 mm"],"a":3,"q_en":"ASD Table 4.2: minimum internal bend radius of a T16 bar?","e_en":"Table 4.2: T10, T12 2Ø (20, 24 mm); T16 3Ø (48 mm); T20–T40 4Ø (80, 100, 128, 160 mm). Same as CoP Table 8.2 (Ø ≤ 12 mm 2Ø; < 20 mm 3Ø; ≥ 20 mm 4Ø).","doc":"asd-drafting-manual-rc","pp":"4.2"},{"id":"ASD-109","t":"mcq","d":2,"tp":"彎曲半徑 Bend radii","c":"4.3 Table 4.2","p":13,"q":"ASD Table 4.2：T25 鋼筋的最小內彎半徑是？","e":"T25 為 4Ø = 100 mm。75 mm 是誤用 3Ø；50 mm 是 2Ø；125 mm 是 5Ø。注意這是半徑，彎模（mandrel）直徑是兩倍。","x":"MINIMUM INTERNAL 2∅ 2∅ 3∅ 4∅ 4∅ 4∅ 4∅","tier":"常考","ex":"detail","o":["100 mm","50 mm","125 mm","75 mm"],"a":0,"q_en":"ASD Table 4.2: minimum internal bend radius of a T25 bar?","e_en":"T25 is 4Ø = 100 mm. 75 mm wrongly uses 3Ø; 50 mm is 2Ø; 125 mm is 5Ø. Note this is a radius; the mandrel diameter is twice this.","doc":"asd-drafting-manual-rc","pp":"4.2"},{"id":"ASD-110","t":"mcq","d":3,"tp":"彎曲半徑 Bend radii","c":"4.4 Table 4.3","p":14,"q":"ASD Table 4.3：C35 混凝土、T25 鋼筋以彎鉤錨固而彎內無橫筋時，彎後所需錨固長度最多是？超過時應如何？","e":"C35 一行：T16 105、T20 160、T25 200、T32 255、T40 320 mm。若錨固需要超過表值，須向 PSE 取意見，在彎內加直徑 ≥ Ø 的橫筋（Figure 4.5）。CoP 8.3(c)：彎內橫筋直徑 ≥ φ 並兩邊各伸出 ≥ 3φ。","x":"35 105 160 200 255 320","tier":"常考","ex":"detail","o":["200 mm；超過須請 PSE 考慮在彎內加直徑 ≥ Ø 的橫筋","170 mm；超過改用機械接駁","250 mm；超過須加長直段","320 mm；超過可不理"],"a":0,"q_en":"ASD Table 4.3: for a T25 bar in C35 concrete anchored by a bend without a cross bar, what is the maximum length required beyond the end of the bend, and what if more is needed?","o_en":["200 mm; if exceeded, ask the PSE about a cross bar of diameter ≥ Ø inside the bend","170 mm; if exceeded, use a mechanical coupler","250 mm; if exceeded, extend the straight length","320 mm; if exceeded, ignore"],"e_en":"C35 row: T16 105, T20 160, T25 200, T32 255, T40 320 mm. If the anchorage needs more than the tabulated length, seek PSE advice on a cross bar of diameter ≥ Ø inside the bend (Figure 4.5). CoP 8.3(c): cross bar diameter ≥ φ extending ≥ 3φ each side of the bend.","doc":"asd-drafting-manual-rc","pp":"4.3"},{"id":"ASD-111","t":"mcq","d":2,"tp":"支承寬度 Support width","c":"4.5.1 Figure 4.6","p":15,"q":"ASD Figure 4.6：單層錨固鋼筋直徑 ≥ 20 mm 時，最小支承寬度公式是？","e":"Ø ≤ 12 mm：2 × (3Ø + c)；12 < Ø < 20 mm：2 × (4Ø + c)；Ø ≥ 20 mm：2 × (5Ø + c)，c 為保護層。例：保護層 40 mm、T20 → 2 × (100 + 40) = 280 mm（Table 4.4）。","x":"= 2 × (5Ø + c) FOR BAR DIA. ≥ 20mm","tier":"常考","ex":"detail","o":["2 × (3Ø + c)","5Ø + c","2 × (4Ø + c)","2 × (5Ø + c)"],"a":3,"q_en":"ASD Figure 4.6: for a single layer of anchored bars of diameter ≥ 20 mm, what is the minimum support width?","e_en":"Ø ≤ 12 mm: 2 × (3Ø + c); 12 < Ø < 20 mm: 2 × (4Ø + c); Ø ≥ 20 mm: 2 × (5Ø + c), c = cover. Example: cover 40 mm, T20 → 2 × (100 + 40) = 280 mm (Table 4.4).","doc":"asd-drafting-manual-rc","pp":"4.4"},{"id":"ASD-112","t":"mcq","d":2,"tp":"支承寬度 Support width","c":"4.5.1 Table 4.4","p":15,"q":"ASD Table 4.4：保護層 35 mm、單層 T25 錨固鋼筋，最小支承寬度是？","e":"2 × (5 × 25 + 35) = 320 mm。保護層 35 mm 一行：T10 130、T12 150、T16 200、T20 270、T25 320、T32 390 mm。雙層鋼筋查 Table 4.5（例如保護層 40 mm、Ø1 = Ø2 = 25 mm → 430 mm）。","x":"35 130 150 200 270 320 390 -","tier":"常考","ex":"detail","o":["250 mm","390 mm","320 mm","270 mm"],"a":2,"q_en":"ASD Table 4.4: cover 35 mm, single layer of anchored T25 bars: minimum support width?","e_en":"2 × (5 × 25 + 35) = 320 mm. The 35 mm cover row: T10 130, T12 150, T16 200, T20 270, T25 320, T32 390 mm. For double layers use Table 4.5 (e.g. cover 40 mm, Ø1 = Ø2 = 25 mm → 430 mm).","doc":"asd-drafting-manual-rc","pp":"4.4"},{"id":"ASD-113","t":"mcq","d":2,"tp":"樁帽 Pile caps","c":"5.1","p":17,"q":"ASD 5.1：樁帽主筋的最小及最大鋼筋尺寸是？","e":"樁帽：T16–T40；最小間距「每 100 mm 最多一支 T40」；最大間距見 Table 5.1；最少 0.13%。基腳（6.1）最小是 T12，其餘相同。剪力箍（5.2）：Type N、T10–T16，紮在內層主筋 T2 及 B2。","x":"(i) MIN. BAR SIZE TO BE T16","tier":"常考","ex":"detail","o":["T16 至 T40","T20 至 T50","T12 至 T40","T10 至 T32"],"a":0,"q_en":"ASD 5.1: minimum and maximum main bar sizes in a pile cap?","o_en":["T16 to T40","T20 to T50","T12 to T40","T10 to T32"],"e_en":"Pile cap: T16–T40; minimum spacing \"one T40 max. per 100 mm\"; maximum spacing per Table 5.1; minimum 0.13%. Footings (6.1) have a T12 minimum, otherwise the same. Shear links (5.2): Type N, T10–T16, fixed to the inner main layers T2 and B2.","doc":"asd-drafting-manual-rc","pp":"5.1"},{"id":"ASD-114","t":"num","d":2,"tp":"樁帽 Pile caps","c":"5.1 Table 5.1","p":17,"q":"ASD Table 5.1：樁帽鋼筋率 ρ = 0.8% 時，主筋最大間距（mm）？","e":"0.5 < ρ ≤ 1.0 時最大間距 = 150/ρ = 150/0.8 = 187.5 mm。0.13 ≤ ρ ≤ 0.5 時 300 mm；ρ > 1.0 時 150 mm。基腳用相同的 Table 6.1。","x":"CHECK IF DISTANCE IS ADEQUATE TO CATER FOR 0.5 < ρ ≤ 1.0 150/ρ","tier":"常考","ex":"detail","a":187.5,"tol":0.5,"u":"mm","calc":true,"q_en":"ASD Table 5.1: pile cap steel percentage ρ = 0.8%: maximum main bar spacing (mm)?","e_en":"For 0.5 < ρ ≤ 1.0, maximum spacing = 150/ρ = 150/0.8 = 187.5 mm. For 0.13 ≤ ρ ≤ 0.5 it is 300 mm; for ρ > 1.0, 150 mm. Footings use the same Table 6.1.","doc":"asd-drafting-manual-rc","pp":"5.1"},{"id":"ASD-115","t":"mcq","d":2,"tp":"樁帽 Pile caps","c":"5.1","p":17,"q":"ASD 5.1 / 6.1 對樁帽及基腳主筋最小間距的規定是？","e":"「ONE T40 MAX. PER 100 mm」，即最密約 T40-100。柱主筋亦用同一規則（每 100 mm 柱寬最多一支 T40）。CoP 8.2 一般要求淨距 ≥ max(鋼筋直徑, hagg + 5 mm, 20 mm)。","x":"(iii) MIN. BAR SPACING – ONE T40 MAX. PER 100 mm","tier":"常考","ex":"detail","o":["淨距 ≥ 2 倍鋼筋直徑","中心距 ≥ 150 mm","每 100 mm 最多一支 T40","淨距 ≥ 25 mm"],"a":2,"q_en":"What do ASD 5.1 / 6.1 specify as the minimum main bar spacing in pile caps and footings?","o_en":["Clear spacing ≥ 2 bar diameters","Centres ≥ 150 mm","One T40 max. per 100 mm","Clear spacing ≥ 25 mm"],"e_en":"\"One T40 max. per 100 mm\", i.e. no denser than about T40-100. Column main bars use the same rule (one T40 per 100 mm of column width). CoP 8.2 generally requires clear spacing ≥ max(bar diameter, hagg + 5 mm, 20 mm).","doc":"asd-drafting-manual-rc","pp":"5.1"},{"id":"ASD-116","t":"mcq","d":3,"tp":"基腳 Footings","c":"6.1","p":18,"q":"ASD 6.1 單一方形基腳：若 b1 或 b2 > (0.75bc + 2.25d)，所需主筋應如何分佈？","e":"當基腳伸出較闊（b1 或 b2 > 0.75bc + 2.25d），2/3 所需鋼筋集中在柱邊兩側各 1.5d 範圍，其餘分佈在外側。CoP 2013 正文未找到相同條文（屬 ASD 補充規定）。基腳主筋 T12–T40，最少 0.13%。","x":"IF b1 OR b2 > (0.75bc + 2.25d),","tier":"常考","ex":"detail","o":["全部放在柱寬內","2/3 As,req 放在柱邊兩側各 1.5d 範圍內","全寬平均分佈","1/2 As,req 放在柱寬內"],"a":1,"q_en":"ASD 6.1 single pad footing: if b1 or b2 > (0.75bc + 2.25d), how should the required main steel be distributed?","o_en":["All within the column width","2/3 As,req within 1.5d each side of the column","Uniformly across the full width","1/2 As,req within the column width"],"e_en":"Where the footing extends far (b1 or b2 > 0.75bc + 2.25d), 2/3 of the required steel is concentrated within 1.5d each side of the column, the rest spread outside. No equivalent clause was found in the CoP 2013 text (ASD addition). Footing main bars T12–T40, minimum 0.13%.","doc":"asd-drafting-manual-rc","pp":"6.1"},{"id":"ASD-117","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.1 Table 7.2","p":19,"q":"板厚 h ≤ 200 mm 時，ASD Table 7.2 主筋最大間距為 min(3h, 300)。CoP 9.3.1.1(b) 一般主筋最大間距是？","e":"CoP：主筋 3h ≤ 400 mm、副筋 3.5h ≤ 450 mm；集中荷載/最大彎矩區主筋 2h ≤ 250 mm。ASD 把一般上限收緊至 300 mm（h > 200 時：0.3% < As ≤ 1.0% 用 300、As > 1.0% 用 150；懸臂 150；天台/外露板 ≤ 200）。答題時要分清是規範還是 ASD 做法。","x":"h ≤ 200 or AS REQ ≤ 0.3% AC ≤ MIN.( 3h ; 300)","tier":"常考","ex":"detail","o":["3h ≤ 300 mm","2h ≤ 250 mm","3.5h ≤ 450 mm","3h ≤ 400 mm"],"a":3,"q_en":"For h ≤ 200 mm the ASD Table 7.2 main bar spacing limit is min(3h, 300). What is the general CoP 9.3.1.1(b) limit for principal bars?","e_en":"CoP: principal 3h ≤ 400 mm, secondary 3.5h ≤ 450 mm; concentrated loads / maximum moment areas principal 2h ≤ 250 mm. The ASD tightens the general cap to 300 mm (h > 200: 0.3% < As ≤ 1.0% use 300, As > 1.0% use 150; cantilevers 150; roof / exposed slabs ≤ 200). In answers, distinguish the Code from ASD practice.","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-118","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.1 Table 7.2","p":19,"q":"ASD Table 7.2：板厚 h > 200 mm 而 As,req > 1.0% Ac 時，主筋最大間距是？","e":"h > 200：0.3% Ac < As,req ≤ 1.0% Ac → 300 mm；As,req > 1.0% Ac → 150 mm；懸臂板 150 mm。集中荷載/最大彎矩區 ≤ min(2h, 250)。","x":"AS REQ > 1.0% AC 150","tier":"常考","ex":"detail","o":["300 mm","200 mm","min(3h, 300)","150 mm"],"a":3,"q_en":"ASD Table 7.2: slab h > 200 mm with As,req > 1.0% Ac: maximum main bar spacing?","e_en":"h > 200: 0.3% Ac < As,req ≤ 1.0% Ac → 300 mm; As,req > 1.0% Ac → 150 mm; cantilever slabs 150 mm. Concentrated load / maximum moment areas ≤ min(2h, 250).","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-119","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.1 Table 7.1","p":19,"q":"ASD Table 7.1：板厚 250 < h ≤ 300 mm 的懸臂板，頂部受拉最少鋼筋的建議配置是？","e":"Table 7.1（一般板 / 懸臂頂筋）：h ≤ 150 T10-300 / T10-150；150 < h ≤ 200 T10-300 / T10-150；200 < h ≤ 250 T10-200 / T10-125；250 < h ≤ 300 T10-200 / T12-150。懸臂頂筋按 CoP 9.4.2 ≥ 0.25%、間距 ≤ 150 mm。","x":"250 < h ≤ 300 T10 - 200 T12-150","tier":"常考","ex":"detail","o":["T10-200","T10-125","T12-150","T10-150"],"a":2,"q_en":"ASD Table 7.1: cantilever slab with 250 < h ≤ 300 mm: preferred minimum top tension reinforcement?","e_en":"Table 7.1 (slab in general / cantilever top bars): h ≤ 150 T10-300 / T10-150; 150 < h ≤ 200 T10-300 / T10-150; 200 < h ≤ 250 T10-200 / T10-125; 250 < h ≤ 300 T10-200 / T12-150. Cantilever top steel per CoP 9.4.2 is ≥ 0.25% at ≤ 150 mm centres.","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-120","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.2","p":20,"q":"ASD 7.2 板簡化截斷規則（源自 IStructE Standard Method of Detailing）的適用條件，下列哪項不正確？","e":"條件：Qk ≤ Gk；均佈荷載於三跨或以上；跨度差 ≤ 最長跨度 15%。按圖：端支座頂筋伸入跨內 max(0.15L1, 45Ø)（端部 TAL）；內支座頂筋伸出 max(0.3L, 45Ø)（L 取相鄰較大跨）；懸臂後跨頂筋伸入 max(2.0L3, 0.3L2, 45Ø)；底筋在 B1 搭接 max(24Ø, 300)，端部入支座 12Ø。CoP 9.3.1.2 則指向 9.2.1.6 一般截斷規則。","x":"c. THE VARIATION IN SPAN LENGTH DOES NOT EXCEED 15% OF THE LONGEST SPAN","tier":"常考","ex":"detail","o":["荷載大致均佈於三跨或以上","跨度差不超過最長跨度的 25%","Qk 不超過 Gk","跨度差不超過最長跨度的 15%"],"a":1,"q_en":"Which is NOT a condition for the ASD 7.2 simplified slab curtailment rules (from the IStructE Standard Method of Detailing)?","o_en":["Loads substantially uniformly distributed over three or more spans","Span variation not exceeding 25% of the longest span","Qk not exceeding Gk","Span variation not exceeding 15% of the longest span"],"e_en":"Conditions: Qk ≤ Gk; uniformly distributed loads over three or more spans; span variation ≤ 15% of the longest span. From the figure: top bars at the end support extend max(0.15L1, 45Ø) into the span (TAL at the end); at interior supports max(0.3L, 45Ø) (L = greater adjacent span); into the backspan of a cantilever max(2.0L3, 0.3L2, 45Ø); bottom bars lap at B1 max(24Ø, 300) and enter the end support 12Ø. CoP 9.3.1.2 refers to the general curtailment rules of 9.2.1.6.","doc":"asd-drafting-manual-rc","pp":"7.2"},{"id":"ASD-121","t":"mcq","d":2,"tp":"板開孔 Slab openings","c":"7.4","p":22,"q":"ASD 7.4：板厚 ≤ 300 mm（> 200 mm）、邊長 ≤ 600 mm 的非結構性開孔，每邊加筋要求是？","e":"板厚 ≤ 200：1T16 T & B；≤ 300：1T20 T & B；或 AT = AA/2（被切斷鋼筋面積一半），取較大者，並以 TLL 搭接。開孔 < 200 mm 只需移開鋼筋；更大開孔須由 PSE 設計。","x":"≤ 300 1T20 T & B","tier":"常考","ex":"detail","o":["2T25 頂底","不需加筋","1T16 頂底各一支","1T20 頂底各一支，或 AT = AA/2，取較大者"],"a":3,"q_en":"ASD 7.4: slab thickness ≤ 300 mm (> 200 mm), structurally insignificant opening with sides ≤ 600 mm: trimming bars per side?","o_en":["2T25 top & bottom","No trimming bars","1T16 top & bottom","1T20 top & bottom, or AT = AA/2, whichever is greater"],"e_en":"Slab ≤ 200: 1T16 T & B; ≤ 300: 1T20 T & B; or AT = AA/2 (half the area of affected bars), whichever is greater, lapped by TLL. Openings < 200 mm only need bars displaced; larger openings need PSE design.","doc":"asd-drafting-manual-rc","pp":"7.4"},{"id":"ASD-122","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"8.2","p":24,"q":"ASD 8.2（fy = 500）樑受拉面最大淨間距表：βb = 1.00 時 S 是多少？","e":"S ≤ 70000βb/fy ≤ 300 mm（CoP 9.2.1.4 Equation 9.1）：βb 0.70 → 95、0.80 → 110、0.90 → 125、1.00 → 140、1.10 → 150、1.20 → 165、1.30 → 180 mm。另可用 S ≤ 47000/fs ≤ 300 mm。最小淨距按圖為 25 mm 或較大鋼筋直徑取較大（圖中讀取）；CoP 8.2 為 max(鋼筋直徑, hagg + 5 mm, 20 mm)。","x":"S 95 110 125 140 150 165 180","tier":"常考","ex":"detail","o":["140 mm","300 mm","95 mm","180 mm"],"a":0,"q_en":"ASD 8.2 (fy = 500) table of maximum clear spacing near the tension face: what is S for βb = 1.00?","e_en":"S ≤ 70000βb/fy ≤ 300 mm (CoP 9.2.1.4 Equation 9.1): βb 0.70 → 95, 0.80 → 110, 0.90 → 125, 1.00 → 140, 1.10 → 150, 1.20 → 165, 1.30 → 180 mm. Alternatively S ≤ 47000/fs ≤ 300 mm. The figure shows minimum clear spacing as 25 mm or the larger bar diameter, whichever is greater (read from figure); CoP 8.2 uses max(bar diameter, hagg + 5 mm, 20 mm).","doc":"asd-drafting-manual-rc","pp":"8.2"},{"id":"ASD-123","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"8.2","p":24,"q":"ASD 8.2 矩形樑配筋表中受拉筋「一般 4% / 0.13%」。與 CoP Table 9.1 比較，主要分別是？","e":"ASD 表：受拉 一般 4% / 0.13%、ductility 2.5%（只限 critical zone）/ 0.3%；受壓 一般 4% / 0.2%、ductility 4% / 0.3%；搭接處同層直徑和 ≤ 40% 截面寬度；懸臂樑受拉 0.25%。ASD 沒有寫 αmin；CoP Table 9.1 受拉最少量是 0.13αmin（例：C60 → αmin = 1.23）。翼緣橫向筋 ASD 寫 0.15% hf l，CoP 為 0.15αmin。","x":"REINFORCEMENT DUCTILITY 2.5%# 0.3%","tier":"常考","ex":"detail","o":["CoP 上限是 6%","沒有分別","CoP 的 0.13% 還要乘 αmin = 40fcu^(2/3)/fy ≥ 1.0，高強混凝土時較大","CoP 用 0.24%"],"a":2,"q_en":"The ASD 8.2 rectangular beam table gives tension steel \"general 4% / 0.13%\". Compared with CoP Table 9.1, what is the key difference?","o_en":["The CoP maximum is 6%","No difference","The CoP 0.13% is multiplied by αmin = 40fcu^(2/3)/fy ≥ 1.0, larger for high-strength concrete","The CoP uses 0.24%"],"e_en":"ASD table: tension general 4% / 0.13%, ductility 2.5% (critical zone only) / 0.3%; compression general 4% / 0.2%, ductility 4% / 0.3%; at laps sum of diameters in a layer ≤ 40% of breadth; cantilevered beams tension 0.25%. The ASD omits αmin; CoP Table 9.1 minimum tension is 0.13αmin (e.g. C60 → αmin = 1.23). Flange transverse steel: ASD 0.15% hf l, CoP 0.15αmin.","doc":"asd-drafting-manual-rc","pp":"8.2"},{"id":"ASD-124","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"8.2","p":29,"q":"ASD 8.2：樑深超過 750 mm、樑寬 b ≥ 300 mm 時，建議側筋是？","e":"側筋尺寸 ≥ √(sb·b/fy)，b 取樑寬或 500 mm 較小者；建議 b ≥ 250：T12-250；b ≥ 300：T16-250。CoP 9.2.1.2：間距 ≤ 250 mm，分佈於受拉面起 2/3 樑深。","x":"≥ 250 T12-250 ≥ 300 T16-250","tier":"常考","ex":"detail","o":["T10-200","T12-250","T16-250","T12-300"],"a":2,"q_en":"ASD 8.2: beam deeper than 750 mm with breadth b ≥ 300 mm: preferred side bars?","e_en":"Side bar size ≥ √(sb·b/fy), b = breadth or 500 mm whichever is smaller; preferred b ≥ 250: T12-250; b ≥ 300: T16-250. CoP 9.2.1.2: spacing ≤ 250 mm, over 2/3 of the overall depth from the tension face.","doc":"asd-drafting-manual-rc","pp":"8.7"},{"id":"ASD-125","t":"mcq","d":2,"tp":"樑箍筋 Beam links","c":"8.3","p":30,"q":"ASD 8.3：沿跨度方向剪力箍最大間距取以下哪組的最小值？","e":"ASD：min(300, 0.75d, 最小側向尺寸)；第一組箍距支座 ≤ min(100 mm, ½ 箍距)。CoP 9.2.2 只規定 ≤ 0.75d，橫向每支受拉筋距豎肢 ≤ 150 mm，所以 ASD 較嚴。150 mm / 8Ø / h/4 是 ductility critical zone 內的 ASD 規定。","x":"(i) MINIMUM SIZE TO BE T10 ( A ) IN THE DIRECTION OF SPAN, THE LEAST OF","tier":"常考","ex":"detail","o":["0.75d 而已","150 mm、8Ø、h/4","300 mm、0.75d、樑截面最小側向尺寸","400 mm、12Ø、樑寬"],"a":2,"q_en":"ASD 8.3: maximum shear link spacing along the span is the least of which set?","o_en":["0.75d only","150 mm, 8Ø, h/4","300 mm, 0.75d, least lateral dimension of the beam","400 mm, 12Ø, beam breadth"],"e_en":"ASD: min(300, 0.75d, least lateral dimension); first link from the support ≤ min(100 mm, ½ spacing). CoP 9.2.2 only requires ≤ 0.75d, with no tension bar more than 150 mm from a vertical leg, so the ASD is stricter. 150 mm / 8Ø / h/4 is the ASD rule inside a ductile critical zone.","doc":"asd-drafting-manual-rc","pp":"8.8"},{"id":"ASD-126","t":"mcq","d":2,"tp":"樑箍筋 Beam links","c":"8.3","p":30,"q":"ASD 8.3：fcu ≤ 40、fyv = 500 N/mm² 時，最少剪力箍 Asv/sv 可簡化為？","e":"Asv = 0.4bv·sv/(0.87fyv) → Asv/sv = 0.4/(0.87 × 500) × 1000 = 0.92 bv mm²/m（bv 以 mm 計）。例：bv = 400 → 368 mm²/m，T10 雙肢（157 mm²）@ 300 = 523 mm²/m 足夠。fcu > 40 時 0.4 改為 0.4(fcu/40)^(2/3)（CoP Table 6.2）。","x":"i.e. = 0.92 bv mm2/m RUN FOR fyv = 500 N/mm2","tier":"常考","ex":"detail","o":["0.46 bv mm²/m","1.84 bv mm²/m","0.92 bv mm²/m","0.4 bv mm²/m"],"a":2,"q_en":"ASD 8.3: for fcu ≤ 40 and fyv = 500 N/mm², the minimum shear links Asv/sv simplify to?","e_en":"Asv = 0.4bv·sv/(0.87fyv) → Asv/sv = 0.4/(0.87 × 500) × 1000 = 0.92 bv mm²/m (bv in mm). Example: bv = 400 → 368 mm²/m; T10 two legs (157 mm²) at 300 = 523 mm²/m is enough. For fcu > 40, 0.4 becomes 0.4(fcu/40)^(2/3) (CoP Table 6.2).","doc":"asd-drafting-manual-rc","pp":"8.8"},{"id":"ASD-127","t":"mcq","d":2,"tp":"樑箍筋 Beam links","c":"8.3","p":30,"q":"ASD 8.3 名義剪力箍表：樑寬 400 < bv ≤ 700 mm 時用？","e":"bv ≤ 400：T10-300 S.S.；400–700：T10-300（3 肢）；700–1000：T10-300 D.S.；1000–1300：T10-300（5 肢）。箍筋 T10–T16，同一樑宜用同一尺寸。","x":"400 < bv ≤ 700 T10 - 300 (3 LEGS)","tier":"常考","ex":"detail","o":["T10-300（3 肢）","T10-300 雙箍（D.S.）","T10-300 單箍（S.S.）","T10-300（5 肢）"],"a":0,"q_en":"ASD 8.3 nominal shear link table: for beam breadth 400 < bv ≤ 700 mm use?","o_en":["T10-300 (3 legs)","T10-300 double set (D.S.)","T10-300 single set (S.S.)","T10-300 (5 legs)"],"e_en":"bv ≤ 400: T10-300 S.S.; 400–700: T10-300 (3 legs); 700–1000: T10-300 D.S.; 1000–1300: T10-300 (5 legs). Links T10–T16, preferably one size throughout a beam.","doc":"asd-drafting-manual-rc","pp":"8.8"},{"id":"ASD-128","t":"mcq","d":3,"tp":"樑箍筋 Beam links","c":"8.3","p":31,"q":"ASD 8.3（ductility）：critical zone 內剪力箍最大縱向間距取以下哪組的最小值？","e":"ASD：critical zone 內 ≤ min(8Ø, h/4, 150 mm)；區外 ≤ min(0.75d, b, 12Ø)；橫向肢距 ≤ min(250 mm, 20Ø 箍)。CoP 9.9.1.3：區內 min(150 mm, 8Ø)；區外 min(最小側向尺寸, 12Ø)，沒有 h/4 及 0.75d，所以 ASD 較嚴。","x":"INSIDE THE CRITICAL ZONE : (i) ＞8Ø ;","tier":"常考","ex":"detail","o":["10Ø、200 mm","8Ø、h/4、150 mm","8Ø、150 mm（沒有 h/4）","12Ø、b、0.75d"],"a":1,"q_en":"ASD 8.3 (ductility): maximum longitudinal link spacing inside the critical zone is the least of?","o_en":["10Ø, 200 mm","8Ø, h/4, 150 mm","8Ø, 150 mm (no h/4)","12Ø, b, 0.75d"],"e_en":"ASD: inside the critical zone ≤ min(8Ø, h/4, 150 mm); outside ≤ min(0.75d, b, 12Ø); leg spacing across ≤ min(250 mm, 20Ø link). CoP 9.9.1.3: inside min(150 mm, 8Ø); outside min(least lateral dimension, 12Ø), without h/4 and 0.75d, so the ASD is stricter.","doc":"asd-drafting-manual-rc","pp":"8.9"},{"id":"ASD-129","t":"mcq","d":2,"tp":"樑箍筋 Beam links","c":"8.3","p":32,"q":"ASD 8.3 / 9.2 / 10.2：箍筋彎鉤 ≥ 135° 時的錨固直段 ℓb 是？","e":"≥ 135°：10Ø 且 ≥ 70 mm；≥ 150°：5Ø 且 ≥ 50 mm。樑箍、柱箍及牆 CBE 箍都用同一表。CoP 8.5 以 Figure 8.2 表示（未在此以文字核對）。","x":"ℓb 10Ø BUT ≥ 70mm 5Ø BUT ≥ 50mm","tier":"常考","ex":"detail","o":["10Ø 但 ≥ 70 mm","8Ø 但 ≥ 50 mm","5Ø 但 ≥ 50 mm","12Ø 但 ≥ 100 mm"],"a":0,"q_en":"ASD 8.3 / 9.2 / 10.2: anchorage leg ℓb for a link hook of ≥ 135°?","o_en":["10Ø but ≥ 70 mm","8Ø but ≥ 50 mm","5Ø but ≥ 50 mm","12Ø but ≥ 100 mm"],"e_en":"≥ 135°: 10Ø and ≥ 70 mm; ≥ 150°: 5Ø and ≥ 50 mm. The same table is used for beam links, column binders and wall CBE links. CoP 8.5 shows this in Figure 8.2 (not text-verified here).","doc":"asd-drafting-manual-rc","pp":"8.10"},{"id":"ASD-130","t":"mcq","d":2,"tp":"樑箍筋 Beam links","c":"8.4","p":33,"q":"ASD 8.4：抗扭箍最大間距取以下哪組的最小值？","e":"抗扭箍：min(200 mm, x1, ½y1)，x1、y1 為抗扭箍的尺寸（見圖）；須用閉合箍（Type P / Q，Type R 不建議）。比一般剪力箍 300 mm 更密。","x":"MAXIMUM SPACING OF TORSION LINKS","tier":"常考","ex":"detail","o":["400 mm、x1、y1","200 mm、x1、½y1","300 mm、0.75d、b","150 mm、8Ø"],"a":1,"q_en":"ASD 8.4: maximum spacing of torsion links is the least of?","o_en":["400 mm, x1, y1","200 mm, x1, ½y1","300 mm, 0.75d, b","150 mm, 8Ø"],"e_en":"Torsion links: min(200 mm, x1, ½y1), where x1, y1 are the torsion link dimensions (see figure); closed links are required (Types P / Q; Type R not preferred). Denser than the 300 mm general link limit.","doc":"asd-drafting-manual-rc","pp":"8.11"},{"id":"ASD-131","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"8.2","p":28,"q":"ASD 8.2（ductility）：除非提供約束鋼筋，樑搭接不應位於柱面起多少範圍內？","e":"搭接不得在柱面起一個有效深度內（同 CoP 9.9.1.2(d)）；ASD 另容許按 SEBGL-RC10 提供約束鋼筋時例外。critical zone 為柱面起 2 倍樑深，區內受壓筋 ≥ ½ 受拉筋。","x":"EFFECTIVE DEPTH OF THE MEMBER FROM THE COLUMN FACE.","tier":"常考","ex":"detail","o":["500 mm","樑深的一半","2 倍樑深","一個有效深度 d"],"a":3,"q_en":"ASD 8.2 (ductility): unless confining reinforcement is provided, beam laps shall not be located within what distance of the column face?","o_en":["500 mm","Half the beam depth","2 times the beam depth","One effective depth d"],"e_en":"Laps shall not be within one effective depth of the column face (same as CoP 9.9.1.2(d)); the ASD allows an exception where confining reinforcement is provided per SEBGL-RC10. The critical zone is 2 times the beam depth from the column face, where compression steel ≥ ½ tension steel.","doc":"asd-drafting-manual-rc","pp":"8.6"},{"id":"ASD-132","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.1","p":34,"q":"ASD 9.1：柱主筋最大間距（受拉筋 / 受壓筋）是？","e":"ASD：受拉 150 mm、受壓 250 mm；面積最少 0.8%、最多 6%（ductility 4%），搭接處 10%（ductility 5.2%）；T16–T40；矩形柱最少 4 支、圓柱 6 支；每 100 mm 柱寬最多一支 T40；同一排只用兩個相連尺寸，Ø2 > ⅔Ø1。CoP 9.5 無此最大間距；ductility 柱 9.9.2.1(b) 為 max(¼ 側向尺寸, 200 mm)。","x":"(a) TENSION BAR – 150 mm WHERE ∅2 ≤ ∅1","tier":"常考","ex":"detail","o":["300 mm / 300 mm","150 mm / 250 mm","250 mm / 400 mm","150 mm / 150 mm"],"a":1,"q_en":"ASD 9.1: maximum spacing of column main bars (tension / compression)?","e_en":"ASD: tension 150 mm, compression 250 mm; area min. 0.8%, max. 6% (ductility 4%), 10% at laps (ductility 5.2%); T16–T40; min. 4 bars rectangular, 6 circular; one T40 max. per 100 mm of column width; only two consecutive sizes in a row, Ø2 > ⅔Ø1. CoP 9.5 has no such maximum; ductile columns 9.9.2.1(b) use max(¼ lateral dimension, 200 mm).","doc":"asd-drafting-manual-rc","pp":"9.1"},{"id":"ASD-133","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.1","p":34,"q":"ASD 9.1：使用 Type 1 機械接駁器時，任何截面最多可接駁多少比例的柱主筋，接駁器錯開多少？","e":"Type 1 接駁器：任何截面最多 50%，錯開 900 mm（CoP 9.9.2.1(d) 亦要求至少兩層、相距 ≥ 900 mm）。圖中 300 mm 為 Type 2 接駁器距樓面（CoP 9.9.2.1(e)）。搭接：一般用 TLL（同 CLL），1.4 TLL 由 PSE 指明；最少 max(12Ø, 300)（按圖）。","x":"(ii) 50% MAX. SPLICING AT ANY SECTION","tier":"常考","ex":"detail","o":["50%；300 mm","50%；900 mm","33%；600 mm","100%；300 mm"],"a":1,"q_en":"ASD 9.1: with Type 1 mechanical couplers, what maximum proportion of column bars may be spliced at any section, and how far apart are couplers staggered?","o_en":["50%; 300 mm","50%; 900 mm","33%; 600 mm","100%; 300 mm"],"e_en":"Type 1 couplers: max. 50% at any section, staggered 900 mm (CoP 9.9.2.1(d) also requires at least 2 layers ≥ 900 mm apart). The 300 mm in the figure is the Type 2 coupler height above floor (CoP 9.9.2.1(e)). Laps: generally TLL (same as CLL), 1.4 TLL where specified by the PSE; at least max(12Ø, 300) (from figure).","doc":"asd-drafting-manual-rc","pp":"9.1"},{"id":"ASD-134","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.2","p":36,"q":"ASD 9.2：柱主筋為 T20 時，建議柱箍是？","e":"箍距 ≤ min(400 mm, 12 × 最小主筋直徑, 柱較小尺寸)：T16 → T10-175；T20 → T10-225；T25–T40 → T10-300。箍筋最少 T10；角筋及外層隔一支須被箍；任何主筋距受約束鋼筋 ≤ 150 mm。CoP 9.5.2.1 箍筋直徑只要求 ≥ 6 mm 或 ¼ 最大主筋，ASD 規定 T10。","x":"b) 12∅ OF SMALLEST MAIN BAR 20 T10-225","tier":"常考","ex":"detail","o":["T10-175","T10-225","T12-150","T10-300"],"a":1,"q_en":"ASD 9.2: preferred column binder for T20 main bars?","e_en":"Spacing ≤ min(400 mm, 12 × smallest main bar, lesser column dimension): T16 → T10-175; T20 → T10-225; T25–T40 → T10-300. Binders min. T10; corner and alternate outer bars linked; no main bar > 150 mm from a restrained bar. CoP 9.5.2.1 only requires ≥ 6 mm or ¼ of the largest main bar; the ASD sets T10.","doc":"asd-drafting-manual-rc","pp":"9.3"},{"id":"ASD-135","t":"mcq","d":3,"tp":"柱配筋 Column detailing","c":"9.2","p":37,"q":"ASD 9.2 柱箍分區：ductility 柱的 Zone C（critical zone）長度取？","e":"ASD 簡化為 max(H/6, 柱較大尺寸, 500 mm)，H 為柱淨高。CoP 9.9.2.2 則按 N/(Ag·fcu)：≤ 0.1 → 1.0 倍、≤ 0.3 → 1.5 倍、≤ 0.6 → 2.0 倍柱較大尺寸（或彎矩超過 0.85/0.75/0.65 最大值範圍，或 1/6 淨高，取大）。Zone C 箍距 ≤ min(150 mm, 8Ø 最小柱筋)（同 CoP）。","x":"MAX. (H/6; GREATER COLUMN","tier":"常考","ex":"detail","o":["柱較小尺寸","2 倍樑深","H/4","max(H/6, 柱較大尺寸, 500 mm)"],"a":3,"q_en":"ASD 9.2 column binder zoning: length of Zone C (critical zone) in a ductile column?","o_en":["Lesser column dimension","2 times the beam depth","H/4","max(H/6, greater column dimension, 500 mm)"],"e_en":"The ASD simplifies to max(H/6, greater column dimension, 500 mm), H = clear height. CoP 9.9.2.2 depends on N/(Ag·fcu): ≤ 0.1 → 1.0, ≤ 0.3 → 1.5, ≤ 0.6 → 2.0 times the greater dimension (or where moment exceeds 0.85/0.75/0.65 of the maximum, or 1/6 clear height, whichever larger). Zone C spacing ≤ min(150 mm, 8Ø smallest column bar) (same as CoP).","doc":"asd-drafting-manual-rc","pp":"9.4"},{"id":"ASD-136","t":"mcq","d":3,"tp":"柱配筋 Column detailing","c":"9.2","p":38,"q":"ASD 9.2 Zone 1（樁帽/基腳頂的搭接區）：T32 柱筋每支最少箍筋是？","e":"每支搭接筋都要被箍：T16 → T10-125；T20 → T10-150；T25 → T10-135；T32 → T12-150；T40 → T12-135。Zone 0（樁帽/基腳內）最少 3T10 單箍（不需 135° 鉤）。","x":"25 T10-135 32 T12-150 40 T12-135","tier":"常考","ex":"detail","o":["T10-125","T12-150","T12-135","T10-150"],"a":1,"q_en":"ASD 9.2 Zone 1 (lap zone at top of pile cap / footing): minimum binder for each T32 column bar?","e_en":"Every lapped bar must be linked: T16 → T10-125; T20 → T10-150; T25 → T10-135; T32 → T12-150; T40 → T12-135. Zone 0 (within the pile cap / footing) needs min. 3T10 single binders (135° hook not required).","doc":"asd-drafting-manual-rc","pp":"9.5"},{"id":"ASD-137","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.3","p":39,"q":"ASD 9.3 樑柱節點（Zone D）：水平箍最大豎向間距是？","e":"節點水平箍至少同 Zone B，並均勻 ≤ min(10Ø, 200 mm)；在連接樑寬度範圍內的柱筋可不箍。豎向節點剪力筋（如需要）水平間距 ≤ max(¼ 側向柱尺寸, 200 mm)，每邊最少一支中間筋。","x":"(b) 200 mm (a) 10∅ OF SMALLEST MAIN BAR","tier":"常考","ex":"detail","o":["min(10Ø 最小主筋, 200 mm)","300 mm","min(12Ø, 400 mm)","150 mm"],"a":0,"q_en":"ASD 9.3 beam-column joint (Zone D): maximum vertical spacing of horizontal binders?","o_en":["min(10Ø smallest main bar, 200 mm)","300 mm","min(12Ø, 400 mm)","150 mm"],"e_en":"Joint horizontal binders at least as Zone B and evenly ≤ min(10Ø, 200 mm); column bars within the width of connecting beams need not be bound. Vertical joint shear bars (if required) at horizontal spacing ≤ max(¼ lateral column dimension, 200 mm), min. one intermediate bar each side.","doc":"asd-drafting-manual-rc","pp":"9.6"},{"id":"ASD-138","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"ASD 10.1：鋼筋混凝土牆水平筋最大間距是？CoP 9.6.3 又是多少？","e":"ASD：豎筋 ≤ min(300 mm（受拉牆 150 mm）, 3t)，水平筋 ≤ 300 mm。CoP：豎筋 ≤ min(3t, 400 mm)（9.6.2），水平筋 ≤ 400 mm（9.6.3）。ASD 較嚴，要分清。","x":"ii. HORIZONTAL BARS – 300 mm","tier":"常考","ex":"detail","o":["兩者都是 3 倍牆厚","兩者都是 400 mm","ASD 300 mm；CoP 400 mm","ASD 400 mm；CoP 300 mm"],"a":2,"q_en":"ASD 10.1: maximum horizontal bar spacing in an RC wall? And CoP 9.6.3?","o_en":["Both 3 times wall thickness","Both 400 mm","ASD 300 mm; CoP 400 mm","ASD 400 mm; CoP 300 mm"],"e_en":"ASD: vertical ≤ min(300 mm (150 mm for walls in tension), 3t), horizontal ≤ 300 mm. CoP: vertical ≤ min(3t, 400 mm) (9.6.2), horizontal ≤ 400 mm (9.6.3). The ASD is stricter; keep them apart.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-139","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"ASD 10.1：素混凝土牆（plain wall）如配筋，豎筋及水平筋最少各為？","e":"素牆：豎、水平各 0.25%（同 CoP 9.6.5 fy 500）。鋼筋混凝土牆：豎 0.4% 最少、4.0% 最多、搭接 8.0%；水平 0.25% 最少。牆筋 T10–T32（T40 只限特殊情況）。","x":"i. VERTICAL BARS – 0.25% MIN.","tier":"常考","ex":"detail","o":["豎 0.25%、水平 0.4%","各 0.13%","各 0.25%","豎 0.4%、水平 0.25%"],"a":2,"q_en":"ASD 10.1: for a plain wall, where reinforced, minimum vertical and horizontal steel?","o_en":["Vertical 0.25%, horizontal 0.4%","0.13% each","0.25% each","Vertical 0.4%, horizontal 0.25%"],"e_en":"Plain wall: 0.25% each way (as CoP 9.6.5 for fy 500). Reinforced wall: vertical 0.4% min., 4.0% max., 8.0% at laps; horizontal 0.25% min. Wall bars T10–T32 (T40 only in exceptional cases).","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-140","t":"mcq","d":3,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"ASD 10.1：牆豎向受壓筋 > 2% 時，箍筋最大豎向間距是？（注意與 CoP 9.6.4 比較）","e":"ASD：箍筋 ≥ T10，豎向間距 ≤ min(2t, 16 × 箍筋直徑)，水平 ≤ 2t；受壓豎筋距受約束鋼筋 ≤ 200 mm，箍夾角 ≤ 90°。CoP 9.6.4：箍 ≥ 6 mm 或 ¼ 最大受壓筋，豎向 ≤ 16 倍（受壓）鋼筋直徑。兩者寫法不同，要分清。","x":"b) 16 × LINK DIAMETER","tier":"常考","ex":"detail","o":["min(2 × 牆厚, 16 × 箍筋直徑)","min(牆厚, 12 × 豎筋直徑)","200 mm","min(2 × 牆厚, 16 × 豎筋直徑)"],"a":0,"q_en":"ASD 10.1: where vertical compression bars exceed 2%, maximum vertical spacing of wall links? (Compare with CoP 9.6.4.)","o_en":["min(2 × wall thickness, 16 × link diameter)","min(wall thickness, 12 × vertical bar diameter)","200 mm","min(2 × wall thickness, 16 × vertical bar diameter)"],"e_en":"ASD: links ≥ T10, vertical spacing ≤ min(2t, 16 × link diameter), horizontal ≤ 2t; compression bars ≤ 200 mm from a restrained bar, link angle ≤ 90°. CoP 9.6.4: links ≥ 6 mm or ¼ of the largest compression bar, vertical ≤ 16 times the (compression) bar diameter. The wording differs; keep them apart.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-141","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"ASD 10.1 名義鋼筋牆表：牆厚 200 ≤ h < 240 mm、沒有 FRR 要求時，建議豎筋是？","e":"豎筋（無 FRR）：150–160 T10-200 EF；160–180 T10-200 EF；180–200 T12-250 EF；200–240 T12-200 EF；240–300 T12-170 EF。水平筋（所有情況）：150–160 T10-300 EF；160–200 T10-250 EF；200–240 T10-200 EF；240–300 T12-250 EF。FRR 240 分鐘時 150–180 mm 牆厚不容許，180–240 mm 需約 1% 豎筋（T16-200 / T16-160 EF），表註明此類牆厚不建議，應加厚牆。","x":"200 ≤ h < 240 T12-200 EF T12-200 EF T12-200 EF T16-160 EF T10-200 EF","tier":"常考","ex":"detail","o":["T12-200 EF","T16-160 EF","T12-250 EF","T10-200 EF"],"a":0,"q_en":"ASD 10.1 nominal wall reinforcement table: wall 200 ≤ h < 240 mm with no FRR requirement: preferred vertical bars?","e_en":"Vertical (no FRR): 150–160 T10-200 EF; 160–180 T10-200 EF; 180–200 T12-250 EF; 200–240 T12-200 EF; 240–300 T12-170 EF. Horizontal (all cases): 150–160 T10-300 EF; 160–200 T10-250 EF; 200–240 T10-200 EF; 240–300 T12-250 EF. For FRR 240 min, 150–180 mm walls are not allowed and 180–240 mm walls need about 1% vertical steel (T16-200 / T16-160 EF); the table marks such thicknesses as not preferred, so thicken the wall.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-142","t":"mcq","d":3,"tp":"牆配筋 Wall detailing","c":"10.2","p":42,"q":"ASD 10.2：0.38 < Ncr ≤ 0.75 的牆，在 critical zone 及上一層的 confined boundary element（Type 3）要求是？","e":"Type 3：1.0%、6 支 T16、間距 ≤ 150、T12 @ 150；Type 2（0 < Ncr ≤ 0.38 的 critical zone）：0.8%、6 支 T16、間距 ≤ 300、T10 @ 200；Type 1（其他位置）：0.6%、6 支 T12、間距 ≤ 300、T10 @ 250。與 CoP 9.9.3.2 相同，ASD 另加 Type 1/2 豎筋間距 ≤ 300。Ncr = N/(0.45fcu·Ac) ≤ 0.75，N = 1.4Gk + 1.6Qk。critical zone：H ≤ 24 m 至最低層天花；H > 24 m 至第二低層天花或 H/10 取大。","x":"WITHIN CRITICAL ZONE AND THE 3 1.0%ACBE 6 T16 150 T12 150mm","tier":"常考","ex":"detail","o":["1.0% ACBE、最少 6 支 T16、豎筋間距 ≤ 150、T12 箍 @ ≤ 150 mm","0.4%、4 支 T12","0.6%、6 支 T12、T10 箍 @ 250 mm","0.8%、6 支 T16、T10 箍 @ 200 mm"],"a":0,"q_en":"ASD 10.2: for walls with 0.38 < Ncr ≤ 0.75, what are the Type 3 confined boundary element requirements in the critical zone and the storey above?","o_en":["1.0% ACBE, min. 6 T16, vertical spacing ≤ 150, T12 links at ≤ 150 mm","0.4%, 4 T12","0.6%, 6 T12, T10 links at 250 mm","0.8%, 6 T16, T10 links at 200 mm"],"e_en":"Type 3: 1.0%, 6 T16, spacing ≤ 150, T12 at 150; Type 2 (critical zone with 0 < Ncr ≤ 0.38): 0.8%, 6 T16, spacing ≤ 300, T10 at 200; Type 1 (other locations): 0.6%, 6 T12, spacing ≤ 300, T10 at 250. Same as CoP 9.9.3.2, with the ASD adding vertical spacing ≤ 300 for Types 1/2. Ncr = N/(0.45fcu·Ac) ≤ 0.75, N = 1.4Gk + 1.6Qk. Critical zone: H ≤ 24 m to the ceiling of the lowest floor; H > 24 m to the ceiling of the second lowest floor or H/10, whichever greater.","doc":"asd-drafting-manual-rc","pp":"10.3"},{"id":"ASD-143","t":"mcq","d":2,"tp":"牆開孔 Wall openings","c":"10.4","p":43,"q":"ASD 10.4：牆厚 200 ≤ h ≤ 250 mm、開孔闊 1 m < L1 ≤ 2 m，加筋是？","e":"h < 120：1T12 單層 / 2T12-75 單層；120 ≤ h < 200：1T12 EF / 2T12-75 EF；200 ≤ h ≤ 250：1T16 EF / 2T16-75 EF（L1 < 1 m / 1–2 m）。L1 < 鋼筋間距不需加筋；L1 > 2 m 或關鍵位置須諮詢 PSE。","x":"200 ≤ h ≤ 250 1T16 EF 2T16 - 75 EF","tier":"常考","ex":"detail","o":["2T12 - 75 EF","2T16 - 75 EF","1T16 EF","1T12 EF"],"a":1,"q_en":"ASD 10.4: wall 200 ≤ h ≤ 250 mm, opening width 1 m < L1 ≤ 2 m: trimming bars?","e_en":"h < 120: 1T12 single layer / 2T12-75 single layer; 120 ≤ h < 200: 1T12 EF / 2T12-75 EF; 200 ≤ h ≤ 250: 1T16 EF / 2T16-75 EF (L1 < 1 m / 1–2 m). No trimming bars if L1 < bar spacing; L1 > 2 m or critical locations need the PSE.","doc":"asd-drafting-manual-rc","pp":"10.4"},{"id":"ASD-144","t":"mcq","d":2,"tp":"水缸詳圖 Water tank detailing","c":"12.0","p":47,"q":"ASD 12.0：水缸 C35、fy 500 的受拉錨固及搭接長度（TAL / TLL）是？","e":"水缸 53Ø（可按 As,req/As,prov 折減）；一般結構 C35 T20 TLL 750 mm ≈ 37.5Ø（Table 3.5）。水缸另要求 T10 最小、0.35%、間距 ≤ min(300, 厚度)、保護層 40 mm。","x":"GRADE, fcu 500 35 53∅","tier":"偶考","ex":"detail","o":["53Ø","37.5Ø","40Ø","45Ø"],"a":0,"q_en":"ASD 12.0: water tank TAL / TLL for C35 concrete and fy 500?","e_en":"Water tank 53Ø (may be reduced by As,req/As,prov); ordinary C35 T20 TLL 750 mm ≈ 37.5Ø (Table 3.5). Water tanks also need T10 min., 0.35%, spacing ≤ min(300, thickness), cover 40 mm.","doc":"asd-drafting-manual-rc","pp":"12.1"},{"id":"ASD-145","t":"mcq","d":1,"tp":"繪圖規範 Drawing conventions","c":"2.2.3","p":6,"q":"ASD 2.2.3：framing plan 上樑標記「1B2 (600x400)」中括號尺寸的次序是？","e":"樑：(深 × 闊)，例 1B2 = 1 樓第 2 號樑；前綴 C = 懸臂；漸變樑 (800~600~800x400)、加腋樑 (800│600x400)。柱則寫 (闊 × 深)，例 (600X1000)；圓柱 (1000 DIA.)。板寫厚度 (150)，前綴 C = 懸臂板。","x":"(600X400) SIZE OF RECTANGULAR BEAM (DEPTH X BREADTH)","tier":"常考","ex":"detail","o":["闊度 × 深度","長度 × 深度","深度 × 闊度","淨跨 × 深度"],"a":2,"q_en":"ASD 2.2.3: in the framing plan beam mark \"1B2 (600x400)\", what order are the bracketed dimensions in?","o_en":["Breadth × depth","Length × depth","Depth × breadth","Clear span × depth"],"e_en":"Beams: (depth × breadth), e.g. 1B2 = beam no. 2 on floor 1; prefix C = cantilever; tapered (800~600~800x400), haunched (800│600x400). Columns are written (breadth × depth), e.g. (600X1000); circular (1000 DIA.). Slabs show thickness (150), prefix C = cantilever slab.","doc":"asd-drafting-manual-rc","pp":"2.3"},{"id":"ASD-146","t":"mcq","d":1,"tp":"繪圖規範 Drawing conventions","c":"2.1","p":4,"q":"ASD 2.1：A1 大小的 General Notes 圖紙，建議分幾欄？","e":"A1：4–5 欄；B1：6–7 欄。框圖剖面符號避免用 I、O 及數字 0；字母符號用於貫穿多層的剖面，數字符號用於單一樓層的局部剖面。","x":"4 – 5 COLUMNS FOR A1-SIZED DRAWING","tier":"偶考","ex":"detail","o":["6 – 7 欄","8 欄","4 – 5 欄","2 – 3 欄"],"a":2,"q_en":"ASD 2.1: how many columns are recommended for an A1-sized General Notes drawing?","o_en":["6 – 7 columns","8 columns","4 – 5 columns","2 – 3 columns"],"e_en":"A1: 4–5 columns; B1: 6–7 columns. Section marks avoid I, O and the number 0; alphabetic marks for sections across floors, numeric marks for local sections on one floor plan.","doc":"asd-drafting-manual-rc","pp":"2.1"},{"id":"ASD-147","t":"mcq","d":1,"tp":"樓梯 Staircases","c":"11.1","p":44,"q":"ASD 11.1：樓梯配筋詳圖的一般要求是？","e":"樓梯按板的規定：T10–T20、最少配筋 Table 7.1、主筋最大間距 Table 7.2、外露 ≤ 200 mm。Section 11.2 只以圖示縱向（由平台支承 / 連續跨）及橫向跨樓梯的配筋，圖中沒有可讀取的額外數值。","x":"FOLLOW SLAB DETAILING REQUIREMENTS (SEE SECTION 7.0)","tier":"常考","ex":"detail","o":["由承建商決定","依從板的詳圖要求（Section 7.0）","另有獨立的最少 0.4% 配筋","依從樑的詳圖要求（Section 8.0）"],"a":1,"q_en":"ASD 11.1: what are the general requirements for staircase reinforcement detailing?","o_en":["Left to the contractor","Follow the slab detailing requirements (Section 7.0)","A separate 0.4% minimum","Follow the beam detailing requirements (Section 8.0)"],"e_en":"Stairs follow the slab rules: T10–T20, minimum steel per Table 7.1, main bar spacing per Table 7.2, exposed ≤ 200 mm. Section 11.2 only illustrates longitudinally spanning (supported by landings / continuous) and transversely spanning stairs; the figures carry no additional readable values.","doc":"asd-drafting-manual-rc","pp":"11.1"},{"id":"BR-001","t":"mcq","d":1,"tp":"可靠性及設計年限 Reliability & working life","c":"2.2(1)","p":27,"q":"按 SDM，除另有規定外，公路結構及鐵路橋的設計使用年限（design working life）為？","e":"SDM 2.2(1)：120 年（UK NA 的 design working life category 5）。考試方案評估寫耐久性、保護層及維修時可引用。50 年只適用於 walkway covers、sign gantries 及 noise barriers/enclosures。","x":"bridges shall be 120 years, i.e. design working life category 5","tier":"常考","ex":"bridge","o":["100 年","120 年","60 年","50 年"],"a":1,"q_en":"Per the SDM, unless otherwise stated, what is the design working life of highway structures and railway bridges?","o_en":["100 years","120 years","60 years","50 years"],"e_en":"SDM 2.2(1): 120 years (design working life category 5 of the UK NA). Quote it in appraisals when discussing durability, cover and maintenance. 50 years applies only to walkway covers, sign gantries and noise barriers/enclosures.","doc":"sdm-2013","pp":"25"},{"id":"BR-002","t":"mcq","d":1,"tp":"可靠性及設計年限 Reliability & working life","c":"2.2(2)","p":27,"q":"行人通道上蓋（walkway covers）、路牌架及隔音屏障的設計使用年限為？","e":"SDM 2.2(2)：50 年（category 4）。天橋本身仍是 120 年，只有上蓋類附屬結構是 50 年。","x":"shall be 50 years, i.e. design working life category 4","tier":"偶考","ex":"bridge","o":["100 年","25 年","50 年","120 年"],"a":2,"q_en":"What is the design working life of walkway covers, sign gantries and noise barriers/enclosures?","o_en":["100 years","25 years","50 years","120 years"],"e_en":"SDM 2.2(2): 50 years (category 4). The footbridge itself is still 120 years; only cover-type ancillary structures are 50 years.","doc":"sdm-2013","pp":"25"},{"id":"BR-003","t":"mcq","d":2,"tp":"可靠性及設計審核 Reliability & design checking","c":"Table 2.2","p":28,"q":"按 SDM Table 2.2，以下哪一項會令公路結構列為 Category III（複雜結構）？","e":"Category III 特徵包括：任何跨度 > 80 m、斜交 > 45°、連續結構跨度 > 65 m、困難地基或施工等。其餘三項屬 Category I（簡單結構）。","x":"c) Any span exceeding 80m;","tier":"偶考","ex":"bridge","o":["最高 3 m 的隔音屏障","單跨簡支少於 20 m 及斜交少於 25°","擋土牆擋土高度少於 7 m","任何跨度超過 80 m"],"a":3,"q_en":"Per SDM Table 2.2, which feature makes a highway structure Category III (complex structure)?","o_en":["Noise barrier with a maximum height of 3 m","Single simply supported span less than 20 m with skew less than 25°","Retaining wall with retained height less than 7 m","Any span exceeding 80 m"],"e_en":"Category III features include any span > 80 m, skew > 45°, continuous structure with spans > 65 m, difficult foundations or construction. The other three are Category I (simple structures).","doc":"sdm-2013","pp":"26"},{"id":"BR-004","t":"mcq","d":2,"tp":"可靠性及設計審核 Reliability & design checking","c":"2.4.3(1)(c)","p":29,"q":"Category III 公路結構的獨立審核應由誰進行？","e":"Category I：同機構、可同一團隊；Category II：同機構但獨立於設計團隊；Category III：另一獨立機構。","x":"carried out by a checking team from a separate independent organization","tier":"偶考","ex":"bridge","o":["承建商的設計部門","同一設計團隊內的合資格專業人士","同一機構但獨立於設計團隊的人士","來自另一獨立機構的審核團隊"],"a":3,"q_en":"Who shall carry out the independent check of a Category III highway structure?","o_en":["The contractor's design department","A qualified professional from the same design team","A professional in the same organization but independent of the design team","A checking team from a separate independent organization"],"e_en":"Category I: same organization, may be the same team; Category II: same organization but independent of the design team; Category III: a separate independent organization.","doc":"sdm-2013","pp":"27"},{"id":"BR-005","t":"tf","d":1,"tp":"荷載組合 Combinations of actions","c":"3.2.1(2)","p":35,"q":"按 SDM，BS EN 1990 所要求的雪荷載在香港應予忽略。","e":"SDM 3.2.1(2) 明確規定香港忽略雪荷載。考試寫荷載清單時不用列雪荷載。","x":"Snow load required in Clause 4.1.1(2) of BS EN 1990 shall be neglected in Hong Kong.","tier":"偶考","ex":"bridge","a":true,"q_en":"Per the SDM, the snow load required by BS EN 1990 shall be neglected in Hong Kong.","e_en":"SDM 3.2.1(2) states snow load shall be neglected in Hong Kong. Do not list snow in the exam load schedule.","doc":"sdm-2013","pp":"33"},{"id":"BR-006","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.1","p":36,"q":"SDM Table 3.1（公路橋）中，持久設計狀況下風力 FWk 的 ψ0 為？","e":"公路橋風 ψ0 = 0.50（施工期間 0.80）；0.60 是溫度 Tk；0.75 是 TS/UDL；0.30 是行人天橋的風（Table 3.2）。","x":"Persistent design situation 0.50 0.20 0","tier":"必考","ex":"bridge","o":["0.50","0.60","0.75","0.30"],"a":0,"q_en":"In SDM Table 3.1 (road bridges), what is ψ0 for wind forces FWk in the persistent design situation?","e_en":"Road bridge wind ψ0 = 0.50 (0.80 during execution); 0.60 is thermal Tk; 0.75 is TS/UDL; 0.30 is wind on footbridges (Table 3.2).","doc":"sdm-2013","pp":"34"},{"id":"BR-007","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.2","p":36,"q":"SDM Table 3.2（行人天橋）中，交通荷載 gr1 的 ψ0 為？","e":"行人天橋 gr1：ψ0 = ψ1 = 0.40，ψ2 = 0；風 FWk ψ0 = 0.30；溫度 Tk ψ0 = 0.60。","x":"gr1 0.40 0.40 0","tier":"必考","ex":"bridge","o":["0.75","0.60","0.40","0.30"],"a":2,"q_en":"In SDM Table 3.2 (footbridges), what is ψ0 for traffic load group gr1?","e_en":"Footbridge gr1: ψ0 = ψ1 = 0.40, ψ2 = 0; wind FWk ψ0 = 0.30; thermal Tk ψ0 = 0.60.","doc":"sdm-2013","pp":"34"},{"id":"BR-008","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.1","p":36,"q":"SDM Table 3.1 及 3.2 中，溫度作用 Tk 的 ψ0、ψ1、ψ2 分別為？","e":"溫度 Tk：0.60 / 0.60 / 0.50（公路橋及行人天橋相同）。0.50 / 0.20 / 0 是公路橋風（持久狀況）。","x":"Thermal actions Tk 0.60 0.60 0.50","tier":"常考","ex":"bridge","o":["0.50, 0.20, 0","0.60, 0.60, 0.50","0.60, 0.50, 0.50","0.75, 0.75, 0"],"a":1,"q_en":"In SDM Table 3.1 and Table 3.2, what are ψ0, ψ1 and ψ2 for thermal actions Tk?","e_en":"Thermal Tk: 0.60 / 0.60 / 0.50 (same for road bridges and footbridges). 0.50 / 0.20 / 0 is wind on road bridges (persistent).","doc":"sdm-2013","pp":"34"},{"id":"BR-009","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（STR/GEO Set B）中，混凝土自重的 γG,sup 為？","e":"Set B：混凝土自重 1.35；鋼自重 1.20；附加恆載（super-imposed dead）1.50；路面 1.20。1.40 是屋宇署混凝土規範的恆載系數，勿混淆。","x":"Concrete self weight γG,sup = 1.35 γG,inf = 0.95","tier":"必考","ex":"bridge","o":["1.40","1.50","1.35","1.20"],"a":2,"q_en":"In SDM Table 3.4 (STR/GEO Set B), what is γG,sup for concrete self weight?","e_en":"Set B: concrete self weight 1.35; steel self weight 1.20; super-imposed dead 1.50; road surfacing 1.20. 1.40 is the dead load factor of the BD Concrete Code; do not mix them up.","doc":"sdm-2013","pp":"36"},{"id":"BR-010","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，附加恆載（super-imposed dead）的 γG,sup 為？","e":"附加恆載（欄杆、路面以外的附加物、隔音屏障等）γG,sup = 1.50，比混凝土自重 1.35 高，因為其數值變異較大。路面（road surfacing）則是 1.20。","x":"Super-imposed dead γG,sup = 1.50 γG,inf = 0.95","tier":"必考","ex":"bridge","o":["1.05","1.35","1.50","1.20"],"a":2,"q_en":"In SDM Table 3.4 (Set B), what is γG,sup for super-imposed dead load?","e_en":"Super-imposed dead (parapets, finishes other than surfacing, noise barriers etc.) γG,sup = 1.50, higher than concrete self weight 1.35 because of greater variability. Road surfacing is 1.20.","doc":"sdm-2013","pp":"36"},{"id":"BR-011","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，公路交通作用（gr1a、gr1b、gr2、gr5、gr6）的 γQ 為？","e":"公路交通及行人作用 γQ = 1.35（有利時取 0）。1.15 是 Set C；1.60 / 1.50 是 BS 8110 / 屋宇署規範的活載系數。","x":"Road traffic actions (gr1a, gr1b, gr2, gr5, gr6) γQ = 1.35","tier":"必考","ex":"bridge","o":["1.15","1.50","1.35","1.60"],"a":2,"q_en":"In SDM Table 3.4 (Set B), what is γQ for road traffic actions (gr1a, gr1b, gr2, gr5, gr6)?","e_en":"Road traffic and pedestrian actions γQ = 1.35 (0 where favourable). 1.15 is Set C; 1.60 / 1.50 are live load factors in BS 8110 / the BD codes.","doc":"sdm-2013","pp":"36"},{"id":"BR-012","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，以簡化程序（Clause 3.4.2）求得風壓的風作用 γQ 為？","e":"簡化程序 γQ = 1.55；全程序（full procedure, Clause 3.4.3）γQ = 2.10；Set C 簡化程序為 1.30。1.40 是屋宇署規範的風載系數。考試風荷載計算題必須寫清楚用哪一個。","x":"Wind velocity pressure derived by simplified procedure (Clause 3.4.2) γQ = 1.55","tier":"必考","ex":"bridge","o":["1.30","1.55","1.40","2.10"],"a":1,"q_en":"In SDM Table 3.4 (Set B), what is γQ for wind actions with velocity pressure from the simplified procedure (Clause 3.4.2)?","e_en":"Simplified procedure γQ = 1.55; full procedure (Clause 3.4.3) γQ = 2.10; Set C simplified is 1.30. 1.40 is the BD code wind factor. State clearly which one you use in the exam wind calculation.","doc":"sdm-2013","pp":"36"},{"id":"BR-013","t":"mcq","d":3,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，以全程序（Clause 3.4.3）求得風壓的風作用 γQ 為？","e":"全程序 γQ = 2.10（Set C 為 1.80）；考慮渦激振動（vortex excitation）的氣動效應為 1.32。","x":"Wind velocity pressure derived by full procedure (Clause 3.4.3) γQ = 2.10","tier":"常考","ex":"bridge","o":["1.32","1.55","1.80","2.10"],"a":3,"q_en":"In SDM Table 3.4 (Set B), what is γQ for wind actions with velocity pressure from the full procedure (Clause 3.4.3)?","e_en":"Full procedure γQ = 2.10 (Set C 1.80); aerodynamic effects with vortex excitation 1.32.","doc":"sdm-2013","pp":"36"},{"id":"BR-014","t":"mcq","d":2,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，溫度作用的 γQ 為？","e":"溫度 1.45（Set C 為 1.20）；支座摩擦 1.30；交通 1.35。","x":"Thermal actions γQ = 1.45 (0 where favourable)","tier":"常考","ex":"bridge","o":["1.35","1.20","1.30","1.45"],"a":3,"q_en":"In SDM Table 3.4 (Set B), what is γQ for thermal actions?","e_en":"Thermal 1.45 (Set C 1.20); bearing friction 1.30; traffic 1.35.","doc":"sdm-2013","pp":"36"},{"id":"BR-015","t":"mcq","d":3,"tp":"荷載組合 Combinations of actions","c":"Table 3.4","p":38,"q":"SDM Table 3.4（Set B）中，土壤、地下水及自由水的水平土壓力 γG,sup 為？","e":"Set B 水平土壓力 1.65；EQU（Set A）為 1.25；Set C 為 1.20。橋台設計要留意。","x":"Horizontal earth pressure from soil, ground water and free water γG,sup = 1.65 γG,inf = 0.95","tier":"常考","ex":"bridge","o":["1.35","1.65","1.20","1.25"],"a":1,"q_en":"In SDM Table 3.4 (Set B), what is γG,sup for horizontal earth pressure from soil, ground water and free water?","e_en":"Set B horizontal earth pressure 1.65; EQU (Set A) 1.25; Set C 1.20. Relevant to abutment design.","doc":"sdm-2013","pp":"36"},{"id":"BR-016","t":"mcq","d":3,"tp":"荷載組合 Combinations of actions","c":"Table 3.3 Note 5(B)","p":37,"q":"施工期間，如失去平衡可導致多人死亡（例如跨越鐵路或快速公路的橋），影響穩定的永久作用分項系數 γG,sup 及 γG,inf 應調整為？","e":"EQU 一般為 1.05 / 0.95；跨越鐵路或快速公路的橋在施工期間提高至 1.15、降至 0.85。與考試常見的「跨路／跨鐵路橋」施工方法（懸臂施工、頂推）直接相關。","x":"should be increased to 1.15 and decreased to 0.85 respectively","tier":"常考","ex":"bridge","o":["1.15 及 0.85","1.35 及 0.95","1.05 及 0.95","1.25 及 0.90"],"a":0,"q_en":"During execution, where loss of equilibrium could cause multiple fatalities (e.g. bridges over railways or motorways), to what should γG,sup and γG,inf for permanent actions affecting stability be adjusted?","o_en":["1.15 and 0.85","1.35 and 0.95","1.05 and 0.95","1.25 and 0.90"],"e_en":"EQU is normally 1.05 / 0.95; for bridges over railways or motorways during execution increase to 1.15 and decrease to 0.85. Directly relevant to exam method statements for bridges over roads/railways (balanced cantilever, launching).","doc":"sdm-2013","pp":"35"},{"id":"BR-017","t":"mcq","d":3,"tp":"荷載組合 Combinations of actions","c":"Table 3.5","p":39,"q":"SDM Table 3.5（STR/GEO Set C）中，公路交通作用的 γQ 為？","e":"Set C（岩土設計）：永久作用 1.00，交通 1.15，簡化程序風 1.30，溫度 1.20。","x":"Road traffic actions (gr1a, gr1b, gr2, gr5, gr6) γQ = 1.15","tier":"偶考","ex":"bridge","o":["1.00","1.30","1.15","1.35"],"a":2,"q_en":"In SDM Table 3.5 (STR/GEO Set C), what is γQ for road traffic actions?","e_en":"Set C (geotechnical): permanent actions 1.00, traffic 1.15, simplified-procedure wind 1.30, thermal 1.20.","doc":"sdm-2013","pp":"37"},{"id":"BR-018","t":"mcq","d":3,"tp":"荷載組合 Combinations of actions","c":"3.2.2 Note 1","p":40,"q":"SDM 的裂縫寬度驗算組合（Crack Width Verification Combination）中，如考慮 gr5，SV196 車輛軸重應乘以？","e":"3.2.2 Note 1：gr5 的 SV196 軸重乘 0.56。此組合取代 Eurocode 的 quasi-permanent 組合作裂縫寬度驗算。","x":"shall be multiplied by 0.56","tier":"常考","ex":"bridge","o":["0.40","1.00","0.75","0.56"],"a":3,"q_en":"In the SDM Crack Width Verification Combination, when gr5 is considered, the axle loads of the SV196 vehicle are multiplied by?","e_en":"3.2.2 Note 1: SV196 axle loads multiplied by 0.56 for gr5. This combination replaces the Eurocode quasi-permanent combination for crack width checks.","doc":"sdm-2013","pp":"38"},{"id":"BR-019","t":"tf","d":2,"tp":"荷載組合 Combinations of actions","c":"3.2.1(1)","p":35,"q":"除 BS EN 1990 的組合外，SDM 另訂兩個香港專用組合：裂縫寬度驗算組合，及預應力構件的拉應力驗算組合。","e":"SDM 3.2.1(1)(a)(b)。混凝土橋的 SLS 驗算要用這兩個組合，而不是 Eurocode 的 quasi-permanent / frequent 組合。","x":"Crack width verification combination as defined in Clause 3.2.2","tier":"常考","ex":"bridge","a":true,"q_en":"In addition to the BS EN 1990 combinations, the SDM defines two Hong Kong-specific combinations: the crack width verification combination and the tensile stress verification combinations for prestressed concrete members.","e_en":"SDM 3.2.1(1)(a)(b). SLS checks of concrete bridges use these two combinations instead of the Eurocode quasi-permanent / frequent combinations.","doc":"sdm-2013","pp":"33"},{"id":"BR-020","t":"mcq","d":1,"tp":"恆載及附加恆載 Dead & superimposed dead loads","c":"3.3(2)","p":41,"q":"按 SDM，混凝土自重應取不少於？","e":"SDM 3.3(2)：不少於 25 kN/m³。橋面板初步估算恆載時用。","x":"The self-weight of concrete shall be taken as not less than 25 kN/m3","tier":"必考","ex":"bridge","o":["24 kN/m³","26 kN/m³","23.5 kN/m³","25 kN/m³"],"a":3,"q_en":"Per the SDM, the self-weight of concrete shall be taken as not less than?","e_en":"SDM 3.3(2): not less than 25 kN/m³. Use it for preliminary deck dead load estimates.","doc":"sdm-2013","pp":"39"},{"id":"BR-021","t":"mcq","d":2,"tp":"恆載及附加恆載 Dead & superimposed dead loads","c":"3.3(3)","p":41,"q":"如橋面行車面為瀝青，附加恆載應包括最少多厚的瀝青面層？","e":"SDM 3.3(3)：最少 100 mm 瀝青。如以結構混凝土作行車面，則恆載要另加最少 25 mm 混凝土。考試公路橋 SDL 計算常用。","x":"allowance for a minimum thickness of 100 mm of asphaltic surfacing","tier":"必考","ex":"bridge","o":["50 mm","75 mm","100 mm","40 mm"],"a":2,"q_en":"Where the running surface is asphalt, the superimposed dead load shall allow for a minimum asphaltic surfacing thickness of?","e_en":"SDM 3.3(3): minimum 100 mm asphalt. Where structural concrete is the running surface, allow a minimum extra 25 mm of concrete in dead load. Commonly used in exam road bridge SDL calculations.","doc":"sdm-2013","pp":"39"},{"id":"BR-022","t":"mcq","d":2,"tp":"恆載及附加恆載 Dead & superimposed dead loads","c":"3.3(2)","p":41,"q":"如以橋面結構混凝土直接作行車面，恆載應額外計入最少多厚的混凝土？","e":"SDM 3.3(2)：最少額外 25 mm 混凝土（磨損/修補用）。瀝青面層則為 100 mm。","x":"minimum extra thickness of 25 mm of","tier":"常考","ex":"bridge","o":["100 mm","10 mm","50 mm","25 mm"],"a":3,"q_en":"If the structural concrete of the deck is used as the running surface, what minimum extra thickness of concrete shall the dead load include?","e_en":"SDM 3.3(2): a minimum extra 25 mm of concrete (wear/repair). Asphalt surfacing is 100 mm.","doc":"sdm-2013","pp":"39"},{"id":"BR-030","t":"mcq","d":1,"tp":"橋樑風荷載 Wind actions on bridges","c":"Table 3.8","p":44,"q":"2018–2024 年的橋樑題都寫明「open area with Degree 3 of exposure to wind」。按 SDM Table 3.8（簡化程序），Degree 3 的峰值風壓 qp 為？","e":"Table 3.8：Degree 1 = 2.5、Degree 2 = 2.8、Degree 3 = 3.3、Degree 4 = 3.8 kN/m²。Degree 3 描述為「Elevated situation; not sheltered by buildings or topography」（例：Tai Po Road Interchange）。這是橋樑題風荷載部分（10 分）的起點。","x":"3 3.3 by buildings or topography","tier":"必考","ex":"bridge","o":["3.8 kN/m²","3.3 kN/m²","2.5 kN/m²","2.8 kN/m²"],"a":1,"q_en":"The 2018–2024 bridge questions all state \"open area with Degree 3 of exposure to wind\". Per SDM Table 3.8 (simplified procedure), what is the peak velocity pressure qp for Degree 3?","e_en":"Table 3.8: Degree 1 = 2.5, Degree 2 = 2.8, Degree 3 = 3.3, Degree 4 = 3.8 kN/m². Degree 3 is \"Elevated situation; not sheltered by buildings or topography\" (e.g. Tai Po Road Interchange). This is the starting point of the 10-mark wind part of bridge questions.","doc":"sdm-2013","pp":"42"},{"id":"BR-031","t":"num","d":1,"tp":"橋樑風荷載 Wind actions on bridges","c":"Table 3.8","p":44,"q":"2025 年橋樑題寫明「Degree 4 of exposure to wind」。按 SDM Table 3.8，qp 為多少 kN/m²？","e":"Degree 4 = 3.8 kN/m²，描述為「Exposed to north-easterly or south easterly winds across open sea」（例：Ap Lei Chau Bridge）。海旁（waterfront）橋樑通常屬此級。","x":"4 3.8 easterly winds across open sea","tier":"必考","ex":"bridge","a":3.8,"tol":0.0,"u":"kN/m²","q_en":"The 2025 bridge question states \"Degree 4 of exposure to wind\". Per SDM Table 3.8, what is qp in kN/m²?","e_en":"Degree 4 = 3.8 kN/m², described as \"Exposed to north-easterly or south easterly winds across open sea\" (e.g. Ap Lei Chau Bridge). Waterfront bridges usually fall in this degree.","doc":"sdm-2013","pp":"42"},{"id":"BR-032","t":"mcq","d":1,"tp":"橋樑風荷載 Wind actions on bridges","c":"Table 3.8","p":44,"q":"SDM Table 3.8 中，Degree 1（受周圍建築物及/或地形遮擋）的 qp 為？","e":"Degree 1 = 2.5 kN/m²（例：Kowloon Park Drive Flyover）；Degree 2（正常暴露）= 2.8 kN/m²（例：Castle Road Flyover）。1.54 kN/m² 是 Table 3.8a 地面行人通道上蓋 ≤ 4 m 的值。","x":"buildings and /or topography Drive Flyover","tier":"必考","ex":"bridge","o":["2.8 kN/m²","2.5 kN/m²","3.3 kN/m²","1.54 kN/m²"],"a":1,"q_en":"In SDM Table 3.8, what is qp for Degree 1 (sheltered by surrounding buildings and/or topography)?","e_en":"Degree 1 = 2.5 kN/m² (e.g. Kowloon Park Drive Flyover); Degree 2 (normal exposure) = 2.8 kN/m² (e.g. Castle Road Flyover). 1.54 kN/m² is the Table 3.8a value for at-grade walkway covers ≤ 4 m.","doc":"sdm-2013","pp":"42"},{"id":"BR-033","t":"tf","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.2.1(1)","p":43,"q":"以簡化程序設計的橋，Table 3.7 的 qp 與結構離地高度無關。","e":"SDM 3.4.2.1(1)：「regardless of the height of the structure above ground」。這與建築物風力規範（Wind Code 2019）按高度取 Qo,z 不同。","x":"Table 3.7 for bridges designed to the simplified procedure, regardless of the height","tier":"必考","ex":"bridge","a":true,"q_en":"For bridges designed to the simplified procedure, qp from Table 3.7 is used regardless of the height of the structure above ground.","e_en":"SDM 3.4.2.1(1): \"regardless of the height of the structure above ground\". This differs from the building Wind Code 2019 where Qo,z depends on height.","doc":"sdm-2013","pp":"41"},{"id":"BR-034","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.1(5)","p":43,"q":"以下哪一種橋必須採用風荷載的全程序（full procedure, Clause 3.4.3）？","e":"3.4.1(5)：(a) 任何跨度 > 1
