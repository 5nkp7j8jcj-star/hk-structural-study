ater than 20.","doc":"concrete-2013-2020ed","pp":"78","tags":["concrete-2013-2020ed","柱 Columns","flashcard"]},{"id":"CON-F26","tp":"穩健性 Robustness","c":"6.4.1.2","p":107,"f":"設計 ties 時鋼筋 γm？","b":"1.0（按 characteristic strength）；可利用其他用途的鋼筋。","e":"Clause 6.4.1.2。","x":"the reinforcement may be assumed to be acting at its characteristic strength","e_en":"Clause 6.4.1.2.","f_en":"γm for reinforcement when designing ties?","b_en":"1.0 (based on characteristic strength); reinforcement provided for other purposes may be counted.","doc":"concrete-2013-2020ed","pp":"93","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-F27","tp":"穩健性 Robustness","c":"6.4.1.3","p":107,"f":"Tie 錨固於垂直方向另一 tie 的要求？","b":"延伸 12 × 鋼筋直徑（或等效錨固）超越另一 tie 所有鋼筋；或以有效錨固長度超越其中心線。","e":"Clause 6.4.1.3。","x":"(a) 12 x bar diameter or an equivalent anchorage beyond all the bars of the other tie; or","e_en":"Clause 6.4.1.3.","f_en":"Requirement for anchoring a tie to a tie in the perpendicular direction?","b_en":"Extend 12 × bar diameter (or equivalent anchorage) beyond all bars of the other tie; or an effective anchorage length beyond its centreline.","doc":"concrete-2013-2020ed","pp":"93","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-F28","tp":"基礎 Foundations","c":"6.7.2.2","p":111,"f":"Pad footing 鋼筋何時要集中？","b":"lc > 3c/4 + 9d/4 時，2/3 鋼筋集中於柱中線至柱面外 1.5d 範圍。","e":"否則均勻分佈於 lc。","x":"Where lc exceeds (3c/4 + 9d/4), two-thirds of the required reinforcement should be concentrated within","e_en":"Otherwise distribute uniformly over lc.","f_en":"When must pad footing reinforcement be concentrated?","b_en":"When lc > 3c/4 + 9d/4, 2/3 of the reinforcement is concentrated within the zone from the column centreline to 1.5d beyond the column face.","doc":"concrete-2013-2020ed","pp":"97","tags":["concrete-2013-2020ed","基礎 Foundations","flashcard"]},{"id":"CON-F30","tp":"撓度 Deflection","c":"7.3.1","p":120,"f":"外觀撓度限值及 pre-camber 上限？","b":"Quasi-permanent sag 限 span/250；模板預拱一般不超過 span/250。","e":"Clause 7.3.1。","x":"any upward deflection incorporated in the formwork should not generally exceed span/250.","e_en":"Clause 7.3.1.","f_en":"Deflection limit for appearance and limit on pre-camber?","b_en":"Quasi-permanent sag limited to span/250; formwork pre-camber generally not more than span/250.","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","flashcard"]},{"id":"CON-F31","tp":"撓度 Deflection","c":"7.3.2","p":120,"f":"風致加速度限值（Concrete Code）？","b":"住宅 0.15 m/s²；寫字樓/酒店 0.25 m/s²（1-in-10-year，10 分鐘）。","e":"Clause 7.3.2。","x":"Office or hotel 0.25 m/s2","e_en":"Clause 7.3.2.","f_en":"Wind-induced acceleration limits (Concrete Code)?","b_en":"Residential 0.15 m/s²; office/hotel 0.25 m/s² (1-in-10-year, 10 minutes).","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","flashcard"]},{"id":"CON-F32","tp":"撓度 Deflection","c":"Table 7.3","p":121,"f":"Table 7.3 矩形樑基本 span/d？","b":"懸臂 7；簡支 20；連續 26；端跨 23。","e":"雙向板以短跨檢核。","x":"Continuous 26 21 26","e_en":"Two-way slabs are checked on the short span.","f_en":"Table 7.3 basic span/d for rectangular beams?","b_en":"Cantilever 7; simply supported 20; continuous 26; end span 23.","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","撓度 Deflection","flashcard"]},{"id":"CON-F33","tp":"錨固 Anchorage","c":"8.4.5","p":132,"f":"錨固長度公式？","b":"lb ≥ fs·φ/(4fbu)，fs = 0.87fy，fbu = β√fcu（fcu ≤ 60）。","e":"見 Clause 8.4.4–8.4.5。","x":"The ultimate anchorage bond length lb should be greater than or equal to the value calculated from:","e_en":"See Clause 8.4.4–8.4.5.","f_en":"Anchorage length formula?","b_en":"lb ≥ fs·φ/(4fbu), fs = 0.87fy, fbu = β√fcu (fcu ≤ 60).","doc":"concrete-2013-2020ed","pp":"118","tags":["concrete-2013-2020ed","錨固 Anchorage","flashcard"]},{"id":"CON-F34","tp":"搭接 Laps","c":"8.7.2","p":136,"f":"相鄰搭接的縱向距離及淨距？","b":"縱向距離 ≥0.3 lo；相鄰鋼筋淨距 ≥ max(2φ, 20 mm)；搭接鋼筋橫向淨距 ≤ min(4φ, 50 mm)。","e":"Figure 8.4。","x":"(e) the longitudinal distance between two adjacent laps should not be less than 0.3 times the lap","e_en":"Figure 8.4.","f_en":"Longitudinal distance and clear spacing between adjacent laps?","b_en":"Longitudinal distance ≥0.3 lo; clear distance between adjacent bars ≥ max(2φ, 20 mm); transverse clear distance between lapped bars ≤ min(4φ, 50 mm).","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","flashcard"]},{"id":"CON-F35","tp":"樑配筋 Beam detailing","c":"9.2.1.4","p":149,"f":"樑受拉筋最大淨距公式？","b":"≤ 70 000βb/fy ≤ 300 mm；或 ≤ 47 000/fs ≤ 300 mm。","e":"樑側面至最近受拉筋距離不大於上述一半。","x":"clear spacing ≤ 70 000 βb/fy ≤ 300 mm 9.1","e_en":"Distance from the side of a beam to the nearest tension bar not more than half the above.","f_en":"Formula for maximum clear spacing of beam tension bars?","b_en":"≤ 70 000βb/fy ≤ 300 mm; or ≤ 47 000/fs ≤ 300 mm.","doc":"concrete-2013-2020ed","pp":"135","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","flashcard"]},{"id":"CON-F36","tp":"樑配筋 Beam detailing","c":"Table 9.1","p":150,"f":"矩形截面受彎最少受拉筋（fy 500）？","b":"0.13αmin（100As/Ac）。","e":"見 Table 9.1，αmin = 40fcu^(2/3)/fy 且不少於 1.0。","x":"(iii) rectangular section 100As/Ac 0.24αmin 0.13αmin","e_en":"See Table 9.1; αmin = 40fcu^(2/3)/fy and not less than 1.0.","f_en":"Minimum tension reinforcement for a rectangular section in flexure (fy 500)?","b_en":"0.13αmin (100As/Ac).","doc":"concrete-2013-2020ed","pp":"136","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","flashcard"]},{"id":"CON-F37","tp":"板配筋 Slab detailing","c":"9.3.1.4","p":154,"f":"板中間支座底筋連續要求？","b":"跨中計算底筋的 40% 須連續穿過支座。","e":"樑則為 30%（9.2.1.8）。","x":"At an intermediate support of a slab 40% of the calculated mid-span bottom reinforcement should be","e_en":"For beams it is 30% (9.2.1.8).","f_en":"Continuity requirement for bottom bars of slabs at internal supports?","b_en":"40% of the calculated midspan bottom reinforcement must be continuous through the support.","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","板配筋 Slab detailing","flashcard"]},{"id":"CON-F38","tp":"柱配筋 Column detailing","c":"9.5.1","p":156,"f":"柱縱筋上限？","b":"豎向澆築 6%；水平澆築 8%；搭接處 10%。","e":"Clause 9.5.1。","x":"(a) vertically-cast columns - 6%;","e_en":"Clause 9.5.1.","f_en":"Upper limit of column longitudinal reinforcement?","b_en":"Vertically cast 6%; horizontally cast 8%; at laps 10%.","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","flashcard"]},{"id":"CON-F39","tp":"柱配筋 Column detailing","c":"9.5.2.2","p":156,"f":"受壓區內任何鋼筋距受約束鋼筋最遠？","b":"150 mm；角筋及外層隔支鋼筋須由夾角 ≤135° 的箍筋/拉筋約束。","e":"Clause 9.5.2.2。","x":"No bar within a compression zone should be further than 150 mm from","e_en":"Clause 9.5.2.2.","f_en":"Maximum distance of any bar in the compression zone from a restrained bar?","b_en":"150 mm; corner bars and alternate bars in the outer layer must be restrained by links/ties with an included angle ≤135°.","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","flashcard"]},{"id":"CON-F40","tp":"施工 Construction","c":"10.3.8.2","p":177,"f":"樑撐、板撐及懸臂撐最短拆除時間？","b":"板撐 10 天；樑撐 14 天；懸臂撐 14 天。","e":"Portland cement，無其他資料時。","x":"(k) 14 days: props to cantilevers.","e_en":"Portland cement, in the absence of other information.","f_en":"Minimum periods before removal of beam props, slab props and cantilever props?","b_en":"Slab props 10 days; beam props 14 days; cantilever props 14 days.","doc":"concrete-2013-2020ed","pp":"163","tags":["concrete-2013-2020ed","施工 Construction","flashcard"]},{"id":"CON-F41","tp":"荷載測試 Load test","c":"13.2","p":207,"f":"Load test 加載次數與間隔？","b":"至少加載兩次，相隔最少 1 小時；每級加載後 5 分鐘才記錄；可考慮第三次加載保持 24 小時。","e":"Clause 13.2。","x":"The test loading should be applied at least twice, with a minimum of 1h between tests, and allowing 5","e_en":"Clause 13.2.","f_en":"Number of load applications and interval in a load test?","b_en":"Load at least twice, at least 1 hour apart; record 5 minutes after each load increment; a third loading held for 24 hours may be considered.","doc":"concrete-2013-2020ed","pp":"193","tags":["concrete-2013-2020ed","荷載測試 Load test","flashcard"]},{"id":"DIL-F01","tp":"總則 General","c":"1.1.3","p":5,"f":"Dead & Imposed Loads Code 的荷載是 factored 還是 unfactored？","b":"Unfactored，可當 characteristic loads 使用。","e":"要乘結構 Code 的 γf。","x":"All values of loads given in this Code are unfactored values","e_en":"To be multiplied by the γf of the structural Code.","f_en":"Are the loads in the Dead & Imposed Loads Code factored or unfactored?","b_en":"Unfactored; they may be used as characteristic loads.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","tags":["dead-imposed-loads-2011-2021ed","總則 General","flashcard"]},{"id":"DIL-F02","tp":"外加荷載 Imposed loads","c":"3.2.2","p":8,"f":"Table 3.2 的 Qk 施加於多大面積？","b":"任何 50 mm 邊長的正方形。","e":"停車場 6A/6B 為 200 mm，6C/6D 為 300 mm。","x":"The concentrated loads Qk given in Table 3.2 shall be applied on plan over any square with a","e_en":"For car parks: 200 mm for 6A/6B, 300 mm for 6C/6D.","f_en":"Over what area is Qk in Table 3.2 applied?","b_en":"Any square with 50 mm sides.","doc":"dead-imposed-loads-2011-2021ed","pp":"4","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"DIL-F03","tp":"外加荷載 Imposed loads","c":"Table 3.1","p":9,"f":"樓面用途 Class 1–8 分別是？","b":"1 住宅；2 寫字樓等非工業；3 聚集；4 商店；5 儲存/機房/工業；6 車輛；7 天台；8 附屬構件。","e":"Table 3.1 Classification of Floor Uses。","x":"5 Floors for storage, equipment, plant and industrial use","e_en":"Table 3.1 Classification of Floor Uses.","f_en":"What are the floor use classes, Class 1–8?","b_en":"1 domestic; 2 offices and other non-industrial; 3 congregation; 4 shopping; 5 storage/plant/industrial; 6 vehicular traffic; 7 roofs; 8 affiliated building elements.","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"DIL-F04","tp":"車輛荷載 Vehicular loads","c":"Table 3.3","p":13,"f":"Area Class 6A–6D 的車重上限？","b":"6A ≤3,000 kg；6B ≤5,500 kg；6C ≤24,000 kg；6D ≤30,000 kg；6E 其他（掛接式重型貨車）。","e":"消防車屬 6D。","x":"Areas accessible to vehicles not exceeding Light goods vehicles, light buses","e_en":"Fire engines are 6D.","f_en":"Vehicle weight limits for Area Class 6A–6D?","b_en":"6A ≤3,000 kg; 6B ≤5,500 kg; 6C ≤24,000 kg; 6D ≤30,000 kg; 6E other (articulated heavy goods vehicles).","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","flashcard"]},{"id":"DIL-F05","tp":"車輛荷載 Vehicular loads","c":"3.3.3","p":13,"f":"消防車通道額外集中荷載？","b":"230 kN 於 950 mm × 750 mm；100 kN 於 300 mm × 300 mm。","e":"EVA 板 punching 檢核。","x":"concentrated load of 100 kN uniformly distributed on plan over an area of 300 mm","e_en":"Punching check of EVA slabs.","f_en":"Additional concentrated loads for fire engine access?","b_en":"230 kN over 950 mm × 750 mm; 100 kN over 300 mm × 300 mm.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","flashcard"]},{"id":"DIL-F06","tp":"天台荷載 Roofs","c":"3.4.4","p":16,"f":"屋架下弦、天花吊架等需承托人重時的集中荷載？","b":"1.5 kN，置於最不利位置，並與 Table 3.8 荷載一併考慮。","e":"Clause 3.4.4。","x":"of 1.5 kN acting at a position that will produce the most adverse effect","e_en":"Clause 3.4.4.","f_en":"Concentrated load where roof truss bottom chords, ceiling hangers, etc. must carry the weight of a person?","b_en":"1.5 kN at the most adverse position, considered together with the Table 3.8 loads.","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","flashcard"]},{"id":"DIL-F07","tp":"附屬構件 Class 8","c":"Table 3.9","p":16,"f":"冷氣機平台（air conditioner platforms）的設計荷載？","b":"1.5 kN/m 沿外緣施加的 line load（qk 欄為「-」）。","e":"Table 3.9 Class 8。","x":"upper slabs) and air conditioner","e_en":"Table 3.9 Class 8.","f_en":"Design load for air conditioner platforms?","b_en":"A 1.5 kN/m line load applied along the outer edge (the qk column shows \"-\").","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","flashcard"]},{"id":"DIL-F08","tp":"間隔牆 Partitions","c":"3.6.1","p":17,"f":"未定位置間隔牆的 imposed load？","b":"≥ 1/3 每米長牆重（以 kPa 計），寫字樓 ≥ 1 kPa。","e":"屬 imposed load，不可折減。","x":"not less than 1/3 of the weight per metre length of the partitions uniformly distributed per","e_en":"It is imposed load and cannot be reduced.","f_en":"Imposed load for partitions with undetermined positions?","b_en":"≥ 1/3 of the wall weight per metre length (expressed in kPa), ≥ 1 kPa for offices.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","間隔牆 Partitions","flashcard"]},{"id":"DIL-F09","tp":"荷載折減 Reduction","c":"Table 3.10","p":17,"f":"樑的 imposed load 最大折減？","b":"20%（樓面面積 ≥180 m²）；<45 m² 不折減亦不可內插。","e":"只用於該樑。","x":"135 15 180 20 maximum","e_en":"Applies to that beam only.","f_en":"Maximum imposed load reduction for beams?","b_en":"20% (floor area ≥180 m²); no reduction and no interpolation below 45 m².","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","flashcard"]},{"id":"DIL-F10","tp":"荷載折減 Reduction","c":"Table 3.11","p":18,"f":"柱的 imposed load 最大折減？","b":"40%（超過 8 層）。","e":"每層 +5%，1 層為 0。","x":"Over 8 40 maximum","e_en":"+5% per floor; 0 for 1 floor.","f_en":"Maximum imposed load reduction for columns?","b_en":"40% (more than 8 floors).","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","flashcard"]},{"id":"DIL-F11","tp":"護欄荷載 Barriers","c":"3.8.2.1","p":19,"f":"看台（grandstands）有座位時的人群水平荷載？","b":"沿座位行 0.35 kN/m 或垂直座位行 0.15 kN/m（不同時施加）；無座位平台 0.25 kPa。","e":"Clause 3.8.2.1。","x":"0.35 kN/m of seating along the line of seats; or","e_en":"Clause 3.8.2.1.","f_en":"Horizontal crowd load on grandstands with seats?","b_en":"0.35 kN/m parallel to the rows of seats or 0.15 kN/m perpendicular to the rows (not applied simultaneously); 0.25 kPa for standing areas without seats.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","flashcard"]},{"id":"DIL-F12","tp":"車輛防撞欄 Vehicle barriers","c":"3.8.3.3","p":20,"f":"車撞力 F 的分布長度及位置？","b":"作用於 bumper height，垂直欄杆，均布於任何 1.5 m 長度。","e":"6A 600 mm；6B 800 mm；6C–6E 1200 mm。","x":"direction normal to and uniformly distributed over any length of 1.5 m of the barrier","e_en":"6A 600 mm; 6B 800 mm; 6C–6E 1200 mm.","f_en":"Distribution length and position of the vehicle impact force F?","b_en":"Acts at bumper height, perpendicular to the barrier, uniformly distributed over any 1.5 m length.","doc":"dead-imposed-loads-2011-2021ed","pp":"16","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","flashcard"]},{"id":"DIL-F13","tp":"車輛防撞欄 Vehicle barriers","c":"Table 3.15","p":20,"f":"直斜坡底車撞力放大系數 γ？","b":"斜坡 <10 m：1.0；10–20 m 線性內插 1.0–2.0；>20 m：2.0。","e":"Table 3.15。","x":"10 - 20 Linear interpolation between 1.0 and 2.0","e_en":"Table 3.15.","f_en":"Impact force factor γ at the bottom of straight ramps?","b_en":"Ramp <10 m: 1.0; 10–20 m: interpolate linearly 1.0–2.0; >20 m: 2.0.","doc":"dead-imposed-loads-2011-2021ed","pp":"16","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","flashcard"]},{"id":"DIL-F14","tp":"擋土結構附加荷載 Surcharge","c":"Table 3.17","p":21,"f":"Table 3.17 最低 surcharge？","b":"公共道路 20 kPa；私家路 10 kPa；獨立行人路、單車徑、遊樂場 5 kPa。","e":"與 Geoguide 1 一致。","x":"Private Roads 10","e_en":"Consistent with Geoguide 1.","f_en":"Minimum surcharge in Table 3.17?","b_en":"Public roads 20 kPa; private roads 10 kPa; separate footpaths, cycle tracks and playgrounds 5 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","flashcard"]},{"id":"DIL-F15","tp":"動力荷載 Dynamic","c":"3.10.1","p":21,"f":"Code 的 imposed loads 是否已包括動力效應？","b":"已包括輕微動力效應，但不包括人群有節奏同步活動或某些機器的特殊荷載。","e":"需要時參考專門文獻。","x":"The imposed loads given in this Code have allowed for small dynamic effects","e_en":"Refer to specialist literature where necessary.","f_en":"Do the imposed loads in the Code include dynamic effects?","b_en":"They include minor dynamic effects, but not special loads from rhythmic synchronised crowd activity or certain machinery.","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","動力荷載 Dynamic","flashcard"]},{"id":"DIL-F16","tp":"材料密度 Densities","c":"Appendix A","p":24,"f":"鋼（Steel）及泥土（Soil）密度？","b":"Steel 77.0 kN/m³；Soil 20 kN/m³。","e":"Appendix A 材料密度。","x":"Steel 77.0 Zinc 70.0","e_en":"Appendix A material densities.","f_en":"Density of steel and soil?","b_en":"Steel 77.0 kN/m³; soil 20 kN/m³.","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","flashcard"]},{"id":"CON-001-FC","doc":"concrete-2013-2020ed","tp":"預應力 Prestressed","c":"2.2.4.4(b)","p":23,"f":"預應力混凝土 class 3 構件在非常侵蝕性環境（如海水）中，表面裂縫寬度不應超過：","b":"0.1 mm","e":"Class 1 無拉應力；class 2 有拉應力但無可見裂縫；class 3 容許裂縫：very aggressive 環境 ≤0.1 mm，其他 ≤0.2 mm。海旁 PT 構件應留意。","x":"0.1 mm for members in very aggressive environments (e.g. exposure to sea) and not exceeding","e_en":"Class 1: no tensile stress; class 2: tensile stress but no visible cracking; class 3: cracking permitted — ≤0.1 mm in very aggressive environments, ≤0.2 mm otherwise. Watch this for PT members on the waterfront.","f_en":"For a class 3 prestressed concrete member in a very aggressive environment (e.g. exposure to sea), the surface crack width should not exceed:","pp":"9","tags":["concrete-2013-2020ed","預應力 Prestressed","flashcard"]},{"id":"CON-003-FC","doc":"concrete-2013-2020ed","tp":"穩健性 Robustness","c":"2.3.1.4(a)","p":24,"f":"所有樓宇應能抵抗 notional horizontal load，其值為每層 characteristic dead weight 的百分之幾？","b":"1.5 %","e":"2.3.1.4(a)：每層同時施加 1.5% Gk 的 notional horizontal load；在 load combination 2 或 3 中，design ultimate wind load 不應小於此值。低層、背風或受遮擋建築要特別檢核這個下限。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","e_en":"2.3.1.4(a): a notional horizontal load of 1.5% Gk applied simultaneously at each floor; in load combination 2 or 3 the design ultimate wind load should not be less than this. Check this lower bound especially for low-rise, leeward or shielded buildings.","f_en":"All buildings should be able to resist a notional horizontal load equal to what percentage of the characteristic dead weight of each floor?","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-004-FC","doc":"concrete-2013-2020ed","tp":"穩健性 Robustness","c":"2.3.1.4(b)","p":24,"f":"Key element 及其連接應能承受任何方向的 design ultimate load 是多少 kN/m²（不另乘 partial safety factor）？","b":"34 kN/m²","e":"2.3.1.4(b)：34 kN/m²，施加於構件的 projected area，不乘 γf。用於 disproportionate collapse 設計中「key element」路線，例如 transfer column 不能以移除構件方式處理時。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","e_en":"2.3.1.4(b): 34 kN/m² applied to the projected area of the member, with no γf applied. Used for the \"key element\" route in disproportionate collapse design, e.g. when a transfer column cannot be dealt with by notional removal.","f_en":"What design ultimate load in kN/m², acting in any direction, should a key element and its connections be able to withstand (with no additional partial safety factor)?","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-005-FC","doc":"concrete-2013-2020ed","tp":"荷載 Loads","c":"2.3.1.5","p":24,"f":"考慮 exceptional loads（誤用或意外）時，一般寫字樓（非儲存用途）應計入多少 imposed load？","b":"三分之一","e":"2.3.1.5：dead load + 1/3 wind + imposed load（儲存/工業或永久性 imposed load 取 100%，其他樓宇取 1/3），並按 2.3.2.2 取 γf = 1.05。","x":"are permanent, 100% of the imposed load; for other buildings, one-third of the imposed load.","e_en":"2.3.1.5: dead load + 1/3 wind + imposed load (100% for storage/industrial or permanent imposed load, 1/3 for other buildings), with γf = 1.05 per 2.3.2.2.","f_en":"When considering exceptional loads (misuse or accident), how much imposed load should be included for an ordinary office building (not storage use)?","b_en":"One-third","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","flashcard"]},{"id":"CON-008-FC","doc":"concrete-2013-2020ed","tp":"荷載組合 Load combinations","c":"2.3.2.2","p":25,"f":"評估 exceptional loads 或局部損毀後的持續穩定性時，γf 應取多少？","b":"1.05","e":"2.3.2.2：γf = 1.05；配合 2.4.3.2(b) γm：混凝土 1.3、鋼 1.0。用於 alternative load path（移除構件）分析。","x":"should be taken as 1.05 on the defined loads","e_en":"2.3.2.2: γf = 1.05; together with γm per 2.4.3.2(b): concrete 1.3, steel 1.0. Used in alternative load path (member removal) analysis.","f_en":"When assessing exceptional loads or continued stability after localised damage, what value of γf should be used?","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-009-FC","doc":"concrete-2013-2020ed","tp":"荷載組合 Load combinations","c":"2.3.2.6","p":26,"f":"豎向構件按車輛撞擊（vehicular impact）設計時，ULS 的 γf 應取多少？","b":"1.25","e":"2.3.2.6：γf 1.25；撞擊力按 Building (Construction) Regulation 17（2.3.1.4(d)）。停車場柱常見檢核。","x":"Where vertical elements are to be designed for vehicular impact γ at ULS should be 1.25.","e_en":"2.3.2.6: γf 1.25; impact force per Building (Construction) Regulation 17 (2.3.1.4(d)). A common check for car park columns.","f_en":"For vertical elements designed for vehicular impact, what γf should be used at ULS?","pp":"12","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-010-FC","doc":"concrete-2013-2020ed","tp":"防火 Fire","c":"Table 2.2","p":26,"f":"Fire limit state 下，一般區域（非走火梯、非永久）imposed load 的 γf 是：","b":"0.80（有充分理據可降至 0.50）","e":"Table 2.2：dead 1.00；永久 imposed（機器、儲存）1.00；走火梯及大堂 1.00；其他 0.80（可減至 0.50）；wind 0.33。Fire engineering 性能化設計時會用。","x":"Note: *The value may be reduced to 0.50 when suitable justification is available","e_en":"Table 2.2: dead 1.00; permanent imposed (machinery, storage) 1.00; escape stairs and lobbies 1.00; others 0.80 (may be reduced to 0.50); wind 0.33. Used in performance-based fire engineering design.","f_en":"At the fire limit state, the γf for imposed load in general areas (not escape stairs, not permanent) is:","b_en":"0.80 (may be reduced to 0.50 where justified)","pp":"12","tags":["concrete-2013-2020ed","防火 Fire","flashcard"]},{"id":"CON-011-FC","doc":"concrete-2013-2020ed","tp":"撓度 Deflection","c":"2.3.3.3","p":26,"f":"計算撓度時，一般住宅或寫字樓應把多少百分比的 imposed load 視為 permanent？","b":"25 %","e":"2.3.3.3：住宅/寫字樓 25%；儲存用途至少 75%。用於長期撓度（creep）計算，例如 transfer beam 或長跨板的 long-term deflection。","x":"occupancy, 25% of the imposed load should be considered as permanent and for structures used for","e_en":"2.3.3.3: 25% for residential/office; at least 75% for storage use. Used in long-term (creep) deflection calculations, e.g. long-term deflection of transfer beams or long-span slabs.","f_en":"When calculating deflection, what percentage of the imposed load should be treated as permanent for ordinary residential or office buildings?","pp":"12","tags":["concrete-2013-2020ed","撓度 Deflection","flashcard"]},{"id":"CON-012-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"ULS 下 reinforcement 的 γm 是多少？","b":"1.15","e":"Table 2.3：鋼筋 1.15（FLS 1.00）；混凝土彎曲/軸力 1.50；無箍筋抗剪 1.25；bond 1.40。所以 fy/γm = 0.87fy。","x":"Reinforcement (prestressing steel included) 1.15 1.00","e_en":"Table 2.3: reinforcement 1.15 (FLS 1.00); concrete in flexure/axial load 1.50; shear strength without shear reinforcement 1.25; bond 1.40. Hence fy/γm = 0.87fy.","f_en":"What is γm for reinforcement at ULS?","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-013-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"ULS 下無箍筋混凝土抗剪強度（concrete shear strength without shear reinforcement）的 γm 是多少？","b":"1.25","e":"1.25 已包含在 Table 6.3 vc 公式中（vc 除以 γm）。不要重複除。","x":"Concrete shear strength without shear 1.25 1.10","e_en":"The 1.25 is already included in the vc formula of Table 6.3 (vc is divided by γm). Do not divide by it again.","f_en":"What is γm at ULS for concrete shear strength without shear reinforcement?","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-014-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"Bond strength 的 ULS γm 是：","b":"1.40","e":"Bond strength γm = 1.40（FLS 1.10）。錨固長度及搭接長度表已包括此值。","x":"Bond strength 1.40 1.10","e_en":"Bond strength γm = 1.40 (FLS 1.10). The anchorage length and lap length tables already include this value.","f_en":"The ULS γm for bond strength is:","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-016-FC","doc":"concrete-2013-2020ed","tp":"材料 Materials","c":"3.1.3","p":29,"f":"以正常重量骨料製造的鋼筋混凝土，最低應使用哪個強度等級？","b":"C20","e":"3.1.3：RC 最低 C20。但耐久性（Table 4.2）按 exposure condition 往往要求更高等級，如 moderate 需 C35 配 40 mm cover。","x":"For reinforced concrete the lowest grade that should be used is C20 for concrete made with normal","e_en":"3.1.3: minimum C20 for RC. But durability (Table 4.2) often requires a higher grade depending on the exposure condition, e.g. moderate requires C35 with 40 mm cover.","f_en":"What is the minimum strength grade for reinforced concrete made with normal-weight aggregates?","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","flashcard"]},{"id":"DIL-003-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.1.2","p":6,"f":"水缸（tanks）及其儲水應如何分類？","b":"水缸重量屬 dead load，儲水屬 imposed load","e":"2.1.2：容器本身重量為 dead load，內容物為 imposed load。實務上天台水缸（roof tank）水重應按 imposed load 乘 γf=1.6，而且不應把它當永久荷載去抵抗 uplift 或 overturning。","x":"The weights of tanks and other receptacles shall be considered as dead loads. The contents of tanks and receptacles shall be considered as imposed loads.","e_en":"2.1.2: the self-weight of the container is dead load and its contents are imposed load. In practice, water in a roof tank should be treated as imposed load with γf=1.6, and should not be relied on as a permanent load to resist uplift or overturning.","f_en":"How should tanks and their stored water be classified?","b_en":"The tank weight is dead load; the stored water is imposed load","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-005-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.2.2.2","p":6,"f":"建築圖則上未有顯示位置、但預計會有的 partitions，其重量應當作：","b":"Imposed load，按 clause 3.6 計算","e":"2.2.2.2：未在 building plans 顯示位置的間隔牆屬 imposed load（按 3.6 以 1/3 牆重/米計，office 不少於 1 kPa）。已顯示在核准圖則上的則屬 dead load（2.2.2.1）。","x":"Where partitions are envisaged but the location of which are not indicated on the building plans, the weights of these partitions shall be considered as imposed loads and to be calculated in accordance with clause 3.6.","e_en":"2.2.2.2: partitions whose positions are not shown on the building plans are imposed load (per 3.6, 1/3 of the wall weight per metre, not less than 1 kPa for offices). Those shown on approved plans are dead load (2.2.2.1).","f_en":"The weight of partitions that are expected but whose positions are not shown on the building plans should be treated as:","b_en":"Imposed load, calculated per clause 3.6","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-007-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.2.5.1","p":7,"f":"骨灰龕場的重型龕位（如混凝土龕位），重量不應少於每米高每米長多少 kN/m？","b":"4.5 kN/m per m height","e":"2.2.5.1：輕型龕位（木或輕金屬）≥2.0 kN/m 每米高，重型（混凝土）≥4.5 kN/m 每米高，另加骨灰甕重量。Columbaria 樓面走道（非龕位範圍）按 Table 3.2 取 4.0 kPa。","x":"For heavy weight niches, such as niches made of concrete, the weight shall be not less than 4.5 kN/m length for each metre height.","e_en":"2.2.5.1: light niches (timber or light metal) ≥2.0 kN/m per metre height, heavy (concrete) ≥4.5 kN/m per metre height, plus the weight of urns. Circulation areas of columbaria (outside niche areas) take 4.0 kPa per Table 3.2.","f_en":"For heavy niches in a columbarium (e.g. concrete niches), the weight should not be less than how many kN/m per metre height per metre length?","pp":"3","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-008-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"外加荷載 Imposed loads","c":"3.1.4","p":8,"f":"Table 3.2 中的 qk 與 Qk 應如何施加？","b":"分開考慮（considered separately），取最不利者","e":"3.1.3–3.1.4：qk 與 Qk 分開考慮，取較不利者。Qk 主要控制局部 punching / 薄板 / 短跨構件；常見錯誤是把 Qk 疊加在 qk 上，過度保守。","x":"The uniformly distributed load, qk, and the concentrated load or line load, Qk, shall be considered separately.","e_en":"3.1.3–3.1.4: qk and Qk are considered separately and the more onerous is taken. Qk mainly governs local punching / thin slabs / short-span members; a common error is to add Qk on top of qk, which is over-conservative.","f_en":"How should qk and Qk in Table 3.2 be applied?","b_en":"Considered separately, taking the more onerous","pp":"4","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"DIL-009-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"f":"Table 3.2：一般用途寫字樓（Offices for general use）的 qk 是多少 kPa？","b":"3.0 kPa","e":"Offices for general use：qk = 3.0 kPa，Qk = 4.5 kN。注意 office 內 storage/filing 用途要升至 5.0 kPa（Class 5），而且不可按 3.7 折減；另如間隔牆位置未定，須再加 ≥1 kPa。","x":"Offices for general use 3.0 4.5","e_en":"Offices for general use: qk = 3.0 kPa, Qk = 4.5 kN. Note that storage/filing use within offices must be raised to 5.0 kPa (Class 5) and cannot be reduced under 3.7; and if partition positions are undetermined, add ≥1 kPa.","f_en":"Table 3.2: what is qk for offices for general use, in kPa?","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"FIR-001-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"C4.1 / Table C1","p":87,"f":"Table C1：Use Classification 1 Residential 的 FRR 及 compartment 面積限制？","b":"60 min；不限","e":"住宅及酒店 60 分鐘、compartment 不限，但每個單位之間要以 fire barrier 分隔。結構工程師要確保所有 element of construction（柱、樑、樓板）達到 FRR 60 的保護層和尺寸。","x":"1. Residential Not limited 60","e_en":"Residential and hotels: 60 minutes with unlimited compartment size, but each unit must be separated by fire barriers. The structural engineer must ensure all elements of construction (columns, beams, floors) achieve the cover and dimensions for FRR 60.","f_en":"Table C1: FRR and compartment size limit for Use Classification 1 Residential?","b_en":"60 min; unlimited","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-002-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Carparks 的 FRR（分鐘）？","b":"60 min","e":"停車場 60 分鐘、compartment ≤10,500 m²。注意停車場若在地庫則要按 C14 用 240 分鐘。","x":"7. Carparks Not exceeding 10,500m2 60","e_en":"Carparks 60 minutes, compartment ≤10,500 m². Note that basement carparks must use 240 minutes per C14.","f_en":"Table C1: FRR (minutes) for carparks?","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-003-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Mercantile facilities（4b）compartment 面積超過 2,500 m² 但不超過 10,500 m² 時的 FRR？","b":"120 min","e":"商場類 ≤2,500 m² 為 60 分鐘，超過則 120 分鐘。平台商場設計時 compartment 劃分直接影響結構保護層及樓板厚度。","x":"Exceeding 2,500m2 but not 120","e_en":"Mercantile uses: 60 minutes up to 2,500 m², 120 minutes above. In podium mall design the compartmentation directly affects structural cover and slab thickness.","f_en":"Table C1: FRR for mercantile facilities (4b) with a compartment area over 2,500 m² but not over 10,500 m²?","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-004-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Industrial workplaces（6a）的 FRR（分鐘）？","b":"120 min","e":"工業類全部 120 分鐘。舊工廈活化改建時要核實原有結構是否達標。","x":"6a. Industrial workplaces Not exceeding 10,500m2 120","e_en":"All industrial uses are 120 minutes. When revitalising old industrial buildings, verify whether the existing structure complies.","f_en":"Table C1: FRR (minutes) for industrial workplaces (6a)?","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FDN-001-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"2.2.1","p":17,"f":"Rational design method：一般對計算所得的 ultimate bearing capacity 採用多少的 factor of safety 求 allowable capacity？","b":"3","e":"FOS 3 是慣例，但規範容許按土石性質、場地變化及設計方法可靠性採用其他數值。提交時若用低於 3 要有充分理據（例如有載荷試驗）。","x":"Normally, the allowable capacity is estimated by applying a factor of safety of 3 to the","e_en":"A FOS of 3 is conventional, but the Code allows other values depending on the ground properties, site variability and reliability of the design method. If less than 3 is used in a submission, adequate justification is needed (e.g. load tests).","f_en":"Rational design method: what factor of safety is generally applied to the calculated ultimate bearing capacity to obtain the allowable capacity?","pp":"9","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-003-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"2.2.2(5)","p":18,"f":"小型或臨時構築物、平地上以粒狀材料為承托層的基腳，可採用的 presumed allowable vertical bearing pressure 為？","b":"乾 100 kPa／浸水 50 kPa","e":"適用於圍板、小型棚架等。注意只限平地及 granular materials；斜坡上或填土上不能直接套用。","x":"A presumed allowable vertical bearing pressure of 100 kPa (if dry) or 50 kPa","e_en":"Applies to hoardings, small sheds, etc. Note it is limited to level ground and granular materials; it cannot be applied directly on slopes or fill.","f_en":"For small or temporary structures with footings founded on granular materials on level ground, what presumed allowable vertical bearing pressure may be adopted?","b_en":"Dry 100 kPa / submerged 50 kPa","pp":"10","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-004-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Table 2.1：Category 1(a) 岩石（新鮮至輕微風化、強至極強花崗岩/火山岩，100% TCR，UCS ≥75 MPa）的 presumed allowable bearing pressure（kPa）？","b":"10000 kPa","e":"1(a) 10 000、1(b) 7 500、1(c) 5 000、1(d) 3 000 kPa。大直徑鑽孔樁常用 1(a)/1(b)，要以 5 m 的 TCR 證明及 PLI/UCS 試驗支持。","x":"Fresh to slightly decomposed strong to very strong 10 000","e_en":"1(a) 10 000, 1(b) 7 500, 1(c) 5 000, 1(d) 3 000 kPa. Large-diameter bored piles commonly use 1(a)/1(b), supported by 5 m of TCR evidence and PLI/UCS tests.","f_en":"Table 2.1: presumed allowable bearing pressure (kPa) of Category 1(a) rock (fresh to slightly decomposed, strong to extremely strong granite/volcanic rock, 100% TCR, UCS ≥75 MPa)?","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-005-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 1(b) 岩石要求的 TCR of the designated grade 及 UCS 分別是？","b":"≥95% TCR、UCS ≥50 MPa","e":"1(b)：≥95% TCR，UCS ≥50 MPa（或 PLI50 ≥2 MPa），允許 7 500 kPa。鑽探報告的 core run TCR 與 designated grade TCR 定義不同，別混淆。","x":"better, and with not less than 95% TCR of the","e_en":"1(b): ≥95% TCR, UCS ≥50 MPa (or PLI50 ≥2 MPa), allowing 7 500 kPa. The core run TCR in drilling reports is defined differently from the TCR of the designated grade — do not confuse them.","f_en":"What TCR of the designated grade and UCS are required for Category 1(b) rock?","b_en":"≥95% TCR, UCS ≥50 MPa","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-006-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 1(c) 岩石的 presumed allowable bearing pressure（kPa）？","b":"5000 kPa","e":"1(c)：Grade III 或更好、≥85% TCR、UCS ≥25 MPa。也是 rock socket bond 700 kPa 的門檻類別。","x":"Slightly to moderately decomposed moderately 5 000","e_en":"1(c): Grade III or better, ≥85% TCR, UCS ≥25 MPa. It is also the threshold category for the 700 kPa rock socket bond.","f_en":"Presumed allowable bearing pressure (kPa) of Category 1(c) rock?","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-007-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 3 intermediate soil（SPT N ≥200 的 HDG/CDG）的 presumed allowable bearing pressure（kPa）？","b":"1000 kPa","e":"N ≥200 的風化土可用 1 000 kPa，常見於 driven H-pile 或 bored pile 以土承托的情況，並可視為滿足 30 mm 沉降準則（2.3.2）。","x":"or better, with SPT N-value ≥ 200.","e_en":"Decomposed soil with N ≥200 may use 1 000 kPa, common for driven H-piles or bored piles founded in soil, and may be regarded as meeting the 30 mm settlement criterion (2.3.2).","f_en":"Presumed allowable bearing pressure (kPa) of Category 3 intermediate soil (HDG/CDG with SPT N ≥200)?","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"GLS-001-FC","doc":"glass-2018","tp":"極限狀態 Limit state","c":"2.2.3","p":14,"f":"Glass Code 2.2.3：單一構件失效時，玻璃結構可能倒塌的部分不應超過多少 m²？","b":"70 m²","e":"防止連續倒塌（例如玻璃柱失效導致玻璃樑及玻璃地台倒塌）。大型玻璃天幕要劃分結構，確保單件失效影響 ≤70 m²。","x":"of collapse should not exceed 70 m (floor, frontal or total area), due to the failure of one","e_en":"Prevents progressive collapse (e.g. failure of a glass column leading to collapse of glass beams and glass floors). Large glass canopies must be structurally subdivided so that the effect of a single failure is ≤70 m².","f_en":"Glass Code 2.2.3: on failure of a single member, the part of a glass structure that may collapse should not exceed how many m²?","pp":"6","tags":["glass-2018","極限狀態 Limit state","flashcard"]},{"id":"GLS-002-FC","doc":"glass-2018","tp":"荷載 Loads","c":"3.4","p":15,"f":"直接受陽光照射的 tinted glass 表面，設計溫度範圍是？","b":"0–90°C","e":"不受直射 0–40°C；直射透明玻璃 0–50°C；有色玻璃 0–90°C。有色玻璃熱應力大，要檢查 thermal breakage，常需熱處理玻璃。","x":"glass and 0-90°C for tinted glass.","e_en":"Not directly exposed 0–40°C; directly exposed clear glass 0–50°C; tinted glass 0–90°C. Tinted glass has high thermal stresses; check thermal breakage — heat-treated glass is often needed.","f_en":"What is the design temperature range for tinted glass surfaces exposed to direct sunlight?","pp":"7","tags":["glass-2018","荷載 Loads","flashcard"]},{"id":"GLS-003-FC","doc":"glass-2018","tp":"荷載 Loads","c":"3.5","p":15,"f":"Glass Code 的 short-term load duration 定義為？","b":"不多於 3 秒（如風荷載、欄杆水平活載）","e":"Short ≤3 s；Medium 3 s–1 天（維修荷載、溫度）；Long >1 天（自重等）。不同歷時對應 Table 4.4 的強度折減。","x":"(1) Short-term load duration is defined as the duration of load applying not more than","e_en":"Short ≤3 s; Medium 3 s–1 day (maintenance loads, temperature); Long >1 day (self-weight, etc.). The durations correspond to the strength reductions in Table 4.4.","f_en":"How is short-term load duration defined in the Glass Code?","b_en":"Not more than 3 seconds (e.g. wind load, horizontal imposed load on barriers)","pp":"7","tags":["glass-2018","荷載 Loads","flashcard"]},{"id":"PRC-001-FC","doc":"precast-2016","tp":"穩定 Stability","c":"2.3.1","p":12,"f":"若風荷載不控制，預製結構穩定性應以每層多少百分比 characteristic dead load 的 notional horizontal force 檢查？","b":"1.5 %","e":"與 Concrete Code 的 1.5% notional load 一致。預製結構多為鉸接，側向穩定靠剪力牆及樓板橫隔作用，所以 tie 設計特別重要。","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","e_en":"Consistent with the 1.5% notional load of the Concrete Code. Precast structures are mostly pin-jointed, with lateral stability provided by shear walls and floor diaphragm action, so tie design is particularly important.","f_en":"If wind load does not govern, the stability of a precast structure should be checked with a notional horizontal force equal to what percentage of the characteristic dead load of each floor?","pp":"4","tags":["precast-2016","穩定 Stability","flashcard"]},{"id":"PRC-003-FC","doc":"precast-2016","tp":"荷載 Loadings","c":"2.5.1","p":14,"f":"預製結構設計的最小施工荷載（construction load）是？","b":"1.5 kN/m²","e":"半預製樓板（semi-precast slab）在澆注面層前要承受自重加 1.5 kN/m² 施工荷載，常是控制工況。Bracing 設計亦用 1.5 kN/m²。","x":"construction loads. A minimum load of 1.5 kN/m² should be used. However, due","e_en":"Semi-precast slabs must carry self-weight plus a 1.5 kN/m² construction load before the topping is cast, which is often the governing case. Bracing design also uses 1.5 kN/m².","f_en":"What is the minimum construction load for precast structure design?","pp":"6","tags":["precast-2016","荷載 Loadings","flashcard"]},{"id":"PRC-004-FC","doc":"precast-2016","tp":"荷載 Loadings","c":"Table 2.1","p":15,"f":"Table 2.1：平板、有可拆側模、無成形凹槽、smooth mould（只用 form oil）的 demoulding 等效荷載系數？","b":"1.3","e":"脫模時模板吸力/黏附力以自重乘系數考慮；雕塑形 smooth 1.7 最高。只用於構件抗彎設計，吊點另按 Table 2.4。","x":"Flat with removable side forms. No formed","e_en":"Mould suction/adhesion at demoulding is allowed for by multiplying self-weight by a factor; sculptured smooth is highest at 1.7. Used only for flexural design of the element; lifting points follow Table 2.4.","f_en":"Table 2.1: equivalent demoulding load factor for a flat panel with removable side forms, no formed recesses, and a smooth mould (form oil only)?","pp":"7","tags":["precast-2016","荷載 Loadings","flashcard"]},{"id":"SEC-006-FC","doc":"steel-2011-2023ed","tp":"截面分類 Section classification","c":"Steel Code Table 7.1","p":87,"f":"HK Steel Code Table 7.1：I/H 截面 web（neutral axis at mid-depth）的 Class 1 / 2 / 3 d/t 限值？","b":"80ε / 100ε / 120ε","e":"Web 受彎 80ε/100ε/120ε；rolled flange outstand 9ε/10ε/15ε；internal element 28ε/32ε/40ε。配合截面表的 d/t 欄可即時分類。","x":"Neutral axis at mid-depth d/t 80ε 100ε 120ε","e_en":"Web in bending 80ε/100ε/120ε; rolled flange outstand 9ε/10ε/15ε; internal element 28ε/32ε/40ε. Combined with the d/t column of the section tables, sections can be classified instantly.","f_en":"HK Steel Code Table 7.1: Class 1 / 2 / 3 d/t limits for the web of an I/H section (neutral axis at mid-depth)?","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","flashcard"]},{"id":"STL-001-FC","doc":"steel-2011-2023ed","tp":"極限狀態 Limit states","c":"Table 2.1","p":38,"f":"按 Steel Code Table 2.1，以下哪一項屬 serviceability limit state？","b":"Human induced vibration","e":"Table 2.1：SLS 包括 deflection、human induced vibration、wind induced vibration、durability；brittle fracture、fatigue、fire、穩定屬 ULS。","x":"Stability against overturning, sliding, uplift and Human induced vibration","e_en":"Table 2.1: SLS includes deflection, human induced vibration, wind induced vibration and durability; brittle fracture, fatigue, fire and stability are ULS.","f_en":"According to Steel Code Table 2.1, which of the following is a serviceability limit state?","pp":"19","tags":["steel-2011-2023ed","極限狀態 Limit states","flashcard"]},{"id":"STL-004-FC","doc":"steel-2011-2023ed","tp":"疲勞 Fatigue","c":"2.3.3.4","p":41,"f":"疲勞評估時，按 Steel Code 設計的建築物 design working life 取多少年？","b":"50 年","e":"2.3.3.4(a)：建築物 50 年；道路/橋樑一般 120 年。Miner's rule Σni/Ni ≤ 1.0。","x":"designed to the Code the design working life is 50 years and for road/bridge this","e_en":"2.3.3.4(a): buildings 50 years; roads/bridges generally 120 years. Miner's rule Σni/Ni ≤ 1.0.","f_en":"For fatigue assessment, what design working life (years) is taken for buildings designed to the Steel Code?","b_en":"50 years","pp":"22","tags":["steel-2011-2023ed","疲勞 Fatigue","flashcard"]},{"id":"STL-005-FC","doc":"steel-2011-2023ed","tp":"穩健性 Robustness","c":"2.3.4.3","p":43,"f":"作為水平 tie 的鋼構件及其端部連接，須能抵抗的最少 factored tensile load 是多少 kN？","b":"75 kN","e":"2.3.4.3(a)：≥75 kN，毋須與其他荷載疊加。Internal tie = 0.5(1.4Gk+1.6Qk)stL；edge tie = 0.25(...)stL，均不少於 75 kN。常見錯誤：簡支樑端 fin plate 連接未檢核 tie force。","x":"capable of resisting a factored tensile load not less than 75kN, which need not be","e_en":"2.3.4.3(a): ≥75 kN, not combined with other loads. Internal tie = 0.5(1.4Gk+1.6Qk)stL; edge tie = 0.25(...)stL, both not less than 75 kN. Common error: not checking the tie force at the fin plate connections of simply supported beam ends.","f_en":"What minimum factored tensile load (kN) must a steel member acting as a horizontal tie, and its end connections, be able to resist?","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","flashcard"]},{"id":"STL-006-FC","doc":"steel-2011-2023ed","tp":"穩健性 Robustness","c":"2.3.4.3(b)","p":43,"f":"錨固邊柱（edge columns）的水平 tie 須抵抗以下哪個值的最大者？","b":"Tie force、75 kN 或柱荷載 1%","e":"2.3.4.3(b)：max(tie force, 75 kN, 1% 柱上/下最大 factored dead + imposed load)，垂直於邊緣作用。（Concrete Code 外柱為 3%，兩本 Code 數值不同，要分清。）","x":"calculated in (a) above, 75 kN or 1% of the maximum factored dead and imposed","e_en":"2.3.4.3(b): max(tie force, 75 kN, 1% of the maximum factored dead + imposed load in the column above/below), acting perpendicular to the edge. (The Concrete Code uses 3% for external columns — the two Codes differ, so keep them distinct.)","f_en":"Horizontal ties anchoring edge columns must resist the greatest of which values?","b_en":"Tie force, 75 kN, or 1% of the column load","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","flashcard"]},{"id":"STL-008-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.3","p":46,"f":"Steel Code 規定 load combinations 2 和 3 的最小 unfactored wind load 不應少於 unfactored dead load 的多少 %？","b":"1.0 %","e":"2.5.3：≥1.0% Gk（每層按該層重量計）。Concrete Code 則以 1.5% Gk 作 design ultimate 下限，兩者定義不同（unfactored vs ultimate）。","x":"The minimum unfactored wind load should not be less than 1.0% of unfactored dead load","e_en":"2.5.3: ≥1.0% Gk (per floor, based on that floor's weight). The Concrete Code uses 1.5% Gk as a design ultimate lower bound — the definitions differ (unfactored vs ultimate).","f_en":"The Steel Code requires the minimum unfactored wind load in load combinations 2 and 3 to be not less than what % of the unfactored dead load?","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","flashcard"]},{"id":"STL-009-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.6","p":46,"f":"設計溫度效應時，Steel Code 假設香港平均溫度變化範圍為：","b":"+0.1°C 至 +40.0°C","e":"2.5.6：+0.1°C 至 +40.0°C；受陽光直射構件（如幕牆支架）按 13.3.4.3 取更高溫度。長鋼屋頂及預應力拉桿系統特別敏感。","x":"varies from +0.1ºC to +40.0ºC. The actual range, however, depends on the location, type","e_en":"2.5.6: +0.1°C to +40.0°C; members exposed to direct sunlight (e.g. curtain wall brackets) take higher temperatures per 13.3.4.3. Long steel roofs and prestressed tension rod systems are particularly sensitive.","f_en":"For designing temperature effects, the Steel Code assumes the average temperature range in Hong Kong is:","b_en":"+0.1°C to +40.0°C","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","flashcard"]},{"id":"STL-010-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.8","p":47,"f":"一般結構的 notional horizontal force 最少為 factored dead and imposed loads 的多少 %？","b":"0.5 %","e":"2.5.8：0.5%（或 0.5 kN/m² 側壓，取較大），用於 load combination 1，毋須再乘 γf；臨時工程及 sway ultra-sensitive 結構用 1.0% 或 1.0 kN/m²。計算 overturning 時不需施加。","x":"should be capable of resisting notional horizontal forces with a minimum of 0.5% of the","e_en":"2.5.8: 0.5% (or 0.5 kN/m² lateral pressure, whichever is greater), used in load combination 1 without further γf; temporary works and sway ultra-sensitive structures use 1.0% or 1.0 kN/m². Not applied when calculating overturning.","f_en":"The notional horizontal force for ordinary structures is at least what % of the factored dead and imposed loads?","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","flashcard"]},{"id":"WND-041-FC","doc":"wind-code-2019","tp":"風洞試驗 Wind tunnel testing","c":"6.1.3","p":44,"f":"地形風洞試驗（topography model）最少需要多少個風向？","b":"18","e":"地形試驗至少 18 個方向（每 20°）；建築荷載試驗則至少 36 個方向（每 10°）。","x":"A minimum of 18 wind directions at 20o intervals is necessary.","e_en":"Topography tests need at least 18 directions (every 20°); building load tests need at least 36 directions (every 10°).","f_en":"What is the minimum number of wind directions for a topography wind tunnel model test?","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","flashcard"]},{"id":"WND-042-FC","doc":"wind-code-2019","tp":"風洞試驗 Wind tunnel testing","c":"6.1.5","p":44,"f":"一般指引：建築風洞模型比例通常不應小於？","b":"1:500","e":"模型不小於 1:500，且尖角模型的 Reynolds number 不少於 1×10^4；圓形模型需額外證明。","x":"A general guide is that the building model should normally be not","e_en":"Model not smaller than 1:500, with Reynolds number not less than 1×10^4 for sharp-edged models; round models need additional justification.","f_en":"General guidance: the scale of a building wind tunnel model should usually not be smaller than:","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","flashcard"]},{"id":"WND-043-FC","doc":"wind-code-2019","tp":"風洞試驗 Wind tunnel testing","c":"6.1.7","p":45,"f":"Built-up terrain 中，風洞配對風壓的 matching height Z 應取？","b":"上風周邊高度以上 150 m 或 2/3 建築高度，取較大","e":"開闊地形取 2/3 建築高度；市區取周邊有效高度以上 150 m 與 2/3H 的較大值；中間情況兩者都要考慮。審核風洞報告時必須檢查配對方法。","x":"(full-scale) above the height of upwind surroundings (the effective","e_en":"Open terrain: 2/3 of the building height; urban terrain: the greater of 150 m above the effective surrounding height and 2/3H; intermediate cases must consider both. Check the matching method when reviewing wind tunnel reports.","f_en":"In built-up terrain, the matching height Z for matching wind tunnel pressures should be taken as:","b_en":"150 m above the upwind surrounding height or 2/3 of the building height, whichever is greater","pp":"35","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","flashcard"]},{"id":"WND-044-FC","doc":"wind-code-2019","tp":"風洞試驗 Wind tunnel testing","c":"6.3","p":46,"f":"風洞試驗外牆荷載：典型板件 half-perimeter 2–5 m，以一小時內百分之幾不超越機率取值？","b":"80 %","e":"外牆荷載以 80% non-exceedance 為目標；內壓亦須由量度所得外壓推算。","x":"sizes, for example half-perimeter length of 2m to 5m, with an 80%","e_en":"Cladding loads target 80% non-exceedance; internal pressure must also be derived from the measured external pressures.","f_en":"Wind tunnel cladding loads: for typical panels with half-perimeter 2–5 m, loads are taken at what percentage probability of non-exceedance in one hour?","pp":"36","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","flashcard"]},{"id":"WND-045-FC","doc":"wind-code-2019","tp":"外牆壓力 Cladding pressure","c":"Table B1-1","p":62,"f":"Table B1-1（有 dominant opening）：外牆邊區 Zone A 的 external pressure coefficient Cpe？","b":"−1.2","e":"有大開口時分開計外壓 Cpe 與內壓 Cpi；外牆邊區 Cpe −1.2、一般區 −0.8、正壓 +0.8。","x":"Negative pressure A -1.2 in edge zone","e_en":"With a large opening, external Cpe and internal Cpi are calculated separately; wall edge zone Cpe −1.2, general zone −0.8, positive +0.8.","f_en":"Table B1-1 (with a dominant opening): external pressure coefficient Cpe for wall edge Zone A?","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","flashcard"]},{"id":"FIR-F01","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1 FRR：住宅 / 酒店 / 辦公 / 停車場？","b":"60 / 60 / 60 / 60 min（辦公 ≤10,500 m²；停車場 ≤10,500 m²）","e":"商場/教育/集會 >2,500 m² 為 120；工業 120。","x":"4a. Business Facilities Not exceeding 10,500m2 60","e_en":"Mercantile/educational/assembly >2,500 m² is 120; industrial 120.","f_en":"Table C1 FRR: residential / hotel / office / carpark?","b_en":"60 / 60 / 60 / 60 min (office ≤10,500 m²; carpark ≤10,500 m²)","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-F02","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Transport facilities（5c）FRR？","b":"120 min，compartment ≤10,500 m²","e":"港鐵上蓋等交通設施。","x":"5c. Transport facilities Not exceeding 10,500m2 120","e_en":"Transport facilities such as developments over MTR stations.","f_en":"FRR for transport facilities (5c)?","b_en":"120 min, compartment ≤10,500 m²","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-F03","tp":"耐火等級 FRR","c":"Table C2","p":89,"f":"FRR 三項準則及寫法？","b":"Stability / Integrity / Insulation，例如 -/120/120 表示無 stability 要求、integrity 及 insulation 120 min","e":"結構框架只需 stability；樓板三項。","x":"4 Loadbearing wall not Y N N Each side separately","e_en":"Structural frames need stability only; floors all three.","f_en":"The three FRR criteria and how they are written?","b_en":"Stability / Integrity / Insulation, e.g. -/120/120 means n ds?","b_en":"When V ≤ 0.75Vc (on the notched area), Mc = py·Zr.","doc":"steel-2011-2023ed","pp":"78","tags":["steel-2011-2023ed","受約束樑 Restrained beams","flashcard"]},{"id":"STL-F11","tp":"螺栓 Bolts","c":"9.3.1.2","p":202,"f":"螺栓最大間距？","b":"min(12t, 150 mm)，t 為較薄連接板厚度。","e":"Clause 9.3.1.2。","x":"perpendicular to the direction of load transfer should be limited to the lesser of 12t or","e_en":"Clause 9.3.1.2.","f_en":"Maximum bolt spacing?","b_en":"min(12t, 150 mm), where t is the thickness of the thinner connected ply.","doc":"steel-2011-2023ed","pp":"183","tags":["steel-2011-2023ed","螺栓 Bolts","flashcard"]},{"id":"STL-F12","tp":"焊接 Welds","c":"9.2.5.1.4","p":196,"f":"角焊縫端部回焊要求？","b":"連續回焊 ≥2s；不能回焊時距端/邊 ≥s 終止；回焊不計入有效長度。","e":"Clause 9.2.5.1.4。","x":"than 2s or, if a return is impracticable, terminated not less than s from the ends or edges.","e_en":"Clause 9.2.5.1.4.","f_en":"End return requirements for fillet welds?","b_en":"Continuous end return ≥2s; where returns are not possible, terminate ≥s from the end/edge; returns are not counted in the effective length.","doc":"steel-2011-2023ed","pp":"177","tags":["steel-2011-2023ed","焊接 Welds","flashcard"]},{"id":"STL-F13","tp":"焊接 Welds","c":"9.2.5.1.6","p":198,"f":"角焊縫 directional method 的 K 值？","b":"K = 1.25√(1.5/(1+cos²θ))，PT = K·PL，PL = pw·a；(FL/PL)² + (FT/PT)² ≤ 1。","e":"見 Eq 9.4–9.7，比 simplified method 經濟。","x":"PL = pw a (longitudinal direction) (9.4)","e_en":"See Eq 9.4–9.7; more economical than the simplified method.","f_en":"K value in the directional method for fillet welds?","b_en":"K = 1.25√(1.5/(1+cos²θ)), PT = K·PL, PL = pw·a; (FL/PL)² + (FT/PT)² ≤ 1.","doc":"steel-2011-2023ed","pp":"179","tags":["steel-2011-2023ed","焊接 Welds","flashcard"]},{"id":"SEM-F01","tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"f":"鋼材 class 與 γm1/γm2？","b":"Class 1/1H：1.0/1.2；Class 2（已測試）：1.1/1.3；Class 3：py ≤ 170 N/mm²，只用於次要構件","e":"【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。"," 0.024 <4 0.020 0.030","e_en":"Reduces to 0.010/0.015 at ≥8.","f_en":"Damping (acceleration/loads) for RC buildings with aspect ratio <4?","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","flashcard"]},{"id":"WEN-F01","tp":"背景 Background","c":"EN 3.1","p":22,"f":"Code 風壓 × γw 1.4 相當於幾多年回歸期？","b":"至少 1,000–1,500 年","e":"與國際標準對重要建築的可靠度一致。","x":"of at least 1,000-1,500 year return which is consistent with the level of","e_en":"Consistent with the reliability of international standards for important buildings.","f_en":"Code wind pressure × γw 1.4 corresponds to what return period?","b_en":"At least 1,000–1,500 years","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","flashcard"]},{"id":"WEN-F02","tp":"Across-wind","c":"EN 2.2.3","p":14,"f":"NBCC across-wind 方法的校準條件？","b":"矩形棱柱形；振型接近線性；上半部質量均勻；0.5 < B/D < 2（經驗可延伸至約 1:4）","e":"漸縮或退台建築用 NBCC 偏保守。","x":"(b) mode deflections that are approximately linear with height,","e_en":"NBCC is conservative for tapered or setback buildings.","f_en":"Calibration conditions of the NBCC across-wind method?","b_en":"Rectangular prism; mode shape close to linear; uniform mass in the upper half; 0.5 < B/D < 2 (experience allows extension to about 1:4)","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","flashcard"]},{"id":"WEN-F03","tp":"加速度 Acceleration","c":"EN 2.4.2","p":20,"f":"10 年與 1 年加速度比（code method）？","b":"≈ 3.67（由 Sr 0.55/0.25 按 NBCC 3.3 次方關係）","e":"風洞試驗兩個回歸期都要檢查。","x":"Code. Here 0.55 and 0.25 are the return period factors","e_en":"Wind tunnel testing must check both return periods.","f_en":"Ratio of 10-year to 1-year acceleration (code method)?","b_en":"≈ 3.67 (from Sr 0.55/0.25 with the NBCC 3.3-power relationship)","doc":"wind-explanatory-notes-2019","pp":"12","tags":["wind-explanatory-notes-2019","加速度 Acceleration","flashcard"]},{"id":"WEN-F04","tp":"修訂 2023 Amendments","c":"Amendments Dec 2023","p":2,"doc":"wind-en-amendments-2023","f":"2023 年 12 月 EN 修訂三大項？","b":"(a) 2.2.3 across-wind 頻率決定指引；(b) 2.5 hoarding/covered walkway 設計淨壓力表；(c) 4.3.1、6.4、Fig B-1、C2、E3.1 文字修訂","e":"只改 Explanatory Notes，不改 Code。","x":"(b) Clause 2.5 – Addition of design net pressure for hoarding and covered walkway","e_en":"Only the Explanatory Notes are amended, not the Code.","f_en":"Three main items of the December 2023 EN amendment?","b_en":"(a) 2.2.3 guidance on determining across-wind frequency; (b) 2.5 design net pressure table for hoardings/covered walkways; (c) wording amendments to 4.3.1, 6.4, Fig B-1, C2, E3.1","pp":"2","tags":["wind-en-amendments-2023","修訂 2023 Amendments","flashcard"]},{"id":"WEN-F05","tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – EN Table 2-1","p":5,"doc":"wind-en-amendments-2023","f":"Hoarding 設計淨壓力（≤2.5 m / 5 m / 10 m）？","b":"0.63 / 0.70 / 0.77 kPa（已含 Cp、Ss）","e":"可內插；地形不利時要另計 St。","x":"(a) For intermediate values of height, linear interpolation is permitted.","e_en":"Interpolation allowed; St must be calculated separately for adverse topography.","f_en":"Hoarding design net pressure (≤2.5 m / 5 m / 10 m)?","b_en":"0.63 / 0.70 / 0.77 kPa (including Cp, Ss)","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","flashcard"]},{"id":"WEN-F06","tp":"尺寸系數 Size factor","c":"EN 5.1","p":31,"f":"Ss = 1.0 對應 half-perimeter？","b":"15 m","e":"一般外牆板 Ss > 1.0。","x":"The choice of 15m for size factor of 1.0 is based on the increased wind","e_en":"Typical cladding panels have Ss > 1.0.","f_en":"Ss = 1.0 corresponds to what half-perimeter?","doc":"wind-explanatory-notes-2019","pp":"23","tags":["wind-explanatory-notes-2019","尺寸系數 Size factor","flashcard"]}]}</script>
<script>(function () {
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const META = DATA.meta, Q = DATA.q, F = DATA.f;
const QI = {}, FI = {};
Q.forEach(q => QI[q.id] = q); F.forEach(f => FI[f.id] = f);
const DOCS = Object.keys(META.docs).map(k => Object.assign({ k }, META.docs[k])).sort((a, b) => a.order - b.order);
const TYPES = { mcq: ['選擇題', 'Multiple choice'], tf: ['是非題', 'True/False'], num: ['數值題', 'Numeric'], short: ['簡答題', 'Short answer'], scenario: ['設計情境', 'Design scenario'] };
const DIFF = { 1: ['基礎', 'Basic'], 2: ['中級', 'Intermediate'], 3: ['進階', 'Advanced'] };

const KEY = 'hkss.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function toast(zh, en) { const t = $('#toast'); t.textContent = ts(zh, en); t.classList.add('show'); toast.at = Date.now(); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- state ---------- */
function fill(s) { s = s || {}; s.v = 1; s.q = s.q || {}; s.fc = s.fc || {}; s.bm = s.bm || []; s.days = s.days || {}; s.exams = s.exams || []; s.pf = s.pf || {}; s.newPerDay = s.newPerDay || 20; s.fcNew = s.fcNew || {}; if (!LANGS[s.lang]) s.lang = 'bi'; return s; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1) return fill(s); } catch (e) { } return fill({}); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('無法儲存進度（瀏覽器儲存空間不足或被停用）', 'Unable to save progress (browser storage full or disabled)'); } }
function bumpDay() { const t = ymd(); S.days[t] = (S.days[t] || 0) + 1; }
function streak() { let n = 0; const d = new Date(); if (!S.days[ymd(d)]) d.setDate(d.getDate() - 1); while (S.days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function record(id, r) {
  const x = S.q[id] || (S.q[id] = { n: 0, c: 0 });
  x.n++; x.c += r; x.ok = r; x.last = Date.now(); bumpDay(); save();
}
function isBm(id) { return S.bm.indexOf(id) >= 0; }
function toggleBm(id) { const i = S.bm.indexOf(id); if (i >= 0) S.bm.splice(i, 1); else S.bm.push(id); save(); return i < 0; }
function wrongIds() { return Q.filter(q => S.q[q.id] && S.q[q.id].ok < 1).map(q => q.id); }
function fcDue() { const t = ymd(); return F.filter(f => S.fc[f.id] && S.fc[f.id].due <= t); }
function fcNew() { return F.filter(f => !S.fc[f.id]); }
function newLeftToday() { const t = ymd(); return Math.max(0, S.newPerDay - (S.fcNew[t] || 0)); }

/* ---------- i18n ----------
   Both languages are always rendered; body.l-bi / l-zh / l-en decides what is visible (CSS),
   so switching language never re-renders or loses the state of a question in progress.
   bl/il: data text (escaped), block / inline.  U/u: trusted UI HTML, block / inline.
   ts: plain string for toast/confirm/option/placeholder (elements tagged data-tz/data-pz are relabelled on switch). */
function pair(zh, en, cls, raw) {
  zh = zh == null ? '' : String(zh); en = en == null || en === '' ? zh : String(en);
  const z = raw ? zh : esc(zh), e = raw ? en : esc(en);
  if (en === zh) return z;
  return '<span class="zh">' + z + '</span><span class="en ' + cls + '" lang="en">' + e + '</span>';
}
const bl = (zh, en) => pair(zh, en, 'b', false);
const il = (zh, en) => pair(zh, en, 'i', false);
const U = (zh, en) => pair(zh, en, 'b', true);
const u = (zh, en) => pair(zh, en, 'i', true);
function ts(zh, en, sep) { en = en == null ? zh : en; if (S.lang === 'zh') return zh; if (S.lang === 'en') return en; return zh === en ? zh : zh + (sep || ' · ') + en; }
function optL(v, zh, en, sel) { return '<option value="' + esc(v) + '" data-tz="' + esc(zh) + '" data-te="' + esc(en) + '"' + (sel ? ' selected' : '') + '>' + esc(ts(zh, en)) + '</option>'; }
function phL(zh, en) { return ' placeholder="' + esc(ts(zh, en, ' / ')) + '" data-pz="' + esc(zh) + '" data-pe="' + esc(en) + '"'; }
function relabel() {
  $$('[data-tz]').forEach(el => { el.textContent = ts(el.dataset.tz, el.dataset.te); });
  $$('[data-pz]').forEach(el => { el.placeholder = ts(el.dataset.pz, el.dataset.pe, ' / '); });
}
const EN = (it, k) => it[k + '_en'] != null ? it[k + '_en'] : it[k];
const ENi = (it, k, i) => (it[k + '_en'] || it[k])[i];
const tpZh = tp => (META.topics[tp] || [tp])[0], tpEn = tp => (META.topics[tp] || [tp, tp])[1];
const docZh = k => (META.docs[k] || {}).zh || k, docEn = k => (META.docs[k] || {}).en || docZh(k);
const docName = k => il(docZh(k), docEn(k));
const ty = t => u(TYPES[t][0], TYPES[t][1]);
const df = d => u(DIFF[d][0], DIFF[d][1]);
let afterLang = null;
function applyLang() {
  const l = S.lang, b = document.body;
  b.classList.remove('l-bi', 'l-zh', 'l-en'); b.classList.add('l-' + l);
  document.documentElement.lang = l === 'en' ? 'en' : 'zh-HK';
  const lb = $('#langBtn'); lb.textContent = { bi: '中/EN', zh: '中', en: 'EN' }[l]; lb.title = '語言 Language: ' + LANGS[l];

  relabel();

}
function setLang(l) { if (!LANGS[l]) return; S.lang = l; save(); applyLang(); }
function langMenu(open) { const m = $('#langMenu'); m.hidden = !open; $('#langBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }
$('#langBtn').onclick = e => { e.stopPropagation(); langMenu($('#langMenu').hidden); };
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-lang]');
  if (b) { setLang(b.dataset.lang); langMenu(false); return; }

});
document.addEventListener('keydown', e => { if (e.key === 'Escape') langMenu(false); });

/* ---------- helpers ---------- */
function docTags(doc) {
  if (doc === 'steel-explanatory-materials-2011') return '<span class="tag warn">' + u('EM 為 2011 版而寫 · 請核對 2023 Ed', 'EM written for the 2011 Code · check 2023 Ed') + '</span>';
  if (doc === 'wind-explanatory-notes-2019') return '<span class="tag warn">' + u('EN 已於 2023/12 修訂', 'EN amended 2023/12') + '</span>';
  if (doc === 'wind-en-amendments-2023') return '<span class="tag warn">' + u('2023/12 修訂（只改 EN）', '2023/12 amendments (EN only)') + '</span>';
  return '';
}
function itemTags(q) {
  return '<span class="tag">' + docName(q.doc) + '</span><span class="tag">' + il(tpZh(q.tp), tpEn(q.tp)) + '</span>' +
    (q.t ? '<span class="tag">' + ty(q.t) + '</span><span class="tag">' + df(q.d) + '</span>' : '<span class="tag">' + u('閃卡', 'Flashcard') + '</span>') +
    (q.cross ? '<span class="tag x">' + u('跨規範', 'Cross-code') + '</span>' : '') + docTags(q.doc);
}
function citeOne(doc, c, pp, p, x) {
  const d = META.docs[doc] || {};
  return '<div class="cite"><div class="doc">' + esc(d.title || doc) + '</div><div class="loc">' + esc(d.edition || '') + '</div>' +
    '<div class="loc">' + u('條文：', 'Clause/Table: ') + '<b>' + esc(c) + '</b> · ' + u('印刷頁', 'printed') + ' p.' + esc(pp || '—') + ' · ' + u('PDF 頁', 'PDF page') + ' ' + esc(p) + '</div>' +
    '<blockquote lang="en">“' + esc(x) + '”</blockquote></div>';   // verified quote: always the original text
}
function citeBlock(q) {
  let h = '<h3>' + u('出處', 'Citation') + '</h3>' + citeOne(q.doc, q.c, q.pp, q.p, q.x);
  (q.r || []).forEach(r => { h += citeOne(r.doc, r.c, r.pp, r.p, r.x); });
  return h;
}
function unit(q) { return q.u ? il(q.u, EN(q, 'u')) : ''; }
function answerHTML(q) {
  if (q.t === 'mcq') return bl(q.o[q.a], ENi(q, 'o', q.a));
  if (q.t === 'tf') return q.a ? u('對', 'True') : u('錯', 'False');
  if (q.t === 'num') return esc(q.a) + (q.u ? ' ' + unit(q) : '') + (q.tol ? ' ' + u('（容許 ±' + esc(q.tol) + '）', '(tolerance ±' + esc(q.tol) + ')') : '');
  return bl(q.m || '', EN(q, 'm') || '');
}
function parseNum(s) {
  s = String(s || '').replace(/[\uff10-\uff19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/\uff0e/g, '.').replace(/[\uff0d\u2212]/g, '-');
  s = s.replace(/[,\s\u00a0\uff0c]/g, '').replace(/[×x]10\^?/i, 'e'); if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN; return parseFloat(s);
}
function numOk(q, v) { const tol = q.tol || 0; return Math.abs(v - q.a) <= tol + 1e-9 * Math.max(1, Math.abs(q.a)); }

/* ---------- router ---------- */
const TITLES = { home: ['港結構規範溫習', 'HK Structural Codes Study'], practice: ['練習', 'Practice'], flash: ['閃卡', 'Flashcards'], exam: ['模擬試', 'Mock Exam'], more: ['更多', 'More'], review: ['錯題重溫 / 書籤', 'Review / Bookmarks'], search: ['搜尋', 'Search'], notes: ['版本注意事項', 'Edition notes'], backup: ['備份及匯入', 'Backup & import'], q: ['題目', 'Question'], fc: ['閃卡', 'Flashcard'] };
const SUB = ['review', 'search', 'notes', 'backup', 'q', 'fc'];
let EXAM = null, SESS = null, FSESS = null;
function route() {
  const h = (location.hash || '#home').slice(1); const parts = h.split('/'); const r = parts[0] || 'home';
  $$('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === r || (r === 'review' || r === 'search' || r === 'notes' || r === 'backup') && a.dataset.tab === 'more'));
  const t = TITLES[r] || TITLES.home; $('#title').innerHTML = U(t[0], t[1]);
  $('#backBtn').hidden = SUB.indexOf(r) < 0;
  window.scrollTo(0, 0); langMenu(false); afterLang = null;
  if (!toast.at || Date.now() - toast.at > 600) $('#toast').classList.remove('show');
  const V = { home, practice, flash, exam, more, review, search, notes, backup, q: singleQ, fc: singleFc }[r] || home;
  V(parts.slice(1));
  app.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#home'; };
$('#searchBtn').onclick = () => { location.hash = '#search'; };

/* ---------- home ---------- */
function docStats(filterFn) {
  let tot = 0, att = 0, n = 0, c = 0;
  Q.forEach(q => { if (!filterFn(q)) return; tot++; const s = S.q[q.id]; if (s) { att++; n += s.n; c += s.c; } });
  return { tot, att, acc: n ? Math.round(c * 100 / n) : null };
}
const days = n => u(n + ' 日', n + (n === 1 ? ' day' : ' days'));
function home() {
  const all = docStats(() => true); const due = fcDue().length; const nw = Math.min(fcNew().length, newLeftToday());
  const wr = wrongIds().length; const st = streak();
  const last = S.exams.length ? S.exams[S.exams.length - 1].pct : null;
  let h = '<div class="hero"><h2>' + U('你好，Eric 👷', 'Hello, Eric 👷') + '</h2><p>' +

function startSession(ids, kind) { SESS = { ids, i: 0, res: {}, kind: kind || 'practice' }; if (location.hash !== '#practice') location.hash = '#practice'; else runSession(); }

/* ---------- question renderer (practice / single) ---------- */
const RIGHT = () => '✓ ' + u('答對了', 'Correct'), WRONG = () => '✗ ' + u('答錯了', 'Incorrect');
function tfButtons(a) {

const optBtn = (q, oi, k, sel) => '<button class="opt' + (sel ? ' sel' : '') + '" data-i="' + oi + '"><b>' + 'ABCDEF'[k] + '</b><span>' + bl(q.o[oi], ENi(q, 'o', oi)) + '</span></button>';
function renderQuestion(box, q, onResult, onNext, nextLabel) {
  let h = '<div class="card qcard" data-id="' + esc(q.id) + '"><div class="qhead"><span>' + esc(q.id) + '</span><button class="bm' + (isBm(q.id) ? ' on' : '') + '" id="bmB" aria-label="書籤 Bookmark">' + (isBm(q.id) ? '★' : '☆') + '</button></div>' +

  const ans = $('#ans', box), fbk = $('#fbk', box);
  let done = false;
  const finish = (r, label) => {
    if (done) return; done = true; record(q.id, r); onResult && onResult(r);
    const cls = r === 1 ? 'ok' : r === 0 ? 'bad' : 'neutral';
    fbk.innerHTML = '<div class="fb ' + cls + '">' + label + '</div>' +
      (q.t === 'short' || q.t === 'scenario' ? '' : '<div class="ansline"><b>' + u('正確答案：', 'Correct answer: ') + '</b>' + answerHTML(q) + '</div>') +
      '<h3>' + u('解說', 'Explanation') + '</h3><div class="expl">' + bl(q.e, EN(q, 'e')) + '</div>' + citeBlock(q) +
      (onNext ? '<div class="row end" style="margin-top:12px"><button class="btn pri" id="nextB">' + (nextLabel || u('下一題 ›', 'Next ›')) + '</button></div>' : '');
    if (onNext) { const nb = $('#nextB', box); nb.onclick = onNext; nb.focus({ preventScroll: true }); }
  };
  if (q.t === 'mcq') {
    const order = shuffle(q.o.map((_, i) => i));
    ans.innerHTML = order.map((oi, k) => optBtn(q, oi, k)).join('');
    $$('.opt', ans).forEach(b => b.onclick = () => {

  } else if (q.t === 'tf') {
    ans.innerHTML = tfButtons();
    $$('.opt', ans).forEach(b => b.onclick = () => {
      if (done) return; const v = b.dataset.v === '1'; const ok = v === !!q.a;
      $$('.opt', ans).forEach(x => { if ((x.dataset.v === '1') === !!q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      finish(ok ? 1 : 0, ok ? RIGHT() : WRONG());
    });
  } else if (q.t === 'num') {
    ans.innerHTML = '<div class="row"><input type="text" inputmode="decimal" id="numIn"' + phL('輸入數值', 'Enter a value') + ' style="flex:1;min-width:140px" autocomplete="off"><span class="muted">' + unit(q) + '</span><button class="btn pri" id="numB">' + u('提交', 'Submit') + '</button></div>' +
      '<p class="small muted">' + (q.tol ? u('容許誤差', 'Tolerance') + ' ±' + esc(q.tol) + (q.u ? ' ' + unit(q) : '') : u('請輸入準確數值', 'Enter the exact value')) + '</p>';
    const go = () => { const v = parseNum($('#numIn', ans).value); if (isNaN(v)) { toast('請輸入有效數字', 'Please enter a valid number'); return; } const ok = numOk(q, v); $('#numIn', ans).disabled = true; $('#numB', ans).disabled = true; finish(ok ? 1 : 0, (ok ? RIGHT() : WRONG()) + ' ' + u('（你的答案：' + v + '）', '(your answer: ' + v + ')')); };
    $('#numB', ans).onclick = go; $('#numIn', ans).onkeydown = e => { if (e.key === 'Enter') go(); };
  } else {
    ans.innerHTML = '<textarea id="txt"' + phL('先寫下你的答案要點（可選，只供自己對照，不會自動評分）', 'Jot down your key points first (optional, for your own comparison; not auto-graded)') + '></textarea><button class="btn pri block" id="showM" style="margin-top:8px">' + u('顯示參考答案', 'Show model answer') + '</button><div id="mdl"></div>';
    $('#showM', ans).onclick = () => {
      $('#showM', ans).remove();

      $('#mdl', ans).innerHTML = '<div class="model"><b>' + u('參考答案', 'Model answer') + '</b>\n' + bl(q.m, EN(q, 'm')) + '</div>' +
        '<h3>' + u('要點自評（剔選你答到的）', 'Key points self-check (tick those you covered)') + '</h3><div class="kp">' + kz.map((k, i) => '<label><input type="checkbox" data-i="' + i + '"> <span>' + bl(k, ke[i]) + '</span></label>').join('') + '</div>' +
        '<p class="small muted" id="kpS"></p><div class="row"><button class="btn ok" data-r="1">' + u('答對', 'Correct') + '</button><button class="btn" data-r="0.5">' + u('部分正確', 'Partly correct') + '</button><button class="btn bad" data-r="0">' + u('答錯', 'Incorrect') + '</button></div>';
      const kpS = $('#kpS', ans);
      const upd = () => { const n = $$('.kp input', ans).filter(x => x.checked).length; const t = kz.length; kpS.innerHTML = t ? u('已答到 ' + n + ' / ' + t + ' 個要點' + (n === t ? '，建議評「答對」' : n >= t / 2 ? '，建議評「部分正確」' : ''), 'Covered ' + n + ' / ' + t + ' key points' + (n === t ? ' — suggest "Correct"' : n >= t / 2 ? ' — suggest "Partly correct"' : '')) : ''; };
      $$('.kp input', ans).forEach(x => x.onchange = upd); upd();
      $$('[data-r]', ans).forEach(b => b.onclick = () => { const r = +b.dataset.r; $$('[data-r]', ans).forEach(x => x.disabled = true); finish(r, r === 1 ? '✓ ' + u('自評：答對', 'Self-assessed: correct') : r === 0 ? '✗ ' + u('自評：答錯（已加入錯題）', 'Self-assessed: incorrect (added to wrong answers)') : '△ ' + u('自評：部分正確（已加入錯題）', 'Self-assessed: partly correct (added to wrong answers)')); });
    };

/* ---------- flashcards (SM-2) ---------- */
function sm2(rec, g) {
  rec = Object.assign({ ef: 2.5, iv: 0, reps: 0, lapses: 0 }, rec || {});
  if (g < 3) { rec.reps = 0; rec.iv = 0; rec.lapses++; rec.due = ymd(); }
  else {
    rec.reps++;
    rec.iv = rec.reps === 1 ? (g === 5 ? 4 : 1) : rec.reps === 2 ? (g === 3 ? 3 : 6) : Math.round(rec.iv * rec.ef);
    if (g === 3 && rec.reps > 2) rec.iv = Math.max(1, Math.round(rec.iv * 0.8));
    rec.due = addDays(ymd(), rec.iv);
  }
  rec.ef = Math.max(1.3, rec.ef + (0.1 - (5 - g) * (0.08 + (5 - g) * 0.02)));
  rec.last = Date.now();
  return rec;
}
function ivLabel(rec, g) { const r = sm2(rec, g); return g < 3 ? u('今日再溫', 'again today') : days(r.iv); }

  };
  let t; $('#sIn').oninput = () => { clearTimeout(t); t = setTimeout(run, 150); };
  run(); setTimeout(() => $('#sIn') && $('#sIn').focus(), 50);
}

/* ---------- more / notes / backup ---------- */
function langCard() {
  return '<div class="card"><h2>' + u('語言', 'Language') + '</h2><div class="langopts" role="radiogroup" aria-label="語言 Language">' +
    [['bi', '中英對照', '中文在上，英文在下 · Chinese with English beneath'], ['zh', '中文', '只顯示中文'], ['en', 'English', 'English only']].map(x =>
      '<button role="radio" data-lang="' + x[0] + '" class="' + (S.lang === x[0] ? 'on' : '') + '" aria-checked="' + (S.lang === x[0]) + '"><b>' + x[1] + '</b><small>' + x[2] + '</small></button>').join('') +
    '</div><p class="small muted">' + U('原文引句保持規範原文（英文），不作翻譯。', 'Source quotations are always shown in the original wording of the code and are not translated.') + '</p></div>';
}
function more() {
  const counts = Object.keys(TYPES).map(k => [TYPES[k][0] + ' ' + Q.filter(q => q.t === k).length, TYPES[k][1] + ' ' + Q.filter(q => q.t === k).length]);
  app.innerHTML = langCard() + '<div class="card menu">' +
    '<a href="#review"><span>✗</span>' + u('錯題重溫', 'Wrong-answer review') + '<em>' + wrongIds().length + '</em></a>' +
    '<a href="#review/bm"><span>★</span>' + u('書籤', 'Bookmarks') + '<em>' + S.bm.length + '</em></a>' +
    '<a href="#search"><span>⌕</span>' + u('全文搜尋', 'Full-text search') + '</a>' +
    '<a href="#notes"><span>⚠</span>' + u('版本注意事項', 'Edition notes') + '</a>' +
    '<a href="#backup"><span>⇅</span>' + u('備份／匯入進度', 'Backup / import progress') + '</a></div>' +
    '<div class="card small muted">' + U('題庫：' + Q.length + ' 題（' + counts.map(c => c[0]).join('、') + '）· 閃卡 ' + F.length + ' 張 · 建置於 ' + esc(META.built) + '<br>提示：在手機瀏覽器選「加入主畫面」可像 App 一樣開啟（本檔案完全離線）。',
      'Question bank: ' + Q.length + ' questions (' + counts.map(c => c[1]).join(', ') + ') · ' + F.length + ' flashcards · built ' + esc(META.built) + '<br>Tip: use "Add to Home Screen" in your mobile browser to open it like an app (this file works fully offline).') + '</div>';
}
function notes() {
  app.innerHTML = '<div class="warnbox">' + U('⚠ 本工具是個人溫習輔助，不能取代規範原文。所有引用已自動核對與 PDF 抽取文字一致，但解說屬學習筆記性質。', '⚠ This is a personal revision aid and does not replace the original documents. All quotations have been checked automatically against the text extracted from the PDFs, but the explanations are study notes.') + '</div>' +
    META.caveats.map(c => '<div class="card note"><h3>' + bl(c.h, c.h_en) + '</h3><p>' + bl(c.b, c.b_en) + '</p></div>').join('') +
    '<div class="card"><h2>' + u('收錄文件及題量', 'Documents and item counts') + '</h2><table><tr><th>' + u('文件 · 版本', 'Document · edition') + '</th><th class="n">' + u('題', 'Qs') + '</th><th class="n">' + u('卡', 'Cards') + '</th></tr>' +
    DOCS.map(d => '<tr><td><b>' + il(d.zh, d.en) + '</b><br><span class="small muted">' + esc(d.title) + ' — ' + esc(d.edition) + '</span></td><td class="n">' + Q.filter(q => q.doc === d.k).length + '</td><td class="n">' + F.filter(f => f.doc === d.k).length + '</td></tr>').join('') + '</table></div>';
}
function backup() {
  app.innerHTML = '<div class="card"><h2>' + u('匯出進度', 'Export progress') + '</h2><p class="small muted">' + U('下載一個 JSON 檔（作答紀錄、閃卡排程、書籤、模擬試成績及語言設定），可在另一部裝置匯入。', 'Downloads a JSON file (answer history, flashcard schedule, bookmarks, mock exam results and language setting) that can be imported on another device.') + '</p><button class="btn pri" id="expB">' + u('匯出 JSON', 'Export JSON') + '</button></div>' +
    '<div class="card"><h2>' + u('匯入進度', 'Import progress') + '</h2><p class="small muted">' + U('匯入會取代本機現有進度。', 'Importing replaces the progress stored on this device.') + '</p><input type="file" id="impF" accept="application/json,.json"></div>' +
    '<div class="card"><h2>' + u('重設', 'Reset') + '</h2><button class="btn bad" id="rstB">' + u('清除所有進度', 'Clear all progress') + '</button></div>';
  $('#expB').onclick = () => {
    const blob = new Blob([JSON.stringify(Object.assign({ app: 'hk-structural-study', exported: new Date().toISOString() }, S), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hk-structural-study-progress-' + ymd() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('已匯出', 'Exported');
  };
  $('#impF').onchange = e => {
    const file = e.target.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || typeof o.q !== 'object') throw new Error('bad'); if (!confirm(ts('確定以匯入檔取代現有進度？', 'Replace current progress with the imported file?', '\n'))) return; delete o.app; delete o.exported; if (!LANGS[o.lang]) o.lang = S.lang; S = fill(o); save(); applyLang(); toast('匯入成功', 'Import successful'); location.hash = '#home'; } catch (err) { toast('檔案格式不正確', 'Invalid file format'); } };
    rd.readAsText(file);
  };
  $('#rstB').onclick = () => { if (confirm(ts('確定清除所有進度？此操作不能復原。', 'Clear all progress? This cannot be undone.', '\n'))) { S = fill({ lang: S.lang }); save(); SESS = null; FSESS = null; EXAM = null; toast('已清除', 'Cleared'); location.hash = '#home'; } };
}

window.HKSS = { Q, F, state: () => S, setLang, lang: () => S.lang };
applyLang();
route();
})();
</script>
