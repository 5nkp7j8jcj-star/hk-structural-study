1 m","10 kN 作用於 300 mm × 300 mm","4.5 kN 作用於 50 mm × 50 mm"],"a":0,"q_en":"Besides 5 kPa UDL, what point load must a catch platform be designed for?","o_en":["20 kN on 300 mm × 300 mm","20 kN on 1 m × 1 m","10 kN on 300 mm × 300 mm","4.5 kN on 50 mm × 50 mm"],"e_en":"Table 3.2: catch platform 5 kPa or 20 kN on an effective area of 300 mm × 300 mm, whichever is most adverse. Wind load per the Wind Code must also be considered.","doc":"demolition-2004","pp":"15","tier":"偶考"},{"id":"DEM-005","t":"mcq","d":1,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.2","p":26,"q":"Catch platform 臨街時最少闊度為？","e":"臨街 catch platform 不少於 2 m，可按建築物後移距離減少。","x":"The width of the catch platform shall not be less than 2 m when it abuts a street","ex":"demol","o":["1.5 m","2 m","3 m","1.1 m"],"a":1,"q_en":"When it abuts a street, what is the minimum width of the catch platform?","e_en":"Not less than 2 m when abutting a street; may be reduced by the amount of set back of the building.","doc":"demolition-2004","pp":"15","tier":"偶考"},{"id":"DEM-006","t":"mcq","d":2,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.4","p":29,"q":"Catch platform 外邊須設多高的 upstand edge board 以擋住墮下碎料？","e":"由 catch platform 外緣屋面線腳起計 1.1 m 或以上；上蓋亦應向內傾斜以圍住碎料及排水。","x":"Upstand edge board of 1.1 m or higher measured from the toe of roof line of the catch platform's outer edge","ex":"demol","o":["0.9 m 或以上","2 m 或以上","1.1 m 或以上","300 mm 或以上"],"a":2,"q_en":"What height of upstand edge board shall be provided at the outer edge of the catch platform?","o_en":["0.9 m or higher","2 m or higher","1.1 m or higher","300 mm or higher"],"e_en":"1.1 m or higher, measured from the toe of roof line at the outer edge; the roof should also be pitched inwards to contain debris and drain.","doc":"demolition-2004","pp":"18","tier":"偶考"},{"id":"DEM-007","t":"tf","d":1,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.4","p":29,"q":"在 covered walkway 上加建臨時承建商寫字樓（contractor's shed）時，可以直接坐在 covered walkway 結構上。","e":"錯。承建商寫字樓必須在結構上獨立於 covered walkway，其屋面亦須符合 catch platform 或 walkway 的設計荷載。","x":"it must be structurally independent of the covered walkway.","ex":"demol","a":false,"q_en":"A temporary contractor's shed built over the covered walkway may bear directly on the covered walkway structure.","e_en":"False. The shed must be structurally independent of the covered walkway, and its roof must meet the catch platform or walkway design loads.","doc":"demolition-2004","pp":"18","tier":"偶考"},{"id":"DEM-008","t":"mcq","d":2,"tp":"棚架及保護網 Scaffolding & screens","c":"3.3.1(B)","p":30,"q":"拆卸工程的竹棚須以不大於多少的間距（水平及垂直）拉結至穩固錨位？","e":"竹棚錨固間距 ≤ 4 m（兩個方向）；棚高超過 15 m 時，須每 ≤ 15 m 設鋼托架承托。","x":"Bamboo scaffold shall be tied to sound anchors at intervals of not more than 4m in both horizontal and vertical directions.","ex":"demol","o":["4 m","2 m","6 m","15 m"],"a":0,"q_en":"At what maximum interval (horizontal and vertical) shall a bamboo scaffold be tied to sound anchors?","e_en":"Ties at ≤ 4 m both ways; if the scaffold is higher than 15 m, steel brackets are required at intervals of ≤ 15 m.","doc":"demolition-2004","pp":"19","tier":"偶考"},{"id":"DEM-009","t":"mcq","d":2,"tp":"棚架及保護網 Scaffolding & screens","c":"3.3.1(B)","p":30,"q":"竹棚高度超過 15 m 時要怎樣處理？","e":"超過 15 m 的竹棚要以錨固於現有結構（或其他承托系統）的鋼托架，每不超過 15 m 承托；如托架由舊樓承托，須由 RSE 設計。","x":"If the scaffold is higher than 15m, steel brackets anchored to the existing building structure or other support system shall be provided at interval of not more than 15m","ex":"demol","o":["每不超過 15 m 設錨固於現有結構的鋼托架承托","須由 RSE 在現場全職監督","每 4 m 加設一層 catchfan","改用金屬棚架"],"a":0,"q_en":"What is required when a bamboo scaffold is higher than 15 m?","o_en":["Steel brackets anchored to the existing structure at intervals of ≤ 15 m","Full-time site supervision by the RSE","Add a catchfan every 4 m","Change to a metal scaffold"],"e_en":"Steel brackets anchored to the existing structure (or another support system) at ≤ 15 m intervals; elevated supports fixed to the building shall be designed by an RSE.","doc":"demolition-2004","pp":"19","tier":"偶考"},{"id":"DEM-010","t":"mcq","d":2,"tp":"棚架及保護網 Scaffolding & screens","c":"3.3.1(A)","p":30,"q":"拆卸時工作平台應設於哪裏？","e":"工作平台須設於正在拆卸樓層正下方連續三層，外緣要有 toe board，並定期清理積聚碎料。","x":"provided on the three consecutive lifts directly below the floor being demolished with toe boards provided at the outer edge.","ex":"demol","o":["只在正在拆卸的樓層","正在拆卸樓層正下方連續三層（lifts），外邊設踢腳板","地面層及頂層","每隔一層"],"a":1,"q_en":"Where shall working platforms be provided during demolition?","o_en":["Only at the floor being demolished","On the three consecutive lifts directly below the floor being demolished, with toe boards","At ground level and roof only","At every alternate floor"],"e_en":"On the three consecutive lifts directly below the floor being demolished, with toe boards at the outer edge; accumulated debris to be cleared periodically.","doc":"demolition-2004","pp":"19","tier":"偶考"},{"id":"DEM-011","t":"mcq","d":2,"tp":"棚架及保護網 Scaffolding & screens","c":"3.3.2(B)","p":31,"q":"保護網（protective screens）與棚架的拉結間距及搭接闊度要求是？","e":"保護網須以不超過 2 m（水平及垂直）或網闊（取小者）拉結，搭接最少 300 mm；外層用帆布（tarpaulin）加重型網，共兩層。","x":"The screens shall have a minimum overlapping width of 300 mm.","ex":"demol","o":["拉結 ≤ 3 m，搭接 ≥ 200 mm","拉結 ≤ 4 m，搭接 ≥ 150 mm","拉結 ≤ 1 m，搭接 ≥ 600 mm","拉結 ≤ 2 m（或網闊，取小者），搭接 ≥ 300 mm"],"a":3,"q_en":"What tie spacing and overlap apply to protective screens on scaffolding?","o_en":["Ties ≤ 3 m, overlap ≥ 200 mm","Ties ≤ 4 m, overlap ≥ 150 mm","Ties ≤ 1 m, overlap ≥ 600 mm","Ties ≤ 2 m (or net width, if less), overlap ≥ 300 mm"],"e_en":"Ties at ≤ 2 m both ways or the net width, whichever is less; minimum overlap 300 mm. Two layers: heavy duty net with tarpaulin over it.","doc":"demolition-2004","pp":"20","tier":"偶考"},{"id":"DEM-012","t":"mcq","d":1,"tp":"安全網架 Catchfan","c":"3.4.1","p":32,"q":"Catchfan 須設於工作樓層以下不多於多少垂直距離？","e":"≤ 10 m；水平伸出棚架外 1.5 m，傾角一般 20°–45°。Catchfan 只作預防措施，不可當臨時承托。","x":"a catchfan shall be installed at a vertical distance of not more than 10 m below the working floor.","ex":"demol","o":["15 m","4 m","20 m","10 m"],"a":3,"q_en":"A catchfan shall be installed at a vertical distance of not more than how much below the working floor?","e_en":"≤ 10 m; horizontal extension 1.5 m beyond the scaffold, inclined typically 20° to 45°. Catchfans are precautionary only, not temporary supports.","doc":"demolition-2004","pp":"21","tier":"偶考"},{"id":"DEM-013","t":"mcq","d":2,"tp":"安全網架 Catchfan","c":"3.4.1","p":32,"q":"Catchfan 的水平伸出長度及典型傾角為？","e":"由棚架外面伸出 1.5 m，傾角 20°–45°（由水平量度）。","x":"A catchfan shall have a horizontal extension of 1.5 m from the exterior face of the scaffolding.","ex":"demol","o":["伸出 2.0 m；傾角 45°–60°","伸出 1.5 m；水平","伸出棚架外面 1.5 m；傾角 20°–45°","伸出 1.0 m；傾角 10°–20°"],"a":2,"q_en":"What horizontal extension and typical inclination should a catchfan have?","o_en":["2.0 m; 45° to 60°","1.5 m; horizontal","1.5 m beyond the scaffold face; 20° to 45°","1.0 m; 10° to 20°"],"e_en":"1.5 m horizontal extension from the exterior face of the scaffolding, inclined 20° to 45° from horizontal.","doc":"demolition-2004","pp":"21","tier":"偶考"},{"id":"DEM-014","t":"tf","d":1,"tp":"安全網架 Catchfan","c":"3.4.1","p":32,"q":"金屬 catchfan 可以裝在竹棚上。","e":"錯。竹 catchfan 可用於竹棚或金屬棚，但金屬 catchfan 只准裝在金屬棚架上。","x":"metal catchfans are allowed to be mounted on metal scaffolds only.","ex":"demol","a":false,"q_en":"Metal catchfans may be mounted on bamboo scaffolds.","e_en":"False. Bamboo catchfans can be used on bamboo or metal scaffolds, but metal catchfans are allowed on metal scaffolds only.","doc":"demolition-2004","pp":"21","tier":"偶考"},{"id":"DEM-015","t":"mcq","d":2,"tp":"臨時承托 Temporary supports","c":"3.5.3(A)","p":38,"q":"設計拆卸用臨時承托時，工人、手工具及小型設備的施工荷載最少取多少？","e":"除經詳細評估的特殊情況外，施工荷載不可少於 1.5 kPa；碎料及機械荷載按實際重量另計。","x":"in no case shall the construction loads due to item (1) be assumed to be less than 1.5 kPa.","tier":"常考","ex":"constr","o":["5 kPa","2.5 kPa","0.75 kPa","1.5 kPa"],"a":3,"q_en":"For temporary supports in demolition, what is the minimum construction load (operatives, hand tools, small equipment)?","e_en":"Unless justified by detailed evaluation, construction load shall not be less than 1.5 kPa; debris and machinery are added by actual weight.","doc":"demolition-2004","pp":"27"},{"id":"DEM-016","t":"mcq","d":2,"tp":"臨時承托 Temporary supports","c":"3.5.3(A)","p":38,"q":"沒有機械的工作荷載資料時，懸空樓板上移動機械的靜重應乘以多少的最小衝擊系數（impact factor）？","e":"最少 1.25，以計及移動設備在懸空樓板上的振動。方法說明（method statement）中使用機械拆卸時常要引用。","x":"minimum impact factor of 1.25 shall be applied to the static weight of the machinery","tier":"常考","ex":"constr","o":["1.25","1.1","1.5","2.0"],"a":0,"q_en":"Where no working load is available, what minimum impact factor applies to the static weight of machinery on a suspended floor?","e_en":"At least 1.25 to allow for vibration from moving equipment on a suspended floor; often cited in method statements for mechanical demolition.","doc":"demolition-2004","pp":"27"},{"id":"DEM-017","t":"mcq","d":2,"tp":"臨時承托 Temporary supports","c":"3.5.3(B)","p":38,"q":"臨時承托的最小側向設計荷載為？","e":"取計算側向力（斜坡、機械、傾倒碎料、風）與「3% 垂直荷載或 1.5 kN/m」兩者較大者。注意與 Concrete Code 1.5% notional load 分別。","x":"A minimum of 3% of total vertical loads at the centre of gravity of these applied loads, or a minimum of 1.5 kN per metre length of the supported structure, whichever is greater","tier":"常考","ex":"constr","o":["總垂直荷載的 1.5%","只需考慮風荷載","總垂直荷載的 3% 或每米 1.5 kN，取較大者","總垂直荷載的 1% 或每米 1.0 kN"],"a":2,"q_en":"What is the minimum lateral design load for temporary supports?","o_en":["1.5% of total vertical load","Wind load only","3% of total vertical load or 1.5 kN per metre, whichever is greater","1% of total vertical load or 1.0 kN/m"],"e_en":"The greater of the calculated lateral forces (slopes, machinery, debris dumping, wind) and 3% of vertical load or 1.5 kN/m. Do not confuse with the 1.5% notional load of the Concrete Code.","doc":"demolition-2004","pp":"27"},{"id":"DEM-018","t":"mcq","d":2,"tp":"樓面支撐 Floor propping","c":"3.5.5 Table 3.4","p":40,"q":"Table 3.4：懸空樓板上操作的機械最大容許重量為？","e":"不論樓板設計外加荷載是 3、5、7.5 或 12.5 kPa，Table 3.4 的機械上限都是 11,600 kg；支撐所需的連續樓層數則隨樓板設計荷載而變。","x":"mechanical plant 11,600 kg 11,600 kg 11,600 kg 11,600 kg","ex":"demol","o":["5,000 kg","20,000 kg","30,000 kg","11,600 kg"],"a":3,"q_en":"Table 3.4: what is the maximum weight of mechanical plant allowed on a suspended floor?","e_en":"Whatever the floor design imposed load (3, 5, 7.5 or 12.5 kPa), the plant limit in Table 3.4 is 11,600 kg; the number of propped floors varies.","doc":"demolition-2004","pp":"29","tier":"偶考"},{"id":"DEM-019","t":"mcq","d":3,"tp":"樓面支撐 Floor propping","c":"3.5.5 Table 3.4","p":40,"q":"被拆樓板的設計外加荷載為 3 kPa，按 Table 3.4 須多少層連續樓層以支撐分散機械荷載？","e":"3 / 5 / 7.5 / 12.5 kPa 對應 5 / 3 / 2 / 2 層；臨時斜道局部荷載則為 5 / 4 / 3 / 2 層。支撐間距每方向 ≤ 1.2 m。","x":"mechanical plant 5 3 2 2","ex":"demol","o":["5","2","3","4"],"a":0,"q_en":"The floor to be demolished was designed for 3 kPa. Per Table 3.4, how many consecutive floors must be propped to distribute the plant load?","e_en":"3 / 5 / 7.5 / 12.5 kPa need 5 / 3 / 2 / 2 floors; for the temporary ramp 5 / 4 / 3 / 2 floors. Props at ≤ 1.2 m each way.","doc":"demolition-2004","pp":"29","tier":"偶考"},{"id":"DEM-020","t":"mcq","d":2,"tp":"樓面支撐 Floor propping","c":"3.5.5","p":40,"q":"按 Table 3.4 的支撐要求，每支鋼支撐（steel prop）最少承載力為？","e":"機械區 25 kN、斜道下 45 kN；鋼斜道坡度不陡於 30°，支撐至少兩個方向支撐（braced）。","x":"than 25 kN for supporting the mechanical plant and 45 kN for area under the access ramp;","ex":"demol","o":["承托機械 45 kN；斜道下 25 kN","承托機械 25 kN；斜道下 45 kN","兩者均 60 kN","兩者均 20 kN"],"a":1,"q_en":"Under the Table 3.4 propping requirements, what minimum bearing capacity must each steel prop have?","o_en":["45 kN under the plant; 25 kN under the ramp","25 kN under the plant; 45 kN under the access ramp","60 kN for both","20 kN for both"],"e_en":"25 kN for the plant area and 45 kN under the access ramp; steel ramp not steeper than 30°; props braced in at least 2 directions.","doc":"demolition-2004","pp":"29","tier":"偶考"},{"id":"DEM-021","t":"mcq","d":1,"tp":"樓面支撐 Floor propping","c":"3.5.5","p":40,"q":"機械上落用的鋼斜道（steel access ramp）坡度不可陡於？","e":"斜道坡度不可陡於 30°，並以鋼斜道分散荷載。","x":"The gradient of the ramp shall not be steeper than 30°;","ex":"demol","o":["15°","45°","30°","1:10"],"a":2,"q_en":"The gradient of the structural steel access ramp shall not be steeper than?","e_en":"The ramp shall not be steeper than 30°, using a structural steel ramp to spread the load.","doc":"demolition-2004","pp":"29","tier":"偶考"},{"id":"DEM-022","t":"mcq","d":1,"tp":"振動 Vibration","c":"3.8.7","p":46,"q":"機械拆卸造成的長期振動，相鄰結構的 peak particle velocity 一般不應超過？","e":"一般準則 15 mm/s。Foundations Code Table 7.3 對普通堅固建築的瞬時振動亦為 15 mm/s，可一併記。","x":"the peak particle velocities at any adjoining structure shall not exceed 15mm/sec for prolonged vibration","ex":"demol","o":["5 mm/s","15 mm/s","25 mm/s","50 mm/s"],"a":1,"q_en":"As a general guideline, for prolonged vibration from mechanical demolition, the ppv at any adjoining structure shall not exceed?","e_en":"15 mm/s as a general guideline. Foundations Code Table 7.3 also gives 15 mm/s for transient vibration on ordinary robust buildings.","doc":"demolition-2004","pp":"35","tier":"偶考"},{"id":"DEM-023","t":"mcq","d":2,"tp":"碎料處理 Debris handling","c":"3.10.1(C)","p":48,"q":"在樓板開孔作碎料槽時，開孔總面積及單孔尺寸限制為？","e":"開孔總面積須少於樓面總面積 25%，每孔不大於 900 mm × 900 mm（除非有結構計算證明）。","x":"the total openings shall be less than 25% of the total aggregate floor area.","ex":"demol","o":["總面積 < 50%；每孔 ≤ 1.2 m × 1.2 m","沒有限制","總面積 < 樓面總面積 25%；每孔 ≤ 900 mm × 900 mm","總面積 < 10%；每孔 ≤ 600 mm × 600 mm"],"a":2,"q_en":"If floor openings are created to convey debris, what limits apply?","o_en":["Total < 50%; each ≤ 1.2 m × 1.2 m","No limit","Total < 25% of floor area; each ≤ 900 mm × 900 mm","Total < 10%; each ≤ 600 mm × 600 mm"],"e_en":"Total openings less than 25% of the aggregate floor area; each opening not larger than 900 mm × 900 mm unless substantiated.","doc":"demolition-2004","pp":"37","tier":"偶考"},{"id":"DEM-024","t":"tf","d":1,"tp":"碎料處理 Debris handling","c":"3.10.4","p":50,"q":"一般情況下，拆卸時容許碎料堆積在樓面上，只要不靠近外牆即可。","e":"錯。一般不容許碎料堆積，除非有工程計算證明；碎料亦不可靠着圍板或外牆堆積，支撐設計須包括碎料荷載。","x":"In general, the debris accumulation on the floors is not allowed unless the debris accumulation is justified by engineering calculations.","ex":"demol","a":false,"q_en":"In general, debris may accumulate on floors during demolition provided it is kept away from the external wall.","e_en":"False. Debris accumulation is not allowed unless justified by engineering calculations; it must not accumulate against hoarding or external walls, and propping design shall include debris loading.","doc":"demolition-2004","pp":"39","tier":"偶考"},{"id":"DEM-025","t":"mcq","d":2,"tp":"機械拆卸 Mechanical demolition","c":"4.3.1","p":71,"q":"以下哪個位置禁止機械（mechanical plant）操作？","e":"禁區：樓邊 2 m 內、任何樓板開孔 1 m 內、及任何懸臂結構上。","x":"(1) within 2 m of the building edge;","ex":"demol","o":["距樓板開孔 3 m 以內","距樓邊 5 m 以內","所有已支撐的樓板","距樓邊 2 m 以內"],"a":3,"q_en":"In which of the following areas is operation of mechanical plant prohibited?","o_en":["Within 3 m of any floor opening","Within 5 m of the building edge","On all propped floors","Within 2 m of the building edge"],"e_en":"Prohibited: within 2 m of the building edge, within 1 m of any floor opening, and on any cantilevered structure.","doc":"demolition-2004","pp":"60","tier":"偶考"},{"id":"DEM-026","t":"mcq","d":2,"tp":"機械拆卸 Mechanical demolition","c":"4.4.2","p":87,"q":"長臂液壓破碎機（long boom arm）拆卸時，最少安全區（clear space）為？","e":"最少 1/2 建築物高度作墮下碎料安全區；以碎料堆砌的機械平台高度 ≤ 3 m，側坡不陡於 1:1。","x":"The operation shall have a minimum clear space of 1/2 the building height as a safety zone for the falling debris;","ex":"demol","o":["建築物高度的 1/2","建築物高度","建築物高度的 1/3","固定 6 m"],"a":0,"q_en":"For a hydraulic crusher with long boom arm, what minimum clear space is required as a safety zone?","o_en":["1/2 of the building height","The full building height","1/3 of the building height","A fixed 6 m"],"e_en":"At least 1/2 the building height as a safety zone; any debris platform limited to 3 m high with side slopes not steeper than 1:1.","doc":"demolition-2004","pp":"76","tier":"偶考"},{"id":"DEM-027","t":"mcq","d":3,"tp":"機械拆卸 Mechanical demolition","c":"4.5.2","p":91,"q":"使用 wrecking ball 時，吊機臂及鋼纜在工作半徑的額定能力最少為鐵球重量的幾倍？","e":"5 倍；鋼纜強度亦須最少為樓板及樑名義鋼筋抗拉強度的 2 倍。拉倒用鋼纜則一般要求 ≥ 4 倍預計拉力。","x":"rated capacity, at the working radius, of at least 5 times the weight of the ball;","ex":"demol","o":["3 倍","2 倍","5 倍","4 倍"],"a":2,"q_en":"For wrecking-ball demolition, the rated capacity of the wire and boom at the working radius shall be at least how many times the ball weight?","o_en":["3 times","2 times","5 times","4 times"],"e_en":"5 times; the wire strength shall also be at least 2 times the tensile strength of the nominal slab/beam reinforcement. Pulling wires generally need ≥ 4 times the anticipated force.","doc":"demolition-2004","pp":"80","tier":"偶考"},{"id":"DEM-028","t":"mcq","d":2,"tp":"機械拆卸 Mechanical demolition","c":"4.7.4","p":101,"q":"Deliberate collapse 及 wire rope pulling 方法只限用於多高的建築物？","e":"兩者（以及 pusher arm）都限於少於 15 m 高的建築物，並須保持 1.5 倍構件高度的安全距離。","x":"Application of the deliberate collapse method shall be limited to buildings less than 15 m high.","ex":"demol","o":["少於 10 m","少於 15 m","少於 30 m","少於 24 m"],"a":1,"q_en":"Deliberate collapse and wire rope pulling are limited to buildings of what height?","o_en":["Less than 10 m","Less than 15 m","Less than 30 m","Less than 24 m"],"e_en":"Both (and the pusher arm method) are limited to buildings less than 15 m high, with a safety distance of 1.5 times the element height.","doc":"demolition-2004","pp":"90","tier":"偶考"},{"id":"DEM-029","t":"mcq","d":3,"tp":"預應力結構拆卸 Prestressed demolition","c":"5.2.2(B)","p":107,"q":"現場澆注預應力結構中，「分階段後張拉、最終灌漿」的 transfer beam（承托多層框架）屬哪一類？","e":"C1：一次後張拉並全灌漿；C2：同 C1 但未灌漿；C3：分階段張拉、最終全灌漿（例如承托多層框架的轉換樑）；C4：同 C3 但未灌漿。","x":"Transfer beam supporting multi-level frames is an example of this category.","ex":"demol","o":["Category C3","Category C2","Category C1","Category P3"],"a":0,"q_en":"A cast-in-place transfer beam supporting multi-level frames, post-tensioned in stages and fully grouted in the final condition, belongs to which category?","e_en":"C1: post-tensioned before loading, fully grouted; C2: as C1 but ungrouted; C3: stressed in stages, fully grouted in the final condition (e.g. transfer beam supporting multi-level frames); C4: as C3 but ungrouted.","doc":"demolition-2004","pp":"96","tier":"偶考"},{"id":"DEM-030","t":"mcq","d":2,"tp":"拆卸監工 Demolition supervision","c":"6.2","p":124,"q":"以下哪一項屬「complex structures」而須由 RSC（Demolition）委任 site engineer 監督整個拆卸過程？","e":"例子：平板、預應力、轉換板、吊桿、長跨樑（> 10 m）、鋼框架、伸出街外跨度 > 1.2 m 的懸臂、兼作擋土的建築物等。","x":"cantilevered structure with span greater than 1.2m and is over street","ex":"demol","o":["跨度 8 m 的普通鋼筋混凝土樑","伸出街外、跨度 0.9 m 的露台","伸出街外、跨度大於 1.2 m 的懸臂結構","三層高的普通框架樓宇"],"a":2,"q_en":"Which of the following counts as a \"complex structure\" requiring a site engineer appointed by the RSC (Demolition)?","o_en":["An ordinary 8 m span RC beam","A 0.9 m balcony over a street","A cantilevered structure over a street with span greater than 1.2 m","A 3-storey ordinary framed building"],"e_en":"Examples: flat slab, prestressed concrete, transfer plate, hanger, long span beam (> 10 m), steel frame, cantilever over street with span > 1.2 m, buildings also acting as earth-retaining structures.","doc":"demolition-2004","pp":"113","tier":"偶考"},{"id":"DEM-031","t":"mcq","d":2,"tp":"拆卸計劃 Demolition plan","c":"2.1.3(A)(3)","p":19,"q":"拆卸計劃須特別標示「unconventional structural elements」。以下哪項「不」屬於規範所列例子？","e":"規範例子包括預應力、預製、鋼框架、吊桿、桁架、深樑、長跨樑（> 10 m）、拱、轉換板/轉換樑、擋土或地庫結構、平板、空心磚肋板及大型懸臂。6 m 普通樑不在其列。","x":"long span beams (greater than 10m), arches, transfer plates,","ex":"demol","o":["跨度 6 m 的普通樑","平板（flat slabs）","長跨樑（大於 10 m）","轉換板（transfer plates）"],"a":0,"q_en":"The demolition plan must show \"unconventional structural elements\". Which of the following is NOT one of the Code's examples?","o_en":["An ordinary 6 m span beam","Flat slabs","Long span beams (greater than 10 m)","Transfer plates"],"e_en":"Examples include prestressed, precast, steel frames, hangers, trusses, deep beams, long span beams (> 10 m), arches, transfer plates/girders, earth-retaining or basement structures, flat slabs, hollow block ribbed slabs and large cantilevers. An ordinary 6 m beam is not.","doc":"demolition-2004","pp":"8","tier":"偶考"},{"id":"ASD-001","t":"mcq","d":1,"tp":"鋼筋種類 Reinforcement types","c":"3.1 Table 3.1","p":9,"q":"ArchSD Drafting Manual 中，鋼筋縮寫「T」代表？","e":"R = Grade 250 光圓鋼筋；T = Grade 500B/500C 帶肋鋼筋，特徵強度 500 N/mm²。畫 framing plan 及詳圖時要統一使用。","x":"RIBBED STEEL REINFORCING BARS 500B OR 500C 500 T","tier":"常考","ex":"detail","o":["Grade 250 光圓鋼筋","Grade 500B 或 500C 帶肋鋼筋（CS2:2012）","高強度鋼絞線","不銹鋼筋"],"a":1,"q_en":"In the ArchSD Drafting Manual, what does the reinforcement abbreviation \"T\" denote?","o_en":["Grade 250 plain bars","Grade 500B or 500C ribbed bars (CS2:2012)","High tensile strand","Stainless steel bars"],"e_en":"R = Grade 250 plain bars; T = Grade 500B/500C ribbed bars with characteristic strength 500 N/mm². Use consistently on framing plans and details.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"ASD-002","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.2","p":9,"q":"按 Table 3.2，4T25 的鋼筋面積為？","e":"單支 T25 = 491 mm²，4 支 = 1964 mm²。1473 是 3T25，2455 是 5T25，1257 是 4T20。考試計算樑配筋時必用。","x":"4 314 452 804 1257 1964 3217 5026","tier":"常考","ex":"rc","o":["2455 mm²","1964 mm²","1257 mm²","1473 mm²"],"a":1,"q_en":"Per Table 3.2, what is the area of 4T25?","e_en":"One T25 = 491 mm², four = 1964 mm². 1473 is 3T25, 2455 is 5T25, 1257 is 4T20. Used constantly in beam sizing calculations.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"ASD-003","t":"mcq","d":1,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"按 Table 3.3，T12 @ 150 每米鋼筋面積為？","e":"T12-150 = 754 mm²/m；523 是 T10-150，905 是 T12-125，1341 是 T16-150。","x":"150 523 754 1341 2095 3273 5362 8377","tier":"常考","ex":"rc","o":["754 mm²/m","523 mm²/m","1341 mm²/m","905 mm²/m"],"a":0,"q_en":"Per Table 3.3, what is the area per metre of T12 at 150 mm spacing?","e_en":"T12-150 = 754 mm²/m; 523 is T10-150, 905 is T12-125, 1341 is T16-150.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"ASD-004","t":"mcq","d":2,"tp":"鋼筋面積 Bar areas","c":"3.2 Table 3.3","p":9,"q":"板需要 As ≈ 1000 mm²/m，以下哪個配筋最經濟而足夠（Table 3.3）？","e":"T16-200 = 1006 mm²/m 剛好足夠；T12-150 不足；T16-150、T20-150 過量。","x":"5 393 566 1006 1571 2455 4022 6283 200 393 566 1006 1571 2455 4022 6283","tier":"常考","ex":"rc","o":["T12-150（754 mm²/m）","T16-200（1006 mm²/m）","T20-150（2095 mm²/m）","T16-150（1341 mm²/m）"],"a":1,"q_en":"A slab needs As ≈ 1000 mm²/m. Which provision is sufficient and most economical (Table 3.3)?","o_en":["T12-150 (754 mm²/m)","T16-200 (1006 mm²/m)","T20-150 (2095 mm²/m)","T16-150 (1341 mm²/m)"],"e_en":"T16-200 = 1006 mm²/m just suffices; T12-150 is insufficient; T16-150 and T20-150 are excessive.","doc":"asd-drafting-manual-rc","pp":"3.1"},{"id":"ASD-005","t":"mcq","d":1,"tp":"板配筋 Slab detailing","c":"7.1","p":19,"q":"ArchSD Drafting Manual 對板鋼筋的最小及最大直徑要求為？","e":"板：T10–T20；牆則最大 T32（特殊情況 T40）。","x":"(ii) MAX. BAR SIZE TO BE T20","tier":"常考","ex":"detail","o":["最小 T8、最大 T25","最小 T10、最大 T32","最小 T10、最大 T20","最小 T12、最大 T32"],"a":2,"q_en":"What minimum and maximum bar sizes does the ArchSD Drafting Manual set for slabs?","o_en":["Min. T8, max. T25","Min. T10, max. T32","Min. T10, max. T20","Min. T12, max. T32"],"e_en":"Slabs: T10 to T20; walls allow up to T32 (T40 in exceptional cases).","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-006","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.1","p":19,"q":"天台板或外露於天氣的板，鋼筋間距不應大於多少？","e":"外露板 ≤ 200 mm（懸臂板 150 mm），以控制裂縫及滲水。考試天台多有綠化及防水要求，詳圖要留意。","x":"SPACING OF REINFORCING BAR FOR ROOF SLAB OR SLAB EXPOSED TO WEATHER SHALL NOT BE GREATER THAN 200","tier":"常考","ex":"detail","o":["300 mm","150 mm","250 mm","200 mm"],"a":3,"q_en":"For roof slabs or slabs exposed to weather, bar spacing shall not be greater than?","e_en":"≤ 200 mm for exposed slabs (cantilever slabs 150 mm) to control cracking and leakage. Exam roofs often carry landscaping and waterproofing, so detail accordingly.","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-007","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"7.1 Table 7.2","p":19,"q":"Table 7.2：板厚 h ≤ 200 mm（或 As,req ≤ 0.3% Ac）時，主筋最大間距為？","e":"一般 ≤ min(3h, 300)；集中荷載/最大彎矩區 ≤ min(2h, 250)；h > 200 時按 As 比例取 300 或 150。","x":"h ≤ 200 or AS REQ ≤ 0.3% AC ≤ MIN.( 3h ; 300)","tier":"常考","ex":"detail","o":["min(2h, 250 mm)","min(3h, 300 mm)","min(4h, 400 mm)","150 mm"],"a":1,"q_en":"Table 7.2: for h ≤ 200 mm (or As,req ≤ 0.3% Ac), what is the maximum main bar spacing?","e_en":"Generally ≤ min(3h, 300); in areas of concentrated load/max. moment ≤ min(2h, 250); for h > 200 use 300 or 150 depending on As ratio.","doc":"asd-drafting-manual-rc","pp":"7.1"},{"id":"ASD-008","t":"mcq","d":1,"tp":"繪圖規範 Drawing conventions","c":"8.1","p":23,"q":"ArchSD 樑詳圖的建議比例為？","e":"樑立面 1:50、剖面 1:20。考試的 framing plan 通常 1:100 或 1:200，細部 1:20–1:50，要標示比例及主要尺寸。","x":"ELEVATION : 1 : 50 SECTION : 1 : 20","tier":"常考","ex":"detail","o":["立面 1:20；剖面 1:10","立面 1:200；剖面 1:100","立面 1:100；剖面 1:50","立面 1:50；剖面 1:20"],"a":3,"q_en":"What scales does the ArchSD manual show for beam details?","o_en":["Elevation 1:20; section 1:10","Elevation 1:200; section 1:100","Elevation 1:100; section 1:50","Elevation 1:50; section 1:20"],"e_en":"Beam elevation 1:50, section 1:20. Exam framing plans are usually 1:100 or 1:200 with details at 1:20 to 1:50; always state scale and key dimensions.","doc":"asd-drafting-manual-rc","pp":"8.1"},{"id":"ASD-009","t":"mcq","d":2,"tp":"繪圖規範 Drawing conventions","c":"2.2.2","p":5,"q":"按 ArchSD 剖面符號規則，數字剖面符號（numeric section marks）用於？","e":"字母符號：貫穿多層、在不同樓層平面出現的剖面；數字符號：只在一個樓層平面上的局部剖面。避免用 I、O 及 0。","x":"USE NUMERIC SECTION MARKS TO INDICATE LOCAL SECTIONS CUT ON PLANS","tier":"常考","ex":"detail","o":["所有立面","貫穿多層樓面的剖面","同一樓層平面上的局部剖面","只用於基礎"],"a":2,"q_en":"Under the ArchSD section-mark rules, numeric section marks are used for?","o_en":["All elevations","Sections cut across multiple floor levels","Local sections cut on one floor plan","Foundations only"],"e_en":"Alphabetic marks: sections cut across multiple floor levels shown on different floor plans; numeric marks: local sections on one floor plan. Avoid I, O and 0.","doc":"asd-drafting-manual-rc","pp":"2.2"},{"id":"ASD-010","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"8.2","p":29,"q":"樑的總深度超過多少時須設側筋（side bars）？","e":"超過 750 mm 深須設側筋，控制側面裂縫；轉換樑及深樑尤其重要。","x":"SIDE BARS FOR BEAMS EXCEEDING 750mm OVERALL DEPTH","tier":"常考","ex":"detail","o":["600 mm","500 mm","750 mm","1000 mm"],"a":2,"q_en":"Side bars are required for beams exceeding what overall depth?","e_en":"Beams exceeding 750 mm overall depth need side bars to control side-face cracking; important for transfer and deep beams.","doc":"asd-drafting-manual-rc","pp":"8.7"},{"id":"ASD-011","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.2","p":36,"q":"柱箍筋（binders）要求：任何主筋與受約束鋼筋（restrained bar）的距離不應大於？","e":"柱：≤ 150 mm；牆中受壓豎筋則為 ≤ 200 mm。箍筋最小 T10，間距取 400 mm、12 倍最小主筋直徑及柱較小尺寸之最小者。","x":"(ii) NO MAIN BAR SHOULD BE FURTHER THAN 150 mm FROM A RESTRAINED BAR","tier":"常考","ex":"detail","o":["300 mm","250 mm","200 mm","150 mm"],"a":3,"q_en":"Column binders: no main bar should be further than what distance from a restrained bar?","e_en":"Columns: ≤ 150 mm; for compression bars in walls ≤ 200 mm. Binders min. T10, spacing the least of 400 mm, 12 × smallest main bar and the lesser column dimension.","doc":"asd-drafting-manual-rc","pp":"9.3"},{"id":"ASD-012","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"ArchSD Drafting Manual 對鋼筋混凝土牆豎筋及水平筋放置位置的一般要求是？","e":"除 PSE 另有指明，豎筋在內、水平筋在外。最小 T10、最大 T32。","x":"i. VERTICAL BARS TO BE PLACED ON INNER FACE","tier":"常考","ex":"detail","o":["由承建商決定","豎筋放外層，水平筋放內層","兩者同層","豎筋放內層，水平筋放外層"],"a":3,"q_en":"What is the ArchSD Drafting Manual's general rule for placing vertical and horizontal bars in RC walls?","o_en":["At the contractor's choice","Vertical outer, horizontal inner","Both in the same layer","Vertical bars on the inner face, horizontal bars on the outer face"],"e_en":"Unless specified otherwise by the PSE, vertical bars inside and horizontal bars outside. Min. T10, max. T32.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-013","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"鋼筋混凝土牆豎筋最小配筋率為？","e":"豎筋 0.4% 最小、4.0% 最大（搭接處 8.0%）；水平筋 0.25% 最小。與 Concrete Code 9.6 一致。","x":"i. VERTICAL BARS – 0.4% MIN.","tier":"常考","ex":"detail","o":["0.25%","1.0%","0.13%","0.4%"],"a":3,"q_en":"What is the minimum vertical reinforcement ratio for a reinforced wall?","e_en":"Vertical 0.4% min., 4.0% max. (8.0% at laps); horizontal 0.25% min. Consistent with Concrete Code 9.6.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-014","t":"mcq","d":2,"tp":"牆配筋 Wall detailing","c":"10.1","p":40,"q":"鋼筋混凝土牆豎筋最大間距為（非受拉牆）？","e":"豎筋 ≤ min(300 mm, 3t)；受拉牆 150 mm。水平筋 ≤ 300 mm。","x":"a) 300 mm (150 mm FOR WALL IN TENSION) AND","tier":"常考","ex":"detail","o":["150 mm","300 mm 與 3 倍牆厚取較小","200 mm","400 mm 與 4 倍牆厚取較小"],"a":1,"q_en":"What is the maximum spacing of vertical bars in a reinforced wall (not in tension)?","o_en":["150 mm","The lesser of 300 mm and 3 × wall thickness","200 mm","The lesser of 400 mm and 4 × wall thickness"],"e_en":"Vertical bars ≤ min(300 mm, 3t); 150 mm for walls in tension. Horizontal bars ≤ 300 mm.","doc":"asd-drafting-manual-rc","pp":"10.1"},{"id":"ASD-015","t":"mcq","d":2,"tp":"牆開孔 Wall openings","c":"10.4","p":43,"q":"ArchSD 牆開孔標準詳圖適用於多闊的開孔？更闊時應如何？","e":"標準詳圖只適用 L1 ≤ 2 m；超過或位於關鍵位置要由 PSE 設計。","x":"iii. FOR OPENING WIDTH (L1) > 2m, OR AT CRITICAL LOCATION, PSE SHOULD BE CONSULTED.","tier":"偶考","ex":"detail","o":["L1 ≤ 3 m；> 3 m 須諮詢 PSE","任何闊度均適用","L1 ≤ 1 m；> 1 m 須加樑","L1 ≤ 2 m；> 2 m 或關鍵位置須諮詢 PSE"],"a":3,"q_en":"Up to what opening width do the ArchSD standard wall-opening details apply, and what if wider?","o_en":["L1 ≤ 3 m; > 3 m consult the PSE","Any width","L1 ≤ 1 m; > 1 m needs a beam","L1 ≤ 2 m; > 2 m or at critical locations consult the PSE"],"e_en":"Standard details apply only for L1 ≤ 2 m; wider openings or critical locations need PSE design.","doc":"asd-drafting-manual-rc","pp":"10.4"},{"id":"ASD-016","t":"mcq","d":2,"tp":"水缸詳圖 Water tank detailing","c":"12.0","p":47,"q":"ArchSD 水缸詳圖要求的最少鋼筋率及最少保護層為？","e":"水缸：最小 T10、最少 0.35%、間距 ≤ min(300, 厚度)、保護層 ≥ 40 mm。","x":"ii. MIN. AREA OF STEEL REINFORCEMENT - 0.35%","tier":"偶考","ex":"detail","o":["0.24%；30 mm","0.35%；40 mm","0.5%；50 mm","0.13%；25 mm"],"a":1,"q_en":"What minimum steel ratio and cover does the ArchSD manual require for water tanks?","o_en":["0.24%; 30 mm","0.35%; 40 mm","0.5%; 50 mm","0.13%; 25 mm"],"e_en":"Water tanks: min. T10, min. 0.35%, spacing ≤ min(300, thickness), cover ≥ 40 mm.","doc":"asd-drafting-manual-rc","pp":"12.1"},{"id":"ASD-017","t":"mcq","d":2,"tp":"板開孔 Slab openings","c":"7.4","p":22,"q":"板開孔尺寸少於多少時，可把鋼筋移至開孔兩側而不需另加鋼筋？","e":"開孔 < 200 mm：把鋼筋移至兩側；≤ 600 mm 且結構上不重要：按標準加筋；更大須諮詢 PSE。","x":"(iii) IF SIZE OF OPENING < 200 mm, DISPLACE BARS TO SIDES OF","tier":"偶考","ex":"detail","o":["600 mm","300 mm","100 mm","200 mm"],"a":3,"q_en":"For slab openings smaller than what size may bars simply be displaced to the sides of the opening?","e_en":"Openings < 200 mm: displace bars to the sides; ≤ 600 mm and structurally insignificant: standard trimming bars; larger ones need PSE advice.","doc":"asd-drafting-manual-rc","pp":"7.4"},{"id":"HKH-001","t":"mcq","d":2,"tp":"混凝土物料 Concrete materials","c":"CON1.M810","p":2072,"q":"HKHA Specification：以 SRPC 製造的混凝土，最大總氯化物含量為？","e":"預應力/蒸汽養護 0.1%；鋼筋混凝土 0.35%；SRPC 混凝土 0.2%（以氯離子對膠凝材料計）。","x":"Concrete made with SRPC 0.2","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["0.1%","0.4%","0.2%","0.35%"],"a":2,"q_en":"HKHA Specification: what is the maximum total chloride content of concrete made with SRPC?","e_en":"Prestressed/steam cured 0.1%; reinforced concrete 0.35%; concrete made with SRPC 0.2% (chloride ion to cementitious content).","pp":"CON/39"},{"id":"HKH-002","t":"tf","d":2,"tp":"混凝土物料 Concrete materials","c":"CON1.M830","p":2072,"q":"HKHA Specification 容許 PFA 與 sulphate resisting Portland cement 一同使用。","e":"錯。規範明言不可把 PFA 與 SRPC 一同使用，亦不可在 Portland fly ash cement 以外再加 PFA。","x":"Do not use pulverised fuel ash with sulphate resisting Portland cement.","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","a":false,"q_en":"The HKHA Specification allows pulverised fuel ash to be used with sulphate resisting Portland cement.","e_en":"False. PFA shall not be used with SRPC, nor added to Portland fly ash cement.","pp":"CON/39"},{"id":"HKH-003","t":"mcq","d":2,"tp":"溫度控制 Temperature control","c":"CON1.W465","p":2083,"q":"HKHA Specification 要求哪些構件的新鮮混凝土溫度須控制在不高於 30°C？","e":"適用於強度 > 60 MPa 構件、大體積構件及 > 60 MPa 的大體積擋土牆；大體積構件須於澆注前最少兩個月提交溫控方案（CIRIA C660）。","x":"a. For the structural elements with concrete grade strength greater than 60 MPa;","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["只限預製件","混凝土強度等級大於 60 MPa 的構件及指明的大體積構件","只限地庫外牆","所有樓板"],"a":1,"q_en":"For which elements does the HKHA Specification require fresh concrete temperature to be controlled to not higher than 30°C?","o_en":["Precast units only","Elements with concrete grade above 60 MPa and specified massive elements","Basement external walls only","All slabs"],"e_en":"Applies to elements with grade > 60 MPa, massive elements and mass concrete retaining walls > 60 MPa; massive elements need a temperature-control submission at least two months before concreting (CIRIA C660).","pp":"CON/50"},{"id":"HKH-004","t":"mcq","d":2,"tp":"溫度控制 Temperature control","c":"CON1.W470","p":2083,"q":"大體積構件（例如厚轉換板、樁帽）的溫度控制方案，須於澆注前多久提交？","e":"最少兩個月前，包括方法說明及溫度、溫差、應力計算（CIRIA C660）。考試若有厚轉換板，方法說明應提及熱裂控制。","x":"Specific Specification at least two months before concreting:","doc":"hkha-spec-library-2022","tier":"常考","ex":"constr","o":["最少一周","最少七天","最少兩周","最少兩個月"],"a":3,"q_en":"How long before concreting must the temperature-control proposal for massive elements (e.g. thick transfer plates, pile caps) be submitted?","o_en":["At least one week","At least seven days","At least two weeks","At least two months"],"e_en":"At least two months before, with a method statement and calculations of temperature, gradients and stresses (CIRIA C660). If an exam design has a thick transfer plate, mention thermal crack control in the method statement.","pp":"CON/50"},{"id":"HKH-005","t":"mcq","d":2,"tp":"養護 Curing","c":"CON1.W1420","p":2088,"q":"養護 Method A（帆布覆蓋）中，帆布接縫最少搭接多少？","e":"帆布最少搭接 600 mm；牆柱周邊不超過 300 mm 闊的窄條可改用 hessian 並保持濕潤。","x":"2. Lap tarpaulin sheets 600 mm (minimum) at joints;","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["600 mm","150 mm","300 mm","1000 mm"],"a":0,"q_en":"In curing Method A (tarpaulin), what minimum lap is required at tarpaulin joints?","e_en":"Minimum 600 mm lap; strips not more than 300 mm wide around walls or columns may use hessian kept wet.","pp":"CON/55"},{"id":"HKH-006","t":"mcq","d":2,"tp":"養護 Curing","c":"CON1.W1490","p":2089,"q":"轉換結構（transfer structure）以 Method A 養護的最短保護期為？","e":"轉換結構 10 天；一般構件 Method A/C/D/E 4 天（含 PFA/GGBS 則 5 天）；水缸等 7–9 天。可扣除模板留置天數。","x":"Transfer structure A 10 10","doc":"hkha-spec-library-2022","tier":"常考","ex":"constr","o":["14 天","10 天","7 天","4 天"],"a":1,"q_en":"What is the minimum period of protection for a transfer structure cured by Method A?","o_en":["14 days","10 days","7 days","4 days"],"e_en":"Transfer structure 10 days; other elements with Methods A/C/D/E 4 days (5 days with PFA/GGBS); liquid-retaining 7–9 days. Days with formwork in place may be deducted.","pp":"CON/56"},{"id":"HKH-007","t":"mcq","d":2,"tp":"養護 Curing","c":"CON1.W1470","p":2089,"q":"最小尺寸超過 500 mm 的樁帽/基腳用 Method F 養護，模板最早何時可拆？","e":"Method F：模板最少留 3 天，之後以膠膜加濕麻包保持濕潤；Method F 最短保護期為 10 天。","x":"1. Formwork is to be stripped at least 3 days after concreting;","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["澆注後最少 3 天","澆注後 16 小時","澆注後 7 天","澆注後 28 天"],"a":0,"q_en":"For caps/footings (least dimension > 500 mm) cured by Method F, when may formwork be stripped at the earliest?","o_en":["At least 3 days after concreting","16 hours after concreting","7 days after concreting","28 days after concreting"],"e_en":"Method F: formwork stays at least 3 days, then polyethylene sheeting plus wet hessian; the Method F minimum protection period is 10 days.","pp":"CON/56"},{"id":"HKH-008","t":"mcq","d":1,"tp":"拆模時間 Formwork striking","c":"CON2.W630","p":2123,"q":"HKHA Specification：懸臂支撐（props to cantilevers，無荷載）最短保留時間為？","e":"斜面模板 12 小時；柱樑牆側模 16 小時；板底模（留撐）3 天；板撐 7 天；樑底模（留撐）7 天；樑撐 16 天；懸臂撐 28 天（15°C、Portland cement）。","x":"Prop to cantilevers (unloaded) 28 days","doc":"hkha-spec-library-2022","tier":"常考","ex":"constr","o":["16 天","7 天","3 天","28 天"],"a":3,"q_en":"HKHA Specification: what is the minimum period before removing props to cantilevers (unloaded)?","o_en":["16 days","7 days","3 days","28 days"],"e_en":"Inclined top formwork 12 h; vertical formwork 16 h; slab soffit (props left) 3 days; slab props 7 days; beam soffit (props left) 7 days; beam props 16 days; cantilever props 28 days (15°C, Portland cement).","pp":"CON/90"},{"id":"HKH-009","t":"mcq","d":2,"tp":"拆模時間 Formwork striking","c":"CON2.W630","p":2123,"q":"樑的支撐（props to beams，無荷載）最短保留時間為？","e":"樑撐 16 天；樑底模（留撐）7 天；不要與側模 16 小時混淆。編排施工程序（programme）時要計入。","x":"Props to beams (unloaded) 16 days","doc":"hkha-spec-library-2022","tier":"常考","ex":"constr","o":["16 小時","28 天","7 天","16 天"],"a":3,"q_en":"What is the minimum period for props to beams (unloaded)?","o_en":["16 hours","28 days","7 days","16 days"],"e_en":"Beam props 16 days; beam soffit with props left 7 days; do not confuse with 16 hours for vertical formwork. Allow for this in the construction programme.","pp":"CON/90"},{"id":"HKH-010","t":"mcq","d":3,"tp":"拆模時間 Formwork striking","c":"CON2.W650","p":2123,"q":"採用大板模時，板底支撐最少要保留多久？","e":"大板模：板底撐 ≥ 5 天且達 28 天強度的三分之二；下一層的撐在上層澆注後 ≥ 2½ 天且達 10 MPa（或 2 倍受力，取大）。","x":"must remain in place for a minimum of five days and until the concrete has achieved two thirds of the required 28 day crushing strength;","doc":"hkha-spec-library-2022","tier":"常考","ex":"constr","o":["最少 7 天","最少 5 天，且混凝土達 28 天強度的三分之二","最少 2½ 天","最少 3 天，且達 10 MPa"],"a":1,"q_en":"With large panel formwork, how long must props to slab soffits remain at minimum?","o_en":["At least 7 days","At least 5 days and until two thirds of the 28-day strength","At least 2½ days","At least 3 days and 10 MPa"],"e_en":"Large panel formwork: slab props ≥ 5 days and two thirds of 28-day strength; props to the floor below ≥ 2½ days after the upper pour and 10 MPa (or 2 times the stress, whichever greater).","pp":"CON/90"},{"id":"HKH-011","t":"mcq","d":1,"tp":"鋼筋施工 Reinforcement workmanship","c":"CON3.W160","p":2134,"q":"HKHA Specification 在圖則未另有指明時，鋼筋最少保護層為？","e":"預設 25 mm；實際設計應按 Concrete Code Table 4.2（耐久性）及 Fire Code（耐火）取較大者並在圖則寫明。","x":"Provide minimum 25mm concrete cover to all reinforcement unless otherwise specified","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["20 mm","30 mm","25 mm","40 mm"],"a":2,"q_en":"Where not otherwise specified on drawings, what minimum concrete cover does the HKHA Specification require?","e_en":"Default 25 mm; in design, take the larger of Concrete Code Table 4.2 (durability) and the Fire Code, and state it on drawings.","pp":"CON/101"},{"id":"HKH-012","t":"tf","d":1,"tp":"鋼筋施工 Reinforcement workmanship","c":"CON3.W130","p":2134,"q":"紥鐵線的線尾可以伸入鋼筋的名義保護層內，只要不外露即可。","e":"錯。紥鐵線（包括線尾）、紥鐵裝置及夾子都不可侵入名義保護層。","x":"Ensure that the tying wire, including the wire ends, tying devices and clips do not encroach into the nominal cover to the reinforcement;","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","a":false,"q_en":"Tying wire ends may encroach into the nominal cover provided they are not exposed.","e_en":"False. Tying wire, including the wire ends, tying devices and clips shall not encroach into the nominal cover.","pp":"CON/101"},{"id":"HKH-013","t":"mcq","d":2,"tp":"澆注計劃 Concreting plan","c":"CON1.W480","p":2083,"q":"每次澆注前，concreting plan 須最少於多久前交 CM？","e":"最少一周前提交，須證明能在法定工作時間內完成，並包括應變措施（如施工縫位置）。","x":"Format (PDF), for each concreting pour to the CM at least one week prior to","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","o":["最少兩個月","最少一個月","最少一周","最少 24 小時"],"a":2,"q_en":"How long before each concreting pour must the concreting plan be submitted to the CM?","o_en":["At least two months","At least one month","At least one week","At least 24 hours"],"e_en":"At least one week before, showing the pour can be completed within permitted working hours, with contingency measures (e.g. construction joints).","pp":"CON/50"},{"id":"HKH-014","t":"tf","d":2,"tp":"施工縫 Construction joints","c":"CON1.W520","p":2083,"q":"水缸等液體容器結構，如沒有預定施工縫，底板及牆身應一次過澆注。","e":"對。除非另獲批准，底板及牆應一次澆注以減少滲漏路徑。","x":"Cast the bottom slab and walls of aqueous liquid retaining structures in one operation where no pre-determined construction joints are specified","doc":"hkha-spec-library-2022","tier":"偶考","ex":"constr","a":true,"q_en":"For aqueous liquid retaining structures without pre-determined construction joints, the bottom slab and walls should be cast in one operation.","e_en":"True. Unless otherwise approved, cast the bottom slab and walls in one operation to avoid leakage paths.","pp":"CON/50"},{"id":"XL-001","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"設計題常見：圖書館書庫（stack room）儲存高度 3.6 m，按 D&I Code Table 3.2 的 qk 應取？","e":"書庫 qk = 每米儲存高度 3.5 kPa，但不少於 10.0 kPa：3.5 × 3.6 = 12.6 kPa > 10.0，取 12.6 kPa。5.0 kPa 是「有藏書的圖書館房間（不含書庫）」，常被誤用。","x":"3.5 for each according to metre of","tier":"必考","ex":"loads","o":["5.0 kPa","10.0 kPa","3.5 kPa","12.6 kPa"],"a":3,"q_en":"A common design-brief item: a library stack room with a storage height of 3.6 m. What qk should be taken per D&I Code Table 3.2?","e_en":"Stack rooms: 3.5 kPa per metre of storage height, not less than 10.0 kPa: 3.5 × 3.6 = 12.6 kPa > 10.0, so 12.6 kPa. 5.0 kPa is for library rooms with book storage (excluding stack rooms), a common misuse.","doc":"dead-imposed-loads-2011-2021ed","pp":"7"},{"id":"XL-002","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"書庫儲存高度只有 2.4 m，qk 應取？","e":"3.5 × 2.4 = 8.4 kPa，但規定不少於 10.0 kPa，所以取 10.0 kPa。考試要寫出比較過程。","x":"but not less material, but than 10.0","tier":"必考","ex":"loads","o":["10.0 kPa","12.6 kPa","5.0 kPa","8.4 kPa"],"a":0,"q_en":"A stack room has a storage height of only 2.4 m. What qk should be taken?","e_en":"3.5 × 2.4 = 8.4 kPa, but the minimum is 10.0 kPa, so take 10.0 kPa. Show the comparison in the exam.","doc":"dead-imposed-loads-2011-2021ed","pp":"7"},{"id":"XL-003","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"冷庫（cold storage）儲存高度 2.5 m，qk 應取？","e":"冷庫 5.0 kPa/m，不少於 15.0 kPa：5.0 × 2.5 = 12.5 < 15.0，取 15.0 kPa。","x":"but not less material, but than 15.0","tier":"常考","ex":"loads","o":["7.5 kPa","12.5 kPa","15.0 kPa","10.0 kPa"],"a":2,"q_en":"A cold store has a storage height of 2.5 m. What qk should be taken?","e_en":"Cold storage: 5.0 kPa per metre, not less than 15.0 kPa: 5.0 × 2.5 = 12.5 < 15.0, so 15.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"7"},{"id":"XL-004","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"餐廳、酒吧、食堂（非住宅）的 qk 為？","e":"Class 3A 餐廳類 4.0 kPa（Qk 4.5 kN）。設計題的商場/會所常有餐廳。","x":"bars, canteens, fast food shops and 4.0 4.5","tier":"必考","ex":"loads","o":["2.5 kPa","3.0 kPa","5.0 kPa","4.0 kPa"],"a":3,"q_en":"What is qk for restaurants, bars and canteens not in domestic premises?","e_en":"Class 3A restaurants 4.0 kPa (Qk 4.5 kN). Exam malls and clubhouses often include restaurants.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-005","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"課室、演講室、電腦室的 qk 為？","e":"3.0 kPa；幼稚園/托兒所則為 2.5 kPa。學校題目常見。","x":"Classrooms, lecture rooms, tutorial 3.0 4.5","tier":"必考","ex":"loads","o":["4.0 kPa","2.5 kPa","5.0 kPa","3.0 kPa"],"a":3,"q_en":"What is qk for classrooms, lecture rooms and computer rooms?","e_en":"3.0 kPa; childcare centres and kindergartens are 2.5 kPa. Common in school-type briefs.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-006","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"音樂廳、劇院、戲院（固定座位）的 qk 為？","e":"5.0 kPa；舞台（stages）則為 7.5 kPa。大跨度題（演藝廳/體育館）常考。","x":"Public halls, theatres, cinemas 5.0 4.5","tier":"必考","ex":"loads","o":["5.0 kPa","4.0 kPa","7.5 kPa","3.0 kPa"],"a":0,"q_en":"What is qk for concert halls, theatres and cinemas (fixed seating)?","e_en":"5.0 kPa; stages are 7.5 kPa. Frequently needed in long-span (auditorium/sports hall) briefs.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-007","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"體育館、舞廳、球場的 qk 為？","e":"Class 3D：舞廳、卡拉 OK、體育館 5.0 kPa；球場、溜冰場 5.0 kPa；桌球室及舞蹈練習室 3.0 kPa。","x":"establishments, discotheques, 5.0 4.5 gymnasia","tier":"必考","ex":"loads","o":["7.5 kPa","4.0 kPa","3.0 kPa","5.0 kPa"],"a":3,"q_en":"What is qk for gymnasia, dance halls and ball courts?","e_en":"Class 3D: dance halls, karaoke, gymnasia 5.0 kPa; ball courts and ice rinks 5.0 kPa; billiard rooms and dance practice rooms 3.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"7"},{"id":"XL-008","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"美術館、博物館的 qk 為？","e":"Class 3C 美術館及博物館 5.0 kPa；平台、花園（可步行草地）同為 5.0 kPa。","x":"Art galleries and museums 5.0 4.5","tier":"必考","ex":"loads","o":["7.5 kPa","3.0 kPa","4.0 kPa","5.0 kPa"],"a":3,"q_en":"What is qk for art galleries and museums?","e_en":"Class 3C art galleries and museums 5.0 kPa; plazas and open garden areas (walkable turf) are also 5.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-009","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"平台花園（open areas in gardens，可供步行的草地）的 qk 為？（泥土及植物另作恆載）","e":"5.0 kPa。設計題常有綠化平台/空中花園：泥土、排水層及植物按 D&I Code 列作恆載，再加 5.0 kPa 外加荷載。","x":"Open areas in gardens (including short grass turf suitable for foot 5.0 4.5","tier":"必考","ex":"loads","o":["5.0 kPa","2.0 kPa","3.0 kPa","1.5 kPa"],"a":0,"q_en":"What is qk for open areas in gardens (short grass turf suitable for foot traffic)? (Soil and plants are dead load.)","e_en":"5.0 kPa. Exam briefs often have landscaped podiums/sky gardens: soil, drainage layers and plants are dead load, plus 5.0 kPa imposed load.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-010","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"醫院化驗室（laboratories）的 qk 及 Qk 為？","e":"化驗室 3.0/4.5；診症室、手術室、X 光室 2.5/3.0；醫院病房 2.0/2.0。","x":"work places Laboratories 3.0 4.5","tier":"常考","ex":"loads","o":["4.0 kPa；4.5 kN","3.0 kPa；4.5 kN","2.5 kPa；3.0 kN","5.0 kPa；4.5 kN"],"a":1,"q_en":"What are qk and Qk for laboratories?","o_en":["4.0 kPa; 4.5 kN","3.0 kPa; 4.5 kN","2.5 kPa; 3.0 kN","5.0 kPa; 4.5 kN"],"e_en":"Laboratories 3.0/4.5; consulting rooms, operating theatres and X-ray rooms 2.5/3.0; hospital wards 2.0/2.0.","doc":"dead-imposed-loads-2011-2021ed","pp":"5"},{"id":"XL-011","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"銀行大堂（banking halls）的 qk 為？","e":"銀行大堂 4.0 kPa；一般辦公室 3.0 kPa；儲存及檔案辦公室 5.0 kPa。","x":"Banking halls 4.0 4.5","tier":"常考","ex":"loads","o":["3.0 kPa","2.5 kPa","4.0 kPa","5.0 kPa"],"a":2,"q_en":"What is qk for banking halls?","e_en":"Banking halls 4.0 kPa; offices for general use 3.0 kPa; offices for storage and filing 5.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"5"},{"id":"XL-012","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"百貨公司、超級市場、商店的 qk 為？","e":"Class 4 商店 5.0 kPa。商場/平台商舖是多層建築題的常見用途。","x":"shopping markets, shops for display and sale 5.0 4.5","tier":"必考","ex":"loads","o":["7.5 kPa","5.0 kPa","3.0 kPa","4.0 kPa"],"a":1,"q_en":"What is qk for department stores, supermarkets and shops?","e_en":"Class 4 shopping 5.0 kPa. Retail podiums are common in multi-storey briefs.","doc":"dead-imposed-loads-2011-2021ed","pp":"7"},{"id":"XL-013","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"托兒所及幼稚園的 qk 為？","e":"2.5 kPa（Qk 3.0 kN）；中小學課室為 3.0 kPa。","x":"Childcare centers and people may 2.5 3.0","tier":"常考","ex":"loads","o":["3.0 kPa","4.0 kPa","2.0 kPa","2.5 kPa"],"a":3,"q_en":"What is qk for childcare centres and kindergartens?","e_en":"2.5 kPa (Qk 3.0 kN); classrooms are 3.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"6"},{"id":"XL-014","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.1 Table 2.1","p":25,"q":"板 gk = 6.0 kPa、qk = 5.0 kPa，按 Concrete Code Table 2.1 組合 1，ULS 設計荷載為？","e":"1.4 × 6.0 + 1.6 × 5.0 = 8.4 + 8.0 = 16.4 kPa。15.4 誤把兩者都乘 1.4；13.2 用了組合 3 的 1.2；11.0 未乘系數。","x":"(and earth and water 1.4 1.0 1.6 0 1.4","doc":"concrete-2013-2020ed","tier":"必考","ex":"loads","o":["13.2 kPa","11.0 kPa","16.4 kPa","15.4 kPa"],"a":2,"q_en":"A slab has gk = 6.0 kPa and qk = 5.0 kPa. Under Concrete Code Table 2.1 combination 1, what is the ULS design load?","e_en":"1.4 × 6.0 + 1.6 × 5.0 = 8.4 + 8.0 = 16.4 kPa. 15.4 wrongly uses 1.4 on both; 13.2 uses the combination 3 factor 1.2; 11.0 is unfactored.","pp":"11"},{"id":"XL-015","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.1 Table 2.1","p":25,"q":"檢查高樓在風力下的上拔/傾覆（Concrete Code Table 2.1 組合 2），有利的恆載 γf 取？","e":"組合 2：恆載不利 1.4、有利 1.0，風 1.4。大高寬比建築的樁受拉檢查必用。","x":"earth and water 1.4 1.0 - - 1.4 1.4","doc":"concrete-2013-2020ed","tier":"必考","ex":"loads","o":["1.0","1.2","1.4","0.9"],"a":0,"q_en":"Checking uplift/overturning of a tall building under wind (Concrete Code Table 2.1 combination 2), what γf applies to beneficial dead load?","e_en":"Combination 2: dead load adverse 1.4, beneficial 1.0; wind 1.4. Essential for pile tension checks of slender buildings.","pp":"11"},{"id":"XL-016","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.1 Table 2.1","p":25,"q":"Concrete Code Table 2.1 組合 3（恆載 + 外加 + 風），不利恆載、外加荷載及風的 γf 分別為？","e":"組合 3 全部 1.2（有利恆載 1.0、有利外加 0）。","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","doc":"concrete-2013-2020ed","tier":"必考","ex":"loads","o":["1.2、1.6、1.4","1.4、1.2、1.2","1.4、1.6、1.4","1.2、1.2、1.2"],"a":3,"q_en":"Concrete Code Table 2.1 combination 3 (dead + imposed + wind): γf for adverse dead, imposed and wind?","o_en":["1.2, 1.6, 1.4","1.4, 1.2, 1.2","1.4, 1.6, 1.4","1.2, 1.2, 1.2"],"e_en":"Combination 3 uses 1.2 throughout (beneficial dead 1.0, beneficial imposed 0).","pp":"11"},{"id":"XW-001","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"3.2 Table 3-1","p":27,"q":"Wind Code Table 3-1：有效高度 50 m 的 Qo,z 為？","e":"30 m 2.36、50 m 2.56、75 m 2.73、100 m 2.86 kPa。2023–2025 年試題指明 Ze = Z，可直接查表。","x":"30 2.36 50 2.56 75 2.73","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["2.73 kPa","2.36 kPa","2.21 kPa","2.56 kPa"],"a":3,"q_en":"Wind Code Table 3-1: Qo,z at an effective height of 50 m?","e_en":"30 m 2.36, 50 m 2.56, 75 m 2.73, 100 m 2.86 kPa. The 2023–2025 papers state Ze = Z, so read the table directly.","pp":"17"},{"id":"XW-002","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"3.2 Table 3-1","p":27,"q":"Table 3-1：有效高度 150 m 的 Qo,z 為？","e":"表列數值：100 m 2.86、150 m 3.05、200 m 3.20、250 m 3.31 kPa；中間高度用 Equation 3-2 或內插。","x":"100 2.86 150 3.05 200 3.20","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["3.05 kPa","3.20 kPa","3.31 kPa","2.86 kPa"],"a":0,"q_en":"Table 3-1: Qo,z at an effective height of 150 m?","e_en":"Tabulated values: 100 m 2.86, 150 m 3.05, 200 m 3.20, 250 m 3.31 kPa; use Equation 3-2 or interpolation between heights.","pp":"17"},{"id":"XW-003","t":"mcq","d":2,"tp":"參考風壓 Reference pressure","c":"3.2","p":27,"q":"有效高度介乎表列數值之間（2.5–500 m）時，Qo,z 應如何求得？","e":"2.5–500 m 之間可用 Equation 3-2 計算；超過 500 m 要尋求專家意見。","x":"For any effective height between 2.5m and 500m, the pressure can be calculated as:","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["必須做風洞試驗","取較低高度的數值","一律取 500 m 的 3.70 kPa","用 Equation 3-2：Qo,z = 3.7(Ze/500)^0.16"],"a":3,"q_en":"For effective heights between the tabulated values (2.5 m to 500 m), how is Qo,z obtained?","o_en":["Wind tunnel testing is required","Take the lower-height value","Always use 3.70 kPa at 500 m","Use Equation 3-2: Qo,z = 3.7(Ze/500)^0.16"],"e_en":"Between 2.5 m and 500 m use Equation 3-2; above 500 m seek specialist advice.","pp":"17"},{"id":"XW-004","t":"mcq","d":2,"tp":"參考風壓 Reference pressure","c":"3.1","p":27,"q":"Wind Code Equation 3-1 的設計風壓 Qz 等於？","e":"Qz = Qo,z St Sθ（St 地形系數，Sθ 方向系數）；Cf、Sq,z 及 B 在 Equation 2-1 求沿風向荷載時才乘；1.4 是 ULS 荷載系數。","x":"the wind directionality factor in Appendix A1.","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["Qo,z × 1.4","Qo,z × Cf × Sq","Qo,z × Sr","Qo,z × St × Sθ"],"a":3,"q_en":"In Wind Code Equation 3-1, the design wind pressure Qz equals?","e_en":"Qz = Qo,z St Sθ (St topography factor, Sθ directionality factor); Cf, Sq,z and B enter Equation 2-1 for along-wind load; 1.4 is the ULS load factor.","pp":"17"},{"id":"XW-005","t":"mcq","d":3,"tp":"沿風向荷載 Along-wind load","c":"2.2.1","p":18,"q":"試題式計算：建築物頂 Qz = 2.56 kPa（Ze = Z、St = Sθ = 1.0），Cf = 1.3，Sq,z = 1.0，迎風闊度 B = 30 m。按 Equation 2-1 及題目指定的 overload factor 1.4，頂部 ULS 每米高風荷載約為？","e":"Wz = Qz Cf Sq,z B = 2.56 × 1.3 × 1.0 × 30 = 99.8 kN/m（特徵值）；× 1.4 = 139.8 kN/m。159.7 誤用 1.6；4.66 忘了乘 B。","x":"force coefficient determined in accordance with clause 4.2","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["4.66 kN/m","139.8 kN/m","159.7 kN/m","99.8 kN/m"],"a":1,"q_en":"Exam-style calculation: at roof level Qz = 2.56 kPa (Ze = Z, St = Sθ = 1.0), Cf = 1.3, Sq,z = 1.0, breadth B = 30 m. Using Equation 2-1 and the brief's overload factor 1.4, what is the ULS wind load per metre height at the top?","e_en":"Wz = Qz Cf Sq,z B = 2.56 × 1.3 × 1.0 × 30 = 99.8 kN/m (characteristic); × 1.4 = 139.8 kN/m. 159.7 wrongly uses 1.6; 4.66 forgets B.","pp":"8"},{"id":"XW-006","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"矩形建築 B/D = 3.5，計算扭轉風荷載的偏心 e 為？","e":"B/D ≤ 1：0.05B；B/D = 6：0.20B；中間線性內插：0.05 + (3.5 − 1)/(6 − 1) × 0.15 = 0.125B。0.0875B 是錯誤地由 0 開始內插。","x":"Use linear interpolation for intermediate values of","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["±0.20B","±0.0875B","±0.05B","±0.125B"],"a":3,"q_en":"A rectangular building has B/D = 3.5. What eccentricity e applies for torsional wind load?","e_en":"B/D ≤ 1: 0.05B; B/D = 6: 0.20B; interpolate linearly: 0.05 + (3.5 − 1)/(6 − 1) × 0.15 = 0.125B. 0.0875B wrongly interpolates from 0.","pp":"8"},{"id":"XW-007","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"2.2.4 Table 2-1","p":22,"q":"Wind Code Table 2-1 Case 3 的組合系數（Wx1、Wx2、ΔTz）為？","e":"Case 1 以 X1 為主、Case 2 以 X2 為主、Case 3 以扭轉為主；其餘分量乘 0.55，三者同時作用。","x":"3 ±0.55 ±0.55 ±1.00","doc":"wind-code-2019","tier":"必考","ex":"wind","o":["±0.55、±0.55、±1.00","±1.00、±0.55、±0.55","±0.55、±1.00、±0.55","±1.00、±1.00、±1.00"],"a":0,"q_en":"What are the Wind Code Table 2-1 Case 3 combination factors (Wx1, Wx2, ΔTz)?","o_en":["±0.55, ±0.55, ±1.00","±1.00, ±0.55, ±0.55","±0.55, ±1.00, ±0.55","±1.00, ±1.00, ±1.00"],"e_en":"Case 1 is X1-dominant, Case 2 X2-dominant, Case 3 torsion-dominant; the other components take 0.55, all applied simultaneously.","pp":"12"},{"id":"XW-008","t":"mcq","d":2,"tp":"方向系數 Directionality","c":"A1.1 Table A1-1","p":50,"q":"Table A1-1 中哪些風向的 Sθ 最大（0.85）？","e":"E、SE、S 為 0.85；NE、SW 0.84；N、W 0.82；NW 0.80。標準方法要取 90° 研究扇區內的最大值；圓形建築 Sθ = 1。","x":"E 0.85 SE 0.85 S 0.85","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["W、SW","所有方向相同","N、NE、NW","E、SE、S"],"a":3,"q_en":"Which wind directions have the highest Sθ (0.85) in Table A1-1?","o_en":["W, SW","All directions equal","N, NE, NW","E, SE, S"],"e_en":"E, SE, S are 0.85; NE, SW 0.84; N, W 0.82; NW 0.80. The Standard Method takes the maximum within the 90° sector studied; circular buildings use Sθ = 1.","pp":"A1"},{"id":"XW-009","t":"mcq","d":2,"tp":"方向系數 Directionality","c":"A1.1","p":50,"q":"使用標準方法時，Sθ 應如何選取？","e":"取 90° 扇區內最大值；如不確定或為求保守，試題常指示取 Sθ = 1.0。","x":"studied sector should be adopted when using the Standard Method.","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["取所研究 90° 扇區內的最大 Sθ","取八個方向的平均值","取最小值 NW 0.80","一律取 1.0"],"a":0,"q_en":"When using the Standard Method, how should Sθ be selected?","o_en":["The maximum Sθ within the 90° sector studied","The average of the eight directions","The minimum, NW 0.80","Always 1.0"],"e_en":"Take the maximum within the 90° sector; briefs often instruct Sθ = 1.0 for conservatism.","pp":"A1"},{"id":"XW-010","t":"mcq","d":3,"tp":"地形 Topography","c":"A3","p":54,"q":"按 Appendix A3，何時要考慮地形放大系數 St？","e":"地形顯著：ψu > 0.05 且位於顯著區（Zt/Ht ≥ 0.5，或下風坡 Xt < 1.5Ht/ψe）。0.3 是 ψe 的上限，不是門檻。斜坡地盤題要記得檢查。","x":"For the purpose of this Code, local topography is considered significant when","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["當 ψu > 0.3","當 ψu > 0.05 且地盤位於地形顯著區內","只要地盤在山上","當建築高於 100 m"],"a":1,"q_en":"Per Appendix A3, when must the topographic multiplier St be considered?","o_en":["When ψu > 0.3","When ψu > 0.05 and the site lies in the topography significant zone","Whenever the site is on a hill","When the building exceeds 100 m"],"e_en":"Topography is significant when ψu > 0.05 and the site is in the significant zone (Zt/Ht ≥ 0.5, or downwind Xt < 1.5Ht/ψe). 0.3 caps ψe; it is not the threshold. Check this for sloping-site briefs.","pp":"A5"},{"id":"XW-011","t":"mcq","d":2,"tp":"力系數 Force coefficient","c":"4.2.1","p":30,"q":"矩形建築力系數 Cf 的 Equation 4-1 適用範圍為？","e":"Equation 4-1 適用於 He/D ≤ 12；B/D = 6 是扭轉偏心的上限，H/B < 5 是免做橫風檢查的條件之一。","x":"Equation 4-1 can be used for","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["He/B ≤ 5","B/D ≤ 6","H ≤ 100 m","He/D ≤ 12"],"a":3,"q_en":"What is the applicability limit of Equation 4-1 for Cf of rectangular buildings?","e_en":"Equation 4-1 applies for He/D ≤ 12; B/D = 6 is the torsion-eccentricity limit, and H/B < 5 is one condition for skipping the across-wind check.","pp":"20"},{"id":"XW-012","t":"mcq","d":2,"tp":"側移限值 Drift limits","c":"5.3.4","p":68,"q":"Steel Code 5.3.4 對高樓頂層側移及層間側移的限值為？","e":"頂層 H/500、層間 h/400；Concrete Code 7.3.2 亦為 H/500（H 由最高樓層計，不含機房）。方案評估要寫出側移檢查。","x":"(Topmost storey deflection limited to Height / 500 and inter storey drift","doc":"steel-2011-2023ed","tier":"必考","ex":"wind","o":["H/300；層高/300","H/1000；層高/500","H/500；層高/400","H/500；層高/250"],"a":2,"q_en":"What limits does Steel Code 5.3.4 set on top-storey deflection and inter-storey drift of tall buildings?","o_en":["H/300; storey height/300","H/1000; storey height/500","H/500; storey height/400","H/500; storey height/250"],"e_en":"Top storey H/500 and inter-storey h/400; Concrete Code 7.3.2 also gives H/500 (H measured to the highest floor excluding plant rooms). Show a drift check in scheme appraisals.","pp":"49"},{"id":"XR-001","t":"mcq","d":2,"tp":"側移限值 Drift limits","c":"7.3.2","p":120,"q":"Concrete Code 的 H/500 限值中，H 應如何量度？","e":"H 由最高樓層計，不包括機房/屋頂構築物，在靜態特徵風荷載下檢查。","x":"be measured from the highest floor level excluding plant rooms/roof features and alike","doc":"concrete-2013-2020ed","tier":"必考","ex":"wind","o":["量至屋頂構築物頂","量至地庫底","量至最高樓層，不計機房、屋頂構築物等","由樁帽頂量至天台"],"a":2,"q_en":"In the Concrete Code H/500 limit, how is H measured?","o_en":["To the top of roof features","To the bottom of the basement","To the highest floor level, excluding plant rooms, roof features and the like","From pile cap to roof"],"e_en":"H is measured to the highest floor level, excluding plant rooms/roof features, under static characteristic wind load.","pp":"106"},{"id":"XR-002","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.4.2 Table 7.3","p":121,"q":"8 m 跨連續矩形樑，按 Table 7.3 基本跨深比，初步所需有效深度 d 約為？（未計修正系數）","e":"連續矩形樑 26：8000/26 ≈ 308 mm。400 mm 用了簡支 20；348 mm 用了端跨 23；1143 mm 用了懸臂 7。方案計算常用。","x":"Continuous 26 21 26","doc":"concrete-2013-2020ed","tier":"必考","ex":"rc","o":["1143 mm","400 mm","348 mm","308 mm"],"a":3,"q_en":"An 8 m span continuous rectangular beam: using the Table 7.3 basic span/depth ratio, what is the preliminary effective depth d (before modification factors)?","e_en":"Continuous rectangular beam 26: 8000/26 ≈ 308 mm. 400 mm uses simply-supported 20; 348 mm uses end span 23; 1143 mm uses cantilever 7. Common in scheme calculations.","pp":"107"},{"id":"XR-003","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.4.2 Table 7.3","p":121,"q":"Table 7.3：簡支 flanged beam（bw/b ≤ 0.3）的基本跨深比為？","e":"矩形/翼緣：懸臂 7/5.5；簡支 20/16；連續 26/21；端跨 23/18.5。","x":"Simply-supported 20 16 20","doc":"concrete-2013-2020ed","tier":"必考","ex":"rc","o":["20","21","5.5","16"],"a":3,"q_en":"Table 7.3: basic span/effective depth ratio for a simply-supported flanged beam (bw/b ≤ 0.3)?","e_en":"Rectangular/flanged: cantilever 7/5.5; simply-supported 20/16; continuous 26/21; end span 23/18.5.","pp":"107"},{"id":"XR-004","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"模板預拱（upward deflection incorporated in the formwork）一般不應超過？","e":"模板預拱 ≤ span/250；建造後可能損壞相鄰部分的撓度一般限 span/500。","x":"any upward deflection incorporated in the formwork should not generally exceed span/250.","doc":"concrete-2013-2020ed","tier":"常考","ex":"rc","o":["span/360","span/180","span/500","span/250"],"a":3,"q_en":"Upward deflection (pre-camber) incorporated in the formwork should not generally exceed?","e_en":"Formwork pre-camber ≤ span/250; deflection after construction that may damage adjacent parts is normally limited to span/500.","pp":"106"},{"id":"XR-005","t":"mcq","d":2,"tp":"振動 Vibration","c":"7.3.3","p":121,"q":"行人天橋（footbridge）上部結構自然頻率低於多少時宜做動力分析？","e":"天橋 < 5 Hz；樓板 < 6 Hz。每年的橋樑題及連接天橋題都適用。","x":"or a footbridge superstructure with the natural frequency less than 5 Hz","doc":"concrete-2013-2020ed","tier":"常考","ex":"rc","o":["5 Hz","3 Hz","10 Hz","6 Hz"],"a":0,"q_en":"Below what natural frequency is a dynamic analysis desirable for a footbridge superstructure?","e_en":"Footbridge < 5 Hz; floors < 6 Hz. Relevant to the yearly bridge question and link-bridge briefs.","pp":"107"},{"id":"XF-001","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"鑽孔紀錄：中度風化 Grade III 花崗岩，TCR 88%，UCS 30 MPa。按 Foundations Code Table 2.1 屬哪一類及容許承載力？","e":"1(c)：Grade III 或更好、TCR ≥ 85%、UCS ≥ 25 MPa → 5 000 kPa。1(b) 要 Grade II、TCR ≥ 95%、UCS ≥ 50 MPa。試題最常給「Grade III、TCR > 85%」。","x":"1(c) Slightly to moderately decomposed moderately 5 000","doc":"foundations-2017-2024ed","tier":"必考","ex":"fdn","o":["1(b)，7 500 kPa","1(a)，10 000 kPa","1(c)，5 000 kPa","1(d)，3 000 kPa"],"a":2,"q_en":"Borehole: moderately decomposed Grade III granite, TCR 88%, UCS 30 MPa. Per Foundations Code Table 2.1, which category and allowable bearing pressure?","o_en":["1(b), 7 500 kPa","1(a), 10 000 kPa","1(c), 5 000 kPa","1(d), 3 000 kPa"],"e_en":"1(c): Grade III or better, TCR ≥ 85%, UCS ≥ 25 MPa → 5 000 kPa. 1(b) needs Grade II, TCR ≥ 95%, UCS ≥ 50 MPa. Papers most often give \"Grade III, TCR > 85%\".","pp":"11"},{"id":"XF-002","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"直徑 2.5 m 大直徑鑽孔樁（無擴底）坐落於 1(a) 岩石，只計端承，容許承載力約為？","e":"A = π × 2.5²/4 = 4.91 m²；× 10 000 kPa ≈ 49 100 kN。36 800 用了 1(b) 7 500；24 500 用了 1(c)；196 300 把直徑當半徑。","x":"1(a) Fresh to slightly decomposed strong to very strong 10 000","doc":"foundations-2017-2024ed","tier":"必考","ex":"fdn","o":["49 100 kN","36 800 kN","24 500 kN","196 300 kN"],"a":0,"q_en":"A 2.5 m diameter bored pile (no bell-out) founded on Category 1(a) rock, end bearing only: allowable capacity is about?","e_en":"A = π × 2.5²/4 = 4.91 m²; × 10 000 kPa ≈ 49 100 kN. 36 800 uses 1(b) 7 500; 24 500 uses 1(c); 196 300 treats the diameter as radius.","pp":"11"},{"id":"XF-003","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":20,"q":"2 m × 2 m 基腳坐落於浸水的密實砂（SPT N = 40），按 Table 2.1 容許承載力約為？","e":"4(b) 密實砂：乾 300、浸水 150 kPa；150 × 4 = 600 kN。1 200 kN 誤用乾值；高地下水位地盤要用浸水值。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","doc":"foundations-2017-2024ed","tier":"必考","ex":"fdn","o":["600 kN","2 000 kN","1 200 kN","400 kN"],"a":0,"q_en":"A 2 m × 2 m footing on submerged dense sand (SPT N = 40): allowable load per Table 2.1 is about?","e_en":"4(b) dense sand: dry 300, submerged 150 kPa; 150 × 4 = 600 kN. 1 200 kN wrongly uses the dry value; use submerged values on high-groundwater sites.","pp":"12"},{"id":"XF-004","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":20,"q":"Table 2.1：Firm 黏土（不排水剪力強度 40–75 kPa）的推定容許承載力為？","e":"5(a) 很硬 300、5(b) 硬 150、5(c) Firm 80 kPa。","x":"5(c) Firm – Undrained shear strength 40-75 kPa; can be 80","doc":"foundations-2017-2024ed","tier":"常考","ex":"fdn","o":["50 kPa","300 kPa","80 kPa","150 kPa"],"a":2,"q_en":"Table 2.1: presumed allowable bearing pressure of firm clay (undrained shear strength 40–75 kPa)?","e_en":"5(a) very stiff 300, 5(b) stiff 150, 5(c) firm 80 kPa.","pp":"12"},{"id":"XF-005","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note 3","p":20,"q":"Table 2.1 Note 3：1(c)、1(d) 及第 2 類岩石的最小嵌岩深度（沿樁周）為？","e":"嵌岩深度：1(a)/1(b) 最少 500 mm；1(c)/1(d)/2 最少 300 mm。","x":"and 1(b), and 300 mm for categories 1(c), 1(d) and 2.","doc":"foundations-2017-2024ed","tier":"必考","ex":"fdn","o":["1 000 mm","600 mm","500 mm","300 mm"],"a":3,"q_en":"Table 2.1 Note 3: minimum socket depth along the pile perimeter for categories 1(c), 1(d) and 2?","e_en":"Socket depth: 1(a)/1(b) at least 500 mm; 1(c)/1(d)/2 at least 300 mm.","pp":"12"},{"id":"XF-006","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note 6","p":20,"q":"Table 2.1 Note 6：樁底以下多少深度內不可有記錄為「non-intact」的岩芯？","e":"600 mm；另外 TCR 須證明至最少 5 m（可分 1 m 段逐段計算）。","x":"of the designated category and no rock core within 600 mm depth from the","doc":"foundations-2017-2024ed","tier":"必考","ex":"fdn","o":["1 m","5 m","300 mm","600 mm"],"a":3,"q_en":"Table 2.1 Note 6: within what depth below the pile base must no rock core be logged as \"non-intact\"?","e_en":"600 mm; separately, TCR must be proved to at least 5 m (may be assessed in consecutive 1 m segments).","pp":"12"},{"id":"XF-007","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note 5","p":20,"q":"Note 5 容許把嵌岩深度以下的 5 m 岩芯分段檢查 TCR，每段長度為？","e":"分為連續的 1 m 段，每段 TCR 均須達到指定等級的要求。","x":"segments (in consecutive manner) such that (a) each segment is 1 m; and (b)","doc":"foundations-2017-2024ed","tier":"常考","ex":"fdn","o":["2.5 m","1 m","1.5 m","0.5 m"],"a":1,"q_en":"Note 5 allows the 5 m of rock below the minimum socket to be checked for TCR in segments of what length?","e_en":"Consecutive 1 m segments, each satisfying the required TCR of the designated grade.","pp":"12"},{"id":"XF-008","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Table 2.1 第 2 類（變質沉積岩，Grade III 或更好、TCR ≥ 85%）的推定容許承載力為？","e":"變質沉積岩即使 TCR ≥ 85% 亦只得 3 000 kPa（同 1(d)），不可套用花崗岩 1(c) 的 5 000 kPa。","x":"2 moderately weak meta-sedimentary rock of 3 000","doc":"foundations-2017-2024ed","tier":"常考","ex":"fdn","o":["1 000 kPa","7 500 kPa","5 000 kPa","3 000 kPa"],"a":3,"q_en":"Table 2.1 Category 2 (meta-sedimentary rock, Grade III or better, TCR ≥ 85%): presumed allowable bearing pressure?","e_en":"Meta-sedimentary rock gets only 3 000 kPa even with TCR ≥ 85% (same as 1(d)); do not use the 5 000 kPa of granite 1(c).","pp":"11"},{"id":"XF-009","t":"mcq","d":3,"tp":"上浮 Uplift","c":"2.5.4(3)","p":36,"q":"地庫底板在最高可能地下水位（地面）下 8 m，只有地下水上浮力。按 Foundations Code，每平方米所需的最少抗浮力為？（γw = 9.81 kN/m³）","e":"水壓 8 × 9.81 = 78.5 kPa；抗浮須 ≥ 1.1 × 地下水上浮力（+ 1.5 × 其他上浮力）= 86.3 kPa。抗力只可計最少恆載（可移除的飾面及回填不計）加錨固力。","x":"the sum of 1.1 times the uplift force due to groundwater and 1.5 times","doc":"foundations-2017-2024ed","tier":"必考","ex":"ground","o":["117.7 kPa","157.0 kPa","86.3 kPa","78.5 kPa"],"a":2,"q_en":"A basement slab is 8 m below the highest possible groundwater table (at ground level), with groundwater uplift only. Per the Foundations Code, what minimum uplift resistance is required per m²? (γw = 9.81 kN/m³)","e_en":"Water pressure 8 × 9.81 = 78.5 kPa; resistance ≥ 1.1 × groundwater uplift (+ 1.5 × other uplift) = 86.3 kPa. Resistance counts only minimum dead load (ignoring removable finishes and backfill) plus anchorage.","pp":"28"},{"id":"XF-010","t":"mcq","d":3,"tp":"上浮 Uplift","c":"5.3.3","p":66,"q":"樁或樁群抗拔的極限錨固力 Ru 受甚麼上限控制？","e":"須檢查錐體拔出：Ru − Wp' ≤ W1' + W2'。高地下水位的地庫抗浮樁常受此控制。","x":"Ru - Wp' ≤ W1' + W2':","doc":"foundations-2017-2024ed","tier":"常考","ex":"ground","o":["沒有上限","Ru ≤ 2 × 樁自重","Ru ≤ 樁身抗壓力","Ru − Wp' ≤ 岩/土錐體有效重量 + 其上土柱有效重量"],"a":3,"q_en":"What upper limit governs the ultimate anchorage resistance Ru of a pile or pile group in uplift?","o_en":["No limit","Ru ≤ 2 × pile self-weight","Ru ≤ pile compressive capacity","Ru − Wp' ≤ effective weight of the rock/soil cone + soil column above"],"e_en":"Check cone pull-out: Ru − Wp' ≤ W1' + W2'. Often governs tension piles for basements under high groundwater.","pp":"58"},{"id":"XFR-001","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"C4.1 Table C1","p":87,"q":"Table C1：學校（5b educational establishments）防火分區面積超過 2,500 m² 但不超過 10,500 m²，FRR 為？","e":"≤ 2,500 m²：60 min；2,500–10,500 m²：120 min。學校、社區中心題常見。","x":"5b.Educational Not exceeding 2,500m2 60 establishments Exceeding 2,500m2 but not 120","tier":"必考","ex":"fire","o":["240 min","90 min","60 min","120 min"],"a":3,"q_en":"Table C1: FRR for educational establishments (5b) with compartment area exceeding 2,500 m² but not exceeding 10,500 m²?","e_en":"≤ 2,500 m²: 60 min; 2,500–10,500 m²: 120 min. Common for school and community-centre briefs.","doc":"fire-safety-2011-2024ed","pp":"78"},{"id":"XFR-002","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"C4.1 Table C1","p":87,"q":"Table C1：交通設施（5c transport facilities，例如公共運輸交匯處）的 FRR 為？","e":"5c 交通設施 120 min（分區 ≤ 10,500 m²）。多層建築題常有 PTI 或巴士總站。","x":"5c. Transport facilities Not exceeding 10,500m2 120","tier":"必考","ex":"fire","o":["60 min","120 min","240 min","90 min"],"a":1,"q_en":"Table C1: FRR for transport facilities (5c, e.g. public transport interchanges)?","e_en":"5c transport facilities 120 min (compartment ≤ 10,500 m²). Multi-storey briefs often include a PTI or bus terminus.","doc":"fire-safety-2011-2024ed","pp":"78"},{"id":"XFR-003","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"C4.1 Table C1","p":87,"q":"Table C1：酒店（hotel and similar transient accommodation）的 FRR 為？","e":"住宅及酒店均為 60 min，分區面積不限；地庫則另按 C14 取 240 min。","x":"2. Hotel and similar Not limited 60","tier":"必考","ex":"fire","o":["60 min","120 min","90 min","30 min"],"a":0,"q_en":"Table C1: FRR for hotels and similar transient accommodation?","e_en":"Residential and hotel are both 60 min with unlimited compartment area; basements follow C14 at 240 min.","doc":"fire-safety-2011-2024ed","pp":"78"},{"id":"XFR-004","t":"mcq","d":2,"tp":"地庫 Basement","c":"C14.1(c)","p":103,"q":"地庫內分隔防火分區的防火牆（fire compartment walls within basements）FRR 為？","e":"地面層與地庫之間的防火屏障 -/240/240；地庫所有構件 240/240/240；地庫內分區牆 -/120/120。","x":"(c) fire barriers forming fire compartment walls within basements should have an FRR","tier":"必考","ex":"fire","o":["-/120/120","-/240/240","-/60/60","240/240/240"],"a":0,"q_en":"What FRR is required for fire barriers forming compartment walls within basements?","e_en":"Barrier between ground storey and basement -/240/240; all basement elements 240/240/240; compartment walls within basements -/120/120.","doc":"fire-safety-2011-2024ed","pp":"94"},{"id":"XFR-005","t":"mcq","d":3,"tp":"地庫 Basement","c":"C14.1(d)","p":103,"q":"地庫與地面及以上樓層屬同一用途並「合併」（united）時，上層構件的 FRR 應為？","e":"C14.1(d)：合併後所有樓層的構件及防火屏障都須不低於地庫要求。試題常直接給「地庫 4 h」，要留意對上層構件及轉換層的影響。","x":"(d) where a basement has the same Use Classification as the ground storey and any","tier":"必考","ex":"fire","o":["不需耐火","按 Table C1 用途取 60 min 即可","取 120 min","不低於地庫的要求（即構件 240/240/240）"],"a":3,"q_en":"Where a basement has the same Use Classification as the ground and upper storeys and is united with them, what FRR applies to the upper storeys?","o_en":["No FRR needed","60 min per Table C1 is enough","120 min","Not less than the basement requirement (elements 240/240/240)"],"e_en":"C14.1(d): once united, every element and fire barrier in all such storeys must meet the basement FRR. Papers often state \"basement 4 h\"; watch the effect on upper storeys and transfer levels.","doc":"fire-safety-2011-2024ed","pp":"94"},{"id":"XFR-006","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"按 C4.3，單層建築在甚麼體積及高度以內，鋼結構可不作防火保護（另須 6 m 空地）？","e":"≤ 7,000 m³ 且 ≤ 7.5 m 高，並與相鄰建築/地界保持 ≥ 6 m 空地。大跨度單層鋼結構（例如體育館）要留意是否超出。","x":"Where a single-storey building does not exceed 7,000m³ in volume and 7.5m in height, any","tier":"常考","ex":"fire","o":["7,000 m³ 及 7.5 m","28,000 m³ 及 15 m","10,500 m³ 及 10 m","2,500 m³ 及 6 m"],"a":0,"q_en":"Under C4.3, up to what volume and height may a single-storey building have unprotected steelwork (with a 6 m clear space)?","o_en":["7,000 m³ and 7.5 m","28,000 m³ and 15 m","10,500 m³ and 10 m","2,500 m³ and 6 m"],"e_en":"≤ 7,000 m³ and ≤ 7.5 m high, with ≥ 6 m clear open space to adjoining buildings or the site boundary. Check whether single-storey long-span steel halls exceed this.","doc":"fire-safety-2011-2024ed","pp":"79"},{"id":"XS-001","t":"mcq","d":2,"tp":"撓度 Deflection","c":"5.2 Table 5.1","p":67,"q":"Steel Code Table 5.1：吊車樑（crane girder）在靜態垂直輪載下的豎向撓度限值為？","e":"吊車樑豎向 Span/600；水平（只計上翼緣）Span/500。有吊車的廠房/維修庫題要用。","x":"Vertical deflection due to static vertical wheel loads Span/600","doc":"steel-2011-2023ed","tier":"常考","ex":"steel","o":["Span/500","Span/200","Span/360","Span/600"],"a":3,"q_en":"Steel Code Table 5.1: vertical deflection limit of crane girders under static vertical wheel loads?","e_en":"Crane girders vertical Span/600; horizontal (top flange only) Span/500. Needed for briefs with cranes (workshops, depots).","pp":"48"},{"id":"XS-002","t":"mcq","d":2,"tp":"撓度 Deflection","c":"5.2 Table 5.1","p":67,"q":"吊車樑在水平吊車荷載下（只以上翼緣性質計算）的水平撓度限值為？","e":"水平 Span/500、豎向 Span/600。","x":"Horizontal deflection (calculated on the top flange Span/500","doc":"steel-2011-2023ed","tier":"常考","ex":"steel","o":["Span/1000","Span/600","Span/360","Span/500"],"a":3,"q_en":"Horizontal deflection limit of a crane girder under horizontal crane loads (top flange properties alone)?","e_en":"Horizontal Span/500, vertical Span/600.","pp":"48"},{"id":"XS-003","t":"mcq","d":1,"tp":"撓度 Deflection","c":"5.2 Table 5.1","p":67,"q":"Steel Code Table 5.1：懸臂樑在外加荷載下的撓度限值為？","e":"懸臂 Length/180；承托脆性飾面的樑 Span/360；其他樑 Span/200。","x":"Cantilevers Length/180","doc":"steel-2011-2023ed","tier":"常考","ex":"steel","o":["Length/250","Length/180","Length/360","Length/90"],"a":1,"q_en":"Steel Code Table 5.1: deflection limit of cantilevers due to imposed load?","e_en":"Cantilevers Length/180; beams carrying brittle finish Span/360; other beams Span/200.","pp":"48"},{"id":"XS-004","t":"mcq","d":2,"tp":"撓度 Deflection","c":"5.2 Table 5.1","p":67,"q":"12 m 跨鋼樑承托灰泥飾面，外加荷載撓度上限為？","e":"脆性飾面 Span/360 = 12000/360 = 33.3 mm。60 mm 用了 Span/200；48 mm 用了 Span/250。","x":"Beams carrying plaster or other brittle finish Span/360","doc":"steel-2011-2023ed","tier":"常考","ex":"steel","o":["48.0 mm","20.0 mm","60.0 mm","33.3 mm"],"a":3,"q_en":"A 12 m span steel beam carries a plaster finish. What is the imposed-load deflection limit?","e_en":"Brittle finish Span/360 = 12000/360 = 33.3 mm. 60 mm uses Span/200; 48 mm uses Span/250.","pp":"48"},{"id":"XS-005","t":"mcq","d":1,"tp":"撓度 Deflection","c":"5.2 Table 5.1","p":67,"q":"一般鋼樑（非檁條、非承托脆性飾面）的外加荷載撓度限值為？","e":"其他樑 Span/200；典型桁架（不承托脆性板）亦為 Span/200。","x":"Other beams (except purlins and sheeting rails) Span/200","doc":"steel-2011-2023ed","tier":"常考","ex":"steel","o":["Span/180","Span/360","Span/200","Span/500"],"a":2,"q_en":"Imposed-load deflection limit for other steel beams (not purlins, no brittle finish)?","e_en":"Other beams Span/200; typical trusses not carrying brittle panels are also Span/200.","pp":"48"},{"id":"XW-013","t":"mcq","d":3,"tp":"地形 Topography","c":"A3","p":54,"q":"Appendix A3 中山丘高度 Ht 是由哪裏起量？","e":"Ht 由迎風面平均坡度 ≤ 5% 的周邊地面量至山頂；Zt 為地盤最高點（同一基準）。","x":"surrounding ground with a mean slope of less than or equal to 5%","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["地盤地面","海平面（mPD）","迎風面平均坡度 ≤ 5% 的周邊地面","山腳最低點"],"a":2,"q_en":"In Appendix A3, the hill height Ht is measured from what?","o_en":["The site ground level","Sea level (mPD)","The surrounding ground on the windward side with a mean slope ≤ 5%","The lowest point of the hill toe"],"e_en":"Ht is measured from surrounding ground on the windward side with mean slope ≤ 5%; Zt is the site's highest point from the same datum.","pp":"A5"},{"id":"XW-014","t":"tf","d":2,"tp":"沿風向荷載 Along-wind load","c":"2.2.1","p":18,"q":"Wind Code Equation 2-1 求得的 Wz 是作用於外牆的風壓（kPa）。","e":"錯。Wz 是某高度每單位高度的沿風向荷載（kN/m）= Qz Cf Sq,z B，用於整體結構分析；外牆設計用 Section 4.3 的壓力系數。","x":"along-wind load per unit height, at height,","doc":"wind-code-2019","tier":"必考","ex":"wind","a":false,"q_en":"Wz from Wind Code Equation 2-1 is a pressure (kPa) on the facade.","e_en":"False. Wz is the along-wind load per unit height (kN/m) = Qz Cf Sq,z B for overall structural analysis; cladding uses the pressure coefficients of Section 4.3.","pp":"8"},{"id":"XW-015","t":"mcq","d":3,"tp":"尺寸及動力系數 Size & dynamic factor","c":"5.2","p":42,"q":"高度 ≥ 50 m 的建築物，頂部尺寸及動力系數 Sq,h（Equation 5-1）取決於以下哪組參數？","e":"Sq,h 取決於尺寸系數 Ss、高度 H、闊度 B、沿風向基本頻率 Nx 及阻尼比 ξx；< 50 m 可用 Sq = 1.1Ss 簡化。","x":"fundamental frequency for mode mainly aligned with the","doc":"wind-code-2019","tier":"常考","ex":"wind","o":["Ss、H、B、Nx 及 ξx","只有 H","Cf 及 Sθ","只有 Qo,z"],"a":0,"q_en":"For buildings 50 m or taller, the size and dynamic factor Sq,h (Equation 5-1) depends on which parameters?","o_en":["Ss, H, B, Nx and ξx","H only","Cf and Sθ","Qo,z only"],"e_en":"Sq,h depends on the size factor Ss, height H, breadth B, along-wind fundamental frequency Nx and damping ratio ξx; below 50 m use the simplified Sq = 1.1Ss.","pp":"32"},{"id":"XL-017","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"會議室（conference rooms）及候診/候車室（waiting rooms）的 qk 為？","e":"屬 Class 3B，5.0 kPa，不是辦公室的 3.0 kPa；這是常見失分位。","x":"Conference rooms, waiting rooms 5.0 4.5","doc":"dead-imposed-loads-2011-2021ed","tier":"必考","ex":"loads","o":["4.0 kPa","3.0 kPa","5.0 kPa","2.5 kPa"],"a":2,"q_en":"What is qk for conference rooms and waiting rooms?","e_en":"Class 3B, 5.0 kPa, not the office value of 3.0 kPa; a common place to lose marks.","pp":"6"},{"id":"XL-018","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"沒有藏書的閱覽室（reading rooms without book storage）的 qk 為？","e":"閱覽室 3.0；有藏書的圖書館房間 5.0；書庫 3.5 kPa/m（≥ 10.0）。","x":"Reading rooms without book 3.0 4.5","doc":"dead-imposed-loads-2011-2021ed","tier":"常考","ex":"loads","o":["4.0 kPa","3.0 kPa","5.0 kPa","10.0 kPa"],"a":1,"q_en":"What is qk for reading rooms without book storage?","e_en":"Reading rooms 3.0; library rooms with book storage 5.0; stack rooms 3.5 kPa/m (≥ 10.0).","pp":"6"},{"id":"XL-019","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"儲存及檔案用途的辦公室（offices for storage and normal filing）的 qk 為？","e":"屬 Class 5，5.0 kPa；一般辦公室只是 3.0 kPa。","x":"filing purposes 5.0 4.5","doc":"dead-imposed-loads-2011-2021ed","tier":"常考","ex":"loads","o":["3.0 kPa","5.0 kPa","7.5 kPa","4.0 kPa"],"a":1,"q_en":"What is qk for offices for storage and normal filing purposes?","e_en":"Class 5, 5.0 kPa; general offices are only 3.0 kPa.","pp":"7"},{"id":"XL-020","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"骨灰龕場（niches 以外的地方）的 qk 為？","e":"非龕位範圍 4.0 kPa；龕位本身按重量另計（重型龕位 ≥ 4.5 kN/m 每米高每米長）。","x":"Columbaria (areas other than for 4.0 4.5","doc":"dead-imposed-loads-2011-2021ed","tier":"偶考","ex":"loads","o":["4.0 kPa","7.5 kPa","5.0 kPa","3.0 kPa"],"a":0,"q_en":"What is qk for columbaria (areas other than for niches)?","e_en":"Areas other than niches 4.0 kPa; niches are assessed by weight (heavy niches ≥ 4.5 kN/m per m height per m length).","pp":"6"},{"id":"XL-021","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"非住宅樓宇的廚房及洗衣房（kitchens and laundries not in domestic buildings）的 qk 為？","e":"4.0 kPa；住宅廚房只是 2.0 kPa。酒店及醫院題常用。","x":"Kitchens and laundries not in domestic buildings 4.0 4
