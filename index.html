c":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","flashcard"]},{"id":"WND-F03","tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"f":"Qo,z 錨點：10 m / 50 m / 100 m / 200 m？","b":"1.98 / 2.56 / 2.86 / 3.20 kPa","e":"方便快速核對電腦輸出。","x":"30 2.36 50 2.56 75 2.73","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","flashcard"]},{"id":"WND-F04","tp":"適用範圍 Scope","c":"1.1","p":11,"f":"Standard Method 高度上限？","b":"200 m；超過須 wind tunnel testing","e":"另有形狀、地形、across-wind、B/D>6 等觸發條件。","x":"The Standard Method is applicable to typical buildings with a height","doc":"wind-code-2019","pp":"1","tags":["wind-code-2019","適用範圍 Scope","flashcard"]},{"id":"WND-F05","tp":"扭轉 Torsion","c":"2.2.2","p":18,"f":"扭轉偏心 e 範圍？","b":"B/D ≤1：±0.05B；B/D = 6：±0.20B；中間線性內插","e":"B/D>6 須風洞試驗。","x":"Use linear interpolation for intermediate values of","doc":"wind-code-2019","pp":"8","tags":["wind-code-2019","扭轉 Torsion","flashcard"]},{"id":"WND-F06","tp":"臨時結構 Temporary structures","c":"2.5","p":26,"f":"臨時結構風荷載折減？","b":"非住用、≤1 年：最少 70% 永久設計荷載；hoarding/covered walkway/工棚：Qz = 37% Qo,z","e":"37% 已不可再乘其他系數。","x":"70% of the design loads for permanent buildings.","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","臨時結構 Temporary structures","flashcard"]},{"id":"WND-F07","tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"f":"Table 4-1 Cp（牆 A/B/正；屋頂 C/D/E）？","b":"牆：A −1.4、B −1.0、+1.1；平屋頂：C −2.2、D −1.6、E −1.0、+0.3","e":"角區和邊區吸力最大。","x":"Positive pressure C, D, E +0.3","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","flashcard"]},{"id":"WND-F08","tp":"方向系數 Directionality","c":"Table A1-1","p":50,"f":"Sθ 最高及最低？","b":"最高 0.85（E、SE、S）；最低 0.80（NW）；圓形建築 Sθ = 1","e":"取 90° 扇區內最大值。","x":"E 0.85 SE 0.85 S 0.85","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","方向系數 Directionality","flashcard"]},{"id":"WND-F09","tp":"加速度 Acceleration","c":"Table A1-2","p":50,"f":"Sr（return period factor on pressure）？","b":"1 年：0.25；10 年：0.55","e":"用於舒適度加速度。","x":"Table A1-2 Return period factor on pressure","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","加速度 Acceleration","flashcard"]},{"id":"WND-F10","tp":"有效高度 Effective height","c":"Appendix A2","p":51,"f":"Direct shelter 的 Ze 公式？","b":"Ze = max(Z − Hd, 0.25Z)；Hd = min(0.8Ho, 1.2Ho − 0.2Xo, 0.75H)","e":"至少兩幢遮擋建築，用第二有效者。","x":"is the height of reduction and may be taken as zero","doc":"wind-code-2019","pp":"A2","tags":["wind-code-2019","有效高度 Effective height","flashcard"]},{"id":"WND-F11","tp":"地形 Topography","c":"Appendix A3","p":54,"f":"地形效應何時顯著？","b":"ψu > 0.05","e":"上風坡度超過 0.05 需計 topography factor。","x":"For the purpose of this Code, local topography is considered","doc":"wind-code-2019","pp":"A5","tags":["wind-code-2019","地形 Topography","flashcard"]},{"id":"WND-F12","tp":"阻尼 Damping","c":"Table C2-1","p":74,"f":"RC 建築 aspect ratio <4 的 damping（加速度/荷載）？","b":"0.020 / 0.030","e":"≥8 時降至 0.010/0.015。","x":"0.016 0.024 <4 0.020 0.030","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","flashcard"]},{"id":"WEN-F01","tp":"背景 Background","c":"EN 3.1","p":22,"f":"Code 風壓 × γw 1.4 相當於幾多年回歸期？","b":"至少 1,000–1,500 年","e":"與國際標準對重要建築的可靠度一致。","x":"of at least 1,000-1,500 year return which is consistent with the level of","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","flashcard"]},{"id":"WEN-F02","tp":"Across-wind","c":"EN 2.2.3","p":14,"f":"NBCC across-wind 方法的校準條件？","b":"矩形棱柱形；振型接近線性；上半部質量均勻；0.5 < B/D < 2（經驗可延伸至約 1:4）","e":"漸縮或退台建築用 NBCC 偏保守。","x":"(b) mode deflections that are approximately linear with height,","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","flashcard"]},{"id":"WEN-F03","tp":"加速度 Acceleration","c":"EN 2.4.2","p":20,"f":"10 年與 1 年加速度比（code method）？","b":"≈ 3.67（由 Sr 0.55/0.25 按 NBCC 3.3 次方關係）","e":"風洞試驗兩個回歸期都要檢查。","x":"Code. Here 0.55 and 0.25 are the return period factors","doc":"wind-explanatory-notes-2019","pp":"12","tags":["wind-explanatory-notes-2019","加速度 Acceleration","flashcard"]},{"id":"WEN-F04","tp":"修訂 2023 Amendments","c":"Amendments Dec 2023","p":2,"doc":"wind-en-amendments-2023","f":"2023 年 12 月 EN 修訂三大項？","b":"(a) 2.2.3 across-wind 頻率決定指引；(b) 2.5 hoarding/covered walkway 設計淨壓力表；(c) 4.3.1、6.4、Fig B-1、C2、E3.1 文字修訂","e":"只改 Explanatory Notes，不改 Code。","x":"(b) Clause 2.5 – Addition of design net pressure for hoarding and covered walkway","pp":"2","tags":["wind-en-amendments-2023","修訂 2023 Amendments","flashcard"]},{"id":"WEN-F05","tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – EN Table 2-1","p":5,"doc":"wind-en-amendments-2023","f":"Hoarding 設計淨壓力（≤2.5 m / 5 m / 10 m）？","b":"0.63 / 0.70 / 0.77 kPa（已含 Cp、Ss）","e":"可內插；地形不利時要另計 St。","x":"(a) For intermediate values of height, linear interpolation is permitted.","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","flashcard"]},{"id":"WEN-F06","tp":"尺寸系數 Size factor","c":"EN 5.1","p":31,"f":"Ss = 1.0 對應 half-perimeter？","b":"15 m","e":"一般外牆板 Ss > 1.0。","x":"The choice of 15m for size factor of 1.0 is based on the increased wind","doc":"wind-explanatory-notes-2019","pp":"23","tags":["wind-explanatory-notes-2019","尺寸系數 Size factor","flashcard"]}]}</script>
<script>(function () {
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const META = DATA.meta, Q = DATA.q, F = DATA.f;
const QI = {}, FI = {};
Q.forEach(q => QI[q.id] = q); F.forEach(f => FI[f.id] = f);
const DOCS = Object.keys(META.docs).map(k => Object.assign({ k }, META.docs[k])).sort((a, b) => a.order - b.order);
const TYPES = { mcq: '選擇題', tf: '是非題', num: '數值題', short: '簡答題', scenario: '設計情境' };
const DIFF = { 1: '基礎', 2: '中級', 3: '進階' };
const KEY = 'hkss.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); toast.at = Date.now(); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- state ---------- */
function fill(s) { s = s || {}; s.v = 1; s.q = s.q || {}; s.fc = s.fc || {}; s.bm = s.bm || []; s.days = s.days || {}; s.exams = s.exams || []; s.pf = s.pf || {}; s.newPerDay = s.newPerDay || 20; s.fcNew = s.fcNew || {}; return s; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1) return fill(s); } catch (e) { } return fill({}); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('無法儲存進度（瀏覽器儲存空間不足或被停用）'); } }
function bumpDay() { const t = ymd(); S.days[t] = (S.days[t] || 0) + 1; }
function streak() { let n = 0; const d = new Date(); if (!S.days[ymd(d)]) d.setDate(d.getDate() - 1); while (S.days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function record(id, r) {
  const x = S.q[id] || (S.q[id] = { n: 0, c: 0 });
  x.n++; x.c += r; x.ok = r; x.last = Date.now(); bumpDay(); save();
}
function isBm(id) { return S.bm.indexOf(id) >= 0; }
function toggleBm(id) { const i = S.bm.indexOf(id); if (i >= 0) S.bm.splice(i, 1); else S.bm.push(id); save(); return i < 0; }
function wrongIds() { return Q.filter(q => S.q[q.id] && S.q[q.id].ok < 1).map(q => q.id); }
function fcDue() { const t = ymd(); return F.filter(f => S.fc[f.id] && S.fc[f.id].due <= t); }
function fcNew() { return F.filter(f => !S.fc[f.id]); }
function newLeftToday() { const t = ymd(); return Math.max(0, S.newPerDay - (S.fcNew[t] || 0)); }

/* ---------- helpers ---------- */
function docName(k) { return (META.docs[k] || {}).zh || k; }
function docTags(doc) {
  if (doc === 'steel-explanatory-materials-2011') return '<span class="tag warn">EM 為 2011 版而寫 · 請核對 2023 Ed</span>';
  if (doc === 'wind-explanatory-notes-2019') return '<span class="tag warn">EN 已於 2023/12 修訂</span>';
  if (doc === 'wind-en-amendments-2023') return '<span class="tag warn">2023/12 修訂（只改 EN）</span>';
  return '';
}
function itemTags(q) {
  return '<span class="tag">' + esc(docName(q.doc)) + '</span><span class="tag">' + esc(q.tp) + '</span>' +
    (q.t ? '<span class="tag">' + TYPES[q.t] + '</span><span class="tag">' + DIFF[q.d] + '</span>' : '<span class="tag">閃卡</span>') +
    (q.cross ? '<span class="tag x">跨規範</span>' : '') + docTags(q.doc);
}
function citeOne(doc, c, pp, p, x) {
  const d = META.docs[doc] || {};
  return '<div class="cite"><div class="doc">' + esc(d.title || doc) + '</div><div class="loc">' + esc(d.edition || '') + '</div>' +
    '<div class="loc">條文 Clause/Table：<b>' + esc(c) + '</b> · 印刷頁 p.' + esc(pp || '—') + ' · PDF 頁 ' + esc(p) + '</div>' +
    '<blockquote>“' + esc(x) + '”</blockquote></div>';
}
function citeBlock(q) {
  let h = '<h3>出處 Citation</h3>' + citeOne(q.doc, q.c, q.pp, q.p, q.x);
  (q.r || []).forEach(r => { h += citeOne(r.doc, r.c, r.pp, r.p, r.x); });
  return h;
}
function answerText(q) {
  if (q.t === 'mcq') return q.o[q.a];
  if (q.t === 'tf') return q.a ? '對 True' : '錯 False';
  if (q.t === 'num') return q.a + (q.u ? ' ' + q.u : '') + (q.tol ? '（容許 ±' + q.tol + '）' : '');
  return q.m || '';
}
function parseNum(s) { s = String(s || '').replace(/[,\s\u00a0]/g, '').replace(/[×x]10\^?/i, 'e'); if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN; return parseFloat(s); }
function numOk(q, v) { const tol = q.tol || 0; return Math.abs(v - q.a) <= tol + 1e-9 * Math.max(1, Math.abs(q.a)); }

/* ---------- router ---------- */
const TITLES = { home: '港結構規範溫習', practice: '練習 Practice', flash: '閃卡 Flashcards', exam: '模擬試 Mock Exam', more: '更多', review: '錯題重溫 / 書籤', search: '搜尋 Search', notes: '版本注意事項', backup: '備份及匯入', q: '題目', fc: '閃卡' };
const SUB = ['review', 'search', 'notes', 'backup', 'q', 'fc'];
let EXAM = null, SESS = null, FSESS = null;
function route() {
  const h = (location.hash || '#home').slice(1); const parts = h.split('/'); const r = parts[0] || 'home';
  $$('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === r || (r === 'review' || r === 'search' || r === 'notes' || r === 'backup') && a.dataset.tab === 'more'));
  $('#title').textContent = TITLES[r] || TITLES.home;
  $('#backBtn').hidden = SUB.indexOf(r) < 0;
  window.scrollTo(0, 0);
  if (!toast.at || Date.now() - toast.at > 600) $('#toast').classList.remove('show');
  const V = { home, practice, flash, exam, more, review, search, notes, backup, q: singleQ, fc: singleFc }[r] || home;
  V(parts.slice(1));
  app.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#home'; };
$('#searchBtn').onclick = () => { location.hash = '#search'; };

/* ---------- home ---------- */
function docStats(filterFn) {
  let tot = 0, att = 0, n = 0, c = 0;
  Q.forEach(q => { if (!filterFn(q)) return; tot++; const s = S.q[q.id]; if (s) { att++; n += s.n; c += s.c; } });
  return { tot, att, acc: n ? Math.round(c * 100 / n) : null };
}
function home() {
  const all = docStats(() => true); const due = fcDue().length; const nw = Math.min(fcNew().length, newLeftToday());
  const wr = wrongIds().length; const st = streak();
  let h = '<div class="hero"><h2>你好，Eric 👷</h2><p>15 份 HK 結構相關規範 · ' + Q.length + ' 題 · ' + F.length + ' 張閃卡。全部離線運作，進度儲存在本機瀏覽器。</p>' +
    '<div class="row"><a class="btn acc" href="#practice">開始練習</a><a class="btn" href="#flash">溫習閃卡（' + (due + nw) + '）</a></div></div>';
  h += '<div class="grid">' +
    '<div class="stat hl"><b>' + all.att + '<span class="small"> / ' + all.tot + '</span></b><small>已作答題目</small><div class="bar"><i style="width:' + pct(all.att, all.tot) + '%"></i></div></div>' +
    '<div class="stat"><b>' + (all.acc == null ? '—' : all.acc + '%') + '</b><small>整體正確率</small></div>' +
    '<div class="stat"><b>' + st + ' 日</b><small>連續溫習 streak</small></div>' +
    '<div class="stat"><b>' + due + '<span class="small"> +' + nw + ' 新</span></b><small>到期閃卡 due</small></div>' +
    '<a class="stat" href="#review" style="text-decoration:none;color:inherit"><b>' + wr + '</b><small>錯題待重溫</small></a>' +
    '<a class="stat" href="#review/bm" style="text-decoration:none;color:inherit"><b>' + S.bm.length + '</b><small>書籤</small></a>' +
    '<div class="stat"><b>' + S.exams.length + '</b><small>模擬試次數' + (S.exams.length ? '（最近 ' + S.exams[S.exams.length - 1].pct + '%）' : '') + '</small></div>' +
    '<div class="stat"><b>' + Object.keys(S.fc).length + '<span class="small"> / ' + F.length + '</span></b><small>已學閃卡</small></div></div>';
  h += '<div class="card" style="margin-top:12px"><h2>各規範進度 Progress by document</h2>';
  DOCS.forEach(d => {
    const s = docStats(q => q.doc === d.k); if (!s.tot) return;
    const topics = {};

/* ---------- practice ---------- */
function pfDefaults() { return Object.assign({ doc: 'all', tp: 'all', t: 'all', d: 'all', mode: 'all', n: 10 }, S.pf); }
function filterQ(pf) {

    (pf.t === 'all' || q.t === pf.t) && (pf.d === 'all' || String(q.d) === String(pf.d)) &&
    (pf.mode === 'all' || (pf.mode === 'new' && !S.q[q.id]) || (pf.mode === 'wrong' && S.q[q.id] && S.q[q.id].ok < 1) || (pf.mode === 'bm' && isBm(q.id))));
}

function startSession(ids, kind) { SESS = { ids, i: 0, res: {}, kind: kind || 'practice' }; if (location.hash !== '#practice') location.hash = '#practice'; else runSession(); }
function runSession() {

/* ---------- question renderer (practice / single) ---------- */
function renderQuestion(box, q, onResult, onNext, nextLabel) {
  let h = '<div class="card"><div class="qhead"><span>' + esc(q.id) + '</span><button class="bm' + (isBm(q.id) ? ' on' : '') + '" id="bmB" aria-label="書籤">' + (isBm(q.id) ? '★' : '☆') + '</button></div>' +
    '<div>' + itemTags(q) + '</div><div class="qtext">' + esc(q.q) + '</div><div id="ans"></div><div id="fbk"></div></div>';
  box.innerHTML = h;
  $('#bmB', box).onclick = e => { const on = toggleBm(q.id); e.target.classList.toggle('on', on); e.target.textContent = on ? '★' : '☆'; toast(on ? '已加入書籤' : '已移除書籤'); };
  const ans = $('#ans', box), fbk = $('#fbk', box);
  let done = false;
  const finish = (r, label) => {
    if (done) return; done = true; record(q.id, r); onResult && onResult(r);
    const cls = r === 1 ? 'ok' : r === 0 ? 'bad' : 'neutral';
    fbk.innerHTML = '<div class="fb ' + cls + '">' + label + '</div>' +
      (q.t === 'short' || q.t === 'scenario' ? '' : '<p><b>正確答案：</b>' + esc(answerText(q)) + '</p>') +
      '<h3>解說 Explanation</h3><div class="expl">' + esc(q.e) + '</div>' + citeBlock(q) +
      (onNext ? '<div class="row end" style="margin-top:12px"><button class="btn pri" id="nextB">' + (nextLabel || '下一題 ›') + '</button></div>' : '');
    if (onNext) { const nb = $('#nextB', box); nb.onclick = onNext; nb.focus({ preventScroll: true }); }
  };
  if (q.t === 'mcq') {
    const order = shuffle(q.o.map((_, i) => i));
    ans.innerHTML = order.map((oi, k) => '<button class="opt" data-i="' + oi + '"><b>' + 'ABCDEF'[k] + '</b>' + esc(q.o[oi]) + '</button>').join('');
    $$('.opt', ans).forEach(b => b.onclick = () => {
      if (done) return; const i = +b.dataset.i; const ok = i === q.a;
      $$('.opt', ans).forEach(x => { if (+x.dataset.i === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      finish(ok ? 1 : 0, ok ? '✓ 答對了' : '✗ 答錯了');
    });
  } else if (q.t === 'tf') {
    ans.innerHTML = '<div class="grid" style="grid-template-columns:1fr 1fr"><button class="opt" data-v="1"><b>○</b>對 True</button><button class="opt" data-v="0"><b>✕</b>錯 False</button></div>';
    $$('.opt', ans).forEach(b => b.onclick = () => {
      if (done) return; const v = b.dataset.v === '1'; const ok = v === !!q.a;
      $$('.opt', ans).forEach(x => { if ((x.dataset.v === '1') === !!q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      finish(ok ? 1 : 0, ok ? '✓ 答對了' : '✗ 答錯了');
    });
  } else if (q.t === 'num') {
    ans.innerHTML = '<div class="row"><input type="text" inputmode="decimal" id="numIn" placeholder="輸入數值" style="flex:1;min-width:140px" autocomplete="off"><span class="muted">' + esc(q.u || '') + '</span><button class="btn pri" id="numB">提交</button></div>' +
      '<p class="small muted">' + (q.tol ? '容許誤差 ±' + q.tol + (q.u ? ' ' + esc(q.u) : '') : '請輸入準確數值') + '</p>';
    const go = () => { const v = parseNum($('#numIn', ans).value); if (isNaN(v)) { toast('請輸入有效數字'); return; } const ok = numOk(q, v); $('#numIn', ans).disabled = true; $('#numB', ans).disabled = true; finish(ok ? 1 : 0, (ok ? '✓ 答對了' : '✗ 答錯了') + '（你的答案：' + v + '）'); };
    $('#numB', ans).onclick = go; $('#numIn', ans).onkeydown = e => { if (e.key === 'Enter') go(); };
  } else {
    ans.innerHTML = '<textarea id="txt" placeholder="先寫下你的答案要點（可選，只供自己對照，不會自動評分）"></textarea><button class="btn pri block" id="showM" style="margin-top:8px">顯示參考答案</button><div id="mdl"></div>';
    $('#showM', ans).onclick = () => {
      $('#showM', ans).remove();
      $('#mdl', ans).innerHTML = '<div class="model"><b>參考答案 Model answer</b>\n' + esc(q.m) + '</div>' +
        '<h3>要點自評 Key points（剔選你答到的）</h3><div class="kp">' + (q.k || []).map((k, i) => '<label><input type="checkbox" data-i="' + i + '"> <span>' + esc(k) + '</span></label>').join('') + '</div>' +
        '<p class="small muted" id="kpS"></p><div class="row"><button class="btn ok" data-r="1">答對</button><button class="btn" data-r="0.5">部分正確</button><button class="btn bad" data-r="0">答錯</button></div>';
      const kpS = $('#kpS', ans);
      const upd = () => { const n = $$('.kp input', ans).filter(x => x.checked).length; const t = (q.k || []).length; kpS.textContent = t ? '已答到 ' + n + ' / ' + t + ' 個要點' + (n === t ? '，建議評「答對」' : n >= t / 2 ? '，建議評「部分正確」' : '') : ''; };
      $$('.kp input', ans).forEach(x => x.onchange = upd); upd();
      $$('[data-r]', ans).forEach(b => b.onclick = () => { const r = +b.dataset.r; $$('[data-r]', ans).forEach(x => x.disabled = true); finish(r, r === 1 ? '✓ 自評：答對' : r === 0 ? '✗ 自評：答錯（已加入錯題）' : '△ 自評：部分正確（已加入錯題）'); });
    };
  }
}

/* ---------- flashcards (SM-2) ---------- */
function sm2(rec, g) {
  rec = Object.assign({ ef: 2.5, iv: 0, reps: 0, lapses: 0 }, rec || {});
  if (g < 3) { rec.reps = 0; rec.iv = 0; rec.lapses++; rec.due = ymd(); }
  else {
    rec.reps++;
    rec.iv = rec.reps === 1 ? (g === 5 ? 4 : 1) : rec.reps === 2 ? (g === 3 ? 3 : 6) : Math.round(rec.iv * rec.ef);
    if (g === 3 && rec.reps > 2) rec.iv = Math.max(1, Math.round(rec.iv * 0.8));
    rec.due = addDays(ymd(), rec.iv);
  }
  rec.ef = Math.max(1.3, rec.ef + (0.1 - (5 - g) * (0.08 + (5 - g) * 0.02)));
  rec.last = Date.now();
  return rec;
}
function ivLabel(rec, g) { const r = sm2(rec, g); return g < 3 ? '今日再溫' : r.iv + ' 日'; }

  app.innerHTML = '<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat hl"><b>' + dueD.length + '</b><small>到期 Due</small></div><div class="stat"><b>' + Math.min(left, nwD.length) + '</b><small>今日新卡</small></div><div class="stat"><b>' + Object.keys(S.fc).length + '</b><small>已學 / ' + F.length + '</small></div></div>' +

  $('#fcDoc').onchange = e => { S.fdoc = e.target.value; save(); flash(); };

  $('#cramF').onclick = () => { FSESS = { q: shuffle(F.filter(inDoc).map(f => f.id)).slice(0, 20), done: 0, cram: true }; runFlash(); };
}
function runFlash() {

    runFlash();

}

    (S.exams.length ? '<div class="card"><h2>過往成績</h2><table><tr><th>日期</th><th class="n">題數</th><th class="n">分數</th><th class="n">用時</th></tr>' + S.exams.slice(-10).reverse().map(e => '<tr><td>' + esc(e.date) + '</td><td class="n">' + e.n + '</td><td class="n">' + e.pct + '%</td><td class="n">' + Math.round(e.secs / 60) + ' 分</td></tr>').join('') + '</table></div>' : '');
  const pool = () => Q.filter(q => cfg.docs.indexOf(q.doc) >= 0 && AUTO.indexOf(q.t) >= 0);
  const info = () => { const n = pool().length; $('#exInfo').textContent = '題庫：' + n + ' 題可用'; $('#goE').disabled = !n; };
  const saveCfg = () => { S.examCfg = cfg; save(); };
  $$('[data-n]').forEach(b => b.onclick = () => { cfg.n = +b.dataset.n; saveCfg(); exam(['new']); });
  $$('[data-m]').forEach(b => b.onclick = () => { cfg.min = +b.dataset.m; saveCfg(); exam(['new']); });
  $$('[data-d]').forEach(b => b.onclick = () => { const i = cfg.docs.indexOf(b.dataset.d); if (i >= 0) cfg.docs.splice(i, 1); else cfg.docs.push(b.dataset.d); b.classList.toggle('on'); saveCfg(); info(); });
  $('#allD').onclick = () => { cfg.docs = DOCS.map(d => d.k); saveCfg(); exam(['new']); };
  $('#noneD').onclick = () => { cfg.docs = []; saveCfg(); exam(['new']); };
  info();
  $('#goE').onclick = () => {
    const pl = pool(); const byDoc = {};
    pl.forEach(q => (byDoc[q.doc] = byDoc[q.doc] || []).push(q.id));
    // proportional stratified sampling by document
    const n = Math.min(cfg.n, pl.length); let ids = [];
    const keys = Object.keys(byDoc);
    keys.forEach(k => { byDoc[k] = shuffle(byDoc[k]); const take = Math.floor(n * byDoc[k].length / pl.length); ids = ids.concat(byDoc[k].splice(0, take)); });
    const rest = shuffle(keys.reduce((a, k) => a.concat(byDoc[k]), [])); ids = ids.concat(rest.slice(0, n - ids.length));
    EXAM = { ids: shuffle(ids), ans: {}, i: 0, start: Date.now(), secs: cfg.min * 60, done: false, order: {} };
    EXAM.ids.forEach(id => { const q = QI[id]; if (q.t === 'mcq') EXAM.order[id] = shuffle(q.o.map((_, i) => i)); });
    runExam();
  };
}
function examLeft() { return Math.max(0, Math.round(EXAM.secs - (Date.now() - EXAM.start) / 1000)); }
function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
let examTimer = null;
function tick() {
  if (!EXAM || EXAM.done) { clearInterval(examTimer); examTimer = null; return; }
  const l = examLeft(); const t = $('#tmr'); if (t) { t.textContent = fmt(l); t.classList.toggle('low', l < 60); }
  if (l <= 0) { toast('時間到，自動交卷'); submitExam(); }
}
function runExam() {
  const E = EXAM; if (!examTimer) examTimer = setInterval(tick, 1000);
  const id = E.ids[E.i], q = QI[id]; const a = E.ans[id];
  let body = '';
  if (q.t === 'mcq') body = E.order[id].map((oi, k) => '<button class="opt' + (a === oi ? ' sel' : '') + '" data-i="' + oi + '"><b>' + 'ABCDEF'[k] + '</b>' + esc(q.o[oi]) + '</button>').join('');
  else if (q.t === 'tf') body = '<div class="grid" style="grid-template-columns:1fr 1fr"><button class="opt' + (a === true ? ' sel' : '') + '" data-v="1"><b>○</b>對 True</button><button class="opt' + (a === false ? ' sel' : '') + '" data-v="0"><b>✕</b>錯 False</button></div>';
  else body = '<div class="row"><input type="text" inputmode="decimal" id="exNum" placeholder="輸入數值" value="' + (a != null ? esc(a) : '') + '" style="flex:1" autocomplete="off"><span class="muted">' + esc(q.u || '') + '</span></div>' + (q.tol ? '<p class="small muted">容許誤差 ±' + q.tol + '</p>' : '');
  app.innerHTML = '<div class="card"><div class="row"><span class="timer" id="tmr">' + fmt(examLeft()) + '</span><span class="spacer"></span><span class="muted small">已答 ' + Object.keys(E.ans).length + ' / ' + E.ids.length + '</span><button class="btn sm acc" id="subE">交卷</button></div>' +
    '<div class="navgrid">' + E.ids.map((x, k) => '<button class="' + (E.ans[x] != null ? 'ans' : '') + (k === E.i ? ' cur' : '') + '" data-k="' + k + '">' + (k + 1) + '</button>').join('') + '</div></div>' +
    '<div class="card"><div class="qhead"><span>第 ' + (E.i + 1) + ' 題 · ' + TYPES[q.t] + '</span><span>' + esc(docName(q.doc)) + '</span></div><div class="qtext">' + esc(q.q) + '</div>' + body +
    '<div class="row" style="margin-top:12px"><button class="btn" id="prvE"' + (E.i ? '' : ' disabled') + '>‹ 上一題</button><span class="spacer"></span><button class="btn pri" id="nxtE">' + (E.i < E.ids.length - 1 ? '下一題 ›' : '檢查／交卷') + '</button></div></div>';
  const saveNum = () => { const el = $('#exNum'); if (el) { const v = el.value.trim(); if (v === '') delete E.ans[id]; else E.ans[id] = v; } };
  $$('.opt[data-i]').forEach(b => b.onclick = () => { E.ans[id] = +b.dataset.i; runExam(); });
  $$('.opt[data-v]').forEach(b => b.onclick = () => { E.ans[id] = b.dataset.v === '1'; runExam(); });
  $$('.navgrid [data-k]').forEach(b => b.onclick = () => { saveNum(); E.i = +b.dataset.k; runExam(); });
  $('#prvE').onclick = () => { saveNum(); E.i--; runExam(); };
  $('#nxtE').onclick = () => { saveNum(); if (E.i < E.ids.length - 1) { E.i++; runExam(); } else confirmSubmit(); };
  $('#subE').onclick = () => { saveNum(); confirmSubmit(); };
  if ($('#exNum')) $('#exNum').onkeydown = e => { if (e.key === 'Enter') $('#nxtE').click(); };
}
function confirmSubmit() { const un = EXAM.ids.length - Object.keys(EXAM.ans).length; if (!un || confirm('仍有 ' + un + ' 題未答，確定交卷？')) submitExam(); }
function gradeExamQ(q, a) {
  if (a == null) return 0;
  if (q.t === 'mcq') return a === q.a ? 1 : 0;
  if (q.t === 'tf') return a === !!q.a ? 1 : 0;
  const v = parseNum(a); return !isNaN(v) && numOk(q, v) ? 1 : 0;
}
function submitExam() {
  const E = EXAM; if (E.done) return; E.done = true; clearInterval(examTimer); examTimer = null;
  E.used = Math.min(E.secs, Math.round((Date.now() - E.start) / 1000));
  E.res = {}; let sc = 0;
  E.ids.forEach(id => { const r = gradeExamQ(QI[id], E.ans[id]); E.res[id] = r; sc += r; record(id, r); });
  E.score = sc;
  S.exams.push({ date: ymd() + ' ' + new Date().toTimeString().slice(0, 5), n: E.ids.length, score: sc, pct: pct(sc, E.ids.length), secs: E.used });
  save();
  if (location.hash !== '#exam') location.hash = '#exam'; else examReport();
}
function examReport() {
  const E = EXAM; const by = {};
  E.ids.forEach(id => { const q = QI[id]; const b = by[q.doc] || (by[q.doc] = { n: 0, c: 0 }); b.n++; b.c += E.res[id]; });
  const wrong = E.ids.filter(id => !E.res[id]);
  app.innerHTML = '<div class="card"><h2>模擬試成績</h2><p style="font-size:32px;margin:0"><b>' + pct(E.score, E.ids.length) + '%</b></p><p class="muted">' + E.score + ' / ' + E.ids.length + ' 題正確 · 用時 ' + fmt(E.used) + '</p>' +
    '<h3>按規範 By document</h3><table><tr><th>規範</th><th class="n">答對</th><th class="n">題數</th><th class="n">%</th></tr>' +
    DOCS.filter(d => by[d.k]).map(d => { const b = by[d.k]; return '<tr><td>' + esc(d.zh) + '</td><td class="n">' + b.c + '</td><td class="n">' + b.n + '</td><td class="n">' + pct(b.c, b.n) + '%</td></tr>'; }).join('') + '</table>' +
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="newE">再考一次</button>' + (wrong.length ? '<button class="btn" id="prW">練習本卷錯題</button>' : '') + '<a class="btn" href="#home">主頁</a></div></div>' +
    '<div class="card"><h2>答題檢討（' + wrong.length + ' 題錯 / 未答）</h2>' + (wrong.length ? wrong.map(id => { const q = QI[id]; const a = E.ans[id]; const ya = a == null ? '未作答' : q.t === 'mcq' ? q.o[a] : q.t === 'tf' ? (a ? '對' : '錯') : a;
      return '<details class="docrow"><summary><div class="s">✗ ' + esc(q.q) + '</div><div class="small muted">你的答案：' + esc(ya) + ' · 正確：' + esc(answerText(q)) + '</div></summary><div class="expl small">' + esc(q.e) + '</div>' + citeBlock(q) + '</details>'; }).join('') : '<div class="empty">全部答對，做得好！</div>') + '</div>';
  $('#newE').onclick = () => { EXAM = null; exam(['new']); };
  if ($('#prW')) $('#prW').onclick = () => startSession(wrong, 'practice');
}

/* ---------- review / bookmarks ---------- */
function listItem(id) {
  const q = QI[id] || FI[id]; if (!q) return '';
  const s = S.q[id];
  return '<div class="item" data-id="' + esc(id) + '"><div class="s">' + esc(q.q || q.f) + '</div><div class="m">' + esc(docName(q.doc)) + ' · ' + esc(q.c) + (q.t ? ' · ' + TYPES[q.t] : ' · 閃卡') + (s ? ' · 作答 ' + s.n + ' 次' : '') + '</div></div>';
}
function wireList() { $$('.list .item').forEach(it => it.onclick = () => { const id = it.dataset.id; location.hash = (QI[id] ? '#q/' : '#fc/') + encodeURIComponent(id); }); }
function review(p) {
  const tab = p[0] === 'bm' ? 'bm' : 'wrong';
  const ids = tab === 'bm' ? S.bm.filter(id => QI[id]) : wrongIds().sort((a, b) => (S.q[b].last || 0) - (S.q[a].last || 0));
  app.innerHTML = '<div class="chips" style="margin-bottom:12px"><a class="chip' + (tab === 'wrong' ? ' on' : '') + '" href="#review">錯題重溫（' + wrongIds().length + '）</a><a class="chip' + (tab === 'bm' ? ' on' : '') + '" href="#review/bm">書籤（' + S.bm.filter(id => QI[id]).length + '）</a></div>' +
    '<div class="card">' + (ids.length ? '<div class="row" style="margin-bottom:6px"><button class="btn pri" id="redo">全部重做（' + ids.length + '）</button>' + (tab === 'wrong' ? '<span class="small muted">答對後會自動移出錯題</span>' : '') + '</div><div class="list">' + ids.map(listItem).join('') + '</div>'
      : '<div class="empty">' + (tab === 'bm' ? '尚未加入書籤。作答時按 ☆ 可收藏題目。' : '暫時沒有錯題 👍') + '</div>') + '</div>';
  wireList();
  if ($('#redo')) $('#redo').onclick = () => startSession(shuffle(ids), 'practice');
}

/* ---------- search ---------- */
function hl(text, toks) {
  let s = esc(text); toks.forEach(t => { if (!t) return; const re = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); s = s.replace(re, '<mark>$1</mark>'); }); return s;
}
function snippet(text, tok) { const i = text.toLowerCase().indexOf(tok.toLowerCase()); if (i < 0) return text.slice(0, 110); const st = Math.max(0, i - 40); return (st ? '…' : '') + text.slice(st, st + 130) + (st + 130 < text.length ? '…' : ''); }
const IDX = Q.map(q => ({ id: q.id, kind: 'q', it: q, txt: [q.id, q.q, (q.o || []).join(' '), q.m || '', (q.k || []).join(' '), q.e, q.x, q.c, q.tp, docName(q.doc), (q.r || []).map(r => r.x + ' ' + r.c).join(' ')].join(' \n ') }))
  .concat(F.map(f => ({ id: f.id, kind: 'f', it: f, txt: [f.id, f.f, f.b, f.e || '', f.x, f.c, f.tp, docName(f.doc)].join(' \n ') })));
IDX.forEach(r => r.low = r.txt.toLowerCase());
function search() {
  const qv = S.lastSearch || '';
  app.innerHTML = '<div class="card"><input type="search" id="sIn" placeholder="搜尋題目、解說、原文引句…（例如 cover、γm、Table 2.1、風）" value="' + esc(qv) + '" autocomplete="off"><div class="small muted" id="sInfo" style="margin-top:6px"></div></div><div class="card"><div class="list" id="sRes"></div></div>';
  const run = () => {
    const v = $('#sIn').value.trim(); S.lastSearch = v;
    const toks = v.toLowerCase().split(/\s+/).filter(Boolean);
    if (!toks.length) { $('#sInfo').textContent = '共 ' + Q.length + ' 題及 ' + F.length + ' 張閃卡可搜尋（多個關鍵字以空格分隔，須全部符合）'; $('#sRes').innerHTML = '<div class="empty">輸入關鍵字開始搜尋</div>'; return; }
    const res = IDX.filter(r => toks.every(t => r.low.indexOf(t) >= 0));
    $('#sInfo').textContent = '找到 ' + res.length + ' 項' + (res.length > 150 ? '（顯示首 150 項）' : '');
    $('#sRes').innerHTML = res.length ? res.slice(0, 150).map(r => { const it = r.it; const main = it.q || it.f; const other = r.txt.replace(main, ''); const inMain = toks.every(t => main.toLowerCase().indexOf(t) >= 0);
      return '<div class="item" data-id="' + esc(r.id) + '"><div class="s">' + hl(main, toks) + '</div>' + (inMain ? '' : '<div class="m">' + hl(snippet(other, toks[0]), toks) + '</div>') + '<div class="m">' + (r.kind === 'q' ? TYPES[it.t] : '閃卡') + ' · ' + esc(docName(it.doc)) + ' · ' + esc(it.c) + '</div></div>'; }).join('') : '<div class="empty">找不到相符項目</div>';
    wireList();
  };
  let t; $('#sIn').oninput = () => { clearTimeout(t); t = setTimeout(run, 150); };
  run(); setTimeout(() => $('#sIn') && $('#sIn').focus(), 50);
}

/* ---------- more / notes / backup ---------- */
function more() {
  app.innerHTML = '<div class="card menu">' +
    '<a href="#review"><span>✗</span>錯題重溫<em>' + wrongIds().length + '</em></a>' +
    '<a href="#review/bm"><span>★</span>書籤<em>' + S.bm.length + '</em></a>' +
    '<a href="#search"><span>⌕</span>全文搜尋</a>' +
    '<a href="#notes"><span>⚠</span>版本注意事項</a>' +
    '<a href="#backup"><span>⇅</span>備份／匯入進度</a></div>' +
    '<div class="card small muted">題庫：' + Q.length + ' 題（' + Object.keys(TYPES).map(k => TYPES[k] + ' ' + Q.filter(q => q.t === k).length).join('、') + '）· 閃卡 ' + F.length + ' 張 · 建置於 ' + esc(META.built) + '<br>提示：在手機瀏覽器選「加入主畫面」可像 App 一樣開啟（本檔案完全離線）。</div>';
}
function notes() {
  app.innerHTML = '<div class="warnbox">⚠ 本工具是個人溫習輔助，不能取代規範原文。所有引用已自動核對與 PDF 抽取文字一致，但解說屬學習筆記性質。</div>' +
    META.caveats.map(c => '<div class="card note"><h3>' + esc(c.h) + '</h3><p>' + esc(c.b) + '</p></div>').join('') +
    '<div class="card"><h2>收錄文件及題量</h2><table><tr><th>文件 · 版本</th><th class="n">題</th><th class="n">卡</th></tr>' +
    DOCS.map(d => '<tr><td><b>' + esc(d.zh) + '</b><br><span class="small muted">' + esc(d.title) + ' — ' + esc(d.edition) + '</span></td><td class="n">' + Q.filter(q => q.doc === d.k).length + '</td><td class="n">' + F.filter(f => f.doc === d.k).length + '</td></tr>').join('') + '</table></div>';
}
function backup() {
  app.innerHTML = '<div class="card"><h2>匯出進度 Export</h2><p class="small muted">下載一個 JSON 檔（作答紀錄、閃卡排程、書籤、模擬試成績），可在另一部裝置匯入。</p><button class="btn pri" id="expB">匯出 JSON</button></div>' +
    '<div class="card"><h2>匯入進度 Import</h2><p class="small muted">匯入會取代本機現有進度。</p><input type="file" id="impF" accept="application/json,.json"></div>' +
    '<div class="card"><h2>重設</h2><button class="btn bad" id="rstB">清除所有進度</button></div>';
  $('#expB').onclick = () => {
    const blob = new Blob([JSON.stringify(Object.assign({ app: 'hk-structural-study', exported: new Date().toISOString() }, S), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hk-structural-study-progress-' + ymd() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('已匯出');
  };
  $('#impF').onchange = e => {
    const file = e.target.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || typeof o.q !== 'object') throw new Error('bad'); if (!confirm('確定以匯入檔取代現有進度？')) return; delete o.app; delete o.exported; S = fill(o); save(); toast('匯入成功'); location.hash = '#home'; } catch (err) { toast('檔案格式不正確'); } };
    rd.readAsText(file);
  };
  $('#rstB').onclick = () => { if (confirm('確定清除所有進度？此操作不能復原。')) { S = fill({}); save(); SESS = null; FSESS = null; EXAM = null; toast('已清除'); location.hash = '#home'; } };
}

window.HKSS = { Q, F, state: () => S };
route();
})();
</script>
