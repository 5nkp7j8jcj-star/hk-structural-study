ter of 2.0Ft (or ls/2.5·Ft) and what percentage of the total design vertical load on the column at that level?","e_en":"6.4.1.6(a)(ii): 3% of total design ultimate vertical load. Corner columns must satisfy this in each of the two directions.","doc":"concrete-2013-2020ed","pp":"94","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-082","t":"mcq","d":2,"tp":"牛腿 Corbels","c":"6.5.2.3","p":109,"q":"Corbel 的水平箍筋應分佈在根部有效深度的哪個範圍，數量不少於主拉筋的多少？","o":["下三分之一；主筋 25%","上三分之二；主筋 50%","全深度；主筋 100%","上半；主筋 33%"],"a":1,"e":"6.5.2.3：上 2/3 有效深度，≥ 主拉筋面積一半。另 6.5.2.1(a)：水平力抗力不少於垂直設計荷載一半。","x":"thirds of the effective depth of root of the corbel; this reinforcement should be not less than one-half","q_en":"Within what portion of the effective depth at the root should the horizontal links of a corbel be distributed, and what minimum amount relative to the main tension reinforcement?","o_en":["Lower one-third; 25% of main bars","Upper two-thirds; 50% of main bars","Full depth; 100% of main bars","Upper half; 33% of main bars"],"e_en":"6.5.2.3: upper 2/3 of the effective depth, ≥ half the area of the main tension reinforcement. Also 6.5.2.1(a): resistance to horizontal force not less than half the vertical design load.","doc":"concrete-2013-2020ed","pp":"95","tags":["concrete-2013-2020ed","牛腿 Corbels","mcq","中級"]},{"id":"CON-083","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.2","p":112,"q":"Pile cap 剪力檢核的 critical section 位於：","o":["柱面","樁面","樁面向內 20% 樁徑","距柱面 d"],"a":2,"e":"6.7.3.2：樁面內 20% 樁徑；中心在此線外的樁力全計在外。Rigid cap 簡化分析不可用 shear enhancement（6.7.3.3(b)）。","x":"located 20% of the diameter of the pile inside the face of the pile, as indicated in Figure 6.19. The","q_en":"The critical section for the shear check of a pile cap is located at:","o_en":["The column face","The pile face","20% of the pile diameter inside the pile face","d from the column face"],"e_en":"6.7.3.2: 20% of the pile diameter inside the pile face; the full load of piles whose centres lie outside this line is counted. Shear enhancement cannot be used in the simplified rigid cap analysis (6.7.3.3(b)).","doc":"concrete-2013-2020ed","pp":"98","tags":["concrete-2013-2020ed","基礎 Foundations","mcq","中級"]},{"id":"CON-084","t":"tf","d":3,"tp":"基礎 Foundations","c":"6.7.3.3(c)","p":112,"q":"考慮剪力橫向分布時，pile cap 的 shear enhancement 可施加於以每支樁為中心、寬 3φ 的條帶。","a":true,"e":"對。6.7.3.3(c)：寬 3φ；H 樁或矩形樁可用樁寬 + 2 × 最小尺寸。v < vc 時毋須最少箍筋（(e)）。","x":"enhancement may be applied to the strip of the pile cap of width equal to 3φ, centred on each","q_en":"When allowing for the transverse distribution of shear, shear enhancement in a pile cap may be applied to strips of width 3φ centred on each pile.","e_en":"True. 6.7.3.3(c): width 3φ; for H-piles or rectangular piles, pile width + 2 × least dimension may be used. Minimum links are not needed when v < vc ((e)).","doc":"concrete-2013-2020ed","pp":"98","tags":["concrete-2013-2020ed","基礎 Foundations","tf","進階"]},{"id":"CON-085","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.1","p":111,"q":"Truss analogy 設計 pile cap 時，若樁距超過 3 倍樁徑，只計入距樁中心多少範圍內的鋼筋作拉桿？","o":["0.5φ","1.0φ","1.5φ","3φ"],"a":2,"e":"6.7.3.1：樁距 >3φ 時只計 1.5φ 範圍內鋼筋，故大樁距 cap 應把底筋集中於樁頂帶。","x":"spaced piles (spacing exceeding three times the pile diameter), only the reinforcement within 1.5 times","q_en":"When designing a pile cap by truss analogy with pile spacing greater than 3 times the pile diameter, only reinforcement within what distance of the pile centre is counted as the tie?","e_en":"6.7.3.1: with spacing >3φ, only bars within 1.5φ are counted, so caps with wide pile spacing should concentrate bottom bars in bands over the piles.","doc":"concrete-2013-2020ed","pp":"97","tags":["concrete-2013-2020ed","基礎 Foundations","mcq","中級"]},{"id":"CON-090","t":"mcq","d":1,"tp":"裂縫 Cracking","c":"Table 7.1","p":117,"q":"一般建築物的鋼筋混凝土構件（exposure 1–4），最大估計表面裂縫寬度一般限制為：","o":["0.1 mm","0.2 mm","0.3 mm","0.4 mm"],"a":2,"e":"Table 7.1：RC 0.3 mm；水缸等 water retaining structures 0.2 mm；unbonded PT 0.2 mm。Exposure 1 的限制只為外觀，可放寬。","x":"Table 7.1 - Limitations of maximum estimated surface crack widths","q_en":"For reinforced concrete members in ordinary buildings (exposure 1–4), the maximum estimated surface crack width is generally limited to:","e_en":"Table 7.1: RC 0.3 mm; water retaining structures such as tanks 0.2 mm; unbonded PT 0.2 mm. The limit for exposure 1 is for appearance only and may be relaxed.","doc":"concrete-2013-2020ed","pp":"103","tags":["concrete-2013-2020ed","裂縫 Cracking","mcq","基礎"]},{"id":"CON-091","t":"tf","d":2,"tp":"裂縫 Cracking","c":"7.2.2","p":117,"q":"只要符合第 8、9 節最少配筋及鋼筋間距規定，一般毋須另行計算裂縫寬度。","a":true,"e":"對。7.2.2 deemed-to-satisfy。若直接計算裂縫（7.2.3），往往可用較大鋼筋間距，淺構件尤其明顯。","x":"If the detailing rules prescribed in sections 8 and 9 with respect to minimum reinforcement areas and","q_en":"Provided the minimum reinforcement and bar spacing rules of Sections 8 and 9 are met, crack widths generally need not be calculated.","e_en":"True. 7.2.2 deemed-to-satisfy. If crack widths are calculated directly (7.2.3), larger bar spacings can often be used, especially in shallow members.","doc":"concrete-2013-2020ed","pp":"103","tags":["concrete-2013-2020ed","裂縫 Cracking","tf","中級"]},{"id":"CON-092","t":"mcq","d":2,"tp":"裂縫 Cracking","c":"7.2.3","p":118,"q":"使用 equation 7.1 計算裂縫寬度的前提，受拉鋼筋應變應限於：","o":["0.5fy/Es","0.8fy/Es","0.87fy/Es","fy/Es"],"a":1,"e":"7.2.3：鋼筋應變 ≤0.8fy/Es。主要受軸拉的構件使用公式要小心。","x":"Provided the strain in the tension reinforcement is limited to 0.8fy/Es, the design surface crack width,","q_en":"A condition for using equation 7.1 to calculate crack width is that the tension reinforcement strain is limited to:","e_en":"7.2.3: reinforcement strain ≤0.8fy/Es. Take care using the formula for members mainly in axial tension.","doc":"concrete-2013-2020ed","pp":"104","tags":["concrete-2013-2020ed","裂縫 Cracking","mcq","中級"]},{"id":"CON-093","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.1","p":120,"q":"施工後（after construction）可能損壞相鄰部分的撓度，對 quasi-permanent loads 一般合適的限值是：","o":["span/250","span/360","span/500","span/750"],"a":2,"e":"7.3.1：外觀 sag 限 span/250（pre-camber 亦不應超過 span/250）；施工後撓度 span/500。有玻璃幕牆或脆性間隔時可能要更嚴。","x":"after construction, span/500 is normally an appropriate limit for quasi-permanent loads. Other limits","q_en":"For deflection after construction that may damage adjacent parts, the generally appropriate limit for quasi-permanent loads is:","e_en":"7.3.1: sag limited to span/250 for appearance (pre-camber should also not exceed span/250); deflection after construction span/500. Stricter limits may be needed with glass curtain walls or brittle partitions.","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","mcq","中級"]},{"id":"CON-094","t":"num","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"在 static characteristic wind load 下，樓頂側向撓度限制為 H/ 多少？","a":500,"tol":0,"u":"","e":"7.3.2：H/500，H 由最高樓層量度（不包括機房/天台構築物）。Cross-code：wind load 按 Wind Code 2019 計算，但撓度限值來自 Concrete Code。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","q_en":"Under static characteristic wind load, the lateral deflection at the top of the building is limited to H/ what?","e_en":"7.3.2: H/500, with H measured to the highest floor (excluding plant rooms/roof structures). Cross-code: the wind load is calculated per the Wind Code 2019, but the deflection limit comes from the Concrete Code.","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","num","中級"]},{"id":"CON-095","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"動力分析下，住宅樓宇在 1-in-10-year 10 分鐘風速下的最大峰值加速度限值是：","o":["0.10 m/s²","0.15 m/s²","0.25 m/s²","0.35 m/s²"],"a":1,"e":"7.3.2：住宅 0.15 m/s²；寫字樓/酒店 0.25 m/s²。超高住宅常由加速度控制，可能需要 damper 或風洞試驗。","x":"Residential 0.15 m/s2","q_en":"In dynamic analysis, the peak acceleration limit for residential buildings at the 1-in-10-year 10-minute wind speed is:","e_en":"7.3.2: residential 0.15 m/s²; office/hotel 0.25 m/s². Very tall residential towers are often governed by acceleration and may need dampers or wind tunnel testing.","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","mcq","中級"]},{"id":"CON-096","t":"num","d":2,"tp":"振動 Vibration","c":"7.3.3","p":121,"q":"樓面結構自然頻率低於多少 Hz 時可能需要動力分析？","a":6,"tol":0,"u":"Hz","e":"7.3.3：樓面 <6 Hz、行人天橋 <5 Hz。健身室、長跨鋼樑樓面及天橋要檢核。","x":"from people or machinery, should be avoided. For a building floor structure with the natural frequency","q_en":"Below what natural frequency (Hz) of a floor structure may dynamic analysis be required?","e_en":"7.3.3: floors <6 Hz, footbridges <5 Hz. Check gyms, long-span steel beam floors and footbridges.","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","振動 Vibration","num","中級"]},{"id":"CON-097","t":"num","d":1,"tp":"撓度 Deflection","c":"Table 7.3","p":121,"q":"Table 7.3：簡支矩形樑（simply-supported rectangular beam）的基本 span/effective depth ratio 是多少？","a":20,"tol":0,"u":"","e":"Table 7.3：cantilever 7、simply-supported 20、continuous 26、end span 23（flanged bw/b ≤0.3 較低：5.5/16/21/18.5）。再乘 Table 7.4/7.5 修正系數。","x":"Simply-supported 20 16 20","q_en":"Table 7.3: what is the basic span/effective depth ratio of a simply-supported rectangular beam?","e_en":"Table 7.3: cantilever 7, simply-supported 20, continuous 26, end span 23 (lower for flanged with bw/b ≤0.3: 5.5/16/21/18.5). Then multiply by the modification factors of Table 7.4/7.5.","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","撓度 Deflection","num","基礎"]},{"id":"CON-098","t":"scenario","d":2,"tp":"撓度 Deflection","c":"7.3.4.3","p":121,"q":"一條 12 m 跨的連續矩形樑，支承脆性間隔牆。如何以 Table 7.3 檢核撓度？","m":"跨度 >10 m 且需限制間隔牆及飾面安裝後撓度增加，基本比值 26 要乘 10/span = 10/12，即 26 × 0.833 ≈ 21.7，再乘 Table 7.4 受拉筋及 Table 7.5 受壓筋修正系數。懸臂則須以計算證明。","k":["span >10 m","乘 10/span","26 × 10/12 ≈ 21.7","再乘 Table 7.4/7.5"],"e":"長跨樑常被忽略 10/span 修正。雙向板按短跨檢核（Table 7.3 Note 3）。","x":"in Table 7.3 should be multiplied by 10/span except for cantilevers where the design should be justified","q_en":"A 12 m span continuous rectangular beam supports brittle partitions. How is deflection checked using Table 7.3?","m_en":"With span >10 m and a need to limit the increase in deflection after installation of partitions and finishes, the basic ratio 26 is multiplied by 10/span = 10/12, i.e. 26 × 0.833 ≈ 21.7, then by the tension reinforcement factor of Table 7.4 and the compression reinforcement factor of Table 7.5. Cantilevers must be justified by calculation.","k_en":["span >10 m","Multiply by 10/span","26 × 10/12 ≈ 21.7","Then multiply by Table 7.4/7.5"],"e_en":"The 10/span modification is often overlooked for long-span beams. Two-way slabs are checked on the short span (Table 7.3 Note 3).","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","撓度 Deflection","scenario","中級"]},{"id":"CON-099","t":"mcq","d":2,"tp":"鋼筋間距 Spacing","c":"8.2","p":130,"q":"平行鋼筋之間的最小淨距應不少於：","o":["鋼筋直徑","hagg + 5 mm","20 mm","以上三者的最大值"],"a":3,"e":"8.2：max(bar diameter, hagg + 5 mm, 20 mm)。多層鋼筋應上下對齊，留位給震動棒。","x":"parallel bars should be not less than the maximum of bar diameter, (hagg + 5 mm) or 20 mm where","q_en":"The minimum clear distance between parallel bars should not be less than:","o_en":["The bar diameter","hagg + 5 mm","20 mm","The greatest of the above three"],"e_en":"8.2: max(bar diameter, hagg + 5 mm, 20 mm). Multiple layers should be vertically aligned to leave space for pokers.","doc":"concrete-2013-2020ed","pp":"116","tags":["concrete-2013-2020ed","鋼筋間距 Spacing","mcq","中級"]},{"id":"CON-100","t":"mcq","d":2,"tp":"彎筋 Bends","c":"Table 8.2","p":131,"q":"直徑 ≥ 20 mm 鋼筋彎鈎的最小內彎半徑是：","o":["2φ","3φ","4φ","6φ"],"a":2,"e":"Table 8.2：φ ≤12 mm 2φ；<20 mm 3φ；≥20 mm 4φ。若錨固需要超過彎位後 4φ，要檢核彎內混凝土承壓（eq 8.1）。","x":"φ < 20 mm 3φ φ ≥ 20 mm 4φ","q_en":"The minimum internal radius of bend for bars of diameter ≥ 20 mm is:","e_en":"Table 8.2: φ ≤12 mm 2φ; <20 mm 3φ; ≥20 mm 4φ. If the anchorage requires more than 4φ beyond the bend, check concrete bearing inside the bend (eq 8.1).","doc":"concrete-2013-2020ed","pp":"117","tags":["concrete-2013-2020ed","彎筋 Bends","mcq","中級"]},{"id":"CON-101","t":"num","d":2,"tp":"錨固 Anchorage","c":"Table 8.3","p":132,"q":"Ribbed bars 受拉時的 bond coefficient β 是多少？","a":0.5,"tol":0,"u":"","e":"fbu = β√fcu（fcu 上限 60）；ribbed 受拉 0.50、受壓 0.63；plain 0.28/0.35。無最少箍筋的樑要用 plain bar 值（板除外）。","x":"Ribbed bars 0.50 0.63","q_en":"What is the bond coefficient β for ribbed bars in tension?","e_en":"fbu = β√fcu (fcu capped at 60); ribbed in tension 0.50, in compression 0.63; plain 0.28/0.35. Beams without minimum links must use plain bar values (except slabs).","doc":"concrete-2013-2020ed","pp":"118","tags":["concrete-2013-2020ed","錨固 Anchorage","num","中級"]},{"id":"CON-102","t":"tf","d":3,"tp":"錨固 Anchorage","c":"8.4.4","p":132,"q":"在沒有按 Table 6.2 設最少箍筋的樑中，即使用 ribbed bars，錨固 bond stress 也要按 plain bars 取值。","a":true,"e":"對。8.4.4：樑無最少箍筋時用 plain bar β，但此規定不適用於板。這會令錨固長度大增。","x":"anchorage bond stresses used should be those appropriate to plain bars irrespective of the type of","q_en":"In beams without minimum links per Table 6.2, the anchorage bond stress must be taken as for plain bars even if ribbed bars are used.","e_en":"True. 8.4.4: plain bar β is used for beams without minimum links, but this does not apply to slabs. It greatly increases anchorage lengths.","doc":"concrete-2013-2020ed","pp":"118","tags":["concrete-2013-2020ed","錨固 Anchorage","tf","進階"]},{"id":"CON-103","t":"num","d":1,"tp":"錨固 Anchorage","c":"Table 8.4","p":133,"q":"Table 8.4：C40 混凝土、fy 500 ribbed bar 受拉 anchorage length 是多少倍鋼筋直徑？","a":35,"tol":0,"u":"φ","e":"C30 40φ、C35 38φ、C40 35φ、C45 33φ、C50 31φ、≥C60 28φ（ribbed 受拉）。受壓較短。圖則上常寫「anchorage 40φ」即按 C30 取值。","x":"40 Tension 31 35 27","q_en":"Table 8.4: for C40 concrete and fy 500 ribbed bars in tension, the anchorage length is how many bar diameters?","e_en":"C30 40φ, C35 38φ, C40 35φ, C45 33φ, C50 31φ, ≥C60 28φ (ribbed, tension). Compression is shorter. Drawings often state \"anchorage 40φ\", i.e. the C30 value.","doc":"concrete-2013-2020ed","pp":"119","tags":["concrete-2013-2020ed","錨固 Anchorage","num","基礎"]},{"id":"CON-104","t":"tf","d":2,"tp":"錨固 Anchorage","c":"8.4.6","p":133,"q":"彎鈎（bends and hooks）對受壓錨固（compression anchorage）有貢獻。","a":false,"e":"錯。8.4.6：bends and hooks do not contribute to compression anchorages。柱筋插入 pile cap 受壓時要足夠直線長度。","x":"Bends and hooks do not contribute to compression anchorages.","q_en":"Bends and hooks contribute to compression anchorage.","e_en":"False. 8.4.6: bends and hooks do not contribute to compression anchorages. Column bars entering a pile cap in compression need sufficient straight length.","doc":"concrete-2013-2020ed","pp":"119","tags":["concrete-2013-2020ed","錨固 Anchorage","tf","中級"]},{"id":"CON-105","t":"num","d":1,"tp":"搭接 Laps","c":"8.7.3.1","p":136,"q":"鋼筋最小搭接長度為 15 倍直徑或多少 mm（取較大）？","a":300,"tol":0,"u":"mm","e":"8.7.3.1：≥max(15φ, 300 mm)；焊接鋼網 ≥250 mm。實際搭接一般由 Table 8.5 控制。","x":"The minimum lap length for bar reinforcement should be not less than 15 times the bar diameter or","q_en":"The minimum lap length of reinforcement is 15 times the bar diameter or how many mm (whichever is greater)?","e_en":"8.7.3.1: ≥max(15φ, 300 mm); welded fabric ≥250 mm. Actual laps are generally governed by Table 8.5.","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","num","基礎"]},{"id":"CON-106","t":"mcq","d":3,"tp":"搭接 Laps","c":"8.7.3.2","p":136,"q":"搭接位於截面頂部（as cast）且最小保護層少於 2 倍鋼筋直徑，同時位於角位亦符合條件，搭接長度應乘：","o":["1.0","1.25","1.4","2.0"],"a":3,"e":"8.7.3.2：單一條件 ×1.4，兩者同時 ×2.0。樑頂角筋常同時符合兩項。","x":"(c) where both conditions above apply, the lap length should be increased by a factor of 2.0.","q_en":"If a lap is at the top of a section as cast with minimum cover less than 2 times the bar diameter, and also at a corner, the lap length should be multiplied by:","e_en":"8.7.3.2: ×1.4 for either condition, ×2.0 for both. Top corner bars of beams often satisfy both.","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","mcq","進階"]},{"id":"CON-107","t":"mcq","d":2,"tp":"搭接 Laps","c":"8.7.2","p":136,"q":"受拉鋼筋分佈在兩層或以上時，同一截面容許搭接的百分比是：","o":["25%","50%","75%","100%"],"a":1,"e":"8.7.2：單層 100%；兩層或以上 50%。受壓及分佈筋可全部在同一截面搭接。","x":"all in one layer, or 50% where the bars are in 2 or more layers.","q_en":"When tension reinforcement is in two or more layers, the percentage that may be lapped at one section is:","e_en":"8.7.2: single layer 100%; two or more layers 50%. Compression and distribution bars may all be lapped at the same section.","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","mcq","中級"]},{"id":"CON-108","t":"num","d":2,"tp":"樑配筋 Beam detailing","c":"9.2.1.3","p":149,"q":"樑的受拉或受壓鋼筋面積均不應超過毛截面面積的多少 %？","a":4,"tol":0,"u":"%","e":"9.2.1.3：≤4%；搭接處同層鋼筋直徑總和 ≤40% 截面寬度。Ductility 區（9.9.1.2）受拉筋更限 2.5%。","x":"4% of the gross cross-sectional area of the concrete.","q_en":"The area of tension or compression reinforcement in a beam should not exceed what % of the gross cross-sectional area?","e_en":"9.2.1.3: ≤4%; at laps, the sum of bar diameters in a layer ≤40% of the section width. In ductility zones (9.9.1.2), tension reinforcement is further limited to 2.5%.","doc":"concrete-2013-2020ed","pp":"135","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","num","中級"]},{"id":"CON-109","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"9.2.1.2","p":149,"q":"樑深超過 750 mm 時側面筋（side bars）的間距不應超過：","o":["150 mm","200 mm","250 mm","300 mm"],"a":2,"e":"9.2.1.2：≤250 mm，分佈於由受拉面起 2/3 樑深範圍。Transfer girder 常忽略側筋，導致腹部裂縫。","x":"The spacing should not exceed 250 mm and the bars should be distributed over a distance of two-","q_en":"For beams deeper than 750 mm, the spacing of side bars should not exceed:","e_en":"9.2.1.2: ≤250 mm, distributed over 2/3 of the beam depth from the tension face. Side bars are often omitted in transfer girders, leading to web cracking.","doc":"concrete-2013-2020ed","pp":"135","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","mcq","中級"]},{"id":"CON-110","t":"num","d":1,"tp":"板配筋 Slab detailing","c":"9.3.1.1","p":153,"q":"fy = 500 N/mm² 時，實心板每方向最少總縱向鋼筋為混凝土截面的多少 %？","a":0.13,"tol":0,"u":"%","e":"9.3.1.1：fy 250 → 0.24%；fy 500 → 0.13%；受拉筋再乘 αmin = 40fcu^(2/3)/fy ≥1.0。所以高等級混凝土最少鋼筋會增加（例如 C45 時 αmin ≈1.01）。","x":"(ii) fy = 500 N/mm2: 0.13% of concrete cross-sectional area.","q_en":"For fy = 500 N/mm², what is the minimum total longitudinal reinforcement in each direction of a solid slab, as % of the concrete section?","e_en":"9.3.1.1: fy 250 → 0.24%; fy 500 → 0.13%; tension reinforcement is further multiplied by αmin = 40fcu^(2/3)/fy ≥1.0. So minimum reinforcement increases for higher concrete grades (e.g. αmin ≈1.01 at C45).","doc":"concrete-2013-2020ed","pp":"139","tags":["concrete-2013-2020ed","板配筋 Slab detailing","num","基礎"]},{"id":"CON-111","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"9.3.1.1(b)","p":153,"q":"一般情況下，板主筋最大間距是：","o":["2h ≤ 250 mm","3h ≤ 400 mm","3.5h ≤ 450 mm","4h ≤ 500 mm"],"a":1,"e":"9.3.1.1(b)：主筋 3h ≤400 mm；次筋 3.5h ≤450 mm；集中荷載或最大彎矩區主筋 2h ≤250 mm。","x":"(i) for the principal reinforcement, 3h ≤ 400 mm; and","q_en":"In general, the maximum spacing of main bars in a slab is:","e_en":"9.3.1.1(b): main bars 3h ≤400 mm; secondary bars 3.5h ≤450 mm; main bars in areas of concentrated load or maximum moment 2h ≤250 mm.","doc":"concrete-2013-2020ed","pp":"139","tags":["concrete-2013-2020ed","板配筋 Slab detailing","mcq","中級"]},{"id":"CON-112","t":"tf","d":2,"tp":"板配筋 Slab detailing","c":"9.3.2","p":154,"q":"厚度少於 200 mm 的板不應使用抗剪鋼筋。","a":true,"e":"對。9.3.2：<200 mm 板難以彎紮及確保抗剪筋有效，因此不應使用。沖剪不足時要加厚板、用 drop panel 或柱帽。","x":"thick. Therefore, shear reinforcement should not be used in such slabs.","q_en":"Shear reinforcement should not be used in slabs less than 200 mm thick.","e_en":"True. 9.3.2: in slabs <200 mm it is difficult to bend and fix shear reinforcement and ensure its effectiveness, so it should not be used. Where punching shear is inadequate, thicken the slab or use drop panels or column heads.","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","板配筋 Slab detailing","tf","中級"]},{"id":"CON-113","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"懸臂板跨度多於多少時應改用 beam-and-slab 布置？","o":["750 mm","1000 mm","1200 mm","1500 mm"],"a":2,"e":"9.4.1：>1200 mm 應用樑板布置。懸臂板厚度：≤500 mm 跨 110 mm；≤750 mm 125 mm；≤1000 mm 150 mm；≤1200 mm 175 mm。香港曾有簷篷倒塌事故，故 BD 對懸臂構件特別嚴格。","x":"Instead of pure cantilevered slab arrangements, beam-and-slab arrangements should be used for","q_en":"Above what span should a cantilever slab be replaced by a beam-and-slab arrangement?","e_en":"9.4.1: >1200 mm should use a beam-and-slab arrangement. Cantilever slab thickness: span ≤500 mm 110 mm; ≤750 mm 125 mm; ≤1000 mm 150 mm; ≤1200 mm 175 mm. Hong Kong has had canopy collapses, so BD is particularly strict on cantilevered members.","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","mcq","中級"]},{"id":"CON-114","t":"num","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"跨度 900 mm 的懸臂板最少厚度是多少 mm？","a":150,"tol":0,"u":"mm","e":"9.4.1(d)：>750 mm 但 ≤1000 mm → 150 mm。同時要符合 7.3 撓度及外露構件的防水、1:75 排水斜度等要求。","x":"(d) 150 mm for cantilevered slab with span greater than 750 mm but not exceeding 1000 mm;","q_en":"What is the minimum thickness in mm of a cantilever slab with a span of 900 mm?","e_en":"9.4.1(d): >750 mm but ≤1000 mm → 150 mm. Also comply with 7.3 deflection and, for exposed members, waterproofing and a 1:75 drainage fall.","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","num","中級"]},{"id":"CON-115","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.2","p":155,"q":"懸臂構件頂部受拉主筋的中心間距不應大於：","o":["100 mm","150 mm","200 mm","250 mm"],"a":1,"e":"9.4.2：頂筋最少 0.25%、直徑 ≥10 mm、間距 ≤150 mm。要全錨固，錨固起點按 9.4.3 計算，不可按實際應力折減錨固長度。","x":"The centre-to-centre spacing of the top tension longitudinal bars should not be more than 150 mm.","q_en":"The centre-to-centre spacing of the top main tension bars of a cantilevered member should not be greater than:","e_en":"9.4.2: top bars minimum 0.25%, diameter ≥10 mm, spacing ≤150 mm. They must be fully anchored, with the start of anchorage calculated per 9.4.3; anchorage length may not be reduced according to actual stress.","doc":"concrete-2013-2020ed","pp":"141","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","mcq","中級"]},{"id":"CON-116","t":"short","d":3,"tp":"懸臂構件 Cantilevers","c":"9.4.4","p":155,"q":"外露於天氣、跨度超過 750 mm 的外懸臂板，Code 有哪三項額外要求？","m":"(a) 防水混凝土，28 天 characteristic strength ≥35 MPa；(b) 所有主筋按 BS EN ISO 1461 熱浸鍍鋅（hot-dip galvanized）；(c) 設防水膜/tanking，並以 w/c ≤0.65 的 1:3 水泥砂漿保護。","k":["≥35 MPa water-proof concrete","hot-dip galvanized main bars","waterproof membrane + 1:3 mortar"],"e":"這些是 BD 審圖時的常見 checklist 項目。另懸臂應與支承構件同時整體澆築，施工縫不應設在支承構件外邊。","x":"(b) all main steel reinforcing bars should be hot-dip galvanized to BS EN ISO 1461; and","q_en":"What three additional requirements does the Code impose on external cantilever slabs exposed to the weather with spans over 750 mm?","m_en":"(a) Waterproof concrete with 28-day characteristic strength ≥35 MPa; (b) all main bars hot-dip galvanized to BS EN ISO 1461; (c) a waterproof membrane/tanking protected by 1:3 cement mortar with w/c ≤0.65.","e_en":"These are common checklist items in BD plan vetting. The cantilever should also be cast monolithically with its supporting member at the same time, with no construction joint outside the supporting member.","doc":"concrete-2013-2020ed","pp":"141","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","short","進階"]},{"id":"CON-117","t":"num","d":1,"tp":"柱配筋 Column detailing","c":"9.5.1","p":156,"q":"柱總縱向鋼筋不應少於毛截面的多少 %？","a":0.8,"tol":0,"u":"%","e":"9.5.1：≥0.8%，直徑 ≥12 mm，矩形柱最少 4 支、圓柱 6 支。上限：豎向澆築 6%、水平澆築 8%、搭接處 10%（ductility 區 9.9.2 為 4%/搭接 5.2%）。","x":"should not be less than 0.8%. See clause 9.9.2 for ductility requirement.","q_en":"The total longitudinal reinforcement in a column should not be less than what % of the gross section?","e_en":"9.5.1: ≥0.8%, diameter ≥12 mm, minimum 4 bars in rectangular columns and 6 in circular columns. Upper limits: vertically cast 6%, horizontally cast 8%, at laps 10% (ductility zones 9.9.2: 4% / 5.2% at laps).","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","num","基礎"]},{"id":"CON-118","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.5.2.1","p":156,"q":"柱箍筋沿柱的間距不應超過以下哪一組的最小值？","o":["12 × 最小縱筋直徑、柱較小尺寸、400 mm","16 × 最大縱筋直徑、柱較大尺寸、300 mm","8 × 縱筋直徑、200 mm","0.75d、600 mm"],"a":0,"e":"9.5.2.1：min(12φ_min, 柱較小尺寸, 400 mm)；箍筋直徑 ≥ max(6 mm, 1/4 最大縱筋)。Ductility critical zone 更嚴（8φ）。","x":"(a) 12 times the diameter of the smallest longitudinal bar;","q_en":"The spacing of column links along the column should not exceed the least of which group?","o_en":["12 × smallest longitudinal bar diameter, smaller column dimension, 400 mm","16 × largest longitudinal bar diameter, larger column dimension, 300 mm","8 × longitudinal bar diameter, 200 mm","0.75d, 600 mm"],"e_en":"9.5.2.1: min(12φ_min, smaller column dimension, 400 mm); link diameter ≥ max(6 mm, 1/4 of the largest longitudinal bar). Stricter in ductility critical zones (8φ).","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","mcq","中級"]},{"id":"CON-119","t":"num","d":2,"tp":"牆配筋 Wall detailing","c":"9.6.2","p":158,"q":"RC 牆最少豎向鋼筋為混凝土截面的多少 %？","a":0.4,"tol":0,"u":"%","e":"9.6.2：0.4%，若由最少筋控制，每面各一半；最多 4%（搭接可加倍）；豎筋間距 ≤ min(3t, 400 mm)。","x":"wall is 0.4%. Where this minimum area of reinforcement controls in the design, half of the area should","q_en":"The minimum vertical reinforcement in an RC wall is what % of the concrete section?","e_en":"9.6.2: 0.4%, half on each face if governed by the minimum; maximum 4% (may be doubled at laps); vertical bar spacing ≤ min(3t, 400 mm).","doc":"concrete-2013-2020ed","pp":"144","tags":["concrete-2013-2020ed","牆配筋 Wall detailing","num","中級"]},{"id":"CON-120","t":"num","d":2,"tp":"牆配筋 Wall detailing","c":"9.6.3","p":158,"q":"豎筋 ≤2% 時，fy = 500 的牆最少水平鋼筋為混凝土截面的多少 %？","a":0.25,"tol":0,"u":"%","e":"9.6.3：fy 250 → 0.30%；fy 500 → 0.25%；間距 ≤400 mm，直徑 ≥ max(1/4 豎筋, 6 mm)。","x":"(b) fy = 500 N/mm2: 0.25% of concrete cross-sectional area.","q_en":"With vertical reinforcement ≤2%, what is the minimum horizontal reinforcement for a wall with fy = 500, as % of the concrete section?","e_en":"9.6.3: fy 250 → 0.30%; fy 500 → 0.25%; spacing ≤400 mm, diameter ≥ max(1/4 of vertical bar, 6 mm).","doc":"concrete-2013-2020ed","pp":"144","tags":["concrete-2013-2020ed","牆配筋 Wall detailing","num","中級"]},{"id":"CON-121","t":"mcq","d":2,"tp":"混凝土測試 Testing","c":"10.3.4.3","p":174,"q":"鑽芯（cores）驗收：每個芯樣的 estimated in-situ cube strength 至少為指定等級的多少，全組平均至少多少？","o":["65%／75%","75%／85%","85%／95%","90%／100%"],"a":1,"e":"10.3.4.3(e)：每個 ≥75%，平均 ≥85%，按 CS1 計算。立方試驗不合格時常用此補救評估。","x":"each core specimen should be at least 75% of the specified grade strength and the","q_en":"Acceptance of cores: the estimated in-situ cube strength of each core must be at least what proportion of the specified grade, and the average of the set at least what?","o_en":["65% / 75%","75% / 85%","85% / 95%","90% / 100%"],"e_en":"10.3.4.3(e): each ≥75%, average ≥85%, calculated to CS1. Commonly used as a remedial assessment when cube tests fail.","doc":"concrete-2013-2020ed","pp":"160","tags":["concrete-2013-2020ed","混凝土測試 Testing","mcq","中級"]},{"id":"CON-122","t":"num","d":2,"tp":"施工 Construction","c":"10.3.7","p":176,"q":"澆築時混凝土溫度一般不應超過多少 °C？","a":30,"tol":0,"u":"°C","e":"10.3.7：≤30°C，除非證明較高溫度無害。香港夏天 mass pour 常用冰水/夜間澆築。","x":"At the time of placing, the concrete temperature should not exceed 30°C, unless it can be","q_en":"The temperature of concrete at placing should generally not exceed how many °C?","e_en":"10.3.7: ≤30°C, unless higher temperatures are shown to be harmless. In Hong Kong summers, mass pours often use chilled water / night pours.","doc":"concrete-2013-2020ed","pp":"162","tags":["concrete-2013-2020ed","施工 Construction","num","中級"]},{"id":"CON-123","t":"scenario","d":2,"tp":"施工 Construction","c":"10.3.8.2","p":176,"q":"承包商問：受彎構件模板何時可拆？若沒有其他資料，板底模（留撐）及板撐的最短時間是多少？","m":"受彎構件模板可於混凝土強度達 10 N/mm² 或其承受應力兩倍（取較大）時拆除，前提是不會造成不可接受撓度並有適當養護。無其他資料時（Portland cement）：板底模留撐 4 天；樑底模留撐 7 天；板撐 10 天；樑撐及懸臂撐 14 天；側模 12 小時。長跨或 transfer 結構須達指定 cube strength 才可拆撐。","k":["10 N/mm² 或 2 倍應力","板底模 4 天 / 樑底模 7 天","板撐 10 天 / 樑撐 14 天 / 懸臂 14 天","transfer 須達 specified strength","pfa/ggbs 或 <15°C 要延長"],"e":"實務上 RSE 會在圖則註明拆撐要求。Transfer plate 的 propping 更常要求多層 back-propping 並有計算書支持。","x":"concrete in the element is 10 N/mm2 or twice the stress to which it will be subjected, whichever is the","q_en":"The contractor asks when formwork to flexural members may be struck. In the absence of other information, what are the minimum periods for slab soffits (props left under) and slab props?","m_en":"Formwork to flexural members may be struck when the concrete strength reaches 10 N/mm² or twice the stress it will carry (whichever is greater), provided no unacceptable deflection results and curing is adequate. Without other information (Portland cement): slab soffits (props left under) 4 days; beam soffits (props left under) 7 days; slab props 10 days; beam props and cantilever props 14 days; vertical formwork 12 hours. Long-span or transfer structures must reach the specified cube strength before props are removed.","k_en":["10 N/mm² or 2 times the stress","Slab soffit 4 days / beam soffit 7 days","Slab props 10 days / beam props 14 days / cantilever 14 days","Transfer structures must reach specified strength","Extend for pfa/ggbs or <15°C"],"e_en":"In practice the RSE states the prop removal requirements on the drawings. Transfer plate propping more often requires multi-level back-propping supported by calculations.","doc":"concrete-2013-2020ed","pp":"162","tags":["concrete-2013-2020ed","施工 Construction","scenario","中級"]},{"id":"CON-124","t":"mcq","d":3,"tp":"荷載測試 Load test","c":"13.2","p":207,"q":"施工期間結構 load test 的測試荷載一般取以下兩者較大值：","o":["Gk + Qk 或 1.4Gk + 1.6Qk","Gk + 1.25Qk 或 1.125(Gk + Qk)","1.5(Gk + Qk) 或 2Qk","Gk + 1.6Qk 或 1.2(Gk + Qk)"],"a":1,"e":"13.2：W ≥ Gk + Qk，一般取 max(Gk + 1.25Qk, 1.125(Gk+Qk))；至少加載兩次，相隔 ≥1 h。一般不建議加載至 ultimate，以免損害結構。","x":"characteristic dead load and 1.25 times the characteristic imposed load or (b) 1.125 times the sum of","q_en":"The test load for a structural load test during construction is generally the greater of:","o_en":["Gk + Qk or 1.4Gk + 1.6Qk","Gk + 1.25Qk or 1.125(Gk + Qk)","1.5(Gk + Qk) or 2Qk","Gk + 1.6Qk or 1.2(Gk + Qk)"],"e_en":"13.2: W ≥ Gk + Qk, generally max(Gk + 1.25Qk, 1.125(Gk+Qk)); load at least twice, ≥1 h apart. Loading to ultimate is generally not recommended, to avoid damaging the structure.","doc":"concrete-2013-2020ed","pp":"193","tags":["concrete-2013-2020ed","荷載測試 Load test","mcq","進階"]},{"id":"XC-001","doc":"concrete-2013-2020ed","t":"scenario","d":2,"tp":"跨規範 Cross-code","c":"2.3.1.1 / Table 2.1","p":25,"q":"一幢住宅 RC 框架，需要 Dead + Imposed + Wind 的 ULS 組合。說明荷載來源及 Concrete Code Table 2.1 的 γf（dead adverse/beneficial、imposed、wind）。","m":"Characteristic dead/imposed load 按 Code of Practice for Dead and Imposed Loads；Wk 按 Code of Practice on Wind Effects（Concrete 2.3.1.1）。Table 2.1 combination 3：dead 1.2 adverse / 1.0 beneficial、imposed 1.2（beneficial 0）、wind 1.2、earth & water 1.2。Combination 2（dead + wind）：dead 1.4/1.0、wind 1.4。","k":["DIL Code → Gk, Qk","Wind Code → Wk","comb 3: 1.2/1.0, 1.2, 1.2","comb 2: 1.4/1.0, wind 1.4","combination 2/3 須同時考慮 notional horizontal load 2.3.1.4(a)"],"e":"常見錯誤：只檢 combination 3 而漏了 combination 2（dead 1.0 beneficial + wind 1.4 對抗拔/柱拉力往往控制）。","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","r":[{"doc":"concrete-2013-2020ed","p":23,"c":"2.3.1.1","x":"characteristic wind load, Wk, as defined in the Code of Practice on Wind Effects.","pp":"9"}],"q_en":"An RC residential frame needs the Dead + Imposed + Wind ULS combination. State the sources of the loads and the γf values in Concrete Code Table 2.1 (dead adverse/beneficial, imposed, wind).","m_en":"Characteristic dead/imposed loads from the Code of Practice for Dead and Imposed Loads; Wk from the Code of Practice on Wind Effects (Concrete 2.3.1.1). Table 2.1 combination 3: dead 1.2 adverse / 1.0 beneficial, imposed 1.2 (beneficial 0), wind 1.2, earth & water 1.2. Combination 2 (dead + wind): dead 1.4/1.0, wind 1.4.","k_en":["DIL Code → Gk, Qk","Wind Code → Wk","comb 3: 1.2/1.0, 1.2, 1.2","comb 2: 1.4/1.0, wind 1.4","Combination 2/3 must also consider the notional horizontal load of 2.3.1.4(a)"],"e_en":"Common error: checking only combination 3 and missing combination 2 (dead 1.0 beneficial + wind 1.4 often governs uplift/column tension).","pp":"11","tags":["concrete-2013-2020ed","跨規範 Cross-code","scenario","中級","cross"],"cross":1},{"id":"XC-002","doc":"wind-code-2019","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"2.3 / Concrete Table 2.1","p":20,"q":"Wind Code 2019 的 ultimate wind load factor γw = 1.4，與 Concrete Code Table 2.1 哪個組合的 wind γf 相同？","o":["Combination 2（Dead + Wind）","Combination 3（Dead + Imposed + Wind）","Combination 1（Dead + Imposed）","全部組合"],"a":0,"e":"Wind Code 用 γw 1.4 將 SLS 風壓轉為 ULS；Concrete Table 2.1 comb 2 wind 1.4、comb 3 wind 1.2。Wind Code 的 design pressure 是 characteristic（未乘 γw），計算時勿重複乘系數。","x":"ultimate wind load factor, taken as 1.4","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"2 earth and water 1.4 1.0 - - 1.4 1.4","pp":"11"}],"q_en":"The ultimate wind load factor γw = 1.4 in the Wind Code 2019 equals the wind γf of which combination in Concrete Code Table 2.1?","o_en":["Combination 2 (Dead + Wind)","Combination 3 (Dead + Imposed + Wind)","Combination 1 (Dead + Imposed)","All combinations"],"e_en":"The Wind Code uses γw 1.4 to convert SLS wind pressure to ULS; Concrete Table 2.1 comb 2 wind 1.4, comb 3 wind 1.2. The Wind Code design pressure is characteristic (not multiplied by γw) — do not apply the factor twice.","pp":"10","tags":["wind-code-2019","跨規範 Cross-code","mcq","中級","cross"],"cross":1},{"id":"XC-003","doc":"glass-2018","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 5.2","p":25,"q":"Glass Code Table 5.2 的 dead/imposed/wind partial load factors 與 Concrete Code Table 2.1 相同（例如 comb 1：1.4/1.0、1.6；comb 3：1.2），但 Glass 另列 temperature 1.2。","a":true,"e":"正確。玻璃設計沿用相同的 ULS 荷載框架，另加溫度荷載欄（1.2）。SLS 全部 adverse 系數 1.0（Table 5.2 Note b）。幕牆顧問與結構工程師要用同一套荷載。","x":"3 Dead, imposed, wind,","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","pp":"11"}],"q_en":"The dead/imposed/wind partial load factors in Glass Code Table 5.2 are the same as Concrete Code Table 2.1 (e.g. comb 1: 1.4/1.0, 1.6; comb 3: 1.2), but the Glass Code additionally lists temperature at 1.2.","e_en":"True. Glass design follows the same ULS load framework, plus a temperature load column (1.2). At SLS all adverse factors are 1.0 (Table 5.2 Note b). Curtain wall consultants and structural engineers should use the same set of loads.","pp":"17","tags":["glass-2018","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-004","doc":"foundations-2017-2024ed","t":"short","d":2,"tp":"跨規範 Cross-code","c":"2.5.2","p":34,"q":"Foundations Code 2.5.2 規定基礎設計荷載應按哪些規範評估？除上部結構荷載外，imposed load 還應包括甚麼？","m":"按 Code of Practice for Dead and Imposed Loads、Code of Practice on Wind Effects in Hong Kong 及其他相關規範評估。Imposed load 應包括 buoyancy force 及 earth pressure。","k":["Dead and Imposed Loads Code","Wind Effects Code","buoyancy","earth pressure"],"e":"基礎設計常漏算浮力對 pile tension 及地庫抗浮的影響；wind 引致的柱拉力亦須傳到樁。","x":"assessed in accordance with the Code of Practice for Dead and Imposed Loads, Code","r":[{"doc":"foundations-2017-2024ed","p":34,"c":"2.5.2","x":"imposed load should include buoyancy force and earth pressure. Buoyancy force","pp":"26"}],"q_en":"According to Foundations Code 2.5.2, which codes should be used to assess foundation design loads? Besides superstructure loads, what should the imposed load include?","m_en":"Assessed per the Code of Practice for Dead and Imposed Loads, the Code of Practice on Wind Effects in Hong Kong and other relevant codes. Imposed load should include buoyancy force and earth pressure.","e_en":"Foundation designs often miss the effect of buoyancy on pile tension and basement flotation; wind-induced column tension must also be carried down to the piles.","pp":"26","tags":["foundations-2017-2024ed","跨規範 Cross-code","short","中級","cross"],"cross":1},{"id":"XC-005","doc":"foundations-2017-2024ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 5.1 / GG1 Table 10","p":72,"q":"Foundations Code Table 5.1 中 SPT N = 11–30 乾/濕砂的 nh 為 6 600 kN/m²/m。Geoguide 1 Table 10 對 medium dense 乾砂的 nh 為？","o":["6.6 MN/m³（同一數值）","2.2 MN/m³","17.6 MN/m³","4.4 MN/m³"],"a":0,"e":"兩者數值一致（kN/m²/m = kN/m³；6 600 kN/m³ = 6.6 MN/m³），只是單位寫法不同。樁群還要按 Foundations Table 5.2 折減（3D 間距 0.25）。","x":"11 to 30 6 600 4 400","r":[{"doc":"geoguide1-retaining-walls","p":141,"c":"Table 10","x":"nh (dry sand) (MN/m3) 2.2 6.6 17.6","pp":"140"}],"q_en":"In Foundations Code Table 5.1, nh for dry/submerged sand with SPT N = 11–30 is 6 600 kN/m²/m. What is nh for medium dense dry sand in Geoguide 1 Table 10?","o_en":["6.6 MN/m³ (the same value)","2.2 MN/m³","17.6 MN/m³","4.4 MN/m³"],"e_en":"The two values agree (kN/m²/m = kN/m³; 6 600 kN/m³ = 6.6 MN/m³); only the unit notation differs. Pile groups must also be reduced per Foundations Table 5.2 (0.25 at 3D spacing).","pp":"64","tags":["foundations-2017-2024ed","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-006","doc":"foundations-2017-2024ed","t":"num","d":2,"tp":"跨規範 Cross-code","c":"2.6.2 / Precast 2.6.2.1 / Concrete 4.2.7.3","p":39,"q":"Foundations、Precast 及 Concrete 三本 Code 對混凝土 reactive alkali（Na2O equivalent）含量上限一致，是每立方米多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"AAR 控制：三本 Code 都是 3.0 kg/m³。樁及地庫長期潮濕，AAR 風險更高，故 Foundations Code 亦重申。","x":"of concrete should not exceed 3.0 kg.","r":[{"doc":"precast-2016","p":15,"c":"2.6.2.1","x":"cubic metre should not exceed 3.0 kg.","pp":"7"},{"doc":"concrete-2013-2020ed","p":47,"c":"4.2.7.3","x":"should not exceed 3.0 kg;","pp":"33"}],"q_en":"The Foundations, Precast and Concrete Codes agree on the limit of reactive alkali content (Na2O equivalent) of concrete. What is it, in kg per cubic metre?","e_en":"AAR control: 3.0 kg/m³ in all three Codes. Piles and basements are permanently damp, so AAR risk is higher, which is why the Foundations Code restates it.","pp":"31","tags":["foundations-2017-2024ed","跨規範 Cross-code","num","中級","cross"],"cross":1},{"id":"XC-007","doc":"geo-pub-1-2023-deep-excavation","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 6.2 / GG1 Table 6","p":69,"q":"臨時 ELS（GEO Pub 1/2023 PFM）與永久擋土牆（Geoguide 1 Table 6）的 surcharge partial load factor 分別是？","o":["1.3 及 1.5","1.5 及 1.3","1.5 及 1.5","1.0 及 1.5"],"a":0,"e":"ELS 屬臨時工程，地盤上的 surcharge 較易控制，故降至 1.3；永久擋土牆用 1.5。兩者若 surcharge 有利均取 0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","r":[{"doc":"geoguide1-retaining-walls","p":139,"c":"Table 6","x":"Surcharge 1.5(1)","pp":"138"}],"q_en":"What are the surcharge partial load factors for temporary ELS (GEO Pub 1/2023 PFM) and permanent retaining walls (Geoguide 1 Table 6) respectively?","o_en":["1.3 and 1.5","1.5 and 1.3","1.5 and 1.5","1.0 and 1.5"],"e_en":"ELS is temporary works and site surcharge is easier to control, hence reduced to 1.3; permanent retaining walls use 1.5. In both cases take 0 where surcharge is favourable.","pp":"69","tags":["geo-pub-1-2023-deep-excavation","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-008","doc":"geo-pub-1-2023-deep-excavation","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"4.4.1 / GG1 Table 8 Note (6)","p":48,"q":"GEO Pub 1/2023 引用 Geoguide 1：insitu CDG 及 CDV 的 φcv' 下限約 34° 及 30°，可用作 embedded wall 界面摩擦角 δs。","a":true,"e":"正確。Dense soil 中 δs 可取 φcv'；wall adhesion 通常忽略。這些參數影響 waling 靠牆摩擦抵抗角撐 in-plane 力的計算。","x":"granitic and volcanic (tuff and rhyolite) soils respectively. Wall adhesion, cw, is usually","r":[{"doc":"geoguide1-retaining-walls","p":140,"c":"Table 8 Note (6)","x":"completely decomposed volcanics (tuff & rhyolites) is about 34° and 30° respectively.","pp":"139"}],"q_en":"GEO Pub 1/2023 cites Geoguide 1: the lower-bound φcv' of insitu CDG and CDV is about 34° and 30°, which may be used as the wall friction angle δs of an embedded wall.","e_en":"True. In dense soil δs may be taken as φcv'; wall adhesion is usually ignored. These parameters affect the calculation of waling-to-wall friction resisting the in-plane force from struts.","pp":"48","tags":["geo-pub-1-2023-deep-excavation","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-009","doc":"concrete-2013-2020ed","t":"scenario","d":3,"tp":"跨規範 Cross-code","c":"4.3 / Fire Table E4","p":47,"q":"一塊簡支 RC 樓板要求 FRR 120 min。Concrete Code 4.3 與 Fire Code Table E4 如何共同決定 cover 及板厚？","m":"Concrete 4.3：durability cover 未必足夠防火，應按 Fire Code 修改 nominal cover，並符合最小構件尺寸。Fire Table E4（solid RC floor）120 min：板厚 ≥ 125 mm；simply supported cover ≥ 35 mm（continuous 25 mm）。取 durability cover（Concrete 4.2）與 fire cover 較大者。","k":["取較大值","E4 120 min: 125 mm thick","cover 35 mm simply supported / 25 continuous","Concrete 4.3 指向 Fire Code"],"e":"常見錯誤：只按 exposure 定 durability cover 而忽略簡支板 FRR 120 min 需要 35 mm。另 fcu > 60 MPa 要研究高溫下 spalling。","x":"In some circumstances, the cover specified for durability will not be sufficient for fire protection.","r":[{"doc":"fire-safety-2011-2024ed","p":177,"c":"Table E4","x":"simply supported 55* 35 20","pp":"168"},{"doc":"fire-safety-2011-2024ed","p":177,"c":"Table E4","x":"Thickness of concrete 170 125 100","pp":"168"}],"q_en":"A simply supported RC slab requires FRR 120 min. How do Concrete Code 4.3 and Fire Code Table E4 together determine the cover and slab thickness?","m_en":"Concrete 4.3: durability cover may not be adequate for fire; the nominal cover should be modified per the Fire Code and minimum member dimensions met. Fire Table E4 (solid RC floor) 120 min: slab thickness ≥ 125 mm; cover ≥ 35 mm simply supported (25 mm continuous). Take the greater of the durability cover (Concrete 4.2) and the fire cover.","k_en":["Take the greater value","E4 120 min: 125 mm thick","Cover 35 mm simply supported / 25 continuous","Concrete 4.3 refers to the Fire Code"],"e_en":"Common error: setting durability cover by exposure only and overlooking that a simply supported slab with FRR 120 min needs 35 mm. Also, for fcu > 60 MPa, spalling at high temperature must be investigated.","pp":"33","tags":["concrete-2013-2020ed","跨規範 Cross-code","scenario","進階","cross"],"cross":1},{"id":"XC-010","doc":"geoguide1-retaining-walls","t":"short","d":2,"tp":"跨規範 Cross-code","c":"7.2.1 / Table 16","p":69,"q":"設計擋土牆時 surcharge 如何取值？與 Dead and Imposed Loads Code 的關係？","m":"Geoguide 1 7.2.1：最少 10 kPa 均佈 surcharge；鄰近建築物淺基礎可按 Table 16 每層 10 kPa。若牆後有特定用途（道路、貯物等）則按實際荷載評估，可參考 Dead and Imposed Loads Code 的 imposed load。","k":["minimum 10 kPa","10 kPa per storey（淺基礎建築物）","actual loading 按 DIL Code"],"e":"Surcharge 在岩土計算用 Geoguide 1 的 γf 1.5，在牆身結構設計則用 Concrete Code 的 γf，兩者不要混用。DIL Code 3.9.2 亦有每層最少 10 kPa 的類似概念。","x":"A minimum surcharge of 10 kPa with an appropriate","r":[{"doc":"geoguide1-retaining-walls","p":146,"c":"Table 16","x":"Buildings with shallow foundations(1) 10 kPa per storey(2)","pp":"145"},{"doc":"dead-imposed-loads-2011-2021ed","p":21,"c":"3.9.2","x":"structural forms with a minimum value of 10 kPa per storey.","pp":"17"}],"q_en":"How is surcharge taken in retaining wall design? How does it relate to the Dead and Imposed Loads Code?","m_en":"Geoguide 1 7.2.1: a minimum uniform surcharge of 10 kPa; for adjacent buildings on shallow foundations, 10 kPa per storey per Table 16. Where the ground behind the wall has a specific use (roads, storage, etc.), assess the actual loading, with reference to the imposed loads in the Dead and Imposed Loads Code.","k_en":["Minimum 10 kPa","10 kPa per storey (buildings on shallow foundations)","Actual loading per DIL Code"],"e_en":"Surcharge uses the Geoguide 1 γf of 1.5 in geotechnical calculations but the Concrete Code γf in structural design of the wall stem; do not mix them. DIL Code 3.9.2 has a similar concept of a minimum 10 kPa per storey.","pp":"68","tags":["geoguide1-retaining-walls","跨規範 Cross-code","short","中級","cross"],"cross":1},{"id":"XC-011","doc":"concrete-2013-2020ed","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"7.3.2 / Steel EM E5.3.4","p":120,"q":"Concrete Code 7.3.2 及 Steel Code 5.3.4（見 EM）對建築物頂部側移的簡化限值？","o":["H/500","H/300","H/1000","H/250"],"a":0,"e":"兩本 Code 都以 H/500（Wind Code 設計風荷載下）作簡化舒適度/側移準則；Steel 另有 storey height/400 層間位移。超高層應以動力分析或風洞驗證加速度。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","r":[{"doc":"steel-explanatory-materials-2011","p":38,"c":"E5.3.4","x":"The first is to limit the top deflection to Height/500 and the inter storey drift to Storey","pp":"32"}],"q_en":"What is the simplified limit on lateral sway at the top of a building in Concrete Code 7.3.2 and Steel Code 5.3.4 (see EM)?","e_en":"Both Codes use H/500 (under the Wind Code design wind load) as a simplified comfort/sway criterion; the Steel Code also limits inter-storey drift to storey height/400. For super-tall buildings, verify acceleration by dynamic analysis or wind tunnel testing.","pp":"106","tags":["concrete-2013-2020ed","跨規範 Cross-code","mcq","中級","cross"],"cross":1},{"id":"XC-012","doc":"concrete-2013-2020ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"2.3.1.4(a) / Precast 2.3.1","p":24,"q":"Concrete Code 與 Precast Code 的 notional horizontal load 均為每層 characteristic dead load 的 1.5%。","a":true,"e":"正確。Precast 結構的穩定性要求與現澆一致；預製構件接駁必須能傳遞此水平力。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","r":[{"doc":"precast-2016","p":12,"c":"2.3.1","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","pp":"4"}],"q_en":"The notional horizontal load in both the Concrete Code and the Precast Code is 1.5% of the characteristic dead load of each floor.","e_en":"True. The stability requirements for precast structures are the same as for cast-in-place; precast connections must be able to transfer this horizontal force.","pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-013","doc":"concrete-2013-2020ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"2.3.1.4(b) / Steel EM E4.3.5","p":24,"q":"Concrete Code 2.3.1.4(b) 的 key element 設計荷載與 Steel EM 提到的 explosion pressure 均為？","o":["34 kN/m²（不加 partial factor）","34 kN/m² × 1.4","10 kPa","5 kPa × 1.6"],"a":0,"e":"34 kN/m² 為 design ultimate load，不再乘 γf；Steel EM 亦以 34 kN/m² 作 extreme event load。Exceptional combination 中其他 live/wind 取 1/3（Steel Table 4.3 用 0.35）。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","r":[{"doc":"steel-explanatory-materials-2011","p":36,"c":"E4.3.5","x":"wind load factor of 1.05 x 0.33 = 0.35 is given in Table 4.3 of the Code for wind and live","pp":"30"}],"q_en":"The key element design load in Concrete Code 2.3.1.4(b) and the explosion pressure mentioned in the Steel EM are both:","o_en":["34 kN/m² (no partial factor)","34 kN/m² × 1.4","10 kPa","5 kPa × 1.6"],"e_en":"34 kN/m² is a design ultimate load with no further γf; the Steel EM also uses 34 kN/m² as the extreme event load. In the exceptional combination, other live/wind loads take 1/3 (Steel Table 4.3 uses 0.35).","pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-014","doc":"concrete-2013-2020ed","t":"short","d":3,"tp":"跨規範 Cross-code","c":"2.3.1.6 / Steel EM E4.3.1","p":24,"q":"比較 Concrete Code 與 Steel Code（EM 解釋）對 differential settlement 的處理。","m":"Concrete 2.3.1.6：differential settlement 視作 permanent load，γf 取 earth/water pressure 的值（Table 2.1 Note 2）。Steel（EM E4.3.1）：comb 1、2 用 1.4，comb 3 用 1.2；EM 指出鋼結構較具延性，若轉動能力及延性足夠，ULS 一般可不考慮。","k":["Concrete: treated as permanent","Steel: 1.4 / 1.4 / 1.2","ductility → may be ignored at ULS"],"e":"基礎沉降差（Foundations Code 限值）會引致上部結構內力，混合結構要按各自 Code 處理。","x":"Loads induced by differential settlement should be treated as permanent.","r":[{"doc":"steel-explanatory-materials-2011","p":35,"c":"E4.3.1","x":"deformations. However, the Code uses a value of 1.4 for differential settlements in load","pp":"29"}],"q_en":"Compare how the Concrete Code and the Steel Code (as explained in the EM) treat differential settlement.","m_en":"Concrete 2.3.1.6: differential settlement is treated as a permanent load, with γf taken as for earth/water pressure (Table 2.1 Note 2). Steel (EM E4.3.1): 1.4 for comb 1 and 2, 1.2 for comb 3; the EM notes that steel structures are more ductile, and if rotation capacity and ductility are adequate it may generally be ignored at ULS.","e_en":"Differential foundation settlement (Foundations Code limits) induces forces in the superstructure; mixed structures must be dealt with under their respective Codes.","pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","short","進階","cross"],"cross":1},{"id":"XC-015","doc":"foundations-2017-2024ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 2.1 / Geoguide 3 Table 12","p":20,"q":"Foundations Code Table 2.1 的 presumed bearing value 分類（例如 dense: SPT N 30–50）與 Geoguide 3 Table 12 的 compactness 分級一致。","a":true,"e":"正確。Foundations Table 2.1 用 very dense > 50、dense 30–50、medium dense 10–30、loose 4–10，與 Geoguide 3 Table 12 的分界相同。鑽孔記錄用 Geoguide 3 描述，直接對應 Foundations Code 的承載力分類。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","r":[{"doc":"geoguide3-rock-soil-descriptions","p":80,"c":"Table 12","x":"Very dense > 50","pp":"79"}],"q_en":"The presumed bearing value categories in Foundations Code Table 2.1 (e.g. dense: SPT N 30–50) are consistent with the compactness classes in Geoguide 3 Table 12.","e_en":"True. Foundations Table 2.1 uses very dense > 50, dense 30–50, medium dense 10–30, loose 4–10 — the same boundaries as Geoguide 3 Table 12. Borehole logs described per Geoguide 3 map directly onto the bearing categories of the Foundations Code.","pp":"12","tags":["foundations-2017-2024ed","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-016","doc":"precast-2016","t":"tf","d":1,"tp":"跨規範 Cross-code","c":"2.4.3","p":13,"q":"Precast Code 規定預製構件的 cover 不應少於 Concrete Code 對 RC 的規定。","a":true,"e":"正確。雖然工廠質量控制較好，但 cover 並無放寬；防火 cover 仍按 Fire Code。","x":"Cover for precast elements should be no less than those specified for reinforced concrete","q_en":"The Precast Code requires that the cover to precast members should not be less than that required by the Concrete Code for RC.","e_en":"True. Although factory quality control is better, cover is not relaxed; fire cover still follows the Fire Code.","pp":"5","tags":["precast-2016","跨規範 Cross-code","tf","基礎","cross"],"cross":1},{"id":"DIL-001","t":"tf","d":1,"tp":"總則 General","c":"1.1.3","p":5,"q":"Dead and Imposed Loads Code 內的荷載數值是 factored values，做 limit state design 時不可直接當 characteristic loads 使用。","a":false,"e":"錯。Code 1.1.3 明言所有荷載均為 unfactored values，可直接當 characteristic loads，再乘 Concrete/Steel Code 的 partial load factors (γf)。常見錯誤：把 Table 3.2 的數值當成已放大，漏乘 1.6。","x":"All values of loads given in this Code are unfactored values and may be taken as characteristic loads when carrying out design using limit state method.","q_en":"The load values in the Dead and Imposed Loads Code are factored values and cannot be used directly as characteristic loads in limit state design.","e_en":"False. Code 1.1.3 states that all loads are unfactored values and may be used directly as characteristic loads, to be multiplied by the partial load factors (γf) of the Concrete/Steel Codes. Common error: treating the Table 3.2 values as already factored and omitting the 1.6.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","tags":["dead-imposed-loads-2011-2021ed","總則 General","tf","基礎"]},{"id":"DIL-002","t":"tf","d":1,"tp":"總則 General","c":"1.1.4","p":5,"q":"Construction loads（施工荷載）已包括在 Dead and Imposed Loads Code 的 imposed loads 內，設計者毋須另行考慮。","a":false,"e":"錯。1.1.4 指 construction loads 不在 Code 範圍，設計者須自行考慮，例如 transfer plate 澆築時的濕混凝土、模板、堆料。提交圖則時如有特別施工次序（如 propping），應在計算書交代。","x":"Construction loads are not covered by this Code and the designer should consider the relevant construction loads and effect thereof as part of their design.","q_en":"Construction loads are included in the imposed loads of the Dead and Imposed Loads Code, so the designer need not consider them separately.","e_en":"False. 1.1.4 states that construction loads are outside the scope of the Code and must be considered by the designer, e.g. wet concrete, formwork and stacked materials when casting a transfer plate. Where a special construction sequence (e.g. propping) applies, explain it in the calculations submitted with the plans.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","tags":["dead-imposed-loads-2011-2021ed","總則 General","tf","基礎"]},{"id":"DIL-003","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.1.2","p":6,"q":"水缸（tanks）及其儲水應如何分類？","o":["水缸重量及儲水均屬 dead load","水缸重量屬 dead load，儲水屬 imposed load","水缸重量及儲水均屬 imposed load","兩者均可不計"],"a":1,"e":"2.1.2：容器本身重量為 dead load，內容物為 imposed load。實務上天台水缸（roof tank）水重應按 imposed load 乘 γf=1.6，而且不應把它當永久荷載去抵抗 uplift 或 overturning。","x":"The weights of tanks and other receptacles shall be considered as dead loads. The contents of tanks and receptacles shall be considered as imposed loads.","q_en":"How should tanks and their stored water be classified?","o_en":["Both the tank weight and the stored water are dead load","The tank weight is dead load; the stored water is imposed load","Both the tank weight and the stored water are imposed load","Neither needs to be considered"],"e_en":"2.1.2: the self-weight of the container is dead load and its contents are imposed load. In practice, water in a roof tank should be treated as imposed load with γf=1.6, and should not be relied on as a permanent load to resist uplift or overturning.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","mcq","基礎"]},{"id":"DIL-004","t":"short","d":2,"tp":"恆載 Dead loads","c":"2.1.3","p":6,"q":"若對某荷載是否永久存在（permanency）有疑問，Code 要求如何處理？對荷載折減有何影響？","m":"應把該荷載當作 imposed load 處理，而且按 clause 3.7 對 beams 及 vertical members 的 imposed load reduction 不應套用於此荷載。","k":["疑問時當 imposed load","不可按 3.7 折減","亦列於 3.7.1(h)"],"e":"2.1.3 是保守原則：例如業主可能移走的厚身花槽、不確定的設備基座。當 imposed load 處理令 γf 由 1.4 變 1.6，且不能在柱折減中「賺返」，避免高估安全度。","x":"When there is doubt to the permanency of loads, such loads should be treated as imposed loads while reduction of which under clause 3.7 should not be taken on beams and vertical members.","q_en":"If there is doubt about the permanency of a load, how does the Code require it to be treated? What is the effect on load reduction?","m_en":"The load should be treated as imposed load, and the imposed load reduction for beams and vertical members under clause 3.7 should not be applied to it.","k_en":["Treat as imposed load when in doubt","No reduction under 3.7","Also listed in 3.7.1(h)"],"e_en":"2.1.3 is a conservative principle: e.g. heavy planters the owner may remove, or uncertain equipment plinths. Treating them as imposed load changes γf from 1.4 to 1.6, and the load cannot be \"clawed back\" through column load reduction, avoiding an overestimate of safety.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","short","中級"]},{"id":"DIL-005","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.2.2.2","p":6,"q":"建築圖則上未有顯示位置、但預計會有的 partitions，其重量應當作：","o":["Dead load，按實際排位計算","Imposed load，按 clause 3.6 計算","Wind load","毋須考慮"],"a":1,"e":"2.2.2.2：未在 building plans 顯示位置的間隔牆屬 imposed load（按 3.6 以 1/3 牆重/米計，office 不少於 1 kPa）。已顯示在核准圖則上的則屬 dead load（2.2.2.1）。","x":"Where partitions are envisaged but the location of which are not indicated on the building plans, the weights of these partitions shall be considered as imposed loads and to be calculated in accordance with clause 3.6.","q_en":"The weight of partitions that are expected but whose positions are not shown on the building plans should be treated as:","o_en":["Dead load, calculated from the actual layout","Imposed load, calculated per clause 3.6","Wind load","Need not be considered"],"e_en":"2.2.2.2: partitions whose positions are not shown on the building plans are imposed load (per 3.6, 1/3 of the wall weight per metre, not less than 1 kPa for offices). Those shown on approved plans are dead load (2.2.2.1).","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","mcq","基礎"]},{"id":"DIL-006","t":"tf","d":1,"tp":"恆載 Dead loads","c":"2.2.3.2","p":6,"q":"天台綠化（roof greenery）的泥土、防水及排水系統與植物重量應當作 dead load。","a":true,"e":"對。2.2.3.2 規定 greenery 的泥土、防水、排水及植物屬 dead load。實務上要留意泥土飽和水重（saturated density）及日後加厚泥層的可能，並在圖則註明最大泥深。","x":"Where a roof is to be provided with greenery, the weight of soil, waterproofing and drainage system, and plants for greenery shall be taken as dead loads.","q_en":"The weight of soil, waterproofing, drainage systems and plants of roof greenery should be treated as dead load.","e_en":"True. 2.2.3.2 classifies the soil, waterproofing, drainage and plants of greenery as dead load. In practice, note the saturated density of the soil and the possibility of thicker soil later, and state the maximum soil depth on the drawings.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","tf","基礎"]},{"id":"DIL-007","t":"num","d":2,"tp":"恆載 Dead loads","c":"2.2.5.1","p":7,"q":"骨灰龕場的重型龕位（如混凝土龕位），重量不應少於每米高每米長多少 kN/m？","a":4.5,"tol":0,"u":"kN/m per m height","e":"2.2.5.1：輕型龕位（木或輕金屬）≥2.0 kN/m 每米高，重型（混凝土）≥4.5 kN/m 每米高，另加骨灰甕重量。Columbaria 樓面走道（非龕位範圍）按 Table 3.2 取 4.0 kPa。","x":"For heavy weight niches, such as niches made of concrete, the weight shall be not less than 4.5 kN/m length for each metre height.","q_en":"For heavy niches in a columbarium (e.g. concrete niches), the weight should not be less than how many kN/m per metre height per metre length?","e_en":"2.2.5.1: light niches (timber or light metal) ≥2.0 kN/m per metre height, heavy (concrete) ≥4.5 kN/m per metre height, plus the weight of urns. Circulation areas of columbaria (outside niche areas) take 4.0 kPa per Table 3.2.","doc":"dead-imposed-loads-2011-2021ed","pp":"3","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","num","中級"]},{"id":"DIL-008","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"3.1.4","p":8,"q":"Table 3.2 中的 qk 與 Qk 應如何施加？","o":["兩者同時疊加施加","分開考慮（considered separately），取最不利者","只需考慮 qk","只需考慮 Qk"],"a":1,"e":"3.1.3–3.1.4：qk 與 Qk 分開考慮，取較不利者。Qk 主要控制局部 punching / 薄板 / 短跨構件；常見錯誤是把 Qk 疊加在 qk 上，過度保守。","x":"The uniformly distributed load, qk, and the concentrated load or line load, Qk, shall be considered separately.","q_en":"How should qk and Qk in Table 3.2 be applied?","o_en":["Both applied together, superimposed","Considered separately, taking the more onerous","Only qk need be considered","Only Qk need be considered"],"e_en":"3.1.3–3.1.4: qk and Qk are considered separately and the more onerous is taken. Qk mainly governs local punching / thin slabs / short-span members; a common error is to add Qk on top of qk, which is over-conservative.","doc":"dead-imposed-loads-2011-2021ed","pp":"4","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","基礎"]},{"id":"DIL-009","t":"num","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：一般用途寫字樓（Offices for general use）的 qk 是多少 kPa？","a":3.0,"tol":0,"u":"kPa","e":"Offices for general use：qk = 3.0 kPa，Qk = 4.5 kN。注意 office 內 storage/filing 用途要升至 5.0 kPa（Class 5），而且不可按 3.7 折減；另如間隔牆位置未定，須再加 ≥1 kPa。","x":"Offices for general use 3.0 4.5","q_en":"Table 3.2: what is qk for offices for general use, in kPa?","e_en":"Offices for general use: qk = 3.0 kPa, Qk = 4.5 kN. Note that storage/filing use within offices must be raised to 5.0 kPa (Class 5) and cannot be reduced under 3.7; and if partition positions are undetermined, add ≥1 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","基礎"]},{"id":"DIL-010","t":"num","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：住宅用途（Domestic uses）樓面的 qk 是多少 kPa？","a":2.0,"tol":0,"u":"kPa","e":"Class 1 Domestic uses：qk 2.0 kPa、Qk 2.0 kN。住宅廚房、浴室亦同為 2.0 kPa，但 Jacuzzi 須另行評估。住宅 balconies 及 utility platforms 則按 Table 3.9（Class 8）另有下限。","x":"Domestic uses 2.0 2.0","q_en":"Table 3.2: what is qk for floors for domestic uses, in kPa?","e_en":"Class 1 domestic uses: qk 2.0 kPa, Qk 2.0 kN. Domestic kitchens and bathrooms are also 2.0 kPa, but Jacuzzis must be assessed separately. Domestic balconies and utility platforms have separate lower bounds under Table 3.9 (Class 8).","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","基礎"]},{"id":"DIL-011","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"以下哪一項用途在 Table 3.2 中 qk = 5.0 kPa？","o":["Classrooms","Restaurants","Public halls, theatres, cinemas","Childcare centers"],"a":2,"e":"Public halls、theatres、cinemas 屬 3B fixed seating 但 qk 5.0 kPa；Restaurants 4.0 kPa；Classrooms 3.0 kPa；Childcare centres 2.5 kPa。改變用途（例如商場改戲院）須重新檢核樓面荷載，屬 alteration and addition works 常見問題。","x":"Public halls, theatres, cinemas 5.0 4.5","q_en":"Which of the following uses has qk = 5.0 kPa in Table 3.2?","e_en":"Public halls, theatres and cinemas are 3B fixed seating but qk 5.0 kPa; restaurants 4.0 kPa; classrooms 3.0 kPa; child care centres 2.5 kPa. A change of use (e.g. mall to cinema) requires the floor loading to be rechecked — a common issue in alteration and addition works.","doc":"dead-imposed-loads-2011-2021ed","pp":"6","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","中級"]},{"id":"DIL-012","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"避難層（refuge floors）按 Table 3.2 的 qk 是多少 kPa？","a":5.0,"tol":0,"u":"kPa","e":"Refuge floor 歸入 3C（Assembly areas without fixed seating）qk = 5.0 kPa。高樓設計時 refuge floor 常同時是 transfer / outrigger 層，荷載取值要與 Fire Safety Code 的 refuge floor 要求一併考慮。","x":"Assembly areas without fixed 5.0 4.5","q_en":"What is qk for refuge floors under Table 3.2, in kPa?","e_en":"Refuge floors fall under 3C (assembly areas without fixed seating), qk = 5.0 kPa. In tall buildings the refuge floor is often also a transfer / outrigger level; the loading must be considered together with the refuge floor requirements of the Fire Safety Code.","doc":"dead-imposed-loads-2011-2021ed","pp":"6","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-013","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"舞台（Stages）的 qk 是多少 kPa？","a":7.5,"tol":0,"u":"kPa","e":"Stages、television studios used as stages：qk 7.5 kPa，Qk 9.0 kN，是 Class 3 中最高值。學校禮堂舞台常被忽略而按 5.0 kPa 設計。","x":"Stages, television studios used as 7.5 9.0 stages","q_en":"What is qk for stages, in kPa?","e_en":"Stages and television studios used as stages: qk 7.5 kPa, Qk 9.0 kN — the highest value in Class 3. School hall stages are often overlooked and designed for 5.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"7","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-014","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"機房（Plant rooms, boiler rooms, fan rooms, motor rooms）的最低 imposed load 是：","o":["5.0 kPa / 4.5 kN","7.5 kPa / 9.0 kN","10.0 kPa / 9.0 kN","3.0 kPa / 4.5 kN"],"a":1,"e":"Plant rooms 7.5 kPa、Qk 9.0 kN。實際設備如 chiller、transformer 往往更重，應向 BS/MEP 取得設備重量，按 3.1.2「minimum values」原則取較大者，並考慮設備基座（plinth）重量。","x":"Plant rooms, boiler rooms, fan 7.5 9.0","q_en":"The minimum imposed load for plant rooms (boiler rooms, fan rooms, motor rooms) is:","e_en":"Plant rooms 7.5 kPa, Qk 9.0 kN. Actual equipment such as chillers and transformers is often heavier; obtain equipment weights from the BS/MEP engineers, take the greater value under the \"minimum values\" principle of 3.1.2, and include the weight of equipment plinths.","doc":"dead-imposed-loads-2011-2021ed","pp":"8","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","中級"]},{"id":"DIL-015","t":"num","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"重型工業用途工場（workshops/factories for heavy weight loads）的 qk 是多少 kPa？","a":10.0,"tol":0,"u":"kPa","e":"工業樓面：light 5.0、medium 7.5、heavy 10.0、printing plants 12.5 kPa（Qk 均 9.0 kN）。工業大廈須按 3.11 在每層樓梯張貼 designed distributed imposed load 告示。","x":"(c) for heavy weight loads 10.0 9.0","q_en":"What is qk for workshops/factories for heavy weight loads, in kPa?","e_en":"Industrial floors: light 5.0, medium 7.5, heavy 10.0, printing plants 12.5 kPa (Qk 9.0 kN in all cases). Industrial buildings must display notices of the designed distributed imposed load at the staircase on each floor per 3.11.","doc":"dead-imposed-loads-2011-2021ed","pp":"8","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","num","中級"]},{"id":"DIL-016","t":"mcq","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.3","p":13,"q":"消防車（Fire engines）可到達的區域屬哪一個 Area Class？","o":["6A","6B","6C","6D"],"a":3,"e":"Table 3.3：6D 為不超過 30,000 kg 的車輛，例子包括 fire engines、refuse collection vehicles。EVA 設計另須按 3.3.3 檢核 230 kN 及 100 kN 集中荷載。","x":"30,000 kg gross weight","q_en":"Areas accessible to fire engines belong to which Area Class?","e_en":"Table 3.3: 6D is for vehicles not exceeding 30,000 kg, with examples including fire engines and refuse collection vehicles. EVA design must additionally check concentrated loads of 230 kN and 100 kN per 3.3.3.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","mcq","中級"]},{"id":"DIL-017","t":"scenario","d":2,"tp":"車輛荷載 Vehicular loads","c":"3.3.3","p":13,"q":"一個平台（podium）上的 Emergency Vehicular Access (EVA)，除 Table 3.5/3.6 的 6D 荷載外，還要檢核哪些集中荷載？","m":"要另外檢核：230 kN 集中荷載均布於 950 mm × 750 mm 面積，以及 100 kN 集中荷載均布於 300 mm × 300 mm 面積。","k":["230 kN over 950 mm × 750 mm","100 kN over 300 mm × 300 mm","屬額外檢核（in addition）"],"e":"3.3.3 是 EVA 板 punching shear 及局部彎矩的控制情況。常見錯誤：只按 6D 均布荷載設計，忘記消防車 outrigger/jack 的局部荷載；亦要同時考慮 soil cover 作荷載擴散。","x":"load of 230 kN uniformly distributed on plan over an area of 950 mm","q_en":"For an Emergency Vehicular Access (EVA) on a podium, besides the 6D loads of Table 3.5/3.6, which concentrated loads must be checked?","m_en":"Additionally check: a 230 kN concentrated load uniformly distributed over an area of 950 mm × 750 mm, and a 100 kN concentrated load uniformly distributed over an area of 300 mm × 300 mm.","k_en":["230 kN over 950 mm × 750 mm","100 kN over 300 mm × 300 mm","These are additional checks (in addition)"],"e_en":"3.3.3 is the governing case for punching shear and local moments in EVA slabs. Common error: designing only for the 6D uniform load and forgetting the local loads from fire engine outriggers/jacks; also consider load dispersal through soil cover.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","scenario","中級"]},{"id":"DIL-018","t":"num","d":1,"tp":"車輛荷載 Vehicular loads","c":"Table 3.4","p":13,"q":"私家車停車場（Area Class 6A）的 Qk 是多少 kN？","a":20.0,"tol":0,"u":"kN","e":"Table 3.4：6A qk 3.0 kPa、Qk 20.0 kN（施加於 200 mm 方形面積）。雙層泊車（double-deck parking）時 qk 要加倍（3.3.5.3）。","x":"Class qk (kPa) Qk (kN) 6A 3.0 20.0","q_en":"What is Qk for private car parks (Area Class 6A), in kN?","e_en":"Table 3.4: 6A qk 3.0 kPa, Qk 20.0 kN (applied over a 200 mm square). For double-deck parking, qk is doubled (3.3.5.3).","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","num","基礎"]},{"id":"DIL-019","t":"tf","d":2,"tp":"車輛荷載 Vehicular loads","c":"3.3.5.3","p":13,"q":"6A 停車場如需提供雙層泊車（double-deck parking），qk 應取 Table 3.4 數值的兩倍。","a":true,"e":"對。3.3.5.3 規定 double-deck parking 時 qk 取兩倍（即 6.0 kPa）。機械泊車系統的支承點荷載亦應向供應商索取並檢核。","x":"Where provision for double-deck parking is required for Area Class 6A, the uniformly distributed load, qk, shall be twice the value given in Table 3.4.","q_en":"If a 6A car park needs to provide double-deck parking, qk should be taken as twice the value in Table 3.4.","e_en":"True. 3.3.5.3 requires qk to be doubled (i.e. 6.0 kPa) for double-deck parking. Support point loads of mechanical parking systems should also be obtained from the supplier and checked.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","tf","中級"]},{"id":"DIL-020","t":"num","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.5","p":13,"q":"Area Class 6C 的集中荷載 Qk 是多少 kN？","a":60.0,"tol":0,"u":"kN","e":"Table 3.5：6B 30 kN、6C 60 kN、6D 80 kN；qk 則按 Table 3.6 的 loaded length 決定。6C/6D 的 Qk 施加於 300 mm 方形（3.3.6.3）。","x":"6C See Table 3.6 60.0","q_en":"What is the concentrated load Qk for Area Class 6C, in kN?","e_en":"Table 3.5: 6B 30 kN, 6C 60 kN, 6D 80 kN; qk depends on the loaded length per Table 3.6. Qk for 6C/6D is applied over a 300 mm square (3.3.6.3).","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","num","中級"]},{"id":"DIL-021","t":"mcq","d":3,"tp":"車輛荷載 Vehicular loads","c":"3.3.7","p":15,"q":"Area Class 6E 如不按 HB loading 設計而採用修改後的 HA loading，knife edge load 應取：","o":["20 kN/m","40 kN/m","100 kN/m","120 kN/m"],"a":1,"e":"3.3.7(b)：knife edge load 取 40 kN/m，垂直於 loaded length；notional lane width 取 3 m；single wheel load 100 kN 另行評估。車輛的 centrifugal、braking 等次要荷載在停車場結構毋須考慮。","x":"the knife edge load shall be taken as 40 kN/m applied in the direction perpendicular to","q_en":"If Area Class 6E is designed with modified HA loading instead of HB loading, the knife edge load should be taken as:","e_en":"3.3.7(b): knife edge load 40 kN/m, perpendicular to the loaded length; notional lane width 3 m; the 100 kN single wheel load is assessed separately. Secondary vehicle loads such as centrifugal and braking forces need not be considered for car park structures.","doc":"dead-imposed-loads-2011-2021ed","pp":"11","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","mcq","進階"]},{"id":"DIL-022","t":"num","d":1,"tp":"天台荷載 Roofs","c":"Table 3.8","p":15,"q":"Class 7A 不可到達天台（inaccessible roof），坡度 ≤ 5° 時 qk 是多少 kPa？","a":0.75,"tol":0,"u":"kPa","e":"Table 3.8：7A 坡度 ≤20° 時 qk 0.75 kPa（Qk 1.5 kN），20°–40° 之間線性內插至 0，≥40° 為 0。注意 inaccessible 指只供維修進出；如有住客可上落，要按 7B/7C 取 ≥2.0 kPa。","x":"Greater than 5º but of","q_en":"For a Class 7A inaccessible roof with slope ≤ 5°, what is qk in kPa?","e_en":"Table 3.8: 7A with slope ≤20°: qk 0.75 kPa (Qk 1.5 kN), linearly interpolated to 0 between 20° and 40°, 0 at ≥40°. Note that inaccessible means access for maintenance only; if occupants have access, use 7B/7C at ≥2.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"11","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","num","基礎"]},{"id":"DIL-023","t":"mcq","d":2,"tp":"天台荷載 Roofs","c":"Table 3.8","p":16,"q":"混凝土簷篷（Concrete canopy, Class 7D）的 qk 是：","o":["0.75 kPa","1.5 kPa","2.0 kPa","3.0 kPa"],"a":2,"e":"Table 3.8：lightweight canopy 0.75 kPa（不包括維修時堆積雜物），concrete canopy 2.0 kPa（已包括維修時堆積的建築物料及雜物）。常見錯誤：混凝土簷篷只用 0.75 kPa。","x":"The value of qk takes into account of additional loads due to accumulations of construction materials and","q_en":"The qk for a concrete canopy (Class 7D) is:","e_en":"Table 3.8: lightweight canopy 0.75 kPa (excluding accumulation of debris during maintenance); concrete canopy 2.0 kPa (including accumulation of building materials and debris during maintenance). Common error: using only 0.75 kPa for concrete canopies.","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","mcq","中級"]},{"id":"DIL-024","t":"num","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":16,"q":"Utility platforms 的 qk 不應少於多少 kPa？","a":4.0,"tol":0,"u":"kPa","e":"Table 3.9：Utility platforms「Same as the floors to which they give access but not less than 4.0」kPa，另加 2.0 kN/m 沿外緣線荷載；Balconies 下限 3.0 kPa。住宅設計常錯用 2.0 kPa。","x":"access but not less along the outer edge","q_en":"The qk for utility platforms should not be less than how many kPa?","e_en":"Table 3.9: utility platforms \"Same as the floors to which they give access but not less than 4.0\" kPa, plus a 2.0 kN/m line load along the outer edge; balconies lower bound 3.0 kPa. Residential designs often wrongly use 2.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","num","中級"]},{"id":"DIL-025","t":"num","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":17,"q":"樓梯、平台及走廊（Stairs, landings and corridors）的集中荷載 Qk 是多少 kN？","a":4.5,"tol":0,"u":"kN","e":"Table 3.9：Stairs, landings and corridors qk 與所通往樓面相同，但不少於 3.0 及不多於 5.0 kPa；Qk 4.5 kN。住宅梯級板 Qk 4.5 kN 常控制薄 waist slab。","x":"Stairs, landings and corridors access but not less 4.5","q_en":"What is the concentrated load Qk for stairs, landings and corridors, in kN?","e_en":"Table 3.9: stairs, landings and corridors qk same as the floors they serve, but not less than 3.0 and not more than 5.0 kPa; Qk 4.5 kN. For residential stair flights, Qk 4.5 kN often governs thin waist slabs.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","num","中級"]},{"id":"DIL-026","t":"scenario","d":2,"tp":"間隔牆 Partitions","c":"3.6.1","p":17,"q":"某寫字樓樓面日後由租戶自行加建輕質間隔（位置未在建築圖則顯示），每米長間隔牆重 2.4 kN/m。按 3.6.1 應取多少 partition allowance？","m":"按 3.6.1：(a) 1/3 × 2.4 = 0.8 kPa；但 (b) 寫字樓用途不少於 1 kPa，故取 1.0 kPa，並作為 imposed load 疊加在 3.0 kPa 之上。","k":["1/3 牆重每米長 = 0.8 kPa","Office 最低 1 kPa → 取 1.0 kPa","屬 imposed load，不可按 3.7 折減（3.7.1(g)）"],"e":"實務上寫字樓樓面通常以 3.0 + 1.0 kPa 設計。Partition load 屬 imposed load（γf 1.6），而且在柱荷載折減時要扣除（3.7.1(g)）。","x":"(b) not less than 1 kPa if the floor is used for office purposes.","q_en":"On an office floor, tenants will later add lightweight partitions (positions not shown on the building plans) weighing 2.4 kN/m per metre length. What partition allowance should be taken under 3.6.1?","m_en":"Under 3.6.1: (a) 1/3 × 2.4 = 0.8 kPa; but (b) not less than 1 kPa for office use, so take 1.0 kPa, as imposed load added to the 3.0 kPa.","k_en":["1/3 of wall weight per metre = 0.8 kPa","Office minimum 1 kPa → take 1.0 kPa","Imposed load, not reducible under 3.7 (3.7.1(g))"],"e_en":"In practice office floors are usually designed for 3.0 + 1.0 kPa. Partition load is imposed load (γf 1.6) and must be excluded from column load reduction (3.7.1(g)).","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","間隔牆 Partitions","scenario","中級"]},{"id":"DIL-027","t":"mcq","d":2,"tp":"荷載折減 Reduction","c":"3.7.1","p":17,"q":"以下哪種荷載可以按 clause 3.7 折減？","o":["寫字樓的 storage and filing 荷載","車輛荷載","一般寫字樓 3.0 kPa 樓面荷載","未定位置的間隔牆荷載"],"a":2,"e":"3.7.1 列明不可折減的荷載：指定的機器、工廠 <7.5 kPa、車輛、office storage/filing、動力、storage、未定位置間隔牆、不確定永久性荷載。一般 office 3.0 kPa 則可折減。","x":"(d) floor loads from storage and filing in offices;","q_en":"Which of the following loads may be reduced under clause 3.7?","o_en":["Storage and filing loads in offices","Vehicle loads","Ordinary office floor load of 3.0 kPa","Partition load with undetermined positions"],"e_en":"3.7.1 lists loads that may not be reduced: specified machinery, factories <7.5 kPa, vehicles, office storage/filing, dynamic loads, storage, partitions with undetermined positions and loads of uncertain permanency. The ordinary office 3.0 kPa may be reduced.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","mcq","中級"]},{"id":"DIL-028","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.10","p":17,"q":"一條單跨樑承托 135 m² 樓面面積，其總分布 imposed load 可折減多少百分比？","a":15,"tol":0,"u":"%","e":"Table 3.10：<45 m² 0%、45 m² 5%、90 m² 10%、135 m² 15%、180 m² 20%（最多）。中間值可線性內插，但 45 m² 以下不可內插。樑的折減不能帶落柱（3.7.2.2）。","x":"90 10 135 15 180 20 maximum","q_en":"A single-span beam supports 135 m² of floor area. By what percentage may its total distributed imposed load be reduced?","e_en":"Table 3.10: <45 m² 0%, 45 m² 5%, 90 m² 10%, 135 m² 15%, 180 m² 20% (maximum). Intermediate values may be interpolated linearly, but not below 45 m². Beam reductions are not carried down to columns (3.7.2.2).","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","num","中級"]},{"id":"DIL-029","t":"tf","d":2,"tp":"荷載折減 Reduction","c":"3.7.2.2","p":18,"q":"樑按 Table 3.10 折減後的 imposed load 可直接用於設計承托該樑的柱。","a":false,"e":"錯。3.7.2.2：樑的折減只適用於該樑本身；柱要另按 Table 3.11 以樓層數折減。電腦模型中若同時開啟兩種折減要特別留意重複折減。","x":"The reduced imposed loads on beams shall not be applicable to the design of vertical members supporting the beams.","q_en":"The imposed load on a beam reduced per Table 3.10 may be used directly in designing the column supporting that beam.","e_en":"False. 3.7.2.2: the beam reduction applies only to the beam itself; columns are reduced separately by number of floors per Table 3.11. Beware of double reduction if both reductions are switched on in a computer model.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","tf","中級"]},{"id":"DIL-030","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.11","p":18,"q":"一條柱承托 6 層（包括天台）合資格折減的樓面，total distributed imposed load 可折減多少百分比？","a":25,"tol":0,"u":"%","e":"Table 3.11：1 層 0%，每多一層加 5%，8 層 35%，超過 8 層最多 40%。只計算合資格折減的樓層（例如停車場層不計）。","x":"4 15 5 20 6 25 7 30","q_en":"A column supports 6 floors (including the roof) that qualify for reduction. By what percentage may the total distributed imposed load be reduced?","e_en":"Table 3.11: 1 floor 0%, plus 5% per additional floor, 8 floors 35%, over 8 floors maximum 40%. Only floors qualifying for reduction are counted (e.g. car park floors are not).","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","num","中級"]},{"id":"DIL-031","t":"mcq","d":3,"tp":"荷載折減 Reduction","c":"Table 3.12","p":18,"q":"工場樓面（≥7.5 kPa）按 Table 3.12 折減時，每層折減後的 imposed load 最低不可少於：","o":["5.0 kPa","7.5 kPa","10.0 kPa","沒有下限"],"a":1,"e":"Table 3.12 註：折減後每層不可低於 7.5 kPa；超過 3 層最多折減 25%。工業大廈柱設計常用此表。","x":"Note: In no case can the reduced imposed load at each floor be less than 7.5 kPa.","q_en":"When workshop floors (≥7.5 kPa) are reduced per Table 3.12, the reduced imposed load on each floor must not be less than:","o_en":["5.0 kPa","7.5 kPa","10.0 kPa","No lower limit"],"e_en":"Table 3.12 note: after reduction, not less than 7.5 kPa per floor; maximum reduction 25% for more than 3 floors. Commonly used for column design in industrial buildings.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","mcq","進階"]},{"id":"DIL-032","t":"num","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"容易擠擁區域（Areas susceptible to overcrowding）的護欄 line load 是多少 kN/m？","a":3.0,"tol":0,"u":"kN/m","e":"Table 3.13：不預期聚集 0.75 kN/m；可聚集但不擠擁 1.5 kN/m；易擠擁 3.0 kN/m。Line load 施加於樓面以上 1.1 m 或護欄頂（取較低者）。玻璃欄河設計（Glass Code）亦引用此表。","x":"Areas susceptible to 3.0 1.5 1.5 overcrowding","q_en":"What is the barrier line load for areas susceptible to overcrowding, in kN/m?","e_en":"Table 3.13: congregation not expected 0.75 kN/m; people may congregate but overcrowding not expected 1.5 kN/m; susceptible to overcrowding 3.0 kN/m. The line load acts at 1.1 m above floor level or at the top of the barrier, whichever is lower. Glass balustrade design (Glass Code) also refers to this table.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","num","中級"]},{"id":"DIL-033","t":"mcq","d":2,"tp":"護欄荷載 Barriers","c":"3.8.1.3","p":19,"q":"住宅 balconies 的護欄應屬哪一個類別？","o":["Areas where congregation of people is not expected（0.75 kN/m）","Areas where people may c
