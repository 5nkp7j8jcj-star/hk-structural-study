for mercantile facilities (4b) with a compartment area over 2,500 m² but not over 10,500 m²?","e_en":"Mercantile uses: 60 minutes up to 2,500 m², 120 minutes above. In podium mall design the compartmentation directly affects structural cover and slab thickness.","doc":"fire-safety-2011-2024ed","pp":"78","ex":"fire","tier":"必考"},{"id":"FIR-004","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Industrial workplaces（6a）的 FRR（分鐘）？","a":3,"u":"min","e":"工業類全部 120 分鐘。舊工廈活化改建時要核實原有結構是否達標。","x":"6a. Industrial workplaces Not exceeding 10,500m2 120","o":["240 min","60 min","180 min","120 min"],"q_en":"Table C1: FRR (minutes) for industrial workplaces (6a)?","e_en":"All industrial uses are 120 minutes. When revitalising old industrial buildings, verify whether the existing structure complies.","doc":"fire-safety-2011-2024ed","pp":"78","ex":"fire","tier":"必考"},{"id":"FIR-005","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C1 Note 1","p":88,"q":"Fire compartment 面積超過 Table C1 所列時，一律不獲批准。","a":false,"e":"超過會按個別情況考慮，需要加強逃生、消防進出、消防裝置及耐火結構以達到同等安全水平，通常需要 fire engineering 方案。","x":"A fire compartment area/volume in excess of that given above will be dealt with on","q_en":"Fire compartments larger than those listed in Table C1 will never be approved.","e_en":"False. Larger compartments are considered case by case, requiring enhanced means of escape, firefighting access, fire service installations and fire resisting construction to achieve an equivalent level of safety, usually via a fire engineering approach.","doc":"fire-safety-2011-2024ed","pp":"79","ex":"fire","tier":"必考"},{"id":"FIR-007","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"C4.3 無保護鋼結構的單層建築須與鄰近建築或地界保持不少於多少 m 淨空？","a":1,"u":"m","e":"6 m 淨空是防止火勢蔓延到鄰近建築的條件。","x":"adjoining building or the site boundary by a clear unobstructed open space not less than 6m","o":["9 m","6 m","3 m","4.5 m"],"q_en":"Under C4.3, a single-storey building with unprotected steelwork must be separated from adjoining buildings or the site boundary by a clear distance of not less than how many m?","e_en":"The 6 m clearance is the condition to prevent fire spread to adjoining buildings.","doc":"fire-safety-2011-2024ed","pp":"79","ex":"fire","tier":"必考"},{"id":"FIR-008","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Structural frame、beam 或 column 須滿足哪些 FRR 準則？","o":["只需 Stability","Stability + Integrity","Stability + Integrity + Insulation","只需 Integrity"],"a":0,"e":"結構框架只需穩定性（exposed faces only）；樓板三項都要（每邊分別）。所以 FRR 60 的樓板要考慮隔熱（厚度），而樑柱則是保護層及尺寸。","x":"1 Structural frame, Y N N Exposed faces only","q_en":"Table C2: which FRR criteria must a structural frame, beam or column satisfy?","o_en":["Stability only","Stability + Integrity","Stability + Integrity + Insulation","Integrity only"],"e_en":"Structural frames need only stability (exposed faces only); floors need all three (each side separately). So an FRR 60 floor must consider insulation (thickness), while beams and columns are governed by cover and dimensions.","doc":"fire-safety-2011-2024ed","pp":"80","ex":"fire","tier":"必考"},{"id":"FIR-009","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Floor（包括 fire compartment floor）須滿足 stability、integrity 及 insulation，並每邊分別測試。","a":true,"e":"樓板作為 compartment floor，三項都要，故 Table E4 同時規定厚度及保護層。","x":"2 Floor including fire Y Y Y Each side separately","q_en":"Table C2: floors (including fire compartment floors) must satisfy stability, integrity and insulation, tested for each side separately.","e_en":"True. As compartment floors, floors need all three, which is why Table E4 specifies both thickness and cover.","doc":"fire-safety-2011-2024ed","pp":"80","ex":"fire","tier":"必考"},{"id":"FIR-010","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2 Note 3","p":90,"q":"按 FS Code，curtain wall glazing 一般不需要 FRR（受 C5 及 C9.7 規限）。","a":true,"e":"幕牆玻璃本身不需 FRR，但樓層之間要有 spandrel 或水平突出（C11）及防火封堵。","x":"3. Subject to Subsection C5 and Clause C9.7, curtain wall glazing does not require to","q_en":"Under the FS Code, curtain wall glazing generally does not require an FRR (subject to C5 and C9.7).","e_en":"True. Curtain wall glass itself needs no FRR, but spandrels or horizontal projections (C11) and fire stopping are required between floors.","doc":"fire-safety-2011-2024ed","pp":"81","ex":"fire","tier":"必考"},{"id":"FIR-011","t":"mcq","d":3,"tp":"耐火等級 FRR","c":"Table C2 Note 5","p":90,"q":"Smoke outlet shaft 截面面積收窄至原來的百分之幾或以下，即視為 stability 失效？","a":2,"u":"%","e":"排煙井的 stability 準則以截面保持為定義，與一般結構構件不同。","x":"5. Any restriction of the cross-section area of the smoke outlet shaft to 75% or less of its","o":["60%","90%","75%","50%"],"q_en":"A smoke outlet shaft is deemed to fail the stability criterion when its cross-sectional area is reduced to what percentage of the original or less?","e_en":"The stability criterion of smoke shafts is defined by retention of the cross-section, unlike ordinary structural elements.","doc":"fire-safety-2011-2024ed","pp":"81","ex":"fire","tier":"必考"},{"id":"FIR-012","t":"mcq","d":2,"tp":"防火分隔 Separation","c":"C5.2","p":90,"q":"同一地盤內兩座建築相距少於多少 m 時被視為 adjoining buildings？","a":2,"u":"m","e":"相鄰建築之間的外牆要按夾角（>135° 或 ≤135°）設置無開口的耐火外牆。","x":"apart. Fire barriers should be provided in compliance with the following requirements:","o":["6.0 m","3.0 m","1.8 m","1.2 m"],"q_en":"Two buildings on the same site are regarded as adjoining buildings when they are less than how many m apart?","e_en":"External walls between adjoining buildings must be fire-resisting external walls without openings, depending on the included angle (>135° or ≤135°).","doc":"fire-safety-2011-2024ed","pp":"81","ex":"fire","tier":"偶考"},{"id":"FIR-013","t":"mcq","d":2,"tp":"外部火勢蔓延 External fire spread","c":"C11.1","p":99,"q":"C11.1：上下層外牆之間的分隔可採用？","o":["900 mm spandrel 或 500 mm 水平突出","600 mm spandrel 或 300 mm 水平突出","1200 mm spandrel","無要求"],"a":0,"e":"FRR 不少於該層；單一家庭住宅或有 sprinkler 的建築不適用。結構上 spandrel 樑/牆的高度要配合建築立面設計。","x":"(a) a spandrel that is a vertical element of 900mm, with an FRR of not less than that of","q_en":"C11.1: separation between external walls of storeys one above the other may be provided by:","o_en":["A 900 mm spandrel or a 500 mm horizontal projection","A 600 mm spandrel or a 300 mm horizontal projection","A 1200 mm spandrel","No requirement"],"e_en":"FRR not less than that of the storey; not applicable to single-family houses or sprinklered buildings. Structurally, the height of spandrel beams/walls must suit the architectural elevation.","doc":"fire-safety-2011-2024ed","pp":"90","ex":"fire","tier":"偶考"},{"id":"FIR-014","t":"tf","d":2,"tp":"外部火勢蔓延 External fire spread","c":"C11.1 Commentary","p":99,"q":"FS Code 評論指 900 mm spandrel 可有效防止垂直火勢蔓延。","a":false,"e":"Commentary 指 spandrel 只能減慢火焰蔓延，未必能防止；sprinkler 才是最有效的垂直火勢控制。","x":"A 900mm spandrel or 500mm horizontal projection is effective in slowing flame spread only","q_en":"The FS Code commentary says a 900 mm spandrel effectively prevents vertical fire spread.","e_en":"False. The commentary says spandrels can only slow down flame spread and may not prevent it; sprinklers are the most effective control of vertical fire spread.","doc":"fire-safety-2011-2024ed","pp":"90","ex":"fire","tier":"偶考"},{"id":"FIR-015","t":"mcq","d":3,"tp":"中庭 Atrium","c":"C10.3","p":99,"q":"有 sprinkler 建築的 atrium，限制是？","o":["體積 ≤28,000 m³、高度 ≤15 m、連接不多於 3 層","體積 ≤10,500 m³、高度 ≤20 m、不多於 5 層","體積不限、高度 ≤15 m","體積 ≤7,000 m³、不多於 2 層"],"a":0,"e":"超出須由 Building Authority 決定或以 fire engineering 處理。大跨度中庭屋頂結構亦要按 FRR 設計。","x":"(b) the volume of an atrium should not exceed 28,000m3;","q_en":"What are the limits for an atrium in a sprinklered building?","o_en":["Volume ≤28,000 m³, height ≤15 m, connecting not more than 3 storeys","Volume ≤10,500 m³, height ≤20 m, not more than 5 storeys","Unlimited volume, height ≤15 m","Volume ≤7,000 m³, not more than 2 storeys"],"e_en":"Beyond these, the Building Authority decides or fire engineering is used. Long-span atrium roof structures must also be designed for the FRR.","doc":"fire-safety-2011-2024ed","pp":"90","ex":"fire","tier":"偶考"},{"id":"FIR-016","t":"mcq","d":2,"tp":"特殊危險 Special hazard","c":"C13.1","p":101,"q":"特殊危險區域（如變壓器房）的 fire barrier FRR？直接連接 protected exit 時？","o":["-/120/120；-/240/240","-/60/60；-/120/120","120/120/120；240/240/240","-/240/240；-/240/240"],"a":0,"e":"FRR 寫法為 stability/integrity/insulation。特殊危險房間的牆及樓板厚度要按 120 或 240 分鐘設計。","x":"building by fire barriers having an FRR of not less than -/120/120. If the special hazard","q_en":"FRR of fire barriers to special hazard areas (e.g. transformer rooms)? And where directly connected to a protected exit?","o_en":["-/120/120; -/240/240","-/60/60; -/120/120","120/120/120; 240/240/240","-/240/240; -/240/240"],"e_en":"FRR is written as stability/integrity/insulation. Walls and floor thicknesses of special hazard rooms must be designed for 120 or 240 minutes.","doc":"fire-safety-2011-2024ed","pp":"92","ex":"fire","tier":"常考"},{"id":"FIR-017","t":"mcq","d":2,"tp":"地庫 Basement","c":"C14.1","p":103,"q":"C14.1：地庫所有 elements of construction 的 FRR？","o":["240/240/240","120/120/120","60/60/60","與上層相同"],"a":0,"e":"地庫結構 240 分鐘，地面層與地庫之間的 fire barrier -/240/240。結構設計要按 FRR 240 查 Table E4/E6（例如樓板 170 mm、保護層 45/55 mm）。","x":"(b) all elements of construction of the basement should have an FRR of not less than","q_en":"C14.1: FRR of all elements of construction in a basement?","o_en":["240/240/240","120/120/120","60/60/60","Same as the floors above"],"e_en":"Basement structure 240 minutes; fire barrier between ground floor and basement -/240/240. Structural design must use Table E4/E6 for FRR 240 (e.g. slab 170 mm, cover 45/55 mm).","doc":"fire-safety-2011-2024ed","pp":"94","ex":"fire","tier":"必考"},{"id":"FIR-018","t":"mcq","d":3,"tp":"地庫 Basement","c":"C14.2","p":103,"q":"四面封閉地庫的 smoke outlets 間距不超過多少 m？","a":1,"u":"m","e":"面積合計不少於服務樓面 0.5%（倉庫 2.5%），最小尺寸 1 m。結構上要在地面層樓板預留開口。","x":"(a) be not more than 30m apart and situated along the street frontages or adjacent to","o":["60 m","30 m","45 m","20 m"],"q_en":"Smoke outlets for a basement enclosed on all sides should be spaced at not more than how many m?","e_en":"Aggregate area not less than 0.5% of the floor area served (2.5% for warehouses), minimum dimension 1 m. Structurally, openings must be provided in the ground floor slab.","doc":"fire-safety-2011-2024ed","pp":"94","ex":"fire","tier":"必考"},{"id":"FIR-019","t":"mcq","d":3,"tp":"地庫 Basement","c":"C14.2(d)","p":103,"q":"一般地庫 smoke outlets 合計面積不少於服務樓面面積的百分之幾？","a":3,"u":"%","e":"Bulk storage/warehouse 則為 2.5%。","x":"(d) have an area in aggregate of not less than 0.5% of the floor area they serve or, in","o":["1.0%","2.5%","0.25%","0.5%"],"q_en":"For a typical basement, the aggregate area of smoke outlets should be not less than what percentage of the floor area served?","e_en":"For bulk storage/warehouses it is 2.5%.","doc":"fire-safety-2011-2024ed","pp":"94","ex":"fire","tier":"必考"},{"id":"FIR-020","t":"mcq","d":2,"tp":"避火層 Refuge floor","c":"B18.1","p":55,"q":"何時須設 refuge floor？間距？","o":["超過 25 層；一般每不多於 25 層（工業 20 層）","超過 40 層；每 20 層","超過 30 層；每 30 層","超過 20 層；每 15 層"],"a":0,"e":"避火層結構上通常是轉換層位置，要考慮開放兩邊的通風、淨高 2300 mm 及面積 ≥50%。","x":"exceeding 25 storeys in height above the lowest ground storey, at not more than 20 storeys","q_en":"When is a refuge floor required, and at what interval?","o_en":["More than 25 storeys; generally at not more than every 25 storeys (20 storeys for industrial)","More than 40 storeys; every 20 storeys","More than 30 storeys; every 30 storeys","More than 20 storeys; every 15 storeys"],"e_en":"Refuge floors are often at transfer levels structurally; consider ventilation from two open sides, a clear height of 2300 mm and an area of ≥50%.","doc":"fire-safety-2011-2024ed","pp":"46","ex":"fire","tier":"常考"},{"id":"FIR-021","t":"mcq","d":2,"tp":"避火層 Refuge floor","c":"B18.2(b)","p":55,"q":"Refuge floor 的淨避難面積不少於該層總樓面面積的百分之幾？","a":0,"u":"%","e":"另淨高不少於 2300 mm，最小尺寸比最闊樓梯大 50%。","x":"(b) The net area for refuge should be not less than 50% of the total gross floor area of","o":["50%","25%","33%","75%"],"q_en":"The net refuge area of a refuge floor should be not less than what percentage of the gross floor area of that floor?","e_en":"Also a clear height of not less than 2300 mm, and a minimum dimension 50% greater than the widest staircase.","doc":"fire-safety-2011-2024ed","pp":"46","ex":"fire","tier":"常考"},{"id":"FIR-022","t":"mcq","d":2,"tp":"避火層 Refuge floor","c":"B18.2(b)","p":55,"q":"Refuge floor 避難區的最少淨高（mm）？","a":1,"u":"mm","e":"避火層常有轉換大樑，淨高要扣除樑深，結構佈置要早與建築師協調。","x":"the refuge floor and should have a clear headroom of not less than 2300mm;","o":["2000 mm","2300 mm","2100 mm","2500 mm"],"q_en":"What is the minimum clear height (mm) of the refuge area on a refuge floor?","e_en":"Refuge floors often have deep transfer girders; the clear height is measured below the beams, so coordinate the structural layout with the architect early.","doc":"fire-safety-2011-2024ed","pp":"46","ex":"fire","tier":"常考"},{"id":"FIR-023","t":"mcq","d":1,"tp":"防火測試 Fire tests","c":"E3.1","p":158,"q":"承重構件的耐火測試主要按哪個標準系列？","o":["BS EN 1363 / BS EN 1365","BS 8110","BS 5950-8","ASTM E119"],"a":0,"e":"BS 476 Part 20/21 在過時前仍然適用；分類按 BS EN 13501-2。以計算方法（如 Eurocode fire parts）則屬 fire engineering 範疇（Part G）。","x":"(a) BS EN 1363-1:1999, Fire resistance tests. General requirements;","q_en":"Fire tests of loadbearing elements are mainly to which series of standards?","e_en":"BS 476 Part 20/21 remains applicable until withdrawn; classification to BS EN 13501-2. Calculation methods (e.g. Eurocode fire parts) belong to fire engineering (Part G).","doc":"fire-safety-2011-2024ed","pp":"149","ex":"fire","tier":"偶考"},{"id":"FIR-024","t":"tf","d":2,"tp":"防火測試 Fire tests","c":"E3.2","p":158,"q":"BS 476 Part 20 及 21 在 FS Code 2011（2024 版）下已不可再用。","a":false,"e":"E3.2 寫明在其被廢止前仍適用，所以舊的防火板/噴塗測試報告仍可能被接受，但要留意有效性。","x":"The following British Standards will still be applicable until they are obsolete:","q_en":"BS 476 Part 20 and Part 21 can no longer be used under the FS Code 2011 (2024 Edition).","e_en":"False. E3.2 states they remain applicable until withdrawn, so older fire board/spray test reports may still be accepted, but check their validity.","doc":"fire-safety-2011-2024ed","pp":"149","ex":"fire","tier":"偶考"},{"id":"FIR-025","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：實心 RC 樓板 FRR 120 分鐘所需最小厚度？","o":["100 mm","125 mm","150 mm","170 mm"],"a":1,"e":"60/120/240 分鐘：100/125/170 mm。住宅一般 FRR 60，樓板 ≥100 mm；地庫 240 分鐘要 170 mm。","x":"Thickness of concrete 170 125 100","q_en":"Table E4: minimum thickness of a solid RC floor for FRR 120 minutes?","e_en":"60/120/240 minutes: 100/125/170 mm. Residential is generally FRR 60, slab ≥100 mm; basements at 240 minutes need 170 mm.","doc":"fire-safety-2011-2024ed","pp":"168","ex":"fire","tier":"必考"},{"id":"FIR-026","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：簡支實心 RC 樓板 FRR 120 分鐘的鋼筋保護層（mm）？","a":3,"u":"mm","e":"簡支 60/120/240：20/35/55*；連續：20/25/45*（* 需要 fabric/mesh 防爆裂）。要與 Concrete Code 耐久性保護層比較並取大值。","x":"simply supported 55* 35 20","o":["45 mm","25 mm","55 mm","35 mm"],"q_en":"Table E4: reinforcement cover (mm) for a simply supported solid RC floor at FRR 120 minutes?","e_en":"Simply supported 60/120/240: 20/35/55*; continuous: 20/25/45* (* fabric/mesh needed against spalling). Compare with the Concrete Code durability cover and take the greater.","doc":"fire-safety-2011-2024ed","pp":"168","ex":"fire","tier":"必考"},{"id":"FIR-027","t":"mcq","d":3,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：連續實心 RC 樓板 FRR 240 分鐘的保護層（mm）？","a":3,"u":"mm","e":"帶 * 表示保護層內須加 expanded metal lath 或 wire fabric（距面 ≤20 mm），以防保護層剝落。","x":"continuous 45* 25 20","o":["35 mm","65 mm","55 mm","45 mm"],"q_en":"Table E4: cover (mm) for a continuous solid RC floor at FRR 240 minutes?","e_en":"The * means expanded metal lath or wire fabric must be provided within the cover (≤20 mm from the surface) to prevent the cover spalling off.","doc":"fire-safety-2011-2024ed","pp":"168","ex":"fire","tier":"必考"},{"id":"FIR-028","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：完全外露 RC 柱 FRR 120 分鐘所需最小尺寸及保護層？","o":["300 mm；35 mm","200 mm；25 mm","450 mm；35 mm","240 mm；25 mm"],"a":0,"e":"完全外露 60/120/240：200/300/450 mm，保護層 25/35/35 mm。細柱（如 250 mm）只能達 60 分鐘。","x":"(a) Fully exposed columns and hangers 450 300 200","q_en":"Table E6: minimum dimension and cover of a fully exposed RC column for FRR 120 minutes?","o_en":["300 mm; 35 mm","200 mm; 25 mm","450 mm; 35 mm","240 mm; 25 mm"],"e_en":"Fully exposed 60/120/240: 200/300/450 mm, cover 25/35/35 mm. Slender columns (e.g. 250 mm) only achieve 60 minutes.","doc":"fire-safety-2011-2024ed","pp":"170","ex":"fire","tier":"必考"},{"id":"FIR-029","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：RC 樑 FRR 60 分鐘的最小寬度（mm）？","a":3,"u":"mm","e":"60 及 120 分鐘都是 200 mm，240 分鐘 280 mm。保護層簡支 30/50*/80*。","x":"Width of beam 280 200 200","o":["250 mm","120 mm","160 mm","200 mm"],"q_en":"Table E6: minimum width (mm) of an RC beam for FRR 60 minutes?","e_en":"200 mm for both 60 and 120 minutes, 280 mm for 240 minutes. Cover for simply supported: 30/50*/80*.","doc":"fire-safety-2011-2024ed","pp":"170","ex":"fire","tier":"必考"},{"id":"FIR-030","t":"mcq","d":3,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：簡支 RC 樑 FRR 120 分鐘的主筋保護層（mm）？","a":1,"u":"mm","e":"50* 帶星號，須加防剝落網。連續樑 120 分鐘只需 40 mm。實務上多數樑按連續設計較經濟。","x":"simply supported 80* 50* 30","o":["60 mm","50 mm","40 mm","30 mm"],"q_en":"Table E6: main bar cover (mm) of a simply supported RC beam for FRR 120 minutes?","e_en":"50* has an asterisk: anti-spalling mesh is needed. A continuous beam needs only 40 mm at 120 minutes. In practice designing most beams as continuous is more economical.","doc":"fire-safety-2011-2024ed","pp":"170","ex":"fire","tier":"必考"},{"id":"FIR-031","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E2","p":175,"q":"Table E2：含不少於 1% 豎向鋼筋的 RC 牆，FRR 120 分鐘的最小厚度？","o":["75 mm","100 mm","160 mm","180 mm"],"a":1,"e":"≥1% 鋼筋：60/120/240 為 75/100/180 mm；<1% 鋼筋：120/160/240 mm。保護層 15/25/25 mm。","x":"(a) containing not less than 1 per cent of vertical 180 100 75","q_en":"Table E2: minimum thickness of an RC wall with not less than 1% vertical reinforcement for FRR 120 minutes?","e_en":"≥1% reinforcement: 60/120/240 are 75/100/180 mm; <1% reinforcement: 120/160/240 mm. Cover 15/25/25 mm.","doc":"fire-safety-2011-2024ed","pp":"166","ex":"fire","tier":"必考"},{"id":"FIR-032","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E5","p":178,"q":"Table E5：鋼柱（≥45 kg/m）以 Grade 20 混凝土實心包覆，FRR 120 分鐘所需厚度（mm）？","a":0,"u":"mm","e":"60 及 120 分鐘 50 mm，240 分鐘 75 mm。混凝土包覆要按 Steel Code 配筋。","x":"(a) Concrete not inferior to Grade 20 and reinforced in accordance with 75 50 50","o":["50 mm","25 mm","30 mm","75 mm"],"q_en":"Table E5: thickness (mm) of solid Grade 20 concrete encasement to a steel column (≥45 kg/m) for FRR 120 minutes?","e_en":"50 mm for 60 and 120 minutes, 75 mm for 240 minutes. Concrete encasement must be reinforced per the Steel Code.","doc":"fire-safety-2011-2024ed","pp":"169","ex":"fire","tier":"必考"},{"id":"FIR-033","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E7","p":180,"q":"Table E7：RC 樓梯 FRR 60 分鐘的 waist 厚度及保護層？","o":["95 mm；20 mm","125 mm；35 mm","170 mm；55 mm","100 mm；25 mm"],"a":0,"e":"60/120/240：95/125/170 mm；保護層 20/35/55*。","x":"Thickness at waist of slab 170 125 95","q_en":"Table E7: waist thickness and cover of an RC stair for FRR 60 minutes?","o_en":["95 mm; 20 mm","125 mm; 35 mm","170 mm; 55 mm","100 mm; 25 mm"],"e_en":"60/120/240: 95/125/170 mm; cover 20/35/55*.","doc":"fire-safety-2011-2024ed","pp":"171","ex":"fire","tier":"必考"},{"id":"FIR-035","t":"mcq","d":3,"tp":"避火層 Refuge floor","c":"B18.3 Commentary","p":56,"q":"以主天台作 refuge floor 時，毗鄰避難區的 plant room FRR 要求？","o":["-/120/120","-/60/60","-/30/30","240/240/240"],"a":0,"e":"另 1.8 m 內的梯屋 -/60/60，私人天台與避難區以 ≥1.5 m 實心圍牆分隔。","x":"refuge area by a solid fence wall of not less than 1.5m high. Any stairhood to be erected within","q_en":"Where the main roof is used as a refuge floor, what is the FRR requirement for plant rooms adjacent to the refuge area?","e_en":"Also, staircase roofs within 1.8 m are -/60/60, and private roofs are separated from the refuge area by solid walls ≥1.5 m high.","doc":"fire-safety-2011-2024ed","pp":"47","ex":"fire","tier":"常考"},{"id":"FIR-036","t":"tf","d":2,"tp":"耐火等級 FRR","c":"C3.2","p":86,"q":"Fire barrier 上所有開口、接縫及貫穿位的保護，FRR 不得低於該 fire barrier。","a":true,"e":"結構伸縮縫、管道穿牆位要用 fire-stopping 保持同等 FRR，常在驗收時被發現遺漏。","x":"penetrations located in a fire barrier should have an FRR not less than that of the fire barrier.","q_en":"Protection of all openings, joints and penetrations in a fire barrier must have an FRR not less than that of the fire barrier.","e_en":"True. Structural movement joints and service penetrations must use fire-stopping to maintain the same FRR; omissions are often found at completion inspection.","doc":"fire-safety-2011-2024ed","pp":"77","ex":"fire","tier":"必考"},{"id":"FIR-037","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：一面外露 RC 柱 FRR 240 分鐘的最小尺寸（mm）？","a":3,"u":"mm","e":"一面外露（例如嵌入牆內）60/120/240：120/160/240 mm。","x":"(c) One face exposed of columns and hangers 240 160 120","o":["300 mm","160 mm","200 mm","240 mm"],"q_en":"Table E6: minimum dimension (mm) of an RC column with one face exposed for FRR 240 minutes?","e_en":"One face exposed (e.g. embedded in a wall) 60/120/240: 120/160/240 mm.","doc":"fire-safety-2011-2024ed","pp":"170","ex":"fire","tier":"必考"},{"id":"FIR-038","t":"mcq","d":2,"tp":"特殊危險 Special hazard","c":"C13.2","p":101,"q":"餐廳廚房作為附屬用途時，圍封 fire barrier 的 FRR？","o":["-/60/60","-/30/30","-/120/120","無要求"],"a":0,"e":"廚房 -/60/60；使用面積 >45 m² 且 lobby 開向用餐區出口路線時，須設 protected lobby。","x":"(a) the kitchen should be enclosed by fire barriers having an FRR of not less than","q_en":"Where a restaurant kitchen is an ancillary use, what is the FRR of the enclosing fire barrier?","o_en":["-/60/60","-/30/30","-/120/120","No requirement"],"e_en":"Kitchen -/60/60; where the usable area is >45 m² and the lobby opens onto the exit route of the dining area, a protected lobby is required.","doc":"fire-safety-2011-2024ed","pp":"92","ex":"fire","tier":"常考"},{"id":"FDN-001","t":"mcq","d":1,"tp":"承載力 Bearing capacity","c":"2.2.1","p":17,"q":"Rational design method：一般對計算所得的 ultimate bearing capacity 採用多少的 factor of safety 求 allowable capacity？","a":1,"u":"","e":"FOS 3 是慣例，但規範容許按土石性質、場地變化及設計方法可靠性採用其他數值。提交時若用低於 3 要有充分理據（例如有載荷試驗）。","x":"Normally, the allowable capacity is estimated by applying a factor of safety of 3 to the","o":["2.5","3","1.5","2"],"q_en":"Rational design method: what factor of safety is generally applied to the calculated ultimate bearing capacity to obtain the allowable capacity?","e_en":"A FOS of 3 is conventional, but the Code allows other values depending on the ground properties, site variability and reliability of the design method. If less than 3 is used in a submission, adequate justification is needed (e.g. load tests).","doc":"foundations-2017-2024ed","pp":"9","ex":"fdn","tier":"必考"},{"id":"FDN-002","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"2.2.2(3)","p":18,"q":"在無不利岩石節理下，岩石的 allowable lateral bearing pressure 可取 allowable vertical bearing pressure 的幾分之一？（填小數）","a":0.333,"tol":0.01,"u":"","calc":true,"e":"規範寫明 one third。岩石嵌固段（rock socket）抵抗側向力時常用此值；如有不利節理必須另行分析。","x":"The allowable lateral bearing pressure for rock may be taken as one third of","q_en":"In the absence of adverse rock joints, the allowable lateral bearing pressure of rock may be taken as what fraction of the allowable vertical bearing pressure? (Enter a decimal.)","e_en":"The Code states one third. Commonly used for rock sockets resisting lateral loads; adverse joints must be analysed separately.","doc":"foundations-2017-2024ed","pp":"10","ex":"fdn","tier":"必考"},{"id":"FDN-003","t":"mcq","d":1,"tp":"承載力 Bearing capacity","c":"2.2.2(5)","p":18,"q":"小型或臨時構築物、平地上以粒狀材料為承托層的基腳，可採用的 presumed allowable vertical bearing pressure 為？","o":["乾 100 kPa／浸水 50 kPa","乾 150 kPa／浸水 75 kPa","乾 200 kPa／浸水 100 kPa","乾 300 kPa／浸水 150 kPa"],"a":0,"e":"適用於圍板、小型棚架等。注意只限平地及 granular materials；斜坡上或填土上不能直接套用。","x":"A presumed allowable vertical bearing pressure of 100 kPa (if dry) or 50 kPa","q_en":"For small or temporary structures with footings founded on granular materials on level ground, what presumed allowable vertical bearing pressure may be adopted?","o_en":["Dry 100 kPa / submerged 50 kPa","Dry 150 kPa / submerged 75 kPa","Dry 200 kPa / submerged 100 kPa","Dry 300 kPa / submerged 150 kPa"],"e_en":"Applies to hoardings, small sheds, etc. Note it is limited to level ground and granular materials; it cannot be applied directly on slopes or fill.","doc":"foundations-2017-2024ed","pp":"10","ex":"fdn","tier":"必考"},{"id":"FDN-004","t":"mcq","d":1,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Table 2.1：Category 1(a) 岩石（新鮮至輕微風化、強至極強花崗岩/火山岩，100% TCR，UCS ≥75 MPa）的 presumed allowable bearing pressure（kPa）？","a":1,"u":"kPa","e":"1(a) 10 000、1(b) 7 500、1(c) 5 000、1(d) 3 000 kPa。大直徑鑽孔樁常用 1(a)/1(b)，要以 5 m 的 TCR 證明及 PLI/UCS 試驗支持。","x":"Fresh to slightly decomposed strong to very strong 10 000","o":["5000 kPa","10 000 kPa","3000 kPa","7500 kPa"],"q_en":"Table 2.1: presumed allowable bearing pressure (kPa) of Category 1(a) rock (fresh to slightly decomposed, strong to extremely strong granite/volcanic rock, 100% TCR, UCS ≥75 MPa)?","e_en":"1(a) 10 000, 1(b) 7 500, 1(c) 5 000, 1(d) 3 000 kPa. Large-diameter bored piles commonly use 1(a)/1(b), supported by 5 m of TCR evidence and PLI/UCS tests.","doc":"foundations-2017-2024ed","pp":"11","ex":"fdn","tier":"必考"},{"id":"FDN-005","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 1(b) 岩石要求的 TCR of the designated grade 及 UCS 分別是？","o":["≥95% TCR、UCS ≥50 MPa","100% TCR、UCS ≥75 MPa","≥85% TCR、UCS ≥25 MPa","≥50% TCR、無 UCS 要求"],"a":0,"e":"1(b)：≥95% TCR，UCS ≥50 MPa（或 PLI50 ≥2 MPa），允許 7 500 kPa。鑽探報告的 core run TCR 與 designated grade TCR 定義不同，別混淆。","x":"better, and with not less than 95% TCR of the","q_en":"What TCR of the designated grade and UCS are required for Category 1(b) rock?","o_en":["≥95% TCR, UCS ≥50 MPa","100% TCR, UCS ≥75 MPa","≥85% TCR, UCS ≥25 MPa","≥50% TCR, no UCS requirement"],"e_en":"1(b): ≥95% TCR, UCS ≥50 MPa (or PLI50 ≥2 MPa), allowing 7 500 kPa. The core run TCR in drilling reports is defined differently from the TCR of the designated grade — do not confuse them.","doc":"foundations-2017-2024ed","pp":"11","ex":"fdn","tier":"必考"},{"id":"FDN-006","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 1(c) 岩石的 presumed allowable bearing pressure（kPa）？","a":3,"u":"kPa","e":"1(c)：Grade III 或更好、≥85% TCR、UCS ≥25 MPa。也是 rock socket bond 700 kPa 的門檻類別。","x":"Slightly to moderately decomposed moderately 5 000","o":["10 000 kPa","7500 kPa","3000 kPa","5000 kPa"],"q_en":"Presumed allowable bearing pressure (kPa) of Category 1(c) rock?","e_en":"1(c): Grade III or better, ≥85% TCR, UCS ≥25 MPa. It is also the threshold category for the 700 kPa rock socket bond.","doc":"foundations-2017-2024ed","pp":"11","ex":"fdn","tier":"必考"},{"id":"FDN-007","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 3 intermediate soil（SPT N ≥200 的 HDG/CDG）的 presumed allowable bearing pressure（kPa）？","a":0,"u":"kPa","e":"N ≥200 的風化土可用 1 000 kPa，常見於 driven H-pile 或 bored pile 以土承托的情況，並可視為滿足 30 mm 沉降準則（2.3.2）。","x":"or better, with SPT N-value ≥ 200.","o":["1000 kPa","500 kPa","3000 kPa","300 kPa"],"q_en":"Presumed allowable bearing pressure (kPa) of Category 3 intermediate soil (HDG/CDG with SPT N ≥200)?","e_en":"Decomposed soil with N ≥200 may use 1 000 kPa, common for driven H-piles or bored piles founded in soil, and may be regarded as meeting the 30 mm settlement criterion (2.3.2).","doc":"foundations-2017-2024ed","pp":"11","ex":"fdn","tier":"必考"},{"id":"FDN-008","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":20,"q":"Table 2.1：Dense 非黏性土（SPT N 30–50）的 presumed allowable bearing pressure（乾/浸水）？","o":["500 / 250 kPa","300 / 150 kPa","100 / 50 kPa","150 / 75 kPa"],"a":1,"e":"4(a) very dense 500/250、4(b) dense 300/150、4(c) medium dense 100/50。地下水位介乎兩者可線性內插。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","q_en":"Table 2.1: presumed allowable bearing pressure (dry/submerged) of dense non-cohesive soil (SPT N 30–50)?","e_en":"4(a) very dense 500/250, 4(b) dense 300/150, 4(c) medium dense 100/50. For a groundwater level between the two, interpolate linearly.","doc":"foundations-2017-2024ed","pp":"12","ex":"fdn","tier":"必考"},{"id":"FDN-009","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note (3)","p":20,"q":"Category 1(a) 及 1(b) 岩石的最小 socket depth（沿樁周）是多少 mm？","a":1,"u":"mm","e":"1(a)/1(b) 500 mm；1(c)、1(d)、2 為 300 mm。計算 bond/friction 時此最小嵌固段貢獻須忽略（5.3.2(2)）。","x":"Minimum socket depth along the pile perimeter is 500 mm for categories 1(a)","o":["600 mm","500 mm","1000 mm","300 mm"],"q_en":"What is the minimum socket depth (along the pile perimeter) in Category 1(a) and 1(b) rock, in mm?","e_en":"1(a)/1(b) 500 mm; 1(c), 1(d) and 2 are 300 mm. The contribution of this minimum socket must be ignored when calculating bond/friction (5.3.2(2)).","doc":"foundations-2017-2024ed","pp":"12","ex":"fdn","tier":"必考"},{"id":"FDN-010","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note (5)","p":20,"q":"TCR of the designated grade 須證明至進入該類岩石最少多深（m）？","a":3,"u":"m","e":"最小嵌固深度以下需 5 m，分為每段 1 m，每段 TCR 都要達標。常見錯誤係只計整體平均 TCR。","x":"(5) The TCR of the designated grade should be proved to a depth at least 5 m into","o":["10 m","2 m","3 m","5 m"],"q_en":"The TCR of the designated grade must be proven to at least what depth (m) into rock of that category?","e_en":"5 m below the minimum socket depth, divided into 1 m sections, each of which must meet the TCR. A common error is counting only the overall average TCR.","doc":"foundations-2017-2024ed","pp":"12","ex":"fdn","tier":"必考"},{"id":"FDN-011","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"Figure 2.1 Note 5","p":21,"q":"Figure 2.1：劣於指定等級或被沖走的材料（b+e）最大連續長度不應大於多少 mm？","a":0,"u":"mm","e":"即使整體 TCR 達標，若有超過 300 mm 的連續軟弱帶，亦不符合要求。","x":"to the designated grade, b+e, should not be greater than 300 mm.","o":["300 mm","500 mm","150 mm","600 mm"],"q_en":"Figure 2.1: the maximum continuous length of material worse than the designated grade or washed out (b+e) should not be greater than how many mm?","e_en":"Even if the overall TCR is met, a continuous weak zone of more than 300 mm does not comply.","doc":"foundations-2017-2024ed","pp":"13","ex":"fdn","tier":"必考"},{"id":"FDN-012","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.2","p":21,"q":"Table 2.2：Category 1(c) 或更好岩石與混凝土/灌漿的 presumed allowable bond（受壓或短暫拉力 / 永久拉力）？","o":["700 / 350 kPa","300 / 150 kPa","1000 / 500 kPa","400 / 200 kPa"],"a":0,"e":"1(c)+ 700/350、1(d)/2 300/150 kPa；灌漿或混凝土須 ≥30 MPa。風荷載屬 transient tension 可用較高值。","x":"1(c) or better 700 350","q_en":"Table 2.2: presumed allowable bond between Category 1(c) or better rock and concrete/grout (compression or transient tension / permanent tension)?","e_en":"1(c)+ 700/350, 1(d)/2 300/150 kPa; grout or concrete must be ≥30 MPa. Wind load is transient tension and may use the higher value.","doc":"foundations-2017-2024ed","pp":"13","ex":"fdn","tier":"必考"},{"id":"FDN-013","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"2.2.4","p":22,"q":"Bearing capacity equation：粒狀土的 ultimate bearing capacity qu 上限為多少 kPa？","a":1,"u":"kPa","e":"公式計出的 qu 不可超過 3 000 kPa，再以 FOS ≥3 求 qa。","x":"ultimate bearing capacity of the granular soil, which should be limited","o":["5000 kPa","3000 kPa","10 000 kPa","1000 kPa"],"q_en":"Bearing capacity equation: what is the upper limit on the ultimate bearing capacity qu of granular soil, in kPa?","e_en":"The qu from the formula may not exceed 3 000 kPa, then FOS ≥3 is applied to obtain qa.","doc":"foundations-2017-2024ed","pp":"14","ex":"fdn","tier":"必考"},{"id":"FDN-014","t":"tf","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (1)","p":23,"q":"推導 q 時，最大有效覆土深度不應大於 3 m 或 Bf，取較小者。","a":true,"e":"且不可包括設計年期內可能被移除的覆土，亦要扣除預留的地下管線空隙。","x":"greater than 3 m or Bf, whichever is the lesser, and suitable adjustments should","q_en":"In deriving q, the maximum effective depth of overburden should not be greater than 3 m or Bf, whichever is less.","e_en":"True. It must not include overburden that may be removed during the design life, and space reserved for underground utilities must be deducted.","doc":"foundations-2017-2024ed","pp":"15","ex":"fdn","tier":"必考"},{"id":"FDN-015","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (4)","p":23,"q":"淺基礎位於斜坡頂附近時，ultimate bearing capacity 可在坡邊的值與距坡頂多遠處的值之間線性內插？","o":["2 倍基礎寬度","4 倍基礎寬度","6 倍基礎寬度","10 m"],"a":1,"e":"距坡頂 4Bf 以外可視作平地。另須檢查基礎工程對斜坡整體穩定的影響。","x":"foundation resting at the edge of the slope and that at a distance of four times","q_en":"For a shallow foundation near the crest of a slope, the ultimate bearing capacity may be interpolated linearly between the value at the slope edge and the value at what distance from the crest?","o_en":["2 times the foundation width","4 times the foundation width","6 times the foundation width","10 m"],"e_en":"Beyond 4Bf from the crest it may be treated as level ground. The effect of the foundation works on the overall stability of the slope must also be checked.","doc":"foundations-2017-2024ed","pp":"15","ex":"fdn","tier":"必考"},{"id":"FDN-016","t":"mcq","d":2,"tp":"沉降 Settlement","c":"2.3.1(4)","p":30,"q":"設計承載壓力 ≤250 kPa 的淺基礎，無更準確資料時，粒狀土 Es（MPa）可取 SPT N 值的幾倍？","a":2,"u":"倍","e":"Es = 1×N（MPa）。若採用大於 1×N 的 Es，按 4.2.2(2)(c) 需做 plate load test。","x":"as one time the SPT N-value.","o":["0.5 倍","2 倍","1 倍","5 倍"],"q_en":"For shallow foundations with design bearing pressure ≤250 kPa, in the absence of more accurate data, Es (MPa) of granular soil may be taken as how many times the SPT N value?","o_en":["0.5 times","2 times","1 times","5 times"],"e_en":"Es = 1×N (MPa). If an Es greater than 1×N is adopted, a plate load test is required per 4.2.2(2)(c).","u_en":"times","doc":"foundations-2017-2024ed","pp":"22","ex":"fdn","tier":"常考"},{"id":"FDN-017","t":"mcq","d":3,"tp":"沉降 Settlement","c":"2.3.1(3)","p":30,"q":"可假設 secondary consolidation 在 primary consolidation 達百分之幾時開始？","a":0,"u":"%","e":"95% 亦是 2.4.4 判斷填海地固結已大致完成的準則。","x":"when 95% of the primary consolidation is reached.","o":["95%","75%","90%","100%"],"q_en":"Secondary consolidation may be assumed to start when primary consolidation reaches what percentage?","e_en":"95% is also the criterion in 2.4.4 for judging that consolidation of reclamation is substantially complete.","doc":"foundations-2017-2024ed","pp":"22","ex":"fdn","tier":"常考"},{"id":"FDN-019","t":"mcq","d":2,"tp":"沉降 Settlement","c":"2.3.2(2)","p":31,"q":"評估總沉降及差異沉降準則時，dead load 可減至百分之幾？","a":1,"u":"%","e":"這是規範明文容許的；imposed load 則按 Dead and Imposed Loads Code 的折減。","x":"the dead loads may be reduced to 50%, and the imposed loads may be","o":["25%","50%","67%","80%"],"q_en":"When assessing the total and differential settlement criteria, dead load may be reduced to what percentage?","e_en":"This is expressly permitted by the Code; imposed load is reduced per the Dead and Imposed Loads Code.","doc":"foundations-2017-2024ed","pp":"23","ex":"fdn","tier":"常考"},{"id":"FDN-020","t":"tf","d":2,"tp":"填海地 Reclaimed land","c":"2.4.1(a)","p":32,"q":"除非另有建議，填海地上建築物的最低層樓板不應設計為 on-grade slab。","a":true,"e":"填海地長期固結沉降顯著，最低層樓板一般設計為懸空（suspended）。例外：筏式樁帽上的樓板、停車場/行人路等可修復的樓板。","x":"(a) Unless recommended otherwise, the lowest floor slabs of a building should not","q_en":"Unless otherwise justified, the lowest floor slab of a building on reclaimed land should not be designed as an on-grade slab.","e_en":"True. Long-term consolidation settlement of reclamation is significant, so the lowest floor slab is generally designed as suspended. Exceptions: slabs on raft pile caps, and repairable slabs such as car parks/footpaths.","doc":"foundations-2017-2024ed","pp":"24","ex":"fdn","tier":"常考"},{"id":"FDN-021","t":"mcq","d":3,"tp":"填海地 Reclaimed land","c":"2.4.4","p":33,"q":"無詳細固結評估時，海泥厚度 5 m < H ≤ 10 m（無砂夾層）達到 95% 固結所需年數？","o":["10 年","20 年","30 年","50 年"],"a":1,"e":"H ≤5 m 10 年、5–10 m 20 年、10–15 m 30 年。若會有場地平整或高壓淺基礎，此表不適用。","x":"5m < H ≤ 10m 20","q_en":"Without a detailed consolidation assessment, how many years are needed to reach 95% consolidation for a marine deposit of thickness 5 m < H ≤ 10 m (no sand layers)?","o_en":["10 years","20 years","30 years","50 years"],"e_en":"H ≤5 m 10 years, 5–10 m 20 years, 10–15 m 30 years. The table does not apply where there will be site formation or high-pressure shallow foundations.","doc":"foundations-2017-2024ed","pp":"25","ex":"fdn","tier":"常考"},{"id":"FDN-022","t":"tf","d":2,"tp":"設計荷載 Design loads","c":"2.5.2","p":34,"q":"CoP Foundations 規定 imposed load 應包括 buoyancy force 及 earth pressure。","a":true,"e":"基礎設計中浮力和土壓力屬 imposed load。若以假設荷載設計基礎，上蓋開工前須證明實際荷載不超過假設值。","x":"imposed load should include buoyancy force and earth pressure. Buoyancy force","q_en":"The CoP Foundations requires imposed load to include buoyancy force and earth pressure.","e_en":"True. In foundation design, buoyancy and earth pressure are imposed load. If foundations are designed for assumed loads, it must be demonstrated before superstructure works start that the actual loads do not exceed the assumed values.","doc":"foundations-2017-2024ed","pp":"26","ex":"fdn","tier":"常考"},{"id":"FDN-024","t":"mcq","d":2,"tp":"穩定 Stability","c":"2.5.4(2)","p":35,"q":"以 highest anticipated groundwater table 設計時，抗傾覆力矩須至少為風荷載傾覆力矩的幾倍，以及風/地下水以外荷載傾覆力矩的幾倍？","o":["1.5 倍；2 倍","1.5 倍；1.5 倍","2 倍；3 倍","1.1 倍；1.5 倍"],"a":0,"e":"抗滑移、抗上浮 1.5；抗傾覆：風 1.5、地下水 1.5、其他荷載 2.0。常被忽略的是「其他荷載」的 2 倍（例如土壓力引起的傾覆）。","x":"least 1.5 times the overturning moment due to wind loads, 1.5 times the","q_en":"When designing for the highest anticipated groundwater table, the restoring moment against overturning must be at least how many times the overturning moment from wind, and how many times that from loads other than wind/groundwater?","o_en":["1.5 times; 2 times","1.5 times; 1.5 times","2 times; 3 times","1.1 times; 1.5 times"],"e_en":"Sliding and uplift 1.5; overturning: wind 1.5, groundwater 1.5, other loads 2.0. The factor of 2 for \"other loads\" (e.g. overturning from earth pressure) is often overlooked.","doc":"foundations-2017-2024ed","pp":"27","ex":"fdn","tier":"常考"},{"id":"FDN-025","t":"mcq","d":2,"tp":"穩定 Stability","c":"2.5.4(3)","p":36,"q":"以 highest possible groundwater table 設計時，地下水引起的 uplift 力的系數是？","a":0,"u":"","e":"最高可能水位已屬極端，故地下水只乘 1.1，其他荷載仍乘 1.5。地庫抗浮兩種水位都要檢查，取較不利。","x":"the sum of 1.1 times the uplift force due to groundwater and 1.5 times","o":["1.1","1.0","1.4","1.2"],"q_en":"When designing for the highest possible groundwater table, what factor is applied to the uplift force from groundwater?","e_en":"The highest possible level is already extreme, so groundwater is multiplied by only 1.1, while other loads still take 1.5. Check basement flotation for both levels and take the more adverse.","doc":"foundations-2017-2024ed","pp":"28","ex":"fdn","tier":"常考"},{"id":"FDN-026","t":"tf","d":2,"tp":"穩定 Stability","c":"2.5.4(4)","p":36,"q":"計算抗上浮的 minimum dead load 時，可移除的飾面及回填亦可計入。","a":false,"e":"Minimum dead load 只計結構構件及永久飾面/回填；可移除的飾面及回填須忽略，並用保守的厚度及密度。","x":"Finishes and backfill that could be removed should be ignored in the calculations.","q_en":"When calculating the minimum dead load resisting uplift, removable finishes and backfill may be included.","e_en":"False. The minimum dead load counts only structural elements and permanent finishes/backfill; removable finishes and backfill must be ignored, and conservative thicknesses and densities used.","doc":"foundations-2017-2024ed","pp":"28","ex":"fdn","tier":"常考"},{"id":"FDN-027","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(1)","p":37,"q":"採用 permissible stress method 時，純因風荷載引起的工作應力可提高不多於百分之幾？","a":2,"u":"%","e":"這是傳統容許應力法的 25% 風荷載提升，常見於樁承載力的 with-wind 情況。","x":"25% where such increase is solely due to wind loads.","o":["50%","33%","25%","10%"],"q_en":"With the permissible stress method, working stresses due solely to wind load may be increased by not more than what percentage?","e_en":"This is the traditional 25% wind load increase of the permissible stress method, common for pile capacity in the with-wind case.","doc":"foundations-2017-2024ed","pp":"29","ex":"fdn","tier":"常考"},{"id":"FDN-028","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"現場澆注混凝土基礎在可能遇到地下水或水下澆注時，混凝土強度應折減百分之幾？","a":0,"u":"%","e":"鑽孔樁、barrette 以 tremie 澆注時，設計強度要折減 20%。海事基礎水下澆注則假設為 C25。","x":"by 20% where groundwater is likely to be encountered during concreting or","o":["20%","10%","33%","25%"],"q_en":"For cast-in-place concrete foundations where groundwater may be encountered or concrete is placed under water, the concrete strength should be reduced by what percentage?","e_en":"Bored piles and barrettes concreted by tremie must have their design strength reduced by 20%. Marine foundations concreted under water are assumed to be C25.","doc":"foundations-2017-2024ed","pp":"29","ex":"fdn","tier":"常考"},{"id":"FDN-029","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"打入式預製混凝土樁在工作荷載下的軸向壓應力不應超過？","o":["0.2fcu","0.25fcu","0.33fcu","0.45fcu"],"a":0,"e":"0.2fcu 限值考慮打樁應力及耐久性。","x":"loads should not exceed 0.2fcu.","q_en":"The axial compressive stress in a driven precast concrete pile under working load should not exceed:","e_en":"The 0.2fcu limit accounts for driving stresses and durability.","doc":"foundations-2017-2024ed","pp":"29","ex":"fdn","tier":"常考"},{"id":"FDN-030","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"打入式鋼承重樁（打樁阻力 FOS 2）在工作荷載下軸向應力不應超過屈服應力的百分之幾？","a":1,"u":"%","e":"打入樁 30% fy；預鑽孔或壓入（無衝擊峰值應力）可提高至 50% fy。例如 S460 H-pile 工作應力約 138 MPa。","x":"of 2, the axial stress in the steel at working load should not exceed 30% of the","o":["40%","30%","25%","50%"],"q_en":"For driven steel bearing piles (driving resistance FOS 2), the axial stress under working load should not exceed what percentage of the yield stress?","e_en":"Driven piles 30% fy; pre-bored or jacked (no impact peak stress) may be increased to 50% fy. E.g. an S460 H-pile working stress is about 138 MPa.","doc":"foundations-2017-2024ed","pp":"29","ex":"fdn","tier":"常考"},{"id":"FDN-031","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"預鑽孔安裝或壓入的鋼樁，工作荷載下軸向應力可提高至屈服應力的百分之幾？","a":2,"u":"%","e":"因無打樁衝擊峰值應力，可用 50% fy，例如 socketed H-pile。","x":"steel at working loads may be increased to 50% of the yield stress.","o":["60%","40%","50%","30%"],"q_en":"For steel piles installed in pre-bored holes or jacked, the axial stress under working load may be increased to what percentage of the yield stress?","e_en":"As there are no driving impact peak stresses, 50% fy may be used, e.g. socketed H-piles.","doc":"foundations-2017-2024ed","pp":"29","ex":"fdn","tier":"常考"},{"id":"FDN-032","t":"mcq","d":3,"tp":"材料 Materials","c":"2.5.5(4)","p":38,"q":"鋼與灌漿（≥30 MPa）之間的 allowable bond stress（一般 / 水下灌漿）？","o":["400 / 320 kPa","600 / 480 kPa","700 / 350 kPa","800 / 640 kPa"],"a":0,"e":"400/320 kPa，加 shear studs 最多提高至 600/480 kPa。計算面積用鋼構件全外表面積。","x":"minimum characteristic strength of 30 MPa) may be taken as 400 kPa (or 320","q_en":"Allowable bond stress between steel and grout (≥30 MPa) (normal / grout placed under water)?","e_en":"400/320 kPa, increased to at most 600/480 kPa with shear studs. Use the full external surface area of the steel section.","doc":"foundations-2017-2024ed","pp":"30","ex":"fdn","tier":"常考"},{"id":"FDN-033","t":"mcq","d":2,"tp":"耐久性 Durability","c":"2.6.2","p":39,"q":"為避免 alkali-aggregate reaction，混凝土中 reactive alkali（以 Na2O 當量計）每立方米不應超過多少 kg？","a":2,"u":"kg/m³","e":"3.0 kg/m³ 限值是香港 AAR 控制的標準要求，混凝土供應商須提供計算。","x":"of concrete should not exceed 3.0 kg.","o":["2.0 kg/m³","4.5 kg/m³","3.0 kg/m³","3.5 kg/m³"],"q_en":"To avoid alkali-aggregate reaction, the reactive alkali content (as Na2O equivalent) of concrete should not exceed how many kg per cubic metre?","e_en":"The 3.0 kg/m³ limit is the standard requirement for AAR control in Hong Kong; the concrete supplier must provide calculations.","doc":"foundations-2017-2024ed","pp":"31","ex":"fdn","tier":"偶考"},{"id":"FDN-034","t":"mcq","d":2,"tp":"耐久性 Durability","c":"2.6.4(1)","p":39,"q":"海事基礎混凝土的一般指引：最低等級、最大水灰比、保護層？","o":["C45、0.38、75 mm","C40、0.45、50 mm","C35、0.50、60 mm","C45、0.40、50 mm"],"a":0,"e":"另加 condensed silica fume 5–10%、膠凝材料 380–450 kg/m³；潮汐及浪濺區裂縫 ≤0.1 mm。","x":"inferior to grade C45 and the water/cement ratio should not exceed 0.38.","q_en":"General guidance for concrete in marine foundations: minimum grade, maximum water/cement ratio, cover?","o_en":["C45, 0.38, 75 mm","C40, 0.45, 50 mm","C35, 0.50, 60 mm","C45, 0.40, 50 mm"],"e_en":"Plus condensed silica fume 5–10% and cementitious content 380–450 kg/m³; crack width ≤0.1 mm in the tidal and splash zones.","doc":"foundations-2017-2024ed","pp":"31","ex":"fdn","tier":"偶考"},{"id":"FDN-035","t":"num","d":3,"tp":"耐久性 Durability","c":"2.6.4(2)","p":40,"q":"海床以下若無防腐措施，鋼材外表面合理的腐蝕損失允許值是每年多少 mm？","a":0.05,"tol":0,"u":"mm/年","e":"50 年設計年期即約 2.5 mm，須從截面扣減後再核算承載力。","x":"seabed level, an allowance for corrosion loss of 0.05 mm per year on the","q_en":"Without corrosion protection below the seabed, what is a reasonable corrosion allowance for the external surface of steel, in mm per year?","e_en":"About 2.5 mm over a 50-year design life, to be deducted from the section before checking capacity.","u_en":"mm/year","doc":"foundations-2017-2024ed","pp":"32","ex":"fdn","tier":"偶考"},{"id":"FDN-036","t":"mcq","d":2,"tp":"地盤勘探 Site investigation","c":"3.4.6(a)","p":53,"q":"遇到基岩時，應以鑽芯證明至最少多深（m），以免將孤石誤認為基岩？","a":1,"u":"m","e":"香港風化花崗岩常有 corestone，5 m 鑽芯是最低要求；表 2.1 的 TCR 亦要 5 m。","x":"Where bedrock is encountered, it should be proved by coring to a minimum","o":["2 m","5 m","3 m","10 m"],"q_en":"Where bedrock is encountered, coring should prove it to at least what depth (m), to avoid mistaking a boulder for bedrock?","e_en":"Decomposed granite in Hong Kong often contains corestones; 5 m of coring is the minimum requirement; the TCR in Table 2.1 also requires 5 m.","doc":"foundations-2017-2024ed","pp":"45","ex":"fdn","tier":"常考"},{"id":"FDN-038","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.1.2","p":59,"q":"5 支或以上豎向受荷摩擦樁的群樁，一般可接受的 group reduction factor？","a":2,"u":"","e":"端承樁、嵌岩樁、打至基岩或 N ≥200 地層的樁，以及中心距大於 3 倍周長的樁，一般毋須折減。NSF 亦可用同一折減系數。","x":"generally acceptable for a group of 5 or more vertically loaded piles. Other values of","o":["0.67","0.75","0.85","0.9"],"q_en":"For a group of 5 or more vertically loaded friction piles, what group reduction factor is generally acceptable?","e_en":"End-bearing piles, rock-socketed piles, piles driven to bedrock or N ≥200 strata, and piles with centre-to-centre spacing greater than 3 times the perimeter generally need no reduction. The same factor may be used for NSF.","doc":"foundations-2017-2024ed","pp":"51","ex":"fdn","tier":"必考"},{"id":"FDN-039","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"打入樁及主要靠摩擦的樁，最小樁距為？","o":["樁周長或 1 m，取較大","2 倍直徑或 750 mm，取較大","樁周長或 500 mm，取較大","3 倍直徑"],"a":0,"e":"距地界不少於半周長或 500 mm（取大）。H-pile 周長取 2(b+d)。嵌岩 mini-pile/socketed H-pile 為 750 mm 或 2 倍套管外徑。","x":"resistance, the minimum pile spacing shall be not less than the length of the perimeter","q_en":"What is the minimum spacing of driven piles and piles relying mainly on friction?","o_en":["The pile perimeter or 1 m, whichever is greater","2 times the diameter or 750 mm, whichever is greater","The pile perimeter or 500 mm, whichever is greater","3 times the diameter"],"e_en":"Distance to the site boundary not less than half the perimeter or 500 mm (whichever is greater). H-pile perimeter is taken as 2(b+d). Rock-socketed mini-piles/socketed H-piles: 750 mm or 2 times the outside diameter of the casing.","doc":"foundations-2017-2024ed","pp":"52","ex":"fdn","tier":"必考"},{"id":"FDN-040","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"端承鑽孔樁之間（或擴底邊緣）建議的最小淨水平距離（mm）？","a":3,"u":"mm","e":"考慮施工位置及垂直度偏差。樁位偏差 ±75 mm、垂直度 1:75，長樁底部可偏移相當多，要留意。","x":"recommended to provide a nominal minimum clear horizontal spacing of 500 mm","o":["750 mm","300 mm","1000 mm","500 mm"],"q_en":"Recommended minimum clear horizontal distance (mm) between end-bearing bored piles (or the edges of bell-outs)?","e_en":"Allows for construction positional and verticality tolerances. With pile position tolerance ±75 mm and verticality 1:75, the toe of a long pile can deviate considerably.","doc":"foundations-2017-2024ed","pp":"52","ex":"fdn","tier":"必考"},{"id":"FDN-042","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.1.7","p":61,"q":"主要靠樁身摩擦承托的群樁，用 equivalent raft method 計沉降時，等效筏的深度取？","o":["軟土層以下樁長的 2/3 深度","樁尖","樁帽底","樁長的 1/2"],"a":0,"e":"端承或嵌岩群樁則取樁尖水平。計算沉降要包括 NSF。","x":"depth equal to two thirds of the pile depth measured below any soft soil layer. For","q_en":"For a pile group supported mainly by shaft friction, when calculating settlement by the equivalent raft method, the depth of the equivalent raft is taken at:","o_en":["2/3 of the pile length below the soft stratum","The pile toe","The underside of the pile cap","1/2 of the pile length"],"e_en":"For end-bearing or rock-socketed pile groups, take the pile toe level. Settlement calculations must include NSF.","doc":"foundations-2017-2024ed","pp":"53","ex":"fdn","tier":"必考"},{"id":"FDN-043","t":"mcq","d":2,"tp":"負摩擦 NSF","c":"5.2.2","p":62,"q":"無更準確評估時，估算 NSF 的 shaft resistance coefficient β 經驗值？","a":3,"u":"","e":"NSF = ∫βσ'p dl。填海地及軟黏土場地必須計 NSF；Conventional Approach 將 NSF 視為 imposed load 加在樁上。","x":"absence of more accurate assessment, an empirical value of β = 0.25 may be assumed.","o":["0.5","0.35","0.1","0.25"],"q_en":"In the absence of a more accurate assessment, what is the empirical value of the shaft resistance coefficient β for estimating NSF?","e_en":"NSF = ∫βσ'p dl. NSF must be included on reclamation and soft clay sites; the Conventional Approach treats NSF as an imposed load on the pile.","doc":"foundations-2017-2024ed","pp":"54","ex":"fdn","tier":"常考"},{"id":"FDN-045","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"一般打入樁（非 H-pile）設計 final set 的範圍？","o":["25–50 mm / 10 blows","10–25 mm / 10 blows","25–100 mm / 10 blows","50–100 mm / 10 blows"],"a":0,"e":"一般打入樁 25–50 mm/10 擊；H-pile 25–100 mm（50–100 之間取 50）；打至基岩取 10 mm/10 擊。落錘效率不大於 0.7。","x":"(a) the design final set should not be less than 25 mm per 10 blows;","q_en":"What is the range of design final set for ordinary driven piles (not H-piles)?","e_en":"Ordinary driven piles 25–50 mm/10 blows; H-piles 25–100 mm (take 50 for values between 50 and 100); piles driven to bedrock 10 mm/10 blows. Drop hammer efficiency not greater than 0.7.","doc":"foundations-2017-2024ed","pp":"56","ex":"fdn","tier":"必考"},{"id":"FDN-046","t":"num","d":3,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"H-pile final set 計算中，(cp+cq)/L 大於多少時該計算值應作廢？","a":1.15,"tol":0,"u":"","e":"cp、cq 以 mm、L 以 m 計。比值過大表示打樁回彈異常，Hiley 公式結果不可靠。","x":"(cp+cq)/L is greater than 1.15, where cp and cq are in mm and L in m;","q_en":"In the H-pile final set calculation, the calculated value should be discarded when (cp+cq)/L is greater than what?","e_en":"cp and cq in mm, L in m. An excessive ratio indicates abnormal rebound during driving, making the Hiley formula result unreliable.","doc":"foundations-2017-2024ed","pp":"56","ex":"fdn","tier":"必考"},{"id":"FDN-047","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.3.4","p":72,"q":"樁的側向位移超過多少 mm 時必須考慮 P-Δ effect？","a":1,"u":"mm","e":"側向受力樁除土抗力及結構強度外，大變形時要計二階效應。","x":"(c) where pile deflection exceeds 25mm, P-∆ effect has to be addressed.","o":["20 mm","25 mm","50 mm","10 mm"],"q_en":"The P-Δ effect must be considered when the lateral displacement of a pile exceeds how many mm?","e_en":"For laterally loaded piles, besides soil resistance and structural strength, second-order effects must be included at large deformations.","doc":"foundations-2017-2024ed","pp":"64","ex":"fdn","tier":"必考"},{"id":"FDN-048","t":"mcq","d":3,"tp":"樁基 Piles","c":"Table 5.2","p":72,"q":"Table 5.2：樁距/樁徑 = 3 時，群樁 nh 的折減系數？","o":["0.25","0.40","0.70","1.00"],"a":0,"e":"3→0.25、4→0.40、6→0.70、8→1.00。少於 3 須用 elastic continuum 等方法。","x":"3 0.25 4 0.40 6 0.70 8 1.00","q_en":"Table 5.2: reduction factor on nh for a pile group with pile spacing/diameter = 3?","e_en":"3→0.25, 4→0.40, 6→0.70, 8→1.00. Below 3, methods such as elastic continuum must be used.","doc":"foundations-2017-2024ed","pp":"64","ex":"fdn","tier":"必考"},{"id":"FDN-049","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.1","p":74,"q":"H-pile 焊接接駁：打樁前以非破壞性檢測測試的焊口比例不少於百分之幾？","a":1,"u":"%","e":"發現問題要檢討焊接程序並重做 welder test 及 procedure test。","x":"(c) A sampling rate of not less than 10% of the total number of welded joints","o":["25%","10%","5%","20%"],"q_en":"H-pile welded splices: not less than what percentage of welds must be tested by non-destructive testing before driving?","e_en":"If problems are found, review the welding procedure and repeat the welder test and procedure test.","doc":"foundations-2017-2024ed","pp":"66","ex":"fdn","tier":"必考"},{"id":"FDN-050","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.2(2)","p":75,"q":"Socketed steel H-pile 預鑽孔應容許的最小灌漿保護層（樁底除外）為多少 mm？","a":2,"u":"mm","e":"灌漿須為 non-shrink、28 天強度 ≥30 MPa。","x":"the steel H-pile and to allow a minimum grout cover of 40 mm to the","o":["75 mm","25 mm","40 mm","50 mm"],"q_en":"What minimum grout cover (except at the pile toe) should the pre-bored hole allow for a socketed steel H-pile, in mm?","e_en":"Grout must be non-shrink with 28-day strength ≥30 MPa.","doc":"foundations-2017-2024ed","pp":"67","ex":"fdn","tier":"必考"},{"id":"FDN-051","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.6 / 5.4.7","p":76,"q":"小直徑鑽孔樁與大直徑鑽孔樁的分界直徑？","o":["600 mm","750 mm","900 mm","1000 mm"],"a":1,"e":"≤750 mm 屬 small diameter；>750 mm（以臨時鋼套管外徑計）屬 large diameter。Driven cast-in-place 樁最大亦為 750 mm。","x":"Small diameter bored piles should have a diameter not exceeding 750 mm.","q_en":"What diameter divides small-diameter and large-diameter bored piles?","e_en":"≤750 mm is small diameter; >750 mm (by outside diameter of the temporary steel casing) is large diameter. Driven cast-in-place piles are also limited to 750 mm.","doc":"foundations-2017-2024ed","pp":"68","ex":"fdn","tier":"必考"},{"id":"FDN-052","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.6(2)","p":77,"q":"CFA pile：工作樁的總 grout factor 不得少於試樁值，且在任何情況下不少於多少？","a":3,"u":"","e":"每 1.5 m 段 grout factor 不少於試樁最小值且不少於 1.15；總 grout factor 不少於 1.4。","x":"the trial pile and in no case be less than 1.4.","o":["1.1","1.5","1.2","1.4"],"q_en":"CFA piles: the overall grout factor of working piles must not be less than the test pile value and in no case less than what?","e_en":"The grout factor of each 1.5 m section not less than the test pile minimum and not less than 1.15; overall grout factor not less than 1.4.","doc":"foundations-2017-2024ed","pp":"69","ex":"fdn","tier":"必考"},{"id":"FDN-053","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.7","p":78,"q":"大直徑鑽孔樁的 bell-out 直徑及坡度限制？","o":["≤1.65 倍樁身直徑，坡度 ≤30°（由垂直量）","≤2 倍樁身直徑，坡度 ≤45°","≤1.5 倍樁身直徑，坡度 ≤20°","無限制"],"a":0,"e":"擴底同時用 socket friction 時，socket 長度不超過 1 倍直徑或 3 m（取短），並忽略擴底上方 750 mm。","x":"shaft diameter and the gradient should not exceed 30 degree from vertical.","q_en":"Limits on the bell-out diameter and slope of large-diameter bored piles?","o_en":["≤1.65 times the shaft diameter, slope ≤30° (from vertical)","≤2 times the shaft diameter, slope ≤45°","≤1.5 times the shaft diameter, slope ≤20°","No limit"],"e_en":"When a bell-out is combined with socket friction, the socket length is not more than 1 times the diameter or 3 m (whichever is less), ignoring 750 mm above the bell-out.","doc":"foundations-2017-2024ed","pp":"70","ex":"fdn","tier":"必考"},{"id":"FDN-054","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.7","p":78,"q":"大直徑鑽孔樁無擴底，端承與 rock socket 摩擦同時使用時，計算摩擦的 socket 長度不超過多少倍 socket 直徑（或 6 m，取短）？","a":2,"u":"倍","e":"有擴底時為 1 倍或 3 m。原因是端承與摩擦所需位移不同，要確保變形相容。","x":"calculating the bond or frictional resistance does not exceed two times the rock socket","o":["1 倍","4 倍","2 倍","3 倍"],"q_en":"For a large-diameter bored pile without a bell-out using both end bearing and rock socket friction, the socket length used for friction is not more than how many times the socket diameter (or 6 m, whichever is less)?","o_en":["1 times","4 times","2 times","3 times"],"e_en":"With a bell-out it is 1 times or 3 m. The reason is that end bearing and friction require different displacements, so deformation compatibility must be ensured.","u_en":"times","doc":"foundations-2017-2024ed","pp":"70","ex":"fdn","tier":"必考"},{"id":"FDN-055","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.8(1)","p":78,"q":"Mini-pile 的定義要求（毋須個別考慮）？","o":["≤5 支 ≤50 mm 鋼筋、套管外徑 ≤450 mm、工作荷載（無風）≤2350 kN","≤4 支 ≤40 mm 鋼筋、套管 ≤300 mm、≤1500 kN","≤6 支鋼筋、套管 ≤600 mm、≤3000 kN","無特別限制"],"a":0,"e":"超出任一條件要個別考慮，可能需要試樁。","x":"(c) pile capacity under working loads without wind not exceeding","q_en":"What are the defining requirements of a mini-pile (not requiring individual consideration)?","o_en":["≤5 bars of ≤50 mm, casing outside diameter ≤450 mm, working load (without wind) ≤2350 kN","≤4 bars of ≤40 mm, casing ≤300 mm, ≤1500 kN","≤6 bars, casing ≤600 mm, ≤3000 kN","No particular limits"],"e_en":"Exceeding any condition requires individual consideration, possibly including pile tests.","doc":"foundations-2017-2024ed","pp":"70","ex":"fdn","tier":"必考"},{"id":"FDN-056","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.8(2)","p":79,"q":"Mini-pile 鋼筋的容許應力可取屈服強度的百分之幾？","a":0,"u":"%","e":"結構承載力只計鋼筋，忽略灌漿和套管（應變不相容）。鋼筋與灌漿容許黏結 0.8 MPa。","x":"47.5% of the yield strength of the steel bars;","o":["47.5%","40%","55%","50%"],"q_en":"The allowable stress in mini-pile reinforcement may be taken as what percentage of the yield strength?","e_en":"Structural capacity counts only the reinforcement, ignoring grout and casing (strain incompatibility). Allowable bond between bar and grout 0.8 MPa.","doc":"foundations-2017-2024ed","pp":"71","ex":"fdn","tier":"必考"},{"id":"FDN-057","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.10","p":81,"q":"Hand-dug caisson 在哪種情況下仍可獲批？","o":["深度 ≤3 m 且內切圓直徑 ≥1.5 m","深度 ≤10 m","任何岩石地層","工期緊迫"],"a":0,"e":"因安全及健康理由已被禁止作一般用途；除 ≤3 m 淺井外，只有在唯一可行或無其他安全方案時才可。","x":"(a) the depth of the hand-dug caissons does not exceed 3 m and the diameter of the","q_en":"Under what circumstances may a hand-dug caisson still be approved?","o_en":["Depth ≤3 m and inscribed circle diameter ≥1.5 m","Depth ≤10 m","Any rock stratum","Tight programme"],"e_en":"Banned for general use on safety and health grounds; except shallow shafts ≤3 m, only where it is the only feasible option or there is no other safe alternative.","doc":"foundations-2017-2024ed","pp":"73","ex":"fdn","tier":"必考"},{"id":"FDN-058","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.11(1)","p":81,"q":"「Steel H-piles driven to bedrock」條文適用於坡度不陡於多少度（由水平量）的基岩？","a":2,"u":"°","e":"更陡的基岩要個別考慮並有更嚴格要求。基岩坡度 >15° 或樁長 <10 m 須至少兩支試樁。","x":"steeper than 25 degree from the horizontal. For steeper bedrock, the case","o":["15°","30°","25°","20°"],"q_en":"The \"Steel H-piles driven to bedrock\" provisions apply to bedrock with a slope not steeper than how many degrees (from horizontal)?","e_en":"Steeper bedrock requires individual consideration and more stringent requirements. With bedrock slope >15° or pile length <10 m, at least two test piles are required.","doc":"foundations-2017-2024ed","pp":"73","ex":"fdn","tier":"必考"},{"id":"FDN-059","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.11(5)","p":83,"q":"打至基岩的 H-pile：動力載荷試驗須在至少百分之幾的工作樁上進行（容量驗證）？","a":0,"u":"%","e":"其中一半選自較深的樁，終錘峰值應力不少於 75% fy；另需 20% 工作樁作完整性 DLT。","x":"(c) Dynamic load tests should be carried out on at least 10% of the","o":["10%","5%","1%","20%"],"q_en":"H-piles driven to bedrock: dynamic load tests must be carried out on at least what percentage of working piles (for capacity verification)?","e_en":"Half of them selected from the deeper piles, with peak stress at final set not less than 75% fy; another 20% of working piles need integrity DLT.","doc":"foundations-2017-2024ed","pp":"75","ex":"fdn","tier":"必考"},{"id":"FDN-060","t":"mcq","d":2,"tp":"監測 Monitoring","c":"Table 7.2","p":93,"q":"Table 7.2：不敏感建築的地面沉降 Alert / Alarm / Action 典型值？","o":["12 / 18 / 25 mm","10 / 15 / 20 mm","15 / 20 / 30 mm","6 / 12 / 18 mm"],"a":0,"e":"建築傾斜 1:1000 / 1:750 / 1:500。AAA 值要在監測計劃列明，到 Action level 須停工檢討。","x":"Ground settlement 12 mm 18 mm 25 mm","q_en":"Table 7.2: typical Alert / Alarm / Action values for ground settlement for buildings that are not sensitive?","e_en":"Building tilt 1:1000 / 1:750 / 1:500. AAA values must be stated in the monitoring plan; reaching the Action level requires works to stop for review.","doc":"foundations-2017-2024ed","pp":"85","ex":"ground","tier":"常考"},{"id":"FDN-061","t":"mcq","d":2,"tp":"振動 Vibration","c":"Table 7.3","p":94,"q":"Table 7.3：一般穩固建築受 transient/intermittent 振動的 ppv 限值（mm/s）？","a":0,"u":"mm/s","e":"穩固建築：短暫 15、連續 7.5；敏感或殘舊建築：7.5 / 3 mm/s。鐵路保護另按 PNAP。","x":"Robust and stable 15 7.5","o":["15 mm/s","25 mm/s","5 mm/s","10 mm/s"],"q_en":"Table 7.3: ppv limit (mm/s) for transient/intermittent vibration on ordinary robust buildings?","e_en":"Robust buildings: transient 15, continuous 7.5; sensitive or dilapidated buildings: 7.5 / 3 mm/s. Railway protection is covered separately by the PNAP.","doc":"foundations-2017-2024ed","pp":"86","ex":"constr","tier":"常考"},{"id":"FDN-062","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 7.4","p":99,"q":"Table 7.4：一般樁（非 mini-pile、非海事）的平面位置及垂直度容許偏差？","o":["±75 mm；1 in 75","±15 mm；1 in 100","±150 mm；1 in 25","±50 mm；1 in 100"],"a":0,"e":"Mini-pile ±15 mm / 1:100（有理據可增至 ±75 mm）；海事樁 ±150 mm / 1:25；樁帽等 ±50 mm。偏差超標要重新核算樁帽。","x":"3. Piles other than items 1and 2 ± 75 mm 1 in 75 ± 3%","q_en":"Table 7.4: tolerances on plan position and verticality for ordinary piles (not mini-piles, not marine)?","o_en":["±75 mm; 1 in 75","±15 mm; 1 in 100","±150 mm; 1 in 25","±50 mm; 1 in 100"],"e_en":"Mini-piles ±15 mm / 1:100 (may be increased to ±75 mm with justification); marine piles ±150 mm / 1:25; pile caps etc. ±50 mm. If tolerances are exceeded, recheck the pile cap.","doc":"foundations-2017-2024ed","pp":"91","ex":"constr","tier":"常考"},{"id":"FDN-064","t":"mcq","d":2,"tp":"樁基測試 Pile testing","c":"8.4(b)","p":104,"q":"壓力載荷試驗中，兩倍工作荷載須維持至少多少小時？","a":2,"u":"小時","e":"72 小時的持荷期，試樁時間表要預留。","x":"maintained for at least 72 hours before removal;","o":["24 小時","48 小時","72 小時","12 小時"],"q_en":"In a compression load test, twice the working load must be held for at least how many hours?","o_en":["24 hours","48 hours","72 hours","12 hours"],"e_en":"A 72-hour holding period; allow for it in the test pile programme.","u_en":"hours","doc":"foundations-2017-2024ed","pp":"96","ex":"fdn","tier":"常考"},{"id":"FDN-065","t":"mcq","d":2,"tp":"樁基測試 Pile testing","c":"8.5","p":105,"q":"Proof core-drilling 須鑽入樁底以下多深？","o":["樁底直徑一半或 600 mm，取較大","1 m","樁底直徑或 1.5 m","5 m"],"a":0,"e":"用於大直徑鑽孔樁及 barrette，檢查樁身混凝土、岩石及接觸面。土層承托的樁要做 SPT 每 1.5 m 至 3 倍樁底直徑或 5 m。","x":"down to a distance of at least half a diameter of the pile base, or 600 mm,","q_en":"How far below the pile toe must proof core-drilling extend?","o_en":["Half the pile toe diameter or 600 mm, whichever is greater","1 m","The pile toe diameter or 1.5 m","5 m"],"e_en":"Used for large-diameter bored piles and barrettes to check the shaft concrete, rock and interface. Piles founded in soil require SPT every 1.5 m down to 3 times the toe diameter or 5 m.","doc":"foundations-2017-2024ed","pp":"97","ex":"fdn","tier":"常考"},{"id":"FDN-066","t":"mcq","d":2,"tp":"樁基測試 Pile testing","c":"8.7","p":106,"q":"Sonic echo test 的樁長/直徑比不應超過多少以確保量度準確？","a":3,"u":"","e":"另須在混凝土澆注至少 7 天後進行，不適用於有接駁的樁。","x":"(c) the length to diameter ratio of the pile should not exceed 30 for accurate","o":["50","10","20","30"],"q_en":"The pile length/diameter ratio for a sonic echo test should not exceed what, to ensure accurate measurement?","e_en":"It must also be carried out at least 7 days after concreting, and is not applicable to piles with splices.","doc":"foundations-2017-2024ed","pp":"98","ex":"fdn","tier":"常考"},{"id":"FDN-067","t":"tf","d":2,"tp":"樁基測試 Pile testing","c":"8.9","p":107,"q":"在香港，dynamic load test 一般被接受為基礎的 proof test。","a":false,"e":"因香港動靜載對比研究有限，DLT 一般不接受為 proof test，但可用於找缺陷、篩選較弱樁、監察打樁應力及錘效率。","x":"as proof test for foundations under normal circumstances. It may however be used for","q_en":"In Hong Kong, the dynamic load test is generally accepted as a proof test for foundations.","e_en":"False. Because Hong Kong correlation studies between dynamic and static tests are limited, DLT is generally not accepted as a proof test, but it can be used to locate defects, screen weaker piles and monitor driving stresses and hammer efficiency.","doc":"foundations-2017-2024ed","pp":"99","ex":"fdn","tier":"常考"},{"id":"GG1-001","t":"mcq","d":2,"tp":"安全系數 Partial factors","c":"Table 6","p":139,"q":"Geoguide 1 Table 6：ULS 設計中 surcharge 的最小 partial load factor γf？","o":["1.5","1.0","1.2","1.6"],"a":0,"e":"擋土牆自重、泥土/岩石/水重、地震及水壓都是 1.0，只有 surcharge 1.5。若 surcharge 有利（例如 L 形牆踵上方），γf 取 0。","x":"Surcharge 1.5(1)","q_en":"Geoguide 1 Table 6: minimum partial load factor γf for surcharge in ULS design?","e_en":"Self-weight of the wall, weight of soil/rock/water, seismic load and water pressure are all 1.0; only surcharge is 1.5. Where surcharge is favourable (e.g. above the heel of an L-shaped wall), γf is taken as 0.","doc":"geoguide1-retaining-walls","pp":"138","ex":"ground","tier":"常考"},{"id":"GG1-002","t":"mcq","d":2,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：土的 drained shear strength（c' 及 tan φ'）的 partial material factor γm？","a":3,"u":"","e":"γm 1.2 同時作用於 c' 和 tan φ'（不是 φ'）。Base friction tan δb 亦 1.2；undrained su 2.0。","x":"drained shear strength 1.2(2)","o":["1.5","2.0","1.0","1.2"],"q_en":"Table 7: partial material factor γm for the drained shear strength of soil (c' and tan φ')?","e_en":"γm 1.2 applies to both c' and tan φ' (not φ'). Base friction tan δb is also 1.2; undrained su 2.0.","doc":"geoguide1-retaining-walls","pp":"138","ex":"ground","tier":"常考"},{"id":"GG1-003","t":"mcq","d":2,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：土的 undrained shear strength su 的 γm？","a":2,"u":"","e":"不排水強度不確定性大，所以 γm 2.0；岩石抗壓強度亦 2.0。","x":"undrained shear strength su 2.0","o":["1.5","3.0","2.0","1.2"],"q_en":"Table 7: γm for the undrained shear strength su of soil?","e_en":"Undrained strength is highly uncertain, hence γm 2.0; the compressive strength of rock is also 2.0.","doc":"geoguide1-retaining-walls","pp":"138","ex":"ground","tier":"常考"},{"id":"GG1-004","t":"num","d":3,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：Granular filter and drainage materials 的 permeability γm？","a":10.0,"tol":0,"u":"","e":"濾層透水性要打 10 倍折減，反映堵塞及施工變異的風險，設計排水層時要以折減後透水性核算。","x":"Granular filter and drainage materials : permeability k 10.0","q_en":"Table 7: γm for the permeability of granular filter and drainage materials?","e_en":"Filter permeability is reduced by a factor of 10, reflecting the risk of clogging and construction variability; drainage layers must be checked with the reduced permeability.","doc":"geoguide1-retaining-walls","pp":"138","ex":"ground","tier":"常考"},{"id":"GG1-005","t":"tf","d":2,"tp":"安全系數 Partial factors","c":"4.3.4(2)","p":32,"q":"Geoguide 1 的 partial material factor γm 應作用在 φ' 本身，即 φf' = φ'/γm。","a":false,"e":"應作用在 tan φ'：tan φf' = tan φ'/γm。直接除 φ' 會得出錯誤（偏不保守或不一致）的結果，是常見錯誤。","x":"tan ϕf' = tan ϕ' / γm","q_en":"The Geoguide 1 partial material factor γm should be applied to φ' itself, i.e. φf' = φ'/γm.","e_en":"False. It applies to tan φ': tan φf' = tan φ'/γm. Dividing φ' directly gives wrong (unconservative or inconsistent) results — a common error.","doc":"geoguide1-retaining-walls","pp":"31","ex":"ground","tier":"常考"},{"id":"GG1-007","t":"mcq","d":2,"tp":"土壓力 Earth pressure","c":"6.4","p":60,"q":"正常固結土、水平地面的靜止土壓力係數 Ko（Jaky）？","o":["1 − sin φ'","tan²(45° − φ'/2)","1 + sin φ'","0.5"],"a":0,"e":"Ko = 1 − sin φ'，亦可保守地用於香港殘積土。地庫外牆、有支撐不能移動的牆應用 at-rest 壓力。回填壓實會令頂部壓力更高（6.8）。","x":"Ko = 1 - sin ϕ'","q_en":"Earth pressure coefficient at rest Ko (Jaky) for normally consolidated soil with horizontal ground?","e_en":"Ko = 1 − sin φ', which may also be used conservatively for Hong Kong saprolites. Basement walls and propped walls that cannot move should be designed for at-rest pressure. Compaction of backfill increases the pressure near the top (6.8).","doc":"geoguide1-retaining-walls","pp":"59","ex":"ground","tier":"必考"},{"id":"GG1-008","t":"mcq","d":3,"tp":"土壓力 Earth pressure","c":"6.4","p":60,"q":"豎直牆擋上斜地面（坡角 β）時的靜止土壓力係數 Koβ？","o":["(1 − sin φ')(1 + sin β)","(1 − sin φ')/cos β","1 − sin(φ' − β)","(1 − sin φ')(1 − sin β)"],"a":0,"e":"向下斜的回填則 β 取 0。壓力方向平行於地面。","x":"Koβ = (1 - sin ϕ') (1 + sin β)","q_en":"Earth pressure coefficient at rest Koβ for a vertical wall retaining sloping ground (slope angle β)?","e_en":"For backfill sloping downwards, β is taken as 0. The pressure acts parallel to the ground surface.","doc":"geoguide1-retaining-walls","pp":"59","ex":"ground","tier":"必考"},{"id":"GG1-009","t":"mcq","d":1,"tp":"附加荷載 Surcharge","c":"7.2.1","p":69,"q":"所有擋土牆周邊應考慮的最小 surcharge（kPa，配合適當荷載系數）？","a":3,"u":"kPa","e":"涵蓋施工機械、堆料及交通等偶然荷載。除非場地佈局明顯不需要，否則都要計。","x":"A minimum surcharge of 10 kPa with an appropriate","o":["5 kPa","20 kPa","15 kPa","10 kPa"],"q_en":"Minimum surcharge (kPa, with appropriate load factors) to be considered around all retaining walls?","e_en":"Covers incidental loads from construction plant, stockpiles, traffic, etc. It should always be included unless the site layout clearly makes it unnecessary.","doc":"geoguide1-retaining-walls","pp":"68","ex":"ground","tier":"必考"},{"id":"GG1-010","t":"mcq","d":2,"tp":"附加荷載 Surcharge","c":"Table 16","p":146,"q":"Table 16：淺基礎建築物的 nominal surcharge？","o":["每層 10 kPa","每層 5 kPa","每層 15 kPa","固定 20 kPa"],"a":0,"e":"存放重貨或機器的建築 10 kPa/層可能不足，要詳細評估。與行人路、單車徑的 5 kPa 不同。","x":"Buildings with shallow foundations(1) 10 kPa per storey(2)","q_en":"Table 16: nominal surcharge for buildings on shallow foundations?","o_en":["10 kPa per storey","5 kPa per storey","15 kPa per storey","A fixed 20 kPa"],"e_en":"10 kPa/storey may be inadequate for buildings storing heavy goods or machinery, which need detailed assessment. Different from the 5 kPa for footpaths and cycle tracks.","doc":"geoguide1-retaining-walls","pp":"145","ex":"ground","tier":"必考"},{"id":"GG1-011","t":"mcq","d":2,"tp":"附加荷載 Surcharge","c":"Table 16","p":146,"q":"Table 16：與道路隔離的行人路、單車徑及遊樂場的 nominal surcharge（kPa）？","a":2,"u":"kPa","e":"如行人路未與道路隔離而可能有車停泊，須用公路荷載。","x":"Footpaths isolated from roads, cycle tracks 5 kPa","o":["2.5 kPa","10 kPa","5 kPa","20 kPa"],"q_en":"Table 16: nominal surcharge (kPa) for footpaths, cycle tracks and playgrounds isolated from roads?","e_en":"If a footpath is not isolated from a road and vehicles may park on it, highway loading must be used.","doc":"geoguide1-retaining-walls","pp":"145","ex":"ground","tier":"必考"},{"id":"GG1-013","t":"tf","d":2,"tp":"水壓 Water pressure","c":"8.1","p":74,"q":"排水設施足夠的常規重力式及 RC 擋土牆，設計上可假設零水壓。","a":true,"e":"但非常規設計（例如擋大量泥土）及懸臂式牆（cantilevered retaining walls）須詳細評估水壓。大量擋土牆失效與水有關，排水設計至關重要。","x":"for conventional gravity and reinforced concrete retaining walls with","q_en":"For conventional gravity and RC retaining walls with adequate drainage, zero water pressure may be assumed in design.","e_en":"True. But non-conventional designs (e.g. retaining large amounts of soil) and cantilevered retaining walls require detailed assessment of water pressure. Many retaining wall failures are water-related, so drainage design is crucial.","doc":"geoguide1-retaining-walls","pp":"73","ex":"ground","tier":"必考"},{"id":"GG1-014","t":"num","d":3,"tp":"水壓 Water pressure","c":"8.2.1","p":74,"q":"有暴雨反應的地下水位，設計水位應以典型水位加上多少年回歸期暴雨的水位上升？","a":1000,"tol":0,"u":"年","e":"1 000 年只是表示低超越機率的指標，並非要精確預測；1 000 年雨量在 120 年內約有 11% 超越機率。","x":"water level should be based on a storm rise corresponding to a 1 000-year return period","q_en":"For a groundwater level that responds to rainstorms, the design water level should be the typical level plus the rise due to a rainstorm of what return period (years)?","e_en":"The 1 000 years is only an indicator of low exceedance probability, not a precise prediction; a 1 000-year rainfall has about an 11% probability of exceedance in 120 years.","u_en":"years","doc":"geoguide1-retaining-walls","pp":"73","ex":"ground","tier":"必考"},{"id":"GG1-015","t":"tf","d":2,"tp":"水壓 Water pressure","c":"8.2.1","p":74,"q":"Geoguide 1 要求 worst credible water level 一律取至擋土牆頂。","a":false,"e":"Worst credible 應按集水區、補給及排水評估，不應脫離實際地取最壞可能水位（例如到牆頂）。但低窪填海區要考慮水管爆裂令水位升至地面。","x":"context, e.g. groundwater level up to the top of the retaining wall. Some guidance on the","q_en":"Geoguide 1 requires the worst credible water level always to be taken at the top of the retaining wall.","e_en":"False. The worst credible level should be assessed from the catchment, recharge and drainage, not by unrealistically taking the worst possible level (e.g. at the top of the wall). But in low-lying reclamation, consider burst water mains raising the level to ground surface.","doc":"geoguide1-retaining-walls","pp":"73","ex":"ground","tier":"必考"},{"id":"GG1-016","t":"mcq","d":2,"tp":"水壓 Water pressure","c":"8.2.1","p":75,"q":"Geoguide 1 對擋土牆後的輸水管道（食水、污水、雨水渠）的最低預防措施？","o":["盡可能不要放在牆後 active zone 內","只需加厚管壁","可放於任何位置","只需每年檢查"],"a":0,"e":"無法改線時要用密封渠槽或套管引至排放點並監測滲漏。","x":"placed within the 'active' zone behind a retaining wall. In some cases, more remote services","q_en":"What is Geoguide 1's minimum precaution for water-carrying services (fresh water, sewers, stormwater drains) behind retaining walls?","o_en":["As far as possible, do not place them within the active zone behind the wall","Only thicken the pipe walls","They may be placed anywhere","Only inspect annually"],"e_en":"Where they cannot be diverted, use sealed troughs or ducts leading to discharge points and monitor for leakage.","doc":"geoguide1-retaining-walls","pp":"74","ex":"ground","tier":"必考"},{"id":"GG1-017","t":"mcq","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.2.4","p":87,"q":"建於土上的重力式擋土牆，為限制傾側，合力應落在牆底的？","o":["中間三分之一","中間一半","中間四分之一","任何位置只要不傾覆"],"a":0,"e":"Middle-third rule（以未乘系數荷載計）；若改做變形計算，良好做法仍限於 middle half。符合時毋須再檢查傾覆。","x":"wall base under the worst loading combination. As an alternative to the middle-third rule,","q_en":"For a gravity retaining wall founded on soil, to limit tilting, the resultant force should fall within which part of the base?","o_en":["The middle third","The middle half","The middle quarter","Anywhere, as long as it does not overturn"],"e_en":"The middle-third rule (with unfactored loads); if deformation calculations are done instead, good practice still limits it to the middle half. If satisfied, overturning need not be checked separately.","doc":"geoguide1-retaining-walls","pp":"86","ex":"ground","tier":"偶考"},{"id":"GG1-018","t":"mcq","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.3.1","p":87,"q":"Mass concrete 擋土牆特別適用於擋土高度少於多少 m？","a":1,"u":"m","e":"更高時其他牆型通常更經濟。","x":"particularly suitable for retained heights of less than 3 m. While they can be designed for","o":["6 m","3 m","5 m","2 m"],"q_en":"Mass concrete retaining walls are particularly suitable for retained heights of less than how many m?","e_en":"For greater heights, other wall types are usually more economical.","doc":"geoguide1-retaining-walls","pp":"86","ex":"ground","tier":"偶考"},{"id":"GG1-019","t":"mcq","d":1,"tp":"重力式擋土牆 Gravity walls","c":"9.3.1","p":88,"q":"牆面名義上豎直時，建議的背傾（back batter）？","o":["約 1 in 50","約 1 in 10","約 1 in 100","不需要"],"a":0,"e":"避免牆看起來向前傾的視覺錯覺；地基可壓縮時可加大。","x":"For walls with a nominally vertical front face, a back batter of approximately 1 in 50","q_en":"Recommended back batter when the wall face is nominally vertical?","o_en":["About 1 in 50","About 1 in 10","About 1 in 100","Not needed"],"e_en":"Avoids the optical illusion of the wall leaning forward; may be increased where the foundation is compressible.","doc":"geoguide1-retaining-walls","pp":"87","ex":"ground","tier":"偶考"},{"id":"GG1-020","t":"mcq","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.3.4","p":89,"q":"Mass concrete 擋土牆的伸縮縫（expansion）及收縮縫（contraction）間距上限？","o":["22.5 m 及 7.5 m","30 m 及 10 m","15 m 及 5 m","20 m 及 7.5 m"],"a":0,"e":"豎向施工縫約 7.5 m 並與收縮/伸縮縫重合；地基性質改變處（如填土轉原土）亦要設縫。","x":"As a guide, expansion and contraction joints should be spaced not more than 22.5 m and 7.5 m","q_en":"Maximum spacing of expansion and contraction joints in mass concrete retaining walls?","o_en":["22.5 m and 7.5 m","30 m and 10 m","15 m and 5 m","20 m and 7.5 m"],"e_en":"Vertical construction joints at about 7.5 m, coinciding with contraction/expansion joints; joints are also needed where foundation conditions change (e.g. fill to in-situ ground).","doc":"geoguide1-retaining-walls","pp":"88","ex":"ground","tier":"偶考"},{"id":"GG1-021","t":"mcq","d":3,"tp":"牆面摩擦 Wall friction","c":"Table 14","p":144,"q":"Table 14：RC L 形懸臂牆 virtual back 計算 active 土壓力時，δmax 取？","o":["φ'/2 或回填坡角，取較小","2φ'/3","φ'","0"],"a":0,"e":"Mass concrete 牆背與土接觸面可用 2φ'/3。牆可能沉降或建於可壓縮地基時，δ 取 0。","x":"At the 'virtual back' of R.C. L- or inverted T- +ϕ'/2 or","q_en":"Table 14: δmax for active earth pressure on the virtual back of an RC L-shaped cantilever wall?","o_en":["φ'/2 or the backfill slope angle, whichever is less","2φ'/3","φ'","0"],"e_en":"2φ'/3 may be used at the soil contact on the back of mass concrete walls. Where the wall may settle or is on a compressible foundation, take δ as 0.","doc":"geoguide1-retaining-walls","pp":"143","ex":"ground","tier":"偶考"},{"id":"GG1-022","t":"tf","d":2,"tp":"牆面摩擦 Wall friction","c":"5.11.1","p":54,"q":"擋軟黏土或受顯著振動的粒狀土（如鐵路旁）時，δ 應假設為零。","a":true,"e":"振動會令牆面摩擦無法可靠發揮。牆背黏著力一般亦忽略。","x":"For walls retaining soft cohesive soils or granular soils which will be subjected to","q_en":"When retaining soft clay or granular soil subject to significant vibration (e.g. next to a railway), δ should be assumed to be zero.","e_en":"True. Vibration prevents wall friction from being reliably mobilised. Wall adhesion is also generally ignored.","doc":"geoguide1-retaining-walls","pp":"53","ex":"ground","tier":"偶考"},{"id":"GG1-024","t":"mcq","d":2,"tp":"岩土參數 Geotechnical parameters","c":"Table 8","p":140,"q":"Table 8：壓實 CDG 回填的典型 φ' 範圍？","o":["38°–42°","35°–38°","26°–40°","45°–50°"],"a":0,"e":"壓實 CDV 35–38°；碎石填料 45°–>50°；崩積土 26–40°。表內數值只作一般參考，設計須以試驗為準。","x":"Completely decomposed 19 - 21 15 - 19 38° - 42° 0-5 10-6 - 10-7","q_en":"Table 8: typical φ' range of compacted CDG backfill?","e_en":"Compacted CDV 35–38°; rock fill 45°–>50°; colluvium 26–40°. Table values are for general guidance only; design must be based on tests.","doc":"geoguide1-retaining-walls","pp":"139","ex":"ground","tier":"常考"},{"id":"GG1-025","t":"mcq","d":3,"tp":"岩土參數 Geotechnical parameters","c":"Table 8 Note (6)","p":140,"q":"原位 CDG 的 φcv' 下限約為多少度？","a":1,"u":"°","e":"CDV 約 30°。這是計算 δb 時常用的保守值。","x":"(6) The lower bound value of ϕcv' for insitu completely decomposed granites and","o":["30°","34°","38°","28°"],"q_en":"What is the approximate lower bound of φcv' for insitu CDG, in degrees?","e_en":"About 30° for CDV. This is the conservative value commonly used for δb.","doc":"geoguide1-retaining-walls","pp":"139","ex":"ground","tier":"常考"},{"id":"GG1-026","t":"mcq","d":2,"tp":"回填 Backfill","c":"3.2.2","p":21,"q":"Geoguide 1 對黏土回填的建議？","o":["不建議使用（膨脹、收縮及固結問題）","最佳回填材料","只可用於底層","需加石灰即可"],"a":0,"e":"均勻粉土亦不應使用（難以壓實）。理想回填是自由排水、耐久、高強度及高剛度的材料。","x":"The use of clay backfills is not recommended because of problems associated with","q_en":"What is Geoguide 1's recommendation on clay backfill?","o_en":["Not recommended (swelling, shrinkage and consolidation problems)","The best backfill material","Only for the bottom
