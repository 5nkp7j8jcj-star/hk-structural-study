 layer","Adding lime is enough"],"e_en":"Uniform silts should also not be used (difficult to compact). Ideal backfill is free-draining, durable, of high strength and high stiffness.","doc":"geoguide1-retaining-walls","pp":"20","ex":"ground","tier":"偶考"},{"id":"GG1-027","t":"mcq","d":2,"tp":"設計方法 Design approach","c":"4.3.1","p":29,"q":"Middle-third rule 屬於 Geoguide 1 的哪種設計方法？","o":["Indirect approach","Direct approach","Observational method","Prescriptive measure"],"a":0,"e":"Indirect approach 以限制偏心來間接滿足變形要求，適合常規設計。","x":"approach is the application of the middle-third rule in the design of gravity retaining walls","q_en":"The middle-third rule belongs to which Geoguide 1 design approach?","e_en":"The indirect approach satisfies deformation requirements indirectly by limiting eccentricity, and suits routine design.","doc":"geoguide1-retaining-walls","pp":"28","ex":"ground","tier":"常考"},{"id":"GG3-001","t":"mcq","d":1,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Geoguide 3 Table 2：「Moderately strong」岩石材料的 UCS 範圍？","o":["12.5 – 50 MPa","5 – 12.5 MPa","50 – 100 MPa","100 – 200 MPa"],"a":0,"e":"Table 2 在 BS 分級基礎上向弱端延伸（extremely weak < 0.5 MPa、very weak 0.5–1.25 MPa），以涵蓋香港常見的風化岩。基礎設計時 rock socket / bearing 的 UCS 取值要與鑽孔記錄的描述一致。","x":"Moderately 12.5 - 50 0.5 - 2 Scratched by pocket knife","q_en":"Geoguide 3 Table 2: UCS range of \"moderately strong\" rock material?","e_en":"Table 2 extends the BS classification towards the weak end (extremely weak < 0.5 MPa, very weak 0.5–1.25 MPa) to cover the decomposed rocks common in Hong Kong. In foundation design, UCS values for rock sockets / bearing must be consistent with the descriptions in the borehole logs.","doc":"geoguide3-rock-soil-descriptions","pp":"","ex":"fdn","tier":"常考"},{"id":"GG3-002","t":"mcq","d":2,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Table 2：「Extremely weak」岩石材料的 UCS 上限？","a":2,"u":"MPa","e":"< 0.5 MPa：用手易捏碎、拇指甲可深壓。Note：very weak 及 extremely weak 適用於原位風化形成的土（saprolite）。","x":"Extremely < 0.5 Easily crumbled by hand; indented deeply by thumbnail.","o":["5 MPa","1.25 MPa","0.5 MPa","12.5 MPa"],"q_en":"Table 2: upper limit of UCS for \"extremely weak\" rock material?","e_en":"< 0.5 MPa: easily crumbled by hand, indented deeply by thumbnail. Note: very weak and extremely weak apply to soils formed by in-situ decomposition (saprolite).","doc":"geoguide3-rock-soil-descriptions","pp":"","ex":"fdn","tier":"常考"},{"id":"GG3-003","t":"mcq","d":2,"tp":"岩石強度 Rock strength","c":"2.3.1","p":13,"q":"Geoguide 3 以 UCS 推算花崗岩/火山岩 point load index 時用的 correlation factor？","a":2,"u":"","e":"Is(50) ≈ UCS/24；但在 PLS 弱端可靠性較低。foundation design 以 point load 推 UCS 時應說明此假設並配合 UCS 試驗校核。","x":"These values are derived by applying a correlation factor of 24 to UCS values.","o":["16","10","24","20"],"q_en":"What correlation factor does Geoguide 3 use to derive the point load index of granite/volcanic rock from UCS?","e_en":"Is(50) ≈ UCS/24; but reliability is lower at the weak end of PLS. When deriving UCS from point load tests for foundation design, state this assumption and calibrate with UCS tests.","doc":"geoguide3-rock-soil-descriptions","pp":"12","ex":"fdn","tier":"常考"},{"id":"GG3-004","t":"mcq","d":2,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Table 2：Strong rock（花崗岩/火山岩）的近似 point load index Is(50)？","o":["2 – 4 MPa","0.5 – 2 MPa","4 – 8 MPa","> 8 MPa"],"a":0,"e":"Strong 50–100 MPa ↔ Is(50) 2–4 MPa（即 UCS/24 的近似）。","x":"Strong 50 - 100 2-4 Firm blows with point of geological pick cause only superficial","q_en":"Table 2: approximate point load index Is(50) for strong rock (granite/volcanic)?","e_en":"Strong 50–100 MPa ↔ Is(50) 2–4 MPa (i.e. approximately UCS/24).","doc":"geoguide3-rock-soil-descriptions","pp":"","ex":"fdn","tier":"常考"},{"id":"GG3-005","t":"mcq","d":1,"tp":"風化分級 Weathering grades","c":"Checklist (Table 4 summary)","p":173,"q":"「Original rock texture preserved；可用手指壓碎成顆粒；slakes in water」描述哪個 decomposition grade？","o":["Grade V completely decomposed","Grade IV highly decomposed","Grade VI residual soil","Grade III moderately decomposed"],"a":0,"e":"Grade V（CDG/CDV）保留原岩紋理但已可捏碎、會 slake；Grade IV 不會 slake、需用手掰成小塊。香港 foundation 及 slope 工程中 CDG 是最常見的地層，須清楚分辨 V 與 VI。","x":"Original rock texture preserved; can be crumbled by hand and","q_en":"\"Original rock texture preserved; can be crumbled by hand into constituent grains; slakes in water\" describes which decomposition grade?","e_en":"Grade V (CDG/CDV) retains the original rock texture but can be crumbled and slakes; Grade IV does not slake and can be broken by hand into smaller pieces. CDG is the most common stratum in Hong Kong foundation and slope works, so distinguish V from VI clearly.","doc":"geoguide3-rock-soil-descriptions","pp":"","ex":"fdn","tier":"必考"},{"id":"GG3-006","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":17,"q":"Geoguide 3 用 slake test 分辨 completely decomposed 與 highly decomposed rock。","a":true,"e":"正確。Slake test 需要水和小容器；飽和土樣（地下水位以下取樣）較難應用。","x":"which is used to distinguish between completely and highly decomposed rock","q_en":"Geoguide 3 uses the slake test to distinguish completely decomposed from highly decomposed rock.","e_en":"True. The slake test needs water and a small container; it is harder to apply to saturated samples (taken below the water table).","doc":"geoguide3-rock-soil-descriptions","pp":"16","ex":"fdn","tier":"必考"},{"id":"GG3-007","t":"mcq","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":19,"q":"Grade V completely decomposed rock 應如何作完整描述？","o":["以岩石術語描述，需要時補充重塑狀態的土壤術語","只用土壤術語","只寫 grade 符號","以 residual soil 術語描述"],"a":0,"e":"Grade V 保留原岩紋理，故以 rock terms 描述，括號內補充重塑土名及密實度；Grade VI 已失去原岩紋理，只能用 soil terms。","x":"Since grade V materials retain the","q_en":"How should Grade V completely decomposed rock be fully described?","o_en":["In rock terms, supplemented where necessary by soil terms for the remoulded state","In soil terms only","Only the grade symbol","In residual soil terms"],"e_en":"Grade V retains the original rock texture, so it is described in rock terms, with the remoulded soil name and density added in brackets; Grade VI has lost the original rock texture and can only be described in soil terms.","doc":"geoguide3-rock-soil-descriptions","pp":"18","ex":"fdn","tier":"必考"},{"id":"GG3-009","t":"mcq","d":1,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":29,"q":"RQD 的定義是？","o":["每段長度 > 100 mm 的 solid core 總長佔 core run 的百分比","所有回收岩芯佔 core run 的百分比","solid core 佔 core run 的百分比","每米裂隙數目"],"a":0,"e":"TCR = 全部回收；SCR = solid core；RQD = > 100 mm solid core 片；FI = 每米裂隙數。只計 natural fractures，鑽探造成的 artificial fractures 要剔除；有疑問時視為 natural。","x":"solid core pieces, each greater than 100 mm between natural","q_en":"What is the definition of RQD?","o_en":["Total length of solid core pieces each > 100 mm long, as a percentage of the core run","All recovered core as a percentage of the core run","Solid core as a percentage of the core run","Number of fractures per metre"],"e_en":"TCR = all recovered; SCR = solid core; RQD = solid core pieces > 100 mm; FI = fractures per metre. Only natural fractures are counted; artificial fractures caused by drilling are excluded; when in doubt treat as natural.","doc":"geoguide3-rock-soil-descriptions","pp":"28","ex":"fdn","tier":"必考"},{"id":"GG3-010","t":"tf","d":2,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":28,"q":"評估 fracture state 時，鑽探造成的人工裂隙應計入。","a":false,"e":"錯誤，只計天然地質裂隙；粗糙、帶新鮮解理面的斷口通常是人工裂隙。有疑問時習慣上當作 natural。","x":"Only natural geological fractures should be taken into account for the description of","q_en":"When assessing fracture state, artificial fractures caused by drilling should be counted.","e_en":"False. Only natural geological fractures are counted; rough breaks with fresh cleavage surfaces are usually artificial. By convention, doubtful ones are treated as natural.","doc":"geoguide3-rock-soil-descriptions","pp":"27","ex":"fdn","tier":"必考"},{"id":"GG3-012","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：SPT N = 10–30 的砂/礫石 compactness 描述為？","o":["Medium dense","Loose","Dense","Very dense"],"a":0,"e":"SPT N 與密實度對應：0–4 very loose、4–10 loose、10–30 medium dense、30–50 dense、> 50 very dense。設計時用 N 值推 φ' 或樁側摩阻前，先確認描述一致。","x":"Medium dense 10 - 30","q_en":"Table 12: compactness term for sand/gravel with SPT N = 10–30?","e_en":"SPT N versus compactness: 0–4 very loose, 4–10 loose, 10–30 medium dense, 30–50 dense, > 50 very dense. Before using N values to derive φ' or pile shaft friction in design, confirm the descriptions are consistent.","doc":"geoguide3-rock-soil-descriptions","pp":"79","ex":"fdn","tier":"偶考"},{"id":"GG3-013","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：'Firm' 粉土/黏土的 undrained shear strength 下限？","a":1,"u":"kPa","e":"Very soft < 20、soft 20–40、firm 40–75、stiff 75–150、very stiff/hard > 150 kPa。海泥（marine deposit）多為 very soft 至 soft。","x":"Silts and Clays Firm 40 - 75","o":["20 kPa","40 kPa","75 kPa","50 kPa"],"q_en":"Table 12: lower limit of undrained shear strength for 'firm' silt/clay?","e_en":"Very soft < 20, soft 20–40, firm 40–75, stiff 75–150, very stiff/hard > 150 kPa. Marine deposits are mostly very soft to soft.","doc":"geoguide3-rock-soil-descriptions","pp":"79","ex":"fdn","tier":"偶考"},{"id":"GG3-014","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"3.3.4(2)","p":38,"q":"土壤（不計 boulders/cobbles）含細粒至少約多少百分比時稱為 silt 或 clay（fine soil）？","a":3,"u":"%","e":"≥ 約 35% fines → SILT/CLAY；< 35% → SAND/GRAVEL。工程的 'well-graded' 相當於地質的 'poorly-sorted'，兩者用詞相反。","x":"contains about 35% or more of fine material, it is","o":["15%","25%","50%","35%"],"q_en":"A soil (excluding boulders/cobbles) is called silt or clay (fine soil) when it contains at least about what percentage of fines?","e_en":"≥ about 35% fines → SILT/CLAY; < 35% → SAND/GRAVEL. Engineering 'well-graded' corresponds to geological 'poorly-sorted' — the terms are opposite.","doc":"geoguide3-rock-soil-descriptions","pp":"37","ex":"fdn","tier":"偶考"},{"id":"GG3-015","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 15","p":82,"q":"Table 15：粗粒土中 silt/clay 次要成分 15–35%，前綴應為？","o":["Very (silty/clayey)","Slightly (silty/clayey)","(silty/clayey) 無修飾","With much"],"a":0,"e":"Coarse soils：slightly < 5%、無修飾 5–15%、very 15–35%。","x":"Very (silty, clayey or silty/ 15 - 35","q_en":"Table 15: for a coarse soil with a secondary silt/clay constituent of 15–35%, the prefix should be:","o_en":["Very (silty/clayey)","Slightly (silty/clayey)","(silty/clayey) without qualifier","With much"],"e_en":"Coarse soils: slightly < 5%, no qualifier 5–15%, very 15–35%.","doc":"geoguide3-rock-soil-descriptions","pp":"81","ex":"fdn","tier":"偶考"},{"id":"GG3-016","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"3.5","p":45,"q":"Geoguide 3 指出香港的 true residual soil 厚度通常少於 3 m，在工程上比 saprolite 次要。","a":true,"e":"正確。Saprolite（grade V，保留原岩結構）才是香港 site formation 及 foundation 的主角；relict joints 對斜坡穩定尤其重要。","x":"True residual soils are rarely developed to any significant thickness in Hong Kong","q_en":"Geoguide 3 notes that true residual soil in Hong Kong is usually less than 3 m thick and of less engineering significance than saprolite.","e_en":"True. Saprolite (grade V, retaining the original rock structure) is the main material in Hong Kong site formation and foundations; relict joints are particularly important for slope stability.","doc":"geoguide3-rock-soil-descriptions","pp":"44","ex":"fdn","tier":"必考"},{"id":"GG3-017","t":"mcq","d":2,"tp":"不連續面 Discontinuities","c":"Table 7","p":75,"q":"Table 7：不連續面間距 200–600 mm 描述為？","o":["Medium-spaced","Closely-spaced","Widely-spaced","Very closely-spaced"],"a":0,"e":"間距分級：> 6 m extremely widely；2–6 m very widely；0.6–2 m widely；200–600 mm medium；60–200 mm closely；20–60 mm very closely；< 20 mm extremely closely。","x":"Medium - spaced 200 mm - 600 mm","q_en":"Table 7: term for discontinuity spacing of 200–600 mm?","e_en":"Spacing terms: > 6 m extremely widely; 2–6 m very widely; 0.6–2 m widely; 200–600 mm medium; 60–200 mm closely; 20–60 mm very closely; < 20 mm extremely closely.","doc":"geoguide3-rock-soil-descriptions","pp":"74","ex":"fdn","tier":"偶考"},{"id":"GG3-018","t":"mcq","d":3,"tp":"風化分級 Weathering grades","c":"Table 10","p":78,"q":"Table 10 岩體風化分區：岩石含量 50%–90% 的 zone symbol？","o":["PW 50/90","PW 30/50","PW 90/100","RS"],"a":0,"e":"RS 100% soil；PW0/30 < 30% rock；PW30/50；PW50/90（interlocked structure）；PW90/100；UW 100% rock。與 BS 5930 分區不同，Geoguide 3 特意用新符號避免混淆。","x":"Rock 50 / 90 Interlocked structure","q_en":"Table 10 rock mass weathering zones: zone symbol for 50%–90% rock content?","e_en":"RS 100% soil; PW0/30 < 30% rock; PW30/50; PW50/90 (interlocked structure); PW90/100; UW 100% rock. These differ from the BS 5930 zones; Geoguide 3 deliberately uses new symbols to avoid confusion.","doc":"geoguide3-rock-soil-descriptions","pp":"77","ex":"fdn","tier":"必考"},{"id":"GP1-001","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"GEO Publication 1/2023 Table 6.1（GFM）：embedded wall 的 overturning/toe instability，若用 effective stress analysis，最小 global factor of safety 是多少？","o":["1.5","1.2","2.0","1.4"],"a":0,"e":"GFM（global factor method）下 effective stress 用 1.5，total stress 用 2.0（因 su 不確定性較大）。注意 Note (1)：FoS 是施加於 passive earth pressure，而水壓不打折。常見錯誤是把 FoS 同時除到水壓上，令設計過度保守。","x":"1.5 for effective stress analysis","q_en":"GEO Publication 1/2023 Table 6.1 (GFM): for overturning/toe instability of an embedded wall using effective stress analysis, what is the minimum global factor of safety?","e_en":"Under the GFM (global factor method), 1.5 for effective stress and 2.0 for total stress (because su is more uncertain). Note (1): the FoS is applied to the passive earth pressure, and water pressure is not factored. A common error is also dividing water pressure by the FoS, making the design over-conservative.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","ex":"ground","tier":"常考"},{"id":"GP1-002","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：toe stability 若用 total stress analysis，最小 FoS？","a":0,"u":"","e":"Total stress（undrained, su）分析 FoS 要 2.0，高於 effective stress 的 1.5。軟黏土（marine deposit）開挖常以 total stress 控制，嵌固深度因此顯著加長。","x":"2.0 for total stress analysis","o":["2.0","3.0","1.3","1.5"],"q_en":"Table 6.1 (GFM): minimum FoS for toe stability using total stress analysis?","e_en":"Total stress (undrained, su) analysis requires FoS 2.0, higher than 1.5 for effective stress. Excavations in soft clay (marine deposit) are often governed by total stress, so embedment depths become significantly longer.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","ex":"ground","tier":"常考"},{"id":"GP1-003","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1 Note (1)","p":68,"q":"按 Table 6.1 Note (1)，embedded wall 抗 moment equilibrium 的 FoS 應施加於 passive earth pressure，水壓不作 factoring。","a":true,"e":"正確。GFM 的 FoS 以折減 passive resistance 方式施加；水壓屬「確定」荷載不打折。提交 BD/GEO 的計算書要清楚列明 FoS 的施加方法，否則審批時常被追問。","x":"The factor of safety against loss of moment equilibrium of the embedded wall should","q_en":"Per Table 6.1 Note (1), the FoS on moment equilibrium of an embedded wall should be applied to the passive earth pressure, with no factoring of water pressure.","e_en":"True. The GFM FoS is applied by reducing the passive resistance; water pressure is a \"certain\" load and is not factored. Calculations submitted to BD/GEO must state clearly how the FoS is applied, otherwise queries are common during approval.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","ex":"ground","tier":"常考"},{"id":"GP1-004","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2（PFM, ULS）：undrained shear strength su 的 partial material factor γm 預設值？","o":["2.0","1.2","1.5","1.0"],"a":0,"e":"su 預設 γm = 2.0；若有 site-specific CPT 並以實驗室測試校準，可減至 1.5。Drained c'、tan φ' 則為 1.2。PFM（partial factor method）比 GFM 更理性，但參數要配對使用，不能混用 GFM 的 FoS。","x":"In general, a partial factor of 2.0 on su is recommended in","q_en":"Table 6.2 (PFM, ULS): default partial material factor γm for undrained shear strength su?","e_en":"Default γm = 2.0 for su; may be reduced to 1.5 with site-specific CPT calibrated by laboratory tests. Drained c' and tan φ' take 1.2. The PFM (partial factor method) is more rational than the GFM, but parameters must be used as a matched set, not mixed with the GFM FoS.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","ex":"ground","tier":"常考"},{"id":"GP1-005","t":"mcq","d":3,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2 PFM：temporary surcharge 的 partial load factor γl？","a":0,"u":"","e":"ELS 屬臨時工程，surcharge 較可控，故取 1.3（Geoguide 1 永久擋土牆為 1.5）。若 surcharge 對穩定有利，γl 取 0（Note 4）。","x":"The partial factor for surcharge loading is recommended to be 1.3.","o":["1.3","1.4","1.5","1.0"],"q_en":"Table 6.2 PFM: partial load factor γl for temporary surcharge?","e_en":"ELS is temporary works and surcharge is more controllable, hence 1.3 (1.5 for permanent retaining walls in Geoguide 1). Where surcharge is favourable to stability, γl is taken as 0 (Note 4).","doc":"geo-pub-1-2023-deep-excavation","pp":"69","ex":"ground","tier":"常考"},{"id":"GP1-006","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"在 PFM ULS 設計中，soil unit weight 和 stiffness 的 γm 均為 1.0。","a":true,"e":"正確。只有 strength 參數打折（drained 1.2、su 2.0/1.5、rock joint 1.2），unit weight 及 stiffness 取 1.0。SLS 全部系數為 1.0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","q_en":"In PFM ULS design, γm for soil unit weight and stiffness are both 1.0.","e_en":"True. Only strength parameters are factored (drained 1.2, su 2.0/1.5, rock joint 1.2); unit weight and stiffness take 1.0. At SLS all factors are 1.0.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","ex":"ground","tier":"常考"},{"id":"GP1-008","t":"mcq","d":3,"tp":"地下水 Groundwater","c":"6.5.1","p":70,"q":"若監測地下水位低於 excavation level，ULS 的 DGWL 應假設在哪裡？","o":["開挖深度的三分之一","地面","開挖面","開挖深度的一半"],"a":0,"e":"GEO Pub 1/2023 6.5.1：假設在 excavated depth 的 one-third。這是為暴雨後短暫升水而設的保守假設。","x":"lower than the excavation level, the DGWL for ULS is assumed to be at one-third of the","q_en":"If the monitored groundwater level is below the excavation level, where should the ULS DGWL be assumed?","o_en":["At one-third of the excavation depth","At ground level","At the excavation level","At half the excavation depth"],"e_en":"GEO Pub 1/2023 6.5.1: assume one-third of the excavated depth. This is a conservative assumption for temporary rises after rainstorms.","doc":"geo-pub-1-2023-deep-excavation","pp":"70","ex":"ground","tier":"常考"},{"id":"GP1-009","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"6.5.2","p":71,"q":"SLS 地下水位觸發值：high trigger value 設於最高 ULS DGWL 以下多少米？","a":2,"u":"m","e":"High trigger 在 ULS DGWL 以下 0.5 m、low trigger 在 SLS 最低允許水位以上 0.5 m——預留反應時間。9.2.2.7 亦以「再升/降 0.5 m 便到設計水位」作 Action Level。","x":"a high trigger value at 0.5 m below the highest DGWL","o":["1.0 m","2.0 m","0.5 m","0.3 m"],"q_en":"SLS groundwater trigger values: the high trigger value is set how many metres below the highest ULS DGWL?","e_en":"High trigger 0.5 m below the ULS DGWL, low trigger 0.5 m above the lowest allowable SLS level — leaving time to respond. 9.2.2.7 likewise sets the Action Level at \"a further rise/drop of 0.5 m reaches the design level\".","doc":"geo-pub-1-2023-deep-excavation","pp":"71","ex":"ground","tier":"常考"},{"id":"GP1-011","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"6.1","p":63,"q":"GEO Pub 1/2023 指出，把 ULS 地下水位用於 SLS 設計可能導致高估牆撓度。","a":true,"e":"正確。SLS 應採用「realistic」參數與水位；把 ULS 保守值套入 SLS 會令撓度、沉降估算偏大，導致過重的支撐系統。","x":"using the ULS groundwater level for SLS design may lead","q_en":"GEO Pub 1/2023 points out that using the ULS groundwater level for SLS design may overestimate wall deflection.","e_en":"True. SLS should adopt \"realistic\" parameters and water levels; applying conservative ULS values to SLS inflates estimated deflections and settlements, leading to an overly heavy support system.","doc":"geo-pub-1-2023-deep-excavation","pp":"63","ex":"ground","tier":"常考"},{"id":"GP1-012","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (base heave)","p":65,"q":"Base heave 主要在哪種地質條件下發生？","o":["軟黏土延伸至開挖底以下相當深度","開挖底為新鮮岩石","鬆散砂層且水頭差高","填土層很薄"],"a":0,"e":"Base heave 屬軟黏土問題（Table 6.1 要求 FoS 1.5）；砂層高水頭差則屬 piping。對填海區深厚 marine deposit 的地盤要特別檢核。","x":"primarily occurs in ground conditions where soft clay extends to a considerable depth below the excavation base","q_en":"Under what ground conditions does base heave mainly occur?","o_en":["Soft clay extending to a considerable depth below the excavation base","Fresh rock at the excavation base","Loose sand with a high head difference","A very thin fill layer"],"e_en":"Base heave is a soft clay problem (Table 6.1 requires FoS 1.5); high head difference in sand leads to piping. Check sites with thick marine deposits in reclamation areas particularly.","doc":"geo-pub-1-2023-deep-excavation","pp":"65","ex":"ground","tier":"常考"},{"id":"GP1-014","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：hydraulic failure（piping 及 uplifting）最小 FoS？","a":1,"u":"","e":"Base heave 及 hydraulic failure 均為 1.5；structural failure 1.4；SLS 1.0。","x":"1.5 for effective stress analysis","o":["1.1","1.5","3.0","2.0"],"q_en":"Table 6.1 (GFM): minimum FoS for hydraulic failure (piping and uplifting)?","e_en":"Base heave and hydraulic failure are both 1.5; structural failure 1.4; SLS 1.0.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","ex":"ground","tier":"常考"},{"id":"GP1-015","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (piping)","p":66,"q":"Piping 最可能在甚麼情況下發生？","o":["開挖遇上鬆散砂層且水力梯度高","開挖於軟黏土","開挖於完整岩石","地下水位低於開挖面"],"a":0,"e":"加長嵌固深度可延長 seepage path、降低出口梯度。grout curtain 滲漏亦會局部加大梯度，是本地 ELS 事故常見成因。","x":"Piping is more likely to occur when the excavation encounters a loose sandy layer with a high","q_en":"When is piping most likely to occur?","o_en":["Excavation encountering loose sand with a high hydraulic gradient","Excavation in soft clay","Excavation in intact rock","Groundwater level below the excavation level"],"e_en":"Increasing embedment lengthens the seepage path and lowers the exit gradient. Leakage through grout curtains also increases the gradient locally, a common cause of local ELS incidents.","doc":"geo-pub-1-2023-deep-excavation","pp":"66","ex":"ground","tier":"常考"},{"id":"GP1-016","t":"mcq","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"三級觸發機制（AAA）中，Alert 和 Alarm 一般設於 Action Level 的甚麼百分比？","o":["50% 及 75%","25% 及 50%","60% 及 80%","75% 及 90%"],"a":0,"e":"AAA = Alert-Alarm-Action，一般 50% / 75% of Action Level。敏感地盤或以 engineering approach 定 Action Level 時參照 PNAP APP-24 Appendix C 或持份者（AMO、MTR）要求。","x":"In general, the AAA Levels are set at 50% and 75% of the Action Level respectively.","q_en":"In the three-tier trigger mechanism (AAA), what percentages of the Action Level are Alert and Alarm generally set at?","o_en":["50% and 75%","25% and 50%","60% and 80%","75% and 90%"],"e_en":"AAA = Alert-Alarm-Action, generally 50% / 75% of Action Level. For sensitive sites or where the Action Level is set by an engineering approach, refer to PNAP APP-24 Appendix C or stakeholder (AMO, MTR) requirements.","doc":"geo-pub-1-2023-deep-excavation","pp":"110","ex":"ground","tier":"常考"},{"id":"GP1-017","t":"mcq","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"若未經工程分析評估 ELS 影響範圍（influence zone），最少應採用多少倍 He 的水平距離？","a":1,"u":"×He","e":"最少 1.5He；若周邊有厚 marine deposit，須考慮更大範圍。影響範圍內所有 sensitive receivers 均要評估並設監測點。","x":"Otherwise, a minimum horizontal distance of 1.5 times","o":["2.0 ×He","1.5 ×He","1.0 ×He","3.0 ×He"],"q_en":"Without engineering analysis to assess the influence zone of ELS works, at least what horizontal distance, as a multiple of He, should be adopted?","e_en":"At least 1.5He; where thick marine deposits are nearby, a larger zone must be considered. All sensitive receivers within the influence zone must be assessed and provided with monitoring points.","doc":"geo-pub-1-2023-deep-excavation","pp":"110","ex":"ground","tier":"常考"},{"id":"GP1-018","t":"mcq","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"本地簡單開挖工程慣用的 empirical ground settlement Action Level 是多少？","a":1,"u":"mm","e":"25 mm 的 empirical 限值（PNAP APP-137）對簡單開挖行之有效，但深開挖若估算沉降本身已 > 25 mm 仍硬套，只會導致過重支撐或必然觸發停工。GEO Pub 1/2023 提倡按估算值（0.3%–0.5%He）設定。","x":"25 mm as the Action Level has been successfully applied for many simple excavation projects","o":["50 mm","25 mm","15 mm","10 mm"],"q_en":"What empirical ground settlement Action Level is customarily used for simple local excavations?","e_en":"The empirical 25 mm limit (PNAP APP-137) works for simple excavations, but rigidly applying it to deep excavations whose estimated settlement already exceeds 25 mm only leads to overly heavy support or inevitable stop-work triggers. GEO Pub 1/2023 advocates setting it from estimated values (0.3%–0.5%He).","doc":"geo-pub-1-2023-deep-excavation","pp":"111","ex":"ground","tier":"常考"},{"id":"GP1-019","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"GEO Pub 1/2023 指出，常見而恰當的 ELS 系統引致的地面沉降一般在甚麼範圍？","o":["0.3%He 至 0.5%He","0.05%He 至 0.1%He","1%He 至 2%He","固定 25 mm"],"a":0,"e":"若估算值明顯偏離 0.3–0.5%He，應嚴格覆核開挖方案；過度保守會導致不合理的支撐系統。例子：沙中綫會展站約 30 m 開挖錄得約 100 mm 沉降。","x":"systems usually result in ground settlements within a typical range of between 0.3%He and","q_en":"According to GEO Pub 1/2023, ground settlement induced by common and appropriate ELS systems is generally in what range?","o_en":["0.3%He to 0.5%He","0.05%He to 0.1%He","1%He to 2%He","A fixed 25 mm"],"e_en":"If the estimate deviates markedly from 0.3–0.5%He, the excavation scheme should be rigorously reviewed; over-conservatism leads to unreasonable support systems. Example: the SCL Exhibition Centre Station, about 30 m deep, recorded about 100 mm of settlement.","doc":"geo-pub-1-2023-deep-excavation","pp":"111","ex":"ground","tier":"常考"},{"id":"GP1-020","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1（5A Approach）：ground settlement marker 的 Alert 值？","a":3,"u":"mm","e":"5A：Alert 10 mm、Alarm 15 mm、Action Level 1 20 mm、Level 2 0.3%He（25–60 mm 範圍）、Level 3 0.5%He（30–100 mm）。只適用於道路路面。","x":"monitoring 10 mm 15 mm 20 mm","o":["5 mm","25 mm","20 mm","10 mm"],"q_en":"Table 9.1 (5A Approach): Alert value for ground settlement markers?","e_en":"5A: Alert 10 mm, Alarm 15 mm, Action Level 1 20 mm, Level 2 0.3%He (range 25–60 mm), Level 3 0.5%He (30–100 mm). Applies only to road pavements.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","ex":"ground","tier":"常考"},{"id":"GP1-021","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1：building monitoring marker 的 angular distortion Alert 值？","o":["1:1000","1:600","1:500","1:300"],"a":0,"e":"Building：1:1000 / 1:750 / 1:600 / 1:550 / 1:500；Services：1:600 / 1:500 / 1:400 / 1:350 / 1:300。建築物比管線嚴格。","x":"monitoring 1:1000 1:750 1:600 1:550 1:500","q_en":"Table 9.1: Alert value of angular distortion for building monitoring markers?","e_en":"Buildings: 1:1000 / 1:750 / 1:600 / 1:550 / 1:500; services: 1:600 / 1:500 / 1:400 / 1:350 / 1:300. Buildings are stricter than utilities.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","ex":"ground","tier":"常考"},{"id":"GP1-022","t":"tf","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1 Note (4)(b)","p":117,"q":"按 Table 9.1 Note (4)(b)，任何監測點在連續兩日讀數之間增加 5 mm，應採取 Action Level 2 的應變行動。","a":true,"e":"正確，這是 undue settlement 的特別觸發條件；另 Note (4)(a)：危險管線沉降達 20 mm 或任何點隆起 > 20 mm 觸發 Action Level 1。","x":"an increase of 5 mm between two consecutive daily readings","q_en":"Per Table 9.1 Note (4)(b), if any monitoring point increases by 5 mm between readings on two consecutive days, the Action Level 2 response should be taken.","e_en":"True — a special trigger for undue settlement; also Note (4)(a): settlement of hazardous utilities reaching 20 mm or heave > 20 mm at any point triggers Action Level 1.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","ex":"ground","tier":"常考"},{"id":"GP1-023","t":"tf","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.2.7","p":118,"q":"單單因地下水位超出 Action Level 而暫停工程，是 GEO Pub 1/2023 建議的做法。","a":false,"e":"錯誤。指引認為除非有突然大量滲水，否則單因地下水 Action Level 停工是不必要及不切實際的，因為 sensitive receivers 已由沉降控制機制保障。","x":"Suspension of works solely due to exceedance of the groundwater Action Level is","q_en":"Suspending works solely because the groundwater level exceeds the Action Level is the practice recommended by GEO Pub 1/2023.","e_en":"False. The guidance considers stopping work solely because of a groundwater Action Level unnecessary and impractical unless there is sudden heavy seepage, because sensitive receivers are already protected by the settlement control mechanism.","doc":"geo-pub-1-2023-deep-excavation","pp":"118","ex":"ground","tier":"常考"},{"id":"GP1-024","t":"mcq","d":3,"tp":"側向支撐 Lateral support","c":"7.6.2","p":94,"q":"以 limit equilibrium analysis 做單層支撐牆結構設計時，側向力一般增加多少百分比以考慮 arching 及應力重分佈？","a":3,"u":"%","e":"Padfield & Mair (1984) 建議增加 25%；single-level tied-back 的拉桿荷載亦增加 25%（p95）。","x":"the lateral force is usually increased by 25% to allow for the possibility of","o":["10%","50%","15%","25%"],"q_en":"When a single-level propped wall is structurally designed by limit equilibrium analysis, by what percentage is the lateral force generally increased to allow for arching and stress redistribution?","e_en":"Padfield & Mair (1984) recommend a 25% increase; tie loads of single-level tied-back walls are also increased by 25% (p95).","doc":"geo-pub-1-2023-deep-excavation","pp":"94","ex":"ground","tier":"常考"},{"id":"GP1-027","t":"mcq","d":2,"tp":"抽水測試 Pumping test","c":"4.3 / Table 4.1","p":47,"q":"Pumping test 中，steady state 的定義是甚麼？","o":["抽水率恆定且井內水位每小時變化少於 0.1 m","水位每日變化少於 0.1 m","抽水 72 小時後","水位回升至原水平"],"a":0,"e":"GEO Pub 1/2023 認為達 steady state 後維持最少 24 小時抽水已足夠（本地舊慣例 72 小時）。成功的 pumping test 不代表開挖期間 grout curtain 一定不漏水。","x":"the rate of change of water level is less than 0.1 m per hour","q_en":"In a pumping test, how is steady state defined?","o_en":["Constant pumping rate and water level in the well changing by less than 0.1 m per hour","Water level changing by less than 0.1 m per day","After 72 hours of pumping","Water level recovered to the original level"],"e_en":"GEO Pub 1/2023 considers maintaining pumping for at least 24 hours after reaching steady state sufficient (older local practice: 72 hours). A successful pumping test does not guarantee the grout curtain will not leak during excavation.","doc":"geo-pub-1-2023-deep-excavation","pp":"47","ex":"ground","tier":"偶考"},{"id":"GP1-028","t":"num","d":2,"tp":"抽水測試 Pumping test","c":"4.3","p":47,"q":"達 steady state seepage 後，GEO Pub 1/2023 認為最少維持抽水多少小時才開始 recovery stage？","a":24,"tol":0,"u":"hours","e":"Cheung et al (2023) 檢討本地 pumping test：達穩態後其後 72 小時水位幾乎不變，故最少 24 小時已足。","x":"minimum of 24 hours after achieving steady state seepage","q_en":"After steady state seepage is reached, GEO Pub 1/2023 considers that pumping should be maintained for at least how many hours before starting the recovery stage?","e_en":"Cheung et al (2023) reviewed local pumping tests: after steady state, water levels barely changed over the following 72 hours, so at least 24 hours is sufficient.","doc":"geo-pub-1-2023-deep-excavation","pp":"47","ex":"ground","tier":"偶考"},{"id":"GLS-001","t":"mcq","d":2,"tp":"極限狀態 Limit state","c":"2.2.3","p":14,"q":"Glass Code 2.2.3：單一構件失效時，玻璃結構可能倒塌的部分不應超過多少 m²？","a":0,"u":"m²","e":"防止連續倒塌（例如玻璃柱失效導致玻璃樑及玻璃地台倒塌）。大型玻璃天幕要劃分結構，確保單件失效影響 ≤70 m²。","x":"of collapse should not exceed 70 m (floor, frontal or total area), due to the failure of one","o":["70 m²","25 m²","50 m²","100 m²"],"q_en":"Glass Code 2.2.3: on failure of a single member, the part of a glass structure that may collapse should not exceed how many m²?","e_en":"Prevents progressive collapse (e.g. failure of a glass column leading to collapse of glass beams and glass floors). Large glass canopies must be structurally subdivided so that the effect of a single failure is ≤70 m².","doc":"glass-2018","pp":"6","ex":"glass","tier":"常考"},{"id":"GLS-002","t":"mcq","d":2,"tp":"荷載 Loads","c":"3.4","p":15,"q":"直接受陽光照射的 tinted glass 表面，設計溫度範圍是？","o":["0–90°C","0–50°C","0–40°C","−10–60°C"],"a":0,"e":"不受直射 0–40°C；直射透明玻璃 0–50°C；有色玻璃 0–90°C。有色玻璃熱應力大，要檢查 thermal breakage，常需熱處理玻璃。","x":"glass and 0-90°C for tinted glass.","q_en":"What is the design temperature range for tinted glass surfaces exposed to direct sunlight?","e_en":"Not directly exposed 0–40°C; directly exposed clear glass 0–50°C; tinted glass 0–90°C. Tinted glass has high thermal stresses; check thermal breakage — heat-treated glass is often needed.","doc":"glass-2018","pp":"7","ex":"glass","tier":"常考"},{"id":"GLS-003","t":"mcq","d":1,"tp":"荷載 Loads","c":"3.5","p":15,"q":"Glass Code 的 short-term load duration 定義為？","o":["不多於 3 秒（如風荷載、欄杆水平活載）","不多於 1 天","不多於 1 小時","多於 1 天"],"a":0,"e":"Short ≤3 s；Medium 3 s–1 天（維修荷載、溫度）；Long >1 天（自重等）。不同歷時對應 Table 4.4 的強度折減。","x":"(1) Short-term load duration is defined as the duration of load applying not more than","q_en":"How is short-term load duration defined in the Glass Code?","o_en":["Not more than 3 seconds (e.g. wind load, horizontal imposed load on barriers)","Not more than 1 day","Not more than 1 hour","More than 1 day"],"e_en":"Short ≤3 s; Medium 3 s–1 day (maintenance loads, temperature); Long >1 day (self-weight, etc.). The durations correspond to the strength reductions in Table 4.4.","doc":"glass-2018","pp":"7","ex":"glass","tier":"常考"},{"id":"GLS-004","t":"tf","d":2,"tp":"玻璃材料 Glass material","c":"4.1.1","p":16,"q":"玻璃在常溫下會產生金屬學意義上的疲勞和蠕變。","a":false,"e":"玻璃常溫下不蠕變、無金相疲勞，但在持續或循環荷載下微裂紋會緩慢增長，達臨界尺寸後突然脆性破壞。這就是為何強度隨荷載歷時下降。","x":"Glass at normal temperatures does not creep or “flow” and does not undergo fatigue in the","q_en":"Glass exhibits fatigue and creep in the metallurgical sense at ambient temperature.","e_en":"False. Glass does not creep and has no metallurgical fatigue at ambient temperature, but under sustained or cyclic load microcracks grow slowly until reaching a critical size, then sudden brittle fracture occurs. This is why strength decreases with load duration.","doc":"glass-2018","pp":"8","ex":"glass","tier":"常考"},{"id":"GLS-005","t":"mcq","d":1,"tp":"玻璃材料 Glass material","c":"Table 4.2","p":17,"q":"Table 4.2：玻璃的 modulus of elasticity（N/mm²）？","a":3,"u":"N/mm²","e":"E = 70,000 N/mm²（約鋁的水平），ν = 0.22，密度 2,650 kg/m³，α = 9×10⁻⁶/°C。","x":"Modulus of elasticity 𝐸 70,000 N/mm","o":["30 000 N/mm²","65 000 N/mm²","205 000 N/mm²","70 000 N/mm²"],"q_en":"Table 4.2: modulus of elasticity of glass (N/mm²)?","e_en":"E = 70,000 N/mm² (about that of aluminium), ν = 0.22, density 2,650 kg/m³, α = 9×10⁻⁶/°C.","doc":"glass-2018","pp":"9","ex":"glass","tier":"常考"},{"id":"GLS-006","t":"mcq","d":2,"tp":"玻璃材料 Glass material","c":"Table 4.2","p":17,"q":"Table 4.2：玻璃的 Poisson's ratio？","a":0,"u":"","e":"計算 glass fin 局部屈曲公式 6.1 時要用。","x":"Poisson’s ratio 𝜐 0.22","o":["0.22","0.25","0.3","0.2"],"q_en":"Table 4.2: Poisson's ratio of glass?","e_en":"Needed in equation 6.1 for local buckling of glass fins.","doc":"glass-2018","pp":"9","ex":"glass","tier":"常考"},{"id":"GLS-007","t":"mcq","d":2,"tp":"玻璃種類 Glass types","c":"4.2.2","p":17,"q":"Heat strengthened glass 熱處理後的表面壓應力範圍？","o":["大於 24 MPa 但小於 52 MPa","不少於 69 MPa","10–24 MPa","52–69 MPa"],"a":0,"e":"HS 玻璃破碎形態類似退火玻璃（大塊），但不易因表面裂紋擴展而破裂，也不會 NiS 自爆。可用 GASP 在 tin side 量度。","x":"compressive stress is to be greater than 24 MPa but less than 52 MPa.","q_en":"Range of surface compressive stress of heat strengthened glass after heat treatment?","o_en":["Greater than 24 MPa but less than 52 MPa","Not less than 69 MPa","10–24 MPa","52–69 MPa"],"e_en":"HS glass breaks in a pattern similar to annealed glass (large pieces), but is less prone to fracture from surface crack growth and does not suffer NiS spontaneous breakage. It can be measured on the tin side with a GASP.","doc":"glass-2018","pp":"9","ex":"glass","tier":"常考"},{"id":"GLS-008","t":"mcq","d":2,"tp":"玻璃種類 Glass types","c":"4.2.3","p":18,"q":"Tempered glass 熱處理後表面壓應力不應少於多少 MPa？","a":2,"u":"MPa","e":"破碎時成小立方體碎片。所有切割鑽孔要在鋼化前完成；孔徑不小於玻璃厚度。","x":"surface compression stress should not be less than 69 MPa. When tempered glass breaks, it","o":["24 MPa","40 MPa","69 MPa","100 MPa"],"q_en":"The surface compressive stress of tempered glass after heat treatment should not be less than how many MPa?","e_en":"It breaks into small cube-like fragments. All cutting and drilling must be done before tempering; hole diameter not less than the glass thickness.","doc":"glass-2018","pp":"10","ex":"glass","tier":"常考"},{"id":"GLS-010","t":"mcq","d":1,"tp":"玻璃強度 Glass strength","c":"Table 4.3","p":19,"q":"Table 4.3：Tempered glass 在 short-term load 下的 ultimate design strength py（MPa）？","a":2,"u":"MPa","e":"Annealed 20、HS 40、Tempered 80 MPa。其定義為每 1000 片不多於 8 片破裂的強度。","x":"Annealed 20 Heat strengthened 40 Tempered 80","o":["50 MPa","28 MPa","80 MPa","120 MPa"],"q_en":"Table 4.3: ultimate design strength py (MPa) of tempered glass under short-term load?","e_en":"Annealed 20, HS 40, tempered 80 MPa. It is defined as the strength at which not more than 8 in 1000 panes break.","doc":"glass-2018","pp":"11","ex":"glass","tier":"常考"},{"id":"GLS-011","t":"tf","d":2,"tp":"玻璃強度 Glass strength","c":"4.3","p":19,"q":"Glass Code 的 ultimate design strength 定義為每 1000 片玻璃不多於 8 片破裂時的強度。","a":true,"e":"玻璃強度是統計性的，受微裂紋控制，故以破損機率定義。","x":"ultimate design strength of glass is defined as the strength at which not more than 8 out of","q_en":"The ultimate design strength in the Glass Code is defined as the strength at which not more than 8 in 1000 panes of glass break.","e_en":"True. Glass strength is statistical and governed by microcracks, so it is defined by probability of breakage.","doc":"glass-2018","pp":"11","ex":"glass","tier":"常考"},{"id":"GLS-012","t":"mcq","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.4","p":19,"q":"Table 4.4：Annealed glass 在 long-term load 下的 strength reduction factor γd？","o":["0.29","0.53","0.66","0.81"],"a":0,"e":"退火玻璃長期荷載只剩 29% 強度，所以玻璃地台、天幕（長期自重）不宜用退火玻璃。Tempered 長期 0.66、中期 0.81。","x":"Annealed 1.00 0.53 0.29","q_en":"Table 4.4: strength reduction factor γd for annealed glass under long-term load?","e_en":"Annealed glass retains only 29% of its strength under long-term load, so it is unsuitable for glass floors and canopies (long-term self-weight). Tempered: long-term 0.66, medium-term 0.81.","doc":"glass-2018","pp":"11","ex":"glass","tier":"常考"},{"id":"GLS-013","t":"num","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.4","p":19,"q":"Table 4.4：Tempered glass medium-term 的 γd？","a":0.81,"tol":0,"u":"","e":"維修荷載、溫度荷載屬 medium-term。","x":"Tempered 1.00 0.81 0.66","q_en":"Table 4.4: γd for tempered glass, medium-term?","e_en":"Maintenance loads and temperature loads are medium-term.","doc":"glass-2018","pp":"11","ex":"glass","tier":"常考"},{"id":"GLS-014","t":"num","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.5","p":19,"q":"Table 4.5：Ceramic fritted 或 enamelled painted glass 的表面處理折減系數 γs？","a":0.625,"tol":0,"u":"","e":"Fritted 0.625、磨砂/蝕刻 0.5。有 frit 的幕牆玻璃常被忽略此折減，導致厚度不足。","x":"Ceramic fritted or","q_en":"Table 4.5: surface treatment reduction factor γs for ceramic fritted or enamelled painted glass?","e_en":"Fritted 0.625, sandblasted/etched 0.5. This reduction is often overlooked for fritted curtain wall glass, resulting in inadequate thickness.","doc":"glass-2018","pp":"11","ex":"glass","tier":"常考"},{"id":"GLS-015","t":"tf","d":2,"tp":"夾層玻璃 Laminated glass","c":"4.4.1 / 5.3.3","p":20,"q":"除非有測試證明，夾層玻璃應按無組合作用（no composite action）設計。","a":true,"e":"各片按剛度（t³）分擔荷載；有彎曲測試證明亦只可用於短期荷載，且組合程度不超過 70%。","x":"thickness. As described in clause 5.3.3, laminated glass shall be designed with no composite","q_en":"Unless proven by tests, laminated glass should be designed with no composite action.","e_en":"True. Each ply shares the load in proportion to its stiffness (t³); even when proven by bending tests, composite action may be used only for short-term loads and not exceeding 70%.","doc":"glass-2018","pp":"12","ex":"glass","tier":"偶考"},{"id":"GLS-016","t":"mcq","d":2,"tp":"設計 Design","c":"Table 5.1","p":22,"q":"Table 5.1：公稱 12 mm 玻璃在分析設計時採用的最小厚度？","o":["11.91 mm","12.00 mm","11.50 mm","10.50 mm"],"a":0,"e":"6→5.56、8→7.42、10→9.02、12→11.91、15→14.2、19→18.26 mm。用公稱厚度計算會高估強度和剛度。","x":"Minimum glass pane thickness, 5.56 7.42 9.02 11.91 14.2 18.26 21.44 24.61","q_en":"Table 5.1: minimum thickness adopted in design analysis for nominal 12 mm glass?","e_en":"6→5.56, 8→7.42, 10→9.02, 12→11.91, 15→14.2, 19→18.26 mm. Using nominal thickness overestimates strength and stiffness.","doc":"glass-2018","pp":"14","ex":"glass","tier":"常考"},{"id":"GLS-018","t":"mcq","d":2,"tp":"安全要求 Safety requirement","c":"5.2.1(1)","p":22,"q":"以下哪類玻璃構件必須使用 laminated glass？","o":["承受長期荷載的構件如天幕、玻璃樓梯、玻璃地台及玻璃欄杆","所有室內玻璃間隔","所有窗戶","只限高於 5 m 的玻璃"],"a":0,"e":"長期荷載構件和玻璃欄杆要用夾層玻璃，破碎後碎片仍黏附在中間膜上。","x":"(1) Laminated glass should be used in glass elements resisting long-term load, such as","q_en":"Which of the following glass elements must use laminated glass?","o_en":["Elements under long-term load such as canopies, glass stairs, glass floors, and glass balustrades","All internal glass partitions","All windows","Only glass higher than 5 m"],"e_en":"Elements under long-term load and glass balustrades must use laminated glass, so that fragments remain adhered to the interlayer after breakage.","doc":"glass-2018","pp":"14","ex":"glass","tier":"常考"},{"id":"GLS-019","t":"tf","d":3,"tp":"安全要求 Safety requirement","c":"5.2.2","p":22,"q":"玻璃屋頂、樓梯及地台須設計成任何單片玻璃失效後，其餘玻璃仍能承受 factored ultimate loads。","a":false,"e":"餘下玻璃須承受「未乘系數的標準荷載」（unfactored characteristic loads）而不失效，並非 factored loads。但原設計仍須按 ultimate design loads。","x":"such that in case of failure of any single glass pane, the remaining glass pane(s) shall be able","q_en":"Glass roofs, stairs and floors must be designed so that, after failure of any one pane, the remaining glass can still carry the factored ultimate loads.","e_en":"False. The remaining glass must carry the unfactored characteristic loads without failure, not factored loads. The original design must still use the ultimate design loads.","doc":"glass-2018","pp":"14","ex":"glass","tier":"常考"},{"id":"GLS-020","t":"mcq","d":2,"tp":"分析 Analysis","c":"5.3.1","p":23,"q":"線性分析適用時，「small deflection」定義為撓度少於玻璃厚度的多少？","o":["3/4","1/2","1 倍","2 倍"],"a":0,"e":"撓度大於厚度時薄膜作用顯著，線性分析偏保守；可用非線性分析或 5.4.5 公式。","x":"“small”. The deflection is considered “small” when it is less than 3/4 of the glass pane","q_en":"Where linear analysis applies, \"small deflection\" is defined as deflection less than what fraction of the glass thickness?","o_en":["3/4","1/2","1 times","2 times"],"e_en":"When deflection exceeds the thickness, membrane action becomes significant and linear analysis is conservative; non-linear analysis or the formulae of 5.4.5 may be used.","doc":"glass-2018","pp":"15","ex":"glass","tier":"常考"},{"id":"GLS-021","t":"num","d":3,"tp":"分析 Analysis","c":"5.3.3","p":23,"q":"夾層玻璃的組合作用即使經測試證明，亦不得超過等效整體玻璃剛度的百分之幾？","a":70,"tol":0,"u":"%","e":"λ ≤ min(λtest, 0.7)，只可用於短期荷載，並須考慮中間膜長期老化。","x":"action is not greater than 70% of the stiffness of an equivalent monolithic glass pane with a","q_en":"Even when proven by tests, composite action of laminated glass must not exceed what percentage of the stiffness of an equivalent monolithic glass?","e_en":"λ ≤ min(λtest, 0.7), only for short-term loads, and long-term ageing of the interlayer must be considered.","doc":"glass-2018","pp":"15","ex":"glass","tier":"常考"},{"id":"GLS-022","t":"mcq","d":3,"tp":"分析 Analysis","c":"5.3.4","p":24,"q":"IGU 各片玻璃的荷載要增加百分之幾以考慮溫度及大氣壓變化？","a":0,"u":"%","e":"k = 1.25t³/Σt³。深空腔（氣隙大於玻璃厚度總和）時按剛度分擔的假設不成立。","x":"changes. The loads on each glass pane of the IGU have to be increased by 25% to account","o":["25%","15%","50%","10%"],"q_en":"By what percentage must the load on each pane of an IGU be increased to allow for temperature and atmospheric pressure changes?","e_en":"k = 1.25t³/Σt³. For deep cavities (air gap larger than the sum of the glass thicknesses), the assumption of load sharing by stiffness does not hold.","doc":"glass-2018","pp":"16","ex":"glass","tier":"常考"},{"id":"GLS-023","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"Table 5.2","p":25,"q":"Glass Code Table 5.2：Load combination 3（恆+活+風）的恆載（不利）、活載及風載系數？","o":["1.2 / 1.2 / 1.2","1.4 / 1.6 / 1.4","1.4 / 1.4 / 1.4","1.0 / 1.2 / 1.2"],"a":0,"e":"與 Concrete/Steel Code 一致：組合1 1.4G+1.6Q、組合2 1.4G+1.4W、組合3 1.2(G+Q+W)。溫度荷載 1.2。","x":"3 Dead, imposed, wind,","q_en":"Glass Code Table 5.2: factors for dead load (adverse), imposed load and wind load in load combination 3 (dead + imposed + wind)?","e_en":"Consistent with the Concrete/Steel Codes: combination 1 1.4G+1.6Q, combination 2 1.4G+1.4W, combination 3 1.2(G+Q+W). Temperature load 1.2.","doc":"glass-2018","pp":"17","ex":"glass","tier":"常考"},{"id":"GLS-024","t":"mcq","d":1,"tp":"荷載組合 Load combination","c":"5.4.3","p":26,"q":"玻璃的 partial material factor γm 取值？","a":0,"u":"","e":"γm = 1.0，因為強度折減已透過 py 的破損機率定義、γd 及 γs 反映。","x":"of elasticity is taken as 1.0.","o":["1.0","1.5","1.15","1.25"],"q_en":"What is the partial material factor γm for glass?","e_en":"γm = 1.0, because strength reductions are already reflected through the breakage-probability definition of py, γd and γs.","doc":"glass-2018","pp":"18","ex":"glass","tier":"常考"},{"id":"GLS-025","t":"mcq","d":3,"tp":"玻璃厚度 Glass thickness","c":"5.4.5","p":26,"q":"四邊簡支玻璃厚度公式中，strength coefficient c 的 c1 值：tempered glass 取？","o":["4.0","2.0","1.0","3.0"],"a":0,"e":"c = c1 × γd × γs；c1：annealed 1.0、HS 2.0、tempered 4.0。公式 5.9/5.10 適用 b/a <5，≥5 用 5.11。","x":"= 4.0 for tempered glass","q_en":"In the thickness formula for glass simply supported on four edges, what value of c1 in the strength coefficient c is taken for tempered glass?","e_en":"c = c1 × γd × γs; c1: annealed 1.0, HS 2.0, tempered 4.0. Formulae 5.9/5.10 apply for b/a <5; use 5.11 for ≥5.","doc":"glass-2018","pp":"18","ex":"glass","tier":"偶考"},{"id":"GLS-026","t":"mcq","d":2,"tp":"撓度 Deflection","c":"5.5.4","p":28,"q":"支承玻璃的結構構件（跨度 ≤7.2 m）撓度限值為 1/180 跨度或多少 mm（取小）？","a":1,"u":"mm","e":"跨度 >7.2 m 用 1/360；懸臂 1/90 或 20 mm。支承玻璃的鋼樑撓度控制比一般樓面更嚴。","x":"or 20 mm for span not greater than 7.2 m. For span greater than 7.2 m, the deflection limit of","o":["10 mm","20 mm","25 mm","15 mm"],"q_en":"The deflection limit of structural members supporting glass (span ≤7.2 m) is 1/180 of the span or how many mm (whichever is less)?","e_en":"For spans >7.2 m use 1/360; cantilevers 1/90 or 20 mm. Deflection control of steel beams supporting glass is stricter than for ordinary floors.","doc":"glass-2018","pp":"20","ex":"glass","tier":"常考"},{"id":"GLS-027","t":"num","d":3,"tp":"玻璃鰭 Glass fin","c":"6.1.1","p":29,"q":"Glass fin 繞主軸受彎時，ultimate design strength 要折減百分之幾？","a":40,"tol":0,"u":"%","e":"例如 tempered 80 MPa 降至 48 MPa，因邊緣應力集中及穩定問題。","x":"strength should be reduced by 40% (e.g. 80 MPa to 48 MPa for tempered glass fins). Apart","q_en":"For a glass fin in bending about its major axis, the ultimate design strength must be reduced by what percentage?","e_en":"E.g. tempered 80 MPa reduces to 48 MPa, because of edge stress concentration and stability issues.","doc":"glass-2018","pp":"21","ex":"glass","tier":"偶考"},{"id":"GLS-028","t":"num","d":3,"tp":"玻璃鰭 Glass fin","c":"6.1.1","p":30,"q":"Glass fin 的 critical elastic buckling moment Mcr 須至少為 ultimate design moment 的幾倍？","a":1.7,"tol":0,"u":"倍","e":"或以非線性 FE（初始缺陷 0.5% 長度）求 Mu > Md。","x":"moment (𝑀𝑐𝑐 ). It should be at least 1.7 times the ultimate design moment (𝑀𝑑 ).","q_en":"The critical elastic buckling moment Mcr of a glass fin must be at least how many times the ultimate design moment?","e_en":"Alternatively, non-linear FE (initial imperfection 0.5% of length) may be used to show Mu > Md.","u_en":"times","doc":"glass-2018","pp":"22","ex":"glass","tier":"偶考"},{"id":"GLS-029","t":"mcq","d":2,"tp":"玻璃欄杆 Balustrade","c":"6.4.1","p":32,"q":"Free-standing 玻璃欄杆的連續底部夾具要求？","o":["每邊最少 100 mm 闊、金屬最少 12 mm 厚、螺栓間距最大 500 mm","每邊 50 mm、8 mm 厚、間距 300 mm","每邊 75 mm、10 mm 厚、間距 600 mm","無特定要求"],"a":0,"e":"不靠螺栓的夾緊系統，夾緊深度不少於 90 mm（除非有測試）。","x":"clamps on each side of the glass panes should have a minimum width of 100 mm and be","q_en":"Requirements for the continuous base clamp of a free-standing glass balustrade?","o_en":["At least 100 mm wide on each side, metal at least 12 mm thick, bolt spacing max 500 mm","50 mm each side, 8 mm thick, spacing 300 mm","75 mm each side, 10 mm thick, spacing 600 mm","No specific requirement"],"e_en":"For clamping systems not relying on bolts, the clamping depth is not less than 90 mm (unless tested).","doc":"glass-2018","pp":"24","ex":"glass","tier":"偶考"},{"id":"GLS-030","t":"mcq","d":2,"tp":"結構膠 Structural sealant","c":"7.1","p":36,"q":"一般結構膠在短期及中期荷載下的 permissible design strength（kPa）？","a":2,"u":"kPa","e":"最小 bite 6 mm，bite/thickness 1:1 至 3:1；結構膠不可用於承受長期荷載的玻璃，自重要用 setting blocks 承托。","x":"medium-term loads is 138 kPa. The movement capability of structural and weather sealant","o":["69 kPa","170 kPa","138 kPa","100 kPa"],"q_en":"Permissible design strength (kPa) of typical structural sealant under short- and medium-term loads?","e_en":"Minimum bite 6 mm, bite/thickness 1:1 to 3:1; structural sealant may not be used for glass under long-term load — self-weight must be carried on setting blocks.","doc":"glass-2018","pp":"28","ex":"glass","tier":"偶考"},{"id":"GLS-031","t":"mcq","d":2,"tp":"結構膠 Structural sealant","c":"7.1","p":36,"q":"結構膠的最小 bite（mm）？","a":3,"u":"mm","e":"四邊支承時 bite = 0.5 × p × Ls / pb。","x":"calculated movement. The minimum structural sealant bite should be 6 mm. The sealant","o":["12 mm","10 mm","3 mm","6 mm"],"q_en":"Minimum bite (mm) of structural sealant?","e_en":"For four-edge support, bite = 0.5 × p × Ls / pb.","doc":"glass-2018","pp":"28","ex":"glass","tier":"偶考"},{"id":"GLS-032","t":"tf","d":2,"tp":"結構膠 Structural sealant","c":"7.1.1","p":37,"q":"Structural sealant glazing 須設置機械式 retaining devices，防止結構膠黏結失效時玻璃墮下。","a":true,"e":"頂部及底部要有 capping、角碼等防墮裝置，玻璃自重以 setting blocks 承托。","x":"of glass pane in the event of bond failure in the structural sealant. Retaining devices for such","q_en":"Structural sealant glazing must be provided with mechanical retaining devices to prevent the glass falling if the sealant bond fails.","e_en":"True. Capping, cleats or similar retaining devices are needed at top and bottom, and the glass self-weight is carried on setting blocks.","doc":"glass-2018","pp":"29","ex":"glass","tier":"偶考"},{"id":"PRC-001","t":"mcq","d":2,"tp":"穩定 Stability","c":"2.3.1","p":12,"q":"若風荷載不控制，預製結構穩定性應以每層多少百分比 characteristic dead load 的 notional horizontal force 檢查？","a":2,"u":"%","e":"與 Concrete Code 的 1.5% notional load 一致。預製結構多為鉸接，側向穩定靠剪力牆及樓板橫隔作用，所以 tie 設計特別重要。","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","o":["1.0%","0.5%","1.5%","2.5%"],"q_en":"If wind load does not govern, the stability of a precast structure should be checked with a notional horizontal force equal to what percentage of the characteristic dead load of each floor?","e_en":"Consistent with the 1.5% notional load of the Concrete Code. Precast structures are mostly pin-jointed, with lateral stability provided by shear walls and floor diaphragm action, so tie design is particularly important.","doc":"precast-2016","pp":"4","ex":"precast","tier":"偶考"},{"id":"PRC-002","t":"tf","d":2,"tp":"穩定 Stability","c":"2.3.2","p":12,"q":"預製建築純風荷載下的最大側向位移限值 H/500，計算時須加入接駁位變形的累積效應。","a":true,"e":"預製構件接駁有滑移和變形，要加到結構分析的位移上再與 H/500 比較。常被忽略。","x":"deflection due solely to wind forces does not exceed 1/500 of the building height. In determining","q_en":"For the lateral deflection limit of H/500 under wind load alone for precast buildings, the cumulative effect of joint deformations must be included in the calculation.","e_en":"True. Precast connections slip and deform; add this to the displacements from structural analysis before comparing with H/500. Often overlooked.","doc":"precast-2016","pp":"4","ex":"precast","tier":"偶考"},{"id":"PRC-003","t":"mcq","d":2,"tp":"荷載 Loadings","c":"2.5.1","p":14,"q":"預製結構設計的最小施工荷載（construction load）是？","o":["1.5 kN/m²","0.75 kN/m²","2.5 kN/m²","5.0 kN/m²"],"a":0,"e":"半預製樓板（semi-precast slab）在澆注面層前要承受自重加 1.5 kN/m² 施工荷載，常是控制工況。Bracing 設計亦用 1.5 kN/m²。","x":"construction loads. A minimum load of 1.5 kN/m² should be used. However, due","q_en":"What is the minimum construction load for precast structure design?","e_en":"Semi-precast slabs must carry self-weight plus a 1.5 kN/m² construction load before the topping is cast, which is often the governing case. Bracing design also uses 1.5 kN/m².","doc":"precast-2016","pp":"6","ex":"precast","tier":"偶考"},{"id":"PRC-004","t":"mcq","d":3,"tp":"荷載 Loadings","c":"Table 2.1","p":15,"q":"Table 2.1：平板、有可拆側模、無成形凹槽、smooth mould（只用 form oil）的 demoulding 等效荷載系數？","o":["1.3","1.2","1.4","1.7"],"a":0,"e":"脫模時模板吸力/黏附力以自重乘系數考慮；雕塑形 smooth 1.7 最高。只用於構件抗彎設計，吊點另按 Table 2.4。","x":"Flat with removable side forms. No formed","q_en":"Table 2.1: equivalent demoulding load factor for a flat panel with removable side forms, no formed recesses, and a smooth mould (form oil only)?","e_en":"Mould suction/adhesion at demoulding is allowed for by multiplying self-weight by a factor; sculptured smooth is highest at 1.7. Used only for flexural design of the element; lifting points follow Table 2.4.","doc":"precast-2016","pp":"7","ex":"precast","tier":"偶考"},{"id":"PRC-005","t":"mcq","d":2,"tp":"荷載 Loadings","c":"Table 2.2","p":15,"q":"Table 2.2：運輸（transportation）階段的等效動力荷載系數？","a":1,"u":"","e":"堆場 1.2、運輸 1.5、安裝 1.2。路面惡劣可能需更高。","x":"Yard handling 1.2 Transportation 1.5 Erection 1.2","o":["3.0","1.5","1.2","2.0"],"q_en":"Table 2.2: equivalent dynamic load factor for the transportation stage?","e_en":"Yard storage 1.2, transportation 1.5, erection 1.2. Poor road surfaces may need higher values.","doc":"precast-2016","pp":"7","ex":"precast","tier":"偶考"},{"id":"PRC-006","t":"num","d":2,"tp":"材料 Materials","c":"2.6.2.1","p":15,"q":"預製混凝土的 reactive alkali（Na2O 當量）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"與 Foundations Code 相同的 AAR 限值，供應商要提交 HOKLAS 認可證書。","x":"cubic metre should not exceed 3.0 kg.","q_en":"The reactive alkali content (Na2O equivalent) of precast concrete should not exceed how many kg per cubic metre?","e_en":"The same AAR limit as the Foundations Code; suppliers must submit HOKLAS-accredited certificates.","doc":"precast-2016","pp":"7","ex":"precast","tier":"偶考"},{"id":"PRC-007","t":"mcq","d":2,"tp":"材料 Materials","c":"Table 2.3","p":16,"q":"Table 2.3：預應力混凝土的最大總氯化物含量（以水泥質量計氯離子百分比）？","o":["0.10%","0.20%","0.35%","0.50%"],"a":0,"e":"預應力/蒸汽養護 0.10%；抗硫酸鹽水泥 0.20%；OPC 有埋置金屬 0.35%。","x":"Prestressed concrete","q_en":"Table 2.3: maximum total chloride content of prestressed concrete (chloride ion as a percentage by mass of cement)?","e_en":"Prestressed/steam-cured 0.10%; sulphate-resisting cement 0.20%; OPC with embedded metal 0.35%.","doc":"precast-2016","pp":"8","ex":"precast","tier":"偶考"},{"id":"PRC-008","t":"mcq","d":2,"tp":"吊裝 Lifting","c":"2.7.5.1 / Table 2.4","p":17,"q":"一般情況下 lifting inserts 在 ULS 的建議安全系數？多次使用（如沙井蓋）時？","o":["4；5","3；4","2；3","5；6"],"a":0,"e":"Bracing 構件 2、bracing 接駁及預埋件 3。吊點佈置要確保任一吊點失效不會令整個吊裝系統失效。","x":"Lifting inserts, normal circumstances 4","q_en":"Recommended ULS factor of safety for lifting inserts in general? And for repeated use (e.g. manhole covers)?","o_en":["4; 5","3; 4","2; 3","5; 6"],"e_en":"Bracing members 2, bracing connections and cast-in inserts 3. The lifting arrangement must ensure that failure of any one lifting point does not cause failure of the whole lifting system.","doc":"precast-2016","pp":"9","ex":"precast","tier":"偶考"},{"id":"PRC-009","t":"num","d":2,"tp":"吊裝 Lifting","c":"Table 2.4","p":17,"q":"Table 2.4：Bracing members 的建議安全系數？","a":2,"tol":0,"u":"","e":"預製牆臨時斜撐常被低估；要按風荷載及 1.5 kN/m² 施工荷載設計。","x":"Bracing members 2","q_en":"Table 2.4: recommended factor of safety for bracing members?","e_en":"Temporary raking props to precast walls are often underestimated; design them for wind load and the 1.5 kN/m² construction load.","doc":"precast-2016","pp":"9","ex":"precast","tier":"偶考"},{"id":"PRC-010","t":"tf","d":2,"tp":"吊裝 Lifting","c":"2.7.5.1","p":17,"q":"普通鋼筋可隨意用作 lifting inserts。","a":false,"e":"吊點應為專門設計的 proprietary 產品；鋼筋只有經專門設計和安裝才可用作吊環。","x":"All lifting inserts should be purposely designed proprietary products. Reinforcing bars may only be","q_en":"Ordinary reinforcing bars may freely be used as lifting inserts.","e_en":"False. Lifting points should be purpose-designed proprietary products; reinforcing bars may be used as lifting loops only when specifically designed and installed.","doc":"precast-2016","pp":"9","ex":"precast","tier":"偶考"},{"id":"PRC-012","t":"mcq","d":2,"tp":"支座 Bearings","c":"2.7.9.2","p":22,"q":"非孤立構件的 net bearing width 取計算值或多少 mm（取較大）？","a":1,"u":"mm","e":"Net bearing width = 極限支座反力 /（有效支承長度 × 極限支承應力）。孤立構件再加 20 mm。","x":"or 40 mm, whichever is greater.","o":["50 mm","40 mm","25 mm","75 mm"],"q_en":"The net bearing width of a non-isolated member is taken as the calculated value or how many mm (whichever is greater)?","e_en":"Net bearing width = ultimate support reaction / (effective bearing length × ultimate bearing stress). For isolated members add 20 mm.","doc":"precast-2016","pp":"14","ex":"precast","tier":"偶考"},{"id":"PRC-013","t":"mcq","d":3,"tp":"支座 Bearings","c":"2.7.9.3","p":23,"q":"構件的 effective bearing length 取以下較小值：","o":["支承長度；支承長度一半加 100 mm；600 mm","支承長度；300 mm","支承長度一半；400 mm","支承長度；1000 mm"],"a":0,"e":"防止長支座上應力分佈不均。","x":"one-half of bearing length plus 100 mm; or","q_en":"The effective bearing length of a member is taken as the least of:","o_en":["The bearing length; half the bearing length plus 100 mm; 600 mm","The bearing length; 300 mm","Half the bearing length; 400 mm","The bearing length; 1000 mm"],"e_en":"Prevents uneven stress distribution over long bearings.","doc":"precast-2016","pp":"15","ex":"precast","tier":"偶考"},{"id":"PRC-014","t":"mcq","d":2,"tp":"支座 Bearings","c":"2.7.9.4","p":23,"q":"混凝土上的 dry bearing 與 bedded bearing 的 design ultimate bearing stress？","o":["0.4fcu；0.6fcu","0.6fcu；0.8fcu","0.3fcu；0.5fcu","0.45fcu；0.67fcu"],"a":0,"e":"鑄入鋼支承板（每邊不超過混凝土相應尺寸 40%）可用 0.8fcu。","x":"0.4fcu for dry bearing on the concrete;","q_en":"Design ultimate bearing stress for dry bearing and bedded bearing on concrete?","o_en":["0.4fcu; 0.6fcu","0.6fcu; 0.8fcu","0.3fcu; 0.5fcu","0.45fcu; 0.67fcu"],"e_en":"Cast-in steel bearing plates (each side not exceeding 40% of the corresponding concrete dimension) may use 0.8fcu.","doc":"precast-2016","pp":"15","ex":"precast","tier":"偶考"},{"id":"PRC-015","t":"num","d":2,"tp":"支座 Bearings","c":"2.7.9.5","p":23,"q":"孤立構件的 net bearing width 為非孤立構件的值加多少 mm？","a":20,"tol":0,"u":"mm","e":"孤立構件（無冗餘）支座失效後果嚴重，故要加大。","x":"The net bearing width for isolated members should be that of non-isolated members plus 20 mm.","q_en":"The net bearing width of an isolated member is the value for a non-isolated member plus how many mm?","e_en":"Isolated members (no redundancy) have severe consequences if a bearing fails, hence the increase.","doc":"precast-2016","pp":"15","ex":"precast","tier":"偶考"},{"id":"PRC-016","t":"mcq","d":3,"tp":"支座 Bearings","c":"Table 2.5","p":24,"q":"Table 2.5：Grade 30 或以上混凝土支座，因剝落假設無效的距離（mm）？","a":0,"u":"mm","e":"鋼支座 0、<C30 為 25 mm。支座設計 nominal width = net bearing + 剝落 + 施工偏差。","x":"Concrete grade 30 or above, plain or reinforced 15","o":["15 mm","20 mm","10 mm","25 mm"],"q_en":"Table 2.5: distance (mm) assumed ineffective due to spalling at bearings on concrete of Grade 30 or above?","e_en":"Steel supports 0, <C30 25 mm. Nominal bearing width = net bearing + spalling + construction inaccuracies.","doc":"precast-2016","pp":"16","ex":"precast","tier":"偶考"},{"id":"PRC-017","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.1","p":38,"q":"Table 3.1：牆或外牆板吊點在邊緣橫跨厚度方向的建議容許偏差？","o":["5 mm","25 mm","150 mm","300 mm"],"a":0,"e":"其他：樁/樓板 150 mm、樑沿長度 300 mm、橫跨 25 mm。","x":"Wall or façade panel On the edge across the thickness 5 mm","q_en":"Table 3.1: recommended tolerance on lifting insert position across the thickness at the edge of walls or façade panels?","e_en":"Others: piles/slabs 150 mm, beams along the length 300 mm, across 25 mm.","doc":"precast-2016","pp":"30","ex":"precast","tier":"偶考"},{"id":"PRC-018","t":"num","d":2,"tp":"施工 Construction","c":"3.2.2","p":38,"q":"良好做法：模具大約每多少次澆注後應全面重新檢查尺寸偏差？","a":100,"tol":0,"u":"次","e":"模具反覆使用會變形，定期檢查可避免構件尺寸偏差累積。","x":"compliance be carried out after approximately 100 castings. More frequent checking may be","q_en":"Good practice: moulds should be fully rechecked for dimensional accuracy after approximately how many casts?","e_en":"Moulds deform with repeated use; regular checks prevent accumulation of dimensional deviations in the elements.","u_en":"casts","doc":"precast-2016","pp":"30","ex":"precast","tier":"偶考"},{"id":"PRC-019","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：一般非預應力構件、精細控制吊機吊裝的建議最低混凝土強度？","o":["10 N/mm²","15 N/mm²","20 N/mm²","25 N/mm²"],"a":0,"e":"有明顯衝擊 15；同心預應力 20；偏心預應力 25；橋樑 30 N/mm²。實際要視吊點錨固長度。","x":"None specified, fine controlled crane, non-prestressed 10 N/mm","q_en":"Table 3.2: recommended minimum concrete strength for lifting ordinary non-prestressed elements with a finely controlled crane?","e_en":"With significant impact 15; concentrically prestressed 20; eccentrically prestressed 25; bridges 30 N/mm². Actual values depend on the anchorage length of the lifting inserts.","doc":"precast-2016","pp":"32","ex":"precast","tier":"偶考"},{"id":"PRC-020","t":"num","d":3,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：偏心預應力構件（如 T 樑、深樓板單元）吊裝的最低混凝土強度（N/mm²）？","a":25,"tol":0,"u":"N/mm²","e":"預應力構件吊點須錨固在受壓區，除非另有設計。","x":"Eccentrically prestressed elements (tees, deep flooring units) 25 N/mm","q_en":"Table 3.2: minimum concrete strength (N/mm²) for lifting eccentrically prestressed elements (e.g. T-beams, deep slab units)?","e_en":"Lifting inserts in prestressed elements must be anchored in the compression zone unless otherwise designed.","doc":"precast-2016","pp":"32","ex":"precast","tier":"偶考"},{"id":"PRC-021","t":"num","d":2,"tp":"施工 Construction","c":"3.16.9","p":45,"q":"半預製樓板澆注面層前，以水刀清潔的最低水壓（kPa）？","a":10000,"tol":0,"u":"kPa","e":"即 100 bar。清潔後要檢查樓板底裂縫，貫穿裂縫須在澆注前修補，以確保新舊混凝土結合。","x":"by using water jet with a minimum pressure of 10,000kPa (100bar) for cleansing;","q_en":"Minimum water jet pressure (kPa) for cleaning semi-precast slabs before casting the topping?","e_en":"I.e. 100 bar. After cleaning, check the slab soffit for cracks; through-cracks must be repaired before casting to ensure bond between new and old concrete.","doc":"precast-2016","pp":"37","ex":"precast","tier":"偶考"},{"id":"PRC-022","t":"tf","d":2,"tp":"耐久性 Durability","c":"2.4.3","p":13,"q":"預製構件的保護層可比現澆混凝土結構的要求為小，因為工廠品質較好。","a":false,"e":"規範明確規定不少於鋼筋混凝土結構的要求；防火按 FS Code、防腐按 B(C)R。支架及固定件亦要符合保護層要求。","x":"Cover for precast elements should be no less than those specified for reinforced concrete","q_en":"The cover to precast elements may be less than that required for cast-in-place concrete structures because factory quality is better.","e_en":"False. The Code explicitly requires not less than that for reinforced concrete structures; fire per the FS Code, corrosion protection per B(C)R. Brackets and fixings must also meet the cover requirements.","doc":"precast-2016","pp":"5","ex":"precast","tier":"偶考"},{"id":"SEC-001","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Beams – Properties","p":5,"q":"查表：457x191x67 UB 的 plastic modulus Sx（x-x 軸）？","a":1470,"tol":0,"u":"cm³","e":"457x191x67：Ix 29400 cm⁴、Zx 1300 cm³、Sx 1470 cm³、A 85.5 cm²。Mc = py·Sx（Class 1/2），計算時注意 cm³ → mm³ 的單位換算（×10³）是常見出錯位。","x":"457x191x67 29400 1450 18.5 4.12 1300 153 1470 237","q_en":"Look up: plastic modulus Sx (x-x axis) of 457x191x67 UB?","e_en":"457x191x67: Ix 29400 cm⁴, Zx 1300 cm³, Sx 1470 cm³, A 85.5 cm². Mc = py·Sx (Class 1/2); the cm³ → mm³ unit conversion (×10³) is a common source of error.","doc":"steel-section-tables-bs5950","pp":"B-5","ex":"steel","tier":"偶考"},{"id":"SEC-002","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Beams – Properties","p":5,"q":"查表：533x210x92 UB 的 Ix？","a":55200,"tol":0,"u":"cm⁴","e":"533x210x92：Ix 55200 cm⁴、Zx 2070 cm³、Sx 2360 cm³、ry 4.51 cm、A 117 cm²。撓度計算用 Ix；LTB 用 ry、u、x。","x":"533x210x92 55200 2390 21.7 4.51 2070 228 2360 355","q_en":"Look up: Ix of 533x210x92 UB?","e_en":"533x210x92: Ix 55200 cm⁴, Zx 2070 cm³, Sx 2360 cm³, ry 4.51 cm, A 117 cm². Deflection uses Ix; LTB uses ry, u, x.","doc":"steel-section-tables-bs5950","pp":"B-5","ex":"steel","tier":"偶考"},{"id":"SEC-003","t":"mcq","d":2,"tp":"截面性質查表 Section properties","c":"Universal Columns – Properties","p":13,"q":"查表：305x305x97 UC 的 ry（y-y 軸 radius of gyration）？","o":["7.69 cm","13.4 cm","6.48 cm","9.91 cm"],"a":0,"e":"柱的弱軸 slenderness λ = LE/ry，ry 通常控制。305x305x97：rx 13.4 cm、ry 7.69 cm、A 123 cm²。","x":"305x305x97 22200 7310 13.4 7.69 1450 479 1590 726","q_en":"Look up: ry (radius of gyration about the y-y axis) of 305x305x97 UC?","e_en":"Column minor-axis slenderness λ = LE/ry; ry usually governs. 305x305x97: rx 13.4 cm, ry 7.69 cm, A 123 cm².","doc":"steel-section-tables-bs5950","pp":"B-13","ex":"steel","tier":"偶考"},{"id":"SEC-004","t":"num","d":2,"tp":"截面分類 Section classification","c":"Universal Beams – Dimensions","p":4,"q":"查表：457x191x67 UB 的 flange local buckling ratio b/T？","a":7.48,"tol":0.01,"u":"","e":"表中 b/T 以 b = B/2 計（189.9/2 ÷ 12.7 ≈ 7.48），與 HK Steel Code Figure 7.1 對 rolled I-section 的 b 定義一致。d/t = 48.0。","x":"457x191x67 67.1 453.4 189.9 8.5 12.7 10.2 407.6 7.48 48.0","q_en":"Look up: flange local buckling ratio b/T of 457x191x67 UB?","e_en":"b/T in the table uses b = B/2 (189.9/2 ÷ 12.7 ≈ 7.48), consistent with the definition of b for rolled I-sections in HK Steel Code Figure 7.1. d/t = 48.0.","doc":"steel-section-tables-bs5950","pp":"B-4","ex":"steel","tier":"偶考"},{"id":"SEC-006","t":"mcq","d":2,"tp":"截面分類 Section classification","c":"Steel Code Table 7.1","doc":"steel-2011-2023ed","p":87,"q":"HK Steel Code Table 7.1：I/H 截面 web（neutral axis at mid-depth）的 Class 1 / 2 / 3 d/t 限值？","o":["80ε / 100ε / 120ε","9ε / 10ε / 15ε","28ε / 32ε / 40ε","40 / 40 / 40"],"a":0,"e":"Web 受彎 80ε/100ε/120ε；rolled flange outstand 9ε/10ε/15ε；internal element 28ε/32ε/40ε。配合截面表的 d/t 欄可即時分類。","x":"Neutral axis at mid-depth d/t 80ε 100ε 120ε","q_en":"HK Steel Code Table 7.1: Class 1 / 2 / 3 d/t limits for the web of an I/H section (neutral axis at mid-depth)?","e_en":"Web in bending 80ε/100ε/120ε; rolled flange outstand 9ε/10ε/15ε; internal element 28ε/32ε/40ε. Combined with the d/t column of the section tables, sections can be classified instantly.","pp":"68","ex":"steel","tier":"常考"},{"id":"SEC-007","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Columns – Dimensions","p":12,"q":"查表：254x254x73 UC 的 flange thickness T？","a":14.2,"tol":0,"u":"mm","e":"T = 14.2 mm（≤ 16 mm，S275 py 取 275）。T 決定 py 的厚度級別，也是 flange 分類的分母。","x":"254x254x73 73.1 254.1 254.6 8.6 14.2 12.7 200.3 8.96 23.3","q_en":"Look up: flange thickness T of 254x254x73 UC?","e_en":"T = 14.2 mm (≤ 16 mm, so py for S275 is 275). T determines the thickness band for py and is the denominator for flange classification.","doc":"steel-section-tables-bs5950","pp":"B-12","ex":"steel","tier":"偶考"},{"id":"STL-001","t":"mcq","d":1,"tp":"極限狀態 Limit states","c":"Table 2.1","p":38,"q":"按 Steel Code Table 2.1，以下哪一項屬 serviceability limit state？","o":["Brittle fracture","Fire resistance","Human induced vibration","Stability against overturning"],"a":2,"e":"Table 2.1：SLS 包括 deflection、human induced vibration、wind induced vibration、durability；brittle fracture、fatigue、fire、穩定屬 ULS。","x":"Stability against overturning, sliding, uplift and Human induced vibration","q_en":"According to Steel Code Table 2.1, which of the following is a serviceability limit state?","e_en":"Table 2.1: SLS includes deflection, human induced vibration, wind induced vibration and durability; brittle fracture, fatigue, fire and stability are ULS.","doc":"steel-2011-2023ed","pp":"19","ex":"steel","tier":"偶考"},{"id":"STL-002","t":"tf","d":1,"tp":"荷載組合 Load combinations","c":"2.3.1","p":38,"q":"Steel Code 規定在每個荷載組合中，抵抗滑動、傾覆或上拔的有利 dead load 應取 γf = 1.0。","a":true,"e":"對。2.3.1：beneficial dead load γf = 1.0。鋼結構輕，uplift（例如輕鋼屋頂、簷篷）往往由 1.0Gk + 1.4Wk 控制。","x":"which counteracts the effects of other loads, including dead loads restraining sliding,","q_en":"The Steel Code requires that, in every load combination, beneficial dead load resisting sliding, overturning or uplift be taken with γf = 1.0.","e_en":"True. 2.3.1: beneficial dead load γf = 1.0. Steel structures are light, so uplift (e.g. lightweight steel roofs, canopies) is often governed by 1.0Gk + 1.4Wk.","doc":"steel-2011-2023ed","pp":"19","ex":"steel","tier":"常考"},{"id":"STL-003","t":"tf","d":2,"tp":"疲勞 Fatigue","c":"2.3.3","p":39,"q":"一般建築物中，風荷載的正常波動引起的應力變化需要作疲勞檢核。","a":false,"e":"錯。2.3.3：normal fluctuations in wind loading need not be considered；但氣動不穩定引起的風致振動、承托振動機器或吊車的構件則要考慮。疲勞設計 γf = 1.0。","x":"numerous fluctuations of stress. Stress changes due to normal fluctuations in wind","q_en":"In ordinary buildings, stress fluctuations due to normal fluctuations in wind loading require a fatigue check.","e_en":"False. 2.3.3: normal fluctuations in wind loading need not be considered; but wind-induced oscillations from aerodynamic instability, and members supporting vibrating machinery or cranes, must be considered. Fatigue design uses γf = 1.0.","doc":"steel-2011-2023ed","pp":"20","ex":"steel","tier":"偶考"},{"id":"STL-004","t":"mcq","d":2,"tp":"疲勞 Fatigue","c":"2.3.3.4","p":41,"q":"疲勞評估時，按 Steel Code 設計的建築物 design working life 取多少年？","a":3,"u":"年","e":"2.3.3.4(a)：建築物 50 年；道路/橋樑一般 120 年。Miner's rule Σni/Ni ≤ 1.0。","x":"designed to the Code the design working life is 50 years and for road/bridge this","o":["30 年","120 年","100 年","50 年"],"q_en":"For fatigue assessment, what design working life (years) is taken for buildings designed to the Steel Code?","o_en":["30 years","120 years","100 years","50 years"],"e_en":"2.3.3.4(a): buildings 50 years; roads/bridges generally 120 years. Miner's rule Σni/Ni ≤ 1.0.","u_en":"years","doc":"steel-2011-2023ed","pp":"22","ex":"steel","tier":"偶考"},{"id":"STL-005","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3","p":43,"q":"作為水平 tie 的鋼構件及其端部連接，須能抵抗的最少 factored tensile load 是多少 kN？","a":3,"u":"kN","e":"2.3.4.3(a)：≥75 kN，毋須與其他荷載疊加。Internal tie = 0.5(1.4Gk+1.6Qk)stL；edge tie = 0.25(...)stL，均不少於 75 kN。常見錯誤：簡支樑端 fin plate 連接未檢核 tie force。","x":"capable of resisting a factored tensile load not less than 75kN, which need not be","o":["150 kN","100 kN","50 kN","75 kN"],"q_en":"What minimum factored tensile load (kN) must a steel member acting as a horizontal tie, and its end connections, be able to resist?","e_en":"2.3.4.3(a): ≥75 kN, not combined with other loads. Internal tie = 0.5(1.4Gk+1.6Qk)stL; edge tie = 0.25(...)stL, both not less than 75 kN. Common error: not checking the tie force at the fin plate connections of simply supported beam ends.","doc":"steel-2011-2023ed","pp":"24","ex":"steel","tier":"常考"},{"id":"STL-006","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3(b)","p":43,"q":"錨固邊柱（edge columns）的水平 tie 須抵抗以下哪個值的最大者？","o":["Tie force、75 kN 或柱荷載 1%","Tie force、50 kN 或柱荷載 3%","75 kN 或柱荷載 1.5%","柱荷載 2.5%"],"a":0,"e":"2.3.4.3(b)：max(tie force, 75 kN, 1% 柱上/下最大 factored dead + imposed load)，垂直於邊緣作用。（Concrete Code 外柱為 3%，兩本 Code 數值不同，要分清。）","x":"calculated in (a) above, 75 kN or 1% of the maximum factored dead and imposed","q_en":"Horizontal ties anchoring edge columns must resist the greatest of which values?","o_en":["Tie force, 75 kN, or 1% of the column load","Tie force, 50 kN, or 3% of the column load","75 kN or 1.5% of the column load","2.5% of the column load"],"e_en":"2.3.4.3(b): max(tie force, 75 kN, 1% of the maximum factored dead + imposed load in the column above/below), acting perpendicular to the edge. (The Concrete Code uses 3% for external columns — the two Codes differ, so keep them distinct.)","doc":"steel-2011-2023ed","pp":"24","ex":"steel","tier":"常考"},{"id":"STL-008","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.3","p":46,"q":"Steel Code 規定 load combinations 2 和 3 的最小 unfactored wind load 不應少於 unfactored dead load 的多少 %？","a":0,"u":"%","e":"2.5.3：≥1.0% Gk（每層按該層重量計）。Concrete Code 則以 1.5% Gk 作 design ultimate 下限，兩者定義不同（unfactored vs ultimate）。","x":"The minimum unfactored wind load should not be less than 1.0% of unfactored dead load","o":["1.0%","1.5%","0.5%","2.5%"],"q_en":"The Steel Code requires the minimum unfactored wind load in load combinations 2 and 3 to be not less than what % of the unfactored dead load?","e_en":"2.5.3: ≥1.0% Gk (per floor, based on that floor's weight). The Concrete Code uses 1.5% Gk as a design ultimate lower bound — the definitions differ (unfactored vs ultimate).","doc":"steel-2011-2023ed","pp":"27","ex":"steel","tier":"常考"},{"id":"STL-009","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.6","p":46,"q":"設計溫度效應時，Steel Code 假設香港平均溫度變化範圍為：","o":["0°C 至 35°C","+0.1°C 至 +40.0°C","5°C 至 38°C","−5°C 至 45°C"],"a":1,"e":"2.5.6：+0.1°C 至 +40.0°C；受陽光直射構件（如幕牆支架）按 13.3.4.3 取更高溫度。長鋼屋頂及預應力拉桿系統特別敏感。","x":"varies from +0.1ºC to +40.0ºC. The actual range, however, depends on the location, type","q_en":"For designing temperature effects, the Steel Code assumes the average temperature range in Hong Kong is:","o_en":["0°C to 35°C","+0.1°C to +40.0°C","5°C to 38°C","−5°C to 45°C"],"e_en":"2.5.6: +0.1°C to +40.0°C; members exposed to direct sunlight (e.g. curtain wall brackets) take higher temperatures per 13.3.4.3. Long steel roofs and prestressed tension rod systems are particularly sensitive.","doc":"steel-2011-2023ed","pp":"27","ex":"steel","tier":"常考"},{"id":"STL-010","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"一般結構的 notional horizontal force 最少為 factored dead and imposed loads 的多少 %？","a":3,"u":"%","e":"2.5.8：0.5%（或 0.5 kN/m² 側壓，取較大），用於 load combination 1，毋須再乘 γf；臨時工程及 sway ultra-sensitive 結構用 1.0% 或 1.0 kN/m²。計算 overturning 時不需施加。","x":"should be capable of resisting notional horizontal forces with a minimum of 0.5% of the","o":["1.0%","1.5%","3%","0.5%"],"q_en":"The notional horizontal force for ordinary structures is at least what % of the factored dead and imposed loads?","e_en":"2.5.8: 0.5% (or 0.5 kN/m² lateral pressure, whichever is greater), used in load combination 1 without further γf; temporary works and sway ultra-sensitive structures use 1.0% or 1.0 kN/m². Not applied when calculating overturning.","doc":"steel-2011-2023ed","pp":"28","ex":"steel","tier":"常考"},{"id":"STL-011","t":"tf","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"Notional horizontal forces 應與其他外加水平荷載（例如風）同時施加。","a":false,"e":"錯。2.5.8：不需與其他水平荷載、溫度效應同時施加，亦不用於 overturning 及 pattern loads，且不需計入基礎淨反力。它只與 comb 1 的 factored vertical loads 同時作用。","x":"The notional horizontal forces need not be applied when considering overturning, pattern","q_en":"Notional horizontal forces should be applied together with other applied horizontal loads (e.g. wind).","e_en":"False. 2.5.8: they need not be applied with other horizontal loads or temperature effects, are not used for overturning or pattern loads, and need not be included in net foundation reactions. They act only with the factored vertical loads of comb 1.","doc":"steel-2011-2023ed","pp":"28","ex":"steel","tier":"常考"},{"id":"STL-012","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"臨時工程（如棚架、falsework）及 sway ultra-sensitive 結構的 notional horizontal force 應取：","o":["0.5% 或 0.5 kN/m²","1.0% 或 1.0 kN/m²（取較大）","2.5% 或 1.5 kN/m²","1.5% Gk"],"a":1,"e":"2.5.8：臨時工程 1.0% factored dead + live 或 1.0 kN/m²。Temporary works 另按 4.3.4 任何 adverse γf 不少於 1.2。","x":"horizontal force shall be used. The magnitude of this force shall be the greater of 1.0% of","q_en":"The notional horizontal force for temporary works (e.g. scaffolding, falsework) and sway ultra-sensitive structures should be taken as:","o_en":["0.5% or 0.5 kN/m²","1.0% or 1.0 kN/m² (whichever is greater)","2.5% or 1.5 kN/m²","1.5% Gk"],"e_en":"2.5.8: temporary works 1.0% of factored dead + live or 1.0 kN/m². Temporary works additionally require any adverse γf to be not less than 1.2 per 4.3.4.","doc":"steel-2011-2023ed","pp":"28","ex":"steel","tier":"常考"},{"id":"STL-013","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"Steel Code 的 Class 1H 高強度鋼是指 yield strength 在哪個範圍？","o":["355–460 N/mm²","> 460 至 ≤ 690 N/mm²","> 690 N/mm²","≤ 460 N/mm²"],"a":1,"e":"3.1.1：Class 1/2/3 為 ≤460；1H 為 460–690；UH（>690）不在 Code 範圍，須 BA 批准（如高強度拉桿）。塑性分析不允許用於 uncertified steel 或 >690 鋼材。","x":"Class 1H: High strength steels with yield strengths greater than 460 N/mm2 but less","q_en":"Class 1H high strength steel in the Steel Code has a yield strength in which range?","o_en":["355–460 N/mm²","> 460 to ≤ 690 N/mm²","> 690 N/mm²","≤ 460 N/mm²"],"e_en":"3.1.1: Class 1/2/3 are ≤460; 1H is 460–690; UH (>690) is outside the Code and needs BA approval (e.g. high-strength tension rods). Plastic analysis is not permitted for uncertified steel or steel >690.","doc":"steel-2011-2023ed","pp":"30","ex":"steel","tier":"常考"},{"id":"STL-014","t":"tf","d":2,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"使用高強度鋼可同時改善疲勞及 serviceability 表現。","a":false,"e":"錯。3.1.1：高強度鋼對重載柱受壓及長跨樑抗彎有利，但不改善 fatigue 及 SLS（E 值相同，撓度不變）。可用 pre-camber 減撓度。","x":"imposed loads. Their use does not improve the performance for fatigue and serviceability","q_en":"Using high strength steel improves both fatigue and serviceability performance.","e_en":"False. 3.1.1: high strength steel benefits heavily loaded columns in compression and long-span beams in bending, but does not improve fatigue or SLS (same E, so deflection is unchanged). Pre-camber may be used to reduce deflection.","doc":"steel-2011-2023ed","pp":"30","ex":"steel","tier":"常考"},{"id":"STL-015","t":"mcq","d":2,"tp":"材料 Materials","c":"3.1.2","p":51,"q":"Class 1 及 Class 2 鋼材的斷裂伸長率（elongation at fracture）不應少於多少 %？","a":1,"u":"%","e":"3.1.2 Ductility：Class 1、2 ≥15%；Class 1H ≥10%；抗拉強度應變不大於屈服應變 15 倍。","x":"For Classes 1 and 2 steel, the elongation at fracture is not to be less than 15%;","o":["18%","15%","20%","10%"],"q_en":"The elongation at fracture of Class 1 and Class 2 steel should not be less than what %?","e_en":"3.1.2 Ductility: Class 1 and 2 ≥15%; Class 1H ≥10%; strain at tensile strength not greater than 15 times the yield strain.","doc":"steel-2011-2023ed","pp":"32","ex":"steel","tier":"常考"},{"id":"STL-016","t":"mcq","d":1,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 ≤ 16 mm 時的 design strength py 是多少 N/mm²？","a":3,"u":"N/mm²","e":"S355：≤16 mm 355、≤40 mm 345、≤63 mm 335、≤80 mm 325、≤100 mm 315。厚板 py 下降，大型 H 柱（翼緣 >40 mm）常被忽略。","x":"16 355 40 345 63 335 S355 80 325","o":["345 N/mm²","325 N/mm²","335 N/mm²","355 N/mm²"],"q_en":"Table 3.2: design strength py (N/mm²) of S355 steel with thickness ≤ 16 mm?","e_en":"S355: ≤16 mm 355, ≤40 mm 345, ≤63 mm 335, ≤80 mm 325, ≤100 mm 315. py decreases for thick plates, which is often overlooked for large H-columns (flanges >40 mm).","doc":"steel-2011-2023ed","pp":"33","ex":"steel","tier":"常考"},{"id":"STL-017","t":"mcq","d":2,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 > 40 mm 但 ≤ 63 mm 時 py 是多少 N/mm²？","a":3,"u":"N/mm²","e":"厚度分級：16/40/63/80/100/150 mm。UC 356×406×634 等重型柱翼緣超過 63 mm，py 只有 325 或以下。","x":"16 355 40 345 63 335 S355 80 325","o":["355 N/mm²","345 N/mm²","325 N/mm²","335 N/mm²"],"q_en":"Table 3.2: py (N/mm²) of S355 steel with thickness > 40 mm but ≤ 63 mm?","e_en":"Thickness bands: 16/40/63/80/100/150 mm. Heavy columns such as UC 356×406×634 have flanges over 63 mm, with py only 325 or less.","doc":"steel-2011-2023ed","pp":"33","ex":"s
