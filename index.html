<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dde3ea;--pri:#0f2740;--acc:#f2b134;--ok:#1e8e4e;--okbg:#e5f5ec;--bad:#c0392b;--badbg:#fbeae8;--warn:#9a6700;--warnbg:#fff6dd;--link:#1a5fb4;--r:14px;--shadow:0 1px 3px rgba(15,39,64,.08),0 4px 14px rgba(15,39,64,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0d141c;--card:#16212d;--ink:#e6edf3;--mute:#9aa8b6;--line:#2a3746;--pri:#0f2740;--okbg:#12311f;--badbg:#3a1714;--warnbg:#3a2e0c;--warn:#f2c14e;--link:#7fb0ff;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;min-height:52px}
.topbar h1{flex:1;font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom));outline:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:12px;color:var(--mute);text-decoration:none}
.tabbar a span{font-size:20px;line-height:1.1}
.tabbar a.on{color:var(--pri);font-weight:700}
@media (prefers-color-scheme:dark){.tabbar a.on{color:var(--acc)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat small{color:var(--mute);font-size:12.5px}
.stat.hl{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat.hl small{color:#cfe0f5}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e7dd7,#1e8e4e)}
.docrow{padding:10px 0;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:0}
.docrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.docrow .top span:last-child{color:var(--mute);font-size:12.5px;white-space:nowrap}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.topics{margin:6px 0 2px 8px;font-size:13px;color:var(--mute)}
.topics div{display:flex;justify-content:space-between;padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc{background:var(--acc);color:#1b1300;border-color:var(--acc);font-weight:700}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
select,input[type=text],input[type=search],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink);cursor:pointer;min-height:34px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.x{background:#e8f0fe;color:#1a5fb4;border-color:transparent}
@media (prefers-color-scheme:dark){.tag.x{background:#1b2c47;color:#9cc2ff}}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qtext{font-size:17px;font-weight:600;margin:6px 0 12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.opt b{display:inline-block;width:24px;color:var(--mute)}
.opt.sel{border-color:var(--link)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.neutral{background:var(--warnbg);color:var(--warn)}
.expl{white-space:pre-wrap}
.cite{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.cite .doc{font-weight:700}
.cite .loc{color:var(--mute)}
blockquote{margin:8px 0 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;font-style:italic}
.model{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap}
.kp label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.kp input{width:20px;height:20px;margin-top:2px;flex:none}
.flash{perspective:1200px;min-height:300px;cursor:pointer;margin-bottom:12px}
.flash .inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;overflow:auto}
.flash .back{transform:rotateY(180deg)}
.flash .front .big{font-size:19px;font-weight:700;margin-top:24px}
.flash .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--mute);font-size:12.5px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades .btn{flex-direction:column;font-size:14px;padding:6px 4px;gap:0}
.grades small{font-size:11px;opacity:.85}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.navgrid button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.navgrid button.ans{background:#dbe8fb;border-color:#9dbbe8;color:#0f2740}
.navgrid button.cur{outline:2px solid var(--acc)}
.navgrid button.r{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.navgrid button.w{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.list .item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .s{font-size:14.5px}
.list .item .m{font-size:12px;color:var(--mute)}
mark{background:#ffe58a;color:#000;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px}
.menu a:last-child{border-bottom:0}
.menu a span:first-child{font-size:20px;width:28px;text-align:center}
.menu a em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.note h3{margin:0 0 4px;font-size:15.5px}
.note p{margin:0;font-size:14.5px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
#toast.show{opacity:.95}
.muted{color:var(--mute)}
.small{font-size:13px}
.bm{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute);min-width:40px;min-height:40px}
.bm.on{color:var(--acc)}
.hero{background:linear-gradient(135deg,#0f2740,#1d4d7a);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:18px}
.hero p{margin:0;color:#cfe0f5;font-size:13.5px}
.hero .row{margin-top:12px}
@media (min-width:900px){main{padding-top:22px}.qtext{font-size:18px}}
</style>

覆蓋（查表及截面分類），實際設計請用供應商最新的截面表及 HK Steel Code 2023 Ed 的 py 值。"}],"counts":{"questions":552,"flashcards":212}},"q":[{"id":"CON-001","t":"mcq","d":2,"tp":"預應力 Prestressed","c":"2.2.4.4(b)","p":23,"q":"預應力混凝土 class 3 構件在非常侵蝕性環境（如海水）中，表面裂縫寬度不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.3 mm"],"a":1,"e":"Class 1 無拉應力；class 2 有拉應力但無可見裂縫；class 3 容許裂縫：very aggressive 環境 ≤0.1 mm，其他 ≤0.2 mm。海旁 PT 構件應留意。","x":"0.1 mm for members in very aggressive environments (e.g. exposure to sea) and not exceeding","doc":"concrete-2013-2020ed","pp":"9","tags":["concrete-2013-2020ed","預應力 Prestressed","mcq","中級"]},{"id":"CON-002","t":"tf","d":1,"tp":"荷載 Loads","c":"2.3.1.1","p":23,"q":"Concrete Code 的 characteristic wind load Wk 應按 Code of Practice on Wind Effects 取得。","a":true,"e":"對。2.3.1.1：Gk、Qk 按 Dead and Imposed Loads Code，Wk 按 Wind Code。這是 cross-code 的基本鏈接：先定 characteristic loads，再按 Table 2.1 乘 γf。","x":"characteristic wind load, Wk, as defined in the Code of Practice on Wind Effects.","doc":"concrete-2013-2020ed","pp":"9","tags":["concrete-2013-2020ed","荷載 Loads","tf","基礎"]},{"id":"CON-003","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(a)","p":24,"q":"所有樓宇應能抵抗 notional horizontal load，其值為每層 characteristic dead weight 的百分之幾？","a":1.5,"tol":0,"u":"%","e":"2.3.1.4(a)：每層同時施加 1.5% Gk 的 notional horizontal load；在 load combination 2 或 3 中，design ultimate wind load 不應小於此值。低層、背風或受遮擋建築要特別檢核這個下限。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-004","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(b)","p":24,"q":"Key element 及其連接應能承受任何方向的 design ultimate load 是多少 kN/m²（不另乘 partial safety factor）？","a":34,"tol":0,"u":"kN/m²","e":"2.3.1.4(b)：34 kN/m²，施加於構件的 projected area，不乘 γf。用於 disproportionate collapse 設計中「key element」路線，例如 transfer column 不能以移除構件方式處理時。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-005","t":"mcq","d":2,"tp":"荷載 Loads","c":"2.3.1.5","p":24,"q":"考慮 exceptional loads（誤用或意外）時，一般寫字樓（非儲存用途）應計入多少 imposed load？","o":["0%","三分之一","三分之二","100%"],"a":1,"e":"2.3.1.5：dead load + 1/3 wind + imposed load（儲存/工業或永久性 imposed load 取 100%，其他樓宇取 1/3），並按 2.3.2.2 取 γf = 1.05。","x":"are permanent, 100% of the imposed load; for other buildings, one-third of the imposed load.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","mcq","中級"]},{"id":"CON-006","t":"tf","d":2,"tp":"荷載 Loads","c":"2.3.1.6","p":24,"q":"Concrete Code 規定由 differential settlement 引起的荷載應當作 permanent 荷載處理。","a":true,"e":"對。2.3.1.6：differential settlement 引起的荷載當作 permanent；例子包括軟土上 pad footing、不同基礎類型、不同基礎深度、pile cap 剛度不足。與 Foundations Code 的沉降評估相連。","x":"Loads induced by differential settlement should be treated as permanent.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","tf","中級"]},{"id":"CON-007","t":"scenario","d":2,"tp":"荷載組合 Load combinations","c":"Table 2.1","p":25,"q":"一幢住宅樓宇檢核 ULS。請列出 Table 2.1 三個 load combinations 的主要 γf（dead adverse/beneficial、imposed、wind）。","m":"Comb 1 (Dead + Imposed)：Dead 1.4/1.0、Imposed 1.6/0；Comb 2 (Dead + Wind)：Dead 1.4/1.0、Wind 1.4；Comb 3 (Dead + Imposed + Wind)：Dead 1.2/1.0、Imposed 1.2/0、Wind 1.2。Earth and water pressure 分別取 1.4、1.4、1.2。","k":["1.4Gk + 1.6Qk","1.4Gk(或1.0Gk) + 1.4Wk","1.2Gk + 1.2Qk + 1.2Wk","beneficial dead 取 1.0，beneficial imposed 取 0","Comb 2/3 wind 不少於 1.5% notional load"],"e":"最常見錯誤：overturning / uplift 檢核時 dead load 仍用 1.4；應取 beneficial 1.0Gk + 1.4Wk。泥土/水壓屬有利時 γf 不大於 1.0（Note 1）。","x":"Table 2.1 - Load combinations and values of γf for the ultimate limit state","doc":"concrete-2013-2020ed","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","scenario","中級"]},{"id":"CON-008","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.2","p":25,"q":"評估 exceptional loads 或局部損毀後的持續穩定性時，γf 應取多少？","a":1.05,"tol":0,"u":"","e":"2.3.2.2：γf = 1.05；配合 2.4.3.2(b) γm：混凝土 1.3、鋼 1.0。用於 alternative load path（移除構件）分析。","x":"should be taken as 1.05 on the defined loads","doc":"concrete-2013-2020ed","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","num","中級"]},{"id":"CON-009","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.6","p":26,"q":"豎向構件按車輛撞擊（vehicular impact）設計時，ULS 的 γf 應取多少？","a":1.25,"tol":0,"u":"","e":"2.3.2.6：γf 1.25；撞擊力按 Building (Construction) Regulation 17（2.3.1.4(d)）。停車場柱常見檢核。","x":"Where vertical elements are to be designed for vehicular impact γ at ULS should be 1.25.","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","荷載組合 Load combinations","num","中級"]},{"id":"CON-010","t":"mcq","d":2,"tp":"防火 Fire","c":"Table 2.2","p":26,"q":"Fire limit state 下，一般區域（非走火梯、非永久）imposed load 的 γf 是：","o":["1.00","0.80（有充分理據可降至 0.50）","0.33","1.60"],"a":1,"e":"Table 2.2：dead 1.00；永久 imposed（機器、儲存）1.00；走火梯及大堂 1.00；其他 0.80（可減至 0.50）；wind 0.33。Fire engineering 性能化設計時會用。","x":"Note: *The value may be reduced to 0.50 when suitable justification is available","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","防火 Fire","mcq","中級"]},{"id":"CON-011","t":"num","d":2,"tp":"撓度 Deflection","c":"2.3.3.3","p":26,"q":"計算撓度時，一般住宅或寫字樓應把多少百分比的 imposed load 視為 permanent？","a":25,"tol":0,"u":"%","e":"2.3.3.3：住宅/寫字樓 25%；儲存用途至少 75%。用於長期撓度（creep）計算，例如 transfer beam 或長跨板的 long-term deflection。","x":"occupancy, 25% of the imposed load should be considered as permanent and for structures used for","doc":"concrete-2013-2020ed","pp":"12","tags":["concrete-2013-2020ed","撓度 Deflection","num","中級"]},{"id":"CON-012","t":"num","d":1,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下 reinforcement 的 γm 是多少？","a":1.15,"tol":0,"u":"","e":"Table 2.3：鋼筋 1.15（FLS 1.00）；混凝土彎曲/軸力 1.50；無箍筋抗剪 1.25；bond 1.40。所以 fy/γm = 0.87fy。","x":"Reinforcement (prestressing steel included) 1.15 1.00","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","num","基礎"]},{"id":"CON-013","t":"num","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下無箍筋混凝土抗剪強度（concrete shear strength without shear reinforcement）的 γm 是多少？","a":1.25,"tol":0,"u":"","e":"1.25 已包含在 Table 6.3 vc 公式中（vc 除以 γm）。不要重複除。","x":"Concrete shear strength without shear 1.25 1.10","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","num","中級"]},{"id":"CON-014","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"Bond strength 的 ULS γm 是：","o":["1.15","1.25","1.40","1.50"],"a":2,"e":"Bond strength γm = 1.40（FLS 1.10）。錨固長度及搭接長度表已包括此值。","x":"Bond strength 1.40 1.10","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","mcq","中級"]},{"id":"CON-015","t":"tf","d":1,"tp":"材料 Materials","c":"3.1.2","p":29,"q":"混凝土 characteristic strength 是指 28 天 cube strength，預期有 5% 試驗結果低於此值。","a":true,"e":"對。3.1.2：28-day cube strength 的 5% fractile。香港用 cube（非 cylinder），與 Eurocode 的 fck 不同，引用外國公式時要換算。","x":"of the cube strength at 28 days below which 5% of all compressive test results would be expected to","doc":"concrete-2013-2020ed","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","tf","基礎"]},{"id":"CON-016","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.3","p":29,"q":"以正常重量骨料製造的鋼筋混凝土，最低應使用哪個強度等級？","o":["C15","C20","C25","C30"],"a":1,"e":"3.1.3：RC 最低 C20。但耐久性（Table 4.2）按 exposure condition 往往要求更高等級，如 moderate 需 C35 配 40 mm cover。","x":"For reinforced concrete the lowest grade that should be used is C20 for concrete made with normal","doc":"concrete-2013-2020ed","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-017","t":"num","d":2,"tp":"材料 Materials","c":"Table 3.2","p":30,"q":"Table 3.2：C40 混凝土一般用途（for general use）的 Ec 是多少 kN/mm²？","a":25.1,"tol":0,"u":"kN/mm²","e":"Ec = 3.46√fcu + 3.21：C40 → 25.1 kN/mm²；檢核整體樓宇撓度時可用較高的 26.4。香港花崗岩骨料的 Ec 偏低，比 BS 8110 值細。","x":"C35 23.7 25.1 C40 25.1 26.4","doc":"concrete-2013-2020ed","pp":"16","tags":["concrete-2013-2020ed","材料 Materials","num","中級"]},{"id":"CON-018","t":"short","d":3,"tp":"材料 Materials","c":"Table 3.2 Note 2","p":30,"q":"Table 3.2 為何有兩欄 Ec？第二欄用於甚麼情況？","m":"第一欄「For general use」用於一般構件設計；第二欄「For checking overall building deflection」較高，用於檢核整體樓宇側向撓度，亦可用於 clause 5.5 transfer structure 層的相對側向撓度檢核。","k":["general use vs overall building deflection","第二欄數值較高","可用於 5.5 transfer 層 relative lateral deflection"],"e":"高樓 ETABS 模型 drift 檢核可用第二欄 Ec，但構件內力/撓度應用第一欄。混淆兩者會低估構件撓度。","x":"Ec value for checking overall building deflection may also be used to check the relative lateral","doc":"concrete-2013-2020ed","pp":"16","tags":["concrete-2013-2020ed","材料 Materials","short","進階"]},{"id":"CON-019","t":"num","d":1,"tp":"材料 Materials","c":"3.1.6","p":31,"q":"Linear elastic analysis 時混凝土的 Poisson's ratio 可取多少？","a":0.2,"tol":0,"u":"","e":"3.1.6：0.2。有限元素板分析（如 SAFE）常用。","x":"Where linear elastic analysis is appropriate, Poisson’s ratio may be taken as 0.2.","doc":"concrete-2013-2020ed","pp":"17","tags":["concrete-2013-2020ed","材料 Materials","num","基礎"]},{"id":"CON-020","t":"num","d":3,"tp":"材料 Materials","c":"3.1.8","p":33,"q":"Drying shrinkage 公式中，考慮香港碎花崗岩骨料的 Hong Kong modification factor cs 是多少？","a":2.5,"tol":0,"u":"","e":"3.1.8：cs = 2.5，反映本地花崗岩骨料收縮較大。長牆、大面積 podium slab 的收縮裂縫及 movement joint 設計要考慮。","x":"cs is 2.5, Hong Kong modification factor to allow for properties of the crushed granitic aggregate,","doc":"concrete-2013-2020ed","pp":"19","tags":["concrete-2013-2020ed","材料 Materials","num","進階"]},{"id":"CON-021","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.9","p":34,"q":"正常重量混凝土的線性熱膨脹系數一般取：","o":["6×10⁻⁶/°C","10×10⁻⁶/°C","12×10⁻⁶/°C","20×10⁻⁶/°C"],"a":1,"e":"3.1.9：10×10⁻⁶/°C；鋼筋為 12×10⁻⁶/°C（3.2.5）。溫度應力及 movement joint 間距計算用。","x":"The linear coefficient of thermal expansion for normal weight concrete may normally be taken as","doc":"concrete-2013-2020ed","pp":"20","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-022","t":"mcq","d":1,"tp":"材料 Materials","c":"3.2.1","p":34,"q":"Concrete Code 3.2 適用的 ribbed 鋼筋等級是：","o":["Grade 460","Grade 500A 及 500B","Grade 500B 及 500C（符合 CS2）","Grade 600"],"a":2,"e":"3.2.1：plain grade 250；ribbed grade 500B、500C 符合 CS2。500A 只用於焊接鋼網（3.3.3），不可做彎矩再分配。","x":"grade 500B and grade 500C complying with CS2, or the acceptable standards as appropriate, used","doc":"concrete-2013-2020ed","pp":"20","tags":["concrete-2013-2020ed","材料 Materials","mcq","基礎"]},{"id":"CON-023","t":"num","d":1,"tp":"材料 Materials","c":"3.2.4","p":35,"q":"鋼筋的 elastic modulus 應取多少 kN/mm²？","a":200,"tol":0,"u":"kN/mm²","e":"3.2.4：Es = 200 kN/mm²。Modular ratio αe = Es/Ec 用於裂縫及撓度計算。","x":"The elastic modulus for reinforcement should be taken as 200 kN/mm2.","doc":"concrete-2013-2020ed","pp":"21","tags":["concrete-2013-2020ed","材料 Materials","num","基礎"]},{"id":"CON-024","t":"mcq","d":3,"tp":"鋼筋接駁 Couplers","c":"3.2.8.3","p":36,"q":"Type 1 mechanical coupler 測試：拉至 0.6fy 後的 permanent elongation 不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.5 mm"],"a":1,"e":"3.2.8.3(a)：0.1 mm；grade 500B assembly 抗拉強度 >540 N/mm²，500C >575 N/mm²。Type 2 另需 cyclic test，並用於 ductility 詳細設計（9.9）。","x":"permanent elongation after loading to 0.6fy should not exceed 0.1 mm; and","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋接駁 Couplers","mcq","進階"]},{"id":"CON-025","t":"short","d":3,"tp":"鋼筋接駁 Couplers","c":"3.2.8.4","p":36,"q":"Type 2 mechanical coupler 的 static tension test 要求是甚麼？甚麼情況需要用 type 2？","m":"Splicing assembly 在拉力下須達到 bar 的 tensile strength Rm 的 100% 及 fy 的 125% 兩者中較大者；壓力下須達 125% fy；並須通過 Table 3.4 四階段 cyclic tension-and-compression test。Type 2 的使用須符合 clause 9.9（ductility detailing）。","k":["max(100% Rm, 125% fy)","壓力 125% fy","Cyclic test Table 3.4","用於 9.9 ductility 區域"],"e":"在需要 ductility detailing 的 beam-column 塑性鉸區，接駁器要用 type 2，確保鋼筋先於接駁器屈服。提交時要附 coupler 測試報告。","x":"of the tensile strength, Rm, of the bar, and 125 percent of the specified characteristic yield strength,","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋接駁 Couplers","short","進階"]},{"id":"CON-026","t":"tf","d":2,"tp":"鋼筋 Reinforcement","c":"3.3.3","p":36,"q":"使用 Grade 500A 焊接鋼網（welded fabric）的構件可以做 moment redistribution。","a":false,"e":"錯。3.3.3：Grade 500A 鋼網直徑 8–16 mm，任何情況都不容許 moment redistribution，因其延性較低。","x":"to 16 mm. In all conditions, moment redistribution is not allowed.","doc":"concrete-2013-2020ed","pp":"22","tags":["concrete-2013-2020ed","鋼筋 Reinforcement","tf","中級"]},{"id":"CON-030","t":"num","d":1,"tp":"耐久性 Durability","c":"4.1.1","p":40,"q":"Concrete Code 第 4 節的耐久性指引是基於多少年的 design working life？","a":50,"tol":0,"u":"年","e":"4.1.1：50 年。如業主要求 100 年（例如公共基建），Table 4.2 的 cover 需按專門文獻加大，不能直接套用。","x":"The guidelines given in the following clauses are based on a design working life of 50 years.","doc":"concrete-2013-2020ed","pp":"26","tags":["concrete-2013-2020ed","耐久性 Durability","num","基礎"]},{"id":"CON-031","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.2.1","p":41,"q":"連續一次澆築的混凝土最小尺寸超過多少時，應考慮降溫措施（如低水化熱材料）？","o":["300 mm","450 mm","600 mm","1000 mm"],"a":2,"e":"4.2.2.1：>600 mm，尤其 cementitious content ≥400 kg/m³ 時。Transfer plate、pile cap 等 mass concrete 須有 thermal control plan（溫度監測、pfa/ggbs、分層澆築）。","x":"than 600 mm, and especially where the cementitious content is 400 kg/m3 or more, measures to reduce","doc":"concrete-2013-2020ed","pp":"27","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-032","t":"mcq","d":1,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"浴室、廚房等高濕度的室內混凝土表面屬哪一個 exposure condition？","o":["1 Mild","2 Moderate","3 Severe","4 Very Severe"],"a":1,"e":"Table 4.1：Moderate 包括高濕度室內表面及受大雨/乾濕循環的外露表面（fair faced、乾掛幕牆背後）。有瓷磚/批盪保護的外牆屬 Mild。","x":"Internal concrete surfaces exposed to high humidity e.g. bathrooms and kitchens.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","基礎"]},{"id":"CON-033","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"近海岸、受空氣中海水飛沫影響（但非直接接觸）的混凝土表面屬：","o":["Moderate","Severe","Very Severe","Abrasive"],"a":1,"e":"Table 4.1：Severe（condition 3）。潮汐區至最低低水位下 1 m 則屬 Very Severe（condition 4）。海旁項目最低 C40 配 50 mm cover。","x":"Concrete surfaces exposed to sea water spray through airborne contact but not","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-034","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(a)","p":42,"q":"實際保護層（actual cover）不應少於 nominal cover 減 5 mm。","a":true,"e":"對。4.2.4.1(a)：nominal cover 是設計及圖則上的數值，實際 cover ≥ nominal − 5 mm。工地驗鋼（cover meter）以此判斷是否合格。","x":"should not be less than the nominal cover minus 5 mm","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","tf","中級"]},{"id":"CON-035","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(b)","p":42,"q":"成束（bundled）主筋的保護層不應少於：","o":["最大單支鋼筋直徑","等效截面積單支鋼筋的直徑","兩倍單支直徑","25 mm"],"a":1,"e":"4.2.4.1(b)：主筋 cover ≥ 主筋直徑；成對或成束時，用截面積等於總和的單支等效直徑，並同時保持箍筋的 nominal cover。大直徑柱筋常被忽略。","x":"a single bar of cross-sectional area equal to the sum of their cross-sectional areas","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-036","t":"num","d":1,"tp":"耐久性 Durability","c":"4.2.4.1(d)","p":43,"q":"混凝土直接澆築於泥土上時，nominal cover 一般不應少於多少 mm？","a":75,"tol":0,"u":"mm","e":"4.2.4.1(d)：直接貼泥 75 mm；有足夠 blinding 時 ≥40 mm（不計 blinding）。Pile cap、地樑底筋常用 75 mm。","x":"generally be not less than 75 mm","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","基礎"]},{"id":"CON-037","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Exposure condition 2（Moderate）用 C35 混凝土，nominal cover 是多少 mm？","a":35,"tol":0,"u":"mm","e":"Condition 2：C30 40 mm、C35 35 mm、C40 35 mm、C45+ 30 mm。外牆 fair-faced 常用 C35/35 mm 或 C40/35 mm。另要檢核 Fire Safety Code 的 cover。","x":"Condition 2 -- 40 35 35 30 30 30","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-038","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Exposure condition 3（Severe）容許的最低混凝土等級及對應 nominal cover 是：","o":["C30，40 mm","C35，45 mm","C40，50 mm","C50，55 mm"],"a":2,"e":"Table 4.2：Condition 3 最低 C40（50 mm），C45 以上 45 mm；Condition 4 最低 C50（55 mm）、≥C55 50 mm。","x":"Condition 3 -- -- -- 50 45 45 45","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-039","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Condition 1 樓板（slabs only）用 C30 時 nominal cover 是多少 mm？","a":30,"tol":0,"u":"mm","e":"Condition 1 slabs：C20/25–C30 30 mm；C35+ 25 mm；其他構件 C30–C40 30 mm。但 Fire Safety Code 的 FRR 要求可能更大，取兩者較大值。","x":"- slabs only 30 30 25 25 25 25 25","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-040","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.4","p":43,"q":"Nominal cover 亦應適用於 mechanical couplers，除非接駁器採用加強抗腐蝕材料。","a":true,"e":"對。4.2.4.4：coupler 外徑較鋼筋大，詳圖時要確保 coupler 表面仍有足夠 cover，否則要加大構件或用抗腐蝕 coupler。","x":"The nominal cover should also be applied to mechanical couplers, if used,","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","tf","中級"]},{"id":"CON-041","t":"mcq","d":3,"tp":"耐久性 Durability","c":"4.2.5.2","p":44,"q":"若建立系統化檢查以確保符合 w/c ratio 及 cementitious content 限制，Table 4.2 的混凝土等級最多可放寬多少？","o":["2","5","10","不可放寬"],"a":1,"e":"4.2.5.2：最多放寬 5（例如 C40→C35），但不適用於 4.2.5.5 的 pfa/ggbs 混合。實務上較少使用，需要 QA 系統支持。","x":"placed, the concrete grades specified may be relaxed by not more than 5.","doc":"concrete-2013-2020ed","pp":"30","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","進階"]},{"id":"CON-042","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.5.5","p":44,"q":"PFA 佔 total cementitious content 的一般範圍是：","o":["10%–20%","25%–35%","35%–75%","50%–80%"],"a":1,"e":"4.2.5.5：pfa 25%–35%；ggbs 35%–75%。含 pfa/ggbs 要延長養護，拆模時間亦要考慮早期強度較低。","x":"(a) 25% to 35% for pfa","doc":"concrete-2013-2020ed","pp":"30","tags":["concrete-2013-2020ed","耐久性 Durability","mcq","中級"]},{"id":"CON-043","t":"num","d":3,"tp":"耐久性 Durability","c":"4.2.6.1","p":45,"q":"一般強度混凝土（fcu ≤ 60），total cementitious content 超過多少 kg/m³ 時須特別考慮收縮/溫度裂縫風險？","a":550,"tol":0,"u":"kg/m³","e":"4.2.6.1：>550 kg/m³ 要特別考慮；一般 cement 含量限 ≤450 kg/m³。高強度混凝土要控制水化熱及收縮徐變。","x":"and pfa or ggbs in excess of 550 kg/m3 should not be used unless special consideration has","doc":"concrete-2013-2020ed","pp":"31","tags":["concrete-2013-2020ed","耐久性 Durability","num","進階"]},{"id":"CON-044","t":"num","d":2,"tp":"耐久性 Durability","c":"Table 4.5","p":47,"q":"含鋼筋混凝土的最大總氯化物含量（以水泥重量百分比計）是多少 %？","a":0.35,"tol":0,"u":"%","e":"Table 4.5：預應力/蒸汽養護 0.1%；SRPC 0.2%；鋼筋混凝土 0.35%。海砂在香港受嚴格限制，就是為了控制氯化物。","x":"Concrete with reinforcement or other embedded 0.35","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-045","t":"num","d":2,"tp":"耐久性 Durability","c":"4.2.7.3","p":47,"q":"為減低鹼骨料反應（AAR），混凝土的 reactive alkali content（equivalent Na₂O）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"4.2.7.3(d)：≤3.0 kg/m³，供應商須提交 HOKLAS 認可測試證書。Argillaceous dolomitic limestone 骨料不應使用。","x":"should not exceed 3.0 kg;","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","耐久性 Durability","num","中級"]},{"id":"CON-046","t":"tf","d":1,"tp":"防火 Fire","c":"4.3","p":47,"q":"按 Concrete Code，耐久性要求的 cover 一定足夠防火，毋須再參考 Fire Safety Code。","a":false,"e":"錯。4.3：某些情況下耐久性 cover 不足以防火，須按 Fire Safety Code 修正 nominal cover，而 Fire Safety Code 亦規定構件最小尺寸。這是典型的 cross-code 檢核。","x":"In some circumstances, the cover specified for durability will not be sufficient for fire protection.","doc":"concrete-2013-2020ed","pp":"33","tags":["concrete-2013-2020ed","防火 Fire","tf","基礎"]},{"id":"CON-047","t":"num","d":2,"tp":"防火 Fire","c":"4.3.1.1","p":48,"q":"高強度混凝土中 silica fume 含量不應超過 total cementitious content 的百分之幾？","a":6,"tol":0,"u":"%","e":"4.3.1.1：≤6%，因 silica fume 令混凝土更密實，火災時蒸汽壓力易致 spalling。PFA/GGBS 則有助防止 spalling，沒有額外限制。","x":"should not exceed 6% by weight of the total cementitious content","doc":"concrete-2013-2020ed","pp":"34","tags":["concrete-2013-2020ed","防火 Fire","num","中級"]},{"id":"CON-048","t":"scenario","d":3,"tp":"防火 Fire","c":"4.3.1.2","p":48,"q":"一幢住宅的 C80 柱需要防火爆裂（spalling）措施。按 4.3.1.2 可選用哪些方法？若改用 C90 又有何額外要求？","m":"至少採用一種：Method A 15 mm cover 的鋼網（線徑 ≥2 mm、網距 ≤50×50 mm，主筋 cover ≥40 mm）；Method B 混凝土加 ≥1.5 kg/m³ monofilament polypropylene fibres（6–12 mm 長、18–32 μm、熔點 <180°C）；Method C 經驗證的保護層；Method D 經驗證的混凝土配比。超過 C80 須至少一次火災測試，證明在設計 FRR 期間主筋不外露。","k":["Method A 鋼網","Method B ≥1.5 kg/m³ PP fibres","Method C 保護層 / Method D 配比","> C80 需 fire test"],"e":"實務上 Method B（PP fibre）最常用，要在混凝土規格及 mix design 註明。C80 本身不需 fire test，但 >C80（如 C90、C100）需要。","x":"(b) Method B: Include in the concrete mix not less than 1.5 kg/m3 of monofilament propylene fibres.","doc":"concrete-2013-2020ed","pp":"34","tags":["concrete-2013-2020ed","防火 Fire","scenario","進階"]},{"id":"CON-050","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(a)","p":50,"q":"連續（continuous）樑的跨度少於整體深度的多少倍時，應當作 deep beam？","o":["2.0","2.5","3.0","4.0"],"a":1,"e":"5.2.1.1(a)：簡支 <2h、連續 <2.5h 屬 deep beam，第 6.1.2 節一般樑設計不適用，要用 strut-and-tie 等專門方法。Transfer girder 常屬此類。","x":"simply supported spans and 2.5 times the overall depth for continuous spans. Otherwise it","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","中級"]},{"id":"CON-051","t":"mcq","d":1,"tp":"結構分析 Analysis","c":"5.2.1.1(e)","p":50,"q":"按 Concrete Code，截面深度超過寬度多少倍時應當作 wall 而非 column？","o":["3","4","5","6"],"a":1,"e":"5.2.1.1(e)：depth ≤ 4 × width 為 column，否則屬 wall。影響配筋要求（9.5 vs 9.6）及 FRR 最小尺寸（Fire Code 表格分柱和牆）。","x":"(e) A column is a member for which the section depth does not exceed 4 times its width. Otherwise","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","基礎"]},{"id":"CON-052","t":"tf","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(c)","p":50,"q":"四邊支承的矩形板，長短跨比大於 2 時，其中部可視為 one-way spanning。","a":true,"e":"對。5.2.1.1(c)(ii)：ly/lx > 2 可按單向板。另 5.2.1.1(b)：板的最小尺寸須 ≥5 倍板厚才算 slab。","x":"longer to shorter span greater than 2.","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","tf","中級"]},{"id":"CON-053","t":"mcq","d":3,"tp":"結構分析 Analysis","c":"5.2.1.1(d)","p":50,"q":"Ribbed slab 若要毋須當作獨立構件分析，肋距（rib spacing）不應超過：","o":["900 mm","1200 mm","1500 mm","2000 mm"],"a":2,"e":"5.2.1.1(d)：肋距 ≤1500 mm、肋深 ≤4 倍肋寬、翼緣厚 ≥ max(1/10 淨距, 50 mm)、橫肋淨距 ≤10 倍板深。","x":"(i) the rib spacing does not exceed 1500 mm and the depth of the rib below the flange does","doc":"concrete-2013-2020ed","pp":"36","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","進階"]},{"id":"CON-054","t":"tf","d":3,"tp":"結構分析 Analysis","c":"5.2.1.2(b)","p":55,"q":"與支承整體澆築的樑，支座處的 critical design moment 不應少於 full fixed end moment 的 0.65 倍。","a":true,"e":"對。5.2.1.2(b) Note：取支座面彎矩，但不少於 0.65 倍 fixed end moment；圓柱取柱面內 0.2φ。防止過度削減支座彎矩。","x":"Note: The critical design moment at the support should not be less than 0.65 that of the full","doc":"concrete-2013-2020ed","pp":"41","tags":["concrete-2013-2020ed","結構分析 Analysis","tf","進階"]},{"id":"CON-055","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.5.2","p":55,"q":"Sub-frame 分析豎向荷載時，以下哪一個不是 Code 列明的 critical loading arrangement？","o":["所有跨度 1.4Gk + 1.6Qk","隔跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","任何相鄰兩跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","所有跨度 1.0Gk + 1.6Qk"],"a":3,"e":"5.2.5.2 三種排列：全跨最大、隔跨最大、相鄰兩跨最大（其餘 1.0Gk）。Pattern loading 對連續樑跨中彎矩及柱彎矩重要。","x":"(c) any two adjacent spans loaded with the maximum design ultimate load (1.4Gk + 1.6Qk), and all","doc":"concrete-2013-2020ed","pp":"41","tags":["concrete-2013-2020ed","結構分析 Analysis","mcq","中級"]},{"id":"CON-056","t":"num","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.2","p":57,"q":"超過四層、由框架提供側向穩定的結構，彎矩再分配最多是多少 %？","a":10,"tol":0,"u":"%","e":"5.2.9.2：限 10%，condition 3 的 70% 改為 90%。一般情況（5.2.9.1）只適用於 ≤C70，截面抗彎須 ≥70% 彈性彎矩。","x":"The provisions of clause 5.2.9.1 apply except that redistribution is limited to 10% and the value given","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","彎矩再分配 Redistribution","num","中級"]},{"id":"CON-057","t":"tf","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.1","p":57,"q":"C80 混凝土的構件可按 5.2.9.1 進行彎矩再分配。","a":false,"e":"錯。5.2.9.1 只適用於不超過 C70；而 70 < fcu ≤ 100 的 x ≤ 0.33d 限制亦註明「no moment redistribution」。","x":"For concrete of strength grade not exceeding C70, redistribution of the moments obtained by means","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","彎矩再分配 Redistribution","tf","中級"]},{"id":"CON-058","t":"num","d":2,"tp":"二階效應 Second order","c":"5.3","p":57,"q":"二階效應（second order effects）少於一階效應的百分之幾時可以忽略？","a":10,"tol":0,"u":"%","e":"5.3：<10% 可忽略。高樓 P-Δ 分析時用此判斷；否則要在變形狀態下驗證平衡與抗力。","x":"Second order effects may be ignored if they are less than 10% of the corresponding first order effects.","doc":"concrete-2013-2020ed","pp":"43","tags":["concrete-2013-2020ed","二階效應 Second order","num","中級"]},{"id":"CON-059","t":"scenario","d":3,"tp":"轉換結構 Transfer","c":"5.5","p":58,"q":"一幢住宅 podium 上設 transfer plate，其下層層高 Hs = 5.6 m。Transfer 層相對下層的 lateral deflection 上限是多少？分析 transfer structure 還須考慮哪些因素？","m":"上限 Hs/700 = 5600/700 = 8 mm。還須考慮：施工及澆築次序、臨時及永久荷載、支承構件不同軸向縮短、剪力牆的局部效應、上下構件剛度、transfer 撓度、transfer 上的側向剪力及 sidesway。","k":["Hs/700 = 8 mm","construction/pouring sequence","differential axial shortening","local effect of shear walls","lateral shear & sidesway"],"e":"5.5 是 BD 審批 transfer 結構的重點。常見問題：模型未考慮澆築次序（部分荷載由模板承托）及上部剪力牆與 transfer plate 的共同作用（arching）。檢核 Hs/700 時可用 Table 3.2 第二欄 Ec。","x":"should not exceed Hs/700, where Hs is the height of the storey below the transfer structure;","doc":"concrete-2013-2020ed","pp":"44","tags":["concrete-2013-2020ed","轉換結構 Transfer","scenario","進階"]},{"id":"CON-060","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.1(d)","p":59,"q":"簡支或連續樑的側向穩定：約束點之間的淨距不應超過：","o":["40bc 或 150bc²/d（取較小）","60bc 或 250bc²/d（取較小）","25bc 或 100bc²/d（取較小）","100bc"],"a":1,"e":"6.1.2.1(d)：簡支/連續 60bc 或 250bc²/d；懸臂 25bc 或 100bc²/d。bc 為受壓翼緣寬度。長跨窄樑（如外牆 spandrel）要檢核。","x":"(i) for simply-supported or continuous beams: 60bc or 250bc2/d if less; or","doc":"concrete-2013-2020ed","pp":"45","tags":["concrete-2013-2020ed","彎曲設計 Flexure","mcq","中級"]},{"id":"CON-061","t":"short","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.3","p":59,"q":"使用 Table 6.1（均布荷載連續樑彎矩及剪力係數）有哪些前提？","m":"(a) Qk 不超過 Gk；(b) 荷載大致均布於三跨或以上；(c) 跨度差異不超過最長跨 15%。並且不可再對 Table 6.1 所得彎矩作再分配。","k":["Qk ≤ Gk","≥3 跨均布","跨度差 ≤15%","不可再分配"],"e":"Table 6.1 係數如 end span 0.09Fl、first interior support −0.11Fl。手算快速檢核時常用，但 podium 重荷載（Qk>Gk）不適用。","x":"(a) characteristic imposed load Qk may not exceed characteristic dead load Gk;","doc":"concrete-2013-2020ed","pp":"45","tags":["concrete-2013-2020ed","彎曲設計 Flexure","short","中級"]},{"id":"CON-062","t":"num","d":1,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"只受彎的截面，lever arm z 不應大於有效深度 d 的多少倍？","a":0.95,"tol":0,"u":"","e":"6.1.2.4(a)(v)：z ≤ 0.95d。輕彎矩時公式 6.10 算出的 z 可能 >0.95d，要封頂。","x":"to be greater than 0.95 times the effective depth.","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","num","基礎"]},{"id":"CON-063","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(b)","p":60,"q":"C50 混凝土（45 < fcu ≤ 70），無再分配或 ≤10%，中性軸深度 x 上限是：","o":["0.5d","0.4d","0.33d","0.25d"],"a":1,"e":"6.1.2.4(b)：fcu ≤45 → 0.5d；45–70 → 0.4d；70–100 → 0.33d（且不可再分配）。高強度混凝土延性較低，所以限制更嚴。","x":"x ≤ 0.4d for 45 < fcu ≤ 70 N/mm2 ; or","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","mcq","中級"]},{"id":"CON-064","t":"num","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(c)","p":61,"q":"fcu ≤ 45 N/mm²、再分配不超過 10% 時，K' 值是多少？","a":0.156,"tol":0,"u":"","e":"K' = 0.156（fcu ≤45）、0.120（45–70）、0.094（70–100）。K = M/bd²fcu > K' 時需要受壓鋼筋。常見錯誤：C60 仍用 0.156。","x":"K’ = 0.156 for fcu ≤45 N/mm2 ; or","doc":"concrete-2013-2020ed","pp":"47","tags":["concrete-2013-2020ed","彎曲設計 Flexure","num","中級"]},{"id":"CON-065","t":"tf","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"樑承受的設計軸向壓力不超過 0.1fcu × 截面面積時，分析時可忽略該軸力。","a":true,"e":"對。6.1.2.4(a)：≤0.1fcu·Ac 可忽略。例如 podium 樑受少量軸力；但受拉軸力（如 tie beam）不在此列，要另計。","x":"the design ultimate axial force may be ignored if it does not exceed 0.1fcu times the cross-","doc":"concrete-2013-2020ed","pp":"46","tags":["concrete-2013-2020ed","彎曲設計 Flexure","tf","中級"]},{"id":"CON-066","t":"mcq","d":1,"tp":"抗剪 Shear","c":"6.1.2.5(a)","p":62,"q":"樑的設計剪應力 v 無論配多少箍筋都不應超過：","o":["0.63√fcu 或 5 N/mm²","0.8√fcu 或 7.0 N/mm²（取較小）","√fcu","0.8fcu"],"a":1,"e":"6.1.2.5(a)：v ≤ min(0.8√fcu, 7.0 N/mm²)，已含 γm 1.25。超過即要加大截面，不能靠加箍筋解決。Transfer girder 常由此控制截面。","x":"In no case should v exceed 0.8√fcu or 7.0 N/mm2, whichever is the lesser, whatever shear","doc":"concrete-2013-2020ed","pp":"48","tags":["concrete-2013-2020ed","抗剪 Shear","mcq","基礎"]},{"id":"CON-067","t":"num","d":2,"tp":"抗剪 Shear","c":"Table 6.2","p":62,"q":"fcu ≤ 40 N/mm² 時，最少箍筋（minimum links）提供的設計剪力抗力 vr 是多少 N/mm²？","a":0.4,"tol":0,"u":"N/mm²","e":"Table 6.2 Note 2：vr = 0.4（fcu ≤40）；fcu >40 時 0.4(fcu/40)^(2/3)，fcu 上限取 80。所以高強度混凝土最少箍筋量會增加。","x":"Minimum links provide a design shear resistance of vr where vr = 0.4 for fcu ≤ 40 N/mm2 or","doc":"concrete-2013-2020ed","pp":"48","tags":["concrete-2013-2020ed","抗剪 Shear","num","中級"]},{"id":"CON-068","t":"mcq","d":2,"tp":"抗剪 Shear","c":"6.1.2.5(d)","p":63,"q":"樑的箍筋沿跨度方向間距不應超過：","o":["0.5d","0.75d","d","300 mm"],"a":1,"e":"6.1.2.5(d)：沿跨 ≤0.75d；橫向任何受拉筋距箍筋腳 ≤150 mm，且橫向間距 ≤d。闊扁樑要用多肢箍。","x":"The spacing of links in the direction of the span should not exceed 0.75d.","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","mcq","中級"]},{"id":"CON-069","t":"num","d":2,"tp":"抗剪 Shear","c":"Table 6.3","p":63,"q":"Table 6.3：100As/bvd = 1.00，有效深度 d ≥ 400 mm，vc 是多少 N/mm²（fcu = 25）？","a":0.63,"tol":0,"u":"N/mm²","e":"Table 6.3 最右欄（400 mm）1.00 → 0.63 N/mm²。fcu >25 可乘 (fcu/25)^(1/3)，fcu 上限 80。As 須延伸至少 d 過該截面才可計入。","x":"1.00 0.84 0.81 0.78 0.75 0.73 0.71 0.68 0.63","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","num","中級"]},{"id":"CON-070","t":"tf","d":3,"tp":"抗剪 Shear","c":"Table 6.3 Note 3","p":63,"q":"計算 vc 的 (fcu/25)^(1/3) 放大系數時，fcu 可取實際等級如 C100。","a":false,"e":"錯。Table 6.3 Note 3：fcu 不應取大於 80 N/mm²。100As/bvd 不大於 3；(400/d)^(1/4) 對無箍筋構件不少於 0.67。","x":"The value of fcu should not be taken as greater than 80 N/mm2.","doc":"concrete-2013-2020ed","pp":"49","tags":["concrete-2013-2020ed","抗剪 Shear","tf","進階"]},{"id":"CON-071","t":"short","d":3,"tp":"抗剪 Shear","c":"6.1.2.5(g)","p":64,"q":"甚麼是「enhanced shear strength of sections close to supports」？適用條件為何？","m":"剪力破壞面一般約 30° 傾斜；若截面距支座面或集中荷載少於 2d，破壞面被迫更陡，可把 vc 提升至 2d·vc/av（av 為破壞面跨越長度），但支座面 v 仍須 < min(0.8√fcu, 7.0)。受拉鋼筋須在破壞面兩側延伸至少 d 或有等效錨固。","k":["av < 2d","vc → 2d·vc/av","支座面 v 上限不變","受拉筋兩側延伸 ≥ d"],"e":"Pile cap、corbel、近支座集中荷載的 transfer beam 常用。常見錯誤：鋼筋錨固不足仍用 enhancement；以及 rigid pile cap 簡化分析時（6.7.3.3(b)）不可用。","x":"support by increasing the design concrete shear stress vc to 2dvc/av, where av is the length of","doc":"concrete-2013-2020ed","pp":"50","tags":["concrete-2013-2020ed","抗剪 Shear","short","進階"]},{"id":"CON-072","t":"mcq","d":2,"tp":"沖剪 Punching","c":"6.1.5.7(f)","p":88,"q":"沖剪（punching shear）檢核首先在距加載面多遠的周界進行？","o":["0.5d","d","1.5d","2d"],"a":2,"e":"6.1.5.7(f)：先檢核 1.5d 周界，v ≤ vc 即可。需要箍筋時第一圈約在 0.5d，含 ≥40% 計算面積；周界間距 ≤0.75d，同圈間距 ≤1.5d。","x":"The shear capacity is checked first on a perimeter 1.5d from the face of the loaded area. If the","doc":"concrete-2013-2020ed","pp":"74","tags":["concrete-2013-2020ed","沖剪 Punching","mcq","中級"]},{"id":"CON-073","t":"tf","d":3,"tp":"沖剪 Punching","c":"6.1.5.7(e)","p":88,"q":"沖剪 v 超過 2vc 時，仍可直接用 equation 6.45 計算所需箍筋。","a":false,"e":"錯。6.1.5.7(e)：6.44/6.45 不適用於 v > 2vc；若用其他加強系統（如 shear studs）須另提供理據。箍筋只適用於 >200 mm 厚板。","x":"Equations 6.44 and 6.45 should not be applied where the shear stress v exceeds 2 vc.","doc":"concrete-2013-2020ed","pp":"74","tags":["concrete-2013-2020ed","沖剪 Punching","tf","進階"]},{"id":"CON-074","t":"mcq","d":1,"tp":"柱 Columns","c":"6.2.1.1(b)","p":90,"q":"Braced column 在 lex/h 及 ley/b 均少於多少時可當作 short column？","o":["10","12","15","20"],"a":2,"e":"6.2.1.1(b)：braced <15，unbraced <10。Slender column 要計 deflection-induced additional moment（6.2.1.3）。","x":"A column may be considered as short when both ratios lex /h and ley /b are less than 15 (braced)","doc":"concrete-2013-2020ed","pp":"76","tags":["concrete-2013-2020ed","柱 Columns","mcq","基礎"]},{"id":"CON-075","t":"num","d":2,"tp":"柱 Columns","c":"Table 6.11","p":91,"q":"Braced column 上下兩端均為 end condition 1，β 值是多少？","a":0.75,"tol":0,"u":"","e":"Table 6.11：braced 1-1 為 0.75，3-3 為 1.00；unbraced（Table 6.12）1-1 為 1.2，cantilever 4-1 為 2.2。le = β·lo。","x":"1 0.75 0.80 0.90","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-076","t":"mcq","d":2,"tp":"柱 Columns","c":"6.2.1.1(e)(ii)","p":91,"q":"柱端與兩側比柱深度淺的樑或板整體連接，屬哪一個 end condition？","o":["Condition 1","Condition 2","Condition 3","Condition 4"],"a":1,"e":"Condition 1：樑深 ≥ 柱尺寸（或設計承受彎矩的基礎）；Condition 2：較淺樑/板；Condition 3：只提供名義約束；Condition 4：無約束（懸臂柱自由端）。Flat slab 柱通常屬 condition 2。","x":"Condition 2. The end of the column is connected monolithically to beams or","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","mcq","中級"]},{"id":"CON-077","t":"num","d":2,"tp":"柱 Columns","c":"6.2.1.2(d)","p":92,"q":"柱的最小偏心 emin 取柱尺寸的 0.05 倍，但不多於多少 mm？","a":20,"tol":0,"u":"mm","e":"6.2.1.2(d)：emin = 0.05h ≤ 20 mm；雙向彎曲只需一次一軸滿足。軸心受壓柱亦必須計這個名義彎矩。","x":"0.05 times the overall dimension of the column in the plane of bending considered but not more","doc":"concrete-2013-2020ed","pp":"78","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-078","t":"num","d":2,"tp":"柱 Columns","c":"6.2.1.1(f)","p":91,"q":"一般情況下，柱端約束之間的淨高 lo 不應超過柱最小厚度的多少倍？","a":60,"tol":0,"u":"倍","e":"6.2.1.1(f)：lo ≤ 60b。懸臂 unbraced 柱另受 6.47：lo ≤ 100b²/h ≤ 60b。","x":"Generally, the clear distance, lo, between end restraints should not exceed 60 times the","doc":"concrete-2013-2020ed","pp":"77","tags":["concrete-2013-2020ed","柱 Columns","num","中級"]},{"id":"CON-079","t":"scenario","d":3,"tp":"穩健性 Robustness","c":"6.4.1.4","p":107,"q":"一幢 12 層 RC 樓宇，平均 Gk + Qk = 10 kPa，lr = 7.5 m。試求 internal tie 所需拉力（kN/m）。","m":"Ft = min(20 + 4×12, 60) = min(68, 60) = 60 kN。Internal tie = max[(Gk+Qk)/7.5 × lr/5 × Ft, 1.0Ft] = max[10/7.5 × 7.5/5 × 60, 60] = max[120, 60] = 120 kN/m。鋼筋可取 γm = 1.0（fy）。","k":["Ft = min(20+4n₀, 60) = 60","(Gk+Qk)/7.5 × lr/5 × Ft = 120 kN/m","不少於 1.0Ft","γm = 1.0"],"e":"Tie 可利用已有樓板/樑鋼筋，但要連續及妥善搭接（8.7）。常見錯誤：Ft 未封頂 60 kN、或誤用 design load 而非 characteristic Gk+Qk。","x":"Ft is the lesser of (20 + 4no) or 60, where no is the number of storeys in the structure;","doc":"concrete-2013-2020ed","pp":"93","tags":["concrete-2013-2020ed","穩健性 Robustness","scenario","進階"]},{"id":"CON-080","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"6.4.1.5","p":108,"q":"Peripheral tie 應設於距樓宇邊緣多少範圍內（或在外牆內）？","o":["0.5 m","1.0 m","1.2 m","2.0 m"],"a":2,"e":"6.4.1.5：peripheral tie 拉力 1.0Ft，位於邊緣 1.2 m 內或外牆內。","x":"resisting a tensile force (in kN) of 1.0Ft, located within 1.2 m of the edge of the building or within the","doc":"concrete-2013-2020ed","pp":"94","tags":["concrete-2013-2020ed","穩健性 Robustness","mcq","中級"]},{"id":"CON-081","t":"num","d":2,"tp":"穩健性 Robustness","c":"6.4.1.6","p":108,"q":"外柱的水平 tie 力取 2.0Ft（或 ls/2.5·Ft）與柱在該層總設計垂直荷載百分之幾的較大者？","a":3,"tol":0,"u":"%","e":"6.4.1.6(a)(ii)：3% of total design ultimate vertical load。角柱要在兩個方向各自滿足。","x":"(ii) 3% of the total design ultimate vertical load carried by the column or wall at that level.","doc":"concrete-2013-2020ed","pp":"94","tags":["concrete-2013-2020ed","穩健性 Robustness","num","中級"]},{"id":"CON-082","t":"mcq","d":2,"tp":"牛腿 Corbels","c":"6.5.2.3","p":109,"q":"Corbel 的水平箍筋應分佈在根部有效深度的哪個範圍，數量不少於主拉筋的多少？","o":["下三分之一；主筋 25%","上三分之二；主筋 50%","全深度；主筋 100%","上半；主筋 33%"],"a":1,"e":"6.5.2.3：上 2/3 有效深度，≥ 主拉筋面積一半。另 6.5.2.1(a)：水平力抗力不少於垂直設計荷載一半。","x":"thirds of the effective depth of root of the corbel; this reinforcement should be not less than one-half","doc":"concrete-2013-2020ed","pp":"95","tags":["concrete-2013-2020ed","牛腿 Corbels","mcq","中級"]},{"id":"CON-083","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.2","p":112,"q":"Pile cap 剪力檢核的 critical section 位於：","o":["柱面","樁面","樁面向內 20% 樁徑","距柱面 d"],"a":2,"e":"6.7.3.2：樁面內 20% 樁徑；中心在此線外的樁力全計在外。Rigid cap 簡化分析不可用 shear enhancement（6.7.3.3(b)）。","x":"located 20% of the diameter of the pile inside the face of the pile, as indicated in Figure 6.19. The","doc":"concrete-2013-2020ed","pp":"98","tags":["concrete-2013-2020ed","基礎 Foundations","mcq","中級"]},{"id":"CON-084","t":"tf","d":3,"tp":"基礎 Foundations","c":"6.7.3.3(c)","p":112,"q":"考慮剪力橫向分布時，pile cap 的 shear enhancement 可施加於以每支樁為中心、寬 3φ 的條帶。","a":true,"e":"對。6.7.3.3(c)：寬 3φ；H 樁或矩形樁可用樁寬 + 2 × 最小尺寸。v < vc 時毋須最少箍筋（(e)）。","x":"enhancement may be applied to the strip of the pile cap of width equal to 3φ, centred on each","doc":"concrete-2013-2020ed","pp":"98","tags":["concrete-2013-2020ed","基礎 Foundations","tf","進階"]},{"id":"CON-085","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.1","p":111,"q":"Truss analogy 設計 pile cap 時，若樁距超過 3 倍樁徑，只計入距樁中心多少範圍內的鋼筋作拉桿？","o":["0.5φ","1.0φ","1.5φ","3φ"],"a":2,"e":"6.7.3.1：樁距 >3φ 時只計 1.5φ 範圍內鋼筋，故大樁距 cap 應把底筋集中於樁頂帶。","x":"spaced piles (spacing exceeding three times the pile diameter), only the reinforcement within 1.5 times","doc":"concrete-2013-2020ed","pp":"97","tags":["concrete-2013-2020ed","基礎 Foundations","mcq","中級"]},{"id":"CON-090","t":"mcq","d":1,"tp":"裂縫 Cracking","c":"Table 7.1","p":117,"q":"一般建築物的鋼筋混凝土構件（exposure 1–4），最大估計表面裂縫寬度一般限制為：","o":["0.1 mm","0.2 mm","0.3 mm","0.4 mm"],"a":2,"e":"Table 7.1：RC 0.3 mm；水缸等 water retaining structures 0.2 mm；unbonded PT 0.2 mm。Exposure 1 的限制只為外觀，可放寬。","x":"Table 7.1 - Limitations of maximum estimated surface crack widths","doc":"concrete-2013-2020ed","pp":"103","tags":["concrete-2013-2020ed","裂縫 Cracking","mcq","基礎"]},{"id":"CON-091","t":"tf","d":2,"tp":"裂縫 Cracking","c":"7.2.2","p":117,"q":"只要符合第 8、9 節最少配筋及鋼筋間距規定，一般毋須另行計算裂縫寬度。","a":true,"e":"對。7.2.2 deemed-to-satisfy。若直接計算裂縫（7.2.3），往往可用較大鋼筋間距，淺構件尤其明顯。","x":"If the detailing rules prescribed in sections 8 and 9 with respect to minimum reinforcement areas and","doc":"concrete-2013-2020ed","pp":"103","tags":["concrete-2013-2020ed","裂縫 Cracking","tf","中級"]},{"id":"CON-092","t":"mcq","d":2,"tp":"裂縫 Cracking","c":"7.2.3","p":118,"q":"使用 equation 7.1 計算裂縫寬度的前提，受拉鋼筋應變應限於：","o":["0.5fy/Es","0.8fy/Es","0.87fy/Es","fy/Es"],"a":1,"e":"7.2.3：鋼筋應變 ≤0.8fy/Es。主要受軸拉的構件使用公式要小心。","x":"Provided the strain in the tension reinforcement is limited to 0.8fy/Es, the design surface crack width,","doc":"concrete-2013-2020ed","pp":"104","tags":["concrete-2013-2020ed","裂縫 Cracking","mcq","中級"]},{"id":"CON-093","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.1","p":120,"q":"施工後（after construction）可能損壞相鄰部分的撓度，對 quasi-permanent loads 一般合適的限值是：","o":["span/250","span/360","span/500","span/750"],"a":2,"e":"7.3.1：外觀 sag 限 span/250（pre-camber 亦不應超過 span/250）；施工後撓度 span/500。有玻璃幕牆或脆性間隔時可能要更嚴。","x":"after construction, span/500 is normally an appropriate limit for quasi-permanent loads. Other limits","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","mcq","中級"]},{"id":"CON-094","t":"num","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"在 static characteristic wind load 下，樓頂側向撓度限制為 H/ 多少？","a":500,"tol":0,"u":"","e":"7.3.2：H/500，H 由最高樓層量度（不包括機房/天台構築物）。Cross-code：wind load 按 Wind Code 2019 計算，但撓度限值來自 Concrete Code。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","num","中級"]},{"id":"CON-095","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"動力分析下，住宅樓宇在 1-in-10-year 10 分鐘風速下的最大峰值加速度限值是：","o":["0.10 m/s²","0.15 m/s²","0.25 m/s²","0.35 m/s²"],"a":1,"e":"7.3.2：住宅 0.15 m/s²；寫字樓/酒店 0.25 m/s²。超高住宅常由加速度控制，可能需要 damper 或風洞試驗。","x":"Residential 0.15 m/s2","doc":"concrete-2013-2020ed","pp":"106","tags":["concrete-2013-2020ed","撓度 Deflection","mcq","中級"]},{"id":"CON-096","t":"num","d":2,"tp":"振動 Vibration","c":"7.3.3","p":121,"q":"樓面結構自然頻率低於多少 Hz 時可能需要動力分析？","a":6,"tol":0,"u":"Hz","e":"7.3.3：樓面 <6 Hz、行人天橋 <5 Hz。健身室、長跨鋼樑樓面及天橋要檢核。","x":"from people or machinery, should be avoided. For a building floor structure with the natural frequency","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","振動 Vibration","num","中級"]},{"id":"CON-097","t":"num","d":1,"tp":"撓度 Deflection","c":"Table 7.3","p":121,"q":"Table 7.3：簡支矩形樑（simply-supported rectangular beam）的基本 span/effective depth ratio 是多少？","a":20,"tol":0,"u":"","e":"Table 7.3：cantilever 7、simply-supported 20、continuous 26、end span 23（flanged bw/b ≤0.3 較低：5.5/16/21/18.5）。再乘 Table 7.4/7.5 修正系數。","x":"Simply-supported 20 16 20","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","撓度 Deflection","num","基礎"]},{"id":"CON-098","t":"scenario","d":2,"tp":"撓度 Deflection","c":"7.3.4.3","p":121,"q":"一條 12 m 跨的連續矩形樑，支承脆性間隔牆。如何以 Table 7.3 檢核撓度？","m":"跨度 >10 m 且需限制間隔牆及飾面安裝後撓度增加，基本比值 26 要乘 10/span = 10/12，即 26 × 0.833 ≈ 21.7，再乘 Table 7.4 受拉筋及 Table 7.5 受壓筋修正系數。懸臂則須以計算證明。","k":["span >10 m","乘 10/span","26 × 10/12 ≈ 21.7","再乘 Table 7.4/7.5"],"e":"長跨樑常被忽略 10/span 修正。雙向板按短跨檢核（Table 7.3 Note 3）。","x":"in Table 7.3 should be multiplied by 10/span except for cantilevers where the design should be justified","doc":"concrete-2013-2020ed","pp":"107","tags":["concrete-2013-2020ed","撓度 Deflection","scenario","中級"]},{"id":"CON-099","t":"mcq","d":2,"tp":"鋼筋間距 Spacing","c":"8.2","p":130,"q":"平行鋼筋之間的最小淨距應不少於：","o":["鋼筋直徑","hagg + 5 mm","20 mm","以上三者的最大值"],"a":3,"e":"8.2：max(bar diameter, hagg + 5 mm, 20 mm)。多層鋼筋應上下對齊，留位給震動棒。","x":"parallel bars should be not less than the maximum of bar diameter, (hagg + 5 mm) or 20 mm where","doc":"concrete-2013-2020ed","pp":"116","tags":["concrete-2013-2020ed","鋼筋間距 Spacing","mcq","中級"]},{"id":"CON-100","t":"mcq","d":2,"tp":"彎筋 Bends","c":"Table 8.2","p":131,"q":"直徑 ≥ 20 mm 鋼筋彎鈎的最小內彎半徑是：","o":["2φ","3φ","4φ","6φ"],"a":2,"e":"Table 8.2：φ ≤12 mm 2φ；<20 mm 3φ；≥20 mm 4φ。若錨固需要超過彎位後 4φ，要檢核彎內混凝土承壓（eq 8.1）。","x":"φ < 20 mm 3φ φ ≥ 20 mm 4φ","doc":"concrete-2013-2020ed","pp":"117","tags":["concrete-2013-2020ed","彎筋 Bends","mcq","中級"]},{"id":"CON-101","t":"num","d":2,"tp":"錨固 Anchorage","c":"Table 8.3","p":132,"q":"Ribbed bars 受拉時的 bond coefficient β 是多少？","a":0.5,"tol":0,"u":"","e":"fbu = β√fcu（fcu 上限 60）；ribbed 受拉 0.50、受壓 0.63；plain 0.28/0.35。無最少箍筋的樑要用 plain bar 值（板除外）。","x":"Ribbed bars 0.50 0.63","doc":"concrete-2013-2020ed","pp":"118","tags":["concrete-2013-2020ed","錨固 Anchorage","num","中級"]},{"id":"CON-102","t":"tf","d":3,"tp":"錨固 Anchorage","c":"8.4.4","p":132,"q":"在沒有按 Table 6.2 設最少箍筋的樑中，即使用 ribbed bars，錨固 bond stress 也要按 plain bars 取值。","a":true,"e":"對。8.4.4：樑無最少箍筋時用 plain bar β，但此規定不適用於板。這會令錨固長度大增。","x":"anchorage bond stresses used should be those appropriate to plain bars irrespective of the type of","doc":"concrete-2013-2020ed","pp":"118","tags":["concrete-2013-2020ed","錨固 Anchorage","tf","進階"]},{"id":"CON-103","t":"num","d":1,"tp":"錨固 Anchorage","c":"Table 8.4","p":133,"q":"Table 8.4：C40 混凝土、fy 500 ribbed bar 受拉 anchorage length 是多少倍鋼筋直徑？","a":35,"tol":0,"u":"φ","e":"C30 40φ、C35 38φ、C40 35φ、C45 33φ、C50 31φ、≥C60 28φ（ribbed 受拉）。受壓較短。圖則上常寫「anchorage 40φ」即按 C30 取值。","x":"40 Tension 31 35 27","doc":"concrete-2013-2020ed","pp":"119","tags":["concrete-2013-2020ed","錨固 Anchorage","num","基礎"]},{"id":"CON-104","t":"tf","d":2,"tp":"錨固 Anchorage","c":"8.4.6","p":133,"q":"彎鈎（bends and hooks）對受壓錨固（compression anchorage）有貢獻。","a":false,"e":"錯。8.4.6：bends and hooks do not contribute to compression anchorages。柱筋插入 pile cap 受壓時要足夠直線長度。","x":"Bends and hooks do not contribute to compression anchorages.","doc":"concrete-2013-2020ed","pp":"119","tags":["concrete-2013-2020ed","錨固 Anchorage","tf","中級"]},{"id":"CON-105","t":"num","d":1,"tp":"搭接 Laps","c":"8.7.3.1","p":136,"q":"鋼筋最小搭接長度為 15 倍直徑或多少 mm（取較大）？","a":300,"tol":0,"u":"mm","e":"8.7.3.1：≥max(15φ, 300 mm)；焊接鋼網 ≥250 mm。實際搭接一般由 Table 8.5 控制。","x":"The minimum lap length for bar reinforcement should be not less than 15 times the bar diameter or","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","num","基礎"]},{"id":"CON-106","t":"mcq","d":3,"tp":"搭接 Laps","c":"8.7.3.2","p":136,"q":"搭接位於截面頂部（as cast）且最小保護層少於 2 倍鋼筋直徑，同時位於角位亦符合條件，搭接長度應乘：","o":["1.0","1.25","1.4","2.0"],"a":3,"e":"8.7.3.2：單一條件 ×1.4，兩者同時 ×2.0。樑頂角筋常同時符合兩項。","x":"(c) where both conditions above apply, the lap length should be increased by a factor of 2.0.","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","mcq","進階"]},{"id":"CON-107","t":"mcq","d":2,"tp":"搭接 Laps","c":"8.7.2","p":136,"q":"受拉鋼筋分佈在兩層或以上時，同一截面容許搭接的百分比是：","o":["25%","50%","75%","100%"],"a":1,"e":"8.7.2：單層 100%；兩層或以上 50%。受壓及分佈筋可全部在同一截面搭接。","x":"all in one layer, or 50% where the bars are in 2 or more layers.","doc":"concrete-2013-2020ed","pp":"122","tags":["concrete-2013-2020ed","搭接 Laps","mcq","中級"]},{"id":"CON-108","t":"num","d":2,"tp":"樑配筋 Beam detailing","c":"9.2.1.3","p":149,"q":"樑的受拉或受壓鋼筋面積均不應超過毛截面面積的多少 %？","a":4,"tol":0,"u":"%","e":"9.2.1.3：≤4%；搭接處同層鋼筋直徑總和 ≤40% 截面寬度。Ductility 區（9.9.1.2）受拉筋更限 2.5%。","x":"4% of the gross cross-sectional area of the concrete.","doc":"concrete-2013-2020ed","pp":"135","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","num","中級"]},{"id":"CON-109","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"9.2.1.2","p":149,"q":"樑深超過 750 mm 時側面筋（side bars）的間距不應超過：","o":["150 mm","200 mm","250 mm","300 mm"],"a":2,"e":"9.2.1.2：≤250 mm，分佈於由受拉面起 2/3 樑深範圍。Transfer girder 常忽略側筋，導致腹部裂縫。","x":"The spacing should not exceed 250 mm and the bars should be distributed over a distance of two-","doc":"concrete-2013-2020ed","pp":"135","tags":["concrete-2013-2020ed","樑配筋 Beam detailing","mcq","中級"]},{"id":"CON-110","t":"num","d":1,"tp":"板配筋 Slab detailing","c":"9.3.1.1","p":153,"q":"fy = 500 N/mm² 時，實心板每方向最少總縱向鋼筋為混凝土截面的多少 %？","a":0.13,"tol":0,"u":"%","e":"9.3.1.1：fy 250 → 0.24%；fy 500 → 0.13%；受拉筋再乘 αmin = 40fcu^(2/3)/fy ≥1.0。所以高等級混凝土最少鋼筋會增加（例如 C45 時 αmin ≈1.01）。","x":"(ii) fy = 500 N/mm2: 0.13% of concrete cross-sectional area.","doc":"concrete-2013-2020ed","pp":"139","tags":["concrete-2013-2020ed","板配筋 Slab detailing","num","基礎"]},{"id":"CON-111","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"9.3.1.1(b)","p":153,"q":"一般情況下，板主筋最大間距是：","o":["2h ≤ 250 mm","3h ≤ 400 mm","3.5h ≤ 450 mm","4h ≤ 500 mm"],"a":1,"e":"9.3.1.1(b)：主筋 3h ≤400 mm；次筋 3.5h ≤450 mm；集中荷載或最大彎矩區主筋 2h ≤250 mm。","x":"(i) for the principal reinforcement, 3h ≤ 400 mm; and","doc":"concrete-2013-2020ed","pp":"139","tags":["concrete-2013-2020ed","板配筋 Slab detailing","mcq","中級"]},{"id":"CON-112","t":"tf","d":2,"tp":"板配筋 Slab detailing","c":"9.3.2","p":154,"q":"厚度少於 200 mm 的板不應使用抗剪鋼筋。","a":true,"e":"對。9.3.2：<200 mm 板難以彎紮及確保抗剪筋有效，因此不應使用。沖剪不足時要加厚板、用 drop panel 或柱帽。","x":"thick. Therefore, shear reinforcement should not be used in such slabs.","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","板配筋 Slab detailing","tf","中級"]},{"id":"CON-113","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"懸臂板跨度多於多少時應改用 beam-and-slab 布置？","o":["750 mm","1000 mm","1200 mm","1500 mm"],"a":2,"e":"9.4.1：>1200 mm 應用樑板布置。懸臂板厚度：≤500 mm 跨 110 mm；≤750 mm 125 mm；≤1000 mm 150 mm；≤1200 mm 175 mm。香港曾有簷篷倒塌事故，故 BD 對懸臂構件特別嚴格。","x":"Instead of pure cantilevered slab arrangements, beam-and-slab arrangements should be used for","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","mcq","中級"]},{"id":"CON-114","t":"num","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"跨度 900 mm 的懸臂板最少厚度是多少 mm？","a":150,"tol":0,"u":"mm","e":"9.4.1(d)：>750 mm 但 ≤1000 mm → 150 mm。同時要符合 7.3 撓度及外露構件的防水、1:75 排水斜度等要求。","x":"(d) 150 mm for cantilevered slab with span greater than 750 mm but not exceeding 1000 mm;","doc":"concrete-2013-2020ed","pp":"140","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","num","中級"]},{"id":"CON-115","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.2","p":155,"q":"懸臂構件頂部受拉主筋的中心間距不應大於：","o":["100 mm","150 mm","200 mm","250 mm"],"a":1,"e":"9.4.2：頂筋最少 0.25%、直徑 ≥10 mm、間距 ≤150 mm。要全錨固，錨固起點按 9.4.3 計算，不可按實際應力折減錨固長度。","x":"The centre-to-centre spacing of the top tension longitudinal bars should not be more than 150 mm.","doc":"concrete-2013-2020ed","pp":"141","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","mcq","中級"]},{"id":"CON-116","t":"short","d":3,"tp":"懸臂構件 Cantilevers","c":"9.4.4","p":155,"q":"外露於天氣、跨度超過 750 mm 的外懸臂板，Code 有哪三項額外要求？","m":"(a) 防水混凝土，28 天 characteristic strength ≥35 MPa；(b) 所有主筋按 BS EN ISO 1461 熱浸鍍鋅（hot-dip galvanized）；(c) 設防水膜/tanking，並以 w/c ≤0.65 的 1:3 水泥砂漿保護。","k":["≥35 MPa water-proof concrete","hot-dip galvanized main bars","waterproof membrane + 1:3 mortar"],"e":"這些是 BD 審圖時的常見 checklist 項目。另懸臂應與支承構件同時整體澆築，施工縫不應設在支承構件外邊。","x":"(b) all main steel reinforcing bars should be hot-dip galvanized to BS EN ISO 1461; and","doc":"concrete-2013-2020ed","pp":"141","tags":["concrete-2013-2020ed","懸臂構件 Cantilevers","short","進階"]},{"id":"CON-117","t":"num","d":1,"tp":"柱配筋 Column detailing","c":"9.5.1","p":156,"q":"柱總縱向鋼筋不應少於毛截面的多少 %？","a":0.8,"tol":0,"u":"%","e":"9.5.1：≥0.8%，直徑 ≥12 mm，矩形柱最少 4 支、圓柱 6 支。上限：豎向澆築 6%、水平澆築 8%、搭接處 10%（ductility 區 9.9.2 為 4%/搭接 5.2%）。","x":"should not be less than 0.8%. See clause 9.9.2 for ductility requirement.","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","num","基礎"]},{"id":"CON-118","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.5.2.1","p":156,"q":"柱箍筋沿柱的間距不應超過以下哪一組的最小值？","o":["12 × 最小縱筋直徑、柱較小尺寸、400 mm","16 × 最大縱筋直徑、柱較大尺寸、300 mm","8 × 縱筋直徑、200 mm","0.75d、600 mm"],"a":0,"e":"9.5.2.1：min(12φ_min, 柱較小尺寸, 400 mm)；箍筋直徑 ≥ max(6 mm, 1/4 最大縱筋)。Ductility critical zone 更嚴（8φ）。","x":"(a) 12 times the diameter of the smallest longitudinal bar;","doc":"concrete-2013-2020ed","pp":"142","tags":["concrete-2013-2020ed","柱配筋 Column detailing","mcq","中級"]},{"id":"CON-119","t":"num","d":2,"tp":"牆配筋 Wall detailing","c":"9.6.2","p":158,"q":"RC 牆最少豎向鋼筋為混凝土截面的多少 %？","a":0.4,"tol":0,"u":"%","e":"9.6.2：0.4%，若由最少筋控制，每面各一半；最多 4%（搭接可加倍）；豎筋間距 ≤ min(3t, 400 mm)。","x":"wall is 0.4%. Where this minimum area of reinforcement controls in the design, half of the area should","doc":"concrete-2013-2020ed","pp":"144","tags":["concrete-2013-2020ed","牆配筋 Wall detailing","num","中級"]},{"id":"CON-120","t":"num","d":2,"tp":"牆配筋 Wall detailing","c":"9.6.3","p":158,"q":"豎筋 ≤2% 時，fy = 500 的牆最少水平鋼筋為混凝土截面的多少 %？","a":0.25,"tol":0,"u":"%","e":"9.6.3：fy 250 → 0.30%；fy 500 → 0.25%；間距 ≤400 mm，直徑 ≥ max(1/4 豎筋, 6 mm)。","x":"(b) fy = 500 N/mm2: 0.25% of concrete cross-sectional area.","doc":"concrete-2013-2020ed","pp":"144","tags":["concrete-2013-2020ed","牆配筋 Wall detailing","num","中級"]},{"id":"CON-121","t":"mcq","d":2,"tp":"混凝土測試 Testing","c":"10.3.4.3","p":174,"q":"鑽芯（cores）驗收：每個芯樣的 estimated in-situ cube strength 至少為指定等級的多少，全組平均至少多少？","o":["65%／75%","75%／85%","85%／95%","90%／100%"],"a":1,"e":"10.3.4.3(e)：每個 ≥75%，平均 ≥85%，按 CS1 計算。立方試驗不合格時常用此補救評估。","x":"each core specimen should be at least 75% of the specified grade strength and the","doc":"concrete-2013-2020ed","pp":"160","tags":["concrete-2013-2020ed","混凝土測試 Testing","mcq","中級"]},{"id":"CON-122","t":"num","d":2,"tp":"施工 Construction","c":"10.3.7","p":176,"q":"澆築時混凝土溫度一般不應超過多少 °C？","a":30,"tol":0,"u":"°C","e":"10.3.7：≤30°C，除非證明較高溫度無害。香港夏天 mass pour 常用冰水/夜間澆築。","x":"At the time of placing, the concrete temperature should not exceed 30°C, unless it can be","doc":"concrete-2013-2020ed","pp":"162","tags":["concrete-2013-2020ed","施工 Construction","num","中級"]},{"id":"CON-123","t":"scenario","d":2,"tp":"施工 Construction","c":"10.3.8.2","p":176,"q":"承包商問：受彎構件模板何時可拆？若沒有其他資料，板底模（留撐）及板撐的最短時間是多少？","m":"受彎構件模板可於混凝土強度達 10 N/mm² 或其承受應力兩倍（取較大）時拆除，前提是不會造成不可接受撓度並有適當養護。無其他資料時（Portland cement）：板底模留撐 4 天；樑底模留撐 7 天；板撐 10 天；樑撐及懸臂撐 14 天；側模 12 小時。長跨或 transfer 結構須達指定 cube strength 才可拆撐。","k":["10 N/mm² 或 2 倍應力","板底模 4 天 / 樑底模 7 天","板撐 10 天 / 樑撐 14 天 / 懸臂 14 天","transfer 須達 specified strength","pfa/ggbs 或 <15°C 要延長"],"e":"實務上 RSE 會在圖則註明拆撐要求。Transfer plate 的 propping 更常要求多層 back-propping 並有計算書支持。","x":"concrete in the element is 10 N/mm2 or twice the stress to which it will be subjected, whichever is the","doc":"concrete-2013-2020ed","pp":"162","tags":["concrete-2013-2020ed","施工 Construction","scenario","中級"]},{"id":"CON-124","t":"mcq","d":3,"tp":"荷載測試 Load test","c":"13.2","p":207,"q":"施工期間結構 load test 的測試荷載一般取以下兩者較大值：","o":["Gk + Qk 或 1.4Gk + 1.6Qk","Gk + 1.25Qk 或 1.125(Gk + Qk)","1.5(Gk + Qk) 或 2Qk","Gk + 1.6Qk 或 1.2(Gk + Qk)"],"a":1,"e":"13.2：W ≥ Gk + Qk，一般取 max(Gk + 1.25Qk, 1.125(Gk+Qk))；至少加載兩次，相隔 ≥1 h。一般不建議加載至 ultimate，以免損害結構。","x":"characteristic dead load and 1.25 times the characteristic imposed load or (b) 1.125 times the sum of","doc":"concrete-2013-2020ed","pp":"193","tags":["concrete-2013-2020ed","荷載測試 Load test","mcq","進階"]},{"id":"XC-001","doc":"concrete-2013-2020ed","t":"scenario","d":2,"tp":"跨規範 Cross-code","c":"2.3.1.1 / Table 2.1","p":25,"q":"一幢住宅 RC 框架，需要 Dead + Imposed + Wind 的 ULS 組合。說明荷載來源及 Concrete Code Table 2.1 的 γf（dead adverse/beneficial、imposed、wind）。","m":"Characteristic dead/imposed load 按 Code of Practice for Dead and Imposed Loads；Wk 按 Code of Practice on Wind Effects（Concrete 2.3.1.1）。Table 2.1 combination 3：dead 1.2 adverse / 1.0 beneficial、imposed 1.2（beneficial 0）、wind 1.2、earth & water 1.2。Combination 2（dead + wind）：dead 1.4/1.0、wind 1.4。","k":["DIL Code → Gk, Qk","Wind Code → Wk","comb 3: 1.2/1.0, 1.2, 1.2","comb 2: 1.4/1.0, wind 1.4","combination 2/3 須同時考慮 notional horizontal load 2.3.1.4(a)"],"e":"常見錯誤：只檢 combination 3 而漏了 combination 2（dead 1.0 beneficial + wind 1.4 對抗拔/柱拉力往往控制）。","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","r":[{"doc":"concrete-2013-2020ed","p":23,"c":"2.3.1.1","x":"characteristic wind load, Wk, as defined in the Code of Practice on Wind Effects.","pp":"9"}],"pp":"11","tags":["concrete-2013-2020ed","跨規範 Cross-code","scenario","中級","cross"],"cross":1},{"id":"XC-002","doc":"wind-code-2019","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"2.3 / Concrete Table 2.1","p":20,"q":"Wind Code 2019 的 ultimate wind load factor γw = 1.4，與 Concrete Code Table 2.1 哪個組合的 wind γf 相同？","o":["Combination 2（Dead + Wind）","Combination 3（Dead + Imposed + Wind）","Combination 1（Dead + Imposed）","全部組合"],"a":0,"e":"Wind Code 用 γw 1.4 將 SLS 風壓轉為 ULS；Concrete Table 2.1 comb 2 wind 1.4、comb 3 wind 1.2。Wind Code 的 design pressure 是 characteristic（未乘 γw），計算時勿重複乘系數。","x":"ultimate wind load factor, taken as 1.4","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"2 earth and water 1.4 1.0 - - 1.4 1.4","pp":"11"}],"pp":"10","tags":["wind-code-2019","跨規範 Cross-code","mcq","中級","cross"],"cross":1},{"id":"XC-003","doc":"glass-2018","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 5.2","p":25,"q":"Glass Code Table 5.2 的 dead/imposed/wind partial load factors 與 Concrete Code Table 2.1 相同（例如 comb 1：1.4/1.0、1.6；comb 3：1.2），但 Glass 另列 temperature 1.2。","a":true,"e":"正確。玻璃設計沿用相同的 ULS 荷載框架，另加溫度荷載欄（1.2）。SLS 全部 adverse 系數 1.0（Table 5.2 Note b）。幕牆顧問與結構工程師要用同一套荷載。","x":"3 Dead, imposed, wind,","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","pp":"11"}],"pp":"17","tags":["glass-2018","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-004","doc":"foundations-2017-2024ed","t":"short","d":2,"tp":"跨規範 Cross-code","c":"2.5.2","p":34,"q":"Foundations Code 2.5.2 規定基礎設計荷載應按哪些規範評估？除上部結構荷載外，imposed load 還應包括甚麼？","m":"按 Code of Practice for Dead and Imposed Loads、Code of Practice on Wind Effects in Hong Kong 及其他相關規範評估。Imposed load 應包括 buoyancy force 及 earth pressure。","k":["Dead and Imposed Loads Code","Wind Effects Code","buoyancy","earth pressure"],"e":"基礎設計常漏算浮力對 pile tension 及地庫抗浮的影響；wind 引致的柱拉力亦須傳到樁。","x":"assessed in accordance with the Code of Practice for Dead and Imposed Loads, Code","r":[{"doc":"foundations-2017-2024ed","p":34,"c":"2.5.2","x":"imposed load should include buoyancy force and earth pressure. Buoyancy force","pp":"26"}],"pp":"26","tags":["foundations-2017-2024ed","跨規範 Cross-code","short","中級","cross"],"cross":1},{"id":"XC-005","doc":"foundations-2017-2024ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 5.1 / GG1 Table 10","p":72,"q":"Foundations Code Table 5.1 中 SPT N = 11–30 乾/濕砂的 nh 為 6 600 kN/m²/m。Geoguide 1 Table 10 對 medium dense 乾砂的 nh 為？","o":["6.6 MN/m³（同一數值）","2.2 MN/m³","17.6 MN/m³","4.4 MN/m³"],"a":0,"e":"兩者數值一致（kN/m²/m = kN/m³；6 600 kN/m³ = 6.6 MN/m³），只是單位寫法不同。樁群還要按 Foundations Table 5.2 折減（3D 間距 0.25）。","x":"11 to 30 6 600 4 400","r":[{"doc":"geoguide1-retaining-walls","p":141,"c":"Table 10","x":"nh (dry sand) (MN/m3) 2.2 6.6 17.6","pp":"140"}],"pp":"64","tags":["foundations-2017-2024ed","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-006","doc":"foundations-2017-2024ed","t":"num","d":2,"tp":"跨規範 Cross-code","c":"2.6.2 / Precast 2.6.2.1 / Concrete 4.2.7.3","p":39,"q":"Foundations、Precast 及 Concrete 三本 Code 對混凝土 reactive alkali（Na2O equivalent）含量上限一致，是每立方米多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"AAR 控制：三本 Code 都是 3.0 kg/m³。樁及地庫長期潮濕，AAR 風險更高，故 Foundations Code 亦重申。","x":"of concrete should not exceed 3.0 kg.","r":[{"doc":"precast-2016","p":15,"c":"2.6.2.1","x":"cubic metre should not exceed 3.0 kg.","pp":"7"},{"doc":"concrete-2013-2020ed","p":47,"c":"4.2.7.3","x":"should not exceed 3.0 kg;","pp":"33"}],"pp":"31","tags":["foundations-2017-2024ed","跨規範 Cross-code","num","中級","cross"],"cross":1},{"id":"XC-007","doc":"geo-pub-1-2023-deep-excavation","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 6.2 / GG1 Table 6","p":69,"q":"臨時 ELS（GEO Pub 1/2023 PFM）與永久擋土牆（Geoguide 1 Table 6）的 surcharge partial load factor 分別是？","o":["1.3 及 1.5","1.5 及 1.3","1.5 及 1.5","1.0 及 1.5"],"a":0,"e":"ELS 屬臨時工程，地盤上的 surcharge 較易控制，故降至 1.3；永久擋土牆用 1.5。兩者若 surcharge 有利均取 0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","r":[{"doc":"geoguide1-retaining-walls","p":139,"c":"Table 6","x":"Surcharge 1.5(1)","pp":"138"}],"pp":"69","tags":["geo-pub-1-2023-deep-excavation","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-008","doc":"geo-pub-1-2023-deep-excavation","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"4.4.1 / GG1 Table 8 Note (6)","p":48,"q":"GEO Pub 1/2023 引用 Geoguide 1：insitu CDG 及 CDV 的 φcv' 下限約 34° 及 30°，可用作 embedded wall 界面摩擦角 δs。","a":true,"e":"正確。Dense soil 中 δs 可取 φcv'；wall adhesion 通常忽略。這些參數影響 waling 靠牆摩擦抵抗角撐 in-plane 力的計算。","x":"granitic and volcanic (tuff and rhyolite) soils respectively. Wall adhesion, cw, is usually","r":[{"doc":"geoguide1-retaining-walls","p":140,"c":"Table 8 Note (6)","x":"completely decomposed volcanics (tuff & rhyolites) is about 34° and 30° respectively.","pp":"139"}],"pp":"48","tags":["geo-pub-1-2023-deep-excavation","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-009","doc":"concrete-2013-2020ed","t":"scenario","d":3,"tp":"跨規範 Cross-code","c":"4.3 / Fire Table E4","p":47,"q":"一塊簡支 RC 樓板要求 FRR 120 min。Concrete Code 4.3 與 Fire Code Table E4 如何共同決定 cover 及板厚？","m":"Concrete 4.3：durability cover 未必足夠防火，應按 Fire Code 修改 nominal cover，並符合最小構件尺寸。Fire Table E4（solid RC floor）120 min：板厚 ≥ 125 mm；simply supported cover ≥ 35 mm（continuous 25 mm）。取 durability cover（Concrete 4.2）與 fire cover 較大者。","k":["取較大值","E4 120 min: 125 mm thick","cover 35 mm simply supported / 25 continuous","Concrete 4.3 指向 Fire Code"],"e":"常見錯誤：只按 exposure 定 durability cover 而忽略簡支板 FRR 120 min 需要 35 mm。另 fcu > 60 MPa 要研究高溫下 spalling。","x":"In some circumstances, the cover specified for durability will not be sufficient for fire protection.","r":[{"doc":"fire-safety-2011-2024ed","p":177,"c":"Table E4","x":"simply supported 55* 35 20","pp":"168"},{"doc":"fire-safety-2011-2024ed","p":177,"c":"Table E4","x":"Thickness of concrete 170 125 100","pp":"168"}],"pp":"33","tags":["concrete-2013-2020ed","跨規範 Cross-code","scenario","進階","cross"],"cross":1},{"id":"XC-010","doc":"geoguide1-retaining-walls","t":"short","d":2,"tp":"跨規範 Cross-code","c":"7.2.1 / Table 16","p":69,"q":"設計擋土牆時 surcharge 如何取值？與 Dead and Imposed Loads Code 的關係？","m":"Geoguide 1 7.2.1：最少 10 kPa 均佈 surcharge；鄰近建築物淺基礎可按 Table 16 每層 10 kPa。若牆後有特定用途（道路、貯物等）則按實際荷載評估，可參考 Dead and Imposed Loads Code 的 imposed load。","k":["minimum 10 kPa","10 kPa per storey（淺基礎建築物）","actual loading 按 DIL Code"],"e":"Surcharge 在岩土計算用 Geoguide 1 的 γf 1.5，在牆身結構設計則用 Concrete Code 的 γf，兩者不要混用。DIL Code 3.9.2 亦有每層最少 10 kPa 的類似概念。","x":"A minimum surcharge of 10 kPa with an appropriate","r":[{"doc":"geoguide1-retaining-walls","p":146,"c":"Table 16","x":"Buildings with shallow foundations(1) 10 kPa per storey(2)","pp":"145"},{"doc":"dead-imposed-loads-2011-2021ed","p":21,"c":"3.9.2","x":"structural forms with a minimum value of 10 kPa per storey.","pp":"17"}],"pp":"68","tags":["geoguide1-retaining-walls","跨規範 Cross-code","short","中級","cross"],"cross":1},{"id":"XC-011","doc":"concrete-2013-2020ed","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"7.3.2 / Steel EM E5.3.4","p":120,"q":"Concrete Code 7.3.2 及 Steel Code 5.3.4（見 EM）對建築物頂部側移的簡化限值？","o":["H/500","H/300","H/1000","H/250"],"a":0,"e":"兩本 Code 都以 H/500（Wind Code 設計風荷載下）作簡化舒適度/側移準則；Steel 另有 storey height/400 層間位移。超高層應以動力分析或風洞驗證加速度。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","r":[{"doc":"steel-explanatory-materials-2011","p":38,"c":"E5.3.4","x":"The first is to limit the top deflection to Height/500 and the inter storey drift to Storey","pp":"32"}],"pp":"106","tags":["concrete-2013-2020ed","跨規範 Cross-code","mcq","中級","cross"],"cross":1},{"id":"XC-012","doc":"concrete-2013-2020ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"2.3.1.4(a) / Precast 2.3.1","p":24,"q":"Concrete Code 與 Precast Code 的 notional horizontal load 均為每層 characteristic dead load 的 1.5%。","a":true,"e":"正確。Precast 結構的穩定性要求與現澆一致；預製構件接駁必須能傳遞此水平力。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","r":[{"doc":"precast-2016","p":12,"c":"2.3.1","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","pp":"4"}],"pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-013","doc":"concrete-2013-2020ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"2.3.1.4(b) / Steel EM E4.3.5","p":24,"q":"Concrete Code 2.3.1.4(b) 的 key element 設計荷載與 Steel EM 提到的 explosion pressure 均為？","o":["34 kN/m²（不加 partial factor）","34 kN/m² × 1.4","10 kPa","5 kPa × 1.6"],"a":0,"e":"34 kN/m² 為 design ultimate load，不再乘 γf；Steel EM 亦以 34 kN/m² 作 extreme event load。Exceptional combination 中其他 live/wind 取 1/3（Steel Table 4.3 用 0.35）。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","r":[{"doc":"steel-explanatory-materials-2011","p":36,"c":"E4.3.5","x":"wind load factor of 1.05 x 0.33 = 0.35 is given in Table 4.3 of the Code for wind and live","pp":"30"}],"pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","mcq","進階","cross"],"cross":1},{"id":"XC-014","doc":"concrete-2013-2020ed","t":"short","d":3,"tp":"跨規範 Cross-code","c":"2.3.1.6 / Steel EM E4.3.1","p":24,"q":"比較 Concrete Code 與 Steel Code（EM 解釋）對 differential settlement 的處理。","m":"Concrete 2.3.1.6：differential settlement 視作 permanent load，γf 取 earth/water pressure 的值（Table 2.1 Note 2）。Steel（EM E4.3.1）：comb 1、2 用 1.4，comb 3 用 1.2；EM 指出鋼結構較具延性，若轉動能力及延性足夠，ULS 一般可不考慮。","k":["Concrete: treated as permanent","Steel: 1.4 / 1.4 / 1.2","ductility → may be ignored at ULS"],"e":"基礎沉降差（Foundations Code 限值）會引致上部結構內力，混合結構要按各自 Code 處理。","x":"Loads induced by differential settlement should be treated as permanent.","r":[{"doc":"steel-explanatory-materials-2011","p":35,"c":"E4.3.1","x":"deformations. However, the Code uses a value of 1.4 for differential settlements in load","pp":"29"}],"pp":"10","tags":["concrete-2013-2020ed","跨規範 Cross-code","short","進階","cross"],"cross":1},{"id":"XC-015","doc":"foundations-2017-2024ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 2.1 / Geoguide 3 Table 12","p":20,"q":"Foundations Code Table 2.1 的 presumed bearing value 分類（例如 dense: SPT N 30–50）與 Geoguide 3 Table 12 的 compactness 分級一致。","a":true,"e":"正確。Foundations Table 2.1 用 very dense > 50、dense 30–50、medium dense 10–30、loose 4–10，與 Geoguide 3 Table 12 的分界相同。鑽孔記錄用 Geoguide 3 描述，直接對應 Foundations Code 的承載力分類。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","r":[{"doc":"geoguide3-rock-soil-descriptions","p":80,"c":"Table 12","x":"Very dense > 50","pp":"79"}],"pp":"12","tags":["foundations-2017-2024ed","跨規範 Cross-code","tf","中級","cross"],"cross":1},{"id":"XC-016","doc":"precast-2016","t":"tf","d":1,"tp":"跨規範 Cross-code","c":"2.4.3","p":13,"q":"Precast Code 規定預製構件的 cover 不應少於 Concrete Code 對 RC 的規定。","a":true,"e":"正確。雖然工廠質量控制較好，但 cover 並無放寬；防火 cover 仍按 Fire Code。","x":"Cover for precast elements should be no less than those specified for reinforced concrete","pp":"5","tags":["precast-2016","跨規範 Cross-code","tf","基礎","cross"],"cross":1},{"id":"DIL-001","t":"tf","d":1,"tp":"總則 General","c":"1.1.3","p":5,"q":"Dead and Imposed Loads Code 內的荷載數值是 factored values，做 limit state design 時不可直接當 characteristic loads 使用。","a":false,"e":"錯。Code 1.1.3 明言所有荷載均為 unfactored values，可直接當 characteristic loads，再乘 Concrete/Steel Code 的 partial load factors (γf)。常見錯誤：把 Table 3.2 的數值當成已放大，漏乘 1.6。","x":"All values of loads given in this Code are unfactored values and may be taken as characteristic loads when carrying out design using limit state method.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","tags":["dead-imposed-loads-2011-2021ed","總則 General","tf","基礎"]},{"id":"DIL-002","t":"tf","d":1,"tp":"總則 General","c":"1.1.4","p":5,"q":"Construction loads（施工荷載）已包括在 Dead and Imposed Loads Code 的 imposed loads 內，設計者毋須另行考慮。","a":false,"e":"錯。1.1.4 指 construction loads 不在 Code 範圍，設計者須自行考慮，例如 transfer plate 澆築時的濕混凝土、模板、堆料。提交圖則時如有特別施工次序（如 propping），應在計算書交代。","x":"Construction loads are not covered by this Code and the designer should consider the relevant construction loads and effect thereof as part of their design.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","tags":["dead-imposed-loads-2011-2021ed","總則 General","tf","基礎"]},{"id":"DIL-003","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.1.2","p":6,"q":"水缸（tanks）及其儲水應如何分類？","o":["水缸重量及儲水均屬 dead load","水缸重量屬 dead load，儲水屬 imposed load","水缸重量及儲水均屬 imposed load","兩者均可不計"],"a":1,"e":"2.1.2：容器本身重量為 dead load，內容物為 imposed load。實務上天台水缸（roof tank）水重應按 imposed load 乘 γf=1.6，而且不應把它當永久荷載去抵抗 uplift 或 overturning。","x":"The weights of tanks and other receptacles shall be considered as dead loads. The contents of tanks and receptacles shall be considered as imposed loads.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","mcq","基礎"]},{"id":"DIL-004","t":"short","d":2,"tp":"恆載 Dead loads","c":"2.1.3","p":6,"q":"若對某荷載是否永久存在（permanency）有疑問，Code 要求如何處理？對荷載折減有何影響？","m":"應把該荷載當作 imposed load 處理，而且按 clause 3.7 對 beams 及 vertical members 的 imposed load reduction 不應套用於此荷載。","k":["疑問時當 imposed load","不可按 3.7 折減","亦列於 3.7.1(h)"],"e":"2.1.3 是保守原則：例如業主可能移走的厚身花槽、不確定的設備基座。當 imposed load 處理令 γf 由 1.4 變 1.6，且不能在柱折減中「賺返」，避免高估安全度。","x":"When there is doubt to the permanency of loads, such loads should be treated as imposed loads while reduction of which under clause 3.7 should not be taken on beams and vertical members.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","short","中級"]},{"id":"DIL-005","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.2.2.2","p":6,"q":"建築圖則上未有顯示位置、但預計會有的 partitions，其重量應當作：","o":["Dead load，按實際排位計算","Imposed load，按 clause 3.6 計算","Wind load","毋須考慮"],"a":1,"e":"2.2.2.2：未在 building plans 顯示位置的間隔牆屬 imposed load（按 3.6 以 1/3 牆重/米計，office 不少於 1 kPa）。已顯示在核准圖則上的則屬 dead load（2.2.2.1）。","x":"Where partitions are envisaged but the location of which are not indicated on the building plans, the weights of these partitions shall be considered as imposed loads and to be calculated in accordance with clause 3.6.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","mcq","基礎"]},{"id":"DIL-006","t":"tf","d":1,"tp":"恆載 Dead loads","c":"2.2.3.2","p":6,"q":"天台綠化（roof greenery）的泥土、防水及排水系統與植物重量應當作 dead load。","a":true,"e":"對。2.2.3.2 規定 greenery 的泥土、防水、排水及植物屬 dead load。實務上要留意泥土飽和水重（saturated density）及日後加厚泥層的可能，並在圖則註明最大泥深。","x":"Where a roof is to be provided with greenery, the weight of soil, waterproofing and drainage system, and plants for greenery shall be taken as dead loads.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","tf","基礎"]},{"id":"DIL-007","t":"num","d":2,"tp":"恆載 Dead loads","c":"2.2.5.1","p":7,"q":"骨灰龕場的重型龕位（如混凝土龕位），重量不應少於每米高每米長多少 kN/m？","a":4.5,"tol":0,"u":"kN/m per m height","e":"2.2.5.1：輕型龕位（木或輕金屬）≥2.0 kN/m 每米高，重型（混凝土）≥4.5 kN/m 每米高，另加骨灰甕重量。Columbaria 樓面走道（非龕位範圍）按 Table 3.2 取 4.0 kPa。","x":"For heavy weight niches, such as niches made of concrete, the weight shall be not less than 4.5 kN/m length for each metre height.","doc":"dead-imposed-loads-2011-2021ed","pp":"3","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","num","中級"]},{"id":"DIL-008","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"3.1.4","p":8,"q":"Table 3.2 中的 qk 與 Qk 應如何施加？","o":["兩者同時疊加施加","分開考慮（considered separately），取最不利者","只需考慮 qk","只需考慮 Qk"],"a":1,"e":"3.1.3–3.1.4：qk 與 Qk 分開考慮，取較不利者。Qk 主要控制局部 punching / 薄板 / 短跨構件；常見錯誤是把 Qk 疊加在 qk 上，過度保守。","x":"The uniformly distributed load, qk, and the concentrated load or line load, Qk, shall be considered separately.","doc":"dead-imposed-loads-2011-2021ed","pp":"4","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","mcq","基礎"]},{"id":"DIL-009","t":"num","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：一般用途寫字樓（Offices for general use）的 qk 是多少 kPa？","a":3.0,"tol":0,"u":"kPa","e":"Offices for general use：qk = 3.0 kPa，Qk = 4.5 kN。注意 office 內 storage/filing 用途要升至 5.0 kPa（Class 5），而且不可按 3.7 折減；另如間隔牆位置未定，須再加 ≥1 kPa。","x":"Offices for general
