foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-055","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.8(1)","p":78,"q":"Mini-pile 的定義要求（毋須個別考慮）？","o":["≤5 支 ≤50 mm 鋼筋、套管外徑 ≤450 mm、工作荷載（無風）≤2350 kN","≤4 支 ≤40 mm 鋼筋、套管 ≤300 mm、≤1500 kN","≤6 支鋼筋、套管 ≤600 mm、≤3000 kN","無特別限制"],"a":0,"e":"超出任一條件要個別考慮，可能需要試樁。","x":"(c) pile capacity under working loads without wind not exceeding","q_en":"What are the defining requirements of a mini-pile (not requiring individual consideration)?","o_en":["≤5 bars of ≤50 mm, casing outside diameter ≤450 mm, working load (without wind) ≤2350 kN","≤4 bars of ≤40 mm, casing ≤300 mm, ≤1500 kN","≤6 bars, casing ≤600 mm, ≤3000 kN","No particular limits"],"e_en":"Exceeding any condition requires individual consideration, possibly including pile tests.","doc":"foundations-2017-2024ed","pp":"70","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-056","t":"num","d":2,"tp":"樁基 Piles","c":"5.4.8(2)","p":79,"q":"Mini-pile 鋼筋的容許應力可取屈服強度的百分之幾？","a":47.5,"tol":0,"u":"%","e":"結構承載力只計鋼筋，忽略灌漿和套管（應變不相容）。鋼筋與灌漿容許黏結 0.8 MPa。","x":"47.5% of the yield strength of the steel bars;","q_en":"The allowable stress in mini-pile reinforcement may be taken as what percentage of the yield strength?","e_en":"Structural capacity counts only the reinforcement, ignoring grout and casing (strain incompatibility). Allowable bond between bar and grout 0.8 MPa.","doc":"foundations-2017-2024ed","pp":"71","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-057","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.10","p":81,"q":"Hand-dug caisson 在哪種情況下仍可獲批？","o":["深度 ≤3 m 且內切圓直徑 ≥1.5 m","深度 ≤10 m","任何岩石地層","工期緊迫"],"a":0,"e":"因安全及健康理由已被禁止作一般用途；除 ≤3 m 淺井外，只有在唯一可行或無其他安全方案時才可。","x":"(a) the depth of the hand-dug caissons does not exceed 3 m and the diameter of the","q_en":"Under what circumstances may a hand-dug caisson still be approved?","o_en":["Depth ≤3 m and inscribed circle diameter ≥1.5 m","Depth ≤10 m","Any rock stratum","Tight programme"],"e_en":"Banned for general use on safety and health grounds; except shallow shafts ≤3 m, only where it is the only feasible option or there is no other safe alternative.","doc":"foundations-2017-2024ed","pp":"73","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-058","t":"num","d":3,"tp":"樁基 Piles","c":"5.4.11(1)","p":81,"q":"「Steel H-piles driven to bedrock」條文適用於坡度不陡於多少度（由水平量）的基岩？","a":25,"tol":0,"u":"°","e":"更陡的基岩要個別考慮並有更嚴格要求。基岩坡度 >15° 或樁長 <10 m 須至少兩支試樁。","x":"steeper than 25 degree from the horizontal. For steeper bedrock, the case","q_en":"The \"Steel H-piles driven to bedrock\" provisions apply to bedrock with a slope not steeper than how many degrees (from horizontal)?","e_en":"Steeper bedrock requires individual consideration and more stringent requirements. With bedrock slope >15° or pile length <10 m, at least two test piles are required.","doc":"foundations-2017-2024ed","pp":"73","tags":["foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-059","t":"num","d":3,"tp":"樁基 Piles","c":"5.4.11(5)","p":83,"q":"打至基岩的 H-pile：動力載荷試驗須在至少百分之幾的工作樁上進行（容量驗證）？","a":10,"tol":0,"u":"%","e":"其中一半選自較深的樁，終錘峰值應力不少於 75% fy；另需 20% 工作樁作完整性 DLT。","x":"(c) Dynamic load tests should be carried out on at least 10% of the","q_en":"H-piles driven to bedrock: dynamic load tests must be carried out on at least what percentage of working piles (for capacity verification)?","e_en":"Half of them selected from the deeper piles, with peak stress at final set not less than 75% fy; another 20% of working piles need integrity DLT.","doc":"foundations-2017-2024ed","pp":"75","tags":["foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-060","t":"mcq","d":2,"tp":"監測 Monitoring","c":"Table 7.2","p":93,"q":"Table 7.2：不敏感建築的地面沉降 Alert / Alarm / Action 典型值？","o":["12 / 18 / 25 mm","10 / 15 / 20 mm","15 / 20 / 30 mm","6 / 12 / 18 mm"],"a":0,"e":"建築傾斜 1:1000 / 1:750 / 1:500。AAA 值要在監測計劃列明，到 Action level 須停工檢討。","x":"Ground settlement 12 mm 18 mm 25 mm","q_en":"Table 7.2: typical Alert / Alarm / Action values for ground settlement for buildings that are not sensitive?","e_en":"Building tilt 1:1000 / 1:750 / 1:500. AAA values must be stated in the monitoring plan; reaching the Action level requires works to stop for review.","doc":"foundations-2017-2024ed","pp":"85","tags":["foundations-2017-2024ed","監測 Monitoring","mcq","中級"]},{"id":"FDN-061","t":"num","d":2,"tp":"振動 Vibration","c":"Table 7.3","p":94,"q":"Table 7.3：一般穩固建築受 transient/intermittent 振動的 ppv 限值（mm/s）？","a":15,"tol":0,"u":"mm/s","e":"穩固建築：短暫 15、連續 7.5；敏感或殘舊建築：7.5 / 3 mm/s。鐵路保護另按 PNAP。","x":"Robust and stable 15 7.5","q_en":"Table 7.3: ppv limit (mm/s) for transient/intermittent vibration on ordinary robust buildings?","e_en":"Robust buildings: transient 15, continuous 7.5; sensitive or dilapidated buildings: 7.5 / 3 mm/s. Railway protection is covered separately by the PNAP.","doc":"foundations-2017-2024ed","pp":"86","tags":["foundations-2017-2024ed","振動 Vibration","num","中級"]},{"id":"FDN-062","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 7.4","p":99,"q":"Table 7.4：一般樁（非 mini-pile、非海事）的平面位置及垂直度容許偏差？","o":["±75 mm；1 in 75","±15 mm；1 in 100","±150 mm；1 in 25","±50 mm；1 in 100"],"a":0,"e":"Mini-pile ±15 mm / 1:100（有理據可增至 ±75 mm）；海事樁 ±150 mm / 1:25；樁帽等 ±50 mm。偏差超標要重新核算樁帽。","x":"3. Piles other than items 1and 2 ± 75 mm 1 in 75 ± 3%","q_en":"Table 7.4: tolerances on plan position and verticality for ordinary piles (not mini-piles, not marine)?","o_en":["±75 mm; 1 in 75","±15 mm; 1 in 100","±150 mm; 1 in 25","±50 mm; 1 in 100"],"e_en":"Mini-piles ±15 mm / 1:100 (may be increased to ±75 mm with justification); marine piles ±150 mm / 1:25; pile caps etc. ±50 mm. If tolerances are exceeded, recheck the pile cap.","doc":"foundations-2017-2024ed","pp":"91","tags":["foundations-2017-2024ed","施工 Construction","mcq","中級"]},{"id":"FDN-063","t":"scenario","d":3,"tp":"樁基測試 Pile testing","c":"8.4","p":104,"q":"一支 ≤750 mm 的樁進行壓力載荷試驗，說明加載程序及兩項不合格準則。","m":"分兩等份加至設計工作荷載，卸載後再分四等份加至兩倍工作荷載，維持至少 72 小時。每級維持 ≥10 分鐘直至沉降率 <0.05 mm/10 min。不合格：(i) 最大樁頂沉降 > 2WL/AE + D/120 + 4 mm；(ii) 卸載後殘餘沉降 > max(D/120 + 4 mm, 25% 最大沉降)。","k":["2 increments to W, then 4 increments to 2W","hold ≥72 h","0.05 mm in 10 min","2WL/AE + D/120 + 4 mm","residual > D/120+4 mm and 25%"],"e":"L 在嵌岩樁量至 socket 中心。大直徑鑽孔樁、barrette 可用其他有理據的準則（通常以 core drilling 驗證）。","x":"increments up to twice the design pile capacity under working load and","q_en":"A pile ≤750 mm is subjected to a compression load test. Describe the loading procedure and the two failure criteria.","m_en":"Load in two equal increments to the design working load, unload, then load in four equal increments to twice the working load, held for at least 72 hours. Each increment is held ≥10 minutes until the settlement rate is <0.05 mm/10 min. Failure: (i) maximum pile head settlement > 2WL/AE + D/120 + 4 mm; (ii) residual settlement after unloading > max(D/120 + 4 mm, 25% of maximum settlement).","e_en":"For rock-socketed piles, L is measured to the centre of the socket. Large-diameter bored piles and barrettes may use other justified criteria (usually verified by core drilling).","doc":"foundations-2017-2024ed","pp":"96","tags":["foundations-2017-2024ed","樁基測試 Pile testing","scenario","進階"]},{"id":"FDN-064","t":"num","d":2,"tp":"樁基測試 Pile testing","c":"8.4(b)","p":104,"q":"壓力載荷試驗中，兩倍工作荷載須維持至少多少小時？","a":72,"tol":0,"u":"小時","e":"72 小時的持荷期，試樁時間表要預留。","x":"maintained for at least 72 hours before removal;","q_en":"In a compression load test, twice the working load must be held for at least how many hours?","e_en":"A 72-hour holding period; allow for it in the test pile programme.","u_en":"hours","doc":"foundations-2017-2024ed","pp":"96","tags":["foundations-2017-2024ed","樁基測試 Pile testing","num","中級"]},{"id":"FDN-065","t":"mcq","d":2,"tp":"樁基測試 Pile testing","c":"8.5","p":105,"q":"Proof core-drilling 須鑽入樁底以下多深？","o":["樁底直徑一半或 600 mm，取較大","1 m","樁底直徑或 1.5 m","5 m"],"a":0,"e":"用於大直徑鑽孔樁及 barrette，檢查樁身混凝土、岩石及接觸面。土層承托的樁要做 SPT 每 1.5 m 至 3 倍樁底直徑或 5 m。","x":"down to a distance of at least half a diameter of the pile base, or 600 mm,","q_en":"How far below the pile toe must proof core-drilling extend?","o_en":["Half the pile toe diameter or 600 mm, whichever is greater","1 m","The pile toe diameter or 1.5 m","5 m"],"e_en":"Used for large-diameter bored piles and barrettes to check the shaft concrete, rock and interface. Piles founded in soil require SPT every 1.5 m down to 3 times the toe diameter or 5 m.","doc":"foundations-2017-2024ed","pp":"97","tags":["foundations-2017-2024ed","樁基測試 Pile testing","mcq","中級"]},{"id":"FDN-066","t":"num","d":2,"tp":"樁基測試 Pile testing","c":"8.7","p":106,"q":"Sonic echo test 的樁長/直徑比不應超過多少以確保量度準確？","a":30,"tol":0,"u":"","e":"另須在混凝土澆注至少 7 天後進行，不適用於有接駁的樁。","x":"(c) the length to diameter ratio of the pile should not exceed 30 for accurate","q_en":"The pile length/diameter ratio for a sonic echo test should not exceed what, to ensure accurate measurement?","e_en":"It must also be carried out at least 7 days after concreting, and is not applicable to piles with splices.","doc":"foundations-2017-2024ed","pp":"98","tags":["foundations-2017-2024ed","樁基測試 Pile testing","num","中級"]},{"id":"FDN-067","t":"tf","d":2,"tp":"樁基測試 Pile testing","c":"8.9","p":107,"q":"在香港，dynamic load test 一般被接受為基礎的 proof test。","a":false,"e":"因香港動靜載對比研究有限，DLT 一般不接受為 proof test，但可用於找缺陷、篩選較弱樁、監察打樁應力及錘效率。","x":"as proof test for foundations under normal circumstances. It may however be used for","q_en":"In Hong Kong, the dynamic load test is generally accepted as a proof test for foundations.","e_en":"False. Because Hong Kong correlation studies between dynamic and static tests are limited, DLT is generally not accepted as a proof test, but it can be used to locate defects, screen weaker piles and monitor driving stresses and hammer efficiency.","doc":"foundations-2017-2024ed","pp":"99","tags":["foundations-2017-2024ed","樁基測試 Pile testing","tf","中級"]},{"id":"GG1-001","t":"mcq","d":2,"tp":"安全系數 Partial factors","c":"Table 6","p":139,"q":"Geoguide 1 Table 6：ULS 設計中 surcharge 的最小 partial load factor γf？","o":["1.5","1.0","1.2","1.6"],"a":0,"e":"擋土牆自重、泥土/岩石/水重、地震及水壓都是 1.0，只有 surcharge 1.5。若 surcharge 有利（例如 L 形牆踵上方），γf 取 0。","x":"Surcharge 1.5(1)","q_en":"Geoguide 1 Table 6: minimum partial load factor γf for surcharge in ULS design?","e_en":"Self-weight of the wall, weight of soil/rock/water, seismic load and water pressure are all 1.0; only surcharge is 1.5. Where surcharge is favourable (e.g. above the heel of an L-shaped wall), γf is taken as 0.","doc":"geoguide1-retaining-walls","pp":"138","tags":["geoguide1-retaining-walls","安全系數 Partial factors","mcq","中級"]},{"id":"GG1-002","t":"num","d":2,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：土的 drained shear strength（c' 及 tan φ'）的 partial material factor γm？","a":1.2,"tol":0,"u":"","e":"γm 1.2 同時作用於 c' 和 tan φ'（不是 φ'）。Base friction tan δb 亦 1.2；undrained su 2.0。","x":"drained shear strength 1.2(2)","q_en":"Table 7: partial material factor γm for the drained shear strength of soil (c' and tan φ')?","e_en":"γm 1.2 applies to both c' and tan φ' (not φ'). Base friction tan δb is also 1.2; undrained su 2.0.","doc":"geoguide1-retaining-walls","pp":"138","tags":["geoguide1-retaining-walls","安全系數 Partial factors","num","中級"]},{"id":"GG1-003","t":"num","d":2,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：土的 undrained shear strength su 的 γm？","a":2.0,"tol":0,"u":"","e":"不排水強度不確定性大，所以 γm 2.0；岩石抗壓強度亦 2.0。","x":"undrained shear strength su 2.0","q_en":"Table 7: γm for the undrained shear strength su of soil?","e_en":"Undrained strength is highly uncertain, hence γm 2.0; the compressive strength of rock is also 2.0.","doc":"geoguide1-retaining-walls","pp":"138","tags":["geoguide1-retaining-walls","安全系數 Partial factors","num","中級"]},{"id":"GG1-004","t":"num","d":3,"tp":"安全系數 Partial factors","c":"Table 7","p":139,"q":"Table 7：Granular filter and drainage materials 的 permeability γm？","a":10.0,"tol":0,"u":"","e":"濾層透水性要打 10 倍折減，反映堵塞及施工變異的風險，設計排水層時要以折減後透水性核算。","x":"Granular filter and drainage materials : permeability k 10.0","q_en":"Table 7: γm for the permeability of granular filter and drainage materials?","e_en":"Filter permeability is reduced by a factor of 10, reflecting the risk of clogging and construction variability; drainage layers must be checked with the reduced permeability.","doc":"geoguide1-retaining-walls","pp":"138","tags":["geoguide1-retaining-walls","安全系數 Partial factors","num","進階"]},{"id":"GG1-005","t":"tf","d":2,"tp":"安全系數 Partial factors","c":"4.3.4(2)","p":32,"q":"Geoguide 1 的 partial material factor γm 應作用在 φ' 本身，即 φf' = φ'/γm。","a":false,"e":"應作用在 tan φ'：tan φf' = tan φ'/γm。直接除 φ' 會得出錯誤（偏不保守或不一致）的結果，是常見錯誤。","x":"tan ϕf' = tan ϕ' / γm","q_en":"The Geoguide 1 partial material factor γm should be applied to φ' itself, i.e. φf' = φ'/γm.","e_en":"False. It applies to tan φ': tan φf' = tan φ'/γm. Dividing φ' directly gives wrong (unconservative or inconsistent) results — a common error.","doc":"geoguide1-retaining-walls","pp":"31","tags":["geoguide1-retaining-walls","安全系數 Partial factors","tf","中級"]},{"id":"GG1-006","t":"short","d":3,"tp":"安全系數 Partial factors","c":"4.3.4 / 4.3.5","p":33,"q":"說明 Geoguide 1 對 SLS 檢查及結構設計時所用參數的處理方法。","m":"SLS：所有 γf 及 γm 設為 1，但產生有利效果的 surcharge（例如 L 形牆牆身與 virtual back 之間）γf 設為 0。結構設計：土壓力及水壓一般用未乘系數參數計算，再按結構規範（如 Concrete Code）乘 partial load factors。","k":["SLS: γf = γm = 1","favourable surcharge γf = 0","structural design: unfactored geotechnical parameters","then structural code load factors"],"e":"常見錯誤：用 factored φ' 計出的 ULS 土壓力再乘 1.4 做 RC 設計，造成雙重系數。要跟 Geoguide 1 4.3.5 及所用結構規範一致。","x":"Generally, unfactored parameters should be used in the","q_en":"Explain how Geoguide 1 treats parameters for SLS checks and for structural design.","m_en":"SLS: all γf and γm are set to 1, but surcharge producing a favourable effect (e.g. between the stem of an L-shaped wall and the virtual back) has γf set to 0. Structural design: earth and water pressures are generally calculated with unfactored parameters, then multiplied by the partial load factors of the structural code (e.g. the Concrete Code).","e_en":"Common error: taking ULS earth pressure calculated with factored φ' and multiplying again by 1.4 for RC design, giving double factoring. Be consistent with Geoguide 1 4.3.5 and the structural code used.","doc":"geoguide1-retaining-walls","pp":"32","tags":["geoguide1-retaining-walls","安全系數 Partial factors","short","進階"]},{"id":"GG1-007","t":"mcq","d":2,"tp":"土壓力 Earth pressure","c":"6.4","p":60,"q":"正常固結土、水平地面的靜止土壓力係數 Ko（Jaky）？","o":["1 − sin φ'","tan²(45° − φ'/2)","1 + sin φ'","0.5"],"a":0,"e":"Ko = 1 − sin φ'，亦可保守地用於香港殘積土。地庫外牆、有支撐不能移動的牆應用 at-rest 壓力。回填壓實會令頂部壓力更高（6.8）。","x":"Ko = 1 - sin ϕ'","q_en":"Earth pressure coefficient at rest Ko (Jaky) for normally consolidated soil with horizontal ground?","e_en":"Ko = 1 − sin φ', which may also be used conservatively for Hong Kong saprolites. Basement walls and propped walls that cannot move should be designed for at-rest pressure. Compaction of backfill increases the pressure near the top (6.8).","doc":"geoguide1-retaining-walls","pp":"59","tags":["geoguide1-retaining-walls","土壓力 Earth pressure","mcq","中級"]},{"id":"GG1-008","t":"mcq","d":3,"tp":"土壓力 Earth pressure","c":"6.4","p":60,"q":"豎直牆擋上斜地面（坡角 β）時的靜止土壓力係數 Koβ？","o":["(1 − sin φ')(1 + sin β)","(1 − sin φ')/cos β","1 − sin(φ' − β)","(1 − sin φ')(1 − sin β)"],"a":0,"e":"向下斜的回填則 β 取 0。壓力方向平行於地面。","x":"Koβ = (1 - sin ϕ') (1 + sin β)","q_en":"Earth pressure coefficient at rest Koβ for a vertical wall retaining sloping ground (slope angle β)?","e_en":"For backfill sloping downwards, β is taken as 0. The pressure acts parallel to the ground surface.","doc":"geoguide1-retaining-walls","pp":"59","tags":["geoguide1-retaining-walls","土壓力 Earth pressure","mcq","進階"]},{"id":"GG1-009","t":"num","d":1,"tp":"附加荷載 Surcharge","c":"7.2.1","p":69,"q":"所有擋土牆周邊應考慮的最小 surcharge（kPa，配合適當荷載系數）？","a":10,"tol":0,"u":"kPa","e":"涵蓋施工機械、堆料及交通等偶然荷載。除非場地佈局明顯不需要，否則都要計。","x":"A minimum surcharge of 10 kPa with an appropriate","q_en":"Minimum surcharge (kPa, with appropriate load factors) to be considered around all retaining walls?","e_en":"Covers incidental loads from construction plant, stockpiles, traffic, etc. It should always be included unless the site layout clearly makes it unnecessary.","doc":"geoguide1-retaining-walls","pp":"68","tags":["geoguide1-retaining-walls","附加荷載 Surcharge","num","基礎"]},{"id":"GG1-010","t":"mcq","d":2,"tp":"附加荷載 Surcharge","c":"Table 16","p":146,"q":"Table 16：淺基礎建築物的 nominal surcharge？","o":["每層 10 kPa","每層 5 kPa","每層 15 kPa","固定 20 kPa"],"a":0,"e":"存放重貨或機器的建築 10 kPa/層可能不足，要詳細評估。與行人路、單車徑的 5 kPa 不同。","x":"Buildings with shallow foundations(1) 10 kPa per storey(2)","q_en":"Table 16: nominal surcharge for buildings on shallow foundations?","o_en":["10 kPa per storey","5 kPa per storey","15 kPa per storey","A fixed 20 kPa"],"e_en":"10 kPa/storey may be inadequate for buildings storing heavy goods or machinery, which need detailed assessment. Different from the 5 kPa for footpaths and cycle tracks.","doc":"geoguide1-retaining-walls","pp":"145","tags":["geoguide1-retaining-walls","附加荷載 Surcharge","mcq","中級"]},{"id":"GG1-011","t":"num","d":2,"tp":"附加荷載 Surcharge","c":"Table 16","p":146,"q":"Table 16：與道路隔離的行人路、單車徑及遊樂場的 nominal surcharge（kPa）？","a":5,"tol":0,"u":"kPa","e":"如行人路未與道路隔離而可能有車停泊，須用公路荷載。","x":"Footpaths isolated from roads, cycle tracks 5 kPa","q_en":"Table 16: nominal surcharge (kPa) for footpaths, cycle tracks and playgrounds isolated from roads?","e_en":"If a footpath is not isolated from a road and vehicles may park on it, highway loading must be used.","doc":"geoguide1-retaining-walls","pp":"145","tags":["geoguide1-retaining-walls","附加荷載 Surcharge","num","中級"]},{"id":"GG1-012","t":"scenario","d":3,"tp":"附加荷載 Surcharge","c":"7.2.1 / Figure 28","p":70,"q":"設計一幅 RC L 形懸臂擋土牆，牆後有均佈 surcharge。說明應考慮哪兩個基本荷載工況及其原因。","m":"按 Geoguide 1 7.2.1 及 Figure 28：須考慮兩個 surcharge 工況——(1) surcharge 作用於整個回填面（包括牆踵上方），產生最大土壓力及地基壓力；(2) surcharge 只作用於 virtual back 以外（牆踵上方無 surcharge），此時 surcharge 對穩定有利的部分被移除，對滑移/傾覆最不利。有利 surcharge 的 γf 取 0。","k":["two load cases","surcharge over heel (max bearing / structural)","surcharge beyond heel only (min stabilising)","favourable surcharge γf = 0"],"e":"只計一個工況是常見錯誤；兩個工況分別控制地基承載和抗滑/抗傾覆。與 Dead and Imposed Loads Code 的 surcharge 配合時要注意荷載系數分別屬岩土與結構體系。","x":"in the case of an L-shaped cantilever retaining wall, two basic load cases for a","q_en":"Design of an RC L-shaped cantilever retaining wall with a uniform surcharge behind it. State the two basic load cases to be considered and why.","m_en":"Per Geoguide 1 7.2.1 and Figure 28, two surcharge cases are required — (1) surcharge over the whole backfill surface (including above the heel), giving the maximum earth pressure and bearing pressure; (2) surcharge only beyond the virtual back (none above the heel), removing the part of the surcharge that is favourable to stability — most critical for sliding/overturning. γf for favourable surcharge is 0.","e_en":"Considering only one case is a common error; the two cases govern bearing and sliding/overturning respectively. When combining with surcharges from the Dead and Imposed Loads Code, note that the load factors belong to the geotechnical and structural systems respectively.","doc":"geoguide1-retaining-walls","pp":"69","tags":["geoguide1-retaining-walls","附加荷載 Surcharge","scenario","進階"]},{"id":"GG1-013","t":"tf","d":2,"tp":"水壓 Water pressure","c":"8.1","p":74,"q":"排水設施足夠的常規重力式及 RC 擋土牆，設計上可假設零水壓。","a":true,"e":"但非常規設計（例如擋大量泥土）及懸臂式牆（cantilevered retaining walls）須詳細評估水壓。大量擋土牆失效與水有關，排水設計至關重要。","x":"for conventional gravity and reinforced concrete retaining walls with","q_en":"For conventional gravity and RC retaining walls with adequate drainage, zero water pressure may be assumed in design.","e_en":"True. But non-conventional designs (e.g. retaining large amounts of soil) and cantilevered retaining walls require detailed assessment of water pressure. Many retaining wall failures are water-related, so drainage design is crucial.","doc":"geoguide1-retaining-walls","pp":"73","tags":["geoguide1-retaining-walls","水壓 Water pressure","tf","中級"]},{"id":"GG1-014","t":"num","d":3,"tp":"水壓 Water pressure","c":"8.2.1","p":74,"q":"有暴雨反應的地下水位，設計水位應以典型水位加上多少年回歸期暴雨的水位上升？","a":1000,"tol":0,"u":"年","e":"1 000 年只是表示低超越機率的指標，並非要精確預測；1 000 年雨量在 120 年內約有 11% 超越機率。","x":"water level should be based on a storm rise corresponding to a 1 000-year return period","q_en":"For a groundwater level that responds to rainstorms, the design water level should be the typical level plus the rise due to a rainstorm of what return period (years)?","e_en":"The 1 000 years is only an indicator of low exceedance probability, not a precise prediction; a 1 000-year rainfall has about an 11% probability of exceedance in 120 years.","u_en":"years","doc":"geoguide1-retaining-walls","pp":"73","tags":["geoguide1-retaining-walls","水壓 Water pressure","num","進階"]},{"id":"GG1-015","t":"tf","d":2,"tp":"水壓 Water pressure","c":"8.2.1","p":74,"q":"Geoguide 1 要求 worst credible water level 一律取至擋土牆頂。","a":false,"e":"Worst credible 應按集水區、補給及排水評估，不應脫離實際地取最壞可能水位（例如到牆頂）。但低窪填海區要考慮水管爆裂令水位升至地面。","x":"context, e.g. groundwater level up to the top of the retaining wall. Some guidance on the","q_en":"Geoguide 1 requires the worst credible water level always to be taken at the top of the retaining wall.","e_en":"False. The worst credible level should be assessed from the catchment, recharge and drainage, not by unrealistically taking the worst possible level (e.g. at the top of the wall). But in low-lying reclamation, consider burst water mains raising the level to ground surface.","doc":"geoguide1-retaining-walls","pp":"73","tags":["geoguide1-retaining-walls","水壓 Water pressure","tf","中級"]},{"id":"GG1-016","t":"mcq","d":2,"tp":"水壓 Water pressure","c":"8.2.1","p":75,"q":"Geoguide 1 對擋土牆後的輸水管道（食水、污水、雨水渠）的最低預防措施？","o":["盡可能不要放在牆後 active zone 內","只需加厚管壁","可放於任何位置","只需每年檢查"],"a":0,"e":"無法改線時要用密封渠槽或套管引至排放點並監測滲漏。","x":"placed within the 'active' zone behind a retaining wall. In some cases, more remote services","q_en":"What is Geoguide 1's minimum precaution for water-carrying services (fresh water, sewers, stormwater drains) behind retaining walls?","o_en":["As far as possible, do not place them within the active zone behind the wall","Only thicken the pipe walls","They may be placed anywhere","Only inspect annually"],"e_en":"Where they cannot be diverted, use sealed troughs or ducts leading to discharge points and monitor for leakage.","doc":"geoguide1-retaining-walls","pp":"74","tags":["geoguide1-retaining-walls","水壓 Water pressure","mcq","中級"]},{"id":"GG1-017","t":"mcq","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.2.4","p":87,"q":"建於土上的重力式擋土牆，為限制傾側，合力應落在牆底的？","o":["中間三分之一","中間一半","中間四分之一","任何位置只要不傾覆"],"a":0,"e":"Middle-third rule（以未乘系數荷載計）；若改做變形計算，良好做法仍限於 middle half。符合時毋須再檢查傾覆。","x":"wall base under the worst loading combination. As an alternative to the middle-third rule,","q_en":"For a gravity retaining wall founded on soil, to limit tilting, the resultant force should fall within which part of the base?","o_en":["The middle third","The middle half","The middle quarter","Anywhere, as long as it does not overturn"],"e_en":"The middle-third rule (with unfactored loads); if deformation calculations are done instead, good practice still limits it to the middle half. If satisfied, overturning need not be checked separately.","doc":"geoguide1-retaining-walls","pp":"86","tags":["geoguide1-retaining-walls","重力式擋土牆 Gravity walls","mcq","中級"]},{"id":"GG1-018","t":"num","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.3.1","p":87,"q":"Mass concrete 擋土牆特別適用於擋土高度少於多少 m？","a":3,"tol":0,"u":"m","e":"更高時其他牆型通常更經濟。","x":"particularly suitable for retained heights of less than 3 m. While they can be designed for","q_en":"Mass concrete retaining walls are particularly suitable for retained heights of less than how many m?","e_en":"For greater heights, other wall types are usually more economical.","doc":"geoguide1-retaining-walls","pp":"86","tags":["geoguide1-retaining-walls","重力式擋土牆 Gravity walls","num","中級"]},{"id":"GG1-019","t":"mcq","d":1,"tp":"重力式擋土牆 Gravity walls","c":"9.3.1","p":88,"q":"牆面名義上豎直時，建議的背傾（back batter）？","o":["約 1 in 50","約 1 in 10","約 1 in 100","不需要"],"a":0,"e":"避免牆看起來向前傾的視覺錯覺；地基可壓縮時可加大。","x":"For walls with a nominally vertical front face, a back batter of approximately 1 in 50","q_en":"Recommended back batter when the wall face is nominally vertical?","o_en":["About 1 in 50","About 1 in 10","About 1 in 100","Not needed"],"e_en":"Avoids the optical illusion of the wall leaning forward; may be increased where the foundation is compressible.","doc":"geoguide1-retaining-walls","pp":"87","tags":["geoguide1-retaining-walls","重力式擋土牆 Gravity walls","mcq","基礎"]},{"id":"GG1-020","t":"mcq","d":2,"tp":"重力式擋土牆 Gravity walls","c":"9.3.4","p":89,"q":"Mass concrete 擋土牆的伸縮縫（expansion）及收縮縫（contraction）間距上限？","o":["22.5 m 及 7.5 m","30 m 及 10 m","15 m 及 5 m","20 m 及 7.5 m"],"a":0,"e":"豎向施工縫約 7.5 m 並與收縮/伸縮縫重合；地基性質改變處（如填土轉原土）亦要設縫。","x":"As a guide, expansion and contraction joints should be spaced not more than 22.5 m and 7.5 m","q_en":"Maximum spacing of expansion and contraction joints in mass concrete retaining walls?","o_en":["22.5 m and 7.5 m","30 m and 10 m","15 m and 5 m","20 m and 7.5 m"],"e_en":"Vertical construction joints at about 7.5 m, coinciding with contraction/expansion joints; joints are also needed where foundation conditions change (e.g. fill to in-situ ground).","doc":"geoguide1-retaining-walls","pp":"88","tags":["geoguide1-retaining-walls","重力式擋土牆 Gravity walls","mcq","中級"]},{"id":"GG1-021","t":"mcq","d":3,"tp":"牆面摩擦 Wall friction","c":"Table 14","p":144,"q":"Table 14：RC L 形懸臂牆 virtual back 計算 active 土壓力時，δmax 取？","o":["φ'/2 或回填坡角，取較小","2φ'/3","φ'","0"],"a":0,"e":"Mass concrete 牆背與土接觸面可用 2φ'/3。牆可能沉降或建於可壓縮地基時，δ 取 0。","x":"At the 'virtual back' of R.C. L- or inverted T- +ϕ'/2 or","q_en":"Table 14: δmax for active earth pressure on the virtual back of an RC L-shaped cantilever wall?","o_en":["φ'/2 or the backfill slope angle, whichever is less","2φ'/3","φ'","0"],"e_en":"2φ'/3 may be used at the soil contact on the back of mass concrete walls. Where the wall may settle or is on a compressible foundation, take δ as 0.","doc":"geoguide1-retaining-walls","pp":"143","tags":["geoguide1-retaining-walls","牆面摩擦 Wall friction","mcq","進階"]},{"id":"GG1-022","t":"tf","d":2,"tp":"牆面摩擦 Wall friction","c":"5.11.1","p":54,"q":"擋軟黏土或受顯著振動的粒狀土（如鐵路旁）時，δ 應假設為零。","a":true,"e":"振動會令牆面摩擦無法可靠發揮。牆背黏著力一般亦忽略。","x":"For walls retaining soft cohesive soils or granular soils which will be subjected to","q_en":"When retaining soft clay or granular soil subject to significant vibration (e.g. next to a railway), δ should be assumed to be zero.","e_en":"True. Vibration prevents wall friction from being reliably mobilised. Wall adhesion is also generally ignored.","doc":"geoguide1-retaining-walls","pp":"53","tags":["geoguide1-retaining-walls","牆面摩擦 Wall friction","tf","中級"]},{"id":"GG1-023","t":"short","d":3,"tp":"抗滑 Sliding","c":"5.12","p":55,"q":"無 shear key 的 RC 擋土牆，計算抗滑時 base shearing resistance δb 應如何選取？何時可用較高值？","m":"δb 可取地基土的 φ'，但應用 critical state 的 φcv'（保守，對應鬆散重塑狀態）。若可證明地基不會軟化——例如指定在旱季開挖、驗收後立即鋪 blinding——可用較高值，但仍不得超過未擾動地基土的 φ'（c'=0 模型）。有 shear key 時可按未擾動土參數。","k":["δb = φcv' (conservative)","higher if weakening unlikely","dry season + blinding immediately","not greater than undisturbed φ'","shear key: undisturbed parameters"],"e":"地基暴露浸水後強度下降是擋土牆滑移常見原因。施工規格要寫明開挖後的保護措施才可採用較高 δb。","x":"angle of shearing resistance. The use of ϕcv' gives a conservative estimate of δb as ϕcv'","q_en":"For an RC retaining wall without a shear key, how should the base shearing resistance δb be chosen when calculating sliding resistance? When may a higher value be used?","m_en":"δb may be taken as φ' of the foundation soil, but the critical state φcv' should be used (conservative, corresponding to a loose remoulded state). If it can be shown that the foundation will not soften — e.g. by specifying excavation in the dry season and placing blinding immediately after inspection — a higher value may be used, but not exceeding φ' of the undisturbed foundation soil (c'=0 model). With a shear key, undisturbed soil parameters may be used.","e_en":"Loss of strength when the formation is exposed and soaked is a common cause of retaining wall sliding. The specification must state protection measures after excavation before a higher δb can be adopted.","doc":"geoguide1-retaining-walls","pp":"54","tags":["geoguide1-retaining-walls","抗滑 Sliding","short","進階"]},{"id":"GG1-024","t":"mcq","d":2,"tp":"岩土參數 Geotechnical parameters","c":"Table 8","p":140,"q":"Table 8：壓實 CDG 回填的典型 φ' 範圍？","o":["38°–42°","35°–38°","26°–40°","45°–50°"],"a":0,"e":"壓實 CDV 35–38°；碎石填料 45°–>50°；崩積土 26–40°。表內數值只作一般參考，設計須以試驗為準。","x":"Completely decomposed 19 - 21 15 - 19 38° - 42° 0-5 10-6 - 10-7","q_en":"Table 8: typical φ' range of compacted CDG backfill?","e_en":"Compacted CDV 35–38°; rock fill 45°–>50°; colluvium 26–40°. Table values are for general guidance only; design must be based on tests.","doc":"geoguide1-retaining-walls","pp":"139","tags":["geoguide1-retaining-walls","岩土參數 Geotechnical parameters","mcq","中級"]},{"id":"GG1-025","t":"num","d":3,"tp":"岩土參數 Geotechnical parameters","c":"Table 8 Note (6)","p":140,"q":"原位 CDG 的 φcv' 下限約為多少度？","a":34,"tol":0,"u":"°","e":"CDV 約 30°。這是計算 δb 時常用的保守值。","x":"(6) The lower bound value of ϕcv' for insitu completely decomposed granites and","q_en":"What is the approximate lower bound of φcv' for insitu CDG, in degrees?","e_en":"About 30° for CDV. This is the conservative value commonly used for δb.","doc":"geoguide1-retaining-walls","pp":"139","tags":["geoguide1-retaining-walls","岩土參數 Geotechnical parameters","num","進階"]},{"id":"GG1-026","t":"mcq","d":2,"tp":"回填 Backfill","c":"3.2.2","p":21,"q":"Geoguide 1 對黏土回填的建議？","o":["不建議使用（膨脹、收縮及固結問題）","最佳回填材料","只可用於底層","需加石灰即可"],"a":0,"e":"均勻粉土亦不應使用（難以壓實）。理想回填是自由排水、耐久、高強度及高剛度的材料。","x":"The use of clay backfills is not recommended because of problems associated with","q_en":"What is Geoguide 1's recommendation on clay backfill?","o_en":["Not recommended (swelling, shrinkage and consolidation problems)","The best backfill material","Only for the bottom layer","Adding lime is enough"],"e_en":"Uniform silts should also not be used (difficult to compact). Ideal backfill is free-draining, durable, of high strength and high stiffness.","doc":"geoguide1-retaining-walls","pp":"20","tags":["geoguide1-retaining-walls","回填 Backfill","mcq","中級"]},{"id":"GG1-027","t":"mcq","d":2,"tp":"設計方法 Design approach","c":"4.3.1","p":29,"q":"Middle-third rule 屬於 Geoguide 1 的哪種設計方法？","o":["Indirect approach","Direct approach","Observational method","Prescriptive measure"],"a":0,"e":"Indirect approach 以限制偏心來間接滿足變形要求，適合常規設計。","x":"approach is the application of the middle-third rule in the design of gravity retaining walls","q_en":"The middle-third rule belongs to which Geoguide 1 design approach?","e_en":"The indirect approach satisfies deformation requirements indirectly by limiting eccentricity, and suits routine design.","doc":"geoguide1-retaining-walls","pp":"28","tags":["geoguide1-retaining-walls","設計方法 Design approach","mcq","中級"]},{"id":"GG3-001","t":"mcq","d":1,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Geoguide 3 Table 2：「Moderately strong」岩石材料的 UCS 範圍？","o":["12.5 – 50 MPa","5 – 12.5 MPa","50 – 100 MPa","100 – 200 MPa"],"a":0,"e":"Table 2 在 BS 分級基礎上向弱端延伸（extremely weak < 0.5 MPa、very weak 0.5–1.25 MPa），以涵蓋香港常見的風化岩。基礎設計時 rock socket / bearing 的 UCS 取值要與鑽孔記錄的描述一致。","x":"Moderately 12.5 - 50 0.5 - 2 Scratched by pocket knife","q_en":"Geoguide 3 Table 2: UCS range of \"moderately strong\" rock material?","e_en":"Table 2 extends the BS classification towards the weak end (extremely weak < 0.5 MPa, very weak 0.5–1.25 MPa) to cover the decomposed rocks common in Hong Kong. In foundation design, UCS values for rock sockets / bearing must be consistent with the descriptions in the borehole logs.","doc":"geoguide3-rock-soil-descriptions","pp":"","tags":["geoguide3-rock-soil-descriptions","岩石強度 Rock strength","mcq","基礎"]},{"id":"GG3-002","t":"num","d":2,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Table 2：「Extremely weak」岩石材料的 UCS 上限？","a":0.5,"tol":0,"u":"MPa","e":"< 0.5 MPa：用手易捏碎、拇指甲可深壓。Note：very weak 及 extremely weak 適用於原位風化形成的土（saprolite）。","x":"Extremely < 0.5 Easily crumbled by hand; indented deeply by thumbnail.","q_en":"Table 2: upper limit of UCS for \"extremely weak\" rock material?","e_en":"< 0.5 MPa: easily crumbled by hand, indented deeply by thumbnail. Note: very weak and extremely weak apply to soils formed by in-situ decomposition (saprolite).","doc":"geoguide3-rock-soil-descriptions","pp":"","tags":["geoguide3-rock-soil-descriptions","岩石強度 Rock strength","num","中級"]},{"id":"GG3-003","t":"num","d":2,"tp":"岩石強度 Rock strength","c":"2.3.1","p":13,"q":"Geoguide 3 以 UCS 推算花崗岩/火山岩 point load index 時用的 correlation factor？","a":24,"tol":0,"u":"","e":"Is(50) ≈ UCS/24；但在 PLS 弱端可靠性較低。foundation design 以 point load 推 UCS 時應說明此假設並配合 UCS 試驗校核。","x":"These values are derived by applying a correlation factor of 24 to UCS values.","q_en":"What correlation factor does Geoguide 3 use to derive the point load index of granite/volcanic rock from UCS?","e_en":"Is(50) ≈ UCS/24; but reliability is lower at the weak end of PLS. When deriving UCS from point load tests for foundation design, state this assumption and calibrate with UCS tests.","doc":"geoguide3-rock-soil-descriptions","pp":"12","tags":["geoguide3-rock-soil-descriptions","岩石強度 Rock strength","num","中級"]},{"id":"GG3-004","t":"mcq","d":2,"tp":"岩石強度 Rock strength","c":"Table 2","p":70,"q":"Table 2：Strong rock（花崗岩/火山岩）的近似 point load index Is(50)？","o":["2 – 4 MPa","0.5 – 2 MPa","4 – 8 MPa","> 8 MPa"],"a":0,"e":"Strong 50–100 MPa ↔ Is(50) 2–4 MPa（即 UCS/24 的近似）。","x":"Strong 50 - 100 2-4 Firm blows with point of geological pick cause only superficial","q_en":"Table 2: approximate point load index Is(50) for strong rock (granite/volcanic)?","e_en":"Strong 50–100 MPa ↔ Is(50) 2–4 MPa (i.e. approximately UCS/24).","doc":"geoguide3-rock-soil-descriptions","pp":"","tags":["geoguide3-rock-soil-descriptions","岩石強度 Rock strength","mcq","中級"]},{"id":"GG3-005","t":"mcq","d":1,"tp":"風化分級 Weathering grades","c":"Checklist (Table 4 summary)","p":173,"q":"「Original rock texture preserved；可用手指壓碎成顆粒；slakes in water」描述哪個 decomposition grade？","o":["Grade V completely decomposed","Grade IV highly decomposed","Grade VI residual soil","Grade III moderately decomposed"],"a":0,"e":"Grade V（CDG/CDV）保留原岩紋理但已可捏碎、會 slake；Grade IV 不會 slake、需用手掰成小塊。香港 foundation 及 slope 工程中 CDG 是最常見的地層，須清楚分辨 V 與 VI。","x":"Original rock texture preserved; can be crumbled by hand and","q_en":"\"Original rock texture preserved; can be crumbled by hand into constituent grains; slakes in water\" describes which decomposition grade?","e_en":"Grade V (CDG/CDV) retains the original rock texture but can be crumbled and slakes; Grade IV does not slake and can be broken by hand into smaller pieces. CDG is the most common stratum in Hong Kong foundation and slope works, so distinguish V from VI clearly.","doc":"geoguide3-rock-soil-descriptions","pp":"","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","基礎"]},{"id":"GG3-006","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":17,"q":"Geoguide 3 用 slake test 分辨 completely decomposed 與 highly decomposed rock。","a":true,"e":"正確。Slake test 需要水和小容器；飽和土樣（地下水位以下取樣）較難應用。","x":"which is used to distinguish between completely and highly decomposed rock","q_en":"Geoguide 3 uses the slake test to distinguish completely decomposed from highly decomposed rock.","e_en":"True. The slake test needs water and a small container; it is harder to apply to saturated samples (taken below the water table).","doc":"geoguide3-rock-soil-descriptions","pp":"16","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","tf","中級"]},{"id":"GG3-007","t":"mcq","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(2)","p":19,"q":"Grade V completely decomposed rock 應如何作完整描述？","o":["以岩石術語描述，需要時補充重塑狀態的土壤術語","只用土壤術語","只寫 grade 符號","以 residual soil 術語描述"],"a":0,"e":"Grade V 保留原岩紋理，故以 rock terms 描述，括號內補充重塑土名及密實度；Grade VI 已失去原岩紋理，只能用 soil terms。","x":"Since grade V materials retain the","q_en":"How should Grade V completely decomposed rock be fully described?","o_en":["In rock terms, supplemented where necessary by soil terms for the remoulded state","In soil terms only","Only the grade symbol","In residual soil terms"],"e_en":"Grade V retains the original rock texture, so it is described in rock terms, with the remoulded soil name and density added in brackets; Grade VI has lost the original rock texture and can only be described in soil terms.","doc":"geoguide3-rock-soil-descriptions","pp":"18","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","中級"]},{"id":"GG3-008","t":"short","d":2,"tp":"風化分級 Weathering grades","c":"2.3.4(1)","p":16,"q":"為何香港岩石的材料風化分級慣用「decomposed」而非「weathered」？","m":"因為香港岩石的風化以化學分解（chemical decomposition）為主，故材料風化等級傳統上用 'decomposed'；'weathered' 則用於岩體（rock mass）風化分區（Section 2.4.4）。","k":["decomposition dominant in HK","material grade → decomposed","rock mass zone → weathered (Table 10)"],"e":"寫鑽孔記錄或地質報告時混用兩者是常見錯誤；材料用 grade I–VI，岩體用 PW zones。","x":"Decomposition is the dominant aspect of weathering in","q_en":"Why is \"decomposed\" rather than \"weathered\" customarily used for the material weathering grades of Hong Kong rocks?","m_en":"Because weathering of Hong Kong rocks is dominated by chemical decomposition, the material weathering grades traditionally use 'decomposed'; 'weathered' is used for rock mass weathering zones (Section 2.4.4).","e_en":"Mixing the two when writing borehole logs or geological reports is a common error; materials use grades I–VI, rock masses use PW zones.","doc":"geoguide3-rock-soil-descriptions","pp":"15","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","short","中級"]},{"id":"GG3-009","t":"mcq","d":1,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":29,"q":"RQD 的定義是？","o":["每段長度 > 100 mm 的 solid core 總長佔 core run 的百分比","所有回收岩芯佔 core run 的百分比","solid core 佔 core run 的百分比","每米裂隙數目"],"a":0,"e":"TCR = 全部回收；SCR = solid core；RQD = > 100 mm solid core 片；FI = 每米裂隙數。只計 natural fractures，鑽探造成的 artificial fractures 要剔除；有疑問時視為 natural。","x":"solid core pieces, each greater than 100 mm between natural","q_en":"What is the definition of RQD?","o_en":["Total length of solid core pieces each > 100 mm long, as a percentage of the core run","All recovered core as a percentage of the core run","Solid core as a percentage of the core run","Number of fractures per metre"],"e_en":"TCR = all recovered; SCR = solid core; RQD = solid core pieces > 100 mm; FI = fractures per metre. Only natural fractures are counted; artificial fractures caused by drilling are excluded; when in doubt treat as natural.","doc":"geoguide3-rock-soil-descriptions","pp":"28","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","mcq","基礎"]},{"id":"GG3-010","t":"tf","d":2,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":28,"q":"評估 fracture state 時，鑽探造成的人工裂隙應計入。","a":false,"e":"錯誤，只計天然地質裂隙；粗糙、帶新鮮解理面的斷口通常是人工裂隙。有疑問時習慣上當作 natural。","x":"Only natural geological fractures should be taken into account for the description of","q_en":"When assessing fracture state, artificial fractures caused by drilling should be counted.","e_en":"False. Only natural geological fractures are counted; rough breaks with fresh cleavage surfaces are usually artificial. By convention, doubtful ones are treated as natural.","doc":"geoguide3-rock-soil-descriptions","pp":"27","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","tf","中級"]},{"id":"GG3-011","t":"short","d":2,"tp":"岩芯指標 Core indices","c":"2.4.3(9)","p":28,"q":"解釋 'solid core' 的定義，並說明 TCR 與 SCR 的分別。","m":"Solid core：沿岩芯軸向兩天然裂隙之間至少有一個完整直徑（不一定完整圓周）的岩芯。TCR 為所有回收岩芯（solid、無完整直徑的 intact 或 non-intact）佔 core run 的百分比；SCR 只計 solid core。","k":["at least one full diameter","not necessarily full circumference","TCR includes non-intact","SCR solid only"],"e":"Foundations Code 的岩石 bearing/socket 分類及 PNAP 要求都依賴 TCR/RQD 記錄；工程師審閱 borehole log 時要知道這些指標的定義。","x":"regarded as core with at least one full diameter (but not necessarily a full circumference)","q_en":"Explain the definition of 'solid core' and the difference between TCR and SCR.","m_en":"Solid core: core with at least one full diameter (not necessarily a full circumference) along the core axis between two natural fractures. TCR is all recovered core (solid, intact without a full diameter, or non-intact) as a percentage of the core run; SCR counts only solid core.","e_en":"The rock bearing/socket categories of the Foundations Code and PNAP requirements all rely on TCR/RQD records; engineers reviewing borehole logs must know how these indices are defined.","doc":"geoguide3-rock-soil-descriptions","pp":"27","tags":["geoguide3-rock-soil-descriptions","岩芯指標 Core indices","short","中級"]},{"id":"GG3-012","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：SPT N = 10–30 的砂/礫石 compactness 描述為？","o":["Medium dense","Loose","Dense","Very dense"],"a":0,"e":"SPT N 與密實度對應：0–4 very loose、4–10 loose、10–30 medium dense、30–50 dense、> 50 very dense。設計時用 N 值推 φ' 或樁側摩阻前，先確認描述一致。","x":"Medium dense 10 - 30","q_en":"Table 12: compactness term for sand/gravel with SPT N = 10–30?","e_en":"SPT N versus compactness: 0–4 very loose, 4–10 loose, 10–30 medium dense, 30–50 dense, > 50 very dense. Before using N values to derive φ' or pile shaft friction in design, confirm the descriptions are consistent.","doc":"geoguide3-rock-soil-descriptions","pp":"79","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","mcq","中級"]},{"id":"GG3-013","t":"num","d":2,"tp":"土壤描述 Soil description","c":"Table 12","p":80,"q":"Table 12：'Firm' 粉土/黏土的 undrained shear strength 下限？","a":40,"tol":0,"u":"kPa","e":"Very soft < 20、soft 20–40、firm 40–75、stiff 75–150、very stiff/hard > 150 kPa。海泥（marine deposit）多為 very soft 至 soft。","x":"Silts and Clays Firm 40 - 75","q_en":"Table 12: lower limit of undrained shear strength for 'firm' silt/clay?","e_en":"Very soft < 20, soft 20–40, firm 40–75, stiff 75–150, very stiff/hard > 150 kPa. Marine deposits are mostly very soft to soft.","doc":"geoguide3-rock-soil-descriptions","pp":"79","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","num","中級"]},{"id":"GG3-014","t":"num","d":2,"tp":"土壤描述 Soil description","c":"3.3.4(2)","p":38,"q":"土壤（不計 boulders/cobbles）含細粒至少約多少百分比時稱為 silt 或 clay（fine soil）？","a":35,"tol":0,"u":"%","e":"≥ 約 35% fines → SILT/CLAY；< 35% → SAND/GRAVEL。工程的 'well-graded' 相當於地質的 'poorly-sorted'，兩者用詞相反。","x":"contains about 35% or more of fine material, it is","q_en":"A soil (excluding boulders/cobbles) is called silt or clay (fine soil) when it contains at least about what percentage of fines?","e_en":"≥ about 35% fines → SILT/CLAY; < 35% → SAND/GRAVEL. Engineering 'well-graded' corresponds to geological 'poorly-sorted' — the terms are opposite.","doc":"geoguide3-rock-soil-descriptions","pp":"37","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","num","中級"]},{"id":"GG3-015","t":"mcq","d":2,"tp":"土壤描述 Soil description","c":"Table 15","p":82,"q":"Table 15：粗粒土中 silt/clay 次要成分 15–35%，前綴應為？","o":["Very (silty/clayey)","Slightly (silty/clayey)","(silty/clayey) 無修飾","With much"],"a":0,"e":"Coarse soils：slightly < 5%、無修飾 5–15%、very 15–35%。","x":"Very (silty, clayey or silty/ 15 - 35","q_en":"Table 15: for a coarse soil with a secondary silt/clay constituent of 15–35%, the prefix should be:","o_en":["Very (silty/clayey)","Slightly (silty/clayey)","(silty/clayey) without qualifier","With much"],"e_en":"Coarse soils: slightly < 5%, no qualifier 5–15%, very 15–35%.","doc":"geoguide3-rock-soil-descriptions","pp":"81","tags":["geoguide3-rock-soil-descriptions","土壤描述 Soil description","mcq","中級"]},{"id":"GG3-016","t":"tf","d":2,"tp":"風化分級 Weathering grades","c":"3.5","p":45,"q":"Geoguide 3 指出香港的 true residual soil 厚度通常少於 3 m，在工程上比 saprolite 次要。","a":true,"e":"正確。Saprolite（grade V，保留原岩結構）才是香港 site formation 及 foundation 的主角；relict joints 對斜坡穩定尤其重要。","x":"True residual soils are rarely developed to any significant thickness in Hong Kong","q_en":"Geoguide 3 notes that true residual soil in Hong Kong is usually less than 3 m thick and of less engineering significance than saprolite.","e_en":"True. Saprolite (grade V, retaining the original rock structure) is the main material in Hong Kong site formation and foundations; relict joints are particularly important for slope stability.","doc":"geoguide3-rock-soil-descriptions","pp":"44","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","tf","中級"]},{"id":"GG3-017","t":"mcq","d":2,"tp":"不連續面 Discontinuities","c":"Table 7","p":75,"q":"Table 7：不連續面間距 200–600 mm 描述為？","o":["Medium-spaced","Closely-spaced","Widely-spaced","Very closely-spaced"],"a":0,"e":"間距分級：> 6 m extremely widely；2–6 m very widely；0.6–2 m widely；200–600 mm medium；60–200 mm closely；20–60 mm very closely；< 20 mm extremely closely。","x":"Medium - spaced 200 mm - 600 mm","q_en":"Table 7: term for discontinuity spacing of 200–600 mm?","e_en":"Spacing terms: > 6 m extremely widely; 2–6 m very widely; 0.6–2 m widely; 200–600 mm medium; 60–200 mm closely; 20–60 mm very closely; < 20 mm extremely closely.","doc":"geoguide3-rock-soil-descriptions","pp":"74","tags":["geoguide3-rock-soil-descriptions","不連續面 Discontinuities","mcq","中級"]},{"id":"GG3-018","t":"mcq","d":3,"tp":"風化分級 Weathering grades","c":"Table 10","p":78,"q":"Table 10 岩體風化分區：岩石含量 50%–90% 的 zone symbol？","o":["PW 50/90","PW 30/50","PW 90/100","RS"],"a":0,"e":"RS 100% soil；PW0/30 < 30% rock；PW30/50；PW50/90（interlocked structure）；PW90/100；UW 100% rock。與 BS 5930 分區不同，Geoguide 3 特意用新符號避免混淆。","x":"Rock 50 / 90 Interlocked structure","q_en":"Table 10 rock mass weathering zones: zone symbol for 50%–90% rock content?","e_en":"RS 100% soil; PW0/30 < 30% rock; PW30/50; PW50/90 (interlocked structure); PW90/100; UW 100% rock. These differ from the BS 5930 zones; Geoguide 3 deliberately uses new symbols to avoid confusion.","doc":"geoguide3-rock-soil-descriptions","pp":"77","tags":["geoguide3-rock-soil-descriptions","風化分級 Weathering grades","mcq","進階"]},{"id":"GP1-001","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"GEO Publication 1/2023 Table 6.1（GFM）：embedded wall 的 overturning/toe instability，若用 effective stress analysis，最小 global factor of safety 是多少？","o":["1.5","1.2","2.0","1.4"],"a":0,"e":"GFM（global factor method）下 effective stress 用 1.5，total stress 用 2.0（因 su 不確定性較大）。注意 Note (1)：FoS 是施加於 passive earth pressure，而水壓不打折。常見錯誤是把 FoS 同時除到水壓上，令設計過度保守。","x":"1.5 for effective stress analysis","q_en":"GEO Publication 1/2023 Table 6.1 (GFM): for overturning/toe instability of an embedded wall using effective stress analysis, what is the minimum global factor of safety?","e_en":"Under the GFM (global factor method), 1.5 for effective stress and 2.0 for total stress (because su is more uncertain). Note (1): the FoS is applied to the passive earth pressure, and water pressure is not factored. A common error is also dividing water pressure by the FoS, making the design over-conservative.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","mcq","中級"]},{"id":"GP1-002","t":"num","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：toe stability 若用 total stress analysis，最小 FoS？","a":2.0,"tol":0,"u":"","e":"Total stress（undrained, su）分析 FoS 要 2.0，高於 effective stress 的 1.5。軟黏土（marine deposit）開挖常以 total stress 控制，嵌固深度因此顯著加長。","x":"2.0 for total stress analysis","q_en":"Table 6.1 (GFM): minimum FoS for toe stability using total stress analysis?","e_en":"Total stress (undrained, su) analysis requires FoS 2.0, higher than 1.5 for effective stress. Excavations in soft clay (marine deposit) are often governed by total stress, so embedment depths become significantly longer.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","num","中級"]},{"id":"GP1-003","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.1 Note (1)","p":68,"q":"按 Table 6.1 Note (1)，embedded wall 抗 moment equilibrium 的 FoS 應施加於 passive earth pressure，水壓不作 factoring。","a":true,"e":"正確。GFM 的 FoS 以折減 passive resistance 方式施加；水壓屬「確定」荷載不打折。提交 BD/GEO 的計算書要清楚列明 FoS 的施加方法，否則審批時常被追問。","x":"The factor of safety against loss of moment equilibrium of the embedded wall should","q_en":"Per Table 6.1 Note (1), the FoS on moment equilibrium of an embedded wall should be applied to the passive earth pressure, with no factoring of water pressure.","e_en":"True. The GFM FoS is applied by reducing the passive resistance; water pressure is a \"certain\" load and is not factored. Calculations submitted to BD/GEO must state clearly how the FoS is applied, otherwise queries are common during approval.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-004","t":"mcq","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2（PFM, ULS）：undrained shear strength su 的 partial material factor γm 預設值？","o":["2.0","1.2","1.5","1.0"],"a":0,"e":"su 預設 γm = 2.0；若有 site-specific CPT 並以實驗室測試校準，可減至 1.5。Drained c'、tan φ' 則為 1.2。PFM（partial factor method）比 GFM 更理性，但參數要配對使用，不能混用 GFM 的 FoS。","x":"In general, a partial factor of 2.0 on su is recommended in","q_en":"Table 6.2 (PFM, ULS): default partial material factor γm for undrained shear strength su?","e_en":"Default γm = 2.0 for su; may be reduced to 1.5 with site-specific CPT calibrated by laboratory tests. Drained c' and tan φ' take 1.2. The PFM (partial factor method) is more rational than the GFM, but parameters must be used as a matched set, not mixed with the GFM FoS.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","mcq","中級"]},{"id":"GP1-005","t":"num","d":3,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"Table 6.2 PFM：temporary surcharge 的 partial load factor γl？","a":1.3,"tol":0,"u":"","e":"ELS 屬臨時工程，surcharge 較可控，故取 1.3（Geoguide 1 永久擋土牆為 1.5）。若 surcharge 對穩定有利，γl 取 0（Note 4）。","x":"The partial factor for surcharge loading is recommended to be 1.3.","q_en":"Table 6.2 PFM: partial load factor γl for temporary surcharge?","e_en":"ELS is temporary works and surcharge is more controllable, hence 1.3 (1.5 for permanent retaining walls in Geoguide 1). Where surcharge is favourable to stability, γl is taken as 0 (Note 4).","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","num","進階"]},{"id":"GP1-006","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"Table 6.2","p":69,"q":"在 PFM ULS 設計中，soil unit weight 和 stiffness 的 γm 均為 1.0。","a":true,"e":"正確。只有 strength 參數打折（drained 1.2、su 2.0/1.5、rock joint 1.2），unit weight 及 stiffness 取 1.0。SLS 全部系數為 1.0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","q_en":"In PFM ULS design, γm for soil unit weight and stiffness are both 1.0.","e_en":"True. Only strength parameters are factored (drained 1.2, su 2.0/1.5, rock joint 1.2); unit weight and stiffness take 1.0. At SLS all factors are 1.0.","doc":"geo-pub-1-2023-deep-excavation","pp":"69","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-007","t":"short","d":3,"tp":"地下水 Groundwater","c":"6.5.1","p":70,"q":"開挖深度 > 4.5 m 的 ELS 工程，ULS 設計地下水位（DGWL）一般如何決定？若監測到的地下水位低於開挖面又如何？","m":"本地慣例：以監測到的最高地下水位再加 1 至 2 m 作 ULS 的 DGWL。若監測水位低於開挖面，則假設 DGWL 在開挖深度的三分之一處。","k":["monitored highest GWL + 1–2 m","excavation depth > 4.5 m","below excavation level → one-third of excavated depth"],"e":"DGWL 只需考慮工程期間，不用考慮長期/極端事件（如氣候變化）。實務上 SI 階段要有足夠長的水位監測（包括雨季），否則「最高監測水位」根本不具代表性。","x":"For ELS works with excavation depths greater than 4.5 m, it has become normal","q_en":"For ELS works with excavation depth > 4.5 m, how is the ULS design groundwater level (DGWL) generally determined? What if the monitored groundwater level is below the excavation level?","m_en":"Local practice: take the highest monitored groundwater level plus 1 to 2 m as the ULS DGWL. If the monitored level is below the excavation level, assume the DGWL at one-third of the excavation depth.","e_en":"The DGWL need only consider the works period, not long-term/extreme events (e.g. climate change). In practice the SI stage needs sufficiently long water level monitoring (including a wet season), otherwise the \"highest monitored level\" is not representative.","doc":"geo-pub-1-2023-deep-excavation","pp":"70","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","short","進階"]},{"id":"GP1-008","t":"mcq","d":3,"tp":"地下水 Groundwater","c":"6.5.1","p":70,"q":"若監測地下水位低於 excavation level，ULS 的 DGWL 應假設在哪裡？","o":["開挖深度的三分之一","地面","開挖面","開挖深度的一半"],"a":0,"e":"GEO Pub 1/2023 6.5.1：假設在 excavated depth 的 one-third。這是為暴雨後短暫升水而設的保守假設。","x":"lower than the excavation level, the DGWL for ULS is assumed to be at one-third of the","q_en":"If the monitored groundwater level is below the excavation level, where should the ULS DGWL be assumed?","o_en":["At one-third of the excavation depth","At ground level","At the excavation level","At half the excavation depth"],"e_en":"GEO Pub 1/2023 6.5.1: assume one-third of the excavated depth. This is a conservative assumption for temporary rises after rainstorms.","doc":"geo-pub-1-2023-deep-excavation","pp":"70","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","mcq","進階"]},{"id":"GP1-009","t":"num","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"6.5.2","p":71,"q":"SLS 地下水位觸發值：high trigger value 設於最高 ULS DGWL 以下多少米？","a":0.5,"tol":0,"u":"m","e":"High trigger 在 ULS DGWL 以下 0.5 m、low trigger 在 SLS 最低允許水位以上 0.5 m——預留反應時間。9.2.2.7 亦以「再升/降 0.5 m 便到設計水位」作 Action Level。","x":"a high trigger value at 0.5 m below the highest DGWL","q_en":"SLS groundwater trigger values: the high trigger value is set how many metres below the highest ULS DGWL?","e_en":"High trigger 0.5 m below the ULS DGWL, low trigger 0.5 m above the lowest allowable SLS level — leaving time to respond. 9.2.2.7 likewise sets the Action Level at \"a further rise/drop of 0.5 m reaches the design level\".","doc":"geo-pub-1-2023-deep-excavation","pp":"71","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","進階"]},{"id":"GP1-010","t":"short","d":2,"tp":"地下水 Groundwater","c":"6.5.2","p":71,"q":"SLS 設計中 DHGWL 與 DLGWL 各用於甚麼檢核？","m":"DHGWL（design high GWL）是實際可能的最高水位，用於估算牆身撓度；DLGWL（design low GWL）是最低記錄水位，用於估算抽水引致的 drawdown settlement。","k":["DHGWL → wall deflection","DLGWL → drawdown settlement","SLS 用 realistic 值，不應過度保守"],"e":"若把 ULS 地下水位直接用於 SLS，會高估牆撓度（6.1 已指出），並影響 strut preload 的判斷。","x":"a high trigger value at 0.5 m below the highest DGWL","q_en":"In SLS design, what are DHGWL and DLGWL each used to check?","m_en":"DHGWL (design high GWL) is the highest realistically possible level, used to estimate wall deflection; DLGWL (design low GWL) is the lowest recorded level, used to estimate drawdown settlement due to pumping.","k_en":["DHGWL → wall deflection","DLGWL → drawdown settlement","SLS uses realistic values, not over-conservative"],"e_en":"Using the ULS groundwater level directly for SLS overestimates wall deflection (as noted in 6.1) and affects judgements on strut preload.","doc":"geo-pub-1-2023-deep-excavation","pp":"71","tags":["geo-pub-1-2023-deep-excavation","地下水 Groundwater","short","中級"]},{"id":"GP1-011","t":"tf","d":2,"tp":"極限狀態及安全系數 Limit states & FoS","c":"6.1","p":63,"q":"GEO Pub 1/2023 指出，把 ULS 地下水位用於 SLS 設計可能導致高估牆撓度。","a":true,"e":"正確。SLS 應採用「realistic」參數與水位；把 ULS 保守值套入 SLS 會令撓度、沉降估算偏大，導致過重的支撐系統。","x":"using the ULS groundwater level for SLS design may lead","q_en":"GEO Pub 1/2023 points out that using the ULS groundwater level for SLS design may overestimate wall deflection.","e_en":"True. SLS should adopt \"realistic\" parameters and water levels; applying conservative ULS values to SLS inflates estimated deflections and settlements, leading to an overly heavy support system.","doc":"geo-pub-1-2023-deep-excavation","pp":"63","tags":["geo-pub-1-2023-deep-excavation","極限狀態及安全系數 Limit states & FoS","tf","中級"]},{"id":"GP1-012","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (base heave)","p":65,"q":"Base heave 主要在哪種地質條件下發生？","o":["軟黏土延伸至開挖底以下相當深度","開挖底為新鮮岩石","鬆散砂層且水頭差高","填土層很薄"],"a":0,"e":"Base heave 屬軟黏土問題（Table 6.1 要求 FoS 1.5）；砂層高水頭差則屬 piping。對填海區深厚 marine deposit 的地盤要特別檢核。","x":"primarily occurs in ground conditions where soft clay extends to a considerable depth below the excavation base","q_en":"Under what ground conditions does base heave mainly occur?","o_en":["Soft clay extending to a considerable depth below the excavation base","Fresh rock at the excavation base","Loose sand with a high head difference","A very thin fill layer"],"e_en":"Base heave is a soft clay problem (Table 6.1 requires FoS 1.5); high head difference in sand leads to piping. Check sites with thick marine deposits in reclamation areas particularly.","doc":"geo-pub-1-2023-deep-excavation","pp":"65","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","mcq","中級"]},{"id":"GP1-013","t":"short","d":3,"tp":"失效模式 Failure modes","c":"6.3 (piping / uplift)","p":67,"q":"低透水黏土層覆蓋於有承壓（artesian）水頭的砂層上時，開挖可能出現甚麼失效？列舉兩種補救方法。","m":"Uplift（底鼓/上舉）失效：黏土層底的承壓水壓超過上覆土重。補救：在黏土層下方抽水減壓（dewatering beneath the clay layer），或穿過黏土層開設減壓孔（pressure relief holes）。","k":["uplift","artesian pressure in sand","dewatering beneath clay","pressure relief holes","常見於填海地"],"e":"Table 6.1 要求 hydraulic failure（piping 和 uplift）FoS 1.5。PFM 下穩定作用的有效垂直應力要乘 0.67（Table 6.2 Note 1）。","x":"dewatering beneath the clay layer or forming pressure relief holes through the layer","q_en":"Where a low-permeability clay layer overlies a sand layer with artesian head, what failure can occur in an excavation? Give two remedial measures.","m_en":"Uplift failure: the artesian water pressure at the base of the clay layer exceeds the weight of the overlying soil. Remedies: dewatering beneath the clay layer to relieve pressure, or pressure relief holes through the clay layer.","k_en":["uplift","artesian pressure in sand","dewatering beneath clay","pressure relief holes","Common on reclaimed land"],"e_en":"Table 6.1 requires FoS 1.5 for hydraulic failure (piping and uplift). Under the PFM, the stabilising effective vertical stress is multiplied by 0.67 (Table 6.2 Note 1).","doc":"geo-pub-1-2023-deep-excavation","pp":"67","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","short","進階"]},{"id":"GP1-014","t":"num","d":2,"tp":"失效模式 Failure modes","c":"Table 6.1","p":68,"q":"Table 6.1（GFM）：hydraulic failure（piping 及 uplifting）最小 FoS？","a":1.5,"tol":0,"u":"","e":"Base heave 及 hydraulic failure 均為 1.5；structural failure 1.4；SLS 1.0。","x":"1.5 for effective stress analysis","q_en":"Table 6.1 (GFM): minimum FoS for hydraulic failure (piping and uplifting)?","e_en":"Base heave and hydraulic failure are both 1.5; structural failure 1.4; SLS 1.0.","doc":"geo-pub-1-2023-deep-excavation","pp":"68","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","num","中級"]},{"id":"GP1-015","t":"mcq","d":2,"tp":"失效模式 Failure modes","c":"6.3 (piping)","p":66,"q":"Piping 最可能在甚麼情況下發生？","o":["開挖遇上鬆散砂層且水力梯度高","開挖於軟黏土","開挖於完整岩石","地下水位低於開挖面"],"a":0,"e":"加長嵌固深度可延長 seepage path、降低出口梯度。grout curtain 滲漏亦會局部加大梯度，是本地 ELS 事故常見成因。","x":"Piping is more likely to occur when the excavation encounters a loose sandy layer with a high","q_en":"When is piping most likely to occur?","o_en":["Excavation encountering loose sand with a high hydraulic gradient","Excavation in soft clay","Excavation in intact rock","Groundwater level below the excavation level"],"e_en":"Increasing embedment lengthens the seepage path and lowers the exit gradient. Leakage through grout curtains also increases the gradient locally, a common cause of local ELS incidents.","doc":"geo-pub-1-2023-deep-excavation","pp":"66","tags":["geo-pub-1-2023-deep-excavation","失效模式 Failure modes","mcq","中級"]},{"id":"GP1-016","t":"mcq","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"三級觸發機制（AAA）中，Alert 和 Alarm 一般設於 Action Level 的甚麼百分比？","o":["50% 及 75%","25% 及 50%","60% 及 80%","75% 及 90%"],"a":0,"e":"AAA = Alert-Alarm-Action，一般 50% / 75% of Action Level。敏感地盤或以 engineering approach 定 Action Level 時參照 PNAP APP-24 Appendix C 或持份者（AMO、MTR）要求。","x":"In general, the AAA Levels are set at 50% and 75% of the Action Level respectively.","q_en":"In the three-tier trigger mechanism (AAA), what percentages of the Action Level are Alert and Alarm generally set at?","o_en":["50% and 75%","25% and 50%","60% and 80%","75% and 90%"],"e_en":"AAA = Alert-Alarm-Action, generally 50% / 75% of Action Level. For sensitive sites or where the Action Level is set by an engineering approach, refer to PNAP APP-24 Appendix C or stakeholder (AMO, MTR) requirements.","doc":"geo-pub-1-2023-deep-excavation","pp":"110","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","中級"]},{"id":"GP1-017","t":"num","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.1","p":110,"q":"若未經工程分析評估 ELS 影響範圍（influence zone），最少應採用多少倍 He 的水平距離？","a":1.5,"tol":0,"u":"×He","e":"最少 1.5He；若周邊有厚 marine deposit，須考慮更大範圍。影響範圍內所有 sensitive receivers 均要評估並設監測點。","x":"Otherwise, a minimum horizontal distance of 1.5 times","q_en":"Without engineering analysis to assess the influence zone of ELS works, at least what horizontal distance, as a multiple of He, should be adopted?","e_en":"At least 1.5He; where thick marine deposits are nearby, a larger zone must be considered. All sensitive receivers within the influence zone must be assessed and provided with monitoring points.","doc":"geo-pub-1-2023-deep-excavation","pp":"110","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","中級"]},{"id":"GP1-018","t":"num","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"本地簡單開挖工程慣用的 empirical ground settlement Action Level 是多少？","a":25,"tol":0,"u":"mm","e":"25 mm 的 empirical 限值（PNAP APP-137）對簡單開挖行之有效，但深開挖若估算沉降本身已 > 25 mm 仍硬套，只會導致過重支撐或必然觸發停工。GEO Pub 1/2023 提倡按估算值（0.3%–0.5%He）設定。","x":"25 mm as the Action Level has been successfully applied for many simple excavation projects","q_en":"What empirical ground settlement Action Level is customarily used for simple local excavations?","e_en":"The empirical 25 mm limit (PNAP APP-137) works for simple excavations, but rigidly applying it to deep excavations whose estimated settlement already exceeds 25 mm only leads to overly heavy support or inevitable stop-work triggers. GEO Pub 1/2023 advocates setting it from estimated values (0.3%–0.5%He).","doc":"geo-pub-1-2023-deep-excavation","pp":"111","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","中級"]},{"id":"GP1-019","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.1","p":111,"q":"GEO Pub 1/2023 指出，常見而恰當的 ELS 系統引致的地面沉降一般在甚麼範圍？","o":["0.3%He 至 0.5%He","0.05%He 至 0.1%He","1%He 至 2%He","固定 25 mm"],"a":0,"e":"若估算值明顯偏離 0.3–0.5%He，應嚴格覆核開挖方案；過度保守會導致不合理的支撐系統。例子：沙中綫會展站約 30 m 開挖錄得約 100 mm 沉降。","x":"systems usually result in ground settlements within a typical range of between 0.3%He and","q_en":"According to GEO Pub 1/2023, ground settlement induced by common and appropriate ELS systems is generally in what range?","o_en":["0.3%He to 0.5%He","0.05%He to 0.1%He","1%He to 2%He","A fixed 25 mm"],"e_en":"If the estimate deviates markedly from 0.3–0.5%He, the excavation scheme should be rigorously reviewed; over-conservatism leads to unreasonable support systems. Example: the SCL Exhibition Centre Station, about 30 m deep, recorded about 100 mm of settlement.","doc":"geo-pub-1-2023-deep-excavation","pp":"111","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","進階"]},{"id":"GP1-020","t":"num","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1（5A Approach）：ground settlement marker 的 Alert 值？","a":10,"tol":0,"u":"mm","e":"5A：Alert 10 mm、Alarm 15 mm、Action Level 1 20 mm、Level 2 0.3%He（25–60 mm 範圍）、Level 3 0.5%He（30–100 mm）。只適用於道路路面。","x":"monitoring 10 mm 15 mm 20 mm","q_en":"Table 9.1 (5A Approach): Alert value for ground settlement markers?","e_en":"5A: Alert 10 mm, Alarm 15 mm, Action Level 1 20 mm, Level 2 0.3%He (range 25–60 mm), Level 3 0.5%He (30–100 mm). Applies only to road pavements.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","num","進階"]},{"id":"GP1-021","t":"mcq","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1","p":117,"q":"Table 9.1：building monitoring marker 的 angular distortion Alert 值？","o":["1:1000","1:600","1:500","1:300"],"a":0,"e":"Building：1:1000 / 1:750 / 1:600 / 1:550 / 1:500；Services：1:600 / 1:500 / 1:400 / 1:350 / 1:300。建築物比管線嚴格。","x":"monitoring 1:1000 1:750 1:600 1:550 1:500","q_en":"Table 9.1: Alert value of angular distortion for building monitoring markers?","e_en":"Buildings: 1:1000 / 1:750 / 1:600 / 1:550 / 1:500; services: 1:600 / 1:500 / 1:400 / 1:350 / 1:300. Buildings are stricter than utilities.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","mcq","進階"]},{"id":"GP1-022","t":"tf","d":3,"tp":"監測及觸發值 Monitoring & triggers","c":"Table 9.1 Note (4)(b)","p":117,"q":"按 Table 9.1 Note (4)(b)，任何監測點在連續兩日讀數之間增加 5 mm，應採取 Action Level 2 的應變行動。","a":true,"e":"正確，這是 undue settlement 的特別觸發條件；另 Note (4)(a)：危險管線沉降達 20 mm 或任何點隆起 > 20 mm 觸發 Action Level 1。","x":"an increase of 5 mm between two consecutive daily readings","q_en":"Per Table 9.1 Note (4)(b), if any monitoring point increases by 5 mm between readings on two consecutive days, the Action Level 2 response should be taken.","e_en":"True — a special trigger for undue settlement; also Note (4)(a): settlement of hazardous utilities reaching 20 mm or heave > 20 mm at any point triggers Action Level 1.","doc":"geo-pub-1-2023-deep-excavation","pp":"117","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","tf","進階"]},{"id":"GP1-023","t":"tf","d":2,"tp":"監測及觸發值 Monitoring & triggers","c":"9.2.2.7","p":118,"q":"單單因地下水位超出 Action Level 而暫停工程，是 GEO Pub 1/2023 建議的做法。","a":false,"e":"錯誤。指引認為除非有突然大量滲水，否則單因地下水 Action Level 停工是不必要及不切實際的，因為 sensitive receivers 已由沉降控制機制保障。","x":"Suspension of works solely due to exceedance of the groundwater Action Level is","q_en":"Suspending works solely because the groundwater level exceeds the Action Level is the practice recommended by GEO Pub 1/2023.","e_en":"False. The guidance considers stopping work solely because of a groundwater Action Level unnecessary and impractical unless there is sudden heavy seepage, because sensitive receivers are already protected by the settlement control mechanism.","doc":"geo-pub-1-2023-deep-excavation","pp":"118","tags":["geo-pub-1-2023-deep-excavation","監測及觸發值 Monitoring & triggers","tf","中級"]},{"id":"GP1-024","t":"num","d":3,"tp":"側向支撐 Lateral support","c":"7.6.2","p":94,"q":"以 limit equilibrium analysis 做單層支撐牆結構設計時，側向力一般增加多少百分比以考慮 arching 及應力重分佈？","a":25,"tol":0,"u":"%","e":"Padfield & Mair (1984) 建議增加 25%；single-level tied-back 的拉桿荷載亦增加 25%（p95）。","x":"the lateral force is usually increased by 25% to allow for the possibility of","q_en":"When a single-level propped wall is structurally designed by limit equilibrium analysis, by what percentage is the lateral force generally increased to allow for arching and stress redistribution?","e_en":"Padfield & Mair (1984) recommend a 25% increase; tie loads of single-level tied-back walls are also increased by 25% (p95).","doc":"geo-pub-1-2023-deep-excavation","pp":"94","tags":["geo-pub-1-2023-deep-excavation","側向支撐 Lateral support","num","進階"]},{"id":"GP1-025","t":"short","d":2,"tp":"側向支撐 Lateral support","c":"7.6.1","p":93,"q":"以簡化線性土壓力計算懸臂牆彎矩時，鋼筋可否在計算彎矩為零處截斷？","m":"不可。鋼筋應伸延至牆底並兩面配置，以抵抗牆趾附近可能出現的小反向彎矩。","k":["不應 curtail at zero BM","reinforcement down to bottom","both faces","reverse bending near toe"],"e":"簡化分佈只是近似；實際在 toe 附近有反向彎矩。Concrete Code 的 detailing 要求亦須同時滿足。","x":"the reinforcement should not be curtailed at the point where the calculated bending moment is zero","q_en":"When cantilever wall moments are calculated from a simplified linear earth pressure distribution, may reinforcement be curtailed where the calculated moment is zero?","m_en":"No. Reinforcement should extend to the bottom of the wall on both faces to resist small reverse moments that may occur near the toe.","k_en":["Should not curtail at zero BM","reinforcement down to bottom","both faces","reverse bending near toe"],"e_en":"The simplified distribution is only an approximation; reverse moments actually occur near the toe. The detailing requirements of the Concrete Code must also be satisfied.","doc":"geo-pub-1-2023-deep-excavation","pp":"93","tags":["geo-pub-1-2023-deep-excavation","側向支撐 Lateral support","short","中級"]},{"id":"GP1-026","t":"short","d":3,"tp":"側向支撐 Lateral support","c":"4.4.1","p":48,"q":"本地 embedded wall 與軟黏土之間的 adhesion 一般取甚麼名義值？若要用更大值需要甚麼？","m":"常用 10 kPa 作名義值；亦可用 total stress 以 cw = α su 計算。若採用大於 10 kPa，須有足夠現場或實驗室測試及分析支持。","k":["10 kPa nominal","cw = α su","> 10 kPa 需測試支持"],"e":"Adhesion 影響 waling 依賴牆摩擦抵抗 in-plane 軸力。1990 年代曾有角撐 in-plane 力考慮不足導致 diaphragm wall 倒塌的個案（Davies 1990）。","x":"it is common practice to use 10 kPa as a nominal value","q_en":"What nominal value of adhesion between an embedded wall and soft clay is generally adopted locally? What is needed to use a larger value?","m_en":"10 kPa is commonly used as a nominal value; alternatively cw = α su by total stress. Values greater than 10 kPa must be supported by adequate field or laboratory tests and analysis.","k_en":["10 kPa nominal","cw = α su","> 10 kPa requires supporting tests"],"e_en":"Adhesion affects the reliance of walings on wall friction to resist in-plane axial forces. In the 1990s there was a diaphragm wall collapse where in-plane forces from corner struts had been inadequately considered (Davies 1990).","doc":"geo-pub-1-2023-deep-excavation","pp":"48","tags":["geo-pub-1-2023-deep-excavation","側向支撐 Lateral support","short","進階"]},{"id":"GP1-027","t":"mcq","d":2,"tp":"抽水測試 Pumping test","c":"4.3 / Table 4.1","p":47,"q":"Pumping test 中，steady state 的定義是甚麼？","o":["抽水率恆定且井內水位每小時變化少於 0.1 m","水位每日變化少於 0.1 m","抽水 72 小時後","水位回升至原水平"],"a":0,"e":"GEO Pub 1/2023 認為達 steady state 後維持最少 24 小時抽水已足夠（本地舊慣例 72 小時）。成功的 pumping test 不代表開挖期間 grout curtain 一定不漏水。","x":"the rate of change of water level is less than 0.1 m per hour","q_en":"In a pumping test, how is steady state defined?","o_en":["Constant pumping rate and water level in the well changing by less than 0.1 m per hour","Water level changing by less than 0.1 m per day","After 72 hours of pumping","Water level recovered to the original level"],"e_en":"GEO Pub 1/2023 considers maintaining pumping for at least 24 hours after reaching steady state sufficient (older local practice: 72 hours). A successful pumping test does not guarantee the grout curtain will not leak during excavation.","doc":"geo-pub-1-2023-deep-excavation","pp":"47","tags":["geo-pub-1-2023-deep-excavation","抽水測試 Pumping test","mcq","中級"]},{"id":"GP1-028","t":"num","d":2,"tp":"抽水測試 Pumping test","c":"4.3","p":47,"q":"達 steady state seepage 後，GEO Pub 1/2023 認為最少維持抽水多少小時才開始 recovery stage？","a":24,"tol":0,"u":"hours","e":"Cheung et al (2023) 檢討本地 pumping test：達穩態後其後 72 小時水位幾乎不變，故最少 24 小時已足。","x":"minimum of 24 hours after achieving steady state seepage","q_en":"After steady state seepage is reached, GEO Pub 1/2023 considers that pumping should be maintained for at least how many hours before starting the recovery stage?","e_en":"Cheung et al (2023) reviewed local pumping tests: after steady state, water levels barely changed over the following 72 hours, so at least 24 hours is sufficient.","doc":"geo-pub-1-2023-deep-excavation","pp":"47","tags":["geo-pub-1-2023-deep-excavation","抽水測試 Pumping test","num","中級"]},{"id":"GLS-001","t":"num","d":2,"tp":"極限狀態 Limit state","c":"2.2.3","p":14,"q":"Glass Code 2.2.3：單一構件失效時，玻璃結構可能倒塌的部分不應超過多少 m²？","a":70,"tol":0,"u":"m²","e":"防止連續倒塌（例如玻璃柱失效導致玻璃樑及玻璃地台倒塌）。大型玻璃天幕要劃分結構，確保單件失效影響 ≤70 m²。","x":"of collapse should not exceed 70 m (floor, frontal or total area), due to the failure of one","q_en":"Glass Code 2.2.3: on failure of a single member, the part of a glass structure that may collapse should not exceed how many m²?","e_en":"Prevents progressive collapse (e.g. failure of a glass column leading to collapse of glass beams and glass floors). Large glass canopies must be structurally subdivided so that the effect of a single failure is ≤70 m².","doc":"glass-2018","pp":"6","tags":["glass-2018","極限狀態 Limit state","num","中級"]},{"id":"GLS-002","t":"mcq","d":2,"tp":"荷載 Loads","c":"3.4","p":15,"q":"直接受陽光照射的 tinted glass 表面，設計溫度範圍是？","o":["0–90°C","0–50°C","0–40°C","−10–60°C"],"a":0,"e":"不受直射 0–40°C；直射透明玻璃 0–50°C；有色玻璃 0–90°C。有色玻璃熱應力大，要檢查 thermal breakage，常需熱處理玻璃。","x":"glass and 0-90°C for tinted glass.","q_en":"What is the design temperature range for tinted glass surfaces exposed to direct sunlight?","e_en":"Not directly exposed 0–40°C; directly exposed clear glass 0–50°C; tinted glass 0–90°C. Tinted glass has high thermal stresses; check thermal breakage — heat-treated glass is often needed.","doc":"glass-2018","pp":"7","tags":["glass-2018","荷載 Loads","mcq","中級"]},{"id":"GLS-003","t":"mcq","d":1,"tp":"荷載 Loads","c":"3.5","p":15,"q":"Glass Code 的 short-term load duration 定義為？","o":["不多於 3 秒（如風荷載、欄杆水平活載）","不多於 1 天","不多於 1 小時","多於 1 天"],"a":0,"e":"Short ≤3 s；Medium 3 s–1 天（維修荷載、溫度）；Long >1 天（自重等）。不同歷時對應 Table 4.4 的強度折減。","x":"(1) Short-term load duration is defined as the duration of load applying not more than","q_en":"How is short-term load duration defined in the Glass Code?","o_en":["Not more than 3 seconds (e.g. wind load, horizontal imposed load on barriers)","Not more than 1 day","Not more than 1 hour","More than 1 day"],"e_en":"Short ≤3 s; Medium 3 s–1 day (maintenance loads, temperature); Long >1 day (self-weight, etc.). The durations correspond to the strength reductions in Table 4.4.","doc":"glass-2018","pp":"7","tags":["glass-2018","荷載 Loads","mcq","基礎"]},{"id":"GLS-004","t":"tf","d":2,"tp":"玻璃材料 Glass material","c":"4.1.1","p":16,"q":"玻璃在常溫下會產生金屬學意義上的疲勞和蠕變。","a":false,"e":"玻璃常溫下不蠕變、無金相疲勞，但在持續或循環荷載下微裂紋會緩慢增長，達臨界尺寸後突然脆性破壞。這就是為何強度隨荷載歷時下降。","x":"Glass at normal temperatures does not creep or “flow” and does not undergo fatigue in the","q_en":"Glass exhibits fatigue and creep in the metallurgical sense at ambient temperature.","e_en":"False. Glass does not creep and has no metallurgical fatigue at ambient temperature, but under sustained or cyclic load microcracks grow slowly until reaching a critical size, then sudden brittle fracture occurs. This is why strength decreases with load duration.","doc":"glass-2018","pp":"8","tags":["glass-2018","玻璃材料 Glass material","tf","中級"]},{"id":"GLS-005","t":"num","d":1,"tp":"玻璃材料 Glass material","c":"Table 4.2","p":17,"q":"Table 4.2：玻璃的 modulus of elasticity（N/mm²）？","a":70000,"tol":0,"u":"N/mm²","e":"E = 70,000 N/mm²（約鋁的水平），ν = 0.22，密度 2,650 kg/m³，α = 9×10⁻⁶/°C。","x":"Modulus of elasticity 𝐸 70,000 N/mm","q_en":"Table 4.2: modulus of elasticity of glass (N/mm²)?","e_en":"E = 70,000 N/mm² (about that of aluminium), ν = 0.22, density 2,650 kg/m³, α = 9×10⁻⁶/°C.","doc":"glass-2018","pp":"9","tags":["glass-2018","玻璃材料 Glass material","num","基礎"]},{"id":"GLS-006","t":"num","d":2,"tp":"玻璃材料 Glass material","c":"Table 4.2","p":17,"q":"Table 4.2：玻璃的 Poisson's ratio？","a":0.22,"tol":0,"u":"","e":"計算 glass fin 局部屈曲公式 6.1 時要用。","x":"Poisson’s ratio 𝜐 0.22","q_en":"Table 4.2: Poisson's ratio of glass?","e_en":"Needed in equation 6.1 for local buckling of glass fins.","doc":"glass-2018","pp":"9","tags":["glass-2018","玻璃材料 Glass material","num","中級"]},{"id":"GLS-007","t":"mcq","d":2,"tp":"玻璃種類 Glass types","c":"4.2.2","p":17,"q":"Heat strengthened glass 熱處理後的表面壓應力範圍？","o":["大於 24 MPa 但小於 52 MPa","不少於 69 MPa","10–24 MPa","52–69 MPa"],"a":0,"e":"HS 玻璃破碎形態類似退火玻璃（大塊），但不易因表面裂紋擴展而破裂，也不會 NiS 自爆。可用 GASP 在 tin side 量度。","x":"compressive stress is to be greater than 24 MPa but less than 52 MPa.","q_en":"Range of surface compressive stress of heat strengthened glass after heat treatment?","o_en":["Greater than 24 MPa but less than 52 MPa","Not less than 69 MPa","10–24 MPa","52–69 MPa"],"e_en":"HS glass breaks in a pattern similar to annealed glass (large pieces), but is less prone to fracture from surface crack growth and does not suffer NiS spontaneous breakage. It can be measured on the tin side with a GASP.","doc":"glass-2018","pp":"9","tags":["glass-2018","玻璃種類 Glass types","mcq","中級"]},{"id":"GLS-008","t":"num","d":2,"tp":"玻璃種類 Glass types","c":"4.2.3","p":18,"q":"Tempered glass 熱處理後表面壓應力不應少於多少 MPa？","a":69,"tol":0,"u":"MPa","e":"破碎時成小立方體碎片。所有切割鑽孔要在鋼化前完成；孔徑不小於玻璃厚度。","x":"surface compression stress should not be less than 69 MPa. When tempered glass breaks, it","q_en":"The surface compressive stress of tempered glass after heat treatment should not be less than how many MPa?","e_en":"It breaks into small cube-like fragments. All cutting and drilling must be done before tempering; hole diameter not less than the glass thickness.","doc":"glass-2018","pp":"10","tags":["glass-2018","玻璃種類 Glass types","num","中級"]},{"id":"GLS-009","t":"short","d":2,"tp":"玻璃種類 Glass types","c":"4.2.3","p":18,"q":"解釋 tempered glass「自爆」（spontaneous breakage）的成因及 Glass Code 的預防措施。","m":"成因：生產時 α-NiS（硫化鎳）雜質被困在內部高拉應力區，其後轉變為體積較大的 β-NiS，體積膨脹令玻璃產生應力而自爆。預防：鋼化玻璃須經 heat soak process，含 NiS 的玻璃會在過程中破裂而不被使用；品質保證要求見 9.3。","k":["NiS inclusion in tensile zone","α → β phase, volume increase","heat soak process","clause 9.3 QA"],"e":"香港多次發生幕牆鋼化玻璃自爆墮下事件。高處外牆除 heat soak 外，大於 2.5 m² 且高 5 m 以上須用夾層玻璃（5.2.1）。","x":"Tempered glass is susceptible to “spontaneous breakage” due to Nickel Sulphide (NiS)","q_en":"Explain the cause of \"spontaneous breakage\" of tempered glass and the Glass Code's preventive measures.","m_en":"Cause: α-NiS (nickel sulphide) inclusions trapped in the high-tensile central zone during manufacture later transform into the larger-volume β-NiS; the volume expansion stresses the glass and causes spontaneous breakage. Prevention: tempered glass must undergo the heat soak process, during which glass containing NiS breaks and is not used; quality assurance requirements are in 9.3.","e_en":"Hong Kong has had several incidents of tempered curtain wall glass breaking spontaneously and falling. For high-level façades, besides heat soaking, panels larger than 2.5 m² and 5 m or more above floor level must be laminated (5.2.1).","doc":"glass-2018","pp":"10","tags":["glass-2018","玻璃種類 Glass types","short","中級"]},{"id":"GLS-010","t":"num","d":1,"tp":"玻璃強度 Glass strength","c":"Table 4.3","p":19,"q":"Table 4.3：Tempered glass 在 short-term load 下的 ultimate design strength py（MPa）？","a":80,"tol":0,"u":"MPa","e":"Annealed 20、HS 40、Tempered 80 MPa。其定義為每 1000 片不多於 8 片破裂的強度。","x":"Annealed 20 Heat strengthened 40 Tempered 80","q_en":"Table 4.3: ultimate design strength py (MPa) of tempered glass under short-term load?","e_en":"Annealed 20, HS 40, tempered 80 MPa. It is defined as the strength at which not more than 8 in 1000 panes break.","doc":"glass-2018","pp":"11","tags":["glass-2018","玻璃強度 Glass strength","num","基礎"]},{"id":"GLS-011","t":"tf","d":2,"tp":"玻璃強度 Glass strength","c":"4.3","p":19,"q":"Glass Code 的 ultimate design strength 定義為每 1000 片玻璃不多於 8 片破裂時的強度。","a":true,"e":"玻璃強度是統計性的，受微裂紋控制，故以破損機率定義。","x":"ultimate design strength of glass is defined as the strength at which not more than 8 out of","q_en":"The ultimate design strength in the Glass Code is defined
