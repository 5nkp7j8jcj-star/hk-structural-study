00 m；(b) Strategic Routes 上並經指定的橋；(c) 離地高度 > 40 m。其他大多數公路結構可用簡化程序（Clause 3.4.2）。40 m 是高度準則，不是跨度準則。","x":"bridges with any span greater than 100m","tier":"必考","ex":"bridge","o":["跨度大於 40 m 的橋","位於 Degree 4 暴露度的橋","任何一跨大於 100 m 的橋","所有行人天橋"],"a":2,"q_en":"Which bridge must use the full procedure (Clause 3.4.3) for wind actions?","o_en":["A bridge with a span greater than 40 m","A bridge at Degree 4 exposure","A bridge with any span greater than 100 m","All footbridges"],"e_en":"3.4.1(5): (a) any span > 100 m; (b) bridges on Strategic Routes as designated; (c) height above ground > 40 m. Most other highway structures may use the simplified procedure (Clause 3.4.2). 40 m is a height criterion, not a span criterion.","doc":"sdm-2013","pp":"41"},{"id":"BR-035","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.1(5)(c)","p":43,"q":"橋樑離地高度超過多少時必須採用全程序計算風荷載？","e":"3.4.1(5)(c)：高度 > 40 m。跨度準則則為 > 100 m。","x":"bridges with height above ground greater than 40m","tier":"常考","ex":"bridge","o":["20 m","100 m","40 m","60 m"],"a":2,"q_en":"Above what height above ground must a bridge use the full procedure for wind?","e_en":"3.4.1(5)(c): height > 40 m. The span criterion is > 100 m.","doc":"sdm-2013","pp":"41"},{"id":"BR-036","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.2.2(1)","p":45,"q":"簡化程序下，公路橋「交通主導組合」（traffic leading combinations）中的風壓 qp 應取？","e":"3.4.2.2(1)：風速超過 44 m/s 時橋上仍有大量車輛的機會低，所以交通主導組合用 qp = 1.2 kN/m² 求 FW*。考試寫「風 + 交通」組合時要用 1.2 而不是 3.3。","x":"the corresponding peak velocity pressure of 1.2 kN/m2 may be used in traffic leading combinations","tier":"必考","ex":"bridge","o":["1.2 kN/m²","3.3 kN/m²","0.8 kN/m²","2.5 kN/m²"],"a":0,"q_en":"Under the simplified procedure, what qp is used for wind in traffic leading combinations on road bridges?","e_en":"3.4.2.2(1): it is unlikely that much traffic is on the bridge at wind speeds exceeding 44 m/s, so traffic leading combinations use qp = 1.2 kN/m² to find FW*. In the exam \"wind + traffic\" combination use 1.2, not 3.3.","doc":"sdm-2013","pp":"43"},{"id":"BR-037","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.1(3)","p":43,"q":"SDM 以 Waglan Island 資料推算 120 年重現期、暴露位置的峰值風壓為？","e":"3.4.1(3)：最大峰值風速 79 m/s（120 年）→ qp = 613 × 10⁻⁶ × 79² ≈ 3.8 kN/m²，即 Table 3.7 的 Exposed Location 值。","x":"gives a value of 3.8 kN/m² for the peak velocity pressure","tier":"常考","ex":"bridge","o":["4.2 kN/m²","3.3 kN/m²","3.8 kN/m²","2.5 kN/m²"],"a":2,"q_en":"From the Waglan Island data, what peak velocity pressure does the SDM derive for a 120-year return period at an exposed location?","e_en":"3.4.1(3): maximum peak wind velocity 79 m/s (120 years) → qp = 613 × 10⁻⁶ × 79² ≈ 3.8 kN/m², i.e. the Exposed Location value in Table 3.7.","doc":"sdm-2013","pp":"41"},{"id":"BR-039","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.2.1(4)","p":45,"q":"設計安裝在橋上的路牌架或隔音屏障本身時，可將 Table 3.7/3.8 的 qp 折減多少？","e":"3.4.2.1(4)：折減 20%（即 2.0 至 3.0 kN/m²）。但設計支承它們的橋時，作用在路牌架/屏障及橋上的風壓不可折減。","x":"with a reduction of 20%","tier":"偶考","ex":"bridge","o":["20%","10%","30%","不可折減"],"a":0,"q_en":"When designing sign gantries or noise barriers mounted on bridges, by how much may the qp from Table 3.7/3.8 be reduced?","o_en":["20%","10%","30%","No reduction"],"e_en":"3.4.2.1(4): 20% reduction (i.e. 2.0 to 3.0 kN/m²). But for the bridge supporting them, the pressure on the gantries/barriers and the bridge is not reduced.","doc":"sdm-2013","pp":"43"},{"id":"BR-040","t":"mcq","d":3,"tp":"橋樑風荷載 Wind actions on bridges","c":"Table 3.9 Note (1)","p":48,"q":"全程序中，Degree 3 暴露度可將 Table 3.9 的 qpb(z) 及 qb'(z) 乘以多少？","e":"Table 3.9 Note (1)：暴露度較低的位置可按暴露度折減：Degree 1 = 0.7、2 = 0.8、3 = 0.9、4 = 1.0。","x":"as follows : Degree of exposure Factor of qpb(z) and qb’(z) 1 0.7 2 0.8 3 0.9","tier":"常考","ex":"bridge","o":["0.9","1.0","0.7","0.8"],"a":0,"q_en":"In the full procedure, by what factor may qpb(z) and qb'(z) of Table 3.9 be multiplied for Degree 3 exposure?","e_en":"Table 3.9 Note (1): less exposed locations may be factored by degree of exposure: Degree 1 = 0.7, 2 = 0.8, 3 = 0.9, 4 = 1.0.","doc":"sdm-2013","pp":"46"},{"id":"BR-041","t":"mcq","d":3,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.3.6","p":50,"q":"全程序的氣候變化風壓放大系數 Kpc 為？","e":"3.4.3.6：Kpc = 1.22（qp(z) = qpb(z) Kpc）。1.106 是風速放大系數 Kvc。簡化程序（Table 3.7/3.8）則不需再放大（3.4.2.3）。","x":"multiplying factor Kpc shall be taken as follows : Kpc = 1.22","tier":"常考","ex":"bridge","o":["1.22","1.10","1.00","1.106"],"a":0,"q_en":"What is the climate change velocity pressure multiplying factor Kpc for the full procedure?","e_en":"3.4.3.6: Kpc = 1.22 (qp(z) = qpb(z) Kpc). 1.106 is the velocity factor Kvc. The simplified procedure (Table 3.7/3.8) needs no further increase (3.4.2.3).","doc":"sdm-2013","pp":"48"},{"id":"BR-042","t":"tf","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.2.3","p":45,"q":"因氣候變化，簡化程序 Table 3.7 及 3.8 的峰值風壓需要乘以 1.22。","e":"3.4.2.3：Waglan Island 資料已有足夠保守度，簡化程序的 qp「should remain unchanged」。1.22 只用於全程序（Kpc）。","x":"can provide an adequate margin for covering the climate change effects for ordinary highway structures","tier":"常考","ex":"bridge","a":false,"q_en":"Because of climate change, the peak velocity pressures of Table 3.7 and Table 3.8 for the simplified procedure must be multiplied by 1.22.","e_en":"3.4.2.3: the Waglan Island data already carries enough conservatism, so simplified-procedure qp \"should remain unchanged\". 1.22 applies only to the full procedure (Kpc).","doc":"sdm-2013","pp":"43"},{"id":"BR-043","t":"mcq","d":3,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.3.5(1)","p":49,"q":"檢查傾覆時，如豎向交通荷載有抵消作用，公路橋上該荷載限於一條車道，且不多於？","e":"3.4.3.5(1)(a)：不多於 6 kN/m（每米橋長），並取 γQ = 1.0（3.4.3.5(2)）。窄橋/天橋的傾覆及支座上拔檢查常用。","x":"on highway bridges, not more than 6 kN/m of bridge","tier":"常考","ex":"bridge","o":["3 kN/m","6 kN/m","10 kN/m","12 kN/m"],"a":1,"q_en":"When checking overturning, if vertical traffic has a relieving effect, it is limited to one notional lane and on highway bridges to not more than?","e_en":"3.4.3.5(1)(a): not more than 6 kN/m of bridge, with γQ = 1.0 (3.4.3.5(2)). Used in overturning and bearing uplift checks of narrow bridges/footbridges.","doc":"sdm-2013","pp":"47"},{"id":"BR-044","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.5(2)","p":52,"q":"不需要動力響應程序（dynamic response procedure）的橋，尺寸系數 cs 及動力系數 cd 應取？","e":"3.4.5(2)：cs = cd = 1.0。同時 3.4.5(1) 規定不可使用 BS EN 1991-1-4 Clause 8.3.2(1) 的簡化方法。","x":"shall both be taken as 1.0 for bridges that a","tier":"常考","ex":"bridge","o":["cs = 0.9，cd = 1.1","cscd = 1.2","均按 BS EN 1991-1-4 計算","均為 1.0"],"a":3,"q_en":"For bridges not needing a dynamic response procedure, what are the size factor cs and dynamic factor cd?","o_en":["cs = 0.9, cd = 1.1","cscd = 1.2","Both calculated per BS EN 1991-1-4","Both 1.0"],"e_en":"3.4.5(2): cs = cd = 1.0. Also 3.4.5(1): the simplified method of BS EN 1991-1-4 Clause 8.3.2(1) shall not be followed.","doc":"sdm-2013","pp":"50"},{"id":"BR-045","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.7(3)","p":59,"q":"計算公路橋「有交通」的風荷載參考面積時，車輛高度應由行車道面起取？","e":"3.4.7(3)：公路橋以 2.5 m 取代 BS EN 1991-1-4 的 2 m。行人/單車橋則用 1.25 m（3.4.7(4)）。","x":"For road bridges, a height of 2.5m from the level of the carriageway","tier":"必考","ex":"bridge","o":["1.25 m","2.0 m","2.5 m","3.0 m"],"a":2,"q_en":"For the wind reference area of road bridges with traffic, what height from the carriageway level represents the vehicles?","e_en":"3.4.7(3): road bridges use 2.5 m in place of the 2 m of BS EN 1991-1-4. Footway/cycle track bridges use 1.25 m (3.4.7(4)).","doc":"sdm-2013","pp":"57"},{"id":"BR-046","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.7(4)","p":60,"q":"行人/單車橋計算有人群時的風荷載參考面積，應由面層起加多少高度？","e":"3.4.7(4)：1.25 m。公路橋為 2.5 m。","x":"a height of 1.25m from the level of the finishing","tier":"必考","ex":"bridge","o":["2.0 m","1.1 m","1.25 m","2.5 m"],"a":2,"q_en":"For footway/cycle track bridges, what height from the finishing level is used for the wind reference area?","e_en":"3.4.7(4): 1.25 m. Road bridges use 2.5 m.","doc":"sdm-2013","pp":"58"},{"id":"BR-047","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.6.5(1)","p":54,"q":"為何有蓋行人天橋的風力要按 SDM 3.4.6.5 而非 BS EN 1991-1-4 計算？","e":"3.4.6.5(1)：政府政策要求天橋有蓋或可日後加蓋；BS EN 1991-1-4 的條文只適用於無蓋橋，所以要用 SDM Table 3.13–3.16 的風洞試驗系數。2023、2025 年題目都是有蓋天橋。","x":"are only applicable to uncovered bridges","tier":"必考","ex":"bridge","o":["有蓋天橋一律要做風洞試驗","有蓋天橋的風壓較低可以折減","BS EN 1991-1-4 的風力規定只適用於無蓋橋樑","BS EN 1991-1-4 只適用於鋼橋"],"a":2,"q_en":"Why must wind on covered footbridges follow SDM 3.4.6.5 rather than BS EN 1991-1-4?","o_en":["Covered footbridges always need wind tunnel tests","Covered footbridges have lower pressure that may be reduced","The BS EN 1991-1-4 wind provisions only apply to uncovered bridges","BS EN 1991-1-4 only applies to steel bridges"],"e_en":"3.4.6.5(1): government policy requires footbridges to be covered or allow future covers; BS EN 1991-1-4 provisions apply only to uncovered bridges, so use the wind tunnel coefficients in SDM Table 3.13–3.16. The 2023 and 2025 questions were both covered footbridges.","doc":"sdm-2013","pp":"52"},{"id":"BR-048","t":"mcq","d":3,"tp":"橋樑風荷載 Wind actions on bridges","c":"Table 3.13","p":56,"q":"SDM Table 3.13 中，「板式橋面（Slab）+ 平屋頂（Flat Roof）」有蓋天橋（deck with roof）的 cf,x 為？","e":"Table 3.13（−5° ≤ α ≤ +5°）：Slab + Flat Roof（deck with roof）= 2.1；roof only = 1.8。橋面及欄杆的橫向風 = deck with roof 減 roof only。","x":"Slab 2.1 1.6 1.8 1.8 0.9 0.9","tier":"常考","ex":"bridge","o":["2.1","0.9","1.3","1.6"],"a":0,"q_en":"In SDM Table 3.13, what is cf,x for a covered footbridge \"Slab deck with Flat Roof\" (deck with roof)?","e_en":"Table 3.13 (−5° ≤ α ≤ +5°): Slab + Flat Roof (deck with roof) = 2.1; roof only = 1.8. Transverse wind on deck and parapet = deck with roof minus roof only.","doc":"sdm-2013","pp":"54"},{"id":"BR-049","t":"mcq","d":3,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.6.5(6)","p":57,"q":"有蓋天橋的樓梯（及斜道）的 cf,x 應取？","e":"3.4.6.5(6)(7)：風洞試驗顯示樓梯受風大於主跨：cf,x = 1.2 × Table 3.13/3.15 值；cf,z = +1.7 或 −1.1；cf,y = 2.35。斜道同樣適用。2021、2025 年題目都有斜道。","x":"cf,x = 1.2 x force coefficient given in Table 3.13 and Table 3.15","tier":"常考","ex":"bridge","o":["與主跨相同","固定取 2.35","主跨系數的 0.8 倍","Table 3.13/3.15 系數的 1.2 倍"],"a":3,"q_en":"What cf,x is used for stairways (and ramps) of covered footbridges?","o_en":["Same as the main span","Always 2.35","0.8 × the main span coefficient","1.2 × the coefficient of Table 3.13/3.15"],"e_en":"3.4.6.5(6)(7): tests show stairways attract more wind than the main span: cf,x = 1.2 × Table 3.13/3.15, cf,z = +1.7 or −1.1, cf,y = 2.35. The same applies to ramps. The 2021 and 2025 questions both had ramps.","doc":"sdm-2013","pp":"55"},{"id":"BR-050","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.7(5)","p":60,"q":"計算樓梯及斜道的豎向風荷載時，平面面積應取？","e":"3.4.7(5)：用斜面面積（inclined area），不是水平投影面積。","x":"shall be the inclined area of the deck, not the projected area of the deck in plan","tier":"常考","ex":"bridge","o":["屋頂面積","斜面面積的一半","橋面的斜面面積","橋面的水平投影面積"],"a":2,"q_en":"For stairways and ramps, what plan area is used to obtain the vertical wind load?","o_en":["The roof area","Half the inclined area","The inclined area of the deck","The projected area of the deck in plan"],"e_en":"3.4.7(5): use the inclined area, not the projected plan area.","doc":"sdm-2013","pp":"58"},{"id":"BR-051","t":"mcq","d":2,"tp":"橋樑風荷載 Wind actions on bridges","c":"3.4.8(2)","p":60,"q":"風荷載產生有利（抵消）效應時，ULS 分項系數 γQ 應取？","e":"3.4.8(2)：風的抵消效應 γQ = 1.0。注意 Table 3.4「0 where favourable」是指整個風作用有利時不計入；抵消部分（relieving areas）則按 1.0。","x":"For relieving effects of wind, γQ shall be taken as 1.0.","tier":"常考","ex":"bridge","o":["1.0","0","1.55","0.9"],"a":0,"q_en":"For relieving effects of wind, what ULS partial factor γQ is used?","e_en":"3.4.8(2): γQ = 1.0 for relieving effects of wind. Note Table 3.4 \"0 where favourable\" is for the whole wind action being favourable; relieving parts use 1.0.","doc":"sdm-2013","pp":"58"},{"id":"BR-060","t":"mcq","d":2,"tp":"溫度作用 Temperature effects","c":"Table 3.17","p":62,"q":"按 SDM Table 3.17（已計入氣候變化），Type 3 上部結構（混凝土橋面）一般結構的最高均勻橋溫 Te,max 為？","e":"Table 3.17 一般結構：Type 1（鋼橋面）0 / 55 °C、Type 2（鋼梁上混凝土橋面）0 / 48 °C、Type 3（混凝土）0 / 45 °C。43 °C 是 Type 3 的 minor structures。","x":"1 0 55 0 53 2 0 48 0 46 3 0 45 0 43","tier":"常考","ex":"bridge","o":["55 °C","43 °C","48 °C","45 °C"],"a":3,"q_en":"Per SDM Table 3.17 (with climate change effects), what is the maximum uniform bridge temperature Te,max for a Type 3 superstructure (concrete deck), normal structures?","e_en":"Table 3.17 normal structures: Type 1 (steel deck) 0 / 55 °C, Type 2 (concrete deck on steel girders) 0 / 48 °C, Type 3 (concrete) 0 / 45 °C. 43 °C is Type 3 minor structures.","doc":"sdm-2013","pp":"60"},{"id":"BR-061","t":"mcq","d":2,"tp":"溫度作用 Temperature effects","c":"3.5.2(3)","p":62,"q":"以下哪一項可使用 Table 3.17 中「minor structures」的均勻溫度？","e":"3.5.2(3)：minor structures 溫度適用於 (a) 行人/單車橋、(b) 行車道伸縮縫等在使用年限內可能更換的設備、(c) 架設荷載。","x":"(a) foot/cycle track bridges,","tier":"常考","ex":"bridge","o":["跨度少於 20 m 的公路橋","鐵路橋","行人/單車橋","所有混凝土公路橋"],"a":2,"q_en":"Which of the following may use the \"minor structures\" uniform temperatures of Table 3.17?","o_en":["Road bridges with spans less than 20 m","Railway bridges","Foot/cycle track bridges","All concrete road bridges"],"e_en":"3.5.2(3): minor-structure temperatures apply to (a) foot/cycle track bridges, (b) carriageway joints and similar equipment likely to be replaced, (c) erection loading.","doc":"sdm-2013","pp":"60"},{"id":"BR-062","t":"mcq","d":3,"tp":"溫度作用 Temperature effects","c":"3.5.2(6)","p":63,"q":"按 SDM，計算收縮至最低均勻橋溫及膨脹至最高均勻橋溫時，初始橋溫 T0 分別取？","e":"3.5.2(6)：收縮用 T0 = 30 °C、膨脹用 T0 = 10 °C（兩者都取最不利）。例：Type 3 混凝土橋 ΔTN,exp = 45 − 10 = 35 °C；ΔTN,con = 30 − 0 = 30 °C。20 °C 是 Table 9.1 伸縮縫安裝時的平均溫度，不要混淆。","x":"shall be taken as 30ºC for calculating contraction down to the minimum uniform bridge temperature component and 10ºC for calculating","tier":"常考","ex":"bridge","o":["收縮取 30 °C，膨脹取 10 °C","收縮取 10 °C，膨脹取 30 °C","均取 20 °C","均取 15 °C"],"a":0,"q_en":"Per the SDM, what initial bridge temperature T0 is used for contraction down to the minimum and for expansion up to the maximum uniform bridge temperature?","o_en":["30 °C for contraction, 10 °C for expansion","10 °C for contraction, 30 °C for expansion","20 °C for both","15 °C for both"],"e_en":"3.5.2(6): T0 = 30 °C for contraction and 10 °C for expansion (both worst-case). E.g. Type 3 concrete bridge ΔTN,exp = 45 − 10 = 35 °C; ΔTN,con = 30 − 0 = 30 °C. 20 °C is the mean setting temperature for joints in Table 9.1; do not confuse them.","doc":"sdm-2013","pp":"61"},{"id":"BR-063","t":"mcq","d":1,"tp":"溫度作用 Temperature effects","c":"3.5.5","p":67,"q":"按 SDM 3.5.5，混凝土及結構鋼的線膨脹系數分別為？","e":"鋼 12 × 10⁻⁶、混凝土 10 × 10⁻⁶ 每 °C。考試計伸縮縫/支座位移：Δ = α × ΔT × L。","x":"12 x 10-6 per ºC for structural steel and 10 x 10-6 per ºC for concrete","tier":"必考","ex":"bridge","o":["混凝土 10 × 10⁻⁶ /°C；鋼 12 × 10⁻⁶ /°C","均為 10 × 10⁻⁶ /°C","均為 12 × 10⁻⁶ /°C","混凝土 12 × 10⁻⁶ /°C；鋼 10 × 10⁻⁶ /°C"],"a":0,"q_en":"Per SDM 3.5.5, what are the coefficients of thermal expansion for concrete and structural steel?","o_en":["Concrete 10 × 10⁻⁶ /°C; steel 12 × 10⁻⁶ /°C","Both 10 × 10⁻⁶ /°C","Both 12 × 10⁻⁶ /°C","Concrete 12 × 10⁻⁶ /°C; steel 10 × 10⁻⁶ /°C"],"e_en":"Steel 12 × 10⁻⁶, concrete 10 × 10⁻⁶ per °C. Exam joint/bearing movement: Δ = α × ΔT × L.","doc":"sdm-2013","pp":"65"},{"id":"BR-064","t":"mcq","d":3,"tp":"溫度作用 Temperature effects","c":"3.5.5; 3.5.2(6)","p":67,"q":"一道 60 m 長的連續混凝土橋面（Type 3，一般結構，Te,max = 45 °C），由固定支座量起，膨脹位移約為？（α = 10 × 10⁻⁶ /°C，T0 = 10 °C）","e":"ΔTN,exp = 45 − 10 = 35 °C；Δ = 10 × 10⁻⁶ × 35 × 60000 mm = 21 mm。27 mm 是誤用 α = 12 × 10⁻⁶ 及 ΔT = 37.5；15 mm 是誤用 ΔT = 25 °C（T0 = 20）。","x":"12 x 10-6 per ºC for structural steel and 10 x 10-6 per ºC for concrete","tier":"常考","ex":"bridge","o":["21 mm","15 mm","27 mm","33 mm"],"a":0,"q_en":"A 60 m long continuous concrete deck (Type 3, normal structure, Te,max = 45 °C), measured from the fixed bearing: approximately what is the expansion movement? (α = 10 × 10⁻⁶ /°C, T0 = 10 °C)","e_en":"ΔTN,exp = 45 − 10 = 35 °C; Δ = 10 × 10⁻⁶ × 35 × 60000 mm = 21 mm. 27 mm comes from wrongly using α = 12 × 10⁻⁶ and ΔT = 37.5; 15 mm from wrongly using ΔT = 25 °C (T0 = 20).","doc":"sdm-2013","pp":"65"},{"id":"BR-066","t":"mcq","d":2,"tp":"溫度作用 Temperature effects","c":"3.5.3(1)","p":63,"q":"SDM 要求以哪一方法考慮上部結構的豎向溫差？","e":"3.5.3(1)：用 Approach 2（非線性），ΔT 取自 SDM Figure 3.2；BS EN 1991-1-5 Figures 6.2a–6.2c 不可用。","x":"i.e. Approach 2","tier":"偶考","ex":"bridge","o":["只用線性溫差（Approach 1）","非線性溫差分量（BS EN 1991-1-5 的 Approach 2），數值取自 SDM Figure 3.2","香港可忽略溫差","按 BS EN 1991-1-5 Figure 6.2a–c"],"a":1,"q_en":"How does the SDM require vertical temperature differences in the superstructure to be considered?","o_en":["Linear difference only (Approach 1)","Non-linear temperature difference component (Approach 2 of BS EN 1991-1-5) with values from SDM Figure 3.2","Temperature differences may be ignored in Hong Kong","Per BS EN 1991-1-5 Figure 6.2a–c"],"e_en":"3.5.3(1): use Approach 2 (non-linear) with ΔT from SDM Figure 3.2; BS EN 1991-1-5 Figures 6.2a to 6.2c shall not be used.","doc":"sdm-2013","pp":"61"},{"id":"BR-067","t":"tf","d":2,"tp":"溫度作用 Temperature effects","c":"3.5.4","p":67,"q":"SDM 規定均勻溫度與溫差同時作用時，ωN 及 ωM 取 1.0。","e":"3.5.4：BS EN 1991-1-5 Clause 6.1.5 的 ωN、ωM 建議值不可用，兩者均取 1.0。","x":"ωN and ωM shall be taken as 1.0","tier":"偶考","ex":"bridge","a":true,"q_en":"The SDM requires ωN and ωM to be taken as 1.0 for the simultaneity of uniform and temperature difference components.","e_en":"3.5.4: the ωN and ωM values in BS EN 1991-1-5 Clause 6.1.5 are not used; both are 1.0.","doc":"sdm-2013","pp":"65"},{"id":"BR-070","t":"mcq","d":2,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.24","p":71,"q":"SDM Table 3.24 中，公路橋支承（橋墩）受車輛撞擊的主荷載分量（main load component）為？","e":"主荷載：1650 kN（行車方向）/ 825 kN（垂直方向），作用於行車道面以上 0.75 m 至 1.5 m 最不利點；殘餘荷載 825 / 415 kN，作用於 1 m 至 3 m。Fdx 與 Fdy 分開考慮。跨路橋的橋墩尺寸常由此控制。","x":"Main load At the most severe point between 0.75m 1650 825","tier":"常考","ex":"bridge","o":["Fdx = 1650 kN，Fdy = 825 kN","Fdx = 825 kN，Fdy = 415 kN","Fdx = Fdy = 250 kN","Fdx = 1000 kN，Fdy = 500 kN"],"a":0,"q_en":"In SDM Table 3.24, what is the main load component of vehicular impact on supports of road bridges?","o_en":["Fdx = 1650 kN, Fdy = 825 kN","Fdx = 825 kN, Fdy = 415 kN","Fdx = Fdy = 250 kN","Fdx = 1000 kN, Fdy = 500 kN"],"e_en":"Main load: 1650 kN (direction of travel) / 825 kN (perpendicular), at the most severe point 0.75 m to 1.5 m above carriageway; residual 825 / 415 kN at 1 m to 3 m. Fdx and Fdy are considered separately. Pier sizes of bridges over roads are often governed by this.","doc":"sdm-2013","pp":"69"},{"id":"BR-071","t":"mcq","d":3,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.24 Note (2)","p":71,"q":"公路橋跨越限速 ≥ 72 km/h 的道路，而風險排序系數 Rde > 2.4 且支承未有 L3 防撞欄保護，調整系數 Fa 為？","e":"Table 3.24 Note (2)：限速 < 72 kph 或 Rde ≤ 2.4 → Fa = 1.0；限速 ≥ 72 kph 且 Rde > 2.4 → Fa = 2.0；如有全工作寬度的 L3 防撞欄保護 → 1.0。","x":"Fa = 2.0 for bridges over roads where speed limit ≥ 72kph and R de > Ta = 2.4","tier":"常考","ex":"bridge","o":["2.0","1.0","1.5","0.5"],"a":0,"q_en":"For road bridges over roads with speed limit ≥ 72 kph where Rde > 2.4 and supports are not protected by L3 barriers, what is the adjustment factor Fa?","e_en":"Table 3.24 Note (2): speed limit < 72 kph or Rde ≤ 2.4 → Fa = 1.0; ≥ 72 kph and Rde > 2.4 → Fa = 2.0; with L3 barriers of full working width → 1.0.","doc":"sdm-2013","pp":"69"},{"id":"BR-072","t":"mcq","d":3,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.25","p":72,"q":"行人/單車天橋跨越限速 < 72 km/h 的道路，支承受撞擊的主荷載分量為？","e":"Table 3.25：限速 ≥ 72 kph 與公路橋相同（1650/825）；< 72 kph 為 825/415（殘餘 415/205）；最低穩健力 165/165。天橋題（2021、2023 跨路）橋墩設計要用。","x":"For foot/cycle track bridges over roads where speed limit < 72kph","tier":"常考","ex":"bridge","o":["Fdx = 825 kN，Fdy = 415 kN","Fdx = Fdy = 165 kN","Fdx = 1650 kN，Fdy = 825 kN","Fdx = 410 kN，Fdy = 205 kN"],"a":0,"q_en":"For foot/cycle track bridges over roads with speed limit < 72 kph, what is the main load component of impact on supports?","o_en":["Fdx = 825 kN, Fdy = 415 kN","Fdx = Fdy = 165 kN","Fdx = 1650 kN, Fdy = 825 kN","Fdx = 410 kN, Fdy = 205 kN"],"e_en":"Table 3.25: speed ≥ 72 kph same as road bridges (1650/825); < 72 kph 825/415 (residual 415/205); minimum robustness 165/165. Needed for piers in footbridge questions over roads (2021, 2023).","doc":"sdm-2013","pp":"70"},{"id":"BR-073","t":"mcq","d":3,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.27","p":74,"q":"SDM Table 3.27 中，車輛撞擊公路橋上部結構（橋面側面或底面）的等效靜力為？","e":"上部結構 825/415 kN；行人/單車天橋跨越限速 ≤ 72 kph 道路時為 410/205 kN（Note (1)）。按 rF（h0 = 5.7 m、h1 = 6.0 m）折減；無論如何橋面都要有足夠約束防止被撞離支座。","x":"Fdx and Fdy shall be taken as 410 kN and 205 kN respectively","tier":"常考","ex":"bridge","o":["Fdx = 410 kN，Fdy = 205 kN","Fdx = 1650 kN，Fdy = 825 kN","Fdx = 825 kN，Fdy = 415 kN","Fdx = Fdy = 500 kN"],"a":2,"q_en":"In SDM Table 3.27, what are the equivalent static forces for vehicular impact on road bridge superstructures?","o_en":["Fdx = 410 kN, Fdy = 205 kN","Fdx = 1650 kN, Fdy = 825 kN","Fdx = 825 kN, Fdy = 415 kN","Fdx = Fdy = 500 kN"],"e_en":"Superstructure 825/415 kN; foot/cycle bridges over roads with speed limit ≤ 72 kph 410/205 kN (Note (1)). Reduced by rF (h0 = 5.7 m, h1 = 6.0 m); in all cases the deck must be restrained from being knocked off its supports.","doc":"sdm-2013","pp":"72"},{"id":"BR-074","t":"mcq","d":3,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.27 Note (2)","p":74,"q":"計算上部結構撞擊力的折減系數 rF 時，h0 及 h1 分別取？","e":"Table 3.27 Note (2)：h0 = 5.7 m、h1 = 6.0 m（已補償豎曲線及撓度）。即淨空 5.1 m 的新橋仍要承受上部結構撞擊力。","x":"with the h0 and h1 taken as 5.7 m and 6.0 m respectively","tier":"偶考","ex":"bridge","o":["5.1 m 及 5.5 m","4.7 m 及 5.1 m","5.7 m 及 6.0 m","5.0 m 及 5.4 m"],"a":2,"q_en":"For the superstructure impact reduction factor rF, what are h0 and h1?","o_en":["5.1 m and 5.5 m","4.7 m and 5.1 m","5.7 m and 6.0 m","5.0 m and 5.4 m"],"e_en":"Table 3.27 Note (2): h0 = 5.7 m, h1 = 6.0 m (after compensating vertical curvature and deflection). So a new bridge with 5.1 m headroom must still resist superstructure impact.","doc":"sdm-2013","pp":"72"},{"id":"BR-075","t":"mcq","d":2,"tp":"車輛撞擊 Vehicle collision","c":"3.6.1(3)(a)","p":67,"q":"SDM 3.6.1 對橋面受意外作用（撞擊）後的最基本要求是？","e":"3.6.1(2)(3)：整體完整性要保持，可接受局部損壞；橋面不可升起或滑離支座。多梁橋面：任何一條梁失效整體不可倒塌。","x":"The bridge deck must not lift or slide off its bearings.","tier":"常考","ex":"bridge","o":["橋面不可升起或滑離支座","必須即時可通車","不可有任何局部損壞","所有構件保持彈性"],"a":0,"q_en":"What is the most basic SDM 3.6.1 requirement for bridge decks after accidental actions (impact)?","o_en":["The bridge deck must not lift or slide off its bearings","Must remain open to traffic immediately","No local damage at all","All members remain elastic"],"e_en":"3.6.1(2)(3): overall integrity maintained, local damage acceptable; the deck must not lift or slide off its bearings. Multi-beam decks: no collapse with any one carrying member assumed failed.","doc":"sdm-2013","pp":"65"},{"id":"BR-076","t":"mcq","d":3,"tp":"車輛撞擊 Vehicle collision","c":"10.2(3)","p":128,"q":"鄰近鐵路軌道的車行橋支承，為穩健性須承受的最低靜力為？（作用於鄰近軌面以上 1200 mm 任何水平方向）","e":"10.2(3)：車行橋 1650 kN，行人天橋 825 kN，作用於軌面以上 1200 mm。2020 年鐵路高架橋及 2019 年跨鐵路天橋都相關。","x":"a minimum static design force of 1650 kN in case of vehicular bridges, and","tier":"常考","ex":"bridge","o":["415 kN","2000 kN","825 kN","1650 kN"],"a":3,"q_en":"For robustness, what minimum static design force must supports of vehicular bridges adjacent to rail traffic withstand (horizontally in any direction, 1200 mm above adjacent rail level)?","e_en":"10.2(3): 1650 kN for vehicular bridges, 825 kN for footbridges, at 1200 mm above rail level. Relevant to the 2020 railway viaduct and 2019 footbridge over a railway.","doc":"sdm-2013","pp":"126"},{"id":"BR-077","t":"mcq","d":2,"tp":"車輛撞擊 Vehicle collision","c":"10.2(2)","p":127,"q":"為防脫軌列車撞擊，鐵路跨線橋的支承最好距離最近路軌中線至少？","e":"10.2(2)：最好至少 5 m。做不到時：支承不可上下都鉸接、設 1000 mm 高實心墩座（cut-water 形）、柱群失去一柱不可導致失效。","x":"preferably at least 5 m from the centre line of the nearest track","tier":"常考","ex":"bridge","o":["8 m","4.5 m","3 m","5 m"],"a":3,"q_en":"To guard against derailed trains, supports of railway overbridges should preferably be sited at least how far from the centre line of the nearest track?","e_en":"10.2(2): preferably at least 5 m. If not possible: supports not pin-jointed top and bottom, 1000 mm high solid plinth with cut-water ends, and loss of one column in a group must not cause failure.","doc":"sdm-2013","pp":"125"},{"id":"BR-078","t":"mcq","d":2,"tp":"車輛撞擊 Vehicle collision","c":"Table 3.30","p":79,"q":"SDM Table 3.30 中，L4 鋼筋混凝土牆式護欄（Class D）計算整體效應的橫向撞擊力為？","e":"Table 3.30：Class A 100 kN（L1/L2 金屬）、B 200 kN（L1/L2 組合）、C 400 kN（L3 金屬）、D 600 kN（L3 組合及 L4 RC 牆），C 及 D 另有縱向 100 kN、豎向 175 kN。","x":"D 600 100 175 L4 Reinforced Concrete","tier":"偶考","ex":"bridge","o":["200 kN","400 kN","600 kN","100 kN"],"a":2,"q_en":"In SDM Table 3.30, what transverse collision force is used for global effects of L4 reinforced concrete wall parapets (Class D)?","e_en":"Table 3.30: Class A 100 kN (L1/L2 metal), B 200 kN (L1/L2 composite), C 400 kN (L3 metal), D 600 kN (L3 composite and L4 RC wall), with C and D also 100 kN longitudinal and 175 kN vertical.","doc":"sdm-2013","pp":"77"},{"id":"BR-080","t":"mcq","d":2,"tp":"交通荷載 Traffic loads","c":"3.7.2.2(1), Table 3.28","p":76,"q":"2024 年題目要求「LM1 and LM3 with SV196」。按 SDM Table 3.28，LM1 第 1 車道的調整系數 αQ1 及 αq1（一般情況）為？","e":"Table 3.28（一般）：Lane 1 αQ1 = 1.20、αq1 = 0.53；Lane 2/3 αQ = 1.00、αq = 1.91；其餘車道及剩餘面積 αq = 1.91。UK NA Table NA.1 的系數不可用。","x":"Lane 1 αQ1 = 1.20 αq1 = 0.53","tier":"必考","ex":"bridge","o":["αQ1 = 1.44，αq1 = 0.64","αQ1 = 1.00，αq1 = 1.91","αQ1 = 1.00，αq1 = 1.00","αQ1 = 1.20，αq1 = 0.53"],"a":3,"q_en":"The 2024 question required \"LM1 and LM3 with SV196\". Per SDM Table 3.28, what are the LM1 Lane 1 adjustment factors αQ1 and αq1 (general case)?","o_en":["αQ1 = 1.44, αq1 = 0.64","αQ1 = 1.00, αq1 = 1.91","αQ1 = 1.00, αq1 = 1.00","αQ1 = 1.20, αq1 = 0.53"],"e_en":"Table 3.28 (general): Lane 1 αQ1 = 1.20, αq1 = 0.53; Lanes 2/3 αQ = 1.00, αq = 1.91; other lanes and remaining area αq = 1.91. The UK NA Table NA.1 factors shall not be used.","doc":"sdm-2013","pp":"74"},{"id":"BR-081","t":"mcq","d":3,"tp":"交通荷載 Traffic loads","c":"3.7.2.2(1), Table 3.28","p":76,"q":"什麼情況下 LM1 改用 αQ1 = 1.44、αq1 = 0.64 等系數？","e":"Table 3.28：loaded length < 60 m 且 N ≥ 6 時用 αQ1 = 1.44、αq1 = 0.64、Lane 2/3 αQ = 1.20、αq = 2.30。N 為橋上車道總數（雙程路計全部車道；單程橋取車道數兩倍）。另 3.7.2.2(2)：LM1 對加載長度 > 200 m 屬偏安全。","x":"Where the loaded length is less than 60 m and N is greater than or equal to 6","tier":"常考","ex":"bridge","o":["單車道橋","加載長度大於 200 m","所有郊區道路","加載長度少於 60 m 且車道總數 N ≥ 6"],"a":3,"q_en":"When are the LM1 factors αQ1 = 1.44, αq1 = 0.64 etc. used instead?","o_en":["Single-lane bridges","Loaded length greater than 200 m","All rural roads","Loaded length less than 60 m and total notional lanes N ≥ 6"],"e_en":"Table 3.28: for loaded length < 60 m and N ≥ 6 use αQ1 = 1.44, αq1 = 0.64, Lanes 2/3 αQ = 1.20, αq = 2.30. N is the total notional lanes on the bridge (all lanes of dual carriageways; twice the lanes for one-way bridges). Also 3.7.2.2(2): LM1 is safe-sided for loaded lengths > 200 m.","doc":"sdm-2013","pp":"74"},{"id":"BR-082","t":"tf","d":2,"tp":"交通荷載 Traffic loads","c":"Table 3.28 Note (1)","p":76,"q":"計算制動力（braking force）時，LM1 的 αq1 應取 1.0，而不是 0.53。","e":"Table 3.28 Note (1)：計算制動力時 αq1 = 1.0。","x":"αq1 shall be taken as 1.0 when determining the braking force","tier":"常考","ex":"bridge","a":true,"q_en":"For calculating the braking force, αq1 of LM1 shall be taken as 1.0, not 0.53.","e_en":"Table 3.28 Note (1): αq1 = 1.0 when determining the braking force.","doc":"sdm-2013","pp":"74"},{"id":"BR-083","t":"mcq","d":2,"tp":"交通荷載 Traffic loads","c":"3.7.2.4","p":77,"q":"SDM 中的 LM3（特別車輛）是指？","e":"3.7.2.4(1)：LM3 取 UK NA 的 SV196；其他 STGO 車輛或 SOV 須經 CHE/B&S 同意才用。3.7.2.4(2)：跨度 < 15 m、位於幹道或主要道路以外的郊區道路上的結構可不計 LM3。舊版 HA/HB 已由 LM1/LM3 取代。","x":"Load Model 3 (LM3) shall be taken as the SV196","tier":"必考","ex":"bridge","o":["HB 45 單位","人群荷載 5 kN/m²","SV196（STGO 特別車輛）","60 kN/m 鐵路荷載"],"a":2,"q_en":"What is LM3 (special vehicles) in the SDM?","o_en":["HB 45 units","Crowd loading 5 kN/m²","SV196 (STGO special vehicle)","60 kN/m railway loading"],"e_en":"3.7.2.4(1): LM3 is SV196 of the UK NA; other STGO vehicles or SOV only if agreed with CHE/B&S. 3.7.2.4(2): LM3 may be disregarded for structures spanning less than 15 m on rural roads other than trunk or main roads. The old HA/HB has been replaced by LM1/LM3.","doc":"sdm-2013","pp":"75"},{"id":"BR-084","t":"mcq","d":2,"tp":"交通荷載 Traffic loads","c":"3.7.2.5","p":77,"q":"按 SDM 3.7.2.5，公路橋的 LM4 人群荷載應如何處理？","e":"3.7.2.5：LM4 = 5 kN/m²，只在有可能出現人群時才考慮，須按項目商定。2016、2017 年題目亦直接給出行人路 5 kPa。","x":"equivalent to 5 kN/m2, need only be considered where there is a probability of such loading","tier":"常考","ex":"bridge","o":["香港不採用 LM4","所有公路橋一律加 5 kN/m²","相當於 2.5 kN/m²，所有橋須考慮","相當於 5 kN/m²，只在有可能出現該荷載時考慮，須按個別項目商定"],"a":3,"q_en":"Per SDM 3.7.2.5, how is the LM4 crowd loading treated on road bridges?","o_en":["LM4 is not used in Hong Kong","Always add 5 kN/m² to all road bridges","Equivalent to 2.5 kN/m², always considered","Equivalent to 5 kN/m², only considered where such loading is probable, agreed project-specifically"],"e_en":"3.7.2.5: LM4 = 5 kN/m², only considered where such loading is probable, agreed on a project-specific basis. The 2016 and 2017 questions also gave 5 kPa directly for footways.","doc":"sdm-2013","pp":"75"},{"id":"BR-085","t":"mcq","d":3,"tp":"交通荷載 Traffic loads","c":"3.7.2.7, Table 3.29","p":78,"q":"SDM Table 3.29 交通荷載組別中，以 LM3 特別車輛（特徵值）配合 LM1 頻遇值的組別是？","e":"Table 3.29：gr5 = LM1 頻遇值 + LM3 特徵值；gr2 = LM1 頻遇值 + 制動/離心水平力；gr4 = 人群荷載。頻遇值的 ψ1 按 3.2.1 取。UK NA Table NA.3 不可用。","x":"gr5 Frequent(2) Characteristic","tier":"常考","ex":"bridge","o":["gr5","gr4","gr1a","gr2"],"a":0,"q_en":"In SDM Table 3.29, which group combines the LM3 special vehicle (characteristic) with the frequent value of LM1?","e_en":"Table 3.29: gr5 = LM1 frequent + LM3 characteristic; gr2 = LM1 frequent + braking/centrifugal horizontal forces; gr4 = crowd loading. ψ1 for frequent values per 3.2.1. UK NA Table NA.3 shall not be used.","doc":"sdm-2013","pp":"76"},{"id":"BR-086","t":"mcq","d":2,"tp":"行人天橋振動 Footbridge vibration","c":"3.7.2.12(3)","p":80,"q":"SDM 要求公路結構的自然頻率盡量避開哪一範圍，以免與行駛車輛共振？","e":"3.7.2.12(3)：交通激振頻率一般 2–5 Hz，結構自然頻率應盡量在此範圍以外（香港曾有塞車時被鄰線車輛引起振動的投訴）。0.5–1.1 Hz 是行人天橋側向響應範圍。","x":"forcing frequencies generally range between 2 Hz and 5 Hz","tier":"常考","ex":"bridge","o":["1.5 Hz 至 2.5 Hz","2 Hz 至 5 Hz","0.5 Hz 至 1.1 Hz","5 Hz 至 10 Hz"],"a":1,"q_en":"Which range does the SDM require natural frequencies of highway structures to avoid as far as possible, to prevent resonance with passing traffic?","o_en":["1.5 Hz to 2.5 Hz","2 Hz to 5 Hz","0.5 Hz to 1.1 Hz","5 Hz to 10 Hz"],"e_en":"3.7.2.12(3): traffic forcing frequencies generally range between 2 Hz and 5 Hz, and natural frequencies should lie outside this range as far as possible (Hong Kong has had complaints from occupants of stalled traffic shaken by traffic in a neighbouring lane). 0.5–1.1 Hz is the footbridge lateral response range.","doc":"sdm-2013","pp":"78"},{"id":"BR-087","t":"mcq","d":3,"tp":"行人天橋振動 Footbridge vibration","c":"3.7.3.3(1)","p":80,"q":"2021 年題目要求評估天橋的活載振動。按 SDM 3.7.3.3(1)，香港所有行人天橋的行人動力模型須用哪一 Bridge Class？","e":"3.7.3.3(1)：香港所有天橋用 Class D（UK NA Table NA.7）：行走組 N = 16、跑步組 N = 4、人群密度 1.5 人/m²。3.7.3.3(3)：豎向加速度限值的 k4 不大於 1.0。","x":"Bridge Class D given in Table NA.7 in UK NA to BS EN 1991-2","tier":"常考","ex":"bridge","o":["Class A（郊區）","Class B","Class D（行走 N = 16、跑步 N = 4、1.5 人/m²）","Class C"],"a":2,"q_en":"The 2021 question asked about live-load vibration of a footbridge. Per SDM 3.7.3.3(1), which Bridge Class must be used for the pedestrian dynamic models of all Hong Kong footbridges?","o_en":["Class A (rural)","Class B","Class D (walking N = 16, jogging N = 4, 1.5 persons/m²)","Class C"],"e_en":"3.7.3.3(1): all Hong Kong footbridges use Class D (UK NA Table NA.7): walking N = 16, jogging N = 4, crowd density 1.5 persons/m². 3.7.3.3(3): k4 for the vertical acceleration limit is not greater than 1.0.","doc":"sdm-2013","pp":"78"},{"id":"BR-088","t":"mcq","d":3,"tp":"行人天橋振動 Footbridge vibration","c":"3.7.3.3(4)","p":81,"q":"如行人天橋沒有低於多少頻率的顯著橫向模態，可不考慮人群引致的側向響應？","e":"3.7.3.3(4)：沒有 < 1.5 Hz 的顯著橫向模態可不考慮；橫向頻率在 0.5–1.1 Hz 之間的按 NA.2.44.7 檢查；範圍以外須尋求專家意見。","x":"no significant lateral modes with frequencies below 1.5Hz","tier":"偶考","ex":"bridge","o":["5 Hz","1.5 Hz","3 Hz","0.5 Hz"],"a":1,"q_en":"Lateral response due to crowd loading need not be considered if a footbridge has no significant lateral modes below what frequency?","e_en":"3.7.3.3(4): not needed if no significant lateral modes are below 1.5 Hz; lateral frequencies between 0.5 Hz and 1.1 Hz are checked to NA.2.44.7; outside this range specialist advice is sought.","doc":"sdm-2013","pp":"79"},{"id":"BR-089","t":"mcq","d":2,"tp":"交通荷載 Traffic loads","c":"3.7.3.4","p":81,"q":"行人天橋及行人隧道上蓋，除各組合作用外，另須承受的均布荷載為？","e":"3.7.3.4：上蓋另須承受 0.5 kN/m²，作為可變交通作用，並可不與其他可變作用組合。","x":"0.5 kN/m2, which shall be considered as a variable traffic action","tier":"偶考","ex":"bridge","o":["0.5 kN/m²","1.5 kN/m²","5 kN/m²","0.75 kN/m²"],"a":0,"q_en":"Besides the combinations of actions, what uniformly distributed load must footbridge and subway covers resist?","e_en":"3.7.3.4: covers must also resist 0.5 kN/m², treated as a variable traffic action; combination with other variable actions can be ignored.","doc":"sdm-2013","pp":"79"},{"id":"BR-090","t":"mcq","d":1,"tp":"淨空 Headroom","c":"Table 13.1; 13.1(3)","p":165,"q":"2021、2023 年題目的天橋淨空要求都是 5.1 m。按 SDM Table 13.1，新建跨路橋/天橋（供車輛使用）的淨空為？","e":"Table 13.1：新建 5100 mm、維持淨空 5000 mm；13.1(3)：新建值已包括 100 mm 供將來重鋪路面。路牌架 5500 / 5400 mm。13.1(5)：施工期間在足夠標誌下可減至 4700 mm。","x":"Vehicle underpasses Vehicles 5100 5000","tier":"必考","ex":"bridge","o":["4700 mm","5000 mm","5500 mm","5100 mm"],"a":3,"q_en":"The 2021 and 2023 questions both required 5.1 m headroom. Per SDM Table 13.1, what headroom is required for new overbridges/footbridges over vehicles?","e_en":"Table 13.1: new construction 5100 mm, maintained 5000 mm; 13.1(3): the new-construction value includes 100 mm for subsequent resurfacing. Sign gantries 5500 / 5400 mm. 13.1(5): may be reduced to 4700 mm during construction with adequate signing.","doc":"sdm-2013","pp":"163"},{"id":"BR-091","t":"mcq","d":2,"tp":"淨空 Headroom","c":"13.7","p":167,"q":"2019 年天橋跨越鐵路，題目要求淨空 7.0 m。按 SDM 13.7，一般指引是？","e":"13.7：最高軌面以上最少 7 m，以免干擾架空供電設備；確實的水平及豎向淨空須諮詢鐵路當局。Table 13.1：鐵路 7000 mm、輕鐵 6200 / 5800 mm、電車 5600 mm。","x":"a minimum of 7 m clearance above highest rail level","tier":"必考","ex":"bridge","o":["路面以上 5.1 m","最高軌面以上最少 7 m，並須諮詢鐵路當局","軌面以上 6.2 m","軌面以上 5.6 m"],"a":1,"q_en":"The 2019 footbridge over a railway required 7.0 m headroom. What is the general guidance of SDM 13.7?","o_en":["5.1 m above road level","At least 7 m above highest rail level, consulting the railway authority","6.2 m above rail level","5.6 m above rail level"],"e_en":"13.7: minimum 7 m above highest rail level to avoid interference with the overhead energy supply equipment; the precise horizontal and vertical clearances are agreed with the railway authority. Table 13.1: railway 7000 mm, LRT 6200 / 5800 mm, tram 5600 mm.","doc":"sdm-2013","pp":"165"},{"id":"BR-092","t":"mcq","d":2,"tp":"淨空 Headroom","c":"Table 13.1","p":165,"q":"SDM Table 13.1 中，新建路牌架（sign gantry）的淨空為？","e":"路牌架 5500 / 5400 mm（新建 / 維持）。3.6.2.3(2)：路牌架不考慮上部結構撞擊，但須有最少 5.5 m 淨空。","x":"Sign gantries Vehicles 5500 5400","tier":"常考","ex":"bridge","o":["6000 mm","5100 mm","5700 mm","5500 mm"],"a":3,"q_en":"In SDM Table 13.1, what is the headroom for new sign gantries?","e_en":"Sign gantries 5500 / 5400 mm (new / maintained). 3.6.2.3(2): gantries need not consider superstructure impact, but a minimum headroom of 5.5 m is required.","doc":"sdm-2013","pp":"163"},{"id":"BR-093","t":"mcq","d":2,"tp":"淨空 Headroom","c":"Table 13.2","p":165,"q":"設計車速 80 km/h 或以上的道路，構築物（如橋墩）的水平淨距（horizontal clearance）最低及理想值為？","e":"Table 13.2：80 km/h 以上：最低 1000、理想 1500 mm；50–80 km/h 且高度 < 3000 mm：600 / 1250 mm。影響橋墩位置及跨度選擇（評估部分常用）。","x":"80 and above Any 1000 1500","tier":"常考","ex":"bridge","o":["最低 1000 mm，理想 1500 mm","最低 600 mm，理想 1250 mm","最低 500 mm，理想 1000 mm","最低 1500 mm，理想 2000 mm"],"a":0,"q_en":"For roads with design speed 80 km/h and above, what are the minimum and desirable horizontal clearances to structures such as piers?","o_en":["Minimum 1000 mm, desirable 1500 mm","Minimum 600 mm, desirable 1250 mm","Minimum 500 mm, desirable 1000 mm","Minimum 1500 mm, desirable 2000 mm"],"e_en":"Table 13.2: 80 km/h and above: minimum 1000, desirable 1500 mm; above 50 and below 80 km/h with height < 3000 mm: 600 / 1250 mm. Governs pier positions and span choice (often used in the appraisal).","doc":"sdm-2013","pp":"163"},{"id":"BR-094","t":"tf","d":2,"tp":"淨空 Headroom","c":"13.1(5)","p":166,"q":"在行車道上興建架空結構期間，在設有足夠標誌下，維持淨空可減至 4700 mm。","e":"13.1(5)：施工期間可減至 4700 mm，須有足夠標誌。與方法說明及臨時交通管理部分有關（2024 年題目問及臨時交通管理）。","x":"maintained headroom clearance may be reduced to 4700 mm with adequate signing","tier":"常考","ex":"bridge","a":true,"q_en":"During construction of overhead structures across carriageways, the maintained headroom may be reduced to 4700 mm with adequate signing.","e_en":"13.1(5): may be reduced to 4700 mm during construction with adequate signing. Relevant to the method statement and temporary traffic management (asked in the 2024 question).","doc":"sdm-2013","pp":"164"},{"id":"BR-095","t":"mcq","d":3,"tp":"淨空 Headroom","c":"13.3, Table 13.3","p":166,"q":"橋下道路處於凹形豎曲線，凹曲線半徑少於 1000 m，按 SDM Table 13.3 淨空須額外增加？","e":"Table 13.3：< 1000 m → 100 mm；1000 m → 80；1500 m → 55；> 6000 m → 不需。凹曲線半徑按沿行車道 25 m 弦長平均計。13.4 另要計恆載撓度及活載最大跨中撓度；13.2(2) 淨空由最低的燈具、路牌等量起。","x":"results in a sag curve beneath the structure, the headroom shall be increased in accordance with Table 13.3","tier":"偶考","ex":"bridge","o":["100 mm","80 mm","不需增加","55 mm"],"a":0,"q_en":"Where the road under a structure is on a sag curve with sag radius less than 1000 m, by how much must headroom be increased per SDM Table 13.3?","o_en":["100 mm","80 mm","No increase","55 mm"],"e_en":"Table 13.3: < 1000 m → 100 mm; 1000 m → 80; 1500 m → 55; > 6000 m → nil. Sag radius is the mean over a 25 m chord along the carriageway. 13.4 also requires dead load deflection and maximum live load mid-span deflection; 13.2(2) measures headroom from the lowest lighting fixture, sign etc.","doc":"sdm-2013","pp":"164"},{"id":"BR-096","t":"mcq","d":2,"tp":"淨空 Headroom","c":"13.8","p":167,"q":"2018、2023 年題目的橋都跨越排水渠。按 SDM 13.8，跨排水渠的橋要求是？","e":"13.8：橋底（及掛在橋上的管線）須高於設計水位並有足夠 freeboard，亦要考慮潮汐回水；淨空須在設計初期取得渠務署（DSD）同意。","x":"the soffit level is above the designed water level with adequate freeboard","tier":"常考","ex":"bridge","o":["必須高於地面 7 m","橋底高於設計水位並有足夠出水高度（freeboard），並及早取得渠務署同意","無特別要求","橋底須高於平均海平面 5.1 m"],"a":1,"q_en":"The 2018 and 2023 bridges both crossed drainage channels. Per SDM 13.8, what is required of bridges over drainage channels?","o_en":["Must be 7 m above ground","Soffit above the designed water level with adequate freeboard, agreed early with DSD","No special requirement","Soffit 5.1 m above mean sea level"],"e_en":"13.8: the soffit (and utilities hung on the bridge) must be above the designed water level with adequate freeboard, also considering backwater tidal flow; headroom agreement should be obtained from DSD at the early design stage.","doc":"sdm-2013","pp":"165"},{"id":"BR-100","t":"mcq","d":2,"tp":"支座 Bearings","c":"8.1(3)","p":113,"q":"2025 年題目的行人單車橋提及「tension bearings」。按 SDM 8.1(3)，橋樑支座承受上拔力的規定是？","e":"8.1(3)：除非事先獲 Chief Highway Engineer/Bridges and Structures 批准，任何作用組合下支座不可承受上拔力。窄而輕的天橋在上吹風（uplift wind）下要檢查，方案評估應優先靠配重、加寬支座間距或連續結構消除上拔，而不是依賴拉力支座。","x":"shall not be subjected to uplift forces under any combinations of","tier":"常考","ex":"bridge","o":["上拔力不超過恆載 10% 即可","任何作用組合下支座都不可承受上拔力，除非事先獲 CHE/B&S 批准","可承受上拔力，但須用鋼支座","只在地震組合下可承受上拔力"],"a":1,"q_en":"The 2025 pedestrian/cycle bridge mentioned \"tension bearings\". Per SDM 8.1(3), what is the rule on uplift on bridge bearings?","o_en":["Acceptable if uplift is within 10% of dead load","Bearings shall not be subjected to uplift under any combination unless with prior approval of CHE/B&S","Uplift allowed if steel bearings are used","Uplift allowed only in seismic combinations"],"e_en":"8.1(3): bearings shall not be subjected to uplift under any combination of actions unless with prior approval of the Chief Highway Engineer/Bridges and Structures. Narrow light footbridges must be checked under uplift wind; the appraisal should prefer eliminating uplift by counterweight, wider bearing spacing or continuity rather than relying on tension bearings.","doc":"sdm-2013","pp":"111"},{"id":"BR-101","t":"mcq","d":2,"tp":"支座 Bearings","c":"8.3","p":113,"q":"按 SDM 8.3，支座表（schedule of bearings）中的荷載應如何列出？","e":"8.3(1)(2)：支座表須定義同時出現（concurrent）的豎向及水平荷載；如把最大橫向、縱向荷載與最大豎向荷載同時作用，大多數情況會過度設計、不經濟，所以要列出不同組合。","x":"Concurrent vertical and horizontal loads shall be defined in the bridge bearing schedule","tier":"常考","ex":"bridge","o":["由支座供應商自行計算","列出同時出現的豎向及水平荷載，並按不同荷載組合分別列出","只列最大豎向荷載","將最大縱向、橫向荷載與最大豎向荷載一併列出"],"a":1,"q_en":"Per SDM 8.3, how should loads be given in the bearing schedule?","o_en":["Let the bearing supplier calculate them","Define concurrent vertical and horizontal loads, with different load combinations specified","Give only the maximum vertical load","Give maximum longitudinal and transverse loads together with maximum vertical load"],"e_en":"8.3(1)(2): concurrent vertical and horizontal loads shall be defined; taking maximum transverse and longitudinal loads with maximum vertical load is likely to overdesign in most cases, so different load combinations shall be specified.","doc":"sdm-2013","pp":"111"},{"id":"BR-103","t":"mcq","d":2,"tp":"支座 Bearings","c":"8.7(2)","p":117,"q":"利用支座與上/下部結構間的摩擦抵抗部分水平力時，SDM 要求？","e":"8.7(2)：最少 2 倍安全系數，並用最不利組合；8.7(3)：地震設計狀況只在豎向反力可合理預測時才計摩擦。除彈性體支座外，支座須以奧氏體不銹鋼（Grade 1.4436，緊固件 A4-80）機械固定。","x":"provided that a factor of safety of at least 2 is applied to the proven coefficient of friction","tier":"常考","ex":"bridge","o":["安全系數 1.5","摩擦系數取 0.5","不可利用摩擦","對已證實的摩擦系數施加最少 2 的安全系數，並用最不利的豎向與水平荷載組合"],"a":3,"q_en":"When friction between a bearing and the superstructure/substructure is used to resist part of the horizontal forces, what does the SDM require?","o_en":["Factor of safety 1.5","Take friction coefficient as 0.5","Friction may never be used","A factor of safety of at least 2 on the proven coefficient of friction with the worst combination of vertical and horizontal load"],"e_en":"8.7(2): factor of safety at least 2 with the worst combination; 8.7(3): for seismic situations friction only if the vertical reaction can be reasonably predicted. Except elastomeric bearings, bearings are fixed with austenitic stainless steel mechanical fixings (Grade 1.4436, fasteners A4-80).","doc":"sdm-2013","pp":"115"},{"id":"BR-105","t":"mcq","d":2,"tp":"支座 Bearings","c":"8.8(1)","p":117,"q":"按 SDM 8.8(1)，為日後更換支座，圖則上須顯示？","e":"8.8(1)：設計須容許在不造成過度損壞下拆換支座；頂升力及位置須在圖則上顯示，特別程序須附方法說明。2023、2024 年題目要求說明支座布置（articulation），答案應包括頂升位置及更換。","x":"The jacking force and the jacking position for bearing replacement shall be indicated on the drawings.","tier":"常考","ex":"bridge","o":["支座的預計更換日期","頂升力（jacking force）及頂升位置","只需寫「按供應商要求」","支座品牌"],"a":1,"q_en":"Per SDM 8.8(1), what must be shown on the drawings for future bearing replacement?","o_en":["The expected replacement date","The jacking force and jacking position","Only \"as per supplier\"","The bearing brand"],"e_en":"8.8(1): design must allow removal and replacement without undue damage; jacking force and position shall be indicated on drawings, with a method statement for special procedures. The 2023 and 2024 questions asked for bearing articulation; answers should include jacking positions and replacement.","doc":"sdm-2013","pp":"115"},{"id":"BR-107","t":"mcq","d":2,"tp":"伸縮縫 Movement joints","c":"9.1.1(2)","p":118,"q":"2022 年題目寫明「no movement joint is allowed within the span」。SDM 9.1.1(2) 對伸縮縫數量的要求是？","e":"9.1.1(2)：伸縮縫通車後很難維修或更換，所以只設最少數量，即使要因此選連續/超靜定結構。這是方案評估中選連續橋面的重要理由。9.1.1(4)：除非無法避免，不用縱向伸縮縫。","x":"no more than the minimum number shall be provided, even if a continuous or otherwise redundant structure has to be chosen","tier":"常考","ex":"bridge","o":["每 30 m 設一道","每跨兩端都要設","數量不限，視乎施工方便","只提供最少數量，即使因此要選用連續或超靜定結構"],"a":3,"q_en":"The 2022 question stated \"no movement joint is allowed within the span\". What does SDM 9.1.1(2) require on the number of movement joints?","o_en":["One every 30 m","At both ends of every span","Any number, for construction convenience","No more than the minimum number, even if a continuous or redundant structure has to be chosen"],"e_en":"9.1.1(2): movement joints are very difficult to repair or replace once open to traffic, so no more than the minimum number shall be provided, even if a continuous or redundant structure must be chosen. A key reason to choose continuous decks in the appraisal. 9.1.1(4): longitudinal joints not used unless unavoidable.","doc":"sdm-2013","pp":"116"},{"id":"BR-108","t":"mcq","d":3,"tp":"伸縮縫 Movement joints","c":"9.1.1(3)","p":118,"q":"彎橋或斜橋的橋面可能出現橫向位移，損壞伸縮縫。SDM 的要求是？","e":"9.1.1(3)。支座布置（articulation）答案中彎橋/斜橋要寫導向支座方向。","x":"Otherwise, guided bearings shall be provided to prevent any transverse","tier":"偶考","ex":"bridge","o":["使用可容納橫向位移的伸縮縫，否則設導向支座防止橫向位移","所有彎橋都要用固定支座","改用縱向伸縮縫","忽略橫向位移"],"a":0,"q_en":"Decks of curved or skew bridges may move transversely and damage joints. What does the SDM require?","o_en":["Use joints that accommodate transverse movement, otherwise provide guided bearings to prevent it","Use fixed bearings on all curved bridges","Use longitudinal joints instead","Ignore transverse movement"],"e_en":"9.1.1(3). In articulation answers, curved/skew bridges should state guided bearing directions.","doc":"sdm-2013","pp":"116"},{"id":"BR-109","t":"mcq","d":2,"tp":"伸縮縫 Movement joints","c":"9.1.2(2)","p":118,"q":"位移在 ±5 mm 以內一般可用 gap、filled 或 buried joints。其中 gap joint 不可用於？","e":"9.1.2(2)：gap joint 最簡單，但只適合車輛交通，有行人或單車的地方不可用。9.1.2(3)：filled joint 最大縫寬 25 mm。","x":"They shall not be used where pedestrians or cycles are expected.","tier":"常考","ex":"bridge","o":["瀝青路面","斜橋","混凝土橋面","有行人或單車使用的地方"],"a":3,"q_en":"For movements up to ±5 mm, gap, filled or buried joints are normally used. Where must gap joints NOT be used?","o_en":["Asphalt surfacing","Skew bridges","Concrete decks","Where pedestrians or cycles are expected"],"e_en":"9.1.2(2): gap joints are the simplest but only suitable for vehicular traffic; not where pedestrians or cycles are expected. 9.1.2(3): filled joints max gap 25 mm.","doc":"sdm-2013","pp":"116"},{"id":"BR-111","t":"mcq","d":2,"tp":"伸縮縫 Movement joints","c":"9.1.2(6)","p":120,"q":"車輛可容忍的最大連續開縫（continuous open gap）為？有行人及單車時又如何？","e":"9.1.2(6)：65 mm；有行人及單車的地方所有縫隙須密封並覆蓋防滑耐腐蝕蓋板。9.1.2(5)：所有行車結構用專利伸縮縫。","x":"The maximum size of continuous open gap which can be tolerated for motor vehicles is 65 mm.","tier":"常考","ex":"bridge","o":["100 mm；只需密封","50 mm；單車道可用 gap joint","25 mm；行人可接受開縫","65 mm；有行人/單車時所有縫隙須密封並以防滑、耐腐蝕蓋板覆蓋"],"a":3,"q_en":"What is the maximum continuous open gap tolerable for motor vehicles, and what applies where pedestrians and cyclists have access?","o_en":["100 mm; only sealing needed","50 mm; gap joints on cycle tracks","25 mm; open gaps acceptable for pedestrians","65 mm; with pedestrians/cyclists all gaps sealed and covered with non-slip corrosion resistant cover plates"],"e_en":"9.1.2(6): 65 mm; where pedestrians and cyclists have access all gaps are sealed and covered with non-slip corrosion resistant cover plates. 9.1.2(5): proprietary joints on all structures carrying vehicular traffic.","doc":"sdm-2013","pp":"118"},{"id":"BR-112","t":"tf","d":3,"tp":"伸縮縫 Movement joints","c":"9.2(3)","p":120,"q":"估算伸縮縫的收縮及徐變位移時，高估是偏安全的做法。","e":"9.2(3)：高估會令伸縮縫長期受壓並向上拱起，行車時產生過大噪音；「over-estimation is not on the safe side」，應盡量準確估算。","x":"over-estimation is not on the safe side","tier":"偶考","ex":"bridge","a":false,"q_en":"When estimating shrinkage and creep movements for movement joints, over-estimation is on the safe side.","e_en":"9.2(3): over-estimation leaves the joint constantly in compression, bowing upwards and generating excessive noise; \"over-estimation is not on the safe side\", so estimate as accurately as possible.","doc":"sdm-2013","pp":"118"},{"id":"BR-114","t":"mcq","d":3,"tp":"伸縮縫 Movement joints","c":"9.4(2)","p":121,"q":"伸縮縫因開合而施加於支承結構的力：伸縮縫本身不可超過多少？而設計支承結構時最少要假設多少？","e":"9.4(2)：伸縮縫施加的力不多於 5 kN/m，但支承結構設計最少用 20 kN/m。","x":"a value of at least 20 kN/m shall be assumed","tier":"偶考","ex":"bridge","o":["不超過 5 kN/m；支承結構按最少 20 kN/m 設計","不超過 75 kN/m；按 75 kN/m 設計","可忽略","不超過 20 kN/m；按 5 kN/m 設計"],"a":0,"q_en":"For forces from straining of movement joints: what may the joint exert at most, and what minimum should be assumed for designing the supporting structure?","o_en":["Not more than 5 kN/m; design the supporting structure for at least 20 kN/m","Not more than 75 kN/m; design for 75 kN/m","Negligible","Not more than 20 kN/m; design for 5 kN/m"],"e_en":"9.4(2): the joint force shall not be more than 5 kN/m, but at least 20 kN/m is assumed for the supporting structure.","doc":"sdm-2013","pp":"119"},{"id":"BR-115","t":"mcq","d":2,"tp":"伸縮縫 Movement joints","c":"Table 9.1 Notes","p":124,"q":"SDM Table 9.1（伸縮縫表）計算可逆溫度位移時，安裝時的平均溫度取？而不可逆位移假設伸縮縫在最後一次澆築橋面後多久才安裝？","e":"Table 9.1 Notes (2)(4)：安裝平均溫度 20 °C（不同時承建商須調整）；不可逆位移（收縮徐變）假設不早於最後澆築後 180 日安裝。","x":"were to be installed no sooner than 180 days after the last pour of concrete","tier":"常考","ex":"bridge","o":["10 °C；90 日","30 °C；28 日","20 °C；不早於 180 日","25 °C；365 日"],"a":2,"q_en":"In SDM Table 9.1 (joint schedule), what mean setting temperature is assumed for reversible thermal movement, and how long after the last deck pour is the joint assumed installed for irreversible movement?","o_en":["10 °C; 90 days","30 °C; 28 days","20 °C; no sooner than 180 days","25 °C; 365 days"],"e_en":"Table 9.1 Notes (2)(4): mean setting temperature 20 °C (contractor adjusts if different); irreversible (shrinkage/creep) movement assumes installation no sooner than 180 days after the last pour.","doc":"sdm-2013","pp":"122"},{"id":"BR-120","t":"mcq","d":1,"tp":"混凝土及耐久性 Concrete & durability","c":"5.2(3)(4)","p":86,"q":"按 SDM 5.2，行車道及上部結構（包括混凝土護欄）的混凝土，以及預應力混凝土的最低強度等級分別為？","e":"5.2(3)：行車道及上部結構 ≥ Grade 40；5.2(4)：預應力 ≥ Grade 45。5.2(2)：可用範圍 Grade 30–85，高於 Grade 60 的剪力強度限於 Grade 60。橋樑初步尺寸計算要寫明等級。","x":"Concrete for prestressing work shall be Grade 45 or stronger.","tier":"常考","ex":"bridge","o":["Grade 35 及 Grade 50","Grade 45 及 Grade 60","Grade 30 及 Grade 40","Grade 40 及 Grade 45"],"a":3,"q_en":"Per SDM 5.2, what are the minimum concrete grades for carriageway and superstructures (including concrete parapets), and for prestressing work?","o_en":["Grade 35 and Grade 50","Grade 45 and Grade 60","Grade 30 and Grade 40","Grade 40 and Grade 45"],"e_en":"5.2(3): carriageway and superstructures ≥ Grade 40; 5.2(4): prestressing ≥ Grade 45. 5.2(2): permitted range Grade 30–85, with shear strength above Grade 60 limited to Grade 60. State grades in preliminary sizing.","doc":"sdm-2013","pp":"84"},{"id":"BR-122","t":"mcq","d":2,"tp":"混凝土及耐久性 Concrete & durability","c":"Table 5.2","p":92,"q":"SDM Table 5.2 中，橋面底（bridge deck soffits，XC4）使用 Grade 40 混凝土時，鋼筋的標稱保護層為？（括號內為預應力鋼材）","e":"Table 5.2：XC4（乾濕循環，例如橋面底）Grade 40 → 50 (60) mm；Grade 50 → 45 (55) mm。Note (2)：已包括 ΔCdev = 10 mm。Note (3)：厚度 > 250 mm 的現澆板加 5 mm（最多 75 mm）。","x":"XC4 Cyclic wet and dry - Subject to alternative wetting and drying e.g. - 50 (60) 50 (60) 45 (55) 45 (55)","tier":"常考","ex":"bridge","o":["65 mm（75 mm）","35 mm（40 mm）","40 mm（50 mm）","50 mm（預應力 60 mm）"],"a":3,"q_en":"In SDM Table 5.2, what is the nominal cover to reinforcement for bridge deck soffits (XC4) with Grade 40 concrete? (brackets: prestressing steel)","o_en":["65 mm (75 mm)","35 mm (40 mm)","40 mm (50 mm)","50 mm (prestressing 60 mm)"],"e_en":"Table 5.2: XC4 (cyclic wet and dry, e.g. bridge deck soffits) Grade 40 → 50 (60) mm; Grade 50 → 45 (55) mm. Note (2): includes ΔCdev = 10 mm. Note (3): in-situ slabs thicker than 250 mm add 5 mm (max 75 mm).","doc":"sdm-2013","pp":"90"},{"id":"BR-123","t":"mcq","d":3,"tp":"混凝土及耐久性 Concrete & durability","c":"Table 5.2","p":92,"q":"2025 年題目的橋橫跨將軍澳海灣（Junk Bay）。受海水飛濺影響的部分（XS3），Grade 45 混凝土的標稱保護層為？","e":"Table 5.2：XS3 Grade 45 / 50 → 75 (75) mm；Grade 55 以上 → 70 (70)；Grade 40 不可用。XS3 計算裂縫寬度 0.15 mm（受海水磨損 0.10 mm）。海旁橋樑評估時應寫明暴露等級、等級及保護層。","x":"e.g. concrete adjacent to the sea - - 75 (75) 75 (75) 70 (70)","tier":"常考","ex":"bridge","o":["50 mm","75 mm","65 mm","55 mm"],"a":1,"q_en":"The 2025 bridge crossed Junk Bay. For parts in tidal, splash and spray zones (XS3), what is the nominal cover with Grade 45 concrete?","e_en":"Table 5.2: XS3 Grade 45 / 50 → 75 (75) mm; Grade 55 and above → 70 (70); Grade 40 not allowed. XS3 limiting crack width 0.15 mm (0.10 mm with sea water abrasion). Waterfront bridge appraisals should state exposure class, grade and cover.","doc":"sdm-2013","pp":"90"},{"id":"BR-124","t":"mcq","d":2,"tp":"混凝土及耐久性 Concrete & durability","c":"Table 5.2 Note (4)","p":92,"q":"按 SDM Table 5.2 Note (4)，與泥土接觸的結構底面（如樁帽底）的標稱保護層及設計裂縫寬度為？","e":"Note (4)：與泥土接觸的底面：裂縫 ≤ 0.25 mm，保護層 ≥ 75 mm。Note (5)：pH ≤ 4.5 的水：≥ Grade 45、0.10 mm、75 mm。","x":"the design crack width shall not exceed 0.25 mm while the nominal cover shall be at least 75 mm","tier":"偶考","ex":"bridge","o":["40 mm，0.20 mm","保護層最少 75 mm，裂縫寬度不超過 0.25 mm","50 mm，0.30 mm","75 mm，0.10 mm"],"a":1,"q_en":"Per SDM Table 5.2 Note (4), what nominal cover and design crack width apply to the underside of structures in contact with ground (e.g. pile cap soffits)?","o_en":["40 mm, 0.20 mm","Cover at least 75 mm, crack width not exceeding 0.25 mm","50 mm, 0.30 mm","75 mm, 0.10 mm"],"e_en":"Note (4): underside in contact with ground: crack ≤ 0.25 mm, cover ≥ 75 mm. Note (5): water with pH ≤ 4.5: ≥ Grade 45, 0.10 mm, 75 mm.","doc":"sdm-2013","pp":"90"},{"id":"BR-125","t":"mcq","d":3,"tp":"混凝土及耐久性 Concrete & durability","c":"5.5.1(2), Table 5.3","p":93,"q":"按 SDM Table 5.3，後張法（post-tensioned）Grade 40 預應力構件在拉應力驗算組合 Case 2 下的容許彎曲拉應力為？","e":"Table 5.3：後張 Grade 40 = 2.3、Grade 50 = 2.6、Grade 60 以上 = 2.8；先張 Grade 40 = 2.9。即 0.36√fck,cube（後張）/ 0.45√fck,cube（先張）。Case 1 則不可出現消壓（decompression）。","x":"Post-tensioned 2.1 2.3 2.6 2.8","tier":"偶考","ex":"bridge","o":["0","2.9 N/mm²","2.3 N/mm²","3.2 N/mm²"],"a":2,"q_en":"Per SDM Table 5.3, what is the allowable flexural tensile stress for a post-tensioned Grade 40 member under the Tensile Stress Verification Combination Case 2?","e_en":"Table 5.3: post-tensioned Grade 40 = 2.3, Grade 50 = 2.6, Grade 60+ = 2.8; pre-tensioned Grade 40 = 2.9. I.e. 0.36√fck,cube (post-tensioned) / 0.45√fck,cube (pre-tensioned). Case 1 requires no decompression.","doc":"sdm-2013","pp":"91"},{"id":"BR-126","t":"mcq","d":2,"tp":"基礎及下部結構 Foundations & substructures","c":"10.1.1(2)","p":126,"q":"SDM 要求橋樑基礎按 BS 8004 原則驗算。由於 BS 8004 並非極限狀態規範，作用的分項系數應如何取？","e":"10.1.1(2)(4)：以 γG = γP = γQ = 1 驗算基礎；樁用 GEO Publication No. 1/2006 的整體安全系數；樁及樁帽的結構設計則按 Eurocode 極限狀態（10.1.1(5)）。橋台土壓力按 Geoguide 1（10.1.1(6)）。","x":"taken as 1 for the purpose of verifying foundations in accordance with BS","tier":"常考","ex":"bridge","o":["γG、γP、γQ 取 1（樁用 GEO Publication No. 1/2006 的整體安全系數）","用 Set C 系數","用 Set B 系數","γ = 1.5"],"a":0,"q_en":"The SDM requires bridge foundations to be verified to BS 8004 principles. Since BS 8004 is not a limit state code, how are partial factors on actions taken?","o_en":["γG, γP and γQ taken as 1 (piles use the global factors of safety of GEO Publication No. 1/2006)","Use Set C factors","Use Set B factors","γ = 1.5"],"e_en":"10.1.1(2)(4): verify foundations with γG = γP = γQ = 1; piles use the global factors of safety of GEO Publication No. 1/2006; structural design of piles and caps uses Eurocode limit states (10.1.1(5)). Abutment earth pressure per Geoguide 1 (10.1.1(6)).","doc":"sdm-2013","pp":"124"},{"id":"BR-127","t":"mcq","d":2,"tp":"基礎及下部結構 Foundations & substructures","c":"10.1.4; 10.1.5","p":127,"q":"按 SDM 10.1.4，橋樑支承的不均勻沉降應如何處理？","e":"10.1.4：不均勻沉降是永久荷載，按基礎類型、荷載及土質逐個支承評估，並用長期彈性模量。10.1.5：樁帽及基礎頂最好有 1.5 m 覆土，方便日後鋪設管線。10.1.3：填海區要考慮負摩擦（downdrag）。","x":"Differential settlement shall be taken as a permanent load","tier":"常考","ex":"bridge","o":["只在 SLS 考慮","作為永久荷載，逐個支承評估，並用混凝土長期彈性模量","可忽略","作為可變荷載"],"a":1,"q_en":"Per SDM 10.1.4, how is differential settlement of bridge supports treated?","o_en":["Only at SLS","As a permanent load, assessed for each support, using the long-term elastic modulus of concrete","Ignored","As a variable load"],"e_en":"10.1.4: differential settlement is a permanent load, assessed for each support from foundation type, loading and subsoil, using the long-term elastic modulus. 10.1.5: desirable 1.5 m cover to pile caps and footings for future utilities. 10.1.3: consider downdrag in reclamation.","doc":"sdm-2013","pp":"125"},{"id":"BR-129","t":"mcq","d":2,"tp":"基礎及下部結構 Foundations & substructures","c":"10.4.2(2); 10.4.3","p":129,"q":"如橋墩要設於排水渠或天然河道內，SDM 要求？","e":"10.4.2(2)：諮詢 DSD 是否需要 Drainage Impact Assessment。10.4.1 另列水流壓力、靜水壓、沖刷、回水等水力效應；10.4.3：航道上的橋墩要考慮船撞保護。2018、2023 年題目跨渠道。","x":"Drainage Services Department shall be consulted to see whether a Drainage Impact Assessment is required","tier":"常考","ex":"bridge","o":["不容許任何橋墩","只需通知地政總署","只須做樁基負摩擦檢查","諮詢渠務署是否需要進行排水影響評估"],"a":3,"q_en":"If piers are to be located within drainage channels or natural watercourses, what does the SDM require?","o_en":["No piers permitted","Only notify Lands Department","Only check pile downdrag","Consult DSD on whether a Drainage Impact Assessment is required"],"e_en":"10.4.2(2): consult DSD on whether a Drainage Impact Assessment is required. 10.4.1 lists hydraulic effects: current pressure, hydrostatic pressure, scour, backwater etc.; 10.4.3: piers over navigation channels consider ship collision protection. The 2018 and 2023 questions crossed channels.","doc":"sdm-2013","pp":"127"},{"id":"BR-130","t":"tf","d":2,"tp":"基礎及下部結構 Foundations & substructures","c":"10.5(1)","p":129,"q":"採用瀝青行車道時，橋台後應設置搭板（run-on slab）。","e":"10.5(1)：瀝青行車道不設搭板，依靠橋台後回填的適當壓實，沉降時補鋪路面較經濟。混凝土行車道則可把鄰近橋台的路面板設計為搭板（10.5(2)）。","x":"Run-on-slabs shall not be provided where bituminous carriageway is adopted.","tier":"偶考","ex":"bridge","a":false,"q_en":"Where a bituminous carriageway is adopted, run-on slabs should be provided behind abutments.","e_en":"10.5(1): run-on slabs are not provided with bituminous carriageways; rely on proper compaction of backfill and make up the surface as settlement occurs. With concrete carriageways the adjacent slab may be designed as a run-on slab (10.5(2)).","doc":"sdm-2013","pp":"127"},{"id":"BR-131","t":"mcq","d":1,"tp":"護欄 Parapets","c":"11.2.2(1)","p":131,"q":"按 SDM 11.2.2(1)，新建結構的車輛護欄應提供哪一防撞等級（containment level）或以上？","e":"11.2.2(1)：新建結構用 L3 或以上（選擇指引見 Table 11.3B）；11.11.1：跨鐵路車行橋要 L4。考題常寫「parapet design omitted」，但方案評估仍可寫明護欄等級及高度。","x":"vehicle parapets of containment level L3 or above should be provided","tier":"常考","ex":"bridge","o":["L4","L1","L3","L2"],"a":2,"q_en":"Per SDM 11.2.2(1), what vehicle parapet containment level or above should be provided on newly constructed structures?","e_en":"11.2.2(1): L3 or above for new structures (selection guidance in Table 11.3B); 11.11.1: railway vehicular overbridges need L4. Questions often omit parapet design, but the appraisal can still state level and height.","doc":"sdm-2013","pp":"129"},{"id":"BR-132","t":"mcq","d":1,"tp":"護欄 Parapets","c":"Table 11.5","p":143,"q":"2025 年題目指明行人單車橋護欄高 1100 mm。按 SDM Table 11.5，單車橋（cycle-bridges）的護欄最低高度為？","e":"Table 11.5：一般行人護欄 1100；跨鐵路行人天橋 1500；單車橋 1500；L1/L2 1000；L3/L4 1500；新建跨鐵路橋 L4 1800 mm。考試若題目給出不同數值，可在評估中指出並按題目假設，但應提及 SDM 要求。","x":"Cycle-bridges including railway cycle-overbridge and 1500","tier":"常考","ex":"bridge","o":["1100 mm","1000 mm","1500 mm","1800 mm"],"a":2,"q_en":"The 2025 question specified 1100 mm parapets on a pedestrian/cycle bridge. Per SDM Table 11.5, what is the minimum parapet height for cycle-bridges?","e_en":"Table 11.5: other pedestrian parapets 1100; railway foot-overbridges 1500; cycle-bridges 1500; L1/L2 1000; L3/L4 1500; L4 for new railway overbridges 1800 mm. If a question gives a different value, follow its assumption but mention the SDM requirement in the appraisal.","doc":"sdm-2013","pp":"141"},{"id":"BR-133","t":"mcq","d":2,"tp":"護欄 Parapets","c":"11.11.2(1)","p":137,"q":"新建跨鐵路橋（railway overbridge）的護欄最低高度及延伸範圍為？","e":"11.11.2(1)：最少 1500 mm（新建 1800 mm），實心混凝土，外面不加飾面，延伸至離最近路軌中線不少於 8 m。2019 年跨鐵路天橋題可用。","x":"New constructions of railway overbridge parapets shall have a higher minimum height of 1800 mm.","tier":"偶考","ex":"bridge","o":["1800 mm，延伸 3 m","1500 mm，延伸 5 m","1800 mm，延伸至離最近路軌中線不少於 8 m","1100 mm，延伸至橋台"],"a":2,"q_en":"For new railway overbridge parapets, what minimum height and extent are required?","o_en":["1800 mm, extending 3 m","1500 mm, extending 5 m","1800 mm, extending not less than 8 m from the centre line of the nearest track","1100 mm, to the abutment"],"e_en":"11.11.2(1): minimum 1500 mm (new construction 1800 mm), solid concrete without applied finishes, extending not less than 8 m from the nearest track centre line. Useful for the 2019 footbridge over a railway.","doc":"sdm-2013","pp":"135"},{"id":"BR-134","t":"mcq","d":2,"tp":"護欄 Parapets","c":"3.7.2.10","p":79,"q":"設計支承結構時，受保護（免受車輛撞擊）的行人護欄最低荷載為？","e":"3.7.2.10：BS 7818 Class 3 行人護欄：1.4 kN/m，水平或豎向作用於護欄頂，並與 3.7.3 的均布荷載同時作用。","x":"a uniformly distributed load of 1.4 kN/m acting","tier":"常考","ex":"bridge","o":["1.4 kN/m（水平或豎向作用於護欄頂）","3.0 kN/m","0.5 kN/m","0.74 kN/m"],"a":0,"q_en":"For designing the supporting structure, what minimum load applies to pedestrian parapets protected from vehicle collision?","o_en":["1.4 kN/m (horizontally or vertically at the top of the parapet)","3.0 kN/m","0.5 kN/m","0.74 kN/m"],"e_en":"3.7.2.10: BS 7818 Class 3 pedestrian restraint: 1.4 kN/m horizontally or vertically at the top, acting simultaneously with the UDL of 3.7.3.","doc":"sdm-2013","pp":"77"},{"id":"BR-135","t":"mcq","d":2,"tp":"護欄 Parapets","c":"11.4.3(2)","p":132,"q":"空間有限、交通量少而慢時，車輛護欄可設在結構邊緣（經 CHE/B&S 同意）。此時只可使用哪種護欄？","e":"11.4.3(2)：只可用 RC 護欄：混凝土底座 ≥ 800 mm、金屬頂欄 ≥ 1100 mm，並且離行車道邊不超過 3500 mm（避免高角度撞擊）。","x":"minimum 800 mm high concrete plinth and metal top rail(s) minimum","tier":"偶考","ex":"bridge","o":["只需行人護欄","鋼筋混凝土護欄，混凝土底座最少 800 mm 高，金屬頂欄最少 1100 mm 高","任何 L1 金屬護欄","1000 mm 高鋼護欄"],"a":1,"q_en":"Where space is limited and traffic light and slow, vehicle parapets may be placed at the structure edge (with CHE/B&S agreement). What parapet type may then be used?","o_en":["Pedestrian parapet only","RC vehicle parapet with minimum 800 mm concrete plinth and metal top rail at least 1100 mm high","Any L1 metal parapet","1000 mm steel parapet"],"e_en":"11.4.3(2): only RC parapets with plinth ≥ 800 mm and metal top rail ≥ 1100 mm, set back no more than 3500 mm from the carriageway edge (to avoid high angle impacts).","doc":"sdm-2013","pp":"130"},{"id":"BR-140","t":"mcq","d":1,"tp":"行人天橋布局 Footbridge layout","c":"12.2(1); 12.1(2)","p":151,"q":"按 SDM 12.2(1)，市區所有新建永久行人天橋及其樓梯、斜道？","e":"12.2(1)：市區所有新建永久天橋、高架行人道、隧道及其斜道、樓梯須加蓋；郊區視乎情況，豁免須向運輸及物流局申請。12.1(2)：無障礙通道是強制要求。","x":"associated ramps and stairways in the urban area shall be covered","tier":"常考","ex":"bridge","o":["可自行決定是否加蓋","須加蓋","只有樓梯須加蓋","只在大於 30 m 時加蓋"],"a":1,"q_en":"Per SDM 12.2(1), all new permanent footbridges and their ramps and stairways in the urban area?","o_en":["Covers optional","Shall be covered","Only stairs covered","Covered only if longer than 30 m"],"e_en":"12.2(1): all new permanent footbridges, elevated walkways, subways and their ramps and stairways in the urban area shall be covered; rural cases depend on circumstances, with omission applications to TLB. 12.1(2): access for the disabled is mandatory.","doc":"sdm-2013","pp":"149"},{"id":"BR-141","t":"mcq","d":1,"tp":"行人天橋布局 Footbridge layout","c":"12.4(1)","p":153,"q":"按 SDM 12.4(1)，行人斜道的坡度一般不應大於？","e":"12.4(1)：8.3%（約 1:12）是輪椅使用者無協助可上的最陡坡度；空間有限時可至 10%；12.4(2)：圓形斜道中線 ≤ 10%，每升 3500 mm 設平台。2021 年題目的斜道 1:12、平台每 3.5 m 高一個，與此一致。","x":"The gradient of pedestrian ramps should not be greater than 8.3%","tier":"必考","ex":"bridge","o":["8.3%（空間有限時可至 10%）","12%","10%（空間有限時可至 12%）","5%"],"a":0,"q_en":"Per SDM 12.4(1), the gradient of pedestrian ramps should generally not be greater than?","o_en":["8.3% (up to 10% where space is limited)","12%","10% (up to 12% where space is limited)","5%"],"e_en":"12.4(1): 8.3% (about 1:12) is the steepest gradient negotiable by a wheelchair user without assistance; up to 10% where space is limited; 12.4(2): circular ramps ≤ 10% on the centre line, landings at vertical intervals ≤ 3500 mm. The 2021 question's 1:12 ramps with landings every 3.5 m match this.","doc":"sdm-2013","pp":"151"},{"id":"BR-142","t":"mcq","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.4(2)","p":153,"q":"行人斜道的平台（landing）豎向間距應不大於？","e":"12.4(2)：3500 mm。12.5(2)：斜道平台長度 ≥ 2000 mm（空間有限 1500 mm）。","x":"landings at vertical intervals of not more than 3500 mm","tier":"常考","ex":"bridge","o":["1500 mm","2000 mm","3500 mm","5100 mm"],"a":2,"q_en":"Ramp landings should be provided at vertical intervals of not more than?","e_en":"12.4(2): 3500 mm. 12.5(2): ramp landings ≥ 2000 mm long (1500 mm where space is limited).","doc":"sdm-2013","pp":"151"},{"id":"BR-143","t":"num","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.4(3)","p":153,"q":"按 SDM 12.4(3)，單車斜道坡度一般不應陡於多少 %（空間有限時可增至 8%）？","e":"12.4(3)：單車斜道 ≤ 4%，空間有限時 8%。2025 年行人單車橋題目給出最大坡度 8%，即 SDM 的上限值。","x":"The gradient of cycle ramps should not be steeper than 4%","tier":"常考","ex":"bridge","a":4,"tol":0.0,"u":"%","q_en":"Per SDM 12.4(3), the gradient of cycle ramps should not be steeper than what % (up to 8% if space is limited)?","e_en":"12.4(3): cycle ramps ≤ 4%, 8% if space is limited. The 2025 pedestrian/cycle bridge question gave a maximum gradient of 8%, i.e. the SDM upper limit.","doc":"sdm-2013","pp":"151"},{"id":"BR-144","t":"mcq","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.3(2)(3)(5)","p":152,"q":"SDM 12.3 對天橋樓梯的一般要求是？","e":"12.3：級高 ≤ 150 mm（極特殊情況 165 mm）；級深 ≥ 280 mm（空間有限 250 mm）；580 ≤ 2R + T ≤ 600；每段 ≤ 12 級（空間有限 16 級）。","x":"The number of risers in a flight shall not exceed 12, but may be increased to 16 if space","tier":"常考","ex":"bridge","o":["級高 ≤ 150 mm、級深 ≥ 300 mm、每段 20 級","級高 ≤ 165 mm、級深 ≥ 225 mm、每段 14 級","級高 ≤ 150 mm、級深 ≥ 280 mm、每段不超過 12 級","級高 ≤ 175 mm、級深 ≥ 250 mm、每段 16 級"],"a":2,"q_en":"What are the general SDM 12.3 requirements for footbridge stairs?","o_en":["Risers ≤ 150 mm, treads ≥ 300 mm, 20 per flight","Risers ≤ 165 mm, treads ≥ 225 mm, 14 per flight","Risers ≤ 150 mm, treads ≥ 280 mm, max 12 risers per flight","Risers ≤ 175 mm, treads ≥ 250 mm, 16 per flight"],"e_en":"12.3: risers ≤ 150 mm (165 mm in very exceptional cases); treads ≥ 280 mm (250 mm if space is limited); 580 ≤ 2R + T ≤ 600; ≤ 12 risers per flight (16 if space is limited).","doc":"sdm-2013","pp":"150"},{"id":"BR-145","t":"mcq","d":1,"tp":"行人天橋布局 Footbridge layout","c":"12.7(2)","p":154,"q":"行人天橋及其斜道、樓梯的最小淨寬為？","e":"12.7(2)：天橋 2000 mm；行人隧道 3000 mm；計淨寬時要扣除欄杆、扶手、飾面。12.7(3)：上蓋柱、護欄、扶手之間的淨距亦不少於 2000 mm。","x":"stairways shall be 2000 mm, except on stairs to tram","tier":"常考","ex":"bridge","o":["2000 mm","1500 mm","1200 mm","3000 mm"],"a":0,"q_en":"What is the minimum clear width of footbridges and their ramps and stairways?","e_en":"12.7(2): footbridges 2000 mm; subways 3000 mm; allow for railings, handrails and finishes in the clear width. 12.7(3): clear distance between roof columns, parapets and handrails also not less than 2000 mm.","doc":"sdm-2013","pp":"152"},{"id":"BR-146","t":"mcq","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.8(4)","p":154,"q":"天橋護欄最低高度為 1100 mm。什麼情況下可增至 1.3 m？","e":"12.8(4)：強風或橋下淨空 > 10 m 時可增至 1.3 m。跨鐵路天橋按 Table 11.5 為 1500 mm；單車橋 1500 mm。12.8(5)：扶手高 850 mm，直徑 32–40 mm。","x":"is greater than 10 m, the height of the parapet may be increased","tier":"常考","ex":"bridge","o":["跨越鐵路","有單車使用","天橋長於 50 m","強風地區，或只供行人使用的天橋下淨空大於 10 m"],"a":3,"q_en":"Footbridge parapets are at least 1100 mm high. When may they be increased to 1.3 m?","o_en":["Crossing a railway","Used by cyclists","Footbridge longer than 50 m","In areas of high prevailing winds, or where headroom under a pedestrian-only footbridge exceeds 10 m"],"e_en":"12.8(4): may be increased to 1.3 m in high winds or where headroom exceeds 10 m. Railway foot-overbridges are 1500 mm per Table 11.5; cycle-bridges 1500 mm. 12.8(5): handrails at 850 mm, 32–40 mm diameter.","doc":"sdm-2013","pp":"152"},{"id":"BR-147","t":"mcq","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.9(2)(3)","p":155,"q":"天橋屋頂及橋面排水：縱向坡度最少多少？排水管直徑最少多少？","e":"12.9(2)：屋頂及橋面向兩側傾斜，縱坡 ≥ 0.67%；12.9(3)：排水管 ≥ 100 mm 方便疏通。14.2.1：車行結構排水管 ≥ 150 mm，縱向排水管每 ≤ 20 m 設疏通口。12.9(5)：結構鋼及外露混凝土不可作排水槽。","x":"a longitudinal fall of not less than 0.67% unless otherwise approved","tier":"偶考","ex":"bridge","o":["0.5%；100 mm","縱坡 ≥ 0.67%；排水管 ≥ 100 mm","2.5%；75 mm","1%；150 mm"],"a":1,"q_en":"For footbridge roofs and decks: what minimum longitudinal fall, and what minimum drain pipe diameter?","o_en":["0.5%; 100 mm","Fall ≥ 0.67%; pipes ≥ 100 mm","2.5%; 75 mm","1%; 150 mm"],"e_en":"12.9(2): roofs and decks cambered with longitudinal fall ≥ 0.67%; 12.9(3): pipes ≥ 100 mm for rodding. 14.2.1: vehicular structures ≥ 150 mm, rodding eyes at ≤ 20 m on carrier drains. 12.9(5): structural steel and bare concrete shall not be used as drainage channels.","doc":"sdm-2013","pp":"153"},{"id":"BR-150","t":"mcq","d":2,"tp":"地震 Seismic","c":"4.2; 4.3","p":82,"q":"按 SDM 第 4 章，橋樑地震設計的參考重現期及 A 類地基參考峰值地面加速度 agR 為？","e":"4.2：TNCR = 475 年；4.3：agR = 0.12g。4.6：香港不適用低地震度簡化準則。4.5：地震不當作意外作用。2024、2025 年題目寫明地震可忽略，但方案評估仍可提及。","x":"of 475 years shall be taken as 0.12g","tier":"偶考","ex":"bridge","o":["2500 年；0.12g","475 年；0.05g","1000 年；0.2g","475 年；0.12g"],"a":3,"q_en":"Per SDM Chapter 4, what are the reference return period and reference peak ground acceleration agR on type A ground for bridge seismic design?","o_en":["2500 years; 0.12g","475 years; 0.05g","1000 years; 0.2g","475 years; 0.12g"],"e_en":"4.2: TNCR = 475 years; 4.3: agR = 0.12g. 4.6: simplified low seismicity criteria not applicable in Hong Kong. 4.5: seismic not treated as accidental. The 2024 and 2025 questions omitted earthquake, but the appraisal may still mention it.","doc":"sdm-2013","pp":"80"},{"id":"BR-151","t":"mcq","d":3,"tp":"地震 Seismic","c":"Table 4.1","p":83,"q":"按 SDM Table 4.1，位於快速公路（expressway）上、總長不超過 1000 m、跨度不超過 150 m 的橋樑，建議重要性系數 γI 為？","e":"Table 4.1：Class I 1.0；Class II 1.4（交通敏感路線、公共交通敏感路線或快速公路）；Class III 2.3（跨度 > 150 m、長 > 1000 m 的快速公路橋或震後關鍵通道，例如醫院唯一通道）。分別相當於 475、1000、2500 年重現期。","x":"Class II 1.4 When any one of the following conditions are met","tier":"偶考","ex":"bridge","o":["1.4","1.0","2.3","1.2"],"a":0,"q_en":"Per SDM Table 4.1, what importance factor γI is recommended for a bridge on an expressway, total length not more than 1000 m and no span over 150 m?","e_en":"Table 4.1: Class I 1.0; Class II 1.4 (traffic sensitive routes, public transport sensitive routes or expressway); Class III 2.3 (span > 150 m, expressway with total length > 1000 m, or critical post-earthquake routes e.g. sole access to hospital). Corresponding to 475, 1000 and 2500 year return periods.","doc":"sdm-2013","pp":"81"},{"id":"BR-152","t":"tf","d":2,"tp":"地震 Seismic","c":"4.6","p":83,"q":"由於香港屬低地震區，SDM 容許採用 BS EN 1998 的低地震度簡化設計準則。","e":"4.6：簡化設計準則不適用於香港，SDM 亦沒有訂立。","x":"Simplified design criteria are therefore not applicable for Hong","tier":"偶考","ex":"bridge","a":false,"q_en":"As Hong Kong is a low seismicity region, the SDM permits the simplified design criteria for low seismicity of BS EN 1998.","e_en":"4.6: simplified design criteria are not applicable for Hong Kong and are not established in the Manual.","doc":"sdm-2013","pp":"81"},{"id":"BR-155","t":"mcq","d":2,"tp":"鋼橋及疲勞 Steel bridges & fatigue","c":"6.2(1); 6.3","p":105,"q":"SDM 6.2(1) 指出哪類橋樑的疲勞評估須特別注意？","e":"6.2(1)：斜拉橋及經常有重型車輛的鋼橋。6.3：所有結構鋼用熱軋空心型材（BS EN 10210），不准用冷成型型材。2024 年題目寫明可忽略疲勞。","x":"such as cable-stayed bridges or steel bridges that are frequently used by heavy vehicles","tier":"偶考","ex":"bridge","o":["所有混凝土行人天橋","跨度少於 20 m 的橋","只有鐵路橋","斜拉橋或經常有重型車輛使用的鋼橋"],"a":3,"q_en":"SDM 6.2(1) calls for special attention to fatigue for which bridges?","o_en":["All concrete footbridges","Bridges under 20 m span","Only railway bridges","Cable-stayed bridges or steel bridges frequently used by heavy vehicles"],"e_en":"6.2(1): cable-stayed bridges and steel bridges frequently used by heavy vehicles. 6.3: hot formed hollow sections (BS EN 10210) for all structural steelwork; cold formed sections not permitted. The 2024 question omitted fatigue.","doc":"sdm-2013","pp":"103"},{"id":"BR-157","t":"mcq","d":2,"tp":"美觀及維修 Aesthetics & maintenance","c":"15.1(4); 15.2(1)","p":176,"q":"SDM 第 15 章（美觀）的性質是？","e":"15.2(1)：本章屬 advisory；15.1(4)：美觀要配合結構簡潔、有效形式、功能及營運維修。方案評估（30–40 分）中美觀、與環境協調是常見比較準則。","x":"This Chapter is therefore advisory in nature.","tier":"偶考","ex":"bridge","o":["只適用於隔音屏障","只適用於跨度 > 150 m 的橋","強制性的形狀規定","屬建議性質，容許設計自由，但要在美觀與合理工程原則、功能及維修之間取得平衡"],"a":3,"q_en":"What is the nature of SDM Chapter 15 (Aesthetics)?","o_en":["Only for noise barriers","Only for spans > 150 m","Mandatory shape rules","Advisory, allowing freedom of design, balancing aesthetics with rational engineering principles, function and maintenance"],"e_en":"15.2(1): the chapter is advisory; 15.1(4): aesthetics with structural simplicity, effective form, function and O&M. Aesthetics and harmony with setting are common comparison criteria in the 30–40 mark appraisal.","doc":"sdm-2013","pp":"174"},{"id":"BR-160","t":"num","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.5(2)","p":153,"q":"按 SDM 12.5(2)，斜道平台（ramp landing）長度一般不少於多少 mm（空間有限時可減至 1500 mm）？","e":"12.5(2)：2000 mm，空間有限 1500 mm。樓梯平台 1500–1800 mm（最少 1000 mm）。2021 年題目要求平台長 ≥ 2 m，與此一致。","x":"The length of ramp landings shall be not less than 2000 mm","tier":"常考","ex":"bridge","a":2000,"tol":0.0,"u":"mm","q_en":"Per SDM 12.5(2), ramp landings shall generally be not less than how many mm long (reducible to 1500 mm where space is limited)?","e_en":"12.5(2): 2000 mm, 1500 mm where space is limited. Stair landings 1500–1800 mm (minimum 1000 mm). The 2021 question's landing length ≥ 2 m matches this.","doc":"sdm-2013","pp":"151"},{"id":"BR-161","t":"num","d":2,"tp":"溫度作用 Temperature effects","c":"3.5.2(6)","p":63,"q":"按 SDM 3.5.2(6)，計算收縮至最低均勻橋溫時，初始橋溫 T0 取多少 °C？","e":"收縮 T0 = 30 °C；膨脹 T0 = 10 °C。","x":"shall be taken as 30ºC for calculating contraction","tier":"常考","ex":"bridge","a":30,"tol":0.0,"u":"°C","q_en":"Per SDM 3.5.2(6), what initial bridge temperature T0 (°C) is used for calculating contraction down to the minimum uniform bridge temperature?","e_en":"Contraction T0 = 30 °C; expansion T0 = 10 °C.","doc":"sdm-2013","pp":"61"},{"id":"BR-162","t":"num","d":3,"tp":"溫度作用 Temperature effects","c":"Table 3.17; 3.5.2(6)","p":62,"q":"一般 Type 3 混凝土橋面（Te,min = 0 °C，T0 = 30 °C 用於收縮），最大收縮溫度變化 ΔTN,con 為多少 °C？","e":"ΔTN,con = T0 − Te,min = 30 − 0 = 30 °C。膨脹 ΔTN,exp = Te,max − T0 = 45 − 10 = 35 °C。","x":"1 0 55 0 53 2 0 48 0 46 3 0 45 0 43","tier":"常考","ex":"bridge","a":30,"tol":0.0,"u":"°C","calc":true,"q_en":"For a normal Type 3 concrete deck (Te,min = 0 °C, T0 = 30 °C for contraction), what is the maximum contraction range ΔTN,con in °C?","e_en":"ΔTN,con = T0 − Te,min = 30 − 0 = 30 °C. Expansion ΔTN,exp = Te,max − T0 = 45 − 10 = 35 °C.","doc":"sdm-2013","pp":"60"},{"id":"BR-163","t":"num","d":2,"tp":"車輛撞擊 Vehicle collision","c":"10.2(3)","p":128,"q":"鄰近鐵路軌道的行人天橋支承，為穩健性須承受的最低靜力為多少 kN（作用於軌面以上 1200 mm）？","e":"10.2(3)：行人天橋 825 kN；車行橋 1650 kN。","x":"825 kN in case of footbridges, acting horizontally in any direction","tier":"偶考","ex":"bridge","a":825,"tol":0.0,"u":"kN","q_en":"For robustness, what minimum static design force (kN) must supports of footbridges adjacent to rail traffic withstand (1200 mm above rail level)?","e_en":"10.2(3): footbridges 825 kN; vehicular bridges 1650 kN.","doc":"sdm-2013","pp":"126"},{"id":"BR-164","t":"num","d":2,"tp":"伸縮縫 Movement joints","c":"9.1.2(3)","p":118,"q":"按 SDM 9.1.2(3)，填充式伸縮縫（filled joint）的最大縫寬為多少 mm？","e":"filled joint 25 mm；buried joint 20 mm；車輛可容忍的連續開縫 65 mm。","x":"The maximum gap width for such joints is 25 mm.","tier":"偶考","ex":"bridge","a":25,"tol":0.0,"u":"mm","q_en":"Per SDM 9.1.2(3), what is the maximum gap width (mm) for filled joints?","e_en":"Filled joints 25 mm; buried joints 20 mm; tolerable continuous open gap for vehicles 65 mm.","doc":"sdm-2013","pp":"116"},{"id":"BR-165","t":"num","d":2,"tp":"行人天橋布局 Footbridge layout","c":"12.8(5)","p":154,"q":"按 SDM 12.8(5)，斜道及樓梯扶手應固定在梯級邊緣以上多少 mm？","e":"12.8(5)：850 mm（更高會令長者及殘疾人士難以握到）；平台處 850–950 mm；直徑 32–40 mm；樓梯闊 ≥ 4000 mm 考慮加中間扶手。","x":"The handrails shall be fixed at a height of 850 mm above the nose of a step","tier":"偶考","ex":"bridge","a":850,"tol":0.0,"u":"mm","q_en":"Per SDM 12.8(5), at what height (mm) above the nose of a step shall handrails on ramps and stairways be fixed?","e_en":"12.8(5): 850 mm (higher is difficult for the elderly and disabled); at landings 850–950 mm; diameter 32–40 mm; consider central handrails on stairways 4000 mm wide or more.","doc":"sdm-2013","pp":"152"},{"id":"DEM-001","t":"mcq","d":1,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.2","p":26,"q":"拆卸工程的 covered walkway 最少要提供多少淨空高度（vertical clearance）？","e":"規範要求 covered walkway 最少 2.3 m 淨高；5.5 m 是 catch platform 在車路邊 500 mm 範圍內的淨空要求，常被混淆。","x":"A minimum vertical clearance of 2.3 m shall be provided for the covered walkway.","ex":"demol","o":["2.0 m","5.5 m","2.5 m","2.3 m"],"a":3,"q_en":"What minimum vertical clearance shall be provided for the covered walkway of a demolition site?","e_en":"The Code requires a minimum vertical clearance of 2.3 m. 5.5 m is the clearance for the catch platform within 500 mm of the carriageway edge, a common mix-up.","doc":"demolition-2004","pp":"15","tier":"偶考"},{"id":"DEM-002","t":"mcq","d":2,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.2 Table 3.1","p":26,"q":"行人路（existing pavement）闊 2.8 m，按 Table 3.1，covered walkway 最少淨闊為？","e":"行人路闊 2.5–3 m 時，淨闊 = 行人路闊 − 0.8 m，上限 2 m；2.8 − 0.8 = 2.0 m。1.1 m 是設於車路上的 walkway 最少淨闊。","x":"over 2.5 m to 3 m Width of the pavement minus 0.8m subject to a maximum of 2 m","ex":"demol","o":["2.8 m","1.5 m","1.1 m","2.0 m（2.8 − 0.8 m，上限 2 m）"],"a":3,"q_en":"The existing pavement is 2.8 m wide. Per Table 3.1, what is the minimum clear width of the covered walkway?","o_en":["2.8 m","1.5 m","1.1 m","2.0 m (2.8 − 0.8 m, max. 2 m)"],"e_en":"For pavements over 2.5 m to 3 m, clear width = pavement width minus 0.8 m, max. 2 m; 2.8 − 0.8 = 2.0 m. 1.1 m applies to walkways sited on a carriageway.","doc":"demolition-2004","pp":"15","tier":"偶考"},{"id":"DEM-003","t":"mcq","d":1,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.3","p":26,"q":"Covered walkway 的上蓋須按多少均佈荷載設計？","e":"Covered walkway 上蓋 5 kPa；catch platform 5 kPa 或 20 kN 集中荷載（300 × 300 mm），取較不利者。","x":"The roof of the covered walkway shall be designed to support a uniformly distributed load of 5 kPa.","ex":"demol","o":["5 kPa","7.5 kPa","3 kPa","10 kPa"],"a":0,"q_en":"For what uniformly distributed load shall the roof of the covered walkway be designed?","e_en":"Covered walkway roof: 5 kPa. Catch platform: 5 kPa or a 20 kN point load on 300 × 300 mm, whichever is more adverse.","doc":"demolition-2004","pp":"15","tier":"偶考"},{"id":"DEM-004","t":"mcq","d":2,"tp":"圍板及有蓋行人道 Hoarding & covered walkway","c":"3.2.3 Table 3.2","p":26,"q":"Catch platform 除 5 kPa 均佈荷載外，還須考慮哪個集中荷載？","e":"Table 3.2：catch platform 5 kPa 或 20 kN（有效面積 300 mm × 300 mm），取最不利。風荷載亦須按 Wind Code 考慮。","x":"of 20 kN acting on an effective area of 300 mm × 300 mm, whichever shall produce the most adverse effect.","ex":"demol","o":["20 kN 作用於 300 mm × 300 mm","20 kN 作用於 1 m ×
