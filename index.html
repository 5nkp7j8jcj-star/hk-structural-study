 γ1, γ2 and γ3. What does each represent, and how does the Code use them?","m_en":"γ1: variation of loads from their characteristic values; γ2: the reduced probability that several loads reach their characteristic values simultaneously; γ3: inaccuracy of calculation and variation in structural behaviour. The Code multiplies the three into a single γf.","e_en":"Understanding the make-up of γf helps judge when it may be adjusted (e.g. it should not be casually reduced for temporary works). [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"27","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","short","進階"]},{"id":"SEM-002","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.1","p":33,"q":"EM E4.1：ultimate design strength py 以 yield stress 取值，但上限為 ultimate tensile strength 除以多少？","a":1.2,"tol":0,"u":"","e":"py = Ys/γm1（γm1=1.0）但 ≤ Us/1.2（γm2=1.2）。高屈強比鋼材會由 Us/1.2 控制。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"stress. This is limited to a maximum value of the ultimate tensile strength divided by 1.2.","q_en":"EM E4.1: the ultimate design strength py is taken as the yield stress, but limited to the ultimate tensile strength divided by what?","e_en":"py = Ys/γm1 (γm1=1.0) but ≤ Us/1.2 (γm2=1.2). Steels with a high yield-to-tensile ratio are governed by Us/1.2. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"27","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-003","t":"mcq","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM E4.2.1：來源已知並經測試合格的 Class 2 steel，材料系數 γm1 / γm2 為？","o":["1.1 / 1.3","1.0 / 1.2","1.2 / 1.4","1.0 / 1.3"],"a":0,"e":"Class 1/1H：1.0/1.2；Class 2（經測試）：1.1/1.3；Class 3（來源不明）py 限 170 N/mm² 且只用於次要構件。使用內地或其他來源鋼材時必須先確認 class。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Class 2 steel from a known source may be tested and if found to comply may also be","q_en":"EM E4.2.1: for Class 2 steel of known source that has been tested and passed, the material factors γm1 / γm2 are:","e_en":"Class 1/1H: 1.0/1.2; Class 2 (tested): 1.1/1.3; Class 3 (unknown source): py limited to 170 N/mm² and only for secondary members. When using steel from the Mainland or other sources, confirm its class first. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","mcq","中級"]},{"id":"SEM-004","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM：Class 3 steel（來源不明）用於次要構件時 design strength py 上限？","a":170,"tol":0,"u":"N/mm²","e":"Class 3 不建議使用；僅在失效後果有限的 minor elements 並限 py = 170 N/mm²。舊鋼再用、遺失 mill certificate 屬此類。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"of failure are limited. Then, their design strength py is limited to 170 N/mm2.","q_en":"EM: upper limit of design strength py for Class 3 steel (unknown source) used in secondary members?","e_en":"Class 3 is not recommended; only for minor elements whose failure has limited consequences, with py limited to 170 N/mm². Reused old steel and steel with lost mill certificates fall into this class. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-005","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.4","p":34,"q":"EM 指出 base plate grout 的 Young's modulus 在缺乏資料時可取同等 cube strength 混凝土的約 1/3。","a":true,"e":"正確。Grout 全為水泥漿，E 值明顯較低；材料系數則與同 fcu 混凝土相同。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"In the absence of more accurate information, a value of around 1/3 that of","q_en":"The EM states that, in the absence of data, the Young's modulus of base plate grout may be taken as about 1/3 of that of concrete of the same cube strength.","e_en":"True. Grout is entirely cement paste, so its E is markedly lower; the material factors are the same as for concrete of the same fcu. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","tf","中級"]},{"id":"SEM-006","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"檢核空泳池抗浮時，池內水壓的有利 load factor 應取 0。","a":true,"e":"正確。有利水壓 γf 取 0.0；池外地下水取最大。這與 Foundations Code 的 uplift/抗浮檢核概念一致。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Clearly, the beneficial load factor for water pressure should be taken as 0.0, for example","q_en":"When checking an empty swimming pool against flotation, the beneficial load factor on water pressure inside the pool should be taken as 0.","e_en":"True. Beneficial water pressure γf is 0.0; groundwater outside the pool is taken at its maximum. This is consistent with the uplift/flotation checks of the Foundations Code. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","tf","中級"]},{"id":"SEM-007","t":"mcq","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"EM E4.3.1：Code 對 differential settlement 的 load factor 在 load combinations 1、2 及 3 分別取？","o":["1.4、1.4、1.2","1.2、1.2、1.2","1.0、1.0、1.0","1.4、1.2、1.0"],"a":0,"e":"EM 解釋理論上 1.2 較合邏輯，但 Code 採 1.4（comb 1、2）及 1.2（comb 3）。Concrete Code 對 temperature 取 1.0、differential settlement 1.4。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"deformations. However, the Code uses a value of 1.4 for differential settlements in load","q_en":"EM E4.3.1: the Code's load factors for differential settlement in load combinations 1, 2 and 3 are respectively:","o_en":["1.4, 1.4, 1.2","1.2, 1.2, 1.2","1.0, 1.0, 1.0","1.4, 1.2, 1.0"],"e_en":"The EM explains that 1.2 would theoretically be more logical, but the Code adopts 1.4 (comb 1, 2) and 1.2 (comb 3). The Concrete Code takes 1.0 for temperature and 1.4 for differential settlement. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","mcq","進階"]},{"id":"SEM-008","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.4","p":35,"q":"EM E4.3.4：temporary works 的任何 adverse load factor（包括 wind）不應少於多少？","a":1.2,"tol":0,"u":"","e":"臨時工程倒塌常見原因：手工差、偏心支撐、舊鋼、腳手架承托墊不足。不可因設計年期短而隨意降低荷載系數。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"load factor be less than 1.2. This includes load factors for wind loads, in which the actual","q_en":"EM E4.3.4: any adverse load factor (including wind) for temporary works should not be less than what?","e_en":"Common causes of temporary works collapse: poor workmanship, eccentric bracing, old steel, inadequate scaffold base plates. Load factors must not be casually reduced because of a short design life. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-009","t":"scenario","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.5","p":36,"q":"檢核一幢鋼結構在 exceptional event（例如車輛撞擊或移除一條柱）下的 load combination，EM 如何解釋 live/wind 系數 0.35 的來源？","m":"近代規範（Concrete Code 2.3.1.5、BS 5950 2.4.5.3）共識：整體最低 partial load factor 1.05，且同時出現的 live/wind 約為 characteristic 的 1/3，故 1.05 × 0.33 ≈ 0.35。Exceptional load 本身視作 ultimate，γf = 1.0；移除構件情況則無 extreme event load。Explosion pressure 可取 34 kN/m²。","k":["1.05 × 1/3 = 0.35","exceptional load γf 1.0","key element removal → no extreme load","34 kN/m² explosion"],"e":"Cross-check Concrete Code 2.3.1.5 的 accidental combination；兩本 Code 的邏輯一致。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"load factor of 1.05 and likely live and wind loads of 1/3 of characteristic. Thus, a live or","q_en":"When checking the load combination for a steel structure under an exceptional event (e.g. vehicle impact or removal of a column), how does the EM explain the origin of the live/wind factor of 0.35?","m_en":"The consensus of modern codes (Concrete Code 2.3.1.5, BS 5950 2.4.5.3): an overall minimum partial load factor of 1.05, with the simultaneous live/wind about 1/3 of characteristic, hence 1.05 × 0.33 ≈ 0.35. The exceptional load itself is treated as ultimate, γf = 1.0; in the member removal case there is no extreme event load. Explosion pressure may be taken as 34 kN/m².","e_en":"Cross-check the accidental combination of Concrete Code 2.3.1.5; the logic of the two Codes is consistent. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"30","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","scenario","進階"]},{"id":"SEM-010","t":"num","d":2,"tp":"使用極限狀態 Serviceability","c":"E4.3.7","p":36,"q":"EM 指出 Code 2.4.1 容許 live 與 wind 組合計算撓度時使用的 serviceability load factor？","a":0.8,"tol":0,"u":"","e":"例如屋面樑撓度；RE 亦可按判斷採用 1.0 以外的 SLS 系數以反映實況。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Code allows a serviceability load factor of 0.8 when considering deflections from live and","q_en":"According to the EM, what serviceability load factor does Code 2.4.1 allow when live and wind loads are combined for deflection calculations?","e_en":"E.g. deflection of roof beams; the RE may also use SLS factors other than 1.0 by judgement to reflect actual conditions. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"30","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","num","中級"]},{"id":"SEM-011","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":37,"q":"EM 解釋 Code 5.3.4 舒適度準則採用 peak acceleration 的 return period 為？","o":["10 年","1 年","50 年","100 年"],"a":0,"e":"10 年回歸期（與 JGJ3-2002 及加拿大 NBC 1995 一致），10 分鐘時距（ISO 6897）。Peak 比 RMS 更能反映人體感受。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"The 10-year return period has been used as this is consistent with the Chinese","q_en":"The EM explains that the peak acceleration comfort criterion of Code 5.3.4 uses what return period?","o_en":["10 years","1 year","50 years","100 years"],"e_en":"A 10-year return period (consistent with JGJ3-2002 and the Canadian NBC 1995) and a 10-minute duration (ISO 6897). Peak acceleration reflects human perception better than RMS. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"31","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","mcq","中級"]},{"id":"SEM-012","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":38,"q":"EM 提供估算建築物最低自然頻率的 rule of thumb？","o":["f0 = 46/H","f0 = 1/(0.1N)","f0 = 100/H","f0 = H/46"],"a":0,"e":"H 為建築物高度（m）。此估算可用於初步判斷是否 wind sensitive；最終應以結構分析為準。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"f0=46/H, where H is the height of the building in metres.","q_en":"What rule of thumb does the EM give for estimating the lowest natural frequency of a building?","e_en":"H is the building height (m). This estimate can be used for a preliminary judgement of whether the building is wind sensitive; final values should come from structural analysis. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"32","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","mcq","中級"]},{"id":"SEM-013","t":"short","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":38,"q":"Code 5.3.4 容許哪三種方法處理高樓 serviceability 及舒適度？","m":"(1) 限制頂部撓度 H/500 及層間位移 storey height/400；(2) 進行動力計算的 serviceability 分析證明符合 (a)(b) 的限值（可配合風洞）；(3) 全面 performance-based design，舒適度準則由業主與設計者協定。","k":["H/500 and h/400","dynamic analysis","performance based design"],"e":"H/500 在 Wind Code 設計風荷載下通常已足夠，但 RSE 仍須逐案考慮。Concrete Code 7.3.2 亦有 H/500。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"The first is to limit the top deflection to Height/500 and the inter storey drift to Storey","q_en":"What three approaches does Code 5.3.4 allow for dealing with serviceability and comfort of tall buildings?","m_en":"(1) Limit the top deflection to H/500 and inter-storey drift to storey height/400; (2) carry out a serviceability analysis with dynamic calculations to demonstrate compliance with the limits in (a)(b) (possibly with wind tunnel testing); (3) full performance-based design, with comfort criteria agreed between the owner and designer.","e_en":"H/500 under the Wind Code design wind load is usually adequate, but the RSE must still consider each case. Concrete Code 7.3.2 also has H/500. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"32","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","short","中級"]},{"id":"WND-040","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1 Note (c)","p":34,"q":"Table 4-1 附註容許在 0.5(H − Hd) 高度以下將外牆壓力減少 20%。","a":true,"e":"因 Qz 取建築頂部，低層外牆可用此附註折減 20%。幕牆計算書常漏用或錯用（例如用 0.5H 而忽略 Hd）。","x":"(c) Cladding pressures can be reduced by 20%, below a height of","q_en":"The note to Table 4-1 allows the external wall pressure to be reduced by 20% below a height of 0.5(H − Hd).","e_en":"True. Because Qz is taken at the top of the building, lower façades may use this note to reduce by 20%. Curtain wall calculations often omit or misuse it (e.g. using 0.5H and ignoring Hd).","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","tf","中級"]},{"id":"WND-041","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.3","p":44,"q":"地形風洞試驗（topography model）最少需要多少個風向？","a":18,"tol":0,"u":"","e":"地形試驗至少 18 個方向（每 20°）；建築荷載試驗則至少 36 個方向（每 10°）。","x":"A minimum of 18 wind directions at 20o intervals is necessary.","q_en":"What is the minimum number of wind directions for a topography wind tunnel model test?","e_en":"Topography tests need at least 18 directions (every 20°); building load tests need at least 36 directions (every 10°).","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-042","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.5","p":44,"q":"一般指引：建築風洞模型比例通常不應小於？","o":["1:100","1:200","1:500","1:1000"],"a":2,"e":"模型不小於 1:500，且尖角模型的 Reynolds number 不少於 1×10^4；圓形模型需額外證明。","x":"A general guide is that the building model should normally be not","q_en":"General guidance: the scale of a building wind tunnel model should usually not be smaller than:","e_en":"Model not smaller than 1:500, with Reynolds number not less than 1×10^4 for sharp-edged models; round models need additional justification.","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","mcq","進階"]},{"id":"WND-043","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.7","p":45,"q":"Built-up terrain 中，風洞配對風壓的 matching height Z 應取？","o":["建築高度","上風周邊高度以上 150 m 或 2/3 建築高度，取較大","2/3 建築高度","500 m"],"a":1,"e":"開闊地形取 2/3 建築高度；市區取周邊有效高度以上 150 m 與 2/3H 的較大值；中間情況兩者都要考慮。審核風洞報告時必須檢查配對方法。","x":"(full-scale) above the height of upwind surroundings (the effective","q_en":"In built-up terrain, the matching height Z for matching wind tunnel pressures should be taken as:","o_en":["The building height","150 m above the upwind surrounding height or 2/3 of the building height, whichever is greater","2/3 of the building height","500 m"],"e_en":"Open terrain: 2/3 of the building height; urban terrain: the greater of 150 m above the effective surrounding height and 2/3H; intermediate cases must consider both. Check the matching method when reviewing wind tunnel reports.","doc":"wind-code-2019","pp":"35","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","mcq","進階"]},{"id":"WND-044","t":"num","d":2,"tp":"風洞試驗 Wind tunnel testing","c":"6.3","p":46,"q":"風洞試驗外牆荷載：典型板件 half-perimeter 2–5 m，以一小時內百分之幾不超越機率取值？","a":80,"tol":0,"u":"%","e":"外牆荷載以 80% non-exceedance 為目標；內壓亦須由量度所得外壓推算。","x":"sizes, for example half-perimeter length of 2m to 5m, with an 80%","q_en":"Wind tunnel cladding loads: for typical panels with half-perimeter 2–5 m, loads are taken at what percentage probability of non-exceedance in one hour?","e_en":"Cladding loads target 80% non-exceedance; internal pressure must also be derived from the measured external pressures.","doc":"wind-code-2019","pp":"36","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","中級"]},{"id":"WND-045","t":"mcq","d":3,"tp":"外牆壓力 Cladding pressure","c":"Table B1-1","p":62,"q":"Table B1-1（有 dominant opening）：外牆邊區 Zone A 的 external pressure coefficient Cpe？","o":["−1.4","−1.2","−1.0","−0.8"],"a":1,"e":"有大開口時分開計外壓 Cpe 與內壓 Cpi；外牆邊區 Cpe −1.2、一般區 −0.8、正壓 +0.8。","x":"Negative pressure A -1.2 in edge zone","q_en":"Table B1-1 (with a dominant opening): external pressure coefficient Cpe for wall edge Zone A?","e_en":"With a large opening, external Cpe and internal Cpi are calculated separately; wall edge zone Cpe −1.2, general zone −0.8, positive +0.8.","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","mcq","進階"]},{"id":"WND-046","t":"num","d":3,"tp":"阻尼 Damping","c":"Table C2-2","p":74,"q":"Table C2-2：高寬比 ≥8 的鋼結構建築，計算加速度的 damping ratio？","a":0.005,"tol":0,"u":"","e":"鋼結構阻尼約為 RC 的一半；composite 結構取中間值。","x":"0.005 0.008 7 0.006 0.009","q_en":"Table C2-2: damping ratio for calculating acceleration of a steel building with aspect ratio ≥8?","e_en":"Steel structures have about half the damping of RC; composite structures take intermediate values.","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","num","進階"]},{"id":"WND-047","t":"tf","d":2,"tp":"阻尼 Damping","c":"Appendix C2","p":74,"q":"共用平台上的塔樓，計算阻尼用 aspect ratio 時亦須以平台以上高度檢查。","a":true,"e":"有退台或共用平台時，aspect ratio 要按平台/退台以上部分另行檢查並取最大值，否則會高估阻尼。","x":"slabs shall be similarly checked above podium level.","q_en":"For towers on a common podium, the aspect ratio used for damping must also be checked using the height above the podium.","e_en":"True. With setbacks or a common podium, the aspect ratio must be checked separately for the part above the podium/setback and the maximum taken, otherwise damping will be overestimated.","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","tf","中級"]},{"id":"WND-048","t":"num","d":2,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1.1","p":62,"q":"計算 Atot 時，洩漏（leakage）取其他外表面總面積的百分之幾？","a":0.1,"tol":0,"u":"%","e":"0.1% leakage 是預設值，有理據可用其他數值。","x":"leakage contribution to 𝐴𝐴𝑡𝑡𝑜𝑜𝑡𝑡 is defined as 0.1% of the","q_en":"When calculating Atot, leakage is taken as what percentage of the total area of the other external surfaces?","e_en":"0.1% leakage is the default; other values may be used with justification.","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","中級"]},{"id":"WND-001","t":"mcq","d":1,"tp":"適用範圍 Scope","c":"1.1","p":11,"q":"Wind Code 2019 的 Standard Method 適用於一般建築物的高度上限是多少？","o":["100 m","150 m","200 m","250 m"],"a":2,"e":"Standard Method 只涵蓋典型建築至 200 m；超過 200 m 必須做 wind tunnel test。實務上 190 m 左右的住宅塔樓已要預早考慮風洞試驗的時間表和費用，唔好等到 BD 提意見先做。","x":"The Standard Method is applicable to typical buildings with a height","q_en":"What is the height limit of the Wind Code 2019 Standard Method for ordinary buildings?","e_en":"The Standard Method covers only typical buildings up to 200 m; above 200 m wind tunnel testing is mandatory. In practice, residential towers of about 190 m should plan the wind tunnel programme and cost early, rather than waiting for BD comments.","doc":"wind-code-2019","pp":"1","tags":["wind-code-2019","適用範圍 Scope","mcq","基礎"]},{"id":"WND-002","t":"short","d":2,"tp":"適用範圍 Scope","c":"1.1","p":11,"q":"列出 Wind Code 2019 要求進行 wind tunnel testing 的情況（至少四項）。","m":"(a) 高度超過 200 m；(b) 形狀特殊/不尋常；(c) 地形或周邊環境複雜；(d) 按規範計算的 across-wind 彎矩遠大於 along-wind（見 2.2.3）；(e) B/D 大於 6（除非可忽略扭轉工況）。","k":["H > 200 m","unusual shape","complicated topography/surroundings","across-wind >> along-wind","B/D > 6"],"e":"呢幾個觸發條件係 BD 審圖時最常問嘅位置。高度以外，最易忽略嘅係 plan aspect ratio B/D>6 同 across-wind 放大系數超過 1.5；兩者都會令 Standard Method 唔再適用。設計初期就應該檢查，避免結構方案定咗先發現要重做。","x":"buildings with B/D>6, except for those satisfying the","q_en":"List the circumstances in which the Wind Code 2019 requires wind tunnel testing (at least four).","m_en":"(a) Height exceeding 200 m; (b) special/unusual shape; (c) complex topography or surroundings; (d) the across-wind moment calculated by the Code greatly exceeds the along-wind moment (see 2.2.3); (e) B/D greater than 6 (unless the torsional load case can be ignored).","e_en":"These triggers are the items BD most often queries in plan vetting. Besides height, the most easily overlooked are plan aspect ratio B/D>6 and an across-wind magnification exceeding 1.5; both make the Standard Method no longer applicable. Check them at the early design stage to avoid redoing a structural scheme after it has been fixed.","doc":"wind-code-2019","pp":"1","tags":["wind-code-2019","適用範圍 Scope","short","中級"]},{"id":"WND-003","t":"num","d":1,"tp":"荷載組合 Load combination","c":"2.3","p":20,"q":"Wind Code 2019 公式中採用的 ultimate wind load factor γw 取值是多少？","a":1.4,"tol":0,"u":"","e":"規範在公式中保留 γw = 1.4，與 CoP Concrete/Steel 的 1.4 wind partial factor 一致。計 across-wind base moment 時要用 factored wind speed 再除返 γw，唔好重複乘 1.4。","x":"ultimate wind load factor, taken as 1.4","q_en":"What value of the ultimate wind load factor γw is adopted in the Wind Code 2019 formulae?","e_en":"The Code retains γw = 1.4 in the formulae, consistent with the 1.4 wind partial factor of the CoP Concrete/Steel. When calculating the across-wind base moment, the factored wind speed is used and then divided back by γw — do not apply 1.4 twice.","doc":"wind-code-2019","pp":"10","tags":["wind-code-2019","荷載組合 Load combination","num","基礎"]},{"id":"WND-004","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"計算扭轉荷載時，當 B/D ≤ 1，偏心距 e 取多少？","o":["±0.05B","±0.10B","±0.15B","±0.20B"],"a":0,"e":"方形平面 e = ±0.05B，B/D=6 時增至 ±0.20B，中間線性內插。長條形平面（例如板式住宅）扭轉效應明顯大，唔好沿用舊 2004 Code 的做法。","x":"geometric centre of area by a horizontal distance given by:","q_en":"When calculating torsional loads with B/D ≤ 1, what eccentricity e is taken?","e_en":"Square plans e = ±0.05B, increasing to ±0.20B at B/D=6, with linear interpolation between. Elongated plans (e.g. slab-type residential blocks) have much larger torsional effects — do not follow the old 2004 Code approach.","doc":"wind-code-2019","pp":"8","tags":["wind-code-2019","扭轉 Torsion","mcq","中級"]},{"id":"WND-005","t":"num","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"B/D = 6 時，扭轉偏心距 e 為 ±?B（填係數）","a":0.2,"tol":0.001,"u":"B","e":"B/D=6 時偏心 0.20B 係上限；B/D 大過 6 已超出 Standard Method 範圍，需要風洞試驗（除非扭轉工況可忽略）。","x":"Use linear interpolation for intermediate values of","q_en":"For B/D = 6, the torsional eccentricity e is ±?B (enter the coefficient)","e_en":"An eccentricity of 0.20B at B/D=6 is the upper limit; B/D above 6 is outside the scope of the Standard Method and requires wind tunnel testing (unless the torsional case can be ignored).","doc":"wind-code-2019","pp":"8","tags":["wind-code-2019","扭轉 Torsion","num","中級"]},{"id":"WND-006","t":"tf","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"高度少於 100 m、各方向 H/B 少於 5、fundamental frequency 大於 0.5 Hz 的建築，可視為滿足 across-wind 檢查要求。","a":true,"e":"呢個係一般中低層建築免計 across-wind 嘅捷徑。注意三個條件要同時滿足；頻率唔好用經驗公式亂估，2023 年 EN 修訂亦補充咗多塔共用平台時點樣取頻率。","x":"Buildings with height less than 100 m, with","q_en":"A building less than 100 m high, with H/B less than 5 in each direction and fundamental frequency greater than 0.5 Hz, may be deemed to satisfy the across-wind check.","e_en":"True. This is the shortcut exempting ordinary low- and medium-rise buildings from across-wind calculations. All three conditions must be met; do not estimate the frequency loosely from empirical formulae — the 2023 EN amendment also clarifies how to take the frequency for multiple towers on a common podium.","doc":"wind-code-2019","pp":"9","tags":["wind-code-2019","Across-wind","tf","中級"]},{"id":"WND-007","t":"num","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"免除 across-wind 檢查的條件之一：fundamental frequency 必須大於多少 Hz？","a":0.5,"tol":0,"u":"Hz","e":"0.5 Hz 即週期 2 秒。高而柔嘅塔樓頻率往往低過 0.5 Hz，就要按 2.2.3 計 across-wind base moment。","x":"than 5, and with fundamental frequencies greater than 0.5 Hz, will","q_en":"One of the conditions for exemption from the across-wind check: the fundamental frequency must be greater than how many Hz?","e_en":"0.5 Hz is a period of 2 seconds. Tall flexible towers often have frequencies below 0.5 Hz, and must then have the across-wind base moment calculated per 2.2.3.","doc":"wind-code-2019","pp":"9","tags":["wind-code-2019","Across-wind","num","中級"]},{"id":"WND-008","t":"num","d":3,"tp":"Across-wind","c":"2.2.3","p":21,"q":"若 across-wind 與 along-wind base moment 之比（放大系數）超過多少，必須進行 wind tunnel testing？","a":1.5,"tol":0,"u":"","e":"比值不超過 1.5 時可將 along-wind 荷載放大至與 across-wind 相同 base moment；超過 1.5 表示渦流脫落效應顯著，規範要求風洞試驗。Explanatory Notes 有實例（271/190=1.43<1.5）。","x":"1.5, then wind tunnel testing must be conducted.","q_en":"If the ratio of across-wind to along-wind base moment (magnification factor) exceeds what value, wind tunnel testing is mandatory?","e_en":"For ratios not exceeding 1.5, the along-wind loads may be scaled up to give the same base moment as across-wind; above 1.5, vortex shedding effects are significant and the Code requires wind tunnel testing. The Explanatory Notes give an example (271/190=1.43<1.5).","doc":"wind-code-2019","pp":"11","tags":["wind-code-2019","Across-wind","num","進階"]},{"id":"WND-009","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"2.2.4 / Table 2-1","p":22,"q":"Table 2-1 Case 1 的 load combination factors（Wx、Wy、ΔTz）是？","o":["±1.00, ±0.55, ±0.55","±1.00, ±0.50, ±0.50","±1.00, ±0.75, ±0.75","±1.00, ±1.00, ±0.55"],"a":0,"e":"三個 case 輪流以其中一個分量取 1.00、其餘取 0.55，連正負號共 24 個組合。ETABS 模型要逐個 load case 設定，常見錯誤係漏咗負號組合或者扭轉未作用喺 centre-of-area。","x":"1 ±1.00 ±0.55 ±0.55 2 ±0.55 ±1.00 ±0.55","q_en":"What are the load combination factors (Wx, Wy, ΔTz) for Table 2-1 Case 1?","e_en":"In the three cases, each component in turn takes 1.00 while the others take 0.55, giving 24 combinations including signs. Each load case must be set up in the ETABS model; common errors are omitting the negative-sign combinations or not applying torsion at the centre-of-area.","doc":"wind-code-2019","pp":"12","tags":["wind-code-2019","荷載組合 Load combination","mcq","中級"]},{"id":"WND-010","t":"tf","d":2,"tp":"荷載組合 Load combination","c":"2.2.4","p":22,"q":"每層的風荷載合力必須作用於該層的 centre-of-area（可隨高度變化）。","a":true,"e":"風荷載作用點係 centre-of-area，唔係 centre of mass 或 centre of rigidity。電腦模型要自己定義每層加載點，否則扭轉效應會錯。","x":"The resultant of loads at each level must act through the centre-of-area","q_en":"The resultant wind load at each floor must act at the centre-of-area of that floor (which may vary with height).","e_en":"True. Wind load acts at the centre-of-area, not the centre of mass or centre of rigidity. The loading point for each floor must be defined in the computer model, otherwise the torsional effect will be wrong.","doc":"wind-code-2019","pp":"12","tags":["wind-code-2019","荷載組合 Load combination","tf","中級"]},{"id":"WND-011","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.4","p":23,"q":"以下哪種建築 NOT 屬於可正式忽略扭轉荷載工況的情況？","o":["單層、高度不超過 10 m 的建築","高度不超過 70 m、周邊設有側向抗力結構的建築","通過 torsional regularity check 的建築","高度 120 m、核心筒居中但周邊無抗側力構件的建築"],"a":3,"e":"規範列出三類可忽略扭轉：單層≤10 m、≤70 m 周邊抗側力、通過 torsional regularity check（扭轉引起層間位移 <25% 側向）。核心筒居中但無周邊牆柱的高樓扭轉剛度弱，一定要計。","x":"buildings of up to 70 m height with a peripheral lateral load","q_en":"Which of the following is NOT a case in which the torsional load case may formally be ignored?","o_en":["A single-storey building not exceeding 10 m high","A building not exceeding 70 m high with perimeter lateral-load-resisting structure","A building passing the torsional regularity check","A 120 m building with a central core but no perimeter lateral-load-resisting members"],"e_en":"The Code lists three cases where torsion may be ignored: single storey ≤10 m, ≤70 m with perimeter lateral resistance, and passing the torsional regularity check (torsion-induced inter-storey drift <25% of lateral). Tall buildings with a central core and no perimeter walls/columns have weak torsional stiffness and torsion must be included.","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","mcq","中級"]},{"id":"WND-012","t":"num","d":3,"tp":"扭轉 Torsion","c":"2.2.4(c)","p":23,"q":"Torsional regularity check：扭轉荷載引起的最大層間位移須少於側向荷載引起者的百分之幾？","a":25,"tol":0,"u":"%","e":"通過 25% 檢查可忽略扭轉工況；若不大於 50%，可省略 Table 2-1 Case 3（主要扭轉）組合，由 24 個減至 16 個。","x":"less than 25% of that due to the lateral load","q_en":"Torsional regularity check: the maximum inter-storey drift due to torsional load must be less than what percentage of that due to lateral load?","e_en":"Passing the 25% check allows the torsional case to be ignored; if not greater than 50%, Table 2-1 Case 3 (dominant torsion) combinations may be omitted, reducing 24 combinations to 16.","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","num","進階"]},{"id":"WND-013","t":"num","d":3,"tp":"扭轉 Torsion","c":"2.2.4(d)","p":23,"q":"若扭轉層間位移不大於側向位移的百分之幾，Table 2-1 Case 3 無需計算？","a":50,"tol":0,"u":"%","e":"介乎 25% 至 50% 之間屬中度扭轉，只可省略 Case 3，Case 1、2 內嘅 0.55 扭轉分量仍要計。","x":"greater than 50% of the lateral drift, the Case 3 in Table 2-1","q_en":"If torsional inter-storey drift is not greater than what percentage of lateral drift, Table 2-1 Case 3 need not be calculated?","e_en":"Between 25% and 50% is moderate torsion: only Case 3 may be omitted; the 0.55 torsional component in Case 1 and Case 2 must still be included.","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","num","進階"]},{"id":"WND-014","t":"short","d":2,"tp":"外牆壓力 Cladding pressure","c":"2.3","p":24,"q":"說明 Wind Code 2019 計算封閉建築外牆淨風壓 P 的公式，以及有 dominant opening 時如何處理。","m":"封閉建築：P = Qz·Cp·Ss（Qz 取建築頂部參考風壓、Cp 為淨壓力系數、Ss 為尺寸系數）。有 dominant opening 時須分開計算外壓與內壓，P = Pe − Pi（見 Appendix B1）。","k":["P = Qz Cp Ss","Qz at top of building","dominant opening: P = Pe − Pi","Appendix B1"],"e":"幕牆顧問常問 Qz 取邊個高度：2019 版改為取建築頂部，唔係構件所在高度，同 2004 Code 唔同。有大開口（例如停車場、平台開放層）時唔可以直接用淨壓力系數。","x":"are determined from the difference between pressures on opposite","q_en":"State the Wind Code 2019 formula for the net wind pressure P on the cladding of an enclosed building, and how a dominant opening is handled.","m_en":"Enclosed building: P = Qz·Cp·Ss (Qz = reference wind pressure at the top of the building, Cp = net pressure coefficient, Ss = size factor). With a dominant opening, external and internal pressures are calculated separately, P = Pe − Pi (see Appendix B1).","e_en":"Curtain wall consultants often ask at which height Qz is taken: the 2019 edition takes it at the top of the building, not at the height of the element — different from the 2004 Code. With large openings (e.g. car parks, open podium floors), net pressure coefficients cannot be used directly.","doc":"wind-code-2019","pp":"14","tags":["wind-code-2019","外牆壓力 Cladding pressure","short","中級"]},{"id":"WND-015","t":"tf","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"非住用、使用期不超過一年的臨時建築，可按永久建築設計風荷載的最少 70% 設計。","a":true,"e":"70% 只適用於非住用且使用期≤1年；超過一年或有人居住就要用全額。地盤辦公室若會留兩三年，就唔可以用呢個折減。","x":"period of not more than one year, may be designed for a minimum of","q_en":"Temporary non-domestic buildings with a use period not exceeding one year may be designed for at least 70% of the wind load for permanent buildings.","e_en":"True. The 70% applies only to non-domestic use of ≤1 year; for more than one year or occupied accommodation, use the full value. A site office that will stay for two or three years cannot use this reduction.","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","臨時結構 Temporary structures","tf","基礎"]},{"id":"WND-016","t":"num","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"地盤圍板（hoarding）、有蓋行人通道、工人棚等：Qz 取 Qo,z 的百分之幾？","a":37,"tol":0,"u":"%","e":"37% Qo,z 且不再乘其他調整系數。2023 年 EN 修訂更提供了 hoarding/covered walkway 的全包淨壓力表（≤2.5 m 0.63 kPa），實務上更方便。","x":"is taken as 37% of","q_en":"For site hoardings, covered walkways, workers' sheds, etc., Qz is taken as what percentage of Qo,z?","e_en":"37% Qo,z with no further adjustment factors. The 2023 EN amendment also provides an all-inclusive net pressure table for hoardings/covered walkways (≤2.5 m 0.63 kPa), which is more convenient in practice.","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","臨時結構 Temporary structures","num","基礎"]},{"id":"WND-017","t":"num","d":2,"tp":"加速度 Acceleration","c":"2.4.1","p":26,"q":"若無模態分析比較，計算建築頂部四分之一高度內加速度時 ηy 可取多少？","a":1.5,"tol":0,"u":"","e":"ηy 係模態形狀修正；頂部四分一高度保守取 1.5。住宅塔樓舒適度檢查通常睇頂層，唔好漏乘。","x":"be 1.5 for calculation of accelerations within the top quarter","q_en":"Without a modal analysis comparison, what value of ηy may be taken when calculating acceleration within the top quarter of the building height?","e_en":"ηy is a mode shape correction; conservatively 1.5 within the top quarter of the height. Residential tower comfort checks usually look at the top floor — do not omit this factor.","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","加速度 Acceleration","num","中級"]},{"id":"WND-018","t":"tf","d":2,"tp":"加速度 Acceleration","c":"2.4.2","p":26,"q":"Occupant comfort 只需檢查 10 年回歸期的 peak acceleration。","a":false,"e":"規範要求 1 年及 10 年回歸期的 peak acceleration 都低於 Figure 2-6 限值。按 EN 解釋，用 code method 時兩者比例固定（3.67），實際只需檢查一個；但風洞試驗兩個都要檢查。","x":"The occupant comfort is considered acceptable if the 1-year and","q_en":"Occupant comfort need only be checked for the peak acceleration at the 10-year return period.","e_en":"False. The Code requires peak accelerations at both 1-year and 10-year return periods to be below the Figure 2-6 limits. According to the EN, with the code method the ratio between the two is fixed (3.67), so only one needs checking in effect; but with wind tunnel testing both must be checked.","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","加速度 Acceleration","tf","中級"]},{"id":"WND-019","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"3.2 / Table 3-1","p":27,"q":"Table 3-1：有效高度 100 m 的 Qo,z 是多少 kPa？","o":["2.56","2.73","2.86","3.05"],"a":2,"e":"Qo,z 由 3.7(Ze/500)^0.16 得出，100 m 為 2.86 kPa。記住幾個錨點（10 m 1.98、50 m 2.56、100 m 2.86、200 m 3.20）方便快速估算和審核計算書。","x":"75 2.73 100 2.86 150 3.05","q_en":"Table 3-1: Qo,z (kPa) at an effective height of 100 m?","e_en":"Qo,z comes from 3.7(Ze/500)^0.16; 2.86 kPa at 100 m. Remember a few anchor points (10 m 1.98, 50 m 2.56, 100 m 2.86, 200 m 3.20) for quick estimates and checking calculations.","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","mcq","基礎"]},{"id":"WND-020","t":"num","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 200 m 的 Qo,z（kPa）？","a":3.2,"tol":0.005,"u":"kPa","e":"200 m 為 3.20 kPa，也是 Standard Method 適用高度上限附近的數值。","x":"150 3.05 200 3.20 250 3.31","q_en":"Table 3-1: Qo,z (kPa) at an effective height of 200 m?","e_en":"3.20 kPa at 200 m, which is also the value near the height limit of the Standard Method.","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","num","基礎"]},{"id":"WND-021","t":"num","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 ≤2.5 m 的 Qo,z（kPa）？","a":1.59,"tol":0.005,"u":"kPa","e":"低矮構築物（圍板、小型構築物）以 1.59 kPa 為下限，再按 2.5 臨時結構規定折減。","x":"2.5 1.59 5 1.77 10 1.98","q_en":"Table 3-1: Qo,z (kPa) at an effective height of ≤2.5 m?","e_en":"Low structures (hoardings, small structures) take 1.59 kPa as the lower bound, then reduce per the temporary structure provisions of 2.5.","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","num","基礎"]},{"id":"WND-022","t":"tf","d":2,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1 提供有效高度超過 500 m 的 Qo,z 數值。","a":false,"e":"超過 500 m 規範寫明 Seek specialist advice；實際上 >200 m 已必須做風洞試驗。","x":"Seek specialist advice","q_en":"Table 3-1 gives Qo,z values for effective heights above 500 m.","e_en":"False. Above 500 m the Code says \"Seek specialist advice\"; in fact wind tunnel testing is already mandatory above 200 m.","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","tf","中級"]},{"id":"WND-023","t":"tf","d":2,"tp":"有效高度 Effective height","c":"3.3","p":28,"q":"計算參考風壓時，有效高度 Ze 可保守地取實際高度。","a":true,"e":"Ze 可按 Appendix A2 考慮周邊建築遮擋而降低，但保守可直接取實際高度。用遮擋折減時要確保周邊建築係長期存在，否則有風險。","x":"may conservatively be taken as the actual height","q_en":"When calculating the reference wind pressure, the effective height Ze may conservatively be taken as the actual height.","e_en":"True. Ze may be reduced for shelter from surrounding buildings per Appendix A2, but the actual height may conservatively be used directly. When using shelter reduction, ensure the surrounding buildings are permanent, otherwise there is a risk.","doc":"wind-code-2019","pp":"18","tags":["wind-code-2019","有效高度 Effective height","tf","中級"]},{"id":"WND-024","t":"num","d":2,"tp":"力系數 Force coefficient","c":"4.2","p":29,"q":"圓形平面、高度/直徑比不大於 6 的建築，force coefficient 可取多少？","a":0.75,"tol":0,"u":"","e":"圓形平面 Cf 明顯低於矩形，但方向系數 Sθ 要取 1（見 Appendix A1）。","x":"diameter ratio not larger than 6 can be taken as 0.75.","q_en":"For a building of circular plan with height/diameter ratio not greater than 6, what force coefficient may be taken?","e_en":"Cf for circular plans is significantly lower than for rectangular plans, but the directionality factor Sθ must be taken as 1 (see Appendix A1).","doc":"wind-code-2019","pp":"19","tags":["wind-code-2019","力系數 Force coefficient","num","中級"]},{"id":"WND-025","t":"tf","d":3,"tp":"力系數 Force coefficient","c":"4.2","p":31,"q":"影響少於建築高度 10% 的平面退台（plan steps）可在計算 Cf 時忽略。","a":true,"e":"頂層小退台或冠頂位置不必另計 Cf；但大幅退台就要分段處理。","x":"Steps in plan size affecting less than 10% of","q_en":"Plan steps affecting less than 10% of the building height may be ignored when calculating Cf.","e_en":"True. Small setbacks at the top floor or crown need no separate Cf, but large setbacks must be treated in segments.","doc":"wind-code-2019","pp":"21","tags":["wind-code-2019","力系數 Force coefficient","tf","進階"]},{"id":"WND-026","t":"mcq","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：平屋頂角區（Zone C）的 net pressure coefficient 是？","o":["−1.0","−1.6","−2.2","−1.4"],"a":2,"e":"屋頂角位 −2.2、邊位 −1.6、中間 −1.0；外牆邊位 −1.4。屋面防水層、天台設備及 parapet 固定要按角區吸力設計，常被低估。","x":"Negative pressure in C -2.2 corner zone","q_en":"Table 4-1: net pressure coefficient for a flat roof corner zone (Zone C)?","e_en":"Roof corners −2.2, edges −1.6, middle −1.0; wall edges −1.4. Roof waterproofing, rooftop plant and parapet fixings must be designed for corner suction, which is often underestimated.","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","mcq","中級"]},{"id":"WND-027","t":"num","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：外牆邊區（Zone A）的負 net pressure coefficient（填負值）？","a":-1.4,"tol":0,"u":"","e":"外牆邊區 −1.4、一般區 −1.0、正壓 +1.1。幕牆角位玻璃和鋁框要用 −1.4，再乘尺寸系數 Ss。","x":"Negative pressure in A -1.4 edge zone","q_en":"Table 4-1: negative net pressure coefficient for wall edge Zone A (enter a negative value)?","e_en":"Wall edge zone −1.4, general zone −1.0, positive +1.1. Curtain wall corner glass and aluminium frames must use −1.4, multiplied by the size factor Ss.","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","中級"]},{"id":"WND-028","t":"mcq","d":3,"tp":"開放框架 Open framework","c":"Table 4-2","p":39,"q":"Table 4-2：solidity ratio 0.5 的 open-framework 構件其系數是？","o":["1.5","1.6","1.8","2.0"],"a":0,"e":"solidity ratio 0.5–0.8 取最低 1.5，極稀或實心 (0.01/1.0) 取 2.0。棚架、鐵塔、天線支架常用。","x":"0.3 1.6 0.5 1.5","q_en":"Table 4-2: coefficient for open-framework members with a solidity ratio of 0.5?","e_en":"Solidity ratios 0.5–0.8 take the lowest value of 1.5; very sparse or solid (0.01/1.0) take 2.0. Commonly used for scaffolding, pylons and antenna supports.","doc":"wind-code-2019","pp":"29","tags":["wind-code-2019","開放框架 Open framework","mcq","進階"]},{"id":"WND-029","t":"num","d":2,"tp":"尺寸及動力系數 Size & dynamic factor","c":"5.1","p":42,"q":"高度少於多少 m 的建築可用簡化 Sq = 1.1Ss？","a":50,"tol":0,"u":"m","e":"低於 50 m 的建築動力效應不顯著，可簡化；高樓要按完整 Sq,z 公式計算，包括 fundamental frequency 和 damping。","x":"For buildings of less than 50m height, the following simplified","q_en":"Buildings less than how many m high may use the simplified Sq = 1.1Ss?","e_en":"Buildings below 50 m have insignificant dynamic effects and may be simplified; tall buildings must use the full Sq,z formula, including fundamental frequency and damping.","doc":"wind-code-2019","pp":"32","tags":["wind-code-2019","尺寸及動力系數 Size & dynamic factor","num","中級"]},{"id":"WND-030","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":44,"q":"風洞試驗中周邊建築模型（proximity model）的半徑一般不少於多少 m？","a":400,"tol":0,"u":"m","e":"proximity model 半徑≥400 m 並至少 36 個風向（每 10°）。審核風洞報告時要檢查呢兩項。","x":"less than 400m radius from the site.","q_en":"In wind tunnel testing, the radius of the proximity model is generally not less than how many m?","e_en":"Proximity model radius ≥400 m and at least 36 wind directions (every 10°). Check both when reviewing wind tunnel reports.","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-031","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":45,"q":"風洞阻塞率（blockage）一般不應超過百分之幾？","a":10,"tol":0,"u":"%","e":"阻塞過大會令風速和壓力失真，需修正或改用較小比例模型。","x":"testing should not normally be allowed to exceed 10%, including","q_en":"Wind tunnel blockage should generally not exceed what percentage?","e_en":"Excessive blockage distorts wind speeds and pressures; corrections or a smaller-scale model are needed.","doc":"wind-code-2019","pp":"35","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-032","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.4","p":46,"q":"新建築以風洞試驗設計時，最少須抵抗 Standard Method 荷載的百分之幾（一般情況）？","a":80,"tol":0,"u":"%","e":"風洞結果低過 Standard Method 80% 都要取 80%；做 building removal investigation 可放寬至 along-wind 的 70%。2023 年 EN 修訂澄清比較應以 total base moment 形式進行。","x":"New buildings should resist a minimum of 80% of the load of the","q_en":"When a new building is designed from wind tunnel testing, it must resist at least what percentage of the Standard Method loads (general case)?","e_en":"If wind tunnel results are below 80% of the Standard Method, 80% must be used; with a building removal investigation this may be relaxed to 70% of along-wind. The 2023 EN amendment clarifies that the comparison should be made in terms of total base moment.","doc":"wind-code-2019","pp":"36","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-033","t":"mcq","d":2,"tp":"方向系數 Directionality","c":"Appendix A1 / Table A1-1","p":50,"q":"Table A1-1 中哪個風向的 Sθ 最低？","o":["N (0.82)","NW (0.80)","W (0.82)","NE (0.84)"],"a":1,"e":"NW 0.80 最低，E/SE/S 0.85 最高。使用時要取該 90° 扇區內最大 Sθ；圓形建築必須取 1。","x":"SW 0.84 W 0.82 NW 0.80","q_en":"Which wind direction has the lowest Sθ in Table A1-1?","e_en":"NW 0.80 is lowest, E/SE/S 0.85 highest. Use the maximum Sθ within the relevant 90° sector; circular buildings must take 1.","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","方向系數 Directionality","mcq","中級"]},{"id":"WND-034","t":"tf","d":2,"tp":"方向系數 Directionality","c":"Appendix A1","p":50,"q":"圓形平面建築可按 Table A1-1 採用方向系數 Sθ 折減。","a":false,"e":"圓形建築任何風向反應相同，規範要求 Sθ = 1。","x":"The directionality factor does not apply to circular buildings.","q_en":"Buildings of circular plan may use the directionality factor Sθ reduction of Table A1-1.","e_en":"False. Circular buildings respond the same in every wind direction, and the Code requires Sθ = 1.","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","方向系數 Directionality","tf","中級"]},{"id":"WND-035","t":"num","d":2,"tp":"加速度 Acceleration","c":"Table A1-2","p":50,"q":"Table A1-2：10 年回歸期的 return period factor on pressure Sr？","a":0.55,"tol":0,"u":"","e":"1 年 0.25、10 年 0.55，用於舒適度加速度計算。Explanatory Notes 指出按 NBCC 方法，10 年與 1 年加速度比約為 √(0.55/0.25) 的 3.3 次方 ≈ 3.67，所以用 code method 時只需檢查一個回歸期。","x":"return period factors in Table A1-2.","q_en":"Table A1-2: return period factor on pressure Sr for a 10-year return period?","e_en":"1 year 0.25, 10 years 0.55, used for comfort acceleration calculations. The Explanatory Notes point out that by the NBCC method, the ratio of 10-year to 1-year acceleration is about √(0.55/0.25) raised to the power 3.3 ≈ 3.67, so with the code method only one return period needs checking.","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","加速度 Acceleration","num","中級"]},{"id":"WND-036","t":"scenario","d":3,"tp":"有效高度 Effective height","c":"Appendix A2","p":51,"q":"設計一幢 60 m 住宅，上風方向 150 m 內有兩幢 80 m 舊樓。你想用 direct shelter 降低 Ze。說明規範的要點及限制。","m":"按 Appendix A2：Ze = max(Z − Hd, 0.25Z)，Hd = min(0.8Ho, 1.2Ho − 0.2Xo, 0.75H)；只考慮 Xo < 6H 的建築；只有一幢遮擋建築時不得考慮遮擋，兩幢或以上時採用第二有效的遮擋建築；扇區至少分 4 份。","k":["Ze = max(Z−Hd, 0.25Z)","Hd limits incl. 0.75H","Xo < 6H","≥2 obstructing buildings, use 2nd most sheltering","conservatively use actual height"],"e":"遮擋折減係雙刃劍：舊樓重建後風荷載會增加。資深做法係只喺周邊建築穩定（例如政府建築）時才用，並喺計算書清楚列明假設。","x":"If there is only one obstructing building, no sheltering effect is","q_en":"A 60 m residential building is being designed, with two 80 m old buildings within 150 m upwind. You want to use direct shelter to reduce Ze. State the key points and limitations of the Code.","m_en":"Per Appendix A2: Ze = max(Z − Hd, 0.25Z), Hd = min(0.8Ho, 1.2Ho − 0.2Xo, 0.75H); only buildings with Xo < 6H are considered; shelter may not be considered with only one sheltering building; with two or more, the second most effective sheltering building is used; the sector is divided into at least 4 parts.","e_en":"Shelter reduction is a double-edged sword: wind loads will increase when the old buildings are redeveloped. Experienced practice is to use it only where the surrounding buildings are stable (e.g. government buildings), and to state the assumption clearly in the calculations.","doc":"wind-code-2019","pp":"A2","tags":["wind-code-2019","有效高度 Effective height","scenario","進階"]},{"id":"WND-037","t":"num","d":3,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1","p":62,"q":"Appendix B1：開口面積 Ao 大於其他面總開口的多少倍時，被視為 dominant opening？","a":1.5,"tol":0,"u":"倍","e":"Ao > 1.5Atot 即屬 dominant opening，要分開計內外壓。EN 修訂把 accidental dominant open 情況改寫為「非強制要求」。","x":"Sum of areas of openings on other faces, including leakage.","q_en":"Appendix B1: an opening is regarded as dominant when its area Ao exceeds how many times the total area of openings on the other faces?","e_en":"Ao > 1.5Atot is a dominant opening, and internal and external pressures must be calculated separately. The EN amendment rewrote the accidental dominant opening case as a \"non-mandatory requirement\".","u_en":"times","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","進階"]},{"id":"WND-038","t":"mcq","d":3,"tp":"阻尼 Damping","c":"Appendix C2 / Table C2-1","p":74,"q":"Table C2-1：高寬比 ≥8 的 RC 建築，計算加速度及荷載的 damping ratio 分別為？","o":["0.010 / 0.015","0.020 / 0.030","0.015 / 0.020","0.013 / 0.020"],"a":0,"e":"越細長 damping 越低；計加速度用較低值，計強度荷載用較高值。用錯（例如兩者都用 0.02）會低估塔樓反應。","x":"0.010 0.015 7 0.011 0.017","q_en":"Table C2-1: damping ratios for calculating acceleration and loads respectively for an RC building with aspect ratio ≥8?","e_en":"The more slender, the lower the damping; acceleration uses the lower value, strength loads the higher. Using the wrong one (e.g. 0.02 for both) underestimates the tower response.","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","mcq","進階"]},{"id":"WEN-001","t":"mcq","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"根據 Explanatory Notes，Code 的參考風壓配合 1.4 wind load factor 使用時，ULS 風荷載被校準為相當於多少年回歸期？","o":["至少 50 年","至少 200 年","至少 1,000–1,500 年","至少 10,000 年"],"a":2,"e":"Code 本身的 Qo,z 係「未乘系數」的參考風壓，乘 γw 1.4 之後大約對應 1,000–1,500 年回歸期。了解呢點有助向業主或審批方解釋點解唔可以隨意減 γw。","x":"of at least 1,000-1,500 year return which is consistent with the level of","q_en":"According to the Explanatory Notes, when the Code reference wind pressure is used with the 1.4 wind load factor, the ULS wind load is calibrated to correspond to what return period?","o_en":["At least 50 years","At least 200 years","At least 1,000–1,500 years","At least 10,000 years"],"e_en":"The Code's Qo,z is an \"unfactored\" reference wind pressure; multiplied by γw 1.4 it corresponds to roughly a 1,000–1,500 year return period. Understanding this helps explain to clients or approving authorities why γw cannot be reduced at will.","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","mcq","中級"]},{"id":"WEN-002","t":"num","d":3,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes：Code 參考風壓相當於開放海面風暴、在 500 m 參考高度的平均風速為多少 m/s？","a":59.5,"tol":0.1,"u":"m/s","e":"59.5 m/s @500 m 係 Qo,z 公式背後的風速假設，風洞試驗配對風壓（Equation 6-2）時亦以此為基礎。","x":"59.5 m/s at reference height of 500m.","q_en":"Explanatory Notes: the Code reference wind pressure corresponds to an open-sea storm with a mean wind speed of how many m/s at the 500 m reference height?","e_en":"59.5 m/s @500 m is the wind speed assumption behind the Qo,z formula, and is also the basis for matching wind tunnel pressures (Equation 6-2).","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","num","進階"]},{"id":"WEN-003","t":"tf","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes 指出，3.7 peak factor 實際上約對應 3 秒平均風速。","a":false,"e":"最新研究顯示 3.7 peak factor 約對應 0.35 秒平均，而非傳統理解的 3 秒陣風；但這不影響結構或外牆風荷載的計算，主要影響 size factor 和風洞量度。","x":"peak factor actually corresponds to about 0.35s-average. However,","q_en":"The Explanatory Notes state that the 3.7 peak factor actually corresponds to about a 3-second mean wind speed.","e_en":"False. Recent research shows the 3.7 peak factor corresponds to about a 0.35-second average, not the traditionally understood 3-second gust; this does not affect structural or cladding wind load calculations, mainly the size factor and wind tunnel measurements.","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","tf","中級"]},{"id":"WEN-004","t":"num","d":3,"tp":"有效高度 Effective height","c":"EN 3.3","p":23,"q":"有效高度不得少於參考高度的 25%，這把設計風壓的折減限制在百分之幾以內？","a":20,"tol":0,"u":"%","e":"0.25^0.16 ≈ 0.8，即遮擋最多減 20% 風壓。BS 6399-2 用 40% 下限是基於 urban exposure，同樣相當於 0.8。","x":"limits the reduction of design pressure to 20% using the open-sea","q_en":"The effective height may not be less than 25% of the reference height. This limits the reduction in design wind pressure to within what percentage?","e_en":"0.25^0.16 ≈ 0.8, i.e. shelter reduces wind pressure by at most 20%. BS 6399-2 uses a 40% lower limit based on urban exposure, which is likewise equivalent to 0.8.","doc":"wind-explanatory-notes-2019","pp":"15","tags":["wind-explanatory-notes-2019","有效高度 Effective height","num","進階"]},{"id":"WEN-005","t":"short","d":3,"tp":"有效高度 Effective height","c":"EN 3.3","p":23,"q":"為何 Explanatory Notes 提醒：低矮建築靠近高樓時，有效高度規則未必保守？應如何處理？","m":"高樓底部附近會出現加速風（accelerated wind speeds），有效高度規則未能反映；可按 BS EN（Clause A.4）或其他國際標準評估，或以風洞試驗處理。","k":["accelerated wind near base of tall buildings","effective height not necessarily conservative","BS EN Clause A.4 / other standards","wind tunnel testing"],"e":"典型例子是高樓旁的平台、有蓋行人道或低層幕牆。唔好因為周邊有高樓就當係遮擋而減風壓，反而可能要加。","x":"values and the effect of possible accelerated wind flow due to the","q_en":"Why do the Explanatory Notes warn that the effective height rule may not be conservative for low buildings near tall buildings? How should this be handled?","m_en":"Accelerated wind speeds occur near the base of tall buildings, which the effective height rule does not reflect; assess per BS EN (Clause A.4) or other international standards, or by wind tunnel testing.","e_en":"Typical examples are podiums, covered walkways or low-level curtain walls beside tall buildings. Do not treat nearby tall buildings as shelter and reduce the wind pressure — it may actually need to be increased.","doc":"wind-explanatory-notes-2019","pp":"15","tags":["wind-explanatory-notes-2019","有效高度 Effective height","short","進階"]},{"id":"WEN-006","t":"mcq","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC across-wind 方法原本校準的 B/D 範圍是？","o":["0.5 < B/D < 2","0.25 < B/D < 4","1 < B/D < 6","B/D < 1"],"a":0,"e":"NBCC 原校準範圍 0.5<B/D<2；EN 指出經驗顯示可合理延伸至約 1:4 或 4:1，超出後視乎扭轉重要性可能需要風洞試驗。","x":"Based on more recent experience of wind tunnel testing, the use of the","q_en":"The NBCC across-wind method was originally calibrated for what range of B/D?","e_en":"The original NBCC calibration range is 0.5<B/D<2; the EN notes that experience shows it can reasonably be extended to about 1:4 or 4:1, beyond which wind tunnel testing may be needed depending on the importance of torsion.","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","mcq","進階"]},{"id":"WEN-007","t":"num","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC 方法的 across-wind base moment 與風速的幾次方成正比？","a":3.3,"tol":0,"u":"","e":"風壓與風速平方成正比，但 across-wind 彎矩約與風速 3.3 次方成正比，所以規範直接用 factored wind speed 計算 ultimate across-wind moment 再除 γw，而唔係將 service 值乘 1.4。","x":"methodology is proportional to wind speed to the power of 3.3 rather","q_en":"In the NBCC method, the across-wind base moment is proportional to the wind speed raised to what power?","e_en":"Wind pressure is proportional to the square of wind speed, but the across-wind moment is proportional to about the 3.3 power of wind speed, so the Code calculates the ultimate across-wind moment directly with the factored wind speed and then divides by γw, instead of multiplying the service value by 1.4.","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","num","進階"]},{"id":"WEN-008","t":"scenario","d":3,"tp":"Across-wind","c":"EN 2.2.3 example","p":15,"q":"某塔樓 WX1 方向：along-wind 彎矩 WX1+ 190、WX1− 161；WX2 方向 across-wind 彎矩分別為 207 及 271（NMm）。判斷是否需風洞試驗，並計 WX1− 的 along-wind 放大系數。","m":"max(207,271)/max(190,161) = 271/190 = 1.43 < 1.5，毋須風洞試驗，可用 Standard Method。WX1− 放大系數 = 271/161 = 1.68，把 WX1− along-wind 荷載放大 1.68 倍。","k":["判斷用 max across / max along","1.43 < 1.5 → Standard Method","放大系數逐個方向計","WX1−: 271/161 = 1.68"],"e":"常見錯誤係用同一方向 +/− 的最大值去判斷後，就以為放大系數一律 1.43；其實每個 load direction 要各自計，較細的 along-wind 方向放大得更多（1.68）。","x":"(a) WX1: (207,271)max/ (190,161)max=271/190=1.43 < 1.5","q_en":"For a tower in direction WX1: along-wind moments WX1+ 190, WX1− 161; the across-wind moments in direction WX2 are 207 and 271 respectively (NMm). Determine whether wind tunnel testing is needed, and calculate the along-wind magnification factor for WX1−.","m_en":"max(207,271)/max(190,161) = 271/190 = 1.43 < 1.5, so no wind tunnel test is needed and the Standard Method may be used. WX1− magnification factor = 271/161 = 1.68; the WX1− along-wind load is magnified 1.68 times.","k_en":["Judge using max across / max along","1.43 < 1.5 → Standard Method","Calculate the magnification factor for each direction","WX1−: 271/161 = 1.68"],"e_en":"A common error is to judge using the maximum of +/− in the same direction and then assume the magnification factor is 1.43 throughout; in fact each load direction is calculated separately, and the smaller along-wind direction is magnified more (1.68).","doc":"wind-explanatory-notes-2019","pp":"7","tags":["wind-explanatory-notes-2019","Across-wind","scenario","進階"]},{"id":"WEN-009","t":"num","d":2,"tp":"荷載組合 Load combination","c":"EN 2.2.4","p":16,"q":"Code 的 envelope parameters 產生多少個 Fx、Fy、Mz 荷載組合？","a":24,"tol":0,"u":"","e":"3 個 case × 8 個正負號組合 = 24。完全忽略扭轉可減至 8 個；只省略 Case 3 則 16 個。","x":"in 24 combinations of the 3 basic load cases for the lateral and","q_en":"How many Fx, Fy, Mz load combinations do the Code's envelope parameters produce?","e_en":"3 cases × 8 sign combinations = 24. Ignoring torsion entirely reduces this to 8; omitting only Case 3 gives 16.","doc":"wind-explanatory-notes-2019","pp":"8","tags":["wind-explanatory-notes-2019","荷載組合 Load combination","num","中級"]},{"id":"WEN-010","t":"tf","d":2,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":18,"q":"建築若符合規範可忽略扭轉荷載的條件，即表示該建築不存在扭轉風荷載。","a":false,"e":"EN 明確提醒：可在最終組合中忽略扭轉，不代表扭轉風荷載不存在；只是該類結構抗扭能力好，影響細。","x":"discussed in this section should not be taken to imply that torsional","q_en":"If a building meets the Code conditions for ignoring torsional load, it means the building has no torsional wind load.","e_en":"False. The EN explicitly notes that torsion may be ignored in the final combinations, but that does not mean torsional wind load does not exist; such structures simply have good torsional resistance, so the effect is small.","doc":"wind-explanatory-notes-2019","pp":"10","tags":["wind-explanatory-notes-2019","扭轉 Torsion","tf","中級"]},{"id":"WEN-011","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":17,"q":"EN 指出，Bi-directional multi-bay moment frame 若有柱退台，退台距離（由柱中心量度）不應超過？","o":["3 m 或建築尺寸 1/20，取較小","5 m 或建築尺寸 1/10，取較小","5 m 或建築尺寸 1/10，取較大","10 m"],"a":1,"e":"符合此條件的框架可歸入 ≤70 m 周邊抗側力類別而忽略扭轉。審圖時要檢查退台距離是否超出 5 m / 1/10。","x":"structures can also be considered under this category; but in case","q_en":"The EN states that for a bi-directional multi-bay moment frame with column setbacks, the setback distance (measured from column centres) should not exceed:","o_en":["3 m or 1/20 of the building dimension, whichever is less","5 m or 1/10 of the building dimension, whichever is less","5 m or 1/10 of the building dimension, whichever is greater","10 m"],"e_en":"Frames meeting this condition may be classed as ≤70 m perimeter lateral resistance and torsion ignored. In plan vetting, check whether setbacks exceed 5 m / 1/10.","doc":"wind-explanatory-notes-2019","pp":"9","tags":["wind-explanatory-notes-2019","扭轉 Torsion","mcq","進階"]},{"id":"WEN-012","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"EN 2.3.1","p":18,"q":"2019 Code 將外牆設計風壓 Qz 的參考高度改為建築頂部，而非構件實際標高（2004 Code 做法）。","a":true,"e":"與 BS 6399-2 及 BS EN 1991-1-4 一致，也與風洞結果相符。低層幕牆因此會比 2004 Code 大；Table 4-1 附註 (c) 容許 0.5(H−Hd) 以下減 20%。","x":"The reference height of design pressure, 𝑄𝑄𝑧𝑧 , is changed to the top of a","q_en":"The 2019 Code changed the reference height for the cladding design wind pressure Qz to the top of the building, instead of the actual level of the element (the 2004 Code approach).","e_en":"True. Consistent with BS 6399-2 and BS EN 1991-1-4, and with wind tunnel results. Low-level curtain walls are therefore larger than under the 2004 Code; note (c) to Table 4-1 allows a 20% reduction below 0.5(H−Hd).","doc":"wind-explanatory-notes-2019","pp":"10","tags":["wind-explanatory-notes-2019","外牆壓力 Cladding pressure","tf","中級"]},{"id":"WEN-013","t":"num","d":2,"tp":"尺寸系數 Size factor","c":"EN 5.1","p":31,"q":"Size factor 取 1.0 時對應的 half-perimeter length 是多少 m？","a":15,"tol":0,"u":"m","e":"15 m 比歐洲做法大，反映香港颱風風速較高、壓力相關性較強。一般幕牆板尺寸小於 15 m，所以 Ss 通常大於 1.0。","x":"The choice of 15m for size factor of 1.0 is based on the increased wind","q_en":"The size factor equals 1.0 at a half-perimeter length of how many m?","e_en":"15 m is larger than in European practice, reflecting higher typhoon wind speeds in Hong Kong and stronger pressure correlation. Typical curtain wall panels are smaller than 15 m, so Ss is usually greater than 1.0.","doc":"wind-explanatory-notes-2019","pp":"23","tags":["wind-explanatory-notes-2019","尺寸系數 Size factor","num","中級"]},{"id":"WEN-014","t":"tf","d":2,"tp":"加速度 Acceleration","c":"EN 2.4.2","p":20,"q":"採用風洞試驗時，只需檢查 1 年或 10 年其中一個回歸期的加速度。","a":false,"e":"用 code method 時兩者比例固定為 3.67，只需檢查一個；風洞試驗比例未必是 3.67，兩個回歸期都要檢查。","x":"With wind tunnel testing, both return periods should be checked,","q_en":"With wind tunnel testing, acceleration need only be checked for one of the 1-year or 10-year return periods.","e_en":"False. With the code method the ratio between the two is fixed at 3.67, so only one needs checking; with wind tunnel testing the ratio may not be 3.67, so both return periods must be checked.","doc":"wind-explanatory-notes-2019","pp":"12","tags":["wind-explanatory-notes-2019","加速度 Acceleration","tf","中級"]},{"id":"WEN-015","t":"short","d":2,"tp":"適用範圍 Scope","c":"EN 1.1","p":9,"q":"EN 如何解釋 Code 保留 γw = 1.4 於公式中，以及將來改為 γw = 1.0 的可能？","m":"ASCE 7-16 及 AS/NZS 1170.2 直接推導 ULS 荷載（約 2,000 年回歸）。Code 把現行 γw 1.4 寫入公式；原則上可將參考風壓乘 1.4 並用未來 γw 1.0 直接計 ULS，結果不變。","k":["ASCE/AS-NZS derive ULS directly","≈2,000 year return for important buildings","reference pressure × 1.4 with future γw 1.0","no change to ULS loads"],"e":"實務上要留意唔同規範混用：如果引用海外標準的 ULS 風速，就唔可以再乘 1.4。","x":"multiplied by the existing γw of 1.4 to enable direct calculation of ULS","q_en":"How does the EN explain the Code retaining γw = 1.4 within the formulae, and the possibility of changing to γw = 1.0 in future?","m_en":"ASCE 7-16 and AS/NZS 1170.2 derive ULS loads directly (about a 2,000-year return period). The Code writes the current γw 1.4 into the formulae; in principle the reference wind pressure could be multiplied by 1.4 and a future γw of 1.0 used to calculate ULS directly, with the same result.","e_en":"In practice beware of mixing codes: if a ULS wind speed from an overseas standard is used, do not multiply by 1.4 again.","doc":"wind-explanatory-notes-2019","pp":"1","tags":["wind-explanatory-notes-2019","適用範圍 Scope","short","中級"]},{"id":"WEN-016","t":"mcq","d":2,"tp":"加速度 Acceleration","c":"EN 2.4.1","p":20,"q":"Code 為限制 along-wind 加速度可能大過 across-wind 的風險，對 (BD)b 設定了什麼限制？","o":["(BD)b ≤ H²/9","(BD)b ≤ H²/4","(BD)b ≥ H²/9","(BD)b ≤ H/9"],"a":0,"e":"NBCC 2010 指出 (BD)b > H²/9 時 along-wind 加速度可能較大，因此 Code 設 (BD)b ≤ H²/9 為適用限制；矮胖建築舒適度一般不是問題。","x":"acceleration. However, as discussed in NBCC 2010, if","q_en":"To limit the risk that along-wind acceleration may exceed across-wind acceleration, what limit does the Code set on (BD)b?","e_en":"NBCC 2010 notes that along-wind acceleration may be larger when (BD)b > H²/9, so the Code sets (BD)b ≤ H²/9 as an applicability limit; comfort is generally not an issue for squat buildings.","doc":"wind-explanatory-notes-2019","pp":"12","tags":["wind-explanatory-notes-2019","加速度 Acceleration","mcq","中級"]},{"id":"WEN-017","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)","p":2,"doc":"wind-en-amendments-2023","q":"2023 年 12 月 Explanatory Notes 修訂中，Clause 2.2.3 新增了什麼？","o":["新的 across-wind 公式","評估 across-wind 效應時如何決定 fundamental frequency 的指引","取消 1.5 放大系數限制","新的 Sθ 表"],"a":1,"e":"修訂針對多塔共用平台時怎樣取塔樓 fundamental frequency。記住修訂只改 Explanatory Notes，Code 條文本身不變。","x":"(a) Clause 2.2.3 – Addition of guidelines for determination of fundamental","q_en":"What was added to Clause 2.2.3 in the December 2023 amendment to the Explanatory Notes?","o_en":["A new across-wind formula","Guidance on determining the fundamental frequency when assessing across-wind effects","Removal of the 1.5 magnification factor limit","A new Sθ table"],"e_en":"The amendment addresses how to take the fundamental frequency of towers on a common podium. Remember that the amendment changes only the Explanatory Notes; the Code provisions themselves are unchanged.","pp":"2","tags":["wind-en-amendments-2023","修訂 2023 Amendments","mcq","中級"]},{"id":"WEN-018","t":"num","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 1(b)","p":4,"doc":"wind-en-amendments-2023","q":"多塔共用平台：假設塔樓與部分平台結合時，平台計入範圍由塔樓牆/柱邊量度，不超過多少 m、三個跨度及與鄰塔中線三者之最小值？","a":20,"tol":0,"u":"m","e":"這是 2023 修訂 (b) 方案，前提是該部分平台樓板沒有大開口。也可用 (a) 塔樓獨立延伸至基礎，或整體電腦模型取主導頻率，但須有工程理據。","x":"modelled tower by not exceeding the minimum of 20m, three","q_en":"Multiple towers on a common podium: when a tower is assumed to act with part of the podium, the extent of podium included, measured from the tower walls/columns, is not more than the least of how many m, three spans, and the centreline to the adjacent tower?","e_en":"This is option (b) of the 2023 amendment, provided that part of the podium slab has no large openings. Alternatively use (a) the tower extended independently to the foundation, or the dominant frequency from an overall computer model, with engineering justification.","pp":"4","tags":["wind-en-amendments-2023","修訂 2023 Amendments","num","進階"]},{"id":"WEN-019","t":"mcq","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 2 (EN 2.5)","p":5,"doc":"wind-en-amendments-2023","q":"按 2023 修訂新增的 EN Table 2-1，高度 ≤2.5 m 的地盤 hoarding / covered walkway 設計淨壓力是？","o":["0.50 kPa","0.63 kPa","0.70 kPa","1.59 kPa"],"a":1,"e":"≤2.5 m 0.63、5 m 0.70、10 m 0.77 kPa，已包含 Cp 和 Ss，可線性內插；有不利地形時仍須考慮 topography factor，可計鋼構件自重的有利作用。","x":"construction site, the design net pressure in Table 2-1 may be used.","q_en":"Per the new EN Table 2-1 added by the 2023 amendment, what is the design net pressure for site hoardings / covered walkways of height ≤2.5 m?","e_en":"≤2.5 m 0.63, 5 m 0.70, 10 m 0.77 kPa, already including Cp and Ss, with linear interpolation allowed; the topography factor must still be considered for adverse topography, and the favourable effect of the steelwork self-weight may be counted.","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","mcq","中級"]},{"id":"WEN-020","t":"num","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – EN Table 2-1","p":5,"doc":"wind-en-amendments-2023","q":"EN Table 2-1（2023 修訂）：高度 10 m 的 hoarding 設計淨壓力（kPa）？","a":0.77,"tol":0.005,"u":"kPa","e":"這是 all-inclusive value，不要再乘 Cp 或 Ss，否則重複計算。","x":"(b) Cp and Ss have been included.","q_en":"EN Table 2-1 (2023 amendment): design net pressure (kPa) for a hoarding 10 m high?","e_en":"This is an all-inclusive value; do not multiply by Cp or Ss again, which would double count.","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","num","中級"]},{"id":"WEN-021","t":"tf","d":3,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 4 (EN 6.4)","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂澄清：若無做 building removal investigation，遮擋效益限於 Standard Method 荷載的 80%，並以 total base moment 形式比較。","a":true,"e":"舊文字寫「80% of the along-wind value」，修訂改為「80% of the loads of the Standard Method」並要求以總基底彎矩比較，與 Code 6.4 一致。","x":"Method. The comparison should be in the form of total base","q_en":"The 2023 amendment clarifies that without a building removal investigation, the shielding benefit is limited to 80% of the Standard Method loads, compared in terms of total base moment.","e_en":"True. The old text said \"80% of the along-wind value\"; the amendment changes it to \"80% of the loads of the Standard Method\" and requires comparison by total base moment, consistent with Code 6.4.","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","tf","進階"]},{"id":"WEN-022","t":"tf","d":2,"tp":"修訂 2023 Amendments","c":"Amendments Dec 2023 – Item 3 (EN 4.3.1)","p":5,"doc":"wind-en-amendments-2023","q":"2023 修訂後，accidental dominant open scenario 被描述為「不屬 Code 的強制要求」，而非「超出 Code 範圍」。","a":true,"e":"文字由 out of scope 改為 not a compulsory requirement。設計上若業主要求考慮颱風時窗戶破損，仍可按 Appendix B1 計算。","x":"compulsory requirement of this Code, as discussed in Appendix","q_en":"After the 2023 amendment, the accidental dominant open scenario is described as \"not a compulsory requirement of the Code\" rather than \"outside the scope of the Code\".","e_en":"True. The wording changed from out of scope to not a compulsory requirement. If the client requires window breakage during typhoons to be considered, it can still be calculated per Appendix B1.","pp":"5","tags":["wind-en-amendments-2023","修訂 2023 Amendments","tf","中級"]}],"f":[{"id":"CON-F01","tp":"荷載組合 Load combinations","c":"2.3.1.4(a)","p":24,"f":"Notional horizontal load（Concrete Code）","b":"每層同時施加 1.5% 該層 characteristic dead weight；comb 2/3 的 design wind 不少於此。","e":"Clause 2.3.1.4(a)。","x":"notional design ultimate horizontal load applied at","e_en":"Clause 2.3.1.4(a).","f_en":"Notional horizontal load (Concrete Code)","b_en":"1.5% of the characteristic dead weight of each floor, applied simultaneously at every floor; the design wind in comb 2/3 is not to be less than this.","doc":"concrete-2013-2020ed","pp":"10","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-F02","tp":"荷載組合 Load combinations","c":"2.3.2.4","p":25,"f":"ULS 考慮 creep、shrinkage、temperature 時 γf？","b":"Adverse 取 1.0；一般只在顯著或二階效應重要時才考慮。","e":"Clause 2.3.2.4。","x":"and temperature effects are taken into consideration, γ should be taken as 1.0 for adverse conditions.","e_en":"Clause 2.3.2.4.","f_en":"γf at ULS when creep, shrinkage and temperature are considered?","b_en":"1.0 for adverse conditions; normally considered only where significant or where second-order effects matter.","doc":"concrete-2013-2020ed","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-F03","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"Concrete Code ULS γm：鋼筋／混凝土彎曲／抗剪／bond？","b":"1.15／1.50／1.25／1.40。","e":"FLS 分別 1.00／1.10／1.10／1.10。","x":"Concrete in flexure or axial load 1.50 1.10","e_en":"At FLS: 1.00 / 1.10 / 1.10 / 1.10 respectively.","f_en":"Concrete Code ULS γm: reinforcement / concrete in flexure / shear / bond?","b_en":"1.15 / 1.50 / 1.25 / 1.40.","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-F04","tp":"材料係數 γm","c":"2.4.3.2(b)","p":27,"f":"局部損毀／exceptional loads 下 γm？","b":"混凝土彎曲 1.3；鋼 1.0。","e":"配合 γf 1.05。","x":"may be taken as 1.3 for concrete in flexure and 1.0 for","e_en":"Used with γf 1.05.","f_en":"γm under localised damage / exceptional loads?","b_en":"Concrete in flexure 1.3; steel 1.0.","doc":"concrete-2013-2020ed","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-F05","tp":"材料 Materials","c":"3.1.5","p":30,"f":"Concrete Code Ec 公式？","b":"Ec = 3.46√fcu + 3.21（kN/mm²），適用於 fcu 20–100 N/mm²。","e":"Table 3.2 由此計出。","x":"which is applicable for concrete of cube strengths between 20 and 100 N/mm 2:","e_en":"Table 3.2 is derived from this.","f_en":"Concrete Code Ec formula?","b_en":"Ec = 3.46√fcu + 3.21 (kN/mm²), for fcu 20–100 N/mm².","doc":"concrete-2013-2020ed","pp":"16","tags":["concrete-2013-2020ed","材料 Materials","flashcard"]},{"id":"CON-F06","tp":"材料 Materials","c":"3.2.5","p":35,"f":"鋼筋密度及熱膨脹系數？","b":"7850 kg/m³；12×10⁻⁶/°C。","e":"見 Clause 3.2.5，熱膨脹系數與混凝土（10×10⁻⁶/°C）相近。","x":"(a) density 7850 kg/m3; and","e_en":"See Clause 3.2.5; its thermal expansion coefficient is close to that of concrete (10×10⁻⁶/°C).","f_en":"Density and thermal expansion coefficient of reinforcement?","b_en":"7850 kg/m³; 12×10⁻⁶/°C.","doc":"concrete-2013-2020ed","pp":"21","tags":["concrete-2013-2020ed","材料 Materials","flashcard"]},{"id":"CON-F07","tp":"材料 Materials","c":"3.2.2","p":34,"f":"鋼筋 characteristic strength 定義？","b":"Proof 或 yield strength，預期 5% 試驗結果低於此值。","e":"Clause 3.2.2。","x":"strength below which 5% of all possible test results would be expected to fall.","e_en":"Clause 3.2.2.","f_en":"Definition of the characteristic strength of reinforcement?","b_en":"The proof or yield strength below which 5% of test results may be expected to fall.","doc":"concrete-2013-2020ed","pp":"20","tags":["concrete-2013-2020ed","材料 Materials","flashcard"]},{"id":"CON-F10","tp":"耐久性 Durability","c":"Table 4.1","p":42,"f":"Concrete Code exposure conditions 1–5？","b":"1 Mild；2 Moderate；3 Severe（近海飛沫/腐蝕煙霧）；4 Very Severe（潮汐區、pH≤4.5 流水）；5 Abrasive。","e":"Table 4.1。","x":"Concrete in sea water tidal zone down to 1 m below lowest low water level.","e_en":"Table 4.1.","f_en":"Concrete Code exposure conditions 1–5?","b_en":"1 Mild; 2 Moderate; 3 Severe (airborne salt spray / corrosive fumes); 4 Very Severe (tidal zone, flowing water with pH≤4.5); 5 Abrasive.","doc":"concrete-2013-2020ed","pp":"28","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F11","tp":"耐久性 Durability","c":"Table 4.2","p":43,"f":"Table 4.2 Condition 4 最低等級及 cover？","b":"C50 → 55 mm；≥C55 → 50 mm。","e":"Very Severe 環境。","x":"Condition 4 -- -- -- -- -- 55 50","e_en":"Very Severe environment.","f_en":"Table 4.2 condition 4 minimum grade and cover?","b_en":"C50 → 55 mm; ≥C55 → 50 mm.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F12","tp":"耐久性 Durability","c":"4.2.4.1(d)","p":43,"f":"有 blinding 時的 nominal cover？","b":"不少於 40 mm（不計 blinding）；直接貼泥 75 mm。","e":"Clause 4.2.4.1(d)。","x":"nominal cover of not less than 40 mm (excluding blinding) should generally be specified.","e_en":"Clause 4.2.4.1(d).","f_en":"Nominal cover where blinding is provided?","b_en":"Not less than 40 mm (excluding blinding); 75 mm directly against earth.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F13","tp":"耐久性 Durability","c":"Table 4.2 Note 4","p":43,"f":"預應力混凝土最低等級及 cementitious？","b":"不可用 C30 或以下；最少 300 kg/m³。","e":"Table 4.2 Note 4。","x":"For prestressed concrete, grade C30 or lower should not be used and the minimum cement","e_en":"Table 4.2 Note 4.","f_en":"Minimum grade and cementitious content for prestressed concrete?","b_en":"C30 or below not permitted; minimum 300 kg/m³.","doc":"concrete-2013-2020ed","pp":"29","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F14","tp":"耐久性 Durability","c":"4.2.5.4","p":44,"f":"不同骨料尺寸的最低 cementitious 調整？","b":"10 mm +40；14 mm +20；20 mm 0；40 mm −30 kg/m³；不少於 240 kg/m³。","e":"Table 4.3。","x":"condition that the cementitious content should be not less than 240 kg/m 3 for the exposure conditions","e_en":"Table 4.3.","f_en":"Adjustment to minimum cementitious content for different aggregate sizes?","b_en":"10 mm +40; 14 mm +20; 20 mm 0; 40 mm −30 kg/m³; not less than 240 kg/m³.","doc":"concrete-2013-2020ed","pp":"30","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F15","tp":"耐久性 Durability","c":"4.2.5.5","p":45,"f":"GGBS 佔 cementitious 的一般範圍？","b":"35%–75%（pfa 25%–35%）。","e":"更高比例要專家意見。","x":"(b) 35% to 75% for ggbs.","e_en":"Higher proportions need specialist advice.","f_en":"Typical range of GGBS as a proportion of cementitious content?","b_en":"35%–75% (pfa 25%–35%).","doc":"concrete-2013-2020ed","pp":"31","tags":["concrete-2013-2020ed","耐久性 Durability","flashcard"]},{"id":"CON-F16","tp":"防火 Fire","c":"4.3.1.2","p":48,"f":"防止 spalling 的 Method A？","b":"15 mm cover 鋼網，線徑 ≥2 mm，網距 ≤50×50 mm，主筋 cover ≥40 mm。","e":"高強度混凝土用。","x":"Method A: A reinforcement mesh with a nominal cover of 15 mm.","e_en":"For high-strength concrete.","f_en":"Method A for preventing spalling?","b_en":"Steel fabric at 15 mm cover, wire ≥2 mm, mesh ≤50×50 mm, main bar cover ≥40 mm.","doc":"concrete-2013-2020ed","pp":"34","tags":["concrete-2013-2020ed","防火 Fire","flashcard"]},{"id":"CON-F20","tp":"彎曲設計 Flexure","c":"6.1.2.4(c)","p":61,"f":"K 與 K' 的意義？","b":"K = M/bd²fcu；K ≤ K' 單筋，K > K' 需受壓筋。K' = 0.156/0.120/0.094（fcu ≤45 / ≤70 / ≤100）。","e":"再分配 >10% 要用公式 6.9。","x":"0.120 for 45< fcu ≤70 N/mm2 ; or","e_en":"For redistribution >10%, use equation 6.9.","f_en":"Meaning of K and K'?","b_en":"K = M/bd²fcu; K ≤ K' singly reinforced, K > K' needs compression reinforcement. K' = 0.156/0.120/0.094 (fcu ≤45 / ≤70 / ≤100).","doc":"concrete-2013-2020ed","pp":"47","tags":["concrete-2013-2020ed","彎曲設計 Flexure","flashcard"]},{"id":"CON-F21","tp":"彎曲設計 Flexure","c":"6.1.2.4(c)","p":61,"f":"單筋矩形截面 As 公式？","b":"As = M / (0.87 fy z)，z = d[0.5 + √(0.25 − K/0.9)] ≤ 0.95d。","e":"見 Eq 6.10–6.12，z 須封頂 0.95d。","x":"As = M / 0.87 f y z 6.12","e_en":"See Eq 6.10–6.12; z must be capped at 0.95d.","f_en":"As formula for a singly reinforced rectangular section?","b_en":"As = M / (0.87 fy z), z = d[0.5 + √(0.25 − K/0.9)] ≤ 0.95d.","doc":"concrete-2013-2020ed","pp":"47","tags":["concrete-2013-2020ed","彎曲設計 Flexure","flashcard"]},{"id":"CON-F22","tp":"抗剪 Shear","c":"Table 6.2 Note 1","p":62,"f":"甚麼情況可省略最少箍筋？","b":"次要構件（如 lintel）或最大設計剪應力小於 0.5vc。","e":"重要構件一律應設最少箍筋。","x":"satisfactory to omit them in members of minor structural importance such as lintels or where","e_en":"Minimum links should always be provided in members of structural importance.","f_en":"When may minimum links be omitted?","b_en":"Members of minor structural importance (e.g. lintels) or where the maximum design shear stress is less than 0.5vc.","doc":"concrete-2013-2020ed","pp":"48","tags":["concrete-2013-2020ed","抗剪 Shear","flashcard"]},{"id":"CON-F23","tp":"沖剪 Punching","c":"6.1.5.7(b)","p":87,"f":"沖剪 vmax 定義及上限？","b":"vmax = V/(uo d)，uo 為貼加載面周界；≤ min(0.8√fcu, 7.0 N/mm²)。","e":"Eq 6.42。","x":"The maximum design shear stress vmax should not exceed 0.8√fcu or 7.0 N/mm2 if less. The","e_en":"Eq 6.42.","f_en":"Definition and limit of vmax for punching shear?","b_en":"vmax = V/(uo d), uo = perimeter adjacent to the loaded area; ≤ min(0.8√fcu, 7.0 N/mm²).","doc":"concrete-2013-2020ed","pp":"73","tags":["concrete-2013-2020ed","沖剪 Punching","flashcard"]},{"id":"CON-F24","tp":"柱 Columns","c":"6.2.1.1(d)","p":90,"f":"Braced column 定義？","b":"該平面的整體側向穩定由牆、支撐或扶壁承受全部側向力。","e":"否則為 unbraced。","x":"A column may be considered braced in a given plane if lateral stability to the structure as a whole","e_en":"Otherwise it is unbraced.","f_en":"Definition of a braced column?","b_en":"Overall lateral stability in that plane is provided by walls, bracing or buttressing designed to resist all lateral forces.","doc":"concrete-2013-2020ed","pp":"76","tags":["concrete-2013-2020ed","柱 Columns","flashcard"]},{"id":"CON-F25","tp":"柱 Columns","c":"6.2.1.2(b)","p":92,"f":"何時柱底/連接構件要設計承受 slender column 的 additional moments？","b":"同一層所有柱的平均 le/h 大於 20。","e":"Clause 6.2.1.2(b)。","x":"also be designed to resist these additional moments at ULS if the average value of le/h for all","e_en":"Clause 6.2.1.2(b).","f_en":"When must column bases / connecting members be designed for the additional moments of slender columns?","b_en":"When the average le/h of all columns at that level is gre
