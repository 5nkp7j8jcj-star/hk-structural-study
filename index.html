 as the strength at which not more than 8 in 1000 panes of glass break.","e_en":"True. Glass strength is statistical and governed by microcracks, so it is defined by probability of breakage.","doc":"glass-2018","pp":"11","tags":["glass-2018","玻璃強度 Glass strength","tf","中級"]},{"id":"GLS-012","t":"mcq","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.4","p":19,"q":"Table 4.4：Annealed glass 在 long-term load 下的 strength reduction factor γd？","o":["0.29","0.53","0.66","0.81"],"a":0,"e":"退火玻璃長期荷載只剩 29% 強度，所以玻璃地台、天幕（長期自重）不宜用退火玻璃。Tempered 長期 0.66、中期 0.81。","x":"Annealed 1.00 0.53 0.29","q_en":"Table 4.4: strength reduction factor γd for annealed glass under long-term load?","e_en":"Annealed glass retains only 29% of its strength under long-term load, so it is unsuitable for glass floors and canopies (long-term self-weight). Tempered: long-term 0.66, medium-term 0.81.","doc":"glass-2018","pp":"11","tags":["glass-2018","玻璃強度 Glass strength","mcq","中級"]},{"id":"GLS-013","t":"num","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.4","p":19,"q":"Table 4.4：Tempered glass medium-term 的 γd？","a":0.81,"tol":0,"u":"","e":"維修荷載、溫度荷載屬 medium-term。","x":"Tempered 1.00 0.81 0.66","q_en":"Table 4.4: γd for tempered glass, medium-term?","e_en":"Maintenance loads and temperature loads are medium-term.","doc":"glass-2018","pp":"11","tags":["glass-2018","玻璃強度 Glass strength","num","中級"]},{"id":"GLS-014","t":"num","d":2,"tp":"玻璃強度 Glass strength","c":"Table 4.5","p":19,"q":"Table 4.5：Ceramic fritted 或 enamelled painted glass 的表面處理折減系數 γs？","a":0.625,"tol":0,"u":"","e":"Fritted 0.625、磨砂/蝕刻 0.5。有 frit 的幕牆玻璃常被忽略此折減，導致厚度不足。","x":"Ceramic fritted or","q_en":"Table 4.5: surface treatment reduction factor γs for ceramic fritted or enamelled painted glass?","e_en":"Fritted 0.625, sandblasted/etched 0.5. This reduction is often overlooked for fritted curtain wall glass, resulting in inadequate thickness.","doc":"glass-2018","pp":"11","tags":["glass-2018","玻璃強度 Glass strength","num","中級"]},{"id":"GLS-015","t":"tf","d":2,"tp":"夾層玻璃 Laminated glass","c":"4.4.1 / 5.3.3","p":20,"q":"除非有測試證明，夾層玻璃應按無組合作用（no composite action）設計。","a":true,"e":"各片按剛度（t³）分擔荷載；有彎曲測試證明亦只可用於短期荷載，且組合程度不超過 70%。","x":"thickness. As described in clause 5.3.3, laminated glass shall be designed with no composite","q_en":"Unless proven by tests, laminated glass should be designed with no composite action.","e_en":"True. Each ply shares the load in proportion to its stiffness (t³); even when proven by bending tests, composite action may be used only for short-term loads and not exceeding 70%.","doc":"glass-2018","pp":"12","tags":["glass-2018","夾層玻璃 Laminated glass","tf","中級"]},{"id":"GLS-016","t":"mcq","d":2,"tp":"設計 Design","c":"Table 5.1","p":22,"q":"Table 5.1：公稱 12 mm 玻璃在分析設計時採用的最小厚度？","o":["11.91 mm","12.00 mm","11.50 mm","10.50 mm"],"a":0,"e":"6→5.56、8→7.42、10→9.02、12→11.91、15→14.2、19→18.26 mm。用公稱厚度計算會高估強度和剛度。","x":"Minimum glass pane thickness, 5.56 7.42 9.02 11.91 14.2 18.26 21.44 24.61","q_en":"Table 5.1: minimum thickness adopted in design analysis for nominal 12 mm glass?","e_en":"6→5.56, 8→7.42, 10→9.02, 12→11.91, 15→14.2, 19→18.26 mm. Using nominal thickness overestimates strength and stiffness.","doc":"glass-2018","pp":"14","tags":["glass-2018","設計 Design","mcq","中級"]},{"id":"GLS-017","t":"scenario","d":3,"tp":"安全要求 Safety requirement","c":"5.2.1","p":22,"q":"外牆採用 2.8 m² 的單片鋼化玻璃，最低點位於平台以上 3 m、最高點 6 m。按 Glass Code 是否需改為夾層玻璃？若用 IGU 又如何？","m":"需要。5.2.1(3)：外牆鋼化玻璃面積超過 2.5 m²，且任何一點位於可達範圍完成樓面以上 5 m 或以上，須為夾層玻璃。此板 2.8 m² > 2.5 m²，最高點 6 m ≥5 m，兩條件都符合。若為 IGU，只須最外層玻璃符合此要求。","k":["> 2.5 m²","any point ≥ 5 m above accessible floor (either side)","laminated required","IGU: outermost pane only"],"e":"常見錯誤是只看玻璃底部高度。條文用 any point，所以最高點超過 5 m 已觸發。","x":"(ii) Any point of the glass pane installed is at a height 5m or more above the","q_en":"A façade uses monolithic tempered glass panels of 2.8 m², with the lowest point 3 m and the highest point 6 m above the platform. Must they be changed to laminated glass under the Glass Code? What if IGUs are used?","m_en":"Yes. 5.2.1(3): tempered glass in external walls with an area exceeding 2.5 m² and with any point at 5 m or more above the finished floor of an accessible area must be laminated. This panel is 2.8 m² > 2.5 m² and its highest point at 6 m ≥5 m, so both conditions are met. For an IGU, only the outermost pane needs to comply.","e_en":"A common error is looking only at the height of the bottom of the glass. The clause says any point, so a highest point above 5 m already triggers it.","doc":"glass-2018","pp":"14","tags":["glass-2018","安全要求 Safety requirement","scenario","進階"]},{"id":"GLS-018","t":"mcq","d":2,"tp":"安全要求 Safety requirement","c":"5.2.1(1)","p":22,"q":"以下哪類玻璃構件必須使用 laminated glass？","o":["承受長期荷載的構件如天幕、玻璃樓梯、玻璃地台及玻璃欄杆","所有室內玻璃間隔","所有窗戶","只限高於 5 m 的玻璃"],"a":0,"e":"長期荷載構件和玻璃欄杆要用夾層玻璃，破碎後碎片仍黏附在中間膜上。","x":"(1) Laminated glass should be used in glass elements resisting long-term load, such as","q_en":"Which of the following glass elements must use laminated glass?","o_en":["Elements under long-term load such as canopies, glass stairs, glass floors, and glass balustrades","All internal glass partitions","All windows","Only glass higher than 5 m"],"e_en":"Elements under long-term load and glass balustrades must use laminated glass, so that fragments remain adhered to the interlayer after breakage.","doc":"glass-2018","pp":"14","tags":["glass-2018","安全要求 Safety requirement","mcq","中級"]},{"id":"GLS-019","t":"tf","d":3,"tp":"安全要求 Safety requirement","c":"5.2.2","p":22,"q":"玻璃屋頂、樓梯及地台須設計成任何單片玻璃失效後，其餘玻璃仍能承受 factored ultimate loads。","a":false,"e":"餘下玻璃須承受「未乘系數的標準荷載」（unfactored characteristic loads）而不失效，並非 factored loads。但原設計仍須按 ultimate design loads。","x":"such that in case of failure of any single glass pane, the remaining glass pane(s) shall be able","q_en":"Glass roofs, stairs and floors must be designed so that, after failure of any one pane, the remaining glass can still carry the factored ultimate loads.","e_en":"False. The remaining glass must carry the unfactored characteristic loads without failure, not factored loads. The original design must still use the ultimate design loads.","doc":"glass-2018","pp":"14","tags":["glass-2018","安全要求 Safety requirement","tf","進階"]},{"id":"GLS-020","t":"mcq","d":2,"tp":"分析 Analysis","c":"5.3.1","p":23,"q":"線性分析適用時，「small deflection」定義為撓度少於玻璃厚度的多少？","o":["3/4","1/2","1 倍","2 倍"],"a":0,"e":"撓度大於厚度時薄膜作用顯著，線性分析偏保守；可用非線性分析或 5.4.5 公式。","x":"“small”. The deflection is considered “small” when it is less than 3/4 of the glass pane","q_en":"Where linear analysis applies, \"small deflection\" is defined as deflection less than what fraction of the glass thickness?","o_en":["3/4","1/2","1 times","2 times"],"e_en":"When deflection exceeds the thickness, membrane action becomes significant and linear analysis is conservative; non-linear analysis or the formulae of 5.4.5 may be used.","doc":"glass-2018","pp":"15","tags":["glass-2018","分析 Analysis","mcq","中級"]},{"id":"GLS-021","t":"num","d":3,"tp":"分析 Analysis","c":"5.3.3","p":23,"q":"夾層玻璃的組合作用即使經測試證明，亦不得超過等效整體玻璃剛度的百分之幾？","a":70,"tol":0,"u":"%","e":"λ ≤ min(λtest, 0.7)，只可用於短期荷載，並須考慮中間膜長期老化。","x":"action is not greater than 70% of the stiffness of an equivalent monolithic glass pane with a","q_en":"Even when proven by tests, composite action of laminated glass must not exceed what percentage of the stiffness of an equivalent monolithic glass?","e_en":"λ ≤ min(λtest, 0.7), only for short-term loads, and long-term ageing of the interlayer must be considered.","doc":"glass-2018","pp":"15","tags":["glass-2018","分析 Analysis","num","進階"]},{"id":"GLS-022","t":"num","d":3,"tp":"分析 Analysis","c":"5.3.4","p":24,"q":"IGU 各片玻璃的荷載要增加百分之幾以考慮溫度及大氣壓變化？","a":25,"tol":0,"u":"%","e":"k = 1.25t³/Σt³。深空腔（氣隙大於玻璃厚度總和）時按剛度分擔的假設不成立。","x":"changes. The loads on each glass pane of the IGU have to be increased by 25% to account","q_en":"By what percentage must the load on each pane of an IGU be increased to allow for temperature and atmospheric pressure changes?","e_en":"k = 1.25t³/Σt³. For deep cavities (air gap larger than the sum of the glass thicknesses), the assumption of load sharing by stiffness does not hold.","doc":"glass-2018","pp":"16","tags":["glass-2018","分析 Analysis","num","進階"]},{"id":"GLS-023","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"Table 5.2","p":25,"q":"Glass Code Table 5.2：Load combination 3（恆+活+風）的恆載（不利）、活載及風載系數？","o":["1.2 / 1.2 / 1.2","1.4 / 1.6 / 1.4","1.4 / 1.4 / 1.4","1.0 / 1.2 / 1.2"],"a":0,"e":"與 Concrete/Steel Code 一致：組合1 1.4G+1.6Q、組合2 1.4G+1.4W、組合3 1.2(G+Q+W)。溫度荷載 1.2。","x":"3 Dead, imposed, wind,","q_en":"Glass Code Table 5.2: factors for dead load (adverse), imposed load and wind load in load combination 3 (dead + imposed + wind)?","e_en":"Consistent with the Concrete/Steel Codes: combination 1 1.4G+1.6Q, combination 2 1.4G+1.4W, combination 3 1.2(G+Q+W). Temperature load 1.2.","doc":"glass-2018","pp":"17","tags":["glass-2018","荷載組合 Load combination","mcq","中級"]},{"id":"GLS-024","t":"num","d":1,"tp":"荷載組合 Load combination","c":"5.4.3","p":26,"q":"玻璃的 partial material factor γm 取值？","a":1.0,"tol":0,"u":"","e":"γm = 1.0，因為強度折減已透過 py 的破損機率定義、γd 及 γs 反映。","x":"of elasticity is taken as 1.0.","q_en":"What is the partial material factor γm for glass?","e_en":"γm = 1.0, because strength reductions are already reflected through the breakage-probability definition of py, γd and γs.","doc":"glass-2018","pp":"18","tags":["glass-2018","荷載組合 Load combination","num","基礎"]},{"id":"GLS-025","t":"mcq","d":3,"tp":"玻璃厚度 Glass thickness","c":"5.4.5","p":26,"q":"四邊簡支玻璃厚度公式中，strength coefficient c 的 c1 值：tempered glass 取？","o":["4.0","2.0","1.0","3.0"],"a":0,"e":"c = c1 × γd × γs；c1：annealed 1.0、HS 2.0、tempered 4.0。公式 5.9/5.10 適用 b/a <5，≥5 用 5.11。","x":"= 4.0 for tempered glass","q_en":"In the thickness formula for glass simply supported on four edges, what value of c1 in the strength coefficient c is taken for tempered glass?","e_en":"c = c1 × γd × γs; c1: annealed 1.0, HS 2.0, tempered 4.0. Formulae 5.9/5.10 apply for b/a <5; use 5.11 for ≥5.","doc":"glass-2018","pp":"18","tags":["glass-2018","玻璃厚度 Glass thickness","mcq","進階"]},{"id":"GLS-026","t":"num","d":2,"tp":"撓度 Deflection","c":"5.5.4","p":28,"q":"支承玻璃的結構構件（跨度 ≤7.2 m）撓度限值為 1/180 跨度或多少 mm（取小）？","a":20,"tol":0,"u":"mm","e":"跨度 >7.2 m 用 1/360；懸臂 1/90 或 20 mm。支承玻璃的鋼樑撓度控制比一般樓面更嚴。","x":"or 20 mm for span not greater than 7.2 m. For span greater than 7.2 m, the deflection limit of","q_en":"The deflection limit of structural members supporting glass (span ≤7.2 m) is 1/180 of the span or how many mm (whichever is less)?","e_en":"For spans >7.2 m use 1/360; cantilevers 1/90 or 20 mm. Deflection control of steel beams supporting glass is stricter than for ordinary floors.","doc":"glass-2018","pp":"20","tags":["glass-2018","撓度 Deflection","num","中級"]},{"id":"GLS-027","t":"num","d":3,"tp":"玻璃鰭 Glass fin","c":"6.1.1","p":29,"q":"Glass fin 繞主軸受彎時，ultimate design strength 要折減百分之幾？","a":40,"tol":0,"u":"%","e":"例如 tempered 80 MPa 降至 48 MPa，因邊緣應力集中及穩定問題。","x":"strength should be reduced by 40% (e.g. 80 MPa to 48 MPa for tempered glass fins). Apart","q_en":"For a glass fin in bending about its major axis, the ultimate design strength must be reduced by what percentage?","e_en":"E.g. tempered 80 MPa reduces to 48 MPa, because of edge stress concentration and stability issues.","doc":"glass-2018","pp":"21","tags":["glass-2018","玻璃鰭 Glass fin","num","進階"]},{"id":"GLS-028","t":"num","d":3,"tp":"玻璃鰭 Glass fin","c":"6.1.1","p":30,"q":"Glass fin 的 critical elastic buckling moment Mcr 須至少為 ultimate design moment 的幾倍？","a":1.7,"tol":0,"u":"倍","e":"或以非線性 FE（初始缺陷 0.5% 長度）求 Mu > Md。","x":"moment (𝑀𝑐𝑐 ). It should be at least 1.7 times the ultimate design moment (𝑀𝑑 ).","q_en":"The critical elastic buckling moment Mcr of a glass fin must be at least how many times the ultimate design moment?","e_en":"Alternatively, non-linear FE (initial imperfection 0.5% of length) may be used to show Mu > Md.","u_en":"times","doc":"glass-2018","pp":"22","tags":["glass-2018","玻璃鰭 Glass fin","num","進階"]},{"id":"GLS-029","t":"mcq","d":2,"tp":"玻璃欄杆 Balustrade","c":"6.4.1","p":32,"q":"Free-standing 玻璃欄杆的連續底部夾具要求？","o":["每邊最少 100 mm 闊、金屬最少 12 mm 厚、螺栓間距最大 500 mm","每邊 50 mm、8 mm 厚、間距 300 mm","每邊 75 mm、10 mm 厚、間距 600 mm","無特定要求"],"a":0,"e":"不靠螺栓的夾緊系統，夾緊深度不少於 90 mm（除非有測試）。","x":"clamps on each side of the glass panes should have a minimum width of 100 mm and be","q_en":"Requirements for the continuous base clamp of a free-standing glass balustrade?","o_en":["At least 100 mm wide on each side, metal at least 12 mm thick, bolt spacing max 500 mm","50 mm each side, 8 mm thick, spacing 300 mm","75 mm each side, 10 mm thick, spacing 600 mm","No specific requirement"],"e_en":"For clamping systems not relying on bolts, the clamping depth is not less than 90 mm (unless tested).","doc":"glass-2018","pp":"24","tags":["glass-2018","玻璃欄杆 Balustrade","mcq","中級"]},{"id":"GLS-030","t":"num","d":2,"tp":"結構膠 Structural sealant","c":"7.1","p":36,"q":"一般結構膠在短期及中期荷載下的 permissible design strength（kPa）？","a":138,"tol":0,"u":"kPa","e":"最小 bite 6 mm，bite/thickness 1:1 至 3:1；結構膠不可用於承受長期荷載的玻璃，自重要用 setting blocks 承托。","x":"medium-term loads is 138 kPa. The movement capability of structural and weather sealant","q_en":"Permissible design strength (kPa) of typical structural sealant under short- and medium-term loads?","e_en":"Minimum bite 6 mm, bite/thickness 1:1 to 3:1; structural sealant may not be used for glass under long-term load — self-weight must be carried on setting blocks.","doc":"glass-2018","pp":"28","tags":["glass-2018","結構膠 Structural sealant","num","中級"]},{"id":"GLS-031","t":"num","d":2,"tp":"結構膠 Structural sealant","c":"7.1","p":36,"q":"結構膠的最小 bite（mm）？","a":6,"tol":0,"u":"mm","e":"四邊支承時 bite = 0.5 × p × Ls / pb。","x":"calculated movement. The minimum structural sealant bite should be 6 mm. The sealant","q_en":"Minimum bite (mm) of structural sealant?","e_en":"For four-edge support, bite = 0.5 × p × Ls / pb.","doc":"glass-2018","pp":"28","tags":["glass-2018","結構膠 Structural sealant","num","中級"]},{"id":"GLS-032","t":"tf","d":2,"tp":"結構膠 Structural sealant","c":"7.1.1","p":37,"q":"Structural sealant glazing 須設置機械式 retaining devices，防止結構膠黏結失效時玻璃墮下。","a":true,"e":"頂部及底部要有 capping、角碼等防墮裝置，玻璃自重以 setting blocks 承托。","x":"of glass pane in the event of bond failure in the structural sealant. Retaining devices for such","q_en":"Structural sealant glazing must be provided with mechanical retaining devices to prevent the glass falling if the sealant bond fails.","e_en":"True. Capping, cleats or similar retaining devices are needed at top and bottom, and the glass self-weight is carried on setting blocks.","doc":"glass-2018","pp":"29","tags":["glass-2018","結構膠 Structural sealant","tf","中級"]},{"id":"PRC-001","t":"num","d":2,"tp":"穩定 Stability","c":"2.3.1","p":12,"q":"若風荷載不控制，預製結構穩定性應以每層多少百分比 characteristic dead load 的 notional horizontal force 檢查？","a":1.5,"tol":0,"u":"%","e":"與 Concrete Code 的 1.5% notional load 一致。預製結構多為鉸接，側向穩定靠剪力牆及樓板橫隔作用，所以 tie 設計特別重要。","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","q_en":"If wind load does not govern, the stability of a precast structure should be checked with a notional horizontal force equal to what percentage of the characteristic dead load of each floor?","e_en":"Consistent with the 1.5% notional load of the Concrete Code. Precast structures are mostly pin-jointed, with lateral stability provided by shear walls and floor diaphragm action, so tie design is particularly important.","doc":"precast-2016","pp":"4","tags":["precast-2016","穩定 Stability","num","中級"]},{"id":"PRC-002","t":"tf","d":2,"tp":"穩定 Stability","c":"2.3.2","p":12,"q":"預製建築純風荷載下的最大側向位移限值 H/500，計算時須加入接駁位變形的累積效應。","a":true,"e":"預製構件接駁有滑移和變形，要加到結構分析的位移上再與 H/500 比較。常被忽略。","x":"deflection due solely to wind forces does not exceed 1/500 of the building height. In determining","q_en":"For the lateral deflection limit of H/500 under wind load alone for precast buildings, the cumulative effect of joint deformations must be included in the calculation.","e_en":"True. Precast connections slip and deform; add this to the displacements from structural analysis before comparing with H/500. Often overlooked.","doc":"precast-2016","pp":"4","tags":["precast-2016","穩定 Stability","tf","中級"]},{"id":"PRC-003","t":"mcq","d":2,"tp":"荷載 Loadings","c":"2.5.1","p":14,"q":"預製結構設計的最小施工荷載（construction load）是？","o":["1.5 kN/m²","0.75 kN/m²","2.5 kN/m²","5.0 kN/m²"],"a":0,"e":"半預製樓板（semi-precast slab）在澆注面層前要承受自重加 1.5 kN/m² 施工荷載，常是控制工況。Bracing 設計亦用 1.5 kN/m²。","x":"construction loads. A minimum load of 1.5 kN/m² should be used. However, due","q_en":"What is the minimum construction load for precast structure design?","e_en":"Semi-precast slabs must carry self-weight plus a 1.5 kN/m² construction load before the topping is cast, which is often the governing case. Bracing design also uses 1.5 kN/m².","doc":"precast-2016","pp":"6","tags":["precast-2016","荷載 Loadings","mcq","中級"]},{"id":"PRC-004","t":"mcq","d":3,"tp":"荷載 Loadings","c":"Table 2.1","p":15,"q":"Table 2.1：平板、有可拆側模、無成形凹槽、smooth mould（只用 form oil）的 demoulding 等效荷載系數？","o":["1.3","1.2","1.4","1.7"],"a":0,"e":"脫模時模板吸力/黏附力以自重乘系數考慮；雕塑形 smooth 1.7 最高。只用於構件抗彎設計，吊點另按 Table 2.4。","x":"Flat with removable side forms. No formed","q_en":"Table 2.1: equivalent demoulding load factor for a flat panel with removable side forms, no formed recesses, and a smooth mould (form oil only)?","e_en":"Mould suction/adhesion at demoulding is allowed for by multiplying self-weight by a factor; sculptured smooth is highest at 1.7. Used only for flexural design of the element; lifting points follow Table 2.4.","doc":"precast-2016","pp":"7","tags":["precast-2016","荷載 Loadings","mcq","進階"]},{"id":"PRC-005","t":"num","d":2,"tp":"荷載 Loadings","c":"Table 2.2","p":15,"q":"Table 2.2：運輸（transportation）階段的等效動力荷載系數？","a":1.5,"tol":0,"u":"","e":"堆場 1.2、運輸 1.5、安裝 1.2。路面惡劣可能需更高。","x":"Yard handling 1.2 Transportation 1.5 Erection 1.2","q_en":"Table 2.2: equivalent dynamic load factor for the transportation stage?","e_en":"Yard storage 1.2, transportation 1.5, erection 1.2. Poor road surfaces may need higher values.","doc":"precast-2016","pp":"7","tags":["precast-2016","荷載 Loadings","num","中級"]},{"id":"PRC-006","t":"num","d":2,"tp":"材料 Materials","c":"2.6.2.1","p":15,"q":"預製混凝土的 reactive alkali（Na2O 當量）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"與 Foundations Code 相同的 AAR 限值，供應商要提交 HOKLAS 認可證書。","x":"cubic metre should not exceed 3.0 kg.","q_en":"The reactive alkali content (Na2O equivalent) of precast concrete should not exceed how many kg per cubic metre?","e_en":"The same AAR limit as the Foundations Code; suppliers must submit HOKLAS-accredited certificates.","doc":"precast-2016","pp":"7","tags":["precast-2016","材料 Materials","num","中級"]},{"id":"PRC-007","t":"mcq","d":2,"tp":"材料 Materials","c":"Table 2.3","p":16,"q":"Table 2.3：預應力混凝土的最大總氯化物含量（以水泥質量計氯離子百分比）？","o":["0.10%","0.20%","0.35%","0.50%"],"a":0,"e":"預應力/蒸汽養護 0.10%；抗硫酸鹽水泥 0.20%；OPC 有埋置金屬 0.35%。","x":"Prestressed concrete","q_en":"Table 2.3: maximum total chloride content of prestressed concrete (chloride ion as a percentage by mass of cement)?","e_en":"Prestressed/steam-cured 0.10%; sulphate-resisting cement 0.20%; OPC with embedded metal 0.35%.","doc":"precast-2016","pp":"8","tags":["precast-2016","材料 Materials","mcq","中級"]},{"id":"PRC-008","t":"mcq","d":2,"tp":"吊裝 Lifting","c":"2.7.5.1 / Table 2.4","p":17,"q":"一般情況下 lifting inserts 在 ULS 的建議安全系數？多次使用（如沙井蓋）時？","o":["4；5","3；4","2；3","5；6"],"a":0,"e":"Bracing 構件 2、bracing 接駁及預埋件 3。吊點佈置要確保任一吊點失效不會令整個吊裝系統失效。","x":"Lifting inserts, normal circumstances 4","q_en":"Recommended ULS factor of safety for lifting inserts in general? And for repeated use (e.g. manhole covers)?","o_en":["4; 5","3; 4","2; 3","5; 6"],"e_en":"Bracing members 2, bracing connections and cast-in inserts 3. The lifting arrangement must ensure that failure of any one lifting point does not cause failure of the whole lifting system.","doc":"precast-2016","pp":"9","tags":["precast-2016","吊裝 Lifting","mcq","中級"]},{"id":"PRC-009","t":"num","d":2,"tp":"吊裝 Lifting","c":"Table 2.4","p":17,"q":"Table 2.4：Bracing members 的建議安全系數？","a":2,"tol":0,"u":"","e":"預製牆臨時斜撐常被低估；要按風荷載及 1.5 kN/m² 施工荷載設計。","x":"Bracing members 2","q_en":"Table 2.4: recommended factor of safety for bracing members?","e_en":"Temporary raking props to precast walls are often underestimated; design them for wind load and the 1.5 kN/m² construction load.","doc":"precast-2016","pp":"9","tags":["precast-2016","吊裝 Lifting","num","中級"]},{"id":"PRC-010","t":"tf","d":2,"tp":"吊裝 Lifting","c":"2.7.5.1","p":17,"q":"普通鋼筋可隨意用作 lifting inserts。","a":false,"e":"吊點應為專門設計的 proprietary 產品；鋼筋只有經專門設計和安裝才可用作吊環。","x":"All lifting inserts should be purposely designed proprietary products. Reinforcing bars may only be","q_en":"Ordinary reinforcing bars may freely be used as lifting inserts.","e_en":"False. Lifting points should be purpose-designed proprietary products; reinforcing bars may be used as lifting loops only when specifically designed and installed.","doc":"precast-2016","pp":"9","tags":["precast-2016","吊裝 Lifting","tf","中級"]},{"id":"PRC-011","t":"short","d":3,"tp":"設計 Design","c":"2.7.4","p":17,"q":"為何預製構件的設計往往由臨時工況控制？舉出規範中的例子。","m":"預製構件在施工期間的受力及結構體系與永久狀態不同，應力可能更高。例子：組合構件的預製部分在澆注面層前承受自重加施工荷載；下層預製樓板或樓梯承托上層的支撐；支座或 halving joint 因回撐承受較高的臨時施工荷載。","k":["temporary condition may govern","precast part before topping","lower slabs supporting props","halving joints with back-propping"],"e":"審核預製圖時要求提交各施工階段的臨時工程方案，包括拆撐次序。","x":"The critical loading for precast elements is often not the permanent condition but can occur during","q_en":"Why is the design of precast elements often governed by temporary conditions? Give examples from the Code.","m_en":"During construction, the loading and structural system of precast elements differ from the permanent state and stresses may be higher. Examples: the precast part of a composite member carrying self-weight plus construction load before the topping is cast; lower precast slabs or stairs supporting the propping for floors above; bearings or halving joints carrying higher temporary construction loads from back-propping.","e_en":"When vetting precast drawings, submissions of temporary works schemes for each construction stage, including the prop removal sequence, are required.","doc":"precast-2016","pp":"9","tags":["precast-2016","設計 Design","short","進階"]},{"id":"PRC-012","t":"num","d":2,"tp":"支座 Bearings","c":"2.7.9.2","p":22,"q":"非孤立構件的 net bearing width 取計算值或多少 mm（取較大）？","a":40,"tol":0,"u":"mm","e":"Net bearing width = 極限支座反力 /（有效支承長度 × 極限支承應力）。孤立構件再加 20 mm。","x":"or 40 mm, whichever is greater.","q_en":"The net bearing width of a non-isolated member is taken as the calculated value or how many mm (whichever is greater)?","e_en":"Net bearing width = ultimate support reaction / (effective bearing length × ultimate bearing stress). For isolated members add 20 mm.","doc":"precast-2016","pp":"14","tags":["precast-2016","支座 Bearings","num","中級"]},{"id":"PRC-013","t":"mcq","d":3,"tp":"支座 Bearings","c":"2.7.9.3","p":23,"q":"構件的 effective bearing length 取以下較小值：","o":["支承長度；支承長度一半加 100 mm；600 mm","支承長度；300 mm","支承長度一半；400 mm","支承長度；1000 mm"],"a":0,"e":"防止長支座上應力分佈不均。","x":"one-half of bearing length plus 100 mm; or","q_en":"The effective bearing length of a member is taken as the least of:","o_en":["The bearing length; half the bearing length plus 100 mm; 600 mm","The bearing length; 300 mm","Half the bearing length; 400 mm","The bearing length; 1000 mm"],"e_en":"Prevents uneven stress distribution over long bearings.","doc":"precast-2016","pp":"15","tags":["precast-2016","支座 Bearings","mcq","進階"]},{"id":"PRC-014","t":"mcq","d":2,"tp":"支座 Bearings","c":"2.7.9.4","p":23,"q":"混凝土上的 dry bearing 與 bedded bearing 的 design ultimate bearing stress？","o":["0.4fcu；0.6fcu","0.6fcu；0.8fcu","0.3fcu；0.5fcu","0.45fcu；0.67fcu"],"a":0,"e":"鑄入鋼支承板（每邊不超過混凝土相應尺寸 40%）可用 0.8fcu。","x":"0.4fcu for dry bearing on the concrete;","q_en":"Design ultimate bearing stress for dry bearing and bedded bearing on concrete?","o_en":["0.4fcu; 0.6fcu","0.6fcu; 0.8fcu","0.3fcu; 0.5fcu","0.45fcu; 0.67fcu"],"e_en":"Cast-in steel bearing plates (each side not exceeding 40% of the corresponding concrete dimension) may use 0.8fcu.","doc":"precast-2016","pp":"15","tags":["precast-2016","支座 Bearings","mcq","中級"]},{"id":"PRC-015","t":"num","d":2,"tp":"支座 Bearings","c":"2.7.9.5","p":23,"q":"孤立構件的 net bearing width 為非孤立構件的值加多少 mm？","a":20,"tol":0,"u":"mm","e":"孤立構件（無冗餘）支座失效後果嚴重，故要加大。","x":"The net bearing width for isolated members should be that of non-isolated members plus 20 mm.","q_en":"The net bearing width of an isolated member is the value for a non-isolated member plus how many mm?","e_en":"Isolated members (no redundancy) have severe consequences if a bearing fails, hence the increase.","doc":"precast-2016","pp":"15","tags":["precast-2016","支座 Bearings","num","中級"]},{"id":"PRC-016","t":"num","d":3,"tp":"支座 Bearings","c":"Table 2.5","p":24,"q":"Table 2.5：Grade 30 或以上混凝土支座，因剝落假設無效的距離（mm）？","a":15,"tol":0,"u":"mm","e":"鋼支座 0、<C30 為 25 mm。支座設計 nominal width = net bearing + 剝落 + 施工偏差。","x":"Concrete grade 30 or above, plain or reinforced 15","q_en":"Table 2.5: distance (mm) assumed ineffective due to spalling at bearings on concrete of Grade 30 or above?","e_en":"Steel supports 0, <C30 25 mm. Nominal bearing width = net bearing + spalling + construction inaccuracies.","doc":"precast-2016","pp":"16","tags":["precast-2016","支座 Bearings","num","進階"]},{"id":"PRC-017","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.1","p":38,"q":"Table 3.1：牆或外牆板吊點在邊緣橫跨厚度方向的建議容許偏差？","o":["5 mm","25 mm","150 mm","300 mm"],"a":0,"e":"其他：樁/樓板 150 mm、樑沿長度 300 mm、橫跨 25 mm。","x":"Wall or façade panel On the edge across the thickness 5 mm","q_en":"Table 3.1: recommended tolerance on lifting insert position across the thickness at the edge of walls or façade panels?","e_en":"Others: piles/slabs 150 mm, beams along the length 300 mm, across 25 mm.","doc":"precast-2016","pp":"30","tags":["precast-2016","施工 Construction","mcq","中級"]},{"id":"PRC-018","t":"num","d":2,"tp":"施工 Construction","c":"3.2.2","p":38,"q":"良好做法：模具大約每多少次澆注後應全面重新檢查尺寸偏差？","a":100,"tol":0,"u":"次","e":"模具反覆使用會變形，定期檢查可避免構件尺寸偏差累積。","x":"compliance be carried out after approximately 100 castings. More frequent checking may be","q_en":"Good practice: moulds should be fully rechecked for dimensional accuracy after approximately how many casts?","e_en":"Moulds deform with repeated use; regular checks prevent accumulation of dimensional deviations in the elements.","u_en":"casts","doc":"precast-2016","pp":"30","tags":["precast-2016","施工 Construction","num","中級"]},{"id":"PRC-019","t":"mcq","d":2,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：一般非預應力構件、精細控制吊機吊裝的建議最低混凝土強度？","o":["10 N/mm²","15 N/mm²","20 N/mm²","25 N/mm²"],"a":0,"e":"有明顯衝擊 15；同心預應力 20；偏心預應力 25；橋樑 30 N/mm²。實際要視吊點錨固長度。","x":"None specified, fine controlled crane, non-prestressed 10 N/mm","q_en":"Table 3.2: recommended minimum concrete strength for lifting ordinary non-prestressed elements with a finely controlled crane?","e_en":"With significant impact 15; concentrically prestressed 20; eccentrically prestressed 25; bridges 30 N/mm². Actual values depend on the anchorage length of the lifting inserts.","doc":"precast-2016","pp":"32","tags":["precast-2016","施工 Construction","mcq","中級"]},{"id":"PRC-020","t":"num","d":3,"tp":"施工 Construction","c":"Table 3.2","p":40,"q":"Table 3.2：偏心預應力構件（如 T 樑、深樓板單元）吊裝的最低混凝土強度（N/mm²）？","a":25,"tol":0,"u":"N/mm²","e":"預應力構件吊點須錨固在受壓區，除非另有設計。","x":"Eccentrically prestressed elements (tees, deep flooring units) 25 N/mm","q_en":"Table 3.2: minimum concrete strength (N/mm²) for lifting eccentrically prestressed elements (e.g. T-beams, deep slab units)?","e_en":"Lifting inserts in prestressed elements must be anchored in the compression zone unless otherwise designed.","doc":"precast-2016","pp":"32","tags":["precast-2016","施工 Construction","num","進階"]},{"id":"PRC-021","t":"num","d":2,"tp":"施工 Construction","c":"3.16.9","p":45,"q":"半預製樓板澆注面層前，以水刀清潔的最低水壓（kPa）？","a":10000,"tol":0,"u":"kPa","e":"即 100 bar。清潔後要檢查樓板底裂縫，貫穿裂縫須在澆注前修補，以確保新舊混凝土結合。","x":"by using water jet with a minimum pressure of 10,000kPa (100bar) for cleansing;","q_en":"Minimum water jet pressure (kPa) for cleaning semi-precast slabs before casting the topping?","e_en":"I.e. 100 bar. After cleaning, check the slab soffit for cracks; through-cracks must be repaired before casting to ensure bond between new and old concrete.","doc":"precast-2016","pp":"37","tags":["precast-2016","施工 Construction","num","中級"]},{"id":"PRC-022","t":"tf","d":2,"tp":"耐久性 Durability","c":"2.4.3","p":13,"q":"預製構件的保護層可比現澆混凝土結構的要求為小，因為工廠品質較好。","a":false,"e":"規範明確規定不少於鋼筋混凝土結構的要求；防火按 FS Code、防腐按 B(C)R。支架及固定件亦要符合保護層要求。","x":"Cover for precast elements should be no less than those specified for reinforced concrete","q_en":"The cover to precast elements may be less than that required for cast-in-place concrete structures because factory quality is better.","e_en":"False. The Code explicitly requires not less than that for reinforced concrete structures; fire per the FS Code, corrosion protection per B(C)R. Brackets and fixings must also meet the cover requirements.","doc":"precast-2016","pp":"5","tags":["precast-2016","耐久性 Durability","tf","中級"]},{"id":"SEC-001","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Beams – Properties","p":5,"q":"查表：457x191x67 UB 的 plastic modulus Sx（x-x 軸）？","a":1470,"tol":0,"u":"cm³","e":"457x191x67：Ix 29400 cm⁴、Zx 1300 cm³、Sx 1470 cm³、A 85.5 cm²。Mc = py·Sx（Class 1/2），計算時注意 cm³ → mm³ 的單位換算（×10³）是常見出錯位。","x":"457x191x67 29400 1450 18.5 4.12 1300 153 1470 237","q_en":"Look up: plastic modulus Sx (x-x axis) of 457x191x67 UB?","e_en":"457x191x67: Ix 29400 cm⁴, Zx 1300 cm³, Sx 1470 cm³, A 85.5 cm². Mc = py·Sx (Class 1/2); the cm³ → mm³ unit conversion (×10³) is a common source of error.","doc":"steel-section-tables-bs5950","pp":"B-5","tags":["steel-section-tables-bs5950","截面性質查表 Section properties","num","基礎"]},{"id":"SEC-002","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Beams – Properties","p":5,"q":"查表：533x210x92 UB 的 Ix？","a":55200,"tol":0,"u":"cm⁴","e":"533x210x92：Ix 55200 cm⁴、Zx 2070 cm³、Sx 2360 cm³、ry 4.51 cm、A 117 cm²。撓度計算用 Ix；LTB 用 ry、u、x。","x":"533x210x92 55200 2390 21.7 4.51 2070 228 2360 355","q_en":"Look up: Ix of 533x210x92 UB?","e_en":"533x210x92: Ix 55200 cm⁴, Zx 2070 cm³, Sx 2360 cm³, ry 4.51 cm, A 117 cm². Deflection uses Ix; LTB uses ry, u, x.","doc":"steel-section-tables-bs5950","pp":"B-5","tags":["steel-section-tables-bs5950","截面性質查表 Section properties","num","基礎"]},{"id":"SEC-003","t":"mcq","d":2,"tp":"截面性質查表 Section properties","c":"Universal Columns – Properties","p":13,"q":"查表：305x305x97 UC 的 ry（y-y 軸 radius of gyration）？","o":["7.69 cm","13.4 cm","6.48 cm","9.91 cm"],"a":0,"e":"柱的弱軸 slenderness λ = LE/ry，ry 通常控制。305x305x97：rx 13.4 cm、ry 7.69 cm、A 123 cm²。","x":"305x305x97 22200 7310 13.4 7.69 1450 479 1590 726","q_en":"Look up: ry (radius of gyration about the y-y axis) of 305x305x97 UC?","e_en":"Column minor-axis slenderness λ = LE/ry; ry usually governs. 305x305x97: rx 13.4 cm, ry 7.69 cm, A 123 cm².","doc":"steel-section-tables-bs5950","pp":"B-13","tags":["steel-section-tables-bs5950","截面性質查表 Section properties","mcq","中級"]},{"id":"SEC-004","t":"num","d":2,"tp":"截面分類 Section classification","c":"Universal Beams – Dimensions","p":4,"q":"查表：457x191x67 UB 的 flange local buckling ratio b/T？","a":7.48,"tol":0.01,"u":"","e":"表中 b/T 以 b = B/2 計（189.9/2 ÷ 12.7 ≈ 7.48），與 HK Steel Code Figure 7.1 對 rolled I-section 的 b 定義一致。d/t = 48.0。","x":"457x191x67 67.1 453.4 189.9 8.5 12.7 10.2 407.6 7.48 48.0","q_en":"Look up: flange local buckling ratio b/T of 457x191x67 UB?","e_en":"b/T in the table uses b = B/2 (189.9/2 ÷ 12.7 ≈ 7.48), consistent with the definition of b for rolled I-sections in HK Steel Code Figure 7.1. d/t = 48.0.","doc":"steel-section-tables-bs5950","pp":"B-4","tags":["steel-section-tables-bs5950","截面分類 Section classification","num","中級"]},{"id":"SEC-005","t":"scenario","d":3,"tp":"截面分類 Section classification","c":"Dimensions table + Steel Code Table 7.1","p":4,"q":"457x191x67 UB，S275（假設 py = 275 N/mm²，ε = 1），受純彎曲。用截面表及 HK Steel Code Table 7.1 判斷截面分類。","m":"截面表：b/T = 7.48、d/t = 48.0。Table 7.1：rolled section 受彎 compression flange outstand Class 1 限值 9ε = 9 → 7.48 < 9，Class 1；web（neutral axis at mid-depth）Class 1 限值 80ε = 80 → 48.0 < 80，Class 1。故截面為 Class 1 plastic，可用 Mc = py·Sx（並受 1.2py·Zx 限制，按 Code 8.2）。","k":["b/T 7.48 ≤ 9ε","d/t 48.0 ≤ 80ε","ε = √(275/py)","Class 1 plastic"],"e":"py 隨鋼板厚度下降，ε 隨之上升；S355 時 ε ≈ 0.88（視厚度），限值收緊，較薄 flange 的 UB 可能變為 Class 2/3。先查 py 再算 ε 是基本步驟。","x":"457x191x67 67.1 453.4 189.9 8.5 12.7 10.2 407.6 7.48 48.0","r":[{"doc":"steel-2011-2023ed","p":87,"c":"Table 7.1","x":"Flange Outstand Compression Rolled b/T 9ε 10ε 15ε","pp":"68"}],"q_en":"457x191x67 UB, S275 (assume py = 275 N/mm², ε = 1), in pure bending. Classify the section using the section tables and HK Steel Code Table 7.1.","m_en":"Section tables: b/T = 7.48, d/t = 48.0. Table 7.1: for a rolled section in bending, compression flange outstand Class 1 limit 9ε = 9 → 7.48 < 9, Class 1; web (neutral axis at mid-depth) Class 1 limit 80ε = 80 → 48.0 < 80, Class 1. So the section is Class 1 plastic, and Mc = py·Sx may be used (limited to 1.2py·Zx per Code 8.2).","e_en":"py decreases with plate thickness and ε increases accordingly; for S355 ε ≈ 0.88 (depending on thickness), the limits tighten and UBs with thinner flanges may become Class 2/3. Looking up py first and then calculating ε is the basic step.","doc":"steel-section-tables-bs5950","pp":"B-4","tags":["steel-section-tables-bs5950","截面分類 Section classification","scenario","進階"]},{"id":"SEC-006","t":"mcq","d":2,"tp":"截面分類 Section classification","c":"Steel Code Table 7.1","doc":"steel-2011-2023ed","p":87,"q":"HK Steel Code Table 7.1：I/H 截面 web（neutral axis at mid-depth）的 Class 1 / 2 / 3 d/t 限值？","o":["80ε / 100ε / 120ε","9ε / 10ε / 15ε","28ε / 32ε / 40ε","40 / 40 / 40"],"a":0,"e":"Web 受彎 80ε/100ε/120ε；rolled flange outstand 9ε/10ε/15ε；internal element 28ε/32ε/40ε。配合截面表的 d/t 欄可即時分類。","x":"Neutral axis at mid-depth d/t 80ε 100ε 120ε","q_en":"HK Steel Code Table 7.1: Class 1 / 2 / 3 d/t limits for the web of an I/H section (neutral axis at mid-depth)?","e_en":"Web in bending 80ε/100ε/120ε; rolled flange outstand 9ε/10ε/15ε; internal element 28ε/32ε/40ε. Combined with the d/t column of the section tables, sections can be classified instantly.","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","mcq","中級"]},{"id":"SEC-007","t":"num","d":1,"tp":"截面性質查表 Section properties","c":"Universal Columns – Dimensions","p":12,"q":"查表：254x254x73 UC 的 flange thickness T？","a":14.2,"tol":0,"u":"mm","e":"T = 14.2 mm（≤ 16 mm，S275 py 取 275）。T 決定 py 的厚度級別，也是 flange 分類的分母。","x":"254x254x73 73.1 254.1 254.6 8.6 14.2 12.7 200.3 8.96 23.3","q_en":"Look up: flange thickness T of 254x254x73 UC?","e_en":"T = 14.2 mm (≤ 16 mm, so py for S275 is 275). T determines the thickness band for py and is the denominator for flange classification.","doc":"steel-section-tables-bs5950","pp":"B-12","tags":["steel-section-tables-bs5950","截面性質查表 Section properties","num","基礎"]},{"id":"STL-001","t":"mcq","d":1,"tp":"極限狀態 Limit states","c":"Table 2.1","p":38,"q":"按 Steel Code Table 2.1，以下哪一項屬 serviceability limit state？","o":["Brittle fracture","Fire resistance","Human induced vibration","Stability against overturning"],"a":2,"e":"Table 2.1：SLS 包括 deflection、human induced vibration、wind induced vibration、durability；brittle fracture、fatigue、fire、穩定屬 ULS。","x":"Stability against overturning, sliding, uplift and Human induced vibration","q_en":"According to Steel Code Table 2.1, which of the following is a serviceability limit state?","e_en":"Table 2.1: SLS includes deflection, human induced vibration, wind induced vibration and durability; brittle fracture, fatigue, fire and stability are ULS.","doc":"steel-2011-2023ed","pp":"19","tags":["steel-2011-2023ed","極限狀態 Limit states","mcq","基礎"]},{"id":"STL-002","t":"tf","d":1,"tp":"荷載組合 Load combinations","c":"2.3.1","p":38,"q":"Steel Code 規定在每個荷載組合中，抵抗滑動、傾覆或上拔的有利 dead load 應取 γf = 1.0。","a":true,"e":"對。2.3.1：beneficial dead load γf = 1.0。鋼結構輕，uplift（例如輕鋼屋頂、簷篷）往往由 1.0Gk + 1.4Wk 控制。","x":"which counteracts the effects of other loads, including dead loads restraining sliding,","q_en":"The Steel Code requires that, in every load combination, beneficial dead load resisting sliding, overturning or uplift be taken with γf = 1.0.","e_en":"True. 2.3.1: beneficial dead load γf = 1.0. Steel structures are light, so uplift (e.g. lightweight steel roofs, canopies) is often governed by 1.0Gk + 1.4Wk.","doc":"steel-2011-2023ed","pp":"19","tags":["steel-2011-2023ed","荷載組合 Load combinations","tf","基礎"]},{"id":"STL-003","t":"tf","d":2,"tp":"疲勞 Fatigue","c":"2.3.3","p":39,"q":"一般建築物中，風荷載的正常波動引起的應力變化需要作疲勞檢核。","a":false,"e":"錯。2.3.3：normal fluctuations in wind loading need not be considered；但氣動不穩定引起的風致振動、承托振動機器或吊車的構件則要考慮。疲勞設計 γf = 1.0。","x":"numerous fluctuations of stress. Stress changes due to normal fluctuations in wind","q_en":"In ordinary buildings, stress fluctuations due to normal fluctuations in wind loading require a fatigue check.","e_en":"False. 2.3.3: normal fluctuations in wind loading need not be considered; but wind-induced oscillations from aerodynamic instability, and members supporting vibrating machinery or cranes, must be considered. Fatigue design uses γf = 1.0.","doc":"steel-2011-2023ed","pp":"20","tags":["steel-2011-2023ed","疲勞 Fatigue","tf","中級"]},{"id":"STL-004","t":"num","d":2,"tp":"疲勞 Fatigue","c":"2.3.3.4","p":41,"q":"疲勞評估時，按 Steel Code 設計的建築物 design working life 取多少年？","a":50,"tol":0,"u":"年","e":"2.3.3.4(a)：建築物 50 年；道路/橋樑一般 120 年。Miner's rule Σni/Ni ≤ 1.0。","x":"designed to the Code the design working life is 50 years and for road/bridge this","q_en":"For fatigue assessment, what design working life (years) is taken for buildings designed to the Steel Code?","e_en":"2.3.3.4(a): buildings 50 years; roads/bridges generally 120 years. Miner's rule Σni/Ni ≤ 1.0.","u_en":"years","doc":"steel-2011-2023ed","pp":"22","tags":["steel-2011-2023ed","疲勞 Fatigue","num","中級"]},{"id":"STL-005","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3","p":43,"q":"作為水平 tie 的鋼構件及其端部連接，須能抵抗的最少 factored tensile load 是多少 kN？","a":75,"tol":0,"u":"kN","e":"2.3.4.3(a)：≥75 kN，毋須與其他荷載疊加。Internal tie = 0.5(1.4Gk+1.6Qk)stL；edge tie = 0.25(...)stL，均不少於 75 kN。常見錯誤：簡支樑端 fin plate 連接未檢核 tie force。","x":"capable of resisting a factored tensile load not less than 75kN, which need not be","q_en":"What minimum factored tensile load (kN) must a steel member acting as a horizontal tie, and its end connections, be able to resist?","e_en":"2.3.4.3(a): ≥75 kN, not combined with other loads. Internal tie = 0.5(1.4Gk+1.6Qk)stL; edge tie = 0.25(...)stL, both not less than 75 kN. Common error: not checking the tie force at the fin plate connections of simply supported beam ends.","doc":"steel-2011-2023ed","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","num","中級"]},{"id":"STL-006","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3(b)","p":43,"q":"錨固邊柱（edge columns）的水平 tie 須抵抗以下哪個值的最大者？","o":["Tie force、75 kN 或柱荷載 1%","Tie force、50 kN 或柱荷載 3%","75 kN 或柱荷載 1.5%","柱荷載 2.5%"],"a":0,"e":"2.3.4.3(b)：max(tie force, 75 kN, 1% 柱上/下最大 factored dead + imposed load)，垂直於邊緣作用。（Concrete Code 外柱為 3%，兩本 Code 數值不同，要分清。）","x":"calculated in (a) above, 75 kN or 1% of the maximum factored dead and imposed","q_en":"Horizontal ties anchoring edge columns must resist the greatest of which values?","o_en":["Tie force, 75 kN, or 1% of the column load","Tie force, 50 kN, or 3% of the column load","75 kN or 1.5% of the column load","2.5% of the column load"],"e_en":"2.3.4.3(b): max(tie force, 75 kN, 1% of the maximum factored dead + imposed load in the column above/below), acting perpendicular to the edge. (The Concrete Code uses 3% for external columns — the two Codes differ, so keep them distinct.)","doc":"steel-2011-2023ed","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","mcq","中級"]},{"id":"STL-007","t":"short","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3(c)","p":44,"q":"Steel Code 對柱接駁（column splices）的 tension continuity 有何要求？","m":"所有柱接駁須能抵抗一個拉力，等於該接駁與下一個接駁之間任何單一樓層施加於柱的最大 factored vertical reaction（取 dead + imposed 或 dead + wind + imposed）。除非鋼框架至少一個方向完全連續，所有柱須在每個樑柱連接處貫通。","k":["splice 抗拉 = 單層最大 factored reaction","考慮 D+I 或 D+W+I","柱須連續貫通樑柱節點"],"e":"這是避免 disproportionate collapse 的連續性要求。Bearing-type column splice（只靠端面接觸受壓）要另加足夠螺栓/焊縫承受此拉力。","x":"All column splices should be capable of resisting a tensile force equal","q_en":"What does the Steel Code require for tension continuity at column splices?","m_en":"All column splices must resist a tensile force equal to the largest factored vertical reaction applied to the column from any single storey between that splice and the next (taking dead + imposed or dead + wind + imposed). Unless the steel frame is fully continuous in at least one direction, all columns must be continuous through each beam-to-column connection.","k_en":["Splice tension = largest factored reaction from a single storey","Consider D+I or D+W+I","Columns continuous through beam-column joints"],"e_en":"This continuity requirement avoids disproportionate collapse. Bearing-type column splices (relying only on end contact in compression) need additional bolts/welds to carry this tension.","doc":"steel-2011-2023ed","pp":"25","tags":["steel-2011-2023ed","穩健性 Robustness","short","中級"]},{"id":"STL-008","t":"num","d":2,"tp":"荷載 Loading","c":"2.5.3","p":46,"q":"Steel Code 規定 load combinations 2 和 3 的最小 unfactored wind load 不應少於 unfactored dead load 的多少 %？","a":1.0,"tol":0,"u":"%","e":"2.5.3：≥1.0% Gk（每層按該層重量計）。Concrete Code 則以 1.5% Gk 作 design ultimate 下限，兩者定義不同（unfactored vs ultimate）。","x":"The minimum unfactored wind load should not be less than 1.0% of unfactored dead load","q_en":"The Steel Code requires the minimum unfactored wind load in load combinations 2 and 3 to be not less than what % of the unfactored dead load?","e_en":"2.5.3: ≥1.0% Gk (per floor, based on that floor's weight). The Concrete Code uses 1.5% Gk as a design ultimate lower bound — the definitions differ (unfactored vs ultimate).","doc":"steel-2011-2023ed","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","num","中級"]},{"id":"STL-009","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.6","p":46,"q":"設計溫度效應時，Steel Code 假設香港平均溫度變化範圍為：","o":["0°C 至 35°C","+0.1°C 至 +40.0°C","5°C 至 38°C","−5°C 至 45°C"],"a":1,"e":"2.5.6：+0.1°C 至 +40.0°C；受陽光直射構件（如幕牆支架）按 13.3.4.3 取更高溫度。長鋼屋頂及預應力拉桿系統特別敏感。","x":"varies from +0.1ºC to +40.0ºC. The actual range, however, depends on the location, type","q_en":"For designing temperature effects, the Steel Code assumes the average temperature range in Hong Kong is:","o_en":["0°C to 35°C","+0.1°C to +40.0°C","5°C to 38°C","−5°C to 45°C"],"e_en":"2.5.6: +0.1°C to +40.0°C; members exposed to direct sunlight (e.g. curtain wall brackets) take higher temperatures per 13.3.4.3. Long steel roofs and prestressed tension rod systems are particularly sensitive.","doc":"steel-2011-2023ed","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","mcq","中級"]},{"id":"STL-010","t":"num","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"一般結構的 notional horizontal force 最少為 factored dead and imposed loads 的多少 %？","a":0.5,"tol":0,"u":"%","e":"2.5.8：0.5%（或 0.5 kN/m² 側壓，取較大），用於 load combination 1，毋須再乘 γf；臨時工程及 sway ultra-sensitive 結構用 1.0% 或 1.0 kN/m²。計算 overturning 時不需施加。","x":"should be capable of resisting notional horizontal forces with a minimum of 0.5% of the","q_en":"The notional horizontal force for ordinary structures is at least what % of the factored dead and imposed loads?","e_en":"2.5.8: 0.5% (or 0.5 kN/m² lateral pressure, whichever is greater), used in load combination 1 without further γf; temporary works and sway ultra-sensitive structures use 1.0% or 1.0 kN/m². Not applied when calculating overturning.","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","num","中級"]},{"id":"STL-011","t":"tf","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"Notional horizontal forces 應與其他外加水平荷載（例如風）同時施加。","a":false,"e":"錯。2.5.8：不需與其他水平荷載、溫度效應同時施加，亦不用於 overturning 及 pattern loads，且不需計入基礎淨反力。它只與 comb 1 的 factored vertical loads 同時作用。","x":"The notional horizontal forces need not be applied when considering overturning, pattern","q_en":"Notional horizontal forces should be applied together with other applied horizontal loads (e.g. wind).","e_en":"False. 2.5.8: they need not be applied with other horizontal loads or temperature effects, are not used for overturning or pattern loads, and need not be included in net foundation reactions. They act only with the factored vertical loads of comb 1.","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","tf","中級"]},{"id":"STL-012","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"臨時工程（如棚架、falsework）及 sway ultra-sensitive 結構的 notional horizontal force 應取：","o":["0.5% 或 0.5 kN/m²","1.0% 或 1.0 kN/m²（取較大）","2.5% 或 1.5 kN/m²","1.5% Gk"],"a":1,"e":"2.5.8：臨時工程 1.0% factored dead + live 或 1.0 kN/m²。Temporary works 另按 4.3.4 任何 adverse γf 不少於 1.2。","x":"horizontal force shall be used. The magnitude of this force shall be the greater of 1.0% of","q_en":"The notional horizontal force for temporary works (e.g. scaffolding, falsework) and sway ultra-sensitive structures should be taken as:","o_en":["0.5% or 0.5 kN/m²","1.0% or 1.0 kN/m² (whichever is greater)","2.5% or 1.5 kN/m²","1.5% Gk"],"e_en":"2.5.8: temporary works 1.0% of factored dead + live or 1.0 kN/m². Temporary works additionally require any adverse γf to be not less than 1.2 per 4.3.4.","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","mcq","中級"]},{"id":"STL-013","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"Steel Code 的 Class 1H 高強度鋼是指 yield strength 在哪個範圍？","o":["355–460 N/mm²","> 460 至 ≤ 690 N/mm²","> 690 N/mm²","≤ 460 N/mm²"],"a":1,"e":"3.1.1：Class 1/2/3 為 ≤460；1H 為 460–690；UH（>690）不在 Code 範圍，須 BA 批准（如高強度拉桿）。塑性分析不允許用於 uncertified steel 或 >690 鋼材。","x":"Class 1H: High strength steels with yield strengths greater than 460 N/mm2 but less","q_en":"Class 1H high strength steel in the Steel Code has a yield strength in which range?","o_en":["355–460 N/mm²","> 460 to ≤ 690 N/mm²","> 690 N/mm²","≤ 460 N/mm²"],"e_en":"3.1.1: Class 1/2/3 are ≤460; 1H is 460–690; UH (>690) is outside the Code and needs BA approval (e.g. high-strength tension rods). Plastic analysis is not permitted for uncertified steel or steel >690.","doc":"steel-2011-2023ed","pp":"30","tags":["steel-2011-2023ed","材料 Materials","mcq","基礎"]},{"id":"STL-014","t":"tf","d":2,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"使用高強度鋼可同時改善疲勞及 serviceability 表現。","a":false,"e":"錯。3.1.1：高強度鋼對重載柱受壓及長跨樑抗彎有利，但不改善 fatigue 及 SLS（E 值相同，撓度不變）。可用 pre-camber 減撓度。","x":"imposed loads. Their use does not improve the performance for fatigue and serviceability","q_en":"Using high strength steel improves both fatigue and serviceability performance.","e_en":"False. 3.1.1: high strength steel benefits heavily loaded columns in compression and long-span beams in bending, but does not improve fatigue or SLS (same E, so deflection is unchanged). Pre-camber may be used to reduce deflection.","doc":"steel-2011-2023ed","pp":"30","tags":["steel-2011-2023ed","材料 Materials","tf","中級"]},{"id":"STL-015","t":"num","d":2,"tp":"材料 Materials","c":"3.1.2","p":51,"q":"Class 1 及 Class 2 鋼材的斷裂伸長率（elongation at fracture）不應少於多少 %？","a":15,"tol":0,"u":"%","e":"3.1.2 Ductility：Class 1、2 ≥15%；Class 1H ≥10%；抗拉強度應變不大於屈服應變 15 倍。","x":"For Classes 1 and 2 steel, the elongation at fracture is not to be less than 15%;","q_en":"The elongation at fracture of Class 1 and Class 2 steel should not be less than what %?","e_en":"3.1.2 Ductility: Class 1 and 2 ≥15%; Class 1H ≥10%; strain at tensile strength not greater than 15 times the yield strain.","doc":"steel-2011-2023ed","pp":"32","tags":["steel-2011-2023ed","材料 Materials","num","中級"]},{"id":"STL-016","t":"num","d":1,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 ≤ 16 mm 時的 design strength py 是多少 N/mm²？","a":355,"tol":0,"u":"N/mm²","e":"S355：≤16 mm 355、≤40 mm 345、≤63 mm 335、≤80 mm 325、≤100 mm 315。厚板 py 下降，大型 H 柱（翼緣 >40 mm）常被忽略。","x":"16 355 40 345 63 335 S355 80 325","q_en":"Table 3.2: design strength py (N/mm²) of S355 steel with thickness ≤ 16 mm?","e_en":"S355: ≤16 mm 355, ≤40 mm 345, ≤63 mm 335, ≤80 mm 325, ≤100 mm 315. py decreases for thick plates, which is often overlooked for large H-columns (flanges >40 mm).","doc":"steel-2011-2023ed","pp":"33","tags":["steel-2011-2023ed","材料 Materials","num","基礎"]},{"id":"STL-017","t":"num","d":2,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 > 40 mm 但 ≤ 63 mm 時 py 是多少 N/mm²？","a":335,"tol":0,"u":"N/mm²","e":"厚度分級：16/40/63/80/100/150 mm。UC 356×406×634 等重型柱翼緣超過 63 mm，py 只有 325 或以下。","x":"16 355 40 345 63 335 S355 80 325","q_en":"Table 3.2: py (N/mm²) of S355 steel with thickness > 40 mm but ≤ 63 mm?","e_en":"Thickness bands: 16/40/63/80/100/150 mm. Heavy columns such as UC 356×406×634 have flanges over 63 mm, with py only 325 or less.","doc":"steel-2011-2023ed","pp":"33","tags":["steel-2011-2023ed","材料 Materials","num","中級"]},{"id":"STL-018","t":"num","d":1,"tp":"材料 Materials","c":"3.1.6","p":56,"q":"Steel Code 分析用的鋼材彈性模量 E 是多少 N/mm²？","a":205000,"tol":0,"u":"N/mm²","e":"3.1.6：E = 205,000 N/mm²，Poisson's ratio 0.3，熱膨脹 14×10⁻⁶/°C。注意 Concrete Code 鋼筋 Es = 200 kN/mm²，但 Steel Code composite 設計中鋼筋亦取 205 kN/mm²（10.1.3）。","x":"Modulus of elasticity E = 205,000 N/mm2","q_en":"What elastic modulus E of steel (N/mm²) is used for analysis in the Steel Code?","e_en":"3.1.6: E = 205,000 N/mm², Poisson's ratio 0.3, thermal expansion 14×10⁻⁶/°C. Note that reinforcement Es in the Concrete Code is 200 kN/mm², but in Steel Code composite design reinforcement also takes 205 kN/mm² (10.1.3).","doc":"steel-2011-2023ed","pp":"37","tags":["steel-2011-2023ed","材料 Materials","num","基礎"]},{"id":"STL-019","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 1 鋼材（Ys ≤ 460）的 γm1 及 γm2 分別是：","o":["1.0 及 1.1","1.1 及 1.2","1.0 及 1.05","1.05 及 1.25"],"a":0,"e":"Table 4.1：Class 1 1.0/1.1；Class 2 1.1/1.2；Class 1H 1.0/1.05；Class 3 py 限 170 N/mm²、抗拉 300 N/mm²。py = Ys/γm1 但不大於 Us/γm2。","x":"γm1 γm2 γm1 γm2 1 1.0 1.1 - - 2 1.1 1.2 - -","q_en":"γm1 and γm2 for Class 1 steel (Ys ≤ 460) are respectively:","o_en":["1.0 and 1.1","1.1 and 1.2","1.0 and 1.05","1.05 and 1.25"],"e_en":"Table 4.1: Class 1 1.0/1.1; Class 2 1.1/1.2; Class 1H 1.0/1.05; Class 3 py limited to 170 N/mm², tensile strength 300 N/mm². py = Ys/γm1 but not greater than Us/γm2.","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","材料係數 γm","mcq","中級"]},{"id":"STL-020","t":"num","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 3（uncertified）鋼材的 py 上限是多少 N/mm²？","a":170,"tol":0,"u":"N/mm²","e":"Table 4.1 註：Class 3 py ≤170 N/mm²，只可用於失效後果有限的次要構件（4.2.1）。","x":"For Class 3 steel py is limited to 170 N/mm2 and ultimate tensile strength to 300 N/mm2","q_en":"Upper limit of py (N/mm²) for Class 3 (uncertified) steel?","e_en":"Table 4.1 note: Class 3 py ≤170 N/mm², only for secondary members whose failure has limited consequences (4.2.1).","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","材料係數 γm","num","中級"]},{"id":"STL-021","t":"scenario","d":2,"tp":"荷載組合 Load combinations","c":"Table 4.2","p":64,"q":"一個鋼簷篷受 dead、imposed、wind 及溫度作用。按 Steel Code Table 4.2，comb 1、2、3 的 γf 為何？如何檢核 uplift？","m":"Comb 1（D+I）：Gk 1.4（有利 1.0）、Qk 1.6（有利 0）、溫度 1.2；Comb 2（D+lateral）：Gk 1.4/1.0、Wk 1.4、溫度 1.2；Comb 3（D+I+lateral）：Gk 1.2/1.0、Qk 1.2、Wk 1.2、溫度 1.2。Uplift 用 comb 2：1.0Gk + 1.4Wk（風吸），並檢核錨栓抗拔。","k":["1.4Gk+1.6Qk","1.4Gk(1.0Gk)+1.4Wk","1.2Gk+1.2Qk+1.2Wk","Temperature Tk 1.2","Uplift: 1.0Gk + 1.4Wk"],"e":"與 Concrete Code Table 2.1 基本一致，但 Steel Code 明列溫度 γf 1.2 及 differential settlement（comb 1/2 取 1.4、comb 3 取 1.2）。","x":"Table 4.2 - Partial load factors and combinations for normal condition design","q_en":"A steel canopy is subject to dead, imposed, wind and temperature actions. What are the γf values for comb 1, 2 and 3 under Steel Code Table 4.2? How is uplift checked?","m_en":"Comb 1 (D+I): Gk 1.4 (beneficial 1.0), Qk 1.6 (beneficial 0), temperature 1.2; Comb 2 (D+lateral): Gk 1.4/1.0, Wk 1.4, temperature 1.2; Comb 3 (D+I+lateral): Gk 1.2/1.0, Qk 1.2, Wk 1.2, temperature 1.2. Uplift uses comb 2: 1.0Gk + 1.4Wk (wind suction), and check the pull-out resistance of the anchor bolts.","e_en":"Essentially consistent with Concrete Code Table 2.1, but the Steel Code explicitly lists temperature γf 1.2 and differential settlement (1.4 for comb 1/2, 1.2 for comb 3).","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","荷載組合 Load combinations","scenario","中級"]},{"id":"STL-022","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"4.3.4","p":65,"q":"臨時工程（temporary works）中任何 adverse load factor（包括風）最少為多少？","a":1.2,"tol":0,"u":"","e":"4.3.4：in no circumstances less than 1.2。樓宇評估（4.3.3）亦要求 adverse γf 不少於 1.2。","x":"circumstances should any adverse load factor be less than 1.2. This includes load factors","q_en":"In temporary works, what is the minimum value of any adverse load factor (including wind)?","e_en":"4.3.4: in no circumstances less than 1.2. Appraisal of existing buildings (4.3.3) also requires adverse γf not less than 1.2.","doc":"steel-2011-2023ed","pp":"46","tags":["steel-2011-2023ed","荷載組合 Load combinations","num","中級"]},{"id":"STL-023","t":"mcq","d":3,"tp":"荷載組合 Load combinations","c":"Table 4.3","p":65,"q":"Extreme event（如車撞、爆炸）load combination 1 中，imposed load 的 adverse γf（非儲存用途）是：","o":["0.33","0.35","1.0","1.05"],"a":1,"e":"Table 4.3：Dead 1.05、Imposed 0.35、Wind 0.35、Extreme event Ak 1.0；儲存/工業或永久 imposed 取 1.0。Concrete Code 則以 1/3 imposed × 1.05 表達，概念相近。","x":"1. dead, 1.05 1.0 0.35 0 1.05 - 1.0","q_en":"In extreme event (e.g. vehicle impact, explosion) load combination 1, the adverse γf on imposed load (non-storage use) is:","e_en":"Table 4.3: dead 1.05, imposed 0.35, wind 0.35, extreme event Ak 1.0; storage/industrial or permanent imposed 1.0. The Concrete Code expresses it as 1/3 imposed × 1.05 — a similar concept.","doc":"steel-2011-2023ed","pp":"46","tags":["steel-2011-2023ed","荷載組合 Load combinations","mcq","進階"]},{"id":"STL-024","t":"mcq","d":1,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code：承托灰泥或其他脆性飾面的樑，imposed load 撓度限值為：","o":["Span/200","Span/250","Span/360","Span/500"],"a":2,"e":"Table 5.1：brittle finish span/360；其他樑 span/200；懸臂 length/180；吊車樑豎向 span/600。","x":"Beams carrying plaster or other brittle finish Span/360","q_en":"Steel Code: the imposed load deflection limit for beams carrying plaster or other brittle finishes is:","e_en":"Table 5.1: brittle finish span/360; other beams span/200; cantilevers length/180; crane girders vertical span/600.","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","基礎"]},{"id":"STL-025","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code Table 5.1 對樓宇層間相對側移（relative inter-storey drift）的限值是：","o":["Storey height/300","Storey height/400","Storey height/500","Storey height/1000"],"a":1,"e":"Table 5.1：頂層 drift Height/500；層間 drift storey height/400。幕牆及間隔要按此位移設計活動接駁。","x":"Relative inter-storey drift Storey height/400","q_en":"What is the Steel Code Table 5.1 limit on relative inter-storey drift of buildings?","e_en":"Table 5.1: top-storey drift Height/500; inter-storey drift storey height/400. Curtain walls and partitions must be designed with movement joints for these displacements.","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","中級"]},{"id":"STL-026","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"組合樓板（composite slab）在 imposed load 下的豎向撓度限值是：","o":["Span/250","Span/350（≤20 mm）","Span/180（≤20 mm）","Span/360"],"a":1,"e":"Table 5.1(b)：imposed load span/350 且 ≤20 mm；總荷載 + 拆撐 − 自重 span/250。施工期壓型鋼板 span/180（≤20 mm，未計 ponding）。","x":"Due to imposed load Span/350 (but ≤20 mm)","q_en":"The vertical deflection limit of a composite slab under imposed load is:","o_en":["Span/250","Span/350 (≤20 mm)","Span/180 (≤20 mm)","Span/360"],"e_en":"Table 5.1(b): imposed load span/350 and ≤20 mm; total load + prop removal − self-weight span/250. Profiled steel sheeting during construction span/180 (≤20 mm, excluding ponding).","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","中級"]},{"id":"STL-027","t":"num","d":2,"tp":"風致振動 Wind vibration","c":"5.3.4","p":69,"q":"Steel Code：寫字樓/酒店在 10 年回歸期最惡劣 10 分鐘風況下的峰值加速度限值是多少 milli-g？","a":25,"tol":0,"u":"milli-g","e":"5.3.4(b)：住宅 15 milli-g、寫字樓/酒店 25 milli-g（≈0.15 及 0.25 m/s²，與 Concrete Code 7.3.2 一致）。","x":"Office building, Hotel 25","q_en":"Steel Code: peak acceleration limit (milli-g) for offices/hotels under the worst 10-minute wind with a 10-year return period?","e_en":"5.3.4(b): residential 15 milli-g, office/hotel 25 milli-g (≈0.15 and 0.25 m/s², consistent with Concrete Code 7.3.2).","doc":"steel-2011-2023ed","pp":"50","tags":["steel-2011-2023ed","風致振動 Wind vibration","num","中級"]},{"id":"STL-028","t":"mcq","d":2,"tp":"框架分類 Frame classification","c":"6.3.2.2","p":74,"q":"以 deflection method 計算 λcr 時，notional horizontal force FN 一般取：","o":["0.5% FV","1.0% FV","1.5% Gk","2.5% FV"],"a":0,"e":"6.3.2.2：λcr = FN·h/(FV·δN)，FN 一般取 0.5% FV（factored dead + live）。λcr 決定 non-sway / sway / sway ultra-sensitive。","x":"FN is the notional horizontal force taken typically as 0.5% of FV for building","q_en":"When calculating λcr by the deflection method, the notional horizontal force FN is generally taken as:","e_en":"6.3.2.2: λcr = FN·h/(FV·δN), with FN generally 0.5% FV (factored dead + live). λcr determines non-sway / sway / sway ultra-sensitive.","doc":"steel-2011-2023ed","pp":"55","tags":["steel-2011-2023ed","框架分類 Frame classification","mcq","中級"]},{"id":"STL-029","t":"short","d":3,"tp":"框架分類 Frame classification","c":"6.3.3–6.3.5","p":75,"q":"按 λcr 如何把框架分類為 non-sway、sway 及 sway ultra-sensitive？各有何分析要求？","m":"非 advanced analysis 時：λcr ≥ 10 為 non-sway（可忽略 P-Δ）；10 > λcr ≥ 5 為 sway（需考慮 P-Δ，例如 moment amplification 或二階分析）；λcr < 5 為 sway ultra-sensitive，只可用 second-order P-Δ-δ 或 advanced analysis。Advanced analysis 時 non-sway 門檻為 15。","k":["λcr ≥ 10 non-sway","5 ≤ λcr < 10 sway","λcr < 5 ultra-sensitive → 只可用 P-Δ-δ / advanced","advanced analysis 門檻 15"],"e":"高樓鋼框架或組合結構，ETABS buckling analysis 求 λcr 是常規步驟。Sway ultra-sensitive 不可用 effective length 法。","x":"A frame is classified as sway ultra-sensitive when","q_en":"How are frames classified by λcr as non-sway, sway and sway ultra-sensitive? What are the analysis requirements for each?","m_en":"Without advanced analysis: λcr ≥ 10 is non-sway (P-Δ may be ignored); 10 > λcr ≥ 5 is sway (P-Δ must be considered, e.g. moment amplification or second-order analysis); λcr < 5 is sway ultra-sensitive and only second-order P-Δ-δ or advanced analysis may be used. With advanced analysis, the non-sway threshold is 15.","k_en":["λcr ≥ 10 non-sway","5 ≤ λcr < 10 sway","λcr < 5 ultra-sensitive → only P-Δ-δ / advanced","Advanced analysis threshold 15"],"e_en":"For tall steel frames or composite structures, obtaining λcr from an ETABS buckling analysis is routine. Sway ultra-sensitive frames cannot use the effective length method.","doc":"steel-2011-2023ed","pp":"56","tags":["steel-2011-2023ed","框架分類 Frame classification","short","進階"]},{"id":"STL-030","t":"num","d":2,"tp":"不完整性 Imperfections","c":"6.4.2","p":76,"q":"Frame analysis 中的等效初始側移（equivalent geometric imperfection）一般取層高 h 除以多少？","a":200,"tol":0,"u":"","e":"6.4.2：Δ = h/200，可代替 notional horizontal force；棚架等臨時工程取 h/100。","x":"For temporary works such as scaffolding, initial deformation should be taken as","q_en":"In frame analysis, the equivalent initial sway (equivalent geometric imperfection) is generally taken as the storey height h divided by what?","e_en":"6.4.2: Δ = h/200, which may replace the notional horizontal force; temporary works such as scaffolding use h/100.","doc":"steel-2011-2023ed","pp":"57","tags":["steel-2011-2023ed","不完整性 Imperfections","num","中級"]},{"id":"STL-031","t":"mcq","d":1,"tp":"截面分類 Section classification","c":"7.2","p":85,"q":"能達到 plastic moment capacity 但局部屈曲可能妨礙塑性鉸有足夠轉動能力的截面屬：","o":["Class 1 plastic","Class 2 compact","Class 3 semi-compact","Class 4 slender"],"a":1,"e":"7.2：Class 1 有塑性鉸轉動能力；Class 2 有 Mp 但轉動不足；Class 3 只達邊緣屈服；Class 4 須考慮局部屈曲。塑性分析只可用 Class 1。","x":"Cross-sections with plastic moment capacity. The plastic moment capacity can be","q_en":"A section that can develop its plastic moment capacity but in which local buckling may prevent adequate rotation capacity at a plastic hinge is:","e_en":"7.2: Class 1 has plastic hinge rotation capacity; Class 2 reaches Mp but has insufficient rotation; Class 3 reaches only extreme fibre yield; Class 4 must account for local buckling. Plastic analysis may only use Class 1.","doc":"steel-2011-2023ed","pp":"66","tags":["steel-2011-2023ed","截面分類 Section classification","mcq","基礎"]},{"id":"STL-032","t":"num","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"Table 7.1：軋製（rolled）I 截面翼緣外伸部分受彎壓，Class 2 compact 的 b/T 限值為多少 ε？","a":10,"tol":0,"u":"ε","e":"Rolled flange outstand：Class 1 9ε、Class 2 10ε、Class 3 15ε；welded 8ε/9ε/13ε。ε = √(275/py)。S355 的 ε ≈ 0.88。","x":"element due to section","q_en":"Table 7.1: for the outstand flange of a rolled I-section in compression due to bending, what is the Class 2 compact b/T limit in terms of ε?","e_en":"Rolled flange outstand: Class 1 9ε, Class 2 10ε, Class 3 15ε; welded 8ε/9ε/13ε. ε = √(275/py). For S355, ε ≈ 0.88.","doc":"steel-2011-2023ed","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","num","中級"]},{"id":"STL-033","t":"mcq","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"I 截面腹板，中性軸在中間深度（純彎），Class 1 plastic 的 d/t 限值為：","o":["40ε","80ε","100ε","120ε"],"a":1,"e":"Table 7.1：web neutral axis at mid-depth 80ε / 100ε / 120ε。有軸壓時限值按 r1 降低。","x":"Web of an I-, Neutral axis at mid-depth d/t 80ε 100ε 120ε","q_en":"For the web of an I-section with the neutral axis at mid-depth (pure bending), the Class 1 plastic d/t limit is:","e_en":"Table 7.1: web with neutral axis at mid-depth 80ε / 100ε / 120ε. With axial compression, the limits reduce according to r1.","doc":"steel-2011-2023ed","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","mcq","中級"]},{"id":"STL-034","t":"num","d":2,"tp":"受約束樑 Restrained beams","c":"8.2","p":95,"q":"要假設樑受壓翼緣有 full lateral restraint，約束力應為受壓翼緣最大力的多少 %？","a":2.5,"tol":0,"u":"%","e":"8.2：2.5% 受壓翼緣力（或 squash load）。樓板與鋼樑之間要有 shear studs 或可靠連接；施工期間未有樓板時未必受約束。","x":"flange of the member, or more simply 2.5% of the squash load of the compression flange.","q_en":"For the compression flange of a beam to be assumed fully laterally restrained, the restraint force should be what % of the maximum force in the compression flange?","e_en":"8.2: 2.5% of the compression flange force (or squash load). Shear studs or a reliable connection are needed between slab and steel beam; during construction, before the slab exists, the flange may not be restrained.","doc":"steel-2011-2023ed","pp":"76","tags":["steel-2011-2023ed","受約束樑 Restrained beams","num","中級"]},{"id":"STL-035","t":"mcq","d":1,"tp":"受約束樑 Restrained beams","c":"8.2.1","p":95,"q":"軋製 I、H 截面的 shear area Av 是：","o":["td","tD","0.9A","2td"],"a":1,"e":"8.2.1：軋製 I/H/槽鋼 Av = tD；焊接 I = td；RHS 2td；CHS 0.6A。Vc = py·Av/√3。常見錯誤是把 rolled 截面用 td 而低估剪力容量，或焊接截面誤用 tD。","x":"Rolled I, H and channels sections tD","q_en":"The shear area Av of rolled I and H sections is:","e_en":"8.2.1: rolled I/H/channels Av = tD; welded I = td; RHS 2td; CHS 0.6A. Vc = py·Av/√3. Common errors are using td for rolled sections (underestimating shear capacity) or tD for welded sections.","doc":"steel-2011-2023ed","pp":"76","tags":["steel-2011-2023ed","受約束樑 Restrained beams","mcq","基礎"]},{"id":"STL-036","t":"mcq","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"Low shear（V ≤ 0.6Vc）情況下 Class 1/2 截面的 moment capacity Mc 是：","o":["py·Z","py·S ≤ 1.2py·Z","py·Seff","1.5py·Z"],"a":1,"e":"8.2.2.1：Mc = py·S ≤ 1.2py·Z（1.2 限制防止 SLS 下屈服）；Class 3 = py·Z；Class 4 = py·Zeff。V > 0.6Vc 時用 high shear 公式扣減 Sv。","x":"The following equations should be used when the design shear force V is not larger than","q_en":"Under low shear (V ≤ 0.6Vc), the moment capacity Mc of a Class 1/2 section is:","e_en":"8.2.2.1: Mc = py·S ≤ 1.2py·Z (the 1.2 limit prevents yielding at SLS); Class 3 = py·Z; Class 4 = py·Zeff. For V > 0.6Vc, use the high shear formula deducting Sv.","doc":"steel-2011-2023ed","pp":"77","tags":["steel-2011-2023ed","受約束樑 Restrained beams","mcq","中級"]},{"id":"STL-037","t":"tf","d":3,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"使用高強度鋼（Class 1H）時可以採用 Class 4 slender 截面。","a":false,"e":"錯。8.2.2.1：高強度鋼不允許使用 Class 4 截面；超高強度鋼不允許用 plastic modulus。","x":"When high strength steel is used, the use of a Class 4 slender section is not permitted.","q_en":"Class 4 slender sections may be used with high strength steel (Class 1H).","e_en":"False. 8.2.2.1: Class 4 sections are not permitted for high strength steel; the plastic modulus is not permitted for ultra-high strength steel.","doc":"steel-2011-2023ed","pp":"77","tags":["steel-2011-2023ed","受約束樑 Restrained beams","tf","進階"]},{"id":"STL-038","t":"num","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.2","p":97,"q":"熱軋截面腹板 d/t 大於多少時，moment capacity 要考慮 shear buckling？","a":70,"tol":0,"u":"","e":"8.2.2.2：熱軋截面 d/t > 70、焊接截面 > 62 時，要按 8.4.6 考慮 shear buckling。大部分熱軋 UB 不超過，但深而薄腹的焊接板樑（plate girder）要特別檢核。","x":"welded sections, the moment capacity should allow for shear buckling as given in","q_en":"For hot-rolled sections, above what web d/t must shear buckling be considered in the moment capacity?","e_en":"8.2.2.2: for hot-rolled sections with d/t > 70 and welded sections > 62, consider shear buckling per 8.4.6. Most hot-rolled UBs do not exceed this, but deep thin-web welded plate girders need special checks.","doc":"steel-2011-2023ed","pp":"78","tags":["steel-2011-2023ed","受約束樑 Restrained beams","num","中級"]},{"id":"STL-039","t":"mcq","d":3,"tp":"樑開孔 Web openings","c":"8.2.3.1.1","p":97,"q":"樑腹板無加強圓孔毋須用淨截面設計的條件之一，是孔沿樑軸的間距不少於孔徑的：","o":["1.5 倍","2.0 倍","2.5 倍","3.0 倍"],"a":2,"e":"8.2.3.1.1：Class 1/2 截面、對稱、孔在中間 1/3 深度及中間 1/2 跨度、間距 ≥2.5D、距集中荷載 ≥ 樑深、點荷載剪力 ≤10% Vc 及最大剪力 ≤50% Vc。機電穿孔常見。","x":"The spacing of openings along the member longitudinal axis is not less than 2.5","q_en":"One of the conditions under which unreinforced circular holes in a beam web need not be designed on the net section is that the spacing of holes along the beam axis is not less than what multiple of the hole diameter?","o_en":["1.5 times","2.0 times","2.5 times","3.0 times"],"e_en":"8.2.3.1.1: Class 1/2 section, symmetrical, holes within the middle 1/3 of the depth and middle 1/2 of the span, spacing ≥2.5D, distance from concentrated loads ≥ beam depth, shear from point load ≤10% Vc and maximum shear ≤50% Vc. Common for M&E penetrations.","doc":"steel-2011-2023ed","pp":"78","tags":["steel-2011-2023ed","樑開孔 Web openings","mcq","進階"]},{"id":"STL-040","t":"mcq","d":3,"tp":"側扭屈曲 LTB","c":"Table 8.1","p":101,"q":"懸臂樑支座為 continuous with lateral restraint to top flange、懸臂端 free、normal loading，LE 是：","o":["1.0L","2.0L","3.0L","7.5L"],"a":2,"e":"Table 8.1 情況 (a)(1)：3.0L，destabilizing load 7.5L。支座及端部加約束可大幅降低 LE。懸臂鋼簷篷常犯錯是用 1.0L。","x":"lateral restraint to top 2) Lateral restraint to 2.7L 7.5L","q_en":"For a cantilever beam with the support continuous with lateral restraint to the top flange, the tip free, and normal loading, LE is:","e_en":"Table 8.1 case (a)(1): 3.0L; 7.5L for destabilizing load. Restraints at the support and tip greatly reduce LE. A common mistake for cantilevered steel canopies is using 1.0L.","doc":"steel-2011-2023ed","pp":"82","tags":["steel-2011-2023ed","側扭屈曲 LTB","mcq","進階"]},{"id":"STL-041","t":"tf","d":2,"tp":"側扭屈曲 LTB","c":"8.3.5.1","p":102,"q":"繞弱軸（minor axis）受彎的構件不需檢核 lateral-torsional buckling。","a":true,"e":"對。8.3.5.1：minor axis bending、CHS/SHS/圓或方實心截面、RHS 在 Table 8.2 限值內、λLT 小於 Table 8.3 限值，都不需檢核 LTB。","x":"Lateral-torsional buckling need not be checked in the following cases:","q_en":"Members bending about the minor axis need not be checked for lateral-torsional buckling.","e_en":"True. 8.3.5.1: minor axis bending, CHS/SHS/solid round or square sections, RHS within the Table 8.2 limits, and λLT below the Table 8.3 limit need no LTB check.","doc":"steel-2011-2023ed","pp":"83","tags":["steel-2011-2023ed","側扭屈曲 LTB","tf","中級"]},{"id":"STL-042","t":"num","d":2,"tp":"受壓構件 Compression","c":"Table 8.6","p":145,"q":"Table 8.6：兩端轉動固定、平移固定（fixed-fixed）的柱，建議 K 值（ideal conditions approximated）是多少？","a":0.7,"tol":0,"u":"","e":"Table 8.6 建議 K：0.70（固定-固定）、0.85（固定-鉸）、1.00（鉸-鉸）、1.20 / 2.10（可側移）。理論值 0.5 不建議直接使用，因實際難完全固定。","x":"0.70 0.85 1.20 1.00 2.10 1.5","q_en":"Table 8.6: recommended K value (ideal conditions approximated) for a column fixed in rotation and translation at both ends (fixed-fixed)?","e_en":"Table 8.6 recommended K: 0.70 (fixed-fixed), 0.85 (fixed-pinned), 1.00 (pinned-pinned), 1.20 / 2.10 (sway permitted). The theoretical 0.5 is not recommended because full fixity is hard to achieve in practice.","doc":"steel-2011-2023ed","pp":"126","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-043","t":"num","d":2,"tp":"受壓構件 Compression","c":"8.7.3","p":145,"q":"Positional restraint 須能抵抗被約束構件軸力的多少 %？","a":1,"tol":0,"u":"%","e":"8.7.3：≥1% 軸力；同時約束多根構件時乘 kr = 0.2 + 1/Nr。屋頂系桿、柱間支撐設計常用。","x":"prevent significant lateral displacement and adequate strength to resist a minimum of 1%","q_en":"A positional restraint must be able to resist what % of the axial force in the restrained member?","e_en":"8.7.3: ≥1% of the axial force; when restraining several members, multiply by kr = 0.2 + 1/Nr. Commonly used for roof ties and column bracing design.","doc":"steel-2011-2023ed","pp":"126","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-044","t":"num","d":2,"tp":"受壓構件 Compression","c":"8.7.6","p":146,"q":"焊接 I、H 或箱形截面計算 pc 時，py 要先減多少 N/mm²？","a":20,"tol":0,"u":"N/mm²","e":"8.7.6：焊接截面殘餘應力較大，py 減 20 N/mm² 再查 strut curve。","x":"For welded I, H or box sections, py should be reduced by 20 N/mm2 and pc should then","q_en":"When calculating pc for welded I, H or box sections, py is first reduced by how many N/mm²?","e_en":"8.7.6: welded sections have larger residual stresses, so reduce py by 20 N/mm² before reading the strut curve.","doc":"steel-2011-2023ed","pp":"127","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-045","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"Table 8.7","p":147,"q":"軋製 H 截面（厚度 ≤ 40 mm）繞 y-y 軸屈曲應用哪條 strut curve？","o":["a","b","c","d"],"a":2,"e":"Table 8.7：rolled H ≤40 mm x-x b)、y-y c)；>40 mm x-x c)、y-y d)。熱軋空心截面 a)（≥S460 為 a0）；冷成型空心截面 c)。","x":"Rolled H-section","q_en":"Which strut curve applies to a rolled H-section (thickness ≤ 40 mm) buckling about the y-y axis?","e_en":"Table 8.7: rolled H ≤40 mm x-x b), y-y c); >40 mm x-x c), y-y d). Hot-finished hollow sections a) (a0 for ≥S460); cold-formed hollow sections c).","doc":"steel-2011-2023ed","pp":"128","tags":["steel-2011-2023ed","受壓構件 Compression","mcq","中級"]},{"id":"STL-046","t":"num","d":1,"tp":"焊接 Welds","c":"Table 9.1","p":196,"q":"較厚部件厚度為 14–19 mm 時，角焊縫最小焊腳（leg length）是多少 mm？","a":6,"tol":0,"u":"mm","e":"Table 9.1：≤6 mm 3；7–13 mm 5；14–19 mm 6；>19 mm 8。避免厚板熱量快速散失造成冷裂。","x":"7 to 13 5 14 to 19 6 over 19 8","q_en":"When the thicker part is 14–19 mm thick, what is the minimum leg length (mm) of a fillet weld?","e_en":"Table 9.1: ≤6 mm 3; 7–13 mm 5; 14–19 mm 6; >19 mm 8. Prevents cold cracking from rapid heat loss into thick plates.","doc":"steel-2011-2023ed","pp":"177","tags":["steel-2011-2023ed","焊接 Welds","num","基礎"]},{"id":"STL-047","t":"num","d":2,"tp":"焊接 Welds","c":"9.2.5.1.3","p":196,"q":"角焊縫有效長度不應少於多少 mm（亦不少於 4s），否則不可用作承重？","a":40,"tol":0,"u":"mm","e":"9.2.5.1.3：有效長度 = 全長 − 2s（不計端部回焊），不少於 40 mm；<4s 或 40 mm 不承重。端部回焊 ≥2s（9.2.5.1.4）。","x":"excluded, but should not be less than 40 mm. A fillet weld with an effective length less than","q_en":"The effective length of a fillet weld should not be less than how many mm (and not less than 4s), otherwise it may not be used to carry load?","e_en":"9.2.5.1.3: effective length = total length − 2s (excluding end returns), not less than 40 mm; welds <4s or 40 mm carry no load. End returns ≥2s (9.2.5.1.4).","doc":"steel-2011-2023ed","pp":"177","tags":["steel-2011-2023ed","焊接 Welds","num","中級"]},{"id":"STL-048","t":"tf","d":2,"tp":"焊接 Welds","c":"9.2.5.1.5","p":198,"q":"單面角焊縫或部分熔透對接焊可以用來傳遞繞焊縫縱軸的彎矩。","a":false,"e":"錯。9.2.5.1.5：single sided fillet 或 partial penetration butt weld 不應用於傳遞繞焊縫縱軸彎矩。兩種不同等級母材以較低等級設計。","x":"Single sided fillet or partial penetration butt welds should not be used to transmit a bending","q_en":"A single-sided fillet weld or partial penetration butt weld may be used to transmit a bending moment about the longitudinal axis of the weld.","e_en":"False. 9.2.5.1.5: a single sided fillet or partial penetration butt weld should not be used to transmit bending about the longitudinal axis of the weld. When joining parent metals of two different grades, design for the lower grade.","doc":"steel-2011-2023ed","pp":"179","tags":["steel-2011-2023ed","焊接 Welds","tf","中級"]},{"id":"STL-049","t":"num","d":1,"tp":"螺栓 Bolts","c":"9.3.1.1","p":202,"q":"沿受力方向的螺栓中心距不應少於螺栓直徑 d 的多少倍？","a":2.5,"tol":0,"u":"d","e":"9.3.1.1：沿受力方向 ≥2.5d；垂直方向一般 3d（承壓 ≤2/3 Pbb 時可減至 2.5d）；最大間距 min(12t, 150 mm)。","x":"less than 2.5d, where d is the nominal diameter of the bolts. This spacing can be","q_en":"The centre-to-centre spacing of bolts in the direction of load should not be less than how many times the bolt diameter d?","e_en":"9.3.1.1: in the direction of load ≥2.5d; perpendicular generally 3d (may be reduced to 2.5d when bearing ≤2/3 Pbb); maximum spacing min(12t, 150 mm).","doc":"steel-2011-2023ed","pp":"183","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-050","t":"num","d":2,"tp":"螺栓 Bolts","c":"Table 9.3","p":202,"q":"M20 螺栓在剪切或手工火焰切割邊（sheared and hand flame cut edge）的最小端距/邊距是多少 mm？","a":34,"tol":0,"u":"mm","e":"Table 9.3：M20 剪切邊 34 mm、軋製/機械氣割邊 26 mm；M27 以上 1.75d / 1.25d。最大 11tε；高腐蝕環境 ≤40 + 4t。","x":"M20 34 26 M22 38 28","q_en":"Minimum end/edge distance (mm) for an M20 bolt at a sheared and hand flame cut edge?","e_en":"Table 9.3: M20 sheared edge 34 mm, rolled/machine flame cut edge 26 mm; M27 and above 1.75d / 1.25d. Maximum 11tε; in corrosive environments ≤40 + 4t.","doc":"steel-2011-2023ed","pp":"183","tags":["steel-2011-2023ed","螺栓 Bolts","num","中級"]},{"id":"STL-051","t":"num","d":1,"tp":"螺栓 Bolts","c":"Table 9.4","p":203,"q":"M20 螺栓的標準孔（standard hole）直徑是多少 mm？","a":22,"tol":0,"u":"mm","e":"Table 9.4：M12–M24 標準孔 d+2（M20 = 22 mm）；M27 以上 d+3。Oversize 孔要相應增加間距及邊距。","x":"Standard hole Oversize hole Short slot hole Long slot hole","q_en":"Diameter (mm) of a standard hole for an M20 bolt?","e_en":"Table 9.4: M12–M24 standard hole d+2 (M20 = 22 mm); M27 and above d+3. Oversize holes need correspondingly larger spacing and edge distances.","doc":"steel-2011-2023ed","pp":"184","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-052","t":"num","d":1,"tp":"螺栓 Bolts","c":"Table 9.5","p":206,"q":"ISO 8.8 級螺栓的 design shear strength ps 是多少 N/mm²？","a":375,"tol":0,"u":"N/mm²","e":"Table 9.5：4.6 160、8.8 375、10.9 400；bearing（Table 9.6）8.8 為 1000 N/mm²。螺紋在剪切面等情況要按 9.3.6.1.4–6 折減。","x":"ISO 4.6 160 6.8 240 8.8 375","q_en":"Design shear strength ps (N/mm²) of ISO grade 8.8 bolts?","e_en":"Table 9.5: 4.6 160, 8.8 375, 10.9 400; bearing (Table 9.6) 1000 N/mm² for 8.8. Reduce per 9.3.6.1.4–6 where threads are in the shear plane, etc.","doc":"steel-2011-2023ed","pp":"187","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-053","t":"num","d":2,"tp":"螺栓 Bolts","c":"Table 9.6","p":206,"q":"ISO 8.8 級螺栓的 design bearing strength pbb 是多少 N/mm²？","a":1000,"tol":0,"u":"N/mm²","e":"Pbb = d·tp·pbb；8.8 級 1000 N/mm²；亦須檢核連接板承壓（9.3.6.1.3）。","x":"ISO 4.6 460 6.8 900 8.8 1000","q_en":"Design bearing strength pbb (N/mm²) of ISO grade 8.8 bolts?","e_en":"Pbb = d·tp·pbb; 1000 N/mm² for grade 8.8; also check bearing on the connected ply (9.3.6.1.3).","doc":"steel-2011-2023ed","pp":"187","tags":["steel-2011-2023ed","螺栓 Bolts","num","中級"]},{"id":"STL-054","t":"mcq","d":2,"tp":"組合結構 Composite","c":"10.1.2","p":216,"q":"Steel Code 組合結構的混凝土等級範圍一般為：","o":["C20–C45","C25–C60","C30–C80","C40–C100"],"a":1,"e":"10.1.2：C25–C60，骨料 ≤20 mm；>C60 須性能化設計。濕/乾密度 2450/2350 kg/m³。","x":"2450 kg/m3 and 2350 kg/m3 respectively, and the grade specified shall be in the range of","q_en":"The concrete grade range for composite construction in the Steel Code is generally:","e_en":"10.1.2: C25–C60, aggregate ≤20 mm; >C60 requires performance-based design. Wet/dry density 2450/2350 kg/m³.","doc":"steel-2011-2023ed","pp":"197","tags":["steel-2011-2023ed","組合結構 Composite","mcq","中級"]},{"id":"STL-055","t":"mcq","d":2,"tp":"組合結構 Composite","c":"10.1.4.1","p":217,"q":"栓釘（headed stud）頭部最小直徑及最小深度分別是：","o":["1.25d 及 0.3d","1.5d 及 0.4d","2.0d 及 0.5d","1.5d 及 0.5d"],"a":1,"e":"10.1.4.1：頭徑 ≥1.5d、頭深 ≥0.4d；材料 fu ≥450 N/mm²、伸長率 15%。頭部用以抵抗 uplift。","x":"The minimum diameter and the minimum depth of the head of a headed stud shall be","q_en":"The minimum head diameter and minimum head depth of a headed stud are respectively:","o_en":["1.25d and 0.3d","1.5d and 0.4d","2.0d and 0.5d","1.5d and 0.5d"],"e_en":"10.1.4.1: head diameter ≥1.5d, head depth ≥0.4d; material fu ≥450 N/mm², elongation 15%. The head resists uplift.","doc":"steel-2011-2023ed","pp":"198","tags":["steel-2011-2023ed","組合結構 Composite","mcq","中級"]},{"id":"STL-056","t":"mcq","d":2,"tp":"防火 Fire","c":"12.1.2","p":317,"q":"Steel Code 的 standard fire 時間-溫度曲線是：","o":["T = 345 log10(8t + 1) + 20","T = 1100(1 − e^(−t))","T = 20 + 750√t","T = 345 ln(t) + 20"],"a":0,"e":"12.1.2 Eq 12.1：ISO 834 standard fire。所需 FRP 按 Fire Safety Code 規定。Fire limit state 屬 accidental limit state。","x":"T = 345 log10 (8t + 1) + 20 (12.1)","q_en":"The standard fire time-temperature curve in the Steel Code is:","e_en":"12.1.2 Eq 12.1: ISO 834 standard fire. The required FRP is specified by the Fire Safety Code. The fire limit state is an accidental limit state.","doc":"steel-2011-2023ed","pp":"298","tags":["steel-2011-2023ed","防火 Fire","mcq","中級"]},{"id":"STL-057","t":"tf","d":2,"tp":"防火 Fire","c":"12.1.3","p":318,"q":"連接板、加勁板等一般應採用與所附主鋼構件相同厚度的防火保護。","a":true,"e":"對。12.1.3：connection plates、stiffeners 一般與主構件用相同防火塗層厚度；火災時需要的支撐構件亦須保持功能。","x":"Connection plates, stiffeners and similar elements should be ordinarily treated with the","q_en":"Connection plates, stiffeners, etc. should generally have the same thickness of fire protection as the main steel member to which they are attached.","e_en":"True. 12.1.3: connection plates and stiffeners generally use the same fire protection thickness as the main member; bracing members required during a fire must also remain functional.","doc":"steel-2011-2023ed","pp":"299","tags":["steel-2011-2023ed","防火 Fire","tf","中級"]},{"id":"SEM-001","t":"short","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.1","p":33,"q":"EM E4.1 把 partial load factor 拆成 γ1、γ2、γ3，各代表甚麼？Code 如何使用？","m":"γ1：荷載偏離 characteristic 值的變異；γ2：多種荷載同時達到 characteristic 值的機率較低；γ3：計算不準確及結構行為的變異。Code 將三者相乘成單一 γf。","k":["γ1 load variation","γ2 reduced probability of combination","γ3 calculation inaccuracy","Code uses single γf"],"e":"理解 γf 的組成有助判斷何時可調整（例如 temporary works 不應隨意降低）。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"allows for variation of loads from their characteristic (i.e. assumed","q_en":"EM E4.1 splits the partial load factor into
