teel","tier":"常考"},{"id":"STL-018","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.6","p":56,"q":"Steel Code 分析用的鋼材彈性模量 E 是多少 N/mm²？","a":3,"u":"N/mm²","e":"3.1.6：E = 205,000 N/mm²，Poisson's ratio 0.3，熱膨脹 14×10⁻⁶/°C。注意 Concrete Code 鋼筋 Es = 200 kN/mm²，但 Steel Code composite 設計中鋼筋亦取 205 kN/mm²（10.1.3）。","x":"Modulus of elasticity E = 205,000 N/mm2","o":["210 000 N/mm²","195 000 N/mm²","200 000 N/mm²","205 000 N/mm²"],"q_en":"What elastic modulus E of steel (N/mm²) is used for analysis in the Steel Code?","e_en":"3.1.6: E = 205,000 N/mm², Poisson's ratio 0.3, thermal expansion 14×10⁻⁶/°C. Note that reinforcement Es in the Concrete Code is 200 kN/mm², but in Steel Code composite design reinforcement also takes 205 kN/mm² (10.1.3).","doc":"steel-2011-2023ed","pp":"37","ex":"steel","tier":"常考"},{"id":"STL-019","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 1 鋼材（Ys ≤ 460）的 γm1 及 γm2 分別是：","o":["1.0 及 1.1","1.1 及 1.2","1.0 及 1.05","1.05 及 1.25"],"a":0,"e":"Table 4.1：Class 1 1.0/1.1；Class 2 1.1/1.2；Class 1H 1.0/1.05；Class 3 py 限 170 N/mm²、抗拉 300 N/mm²。py = Ys/γm1 但不大於 Us/γm2。","x":"γm1 γm2 γm1 γm2 1 1.0 1.1 - - 2 1.1 1.2 - -","q_en":"γm1 and γm2 for Class 1 steel (Ys ≤ 460) are respectively:","o_en":["1.0 and 1.1","1.1 and 1.2","1.0 and 1.05","1.05 and 1.25"],"e_en":"Table 4.1: Class 1 1.0/1.1; Class 2 1.1/1.2; Class 1H 1.0/1.05; Class 3 py limited to 170 N/mm², tensile strength 300 N/mm². py = Ys/γm1 but not greater than Us/γm2.","doc":"steel-2011-2023ed","pp":"45","ex":"steel","tier":"常考"},{"id":"STL-020","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 3（uncertified）鋼材的 py 上限是多少 N/mm²？","a":1,"u":"N/mm²","e":"Table 4.1 註：Class 3 py ≤170 N/mm²，只可用於失效後果有限的次要構件（4.2.1）。","x":"For Class 3 steel py is limited to 170 N/mm2 and ultimate tensile strength to 300 N/mm2","o":["155 N/mm²","170 N/mm²","195 N/mm²","275 N/mm²"],"q_en":"Upper limit of py (N/mm²) for Class 3 (uncertified) steel?","e_en":"Table 4.1 note: Class 3 py ≤170 N/mm², only for secondary members whose failure has limited consequences (4.2.1).","doc":"steel-2011-2023ed","pp":"45","ex":"steel","tier":"常考"},{"id":"STL-022","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"4.3.4","p":65,"q":"臨時工程（temporary works）中任何 adverse load factor（包括風）最少為多少？","a":2,"u":"","e":"4.3.4：in no circumstances less than 1.2。樓宇評估（4.3.3）亦要求 adverse γf 不少於 1.2。","x":"circumstances should any adverse load factor be less than 1.2. This includes load factors","o":["1.4","1.1","1.2","1.0"],"q_en":"In temporary works, what is the minimum value of any adverse load factor (including wind)?","e_en":"4.3.4: in no circumstances less than 1.2. Appraisal of existing buildings (4.3.3) also requires adverse γf not less than 1.2.","doc":"steel-2011-2023ed","pp":"46","ex":"steel","tier":"常考"},{"id":"STL-023","t":"mcq","d":3,"tp":"荷載組合 Load combinations","c":"Table 4.3","p":65,"q":"Extreme event（如車撞、爆炸）load combination 1 中，imposed load 的 adverse γf（非儲存用途）是：","o":["0.33","0.35","1.0","1.05"],"a":1,"e":"Table 4.3：Dead 1.05、Imposed 0.35、Wind 0.35、Extreme event Ak 1.0；儲存/工業或永久 imposed 取 1.0。Concrete Code 則以 1/3 imposed × 1.05 表達，概念相近。","x":"1. dead, 1.05 1.0 0.35 0 1.05 - 1.0","q_en":"In extreme event (e.g. vehicle impact, explosion) load combination 1, the adverse γf on imposed load (non-storage use) is:","e_en":"Table 4.3: dead 1.05, imposed 0.35, wind 0.35, extreme event Ak 1.0; storage/industrial or permanent imposed 1.0. The Concrete Code expresses it as 1/3 imposed × 1.05 — a similar concept.","doc":"steel-2011-2023ed","pp":"46","ex":"steel","tier":"常考"},{"id":"STL-024","t":"mcq","d":1,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code：承托灰泥或其他脆性飾面的樑，imposed load 撓度限值為：","o":["Span/200","Span/250","Span/360","Span/500"],"a":2,"e":"Table 5.1：brittle finish span/360；其他樑 span/200；懸臂 length/180；吊車樑豎向 span/600。","x":"Beams carrying plaster or other brittle finish Span/360","q_en":"Steel Code: the imposed load deflection limit for beams carrying plaster or other brittle finishes is:","e_en":"Table 5.1: brittle finish span/360; other beams span/200; cantilevers length/180; crane girders vertical span/600.","doc":"steel-2011-2023ed","pp":"48","ex":"steel","tier":"常考"},{"id":"STL-025","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code Table 5.1 對樓宇層間相對側移（relative inter-storey drift）的限值是：","o":["Storey height/300","Storey height/400","Storey height/500","Storey height/1000"],"a":1,"e":"Table 5.1：頂層 drift Height/500；層間 drift storey height/400。幕牆及間隔要按此位移設計活動接駁。","x":"Relative inter-storey drift Storey height/400","q_en":"What is the Steel Code Table 5.1 limit on relative inter-storey drift of buildings?","e_en":"Table 5.1: top-storey drift Height/500; inter-storey drift storey height/400. Curtain walls and partitions must be designed with movement joints for these displacements.","doc":"steel-2011-2023ed","pp":"48","ex":"steel","tier":"常考"},{"id":"STL-026","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"組合樓板（composite slab）在 imposed load 下的豎向撓度限值是：","o":["Span/250","Span/350（≤20 mm）","Span/180（≤20 mm）","Span/360"],"a":1,"e":"Table 5.1(b)：imposed load span/350 且 ≤20 mm；總荷載 + 拆撐 − 自重 span/250。施工期壓型鋼板 span/180（≤20 mm，未計 ponding）。","x":"Due to imposed load Span/350 (but ≤20 mm)","q_en":"The vertical deflection limit of a composite slab under imposed load is:","o_en":["Span/250","Span/350 (≤20 mm)","Span/180 (≤20 mm)","Span/360"],"e_en":"Table 5.1(b): imposed load span/350 and ≤20 mm; total load + prop removal − self-weight span/250. Profiled steel sheeting during construction span/180 (≤20 mm, excluding ponding).","doc":"steel-2011-2023ed","pp":"48","ex":"steel","tier":"常考"},{"id":"STL-027","t":"mcq","d":2,"tp":"風致振動 Wind vibration","c":"5.3.4","p":69,"q":"Steel Code：寫字樓/酒店在 10 年回歸期最惡劣 10 分鐘風況下的峰值加速度限值是多少 milli-g？","a":2,"u":"milli-g","e":"5.3.4(b)：住宅 15 milli-g、寫字樓/酒店 25 milli-g（≈0.15 及 0.25 m/s²，與 Concrete Code 7.3.2 一致）。","x":"Office building, Hotel 25","o":["15 milli-g","40 milli-g","25 milli-g","10 milli-g"],"q_en":"Steel Code: peak acceleration limit (milli-g) for offices/hotels under the worst 10-minute wind with a 10-year return period?","e_en":"5.3.4(b): residential 15 milli-g, office/hotel 25 milli-g (≈0.15 and 0.25 m/s², consistent with Concrete Code 7.3.2).","doc":"steel-2011-2023ed","pp":"50","ex":"wind","tier":"常考"},{"id":"STL-028","t":"mcq","d":2,"tp":"框架分類 Frame classification","c":"6.3.2.2","p":74,"q":"以 deflection method 計算 λcr 時，notional horizontal force FN 一般取：","o":["0.5% FV","1.0% FV","1.5% Gk","2.5% FV"],"a":0,"e":"6.3.2.2：λcr = FN·h/(FV·δN)，FN 一般取 0.5% FV（factored dead + live）。λcr 決定 non-sway / sway / sway ultra-sensitive。","x":"FN is the notional horizontal force taken typically as 0.5% of FV for building","q_en":"When calculating λcr by the deflection method, the notional horizontal force FN is generally taken as:","e_en":"6.3.2.2: λcr = FN·h/(FV·δN), with FN generally 0.5% FV (factored dead + live). λcr determines non-sway / sway / sway ultra-sensitive.","doc":"steel-2011-2023ed","pp":"55","ex":"steel","tier":"偶考"},{"id":"STL-030","t":"mcq","d":2,"tp":"不完整性 Imperfections","c":"6.4.2","p":76,"q":"Frame analysis 中的等效初始側移（equivalent geometric imperfection）一般取層高 h 除以多少？","a":2,"u":"","e":"6.4.2：Δ = h/200，可代替 notional horizontal force；棚架等臨時工程取 h/100。","x":"For temporary works such as scaffolding, initial deformation should be taken as","o":["250","500","200","100"],"q_en":"In frame analysis, the equivalent initial sway (equivalent geometric imperfection) is generally taken as the storey height h divided by what?","e_en":"6.4.2: Δ = h/200, which may replace the notional horizontal force; temporary works such as scaffolding use h/100.","doc":"steel-2011-2023ed","pp":"57","ex":"steel","tier":"偶考"},{"id":"STL-031","t":"mcq","d":1,"tp":"截面分類 Section classification","c":"7.2","p":85,"q":"能達到 plastic moment capacity 但局部屈曲可能妨礙塑性鉸有足夠轉動能力的截面屬：","o":["Class 1 plastic","Class 2 compact","Class 3 semi-compact","Class 4 slender"],"a":1,"e":"7.2：Class 1 有塑性鉸轉動能力；Class 2 有 Mp 但轉動不足；Class 3 只達邊緣屈服；Class 4 須考慮局部屈曲。塑性分析只可用 Class 1。","x":"Cross-sections with plastic moment capacity. The plastic moment capacity can be","q_en":"A section that can develop its plastic moment capacity but in which local buckling may prevent adequate rotation capacity at a plastic hinge is:","e_en":"7.2: Class 1 has plastic hinge rotation capacity; Class 2 reaches Mp but has insufficient rotation; Class 3 reaches only extreme fibre yield; Class 4 must account for local buckling. Plastic analysis may only use Class 1.","doc":"steel-2011-2023ed","pp":"66","ex":"steel","tier":"常考"},{"id":"STL-032","t":"num","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"Table 7.1：軋製（rolled）I 截面翼緣外伸部分受彎壓，Class 2 compact 的 b/T 限值為多少 ε？","a":10,"tol":0,"u":"ε","e":"Rolled flange outstand：Class 1 9ε、Class 2 10ε、Class 3 15ε；welded 8ε/9ε/13ε。ε = √(275/py)。S355 的 ε ≈ 0.88。","x":"element due to section","q_en":"Table 7.1: for the outstand flange of a rolled I-section in compression due to bending, what is the Class 2 compact b/T limit in terms of ε?","e_en":"Rolled flange outstand: Class 1 9ε, Class 2 10ε, Class 3 15ε; welded 8ε/9ε/13ε. ε = √(275/py). For S355, ε ≈ 0.88.","doc":"steel-2011-2023ed","pp":"68","ex":"steel","tier":"常考"},{"id":"STL-033","t":"mcq","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"I 截面腹板，中性軸在中間深度（純彎），Class 1 plastic 的 d/t 限值為：","o":["40ε","80ε","100ε","120ε"],"a":1,"e":"Table 7.1：web neutral axis at mid-depth 80ε / 100ε / 120ε。有軸壓時限值按 r1 降低。","x":"Web of an I-, Neutral axis at mid-depth d/t 80ε 100ε 120ε","q_en":"For the web of an I-section with the neutral axis at mid-depth (pure bending), the Class 1 plastic d/t limit is:","e_en":"Table 7.1: web with neutral axis at mid-depth 80ε / 100ε / 120ε. With axial compression, the limits reduce according to r1.","doc":"steel-2011-2023ed","pp":"68","ex":"steel","tier":"常考"},{"id":"STL-034","t":"mcq","d":2,"tp":"受約束樑 Restrained beams","c":"8.2","p":95,"q":"要假設樑受壓翼緣有 full lateral restraint，約束力應為受壓翼緣最大力的多少 %？","a":0,"u":"%","e":"8.2：2.5% 受壓翼緣力（或 squash load）。樓板與鋼樑之間要有 shear studs 或可靠連接；施工期間未有樓板時未必受約束。","x":"flange of the member, or more simply 2.5% of the squash load of the compression flange.","o":["2.5%","5%","2%","1%"],"q_en":"For the compression flange of a beam to be assumed fully laterally restrained, the restraint force should be what % of the maximum force in the compression flange?","e_en":"8.2: 2.5% of the compression flange force (or squash load). Shear studs or a reliable connection are needed between slab and steel beam; during construction, before the slab exists, the flange may not be restrained.","doc":"steel-2011-2023ed","pp":"76","ex":"steel","tier":"常考"},{"id":"STL-035","t":"mcq","d":1,"tp":"受約束樑 Restrained beams","c":"8.2.1","p":95,"q":"軋製 I、H 截面的 shear area Av 是：","o":["td","tD","0.9A","2td"],"a":1,"e":"8.2.1：軋製 I/H/槽鋼 Av = tD；焊接 I = td；RHS 2td；CHS 0.6A。Vc = py·Av/√3。常見錯誤是把 rolled 截面用 td 而低估剪力容量，或焊接截面誤用 tD。","x":"Rolled I, H and channels sections tD","q_en":"The shear area Av of rolled I and H sections is:","e_en":"8.2.1: rolled I/H/channels Av = tD; welded I = td; RHS 2td; CHS 0.6A. Vc = py·Av/√3. Common errors are using td for rolled sections (underestimating shear capacity) or tD for welded sections.","doc":"steel-2011-2023ed","pp":"76","ex":"steel","tier":"常考"},{"id":"STL-036","t":"mcq","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"Low shear（V ≤ 0.6Vc）情況下 Class 1/2 截面的 moment capacity Mc 是：","o":["py·Z","py·S ≤ 1.2py·Z","py·Seff","1.5py·Z"],"a":1,"e":"8.2.2.1：Mc = py·S ≤ 1.2py·Z（1.2 限制防止 SLS 下屈服）；Class 3 = py·Z；Class 4 = py·Zeff。V > 0.6Vc 時用 high shear 公式扣減 Sv。","x":"The following equations should be used when the design shear force V is not larger than","q_en":"Under low shear (V ≤ 0.6Vc), the moment capacity Mc of a Class 1/2 section is:","e_en":"8.2.2.1: Mc = py·S ≤ 1.2py·Z (the 1.2 limit prevents yielding at SLS); Class 3 = py·Z; Class 4 = py·Zeff. For V > 0.6Vc, use the high shear formula deducting Sv.","doc":"steel-2011-2023ed","pp":"77","ex":"steel","tier":"常考"},{"id":"STL-037","t":"tf","d":3,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"使用高強度鋼（Class 1H）時可以採用 Class 4 slender 截面。","a":false,"e":"錯。8.2.2.1：高強度鋼不允許使用 Class 4 截面；超高強度鋼不允許用 plastic modulus。","x":"When high strength steel is used, the use of a Class 4 slender section is not permitted.","q_en":"Class 4 slender sections may be used with high strength steel (Class 1H).","e_en":"False. 8.2.2.1: Class 4 sections are not permitted for high strength steel; the plastic modulus is not permitted for ultra-high strength steel.","doc":"steel-2011-2023ed","pp":"77","ex":"steel","tier":"常考"},{"id":"STL-038","t":"num","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.2","p":97,"q":"熱軋截面腹板 d/t 大於多少時，moment capacity 要考慮 shear buckling？","a":70,"tol":0,"u":"","e":"8.2.2.2：熱軋截面 d/t > 70、焊接截面 > 62 時，要按 8.4.6 考慮 shear buckling。大部分熱軋 UB 不超過，但深而薄腹的焊接板樑（plate girder）要特別檢核。","x":"welded sections, the moment capacity should allow for shear buckling as given in","q_en":"For hot-rolled sections, above what web d/t must shear buckling be considered in the moment capacity?","e_en":"8.2.2.2: for hot-rolled sections with d/t > 70 and welded sections > 62, consider shear buckling per 8.4.6. Most hot-rolled UBs do not exceed this, but deep thin-web welded plate girders need special checks.","doc":"steel-2011-2023ed","pp":"78","ex":"steel","tier":"常考"},{"id":"STL-039","t":"mcq","d":3,"tp":"樑開孔 Web openings","c":"8.2.3.1.1","p":97,"q":"樑腹板無加強圓孔毋須用淨截面設計的條件之一，是孔沿樑軸的間距不少於孔徑的：","o":["1.5 倍","2.0 倍","2.5 倍","3.0 倍"],"a":2,"e":"8.2.3.1.1：Class 1/2 截面、對稱、孔在中間 1/3 深度及中間 1/2 跨度、間距 ≥2.5D、距集中荷載 ≥ 樑深、點荷載剪力 ≤10% Vc 及最大剪力 ≤50% Vc。機電穿孔常見。","x":"The spacing of openings along the member longitudinal axis is not less than 2.5","q_en":"One of the conditions under which unreinforced circular holes in a beam web need not be designed on the net section is that the spacing of holes along the beam axis is not less than what multiple of the hole diameter?","o_en":["1.5 times","2.0 times","2.5 times","3.0 times"],"e_en":"8.2.3.1.1: Class 1/2 section, symmetrical, holes within the middle 1/3 of the depth and middle 1/2 of the span, spacing ≥2.5D, distance from concentrated loads ≥ beam depth, shear from point load ≤10% Vc and maximum shear ≤50% Vc. Common for M&E penetrations.","doc":"steel-2011-2023ed","pp":"78","ex":"steel","tier":"偶考"},{"id":"STL-040","t":"mcq","d":3,"tp":"側扭屈曲 LTB","c":"Table 8.1","p":101,"q":"懸臂樑支座為 continuous with lateral restraint to top flange、懸臂端 free、normal loading，LE 是：","o":["1.0L","2.0L","3.0L","7.5L"],"a":2,"e":"Table 8.1 情況 (a)(1)：3.0L，destabilizing load 7.5L。支座及端部加約束可大幅降低 LE。懸臂鋼簷篷常犯錯是用 1.0L。","x":"lateral restraint to top 2) Lateral restraint to 2.7L 7.5L","q_en":"For a cantilever beam with the support continuous with lateral restraint to the top flange, the tip free, and normal loading, LE is:","e_en":"Table 8.1 case (a)(1): 3.0L; 7.5L for destabilizing load. Restraints at the support and tip greatly reduce LE. A common mistake for cantilevered steel canopies is using 1.0L.","doc":"steel-2011-2023ed","pp":"82","ex":"steel","tier":"常考"},{"id":"STL-041","t":"tf","d":2,"tp":"側扭屈曲 LTB","c":"8.3.5.1","p":102,"q":"繞弱軸（minor axis）受彎的構件不需檢核 lateral-torsional buckling。","a":true,"e":"對。8.3.5.1：minor axis bending、CHS/SHS/圓或方實心截面、RHS 在 Table 8.2 限值內、λLT 小於 Table 8.3 限值，都不需檢核 LTB。","x":"Lateral-torsional buckling need not be checked in the following cases:","q_en":"Members bending about the minor axis need not be checked for lateral-torsional buckling.","e_en":"True. 8.3.5.1: minor axis bending, CHS/SHS/solid round or square sections, RHS within the Table 8.2 limits, and λLT below the Table 8.3 limit need no LTB check.","doc":"steel-2011-2023ed","pp":"83","ex":"steel","tier":"常考"},{"id":"STL-042","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"Table 8.6","p":145,"q":"Table 8.6：兩端轉動固定、平移固定（fixed-fixed）的柱，建議 K 值（ideal conditions approximated）是多少？","a":1,"u":"","e":"Table 8.6 建議 K：0.70（固定-固定）、0.85（固定-鉸）、1.00（鉸-鉸）、1.20 / 2.10（可側移）。理論值 0.5 不建議直接使用，因實際難完全固定。","x":"0.70 0.85 1.20 1.00 2.10 1.5","o":["1.0","0.7","0.85","0.5"],"q_en":"Table 8.6: recommended K value (ideal conditions approximated) for a column fixed in rotation and translation at both ends (fixed-fixed)?","e_en":"Table 8.6 recommended K: 0.70 (fixed-fixed), 0.85 (fixed-pinned), 1.00 (pinned-pinned), 1.20 / 2.10 (sway permitted). The theoretical 0.5 is not recommended because full fixity is hard to achieve in practice.","doc":"steel-2011-2023ed","pp":"126","ex":"steel","tier":"常考"},{"id":"STL-043","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"8.7.3","p":145,"q":"Positional restraint 須能抵抗被約束構件軸力的多少 %？","a":3,"u":"%","e":"8.7.3：≥1% 軸力；同時約束多根構件時乘 kr = 0.2 + 1/Nr。屋頂系桿、柱間支撐設計常用。","x":"prevent significant lateral displacement and adequate strength to resist a minimum of 1%","o":["0.5%","2.5%","2%","1%"],"q_en":"A positional restraint must be able to resist what % of the axial force in the restrained member?","e_en":"8.7.3: ≥1% of the axial force; when restraining several members, multiply by kr = 0.2 + 1/Nr. Commonly used for roof ties and column bracing design.","doc":"steel-2011-2023ed","pp":"126","ex":"steel","tier":"常考"},{"id":"STL-044","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"8.7.6","p":146,"q":"焊接 I、H 或箱形截面計算 pc 時，py 要先減多少 N/mm²？","a":1,"u":"N/mm²","e":"8.7.6：焊接截面殘餘應力較大，py 減 20 N/mm² 再查 strut curve。","x":"For welded I, H or box sections, py should be reduced by 20 N/mm2 and pc should then","o":["10 N/mm²","20 N/mm²","30 N/mm²","15 N/mm²"],"q_en":"When calculating pc for welded I, H or box sections, py is first reduced by how many N/mm²?","e_en":"8.7.6: welded sections have larger residual stresses, so reduce py by 20 N/mm² before reading the strut curve.","doc":"steel-2011-2023ed","pp":"127","ex":"steel","tier":"常考"},{"id":"STL-045","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"Table 8.7","p":147,"q":"軋製 H 截面（厚度 ≤ 40 mm）繞 y-y 軸屈曲應用哪條 strut curve？","o":["a","b","c","d"],"a":2,"e":"Table 8.7：rolled H ≤40 mm x-x b)、y-y c)；>40 mm x-x c)、y-y d)。熱軋空心截面 a)（≥S460 為 a0）；冷成型空心截面 c)。","x":"Rolled H-section","q_en":"Which strut curve applies to a rolled H-section (thickness ≤ 40 mm) buckling about the y-y axis?","e_en":"Table 8.7: rolled H ≤40 mm x-x b), y-y c); >40 mm x-x c), y-y d). Hot-finished hollow sections a) (a0 for ≥S460); cold-formed hollow sections c).","doc":"steel-2011-2023ed","pp":"128","ex":"steel","tier":"常考"},{"id":"STL-046","t":"mcq","d":1,"tp":"焊接 Welds","c":"Table 9.1","p":196,"q":"較厚部件厚度為 14–19 mm 時，角焊縫最小焊腳（leg length）是多少 mm？","a":3,"u":"mm","e":"Table 9.1：≤6 mm 3；7–13 mm 5；14–19 mm 6；>19 mm 8。避免厚板熱量快速散失造成冷裂。","x":"7 to 13 5 14 to 19 6 over 19 8","o":["8 mm","5 mm","4 mm","6 mm"],"q_en":"When the thicker part is 14–19 mm thick, what is the minimum leg length (mm) of a fillet weld?","e_en":"Table 9.1: ≤6 mm 3; 7–13 mm 5; 14–19 mm 6; >19 mm 8. Prevents cold cracking from rapid heat loss into thick plates.","doc":"steel-2011-2023ed","pp":"177","ex":"steel","tier":"常考"},{"id":"STL-047","t":"mcq","d":2,"tp":"焊接 Welds","c":"9.2.5.1.3","p":196,"q":"角焊縫有效長度不應少於多少 mm（亦不少於 4s），否則不可用作承重？","a":0,"u":"mm","e":"9.2.5.1.3：有效長度 = 全長 − 2s（不計端部回焊），不少於 40 mm；<4s 或 40 mm 不承重。端部回焊 ≥2s（9.2.5.1.4）。","x":"excluded, but should not be less than 40 mm. A fillet weld with an effective length less than","o":["40 mm","30 mm","50 mm","25 mm"],"q_en":"The effective length of a fillet weld should not be less than how many mm (and not less than 4s), otherwise it may not be used to carry load?","e_en":"9.2.5.1.3: effective length = total length − 2s (excluding end returns), not less than 40 mm; welds <4s or 40 mm carry no load. End returns ≥2s (9.2.5.1.4).","doc":"steel-2011-2023ed","pp":"177","ex":"steel","tier":"常考"},{"id":"STL-048","t":"tf","d":2,"tp":"焊接 Welds","c":"9.2.5.1.5","p":198,"q":"單面角焊縫或部分熔透對接焊可以用來傳遞繞焊縫縱軸的彎矩。","a":false,"e":"錯。9.2.5.1.5：single sided fillet 或 partial penetration butt weld 不應用於傳遞繞焊縫縱軸彎矩。兩種不同等級母材以較低等級設計。","x":"Single sided fillet or partial penetration butt welds should not be used to transmit a bending","q_en":"A single-sided fillet weld or partial penetration butt weld may be used to transmit a bending moment about the longitudinal axis of the weld.","e_en":"False. 9.2.5.1.5: a single sided fillet or partial penetration butt weld should not be used to transmit bending about the longitudinal axis of the weld. When joining parent metals of two different grades, design for the lower grade.","doc":"steel-2011-2023ed","pp":"179","ex":"steel","tier":"常考"},{"id":"STL-049","t":"mcq","d":1,"tp":"螺栓 Bolts","c":"9.3.1.1","p":202,"q":"沿受力方向的螺栓中心距不應少於螺栓直徑 d 的多少倍？","a":2,"u":"d","e":"9.3.1.1：沿受力方向 ≥2.5d；垂直方向一般 3d（承壓 ≤2/3 Pbb 時可減至 2.5d）；最大間距 min(12t, 150 mm)。","x":"less than 2.5d, where d is the nominal diameter of the bolts. This spacing can be","o":["4 d","2 d","2.5 d","3 d"],"q_en":"The centre-to-centre spacing of bolts in the direction of load should not be less than how many times the bolt diameter d?","e_en":"9.3.1.1: in the direction of load ≥2.5d; perpendicular generally 3d (may be reduced to 2.5d when bearing ≤2/3 Pbb); maximum spacing min(12t, 150 mm).","doc":"steel-2011-2023ed","pp":"183","ex":"steel","tier":"常考"},{"id":"STL-050","t":"num","d":2,"tp":"螺栓 Bolts","c":"Table 9.3","p":202,"q":"M20 螺栓在剪切或手工火焰切割邊（sheared and hand flame cut edge）的最小端距/邊距是多少 mm？","a":34,"tol":0,"u":"mm","e":"Table 9.3：M20 剪切邊 34 mm、軋製/機械氣割邊 26 mm；M27 以上 1.75d / 1.25d。最大 11tε；高腐蝕環境 ≤40 + 4t。","x":"M20 34 26 M22 38 28","q_en":"Minimum end/edge distance (mm) for an M20 bolt at a sheared and hand flame cut edge?","e_en":"Table 9.3: M20 sheared edge 34 mm, rolled/machine flame cut edge 26 mm; M27 and above 1.75d / 1.25d. Maximum 11tε; in corrosive environments ≤40 + 4t.","doc":"steel-2011-2023ed","pp":"183","ex":"steel","tier":"常考"},{"id":"STL-051","t":"mcq","d":1,"tp":"螺栓 Bolts","c":"Table 9.4","p":203,"q":"M20 螺栓的標準孔（standard hole）直徑是多少 mm？","a":0,"u":"mm","e":"Table 9.4：M12–M24 標準孔 d+2（M20 = 22 mm）；M27 以上 d+3。Oversize 孔要相應增加間距及邊距。","x":"Standard hole Oversize hole Short slot hole Long slot hole","o":["22 mm","24 mm","21 mm","23 mm"],"q_en":"Diameter (mm) of a standard hole for an M20 bolt?","e_en":"Table 9.4: M12–M24 standard hole d+2 (M20 = 22 mm); M27 and above d+3. Oversize holes need correspondingly larger spacing and edge distances.","doc":"steel-2011-2023ed","pp":"184","ex":"steel","tier":"常考"},{"id":"STL-052","t":"mcq","d":1,"tp":"螺栓 Bolts","c":"Table 9.5","p":206,"q":"ISO 8.8 級螺栓的 design shear strength ps 是多少 N/mm²？","a":1,"u":"N/mm²","e":"Table 9.5：4.6 160、8.8 375、10.9 400；bearing（Table 9.6）8.8 為 1000 N/mm²。螺紋在剪切面等情況要按 9.3.6.1.4–6 折減。","x":"ISO 4.6 160 6.8 240 8.8 375","o":["450 N/mm²","375 N/mm²","400 N/mm²","300 N/mm²"],"q_en":"Design shear strength ps (N/mm²) of ISO grade 8.8 bolts?","e_en":"Table 9.5: 4.6 160, 8.8 375, 10.9 400; bearing (Table 9.6) 1000 N/mm² for 8.8. Reduce per 9.3.6.1.4–6 where threads are in the shear plane, etc.","doc":"steel-2011-2023ed","pp":"187","ex":"steel","tier":"常考"},{"id":"STL-053","t":"mcq","d":2,"tp":"螺栓 Bolts","c":"Table 9.6","p":206,"q":"ISO 8.8 級螺栓的 design bearing strength pbb 是多少 N/mm²？","a":3,"u":"N/mm²","e":"Pbb = d·tp·pbb；8.8 級 1000 N/mm²；亦須檢核連接板承壓（9.3.6.1.3）。","x":"ISO 4.6 460 6.8 900 8.8 1000","o":["900 N/mm²","800 N/mm²","1200 N/mm²","1000 N/mm²"],"q_en":"Design bearing strength pbb (N/mm²) of ISO grade 8.8 bolts?","e_en":"Pbb = d·tp·pbb; 1000 N/mm² for grade 8.8; also check bearing on the connected ply (9.3.6.1.3).","doc":"steel-2011-2023ed","pp":"187","ex":"steel","tier":"常考"},{"id":"STL-054","t":"mcq","d":2,"tp":"組合結構 Composite","c":"10.1.2","p":216,"q":"Steel Code 組合結構的混凝土等級範圍一般為：","o":["C20–C45","C25–C60","C30–C80","C40–C100"],"a":1,"e":"10.1.2：C25–C60，骨料 ≤20 mm；>C60 須性能化設計。濕/乾密度 2450/2350 kg/m³。","x":"2450 kg/m3 and 2350 kg/m3 respectively, and the grade specified shall be in the range of","q_en":"The concrete grade range for composite construction in the Steel Code is generally:","e_en":"10.1.2: C25–C60, aggregate ≤20 mm; >C60 requires performance-based design. Wet/dry density 2450/2350 kg/m³.","doc":"steel-2011-2023ed","pp":"197","ex":"steel","tier":"常考"},{"id":"STL-055","t":"mcq","d":2,"tp":"組合結構 Composite","c":"10.1.4.1","p":217,"q":"栓釘（headed stud）頭部最小直徑及最小深度分別是：","o":["1.25d 及 0.3d","1.5d 及 0.4d","2.0d 及 0.5d","1.5d 及 0.5d"],"a":1,"e":"10.1.4.1：頭徑 ≥1.5d、頭深 ≥0.4d；材料 fu ≥450 N/mm²、伸長率 15%。頭部用以抵抗 uplift。","x":"The minimum diameter and the minimum depth of the head of a headed stud shall be","q_en":"The minimum head diameter and minimum head depth of a headed stud are respectively:","o_en":["1.25d and 0.3d","1.5d and 0.4d","2.0d and 0.5d","1.5d and 0.5d"],"e_en":"10.1.4.1: head diameter ≥1.5d, head depth ≥0.4d; material fu ≥450 N/mm², elongation 15%. The head resists uplift.","doc":"steel-2011-2023ed","pp":"198","ex":"steel","tier":"常考"},{"id":"STL-056","t":"mcq","d":2,"tp":"防火 Fire","c":"12.1.2","p":317,"q":"Steel Code 的 standard fire 時間-溫度曲線是：","o":["T = 345 log10(8t + 1) + 20","T = 1100(1 − e^(−t))","T = 20 + 750√t","T = 345 ln(t) + 20"],"a":0,"e":"12.1.2 Eq 12.1：ISO 834 standard fire。所需 FRP 按 Fire Safety Code 規定。Fire limit state 屬 accidental limit state。","x":"T = 345 log10 (8t + 1) + 20 (12.1)","q_en":"The standard fire time-temperature curve in the Steel Code is:","e_en":"12.1.2 Eq 12.1: ISO 834 standard fire. The required FRP is specified by the Fire Safety Code. The fire limit state is an accidental limit state.","doc":"steel-2011-2023ed","pp":"298","ex":"steel","tier":"常考"},{"id":"STL-057","t":"tf","d":2,"tp":"防火 Fire","c":"12.1.3","p":318,"q":"連接板、加勁板等一般應採用與所附主鋼構件相同厚度的防火保護。","a":true,"e":"對。12.1.3：connection plates、stiffeners 一般與主構件用相同防火塗層厚度；火災時需要的支撐構件亦須保持功能。","x":"Connection plates, stiffeners and similar elements should be ordinarily treated with the","q_en":"Connection plates, stiffeners, etc. should generally have the same thickness of fire protection as the main steel member to which they are attached.","e_en":"True. 12.1.3: connection plates and stiffeners generally use the same fire protection thickness as the main member; bracing members required during a fire must also remain functional.","doc":"steel-2011-2023ed","pp":"299","ex":"steel","tier":"常考"},{"id":"SEM-002","t":"mcq","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.1","p":33,"q":"EM E4.1：ultimate design strength py 以 yield stress 取值，但上限為 ultimate tensile strength 除以多少？","a":2,"u":"","e":"py = Ys/γm1（γm1=1.0）但 ≤ Us/1.2（γm2=1.2）。高屈強比鋼材會由 Us/1.2 控制。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"stress. This is limited to a maximum value of the ultimate tensile strength divided by 1.2.","o":["1.5","1.0","1.2","1.1"],"q_en":"EM E4.1: the ultimate design strength py is taken as the yield stress, but limited to the ultimate tensile strength divided by what?","e_en":"py = Ys/γm1 (γm1=1.0) but ≤ Us/1.2 (γm2=1.2). Steels with a high yield-to-tensile ratio are governed by Us/1.2. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"27","ex":"steel","tier":"常考"},{"id":"SEM-003","t":"mcq","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM E4.2.1：來源已知並經測試合格的 Class 2 steel，材料系數 γm1 / γm2 為？","o":["1.1 / 1.3","1.0 / 1.2","1.2 / 1.4","1.0 / 1.3"],"a":0,"e":"Class 1/1H：1.0/1.2；Class 2（經測試）：1.1/1.3；Class 3（來源不明）py 限 170 N/mm² 且只用於次要構件。使用內地或其他來源鋼材時必須先確認 class。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Class 2 steel from a known source may be tested and if found to comply may also be","q_en":"EM E4.2.1: for Class 2 steel of known source that has been tested and passed, the material factors γm1 / γm2 are:","e_en":"Class 1/1H: 1.0/1.2; Class 2 (tested): 1.1/1.3; Class 3 (unknown source): py limited to 170 N/mm² and only for secondary members. When using steel from the Mainland or other sources, confirm its class first. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","ex":"steel","tier":"常考"},{"id":"SEM-004","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM：Class 3 steel（來源不明）用於次要構件時 design strength py 上限？","a":170,"tol":0,"u":"N/mm²","e":"Class 3 不建議使用；僅在失效後果有限的 minor elements 並限 py = 170 N/mm²。舊鋼再用、遺失 mill certificate 屬此類。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"of failure are limited. Then, their design strength py is limited to 170 N/mm2.","q_en":"EM: upper limit of design strength py for Class 3 steel (unknown source) used in secondary members?","e_en":"Class 3 is not recommended; only for minor elements whose failure has limited consequences, with py limited to 170 N/mm². Reused old steel and steel with lost mill certificates fall into this class. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","ex":"steel","tier":"常考"},{"id":"SEM-005","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.4","p":34,"q":"EM 指出 base plate grout 的 Young's modulus 在缺乏資料時可取同等 cube strength 混凝土的約 1/3。","a":true,"e":"正確。Grout 全為水泥漿，E 值明顯較低；材料系數則與同 fcu 混凝土相同。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"In the absence of more accurate information, a value of around 1/3 that of","q_en":"The EM states that, in the absence of data, the Young's modulus of base plate grout may be taken as about 1/3 of that of concrete of the same cube strength.","e_en":"True. Grout is entirely cement paste, so its E is markedly lower; the material factors are the same as for concrete of the same fcu. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"28","ex":"steel","tier":"常考"},{"id":"SEM-006","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"檢核空泳池抗浮時，池內水壓的有利 load factor 應取 0。","a":true,"e":"正確。有利水壓 γf 取 0.0；池外地下水取最大。這與 Foundations Code 的 uplift/抗浮檢核概念一致。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Clearly, the beneficial load factor for water pressure should be taken as 0.0, for example","q_en":"When checking an empty swimming pool against flotation, the beneficial load factor on water pressure inside the pool should be taken as 0.","e_en":"True. Beneficial water pressure γf is 0.0; groundwater outside the pool is taken at its maximum. This is consistent with the uplift/flotation checks of the Foundations Code. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","ex":"steel","tier":"常考"},{"id":"SEM-007","t":"mcq","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"EM E4.3.1：Code 對 differential settlement 的 load factor 在 load combinations 1、2 及 3 分別取？","o":["1.4、1.4、1.2","1.2、1.2、1.2","1.0、1.0、1.0","1.4、1.2、1.0"],"a":0,"e":"EM 解釋理論上 1.2 較合邏輯，但 Code 採 1.4（comb 1、2）及 1.2（comb 3）。Concrete Code 對 temperature 取 1.0、differential settlement 1.4。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"deformations. However, the Code uses a value of 1.4 for differential settlements in load","q_en":"EM E4.3.1: the Code's load factors for differential settlement in load combinations 1, 2 and 3 are respectively:","o_en":["1.4, 1.4, 1.2","1.2, 1.2, 1.2","1.0, 1.0, 1.0","1.4, 1.2, 1.0"],"e_en":"The EM explains that 1.2 would theoretically be more logical, but the Code adopts 1.4 (comb 1, 2) and 1.2 (comb 3). The Concrete Code takes 1.0 for temperature and 1.4 for differential settlement. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","ex":"steel","tier":"常考"},{"id":"SEM-008","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.4","p":35,"q":"EM E4.3.4：temporary works 的任何 adverse load factor（包括 wind）不應少於多少？","a":1.2,"tol":0,"u":"","e":"臨時工程倒塌常見原因：手工差、偏心支撐、舊鋼、腳手架承托墊不足。不可因設計年期短而隨意降低荷載系數。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"load factor be less than 1.2. This includes load factors for wind loads, in which the actual","q_en":"EM E4.3.4: any adverse load factor (including wind) for temporary works should not be less than what?","e_en":"Common causes of temporary works collapse: poor workmanship, eccentric bracing, old steel, inadequate scaffold base plates. Load factors must not be casually reduced because of a short design life. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"29","ex":"steel","tier":"常考"},{"id":"SEM-010","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E4.3.7","p":36,"q":"EM 指出 Code 2.4.1 容許 live 與 wind 組合計算撓度時使用的 serviceability load factor？","a":3,"u":"","e":"例如屋面樑撓度；RE 亦可按判斷採用 1.0 以外的 SLS 系數以反映實況。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Code allows a serviceability load factor of 0.8 when considering deflections from live and","o":["0.9","1.0","0.7","0.8"],"q_en":"According to the EM, what serviceability load factor does Code 2.4.1 allow when live and wind loads are combined for deflection calculations?","e_en":"E.g. deflection of roof beams; the RE may also use SLS factors other than 1.0 by judgement to reflect actual conditions. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"30","ex":"steel","tier":"偶考"},{"id":"SEM-011","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":37,"q":"EM 解釋 Code 5.3.4 舒適度準則採用 peak acceleration 的 return period 為？","o":["10 年","1 年","50 年","100 年"],"a":0,"e":"10 年回歸期（與 JGJ3-2002 及加拿大 NBC 1995 一致），10 分鐘時距（ISO 6897）。Peak 比 RMS 更能反映人體感受。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"The 10-year return period has been used as this is consistent with the Chinese","q_en":"The EM explains that the peak acceleration comfort criterion of Code 5.3.4 uses what return period?","o_en":["10 years","1 year","50 years","100 years"],"e_en":"A 10-year return period (consistent with JGJ3-2002 and the Canadian NBC 1995) and a 10-minute duration (ISO 6897). Peak acceleration reflects human perception better than RMS. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"31","ex":"steel","tier":"偶考"},{"id":"SEM-012","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":38,"q":"EM 提供估算建築物最低自然頻率的 rule of thumb？","o":["f0 = 46/H","f0 = 1/(0.1N)","f0 = 100/H","f0 = H/46"],"a":0,"e":"H 為建築物高度（m）。此估算可用於初步判斷是否 wind sensitive；最終應以結構分析為準。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"f0=46/H, where H is the height of the building in metres.","q_en":"What rule of thumb does the EM give for estimating the lowest natural frequency of a building?","e_en":"H is the building height (m). This estimate can be used for a preliminary judgement of whether the building is wind sensitive; final values should come from structural analysis. [Edition note] The Explanatory Materials were written for the 2011 Code; the current Code is the 2023 Edition, so check values and clause numbers against the current Code.","doc":"steel-explanatory-materials-2011","pp":"32","ex":"steel","tier":"偶考"},{"id":"WND-040","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1 Note (c)","p":34,"q":"Table 4-1 附註容許在 0.5(H − Hd) 高度以下將外牆壓力減少 20%。","a":true,"e":"因 Qz 取建築頂部，低層外牆可用此附註折減 20%。幕牆計算書常漏用或錯用（例如用 0.5H 而忽略 Hd）。","x":"(c) Cladding pressures can be reduced by 20%, below a height of","q_en":"The note to Table 4-1 allows the external wall pressure to be reduced by 20% below a height of 0.5(H − Hd).","e_en":"True. Because Qz is taken at the top of the building, lower façades may use this note to reduce by 20%. Curtain wall calculations often omit or misuse it (e.g. using 0.5H and ignoring Hd).","doc":"wind-code-2019","pp":"24","ex":"wind","tier":"偶考"},{"id":"WND-041","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.3","p":44,"q":"地形風洞試驗（topography model）最少需要多少個風向？","a":18,"tol":0,"u":"","e":"地形試驗至少 18 個方向（每 20°）；建築荷載試驗則至少 36 個方向（每 10°）。","x":"A minimum of 18 wind directions at 20o intervals is necessary.","q_en":"What is the minimum number of wind directions for a topography wind tunnel model test?","e_en":"Topography tests need at least 18 directions (every 20°); building load tests need at least 36 directions (every 10°).","doc":"wind-code-2019","pp":"34","ex":"wind","tier":"偶考"},{"id":"WND-042","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.5","p":44,"q":"一般指引：建築風洞模型比例通常不應小於？","o":["1:100","1:200","1:500","1:1000"],"a":2,"e":"模型不小於 1:500，且尖角模型的 Reynolds number 不少於 1×10^4；圓形模型需額外證明。","x":"A general guide is that the building model should normally be not","q_en":"General guidance: the scale of a building wind tunnel model should usually not be smaller than:","e_en":"Model not smaller than 1:500, with Reynolds number not less than 1×10^4 for sharp-edged models; round models need additional justification.","doc":"wind-code-2019","pp":"34","ex":"wind","tier":"偶考"},{"id":"WND-043","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.7","p":45,"q":"Built-up terrain 中，風洞配對風壓的 matching height Z 應取？","o":["建築高度","上風周邊高度以上 150 m 或 2/3 建築高度，取較大","2/3 建築高度","500 m"],"a":1,"e":"開闊地形取 2/3 建築高度；市區取周邊有效高度以上 150 m 與 2/3H 的較大值；中間情況兩者都要考慮。審核風洞報告時必須檢查配對方法。","x":"(full-scale) above the height of upwind surroundings (the effective","q_en":"In built-up terrain, the matching height Z for matching wind tunnel pressures should be taken as:","o_en":["The building height","150 m above the upwind surrounding height or 2/3 of the building height, whichever is greater","2/3 of the building height","500 m"],"e_en":"Open terrain: 2/3 of the building height; urban terrain: the greater of 150 m above the effective surrounding height and 2/3H; intermediate cases must consider both. Check the matching method when reviewing wind tunnel reports.","doc":"wind-code-2019","pp":"35","ex":"wind","tier":"偶考"},{"id":"WND-044","t":"num","d":2,"tp":"風洞試驗 Wind tunnel testing","c":"6.3","p":46,"q":"風洞試驗外牆荷載：典型板件 half-perimeter 2–5 m，以一小時內百分之幾不超越機率取值？","a":80,"tol":0,"u":"%","e":"外牆荷載以 80% non-exceedance 為目標；內壓亦須由量度所得外壓推算。","x":"sizes, for example half-perimeter length of 2m to 5m, with an 80%","q_en":"Wind tunnel cladding loads: for typical panels with half-perimeter 2–5 m, loads are taken at what percentage probability of non-exceedance in one hour?","e_en":"Cladding loads target 80% non-exceedance; internal pressure must also be derived from the measured external pressures.","doc":"wind-code-2019","pp":"36","ex":"wind","tier":"偶考"},{"id":"WND-045","t":"mcq","d":3,"tp":"外牆壓力 Cladding pressure","c":"Table B1-1","p":62,"q":"Table B1-1（有 dominant opening）：外牆邊區 Zone A 的 external pressure coefficient Cpe？","o":["−1.4","−1.2","−1.0","−0.8"],"a":1,"e":"有大開口時分開計外壓 Cpe 與內壓 Cpi；外牆邊區 Cpe −1.2、一般區 −0.8、正壓 +0.8。","x":"Negative pressure A -1.2 in edge zone","q_en":"Table B1-1 (with a dominant opening): external pressure coefficient Cpe for wall edge Zone A?","e_en":"With a large opening, external Cpe and internal Cpi are calculated separately; wall edge zone Cpe −1.2, general zone −0.8, positive +0.8.","doc":"wind-code-2019","pp":"B1","ex":"wind","tier":"偶考"},{"id":"WND-046","t":"num","d":3,"tp":"阻尼 Damping","c":"Table C2-2","p":74,"q":"Table C2-2：高寬比 ≥8 的鋼結構建築，計算加速度的 damping ratio？","a":0.005,"tol":0,"u":"","e":"鋼結構阻尼約為 RC 的一半；composite 結構取中間值。","x":"0.005 0.008 7 0.006 0.009","q_en":"Table C2-2: damping ratio for calculating acceleration of a steel building with aspect ratio ≥8?","e_en":"Steel structures have about half the damping of RC; composite structures take intermediate values.","doc":"wind-code-2019","pp":"C2","ex":"wind","tier":"偶考"},{"id":"WND-047","t":"tf","d":2,"tp":"阻尼 Damping","c":"Appendix C2","p":74,"q":"共用平台上的塔樓，計算阻尼用 aspect ratio 時亦須以平台以上高度檢查。","a":true,"e":"有 setback 或共用平台時，要分別以平台/退縮以上部分檢查 aspect ratio 並取大值，否則會高估 damping。2023 修訂（EN 2.2.3，Item 1）另就多塔共用平台補充 across-wind 用的頻率取法：塔樓獨立延伸至底部，或連同不超過 20 m／三跨／鄰塔中線的平台部分，或整體模型。","x":"slabs shall be similarly checked above podium level.","r":[{"doc":"wind-en-amendments-2023","p":3,"c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)","x":"For multiple towers over a common podium, the fundamental","pp":"3"}],"q_en":"For towers on a common podium, the aspect ratio used for damping must also be checked using the height above the podium.","e_en":"True. With setbacks or a common podium, the aspect ratio must be checked separately for the part above the podium/setback and the maximum taken, otherwise damping will be overestimated. The 2023 amendment (EN 2.2.3, Item 1) also adds guidance on the frequency used for across-wind effects of multiple towers over a common podium: tower alone extended to the base, tower with a podium portion not exceeding 20 m / three bays / the middle line to the nearby tower, or an integrated model.","doc":"wind-code-2019","pp":"C2","ex":"wind","tier":"偶考"},{"id":"WND-048","t":"num","d":2,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1.1","p":62,"q":"計算 Atot 時，洩漏（leakage）取其他外表面總面積的百分之幾？","a":0.1,"tol":0,"u":"%","e":"0.1% leakage 是預設值，有理據可用其他數值。","x":"leakage contribution to 𝐴𝐴𝑡𝑡𝑜𝑜𝑡𝑡 is defined as 0.1% of the","q_en":"When calculating Atot, leakage is taken as what percentage of the total area of the other external surfaces?","e_en":"0.1% leakage is the default; other values may be used with justification.","doc":"wind-code-2019","pp":"B1","ex":"wind","tier":"偶考"},{"id":"WND-001","t":"mcq","d":1,"tp":"適用範圍 Scope","c":"1.1","p":11,"q":"Wind Code 2019 的 Standard Method 適用於一般建築物的高度上限是多少？","o":["100 m","150 m","200 m","250 m"],"a":2,"e":"Standard Method 只涵蓋典型建築至 200 m；超過 200 m 必須做 wind tunnel test。實務上 190 m 左右的住宅塔樓已要預早考慮風洞試驗的時間表和費用，唔好等到 BD 提意見先做。","x":"The Standard Method is applicable to typical buildings with a height","q_en":"What is the height limit of the Wind Code 2019 Standard Method for ordinary buildings?","e_en":"The Standard Method covers only typical buildings up to 200 m; above 200 m wind tunnel testing is mandatory. In practice, residential towers of about 190 m should plan the wind tunnel programme and cost early, rather than waiting for BD comments.","doc":"wind-code-2019","pp":"1","ex":"wind","tier":"常考"},{"id":"WND-003","t":"mcq","d":1,"tp":"荷載組合 Load combination","c":"2.3","p":20,"q":"Wind Code 2019 公式中採用的 ultimate wind load factor γw 取值是多少？","a":3,"u":"","e":"規範在公式中保留 γw = 1.4，與 CoP Concrete/Steel 的 1.4 wind partial factor 一致。計 across-wind base moment 時要用 factored wind speed 再除返 γw，唔好重複乘 1.4。","x":"ultimate wind load factor, taken as 1.4","o":["1.6","1.2","1.5","1.4"],"q_en":"What value of the ultimate wind load factor γw is adopted in the Wind Code 2019 formulae?","e_en":"The Code retains γw = 1.4 in the formulae, consistent with the 1.4 wind partial factor of the CoP Concrete/Steel. When calculating the across-wind base moment, the factored wind speed is used and then divided back by γw — do not apply 1.4 twice.","doc":"wind-code-2019","pp":"10","ex":"wind","tier":"必考"},{"id":"WND-004","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"計算扭轉荷載時，當 B/D ≤ 1，偏心距 e 取多少？","o":["±0.05B","±0.10B","±0.15B","±0.20B"],"a":0,"e":"方形平面 e = ±0.05B，B/D=6 時增至 ±0.20B，中間線性內插。長條形平面（例如板式住宅）扭轉效應明顯大，唔好沿用舊 2004 Code 的做法。","x":"geometric centre of area by a horizontal distance given by:","q_en":"When calculating torsional loads with B/D ≤ 1, what eccentricity e is taken?","e_en":"Square plans e = ±0.05B, increasing to ±0.20B at B/D=6, with linear interpolation between. Elongated plans (e.g. slab-type residential blocks) have much larger torsional effects — do not follow the old 2004 Code approach.","doc":"wind-code-2019","pp":"8","ex":"wind","tier":"常考"},{"id":"WND-005","t":"num","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"B/D = 6 時，扭轉偏心距 e 為 ±?B（填係數）","a":0.2,"tol":0.001,"u":"B","e":"B/D=6 時偏心 0.20B 係上限；B/D 大過 6 已超出 Standard Method 範圍，需要風洞試驗（除非扭轉工況可忽略）。","x":"Use linear interpolation for intermediate values of","q_en":"For B/D = 6, the torsional eccentricity e is ±?B (enter the coefficient)","e_en":"An eccentricity of 0.20B at B/D=6 is the upper limit; B/D above 6 is outside the scope of the Standard Method and requires wind tunnel testing (unless the torsional case can be ignored).","doc":"wind-code-2019","pp":"8","ex":"wind","tier":"常考"},{"id":"WND-006","t":"tf","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"高度少於 100 m、各方向 H/B 少於 5、fundamental frequency 大於 0.5 Hz 的建築，可視為滿足 across-wind 檢查要求。","a":true,"e":"三個條件要同時滿足；頻率唔好用經驗公式亂估。2023 修訂（EN 2.2.3，Item 1）：多塔共用平台時，估算 across-wind 效應用的 fundamental frequency 可按 (a) 塔樓獨立並延伸至建築底部（不連平台）；(b) 塔樓連同部分平台（由塔樓牆/柱邊起不超過 20 m、平台三個跨度及與鄰塔中線三者之最小值，且該部分樓板無大開口）；或 (c) 按公認工程原則取平台部分。亦可用整體電腦模型，取主要沿該塔 across-wind 方向振型的主導頻率（須有工程理據）。修訂只改 Explanatory Notes，Code 這三個條件不變。","x":"Buildings with height less than 100 m, with","r":[{"doc":"wind-en-amendments-2023","p":3,"c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)","x":"For multiple towers over a common podium, the fundamental","pp":"3"}],"q_en":"A building less than 100 m high, with H/B less than 5 in each direction and fundamental frequency greater than 0.5 Hz, may be deemed to satisfy the across-wind check.","e_en":"True. All three conditions must be met; do not estimate the frequency loosely from empirical formulae. 2023 amendment (EN 2.2.3, Item 1): for multiple towers over a common podium, the fundamental frequency for across-wind effects may be assessed by (a) the tower standing alone and extended to the building base (not connected to the podium); (b) the tower integrated with a portion of the podium (measured from the tower's wall/column edge, not exceeding the least of 20 m, three bays of the podium and the middle line to the nearby tower, with no substantial slab openings in that portion); or (c) a podium portion chosen per recognised engineering principles. Alternatively, from an integrated computer model, the dominant frequency of the mode mainly aligned with the tower's across-wind direction may be adopted with engineering justification. Only the Explanatory Notes were amended; the three Code conditions are unchanged.","doc":"wind-code-2019","pp":"9","ex":"wind","tier":"常考"},{"id":"WND-007","t":"mcq","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"免除 across-wind 檢查的條件之一：fundamental frequency 必須大於多少 Hz？","a":1,"u":"Hz","e":"0.5 Hz 即週期 2 秒。高而柔嘅塔樓頻率往往低過 0.5 Hz，就要按 2.2.3 計 across-wind base moment。2023 修訂（EN 2.2.3，Item 1）：多塔共用平台時，用作比較的頻率按新增指引取：塔樓獨立延伸至底部、連同有限範圍平台（20 m／三跨／鄰塔中線取最小），或整體模型中主要沿 across-wind 方向振型的主導頻率。0.5 Hz 門檻本身不變。","x":"than 5, and with fundamental frequencies greater than 0.5 Hz, will","o":["2.0 Hz","0.5 Hz","1.0 Hz","0.2 Hz"],"r":[{"doc":"wind-en-amendments-2023","p":3,"c":"Amendments Dec 2023 – Item 1 (EN 2.2.3)","x":"For multiple towers over a common podium, the fundamental","pp":"3"}],"q_en":"One of the conditions for exemption from the across-wind check: the fundamental frequency must be greater than how many Hz?","e_en":"0.5 Hz is a period of 2 seconds. Tall flexible towers often have frequencies below 0.5 Hz, and must then have the across-wind base moment calculated per 2.2.3. 2023 amendment (EN 2.2.3, Item 1): for multiple towers over a common podium, the frequency used for this comparison follows the new guidance: tower alone extended to the base, tower with a limited podium portion (least of 20 m / three bays / middle line to the nearby tower), or the dominant frequency of the mode mainly aligned with the across-wind direction in an integrated model. The 0.5 Hz threshold itself is unchanged.","doc":"wind-code-2019","pp":"9","ex":"wind","tier":"常考"},{"id":"WND-008","t":"mcq","d":3,"tp":"Across-wind","c":"2.2.3","p":21,"q":"若 across-wind 與 along-wind base moment 之比（放大系數）超過多少，必須進行 wind tunnel testing？","a":0,"u":"","e":"比值不超過 1.5 時可將 along-wind 荷載放大至與 across-wind 相同 base moment；超過 1.5 表示渦流脫落效應顯著，規範要求風洞試驗。Explanatory Notes 有實例（271/190=1.43<1.5）。","x":"1.5, then wind tunnel testing must be conducted.","o":["1.5","3.0","1.2","2.0"],"q_en":"If the ratio of across-wind to along-wind base moment (magnification factor) exceeds what value, wind tunnel testing is mandatory?","e_en":"For ratios not exceeding 1.5, the along-wind loads may be scaled up to give the same base moment as across-wind; above 1.5, vortex shedding effects are significant and the Code requires wind tunnel testing. The Explanatory Notes give an example (271/190=1.43<1.5).","doc":"wind-code-2019","pp":"11","ex":"wind","tier":"常考"},{"id":"WND-009","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"2.2.4 / Table 2-1","p":22,"q":"Table 2-1 Case 1 的 load combination factors（Wx、Wy、ΔTz）是？","o":["±1.00, ±0.55, ±0.55","±1.00, ±0.50, ±0.50","±1.00, ±0.75, ±0.75","±1.00, ±1.00, ±0.55"],"a":0,"e":"三個 case 輪流以其中一個分量取 1.00、其餘取 0.55，連正負號共 24 個組合。ETABS 模型要逐個 load case 設定，常見錯誤係漏咗負號組合或者扭轉未作用喺 centre-of-area。","x":"1 ±1.00 ±0.55 ±0.55 2 ±0.55 ±1.00 ±0.55","q_en":"What are the load combination factors (Wx, Wy, ΔTz) for Table 2-1 Case 1?","e_en":"In the three cases, each component in turn takes 1.00 while the others take 0.55, giving 24 combinations including signs. Each load case must be set up in the ETABS model; common errors are omitting the negative-sign combinations or not applying torsion at the centre-of-area.","doc":"wind-code-2019","pp":"12","ex":"wind","tier":"必考"},{"id":"WND-010","t":"tf","d":2,"tp":"荷載組合 Load combination","c":"2.2.4","p":22,"q":"每層的風荷載合力必須作用於該層的 centre-of-area（可隨高度變化）。","a":true,"e":"風荷載作用點係 centre-of-area，唔係 centre of mass 或 centre of rigidity。電腦模型要自己定義每層加載點，否則扭轉效應會錯。","x":"The resultant of loads at each level must act through the centre-of-area","q_en":"The resultant wind load at each floor must act at the centre-of-area of that floor (which may vary with height).","e_en":"True. Wind load acts at the centre-of-area, not the centre of mass or centre of rigidity. The loading point for each floor must be defined in the computer model, otherwise the torsional effect will be wrong.","doc":"wind-code-2019","pp":"12","ex":"wind","tier":"必考"},{"id":"WND-011","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.4","p":23,"q":"以下哪種建築 NOT 屬於可正式忽略扭轉荷載工況的情況？","o":["單層、高度不超過 10 m 的建築","高度不超過 70 m、周邊設有側向抗力結構的建築","通過 torsional regularity check 的建築","高度 120 m、核心筒居中但周邊無抗側力構件的建築"],"a":3,"e":"規範列出三類可忽略扭轉：單層≤10 m、≤70 m 周邊抗側力、通過 torsional regularity check（扭轉引起層間位移 <25% 側向）。核心筒居中但無周邊牆柱的高樓扭轉剛度弱，一定要計。","x":"buildings of up to 70 m height with a peripheral lateral load","q_en":"Which of the following is NOT a case in which the torsional load case may formally be ignored?","o_en":["A single-storey building not exceeding 10 m high","A building not exceeding 70 m high with perimeter lateral-load-resisting structure","A building passing the torsional regularity check","A 120 m building with a central core but no perimeter lateral-load-resisting members"],"e_en":"The Code lists three cases where torsion may be ignored: single storey ≤10 m, ≤70 m with perimeter lateral resistance, and passing the torsional regularity check (torsion-induced inter-storey drift <25% of lateral). Tall buildings with a central core and no perimeter walls/columns have weak torsional stiffness and torsion must be included.","doc":"wind-code-2019","pp":"13","ex":"wind","tier":"常考"},{"id":"WND-012","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"2.2.4(c)","p":23,"q":"Torsional regularity check：扭轉荷載引起的最大層間位移須少於側向荷載引起者的百分之幾？","a":1,"u":"%","e":"通過 25% 檢查可忽略扭轉工況；若不大於 50%，可省略 Table 2-1 Case 3（主要扭轉）組合，由 24 個減至 16 個。","x":"less than 25% of that due to the lateral load","o":["20%","25%","50%","10%"],"q_en":"Torsional regularity check: the maximum inter-storey drift due to torsional load must be less than what percentage of that due to lateral load?","e_en":"Passing the 25% check allows the torsional case to be ignored; if not greater than 50%, Table 2-1 Case 3 (dominant torsion) combinations may be omitted, reducing 24 combinations to 16.","doc":"wind-code-2019","pp":"13","ex":"wind","tier":"常考"},{"id":"WND-013","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"2.2.4(d)","p":23,"q":"若扭轉層間位移不大於側向位移的百分之幾，Table 2-1 Case 3 無需計算？","a":2,"u":"%","e":"介乎 25% 至 50% 之間屬中度扭轉，只可省略 Case 3，Case 1、2 內嘅 0.55 扭轉分量仍要計。","x":"greater than 50% of the lateral drift, the Case 3 in Table 2-1","o":["25%","75%","50%","20%"],"q_en":"If torsional inter-storey drift is not greater than what percentage of lateral drift, Table 2-1 Case 3 need not be calculated?","e_en":"Between 25% and 50% is moderate torsion: only Case 3 may be omitted; the 0.55 torsional component in Case 1 and Case 2 must still be included.","doc":"wind-code-2019","pp":"13","ex":"wind","tier":"常考"},{"id":"WND-015","t":"tf","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"非住用、使用期不超過一年的臨時建築，可按永久建築設計風荷載的最少 70% 設計。","a":true,"e":"70% 只適用於非住用且使用期≤1年；超過一年或有人居住就要用全額。地盤辦公室若會留兩三年，就唔可以用呢個折減。","x":"period of not more than one year, may be designed for a minimum of","q_en":"Temporary non-domestic buildings with a use period not exceeding one year may be designed for at least 70% of the wind load for permanent buildings.","e_en":"True. The 70% applies only to non-domestic use of ≤1 year; for more than one year or occupied accommodation, use the full value. A site office that will stay for two or three years cannot use this reduction.","doc":"wind-code-2019","pp":"16","ex":"wind","tier":"偶考"},{"id":"WND-016","t":"mcq","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"地盤圍板（hoarding）、有蓋行人通道、工人棚等：Qz 取 Qo,z 的百分之幾？","a":0,"u":"%","e":"Code 2.5：Qz 取 37% Qo,z，且不再乘其他調整系數，適用於地盤 hoarding、covered walkway、contractor shed、bamboo shed、帳篷等（非住宅用途）。2023 修訂（EN 2.5，Item 2）：37% 規定不變；另專為地盤 hoarding 及 covered walkway 新增 EN Table 2-1 全包設計淨壓力：Z ≤ 2.5 m 0.63 kPa、5 m 0.70 kPa、10 m 0.77 kPa（已含 Cp 及 Ss；可線性內插；可計鋼構件自重的有利作用；不利地形仍須考慮 topography factor）。contractor shed、bamboo shed、帳篷仍用 37%。","x":"is taken as 37% of","o":["37%","67%","30%","50%"],"r":[{"doc":"wind-en-amendments-2023","p":5,"c":"Amendments Dec 2023 – Item 2 (EN 2.5, Table 2-1)","x":"construction site, the design net pressure in Table 2-1 may be used.","pp":"5"}],"q_en":"For site hoardings, covered walkways, workers' sheds, etc., Qz is taken as what percentage of Qo,z?","e_en":"Code 2.5: Qz = 37% Qo,z with no other adjustment factor, for construction-site hoardings, covered walkways, contractor sheds, bamboo sheds, tents etc. (non-residential). 2023 amendment (EN 2.5, Item 2): the 37% rule is unchanged; in addition, for construction-site hoardings and covered walkways only, new EN Table 2-1 gives all-inclusive design net pressures: Z ≤ 2.5 m 0.63 kPa, 5 m 0.70 kPa, 10 m 0.77 kPa (Cp and Ss included; linear interpolation permitted; beneficial self-weight of steel members may be considered; topography factor still needed where adverse). Contractor sheds, bamboo sheds and tents still use 37%.","doc":"wind-code-2019","pp":"16","ex":"wind","tier":"偶考"},{"id":"WND-017","t":"num","d":2,"tp":"加速度 Acceleration","c":"2.4.1","p":26,"q":"若無模態分析比較，計算建築頂部四分之一高度內加速度時 ηy 可取多少？","a":1.5,"tol":0,"u":"","e":"ηy 係模態形狀修正；頂部四分一高度保守取 1.5。住宅塔樓舒適度檢查通常睇頂層，唔好漏乘。","x":"be 1.5 for calculation of accelerations within the top quarter","q_en":"Without a modal analysis comparison, what value of ηy may be taken when calculating acceleration within the top quarter of the building height?","e_en":"ηy is a mode shape correction; conservatively 1.5 within the top quarter of the height. Residential tower comfort checks usually look at the top floor — do not omit this factor.","doc":"wind-code-2019","pp":"16","ex":"wind","tier":"常考"},{"id":"WND-018","t":"tf","d":2,"tp":"加速度 Acceleration","c":"2.4.2","p":26,"q":"Occupant comfort 只需檢查 10 年回歸期的 peak acceleration。","a":false,"e":"規範要求 1 年及 10 年回歸期的 peak acceleration 都低於 Figure 2-6 限值。按 EN 解釋，用 code method 時兩者比例固定（3.67），實際只需檢查一個；但風洞試驗兩個都要檢查。","x":"The occupant comfort is considered acceptable if the 1-year and","q_en":"Occupant comfort need only be checked for the peak acceleration at the 10-year return period.","e_en":"False. The Code requires peak accelerations at both 1-year and 10-year return periods to be below the Figure 2-6 limits. According to the EN, with the code method the ratio between the two is fixed (3.67), so only one needs checking in effect; but with wind tunnel testing both must be checked.","doc":"wind-code-2019","pp":"16","ex":"wind","tier":"常考"},{"id":"WND-019","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"3.2 / Table 3-1","p":27,"q":"Table 3-1：有效高度 100 m 的 Qo,z 是多少 kPa？","o":["2.56","2.73","2.86","3.05"],"a":2,"e":"Qo,z 由 3.7(Ze/500)^0.16 得出，100 m 為 2.86 kPa。記住幾個錨點（10 m 1.98、50 m 2.56、100 m 2.86、200 m 3.20）方便快速估算和審核計算書。","x":"75 2.73 100 2.86 150 3.05","q_en":"Table 3-1: Qo,z (kPa) at an effective height of 100 m?","e_en":"Qo,z comes from 3.7(Ze/500)^0.16; 2.86 kPa at 100 m. Remember a few anchor points (10 m 1.98, 50 m 2.56, 100 m 2.86, 200 m 3.20) for quick estimates and checking calculations.","doc":"wind-code-2019","pp":"17","ex":"wind","tier":"必考"},{"id":"WND-020","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 200 m 的 Qo,z（kPa）？","a":3,"u":"kPa","e":"200 m 為 3.20 kPa，也是 Standard Method 適用高度上限附近的數值。","x":"150 3.05 200 3.20 250 3.31","o":["3.5 kPa","4.0 kPa","2.9 kPa","3.2 kPa"],"q_en":"Table 3-1: Qo,z (kPa) at an effective height of 200 m?","e_en":"3.20 kPa at 200 m, which is also the value near the height limit of the Standard Method.","doc":"wind-code-2019","pp":"17","ex":"wind","tier":"必考"},{"id":"WND-021","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 ≤2.5 m 的 Qo,z（kPa）？","a":3,"u":"kPa","e":"低矮構築物（圍板、小型構築物）以 1.59 kPa 為下限，再按 2.5 臨時結構規定折減。","x":"2.5 1.59 5 1.77 10 1.98","o":["2.0 kPa","1.25 kPa","1.82 kPa","1.59 kPa"],"q_en":"Table 3-1: Qo,z (kPa) at an effective height of ≤2.5 m?","e_en":"Low structures (hoardings, small structures) take 1.59 kPa as the lower bound, then reduce per the temporary structure provisions of 2.5.","doc":"wind-code-2019","pp":"17","ex":"wind","tier":"必考"},{"id":"WND-022","t":"tf","d":2,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1 提供有效高度超過 500 m 的 Qo,z 數值。","a":false,"e":"超過 500 m 規範寫明 Seek specialist advice；實際上 >200 m 已必須做風洞試驗。","x":"Seek specialist advice","q_en":"Table 3-1 gives Qo,z values for effective heights above 500 m.","e_en":"False. Above 500 m the Code says \"Seek specialist advice\"; in fact wind tunnel testing is already mandatory above 200 m.","doc":"wind-code-2019","pp":"17","ex":"wind","tier":"必考"},{"id":"WND-023","t":"tf","d":2,"tp":"有效高度 Effective height","c":"3.3","p":28,"q":"計算參考風壓時，有效高度 Ze 可保守地取實際高度。","a":true,"e":"Ze 可按 Appendix A2 考慮周邊建築遮擋而降低，但保守可直接取實際高度。用遮擋折減時要確保周邊建築係長期存在，否則有風險。","x":"may conservatively be taken as the actual height","q_en":"When calculating the reference wind pressure, the effective height Ze may conservatively be taken as the actual height.","e_en":"True. Ze may be reduced for shelter from surrounding buildings per Appendix A2, but the actual height may conservatively be used directly. When using shelter reduction, ensure the surrounding buildings are permanent, otherwise there is a risk.","doc":"wind-code-2019","pp":"18","ex":"wind","tier":"常考"},{"id":"WND-024","t":"mcq","d":2,"tp":"力系數 Force coefficient","c":"4.2","p":29,"q":"圓形平面、高度/直徑比不大於 6 的建築，force coefficient 可取多少？","a":1,"u":"","e":"圓形平面 Cf 明顯低於矩形，但方向系數 Sθ 要取 1（見 Appendix A1）。","x":"diameter ratio not larger than 6 can be taken as 0.75.","o":["1.2","0.75","1.0","0.6"],"q_en":"For a building of circular plan with height/diameter ratio not greater than 6, what force coefficient may be taken?","e_en":"Cf for circular plans is significantly lower than for rectangular plans, but the directionality factor Sθ must be taken as 1 (see Appendix A1).","doc":"wind-code-2019","pp":"19","ex":"wind","tier":"常考"},{"id":"WND-025","t":"tf","d":3,"tp":"力系數 Force coefficient","c":"4.2","p":31,"q":"影響少於建築高度 10% 的平面退台（plan steps）可在計算 Cf 時忽略。","a":true,"e":"頂層小退台或冠頂位置不必另計 Cf；但大幅退台就要分段處理。","x":"Steps in plan size affecting less than 10% of","q_en":"Plan steps affecting less than 10% of the building height may be ignored when calculating Cf.","e_en":"True. Small setbacks at the top floor or crown need no separate Cf, but large setbacks must be treated in segments.","doc":"wind-code-2019","pp":"21","ex":"wind","tier":"常考"},{"id":"WND-026","t":"mcq","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：平屋頂角區（Zone C）的 net pressure coefficient 是？","o":["−1.0","−1.6","−2.2","−1.4"],"a":2,"e":"屋頂角位 −2.2、邊位 −1.6、中間 −1.0；外牆邊位 −1.4。屋面防水層、天台設備及 parapet 固定要按角區吸力設計，常被低估。","x":"Negative pressure in C -2.2 corner zone","q_en":"Table 4-1: net pressure coefficient for a flat roof corner zone (Zone C)?","e_en":"Roof corners −2.2, edges −1.6, middle −1.0; wall edges −1.4. Roof waterproofing, rooftop plant and parapet fixings must be designed for corner suction, which is often underestimated.","doc":"wind-code-2019","pp":"24","ex":"wind","tier":"偶考"},{"id":"WND-027","t":"mcq","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：外牆邊區（Zone A）的負 net pressure coefficient？","a":0,"u":"","e":"外牆邊區 −1.4、一般區 −1.0、正壓 +1.1。幕牆角位玻璃和鋁框要用 −1.4，再乘尺寸系數 Ss。","x":"Negative pressure in A -1.4 edge zone","o":["-1.4","-1.1","-2.0","-0.8"],"q_en":"Table 4-1: negative net pressure coefficient for wall edge Zone A?","e_en":"Wall edge zone −1.4, general zone −1.0, positive +1.1. Curtain wall corner glass and aluminium frames must use −1.4, multiplied by the size factor Ss.","doc":"wind-code-2019","pp":"24","ex":"wind","tier":"偶考"},{"id":"WND-028","t":"mcq","d":3,"tp":"開放框架 Open framework","c":"Table 4-2","p":39,"q":"Table 4-2：solidity ratio 0.5 的 open-framework 構件其系數是？","o":["1.5","1.6","1.8","2.0"],"a":0,"e":"solidity ratio 0.5–0.8 取最低 1.5，極稀或實心 (0.01/1.0) 取 2.0。棚架、鐵塔、天線支架常用。","x":"0.3 1.6 0.5 1.5","q_en":"Table 4-2: coefficient for open-framework members with a solidity ratio of 0.5?","e_en":"Solidity ratios 0.5–0.8 take the lowest value of 1.5; very sparse or solid (0.01/1.0) take 2.0. Commonly used for scaffolding, pylons and antenna supports.","doc":"wind-code-2019","pp":"29","ex":"wind","tier":"偶考"},{"id":"WND-029","t":"mcq","d":2,"tp":"尺寸及動力系數 Size & dynamic factor","c":"5.1","p":42,"q":"高度少於多少 m 的建築可用簡化 Sq = 1.1Ss？","a":0,"u":"m","e":"低於 50 m 的建築動力效應不顯著，可簡化；高樓要按完整 Sq,z 公式計算，包括 fundamental frequency 和 damping。","x":"For buildings of less than 50m height, the following simplified","o":["50 m","30 m","100 m","75 m"],"q_en":"Buildings less than how many m high may use the simplified Sq = 1.1Ss?","e_en":"Buildings below 50 m have insignificant dynamic effects and may be simplified; tall buildings must use the full Sq,z formula, including fundamental frequency and damping.","doc":"wind-code-2019","pp":"32","ex":"wind","tier":"常考"},{"id":"WND-030","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":44,"q":"風洞試驗中周邊建築模型（proximity model）的半徑一般不少於多少 m？","a":400,"tol":0,"u":"m","e":"proximity model 半徑≥400 m 並至少 36 個風向（每 10°）。審核風洞報告時要檢查呢兩項。","x":"less than 400m radius from the site.","q_en":"In wind tunnel testing, the radius of the proximity model is generally not less than how many m?","e_en":"Proximity model radius ≥400 m and at least 36 wind directions (every 10°). Check both when reviewing wind tunnel reports.","doc":"wind-code-2019","pp":"34","ex":"wind","tier":"偶考"},{"id":"WND-031","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":45,"q":"風洞阻塞率（blockage）一般不應超過百分之幾？","a":1,"u":"%","e":"阻塞過大會令風速和壓力失真，需修正或改用較小比例模型。","x":"testing should not normally be allowed to exceed 10%, including","o":["5%","10%","20%","15%"],"q_en":"Wind tunnel blockage should generally not exceed what percentage?","e_en":"Excessive blockage distorts wind speeds and pressures; corrections or a smaller-scale model are needed.","doc":"wind-code-2019","pp":"35","ex":"wind","tier":"偶考"},{"id":"WND-032","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.4","p":46,"q":"新建築以風洞試驗設計時，最少須抵抗 Standard Method 荷載的百分之幾（一般情況）？","a":3,"u":"%","e":"Code 6.4：風洞結果低過 Standard Method 80% 都要取 80%；做 building removal investigation 可放寬至 along-wind 的 70%。2023 修訂（EN 6.4，Item 4）：舊 EN 寫「無 building removal investigation 時遮擋效益限於 80% of the along-wind value」，現改為「80% of the loads of the Standard Method」，並須以 total base moments 形式比較。","x":"New buildings should resist a minimum of 80% of the load of the","o":["50%","90%","70%","80%"],"r":[{"doc":"wind-en-amendments-2023","p":5,"c":"Amendments Dec 2023 – Item 4 (EN 6.4)","x":"Method. The comparison should be in the form of total base","pp":"5"}],"q_en":"When a new building is designed from wind tunnel testing, it must resist at least what percentage of the Standard Method loads (general case)?","e_en":"Code 6.4: if wind tunnel results are below 80% of the Standard Method, 80% must be used; with a building removal investigation this may be relaxed to 70% of along-wind. 2023 amendment (EN 6.4, Item 4): the old EN said that without a building removal investigation the shelter benefit is limited to \"80% of the along-wind value\"; it now reads \"80% of the loads of the Standard Method\", and the comparison should be in the form of total base moments.","doc":"wind-code-2019","pp":"36","ex":"wind","tier":"偶考"},{"id":"WND-033","t":"mcq","d":2,"tp":"方向系數 Directionality","c":"Appendix A1 / Table A1-1","p":50,"q":"Table A1-1 中哪個風向的 Sθ 最低？","o":["N (0.82)","NW (0.80)","W (0.82)","NE (0.84)"],"a":1,"e":"NW 0.80 最低，E/SE/S 0.85 最高。使用時要取該 90° 扇區內最大 Sθ；圓形建築必須取 1。","x":"SW 0.84 W 0.82 NW 0.80","q_en":"Which wind direction has the lowest Sθ in Table A1-1?","e_en":"NW 0.80 is lowest, E/SE/S 0.85 highest. Use the maximum Sθ within the relevant 90° sector; circular buildings must take 1.","doc":"wind-code-2019","pp":"A1","ex":"wind","tier":"常考"},{"id":"WND-034","t":"tf","d":2,"tp":"方向系數 Directionality","c":"Appendix A1","p":50,"q":"圓形平面建築可按 Table A1-1 採用方向系數 Sθ 折減。","a":false,"e":"圓形建築任何風向反應相同，規範要求 Sθ = 1。","x":"The directionality factor does not apply to circular buildings.","q_en":"Buildings of circular plan may use the directionality factor Sθ reduction of Table A1-1.","e_en":"False. Circular buildings respond the same in every wind direction, and the Code requires Sθ = 1.","doc":"wind-code-2019","pp":"A1","ex":"wind","tier":"常考"},{"id":"WND-035","t":"mcq","d":2,"tp":"加速度 Acceleration","c":"Table A1-2","p":50,"q":"Table A1-2：10 年回歸期的 return period factor on pressure Sr？","a":0,"u":"","e":"1 年 0.25、10 年 0.55，用於舒適度加速度計算。Explanatory Notes 指出按 NBCC 方法，10 年與 1 年加速度比約為 √(0.55/0.25) 的 3.3 次方 ≈ 3.67，所以用 code method 時只需檢查一個回歸期。","x":"return period factors in Table A1-2.","o":["0.55","0.4","0.7","0.8"],"q_en":"Table A1-2: return period factor on pressure Sr for a 10-year return period?","e_en":"1 year 0.25, 10 years 0.55, used for comfort acceleration calculations. The Explanatory Notes point out that by the NBCC method, the ratio of 10-year to 1-year acceleration is about √(0.55/0.25) raised to the power 3.3 ≈ 3.67, so with the code method only one return period needs checking.","doc":"wind-code-2019","pp":"A1","ex":"wind","tier":"常考"},{"id":"WND-037","t":"mcq","d":3,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1","p":62,"q":"Appendix B1：開口面積 Ao 大於其他面總開口的多少倍時，被視為 dominant opening？","a":2,"u":"倍","e":"Ao > 1.5Atot 即屬 dominant opening，要分開計內外壓。2023 修訂（EN 4.3.1，Item 3）：accidental dominant open scenario 由「out of scope of this Code」改為「not a compulsory requirement of this Code」（見 Appendix B1.3），即 Code 不強制考慮意外（如颱風破窗）形成的 dominant opening；如業主或設計需要，仍可按 Appendix B1 計算。","x":"Sum of areas of openings on other faces, including leakage.","o":["1.2 倍","3 倍","1.5 倍","2 倍"],"r":[{"doc":"wind-en-amendments-2023","p":5,"c":"Amendments Dec 2023 – Item 3 (EN 4.3.1)","x":"compulsory requirement of this Code, as discussed in Appendix","pp":"5"}],"q_en":"Appendix B1: an opening is regarded as dominant when its area Ao exceeds how many times the total area of openings on the other faces?","o_en":["1.2 times","3 times","1.5 times","2 times"],"e_en":"Ao > 1.5Atot is a dominant opening, and internal and external pressures must be calculated separately. 2023 amendment (EN 4.3.1, Item 3): the accidental dominant open scenario changed from \"out of scope of this Code\" to \"not a compulsory requirement of this Code\" (see Appendix B1.3), i.e. the Code does not require a dominant opening created accidentally (e.g. windows broken in a typhoon) to be considered; if the client or design requires it, it can still be calculated per Appendix B1.","u_en":"times","doc":"wind-code-2019","pp":"B1","ex":"wind","tier":"偶考"},{"id":"WND-038","t":"mcq","d":3,"tp":"阻尼 Damping","c":"Appendix C2 / Table C2-1","p":74,"q":"Table C2-1：高寬比 ≥8 的 RC 建築，計算加速度及荷載的 damping ratio 分別為？","o":["0.010 / 0.015","0.020 / 0.030","0.015 / 0.020","0.013 / 0.020"],"a":0,"e":"越細長 damping 越低；計加速度用較低值，計強度荷載用較高值。用錯（例如兩者都用 0.02）會低估塔樓反應。2023 修訂（EN Appendix C2，Item 6）：EN 說明阻尼數據時提到的離群高阻尼值屬一幢立方形建築，高度由 200 m 更正為 250 m；Table C2-1 數值不變。","x":"0.010 0.015 7 0.011 0.017","r":[{"doc":"wind-en-amendments-2023","p":6,"c":"Amendments Dec 2023 – Item 6 (EN Appendix C2), current-version text","x":"Outlying high damping value was recorded for a 200m building","pp":"6"}],"q_en":"Table C2-1: damping ratios for calculating acceleration and loads respectively for an RC building with aspect ratio ≥8?","e_en":"The more slender, the lower the damping; acceleration uses the lower value, strength loads the higher. Using the wrong one (e.g. 0.02 for both) underestimates the tower response. 2023 amendment (EN Appendix C2, Item 6): the outlying high damping value mentioned in the EN discussion of damping data was for a cubic building whose height is corrected from 200 m to 250 m; the Table C2-1 values are unchanged.","doc":"wind-code-2019","pp":"C2","ex":"wind","tier":"偶考"},{"id":"WEN-001","t":"mcq","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"根據 Explanatory Notes，Code 的參考風壓配合 1.4 wind load factor 使用時，ULS 風荷載被校準為相當於多少年回歸期？","o":["至少 50 年","至少 200 年","至少 1,000–1,500 年","至少 10,000 年"],"a":2,"e":"Code 本身的 Qo,z 係「未乘系數」的參考風壓，乘 γw 1.4 之後大約對應 1,000–1,500 年回歸期。了解呢點有助向業主或審批方解釋點解唔可以隨意減 γw。","x":"of at least 1,000-1,500 year return which is consistent with the level of","q_en":"According to the Explanatory Notes, when the Code reference wind pressure is used with the 1.4 wind load factor, the ULS wind load is calibrated to correspond to what return period?","o_en":["At least 50 years","At least 200 years","At least 1,000–1,500 years","At least 10,000 years"],"e_en":"The Code's Qo,z is an \"unfactored\" reference wind pressure; multiplied by γw 1.4 it corresponds to roughly a 1,000–1,500 year return period. Understanding this helps explain to clients or approving authorities why γw cannot be reduced at will.","doc":"wind-explanatory-notes-2019","pp":"14","ex":"wind","tier":"偶考"},{"id":"WEN-002","t":"num","d":3,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes：Code 參考風壓相當於開放海面風暴、在 500 m 參考高度的平均風速為多少 m/s？","a":59.5,"tol":0.1,"u":"m/s","e":"59.5 m/s @500 m 係 Qo,z 公式背後的風速假設，風洞試驗配對風壓（Equation 6-2）時亦以此為基礎。","x":"59.5 m/s at reference height of 500m.","q_en":"Explanatory Notes: the Code reference wind pressure corresponds to an open-sea storm with a mean wind speed of how many m/s at the 500 m reference height?","e_en":"59.5 m/s @500 m is the wind speed assumption behind the Qo,z formula, and is also the basis for matching wind tunnel pressures (Equation 6-2).","doc":"wind-explanatory-notes-2019","pp":"14","ex":"wind","tier":"偶考"},{"id":"WEN-003","t":"tf","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes 指出，3.7 peak factor 實際上約對應 3 秒平均風速。","a":false,"e":"最新研究顯示 3.7 peak factor 約對應 0.35 秒平均，而非傳統理解的 3 秒陣風；但這不影響結構或外牆風荷載的計算，主要影響 size factor 和風洞量度。","x":"peak factor actually corresponds to about 0.35s-average. However,","q_en":"The Explanatory Notes state that the 3.7 peak factor actually corresponds to about a 3-second mean wind speed.","e_en":"False. Recent research shows the 3.7 peak factor corresponds to about a 0.35-second average, not the traditionally understood 3-second gust; this does not affect structural or cladding wind load calculations, mainly the size factor and wind tunnel measurements.","doc":"wind-explanatory-notes-2019","pp":"14","ex":"wind","tier":"偶考"},{"id":"WEN-004","t":"mcq","d":3,"tp":"有效高度 Effective height","c":"EN 3.3","p":23,"q":"有效高度不得少於參考高度的 25%，這把設計風壓的折減限制在百分之幾以內？","a":0,"u":"%","e":"0.25^0.16 ≈ 0.8，即遮擋最多減 20% 風壓。BS 6399-2 用 40% 下限是基於 urban exposure，同樣相當於 0.8。","x":"limits the reduction of design pressure to 20% using the open-sea","o":["20%","10%","50%","30%"],"q_en":"The effective height may not be less than 25% of the reference height. This limits the reduction in design wind pressure to within what percentage?","e_en":"0.25^0.16 ≈ 0.8, i.e. shelter reduces wind pressure by at most 20%. BS 6399-2 uses a 40% lower limit based on urban exposure, which is likewise equivalent to 0.8.","doc":"wind-explanatory-notes-2019","pp":"15","ex":"wind","tier":"常考"},{"id":"WEN-006","t":"mcq","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC across-wind 方法原本校準的 B/D 範圍是？","o":["0.5 < B/D < 2","0.25 < B/D < 4","1 < B/D < 6","B/D < 1"],"a":0,"e":"NBCC 原校準範圍 0.5<B/D<2；EN 指出經驗顯示可合理延伸至約 1:4 或 4:1，超出後視乎扭轉重要性可能需要風洞試驗。","x":"Based on more recent experience of wind tunnel testing, the use of the","q_en":"The NBCC across-wind method was originally calibrated for what range of B/D?","e_en":"The original NBCC calibration range is 0.5<B/D<2; the EN notes that experience shows it can reasonably be extended to about 1:4 or 4:1, beyond which wind tunnel testing may be needed depending on the importance of torsion.","doc":"wind-explanatory-notes-2019","pp":"6","ex":"wind","tier":"偶考"},{"id":"WEN-007","t":"num","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC 方法的 across-wind base moment 與風速的幾次方成正比？","a":3.3,"tol":0,"u":"","e":"風壓與風速平方成正比，但 across-wind 彎矩約與風速 3.3 次方成正比，所以規範直接用 factored wind speed 計算 ultimate across-wind moment 再除 γw，而唔係將 service 值乘 1.4。","x":"methodology is proportional to wind speed to the power of 3.3 rather","q_en":"In the NBCC method, the across-wind base moment is proportional to the wind speed raised to what power?","e_en":"Wind pressure is proportional to the square of wind speed, but the across-wind moment is proportional to about the 3.3 power of wind speed, so the Code calculates the ultimate across-wind moment directly with the factored wind speed and then divides by γw, instead of multiplying the service value by 1.4.","doc":"wind-explanatory-notes-2019","pp":"6","ex":"wind","tier":"偶考"},{"id":"WEN-009","t":"num","d":2,"tp":"荷載組合 Load combination","c":"EN 2.2.4","p":16,"q":"Code 的 envelope parameters 產生多少個 Fx、Fy、Mz 荷載組合？","a":24,"tol":0,"u":"","e":"3 個 case × 8 個正負號組合 = 24。完全忽略扭轉可減至 8 個；只省略 Case 3 則 16 個。","x":"in 24 combinations of the 3 basic load cases for the lateral and","q_en":"How many Fx, Fy, Mz load combinations do the Code's envelope parameters produce?","e_en":"3 cases × 8 sign combinations = 24. Ignoring torsion entirely reduces this to 8; omitting only Case 3 gives 16.","doc":"wind-explanatory-notes-2019","pp":"8","ex":"wind","tier":"偶考"},{"id":"WEN-010","t":"tf","d":2,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":18,"q":"建築若符合規範可忽略扭轉荷載的條件，即表示該建築不存在扭轉風荷載。","a":false,"e":"EN 明確提醒：可在最終組合中忽略扭轉，不代表扭轉風荷載不存在；只是該類結構抗扭能力好，影響細。","x":"discussed in this section should not be taken to imply that torsional","q_en":"If a building meets the Code conditions for ignoring torsional load, it means the building has no torsional wind load.","e_en":"False. The EN explicitly notes that torsion may be ignored in the final combinations, but that does not mean torsional wind load does not exist; such structures simply have good torsional resistance, so the effect is small.","doc":"wind-explanatory-notes-2019","pp":"10","ex":"wind","tier":"常考"},{"id":"WEN-011","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":17,"q":"EN 指出，Bi-directional multi-bay moment frame 若有柱退台，退台距離（由柱中心量度）不應超過？","o":["3 m 或建築尺寸 1/20，取較小","5 m 或建築尺寸 1/10，取較小","5 m 或建築尺寸 1/10，取較大","10 m"],"a":1,"e":"符合此條件的框架可歸入 ≤70 m 周邊抗側力類別而忽略扭轉。審圖時要檢查退台距離是否超出 5 m / 1/10。","x":"structures can also be considered under this category; but in case","q_en":"The EN states that for a bi-directional multi-bay moment frame with column setbacks, the setback distance (measured from column centres) should not exceed:","o_en":["3 m or 1/20 of the building dimension, whichever is less","5 m or 1/10 of the building dimension, whichever is less","5 m or 1/10 of the building dimension, whichever is greater","10 m"],"e_en":"Frames meeting this condition may be classed as ≤70 m perimeter lateral resistance and torsion ignored. In plan vetting, check whether setbacks exceed 5 m / 1/10.","doc":"wind-explanatory-notes-2019","pp":"9","ex":"wind","tier":"常考"},{"id":"WEN-012","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"EN 2.3.1","p":18,"q":"2019 Code 將外牆設計風壓 Qz 的參考高度改為建築頂部，而非構件實際標高（2004 Code 做法）。","a":true,"e":"與 BS 6399-2 及 BS EN 1991-1-4 一致，也與風洞結果相符。低層幕牆因此會比 2004 Code 大；Table 4-1 附註 (c) 容許 0.5(H−Hd) 以下減 20%。","x":"The reference height of design pressure, 𝑄𝑄𝑧𝑧 , is changed to the top of a","q_en":"The 2019 Code changed the reference height for the cladding design wind pressure Qz to the top of the building, instead of the actual level of the element (the 2004 Code approach).","e_en":"True. Consistent with BS 6399-2 and BS EN 1991-1-4, and with wind tunnel results. Low-level curtain walls are therefore larger than under the 2004 Code; note (c) to Table 4-1 allows a 20% reduction below 0.5(H−Hd).","doc":"wind-explanatory-notes-2019","pp":"10","ex":"wind","tier":"偶考"},{"id":"WEN-013","t":"mcq","d":2,"tp":"尺寸系數 Size factor","c":"EN 5.1","p":31,"q":"Size factor 取 1.0 時對應的 half-perimeter length 是多少 m？","a":3,"u":"m","e":"15 m 比歐洲做法大，反映香港颱風風速較高、壓力相關性較強。一般幕牆板尺寸小於 15 m，所以 Ss 通常大於 1.0。","x":"The choice of 15m for size factor of 1.0 is based on the increased wind","o":["10 m","25 m","5 m","15 m"],"q_en":"The size factor equals 1.0 at a half-perimeter length of how many m?","e_en":"15 m is larger than in European practice, reflecting higher typhoon wind speeds in Hong Kong and stronger pressure correlation. Typical curtain wall panels are smaller than 15 m, so Ss is usually greater than 1.0.","doc":"wind-explanatory-notes-2019","pp":"23","ex":"wind","tier":"偶考"},{"id":"WEN-014","t":"tf","d":2,"tp":"加速度 Acceleration","c":"EN 2.4.2","p":20,"q":"採用風洞試驗時，只需檢查 1 年或 10 年其中一個回歸期的加速度。","a":false,"e":"用 code method 時兩者比例固定為 3.67，只需檢查一個；風洞試驗比例未必是 3.67，兩個回歸期都要檢查。","x":"With wind tunnel testing, both return periods should be checked,","q_en":"With wind tunnel testing, acceleration need only be checked for one of the 1-year or 10-year return periods.","e_en":"False. With the code method the ratio between the two is fixed at 3.67, so only one needs checking; with wind tunnel testing the ratio may not be 3.67, so both return periods must be checked.","doc":"wind-explanatory-notes-2019","pp":"12","ex":"wind","tier":"偶考"},{"id":"WEN-016","t":"mcq","d":2,"tp":"加速度 Acceleration","c":"EN 2.4.1","p":20,"q":"Code 為限制 along-wind 加速度可能大過 across-wind 的風險，對 (BD)b 設定了什麼限制？","o":["(BD)b ≤ H²/9","(BD)b ≤ H²/4","(BD)
