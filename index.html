e 分類的分母。","x":"254x254x73 73.1 254.1 254.6 8.6 14.2 12.7 200.3 8.96 23.3","doc":"steel-section-tables-bs5950","pp":"B-12","tags":["steel-section-tables-bs5950","截面性質查表 Section properties","num","基礎"]},{"id":"STL-001","t":"mcq","d":1,"tp":"極限狀態 Limit states","c":"Table 2.1","p":38,"q":"按 Steel Code Table 2.1，以下哪一項屬 serviceability limit state？","o":["Brittle fracture","Fire resistance","Human induced vibration","Stability against overturning"],"a":2,"e":"Table 2.1：SLS 包括 deflection、human induced vibration、wind induced vibration、durability；brittle fracture、fatigue、fire、穩定屬 ULS。","x":"Stability against overturning, sliding, uplift and Human induced vibration","doc":"steel-2011-2023ed","pp":"19","tags":["steel-2011-2023ed","極限狀態 Limit states","mcq","基礎"]},{"id":"STL-002","t":"tf","d":1,"tp":"荷載組合 Load combinations","c":"2.3.1","p":38,"q":"Steel Code 規定在每個荷載組合中，抵抗滑動、傾覆或上拔的有利 dead load 應取 γf = 1.0。","a":true,"e":"對。2.3.1：beneficial dead load γf = 1.0。鋼結構輕，uplift（例如輕鋼屋頂、簷篷）往往由 1.0Gk + 1.4Wk 控制。","x":"which counteracts the effects of other loads, including dead loads restraining sliding,","doc":"steel-2011-2023ed","pp":"19","tags":["steel-2011-2023ed","荷載組合 Load combinations","tf","基礎"]},{"id":"STL-003","t":"tf","d":2,"tp":"疲勞 Fatigue","c":"2.3.3","p":39,"q":"一般建築物中，風荷載的正常波動引起的應力變化需要作疲勞檢核。","a":false,"e":"錯。2.3.3：normal fluctuations in wind loading need not be considered；但氣動不穩定引起的風致振動、承托振動機器或吊車的構件則要考慮。疲勞設計 γf = 1.0。","x":"numerous fluctuations of stress. Stress changes due to normal fluctuations in wind","doc":"steel-2011-2023ed","pp":"20","tags":["steel-2011-2023ed","疲勞 Fatigue","tf","中級"]},{"id":"STL-004","t":"num","d":2,"tp":"疲勞 Fatigue","c":"2.3.3.4","p":41,"q":"疲勞評估時，按 Steel Code 設計的建築物 design working life 取多少年？","a":50,"tol":0,"u":"年","e":"2.3.3.4(a)：建築物 50 年；道路/橋樑一般 120 年。Miner's rule Σni/Ni ≤ 1.0。","x":"designed to the Code the design working life is 50 years and for road/bridge this","doc":"steel-2011-2023ed","pp":"22","tags":["steel-2011-2023ed","疲勞 Fatigue","num","中級"]},{"id":"STL-005","t":"num","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3","p":43,"q":"作為水平 tie 的鋼構件及其端部連接，須能抵抗的最少 factored tensile load 是多少 kN？","a":75,"tol":0,"u":"kN","e":"2.3.4.3(a)：≥75 kN，毋須與其他荷載疊加。Internal tie = 0.5(1.4Gk+1.6Qk)stL；edge tie = 0.25(...)stL，均不少於 75 kN。常見錯誤：簡支樑端 fin plate 連接未檢核 tie force。","x":"capable of resisting a factored tensile load not less than 75kN, which need not be","doc":"steel-2011-2023ed","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","num","中級"]},{"id":"STL-006","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3(b)","p":43,"q":"錨固邊柱（edge columns）的水平 tie 須抵抗以下哪個值的最大者？","o":["Tie force、75 kN 或柱荷載 1%","Tie force、50 kN 或柱荷載 3%","75 kN 或柱荷載 1.5%","柱荷載 2.5%"],"a":0,"e":"2.3.4.3(b)：max(tie force, 75 kN, 1% 柱上/下最大 factored dead + imposed load)，垂直於邊緣作用。（Concrete Code 外柱為 3%，兩本 Code 數值不同，要分清。）","x":"calculated in (a) above, 75 kN or 1% of the maximum factored dead and imposed","doc":"steel-2011-2023ed","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","mcq","中級"]},{"id":"STL-007","t":"short","d":2,"tp":"穩健性 Robustness","c":"2.3.4.3(c)","p":44,"q":"Steel Code 對柱接駁（column splices）的 tension continuity 有何要求？","m":"所有柱接駁須能抵抗一個拉力，等於該接駁與下一個接駁之間任何單一樓層施加於柱的最大 factored vertical reaction（取 dead + imposed 或 dead + wind + imposed）。除非鋼框架至少一個方向完全連續，所有柱須在每個樑柱連接處貫通。","k":["splice 抗拉 = 單層最大 factored reaction","考慮 D+I 或 D+W+I","柱須連續貫通樑柱節點"],"e":"這是避免 disproportionate collapse 的連續性要求。Bearing-type column splice（只靠端面接觸受壓）要另加足夠螺栓/焊縫承受此拉力。","x":"All column splices should be capable of resisting a tensile force equal","doc":"steel-2011-2023ed","pp":"25","tags":["steel-2011-2023ed","穩健性 Robustness","short","中級"]},{"id":"STL-008","t":"num","d":2,"tp":"荷載 Loading","c":"2.5.3","p":46,"q":"Steel Code 規定 load combinations 2 和 3 的最小 unfactored wind load 不應少於 unfactored dead load 的多少 %？","a":1.0,"tol":0,"u":"%","e":"2.5.3：≥1.0% Gk（每層按該層重量計）。Concrete Code 則以 1.5% Gk 作 design ultimate 下限，兩者定義不同（unfactored vs ultimate）。","x":"The minimum unfactored wind load should not be less than 1.0% of unfactored dead load","doc":"steel-2011-2023ed","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","num","中級"]},{"id":"STL-009","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.6","p":46,"q":"設計溫度效應時，Steel Code 假設香港平均溫度變化範圍為：","o":["0°C 至 35°C","+0.1°C 至 +40.0°C","5°C 至 38°C","−5°C 至 45°C"],"a":1,"e":"2.5.6：+0.1°C 至 +40.0°C；受陽光直射構件（如幕牆支架）按 13.3.4.3 取更高溫度。長鋼屋頂及預應力拉桿系統特別敏感。","x":"varies from +0.1ºC to +40.0ºC. The actual range, however, depends on the location, type","doc":"steel-2011-2023ed","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","mcq","中級"]},{"id":"STL-010","t":"num","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"一般結構的 notional horizontal force 最少為 factored dead and imposed loads 的多少 %？","a":0.5,"tol":0,"u":"%","e":"2.5.8：0.5%（或 0.5 kN/m² 側壓，取較大），用於 load combination 1，毋須再乘 γf；臨時工程及 sway ultra-sensitive 結構用 1.0% 或 1.0 kN/m²。計算 overturning 時不需施加。","x":"should be capable of resisting notional horizontal forces with a minimum of 0.5% of the","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","num","中級"]},{"id":"STL-011","t":"tf","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"Notional horizontal forces 應與其他外加水平荷載（例如風）同時施加。","a":false,"e":"錯。2.5.8：不需與其他水平荷載、溫度效應同時施加，亦不用於 overturning 及 pattern loads，且不需計入基礎淨反力。它只與 comb 1 的 factored vertical loads 同時作用。","x":"The notional horizontal forces need not be applied when considering overturning, pattern","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","tf","中級"]},{"id":"STL-012","t":"mcq","d":2,"tp":"荷載 Loading","c":"2.5.8","p":47,"q":"臨時工程（如棚架、falsework）及 sway ultra-sensitive 結構的 notional horizontal force 應取：","o":["0.5% 或 0.5 kN/m²","1.0% 或 1.0 kN/m²（取較大）","2.5% 或 1.5 kN/m²","1.5% Gk"],"a":1,"e":"2.5.8：臨時工程 1.0% factored dead + live 或 1.0 kN/m²。Temporary works 另按 4.3.4 任何 adverse γf 不少於 1.2。","x":"horizontal force shall be used. The magnitude of this force shall be the greater of 1.0% of","doc":"steel-2011-2023ed","pp":"28","tags":["steel-2011-2023ed","荷載 Loading","mcq","中級"]},{"id":"STL-013","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"Steel Code 的 Class 1H 高強度鋼是指 yield strength 在哪個範圍？","o":["355–460 N/mm²","> 460 至 ≤ 690 N/mm²","> 690 N/mm²","≤ 460 N/mm²"],"a":1,"e":"3.1.1：Class 1/2/3 為 ≤460；1H 為 460–690；UH（>690）不在 Code 範圍，須 BA 批准（如高強度拉桿）。塑性分析不允許用於 uncertified steel 或 >690 鋼材。","x":"Class 1H: High strength steels with yield strengths greater than 460 N/mm2 but less","doc":"steel-2011-2023ed","pp":"30","tags":["steel-2011-2023ed","材料 Materials","mcq","基礎"]},{"id":"STL-014","t":"tf","d":2,"tp":"材料 Materials","c":"3.1.1","p":49,"q":"使用高強度鋼可同時改善疲勞及 serviceability 表現。","a":false,"e":"錯。3.1.1：高強度鋼對重載柱受壓及長跨樑抗彎有利，但不改善 fatigue 及 SLS（E 值相同，撓度不變）。可用 pre-camber 減撓度。","x":"imposed loads. Their use does not improve the performance for fatigue and serviceability","doc":"steel-2011-2023ed","pp":"30","tags":["steel-2011-2023ed","材料 Materials","tf","中級"]},{"id":"STL-015","t":"num","d":2,"tp":"材料 Materials","c":"3.1.2","p":51,"q":"Class 1 及 Class 2 鋼材的斷裂伸長率（elongation at fracture）不應少於多少 %？","a":15,"tol":0,"u":"%","e":"3.1.2 Ductility：Class 1、2 ≥15%；Class 1H ≥10%；抗拉強度應變不大於屈服應變 15 倍。","x":"For Classes 1 and 2 steel, the elongation at fracture is not to be less than 15%;","doc":"steel-2011-2023ed","pp":"32","tags":["steel-2011-2023ed","材料 Materials","num","中級"]},{"id":"STL-016","t":"num","d":1,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 ≤ 16 mm 時的 design strength py 是多少 N/mm²？","a":355,"tol":0,"u":"N/mm²","e":"S355：≤16 mm 355、≤40 mm 345、≤63 mm 335、≤80 mm 325、≤100 mm 315。厚板 py 下降，大型 H 柱（翼緣 >40 mm）常被忽略。","x":"16 355 40 345 63 335 S355 80 325","doc":"steel-2011-2023ed","pp":"33","tags":["steel-2011-2023ed","材料 Materials","num","基礎"]},{"id":"STL-017","t":"num","d":2,"tp":"材料 Materials","c":"Table 3.2","p":52,"q":"Table 3.2：S355 鋼材厚度 > 40 mm 但 ≤ 63 mm 時 py 是多少 N/mm²？","a":335,"tol":0,"u":"N/mm²","e":"厚度分級：16/40/63/80/100/150 mm。UC 356×406×634 等重型柱翼緣超過 63 mm，py 只有 325 或以下。","x":"16 355 40 345 63 335 S355 80 325","doc":"steel-2011-2023ed","pp":"33","tags":["steel-2011-2023ed","材料 Materials","num","中級"]},{"id":"STL-018","t":"num","d":1,"tp":"材料 Materials","c":"3.1.6","p":56,"q":"Steel Code 分析用的鋼材彈性模量 E 是多少 N/mm²？","a":205000,"tol":0,"u":"N/mm²","e":"3.1.6：E = 205,000 N/mm²，Poisson's ratio 0.3，熱膨脹 14×10⁻⁶/°C。注意 Concrete Code 鋼筋 Es = 200 kN/mm²，但 Steel Code composite 設計中鋼筋亦取 205 kN/mm²（10.1.3）。","x":"Modulus of elasticity E = 205,000 N/mm2","doc":"steel-2011-2023ed","pp":"37","tags":["steel-2011-2023ed","材料 Materials","num","基礎"]},{"id":"STL-019","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 1 鋼材（Ys ≤ 460）的 γm1 及 γm2 分別是：","o":["1.0 及 1.1","1.1 及 1.2","1.0 及 1.05","1.05 及 1.25"],"a":0,"e":"Table 4.1：Class 1 1.0/1.1；Class 2 1.1/1.2；Class 1H 1.0/1.05；Class 3 py 限 170 N/mm²、抗拉 300 N/mm²。py = Ys/γm1 但不大於 Us/γm2。","x":"γm1 γm2 γm1 γm2 1 1.0 1.1 - - 2 1.1 1.2 - -","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","材料係數 γm","mcq","中級"]},{"id":"STL-020","t":"num","d":2,"tp":"材料係數 γm","c":"Table 4.1","p":64,"q":"Class 3（uncertified）鋼材的 py 上限是多少 N/mm²？","a":170,"tol":0,"u":"N/mm²","e":"Table 4.1 註：Class 3 py ≤170 N/mm²，只可用於失效後果有限的次要構件（4.2.1）。","x":"For Class 3 steel py is limited to 170 N/mm2 and ultimate tensile strength to 300 N/mm2","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","材料係數 γm","num","中級"]},{"id":"STL-021","t":"scenario","d":2,"tp":"荷載組合 Load combinations","c":"Table 4.2","p":64,"q":"一個鋼簷篷受 dead、imposed、wind 及溫度作用。按 Steel Code Table 4.2，comb 1、2、3 的 γf 為何？如何檢核 uplift？","m":"Comb 1（D+I）：Gk 1.4（有利 1.0）、Qk 1.6（有利 0）、溫度 1.2；Comb 2（D+lateral）：Gk 1.4/1.0、Wk 1.4、溫度 1.2；Comb 3（D+I+lateral）：Gk 1.2/1.0、Qk 1.2、Wk 1.2、溫度 1.2。Uplift 用 comb 2：1.0Gk + 1.4Wk（風吸），並檢核錨栓抗拔。","k":["1.4Gk+1.6Qk","1.4Gk(1.0Gk)+1.4Wk","1.2Gk+1.2Qk+1.2Wk","Temperature Tk 1.2","Uplift: 1.0Gk + 1.4Wk"],"e":"與 Concrete Code Table 2.1 基本一致，但 Steel Code 明列溫度 γf 1.2 及 differential settlement（comb 1/2 取 1.4、comb 3 取 1.2）。","x":"Table 4.2 - Partial load factors and combinations for normal condition design","doc":"steel-2011-2023ed","pp":"45","tags":["steel-2011-2023ed","荷載組合 Load combinations","scenario","中級"]},{"id":"STL-022","t":"num","d":2,"tp":"荷載組合 Load combinations","c":"4.3.4","p":65,"q":"臨時工程（temporary works）中任何 adverse load factor（包括風）最少為多少？","a":1.2,"tol":0,"u":"","e":"4.3.4：in no circumstances less than 1.2。樓宇評估（4.3.3）亦要求 adverse γf 不少於 1.2。","x":"circumstances should any adverse load factor be less than 1.2. This includes load factors","doc":"steel-2011-2023ed","pp":"46","tags":["steel-2011-2023ed","荷載組合 Load combinations","num","中級"]},{"id":"STL-023","t":"mcq","d":3,"tp":"荷載組合 Load combinations","c":"Table 4.3","p":65,"q":"Extreme event（如車撞、爆炸）load combination 1 中，imposed load 的 adverse γf（非儲存用途）是：","o":["0.33","0.35","1.0","1.05"],"a":1,"e":"Table 4.3：Dead 1.05、Imposed 0.35、Wind 0.35、Extreme event Ak 1.0；儲存/工業或永久 imposed 取 1.0。Concrete Code 則以 1/3 imposed × 1.05 表達，概念相近。","x":"1. dead, 1.05 1.0 0.35 0 1.05 - 1.0","doc":"steel-2011-2023ed","pp":"46","tags":["steel-2011-2023ed","荷載組合 Load combinations","mcq","進階"]},{"id":"STL-024","t":"mcq","d":1,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code：承托灰泥或其他脆性飾面的樑，imposed load 撓度限值為：","o":["Span/200","Span/250","Span/360","Span/500"],"a":2,"e":"Table 5.1：brittle finish span/360；其他樑 span/200；懸臂 length/180；吊車樑豎向 span/600。","x":"Beams carrying plaster or other brittle finish Span/360","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","基礎"]},{"id":"STL-025","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"Steel Code Table 5.1 對樓宇層間相對側移（relative inter-storey drift）的限值是：","o":["Storey height/300","Storey height/400","Storey height/500","Storey height/1000"],"a":1,"e":"Table 5.1：頂層 drift Height/500；層間 drift storey height/400。幕牆及間隔要按此位移設計活動接駁。","x":"Relative inter-storey drift Storey height/400","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","中級"]},{"id":"STL-026","t":"mcq","d":2,"tp":"撓度 Deflection","c":"Table 5.1","p":67,"q":"組合樓板（composite slab）在 imposed load 下的豎向撓度限值是：","o":["Span/250","Span/350（≤20 mm）","Span/180（≤20 mm）","Span/360"],"a":1,"e":"Table 5.1(b)：imposed load span/350 且 ≤20 mm；總荷載 + 拆撐 − 自重 span/250。施工期壓型鋼板 span/180（≤20 mm，未計 ponding）。","x":"Due to imposed load Span/350 (but ≤20 mm)","doc":"steel-2011-2023ed","pp":"48","tags":["steel-2011-2023ed","撓度 Deflection","mcq","中級"]},{"id":"STL-027","t":"num","d":2,"tp":"風致振動 Wind vibration","c":"5.3.4","p":69,"q":"Steel Code：寫字樓/酒店在 10 年回歸期最惡劣 10 分鐘風況下的峰值加速度限值是多少 milli-g？","a":25,"tol":0,"u":"milli-g","e":"5.3.4(b)：住宅 15 milli-g、寫字樓/酒店 25 milli-g（≈0.15 及 0.25 m/s²，與 Concrete Code 7.3.2 一致）。","x":"Office building, Hotel 25","doc":"steel-2011-2023ed","pp":"50","tags":["steel-2011-2023ed","風致振動 Wind vibration","num","中級"]},{"id":"STL-028","t":"mcq","d":2,"tp":"框架分類 Frame classification","c":"6.3.2.2","p":74,"q":"以 deflection method 計算 λcr 時，notional horizontal force FN 一般取：","o":["0.5% FV","1.0% FV","1.5% Gk","2.5% FV"],"a":0,"e":"6.3.2.2：λcr = FN·h/(FV·δN)，FN 一般取 0.5% FV（factored dead + live）。λcr 決定 non-sway / sway / sway ultra-sensitive。","x":"FN is the notional horizontal force taken typically as 0.5% of FV for building","doc":"steel-2011-2023ed","pp":"55","tags":["steel-2011-2023ed","框架分類 Frame classification","mcq","中級"]},{"id":"STL-029","t":"short","d":3,"tp":"框架分類 Frame classification","c":"6.3.3–6.3.5","p":75,"q":"按 λcr 如何把框架分類為 non-sway、sway 及 sway ultra-sensitive？各有何分析要求？","m":"非 advanced analysis 時：λcr ≥ 10 為 non-sway（可忽略 P-Δ）；10 > λcr ≥ 5 為 sway（需考慮 P-Δ，例如 moment amplification 或二階分析）；λcr < 5 為 sway ultra-sensitive，只可用 second-order P-Δ-δ 或 advanced analysis。Advanced analysis 時 non-sway 門檻為 15。","k":["λcr ≥ 10 non-sway","5 ≤ λcr < 10 sway","λcr < 5 ultra-sensitive → 只可用 P-Δ-δ / advanced","advanced analysis 門檻 15"],"e":"高樓鋼框架或組合結構，ETABS buckling analysis 求 λcr 是常規步驟。Sway ultra-sensitive 不可用 effective length 法。","x":"A frame is classified as sway ultra-sensitive when","doc":"steel-2011-2023ed","pp":"56","tags":["steel-2011-2023ed","框架分類 Frame classification","short","進階"]},{"id":"STL-030","t":"num","d":2,"tp":"不完整性 Imperfections","c":"6.4.2","p":76,"q":"Frame analysis 中的等效初始側移（equivalent geometric imperfection）一般取層高 h 除以多少？","a":200,"tol":0,"u":"","e":"6.4.2：Δ = h/200，可代替 notional horizontal force；棚架等臨時工程取 h/100。","x":"For temporary works such as scaffolding, initial deformation should be taken as","doc":"steel-2011-2023ed","pp":"57","tags":["steel-2011-2023ed","不完整性 Imperfections","num","中級"]},{"id":"STL-031","t":"mcq","d":1,"tp":"截面分類 Section classification","c":"7.2","p":85,"q":"能達到 plastic moment capacity 但局部屈曲可能妨礙塑性鉸有足夠轉動能力的截面屬：","o":["Class 1 plastic","Class 2 compact","Class 3 semi-compact","Class 4 slender"],"a":1,"e":"7.2：Class 1 有塑性鉸轉動能力；Class 2 有 Mp 但轉動不足；Class 3 只達邊緣屈服；Class 4 須考慮局部屈曲。塑性分析只可用 Class 1。","x":"Cross-sections with plastic moment capacity. The plastic moment capacity can be","doc":"steel-2011-2023ed","pp":"66","tags":["steel-2011-2023ed","截面分類 Section classification","mcq","基礎"]},{"id":"STL-032","t":"num","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"Table 7.1：軋製（rolled）I 截面翼緣外伸部分受彎壓，Class 2 compact 的 b/T 限值為多少 ε？","a":10,"tol":0,"u":"ε","e":"Rolled flange outstand：Class 1 9ε、Class 2 10ε、Class 3 15ε；welded 8ε/9ε/13ε。ε = √(275/py)。S355 的 ε ≈ 0.88。","x":"element due to section","doc":"steel-2011-2023ed","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","num","中級"]},{"id":"STL-033","t":"mcq","d":2,"tp":"截面分類 Section classification","c":"Table 7.1","p":87,"q":"I 截面腹板，中性軸在中間深度（純彎），Class 1 plastic 的 d/t 限值為：","o":["40ε","80ε","100ε","120ε"],"a":1,"e":"Table 7.1：web neutral axis at mid-depth 80ε / 100ε / 120ε。有軸壓時限值按 r1 降低。","x":"Web of an I-, Neutral axis at mid-depth d/t 80ε 100ε 120ε","doc":"steel-2011-2023ed","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","mcq","中級"]},{"id":"STL-034","t":"num","d":2,"tp":"受約束樑 Restrained beams","c":"8.2","p":95,"q":"要假設樑受壓翼緣有 full lateral restraint，約束力應為受壓翼緣最大力的多少 %？","a":2.5,"tol":0,"u":"%","e":"8.2：2.5% 受壓翼緣力（或 squash load）。樓板與鋼樑之間要有 shear studs 或可靠連接；施工期間未有樓板時未必受約束。","x":"flange of the member, or more simply 2.5% of the squash load of the compression flange.","doc":"steel-2011-2023ed","pp":"76","tags":["steel-2011-2023ed","受約束樑 Restrained beams","num","中級"]},{"id":"STL-035","t":"mcq","d":1,"tp":"受約束樑 Restrained beams","c":"8.2.1","p":95,"q":"軋製 I、H 截面的 shear area Av 是：","o":["td","tD","0.9A","2td"],"a":1,"e":"8.2.1：軋製 I/H/槽鋼 Av = tD；焊接 I = td；RHS 2td；CHS 0.6A。Vc = py·Av/√3。常見錯誤是把 rolled 截面用 td 而低估剪力容量，或焊接截面誤用 tD。","x":"Rolled I, H and channels sections tD","doc":"steel-2011-2023ed","pp":"76","tags":["steel-2011-2023ed","受約束樑 Restrained beams","mcq","基礎"]},{"id":"STL-036","t":"mcq","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"Low shear（V ≤ 0.6Vc）情況下 Class 1/2 截面的 moment capacity Mc 是：","o":["py·Z","py·S ≤ 1.2py·Z","py·Seff","1.5py·Z"],"a":1,"e":"8.2.2.1：Mc = py·S ≤ 1.2py·Z（1.2 限制防止 SLS 下屈服）；Class 3 = py·Z；Class 4 = py·Zeff。V > 0.6Vc 時用 high shear 公式扣減 Sv。","x":"The following equations should be used when the design shear force V is not larger than","doc":"steel-2011-2023ed","pp":"77","tags":["steel-2011-2023ed","受約束樑 Restrained beams","mcq","中級"]},{"id":"STL-037","t":"tf","d":3,"tp":"受約束樑 Restrained beams","c":"8.2.2.1","p":96,"q":"使用高強度鋼（Class 1H）時可以採用 Class 4 slender 截面。","a":false,"e":"錯。8.2.2.1：高強度鋼不允許使用 Class 4 截面；超高強度鋼不允許用 plastic modulus。","x":"When high strength steel is used, the use of a Class 4 slender section is not permitted.","doc":"steel-2011-2023ed","pp":"77","tags":["steel-2011-2023ed","受約束樑 Restrained beams","tf","進階"]},{"id":"STL-038","t":"num","d":2,"tp":"受約束樑 Restrained beams","c":"8.2.2.2","p":97,"q":"熱軋截面腹板 d/t 大於多少時，moment capacity 要考慮 shear buckling？","a":70,"tol":0,"u":"","e":"8.2.2.2：熱軋截面 d/t > 70、焊接截面 > 62 時，要按 8.4.6 考慮 shear buckling。大部分熱軋 UB 不超過，但深而薄腹的焊接板樑（plate girder）要特別檢核。","x":"welded sections, the moment capacity should allow for shear buckling as given in","doc":"steel-2011-2023ed","pp":"78","tags":["steel-2011-2023ed","受約束樑 Restrained beams","num","中級"]},{"id":"STL-039","t":"mcq","d":3,"tp":"樑開孔 Web openings","c":"8.2.3.1.1","p":97,"q":"樑腹板無加強圓孔毋須用淨截面設計的條件之一，是孔沿樑軸的間距不少於孔徑的：","o":["1.5 倍","2.0 倍","2.5 倍","3.0 倍"],"a":2,"e":"8.2.3.1.1：Class 1/2 截面、對稱、孔在中間 1/3 深度及中間 1/2 跨度、間距 ≥2.5D、距集中荷載 ≥ 樑深、點荷載剪力 ≤10% Vc 及最大剪力 ≤50% Vc。機電穿孔常見。","x":"The spacing of openings along the member longitudinal axis is not less than 2.5","doc":"steel-2011-2023ed","pp":"78","tags":["steel-2011-2023ed","樑開孔 Web openings","mcq","進階"]},{"id":"STL-040","t":"mcq","d":3,"tp":"側扭屈曲 LTB","c":"Table 8.1","p":101,"q":"懸臂樑支座為 continuous with lateral restraint to top flange、懸臂端 free、normal loading，LE 是：","o":["1.0L","2.0L","3.0L","7.5L"],"a":2,"e":"Table 8.1 情況 (a)(1)：3.0L，destabilizing load 7.5L。支座及端部加約束可大幅降低 LE。懸臂鋼簷篷常犯錯是用 1.0L。","x":"lateral restraint to top 2) Lateral restraint to 2.7L 7.5L","doc":"steel-2011-2023ed","pp":"82","tags":["steel-2011-2023ed","側扭屈曲 LTB","mcq","進階"]},{"id":"STL-041","t":"tf","d":2,"tp":"側扭屈曲 LTB","c":"8.3.5.1","p":102,"q":"繞弱軸（minor axis）受彎的構件不需檢核 lateral-torsional buckling。","a":true,"e":"對。8.3.5.1：minor axis bending、CHS/SHS/圓或方實心截面、RHS 在 Table 8.2 限值內、λLT 小於 Table 8.3 限值，都不需檢核 LTB。","x":"Lateral-torsional buckling need not be checked in the following cases:","doc":"steel-2011-2023ed","pp":"83","tags":["steel-2011-2023ed","側扭屈曲 LTB","tf","中級"]},{"id":"STL-042","t":"num","d":2,"tp":"受壓構件 Compression","c":"Table 8.6","p":145,"q":"Table 8.6：兩端轉動固定、平移固定（fixed-fixed）的柱，建議 K 值（ideal conditions approximated）是多少？","a":0.7,"tol":0,"u":"","e":"Table 8.6 建議 K：0.70（固定-固定）、0.85（固定-鉸）、1.00（鉸-鉸）、1.20 / 2.10（可側移）。理論值 0.5 不建議直接使用，因實際難完全固定。","x":"0.70 0.85 1.20 1.00 2.10 1.5","doc":"steel-2011-2023ed","pp":"126","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-043","t":"num","d":2,"tp":"受壓構件 Compression","c":"8.7.3","p":145,"q":"Positional restraint 須能抵抗被約束構件軸力的多少 %？","a":1,"tol":0,"u":"%","e":"8.7.3：≥1% 軸力；同時約束多根構件時乘 kr = 0.2 + 1/Nr。屋頂系桿、柱間支撐設計常用。","x":"prevent significant lateral displacement and adequate strength to resist a minimum of 1%","doc":"steel-2011-2023ed","pp":"126","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-044","t":"num","d":2,"tp":"受壓構件 Compression","c":"8.7.6","p":146,"q":"焊接 I、H 或箱形截面計算 pc 時，py 要先減多少 N/mm²？","a":20,"tol":0,"u":"N/mm²","e":"8.7.6：焊接截面殘餘應力較大，py 減 20 N/mm² 再查 strut curve。","x":"For welded I, H or box sections, py should be reduced by 20 N/mm2 and pc should then","doc":"steel-2011-2023ed","pp":"127","tags":["steel-2011-2023ed","受壓構件 Compression","num","中級"]},{"id":"STL-045","t":"mcq","d":2,"tp":"受壓構件 Compression","c":"Table 8.7","p":147,"q":"軋製 H 截面（厚度 ≤ 40 mm）繞 y-y 軸屈曲應用哪條 strut curve？","o":["a","b","c","d"],"a":2,"e":"Table 8.7：rolled H ≤40 mm x-x b)、y-y c)；>40 mm x-x c)、y-y d)。熱軋空心截面 a)（≥S460 為 a0）；冷成型空心截面 c)。","x":"Rolled H-section","doc":"steel-2011-2023ed","pp":"128","tags":["steel-2011-2023ed","受壓構件 Compression","mcq","中級"]},{"id":"STL-046","t":"num","d":1,"tp":"焊接 Welds","c":"Table 9.1","p":196,"q":"較厚部件厚度為 14–19 mm 時，角焊縫最小焊腳（leg length）是多少 mm？","a":6,"tol":0,"u":"mm","e":"Table 9.1：≤6 mm 3；7–13 mm 5；14–19 mm 6；>19 mm 8。避免厚板熱量快速散失造成冷裂。","x":"7 to 13 5 14 to 19 6 over 19 8","doc":"steel-2011-2023ed","pp":"177","tags":["steel-2011-2023ed","焊接 Welds","num","基礎"]},{"id":"STL-047","t":"num","d":2,"tp":"焊接 Welds","c":"9.2.5.1.3","p":196,"q":"角焊縫有效長度不應少於多少 mm（亦不少於 4s），否則不可用作承重？","a":40,"tol":0,"u":"mm","e":"9.2.5.1.3：有效長度 = 全長 − 2s（不計端部回焊），不少於 40 mm；<4s 或 40 mm 不承重。端部回焊 ≥2s（9.2.5.1.4）。","x":"excluded, but should not be less than 40 mm. A fillet weld with an effective length less than","doc":"steel-2011-2023ed","pp":"177","tags":["steel-2011-2023ed","焊接 Welds","num","中級"]},{"id":"STL-048","t":"tf","d":2,"tp":"焊接 Welds","c":"9.2.5.1.5","p":198,"q":"單面角焊縫或部分熔透對接焊可以用來傳遞繞焊縫縱軸的彎矩。","a":false,"e":"錯。9.2.5.1.5：single sided fillet 或 partial penetration butt weld 不應用於傳遞繞焊縫縱軸彎矩。兩種不同等級母材以較低等級設計。","x":"Single sided fillet or partial penetration butt welds should not be used to transmit a bending","doc":"steel-2011-2023ed","pp":"179","tags":["steel-2011-2023ed","焊接 Welds","tf","中級"]},{"id":"STL-049","t":"num","d":1,"tp":"螺栓 Bolts","c":"9.3.1.1","p":202,"q":"沿受力方向的螺栓中心距不應少於螺栓直徑 d 的多少倍？","a":2.5,"tol":0,"u":"d","e":"9.3.1.1：沿受力方向 ≥2.5d；垂直方向一般 3d（承壓 ≤2/3 Pbb 時可減至 2.5d）；最大間距 min(12t, 150 mm)。","x":"less than 2.5d, where d is the nominal diameter of the bolts. This spacing can be","doc":"steel-2011-2023ed","pp":"183","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-050","t":"num","d":2,"tp":"螺栓 Bolts","c":"Table 9.3","p":202,"q":"M20 螺栓在剪切或手工火焰切割邊（sheared and hand flame cut edge）的最小端距/邊距是多少 mm？","a":34,"tol":0,"u":"mm","e":"Table 9.3：M20 剪切邊 34 mm、軋製/機械氣割邊 26 mm；M27 以上 1.75d / 1.25d。最大 11tε；高腐蝕環境 ≤40 + 4t。","x":"M20 34 26 M22 38 28","doc":"steel-2011-2023ed","pp":"183","tags":["steel-2011-2023ed","螺栓 Bolts","num","中級"]},{"id":"STL-051","t":"num","d":1,"tp":"螺栓 Bolts","c":"Table 9.4","p":203,"q":"M20 螺栓的標準孔（standard hole）直徑是多少 mm？","a":22,"tol":0,"u":"mm","e":"Table 9.4：M12–M24 標準孔 d+2（M20 = 22 mm）；M27 以上 d+3。Oversize 孔要相應增加間距及邊距。","x":"Standard hole Oversize hole Short slot hole Long slot hole","doc":"steel-2011-2023ed","pp":"184","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-052","t":"num","d":1,"tp":"螺栓 Bolts","c":"Table 9.5","p":206,"q":"ISO 8.8 級螺栓的 design shear strength ps 是多少 N/mm²？","a":375,"tol":0,"u":"N/mm²","e":"Table 9.5：4.6 160、8.8 375、10.9 400；bearing（Table 9.6）8.8 為 1000 N/mm²。螺紋在剪切面等情況要按 9.3.6.1.4–6 折減。","x":"ISO 4.6 160 6.8 240 8.8 375","doc":"steel-2011-2023ed","pp":"187","tags":["steel-2011-2023ed","螺栓 Bolts","num","基礎"]},{"id":"STL-053","t":"num","d":2,"tp":"螺栓 Bolts","c":"Table 9.6","p":206,"q":"ISO 8.8 級螺栓的 design bearing strength pbb 是多少 N/mm²？","a":1000,"tol":0,"u":"N/mm²","e":"Pbb = d·tp·pbb；8.8 級 1000 N/mm²；亦須檢核連接板承壓（9.3.6.1.3）。","x":"ISO 4.6 460 6.8 900 8.8 1000","doc":"steel-2011-2023ed","pp":"187","ta γ1 load variation","γ2 reduced probability of combination","γ3 calculation inaccuracy","Code uses single γf"],"e":"理解 γf 的組成有助判斷何時可調整（例如 temporary works 不應隨意降低）。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"allows for variation of loads from their characteristic (i.e. assumed","doc":"steel-explanatory-materials-2011","pp":"27","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","short","進階"]},{"id":"SEM-002","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.1","p":33,"q":"EM E4.1：ultimate design strength py 以 yield stress 取值，但上限為 ultimate tensile strength 除以多少？","a":1.2,"tol":0,"u":"","e":"py = Ys/γm1（γm1=1.0）但 ≤ Us/1.2（γm2=1.2）。高屈強比鋼材會由 Us/1.2 控制。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"stress. This is limited to a maximum value of the ultimate tensile strength divided by 1.2.","doc":"steel-explanatory-materials-2011","pp":"27","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-003","t":"mcq","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM E4.2.1：來源已知並經測試合格的 Class 2 steel，材料系數 γm1 / γm2 為？","o":["1.1 / 1.3","1.0 / 1.2","1.2 / 1.4","1.0 / 1.3"],"a":0,"e":"Class 1/1H：1.0/1.2；Class 2（經測試）：1.1/1.3；Class 3（來源不明）py 限 170 N/mm² 且只用於次要構件。使用內地或其他來源鋼材時必須先確認 class。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Class 2 steel from a known source may be tested and if found to comply may also be","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","mcq","中級"]},{"id":"SEM-004","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.1","p":34,"q":"EM：Class 3 steel（來源不明）用於次要構件時 design strength py 上限？","a":170,"tol":0,"u":"N/mm²","e":"Class 3 不建議使用；僅在失效後果有限的 minor elements 並限 py = 170 N/mm²。舊鋼再用、遺失 mill certificate 屬此類。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"of failure are limited. Then, their design strength py is limited to 170 N/mm2.","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-005","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.2.4","p":34,"q":"EM 指出 base plate grout 的 Young's modulus 在缺乏資料時可取同等 cube strength 混凝土的約 1/3。","a":true,"e":"正確。Grout 全為水泥漿，E 值明顯較低；材料系數則與同 fcu 混凝土相同。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"In the absence of more accurate information, a value of around 1/3 that of","doc":"steel-explanatory-materials-2011","pp":"28","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","tf","中級"]},{"id":"SEM-006","t":"tf","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"檢核空泳池抗浮時，池內水壓的有利 load factor 應取 0。","a":true,"e":"正確。有利水壓 γf 取 0.0；池外地下水取最大。這與 Foundations Code 的 uplift/抗浮檢核概念一致。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Clearly, the beneficial load factor for water pressure should be taken as 0.0, for example","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","tf","中級"]},{"id":"SEM-007","t":"mcq","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.1","p":35,"q":"EM E4.3.1：Code 對 differential settlement 的 load factor 在 load combinations 1、2 及 3 分別取？","o":["1.4、1.4、1.2","1.2、1.2、1.2","1.0、1.0、1.0","1.4、1.2、1.0"],"a":0,"e":"EM 解釋理論上 1.2 較合邏輯，但 Code 採 1.4（comb 1、2）及 1.2（comb 3）。Concrete Code 對 temperature 取 1.0、differential settlement 1.4。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"deformations. However, the Code uses a value of 1.4 for differential settlements in load","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","mcq","進階"]},{"id":"SEM-008","t":"num","d":2,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.4","p":35,"q":"EM E4.3.4：temporary works 的任何 adverse load factor（包括 wind）不應少於多少？","a":1.2,"tol":0,"u":"","e":"臨時工程倒塌常見原因：手工差、偏心支撐、舊鋼、腳手架承托墊不足。不可因設計年期短而隨意降低荷載系數。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"load factor be less than 1.2. This includes load factors for wind loads, in which the actual","doc":"steel-explanatory-materials-2011","pp":"29","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","num","中級"]},{"id":"SEM-009","t":"scenario","d":3,"tp":"荷載及材料系數 Load & material factors","c":"E4.3.5","p":36,"q":"檢核一幢鋼結構在 exceptional event（例如車輛撞擊或移除一條柱）下的 load combination，EM 如何解釋 live/wind 系數 0.35 的來源？","m":"近代規範（Concrete Code 2.3.1.5、BS 5950 2.4.5.3）共識：整體最低 partial load factor 1.05，且同時出現的 live/wind 約為 characteristic 的 1/3，故 1.05 × 0.33 ≈ 0.35。Exceptional load 本身視作 ultimate，γf = 1.0；移除構件情況則無 extreme event load。Explosion pressure 可取 34 kN/m²。","k":["1.05 × 1/3 = 0.35","exceptional load γf 1.0","key element removal → no extreme load","34 kN/m² explosion"],"e":"Cross-check Concrete Code 2.3.1.5 的 accidental combination；兩本 Code 的邏輯一致。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"load factor of 1.05 and likely live and wind loads of 1/3 of characteristic. Thus, a live or","doc":"steel-explanatory-materials-2011","pp":"30","tags":["steel-explanatory-materials-2011","荷載及材料系數 Load & material factors","scenario","進階"]},{"id":"SEM-010","t":"num","d":2,"tp":"使用極限狀態 Serviceability","c":"E4.3.7","p":36,"q":"EM 指出 Code 2.4.1 容許 live 與 wind 組合計算撓度時使用的 serviceability load factor？","a":0.8,"tol":0,"u":"","e":"例如屋面樑撓度；RE 亦可按判斷採用 1.0 以外的 SLS 系數以反映實況。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"Code allows a serviceability load factor of 0.8 when considering deflections from live and","doc":"steel-explanatory-materials-2011","pp":"30","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","num","中級"]},{"id":"SEM-011","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":37,"q":"EM 解釋 Code 5.3.4 舒適度準則採用 peak acceleration 的 return period 為？","o":["10 年","1 年","50 年","100 年"],"a":0,"e":"10 年回歸期（與 JGJ3-2002 及加拿大 NBC 1995 一致），10 分鐘時距（ISO 6897）。Peak 比 RMS 更能反映人體感受。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"The 10-year return period has been used as this is consistent with the Chinese","doc":"steel-explanatory-materials-2011","pp":"31","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","mcq","中級"]},{"id":"SEM-012","t":"mcq","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":38,"q":"EM 提供估算建築物最低自然頻率的 rule of thumb？","o":["f0 = 46/H","f0 = 1/(0.1N)","f0 = 100/H","f0 = H/46"],"a":0,"e":"H 為建築物高度（m）。此估算可用於初步判斷是否 wind sensitive；最終應以結構分析為準。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"f0=46/H, where H is the height of the building in metres.","doc":"steel-explanatory-materials-2011","pp":"32","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","mcq","中級"]},{"id":"SEM-013","t":"short","d":2,"tp":"使用極限狀態 Serviceability","c":"E5.3.4","p":38,"q":"Code 5.3.4 容許哪三種方法處理高樓 serviceability 及舒適度？","m":"(1) 限制頂部撓度 H/500 及層間位移 storey height/400；(2) 進行動力計算的 serviceability 分析證明符合 (a)(b) 的限值（可配合風洞）；(3) 全面 performance-based design，舒適度準則由業主與設計者協定。","k":["H/500 and h/400","dynamic analysis","performance based design"],"e":"H/500 在 Wind Code 設計風荷載下通常已足夠，但 RSE 仍須逐案考慮。Concrete Code 7.3.2 亦有 H/500。【版本提示】Explanatory Materials 為 2011 年版 Code 而寫，現行為 2023 Edition，數值及條文編號須以現行 Code 核對。","x":"The first is to limit the top deflection to Height/500 and the inter storey drift to Storey","doc":"steel-explanatory-materials-2011","pp":"32","tags":["steel-explanatory-materials-2011","使用極限狀態 Serviceability","short","中級"]},{"id":"WND-040","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1 Note (c)","p":34,"q":"Table 4-1 附註容許在 0.5(H − Hd) 高度以下將外牆壓力減少 20%。","a":true,"e":"因 Qz 取建築頂部，低層外牆可用此附註折減 20%。幕牆計算書常漏用或錯用（例如用 0.5H 而忽略 Hd）。","x":"(c) Cladding pressures can be reduced by 20%, below a height of","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","tf","中級"]},{"id":"WND-041","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.3","p":44,"q":"地形風洞試驗（topography model）最少需要多少個風向？","a":18,"tol":0,"u":"","e":"地形試驗至少 18 個方向（每 20°）；建築荷載試驗則至少 36 個方向（每 10°）。","x":"A minimum of 18 wind directions at 20o intervals is necessary.","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-042","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.5","p":44,"q":"一般指引：建築風洞模型比例通常不應小於？","o":["1:100","1:200","1:500","1:1000"],"a":2,"e":"模型不小於 1:500，且尖角模型的 Reynolds number 不少於 1×10^4；圓形模型需額外證明。","x":"A general guide is that the building model should normally be not","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","mcq","進階"]},{"id":"WND-043","t":"mcq","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1.7","p":45,"q":"Built-up terrain 中，風洞配對風壓的 matching height Z 應取？","o":["建築高度","上風周邊高度以上 150 m 或 2/3 建築高度，取較大","2/3 建築高度","500 m"],"a":1,"e":"開闊地形取 2/3 建築高度；市區取周邊有效高度以上 150 m 與 2/3H 的較大值；中間情況兩者都要考慮。審核風洞報告時必須檢查配對方法。","x":"(full-scale) above the height of upwind surroundings (the effective","doc":"wind-code-2019","pp":"35","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","mcq","進階"]},{"id":"WND-044","t":"num","d":2,"tp":"風洞試驗 Wind tunnel testing","c":"6.3","p":46,"q":"風洞試驗外牆荷載：典型板件 half-perimeter 2–5 m，以一小時內百分之幾不超越機率取值？","a":80,"tol":0,"u":"%","e":"外牆荷載以 80% non-exceedance 為目標；內壓亦須由量度所得外壓推算。","x":"sizes, for example half-perimeter length of 2m to 5m, with an 80%","doc":"wind-code-2019","pp":"36","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","中級"]},{"id":"WND-045","t":"mcq","d":3,"tp":"外牆壓力 Cladding pressure","c":"Table B1-1","p":62,"q":"Table B1-1（有 dominant opening）：外牆邊區 Zone A 的 external pressure coefficient Cpe？","o":["−1.4","−1.2","−1.0","−0.8"],"a":1,"e":"有大開口時分開計外壓 Cpe 與內壓 Cpi；外牆邊區 Cpe −1.2、一般區 −0.8、正壓 +0.8。","x":"Negative pressure A -1.2 in edge zone","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","mcq","進階"]},{"id":"WND-046","t":"num","d":3,"tp":"阻尼 Damping","c":"Table C2-2","p":74,"q":"Table C2-2：高寬比 ≥8 的鋼結構建築，計算加速度的 damping ratio？","a":0.005,"tol":0,"u":"","e":"鋼結構阻尼約為 RC 的一半；composite 結構取中間值。","x":"0.005 0.008 7 0.006 0.009","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","num","進階"]},{"id":"WND-047","t":"tf","d":2,"tp":"阻尼 Damping","c":"Appendix C2","p":74,"q":"共用平台上的塔樓，計算阻尼用 aspect ratio 時亦須以平台以上高度檢查。","a":true,"e":"有退台或共用平台時，aspect ratio 要按平台/退台以上部分另行檢查並取最大值，否則會高估阻尼。","x":"slabs shall be similarly checked above podium level.","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","tf","中級"]},{"id":"WND-048","t":"num","d":2,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1.1","p":62,"q":"計算 Atot 時，洩漏（leakage）取其他外表面總面積的百分之幾？","a":0.1,"tol":0,"u":"%","e":"0.1% leakage 是預設值，有理據可用其他數值。","x":"leakage contribution to 𝐴𝐴𝑡𝑡𝑜𝑜𝑡𝑡 is defined as 0.1% of the","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","中級"]},{"id":"WND-001","t":"mcq","d":1,"tp":"適用範圍 Scope","c":"1.1","p":11,"q":"Wind Code 2019 的 Standard Method 適用於一般建築物的高度上限是多少？","o":["100 m","150 m","200 m","250 m"],"a":2,"e":"Standard Method 只涵蓋典型建築至 200 m；超過 200 m 必須做 wind tunnel test。實務上 190 m 左右的住宅塔樓已要預早考慮風洞試驗的時間表和費用，唔好等到 BD 提意見先做。","x":"The Standard Method is applicable to typical buildings with a height","doc":"wind-code-2019","pp":"1","tags":["wind-code-2019","適用範圍 Scope","mcq","基礎"]},{"id":"WND-002","t":"short","d":2,"tp":"適用範圍 Scope","c":"1.1","p":11,"q":"列出 Wind Code 2019 要求進行 wind tunnel testing 的情況（至少四項）。","m":"(a) 高度超過 200 m；(b) 形狀特殊/不尋常；(c) 地形或周邊環境複雜；(d) 按規範計算的 across-wind 彎矩遠大於 along-wind（見 2.2.3）；(e) B/D 大於 6（除非可忽略扭轉工況）。","k":["H > 200 m","unusual shape","complicated topography/surroundings","across-wind >> along-wind","B/D > 6"],"e":"呢幾個觸發條件係 BD 審圖時最常問嘅位置。高度以外，最易忽略嘅係 plan aspect ratio B/D>6 同 across-wind 放大系數超過 1.5；兩者都會令 Standard Method 唔再適用。設計初期就應該檢查，避免結構方案定咗先發現要重做。","x":"buildings with B/D>6, except for those satisfying the","doc":"wind-code-2019","pp":"1","tags":["wind-code-2019","適用範圍 Scope","short","中級"]},{"id":"WND-003","t":"num","d":1,"tp":"荷載組合 Load combination","c":"2.3","p":20,"q":"Wind Code 2019 公式中採用的 ultimate wind load factor γw 取值是多少？","a":1.4,"tol":0,"u":"","e":"規範在公式中保留 γw = 1.4，與 CoP Concrete/Steel 的 1.4 wind partial factor 一致。計 across-wind base moment 時要用 factored wind speed 再除返 γw，唔好重複乘 1.4。","x":"ultimate wind load factor, taken as 1.4","doc":"wind-code-2019","pp":"10","tags":["wind-code-2019","荷載組合 Load combination","num","基礎"]},{"id":"WND-004","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"計算扭轉荷載時，當 B/D ≤ 1，偏心距 e 取多少？","o":["±0.05B","±0.10B","±0.15B","±0.20B"],"a":0,"e":"方形平面 e = ±0.05B，B/D=6 時增至 ±0.20B，中間線性內插。長條形平面（例如板式住宅）扭轉效應明顯大，唔好沿用舊 2004 Code 的做法。","x":"geometric centre of area by a horizontal distance given by:","doc":"wind-code-2019","pp":"8","tags":["wind-code-2019","扭轉 Torsion","mcq","中級"]},{"id":"WND-005","t":"num","d":2,"tp":"扭轉 Torsion","c":"2.2.2","p":18,"q":"B/D = 6 時，扭轉偏心距 e 為 ±?B（填係數）","a":0.2,"tol":0.001,"u":"B","e":"B/D=6 時偏心 0.20B 係上限；B/D 大過 6 已超出 Standard Method 範圍，需要風洞試驗（除非扭轉工況可忽略）。","x":"Use linear interpolation for intermediate values of","doc":"wind-code-2019","pp":"8","tags":["wind-code-2019","扭轉 Torsion","num","中級"]},{"id":"WND-006","t":"tf","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"高度少於 100 m、各方向 H/B 少於 5、fundamental frequency 大於 0.5 Hz 的建築，可視為滿足 across-wind 檢查要求。","a":true,"e":"呢個係一般中低層建築免計 across-wind 嘅捷徑。注意三個條件要同時滿足；頻率唔好用經驗公式亂估，2023 年 EN 修訂亦補充咗多塔共用平台時點樣取頻率。","x":"Buildings with height less than 100 m, with","doc":"wind-code-2019","pp":"9","tags":["wind-code-2019","Across-wind","tf","中級"]},{"id":"WND-007","t":"num","d":2,"tp":"Across-wind","c":"2.2.3","p":19,"q":"免除 across-wind 檢查的條件之一：fundamental frequency 必須大於多少 Hz？","a":0.5,"tol":0,"u":"Hz","e":"0.5 Hz 即週期 2 秒。高而柔嘅塔樓頻率往往低過 0.5 Hz，就要按 2.2.3 計 across-wind base moment。","x":"than 5, and with fundamental frequencies greater than 0.5 Hz, will","doc":"wind-code-2019","pp":"9","tags":["wind-code-2019","Across-wind","num","中級"]},{"id":"WND-008","t":"num","d":3,"tp":"Across-wind","c":"2.2.3","p":21,"q":"若 across-wind 與 along-wind base moment 之比（放大系數）超過多少，必須進行 wind tunnel testing？","a":1.5,"tol":0,"u":"","e":"比值不超過 1.5 時可將 along-wind 荷載放大至與 across-wind 相同 base moment；超過 1.5 表示渦流脫落效應顯著，規範要求風洞試驗。Explanatory Notes 有實例（271/190=1.43<1.5）。","x":"1.5, then wind tunnel testing must be conducted.","doc":"wind-code-2019","pp":"11","tags":["wind-code-2019","Across-wind","num","進階"]},{"id":"WND-009","t":"mcq","d":2,"tp":"荷載組合 Load combination","c":"2.2.4 / Table 2-1","p":22,"q":"Table 2-1 Case 1 的 load combination factors（Wx、Wy、ΔTz）是？","o":["±1.00, ±0.55, ±0.55","±1.00, ±0.50, ±0.50","±1.00, ±0.75, ±0.75","±1.00, ±1.00, ±0.55"],"a":0,"e":"三個 case 輪流以其中一個分量取 1.00、其餘取 0.55，連正負號共 24 個組合。ETABS 模型要逐個 load case 設定，常見錯誤係漏咗負號組合或者扭轉未作用喺 centre-of-area。","x":"1 ±1.00 ±0.55 ±0.55 2 ±0.55 ±1.00 ±0.55","doc":"wind-code-2019","pp":"12","tags":["wind-code-2019","荷載組合 Load combination","mcq","中級"]},{"id":"WND-010","t":"tf","d":2,"tp":"荷載組合 Load combination","c":"2.2.4","p":22,"q":"每層的風荷載合力必須作用於該層的 centre-of-area（可隨高度變化）。","a":true,"e":"風荷載作用點係 centre-of-area，唔係 centre of mass 或 centre of rigidity。電腦模型要自己定義每層加載點，否則扭轉效應會錯。","x":"The resultant of loads at each level must act through the centre-of-area","doc":"wind-code-2019","pp":"12","tags":["wind-code-2019","荷載組合 Load combination","tf","中級"]},{"id":"WND-011","t":"mcq","d":2,"tp":"扭轉 Torsion","c":"2.2.4","p":23,"q":"以下哪種建築 NOT 屬於可正式忽略扭轉荷載工況的情況？","o":["單層、高度不超過 10 m 的建築","高度不超過 70 m、周邊設有側向抗力結構的建築","通過 torsional regularity check 的建築","高度 120 m、核心筒居中但周邊無抗側力構件的建築"],"a":3,"e":"規範列出三類可忽略扭轉：單層≤10 m、≤70 m 周邊抗側力、通過 torsional regularity check（扭轉引起層間位移 <25% 側向）。核心筒居中但無周邊牆柱的高樓扭轉剛度弱，一定要計。","x":"buildings of up to 70 m height with a peripheral lateral load","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","mcq","中級"]},{"id":"WND-012","t":"num","d":3,"tp":"扭轉 Torsion","c":"2.2.4(c)","p":23,"q":"Torsional regularity check：扭轉荷載引起的最大層間位移須少於側向荷載引起者的百分之幾？","a":25,"tol":0,"u":"%","e":"通過 25% 檢查可忽略扭轉工況；若不大於 50%，可省略 Table 2-1 Case 3（主要扭轉）組合，由 24 個減至 16 個。","x":"less than 25% of that due to the lateral load","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","num","進階"]},{"id":"WND-013","t":"num","d":3,"tp":"扭轉 Torsion","c":"2.2.4(d)","p":23,"q":"若扭轉層間位移不大於側向位移的百分之幾，Table 2-1 Case 3 無需計算？","a":50,"tol":0,"u":"%","e":"介乎 25% 至 50% 之間屬中度扭轉，只可省略 Case 3，Case 1、2 內嘅 0.55 扭轉分量仍要計。","x":"greater than 50% of the lateral drift, the Case 3 in Table 2-1","doc":"wind-code-2019","pp":"13","tags":["wind-code-2019","扭轉 Torsion","num","進階"]},{"id":"WND-014","t":"short","d":2,"tp":"外牆壓力 Cladding pressure","c":"2.3","p":24,"q":"說明 Wind Code 2019 計算封閉建築外牆淨風壓 P 的公式，以及有 dominant opening 時如何處理。","m":"封閉建築：P = Qz·Cp·Ss（Qz 取建築頂部參考風壓、Cp 為淨壓力系數、Ss 為尺寸系數）。有 dominant opening 時須分開計算外壓與內壓，P = Pe − Pi（見 Appendix B1）。","k":["P = Qz Cp Ss","Qz at top of building","dominant opening: P = Pe − Pi","Appendix B1"],"e":"幕牆顧問常問 Qz 取邊個高度：2019 版改為取建築頂部，唔係構件所在高度，同 2004 Code 唔同。有大開口（例如停車場、平台開放層）時唔可以直接用淨壓力系數。","x":"are determined from the difference between pressures on opposite","doc":"wind-code-2019","pp":"14","tags":["wind-code-2019","外牆壓力 Cladding pressure","short","中級"]},{"id":"WND-015","t":"tf","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"非住用、使用期不超過一年的臨時建築，可按永久建築設計風荷載的最少 70% 設計。","a":true,"e":"70% 只適用於非住用且使用期≤1年；超過一年或有人居住就要用全額。地盤辦公室若會留兩三年，就唔可以用呢個折減。","x":"period of not more than one year, may be designed for a minimum of","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","臨時結構 Temporary structures","tf","基礎"]},{"id":"WND-016","t":"num","d":1,"tp":"臨時結構 Temporary structures","c":"2.5","p":26,"q":"地盤圍板（hoarding）、有蓋行人通道、工人棚等：Qz 取 Qo,z 的百分之幾？","a":37,"tol":0,"u":"%","e":"37% Qo,z 且不再乘其他調整系數。2023 年 EN 修訂更提供了 hoarding/covered walkway 的全包淨壓力表（≤2.5 m 0.63 kPa），實務上更方便。","x":"is taken as 37% of","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","臨時結構 Temporary structures","num","基礎"]},{"id":"WND-017","t":"num","d":2,"tp":"加速度 Acceleration","c":"2.4.1","p":26,"q":"若無模態分析比較，計算建築頂部四分之一高度內加速度時 ηy 可取多少？","a":1.5,"tol":0,"u":"","e":"ηy 係模態形狀修正；頂部四分一高度保守取 1.5。住宅塔樓舒適度檢查通常睇頂層，唔好漏乘。","x":"be 1.5 for calculation of accelerations within the top quarter","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","加速度 Acceleration","num","中級"]},{"id":"WND-018","t":"tf","d":2,"tp":"加速度 Acceleration","c":"2.4.2","p":26,"q":"Occupant comfort 只需檢查 10 年回歸期的 peak acceleration。","a":false,"e":"規範要求 1 年及 10 年回歸期的 peak acceleration 都低於 Figure 2-6 限值。按 EN 解釋，用 code method 時兩者比例固定（3.67），實際只需檢查一個；但風洞試驗兩個都要檢查。","x":"The occupant comfort is considered acceptable if the 1-year and","doc":"wind-code-2019","pp":"16","tags":["wind-code-2019","加速度 Acceleration","tf","中級"]},{"id":"WND-019","t":"mcq","d":1,"tp":"參考風壓 Reference pressure","c":"3.2 / Table 3-1","p":27,"q":"Table 3-1：有效高度 100 m 的 Qo,z 是多少 kPa？","o":["2.56","2.73","2.86","3.05"],"a":2,"e":"Qo,z 由 3.7(Ze/500)^0.16 得出，100 m 為 2.86 kPa。記住幾個錨點（10 m 1.98、50 m 2.56、100 m 2.86、200 m 3.20）方便快速估算和審核計算書。","x":"75 2.73 100 2.86 150 3.05","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","mcq","基礎"]},{"id":"WND-020","t":"num","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 200 m 的 Qo,z（kPa）？","a":3.2,"tol":0.005,"u":"kPa","e":"200 m 為 3.20 kPa，也是 Standard Method 適用高度上限附近的數值。","x":"150 3.05 200 3.20 250 3.31","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","num","基礎"]},{"id":"WND-021","t":"num","d":1,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1：有效高度 ≤2.5 m 的 Qo,z（kPa）？","a":1.59,"tol":0.005,"u":"kPa","e":"低矮構築物（圍板、小型構築物）以 1.59 kPa 為下限，再按 2.5 臨時結構規定折減。","x":"2.5 1.59 5 1.77 10 1.98","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","num","基礎"]},{"id":"WND-022","t":"tf","d":2,"tp":"參考風壓 Reference pressure","c":"Table 3-1","p":27,"q":"Table 3-1 提供有效高度超過 500 m 的 Qo,z 數值。","a":false,"e":"超過 500 m 規範寫明 Seek specialist advice；實際上 >200 m 已必須做風洞試驗。","x":"Seek specialist advice","doc":"wind-code-2019","pp":"17","tags":["wind-code-2019","參考風壓 Reference pressure","tf","中級"]},{"id":"WND-023","t":"tf","d":2,"tp":"有效高度 Effective height","c":"3.3","p":28,"q":"計算參考風壓時，有效高度 Ze 可保守地取實際高度。","a":true,"e":"Ze 可按 Appendix A2 考慮周邊建築遮擋而降低，但保守可直接取實際高度。用遮擋折減時要確保周邊建築係長期存在，否則有風險。","x":"may conservatively be taken as the actual height","doc":"wind-code-2019","pp":"18","tags":["wind-code-2019","有效高度 Effective height","tf","中級"]},{"id":"WND-024","t":"num","d":2,"tp":"力系數 Force coefficient","c":"4.2","p":29,"q":"圓形平面、高度/直徑比不大於 6 的建築，force coefficient 可取多少？","a":0.75,"tol":0,"u":"","e":"圓形平面 Cf 明顯低於矩形，但方向系數 Sθ 要取 1（見 Appendix A1）。","x":"diameter ratio not larger than 6 can be taken as 0.75.","doc":"wind-code-2019","pp":"19","tags":["wind-code-2019","力系數 Force coefficient","num","中級"]},{"id":"WND-025","t":"tf","d":3,"tp":"力系數 Force coefficient","c":"4.2","p":31,"q":"影響少於建築高度 10% 的平面退台（plan steps）可在計算 Cf 時忽略。","a":true,"e":"頂層小退台或冠頂位置不必另計 Cf；但大幅退台就要分段處理。","x":"Steps in plan size affecting less than 10% of","doc":"wind-code-2019","pp":"21","tags":["wind-code-2019","力系數 Force coefficient","tf","進階"]},{"id":"WND-026","t":"mcq","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：平屋頂角區（Zone C）的 net pressure coefficient 是？","o":["−1.0","−1.6","−2.2","−1.4"],"a":2,"e":"屋頂角位 −2.2、邊位 −1.6、中間 −1.0；外牆邊位 −1.4。屋面防水層、天台設備及 parapet 固定要按角區吸力設計，常被低估。","x":"Negative pressure in C -2.2 corner zone","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","mcq","中級"]},{"id":"WND-027","t":"num","d":2,"tp":"外牆壓力 Cladding pressure","c":"Table 4-1","p":34,"q":"Table 4-1：外牆邊區（Zone A）的負 net pressure coefficient（填負值）？","a":-1.4,"tol":0,"u":"","e":"外牆邊區 −1.4、一般區 −1.0、正壓 +1.1。幕牆角位玻璃和鋁框要用 −1.4，再乘尺寸系數 Ss。","x":"Negative pressure in A -1.4 edge zone","doc":"wind-code-2019","pp":"24","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","中級"]},{"id":"WND-028","t":"mcq","d":3,"tp":"開放框架 Open framework","c":"Table 4-2","p":39,"q":"Table 4-2：solidity ratio 0.5 的 open-framework 構件其系數是？","o":["1.5","1.6","1.8","2.0"],"a":0,"e":"solidity ratio 0.5–0.8 取最低 1.5，極稀或實心 (0.01/1.0) 取 2.0。棚架、鐵塔、天線支架常用。","x":"0.3 1.6 0.5 1.5","doc":"wind-code-2019","pp":"29","tags":["wind-code-2019","開放框架 Open framework","mcq","進階"]},{"id":"WND-029","t":"num","d":2,"tp":"尺寸及動力系數 Size & dynamic factor","c":"5.1","p":42,"q":"高度少於多少 m 的建築可用簡化 Sq = 1.1Ss？","a":50,"tol":0,"u":"m","e":"低於 50 m 的建築動力效應不顯著，可簡化；高樓要按完整 Sq,z 公式計算，包括 fundamental frequency 和 damping。","x":"For buildings of less than 50m height, the following simplified","doc":"wind-code-2019","pp":"32","tags":["wind-code-2019","尺寸及動力系數 Size & dynamic factor","num","中級"]},{"id":"WND-030","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":44,"q":"風洞試驗中周邊建築模型（proximity model）的半徑一般不少於多少 m？","a":400,"tol":0,"u":"m","e":"proximity model 半徑≥400 m 並至少 36 個風向（每 10°）。審核風洞報告時要檢查呢兩項。","x":"less than 400m radius from the site.","doc":"wind-code-2019","pp":"34","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-031","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.1","p":45,"q":"風洞阻塞率（blockage）一般不應超過百分之幾？","a":10,"tol":0,"u":"%","e":"阻塞過大會令風速和壓力失真，需修正或改用較小比例模型。","x":"testing should not normally be allowed to exceed 10%, including","doc":"wind-code-2019","pp":"35","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-032","t":"num","d":3,"tp":"風洞試驗 Wind tunnel testing","c":"6.4","p":46,"q":"新建築以風洞試驗設計時，最少須抵抗 Standard Method 荷載的百分之幾（一般情況）？","a":80,"tol":0,"u":"%","e":"風洞結果低過 Standard Method 80% 都要取 80%；做 building removal investigation 可放寬至 along-wind 的 70%。2023 年 EN 修訂澄清比較應以 total base moment 形式進行。","x":"New buildings should resist a minimum of 80% of the load of the","doc":"wind-code-2019","pp":"36","tags":["wind-code-2019","風洞試驗 Wind tunnel testing","num","進階"]},{"id":"WND-033","t":"mcq","d":2,"tp":"方向系數 Directionality","c":"Appendix A1 / Table A1-1","p":50,"q":"Table A1-1 中哪個風向的 Sθ 最低？","o":["N (0.82)","NW (0.80)","W (0.82)","NE (0.84)"],"a":1,"e":"NW 0.80 最低，E/SE/S 0.85 最高。使用時要取該 90° 扇區內最大 Sθ；圓形建築必須取 1。","x":"SW 0.84 W 0.82 NW 0.80","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","方向系數 Directionality","mcq","中級"]},{"id":"WND-034","t":"tf","d":2,"tp":"方向系數 Directionality","c":"Appendix A1","p":50,"q":"圓形平面建築可按 Table A1-1 採用方向系數 Sθ 折減。","a":false,"e":"圓形建築任何風向反應相同，規範要求 Sθ = 1。","x":"The directionality factor does not apply to circular buildings.","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","方向系數 Directionality","tf","中級"]},{"id":"WND-035","t":"num","d":2,"tp":"加速度 Acceleration","c":"Table A1-2","p":50,"q":"Table A1-2：10 年回歸期的 return period factor on pressure Sr？","a":0.55,"tol":0,"u":"","e":"1 年 0.25、10 年 0.55，用於舒適度加速度計算。Explanatory Notes 指出按 NBCC 方法，10 年與 1 年加速度比約為 √(0.55/0.25) 的 3.3 次方 ≈ 3.67，所以用 code method 時只需檢查一個回歸期。","x":"return period factors in Table A1-2.","doc":"wind-code-2019","pp":"A1","tags":["wind-code-2019","加速度 Acceleration","num","中級"]},{"id":"WND-036","t":"scenario","d":3,"tp":"有效高度 Effective height","c":"Appendix A2","p":51,"q":"設計一幢 60 m 住宅，上風方向 150 m 內有兩幢 80 m 舊樓。你想用 direct shelter 降低 Ze。說明規範的要點及限制。","m":"按 Appendix A2：Ze = max(Z − Hd, 0.25Z)，Hd = min(0.8Ho, 1.2Ho − 0.2Xo, 0.75H)；只考慮 Xo < 6H 的建築；只有一幢遮擋建築時不得考慮遮擋，兩幢或以上時採用第二有效的遮擋建築；扇區至少分 4 份。","k":["Ze = max(Z−Hd, 0.25Z)","Hd limits incl. 0.75H","Xo < 6H","≥2 obstructing buildings, use 2nd most sheltering","conservatively use actual height"],"e":"遮擋折減係雙刃劍：舊樓重建後風荷載會增加。資深做法係只喺周邊建築穩定（例如政府建築）時才用，並喺計算書清楚列明假設。","x":"If there is only one obstructing building, no sheltering effect is","doc":"wind-code-2019","pp":"A2","tags":["wind-code-2019","有效高度 Effective height","scenario","進階"]},{"id":"WND-037","t":"num","d":3,"tp":"外牆壓力 Cladding pressure","c":"Appendix B1","p":62,"q":"Appendix B1：開口面積 Ao 大於其他面總開口的多少倍時，被視為 dominant opening？","a":1.5,"tol":0,"u":"倍","e":"Ao > 1.5Atot 即屬 dominant opening，要分開計內外壓。EN 修訂把 accidental dominant open 情況改寫為「非強制要求」。","x":"Sum of areas of openings on other faces, including leakage.","doc":"wind-code-2019","pp":"B1","tags":["wind-code-2019","外牆壓力 Cladding pressure","num","進階"]},{"id":"WND-038","t":"mcq","d":3,"tp":"阻尼 Damping","c":"Appendix C2 / Table C2-1","p":74,"q":"Table C2-1：高寬比 ≥8 的 RC 建築，計算加速度及荷載的 damping ratio 分別為？","o":["0.010 / 0.015","0.020 / 0.030","0.015 / 0.020","0.013 / 0.020"],"a":0,"e":"越細長 damping 越低；計加速度用較低值，計強度荷載用較高值。用錯（例如兩者都用 0.02）會低估塔樓反應。","x":"0.010 0.015 7 0.011 0.017","doc":"wind-code-2019","pp":"C2","tags":["wind-code-2019","阻尼 Damping","mcq","進階"]},{"id":"WEN-001","t":"mcq","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"根據 Explanatory Notes，Code 的參考風壓配合 1.4 wind load factor 使用時，ULS 風荷載被校準為相當於多少年回歸期？","o":["至少 50 年","至少 200 年","至少 1,000–1,500 年","至少 10,000 年"],"a":2,"e":"Code 本身的 Qo,z 係「未乘系數」的參考風壓，乘 γw 1.4 之後大約對應 1,000–1,500 年回歸期。了解呢點有助向業主或審批方解釋點解唔可以隨意減 γw。","x":"of at least 1,000-1,500 year return which is consistent with the level of","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","mcq","中級"]},{"id":"WEN-002","t":"num","d":3,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes：Code 參考風壓相當於開放海面風暴、在 500 m 參考高度的平均風速為多少 m/s？","a":59.5,"tol":0.1,"u":"m/s","e":"59.5 m/s @500 m 係 Qo,z 公式背後的風速假設，風洞試驗配對風壓（Equation 6-2）時亦以此為基礎。","x":"59.5 m/s at reference height of 500m.","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","num","進階"]},{"id":"WEN-003","t":"tf","d":2,"tp":"背景 Background","c":"EN 3.1","p":22,"q":"Explanatory Notes 指出，3.7 peak factor 實際上約對應 3 秒平均風速。","a":false,"e":"最新研究顯示 3.7 peak factor 約對應 0.35 秒平均，而非傳統理解的 3 秒陣風；但這不影響結構或外牆風荷載的計算，主要影響 size factor 和風洞量度。","x":"peak factor actually corresponds to about 0.35s-average. However,","doc":"wind-explanatory-notes-2019","pp":"14","tags":["wind-explanatory-notes-2019","背景 Background","tf","中級"]},{"id":"WEN-004","t":"num","d":3,"tp":"有效高度 Effective height","c":"EN 3.3","p":23,"q":"有效高度不得少於參考高度的 25%，這把設計風壓的折減限制在百分之幾以內？","a":20,"tol":0,"u":"%","e":"0.25^0.16 ≈ 0.8，即遮擋最多減 20% 風壓。BS 6399-2 用 40% 下限是基於 urban exposure，同樣相當於 0.8。","x":"limits the reduction of design pressure to 20% using the open-sea","doc":"wind-explanatory-notes-2019","pp":"15","tags":["wind-explanatory-notes-2019","有效高度 Effective height","num","進階"]},{"id":"WEN-005","t":"short","d":3,"tp":"有效高度 Effective height","c":"EN 3.3","p":23,"q":"為何 Explanatory Notes 提醒：低矮建築靠近高樓時，有效高度規則未必保守？應如何處理？","m":"高樓底部附近會出現加速風（accelerated wind speeds），有效高度規則未能反映；可按 BS EN（Clause A.4）或其他國際標準評估，或以風洞試驗處理。","k":["accelerated wind near base of tall buildings","effective height not necessarily conservative","BS EN Clause A.4 / other standards","wind tunnel testing"],"e":"典型例子是高樓旁的平台、有蓋行人道或低層幕牆。唔好因為周邊有高樓就當係遮擋而減風壓，反而可能要加。","x":"values and the effect of possible accelerated wind flow due to the","doc":"wind-explanatory-notes-2019","pp":"15","tags":["wind-explanatory-notes-2019","有效高度 Effective height","short","進階"]},{"id":"WEN-006","t":"mcq","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC across-wind 方法原本校準的 B/D 範圍是？","o":["0.5 < B/D < 2","0.25 < B/D < 4","1 < B/D < 6","B/D < 1"],"a":0,"e":"NBCC 原校準範圍 0.5<B/D<2；EN 指出經驗顯示可合理延伸至約 1:4 或 4:1，超出後視乎扭轉重要性可能需要風洞試驗。","x":"Based on more recent experience of wind tunnel testing, the use of the","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","mcq","進階"]},{"id":"WEN-007","t":"num","d":3,"tp":"Across-wind","c":"EN 2.2.3","p":14,"q":"NBCC 方法的 across-wind base moment 與風速的幾次方成正比？","a":3.3,"tol":0,"u":"","e":"風壓與風速平方成正比，但 across-wind 彎矩約與風速 3.3 次方成正比，所以規範直接用 factored wind speed 計算 ultimate across-wind moment 再除 γw，而唔係將 service 值乘 1.4。","x":"methodology is proportional to wind speed to the power of 3.3 rather","doc":"wind-explanatory-notes-2019","pp":"6","tags":["wind-explanatory-notes-2019","Across-wind","num","進階"]},{"id":"WEN-008","t":"scenario","d":3,"tp":"Across-wind","c":"EN 2.2.3 example","p":15,"q":"某塔樓 WX1 方向：along-wind 彎矩 WX1+ 190、WX1− 161；WX2 方向 across-wind 彎矩分別為 207 及 271（NMm）。判斷是否需風洞試驗，並計 WX1− 的 along-wind 放大系數。","m":"max(207,271)/max(190,161) = 271/190 = 1.43 < 1.5，毋須風洞試驗，可用 Standard Method。WX1− 放大系數 = 271/161 = 1.68，把 WX1− along-wind 荷載放大 1.68 倍。","k":["判斷用 max across / max along","1.43 < 1.5 → Standard Method","放大系數逐個方向計","WX1−: 271/161 = 1.68"],"e":"常見錯誤係用同一方向 +/− 的最大值去判斷後，就以為放大系數一律 1.43；其實每個 load direction 要各自計，較細的 along-wind 方向放大得更多（1.68）。","x":"(a) WX1: (207,271)max/ (190,161)max=271/190=1.43 < 1.5","doc":"wind-explanatory-notes-2019","pp":"7","tags":["wind-explanatory-notes-2019","Across-wind","scenario","進階"]},{"id":"WEN-009","t":"num","d":2,"tp":"荷載組合 Load combination","c":"EN 2.2.4","p":16,"q":"Code 的 envelope parameters 產生多少個 Fx、Fy、Mz 荷載組合？","a":24,"tol":0,"u":"","e":"3 個 case × 8 個正負號組合 = 24。完全忽略扭轉可減至 8 個；只省略 Case 3 則 16 個。","x":"in 24 combinations of the 3 basic load cases for the lateral and","doc":"wind-explanatory-notes-2019","pp":"8","tags":["wind-explanatory-notes-2019","荷載組合 Load combination","num","中級"]},{"id":"WEN-010","t":"tf","d":2,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":18,"q":"建築若符合規範可忽略扭轉荷載的條件，即表示該建築不存在扭轉風荷載。","a":false,"e":"EN 明確提醒：可在最終組合中忽略扭轉，不代表扭轉風荷載不存在；只是該類結構抗扭能力好，影響細。","x":"discussed in this section should not be taken to imply that torsional","doc":"wind-explanatory-notes-2019","pp":"10","tags":["wind-explanatory-notes-2019","扭轉 Torsion","tf","中級"]},{"id":"WEN-011","t":"mcq","d":3,"tp":"扭轉 Torsion","c":"EN 2.2.4","p":17,"q":"EN 指出，Bi-directional multi-bay moment frame 若有柱退台，退台距離（由柱中心量度）不應超過？","o":["3 m 或建築尺寸 1/20，取較小","5 m 或建築尺寸 1/10，取較小","5 m 或建築尺寸 1/10，取較大","10 m"],"a":1,"e":"符合此條件的框架可歸入 ≤70 m 周邊抗側力類別而忽略扭轉。審圖時要檢查退台距離是否超出 5 m / 1/10。","x":"structures can also be considered under this category; but in case","doc":"wind-explanatory-notes-2019","pp":"9","tags":["wind-explanatory-notes-2019","扭轉 Torsion","mcq","進階"]},{"id":"WEN-012","t":"tf","d":2,"tp":"外牆壓力 Cladding pressure","c":"EN 2.3.1","p":18,"q":"2019 Code 將外牆設計風壓 Qz 的參考高度改為建築頂部，而非構件實際標高（2004 Code 做法）。","a":true,"e":"與 BS 6399-2 及 BS EN 1991-1-4 一致，也與風洞結果相符。低層幕牆因此會比 2004 Code 大；Table 4-1 附註 (c) 容許 0.5(H−Hd) 以下減 20%。","x":"The reference height of design pressure, 𝑄𝑄𝑧𝑧 , is changed to the top of a","doc":"wind-explanatory-notes-2019","pp":"10","tags":["wind-explanatory-notes-2019","外牆壓力 Cladding pressure","tf","中級"]},{"id":"WEN-013","t":"num","d":2,"tp":"尺寸系數 Size factor","c":"EN 5.1","p":31,"q":"Size factor 取 1.0 時對應的 half-perimeter length 是多少 m？","a":15,"tol":0,"u":"m","e":"15 m 比歐洲做法大，反映香港颱風風速較高、壓力相關性較強。一般幕牆板尺寸小於 15 m，所以 Ss 通常大於 1.0。","x":"The choice of 15m for size factor of 1.0 is based on the increased wind","doc":"wind-explanatory-notes-2019","pp":"23","tags":["wind-explanatory-notes-2019","尺寸系數 Size factor","num","中級"]},{"id":"WEN-014","t":"tf","d":2,"tp":"加速度 Acceleration","c":"EN 2.4.2","p":20,"q":"採用風洞試驗時，只需檢查 1 年或 10 年其中一個回歸期的加速度。","a":false,"e":"用 code method 時兩者比例固定為 3.67，只需檢查一個；風洞試驗比例未必是 3.67，兩個回歸期都要檢查。","x":"With wind tunnel testing, both return periods should be checked,","doc":"wind-explanatory-notes-2019","pp":"12","tags":["wind-explanatory-notes-2019","加速度 Acceleration","tf","中級"]},{"id":"WEN-015","t":"short","d":2,"tp":"適用範圍 Scope","c":"EN 1.1","p":9,"q":"EN 如何解釋 Code 保留 γw = 1.4 於公式中，以及將來改為 γw = 1.0 的可能？","m":"ASCE 7-16 及 AS/NZS 1170.2 直接推導 ULS 荷載（約 2,000 年回歸）。Code 把現行 γw 1.4 寫入公式；原則上可將參考風壓乘 1.4 並用未來 γw 1.0 直接計 ULS，結果不變。","k":["ASCE/AS-NZS derive ULS directly","≈2,000 year return for important buildings","reference pressure × 1.4 with future γw 1.0","no change to ULS loads"],"e":"實務上要留意唔同規範混用：如果引用海外標準的 ULS 風速，就唔可以再乘 1.4。","x":"multiplied by the existing γw of 1.4 to enable direct calculation of ULS 1","p":9,"f":"樓面用途 Class 1–8 分別是？","b":"1 住宅；2 寫字樓等非工業；3 聚集；4 商店；5 儲存/機房/工業；6 車輛；7 天台；8 附屬構件。","e":"Table 3.1 Classification of Floor Uses。","x":"5 Floors for storage, equipment, plant and industrial use","doc":"dead-imposed-loads-2011-2021ed","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"DIL-F04","tp":"車輛荷載 Vehicular loads","c":"Table 3.3","p":13,"f":"Area Class 6A–6D 的車重上限？","b":"6A ≤3,000 kg；6B ≤5,500 kg；6C ≤24,000 kg；6D ≤30,000 kg；6E 其他（掛接式重型貨車）。","e":"消防車屬 6D。","x":"Areas accessible to vehicles not exceeding Light goods vehicles, light buses","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","flashcard"]},{"id":"DIL-F05","tp":"車輛荷載 Vehicular loads","c":"3.3.3","p":13,"f":"消防車通道額外集中荷載？","b":"230 kN 於 950 mm × 750 mm；100 kN 於 300 mm × 300 mm。","e":"EVA 板 punching 檢核。","x":"concentrated load of 100 kN uniformly distributed on plan over an area of 300 mm","doc":"dead-imposed-loads-2011-2021ed","pp":"9","tags":["dead-imposed-loads-2011-2021ed","車輛荷載 Vehicular loads","flashcard"]},{"id":"DIL-F06","tp":"天台荷載 Roofs","c":"3.4.4","p":16,"f":"屋架下弦、天花吊架等需承托人重時的集中荷載？","b":"1.5 kN，置於最不利位置，並與 Table 3.8 荷載一併考慮。","e":"Clause 3.4.4。","x":"of 1.5 kN acting at a position that will produce the most adverse effect","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","天台荷載 Roofs","flashcard"]},{"id":"DIL-F07","tp":"附屬構件 Class 8","c":"Table 3.9","p":16,"f":"冷氣機平台（air conditioner platforms）的設計荷載？","b":"1.5 kN/m 沿外緣施加的 line load（qk 欄為「-」）。","e":"Table 3.9 Class 8。","x":"upper slabs) and air conditioner","doc":"dead-imposed-loads-2011-2021ed","pp":"12","tags":["dead-imposed-loads-2011-2021ed","附屬構件 Class 8","flashcard"]},{"id":"DIL-F08","tp":"間隔牆 Partitions","c":"3.6.1","p":17,"f":"未定位置間隔牆的 imposed load？","b":"≥ 1/3 每米長牆重（以 kPa 計），寫字樓 ≥ 1 kPa。","e":"屬 imposed load，不可折減。","x":"not less than 1/3 of the weight per metre length of the partitions uniformly distributed per","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","間隔牆 Partitions","flashcard"]},{"id":"DIL-F09","tp":"荷載折減 Reduction","c":"Table 3.10","p":17,"f":"樑的 imposed load 最大折減？","b":"20%（樓面面積 ≥180 m²）；<45 m² 不折減亦不可內插。","e":"只用於該樑。","x":"135 15 180 20 maximum","doc":"dead-imposed-loads-2011-2021ed","pp":"13","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","flashcard"]},{"id":"DIL-F10","tp":"荷載折減 Reduction","c":"Table 3.11","p":18,"f":"柱的 imposed load 最大折減？","b":"40%（超過 8 層）。","e":"每層 +5%，1 層為 0。","x":"Over 8 40 maximum","doc":"dead-imposed-loads-2011-2021ed","pp":"14","tags":["dead-imposed-loads-2011-2021ed","荷載折減 Reduction","flashcard"]},{"id":"DIL-F11","tp":"護欄荷載 Barriers","c":"3.8.2.1","p":19,"f":"看台（grandstands）有座位時的人群水平荷載？","b":"沿座位行 0.35 kN/m 或垂直座位行 0.15 kN/m（不同時施加）；無座位平台 0.25 kPa。","e":"Clause 3.8.2.1。","x":"0.35 kN/m of seating along the line of seats; or","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","flashcard"]},{"id":"DIL-F12","tp":"車輛防撞欄 Vehicle barriers","c":"3.8.3.3","p":20,"f":"車撞力 F 的分布長度及位置？","b":"作用於 bumper height，垂直欄杆，均布於任何 1.5 m 長度。","e":"6A 600 mm；6B 800 mm；6C–6E 1200 mm。","x":"direction normal to and uniformly distributed over any length of 1.5 m of the barrier","doc":"dead-imposed-loads-2011-2021ed","pp":"16","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","flashcard"]},{"id":"DIL-F13","tp":"車輛防撞欄 Vehicle barriers","c":"Table 3.15","p":20,"f":"直斜坡底車撞力放大系數 γ？","b":"斜坡 <10 m：1.0；10–20 m 線性內插 1.0–2.0；>20 m：2.0。","e":"Table 3.15。","x":"10 - 20 Linear interpolation between 1.0 and 2.0","doc":"dead-imposed-loads-2011-2021ed","pp":"16","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","flashcard"]},{"id":"DIL-F14","tp":"擋土結構附加荷載 Surcharge","c":"Table 3.17","p":21,"f":"Table 3.17 最低 surcharge？","b":"公共道路 20 kPa；私家路 10 kPa；獨立行人路、單車徑、遊樂場 5 kPa。","e":"與 Geoguide 1 一致。","x":"Private Roads 10","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","flashcard"]},{"id":"DIL-F15","tp":"動力荷載 Dynamic","c":"3.10.1","p":21,"f":"Code 的 imposed loads 是否已包括動力效應？","b":"已包括輕微動力效應，但不包括人群有節奏同步活動或某些機器的特殊荷載。","e":"需要時參考專門文獻。","x":"The imposed loads given in this Code have allowed for small dynamic effects","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","動力荷載 Dynamic","flashcard"]},{"id":"DIL-F16","tp":"材料密度 Densities","c":"Appendix A","p":24,"f":"鋼（Steel）及泥土（Soil）密度？","b":"Steel 77.0 kN/m³；Soil 20 kN/m³。","e":"Appendix A 材料密度。","x":"Steel 77.0 Zinc 70.0","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","flashcard"]},{"id":"CON-001-FC","doc":"concrete-2013-2020ed","tp":"預應力 Prestressed","c":"2.2.4.4(b)","p":23,"f":"預應力混凝土 class 3 構件在非常侵蝕性環境（如海水）中，表面裂縫寬度不應超過：","b":"0.1 mm","e":"Class 1 無拉應力；class 2 有拉應力但無可見裂縫；class 3 容許裂縫：very aggressive 環境 ≤0.1 mm，其他 ≤0.2 mm。海旁 PT 構件應留意。","x":"0.1 mm for members in very aggressive environments (e.g. exposure to sea) and not exceeding","pp":"9","tags":["concrete-2013-2020ed","預應力 Prestressed","flashcard"]},{"id":"CON-003-FC","doc":"concrete-2013-2020ed","tp":"穩健性 Robustness","c":"2.3.1.4(a)","p":24,"f":"所有樓宇應能抵抗 notional horizontal load，其值為每層 characteristic dead weight 的百分之幾？","b":"1.5 %","e":"2.3.1.4(a)：每層同時施加 1.5% Gk 的 notional horizontal load；在 load combination 2 或 3 中，design ultimate wind load 不應小於此值。低層、背風或受遮擋建築要特別檢核這個下限。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-004-FC","doc":"concrete-2013-2020ed","tp":"穩健性 Robustness","c":"2.3.1.4(b)","p":24,"f":"Key element 及其連接應能承受任何方向的 design ultimate load 是多少 kN/m²（不另乘 partial safety factor）？","b":"34 kN/m²","e":"2.3.1.4(b)：34 kN/m²，施加於構件的 projected area，不乘 γf。用於 disproportionate collapse 設計中「key element」路線，例如 transfer column 不能以移除構件方式處理時。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","pp":"10","tags":["concrete-2013-2020ed","穩健性 Robustness","flashcard"]},{"id":"CON-005-FC","doc":"concrete-2013-2020ed","tp":"荷載 Loads","c":"2.3.1.5","p":24,"f":"考慮 exceptional loads（誤用或意外）時，一般寫字樓（非儲存用途）應計入多少 imposed load？","b":"三分之一","e":"2.3.1.5：dead load + 1/3 wind + imposed load（儲存/工業或永久性 imposed load 取 100%，其他樓宇取 1/3），並按 2.3.2.2 取 γf = 1.05。","x":"are permanent, 100% of the imposed load; for other buildings, one-third of the imposed load.","pp":"10","tags":["concrete-2013-2020ed","荷載 Loads","flashcard"]},{"id":"CON-008-FC","doc":"concrete-2013-2020ed","tp":"荷載組合 Load combinations","c":"2.3.2.2","p":25,"f":"評估 exceptional loads 或局部損毀後的持續穩定性時，γf 應取多少？","b":"1.05","e":"2.3.2.2：γf = 1.05；配合 2.4.3.2(b) γm：混凝土 1.3、鋼 1.0。用於 alternative load path（移除構件）分析。","x":"should be taken as 1.05 on the defined loads","pp":"11","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-009-FC","doc":"concrete-2013-2020ed","tp":"荷載組合 Load combinations","c":"2.3.2.6","p":26,"f":"豎向構件按車輛撞擊（vehicular impact）設計時，ULS 的 γf 應取多少？","b":"1.25","e":"2.3.2.6：γf 1.25；撞擊力按 Building (Construction) Regulation 17（2.3.1.4(d)）。停車場柱常見檢核。","x":"Where vertical elements are to be designed for vehicular impact γ at ULS should be 1.25.","pp":"12","tags":["concrete-2013-2020ed","荷載組合 Load combinations","flashcard"]},{"id":"CON-010-FC","doc":"concrete-2013-2020ed","tp":"防火 Fire","c":"Table 2.2","p":26,"f":"Fire limit state 下，一般區域（非走火梯、非永久）imposed load 的 γf 是：","b":"0.80（有充分理據可降至 0.50）","e":"Table 2.2：dead 1.00；永久 imposed（機器、儲存）1.00；走火梯及大堂 1.00；其他 0.80（可減至 0.50）；wind 0.33。Fire engineering 性能化設計時會用。","x":"Note: *The value may be reduced to 0.50 when suitable justification is available","pp":"12","tags":["concrete-2013-2020ed","防火 Fire","flashcard"]},{"id":"CON-011-FC","doc":"concrete-2013-2020ed","tp":"撓度 Deflection","c":"2.3.3.3","p":26,"f":"計算撓度時，一般住宅或寫字樓應把多少百分比的 imposed load 視為 permanent？","b":"25 %","e":"2.3.3.3：住宅/寫字樓 25%；儲存用途至少 75%。用於長期撓度（creep）計算，例如 transfer beam 或長跨板的 long-term deflection。","x":"occupancy, 25% of the imposed load should be considered as permanent and for structures used for","pp":"12","tags":["concrete-2013-2020ed","撓度 Deflection","flashcard"]},{"id":"CON-012-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"ULS 下 reinforcement 的 γm 是多少？","b":"1.15","e":"Table 2.3：鋼筋 1.15（FLS 1.00）；混凝土彎曲/軸力 1.50；無箍筋抗剪 1.25；bond 1.40。所以 fy/γm = 0.87fy。","x":"Reinforcement (prestressing steel included) 1.15 1.00","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-013-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"ULS 下無箍筋混凝土抗剪強度（concrete shear strength without shear reinforcement）的 γm 是多少？","b":"1.25","e":"1.25 已包含在 Table 6.3 vc 公式中（vc 除以 γm）。不要重複除。","x":"Concrete shear strength without shear 1.25 1.10","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-014-FC","doc":"concrete-2013-2020ed","tp":"材料係數 γm","c":"Table 2.3","p":27,"f":"Bond strength 的 ULS γm 是：","b":"1.40","e":"Bond strength γm = 1.40（FLS 1.10）。錨固長度及搭接長度表已包括此值。","x":"Bond strength 1.40 1.10","pp":"13","tags":["concrete-2013-2020ed","材料係數 γm","flashcard"]},{"id":"CON-016-FC","doc":"concrete-2013-2020ed","tp":"材料 Materials","c":"3.1.3","p":29,"f":"以正常重量骨料製造的鋼筋混凝土，最低應使用哪個強度等級？","b":"C20","e":"3.1.3：RC 最低 C20。但耐久性（Table 4.2）按 exposure condition 往往要求更高等級，如 moderate 需 C35 配 40 mm cover。","x":"For reinforced concrete the lowest grade that should be used is C20 for concrete made with normal","pp":"15","tags":["concrete-2013-2020ed","材料 Materials","flashcard"]},{"id":"DIL-003-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.1.2","p":6,"f":"水缸（tanks）及其儲水應如何分類？","b":"水缸重量屬 dead load，儲水屬 imposed load","e":"2.1.2：容器本身重量為 dead load，內容物為 imposed load。實務上天台水缸（roof tank）水重應按 imposed load 乘 γf=1.6，而且不應把它當永久荷載去抵抗 uplift 或 overturning。","x":"The weights of tanks and other receptacles shall be considered as dead loads. The contents of tanks and receptacles shall be considered as imposed loads.","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-005-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.2.2.2","p":6,"f":"建築圖則上未有顯示位置、但預計會有的 partitions，其重量應當作：","b":"Imposed load，按 clause 3.6 計算","e":"2.2.2.2：未在 building plans 顯示位置的間隔牆屬 imposed load（按 3.6 以 1/3 牆重/米計，office 不少於 1 kPa）。已顯示在核准圖則上的則屬 dead load（2.2.2.1）。","x":"Where partitions are envisaged but the location of which are not indicated on the building plans, the weights of these partitions shall be considered as imposed loads and to be calculated in accordance with clause 3.6.","pp":"2","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-007-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"恆載 Dead loads","c":"2.2.5.1","p":7,"f":"骨灰龕場的重型龕位（如混凝土龕位），重量不應少於每米高每米長多少 kN/m？","b":"4.5 kN/m per m height","e":"2.2.5.1：輕型龕位（木或輕金屬）≥2.0 kN/m 每米高，重型（混凝土）≥4.5 kN/m 每米高，另加骨灰甕重量。Columbaria 樓面走道（非龕位範圍）按 Table 3.2 取 4.0 kPa。","x":"For heavy weight niches, such as niches made of concrete, the weight shall be not less than 4.5 kN/m length for each metre height.","pp":"3","tags":["dead-imposed-loads-2011-2021ed","恆載 Dead loads","flashcard"]},{"id":"DIL-008-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"外加荷載 Imposed loads","c":"3.1.4","p":8,"f":"Table 3.2 中的 qk 與 Qk 應如何施加？","b":"分開考慮（considered separately），取最不利者","e":"3.1.3–3.1.4：qk 與 Qk 分開考慮，取較不利者。Qk 主要控制局部 punching / 薄板 / 短跨構件；常見錯誤是把 Qk 疊加在 qk 上，過度保守。","x":"The uniformly distributed load, qk, and the concentrated load or line load, Qk, shall be considered separately.","pp":"4","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"DIL-009-FC","doc":"dead-imposed-loads-2011-2021ed","tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"f":"Table 3.2：一般用途寫字樓（Offices for general use）的 qk 是多少 kPa？","b":"3.0 kPa","e":"Offices for general use：qk = 3.0 kPa，Qk = 4.5 kN。注意 office 內 storage/filing 用途要升至 5.0 kPa（Class 5），而且不可按 3.7 折減；另如間隔牆位置未定，須再加 ≥1 kPa。","x":"Offices for general use 3.0 4.5","pp":"5","tags":["dead-imposed-loads-2011-2021ed","外加荷載 Imposed loads","flashcard"]},{"id":"FIR-001-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"C4.1 / Table C1","p":87,"f":"Table C1：Use Classification 1 Residential 的 FRR 及 compartment 面積限制？","b":"60 min；不限","e":"住宅及酒店 60 分鐘、compartment 不限，但每個單位之間要以 fire barrier 分隔。結構工程師要確保所有 element of construction（柱、樑、樓板）達到 FRR 60 的保護層和尺寸。","x":"1. Residential Not limited 60","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-002-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Carparks 的 FRR（分鐘）？","b":"60 min","e":"停車場 60 分鐘、compartment ≤10,500 m²。注意停車場若在地庫則要按 C14 用 240 分鐘。","x":"7. Carparks Not exceeding 10,500m2 60","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-003-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Mercantile facilities（4b）compartment 面積超過 2,500 m² 但不超過 10,500 m² 時的 FRR？","b":"120 min","e":"商場類 ≤2,500 m² 為 60 分鐘，超過則 120 分鐘。平台商場設計時 compartment 劃分直接影響結構保護層及樓板厚度。","x":"Exceeding 2,500m2 but not 120","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FIR-004-FC","doc":"fire-safety-2011-2024ed","tp":"耐火等級 FRR","c":"Table C1","p":87,"f":"Table C1：Industrial workplaces（6a）的 FRR（分鐘）？","b":"120 min","e":"工業類全部 120 分鐘。舊工廈活化改建時要核實原有結構是否達標。","x":"6a. Industrial workplaces Not exceeding 10,500m2 120","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","flashcard"]},{"id":"FDN-001-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"2.2.1","p":17,"f":"Rational design method：一般對計算所得的 ultimate bearing capacity 採用多少的 factor of safety 求 allowable capacity？","b":"3","e":"FOS 3 是慣例，但規範容許按土石性質、場地變化及設計方法可靠性採用其他數值。提交時若用低於 3 要有充分理據（例如有載荷試驗）。","x":"Normally, the allowable capacity is estimated by applying a factor of safety of 3 to the","pp":"9","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-003-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"2.2.2(5)","p":18,"f":"小型或臨時構築物、平地上以粒狀材料為承托層的基腳，可採用的 presumed allowable vertical bearing pressure 為？","b":"乾 100 kPa／浸水 50 kPa","e":"適用於圍板、小型棚架等。注意只限平地及 granular materials；斜坡上或填土上不能直接套用。","x":"A presumed allowable vertical bearing pressure of 100 kPa (if dry) or 50 kPa","pp":"10","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-004-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Table 2.1：Category 1(a) 岩石（新鮮至輕微風化、強至極強花崗岩/火山岩，100% TCR，UCS ≥75 MPa）的 presumed allowable bearing pressure（kPa）？","b":"10000 kPa","e":"1(a) 10 000、1(b) 7 500、1(c) 5 000、1(d) 3 000 kPa。大直徑鑽孔樁常用 1(a)/1(b)，要以 5 m 的 TCR 證明及 PLI/UCS 試驗支持。","x":"Fresh to slightly decomposed strong to very strong 10 000","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-005-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 1(b) 岩石要求的 TCR of the designated grade 及 UCS 分別是？","b":"≥95% TCR、UCS ≥50 MPa","e":"1(b)：≥95% TCR，UCS ≥50 MPa（或 PLI50 ≥2 MPa），允許 7 500 kPa。鑽探報告的 core run TCR 與 designated grade TCR 定義不同，別混淆。","x":"better, and with not less than 95% TCR of the","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-006-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 1(c) 岩石的 presumed allowable bearing pressure（kPa）？","b":"5000 kPa","e":"1(c)：Grade III 或更好、≥85% TCR、UCS ≥25 MPa。也是 rock socket bond 700 kPa 的門檻類別。","x":"Slightly to moderately decomposed moderately 5 000","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"FDN-007-FC","doc":"foundations-2017-2024ed","tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"f":"Category 3 intermediate soil（SPT N ≥200 的 HDG/CDG）的 presumed allowable bearing pressure（kPa）？","b":"1000 kPa","e":"N ≥200 的風化土可用 1 000 kPa，常見於 driven H-pile 或 bored pile 以土承托的情況，並可視為滿足 30 mm 沉降準則（2.3.2）。","x":"or better, with SPT N-value ≥ 200.","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","flashcard"]},{"id":"GLS-001-FC","doc":"glass-2018","tp":"極限狀態 Limit state","c":"2.2.3","p":14,"f":"Glass Code 2.2.3：單一構件失效時，玻璃結構可能倒塌的部分不應超過多少 m²？","b":"70 m²","e":"防止連續倒塌（例如玻璃柱失效導致玻璃樑及玻璃地台倒塌）。大型玻璃天幕要劃分結構，確保單件失效影響 ≤70 m²。","x":"of collapse should not exceed 70 m (floor, frontal or total area), due to the failure of one","pp":"6","tags":["glass-2018","極限狀態 Limit state","flashcard"]},{"id":"GLS-002-FC","doc":"glass-2018","tp":"荷載 Loads","c":"3.4","p":15,"f":"直接受陽光照射的 tinted glass 表面，設計溫度範圍是？","b":"0–90°C","e":"不受直射 0–40°C；直射透明玻璃 0–50°C；有色玻璃 0–90°C。有色玻璃熱應力大，要檢查 thermal breakage，常需熱處理玻璃。","x":"glass and 0-90°C for tinted glass.","pp":"7","tags":["glass-2018","荷載 Loads","flashcard"]},{"id":"GLS-003-FC","doc":"glass-2018","tp":"荷載 Loads","c":"3.5","p":15,"f":"Glass Code 的 short-term load duration 定義為？","b":"不多於 3 秒（如風荷載、欄杆水平活載）","e":"Short ≤3 s；Medium 3 s–1 天（維修荷載、溫度）；Long >1 天（自重等）。不同歷時對應 Table 4.4 的強度折減。","x":"(1) Short-term load duration is defined as the duration of load applying not more than","pp":"7","tags":["glass-2018","荷載 Loads","flashcard"]},{"id":"PRC-001-FC","doc":"precast-2016","tp":"穩定 Stability","c":"2.3.1","p":12,"f":"若風荷載不控制，預製結構穩定性應以每層多少百分比 characteristic dead load 的 notional horizontal force 檢查？","b":"1.5 %","e":"與 Concrete Code 的 1.5% notional load 一致。預製結構多為鉸接，側向穩定靠剪力牆及樓板橫隔作用，所以 tie 設計特別重要。","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","pp":"4","tags":["precast-2016","穩定 Stability","flashcard"]},{"id":"PRC-003-FC","doc":"precast-2016","tp":"荷載 Loadings","c":"2.5.1","p":14,"f":"預製結構設計的最小施工荷載（construction load）是？","b":"1.5 kN/m²","e":"半預製樓板（semi-precast slab）在澆注面層前要承受自重加 1.5 kN/m² 施工荷載，常是控制工況。Bracing 設計亦用 1.5 kN/m²。","x":"construction loads. A minimum load of 1.5 kN/m² should be used. However, due","pp":"6","tags":["precast-2016","荷載 Loadings","flashcard"]},{"id":"PRC-004-FC","doc":"precast-2016","tp":"荷載 Loadings","c":"Table 2.1","p":15,"f":"Table 2.1：平板、有可拆側模、無成形凹槽、smooth mould（只用 form oil）的 demoulding 等效荷載系數？","b":"1.3","e":"脫模時模板吸力/黏附力以自重乘系數考慮；雕塑形 smooth 1.7 最高。只用於構件抗彎設計，吊點另按 Table 2.4。","x":"Flat with removable side forms. No formed","pp":"7","tags":["precast-2016","荷載 Loadings","flashcard"]},{"id":"SEC-006-FC","doc":"steel-2011-2023ed","tp":"截面分類 Section classification","c":"Steel Code Table 7.1","p":87,"f":"HK Steel Code Table 7.1：I/H 截面 web（neutral axis at mid-depth）的 Class 1 / 2 / 3 d/t 限值？","b":"80ε / 100ε / 120ε","e":"Web 受彎 80ε/100ε/120ε；rolled flange outstand 9ε/10ε/15ε；internal element 28ε/32ε/40ε。配合截面表的 d/t 欄可即時分類。","x":"Neutral axis at mid-depth d/t 80ε 100ε 120ε","pp":"68","tags":["steel-2011-2023ed","截面分類 Section classification","flashcard"]},{"id":"STL-001-FC","doc":"steel-2011-2023ed","tp":"極限狀態 Limit states","c":"Table 2.1","p":38,"f":"按 Steel Code Table 2.1，以下哪一項屬 serviceability limit state？","b":"Human induced vibration","e":"Table 2.1：SLS 包括 deflection、human induced vibration、wind induced vibration、durability；brittle fracture、fatigue、fire、穩定屬 ULS。","x":"Stability against overturning, sliding, uplift and Human induced vibration","pp":"19","tags":["steel-2011-2023ed","極限狀態 Limit states","flashcard"]},{"id":"STL-004-FC","doc":"steel-2011-2023ed","tp":"疲勞 Fatigue","c":"2.3.3.4","p":41,"f":"疲勞評估時，按 Steel Code 設計的建築物 design working life 取多少年？","b":"50 年","e":"2.3.3.4(a)：建築物 50 年；道路/橋樑一般 120 年。Miner's rule Σni/Ni ≤ 1.0。","x":"designed to the Code the design working life is 50 years and for road/bridge this","pp":"22","tags":["steel-2011-2023ed","疲勞 Fatigue","flashcard"]},{"id":"STL-005-FC","doc":"steel-2011-2023ed","tp":"穩健性 Robustness","c":"2.3.4.3","p":43,"f":"作為水平 tie 的鋼構件及其端部連接，須能抵抗的最少 factored tensile load 是多少 kN？","b":"75 kN","e":"2.3.4.3(a)：≥75 kN，毋須與其他荷載疊加。Internal tie = 0.5(1.4Gk+1.6Qk)stL；edge tie = 0.25(...)stL，均不少於 75 kN。常見錯誤：簡支樑端 fin plate 連接未檢核 tie force。","x":"capable of resisting a factored tensile load not less than 75kN, which need not be","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","flashcard"]},{"id":"STL-006-FC","doc":"steel-2011-2023ed","tp":"穩健性 Robustness","c":"2.3.4.3(b)","p":43,"f":"錨固邊柱（edge columns）的水平 tie 須抵抗以下哪個值的最大者？","b":"Tie force、75 kN 或柱荷載 1%","e":"2.3.4.3(b)：max(tie force, 75 kN, 1% 柱上/下最大 factored dead + imposed load)，垂直於邊緣作用。（Concrete Code 外柱為 3%，兩本 Code 數值不同，要分清。）","x":"calculated in (a) above, 75 kN or 1% of the maximum factored dead and imposed","pp":"24","tags":["steel-2011-2023ed","穩健性 Robustness","flashcard"]},{"id":"STL-008-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.3","p":46,"f":"Steel Code 規定 load combinations 2 和 3 的最小 unfactored wind load 不應少於 unfactored dead load 的多少 %？","b":"1.0 %","e":"2.5.3：≥1.0% Gk（每層按該層重量計）。Concrete Code 則以 1.5% Gk 作 design ultimate 下限，兩者定義不同（unfactored vs ultimate）。","x":"The minimum unfactored wind load should not be less than 1.0% of unfactored dead load","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","flashcard"]},{"id":"STL-009-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.6","p":46,"f":"設計溫度效應時，Steel Code 假設香港平均溫度變化範圍為：","b":"+0.1°C 至 +40.0°C","e":"2.5.6：+0.1°C 至 +40.0°C；受陽光直射構件（如幕牆支架）按 13.3.4.3 取更高溫度。長鋼屋頂及預應力拉桿系統特別敏感。","x":"varies from +0.1ºC to +40.0ºC. The actual range, however, depends on the location, type","pp":"27","tags":["steel-2011-2023ed","荷載 Loading","flashcard"]},{"id":"STL-010-FC","doc":"steel-2011-2023ed","tp":"荷載 Loading","c":"2.5.8","p":47,"f":"一般結構的 notional horizontal force 最少為 factored dead and imposed loads 的多少 %？","b":"0.5 %","e":"2.5.8：0.5%（或 0.5 kN/m² 側壓，取較大），用於 load combination 1，毋須再乘 γf；臨時工程及 sway ultra-sensitive 結構用 1.0% 或 1.0 kN/m²。計算 overturning 時不需施加。","x":"should be capable of resisting notional horizontal forces with a
