<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dde3ea;--pri:#0f2740;--acc:#f2b134;--ok:#1e8e4e;--okbg:#e5f5ec;--bad:#c0392b;--badbg:#fbeae8;--warn:#9a6700;--warnbg:#fff6dd;--link:#1a5fb4;--r:14px;--shadow:0 1px 3px rgba(15,39,64,.08),0 4px 14px rgba(15,39,64,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0d141c;--card:#16212d;--ink:#e6edf3;--mute:#9aa8b6;--line:#2a3746;--pri:#0f2740;--okbg:#12311f;--badbg:#3a1714;--warnbg:#3a2e0c;--warn:#f2c14e;--link:#7fb0ff;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;min-height:52px}
.topbar h1{flex:1;font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom));outline:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:12px;color:var(--mute);text-decoration:none}
.tabbar a span{font-size:20px;line-height:1.1}
.tabbar a.on{color:var(--pri);font-weight:700}
@media (prefers-color-scheme:dark){.tabbar a.on{color:var(--acc)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat small{color:var(--mute);font-size:12.5px}
.stat.hl{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat.hl small{color:#cfe0f5}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e7dd7,#1e8e4e)}
.docrow{padding:10px 0;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:0}
.docrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.docrow .top span:last-child{color:var(--mute);font-size:12.5px;white-space:nowrap}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.topics{margin:6px 0 2px 8px;font-size:13px;color:var(--mute)}
.topics div{display:flex;justify-content:space-between;padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc{background:var(--acc);color:#1b1300;border-color:var(--acc);font-weight:700}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
select,input[type=text],input[type=search],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink);cursor:pointer;min-height:34px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.x{background:#e8f0fe;color:#1a5fb4;border-color:transparent}
@media (prefers-color-scheme:dark){.tag.x{background:#1b2c47;color:#9cc2ff}}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qtext{font-size:17px;font-weight:600;margin:6px 0 12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.opt b{display:inline-block;width:24px;color:var(--mute)}
.opt.sel{border-color:var(--link)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.neutral{background:var(--warnbg);color:var(--warn)}
.expl{white-space:pre-wrap}
.cite{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.cite .doc{font-weight:700}
.cite .loc{color:var(--mute)}
blockquote{margin:8px 0 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;font-style:italic}
.model{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap}
.kp label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.kp input{width:20px;height:20px;margin-top:2px;flex:none}
.flash{perspective:1200px;min-height:300px;cursor:pointer;margin-bottom:12px}
.flash .inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;overflow:auto}
.flash .back{transform:rotateY(180deg)}
.flash .front .big{font-size:19px;font-weight:700;margin-top:24px}
.flash .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--mute);font-size:12.5px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades .btn{flex-direction:column;font-size:14px;padding:6px 4px;gap:0}
.grades small{font-size:11px;opacity:.85}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.navgrid button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.navgrid button.ans{background:#dbe8fb;border-color:#9dbbe8;color:#0f2740}
.navgrid button.cur{outline:2px solid var(--acc)}
.navgrid button.r{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.navgrid button.w{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.list .item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .s{font-size:14.5px}
.list .item .m{font-size:12px;color:var(--mute)}
mark{background:#ffe58a;color:#000;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px}
.menu a:last-child{border-bottom:0}
.menu a span:first-child{font-size:20px;width:28px;text-align:center}
.menu a em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.note h3{margin:0 0 4px;font-size:15.5px}
.note p{margin:0;font-size:14.5px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
#toast.show{opacity:.95}
.muted{color:var(--mute)}
.small{font-size:13px}
.bm{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute);min-width:40px;min-height:40px}
.bm.on{color:var(--acc)}
.hero{background:linear-gradient(135deg,#0f2740,#1d4d7a);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:18px}
.hero p{margin:0;color:#cfe0f5;font-size:13.5px}
.hero .row{margin-top:12px}
@media (min-width:900px){main{padding-top:22px}.qtext{font-size:18px}}

/* ---------- bilingual ---------- */
.en{opacity:.8}
.en.b{display:block;font-size:.92em;margin-top:.15em;font-weight:400}
.en.i{font-size:.9em;margin-left:.35em}
.qtext .en.b{margin-top:.35em;font-weight:500}
.expl .en.b,.model .en.b,.note p .en.b,.ansline .en.b{margin-top:.5em}
.hero .en,.stat.hl .en,.btn.pri .en,.btn.acc .en,.btn.ok .en,.btn.bad .en,.chip.on .en,.topbar .en{opacity:.85}
body.l-zh .en{display:none!important}
body.l-en .zh{display:none!important}
body.l-en .en{opacity:1;font-size:inherit;margin:0}
body.l-en .qtext .en.b{font-weight:inherit}
.btn .en.b{margin-top:0;font-size:.82em;line-height:1.2}
.btn{flex-direction:column;text-align:center;line-height:1.25}
.btn.sm{flex-direction:row;gap:0}
.btn.sm .en.b{display:inline;margin-left:.35em}
.grades .btn span{display:block}
.chip .en.i{font-size:.86em}
.opt{display:flex;gap:4px;align-items:flex-start}
.opt b{flex:none}
.opt>span{flex:1;min-width:0}
.ansline{margin:10px 0}
.stat small .en.b{font-size:.92em;margin-top:0}
.stat b .en.i{font-size:.55em;font-weight:600}
.topbar h1 .en.b{font-size:12px;font-weight:500;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{line-height:1.2}
.tabbar a b{font-weight:inherit;line-height:1.15}
.tabbar a .en.b{font-size:10px;margin-top:0}
body.l-en .tabbar a .en.b{font-size:12px}
.langbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:0 10px;height:34px;min-width:52px;cursor:pointer;white-space:nowrap}
.langbtn:hover{background:rgba(255,255,255,.22)}
.langmenu{position:absolute;top:calc(100% + 4px);right:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:210px;z-index:40}
.langmenu[hidden]{display:none}
.langmenu button,.langopts button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1.5px solid transparent;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:48px}
.langmenu button small,.langopts button small{color:var(--mute);font-size:12px}
.langmenu button:hover{background:var(--bg)}
.langmenu button.on,.langopts button.on{border-color:var(--link);background:var(--bg)}
.langmenu button.on b::after,.langopts button.on b::after{content:" ✓";color:var(--link)}
.langopts{display:grid;gap:6px}
@media (min-width:640px){.langopts{grid-template-columns:repeat(3,1fr)}}
.langopts button{border-color:var(--line)}
.flash h3{font-size:15px;margin:12px 0 6px}
.flash .front{padding-bottom:48px}

/* ---------- HKIE exam additions ---------- */
.tier{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;white-space:nowrap}
.tier.t1{background:#fde2e0;color:#b3261e}.tier.t2{background:#fff0d1;color:#8a5a00}.tier.t3{background:#e8edf2;color:#4a5968}
@media (prefers-color-scheme:dark){.tier.t1{background:#4a1c19;color:#ffb4ab}.tier.t2{background:#43330f;color:#ffd88a}.tier.t3{background:#26323e;color:#b8c5d2}}
.tier .en.i{font-weight:600}
.tbar{margin:8px 0}.tbar .top,.weak .top,.sheet .top,.part .top,.drill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar.two{position:relative}.bar.two i{position:absolute;left:0;top:0}.bar.two i.att{background:#b9cbe4}
@media (prefers-color-scheme:dark){.bar.two i.att{background:#2f4966}}
.weak{padding:10px 0;border-bottom:1px solid var(--line)}.weak:last-of-type{border-bottom:0}
a.lnk{display:block;color:inherit;text-decoration:none}
a.stat.lnk{display:block}
.hero .cd{margin-top:8px;color:#fff;font-size:14px}
.preset{margin-bottom:8px;align-items:flex-start;text-align:left}.preset small{color:var(--mute);font-size:12.5px}
.cheatsheet .tip{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px}
.clist{margin-top:10px}
.cgroup{column-span:all;margin:14px 0 6px;padding:8px 10px;border-left:4px solid var(--acc,#c77d00);background:var(--bg);border-radius:8px}.cgroup h3{margin:0 0 4px;font-size:15px}.cgroup p{margin:0}
.thead,.citem.trow>summary{display:grid;grid-template-columns:1.25fr 1.5fr 1.25fr .8fr;gap:6px;align-items:start}.thead{margin-top:8px;font-weight:700;font-size:12.5px;color:var(--mute)}.citem.trow>summary .tc,.citem.trow>summary .l,.thead span{min-width:0;overflow-wrap:anywhere;font-size:13px}.citem.trow>summary .tc:last-child{color:var(--mute);font-size:12px}
@media (min-width:900px){.clist .trow,.clist .tgroup,.clist .tscroll{column-span:all}}

dings 2011","edition":"2024 Edition"},"glass-2018":{"zh":"玻璃","en":"Glass","order":11,"title":"Code of Practice for Structural Use of Glass 2018","edition":"2018"},"precast-2016":{"zh":"預製混凝土","en":"Precast","order":12,"title":"Code of Practice for Precast Concrete Construction 2016","edition":"2016"},"geoguide1-retaining-walls":{"zh":"Geoguide 1 擋土牆","en":"Geoguide 1 Retaining Walls","order":13,"title":"Geoguide 1: Guide to Retaining Wall Design (GEO, CEDD)","edition":"Second edition Oct 1993; continuously updated e-version 1 June 2020"},"geoguide3-rock-soil-descriptions":{"zh":"Geoguide 3 岩土描述","en":"Geoguide 3 Rock & Soil Descriptions","order":14,"title":"Geoguide 3: Guide to Rock and Soil Descriptions (GEO, CEDD)","edition":"First published July 1988; continuously updated e-version 29 Aug 2017"},"geo-pub-1-2023-deep-excavation":{"zh":"GEO Pub 1/2023 深層挖掘","en":"GEO Pub 1/2023 Deep Excavations","order":15,"title":"GEO Publication No. 1/2023: Deep Excavation Design and Construction (GEO, CEDD)","edition":"First published December 2023"},"demolition-2004":{"zh":"拆卸規範","en":"Demolition CoP","order":16,"title":"Code of Practice for Demolition of Buildings 2004","edition":"2004"},"site-supervision-2009-2024ed":{"zh":"工地監督規範","en":"Site Supervision CoP","order":17,"title":"Code of Practice for Site Supervision 2009","edition":"2024 Edition"},"tm-supervision-plans-2009":{"zh":"監工計劃技術備忘錄","en":"TM Supervision Plans","order":18,"title":"Technical Memorandum for Supervision Plans 2009","edition":"2009"},"asd-drafting-manual-rc":{"zh":"建築署 RC 繪圖手冊","en":"ArchSD RC Drafting Manual","order":19,"title":"Drafting Manual for Reinforced Concrete Structures (Architectural Services Department)","edition":"ASD (file dated 2017)"},"hkha-spec-library-2022":{"zh":"房委會規範 2022","en":"HKHA Specification 2022","order":20,"title":"Hong Kong Housing Authority Specification Library 2022 Edition","edition":"2022 Edition"},"sdm-2013":{"zh":"路政署結構設計手冊 SDM","en":"HyD Structures Design Manual","order":21,"title":"Structures Design Manual for Highways and Railways (Highways Department)","edition":"2013 Edition, continuously updated version incorporating Amendment No. 3/2025 (Dec 2025)"}},"caveats":[{"h":"真正考試是設計題，不是選擇題","b":"工程資料夾內 2015–2025 年 11 份 HKIE Structural Examination 試卷全部是 Section 2 設計題：4–5 題選答 1 題，每題 100 分，2015–2023 年限時 6 小時，2024–2025 年 6.5 小時。選擇題模擬試只用來快速鞏固設計時要即時記起的規範數值，並非官方考試格式；請同時用「設計題練習」按真實格式及時間作答。資料夾內沒有評分準則、參考答案、考官報告或合格分數，所以本 app 不估計合格分數。","h_en":"The real examination is a design paper, not multiple choice","b_en":"All 11 HKIE Structural Examination papers (2015–2025) in the 工程 folder are Section 2 design questions: answer 1 of 4–5 questions, 100 marks each, 6 hours in 2015–2023 and 6.5 hours in 2024–2025. The MC mock exams only drill the code values you must recall quickly while designing and are not the official format; also use the Design-paper practice, which follows the real format and time. The folder contains no marking scheme, model answers, examiners' reports or pass mark, so this app does not estimate a pass mark."},{"h":"橋樑題：已加入路政署 Structures Design Manual","b":"11 題橋樑題中有 10 題指定 Structures Design Manual for Highways and Railways（SDM）。現已加入 SDM 2013 Edition（持續更新版，已納入至 Amendment No. 3/2025，2025 年 12 月），橋樑題目全部引用此版本。SDM 以 Eurocode（BS EN 及 UK NA）為基礎並作香港修訂，數值與屋宇署規範不同（例如分項系數、風壓、淨空），切勿混用。鐵路荷載由鐵路當局訂定，本工具不涵蓋；橋樑規範題只作溫習，真正設計請以最新版 SDM 及相關 BS EN 為準。","h_en":"Bridge questions: HyD Structures Design Manual added","b_en":"10 of the 11 bridge questions specify the Structures Design Manual for Highways and Railways (SDM). SDM 2013 Edition (continuously updated version incorporating up to Amendment No. 3/2025, Dec 2025) has now been added and all bridge questions quote it. The SDM is based on the Eurocodes (BS EN and UK NA) with Hong Kong modifications; its values differ from the Buildings Department codes (e.g. partial factors, wind pressures, headroom), so do not mix them. Railway loading is set by the railway authority and is not covered; bridge code questions are for revision only, and actual design must follow the latest SDM and the relevant BS EN."},{"h":"新增的 5 份參考文件","b":"拆卸規範 2004、工地監督規範 2009（2024 年版）、監工計劃技術備忘錄 2009、建築署 RC 繪圖手冊、房委會規範 2022。房委會規範只適用於房委會合約，考試施工方法題可作參考。拆卸規範 2004 為舊版本，請留意屋宇署其後的修訂。","h_en":"The 5 added reference documents","b_en":"Demolition CoP 2004, Site Supervision CoP 2009 (2024 Edition), Technical Memorandum for Supervision Plans 2009, ArchSD RC Drafting Manual and HKHA Specification Library 2022. The HKHA Specification applies to Housing Authority contracts only and is used here as reference for method statements. The Demolition CoP 2004 is an old edition; check any later Buildings Department revisions."},{"h":"本工具只屬溫習輔助","b":"所有題目、答案及解說均由本機已抽取的 PDF 文字撰寫並經自動核對引文，但仍可能有錯漏或理解偏差。設計、提交圖則或考試前，必須以屋宇署 / 土力工程處最新版本的原文為準，並留意最新的 PNAP、Practice Notes 及修訂。","h_en":"This tool is a revision aid only","b_en":"All questions, answers and explanations were written from text extracted from the local PDFs, with quotations checked automatically, but errors or misinterpretations are still possible. Before design, plan submission or examinations, always rely on the latest original documents issued by the Buildings Department / Geotechnical Engineering Office, and note the latest PNAPs, Practice Notes and amendments."},{"h":"Steel Explanatory Materials 是為 2011 年版 Code 而寫","b":"Explanatory Materials to the Code of Practice for the Structural Use of Steel 2011 解釋的是 2011 年版條文；現行 Code 為 2023 Edition。引用 EM 的題目已加註「版本提示」，條文編號、數值（例如材料系數、荷載組合）請以 2023 Edition 核對。","h_en":"The Steel Explanatory Materials were written for the 2011 Code","b_en":"The Explanatory Materials to the Code of Practice for the Structural Use of Steel 2011 explain the 2011 provisions; the current Code is the 2023 Edition. Questions citing the EM carry an \"Edition note\"; check clause numbers and values (e.g. material factors, load combinations) against the 2023 Edition."},{"h":"Wind Code 2019 的 Explanatory Notes 已於 2023 年 12 月修訂","b":"December 2023 的 Amendments 只修改 Explanatory Notes，並非修改 Code of Practice on Wind Effects in Hong Kong 2019 本身。修訂內容：(1) EN 2.2.3 新增多座塔樓共用平台的自然頻率指引；(2) EN 2.5 新增 Table 2-1 工地圍板及有蓋行人通道設計淨風壓（≤ 2.5 m 0.63、5 m 0.70、10 m 0.77 kPa）；(3) EN 4.3.1「out of scope」改為「not a compulsory requirement」；(4) EN 6.4 由「along-wind 的 80%」改為「Standard Method 荷載的 80%，以總基底彎矩比較」；(5) Figure B-1 只移動標示；(6) Appendix C2 立方體建築物 200 m 改為 250 m；(7) Appendix E3.1 由 Figure E-7(a)–(c) 改為 (a)–(d)，Flateral-1 包括 F4-1（Figure E-7(e)），Bi 見 Figure E-7(f)。受影響題目已按修訂改寫並加上修訂引文；2023 修訂亦可在速溫的「風力 2023 修訂」子集單獨溫習。","h_en":"The Explanatory Notes to the Wind Code 2019 were amended in December 2023","b_en":"The December 2023 Amendments modify only the Explanatory Notes; they do not amend the Code of Practice on Wind Effects in Hong Kong 2019 itself. Changes: (1) EN 2.2.3 adds natural-frequency guidance for multiple towers on a common podium; (2) EN 2.5 adds Table 2-1, design net pressures for construction-site hoardings and covered walkways (≤ 2.5 m 0.63, 5 m 0.70, 10 m 0.77 kPa); (3) EN 4.3.1 \"out of scope\" becomes \"not a compulsory requirement\"; (4) EN 6.4 changes from \"80% of the along-wind value\" to \"80% of the Standard Method loads, compared as total base moments\"; (5) Figure B-1 label relocation only; (6) Appendix C2 cubic building 200 m becomes 250 m; (7) Appendix E3.1 changes Figure E-7(a)–(c) to (a)–(d); Flateral-1 now includes F4-1 (Figure E-7(e)) and Bi is shown in Figure E-7(f). Affected questions have been rewritten to the amended text with an amendment citation; the 2023 amendments can also be drilled on their own with the \"Wind 2023 amendments\" subset in the sprint."},{"h":"OCR 頁面","b":"原有 15 份文件中共 153 頁 PDF 屬掃描圖像，需 OCR 才取得文字（例如 Precast Code Appendix A、Geoguide 3 部分附表及圖版、部分圖則）。OCR 文字不可靠，因此本工具不引用任何 OCR 頁面；相關內容覆蓋較少。","h_en":"OCR pages","b_en":"In the original 15 documents, 153 PDF pages are scanned images whose text is only available through OCR (e.g. Precast Code Appendix A, some tables and plates of Geoguide 3, some drawing 荷載","q":24,"nb":20,"y":11,"s19":15},{"en":"Groundwater at/near ground surface (uplift/flotation)","zh":"高地下水位","q":22,"nb":22,"y":8,"s19":19},{"en":"Foundations CoP Table 2.1 soil/rock categories cited","zh":"引用基礎規範表2.1","q":20,"nb":13,"y":7,"s19":20},{"en":"Green roof / landscape / soil / sky garden","zh":"綠化屋頂/花園","q":18,"nb":16,"y":9,"s19":16},{"en":"Basement / below-ground structure","zh":"地庫","q":17,"nb":17,"y":10,"s19":12},{"en":"Transfer structure asked for","zh":"轉換結構","q":16,"nb":16,"y":10,"s19":13},{"en":"Roof \"shall not be inverted\"","zh":"屋頂不可倒置","q":14,"nb":14,"y":10,"s19":11},{"en":"Adjacent existing building / historic / shallow footing","zh":"鄰近現有建築","q":14,"nb":14,"y":9,"s19":9},{"en":"Glass / skylight / glazing structure","zh":"玻璃/天窗","q":13,"nb":13,"y":11,"s19":8},{"en":"4-hour FRR for basement/carpark","zh":"地庫4小時","q":13,"nb":13,"y":8,"s19":11},{"en":"Seaside / coastal / waterfront","zh":"海旁","q":12,"nb":11,"y":10,"s19":8},{"en":"Standard wind instruction: Ze = Z, overload factor 1.4","zh":"標準風力簡化指示","q":11,"nb":11,"y":3,"s19":11},{"en":"Height restriction (mPD/OZP/airport)","zh":"高度限制","q":11,"nb":10,"y":6,"s19":9},{"en":"Steel / light-weight structure required","zh":"指定鋼/輕質結構","q":10,"nb":10,"y":9,"s19":7},{"en":"Structures Design Manual for Highways & Railways (bridges)","zh":"路政署結構設計手冊","q":10,"nb":0,"y":10,"s19":7},{"en":"Cantilever required or limited","zh":"懸臂","q":10,"nb":10,"y":9,"s19":8},{"en":"Slope / sloping site","zh":"斜坡","q":8,"nb":7,"y":7,"s19":6},{"en":"Max cantilever 4 m limit","zh":"懸臂≤4m","q":8,"nb":8,"y":8,"s19":7},{"en":"MTR / tunnel / railway protection zone","zh":"港鐵/隧道保護區","q":7,"nb":5,"y":6,"s19":5},{"en":"Uplift (water/wind) explicitly asked","zh":"上浮/上揚","q":6,"nb":5,"y":5,"s19":5},{"en":"Vibration / noise / PPV constraint","zh":"振動/噪音","q":5,"nb":3,"y":5,"s19":3},{"en":"Fast-track / programme constraint","zh":"快速施工","q":5,"nb":4,"y":4,"s19":1},{"en":"ELS / excavation & lateral support named","zh":"明確提及ELS","q":4,"nb":4,"y":4,"s19":2},{"en":"Table 3.2 Class 5 specific use given","zh":"指定 Table 3.2 第5類用途","q":3,"nb":3,"y":3,"s19":2},{"en":"PNAP (APP-117 / APP-24) cited","zh":"引用作業備考","q":3,"nb":3,"y":3,"s19":2},{"en":"RC construction specified","zh":"指定鋼筋混凝土","q":2,"nb":2,"y":2,"s19":2},{"en":"Demolition / removal of existing structure","zh":"拆卸","q":2,"nb":2,"y":2,"s19":2},{"en":"Deflection limit stated (L/360 etc.)","zh":"指定撓度限值","q":2,"nb":2,"y":2,"s19":2},{"en":"Crane / lifting facility","zh":"吊車","q":2,"nb":2,"y":2,"s19":1},{"en":"Topographic multiplier given/required","zh":"地形系數","q":1,"nb":1,"y":1,"s19":1},{"en":"Progressive collapse / robustness","zh":"連續倒塌","q":1,"nb":1,"y":1,"s19":1},{"en":"Precast specified","zh":"預製","q":1,"nb":1,"y":1,"s19":1}],"nq":52,"ny":11},"counts":{"questions":855}},"q":[{"id":"CON-001","t":"mcq","d":2,"tp":"預應力 Prestressed","c":"2.2.4.4(b)","p":23,"q":"預應力混凝土 class 3 構件在非常侵蝕性環境（如海水）中，表面裂縫寬度不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.3 mm"],"a":1,"e":"Class 1 無拉應力；class 2 有拉應力但無可見裂縫；class 3 容許裂縫：very aggressive 環境 ≤0.1 mm，其他 ≤0.2 mm。海旁 PT 構件應留意。","x":"0.1 mm for members in very aggressive environments (e.g. exposure to sea) and not exceeding","q_en":"For a class 3 prestressed concrete member in a very aggressive environment (e.g. exposure to sea), the surface crack width should not exceed:","e_en":"Class 1: no tensile stress; class 2: tensile stress but no visible cracking; class 3: cracking permitted — ≤0.1 mm in very aggressive environments, ≤0.2 mm otherwise. Watch this for PT members on the waterfront.","doc":"concrete-2013-2020ed","pp":"9","ex":"rc","tier":"偶考"},{"id":"CON-002","t":"tf","d":1,"tp":"荷載 Loads","c":"2.3.1.1","p":23,"q":"Concrete Code 的 characteristic wind load Wk 應按 Code of Practice on Wind Effects 取得。","a":true,"e":"對。2.3.1.1：Gk、Qk 按 Dead and Imposed Loads Code，Wk 按 Wind Code。這是 cross-code 的基本鏈接：先定 characteristic loads，再按 Table 2.1 乘 γf。","x":"characteristic wind load, Wk, as defined in the Code of Practice on Wind Effects.","q_en":"In the Concrete Code, the characteristic wind load Wk should be obtained from the Code of Practice on Wind Effects.","e_en":"True. 2.3.1.1: Gk and Qk from the Dead and Imposed Loads Code, Wk from the Wind Code. This is the basic cross-code link: first fix the characteristic loads, then multiply by γf from Table 2.1.","doc":"concrete-2013-2020ed","pp":"9","ex":"loads","tier":"常考"},{"id":"CON-003","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(a)","p":24,"q":"所有樓宇應能抵抗 notional horizontal load，其值為每層 characteristic dead weight 的百分之幾？","a":3,"u":"%","e":"2.3.1.4(a)：每層同時施加 1.5% Gk 的 notional horizontal load；在 load combination 2 或 3 中，design ultimate wind load 不應小於此值。低層、背風或受遮擋建築要特別檢核這個下限。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","o":["1.0%","0.5%","2.5%","1.5%"],"q_en":"All buildings should be able to resist a notional horizontal load equal to what percentage of the characteristic dead weight of each floor?","e_en":"2.3.1.4(a): a notional horizontal load of 1.5% Gk applied simultaneously at each floor; in load combination 2 or 3 the design ultimate wind load should not be less than this. Check this lower bound especially for low-rise, leeward or shielded buildings.","doc":"concrete-2013-2020ed","pp":"10","ex":"loads","tier":"常考"},{"id":"CON-004","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"2.3.1.4(b)","p":24,"q":"Key element 及其連接應能承受任何方向的 design ultimate load 是多少 kN/m²（不另乘 partial safety factor）？","a":1,"u":"kN/m²","e":"2.3.1.4(b)：34 kN/m²，施加於構件的 projected area，不乘 γf。用於 disproportionate collapse 設計中「key element」路線，例如 transfer column 不能以移除構件方式處理時。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","o":["25 kN/m²","34 kN/m²","17 kN/m²","50 kN/m²"],"q_en":"What design ultimate load in kN/m², acting in any direction, should a key element and its connections be able to withstand (with no additional partial safety factor)?","e_en":"2.3.1.4(b): 34 kN/m² applied to the projected area of the member, with no γf applied. Used for the \"key element\" route in disproportionate collapse design, e.g. when a transfer column cannot be dealt with by notional removal.","doc":"concrete-2013-2020ed","pp":"10","ex":"loads","tier":"常考"},{"id":"CON-005","t":"mcq","d":2,"tp":"荷載 Loads","c":"2.3.1.5","p":24,"q":"考慮 exceptional loads（誤用或意外）時，一般寫字樓（非儲存用途）應計入多少 imposed load？","o":["0%","三分之一","三分之二","100%"],"a":1,"e":"2.3.1.5：dead load + 1/3 wind + imposed load（儲存/工業或永久性 imposed load 取 100%，其他樓宇取 1/3），並按 2.3.2.2 取 γf = 1.05。","x":"are permanent, 100% of the imposed load; for other buildings, one-third of the imposed load.","q_en":"When considering exceptional loads (misuse or accident), how much imposed load should be included for an ordinary office building (not storage use)?","o_en":["0%","One-third","Two-thirds","100%"],"e_en":"2.3.1.5: dead load + 1/3 wind + imposed load (100% for storage/industrial or permanent imposed load, 1/3 for other buildings), with γf = 1.05 per 2.3.2.2.","doc":"concrete-2013-2020ed","pp":"10","ex":"loads","tier":"常考"},{"id":"CON-006","t":"tf","d":2,"tp":"荷載 Loads","c":"2.3.1.6","p":24,"q":"Concrete Code 規定由 differential settlement 引起的荷載應當作 permanent 荷載處理。","a":true,"e":"對。2.3.1.6：differential settlement 引起的荷載當作 permanent；例子包括軟土上 pad footing、不同基礎類型、不同基礎深度、pile cap 剛度不足。與 Foundations Code 的沉降評估相連。","x":"Loads induced by differential settlement should be treated as permanent.","q_en":"The Concrete Code requires loads induced by differential settlement to be treated as permanent loads.","e_en":"True. 2.3.1.6: loads induced by differential settlement are treated as permanent; examples include pad footings on soft soil, different foundation types, different founding depths and pile caps of insufficient stiffness. Links to the settlement assessment in the Foundations Code.","doc":"concrete-2013-2020ed","pp":"10","ex":"loads","tier":"常考"},{"id":"CON-008","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.2","p":25,"q":"評估 exceptional loads 或局部損毀後的持續穩定性時，γf 應取多少？","a":1,"u":"","e":"2.3.2.2：γf = 1.05；配合 2.4.3.2(b) γm：混凝土 1.3、鋼 1.0。用於 alternative load path（移除構件）分析。","x":"should be taken as 1.05 on the defined loads","o":["1.15","1.05","1.0","1.2"],"q_en":"When assessing exceptional loads or continued stability after localised damage, what value of γf should be used?","e_en":"2.3.2.2: γf = 1.05; together with γm per 2.4.3.2(b): concrete 1.3, steel 1.0. Used in alternative load path (member removal) analysis.","doc":"concrete-2013-2020ed","pp":"11","ex":"loads","tier":"必考"},{"id":"CON-009","t":"mcq","d":2,"tp":"荷載組合 Load combinations","c":"2.3.2.6","p":26,"q":"豎向構件按車輛撞擊（vehicular impact）設計時，ULS 的 γf 應取多少？","a":1,"u":"","e":"2.3.2.6：γf 1.25；撞擊力按 Building (Construction) Regulation 17（2.3.1.4(d)）。停車場柱常見檢核。","x":"Where vertical elements are to be designed for vehicular impact γ at ULS should be 1.25.","o":["1.4","1.25","1.05","1.5"],"q_en":"For vertical elements designed for vehicular impact, what γf should be used at ULS?","e_en":"2.3.2.6: γf 1.25; impact force per Building (Construction) Regulation 17 (2.3.1.4(d)). A common check for car park columns.","doc":"concrete-2013-2020ed","pp":"12","ex":"loads","tier":"必考"},{"id":"CON-010","t":"mcq","d":2,"tp":"防火 Fire","c":"Table 2.2","p":26,"q":"Fire limit state 下，一般區域（非走火梯、非永久）imposed load 的 γf 是：","o":["1.00","0.80（有充分理據可降至 0.50）","0.33","1.60"],"a":1,"e":"Table 2.2：dead 1.00；永久 imposed（機器、儲存）1.00；走火梯及大堂 1.00；其他 0.80（可減至 0.50）；wind 0.33。Fire engineering 性能化設計時會用。","x":"Note: *The value may be reduced to 0.50 when suitable justification is available","q_en":"At the fire limit state, the γf for imposed load in general areas (not escape stairs, not permanent) is:","o_en":["1.00","0.80 (may be reduced to 0.50 where justified)","0.33","1.60"],"e_en":"Table 2.2: dead 1.00; permanent imposed (machinery, storage) 1.00; escape stairs and lobbies 1.00; others 0.80 (may be reduced to 0.50); wind 0.33. Used in performance-based fire engineering design.","doc":"concrete-2013-2020ed","pp":"12","ex":"fire","tier":"必考"},{"id":"CON-011","t":"mcq","d":2,"tp":"撓度 Deflection","c":"2.3.3.3","p":26,"q":"計算撓度時，一般住宅或寫字樓應把多少百分比的 imposed load 視為 permanent？","a":0,"u":"%","e":"2.3.3.3：住宅/寫字樓 25%；儲存用途至少 75%。用於長期撓度（creep）計算，例如 transfer beam 或長跨板的 long-term deflection。","x":"occupancy, 25% of the imposed load should be considered as permanent and for structures used for","o":["25%","50%","10%","33%"],"q_en":"When calculating deflection, what percentage of the imposed load should be treated as permanent for ordinary residential or office buildings?","e_en":"2.3.3.3: 25% for residential/office; at least 75% for storage use. Used in long-term (creep) deflection calculations, e.g. long-term deflection of transfer beams or long-span slabs.","doc":"concrete-2013-2020ed","pp":"12","ex":"rc","tier":"必考"},{"id":"CON-012","t":"mcq","d":1,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下 reinforcement 的 γm 是多少？","a":1,"u":"","e":"Table 2.3：鋼筋 1.15（FLS 1.00）；混凝土彎曲/軸力 1.50；無箍筋抗剪 1.25；bond 1.40。所以 fy/γm = 0.87fy。","x":"Reinforcement (prestressing steel included) 1.15 1.00","o":["1.25","1.15","1.05","1.5"],"q_en":"What is γm for reinforcement at ULS?","e_en":"Table 2.3: reinforcement 1.15 (FLS 1.00); concrete in flexure/axial load 1.50; shear strength without shear reinforcement 1.25; bond 1.40. Hence fy/γm = 0.87fy.","doc":"concrete-2013-2020ed","pp":"13","ex":"rc","tier":"必考"},{"id":"CON-013","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"ULS 下無箍筋混凝土抗剪強度（concrete shear strength without shear reinforcement）的 γm 是多少？","a":1,"u":"","e":"1.25 已包含在 Table 6.3 vc 公式中（vc 除以 γm）。不要重複除。","x":"Concrete shear strength without shear 1.25 1.10","o":["1.5","1.25","1.4","1.15"],"q_en":"What is γm at ULS for concrete shear strength without shear reinforcement?","e_en":"The 1.25 is already included in the vc formula of Table 6.3 (vc is divided by γm). Do not divide by it again.","doc":"concrete-2013-2020ed","pp":"13","ex":"rc","tier":"必考"},{"id":"CON-014","t":"mcq","d":2,"tp":"材料係數 γm","c":"Table 2.3","p":27,"q":"Bond strength 的 ULS γm 是：","o":["1.15","1.25","1.40","1.50"],"a":2,"e":"Bond strength γm = 1.40（FLS 1.10）。錨固長度及搭接長度表已包括此值。","x":"Bond strength 1.40 1.10","q_en":"The ULS γm for bond strength is:","e_en":"Bond strength γm = 1.40 (FLS 1.10). The anchorage length and lap length tables already include this value.","doc":"concrete-2013-2020ed","pp":"13","ex":"rc","tier":"必考"},{"id":"CON-015","t":"tf","d":1,"tp":"材料 Materials","c":"3.1.2","p":29,"q":"混凝土 characteristic strength 是指 28 天 cube strength，預期有 5% 試驗結果低於此值。","a":true,"e":"對。3.1.2：28-day cube strength 的 5% fractile。香港用 cube（非 cylinder），與 Eurocode 的 fck 不同，引用外國公式時要換算。","x":"of the cube strength at 28 days below which 5% of all compressive test results would be expected to","q_en":"The characteristic strength of concrete is the 28-day cube strength below which 5% of test results may be expected to fall.","e_en":"True. 3.1.2: the 5% fractile of the 28-day cube strength. Hong Kong uses cubes (not cylinders), unlike fck in the Eurocodes — convert when using foreign formulae.","doc":"concrete-2013-2020ed","pp":"15","ex":"rc","tier":"常考"},{"id":"CON-016","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.3","p":29,"q":"以正常重量骨料製造的鋼筋混凝土，最低應使用哪個強度等級？","o":["C15","C20","C25","C30"],"a":1,"e":"3.1.3：RC 最低 C20。但耐久性（Table 4.2）按 exposure condition 往往要求更高等級，如 moderate 需 C35 配 40 mm cover。","x":"For reinforced concrete the lowest grade that should be used is C20 for concrete made with normal","q_en":"What is the minimum strength grade for reinforced concrete made with normal-weight aggregates?","e_en":"3.1.3: minimum C20 for RC. But durability (Table 4.2) often requires a higher grade depending on the exposure condition, e.g. moderate requires C35 with 40 mm cover.","doc":"concrete-2013-2020ed","pp":"15","ex":"rc","tier":"常考"},{"id":"CON-017","t":"num","d":2,"tp":"材料 Materials","c":"Table 3.2","p":30,"q":"Table 3.2：C40 混凝土一般用途（for general use）的 Ec 是多少 kN/mm²？","a":25.1,"tol":0,"u":"kN/mm²","e":"Ec = 3.46√fcu + 3.21：C40 → 25.1 kN/mm²；檢核整體樓宇撓度時可用較高的 26.4。香港花崗岩骨料的 Ec 偏低，比 BS 8110 值細。","x":"C35 23.7 25.1 C40 25.1 26.4","q_en":"Table 3.2: what is Ec (for general use) of C40 concrete, in kN/mm²?","e_en":"Ec = 3.46√fcu + 3.21: C40 → 25.1 kN/mm²; the higher value of 26.4 may be used when checking overall building deflection. Ec with Hong Kong granite aggregate is low, smaller than BS 8110 values.","doc":"concrete-2013-2020ed","pp":"16","ex":"rc","tier":"常考"},{"id":"CON-019","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.6","p":31,"q":"Linear elastic analysis 時混凝土的 Poisson's ratio 可取多少？","a":2,"u":"","e":"3.1.6：0.2。有限元素板分析（如 SAFE）常用。","x":"Where linear elastic analysis is appropriate, Poisson’s ratio may be taken as 0.2.","o":["0.15","0.3","0.2","0.25"],"q_en":"What value of Poisson's ratio for concrete may be taken in linear elastic analysis?","e_en":"3.1.6: 0.2. Commonly used in finite element slab analysis (e.g. SAFE).","doc":"concrete-2013-2020ed","pp":"17","ex":"rc","tier":"常考"},{"id":"CON-020","t":"mcq","d":3,"tp":"材料 Materials","c":"3.1.8","p":33,"q":"Drying shrinkage 公式中，考慮香港碎花崗岩骨料的 Hong Kong modification factor cs 是多少？","a":2,"u":"","e":"3.1.8：cs = 2.5，反映本地花崗岩骨料收縮較大。長牆、大面積 podium slab 的收縮裂縫及 movement joint 設計要考慮。","x":"cs is 2.5, Hong Kong modification factor to allow for properties of the crushed granitic aggregate,","o":["1.5","3.0","2.5","1.0"],"q_en":"In the drying shrinkage formula, what is the Hong Kong modification factor cs that accounts for crushed granite aggregate in Hong Kong?","e_en":"3.1.8: cs = 2.5, reflecting the higher shrinkage of local granite aggregate. Consider it for shrinkage cracking and movement joint design of long walls and large podium slabs.","doc":"concrete-2013-2020ed","pp":"19","ex":"rc","tier":"常考"},{"id":"CON-021","t":"mcq","d":1,"tp":"材料 Materials","c":"3.1.9","p":34,"q":"正常重量混凝土的線性熱膨脹系數一般取：","o":["6×10⁻⁶/°C","10×10⁻⁶/°C","12×10⁻⁶/°C","20×10⁻⁶/°C"],"a":1,"e":"3.1.9：10×10⁻⁶/°C；鋼筋為 12×10⁻⁶/°C（3.2.5）。溫度應力及 movement joint 間距計算用。","x":"The linear coefficient of thermal expansion for normal weight concrete may normally be taken as","q_en":"The coefficient of linear thermal expansion of normal-weight concrete is generally taken as:","e_en":"3.1.9: 10×10⁻⁶/°C; reinforcement is 12×10⁻⁶/°C (3.2.5). Used for thermal stress and movement joint spacing calculations.","doc":"concrete-2013-2020ed","pp":"20","ex":"rc","tier":"常考"},{"id":"CON-022","t":"mcq","d":1,"tp":"材料 Materials","c":"3.2.1","p":34,"q":"Concrete Code 3.2 適用的 ribbed 鋼筋等級是：","o":["Grade 460","Grade 500A 及 500B","Grade 500B 及 500C（符合 CS2）","Grade 600"],"a":2,"e":"3.2.1：plain grade 250；ribbed grade 500B、500C 符合 CS2。500A 只用於焊接鋼網（3.3.3），不可做彎矩再分配。","x":"grade 500B and grade 500C complying with CS2, or the acceptable standards as appropriate, used","q_en":"The ribbed reinforcement grades covered by Concrete Code 3.2 are:","o_en":["Grade 460","Grade 500A and 500B","Grade 500B and 500C (complying with CS2)","Grade 600"],"e_en":"3.2.1: plain grade 250; ribbed grade 500B and 500C complying with CS2. 500A is only for welded fabric (3.3.3) and does not allow moment redistribution.","doc":"concrete-2013-2020ed","pp":"20","ex":"rc","tier":"常考"},{"id":"CON-023","t":"mcq","d":1,"tp":"材料 Materials","c":"3.2.4","p":35,"q":"鋼筋的 elastic modulus 應取多少 kN/mm²？","a":3,"u":"kN/mm²","e":"3.2.4：Es = 200 kN/mm²。Modular ratio αe = Es/Ec 用於裂縫及撓度計算。","x":"The elastic modulus for reinforcement should be taken as 200 kN/mm2.","o":["205 kN/mm²","190 kN/mm²","210 kN/mm²","200 kN/mm²"],"q_en":"What elastic modulus of reinforcement should be taken, in kN/mm²?","e_en":"3.2.4: Es = 200 kN/mm². The modular ratio αe = Es/Ec is used in crack width and deflection calculations.","doc":"concrete-2013-2020ed","pp":"21","ex":"rc","tier":"常考"},{"id":"CON-024","t":"mcq","d":3,"tp":"鋼筋接駁 Couplers","c":"3.2.8.3","p":36,"q":"Type 1 mechanical coupler 測試：拉至 0.6fy 後的 permanent elongation 不應超過：","o":["0.05 mm","0.1 mm","0.2 mm","0.5 mm"],"a":1,"e":"3.2.8.3(a)：0.1 mm；grade 500B assembly 抗拉強度 >540 N/mm²，500C >575 N/mm²。Type 2 另需 cyclic test，並用於 ductility 詳細設計（9.9）。","x":"permanent elongation after loading to 0.6fy should not exceed 0.1 mm; and","q_en":"Type 1 mechanical coupler test: after loading to 0.6fy, the permanent elongation should not exceed:","e_en":"3.2.8.3(a): 0.1 mm; tensile strength of the assembly >540 N/mm² for grade 500B and >575 N/mm² for 500C. Type 2 additionally requires a cyclic test and is used for ductility detailing (9.9).","doc":"concrete-2013-2020ed","pp":"22","ex":"detail","tier":"偶考"},{"id":"CON-026","t":"tf","d":2,"tp":"鋼筋 Reinforcement","c":"3.3.3","p":36,"q":"使用 Grade 500A 焊接鋼網（welded fabric）的構件可以做 moment redistribution。","a":false,"e":"錯。3.3.3：Grade 500A 鋼網直徑 8–16 mm，任何情況都不容許 moment redistribution，因其延性較低。","x":"to 16 mm. In all conditions, moment redistribution is not allowed.","q_en":"Members using Grade 500A welded fabric may be designed with moment redistribution.","e_en":"False. 3.3.3: Grade 500A fabric, 8–16 mm diameter, does not allow moment redistribution in any case, because of its lower ductility.","doc":"concrete-2013-2020ed","pp":"22","ex":"detail","tier":"常考"},{"id":"CON-030","t":"mcq","d":1,"tp":"耐久性 Durability","c":"4.1.1","p":40,"q":"Concrete Code 第 4 節的耐久性指引是基於多少年的 design working life？","a":2,"u":"年","e":"4.1.1：50 年。如業主要求 100 年（例如公共基建），Table 4.2 的 cover 需按專門文獻加大，不能直接套用。","x":"The guidelines given in the following clauses are based on a design working life of 50 years.","o":["120 年","100 年","50 年","30 年"],"q_en":"The durability guidance in Section 4 of the Concrete Code is based on a design working life of how many years?","o_en":["120 years","100 years","50 years","30 years"],"e_en":"4.1.1: 50 years. If the client requires 100 years (e.g. public infrastructure), the Table 4.2 covers must be increased based on specialist literature and cannot be applied directly.","u_en":"years","doc":"concrete-2013-2020ed","pp":"26","ex":"rc","tier":"常考"},{"id":"CON-031","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.2.1","p":41,"q":"連續一次澆築的混凝土最小尺寸超過多少時，應考慮降溫措施（如低水化熱材料）？","o":["300 mm","450 mm","600 mm","1000 mm"],"a":2,"e":"4.2.2.1：>600 mm，尤其 cementitious content ≥400 kg/m³ 時。Transfer plate、pile cap 等 mass concrete 須有 thermal control plan（溫度監測、pfa/ggbs、分層澆築）。","x":"than 600 mm, and especially where the cementitious content is 400 kg/m3 or more, measures to reduce","q_en":"Above what minimum dimension of concrete placed in one continuous pour should measures to reduce temperature rise (e.g. low heat of hydration materials) be considered?","e_en":"4.2.2.1: >600 mm, especially when the cementitious content is ≥400 kg/m³. Mass concrete such as transfer plates and pile caps needs a thermal control plan (temperature monitoring, pfa/ggbs, placing in layers).","doc":"concrete-2013-2020ed","pp":"27","ex":"rc","tier":"常考"},{"id":"CON-032","t":"mcq","d":1,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"浴室、廚房等高濕度的室內混凝土表面屬哪一個 exposure condition？","o":["1 Mild","2 Moderate","3 Severe","4 Very Severe"],"a":1,"e":"Table 4.1：Moderate 包括高濕度室內表面及受大雨/乾濕循環的外露表面（fair faced、乾掛幕牆背後）。有瓷磚/批盪保護的外牆屬 Mild。","x":"Internal concrete surfaces exposed to high humidity e.g. bathrooms and kitchens.","q_en":"Which exposure condition applies to interior concrete surfaces subject to high humidity, such as bathrooms and kitchens?","e_en":"Table 4.1: Moderate covers interior surfaces with high humidity and exposed surfaces subject to heavy rain / alternate wetting and drying (fair-faced, behind dry-fixed curtain walls). External walls protected by tiles/render are Mild.","doc":"concrete-2013-2020ed","pp":"28","ex":"rc","tier":"常考"},{"id":"CON-033","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.1","p":42,"q":"近海岸、受空氣中海水飛沫影響（但非直接接觸）的混凝土表面屬：","o":["Moderate","Severe","Very Severe","Abrasive"],"a":1,"e":"Table 4.1：Severe（condition 3）。潮汐區至最低低水位下 1 m 則屬 Very Severe（condition 4）。海旁項目最低 C40 配 50 mm cover。","x":"Concrete surfaces exposed to sea water spray through airborne contact but not","q_en":"A concrete surface near the coast exposed to airborne salt spray (but not in direct contact with sea water) is classified as:","e_en":"Table 4.1: Severe (condition 3). The tidal zone down to 1 m below lowest low water is Very Severe (condition 4). Waterfront projects need at least C40 with 50 mm cover.","doc":"concrete-2013-2020ed","pp":"28","ex":"rc","tier":"常考"},{"id":"CON-034","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(a)","p":42,"q":"實際保護層（actual cover）不應少於 nominal cover 減 5 mm。","a":true,"e":"對。4.2.4.1(a)：nominal cover 是設計及圖則上的數值，實際 cover ≥ nominal − 5 mm。工地驗鋼（cover meter）以此判斷是否合格。","x":"should not be less than the nominal cover minus 5 mm","q_en":"The actual cover should not be less than the nominal cover minus 5 mm.","e_en":"True. 4.2.4.1(a): nominal cover is the value used in design and on drawings; actual cover ≥ nominal − 5 mm. Site inspection of reinforcement (cover meter) uses this as the acceptance criterion.","doc":"concrete-2013-2020ed","pp":"28","ex":"rc","tier":"常考"},{"id":"CON-035","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.4.1(b)","p":42,"q":"成束（bundled）主筋的保護層不應少於：","o":["最大單支鋼筋直徑","等效截面積單支鋼筋的直徑","兩倍單支直徑","25 mm"],"a":1,"e":"4.2.4.1(b)：主筋 cover ≥ 主筋直徑；成對或成束時，用截面積等於總和的單支等效直徑，並同時保持箍筋的 nominal cover。大直徑柱筋常被忽略。","x":"a single bar of cross-sectional area equal to the sum of their cross-sectional areas","q_en":"The cover to bundled main bars should not be less than:","o_en":["The largest single bar diameter","The diameter of a single bar of equivalent area","Twice the single bar diameter","25 mm"],"e_en":"4.2.4.1(b): cover to main bars ≥ bar diameter; for pairs or bundles, use the diameter of a single bar of area equal to their total, while maintaining the nominal cover to links. Often overlooked for large-diameter column bars.","doc":"concrete-2013-2020ed","pp":"28","ex":"rc","tier":"常考"},{"id":"CON-036","t":"mcq","d":1,"tp":"耐久性 Durability","c":"4.2.4.1(d)","p":43,"q":"混凝土直接澆築於泥土上時，nominal cover 一般不應少於多少 mm？","a":0,"u":"mm","e":"4.2.4.1(d)：直接貼泥 75 mm；有足夠 blinding 時 ≥40 mm（不計 blinding）。Pile cap、地樑底筋常用 75 mm。","x":"generally be not less than 75 mm","o":["75 mm","50 mm","100 mm","40 mm"],"q_en":"Where concrete is cast directly against earth, the nominal cover should generally not be less than how many mm?","e_en":"4.2.4.1(d): 75 mm directly against earth; ≥40 mm (excluding blinding) where adequate blinding is provided. 75 mm is common for bottom bars of pile caps and ground beams.","doc":"concrete-2013-2020ed","pp":"29","ex":"rc","tier":"常考"},{"id":"CON-037","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Exposure condition 2（Moderate）用 C35 混凝土，nominal cover 是多少 mm？","a":3,"u":"mm","e":"Condition 2：C30 40 mm、C35 35 mm、C40 35 mm、C45+ 30 mm。外牆 fair-faced 常用 C35/35 mm 或 C40/35 mm。另要檢核 Fire Safety Code 的 cover。","x":"Condition 2 -- 40 35 35 30 30 30","o":["45 mm","30 mm","40 mm","35 mm"],"q_en":"Table 4.2: for exposure condition 2 (Moderate) with C35 concrete, what is the nominal cover in mm?","e_en":"Condition 2: C30 40 mm, C35 35 mm, C40 35 mm, C45+ 30 mm. Fair-faced external walls commonly use C35/35 mm or C40/35 mm. Also check cover under the Fire Safety Code.","doc":"concrete-2013-2020ed","pp":"29","ex":"rc","tier":"常考"},{"id":"CON-038","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Exposure condition 3（Severe）容許的最低混凝土等級及對應 nominal cover 是：","o":["C30，40 mm","C35，45 mm","C40，50 mm","C50，55 mm"],"a":2,"e":"Table 4.2：Condition 3 最低 C40（50 mm），C45 以上 45 mm；Condition 4 最低 C50（55 mm）、≥C55 50 mm。","x":"Condition 3 -- -- -- 50 45 45 45","q_en":"For exposure condition 3 (Severe), the minimum permitted concrete grade and corresponding nominal cover are:","o_en":["C30, 40 mm","C35, 45 mm","C40, 50 mm","C50, 55 mm"],"e_en":"Table 4.2: condition 3 minimum C40 (50 mm), C45 and above 45 mm; condition 4 minimum C50 (55 mm), ≥C55 50 mm.","doc":"concrete-2013-2020ed","pp":"29","ex":"rc","tier":"常考"},{"id":"CON-039","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.2","p":43,"q":"Table 4.2：Condition 1 樓板（slabs only）用 C30 時 nominal cover 是多少 mm？","a":1,"u":"mm","e":"Condition 1 slabs：C20/25–C30 30 mm；C35+ 25 mm；其他構件 C30–C40 30 mm。但 Fire Safety Code 的 FRR 要求可能更大，取兩者較大值。","x":"- slabs only 30 30 25 25 25 25 25","o":["35 mm","30 mm","25 mm","20 mm"],"q_en":"Table 4.2: for condition 1 slabs (slabs only) using C30, what is the nominal cover in mm?","e_en":"Condition 1 slabs: C20/25–C30 30 mm; C35+ 25 mm; other members C30–C40 30 mm. The FRR requirement of the Fire Safety Code may be larger — take the greater of the two.","doc":"concrete-2013-2020ed","pp":"29","ex":"rc","tier":"常考"},{"id":"CON-040","t":"tf","d":2,"tp":"耐久性 Durability","c":"4.2.4.4","p":43,"q":"Nominal cover 亦應適用於 mechanical couplers，除非接駁器採用加強抗腐蝕材料。","a":true,"e":"對。4.2.4.4：coupler 外徑較鋼筋大，詳圖時要確保 coupler 表面仍有足夠 cover，否則要加大構件或用抗腐蝕 coupler。","x":"The nominal cover should also be applied to mechanical couplers, if used,","q_en":"Nominal cover should also apply to mechanical couplers, unless the couplers are made of enhanced corrosion-resistant material.","e_en":"True. 4.2.4.4: couplers have a larger outside diameter than the bar; when detailing, ensure the coupler surface still has adequate cover, otherwise enlarge the member or use corrosion-resistant couplers.","doc":"concrete-2013-2020ed","pp":"29","ex":"rc","tier":"常考"},{"id":"CON-041","t":"mcq","d":3,"tp":"耐久性 Durability","c":"4.2.5.2","p":44,"q":"若建立系統化檢查以確保符合 w/c ratio 及 cementitious content 限制，Table 4.2 的混凝土等級最多可放寬多少？","o":["2","5","10","不可放寬"],"a":1,"e":"4.2.5.2：最多放寬 5（例如 C40→C35），但不適用於 4.2.5.5 的 pfa/ggbs 混合。實務上較少使用，需要 QA 系統支持。","x":"placed, the concrete grades specified may be relaxed by not more than 5.","q_en":"If a systematic checking regime is established to ensure compliance with the w/c ratio and cementitious content limits, by how much may the concrete grade in Table 4.2 be reduced at most?","o_en":["2","5","10","No reduction permitted"],"e_en":"4.2.5.2: reduced by up to 5 (e.g. C40→C35), but not applicable to pfa/ggbs mixes under 4.2.5.5. Rarely used in practice as it needs a QA system to support it.","doc":"concrete-2013-2020ed","pp":"30","ex":"rc","tier":"常考"},{"id":"CON-042","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.5.5","p":44,"q":"PFA 佔 total cementitious content 的一般範圍是：","o":["10%–20%","25%–35%","35%–75%","50%–80%"],"a":1,"e":"4.2.5.5：pfa 25%–35%；ggbs 35%–75%。含 pfa/ggbs 要延長養護，拆模時間亦要考慮早期強度較低。","x":"(a) 25% to 35% for pfa","q_en":"The typical range of PFA as a proportion of the total cementitious content is:","e_en":"4.2.5.5: pfa 25%–35%; ggbs 35%–75%. Mixes with pfa/ggbs need extended curing, and striking times must account for the lower early strength.","doc":"concrete-2013-2020ed","pp":"30","ex":"rc","tier":"常考"},{"id":"CON-043","t":"mcq","d":3,"tp":"耐久性 Durability","c":"4.2.6.1","p":45,"q":"一般強度混凝土（fcu ≤ 60），total cementitious content 超過多少 kg/m³ 時須特別考慮收縮/溫度裂縫風險？","a":3,"u":"kg/m³","e":"4.2.6.1：>550 kg/m³ 要特別考慮；一般 cement 含量限 ≤450 kg/m³。高強度混凝土要控制水化熱及收縮徐變。","x":"and pfa or ggbs in excess of 550 kg/m3 should not be used unless special consideration has","o":["600 kg/m³","450 kg/m³","400 kg/m³","550 kg/m³"],"q_en":"For normal-strength concrete (fcu ≤ 60), above what total cementitious content in kg/m³ must the risk of shrinkage/thermal cracking be specially considered?","e_en":"4.2.6.1: >550 kg/m³ requires special consideration; cement content is generally limited to ≤450 kg/m³. For high-strength concrete, control heat of hydration, shrinkage and creep.","doc":"concrete-2013-2020ed","pp":"31","ex":"rc","tier":"常考"},{"id":"CON-044","t":"mcq","d":2,"tp":"耐久性 Durability","c":"Table 4.5","p":47,"q":"含鋼筋混凝土的最大總氯化物含量（以水泥重量百分比計）是多少 %？","a":2,"u":"%","e":"Table 4.5：預應力/蒸汽養護 0.1%；SRPC 0.2%；鋼筋混凝土 0.35%。海砂在香港受嚴格限制，就是為了控制氯化物。","x":"Concrete with reinforcement or other embedded 0.35","o":["0.1%","0.2%","0.35%","0.4%"],"q_en":"What is the maximum total chloride content (as a percentage by mass of cement) for concrete containing embedded reinforcement, in %?","e_en":"Table 4.5: prestressed/steam-cured 0.1%; SRPC 0.2%; reinforced concrete 0.35%. Sea sand is strictly restricted in Hong Kong precisely to control chlorides.","doc":"concrete-2013-2020ed","pp":"33","ex":"rc","tier":"常考"},{"id":"CON-045","t":"mcq","d":2,"tp":"耐久性 Durability","c":"4.2.7.3","p":47,"q":"為減低鹼骨料反應（AAR），混凝土的 reactive alkali content（equivalent Na₂O）每立方米不應超過多少 kg？","a":1,"u":"kg/m³","e":"4.2.7.3(d)：≤3.0 kg/m³，供應商須提交 HOKLAS 認可測試證書。Argillaceous dolomitic limestone 骨料不應使用。","x":"should not exceed 3.0 kg;","o":["2.0 kg/m³","3.0 kg/m³","4.0 kg/m³","3.5 kg/m³"],"q_en":"To minimise the risk of alkali-aggregate reaction (AAR), the reactive alkali content (equivalent Na₂O) of concrete should not exceed how many kg per cubic metre?","e_en":"4.2.7.3(d): ≤3.0 kg/m³; the supplier must submit HOKLAS-accredited test certificates. Argillaceous dolomitic limestone aggregate should not be used.","doc":"concrete-2013-2020ed","pp":"33","ex":"rc","tier":"常考"},{"id":"CON-046","t":"tf","d":1,"tp":"防火 Fire","c":"4.3","p":47,"q":"按 Concrete Code，耐久性要求的 cover 一定足夠防火，毋須再參考 Fire Safety Code。","a":false,"e":"錯。4.3：某些情況下耐久性 cover 不足以防火，須按 Fire Safety Code 修正 nominal cover，而 Fire Safety Code 亦規定構件最小尺寸。這是典型的 cross-code 檢核。","x":"In some circumstances, the cover specified for durability will not be sufficient for fire protection.","q_en":"Under the Concrete Code, the cover required for durability is always adequate for fire, so the Fire Safety Code need not be consulted.","e_en":"False. 4.3: in some cases the durability cover is insufficient for fire and the nominal cover must be modified according to the Fire Safety Code, which also specifies minimum member dimensions. A typical cross-code check.","doc":"concrete-2013-2020ed","pp":"33","ex":"fire","tier":"必考"},{"id":"CON-047","t":"mcq","d":2,"tp":"防火 Fire","c":"4.3.1.1","p":48,"q":"高強度混凝土中 silica fume 含量不應超過 total cementitious content 的百分之幾？","a":2,"u":"%","e":"4.3.1.1：≤6%，因 silica fume 令混凝土更密實，火災時蒸汽壓力易致 spalling。PFA/GGBS 則有助防止 spalling，沒有額外限制。","x":"should not exceed 6% by weight of the total cementitious content","o":["3%","10%","6%","15%"],"q_en":"In high-strength concrete, the silica fume content should not exceed what percentage of the total cementitious content?","e_en":"4.3.1.1: ≤6%, because silica fume makes concrete denser, so vapour pressure in a fire readily causes spalling. PFA/GGBS helps prevent spalling and has no additional limit.","doc":"concrete-2013-2020ed","pp":"34","ex":"fire","tier":"必考"},{"id":"CON-050","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(a)","p":50,"q":"連續（continuous）樑的跨度少於整體深度的多少倍時，應當作 deep beam？","o":["2.0","2.5","3.0","4.0"],"a":1,"e":"5.2.1.1(a)：簡支 <2h、連續 <2.5h 屬 deep beam，第 6.1.2 節一般樑設計不適用，要用 strut-and-tie 等專門方法。Transfer girder 常屬此類。","x":"simply supported spans and 2.5 times the overall depth for continuous spans. Otherwise it","q_en":"A continuous beam should be treated as a deep beam when its span is less than how many times its overall depth?","e_en":"5.2.1.1(a): simply supported <2h, continuous <2.5h is a deep beam; the general beam design of Section 6.1.2 does not apply and specialist methods such as strut-and-tie are needed. Transfer girders often fall into this category.","doc":"concrete-2013-2020ed","pp":"36","ex":"rc","tier":"常考"},{"id":"CON-051","t":"mcq","d":1,"tp":"結構分析 Analysis","c":"5.2.1.1(e)","p":50,"q":"按 Concrete Code，截面深度超過寬度多少倍時應當作 wall 而非 column？","o":["3","4","5","6"],"a":1,"e":"5.2.1.1(e)：depth ≤ 4 × width 為 column，否則屬 wall。影響配筋要求（9.5 vs 9.6）及 FRR 最小尺寸（Fire Code 表格分柱和牆）。","x":"(e) A column is a member for which the section depth does not exceed 4 times its width. Otherwise","q_en":"Under the Concrete Code, a section should be treated as a wall rather than a column when its depth exceeds how many times its width?","e_en":"5.2.1.1(e): depth ≤ 4 × width is a column, otherwise a wall. This affects reinforcement requirements (9.5 vs 9.6) and FRR minimum dimensions (the Fire Code tables separate columns and walls).","doc":"concrete-2013-2020ed","pp":"36","ex":"rc","tier":"常考"},{"id":"CON-052","t":"tf","d":2,"tp":"結構分析 Analysis","c":"5.2.1.1(c)","p":50,"q":"四邊支承的矩形板，長短跨比大於 2 時，其中部可視為 one-way spanning。","a":true,"e":"對。5.2.1.1(c)(ii)：ly/lx > 2 可按單向板。另 5.2.1.1(b)：板的最小尺寸須 ≥5 倍板厚才算 slab。","x":"longer to shorter span greater than 2.","q_en":"For a rectangular slab supported on four sides with a long-to-short span ratio greater than 2, the central part may be considered as one-way spanning.","e_en":"True. 5.2.1.1(c)(ii): ly/lx > 2 may be treated as one-way. Also 5.2.1.1(b): a slab's minimum dimension must be ≥5 times its thickness to count as a slab.","doc":"concrete-2013-2020ed","pp":"36","ex":"rc","tier":"常考"},{"id":"CON-053","t":"mcq","d":3,"tp":"結構分析 Analysis","c":"5.2.1.1(d)","p":50,"q":"Ribbed slab 若要毋須當作獨立構件分析，肋距（rib spacing）不應超過：","o":["900 mm","1200 mm","1500 mm","2000 mm"],"a":2,"e":"5.2.1.1(d)：肋距 ≤1500 mm、肋深 ≤4 倍肋寬、翼緣厚 ≥ max(1/10 淨距, 50 mm)、橫肋淨距 ≤10 倍板深。","x":"(i) the rib spacing does not exceed 1500 mm and the depth of the rib below the flange does","q_en":"For a ribbed slab not to require analysis as separate members, the rib spacing should not exceed:","e_en":"5.2.1.1(d): rib spacing ≤1500 mm, rib depth ≤4 times rib width, flange thickness ≥ max(1/10 clear distance, 50 mm), clear spacing of transverse ribs ≤10 times slab depth.","doc":"concrete-2013-2020ed","pp":"36","ex":"rc","tier":"常考"},{"id":"CON-054","t":"tf","d":3,"tp":"結構分析 Analysis","c":"5.2.1.2(b)","p":55,"q":"與支承整體澆築的樑，支座處的 critical design moment 不應少於 full fixed end moment 的 0.65 倍。","a":true,"e":"對。5.2.1.2(b) Note：取支座面彎矩，但不少於 0.65 倍 fixed end moment；圓柱取柱面內 0.2φ。防止過度削減支座彎矩。","x":"Note: The critical design moment at the support should not be less than 0.65 that of the full","q_en":"For a beam monolithic with its support, the critical design moment at the support should not be less than 0.65 times the full fixed end moment.","e_en":"True. 5.2.1.2(b) Note: take the moment at the support face, but not less than 0.65 times the fixed end moment; for circular columns take 0.2φ inside the column face. Prevents excessive reduction of support moments.","doc":"concrete-2013-2020ed","pp":"41","ex":"rc","tier":"常考"},{"id":"CON-055","t":"mcq","d":2,"tp":"結構分析 Analysis","c":"5.2.5.2","p":55,"q":"Sub-frame 分析豎向荷載時，以下哪一個不是 Code 列明的 critical loading arrangement？","o":["所有跨度 1.4Gk + 1.6Qk","隔跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","任何相鄰兩跨 1.4Gk + 1.6Qk，其他跨 1.0Gk","所有跨度 1.0Gk + 1.6Qk"],"a":3,"e":"5.2.5.2 三種排列：全跨最大、隔跨最大、相鄰兩跨最大（其餘 1.0Gk）。Pattern loading 對連續樑跨中彎矩及柱彎矩重要。","x":"(c) any two adjacent spans loaded with the maximum design ultimate load (1.4Gk + 1.6Qk), and all","q_en":"When analysing a sub-frame for vertical loads, which of the following is NOT one of the critical loading arrangements listed in the Code?","o_en":["All spans 1.4Gk + 1.6Qk","Alternate spans 1.4Gk + 1.6Qk, other spans 1.0Gk","Any two adjacent spans 1.4Gk + 1.6Qk, other spans 1.0Gk","All spans 1.0Gk + 1.6Qk"],"e_en":"5.2.5.2 gives three arrangements: all spans maximum, alternate spans maximum, two adjacent spans maximum (others 1.0Gk). Pattern loading matters for continuous beam midspan moments and column moments.","doc":"concrete-2013-2020ed","pp":"41","ex":"rc","tier":"常考"},{"id":"CON-056","t":"mcq","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.2","p":57,"q":"超過四層、由框架提供側向穩定的結構，彎矩再分配最多是多少 %？","a":1,"u":"%","e":"5.2.9.2：限 10%，condition 3 的 70% 改為 90%。一般情況（5.2.9.1）只適用於 ≤C70，截面抗彎須 ≥70% 彈性彎矩。","x":"The provisions of clause 5.2.9.1 apply except that redistribution is limited to 10% and the value given","o":["20%","10%","15%","30%"],"q_en":"For structures over four storeys where lateral stability is provided by the frame, what is the maximum moment redistribution in %?","e_en":"5.2.9.2: limited to 10%, with 70% in condition 3 changed to 90%. The general case (5.2.9.1) applies only to ≤C70, and the moment of resistance must be ≥70% of the elastic moment.","doc":"concrete-2013-2020ed","pp":"43","ex":"rc","tier":"常考"},{"id":"CON-057","t":"tf","d":2,"tp":"彎矩再分配 Redistribution","c":"5.2.9.1","p":57,"q":"C80 混凝土的構件可按 5.2.9.1 進行彎矩再分配。","a":false,"e":"錯。5.2.9.1 只適用於不超過 C70；而 70 < fcu ≤ 100 的 x ≤ 0.33d 限制亦註明「no moment redistribution」。","x":"For concrete of strength grade not exceeding C70, redistribution of the moments obtained by means","q_en":"Members of C80 concrete may have moments redistributed under 5.2.9.1.","e_en":"False. 5.2.9.1 applies only up to C70; and the x ≤ 0.33d limit for 70 < fcu ≤ 100 also states \"no moment redistribution\".","doc":"concrete-2013-2020ed","pp":"43","ex":"rc","tier":"常考"},{"id":"CON-058","t":"mcq","d":2,"tp":"二階效應 Second order","c":"5.3","p":57,"q":"二階效應（second order effects）少於一階效應的百分之幾時可以忽略？","a":0,"u":"%","e":"5.3：<10% 可忽略。高樓 P-Δ 分析時用此判斷；否則要在變形狀態下驗證平衡與抗力。","x":"Second order effects may be ignored if they are less than 10% of the corresponding first order effects.","o":["10%","5%","15%","20%"],"q_en":"Second order effects may be ignored when they are less than what percentage of the first order effects?","e_en":"5.3: <10% may be ignored. Used to decide on P-Δ analysis for tall buildings; otherwise equilibrium and resistance must be verified in the deformed state.","doc":"concrete-2013-2020ed","pp":"43","ex":"rc","tier":"偶考"},{"id":"CON-060","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.1(d)","p":59,"q":"簡支或連續樑的側向穩定：約束點之間的淨距不應超過：","o":["40bc 或 150bc²/d（取較小）","60bc 或 250bc²/d（取較小）","25bc 或 100bc²/d（取較小）","100bc"],"a":1,"e":"6.1.2.1(d)：簡支/連續 60bc 或 250bc²/d；懸臂 25bc 或 100bc²/d。bc 為受壓翼緣寬度。長跨窄樑（如外牆 spandrel）要檢核。","x":"(i) for simply-supported or continuous beams: 60bc or 250bc2/d if less; or","q_en":"Lateral stability of simply supported or continuous beams: the clear distance between lateral restraints should not exceed:","o_en":["40bc or 150bc²/d (whichever is less)","60bc or 250bc²/d (whichever is less)","25bc or 100bc²/d (whichever is less)","100bc"],"e_en":"6.1.2.1(d): simply supported/continuous 60bc or 250bc²/d; cantilevers 25bc or 100bc²/d. bc is the compression flange width. Check long-span narrow beams (e.g. external spandrels).","doc":"concrete-2013-2020ed","pp":"45","ex":"rc","tier":"必考"},{"id":"CON-062","t":"mcq","d":1,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"只受彎的截面，lever arm z 不應大於有效深度 d 的多少倍？","a":0,"u":"","e":"6.1.2.4(a)(v)：z ≤ 0.95d。輕彎矩時公式 6.10 算出的 z 可能 >0.95d，要封頂。","x":"to be greater than 0.95 times the effective depth.","o":["0.95","0.775","0.85","0.9"],"q_en":"For a section in flexure only, the lever arm z should not be greater than how many times the effective depth d?","e_en":"6.1.2.4(a)(v): z ≤ 0.95d. For small moments, equation 6.10 may give z >0.95d, so cap it.","doc":"concrete-2013-2020ed","pp":"46","ex":"rc","tier":"必考"},{"id":"CON-063","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(b)","p":60,"q":"C50 混凝土（45 < fcu ≤ 70），無再分配或 ≤10%，中性軸深度 x 上限是：","o":["0.5d","0.4d","0.33d","0.25d"],"a":1,"e":"6.1.2.4(b)：fcu ≤45 → 0.5d；45–70 → 0.4d；70–100 → 0.33d（且不可再分配）。高強度混凝土延性較低，所以限制更嚴。","x":"x ≤ 0.4d for 45 < fcu ≤ 70 N/mm2 ; or","q_en":"For C50 concrete (45 < fcu ≤ 70) with no redistribution or ≤10%, the upper limit of the neutral axis depth x is:","e_en":"6.1.2.4(b): fcu ≤45 → 0.5d; 45–70 → 0.4d; 70–100 → 0.33d (and no redistribution). High-strength concrete is less ductile, hence stricter limits.","doc":"concrete-2013-2020ed","pp":"46","ex":"rc","tier":"必考"},{"id":"CON-064","t":"mcq","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(c)","p":61,"q":"fcu ≤ 45 N/mm²、再分配不超過 10% 時，K' 值是多少？","a":0,"u":"","e":"K' = 0.156（fcu ≤45）、0.120（45–70）、0.094（70–100）。K = M/bd²fcu > K' 時需要受壓鋼筋。常見錯誤：C60 仍用 0.156。","x":"K’ = 0.156 for fcu ≤45 N/mm2 ; or","o":["0.156","0.176","0.132","0.12"],"q_en":"For fcu ≤ 45 N/mm² and redistribution not exceeding 10%, what is K'?","e_en":"K' = 0.156 (fcu ≤45), 0.120 (45–70), 0.094 (70–100). Compression reinforcement is needed when K = M/bd²fcu > K'. Common error: still using 0.156 for C60.","doc":"concrete-2013-2020ed","pp":"47","ex":"rc","tier":"必考"},{"id":"CON-065","t":"tf","d":2,"tp":"彎曲設計 Flexure","c":"6.1.2.4(a)","p":60,"q":"樑承受的設計軸向壓力不超過 0.1fcu × 截面面積時，分析時可忽略該軸力。","a":true,"e":"對。6.1.2.4(a)：≤0.1fcu·Ac 可忽略。例如 podium 樑受少量軸力；但受拉軸力（如 tie beam）不在此列，要另計。","x":"the design ultimate axial force may be ignored if it does not exceed 0.1fcu times the cross-","q_en":"When the design axial compression on a beam does not exceed 0.1fcu × cross-sectional area, the axial force may be ignored in analysis.","e_en":"True. 6.1.2.4(a): ≤0.1fcu·Ac may be ignored, e.g. podium beams with small axial forces; but axial tension (e.g. tie beams) is not covered and must be allowed for separately.","doc":"concrete-2013-2020ed","pp":"46","ex":"rc","tier":"必考"},{"id":"CON-066","t":"mcq","d":1,"tp":"抗剪 Shear","c":"6.1.2.5(a)","p":62,"q":"樑的設計剪應力 v 無論配多少箍筋都不應超過：","o":["0.63√fcu 或 5 N/mm²","0.8√fcu 或 7.0 N/mm²（取較小）","√fcu","0.8fcu"],"a":1,"e":"6.1.2.5(a)：v ≤ min(0.8√fcu, 7.0 N/mm²)，已含 γm 1.25。超過即要加大截面，不能靠加箍筋解決。Transfer girder 常由此控制截面。","x":"In no case should v exceed 0.8√fcu or 7.0 N/mm2, whichever is the lesser, whatever shear","q_en":"Regardless of the shear reinforcement provided, the design shear stress v in a beam should not exceed:","o_en":["0.63√fcu or 5 N/mm²","0.8√fcu or 7.0 N/mm² (whichever is less)","√fcu","0.8fcu"],"e_en":"6.1.2.5(a): v ≤ min(0.8√fcu, 7.0 N/mm²), including γm 1.25. If exceeded, the section must be enlarged — adding links will not help. Transfer girder sections are often governed by this.","doc":"concrete-2013-2020ed","pp":"48","ex":"rc","tier":"必考"},{"id":"CON-067","t":"mcq","d":2,"tp":"抗剪 Shear","c":"Table 6.2","p":62,"q":"fcu ≤ 40 N/mm² 時，最少箍筋（minimum links）提供的設計剪力抗力 vr 是多少 N/mm²？","a":3,"u":"N/mm²","e":"Table 6.2：0.5vc < v < (vc + vr) 時全樑用最少箍筋 Asv ≥ vr·bv·sv/(0.87fyv)（亦見 9.2.2 Equation 9.4）。Note 2：vr = 0.4（fcu ≤ 40）；fcu > 40 時 0.4(fcu/40)^(2/3)，fcu 上限取 80。所以高強度混凝土最少箍筋量會增加。","x":"Minimum links provide a design shear resistance of vr where vr = 0.4 for fcu ≤ 40 N/mm2 or","o":["0.3 N/mm²","0.5 N/mm²","0.6 N/mm²","0.4 N/mm²"],"q_en":"For fcu ≤ 40 N/mm², what design shear resistance vr is provided by minimum links, in N/mm²?","e_en":"Table 6.2: for 0.5vc < v < (vc + vr), minimum links over the whole beam, Asv ≥ vr·bv·sv/(0.87fyv) (see also 9.2.2 Equation 9.4). Note 2: vr = 0.4 (fcu ≤ 40); for fcu > 40, 0.4(fcu/40)^(2/3), with fcu capped at 80. Hence minimum links increase for high-strength concrete.","doc":"concrete-2013-2020ed","pp":"48","ex":"rc","tier":"必考"},{"id":"CON-068","t":"mcq","d":2,"tp":"抗剪 Shear","c":"6.1.2.5(d)","p":63,"q":"樑的箍筋沿跨度方向間距不應超過：","o":["0.5d","0.75d","d","300 mm"],"a":1,"e":"6.1.2.5(d)：沿跨 ≤0.75d；橫向任何受拉筋距箍筋腳 ≤150 mm，且橫向間距 ≤d。闊扁樑要用多肢箍。","x":"The spacing of links in the direction of the span should not exceed 0.75d.","q_en":"The spacing of links along the span of a beam should not exceed:","e_en":"6.1.2.5(d): along the span ≤0.75d; transversely, no tension bar should be more than 150 mm from a link leg, and transverse spacing ≤d. Wide shallow beams need multi-leg links.","doc":"concrete-2013-2020ed","pp":"49","ex":"rc","tier":"必考"},{"id":"CON-069","t":"num","d":2,"tp":"抗剪 Shear","c":"Table 6.3","p":63,"q":"Table 6.3：100As/bvd = 1.00，有效深度 d ≥ 400 mm，vc 是多少 N/mm²（fcu = 25）？","a":0.63,"tol":0,"u":"N/mm²","e":"Table 6.3 最右欄（400 mm）1.00 → 0.63 N/mm²。fcu >25 可乘 (fcu/25)^(1/3)，fcu 上限 80。As 須延伸至少 d 過該截面才可計入。","x":"1.00 0.84 0.81 0.78 0.75 0.73 0.71 0.68 0.63","q_en":"Table 6.3: with 100As/bvd = 1.00 and effective depth d ≥ 400 mm, what is vc in N/mm² (fcu = 25)?","e_en":"Table 6.3, rightmost column (400 mm), 1.00 → 0.63 N/mm². For fcu >25 multiply by (fcu/25)^(1/3), with fcu capped at 80. As counts only if it extends at least d beyond the section.","doc":"concrete-2013-2020ed","pp":"49","ex":"rc","tier":"必考"},{"id":"CON-070","t":"tf","d":3,"tp":"抗剪 Shear","c":"Table 6.3 Note 3","p":63,"q":"計算 vc 的 (fcu/25)^(1/3) 放大系數時，fcu 可取實際等級如 C100。","a":false,"e":"錯。Table 6.3 Note 3：fcu 不應取大於 80 N/mm²。100As/bvd 不大於 3；(400/d)^(1/4) 對無箍筋構件不少於 0.67。","x":"The value of fcu should not be taken as greater than 80 N/mm2.","q_en":"When calculating the (fcu/25)^(1/3) enhancement factor for vc, fcu may be taken as the actual grade, e.g. C100.","e_en":"False. Table 6.3 Note 3: fcu should not be taken as greater than 80 N/mm². 100As/bvd not greater than 3; (400/d)^(1/4) not less than 0.67 for members without shear reinforcement.","doc":"concrete-2013-2020ed","pp":"49","ex":"rc","tier":"必考"},{"id":"CON-072","t":"mcq","d":2,"tp":"沖剪 Punching","c":"6.1.5.7(f)","p":88,"q":"沖剪（punching shear）檢核首先在距加載面多遠的周界進行？","o":["0.5d","d","1.5d","2d"],"a":2,"e":"6.1.5.7(f)：先檢核 1.5d 周界，v ≤ vc 即可。需要箍筋時第一圈約在 0.5d，含 ≥40% 計算面積；周界間距 ≤0.75d，同圈間距 ≤1.5d。","x":"The shear capacity is checked first on a perimeter 1.5d from the face of the loaded area. If the","q_en":"The punching shear check is first carried out on a perimeter at what distance from the loaded area?","e_en":"6.1.5.7(f): check the 1.5d perimeter first; v ≤ vc is sufficient. Where links are needed, the first perimeter is at about 0.5d, containing ≥40% of the calculated area; perimeter spacing ≤0.75d, spacing within a perimeter ≤1.5d.","doc":"concrete-2013-2020ed","pp":"74","ex":"rc","tier":"必考"},{"id":"CON-073","t":"tf","d":3,"tp":"沖剪 Punching","c":"6.1.5.7(e)","p":88,"q":"沖剪 v 超過 2vc 時，仍可直接用 equation 6.45 計算所需箍筋。","a":false,"e":"錯。6.1.5.7(e)：6.44/6.45 不適用於 v > 2vc；若用其他加強系統（如 shear studs）須另提供理據。箍筋只適用於 >200 mm 厚板。","x":"Equations 6.44 and 6.45 should not be applied where the shear stress v exceeds 2 vc.","q_en":"When punching shear v exceeds 2vc, the required links may still be calculated directly with equation 6.45.","e_en":"False. 6.1.5.7(e): 6.44/6.45 do not apply to v > 2vc; other systems (e.g. shear studs) need separate justification. Links are only effective in slabs >200 mm thick.","doc":"concrete-2013-2020ed","pp":"74","ex":"rc","tier":"必考"},{"id":"CON-074","t":"mcq","d":1,"tp":"柱 Columns","c":"6.2.1.1(b)","p":90,"q":"Braced column 在 lex/h 及 ley/b 均少於多少時可當作 short column？","o":["10","12","15","20"],"a":2,"e":"6.2.1.1(b)：braced <15，unbraced <10。Slender column 要計 deflection-induced additional moment（6.2.1.3）。","x":"A column may be considered as short when both ratios lex /h and ley /b are less than 15 (braced)","q_en":"A braced column may be considered short when both lex/h and ley/b are less than:","e_en":"6.2.1.1(b): braced <15, unbraced <10. Slender columns must include the deflection-induced additional moment (6.2.1.3).","doc":"concrete-2013-2020ed","pp":"76","ex":"rc","tier":"必考"},{"id":"CON-075","t":"mcq","d":2,"tp":"柱 Columns","c":"Table 6.11","p":91,"q":"Braced column 上下兩端均為 end condition 1，β 值是多少？","a":2,"u":"","e":"Table 6.11：braced 1-1 為 0.75，3-3 為 1.00；unbraced（Table 6.12）1-1 為 1.2，cantilever 4-1 為 2.2。le = β·lo。","x":"1 0.75 0.80 0.90","o":["1.0","0.9","0.75","0.85"],"q_en":"For a braced column with end condition 1 at both top and bottom, what is β?","e_en":"Table 6.11: braced 1-1 is 0.75, 3-3 is 1.00; unbraced (Table 6.12) 1-1 is 1.2, cantilever 4-1 is 2.2. le = β·lo.","doc":"concrete-2013-2020ed","pp":"77","ex":"rc","tier":"必考"},{"id":"CON-076","t":"mcq","d":2,"tp":"柱 Columns","c":"6.2.1.1(e)(ii)","p":91,"q":"柱端與兩側比柱深度淺的樑或板整體連接，屬哪一個 end condition？","o":["Condition 1","Condition 2","Condition 3","Condition 4"],"a":1,"e":"Condition 1：樑深 ≥ 柱尺寸（或設計承受彎矩的基礎）；Condition 2：較淺樑/板；Condition 3：只提供名義約束；Condition 4：無約束（懸臂柱自由端）。Flat slab 柱通常屬 condition 2。","x":"Condition 2. The end of the column is connected monolithically to beams or","q_en":"A column end connected monolithically to beams or slabs on either side that are shallower than the column dimension is which end condition?","e_en":"Condition 1: beams at least as deep as the column dimension (or a foundation designed to carry moment); Condition 2: shallower beams/slabs; Condition 3: nominal restraint only; Condition 4: unrestrained (free end of a cantilever column). Flat slab columns are usually condition 2.","doc":"concrete-2013-2020ed","pp":"77","ex":"rc","tier":"必考"},{"id":"CON-077","t":"mcq","d":2,"tp":"柱 Columns","c":"6.2.1.2(d)","p":92,"q":"柱的最小偏心 emin 取柱尺寸的 0.05 倍，但不多於多少 mm？","a":3,"u":"mm","e":"6.2.1.2(d)：emin = 0.05h ≤ 20 mm；雙向彎曲只需一次一軸滿足。軸心受壓柱亦必須計這個名義彎矩。","x":"0.05 times the overall dimension of the column in the plane of bending considered but not more","o":["50 mm","10 mm","25 mm","20 mm"],"q_en":"The minimum eccentricity emin of a column is taken as 0.05 times the column dimension, but not more than how many mm?","e_en":"6.2.1.2(d): emin = 0.05h ≤ 20 mm; for biaxial bending it need only be satisfied about one axis at a time. Axially loaded columns must also include this nominal moment.","doc":"concrete-2013-2020ed","pp":"78","ex":"rc","tier":"必考"},{"id":"CON-078","t":"mcq","d":2,"tp":"柱 Columns","c":"6.2.1.1(f)","p":91,"q":"一般情況下，柱端約束之間的淨高 lo 不應超過柱最小厚度的多少倍？","a":1,"u":"倍","e":"6.2.1.1(f)：lo ≤ 60b。懸臂 unbraced 柱另受 6.47：lo ≤ 100b²/h ≤ 60b。","x":"Generally, the clear distance, lo, between end restraints should not exceed 60 times the","o":["40 倍","60 倍","100 倍","50 倍"],"q_en":"In general, the clear height lo between end restraints of a column should not exceed how many times its least lateral dimension?","o_en":["40 times","60 times","100 times","50 times"],"e_en":"6.2.1.1(f): lo ≤ 60b. Unbraced cantilever columns are further limited by 6.47: lo ≤ 100b²/h ≤ 60b.","u_en":"times","doc":"concrete-2013-2020ed","pp":"77","ex":"rc","tier":"必考"},{"id":"CON-080","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"6.4.1.5","p":108,"q":"Peripheral tie 應設於距樓宇邊緣多少範圍內（或在外牆內）？","o":["0.5 m","1.0 m","1.2 m","2.0 m"],"a":2,"e":"6.4.1.5：peripheral tie 拉力 1.0Ft，位於邊緣 1.2 m 內或外牆內。","x":"resisting a tensile force (in kN) of 1.0Ft, located within 1.2 m of the edge of the building or within the","q_en":"Within what distance of the building edge (or within the perimeter wall) should the peripheral tie be located?","e_en":"6.4.1.5: peripheral tie force 1.0Ft, located within 1.2 m of the edge or within the perimeter wall.","doc":"concrete-2013-2020ed","pp":"94","ex":"loads","tier":"常考"},{"id":"CON-081","t":"mcq","d":2,"tp":"穩健性 Robustness","c":"6.4.1.6","p":108,"q":"外柱的水平 tie 力取 2.0Ft（或 ls/2.5·Ft）與柱在該層總設計垂直荷載百分之幾的較大者？","a":3,"u":"%","e":"6.4.1.6(a)(ii)：3% of total design ultimate vertical load。角柱要在兩個方向各自滿足。","x":"(ii) 3% of the total design ultimate vertical load carried by the column or wall at that level.","o":["1.5%","5%","1%","3%"],"q_en":"The horizontal tie force for an external column is the greater of 2.0Ft (or ls/2.5·Ft) and what percentage of the total design vertical load on the column at that level?","e_en":"6.4.1.6(a)(ii): 3% of total design ultimate vertical load. Corner columns must satisfy this in each of the two directions.","doc":"concrete-2013-2020ed","pp":"94","ex":"loads","tier":"常考"},{"id":"CON-082","t":"mcq","d":2,"tp":"牛腿 Corbels","c":"6.5.2.3","p":109,"q":"Corbel 的水平箍筋應分佈在根部有效深度的哪個範圍，數量不少於主拉筋的多少？","o":["下三分之一；主筋 25%","上三分之二；主筋 50%","全深度；主筋 100%","上半；主筋 33%"],"a":1,"e":"6.5.2.3：上 2/3 有效深度，≥ 主拉筋面積一半。另 6.5.2.1(a)：水平力抗力不少於垂直設計荷載一半。","x":"thirds of the effective depth of root of the corbel; this reinforcement should be not less than one-half","q_en":"Within what portion of the effective depth at the root should the horizontal links of a corbel be distributed, and what minimum amount relative to the main tension reinforcement?","o_en":["Lower one-third; 25% of main bars","Upper two-thirds; 50% of main bars","Full depth; 100% of main bars","Upper half; 33% of main bars"],"e_en":"6.5.2.3: upper 2/3 of the effective depth, ≥ half the area of the main tension reinforcement. Also 6.5.2.1(a): resistance to horizontal force not less than half the vertical design load.","doc":"concrete-2013-2020ed","pp":"95","ex":"rc","tier":"偶考"},{"id":"CON-083","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.2","p":112,"q":"Pile cap 剪力檢核的 critical section 位於：","o":["柱面","樁面","樁面向內 20% 樁徑","距柱面 d"],"a":2,"e":"6.7.3.2：樁面內 20% 樁徑；中心在此線外的樁力全計在外。Rigid cap 簡化分析不可用 shear enhancement（6.7.3.3(b)）。","x":"located 20% of the diameter of the pile inside the face of the pile, as indicated in Figure 6.19. The","q_en":"The critical section for the shear check of a pile cap is located at:","o_en":["The column face","The pile face","20% of the pile diameter inside the pile face","d from the column face"],"e_en":"6.7.3.2: 20% of the pile diameter inside the pile face; the full load of piles whose centres lie outside this line is counted. Shear enhancement cannot be used in the simplified rigid cap analysis (6.7.3.3(b)).","doc":"concrete-2013-2020ed","pp":"98","ex":"fdn","tier":"常考"},{"id":"CON-084","t":"tf","d":3,"tp":"基礎 Foundations","c":"6.7.3.3(c)","p":112,"q":"考慮剪力橫向分布時，pile cap 的 shear enhancement 可施加於以每支樁為中心、寬 3φ 的條帶。","a":true,"e":"對。6.7.3.3(c)：寬 3φ；H 樁或矩形樁可用樁寬 + 2 × 最小尺寸。v < vc 時毋須最少箍筋（(e)）。","x":"enhancement may be applied to the strip of the pile cap of width equal to 3φ, centred on each","q_en":"When allowing for the transverse distribution of shear, shear enhancement in a pile cap may be applied to strips of width 3φ centred on each pile.","e_en":"True. 6.7.3.3(c): width 3φ; for H-piles or rectangular piles, pile width + 2 × least dimension may be used. Minimum links are not needed when v < vc ((e)).","doc":"concrete-2013-2020ed","pp":"98","ex":"fdn","tier":"常考"},{"id":"CON-085","t":"mcq","d":2,"tp":"基礎 Foundations","c":"6.7.3.1","p":111,"q":"Truss analogy 設計 pile cap 時，若樁距超過 3 倍樁徑，只計入距樁中心多少範圍內的鋼筋作拉桿？","o":["0.5φ","1.0φ","1.5φ","3φ"],"a":2,"e":"6.7.3.1：樁距 >3φ 時只計 1.5φ 範圍內鋼筋，故大樁距 cap 應把底筋集中於樁頂帶。","x":"spaced piles (spacing exceeding three times the pile diameter), only the reinforcement within 1.5 times","q_en":"When designing a pile cap by truss analogy with pile spacing greater than 3 times the pile diameter, only reinforcement within what distance of the pile centre is counted as the tie?","e_en":"6.7.3.1: with spacing >3φ, only bars within 1.5φ are counted, so caps with wide pile spacing should concentrate bottom bars in bands over the piles.","doc":"concrete-2013-2020ed","pp":"97","ex":"fdn","tier":"常考"},{"id":"CON-090","t":"mcq","d":1,"tp":"裂縫 Cracking","c":"Table 7.1","p":117,"q":"一般建築物的鋼筋混凝土構件（exposure 1–4），最大估計表面裂縫寬度一
