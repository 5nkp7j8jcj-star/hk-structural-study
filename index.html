ongregate but overcrowding is not expected（1.5 kN/m）","Areas susceptible to overcrowding（3.0 kN/m）","毋須設計水平荷載"],"a":1,"e":"3.8.1.3：balconies、utility platforms、edges of roofs、≤3 m 寬行人天橋屬 1.5 kN/m 類別。住宅室內樓梯則屬 0.75 kN/m。","x":"with fixed seating or tables; balconies; utility platforms; edges of roofs; and footbridges or","q_en":"Which category do barriers to residential balconies fall into?","o_en":["Areas where congregation of people is not expected (0.75 kN/m)","Areas where people may congregate but overcrowding is not expected (1.5 kN/m)","Areas susceptible to overcrowding (3.0 kN/m)","No horizontal load design needed"],"e_en":"3.8.1.3: balconies, utility platforms, edges of roofs and footbridges ≤3 m wide fall into the 1.5 kN/m category. Internal stairs in dwellings are 0.75 kN/m.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","mcq","中級"]},{"id":"DIL-034","t":"num","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"護欄 line load 的施加高度為樓面以上多少 m（或護欄頂，取較低者）？","a":1.1,"tol":0,"u":"m","e":"Table 3.13 Note：1.1 m 或護欄頂邊，取較低者。護欄底座錨栓及 cantilever 板邊的彎矩按此高度計算。","x":"The line load is to be applied at a height of 1.1m above the floor level or the top edge of the protective barrier","q_en":"The barrier line load is applied at what height in m above floor level (or the top of the barrier, whichever is lower)?","e_en":"Table 3.13 Note: 1.1 m or the top edge of the barrier, whichever is lower. Barrier base anchors and cantilever slab edge moments are calculated at this height.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","護欄荷載 Barriers","num","中級"]},{"id":"DIL-035","t":"scenario","d":3,"tp":"車輛防撞欄 Vehicle barriers","c":"3.8.3","p":19,"q":"停車場 6A 剛性（rigid）車輛防撞欄，M = 3,000 kg，v = 3.0 m/s，δc = 100 mm，δb = 0。試計算 horizontal impact force F。","m":"F = 0.5 M v² / (δc + δb) = 0.5 × 3000 × 3.0² / (100 + 0) = 135 kN（單位按 Code 公式，M kg、v m/s、δ mm 得 kN），作用於 bumper height 600 mm，均布於任何 1.5 m 長度。","k":["F = 0.5Mv²/(δc+δb)","F = 135 kN","6A bumper height 600 mm","分布於 1.5 m 長度；斜坡旁 oblique 取一半"],"e":"停車場外牆/欄杆常被車撞，設計時須檢核 F 及連接。斜坡底 >10 m 的直斜坡須乘 γ（Table 3.15）；斜坡旁欄杆因斜撞可取一半（3.8.3.4）。","x":"minimum requirement of horizontal impact force, F (in kN),","r":[{"p":20,"c":"Table 3.14 / 3.16","x":"Class Bumper Height above Floor Level (mm) 6A 600","doc":"dead-imposed-loads-2011-2021ed","pp":"16"}],"q_en":"A rigid vehicle barrier in a 6A car park: M = 3,000 kg, v = 3.0 m/s, δc = 100 mm, δb = 0. Calculate the horizontal impact force F.","m_en":"F = 0.5 M v² / (δc + δb) = 0.5 × 3000 × 3.0² / (100 + 0) = 135 kN (units per the Code formula: M in kg, v in m/s, δ in mm gives kN), acting at a bumper height of 600 mm, uniformly distributed over any 1.5 m length.","k_en":["F = 0.5Mv²/(δc+δb)","F = 135 kN","6A bumper height 600 mm","Distributed over 1.5 m length; half for oblique impact beside ramps"],"e_en":"Car park external walls/barriers are often struck by vehicles; check F and the connections. At the bottom of straight ramps >10 m long multiply by γ (Table 3.15); barriers alongside ramps may take half for oblique impact (3.8.3.4).","doc":"dead-imposed-loads-2011-2021ed","pp":"15","tags":["dead-imposed-loads-2011-2021ed","車輛防撞欄 Vehicle barriers","scenario","進階"]},{"id":"DIL-036","t":"num","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"Table 3.17","p":21,"q":"公共道路（Public Roads）對斜坡及擋土結構的最低附加荷載（surcharge）是多少 kPa？","a":20,"tol":0,"u":"kPa","e":"Table 3.17：Public roads 20 kPa、Private roads 10 kPa、行人路/單車徑/遊樂場 5 kPa。Geoguide 1 的擋土牆設計亦採用相同數值；淺基礎建築物無紀錄時每層不少於 10 kPa（3.9.2）。","x":"Public Roads 20","q_en":"What is the minimum surcharge on slopes and retaining structures for public roads, in kPa?","e_en":"Table 3.17: public roads 20 kPa, private roads 10 kPa, footpaths/cycle tracks/playgrounds 5 kPa. Geoguide 1 retaining wall design uses the same values; for buildings on shallow foundations without records, not less than 10 kPa per storey (3.9.2).","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","num","中級"]},{"id":"DIL-037","t":"num","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"3.9.2","p":21,"q":"評估淺基礎鄰近建築物對擋土結構的附加荷載，如無記錄，每層最少取多少 kPa？","a":10,"tol":0,"u":"kPa per storey","e":"3.9.2：有記錄用實際荷載；無記錄按現有用途及結構形式評估，最少每層 10 kPa。深挖工程（ELS）設計檢核鄰近舊樓時常用。","x":"structural forms with a minimum value of 10 kPa per storey.","q_en":"When assessing the surcharge on a retaining structure from an adjacent building on shallow foundations with no records, what minimum per storey should be taken, in kPa?","e_en":"3.9.2: use the actual loads if records exist; without records, assess from the existing use and structural form, minimum 10 kPa per storey. Commonly used in deep excavation (ELS) design when checking adjacent old buildings.","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","擋土結構附加荷載 Surcharge","num","中級"]},{"id":"DIL-038","t":"scenario","d":3,"tp":"動力荷載 Dynamic","c":"3.10.2","p":21,"q":"一幢 20 層工廠大廈，沒有機器資料。按 3.10.2 應如何考慮額外動力荷載？","m":"(a) 設計樓板及樑時加 2.5 kPa 豎向均布荷載；(b) 設計框架及基礎時，另加相等於 (a) 豎向荷載 10% 的水平力，同時作用於 N 層（N ≥ 0.2 × 受動力影響總層數 = 4 層），可假設不與風荷載同時作用。","k":["樓板/樑：額外 2.5 kPa","框架/基礎：10% 水平力","N ≥ 0.2 × 層數 = 4","不需與 wind load 同時作用"],"e":"3.10.2 適用於工業樓宇未有機器資料的情況。常見遺漏：只加 2.5 kPa 而忘記框架的水平力；此動力荷載亦不可折減（3.7.1(e)）。","x":"additional horizontal force (which may be assumed not to act together with the wind","q_en":"A 20-storey factory building has no machinery information. How should additional dynamic loads be considered under 3.10.2?","m_en":"(a) For slabs and beams, add a vertical uniformly distributed load of 2.5 kPa; (b) for frames and foundations, additionally apply a horizontal force equal to 10% of the vertical load in (a), acting simultaneously at N floors (N ≥ 0.2 × total number of floors subject to dynamic loads = 4 floors); it may be assumed not to act together with wind load.","k_en":["Slabs/beams: additional 2.5 kPa","Frames/foundations: 10% horizontal force","N ≥ 0.2 × number of floors = 4","Need not act together with wind load"],"e_en":"3.10.2 applies to industrial buildings without machinery information. Common omission: adding only the 2.5 kPa and forgetting the horizontal force on the frame; this dynamic load also cannot be reduced (3.7.1(e)).","doc":"dead-imposed-loads-2011-2021ed","pp":"17","tags":["dead-imposed-loads-2011-2021ed","動力荷載 Dynamic","scenario","進階"]},{"id":"DIL-039","t":"num","d":2,"tp":"荷載告示 Notice","c":"3.11.3","p":22,"q":"工業大廈樓面荷載告示以 kg/m² 表示時，1 kPa 應換算為多少 kg/m²？","a":102,"tol":0,"u":"kg/m²","e":"3.11.3：1 kPa = 102 kg/m²（不包括動力效應）。告示須中英文、字高 ≥15 mm，放於每層樓梯或適當位置。驗樓（Occupation Permit）時 BD 會查。","x":"1 kPa to 102 kilograms per square metre","q_en":"When floor loading notices in industrial buildings are expressed in kg/m², 1 kPa should be converted to how many kg/m²?","e_en":"3.11.3: 1 kPa = 102 kg/m² (excluding dynamic effects). Notices must be in Chinese and English, with characters ≥15 mm high, displayed at the staircase on each floor or another suitable location. BD checks this at the Occupation Permit inspection.","doc":"dead-imposed-loads-2011-2021ed","pp":"18","tags":["dead-imposed-loads-2011-2021ed","荷載告示 Notice","num","中級"]},{"id":"DIL-040","t":"mcq","d":2,"tp":"表現為本 Performance based","c":"4.2.1","p":23,"q":"以 performance based approach 從量度數據推算 design imposed load 時，設計荷載在使用年期內被超越的機率不應多於：","o":["1%","5%","10%","50%"],"a":1,"e":"4.2.1(a)：probability-based analysis 下被超越機率不多於 5%，須獲 Building Authority 接納。適用於 Code 未列明的特殊用途（如數據中心）。","x":"imposed load not more than 5 percent probability of the design imposed load being","q_en":"When deriving the design imposed load from measured data by a performance based approach, the probability of the design load being exceeded during the design life should not be more than:","e_en":"4.2.1(a): under probability-based analysis, probability of exceedance not more than 5%, subject to acceptance by the Building Authority. Applicable to special uses not listed in the Code (e.g. data centres).","doc":"dead-imposed-loads-2011-2021ed","pp":"19","tags":["dead-imposed-loads-2011-2021ed","表現為本 Performance based","mcq","中級"]},{"id":"DIL-041","t":"num","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：鋼筋混凝土（Reinforced concrete）密度是多少 kN/m³？","a":24.5,"tol":0,"u":"kN/m³","e":"Appendix A：Plain 23.6、Reinforced 24.5、Prestressed 24.5 kN/m³。香港計算書普遍取 24.5 kN/m³；鋼 77.0、玻璃 26、泥土 20 kN/m³。","x":"Reinforced 24.5","q_en":"Appendix A: what is the density of reinforced concrete, in kN/m³?","e_en":"Appendix A: plain 23.6, reinforced 24.5, prestressed 24.5 kN/m³. Hong Kong calculations generally take 24.5 kN/m³; steel 77.0, glass 26, soil 20 kN/m³.","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","num","基礎"]},{"id":"DIL-042","t":"num","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：玻璃（Glass）的密度是多少 kN/m³？","a":26,"tol":0,"u":"kN/m³","e":"Glass 26 kN/m³，幕牆及玻璃天幕 dead load 計算要用；Glass Code 設計時自重亦影響斜置玻璃的荷載組合。","x":"Other materials Glass 26","q_en":"Appendix A: what is the density of glass, in kN/m³?","e_en":"Glass 26 kN/m³, used in dead load calculations for curtain walls and glass canopies; in Glass Code design, self-weight also affects the load combinations of inclined glass.","doc":"dead-imposed-loads-2011-2021ed","pp":"20","tags":["dead-imposed-loads-2011-2021ed","材料密度 Densities","num","基礎"]},{"id":"FIR-001","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"C4.1 / Table C1","p":87,"q":"Table C1：Use Classification 1 Residential 的 FRR 及 compartment 面積限制？","o":["60 min；不限","120 min；2,500 m²","60 min；10,500 m²","90 min；不限"],"a":0,"e":"住宅及酒店 60 分鐘、compartment 不限，但每個單位之間要以 fire barrier 分隔。結構工程師要確保所有 element of construction（柱、樑、樓板）達到 FRR 60 的保護層和尺寸。","x":"1. Residential Not limited 60","q_en":"Table C1: FRR and compartment size limit for Use Classification 1 Residential?","o_en":["60 min; unlimited","120 min; 2,500 m²","60 min; 10,500 m²","90 min; unlimited"],"e_en":"Residential and hotels: 60 minutes with unlimited compartment size, but each unit must be separated by fire barriers. The structural engineer must ensure all elements of construction (columns, beams, floors) achieve the cover and dimensions for FRR 60.","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","基礎"]},{"id":"FIR-002","t":"num","d":1,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Carparks 的 FRR（分鐘）？","a":60,"tol":0,"u":"min","e":"停車場 60 分鐘、compartment ≤10,500 m²。注意停車場若在地庫則要按 C14 用 240 分鐘。","x":"7. Carparks Not exceeding 10,500m2 60","q_en":"Table C1: FRR (minutes) for carparks?","e_en":"Carparks 60 minutes, compartment ≤10,500 m². Note that basement carparks must use 240 minutes per C14.","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","基礎"]},{"id":"FIR-003","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Mercantile facilities（4b）compartment 面積超過 2,500 m² 但不超過 10,500 m² 時的 FRR？","o":["60 min","90 min","120 min","240 min"],"a":2,"e":"商場類 ≤2,500 m² 為 60 分鐘，超過則 120 分鐘。平台商場設計時 compartment 劃分直接影響結構保護層及樓板厚度。","x":"Exceeding 2,500m2 but not 120","q_en":"Table C1: FRR for mercantile facilities (4b) with a compartment area over 2,500 m² but not over 10,500 m²?","e_en":"Mercantile uses: 60 minutes up to 2,500 m², 120 minutes above. In podium mall design the compartmentation directly affects structural cover and slab thickness.","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","中級"]},{"id":"FIR-004","t":"num","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Industrial workplaces（6a）的 FRR（分鐘）？","a":120,"tol":0,"u":"min","e":"工業類全部 120 分鐘。舊工廈活化改建時要核實原有結構是否達標。","x":"6a. Industrial workplaces Not exceeding 10,500m2 120","q_en":"Table C1: FRR (minutes) for industrial workplaces (6a)?","e_en":"All industrial uses are 120 minutes. When revitalising old industrial buildings, verify whether the existing structure complies.","doc":"fire-safety-2011-2024ed","pp":"78","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","中級"]},{"id":"FIR-005","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C1 Note 1","p":88,"q":"Fire compartment 面積超過 Table C1 所列時，一律不獲批准。","a":false,"e":"超過會按個別情況考慮，需要加強逃生、消防進出、消防裝置及耐火結構以達到同等安全水平，通常需要 fire engineering 方案。","x":"A fire compartment area/volume in excess of that given above will be dealt with on","q_en":"Fire compartments larger than those listed in Table C1 will never be approved.","e_en":"False. Larger compartments are considered case by case, requiring enhanced means of escape, firefighting access, fire service installations and fire resisting construction to achieve an equivalent level of safety, usually via a fire engineering approach.","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-006","t":"scenario","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"客戶想在地盤內建一座單層鋼結構貨倉，體積 6,500 m³、高 7 m，想不做鋼結構防火。按 FS Code 可否？條件是什麼？","m":"可以。C4.3：單層建築體積不超過 7,000 m³、高度不超過 7.5 m，並與鄰近建築或地界保持不少於 6 m 淨空，鋼結構可不作保護。","k":["single-storey","≤7,000 m³","≤7.5 m height","≥6 m clear open space to adjoining building/boundary"],"e":"三個條件缺一不可。常見陷阱是日後加建閣樓變成多層或加高，就會失去豁免。","x":"Where a single-storey building does not exceed 7,000m³ in volume and 7.5m in height, any","q_en":"A client wants a single-storey steel warehouse on site, 6,500 m³ in volume and 7 m high, without fire protection to the steelwork. Is this allowed under the FS Code? Under what conditions?","m_en":"Yes. C4.3: for a single-storey building not exceeding 7,000 m³ in volume and 7.5 m in height, with a clear distance of not less than 6 m to adjoining buildings or the site boundary, the steel structure may be left unprotected.","e_en":"All three conditions must be met. A common trap is later adding a mezzanine (making it multi-storey) or increasing the height, which loses the exemption.","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","scenario","中級"]},{"id":"FIR-007","t":"num","d":2,"tp":"耐火等級 FRR","c":"C4.3","p":88,"q":"C4.3 無保護鋼結構的單層建築須與鄰近建築或地界保持不少於多少 m 淨空？","a":6,"tol":0,"u":"m","e":"6 m 淨空是防止火勢蔓延到鄰近建築的條件。","x":"adjoining building or the site boundary by a clear unobstructed open space not less than 6m","q_en":"Under C4.3, a single-storey building with unprotected steelwork must be separated from adjoining buildings or the site boundary by a clear distance of not less than how many m?","e_en":"The 6 m clearance is the condition to prevent fire spread to adjoining buildings.","doc":"fire-safety-2011-2024ed","pp":"79","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","中級"]},{"id":"FIR-008","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Structural frame、beam 或 column 須滿足哪些 FRR 準則？","o":["只需 Stability","Stability + Integrity","Stability + Integrity + Insulation","只需 Integrity"],"a":0,"e":"結構框架只需穩定性（exposed faces only）；樓板三項都要（每邊分別）。所以 FRR 60 的樓板要考慮隔熱（厚度），而樑柱則是保護層及尺寸。","x":"1 Structural frame, Y N N Exposed faces only","q_en":"Table C2: which FRR criteria must a structural frame, beam or column satisfy?","o_en":["Stability only","Stability + Integrity","Stability + Integrity + Insulation","Integrity only"],"e_en":"Structural frames need only stability (exposed faces only); floors need all three (each side separately). So an FRR 60 floor must consider insulation (thickness), while beams and columns are governed by cover and dimensions.","doc":"fire-safety-2011-2024ed","pp":"80","tags":["fire-safety-2011-2024ed","耐火等級 FRR","mcq","中級"]},{"id":"FIR-009","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2","p":89,"q":"Table C2：Floor（包括 fire compartment floor）須滿足 stability、integrity 及 insulation，並每邊分別測試。","a":true,"e":"樓板作為 compartment floor，三項都要，故 Table E4 同時規定厚度及保護層。","x":"2 Floor including fire Y Y Y Each side separately","q_en":"Table C2: floors (including fire compartment floors) must satisfy stability, integrity and insulation, tested for each side separately.","e_en":"True. As compartment floors, floors need all three, which is why Table E4 specifies both thickness and cover.","doc":"fire-safety-2011-2024ed","pp":"80","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-010","t":"tf","d":2,"tp":"耐火等級 FRR","c":"Table C2 Note 3","p":90,"q":"按 FS Code，curtain wall glazing 一般不需要 FRR（受 C5 及 C9.7 規限）。","a":true,"e":"幕牆玻璃本身不需 FRR，但樓層之間要有 spandrel 或水平突出（C11）及防火封堵。","x":"3. Subject to Subsection C5 and Clause C9.7, curtain wall glazing does not require to","q_en":"Under the FS Code, curtain wall glazing generally does not require an FRR (subject to C5 and C9.7).","e_en":"True. Curtain wall glass itself needs no FRR, but spandrels or horizontal projections (C11) and fire stopping are required between floors.","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-011","t":"num","d":3,"tp":"耐火等級 FRR","c":"Table C2 Note 5","p":90,"q":"Smoke outlet shaft 截面面積收窄至原來的百分之幾或以下，即視為 stability 失效？","a":75,"tol":0,"u":"%","e":"排煙井的 stability 準則以截面保持為定義，與一般結構構件不同。","x":"5. Any restriction of the cross-section area of the smoke outlet shaft to 75% or less of its","q_en":"A smoke outlet shaft is deemed to fail the stability criterion when its cross-sectional area is reduced to what percentage of the original or less?","e_en":"The stability criterion of smoke shafts is defined by retention of the cross-section, unlike ordinary structural elements.","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","耐火等級 FRR","num","進階"]},{"id":"FIR-012","t":"num","d":2,"tp":"防火分隔 Separation","c":"C5.2","p":90,"q":"同一地盤內兩座建築相距少於多少 m 時被視為 adjoining buildings？","a":1.8,"tol":0,"u":"m","e":"相鄰建築之間的外牆要按夾角（>135° 或 ≤135°）設置無開口的耐火外牆。","x":"apart. Fire barriers should be provided in compliance with the following requirements:","q_en":"Two buildings on the same site are regarded as adjoining buildings when they are less than how many m apart?","e_en":"External walls between adjoining buildings must be fire-resisting external walls without openings, depending on the included angle (>135° or ≤135°).","doc":"fire-safety-2011-2024ed","pp":"81","tags":["fire-safety-2011-2024ed","防火分隔 Separation","num","中級"]},{"id":"FIR-013","t":"mcq","d":2,"tp":"外部火勢蔓延 External fire spread","c":"C11.1","p":99,"q":"C11.1：上下層外牆之間的分隔可採用？","o":["900 mm spandrel 或 500 mm 水平突出","600 mm spandrel 或 300 mm 水平突出","1200 mm spandrel","無要求"],"a":0,"e":"FRR 不少於該層；單一家庭住宅或有 sprinkler 的建築不適用。結構上 spandrel 樑/牆的高度要配合建築立面設計。","x":"(a) a spandrel that is a vertical element of 900mm, with an FRR of not less than that of","q_en":"C11.1: separation between external walls of storeys one above the other may be provided by:","o_en":["A 900 mm spandrel or a 500 mm horizontal projection","A 600 mm spandrel or a 300 mm horizontal projection","A 1200 mm spandrel","No requirement"],"e_en":"FRR not less than that of the storey; not applicable to single-family houses or sprinklered buildings. Structurally, the height of spandrel beams/walls must suit the architectural elevation.","doc":"fire-safety-2011-2024ed","pp":"90","tags":["fire-safety-2011-2024ed","外部火勢蔓延 External fire spread","mcq","中級"]},{"id":"FIR-014","t":"tf","d":2,"tp":"外部火勢蔓延 External fire spread","c":"C11.1 Commentary","p":99,"q":"FS Code 評論指 900 mm spandrel 可有效防止垂直火勢蔓延。","a":false,"e":"Commentary 指 spandrel 只能減慢火焰蔓延，未必能防止；sprinkler 才是最有效的垂直火勢控制。","x":"A 900mm spandrel or 500mm horizontal projection is effective in slowing flame spread only","q_en":"The FS Code commentary says a 900 mm spandrel effectively prevents vertical fire spread.","e_en":"False. The commentary says spandrels can only slow down flame spread and may not prevent it; sprinklers are the most effective control of vertical fire spread.","doc":"fire-safety-2011-2024ed","pp":"90","tags":["fire-safety-2011-2024ed","外部火勢蔓延 External fire spread","tf","中級"]},{"id":"FIR-015","t":"mcq","d":3,"tp":"中庭 Atrium","c":"C10.3","p":99,"q":"有 sprinkler 建築的 atrium，限制是？","o":["體積 ≤28,000 m³、高度 ≤15 m、連接不多於 3 層","體積 ≤10,500 m³、高度 ≤20 m、不多於 5 層","體積不限、高度 ≤15 m","體積 ≤7,000 m³、不多於 2 層"],"a":0,"e":"超出須由 Building Authority 決定或以 fire engineering 處理。大跨度中庭屋頂結構亦要按 FRR 設計。","x":"(b) the volume of an atrium should not exceed 28,000m3;","q_en":"What are the limits for an atrium in a sprinklered building?","o_en":["Volume ≤28,000 m³, height ≤15 m, connecting not more than 3 storeys","Volume ≤10,500 m³, height ≤20 m, not more than 5 storeys","Unlimited volume, height ≤15 m","Volume ≤7,000 m³, not more than 2 storeys"],"e_en":"Beyond these, the Building Authority decides or fire engineering is used. Long-span atrium roof structures must also be designed for the FRR.","doc":"fire-safety-2011-2024ed","pp":"90","tags":["fire-safety-2011-2024ed","中庭 Atrium","mcq","進階"]},{"id":"FIR-016","t":"mcq","d":2,"tp":"特殊危險 Special hazard","c":"C13.1","p":101,"q":"特殊危險區域（如變壓器房）的 fire barrier FRR？直接連接 protected exit 時？","o":["-/120/120；-/240/240","-/60/60；-/120/120","120/120/120；240/240/240","-/240/240；-/240/240"],"a":0,"e":"FRR 寫法為 stability/integrity/insulation。特殊危險房間的牆及樓板厚度要按 120 或 240 分鐘設計。","x":"building by fire barriers having an FRR of not less than -/120/120. If the special hazard","q_en":"FRR of fire barriers to special hazard areas (e.g. transformer rooms)? And where directly connected to a protected exit?","o_en":["-/120/120; -/240/240","-/60/60; -/120/120","120/120/120; 240/240/240","-/240/240; -/240/240"],"e_en":"FRR is written as stability/integrity/insulation. Walls and floor thicknesses of special hazard rooms must be designed for 120 or 240 minutes.","doc":"fire-safety-2011-2024ed","pp":"92","tags":["fire-safety-2011-2024ed","特殊危險 Special hazard","mcq","中級"]},{"id":"FIR-017","t":"mcq","d":2,"tp":"地庫 Basement","c":"C14.1","p":103,"q":"C14.1：地庫所有 elements of construction 的 FRR？","o":["240/240/240","120/120/120","60/60/60","與上層相同"],"a":0,"e":"地庫結構 240 分鐘，地面層與地庫之間的 fire barrier -/240/240。結構設計要按 FRR 240 查 Table E4/E6（例如樓板 170 mm、保護層 45/55 mm）。","x":"(b) all elements of construction of the basement should have an FRR of not less than","q_en":"C14.1: FRR of all elements of construction in a basement?","o_en":["240/240/240","120/120/120","60/60/60","Same as the floors above"],"e_en":"Basement structure 240 minutes; fire barrier between ground floor and basement -/240/240. Structural design must use Table E4/E6 for FRR 240 (e.g. slab 170 mm, cover 45/55 mm).","doc":"fire-safety-2011-2024ed","pp":"94","tags":["fire-safety-2011-2024ed","地庫 Basement","mcq","中級"]},{"id":"FIR-018","t":"num","d":3,"tp":"地庫 Basement","c":"C14.2","p":103,"q":"四面封閉地庫的 smoke outlets 間距不超過多少 m？","a":30,"tol":0,"u":"m","e":"面積合計不少於服務樓面 0.5%（倉庫 2.5%），最小尺寸 1 m。結構上要在地面層樓板預留開口。","x":"(a) be not more than 30m apart and situated along the street frontages or adjacent to","q_en":"Smoke outlets for a basement enclosed on all sides should be spaced at not more than how many m?","e_en":"Aggregate area not less than 0.5% of the floor area served (2.5% for warehouses), minimum dimension 1 m. Structurally, openings must be provided in the ground floor slab.","doc":"fire-safety-2011-2024ed","pp":"94","tags":["fire-safety-2011-2024ed","地庫 Basement","num","進階"]},{"id":"FIR-019","t":"num","d":3,"tp":"地庫 Basement","c":"C14.2(d)","p":103,"q":"一般地庫 smoke outlets 合計面積不少於服務樓面面積的百分之幾？","a":0.5,"tol":0,"u":"%","e":"Bulk storage/warehouse 則為 2.5%。","x":"(d) have an area in aggregate of not less than 0.5% of the floor area they serve or, in","q_en":"For a typical basement, the aggregate area of smoke outlets should be not less than what percentage of the floor area served?","e_en":"For bulk storage/warehouses it is 2.5%.","doc":"fire-safety-2011-2024ed","pp":"94","tags":["fire-safety-2011-2024ed","地庫 Basement","num","進階"]},{"id":"FIR-020","t":"mcq","d":2,"tp":"避火層 Refuge floor","c":"B18.1","p":55,"q":"何時須設 refuge floor？間距？","o":["超過 25 層；一般每不多於 25 層（工業 20 層）","超過 40 層；每 20 層","超過 30 層；每 30 層","超過 20 層；每 15 層"],"a":0,"e":"避火層結構上通常是轉換層位置，要考慮開放兩邊的通風、淨高 2300 mm 及面積 ≥50%。","x":"exceeding 25 storeys in height above the lowest ground storey, at not more than 20 storeys","q_en":"When is a refuge floor required, and at what interval?","o_en":["More than 25 storeys; generally at not more than every 25 storeys (20 storeys for industrial)","More than 40 storeys; every 20 storeys","More than 30 storeys; every 30 storeys","More than 20 storeys; every 15 storeys"],"e_en":"Refuge floors are often at transfer levels structurally; consider ventilation from two open sides, a clear height of 2300 mm and an area of ≥50%.","doc":"fire-safety-2011-2024ed","pp":"46","tags":["fire-safety-2011-2024ed","避火層 Refuge floor","mcq","中級"]},{"id":"FIR-021","t":"num","d":2,"tp":"避火層 Refuge floor","c":"B18.2(b)","p":55,"q":"Refuge floor 的淨避難面積不少於該層總樓面面積的百分之幾？","a":50,"tol":0,"u":"%","e":"另淨高不少於 2300 mm，最小尺寸比最闊樓梯大 50%。","x":"(b) The net area for refuge should be not less than 50% of the total gross floor area of","q_en":"The net refuge area of a refuge floor should be not less than what percentage of the gross floor area of that floor?","e_en":"Also a clear height of not less than 2300 mm, and a minimum dimension 50% greater than the widest staircase.","doc":"fire-safety-2011-2024ed","pp":"46","tags":["fire-safety-2011-2024ed","避火層 Refuge floor","num","中級"]},{"id":"FIR-022","t":"num","d":2,"tp":"避火層 Refuge floor","c":"B18.2(b)","p":55,"q":"Refuge floor 避難區的最少淨高（mm）？","a":2300,"tol":0,"u":"mm","e":"避火層常有轉換大樑，淨高要扣除樑深，結構佈置要早與建築師協調。","x":"the refuge floor and should have a clear headroom of not less than 2300mm;","q_en":"What is the minimum clear height (mm) of the refuge area on a refuge floor?","e_en":"Refuge floors often have deep transfer girders; the clear height is measured below the beams, so coordinate the structural layout with the architect early.","doc":"fire-safety-2011-2024ed","pp":"46","tags":["fire-safety-2011-2024ed","避火層 Refuge floor","num","中級"]},{"id":"FIR-023","t":"mcq","d":1,"tp":"防火測試 Fire tests","c":"E3.1","p":158,"q":"承重構件的耐火測試主要按哪個標準系列？","o":["BS EN 1363 / BS EN 1365","BS 8110","BS 5950-8","ASTM E119"],"a":0,"e":"BS 476 Part 20/21 在過時前仍然適用；分類按 BS EN 13501-2。以計算方法（如 Eurocode fire parts）則屬 fire engineering 範疇（Part G）。","x":"(a) BS EN 1363-1:1999, Fire resistance tests. General requirements;","q_en":"Fire tests of loadbearing elements are mainly to which series of standards?","e_en":"BS 476 Part 20/21 remains applicable until withdrawn; classification to BS EN 13501-2. Calculation methods (e.g. Eurocode fire parts) belong to fire engineering (Part G).","doc":"fire-safety-2011-2024ed","pp":"149","tags":["fire-safety-2011-2024ed","防火測試 Fire tests","mcq","基礎"]},{"id":"FIR-024","t":"tf","d":2,"tp":"防火測試 Fire tests","c":"E3.2","p":158,"q":"BS 476 Part 20 及 21 在 FS Code 2011（2024 版）下已不可再用。","a":false,"e":"E3.2 寫明在其被廢止前仍適用，所以舊的防火板/噴塗測試報告仍可能被接受，但要留意有效性。","x":"The following British Standards will still be applicable until they are obsolete:","q_en":"BS 476 Part 20 and Part 21 can no longer be used under the FS Code 2011 (2024 Edition).","e_en":"False. E3.2 states they remain applicable until withdrawn, so older fire board/spray test reports may still be accepted, but check their validity.","doc":"fire-safety-2011-2024ed","pp":"149","tags":["fire-safety-2011-2024ed","防火測試 Fire tests","tf","中級"]},{"id":"FIR-025","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：實心 RC 樓板 FRR 120 分鐘所需最小厚度？","o":["100 mm","125 mm","150 mm","170 mm"],"a":1,"e":"60/120/240 分鐘：100/125/170 mm。住宅一般 FRR 60，樓板 ≥100 mm；地庫 240 分鐘要 170 mm。","x":"Thickness of concrete 170 125 100","q_en":"Table E4: minimum thickness of a solid RC floor for FRR 120 minutes?","e_en":"60/120/240 minutes: 100/125/170 mm. Residential is generally FRR 60, slab ≥100 mm; basements at 240 minutes need 170 mm.","doc":"fire-safety-2011-2024ed","pp":"168","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","mcq","中級"]},{"id":"FIR-026","t":"num","d":2,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：簡支實心 RC 樓板 FRR 120 分鐘的鋼筋保護層（mm）？","a":35,"tol":0,"u":"mm","e":"簡支 60/120/240：20/35/55*；連續：20/25/45*（* 需要 fabric/mesh 防爆裂）。要與 Concrete Code 耐久性保護層比較並取大值。","x":"simply supported 55* 35 20","q_en":"Table E4: reinforcement cover (mm) for a simply supported solid RC floor at FRR 120 minutes?","e_en":"Simply supported 60/120/240: 20/35/55*; continuous: 20/25/45* (* fabric/mesh needed against spalling). Compare with the Concrete Code durability cover and take the greater.","doc":"fire-safety-2011-2024ed","pp":"168","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","中級"]},{"id":"FIR-027","t":"num","d":3,"tp":"構件耐火 Part E tables","c":"Table E4","p":177,"q":"Table E4：連續實心 RC 樓板 FRR 240 分鐘的保護層（mm）？","a":45,"tol":0,"u":"mm","e":"帶 * 表示保護層內須加 expanded metal lath 或 wire fabric（距面 ≤20 mm），以防保護層剝落。","x":"continuous 45* 25 20","q_en":"Table E4: cover (mm) for a continuous solid RC floor at FRR 240 minutes?","e_en":"The * means expanded metal lath or wire fabric must be provided within the cover (≤20 mm from the surface) to prevent the cover spalling off.","doc":"fire-safety-2011-2024ed","pp":"168","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","進階"]},{"id":"FIR-028","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：完全外露 RC 柱 FRR 120 分鐘所需最小尺寸及保護層？","o":["300 mm；35 mm","200 mm；25 mm","450 mm；35 mm","240 mm；25 mm"],"a":0,"e":"完全外露 60/120/240：200/300/450 mm，保護層 25/35/35 mm。細柱（如 250 mm）只能達 60 分鐘。","x":"(a) Fully exposed columns and hangers 450 300 200","q_en":"Table E6: minimum dimension and cover of a fully exposed RC column for FRR 120 minutes?","o_en":["300 mm; 35 mm","200 mm; 25 mm","450 mm; 35 mm","240 mm; 25 mm"],"e_en":"Fully exposed 60/120/240: 200/300/450 mm, cover 25/35/35 mm. Slender columns (e.g. 250 mm) only achieve 60 minutes.","doc":"fire-safety-2011-2024ed","pp":"170","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","mcq","中級"]},{"id":"FIR-029","t":"num","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：RC 樑 FRR 60 分鐘的最小寬度（mm）？","a":200,"tol":0,"u":"mm","e":"60 及 120 分鐘都是 200 mm，240 分鐘 280 mm。保護層簡支 30/50*/80*。","x":"Width of beam 280 200 200","q_en":"Table E6: minimum width (mm) of an RC beam for FRR 60 minutes?","e_en":"200 mm for both 60 and 120 minutes, 280 mm for 240 minutes. Cover for simply supported: 30/50*/80*.","doc":"fire-safety-2011-2024ed","pp":"170","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","中級"]},{"id":"FIR-030","t":"num","d":3,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：簡支 RC 樑 FRR 120 分鐘的主筋保護層（mm）？","a":50,"tol":0,"u":"mm","e":"50* 帶星號，須加防剝落網。連續樑 120 分鐘只需 40 mm。實務上多數樑按連續設計較經濟。","x":"simply supported 80* 50* 30","q_en":"Table E6: main bar cover (mm) of a simply supported RC beam for FRR 120 minutes?","e_en":"50* has an asterisk: anti-spalling mesh is needed. A continuous beam needs only 40 mm at 120 minutes. In practice designing most beams as continuous is more economical.","doc":"fire-safety-2011-2024ed","pp":"170","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","進階"]},{"id":"FIR-031","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E2","p":175,"q":"Table E2：含不少於 1% 豎向鋼筋的 RC 牆，FRR 120 分鐘的最小厚度？","o":["75 mm","100 mm","160 mm","180 mm"],"a":1,"e":"≥1% 鋼筋：60/120/240 為 75/100/180 mm；<1% 鋼筋：120/160/240 mm。保護層 15/25/25 mm。","x":"(a) containing not less than 1 per cent of vertical 180 100 75","q_en":"Table E2: minimum thickness of an RC wall with not less than 1% vertical reinforcement for FRR 120 minutes?","e_en":"≥1% reinforcement: 60/120/240 are 75/100/180 mm; <1% reinforcement: 120/160/240 mm. Cover 15/25/25 mm.","doc":"fire-safety-2011-2024ed","pp":"166","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","mcq","中級"]},{"id":"FIR-032","t":"num","d":2,"tp":"構件耐火 Part E tables","c":"Table E5","p":178,"q":"Table E5：鋼柱（≥45 kg/m）以 Grade 20 混凝土實心包覆，FRR 120 分鐘所需厚度（mm）？","a":50,"tol":0,"u":"mm","e":"60 及 120 分鐘 50 mm，240 分鐘 75 mm。混凝土包覆要按 Steel Code 配筋。","x":"(a) Concrete not inferior to Grade 20 and reinforced in accordance with 75 50 50","q_en":"Table E5: thickness (mm) of solid Grade 20 concrete encasement to a steel column (≥45 kg/m) for FRR 120 minutes?","e_en":"50 mm for 60 and 120 minutes, 75 mm for 240 minutes. Concrete encasement must be reinforced per the Steel Code.","doc":"fire-safety-2011-2024ed","pp":"169","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","中級"]},{"id":"FIR-033","t":"mcq","d":2,"tp":"構件耐火 Part E tables","c":"Table E7","p":180,"q":"Table E7：RC 樓梯 FRR 60 分鐘的 waist 厚度及保護層？","o":["95 mm；20 mm","125 mm；35 mm","170 mm；55 mm","100 mm；25 mm"],"a":0,"e":"60/120/240：95/125/170 mm；保護層 20/35/55*。","x":"Thickness at waist of slab 170 125 95","q_en":"Table E7: waist thickness and cover of an RC stair for FRR 60 minutes?","o_en":["95 mm; 20 mm","125 mm; 35 mm","170 mm; 55 mm","100 mm; 25 mm"],"e_en":"60/120/240: 95/125/170 mm; cover 20/35/55*.","doc":"fire-safety-2011-2024ed","pp":"171","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","mcq","中級"]},{"id":"FIR-034","t":"short","d":3,"tp":"性能化設計 Fire engineering","c":"G7.2","p":235,"q":"以 fire engineering 評估結構性能時，FSAR 應考慮哪些重要設計方面？（列出至少四項）","m":"設計火災及試驗數據的使用；以全 compartment burn-out 計算 FRR；time-equivalence 方法及其限制；構件傳熱計算方法；試驗資料的應用與調整；合適的驗收準則；消防介入的角色；相關安全系數及安全餘量。","k":["design fires","full burn-out","time-equivalence limits","heat transfer calc","acceptance criteria","safety factors"],"e":"性能化防火設計在大跨度鋼結構（如機場、展覽館）常用，以減少防火塗料。結構工程師要提交高溫下的結構分析，並與 fire engineer 協調設計火災。","x":"(b) calculation of FRR, based on full fire compartment burn-out;","q_en":"When assessing structural performance by fire engineering, what important design aspects should the FSAR consider? (List at least four.)","m_en":"Use of design fires and test data; calculation of FRR on the basis of a full compartment burn-out; the time-equivalence method and its limitations; heat transfer calculation methods for elements; application and adjustment of test data; appropriate acceptance criteria; the role of fire brigade intervention; relevant safety factors and safety margins.","e_en":"Performance-based fire design is common for long-span steel structures (e.g. airports, exhibition halls) to reduce intumescent coatings. The structural engineer must submit structural analysis at elevated temperature and coordinate the design fire with the fire engineer.","doc":"fire-safety-2011-2024ed","pp":"226","tags":["fire-safety-2011-2024ed","性能化設計 Fire engineering","short","進階"]},{"id":"FIR-035","t":"mcq","d":3,"tp":"避火層 Refuge floor","c":"B18.3 Commentary","p":56,"q":"以主天台作 refuge floor 時，毗鄰避難區的 plant room FRR 要求？","o":["-/120/120","-/60/60","-/30/30","240/240/240"],"a":0,"e":"另 1.8 m 內的梯屋 -/60/60，私人天台與避難區以 ≥1.5 m 實心圍牆分隔。","x":"refuge area by a solid fence wall of not less than 1.5m high. Any stairhood to be erected within","q_en":"Where the main roof is used as a refuge floor, what is the FRR requirement for plant rooms adjacent to the refuge area?","e_en":"Also, staircase roofs within 1.8 m are -/60/60, and private roofs are separated from the refuge area by solid walls ≥1.5 m high.","doc":"fire-safety-2011-2024ed","pp":"47","tags":["fire-safety-2011-2024ed","避火層 Refuge floor","mcq","進階"]},{"id":"FIR-036","t":"tf","d":2,"tp":"耐火等級 FRR","c":"C3.2","p":86,"q":"Fire barrier 上所有開口、接縫及貫穿位的保護，FRR 不得低於該 fire barrier。","a":true,"e":"結構伸縮縫、管道穿牆位要用 fire-stopping 保持同等 FRR，常在驗收時被發現遺漏。","x":"penetrations located in a fire barrier should have an FRR not less than that of the fire barrier.","q_en":"Protection of all openings, joints and penetrations in a fire barrier must have an FRR not less than that of the fire barrier.","e_en":"True. Structural movement joints and service penetrations must use fire-stopping to maintain the same FRR; omissions are often found at completion inspection.","doc":"fire-safety-2011-2024ed","pp":"77","tags":["fire-safety-2011-2024ed","耐火等級 FRR","tf","中級"]},{"id":"FIR-037","t":"num","d":2,"tp":"構件耐火 Part E tables","c":"Table E6","p":179,"q":"Table E6：一面外露 RC 柱 FRR 240 分鐘的最小尺寸（mm）？","a":240,"tol":0,"u":"mm","e":"一面外露（例如嵌入牆內）60/120/240：120/160/240 mm。","x":"(c) One face exposed of columns and hangers 240 160 120","q_en":"Table E6: minimum dimension (mm) of an RC column with one face exposed for FRR 240 minutes?","e_en":"One face exposed (e.g. embedded in a wall) 60/120/240: 120/160/240 mm.","doc":"fire-safety-2011-2024ed","pp":"170","tags":["fire-safety-2011-2024ed","構件耐火 Part E tables","num","中級"]},{"id":"FIR-038","t":"mcq","d":2,"tp":"特殊危險 Special hazard","c":"C13.2","p":101,"q":"餐廳廚房作為附屬用途時，圍封 fire barrier 的 FRR？","o":["-/60/60","-/30/30","-/120/120","無要求"],"a":0,"e":"廚房 -/60/60；使用面積 >45 m² 且 lobby 開向用餐區出口路線時，須設 protected lobby。","x":"(a) the kitchen should be enclosed by fire barriers having an FRR of not less than","q_en":"Where a restaurant kitchen is an ancillary use, what is the FRR of the enclosing fire barrier?","o_en":["-/60/60","-/30/30","-/120/120","No requirement"],"e_en":"Kitchen -/60/60; where the usable area is >45 m² and the lobby opens onto the exit route of the dining area, a protected lobby is required.","doc":"fire-safety-2011-2024ed","pp":"92","tags":["fire-safety-2011-2024ed","特殊危險 Special hazard","mcq","中級"]},{"id":"FDN-001","t":"num","d":1,"tp":"承載力 Bearing capacity","c":"2.2.1","p":17,"q":"Rational design method：一般對計算所得的 ultimate bearing capacity 採用多少的 factor of safety 求 allowable capacity？","a":3,"tol":0,"u":"","e":"FOS 3 是慣例，但規範容許按土石性質、場地變化及設計方法可靠性採用其他數值。提交時若用低於 3 要有充分理據（例如有載荷試驗）。","x":"Normally, the allowable capacity is estimated by applying a factor of safety of 3 to the","q_en":"Rational design method: what factor of safety is generally applied to the calculated ultimate bearing capacity to obtain the allowable capacity?","e_en":"A FOS of 3 is conventional, but the Code allows other values depending on the ground properties, site variability and reliability of the design method. If less than 3 is used in a submission, adequate justification is needed (e.g. load tests).","doc":"foundations-2017-2024ed","pp":"9","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","基礎"]},{"id":"FDN-002","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"2.2.2(3)","p":18,"q":"在無不利岩石節理下，岩石的 allowable lateral bearing pressure 可取 allowable vertical bearing pressure 的幾分之一？（填小數）","a":0.333,"tol":0.01,"u":"","calc":true,"e":"規範寫明 one third。岩石嵌固段（rock socket）抵抗側向力時常用此值；如有不利節理必須另行分析。","x":"The allowable lateral bearing pressure for rock may be taken as one third of","q_en":"In the absence of adverse rock joints, the allowable lateral bearing pressure of rock may be taken as what fraction of the allowable vertical bearing pressure? (Enter a decimal.)","e_en":"The Code states one third. Commonly used for rock sockets resisting lateral loads; adverse joints must be analysed separately.","doc":"foundations-2017-2024ed","pp":"10","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-003","t":"mcq","d":1,"tp":"承載力 Bearing capacity","c":"2.2.2(5)","p":18,"q":"小型或臨時構築物、平地上以粒狀材料為承托層的基腳，可採用的 presumed allowable vertical bearing pressure 為？","o":["乾 100 kPa／浸水 50 kPa","乾 150 kPa／浸水 75 kPa","乾 200 kPa／浸水 100 kPa","乾 300 kPa／浸水 150 kPa"],"a":0,"e":"適用於圍板、小型棚架等。注意只限平地及 granular materials；斜坡上或填土上不能直接套用。","x":"A presumed allowable vertical bearing pressure of 100 kPa (if dry) or 50 kPa","q_en":"For small or temporary structures with footings founded on granular materials on level ground, what presumed allowable vertical bearing pressure may be adopted?","o_en":["Dry 100 kPa / submerged 50 kPa","Dry 150 kPa / submerged 75 kPa","Dry 200 kPa / submerged 100 kPa","Dry 300 kPa / submerged 150 kPa"],"e_en":"Applies to hoardings, small sheds, etc. Note it is limited to level ground and granular materials; it cannot be applied directly on slopes or fill.","doc":"foundations-2017-2024ed","pp":"10","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","基礎"]},{"id":"FDN-004","t":"num","d":1,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Table 2.1：Category 1(a) 岩石（新鮮至輕微風化、強至極強花崗岩/火山岩，100% TCR，UCS ≥75 MPa）的 presumed allowable bearing pressure（kPa）？","a":10000,"tol":0,"u":"kPa","e":"1(a) 10 000、1(b) 7 500、1(c) 5 000、1(d) 3 000 kPa。大直徑鑽孔樁常用 1(a)/1(b)，要以 5 m 的 TCR 證明及 PLI/UCS 試驗支持。","x":"Fresh to slightly decomposed strong to very strong 10 000","q_en":"Table 2.1: presumed allowable bearing pressure (kPa) of Category 1(a) rock (fresh to slightly decomposed, strong to extremely strong granite/volcanic rock, 100% TCR, UCS ≥75 MPa)?","e_en":"1(a) 10 000, 1(b) 7 500, 1(c) 5 000, 1(d) 3 000 kPa. Large-diameter bored piles commonly use 1(a)/1(b), supported by 5 m of TCR evidence and PLI/UCS tests.","doc":"foundations-2017-2024ed","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","基礎"]},{"id":"FDN-005","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 1(b) 岩石要求的 TCR of the designated grade 及 UCS 分別是？","o":["≥95% TCR、UCS ≥50 MPa","100% TCR、UCS ≥75 MPa","≥85% TCR、UCS ≥25 MPa","≥50% TCR、無 UCS 要求"],"a":0,"e":"1(b)：≥95% TCR，UCS ≥50 MPa（或 PLI50 ≥2 MPa），允許 7 500 kPa。鑽探報告的 core run TCR 與 designated grade TCR 定義不同，別混淆。","x":"better, and with not less than 95% TCR of the","q_en":"What TCR of the designated grade and UCS are required for Category 1(b) rock?","o_en":["≥95% TCR, UCS ≥50 MPa","100% TCR, UCS ≥75 MPa","≥85% TCR, UCS ≥25 MPa","≥50% TCR, no UCS requirement"],"e_en":"1(b): ≥95% TCR, UCS ≥50 MPa (or PLI50 ≥2 MPa), allowing 7 500 kPa. The core run TCR in drilling reports is defined differently from the TCR of the designated grade — do not confuse them.","doc":"foundations-2017-2024ed","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","中級"]},{"id":"FDN-006","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 1(c) 岩石的 presumed allowable bearing pressure（kPa）？","a":5000,"tol":0,"u":"kPa","e":"1(c)：Grade III 或更好、≥85% TCR、UCS ≥25 MPa。也是 rock socket bond 700 kPa 的門檻類別。","x":"Slightly to moderately decomposed moderately 5 000","q_en":"Presumed allowable bearing pressure (kPa) of Category 1(c) rock?","e_en":"1(c): Grade III or better, ≥85% TCR, UCS ≥25 MPa. It is also the threshold category for the 700 kPa rock socket bond.","doc":"foundations-2017-2024ed","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-007","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":19,"q":"Category 3 intermediate soil（SPT N ≥200 的 HDG/CDG）的 presumed allowable bearing pressure（kPa）？","a":1000,"tol":0,"u":"kPa","e":"N ≥200 的風化土可用 1 000 kPa，常見於 driven H-pile 或 bored pile 以土承托的情況，並可視為滿足 30 mm 沉降準則（2.3.2）。","x":"or better, with SPT N-value ≥ 200.","q_en":"Presumed allowable bearing pressure (kPa) of Category 3 intermediate soil (HDG/CDG with SPT N ≥200)?","e_en":"Decomposed soil with N ≥200 may use 1 000 kPa, common for driven H-piles or bored piles founded in soil, and may be regarded as meeting the 30 mm settlement criterion (2.3.2).","doc":"foundations-2017-2024ed","pp":"11","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-008","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1","p":20,"q":"Table 2.1：Dense 非黏性土（SPT N 30–50）的 presumed allowable bearing pressure（乾/浸水）？","o":["500 / 250 kPa","300 / 150 kPa","100 / 50 kPa","150 / 75 kPa"],"a":1,"e":"4(a) very dense 500/250、4(b) dense 300/150、4(c) medium dense 100/50。地下水位介乎兩者可線性內插。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","q_en":"Table 2.1: presumed allowable bearing pressure (dry/submerged) of dense non-cohesive soil (SPT N 30–50)?","e_en":"4(a) very dense 500/250, 4(b) dense 300/150, 4(c) medium dense 100/50. For a groundwater level between the two, interpolate linearly.","doc":"foundations-2017-2024ed","pp":"12","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","中級"]},{"id":"FDN-009","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note (3)","p":20,"q":"Category 1(a) 及 1(b) 岩石的最小 socket depth（沿樁周）是多少 mm？","a":500,"tol":0,"u":"mm","e":"1(a)/1(b) 500 mm；1(c)、1(d)、2 為 300 mm。計算 bond/friction 時此最小嵌固段貢獻須忽略（5.3.2(2)）。","x":"Minimum socket depth along the pile perimeter is 500 mm for categories 1(a)","q_en":"What is the minimum socket depth (along the pile perimeter) in Category 1(a) and 1(b) rock, in mm?","e_en":"1(a)/1(b) 500 mm; 1(c), 1(d) and 2 are 300 mm. The contribution of this minimum socket must be ignored when calculating bond/friction (5.3.2(2)).","doc":"foundations-2017-2024ed","pp":"12","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-010","t":"num","d":3,"tp":"承載力 Bearing capacity","c":"Table 2.1 Note (5)","p":20,"q":"TCR of the designated grade 須證明至進入該類岩石最少多深（m）？","a":5,"tol":0,"u":"m","e":"最小嵌固深度以下需 5 m，分為每段 1 m，每段 TCR 都要達標。常見錯誤係只計整體平均 TCR。","x":"(5) The TCR of the designated grade should be proved to a depth at least 5 m into","q_en":"The TCR of the designated grade must be proven to at least what depth (m) into rock of that category?","e_en":"5 m below the minimum socket depth, divided into 1 m sections, each of which must meet the TCR. A common error is counting only the overall average TCR.","doc":"foundations-2017-2024ed","pp":"12","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","進階"]},{"id":"FDN-011","t":"num","d":3,"tp":"承載力 Bearing capacity","c":"Figure 2.1 Note 5","p":21,"q":"Figure 2.1：劣於指定等級或被沖走的材料（b+e）最大連續長度不應大於多少 mm？","a":300,"tol":0,"u":"mm","e":"即使整體 TCR 達標，若有超過 300 mm 的連續軟弱帶，亦不符合要求。","x":"to the designated grade, b+e, should not be greater than 300 mm.","q_en":"Figure 2.1: the maximum continuous length of material worse than the designated grade or washed out (b+e) should not be greater than how many mm?","e_en":"Even if the overall TCR is met, a continuous weak zone of more than 300 mm does not comply.","doc":"foundations-2017-2024ed","pp":"13","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","進階"]},{"id":"FDN-012","t":"mcq","d":2,"tp":"承載力 Bearing capacity","c":"Table 2.2","p":21,"q":"Table 2.2：Category 1(c) 或更好岩石與混凝土/灌漿的 presumed allowable bond（受壓或短暫拉力 / 永久拉力）？","o":["700 / 350 kPa","300 / 150 kPa","1000 / 500 kPa","400 / 200 kPa"],"a":0,"e":"1(c)+ 700/350、1(d)/2 300/150 kPa；灌漿或混凝土須 ≥30 MPa。風荷載屬 transient tension 可用較高值。","x":"1(c) or better 700 350","q_en":"Table 2.2: presumed allowable bond between Category 1(c) or better rock and concrete/grout (compression or transient tension / permanent tension)?","e_en":"1(c)+ 700/350, 1(d)/2 300/150 kPa; grout or concrete must be ≥30 MPa. Wind load is transient tension and may use the higher value.","doc":"foundations-2017-2024ed","pp":"13","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","中級"]},{"id":"FDN-013","t":"num","d":2,"tp":"承載力 Bearing capacity","c":"2.2.4","p":22,"q":"Bearing capacity equation：粒狀土的 ultimate bearing capacity qu 上限為多少 kPa？","a":3000,"tol":0,"u":"kPa","e":"公式計出的 qu 不可超過 3 000 kPa，再以 FOS ≥3 求 qa。","x":"ultimate bearing capacity of the granular soil, which should be limited","q_en":"Bearing capacity equation: what is the upper limit on the ultimate bearing capacity qu of granular soil, in kPa?","e_en":"The qu from the formula may not exceed 3 000 kPa, then FOS ≥3 is applied to obtain qa.","doc":"foundations-2017-2024ed","pp":"14","tags":["foundations-2017-2024ed","承載力 Bearing capacity","num","中級"]},{"id":"FDN-014","t":"tf","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (1)","p":23,"q":"推導 q 時，最大有效覆土深度不應大於 3 m 或 Bf，取較小者。","a":true,"e":"且不可包括設計年期內可能被移除的覆土，亦要扣除預留的地下管線空隙。","x":"greater than 3 m or Bf, whichever is the lesser, and suitable adjustments should","q_en":"In deriving q, the maximum effective depth of overburden should not be greater than 3 m or Bf, whichever is less.","e_en":"True. It must not include overburden that may be removed during the design life, and space reserved for underground utilities must be deducted.","doc":"foundations-2017-2024ed","pp":"15","tags":["foundations-2017-2024ed","承載力 Bearing capacity","tf","進階"]},{"id":"FDN-015","t":"mcq","d":3,"tp":"承載力 Bearing capacity","c":"2.2.4 Note (4)","p":23,"q":"淺基礎位於斜坡頂附近時，ultimate bearing capacity 可在坡邊的值與距坡頂多遠處的值之間線性內插？","o":["2 倍基礎寬度","4 倍基礎寬度","6 倍基礎寬度","10 m"],"a":1,"e":"距坡頂 4Bf 以外可視作平地。另須檢查基礎工程對斜坡整體穩定的影響。","x":"foundation resting at the edge of the slope and that at a distance of four times","q_en":"For a shallow foundation near the crest of a slope, the ultimate bearing capacity may be interpolated linearly between the value at the slope edge and the value at what distance from the crest?","o_en":["2 times the foundation width","4 times the foundation width","6 times the foundation width","10 m"],"e_en":"Beyond 4Bf from the crest it may be treated as level ground. The effect of the foundation works on the overall stability of the slope must also be checked.","doc":"foundations-2017-2024ed","pp":"15","tags":["foundations-2017-2024ed","承載力 Bearing capacity","mcq","進階"]},{"id":"FDN-016","t":"num","d":2,"tp":"沉降 Settlement","c":"2.3.1(4)","p":30,"q":"設計承載壓力 ≤250 kPa 的淺基礎，無更準確資料時，粒狀土 Es（MPa）可取 SPT N 值的幾倍？","a":1,"tol":0,"u":"倍","e":"Es = 1×N（MPa）。若採用大於 1×N 的 Es，按 4.2.2(2)(c) 需做 plate load test。","x":"as one time the SPT N-value.","q_en":"For shallow foundations with design bearing pressure ≤250 kPa, in the absence of more accurate data, Es (MPa) of granular soil may be taken as how many times the SPT N value?","e_en":"Es = 1×N (MPa). If an Es greater than 1×N is adopted, a plate load test is required per 4.2.2(2)(c).","u_en":"times","doc":"foundations-2017-2024ed","pp":"22","tags":["foundations-2017-2024ed","沉降 Settlement","num","中級"]},{"id":"FDN-017","t":"num","d":3,"tp":"沉降 Settlement","c":"2.3.1(3)","p":30,"q":"可假設 secondary consolidation 在 primary consolidation 達百分之幾時開始？","a":95,"tol":0,"u":"%","e":"95% 亦是 2.4.4 判斷填海地固結已大致完成的準則。","x":"when 95% of the primary consolidation is reached.","q_en":"Secondary consolidation may be assumed to start when primary consolidation reaches what percentage?","e_en":"95% is also the criterion in 2.4.4 for judging that consolidation of reclamation is substantially complete.","doc":"foundations-2017-2024ed","pp":"22","tags":["foundations-2017-2024ed","沉降 Settlement","num","進階"]},{"id":"FDN-018","t":"short","d":2,"tp":"沉降 Settlement","c":"2.3.2(2)","p":31,"q":"列出 CoP Foundations 對不特別敏感建築的三項沉降/轉角參考準則，以及評估時可採用的荷載折減。","m":"(a) 最大總沉降 ≤30 mm；(b) 柱/豎向構件間差異沉降 ≤1:500；(c) 風或其他短暫荷載引起的最大角轉 ≤1:500。以工作荷載評估；(a)(b) 的恆載可減至 50%，活載按 Dead and Imposed Loads Code 折減。直接坐落 1(a)–2 類岩石或打入 N ≥200 地層可視為滿足 (a)。","k":["30 mm total","1:500 differential","1:500 rotation (wind/transient)","working loads; DL 50% for (a)(b)","rock or N ≥200 deemed to satisfy (a)"],"e":"這些是 reference criteria，不是硬性限制；敏感結構（例如 transfer plate 上的結構、精密設備）要訂定個案準則。","x":"(a) The maximum total settlement should not exceed 30 mm;","q_en":"List the three reference settlement/rotation criteria in the CoP Foundations for buildings that are not particularly sensitive, and the load reductions that may be used in the assessment.","m_en":"(a) Maximum total settlement ≤30 mm; (b) differential settlement between columns/vertical elements ≤1:500; (c) maximum angular rotation due to wind or other transient loads ≤1:500. Assess under working loads; for (a) and (b) dead load may be reduced to 50% and imposed load reduced per the Dead and Imposed Loads Code. Founding directly on Category 1(a)–2 rock or driving into N ≥200 strata may be regarded as satisfying (a).","e_en":"These are reference criteria, not hard limits; sensitive structures (e.g. structures on transfer plates, precision equipment) need case-specific criteria.","doc":"foundations-2017-2024ed","pp":"23","tags":["foundations-2017-2024ed","沉降 Settlement","short","中級"]},{"id":"FDN-019","t":"num","d":2,"tp":"沉降 Settlement","c":"2.3.2(2)","p":31,"q":"評估總沉降及差異沉降準則時，dead load 可減至百分之幾？","a":50,"tol":0,"u":"%","e":"這是規範明文容許的；imposed load 則按 Dead and Imposed Loads Code 的折減。","x":"the dead loads may be reduced to 50%, and the imposed loads may be","q_en":"When assessing the total and differential settlement criteria, dead load may be reduced to what percentage?","e_en":"This is expressly permitted by the Code; imposed load is reduced per the Dead and Imposed Loads Code.","doc":"foundations-2017-2024ed","pp":"23","tags":["foundations-2017-2024ed","沉降 Settlement","num","中級"]},{"id":"FDN-020","t":"tf","d":2,"tp":"填海地 Reclaimed land","c":"2.4.1(a)","p":32,"q":"除非另有建議，填海地上建築物的最低層樓板不應設計為 on-grade slab。","a":true,"e":"填海地長期固結沉降顯著，最低層樓板一般設計為懸空（suspended）。例外：筏式樁帽上的樓板、停車場/行人路等可修復的樓板。","x":"(a) Unless recommended otherwise, the lowest floor slabs of a building should not","q_en":"Unless otherwise justified, the lowest floor slab of a building on reclaimed land should not be designed as an on-grade slab.","e_en":"True. Long-term consolidation settlement of reclamation is significant, so the lowest floor slab is generally designed as suspended. Exceptions: slabs on raft pile caps, and repairable slabs such as car parks/footpaths.","doc":"foundations-2017-2024ed","pp":"24","tags":["foundations-2017-2024ed","填海地 Reclaimed land","tf","中級"]},{"id":"FDN-021","t":"mcq","d":3,"tp":"填海地 Reclaimed land","c":"2.4.4","p":33,"q":"無詳細固結評估時，海泥厚度 5 m < H ≤ 10 m（無砂夾層）達到 95% 固結所需年數？","o":["10 年","20 年","30 年","50 年"],"a":1,"e":"H ≤5 m 10 年、5–10 m 20 年、10–15 m 30 年。若會有場地平整或高壓淺基礎，此表不適用。","x":"5m < H ≤ 10m 20","q_en":"Without a detailed consolidation assessment, how many years are needed to reach 95% consolidation for a marine deposit of thickness 5 m < H ≤ 10 m (no sand layers)?","o_en":["10 years","20 years","30 years","50 years"],"e_en":"H ≤5 m 10 years, 5–10 m 20 years, 10–15 m 30 years. The table does not apply where there will be site formation or high-pressure shallow foundations.","doc":"foundations-2017-2024ed","pp":"25","tags":["foundations-2017-2024ed","填海地 Reclaimed land","mcq","進階"]},{"id":"FDN-022","t":"tf","d":2,"tp":"設計荷載 Design loads","c":"2.5.2","p":34,"q":"CoP Foundations 規定 imposed load 應包括 buoyancy force 及 earth pressure。","a":true,"e":"基礎設計中浮力和土壓力屬 imposed load。若以假設荷載設計基礎，上蓋開工前須證明實際荷載不超過假設值。","x":"imposed load should include buoyancy force and earth pressure. Buoyancy force","q_en":"The CoP Foundations requires imposed load to include buoyancy force and earth pressure.","e_en":"True. In foundation design, buoyancy and earth pressure are imposed load. If foundations are designed for assumed loads, it must be demonstrated before superstructure works start that the actual loads do not exceed the assumed values.","doc":"foundations-2017-2024ed","pp":"26","tags":["foundations-2017-2024ed","設計荷載 Design loads","tf","中級"]},{"id":"FDN-023","t":"short","d":2,"tp":"地下水 Groundwater","c":"2.5.3","p":35,"q":"說明 highest anticipated 與 highest possible groundwater level 的分別，以及無可靠資料時 highest possible level 一般取什麼？","m":"Highest anticipated：由可靠數據推算，考慮潮汐、風暴潮、降雨、海平面上升等，量度期至少涵蓋一個雨季。Highest possible：在所有極端情況（暴雨、水浸、水管爆裂）下地下水不會超過的水位；無可靠資料且非低窪地區時一般取地面；填海等低窪區可能高於地面。","k":["anticipated = reliable data, ≥ one wet season","possible = extreme events","generally ground surface","low-lying areas may exceed ground surface"],"e":"兩者配合不同的抗浮安全系數（1.5 vs 1.1 on groundwater）。地庫抗浮設計最常出事的位置是選錯水位或漏計臨時工況。","x":"to prove otherwise and except for low lying areas, the highest possible","q_en":"Explain the difference between the highest anticipated and highest possible groundwater levels, and what the highest possible level is generally taken as without reliable data.","m_en":"Highest anticipated: derived from reliable data, considering tides, storm surge, rainfall, sea level rise, etc., with a measurement period covering at least one wet season. Highest possible: the level groundwater will not exceed under all extreme conditions (rainstorms, flooding, burst water mains); without reliable data and outside low-lying areas it is generally taken as ground level; in low-lying areas such as reclamation it may be above ground level.","e_en":"The two are paired with different flotation safety factors (1.5 vs 1.1 on groundwater). The most common failures in basement flotation design are choosing the wrong water level or omitting temporary conditions.","doc":"foundations-2017-2024ed","pp":"27","tags":["foundations-2017-2024ed","地下水 Groundwater","short","中級"]},{"id":"FDN-024","t":"mcq","d":2,"tp":"穩定 Stability","c":"2.5.4(2)","p":35,"q":"以 highest anticipated groundwater table 設計時，抗傾覆力矩須至少為風荷載傾覆力矩的幾倍，以及風/地下水以外荷載傾覆力矩的幾倍？","o":["1.5 倍；2 倍","1.5 倍；1.5 倍","2 倍；3 倍","1.1 倍；1.5 倍"],"a":0,"e":"抗滑移、抗上浮 1.5；抗傾覆：風 1.5、地下水 1.5、其他荷載 2.0。常被忽略的是「其他荷載」的 2 倍（例如土壓力引起的傾覆）。","x":"least 1.5 times the overturning moment due to wind loads, 1.5 times the","q_en":"When designing for the highest anticipated groundwater table, the restoring moment against overturning must be at least how many times the overturning moment from wind, and how many times that from loads other than wind/groundwater?","o_en":["1.5 times; 2 times","1.5 times; 1.5 times","2 times; 3 times","1.1 times; 1.5 times"],"e_en":"Sliding and uplift 1.5; overturning: wind 1.5, groundwater 1.5, other loads 2.0. The factor of 2 for \"other loads\" (e.g. overturning from earth pressure) is often overlooked.","doc":"foundations-2017-2024ed","pp":"27","tags":["foundations-2017-2024ed","穩定 Stability","mcq","中級"]},{"id":"FDN-025","t":"num","d":2,"tp":"穩定 Stability","c":"2.5.4(3)","p":36,"q":"以 highest possible groundwater table 設計時，地下水引起的 uplift 力的系數是？","a":1.1,"tol":0,"u":"","e":"最高可能水位已屬極端，故地下水只乘 1.1，其他荷載仍乘 1.5。地庫抗浮兩種水位都要檢查，取較不利。","x":"the sum of 1.1 times the uplift force due to groundwater and 1.5 times","q_en":"When designing for the highest possible groundwater table, what factor is applied to the uplift force from groundwater?","e_en":"The highest possible level is already extreme, so groundwater is multiplied by only 1.1, while other loads still take 1.5. Check basement flotation for both levels and take the more adverse.","doc":"foundations-2017-2024ed","pp":"28","tags":["foundations-2017-2024ed","穩定 Stability","num","中級"]},{"id":"FDN-026","t":"tf","d":2,"tp":"穩定 Stability","c":"2.5.4(4)","p":36,"q":"計算抗上浮的 minimum dead load 時，可移除的飾面及回填亦可計入。","a":false,"e":"Minimum dead load 只計結構構件及永久飾面/回填；可移除的飾面及回填須忽略，並用保守的厚度及密度。","x":"Finishes and backfill that could be removed should be ignored in the calculations.","q_en":"When calculating the minimum dead load resisting uplift, removable finishes and backfill may be included.","e_en":"False. The minimum dead load counts only structural elements and permanent finishes/backfill; removable finishes and backfill must be ignored, and conservative thicknesses and densities used.","doc":"foundations-2017-2024ed","pp":"28","tags":["foundations-2017-2024ed","穩定 Stability","tf","中級"]},{"id":"FDN-027","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(1)","p":37,"q":"採用 permissible stress method 時，純因風荷載引起的工作應力可提高不多於百分之幾？","a":25,"tol":0,"u":"%","e":"這是傳統容許應力法的 25% 風荷載提升，常見於樁承載力的 with-wind 情況。","x":"25% where such increase is solely due to wind loads.","q_en":"With the permissible stress method, working stresses due solely to wind load may be increased by not more than what percentage?","e_en":"This is the traditional 25% wind load increase of the permissible stress method, common for pile capacity in the with-wind case.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-028","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"現場澆注混凝土基礎在可能遇到地下水或水下澆注時，混凝土強度應折減百分之幾？","a":20,"tol":0,"u":"%","e":"鑽孔樁、barrette 以 tremie 澆注時，設計強度要折減 20%。海事基礎水下澆注則假設為 C25。","x":"by 20% where groundwater is likely to be encountered during concreting or","q_en":"For cast-in-place concrete foundations where groundwater may be encountered or concrete is placed under water, the concrete strength should be reduced by what percentage?","e_en":"Bored piles and barrettes concreted by tremie must have their design strength reduced by 20%. Marine foundations concreted under water are assumed to be C25.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-029","t":"mcq","d":2,"tp":"材料 Materials","c":"2.5.5(2)","p":37,"q":"打入式預製混凝土樁在工作荷載下的軸向壓應力不應超過？","o":["0.2fcu","0.25fcu","0.33fcu","0.45fcu"],"a":0,"e":"0.2fcu 限值考慮打樁應力及耐久性。","x":"loads should not exceed 0.2fcu.","q_en":"The axial compressive stress in a driven precast concrete pile under working load should not exceed:","e_en":"The 0.2fcu limit accounts for driving stresses and durability.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","mcq","中級"]},{"id":"FDN-030","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"打入式鋼承重樁（打樁阻力 FOS 2）在工作荷載下軸向應力不應超過屈服應力的百分之幾？","a":30,"tol":0,"u":"%","e":"打入樁 30% fy；預鑽孔或壓入（無衝擊峰值應力）可提高至 50% fy。例如 S460 H-pile 工作應力約 138 MPa。","x":"of 2, the axial stress in the steel at working load should not exceed 30% of the","q_en":"For driven steel bearing piles (driving resistance FOS 2), the axial stress under working load should not exceed what percentage of the yield stress?","e_en":"Driven piles 30% fy; pre-bored or jacked (no impact peak stress) may be increased to 50% fy. E.g. an S460 H-pile working stress is about 138 MPa.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-031","t":"num","d":2,"tp":"材料 Materials","c":"2.5.5(4)","p":37,"q":"預鑽孔安裝或壓入的鋼樁，工作荷載下軸向應力可提高至屈服應力的百分之幾？","a":50,"tol":0,"u":"%","e":"因無打樁衝擊峰值應力，可用 50% fy，例如 socketed H-pile。","x":"steel at working loads may be increased to 50% of the yield stress.","q_en":"For steel piles installed in pre-bored holes or jacked, the axial stress under working load may be increased to what percentage of the yield stress?","e_en":"As there are no driving impact peak stresses, 50% fy may be used, e.g. socketed H-piles.","doc":"foundations-2017-2024ed","pp":"29","tags":["foundations-2017-2024ed","材料 Materials","num","中級"]},{"id":"FDN-032","t":"mcq","d":3,"tp":"材料 Materials","c":"2.5.5(4)","p":38,"q":"鋼與灌漿（≥30 MPa）之間的 allowable bond stress（一般 / 水下灌漿）？","o":["400 / 320 kPa","600 / 480 kPa","700 / 350 kPa","800 / 640 kPa"],"a":0,"e":"400/320 kPa，加 shear studs 最多提高至 600/480 kPa。計算面積用鋼構件全外表面積。","x":"minimum characteristic strength of 30 MPa) may be taken as 400 kPa (or 320","q_en":"Allowable bond stress between steel and grout (≥30 MPa) (normal / grout placed under water)?","e_en":"400/320 kPa, increased to at most 600/480 kPa with shear studs. Use the full external surface area of the steel section.","doc":"foundations-2017-2024ed","pp":"30","tags":["foundations-2017-2024ed","材料 Materials","mcq","進階"]},{"id":"FDN-033","t":"num","d":2,"tp":"耐久性 Durability","c":"2.6.2","p":39,"q":"為避免 alkali-aggregate reaction，混凝土中 reactive alkali（以 Na2O 當量計）每立方米不應超過多少 kg？","a":3.0,"tol":0,"u":"kg/m³","e":"3.0 kg/m³ 限值是香港 AAR 控制的標準要求，混凝土供應商須提供計算。","x":"of concrete should not exceed 3.0 kg.","q_en":"To avoid alkali-aggregate reaction, the reactive alkali content (as Na2O equivalent) of concrete should not exceed how many kg per cubic metre?","e_en":"The 3.0 kg/m³ limit is the standard requirement for AAR control in Hong Kong; the concrete supplier must provide calculations.","doc":"foundations-2017-2024ed","pp":"31","tags":["foundations-2017-2024ed","耐久性 Durability","num","中級"]},{"id":"FDN-034","t":"mcq","d":2,"tp":"耐久性 Durability","c":"2.6.4(1)","p":39,"q":"海事基礎混凝土的一般指引：最低等級、最大水灰比、保護層？","o":["C45、0.38、75 mm","C40、0.45、50 mm","C35、0.50、60 mm","C45、0.40、50 mm"],"a":0,"e":"另加 condensed silica fume 5–10%、膠凝材料 380–450 kg/m³；潮汐及浪濺區裂縫 ≤0.1 mm。","x":"inferior to grade C45 and the water/cement ratio should not exceed 0.38.","q_en":"General guidance for concrete in marine foundations: minimum grade, maximum water/cement ratio, cover?","o_en":["C45, 0.38, 75 mm","C40, 0.45, 50 mm","C35, 0.50, 60 mm","C45, 0.40, 50 mm"],"e_en":"Plus condensed silica fume 5–10% and cementitious content 380–450 kg/m³; crack width ≤0.1 mm in the tidal and splash zones.","doc":"foundations-2017-2024ed","pp":"31","tags":["foundations-2017-2024ed","耐久性 Durability","mcq","中級"]},{"id":"FDN-035","t":"num","d":3,"tp":"耐久性 Durability","c":"2.6.4(2)","p":40,"q":"海床以下若無防腐措施，鋼材外表面合理的腐蝕損失允許值是每年多少 mm？","a":0.05,"tol":0,"u":"mm/年","e":"50 年設計年期即約 2.5 mm，須從截面扣減後再核算承載力。","x":"seabed level, an allowance for corrosion loss of 0.05 mm per year on the","q_en":"Without corrosion protection below the seabed, what is a reasonable corrosion allowance for the external surface of steel, in mm per year?","e_en":"About 2.5 mm over a 50-year design life, to be deducted from the section before checking capacity.","u_en":"mm/year","doc":"foundations-2017-2024ed","pp":"32","tags":["foundations-2017-2024ed","耐久性 Durability","num","進階"]},{"id":"FDN-036","t":"num","d":2,"tp":"地盤勘探 Site investigation","c":"3.4.6(a)","p":53,"q":"遇到基岩時，應以鑽芯證明至最少多深（m），以免將孤石誤認為基岩？","a":5,"tol":0,"u":"m","e":"香港風化花崗岩常有 corestone，5 m 鑽芯是最低要求；表 2.1 的 TCR 亦要 5 m。","x":"Where bedrock is encountered, it should be proved by coring to a minimum","q_en":"Where bedrock is encountered, coring should prove it to at least what depth (m), to avoid mistaking a boulder for bedrock?","e_en":"Decomposed granite in Hong Kong often contains corestones; 5 m of coring is the minimum requirement; the TCR in Table 2.1 also requires 5 m.","doc":"foundations-2017-2024ed","pp":"45","tags":["foundations-2017-2024ed","地盤勘探 Site investigation","num","中級"]},{"id":"FDN-037","t":"short","d":3,"tp":"淺基礎 Shallow foundations","c":"4.2.2(2)","p":57,"q":"何時需要為淺基礎做 plate load test？數量如何決定？","m":"(a) 按 Table 2.1 presumed value 的 qa 超過 300 kPa（除非淨增壓 qa−qo <50 kPa，category 3 除外）；(b) qa 由 bearing capacity equation 或其他方法決定（小型/臨時構築物除外）；(c) 採用的 Es 大於 1×SPT N。數量：每種土層首兩個 500 m² 各一個，其後每 1 000 m² 一個，不足一個作一個計。","k":["qa > 300 kPa (presumed)","bearing capacity equation","Es > 1×N","1 per first two 500 m², then 1 per 1000 m²","fraction = 1 test"],"e":"BD 審批時常要求在圖則註明 plate load test 數量及位置；忘記 bearing capacity equation 亦觸發測試是常見錯誤。","x":"should not be less than one per soil type for each of the first two 500 m2 and","q_en":"When is a plate load test required for a shallow foundation? How is the number determined?","m_en":"(a) qa based on the presumed values of Table 2.1 exceeds 300 kPa (unless the net pressure increase qa−qo <50 kPa; except category 3); (b) qa is determined by the bearing capacity equation or other methods (except small/temporary structures); (c) the adopted Es is greater than 1×SPT N. Number: one for each of the first two 500 m² of each soil stratum, then one per 1 000 m² thereafter, any part counting as one.","e_en":"BD often requires the number and locations of plate load tests to be shown on the drawings; forgetting that using the bearing capacity equation also triggers testing is a common error.","doc":"foundations-2017-2024ed","pp":"49","tags":["foundations-2017-2024ed","淺基礎 Shallow foundations","short","進階"]},{"id":"FDN-038","t":"num","d":2,"tp":"樁基 Piles","c":"5.1.2","p":59,"q":"5 支或以上豎向受荷摩擦樁的群樁，一般可接受的 group reduction factor？","a":0.85,"tol":0,"u":"","e":"端承樁、嵌岩樁、打至基岩或 N ≥200 地層的樁，以及中心距大於 3 倍周長的樁，一般毋須折減。NSF 亦可用同一折減系數。","x":"generally acceptable for a group of 5 or more vertically loaded piles. Other values of","q_en":"For a group of 5 or more vertically loaded friction piles, what group reduction factor is generally acceptable?","e_en":"End-bearing piles, rock-socketed piles, piles driven to bedrock or N ≥200 strata, and piles with centre-to-centre spacing greater than 3 times the perimeter generally need no reduction. The same factor may be used for NSF.","doc":"foundations-2017-2024ed","pp":"51","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-039","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"打入樁及主要靠摩擦的樁，最小樁距為？","o":["樁周長或 1 m，取較大","2 倍直徑或 750 mm，取較大","樁周長或 500 mm，取較大","3 倍直徑"],"a":0,"e":"距地界不少於半周長或 500 mm（取大）。H-pile 周長取 2(b+d)。嵌岩 mini-pile/socketed H-pile 為 750 mm 或 2 倍套管外徑。","x":"resistance, the minimum pile spacing shall be not less than the length of the perimeter","q_en":"What is the minimum spacing of driven piles and piles relying mainly on friction?","o_en":["The pile perimeter or 1 m, whichever is greater","2 times the diameter or 750 mm, whichever is greater","The pile perimeter or 500 mm, whichever is greater","3 times the diameter"],"e_en":"Distance to the site boundary not less than half the perimeter or 500 mm (whichever is greater). H-pile perimeter is taken as 2(b+d). Rock-socketed mini-piles/socketed H-piles: 750 mm or 2 times the outside diameter of the casing.","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-040","t":"num","d":2,"tp":"樁基 Piles","c":"5.1.3","p":60,"q":"端承鑽孔樁之間（或擴底邊緣）建議的最小淨水平距離（mm）？","a":500,"tol":0,"u":"mm","e":"考慮施工位置及垂直度偏差。樁位偏差 ±75 mm、垂直度 1:75，長樁底部可偏移相當多，要留意。","x":"recommended to provide a nominal minimum clear horizontal spacing of 500 mm","q_en":"Recommended minimum clear horizontal distance (mm) between end-bearing bored piles (or the edges of bell-outs)?","e_en":"Allows for construction positional and verticality tolerances. With pile position tolerance ±75 mm and verticality 1:75, the toe of a long pile can deviate considerably.","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-041","t":"scenario","d":3,"tp":"樁基 Piles","c":"5.1.6","p":60,"q":"地庫抗浮以抗拔樁設計。寫出 CoP Foundations 5.1.6 每支樁需滿足的兩條條件，並解釋各符號。","m":"(a) Dmin + 0.9Ru − 2.0Ia − 1.5Ua（或 1.1Up）− 1.5Wk ≥ 0；(b) Dmin + Ra − Ia − Ua − Wk ≥ 0。Dmin 最小恆載；Ru/Ra 樁的極限/容許錨固抗力；Ia 不利活載及土荷載；Ua/Up 最高預計/最高可能地下水位的浮力；Wk 不利風荷載。","k":["Dmin + 0.9Ru − 2.0Ia − 1.5Ua (or 1.1Up) − 1.5Wk ≥ 0","Dmin + Ra − Ia − Ua − Wk ≥ 0","Ru limited by soil cone/column weight","minimum dead load excludes removable finishes"],"e":"極限條件 (a) 的 0.9Ru 與容許條件 (b) 同時要滿足。Ru 亦受土柱/岩錐有效重量限制（5.3.3）。常見錯誤：Dmin 計入可移除回填；忘記檢查 1.1Up 情況。","x":"(a) Dmin + 0.9Ru - 2.0Ia - 1.5Ua(or 1.1Up) - 1.5Wk ≥ 0; and","q_en":"Basement flotation is resisted by tension piles. Write the two conditions each pile must satisfy under CoP Foundations 5.1.6 and explain the symbols.","m_en":"(a) Dmin + 0.9Ru − 2.0Ia − 1.5Ua (or 1.1Up) − 1.5Wk ≥ 0; (b) Dmin + Ra − Ia − Ua − Wk ≥ 0. Dmin = minimum dead load; Ru/Ra = ultimate/allowable anchorage resistance of the pile; Ia = adverse imposed and soil loads; Ua/Up = uplift from the highest anticipated/highest possible groundwater level; Wk = adverse wind load.","e_en":"The ultimate condition (a) with 0.9Ru and the allowable condition (b) must both be satisfied. Ru is also limited by the effective weight of the soil cylinder/rock cone (5.3.3). Common errors: including removable backfill in Dmin; forgetting to check the 1.1Up case.","doc":"foundations-2017-2024ed","pp":"52","tags":["foundations-2017-2024ed","樁基 Piles","scenario","進階"]},{"id":"FDN-042","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.1.7","p":61,"q":"主要靠樁身摩擦承托的群樁，用 equivalent raft method 計沉降時，等效筏的深度取？","o":["軟土層以下樁長的 2/3 深度","樁尖","樁帽底","樁長的 1/2"],"a":0,"e":"端承或嵌岩群樁則取樁尖水平。計算沉降要包括 NSF。","x":"depth equal to two thirds of the pile depth measured below any soft soil layer. For","q_en":"For a pile group supported mainly by shaft friction, when calculating settlement by the equivalent raft method, the depth of the equivalent raft is taken at:","o_en":["2/3 of the pile length below the soft stratum","The pile toe","The underside of the pile cap","1/2 of the pile length"],"e_en":"For end-bearing or rock-socketed pile groups, take the pile toe level. Settlement calculations must include NSF.","doc":"foundations-2017-2024ed","pp":"53","tags":["foundations-2017-2024ed","樁基 Piles","mcq","進階"]},{"id":"FDN-043","t":"num","d":2,"tp":"負摩擦 NSF","c":"5.2.2","p":62,"q":"無更準確評估時，估算 NSF 的 shaft resistance coefficient β 經驗值？","a":0.25,"tol":0,"u":"","e":"NSF = ∫βσ'p dl。填海地及軟黏土場地必須計 NSF；Conventional Approach 將 NSF 視為 imposed load 加在樁上。","x":"absence of more accurate assessment, an empirical value of β = 0.25 may be assumed.","q_en":"In the absence of a more accurate assessment, what is the empirical value of the shaft resistance coefficient β for estimating NSF?","e_en":"NSF = ∫βσ'p dl. NSF must be included on reclamation and soft clay sites; the Conventional Approach treats NSF as an imposed load on the pile.","doc":"foundations-2017-2024ed","pp":"54","tags":["foundations-2017-2024ed","負摩擦 NSF","num","中級"]},{"id":"FDN-044","t":"scenario","d":3,"tp":"負摩擦 NSF","c":"5.2.3","p":63,"q":"填海地上的樁採用 NSF 的 Alternative Approach。列出三項設計準則及靜載試驗荷載要求。","m":"(a) 地基承載力（不含 NSF）：Pc ≥ Gk+Qk；Pcw ≥ Gk+Qk+Wk。(b) 結構強度（含 NSF）：Ps ≥ Gk+Qk+NSF；Psw ≥ Gk+Qk+Wk+NSF。(c) 含 NSF 總荷載下沉降表現須令人滿意。靜載試驗荷載不少於 2Pc + NSF。","k":["ground capacity excludes NSF","structural capacity includes NSF","settlement with NSF satisfactory","test load ≥ 2Pc + NSF"],"e":"Alternative Approach 較經濟，但試驗荷載要加 NSF，對試樁反力系統要求更高；計劃時要預早確認。","x":"for any static load testing of the piles should not be less than 2Pc + NSF.","q_en":"Piles on reclaimed land use the Alternative Approach for NSF. List the three design criteria and the static load test requirement.","m_en":"(a) Geotechnical capacity (excluding NSF): Pc ≥ Gk+Qk; Pcw ≥ Gk+Qk+Wk. (b) Structural strength (including NSF): Ps ≥ Gk+Qk+NSF; Psw ≥ Gk+Qk+Wk+NSF. (c) Settlement performance under the total load including NSF must be satisfactory. The static load test load is not less than 2Pc + NSF.","e_en":"The Alternative Approach is more economical, but NSF is added to the test load, placing higher demands on the test pile reaction system; confirm this early in planning.","doc":"foundations-2017-2024ed","pp":"55","tags":["foundations-2017-2024ed","負摩擦 NSF","scenario","進階"]},{"id":"FDN-045","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"一般打入樁（非 H-pile）設計 final set 的範圍？","o":["25–50 mm / 10 blows","10–25 mm / 10 blows","25–100 mm / 10 blows","50–100 mm / 10 blows"],"a":0,"e":"一般打入樁 25–50 mm/10 擊；H-pile 25–100 mm（50–100 之間取 50）；打至基岩取 10 mm/10 擊。落錘效率不大於 0.7。","x":"(a) the design final set should not be less than 25 mm per 10 blows;","q_en":"What is the range of design final set for ordinary driven piles (not H-piles)?","e_en":"Ordinary driven piles 25–50 mm/10 blows; H-piles 25–100 mm (take 50 for values between 50 and 100); piles driven to bedrock 10 mm/10 blows. Drop hammer efficiency not greater than 0.7.","doc":"foundations-2017-2024ed","pp":"56","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-046","t":"num","d":3,"tp":"樁基 Piles","c":"5.3.2(1)","p":64,"q":"H-pile final set 計算中，(cp+cq)/L 大於多少時該計算值應作廢？","a":1.15,"tol":0,"u":"","e":"cp、cq 以 mm、L 以 m 計。比值過大表示打樁回彈異常，Hiley 公式結果不可靠。","x":"(cp+cq)/L is greater than 1.15, where cp and cq are in mm and L in m;","q_en":"In the H-pile final set calculation, the calculated value should be discarded when (cp+cq)/L is greater than what?","e_en":"cp and cq in mm, L in m. An excessive ratio indicates abnormal rebound during driving, making the Hiley formula result unreliable.","doc":"foundations-2017-2024ed","pp":"56","tags":["foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-047","t":"num","d":2,"tp":"樁基 Piles","c":"5.3.4","p":72,"q":"樁的側向位移超過多少 mm 時必須考慮 P-Δ effect？","a":25,"tol":0,"u":"mm","e":"側向受力樁除土抗力及結構強度外，大變形時要計二階效應。","x":"(c) where pile deflection exceeds 25mm, P-∆ effect has to be addressed.","q_en":"The P-Δ effect must be considered when the lateral displacement of a pile exceeds how many mm?","e_en":"For laterally loaded piles, besides soil resistance and structural strength, second-order effects must be included at large deformations.","doc":"foundations-2017-2024ed","pp":"64","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-048","t":"mcq","d":3,"tp":"樁基 Piles","c":"Table 5.2","p":72,"q":"Table 5.2：樁距/樁徑 = 3 時，群樁 nh 的折減系數？","o":["0.25","0.40","0.70","1.00"],"a":0,"e":"3→0.25、4→0.40、6→0.70、8→1.00。少於 3 須用 elastic continuum 等方法。","x":"3 0.25 4 0.40 6 0.70 8 1.00","q_en":"Table 5.2: reduction factor on nh for a pile group with pile spacing/diameter = 3?","e_en":"3→0.25, 4→0.40, 6→0.70, 8→1.00. Below 3, methods such as elastic continuum must be used.","doc":"foundations-2017-2024ed","pp":"64","tags":["foundations-2017-2024ed","樁基 Piles","mcq","進階"]},{"id":"FDN-049","t":"num","d":2,"tp":"樁基 Piles","c":"5.4.1","p":74,"q":"H-pile 焊接接駁：打樁前以非破壞性檢測測試的焊口比例不少於百分之幾？","a":10,"tol":0,"u":"%","e":"發現問題要檢討焊接程序並重做 welder test 及 procedure test。","x":"(c) A sampling rate of not less than 10% of the total number of welded joints","q_en":"H-pile welded splices: not less than what percentage of welds must be tested by non-destructive testing before driving?","e_en":"If problems are found, review the welding procedure and repeat the welder test and procedure test.","doc":"foundations-2017-2024ed","pp":"66","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-050","t":"num","d":2,"tp":"樁基 Piles","c":"5.4.2(2)","p":75,"q":"Socketed steel H-pile 預鑽孔應容許的最小灌漿保護層（樁底除外）為多少 mm？","a":40,"tol":0,"u":"mm","e":"灌漿須為 non-shrink、28 天強度 ≥30 MPa。","x":"the steel H-pile and to allow a minimum grout cover of 40 mm to the","q_en":"What minimum grout cover (except at the pile toe) should the pre-bored hole allow for a socketed steel H-pile, in mm?","e_en":"Grout must be non-shrink with 28-day strength ≥30 MPa.","doc":"foundations-2017-2024ed","pp":"67","tags":["foundations-2017-2024ed","樁基 Piles","num","中級"]},{"id":"FDN-051","t":"mcq","d":2,"tp":"樁基 Piles","c":"5.4.6 / 5.4.7","p":76,"q":"小直徑鑽孔樁與大直徑鑽孔樁的分界直徑？","o":["600 mm","750 mm","900 mm","1000 mm"],"a":1,"e":"≤750 mm 屬 small diameter；>750 mm（以臨時鋼套管外徑計）屬 large diameter。Driven cast-in-place 樁最大亦為 750 mm。","x":"Small diameter bored piles should have a diameter not exceeding 750 mm.","q_en":"What diameter divides small-diameter and large-diameter bored piles?","e_en":"≤750 mm is small diameter; >750 mm (by outside diameter of the temporary steel casing) is large diameter. Driven cast-in-place piles are also limited to 750 mm.","doc":"foundations-2017-2024ed","pp":"68","tags":["foundations-2017-2024ed","樁基 Piles","mcq","中級"]},{"id":"FDN-052","t":"num","d":3,"tp":"樁基 Piles","c":"5.4.6(2)","p":77,"q":"CFA pile：工作樁的總 grout factor 不得少於試樁值，且在任何情況下不少於多少？","a":1.4,"tol":0,"u":"","e":"每 1.5 m 段 grout factor 不少於試樁最小值且不少於 1.15；總 grout factor 不少於 1.4。","x":"the trial pile and in no case be less than 1.4.","q_en":"CFA piles: the overall grout factor of working piles must not be less than the test pile value and in no case less than what?","e_en":"The grout factor of each 1.5 m section not less than the test pile minimum and not less than 1.15; overall grout factor not less than 1.4.","doc":"foundations-2017-2024ed","pp":"69","tags":["foundations-2017-2024ed","樁基 Piles","num","進階"]},{"id":"FDN-053","t":"mcq","d":3,"tp":"樁基 Piles","c":"5.4.7","p":78,"q":"大直徑鑽孔樁的 bell-out 直徑及坡度限制？","o":["≤1.65 倍樁身直徑，坡度 ≤30°（由垂直量）","≤2 倍樁身直徑，坡度 ≤45°","≤1.5 倍樁身直徑，坡度 ≤20°","無限制"],"a":0,"e":"擴底同時用 socket friction 時，socket 長度不超過 1 倍直徑或 3 m（取短），並忽略擴底上方 750 mm。","x":"shaft diameter and the gradient should not exceed 30 degree from vertical.","q_en":"Limits on the bell-out diameter and slope of large-diameter bored piles?","o_en":["≤1.65 times the shaft diameter, slope ≤30° (from vertical)","≤2 times the shaft diameter, slope ≤45°","≤1.5 times the shaft diameter, slope ≤20°","No limit"],"e_en":"When a bell-out is combined with socket friction, the socket length is not more than 1 times the diameter or 3 m (whichever is less), ignoring 750 mm above the bell-out.","doc":"foundations-2017-2024ed","pp":"70","tags":["foundations-2017-2024ed","樁基 Piles","mcq","進階"]},{"id":"FDN-054","t":"num","d":3,"tp":"樁基 Piles","c":"5.4.7","p":78,"q":"大直徑鑽孔樁無擴底，端承與 rock socket 摩擦同時使用時，計算摩擦的 socket 長度不超過多少倍 socket 直徑（或 6 m，取短）？","a":2,"tol":0,"u":"倍","e":"有擴底時為 1 倍或 3 m。原因是端承與摩擦所需位移不同，要確保變形相容。","x":"calculating the bond or frictional resistance does not exceed two times the rock socket","q_en":"For a large-diameter bored pile without a bell-out using both end bearing and rock socket friction, the socket length used for friction is not more than how many times the socket diameter (or 6 m, whichever is less)?","e_en":"With a bell-out it is 1 times or 3 m. The reason is that end bearing and friction require different displacements, so deformation compatibility must be ensured.","u_en":"times","doc":"foundations-2017-2024ed","pp":"70","tags":["
