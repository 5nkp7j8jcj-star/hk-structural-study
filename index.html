般限制為：","o":["0.1 mm","0.2 mm","0.3 mm","0.4 mm"],"a":2,"e":"Table 7.1：RC 0.3 mm；水缸等 water retaining structures 0.2 mm；unbonded PT 0.2 mm。Exposure 1 的限制只為外觀，可放寬。","x":"Table 7.1 - Limitations of maximum estimated surface crack widths","q_en":"For reinforced concrete members in ordinary buildings (exposure 1–4), the maximum estimated surface crack width is generally limited to:","e_en":"Table 7.1: RC 0.3 mm; water retaining structures such as tanks 0.2 mm; unbonded PT 0.2 mm. The limit for exposure 1 is for appearance only and may be relaxed.","doc":"concrete-2013-2020ed","pp":"103","ex":"rc","tier":"常考"},{"id":"CON-091","t":"tf","d":2,"tp":"裂縫 Cracking","c":"7.2.2","p":117,"q":"只要符合第 8、9 節最少配筋及鋼筋間距規定，一般毋須另行計算裂縫寬度。","a":true,"e":"對。7.2.2 deemed-to-satisfy。若直接計算裂縫（7.2.3），往往可用較大鋼筋間距，淺構件尤其明顯。","x":"If the detailing rules prescribed in sections 8 and 9 with respect to minimum reinforcement areas and","q_en":"Provided the minimum reinforcement and bar spacing rules of Sections 8 and 9 are met, crack widths generally need not be calculated.","e_en":"True. 7.2.2 deemed-to-satisfy. If crack widths are calculated directly (7.2.3), larger bar spacings can often be used, especially in shallow members.","doc":"concrete-2013-2020ed","pp":"103","ex":"rc","tier":"常考"},{"id":"CON-092","t":"mcq","d":2,"tp":"裂縫 Cracking","c":"7.2.3","p":118,"q":"使用 equation 7.1 計算裂縫寬度的前提，受拉鋼筋應變應限於：","o":["0.5fy/Es","0.8fy/Es","0.87fy/Es","fy/Es"],"a":1,"e":"7.2.3：鋼筋應變 ≤0.8fy/Es。主要受軸拉的構件使用公式要小心。","x":"Provided the strain in the tension reinforcement is limited to 0.8fy/Es, the design surface crack width,","q_en":"A condition for using equation 7.1 to calculate crack width is that the tension reinforcement strain is limited to:","e_en":"7.2.3: reinforcement strain ≤0.8fy/Es. Take care using the formula for members mainly in axial tension.","doc":"concrete-2013-2020ed","pp":"104","ex":"rc","tier":"常考"},{"id":"CON-093","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.1","p":120,"q":"施工後（after construction）可能損壞相鄰部分的撓度，對 quasi-permanent loads 一般合適的限值是：","o":["span/250","span/360","span/500","span/750"],"a":2,"e":"7.3.1：外觀 sag 限 span/250（pre-camber 亦不應超過 span/250）；施工後撓度 span/500。有玻璃幕牆或脆性間隔時可能要更嚴。","x":"after construction, span/500 is normally an appropriate limit for quasi-permanent loads. Other limits","q_en":"For deflection after construction that may damage adjacent parts, the generally appropriate limit for quasi-permanent loads is:","e_en":"7.3.1: sag limited to span/250 for appearance (pre-camber should also not exceed span/250); deflection after construction span/500. Stricter limits may be needed with glass curtain walls or brittle partitions.","doc":"concrete-2013-2020ed","pp":"106","ex":"rc","tier":"必考"},{"id":"CON-094","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"在 static characteristic wind load 下，樓頂側向撓度限制為 H/ 多少？","a":2,"u":"","e":"7.3.2：H/500，H 由最高樓層量度（不包括機房/天台構築物）。Cross-code：wind load 按 Wind Code 2019 計算，但撓度限值來自 Concrete Code。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","o":["250","1000","500","300"],"q_en":"Under static characteristic wind load, the lateral deflection at the top of the building is limited to H/ what?","e_en":"7.3.2: H/500, with H measured to the highest floor (excluding plant rooms/roof structures). Cross-code: the wind load is calculated per the Wind Code 2019, but the deflection limit comes from the Concrete Code.","doc":"concrete-2013-2020ed","pp":"106","ex":"rc","tier":"必考"},{"id":"CON-095","t":"mcq","d":2,"tp":"撓度 Deflection","c":"7.3.2","p":120,"q":"動力分析下，住宅樓宇在 1-in-10-year 10 分鐘風速下的最大峰值加速度限值是：","o":["0.10 m/s²","0.15 m/s²","0.25 m/s²","0.35 m/s²"],"a":1,"e":"7.3.2：住宅 0.15 m/s²；寫字樓/酒店 0.25 m/s²。超高住宅常由加速度控制，可能需要 damper 或風洞試驗。","x":"Residential 0.15 m/s2","q_en":"In dynamic analysis, the peak acceleration limit for residential buildings at the 1-in-10-year 10-minute wind speed is:","e_en":"7.3.2: residential 0.15 m/s²; office/hotel 0.25 m/s². Very tall residential towers are often governed by acceleration and may need dampers or wind tunnel testing.","doc":"concrete-2013-2020ed","pp":"106","ex":"rc","tier":"必考"},{"id":"CON-096","t":"mcq","d":2,"tp":"振動 Vibration","c":"7.3.3","p":121,"q":"樓面結構自然頻率低於多少 Hz 時可能需要動力分析？","a":3,"u":"Hz","e":"7.3.3：樓面 <6 Hz、行人天橋 <5 Hz。健身室、長跨鋼樑樓面及天橋要檢核。","x":"from people or machinery, should be avoided. For a building floor structure with the natural frequency","o":["3 Hz","4 Hz","10 Hz","6 Hz"],"q_en":"Below what natural frequency (Hz) of a floor structure may dynamic analysis be required?","e_en":"7.3.3: floors <6 Hz, footbridges <5 Hz. Check gyms, long-span steel beam floors and footbridges.","doc":"concrete-2013-2020ed","pp":"107","ex":"rc","tier":"常考"},{"id":"CON-097","t":"mcq","d":1,"tp":"撓度 Deflection","c":"Table 7.3","p":121,"q":"Table 7.3：簡支矩形樑（simply-supported rectangular beam）的基本 span/effective depth ratio 是多少？","a":0,"u":"","e":"Table 7.3：cantilever 7、simply-supported 20、continuous 26、end span 23（flanged bw/b ≤0.3 較低：5.5/16/21/18.5）。再乘 Table 7.4/7.5 修正系數。","x":"Simply-supported 20 16 20","o":["20","7","16","26"],"q_en":"Table 7.3: what is the basic span/effective depth ratio of a simply-supported rectangular beam?","e_en":"Table 7.3: cantilever 7, simply-supported 20, continuous 26, end span 23 (lower for flanged with bw/b ≤0.3: 5.5/16/21/18.5). Then multiply by the modification factors of Table 7.4/7.5.","doc":"concrete-2013-2020ed","pp":"107","ex":"rc","tier":"必考"},{"id":"CON-099","t":"mcq","d":2,"tp":"鋼筋間距 Spacing","c":"8.2","p":130,"q":"平行鋼筋之間的最小淨距應不少於：","o":["鋼筋直徑","hagg + 5 mm","20 mm","以上三者的最大值"],"a":3,"e":"8.2：max(bar diameter, hagg + 5 mm, 20 mm)。多層鋼筋應上下對齊，留位給震動棒。","x":"parallel bars should be not less than the maximum of bar diameter, (hagg + 5 mm) or 20 mm where","q_en":"The minimum clear distance between parallel bars should not be less than:","o_en":["The bar diameter","hagg + 5 mm","20 mm","The greatest of the above three"],"e_en":"8.2: max(bar diameter, hagg + 5 mm, 20 mm). Multiple layers should be vertically aligned to leave space for pokers.","doc":"concrete-2013-2020ed","pp":"116","ex":"detail","tier":"常考"},{"id":"CON-100","t":"mcq","d":2,"tp":"彎筋 Bends","c":"Table 8.2","p":131,"q":"直徑 ≥ 20 mm 鋼筋彎鈎的最小內彎半徑是：","o":["2φ","3φ","4φ","6φ"],"a":2,"e":"Table 8.2：φ ≤12 mm 2φ；<20 mm 3φ；≥20 mm 4φ。若錨固需要超過彎位後 4φ，要檢核彎內混凝土承壓（eq 8.1）。","x":"φ < 20 mm 3φ φ ≥ 20 mm 4φ","q_en":"The minimum internal radius of bend for bars of diameter ≥ 20 mm is:","e_en":"Table 8.2: φ ≤12 mm 2φ; <20 mm 3φ; ≥20 mm 4φ. If the anchorage requires more than 4φ beyond the bend, check concrete bearing inside the bend (eq 8.1).","doc":"concrete-2013-2020ed","pp":"117","ex":"detail","tier":"偶考"},{"id":"CON-101","t":"mcq","d":2,"tp":"錨固 Anchorage","c":"Table 8.3","p":132,"q":"Ribbed bars 受拉時的 bond coefficient β 是多少？","a":1,"u":"","e":"fbu = β√fcu（fcu 上限 60）；ribbed 受拉 0.50、受壓 0.63；plain 0.28/0.35。無最少箍筋的樑要用 plain bar 值（板除外）。","x":"Ribbed bars 0.50 0.63","o":["0.28","0.5","0.4","0.63"],"q_en":"What is the bond coefficient β for ribbed bars in tension?","e_en":"fbu = β√fcu (fcu capped at 60); ribbed in tension 0.50, in compression 0.63; plain 0.28/0.35. Beams without minimum links must use plain bar values (except slabs).","doc":"concrete-2013-2020ed","pp":"118","ex":"detail","tier":"常考"},{"id":"CON-102","t":"tf","d":3,"tp":"錨固 Anchorage","c":"8.4.4","p":132,"q":"在沒有按 Table 6.2 設最少箍筋的樑中，即使用 ribbed bars，錨固 bond stress 也要按 plain bars 取值。","a":true,"e":"對。8.4.4：樑無最少箍筋時用 plain bar β，但此規定不適用於板。這會令錨固長度大增。","x":"anchorage bond stresses used should be those appropriate to plain bars irrespective of the type of","q_en":"In beams without minimum links per Table 6.2, the anchorage bond stress must be taken as for plain bars even if ribbed bars are used.","e_en":"True. 8.4.4: plain bar β is used for beams without minimum links, but this does not apply to slabs. It greatly increases anchorage lengths.","doc":"concrete-2013-2020ed","pp":"118","ex":"detail","tier":"常考"},{"id":"CON-103","t":"mcq","d":1,"tp":"錨固 Anchorage","c":"Table 8.4","p":133,"q":"Table 8.4：C40 混凝土、fy 500 ribbed bar 受拉 anchorage length 是多少倍鋼筋直徑？","a":3,"u":"φ","e":"C30 40φ、C35 38φ、C40 35φ、C45 33φ、C50 31φ、≥C60 28φ（ribbed 受拉）。受壓較短。圖則上常寫「anchorage 40φ」即按 C30 取值。","x":"40 Tension 31 35 27","o":["40 φ","29 φ","44 φ","35 φ"],"q_en":"Table 8.4: for C40 concrete and fy 500 ribbed bars in tension, the anchorage length is how many bar diameters?","e_en":"C30 40φ, C35 38φ, C40 35φ, C45 33φ, C50 31φ, ≥C60 28φ (ribbed, tension). Compression is shorter. Drawings often state \"anchorage 40φ\", i.e. the C30 value.","doc":"concrete-2013-2020ed","pp":"119","ex":"detail","tier":"常考"},{"id":"CON-104","t":"tf","d":2,"tp":"錨固 Anchorage","c":"8.4.6","p":133,"q":"彎鈎（bends and hooks）對受壓錨固（compression anchorage）有貢獻。","a":false,"e":"錯。8.4.6：bends and hooks do not contribute to compression anchorages。柱筋插入 pile cap 受壓時要足夠直線長度。","x":"Bends and hooks do not contribute to compression anchorages.","q_en":"Bends and hooks contribute to compression anchorage.","e_en":"False. 8.4.6: bends and hooks do not contribute to compression anchorages. Column bars entering a pile cap in compression need sufficient straight length.","doc":"concrete-2013-2020ed","pp":"119","ex":"detail","tier":"常考"},{"id":"CON-105","t":"mcq","d":1,"tp":"搭接 Laps","c":"8.7.3.1","p":136,"q":"鋼筋最小搭接長度為 15 倍直徑或多少 mm（取較大）？","a":2,"u":"mm","e":"8.7.3.1：≥max(15φ, 300 mm)；焊接鋼網 ≥250 mm。實際搭接一般由 Table 8.5 控制。","x":"The minimum lap length for bar reinforcement should be not less than 15 times the bar diameter or","o":["450 mm","150 mm","300 mm","200 mm"],"q_en":"The minimum lap length of reinforcement is 15 times the bar diameter or how many mm (whichever is greater)?","e_en":"8.7.3.1: ≥max(15φ, 300 mm); welded fabric ≥250 mm. Actual laps are generally governed by Table 8.5.","doc":"concrete-2013-2020ed","pp":"122","ex":"detail","tier":"常考"},{"id":"CON-106","t":"mcq","d":3,"tp":"搭接 Laps","c":"8.7.3.2","p":136,"q":"搭接位於截面頂部（as cast）且最小保護層少於 2 倍鋼筋直徑，同時位於角位亦符合條件，搭接長度應乘：","o":["1.0","1.25","1.4","2.0"],"a":3,"e":"8.7.3.2：單一條件 ×1.4，兩者同時 ×2.0。樑頂角筋常同時符合兩項。","x":"(c) where both conditions above apply, the lap length should be increased by a factor of 2.0.","q_en":"If a lap is at the top of a section as cast with minimum cover less than 2 times the bar diameter, and also at a corner, the lap length should be multiplied by:","e_en":"8.7.3.2: ×1.4 for either condition, ×2.0 for both. Top corner bars of beams often satisfy both.","doc":"concrete-2013-2020ed","pp":"122","ex":"detail","tier":"常考"},{"id":"CON-107","t":"mcq","d":2,"tp":"搭接 Laps","c":"8.7.2","p":136,"q":"受拉鋼筋分佈在兩層或以上時，同一截面容許搭接的百分比是：","o":["25%","50%","75%","100%"],"a":1,"e":"8.7.2：單層 100%；兩層或以上 50%。受壓及分佈筋可全部在同一截面搭接。","x":"all in one layer, or 50% where the bars are in 2 or more layers.","q_en":"When tension reinforcement is in two or more layers, the percentage that may be lapped at one section is:","e_en":"8.7.2: single layer 100%; two or more layers 50%. Compression and distribution bars may all be lapped at the same section.","doc":"concrete-2013-2020ed","pp":"122","ex":"detail","tier":"常考"},{"id":"CON-108","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.2.1.3","p":149,"q":"樑的受拉或受壓鋼筋面積均不應超過毛截面面積的多少 %？","a":3,"u":"%","e":"9.2.1.3：≤4%；搭接處同層鋼筋直徑總和 ≤40% 截面寬度。Ductility 區（9.9.1.2）受拉筋更限 2.5%。","x":"4% of the gross cross-sectional area of the concrete.","o":["2.5%","3%","6%","4%"],"tier":"必考","q_en":"The area of tension or compression reinforcement in a beam should not exceed what % of the gross cross-sectional area?","e_en":"9.2.1.3: ≤4%; at laps, the sum of bar diameters in a layer ≤40% of the section width. In ductility zones (9.9.1.2), tension reinforcement is further limited to 2.5%.","doc":"concrete-2013-2020ed","pp":"135","ex":"rc"},{"id":"CON-109","t":"mcq","d":2,"tp":"樑配筋 Beam detailing","c":"9.2.1.2","p":149,"q":"樑深超過 750 mm 時側面筋（side bars）的間距不應超過：","o":["150 mm","200 mm","250 mm","300 mm"],"a":2,"e":"9.2.1.2：≤250 mm，分佈於由受拉面起 2/3 樑深範圍。Transfer girder 常忽略側筋，導致腹部裂縫。","x":"The spacing should not exceed 250 mm and the bars should be distributed over a distance of two-","q_en":"For beams deeper than 750 mm, the spacing of side bars should not exceed:","e_en":"9.2.1.2: ≤250 mm, distributed over 2/3 of the beam depth from the tension face. Side bars are often omitted in transfer girders, leading to web cracking.","doc":"concrete-2013-2020ed","pp":"135","ex":"detail","tier":"常考"},{"id":"CON-110","t":"mcq","d":1,"tp":"配筋限值 Steel limits","c":"9.3.1.1","p":153,"q":"fy = 500 N/mm² 時，實心板每方向最少總縱向鋼筋為混凝土截面的多少 %？","a":0,"u":"%","e":"9.3.1.1：fy 250 → 0.24%；fy 500 → 0.13%；受拉筋再乘 αmin = 40fcu^(2/3)/fy ≥1.0。所以高等級混凝土最少鋼筋會增加（例如 C45 時 αmin ≈1.01）。","x":"(ii) fy = 500 N/mm2: 0.13% of concrete cross-sectional area.","o":["0.13%","0.15%","0.24%","0.4%"],"tier":"必考","q_en":"For fy = 500 N/mm², what is the minimum total longitudinal reinforcement in each direction of a solid slab, as % of the concrete section?","e_en":"9.3.1.1: fy 250 → 0.24%; fy 500 → 0.13%; tension reinforcement is further multiplied by αmin = 40fcu^(2/3)/fy ≥1.0. So minimum reinforcement increases for higher concrete grades (e.g. αmin ≈1.01 at C45).","doc":"concrete-2013-2020ed","pp":"139","ex":"rc"},{"id":"CON-111","t":"mcq","d":2,"tp":"板配筋 Slab detailing","c":"9.3.1.1(b)","p":153,"q":"一般情況下，板主筋最大間距是：","o":["2h ≤ 250 mm","3h ≤ 400 mm","3.5h ≤ 450 mm","4h ≤ 500 mm"],"a":1,"e":"9.3.1.1(b)：主筋 3h ≤400 mm；次筋 3.5h ≤450 mm；集中荷載或最大彎矩區主筋 2h ≤250 mm。","x":"(i) for the principal reinforcement, 3h ≤ 400 mm; and","q_en":"In general, the maximum spacing of main bars in a slab is:","e_en":"9.3.1.1(b): main bars 3h ≤400 mm; secondary bars 3.5h ≤450 mm; main bars in areas of concentrated load or maximum moment 2h ≤250 mm.","doc":"concrete-2013-2020ed","pp":"139","ex":"detail","tier":"常考"},{"id":"CON-112","t":"tf","d":2,"tp":"板配筋 Slab detailing","c":"9.3.2","p":154,"q":"厚度少於 200 mm 的板不應使用抗剪鋼筋。","a":true,"e":"對。9.3.2：<200 mm 板難以彎紮及確保抗剪筋有效，因此不應使用。沖剪不足時要加厚板、用 drop panel 或柱帽。","x":"thick. Therefore, shear reinforcement should not be used in such slabs.","q_en":"Shear reinforcement should not be used in slabs less than 200 mm thick.","e_en":"True. 9.3.2: in slabs <200 mm it is difficult to bend and fix shear reinforcement and ensure its effectiveness, so it should not be used. Where punching shear is inadequate, thicken the slab or use drop panels or column heads.","doc":"concrete-2013-2020ed","pp":"140","ex":"detail","tier":"常考"},{"id":"CON-113","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"懸臂板跨度多於多少時應改用 beam-and-slab 布置？","o":["750 mm","1000 mm","1200 mm","1500 mm"],"a":2,"e":"9.4.1：>1200 mm 應用樑板布置。懸臂板厚度：≤500 mm 跨 110 mm；≤750 mm 125 mm；≤1000 mm 150 mm；≤1200 mm 175 mm。香港曾有簷篷倒塌事故，故 BD 對懸臂構件特別嚴格。","x":"Instead of pure cantilevered slab arrangements, beam-and-slab arrangements should be used for","q_en":"Above what span should a cantilever slab be replaced by a beam-and-slab arrangement?","e_en":"9.4.1: >1200 mm should use a beam-and-slab arrangement. Cantilever slab thickness: span ≤500 mm 110 mm; ≤750 mm 125 mm; ≤1000 mm 150 mm; ≤1200 mm 175 mm. Hong Kong has had canopy collapses, so BD is particularly strict on cantilevered members.","doc":"concrete-2013-2020ed","pp":"140","ex":"rc","tier":"必考"},{"id":"CON-114","t":"num","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.1","p":154,"q":"跨度 900 mm 的懸臂板最少厚度是多少 mm？","a":150,"tol":0,"u":"mm","e":"9.4.1(d)：>750 mm 但 ≤1000 mm → 150 mm。同時要符合 7.3 撓度及外露構件的防水、1:75 排水斜度等要求。","x":"(d) 150 mm for cantilevered slab with span greater than 750 mm but not exceeding 1000 mm;","q_en":"What is the minimum thickness in mm of a cantilever slab with a span of 900 mm?","e_en":"9.4.1(d): >750 mm but ≤1000 mm → 150 mm. Also comply with 7.3 deflection and, for exposed members, waterproofing and a 1:75 drainage fall.","doc":"concrete-2013-2020ed","pp":"140","ex":"rc","tier":"必考"},{"id":"CON-115","t":"mcq","d":2,"tp":"懸臂構件 Cantilevers","c":"9.4.2","p":155,"q":"懸臂構件頂部受拉主筋的中心間距不應大於：","o":["100 mm","150 mm","200 mm","250 mm"],"a":1,"e":"9.4.2：頂筋最少 0.25%、直徑 ≥10 mm、間距 ≤150 mm。要全錨固，錨固起點按 9.4.3 計算，不可按實際應力折減錨固長度。","x":"The centre-to-centre spacing of the top tension longitudinal bars should not be more than 150 mm.","q_en":"The centre-to-centre spacing of the top main tension bars of a cantilevered member should not be greater than:","e_en":"9.4.2: top bars minimum 0.25%, diameter ≥10 mm, spacing ≤150 mm. They must be fully anchored, with the start of anchorage calculated per 9.4.3; anchorage length may not be reduced according to actual stress.","doc":"concrete-2013-2020ed","pp":"141","ex":"rc","tier":"必考"},{"id":"CON-117","t":"mcq","d":1,"tp":"配筋限值 Steel limits","c":"9.5.1","p":156,"q":"柱總縱向鋼筋不應少於毛截面的多少 %？","a":2,"u":"%","e":"9.5.1：≥0.8%，直徑 ≥12 mm，矩形柱最少 4 支、圓柱 6 支。上限：豎向澆築 6%、水平澆築 8%、搭接處 10%（ductility 區 9.9.2 為 4%/搭接 5.2%）。","x":"should not be less than 0.8%. See clause 9.9.2 for ductility requirement.","o":["1.0%","0.4%","0.8%","2.0%"],"tier":"必考","q_en":"The total longitudinal reinforcement in a column should not be less than what % of the gross section?","e_en":"9.5.1: ≥0.8%, diameter ≥12 mm, minimum 4 bars in rectangular columns and 6 in circular columns. Upper limits: vertically cast 6%, horizontally cast 8%, at laps 10% (ductility zones 9.9.2: 4% / 5.2% at laps).","doc":"concrete-2013-2020ed","pp":"142","ex":"rc"},{"id":"CON-118","t":"mcq","d":2,"tp":"柱配筋 Column detailing","c":"9.5.2.1","p":156,"q":"柱箍筋沿柱的間距不應超過以下哪一組的最小值？","o":["12 × 最小縱筋直徑、柱較小尺寸、400 mm","16 × 最大縱筋直徑、柱較大尺寸、300 mm","8 × 縱筋直徑、200 mm","0.75d、600 mm"],"a":0,"e":"9.5.2.1：min(12φ_min, 柱較小尺寸, 400 mm)；箍筋直徑 ≥ max(6 mm, 1/4 最大縱筋)。Ductility critical zone 更嚴（8φ）。","x":"(a) 12 times the diameter of the smallest longitudinal bar;","q_en":"The spacing of column links along the column should not exceed the least of which group?","o_en":["12 × smallest longitudinal bar diameter, smaller column dimension, 400 mm","16 × largest longitudinal bar diameter, larger column dimension, 300 mm","8 × longitudinal bar diameter, 200 mm","0.75d, 600 mm"],"e_en":"9.5.2.1: min(12φ_min, smaller column dimension, 400 mm); link diameter ≥ max(6 mm, 1/4 of the largest longitudinal bar). Stricter in ductility critical zones (8φ).","doc":"concrete-2013-2020ed","pp":"142","ex":"detail","tier":"常考"},{"id":"CON-119","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.6.2","p":158,"q":"RC 牆最少豎向鋼筋為混凝土截面的多少 %？","a":3,"u":"%","e":"9.6.2：0.4%，若由最少筋控制，每面各一半；最多 4%（搭接可加倍）；豎筋間距 ≤ min(3t, 400 mm)。","x":"wall is 0.4%. Where this minimum area of reinforcement controls in the design, half of the area should","o":["0.3%","0.25%","0.8%","0.4%"],"tier":"必考","q_en":"The minimum vertical reinforcement in an RC wall is what % of the concrete section?","e_en":"9.6.2: 0.4%, half on each face if governed by the minimum; maximum 4% (may be doubled at laps); vertical bar spacing ≤ min(3t, 400 mm).","doc":"concrete-2013-2020ed","pp":"144","ex":"rc"},{"id":"CON-120","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.6.3","p":158,"q":"豎筋 ≤2% 時，fy = 500 的牆最少水平鋼筋為混凝土截面的多少 %？","a":3,"u":"%","e":"9.6.3：fy 250 → 0.30%；fy 500 → 0.25%；間距 ≤400 mm，直徑 ≥ max(1/4 豎筋, 6 mm)。","x":"(b) fy = 500 N/mm2: 0.25% of concrete cross-sectional area.","o":["0.4%","0.3%","0.13%","0.25%"],"tier":"必考","q_en":"With vertical reinforcement ≤2%, what is the minimum horizontal reinforcement for a wall with fy = 500, as % of the concrete section?","e_en":"9.6.3: fy 250 → 0.30%; fy 500 → 0.25%; spacing ≤400 mm, diameter ≥ max(1/4 of vertical bar, 6 mm).","doc":"concrete-2013-2020ed","pp":"144","ex":"rc"},{"id":"CON-121","t":"mcq","d":2,"tp":"混凝土測試 Testing","c":"10.3.4.3","p":174,"q":"鑽芯（cores）驗收：每個芯樣的 estimated in-situ cube strength 至少為指定等級的多少，全組平均至少多少？","o":["65%／75%","75%／85%","85%／95%","90%／100%"],"a":1,"e":"10.3.4.3(e)：每個 ≥75%，平均 ≥85%，按 CS1 計算。立方試驗不合格時常用此補救評估。","x":"each core specimen should be at least 75% of the specified grade strength and the","q_en":"Acceptance of cores: the estimated in-situ cube strength of each core must be at least what proportion of the specified grade, and the average of the set at least what?","o_en":["65% / 75%","75% / 85%","85% / 95%","90% / 100%"],"e_en":"10.3.4.3(e): each ≥75%, average ≥85%, calculated to CS1. Commonly used as a remedial assessment when cube tests fail.","doc":"concrete-2013-2020ed","pp":"160","ex":"constr","tier":"偶考"},{"id":"CON-122","t":"mcq","d":2,"tp":"施工 Construction","c":"10.3.7","p":176,"q":"澆築時混凝土溫度一般不應超過多少 °C？","a":0,"u":"°C","e":"10.3.7：≤30°C，除非證明較高溫度無害。香港夏天 mass pour 常用冰水/夜間澆築。","x":"At the time of placing, the concrete temperature should not exceed 30°C, unless it can be","o":["30°C","35°C","25°C","32°C"],"q_en":"The temperature of concrete at placing should generally not exceed how many °C?","e_en":"10.3.7: ≤30°C, unless higher temperatures are shown to be harmless. In Hong Kong summers, mass pours often use chilled water / night pours.","doc":"concrete-2013-2020ed","pp":"162","ex":"constr","tier":"常考"},{"id":"CON-124","t":"mcq","d":3,"tp":"荷載測試 Load test","c":"13.2","p":207,"q":"施工期間結構 load test 的測試荷載一般取以下兩者較大值：","o":["Gk + Qk 或 1.4Gk + 1.6Qk","Gk + 1.25Qk 或 1.125(Gk + Qk)","1.5(Gk + Qk) 或 2Qk","Gk + 1.6Qk 或 1.2(Gk + Qk)"],"a":1,"e":"13.2：W ≥ Gk + Qk，一般取 max(Gk + 1.25Qk, 1.125(Gk+Qk))；至少加載兩次，相隔 ≥1 h。一般不建議加載至 ultimate，以免損害結構。","x":"characteristic dead load and 1.25 times the characteristic imposed load or (b) 1.125 times the sum of","q_en":"The test load for a structural load test during construction is generally the greater of:","o_en":["Gk + Qk or 1.4Gk + 1.6Qk","Gk + 1.25Qk or 1.125(Gk + Qk)","1.5(Gk + Qk) or 2Qk","Gk + 1.6Qk or 1.2(Gk + Qk)"],"e_en":"13.2: W ≥ Gk + Qk, generally max(Gk + 1.25Qk, 1.125(Gk+Qk)); load at least twice, ≥1 h apart. Loading to ultimate is generally not recommended, to avoid damaging the structure.","doc":"concrete-2013-2020ed","pp":"193","ex":"constr","tier":"偶考"},{"id":"CON-125","t":"mcq","d":1,"tp":"配筋限值 Steel limits","c":"9.2.1.1 / Table 9.1","p":150,"q":"按 Table 9.1，fy = 500 N/mm² 的矩形截面樑，受拉鋼筋最少百分率（100As/Ac）是？","a":0,"e":"Table 9.1 (iii) 矩形截面：fy 500 → 0.13αmin；fy 250 → 0.24αmin（100As/Ac）。αmin = 40fcu^(2/3)/fy，不少於 1.0（Note 2），C40 時 αmin = 0.94 → 取 1.0。0.18αmin 是翼緣樑腹板受拉 bw/b < 0.4，0.26αmin 是 T 樑翼緣受拉。上限：9.2.1.3 受拉或受壓筋各 ≤ 4% 毛截面；搭接處同層鋼筋直徑總和 ≤ 40% 截面寬度。與 BS 8110 不同，HK Code 2013 對受拉筋最少量另乘 αmin。","x":"(iii) rectangular section 100As/Ac 0.24αmin 0.13αmin","o":["0.13αmin","0.24αmin","0.18αmin","0.26αmin"],"tier":"必考","q_en":"Per Table 9.1, what is the minimum percentage of tension reinforcement (100As/Ac) for a rectangular beam with fy = 500 N/mm²?","e_en":"Table 9.1 (iii) rectangular section: fy 500 → 0.13αmin; fy 250 → 0.24αmin (100As/Ac). αmin = 40fcu^(2/3)/fy, not less than 1.0 (Note 2); for C40 αmin = 0.94 → take 1.0. 0.18αmin is a flanged beam with web in tension and bw/b < 0.4; 0.26αmin is a T-beam with flange in tension. Maximum: 9.2.1.3, tension or compression steel each ≤ 4% of gross section; at laps the sum of bar diameters in a layer ≤ 40% of the breadth. Unlike BS 8110, the HK Code 2013 multiplies the minimum tension steel by αmin.","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"CON-126","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"Table 9.1 Note 2","p":150,"q":"Table 9.1 Note 2：受拉鋼筋最少百分率要乘的 αmin 是？","a":0,"e":"αmin = 40fcu^(2/3)/fy ≥ 1.0，只乘受拉筋（Table 9.1 受拉及翼緣橫向筋欄），受壓筋 0.2%/0.4% 不乘。例：fy 500，C40 → 40 × 11.70/500 = 0.94 → 取 1.0；C60 → 40 × 15.33/500 = 1.23，矩形樑最少受拉筋 0.13 × 1.23 ≈ 0.16%。9.3.1.1(a) 板的受拉筋亦要乘同一 αmin。","x":"αmin = 40fcu2/3/fy but not less than 1.0.","o":["40fcu^(2/3)/fy，但不少於 1.0","40fcu^(2/3)/fy，但不大於 1.0","fcu/fy，但不少於 1.0","0.67fcu/γm"],"tier":"必考","q_en":"Table 9.1 Note 2: what is the factor αmin applied to the minimum tension reinforcement percentages?","o_en":["40fcu^(2/3)/fy, but not less than 1.0","40fcu^(2/3)/fy, but not more than 1.0","fcu/fy, but not less than 1.0","0.67fcu/γm"],"e_en":"αmin = 40fcu^(2/3)/fy ≥ 1.0, applied only to tension steel (the tension and flange transverse rows of Table 9.1); the 0.2%/0.4% compression steel values are not multiplied. Example: fy 500, C40 → 40 × 11.70/500 = 0.94 → take 1.0; C60 → 40 × 15.33/500 = 1.23, so rectangular beam minimum tension steel = 0.13 × 1.23 ≈ 0.16%. Slab tension steel under 9.3.1.1(a) uses the same αmin.","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"CON-127","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"Table 9.1","p":150,"q":"Table 9.1：翼緣樑、腹板受拉、bw/b < 0.4、fy = 500 N/mm² 時，受拉鋼筋最少百分率（100As/bwh）是？","a":0,"e":"翼緣樑腹板受拉：bw/b < 0.4 → 0.18αmin（fy 250 為 0.32αmin）；bw/b ≥ 0.4 → 0.13αmin（fy 250 為 0.24αmin）。百分率以 bw·h 計，不是整個翼緣面積。上限同 9.2.1.3 的 4%。","x":"bw/b < 0.4 100As/bwh 0.32αmin 0.18αmin","o":["0.18αmin","0.13αmin","0.26αmin","0.32αmin"],"tier":"必考","q_en":"Table 9.1: flanged beam, web in tension, bw/b < 0.4, fy = 500 N/mm²: minimum tension reinforcement percentage (100As/bwh)?","e_en":"Flanged beam, web in tension: bw/b < 0.4 → 0.18αmin (0.32αmin for fy 250); bw/b ≥ 0.4 → 0.13αmin (0.24αmin for fy 250). The percentage is based on bw·h, not the whole flange area. Maximum is the same 4% of 9.2.1.3.","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"CON-128","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"Table 9.1","p":150,"q":"Table 9.1：翼緣受拉（如連續樑支座負彎矩）的 T 樑，fy = 500 N/mm² 時受拉鋼筋最少百分率（100As/bwh）是？","a":0,"e":"翼緣受拉：T 樑 0.26αmin、L 樑 0.20αmin（fy 250 分別為 0.48αmin、0.36αmin），以 bw·h 計。翼緣受拉時最少量比腹板受拉大，因為開裂後拉力區面積大。上限同樣為 4%（9.2.1.3）。","x":"T-beam 100As/bwh 0.48αmin 0.26αmin","o":["0.26αmin","0.20αmin","0.18αmin","0.48αmin"],"tier":"必考","q_en":"Table 9.1: T-beam with flange in tension (e.g. hogging at a continuous support), fy = 500 N/mm²: minimum tension reinforcement percentage (100As/bwh)?","e_en":"Flange in tension: T-beam 0.26αmin, L-beam 0.20αmin (0.48αmin and 0.36αmin for fy 250), based on bw·h. The minimum is larger than for web in tension because the cracked tension zone is larger. The maximum is likewise 4% (9.2.1.3).","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"CON-129","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"Table 9.1","p":150,"q":"Table 9.1：矩形樑受壓鋼筋（ULS 需要時）的簡化最少百分率是？","a":0,"e":"受壓筋：一般規則 0.4%（100Asc/Acc，Acc 為受壓區面積）；簡化：矩形樑 0.2%（Ac）、翼緣受壓 0.4%（b·hf）、腹板受壓 0.2%（bw·h）。fy 250 與 500 相同，不乘 αmin。上限 4%（9.2.1.3）。","x":"(i) rectangular beam 100Asc/Ac 0.2 0.2","o":["0.2%（100Asc/Ac）","0.4%（100Asc/Ac）","0.13%（100Asc/Ac）","0.2αmin %（100Asc/Ac）"],"tier":"必考","q_en":"Table 9.1: simplified minimum percentage of compression reinforcement (where required for ULS) in a rectangular beam?","o_en":["0.2% (100Asc/Ac)","0.4% (100Asc/Ac)","0.13% (100Asc/Ac)","0.2αmin % (100Asc/Ac)"],"e_en":"Compression steel: general rule 0.4% (100Asc/Acc, Acc = compression zone area); simplified: rectangular beam 0.2% (Ac), flange in compression 0.4% (b·hf), web in compression 0.2% (bw·h). Same for fy 250 and 500 and not multiplied by αmin. Maximum 4% (9.2.1.3).","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"CON-130","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.9.1.2(a)","p":160,"q":"Ductility 詳圖（9.9.1.2）：樑 critical zone 內受拉鋼筋面積上限是毛截面的多少？","a":0,"e":"9.9.1.2(a)：critical zone 內受拉筋 ≤ 2.5%；任何截面受壓筋 ≥ 受拉筋的一半；最少配筋按 Table 9.1 但不少於 0.3%。critical zone 由柱面起 2 倍樑深（9.9.1.1）。一般樑（9.2.1.3）才是 4%。9.1：側向抗力系統的構件須同時符合 9.2–9.8 及 9.9。","x":"The maximum area of tension reinforcement within the critical zone should not exceed 2.5% of","o":["2.5%","4%","3%","6%"],"tier":"必考","q_en":"Ductility detailing (9.9.1.2): maximum area of tension reinforcement within a beam critical zone, as a percentage of the gross section?","e_en":"9.9.1.2(a): tension steel within the critical zone ≤ 2.5%; at any section compression steel ≥ half the tension steel; minimum per Table 9.1 but not less than 0.3%. The critical zone extends 2 times the beam depth from the column face (9.9.1.1). The 4% limit (9.2.1.3) is for general beams. 9.1: members in the lateral load resisting system must comply with both 9.2–9.8 and 9.9.","doc":"concrete-2013-2020ed","pp":"146","ex":"rc"},{"id":"CON-131","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.9.1.2(a)","p":160,"q":"Ductility 詳圖（9.9.1.2）：樑最少配筋除按 Table 9.1 外，亦不應少於？","a":0,"e":"9.9.1.2(a)：最少配筋按 Table 9.1 但 ≥ 0.3%；critical zone 受拉筋 ≤ 2.5%；受壓筋 ≥ ½ 受拉筋。0.13% 是 Table 9.1 矩形樑（fy 500）基本值，0.8% 是柱最少縱筋。","x":"however not less than 0.3%.","o":["0.3%","0.13%","0.4%","0.8%"],"tier":"必考","q_en":"Ductility detailing (9.9.1.2): besides Table 9.1, the minimum beam reinforcement should not be less than?","e_en":"9.9.1.2(a): minimum per Table 9.1 but ≥ 0.3%; tension steel in the critical zone ≤ 2.5%; compression steel ≥ ½ tension steel. 0.13% is the basic Table 9.1 value for a rectangular beam (fy 500); 0.8% is the column minimum.","doc":"concrete-2013-2020ed","pp":"146","ex":"rc"},{"id":"CON-132","t":"mcq","d":1,"tp":"配筋限值 Steel limits","c":"9.5.1","p":156,"q":"按 9.5.1，豎向澆築柱的縱向鋼筋上限是毛截面的多少？","a":0,"e":"9.5.1：最少 0.8%；上限豎向澆築 6%、水平澆築 8%、搭接處 10%；搭接處同層鋼筋直徑總和 ≤ 40% 截面寬度。側向抗力系統的柱另須符合 9.9.2.1：4%，搭接處 5.2%。","x":"(a) vertically-cast columns - 6%;","o":["6%","4%","8%","10%"],"tier":"必考","q_en":"Per 9.5.1, what is the maximum longitudinal reinforcement in a vertically-cast column, as a percentage of the gross section?","e_en":"9.5.1: minimum 0.8%; maximum 6% vertically cast, 8% horizontally cast, 10% at laps; at laps the sum of bar sizes in a layer ≤ 40% of the breadth. Columns in the lateral load resisting system must also meet 9.9.2.1: 4%, 5.2% at laps.","doc":"concrete-2013-2020ed","pp":"142","ex":"rc"},{"id":"CON-133","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.9.2.1(a)","p":162,"q":"Ductility 詳圖（9.9.2.1）：柱縱筋作強度設計的上限及搭接處上限分別是？","a":0,"e":"9.9.2.1(a)：最少 0.8%；強度設計 ≤ 4%，搭接處可增至 5.2%；同一排最小鋼筋直徑 ≥ 最大直徑的 2/3。9.5.1 的 6%/8%/10% 只適用於不屬側向抗力系統的柱（9.1：這類構件不須符合 9.9）。","x":"gross concrete area except that at laps the area may increase to 5.2%.","o":["4% / 5.2%","6% / 10%","4% / 8%","6% / 8%"],"tier":"必考","r":[{"doc":"concrete-2013-2020ed","p":149,"c":"9.1","x":"in the lateral load resisting system or walls for single storey structures do not need to conform to the","pp":"135"}],"q_en":"Ductility detailing (9.9.2.1): maximum column longitudinal steel for strength design, and the maximum at laps?","e_en":"9.9.2.1(a): minimum 0.8%; strength design ≤ 4%, which may increase to 5.2% at laps; in any row the smallest bar diameter ≥ 2/3 of the largest. The 6%/8%/10% of 9.5.1 apply only to columns not in the lateral load resisting system (9.1: such members need not comply with 9.9).","doc":"concrete-2013-2020ed","pp":"148","ex":"rc"},{"id":"CON-134","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.6.2","p":158,"q":"按 9.6.2，RC 牆豎向鋼筋的上限是？","a":0,"e":"9.6.2：豎筋最少 0.4%（由最少筋控制時每面一半）；最多 4%，搭接處可加倍（即 8%）；豎筋間距 ≤ 3 倍牆厚或 400 mm 取小。豎向受壓筋 > 2% 時須按 9.6.4 加穿牆 links。6%/10% 是柱（9.5.1），5.2% 是 ductility 柱搭接（9.9.2.1）。","x":"The area of vertical reinforcement should not exceed 4% of the concrete cross-sectional area of a wall.","o":["混凝土截面的 4%，搭接處可加倍","6%，搭接處 10%","2%","4%，搭接處 5.2%"],"tier":"必考","q_en":"Per 9.6.2, what is the maximum vertical reinforcement in an RC wall?","o_en":["4% of the concrete section, may be doubled at laps","6%, 10% at laps","2%","4%, 5.2% at laps"],"e_en":"9.6.2: vertical steel minimum 0.4% (half at each face when the minimum governs); maximum 4%, which may be doubled at laps (i.e. 8%); vertical bar spacing ≤ the lesser of 3 times the wall thickness or 400 mm. Where vertical compression steel > 2%, links through the thickness are required per 9.6.4. 6%/10% are for columns (9.5.1); 5.2% is for ductile column laps (9.9.2.1).","doc":"concrete-2013-2020ed","pp":"144","ex":"rc"},{"id":"CON-135","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.6.3","p":158,"q":"按 9.6.3，主豎筋用作抗壓且不超過 2% 時，fy = 250 N/mm² 的 RC 牆最少水平鋼筋是？","a":0,"e":"9.6.3：fy 250 → 0.30%；fy 500 → 0.25%（混凝土截面）；水平筋間距 ≤ 400 mm，直徑 ≥ 豎筋的 1/4 及 ≥ 6 mm。0.24%/0.13% 是板（9.3.1.1）的數值。9.6.5 素混凝土牆如配筋，每方向亦為 0.30%/0.25%。","x":"(a) fy = 250 N/mm2: 0.30% of concrete cross-sectional area; and","o":["0.30%","0.25%","0.24%","0.13%"],"tier":"必考","q_en":"Per 9.6.3, where the main vertical steel resists compression and does not exceed 2%, what is the minimum horizontal steel in an RC wall with fy = 250 N/mm²?","e_en":"9.6.3: fy 250 → 0.30%; fy 500 → 0.25% (of concrete section); horizontal bar spacing ≤ 400 mm, diameter ≥ 1/4 of the vertical bars and ≥ 6 mm. 0.24%/0.13% are the slab values (9.3.1.1). Plain walls under 9.6.5, where reinforced, also use 0.30%/0.25% in each direction.","doc":"concrete-2013-2020ed","pp":"144","ex":"rc"},{"id":"CON-136","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.6.2","p":158,"q":"RC 牆最少豎筋 0.4% 由最少鋼筋控制設計時，應如何布置？","a":0,"e":"9.6.2：0.4% 是以整個混凝土截面計的總量，由最少筋控制時一半放每面（即每面約 0.2%）。每面各 0.4% 是常見誤解，會多用一倍鋼筋。","x":"Where this minimum area of reinforcement controls in the design, half of the area should","o":["總量的一半放在每一面","全部放在受拉面","每一面各放 0.4%","只放在牆中央一層"],"tier":"必考","q_en":"Where the 0.4% minimum vertical steel of an RC wall governs the design, how should it be arranged?","o_en":["Half of the total area at each face","All on the tension face","0.4% on each face","A single central layer only"],"e_en":"9.6.2: 0.4% is the total over the whole concrete section; where the minimum governs, half goes on each face (i.e. about 0.2% per face). 0.4% on each face is a common misreading that doubles the steel.","doc":"concrete-2013-2020ed","pp":"144","ex":"rc"},{"id":"CON-137","t":"mcq","d":3,"tp":"配筋限值 Steel limits","c":"9.9.3.2","p":167,"q":"Ductility 詳圖（9.9.3.2）：Type 2 confined boundary element 的豎向鋼筋不少於 boundary element 截面的多少？","a":0,"e":"Type 1：≥ 0.6%，≥ 6 支 12 mm，links ≥ 10 mm @ ≤ 250 mm；Type 2：≥ 0.8%，≥ 6 支 16 mm，links ≥ 10 mm @ ≤ 200 mm；Type 3：≥ 1%，≥ 6 支 16 mm，間距 ≤ 150 mm，links ≥ 12 mm @ ≤ 150 mm。0 < Ncr ≤ 0.38 時 critical zone 用 Type 2；0.38 < Ncr ≤ 0.75 時用 Type 3（9.9.3.4/9.9.3.5）。","x":"(i) not less than 0.8% of the sectional area of the structural boundary element;","o":["0.8%","0.6%","1%","0.4%"],"tier":"必考","q_en":"Ductility detailing (9.9.3.2): minimum vertical reinforcement of a Type 2 confined boundary element, as a percentage of the boundary element section?","e_en":"Type 1: ≥ 0.6%, ≥ 6 no. 12 mm bars, links ≥ 10 mm at ≤ 250 mm; Type 2: ≥ 0.8%, ≥ 6 no. 16 mm, links ≥ 10 mm at ≤ 200 mm; Type 3: ≥ 1%, ≥ 6 no. 16 mm, spacing ≤ 150 mm, links ≥ 12 mm at ≤ 150 mm. For 0 < Ncr ≤ 0.38 the critical zone uses Type 2; for 0.38 < Ncr ≤ 0.75, Type 3 (9.9.3.4/9.9.3.5).","doc":"concrete-2013-2020ed","pp":"153","ex":"rc"},{"id":"CON-138","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.4.2","p":155,"q":"按 9.4.2，懸臂構件頂部受拉主筋的最少百分率（毛截面）是？","a":0,"e":"9.4.2：懸臂頂部受拉筋 ≥ 0.25%（任何鋼筋等級），但不少於 9.3.1.1(a) 的板值；直徑 ≥ 10 mm，中心間距 ≤ 150 mm。0.13%/0.24% 是一般板每方向總量。","x":"concrete area should be 0.25% for all reinforcement grades but not less than that stipulated in","o":["0.25%（所有鋼筋等級），且不少於 9.3.1.1(a)","0.13%","0.24%","0.4%"],"tier":"必考","q_en":"Per 9.4.2, what is the minimum percentage of top tension longitudinal reinforcement (gross section) in a cantilevered projecting structure?","o_en":["0.25% (all reinforcement grades), and not less than 9.3.1.1(a)","0.13%","0.24%","0.4%"],"e_en":"9.4.2: cantilever top tension steel ≥ 0.25% (all reinforcement grades), but not less than the slab value of 9.3.1.1(a); diameter ≥ 10 mm, centre spacing ≤ 150 mm. 0.13%/0.24% are the ordinary slab totals in each direction.","doc":"concrete-2013-2020ed","pp":"141","ex":"rc"},{"id":"CON-139","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"9.3.1.1 / 9.5.1 / 9.6.2 / 9.6.3","p":153,"q":"fy = 500 N/mm² 時，以下哪一項最少鋼筋百分率配對是錯誤的？","a":0,"e":"板（9.3.1.1(a)）：fy 500 為 0.13%，0.24% 是 fy 250 的數值；受拉筋再乘 αmin。其餘正確：柱 0.8%（9.5.1）、牆豎筋 0.4%（9.6.2）、牆水平筋 fy 500 為 0.25%（9.6.3）。","x":"(i) fy = 250 N/mm2: 0.24% of concrete cross-sectional area; and","o":["實心板每方向總縱筋：0.24%","柱總縱筋：0.8%","牆豎筋：0.4%","牆水平筋（豎筋 ≤ 2%）：0.25%"],"tier":"必考","q_en":"For fy = 500 N/mm², which of the following minimum steel percentage pairings is WRONG?","o_en":["Solid slab, total longitudinal steel each direction: 0.24%","Column total longitudinal steel: 0.8%","Wall vertical steel: 0.4%","Wall horizontal steel (vertical ≤ 2%): 0.25%"],"e_en":"Slab (9.3.1.1(a)): 0.13% for fy 500; 0.24% is the fy 250 value; tension steel is further multiplied by αmin. The others are correct: column 0.8% (9.5.1), wall vertical 0.4% (9.6.2), wall horizontal 0.25% for fy 500 (9.6.3).","doc":"concrete-2013-2020ed","pp":"139","ex":"rc"},{"id":"CON-140","t":"mcq","d":2,"tp":"配筋限值 Steel limits","c":"Table 9.1","p":150,"q":"Table 9.1：主要承受純拉力的截面，fy = 500 N/mm² 時最少受拉鋼筋百分率（100As/Ac）是？","a":0,"e":"純拉截面：fy 500 → 0.45αmin；fy 250 → 0.8αmin。受彎矩形截面才是 0.13αmin。翼緣樑翼緣的橫向筋（抗水平剪力）另要 0.15αmin（100Ast/hf l）。","x":"Sections subjected mainly to pure tension 0.8αmin 0.45αmin","o":["0.45αmin","0.8αmin","0.13αmin","0.26αmin"],"tier":"必考","q_en":"Table 9.1: for sections subjected mainly to pure tension with fy = 500 N/mm², what is the minimum tension steel percentage (100As/Ac)?","e_en":"Pure tension: fy 500 → 0.45αmin; fy 250 → 0.8αmin. 0.13αmin is for a rectangular section in flexure. Transverse steel in flanges of flanged beams (for horizontal shear) needs 0.15αmin (100Ast/hf l).","doc":"concrete-2013-2020ed","pp":"136","ex":"rc"},{"id":"XC-002","doc":"wind-code-2019","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"2.3 / Concrete Table 2.1","p":20,"q":"Wind Code 2019 的 ultimate wind load factor γw = 1.4，與 Concrete Code Table 2.1 哪個組合的 wind γf 相同？","o":["Combination 2（Dead + Wind）","Combination 3（Dead + Imposed + Wind）","Combination 1（Dead + Imposed）","全部組合"],"a":0,"e":"Wind Code 用 γw 1.4 將 SLS 風壓轉為 ULS；Concrete Table 2.1 comb 2 wind 1.4、comb 3 wind 1.2。Wind Code 的 design pressure 是 characteristic（未乘 γw），計算時勿重複乘系數。","x":"ultimate wind load factor, taken as 1.4","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"2 earth and water 1.4 1.0 - - 1.4 1.4","pp":"11"}],"q_en":"The ultimate wind load factor γw = 1.4 in the Wind Code 2019 equals the wind γf of which combination in Concrete Code Table 2.1?","o_en":["Combination 2 (Dead + Wind)","Combination 3 (Dead + Imposed + Wind)","Combination 1 (Dead + Imposed)","All combinations"],"e_en":"The Wind Code uses γw 1.4 to convert SLS wind pressure to ULS; Concrete Table 2.1 comb 2 wind 1.4, comb 3 wind 1.2. The Wind Code design pressure is characteristic (not multiplied by γw) — do not apply the factor twice.","pp":"10","ex":"wind","tier":"偶考","cross":1},{"id":"XC-003","doc":"glass-2018","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 5.2","p":25,"q":"Glass Code Table 5.2 的 dead/imposed/wind partial load factors 與 Concrete Code Table 2.1 相同（例如 comb 1：1.4/1.0、1.6；comb 3：1.2），但 Glass 另列 temperature 1.2。","a":true,"e":"正確。玻璃設計沿用相同的 ULS 荷載框架，另加溫度荷載欄（1.2）。SLS 全部 adverse 系數 1.0（Table 5.2 Note b）。幕牆顧問與結構工程師要用同一套荷載。","x":"3 Dead, imposed, wind,","r":[{"doc":"concrete-2013-2020ed","p":25,"c":"Table 2.1","x":"3 wind (and earth and 1.2 1.0 1.2 0 1.2 1.2","pp":"11"}],"q_en":"The dead/imposed/wind partial load factors in Glass Code Table 5.2 are the same as Concrete Code Table 2.1 (e.g. comb 1: 1.4/1.0, 1.6; comb 3: 1.2), but the Glass Code additionally lists temperature at 1.2.","e_en":"True. Glass design follows the same ULS load framework, plus a temperature load column (1.2). At SLS all adverse factors are 1.0 (Table 5.2 Note b). Curtain wall consultants and structural engineers should use the same set of loads.","pp":"17","ex":"glass","tier":"偶考","cross":1},{"id":"XC-005","doc":"foundations-2017-2024ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 5.1 / GG1 Table 10","p":72,"q":"Foundations Code Table 5.1 中 SPT N = 11–30 乾/濕砂的 nh 為 6 600 kN/m²/m。Geoguide 1 Table 10 對 medium dense 乾砂的 nh 為？","o":["6.6 MN/m³（同一數值）","2.2 MN/m³","17.6 MN/m³","4.4 MN/m³"],"a":0,"e":"兩者數值一致（kN/m²/m = kN/m³；6 600 kN/m³ = 6.6 MN/m³），只是單位寫法不同。樁群還要按 Foundations Table 5.2 折減（3D 間距 0.25）。","x":"11 to 30 6 600 4 400","r":[{"doc":"geoguide1-retaining-walls","p":141,"c":"Table 10","x":"nh (dry sand) (MN/m3) 2.2 6.6 17.6","pp":"140"}],"q_en":"In Foundations Code Table 5.1, nh for dry/submerged sand with SPT N = 11–30 is 6 600 kN/m²/m. What is nh for medium dense dry sand in Geoguide 1 Table 10?","o_en":["6.6 MN/m³ (the same value)","2.2 MN/m³","17.6 MN/m³","4.4 MN/m³"],"e_en":"The two values agree (kN/m²/m = kN/m³; 6 600 kN/m³ = 6.6 MN/m³); only the unit notation differs. Pile groups must also be reduced per Foundations Table 5.2 (0.25 at 3D spacing).","pp":"64","ex":"fdn","tier":"常考","cross":1},{"id":"XC-006","doc":"foundations-2017-2024ed","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"2.6.2 / Precast 2.6.2.1 / Concrete 4.2.7.3","p":39,"q":"Foundations、Precast 及 Concrete 三本 Code 對混凝土 reactive alkali（Na2O equivalent）含量上限一致，是每立方米多少 kg？","a":0,"u":"kg/m³","e":"AAR 控制：三本 Code 都是 3.0 kg/m³。樁及地庫長期潮濕，AAR 風險更高，故 Foundations Code 亦重申。","x":"of concrete should not exceed 3.0 kg.","r":[{"doc":"precast-2016","p":15,"c":"2.6.2.1","x":"cubic metre should not exceed 3.0 kg.","pp":"7"},{"doc":"concrete-2013-2020ed","p":47,"c":"4.2.7.3","x":"should not exceed 3.0 kg;","pp":"33"}],"o":["3.0 kg/m³","4.0 kg/m³","2.5 kg/m³","2.0 kg/m³"],"q_en":"The Foundations, Precast and Concrete Codes agree on the limit of reactive alkali content (Na2O equivalent) of concrete. What is it, in kg per cubic metre?","e_en":"AAR control: 3.0 kg/m³ in all three Codes. Piles and basements are permanently damp, so AAR risk is higher, which is why the Foundations Code restates it.","pp":"31","ex":"fdn","tier":"常考","cross":1},{"id":"XC-007","doc":"geo-pub-1-2023-deep-excavation","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"Table 6.2 / GG1 Table 6","p":69,"q":"臨時 ELS（GEO Pub 1/2023 PFM）與永久擋土牆（Geoguide 1 Table 6）的 surcharge partial load factor 分別是？","o":["1.3 及 1.5","1.5 及 1.3","1.5 及 1.5","1.0 及 1.5"],"a":0,"e":"ELS 屬臨時工程，地盤上的 surcharge 較易控制，故降至 1.3；永久擋土牆用 1.5。兩者若 surcharge 有利均取 0。","x":"The partial factor for surcharge loading is recommended to be 1.3.","r":[{"doc":"geoguide1-retaining-walls","p":139,"c":"Table 6","x":"Surcharge 1.5(1)","pp":"138"}],"q_en":"What are the surcharge partial load factors for temporary ELS (GEO Pub 1/2023 PFM) and permanent retaining walls (Geoguide 1 Table 6) respectively?","o_en":["1.3 and 1.5","1.5 and 1.3","1.5 and 1.5","1.0 and 1.5"],"e_en":"ELS is temporary works and site surcharge is easier to control, hence reduced to 1.3; permanent retaining walls use 1.5. In both cases take 0 where surcharge is favourable.","pp":"69","ex":"ground","tier":"常考","cross":1},{"id":"XC-008","doc":"geo-pub-1-2023-deep-excavation","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"4.4.1 / GG1 Table 8 Note (6)","p":48,"q":"GEO Pub 1/2023 引用 Geoguide 1：insitu CDG 及 CDV 的 φcv' 下限約 34° 及 30°，可用作 embedded wall 界面摩擦角 δs。","a":true,"e":"正確。Dense soil 中 δs 可取 φcv'；wall adhesion 通常忽略。這些參數影響 waling 靠牆摩擦抵抗角撐 in-plane 力的計算。","x":"granitic and volcanic (tuff and rhyolite) soils respectively. Wall adhesion, cw, is usually","r":[{"doc":"geoguide1-retaining-walls","p":140,"c":"Table 8 Note (6)","x":"completely decomposed volcanics (tuff & rhyolites) is about 34° and 30° respectively.","pp":"139"}],"q_en":"GEO Pub 1/2023 cites Geoguide 1: the lower-bound φcv' of insitu CDG and CDV is about 34° and 30°, which may be used as the wall friction angle δs of an embedded wall.","e_en":"True. In dense soil δs may be taken as φcv'; wall adhesion is usually ignored. These parameters affect the calculation of waling-to-wall friction resisting the in-plane force from struts.","pp":"48","ex":"ground","tier":"常考","cross":1},{"id":"XC-011","doc":"concrete-2013-2020ed","t":"mcq","d":2,"tp":"跨規範 Cross-code","c":"7.3.2 / Steel EM E5.3.4","p":120,"q":"Concrete Code 7.3.2 及 Steel Code 5.3.4（見 EM）對建築物頂部側移的簡化限值？","o":["H/500","H/300","H/1000","H/250"],"a":0,"e":"兩本 Code 都以 H/500（Wind Code 設計風荷載下）作簡化舒適度/側移準則；Steel 另有 storey height/400 層間位移。超高層應以動力分析或風洞驗證加速度。","x":"the structure and its surroundings. Limiting deflection at the top of a building to H/500 where H should","r":[{"doc":"steel-explanatory-materials-2011","p":38,"c":"E5.3.4","x":"The first is to limit the top deflection to Height/500 and the inter storey drift to Storey","pp":"32"}],"q_en":"What is the simplified limit on lateral sway at the top of a building in Concrete Code 7.3.2 and Steel Code 5.3.4 (see EM)?","e_en":"Both Codes use H/500 (under the Wind Code design wind load) as a simplified comfort/sway criterion; the Steel Code also limits inter-storey drift to storey height/400. For super-tall buildings, verify acceleration by dynamic analysis or wind tunnel testing.","pp":"106","ex":"rc","tier":"常考","cross":1},{"id":"XC-012","doc":"concrete-2013-2020ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"2.3.1.4(a) / Precast 2.3.1","p":24,"q":"Concrete Code 與 Precast Code 的 notional horizontal load 均為每層 characteristic dead load 的 1.5%。","a":true,"e":"正確。Precast 結構的穩定性要求與現澆一致；預製構件接駁必須能傳遞此水平力。","x":"each floor (including roof) level simultaneously equal to 1.5% of the characteristic dead weight","r":[{"doc":"precast-2016","p":12,"c":"2.3.1","x":"acting at each floor level equals to 1.5% of the characteristic dead load between mid-heights of the","pp":"4"}],"q_en":"The notional horizontal load in both the Concrete Code and the Precast Code is 1.5% of the characteristic dead load of each floor.","e_en":"True. The stability requirements for precast structures are the same as for cast-in-place; precast connections must be able to transfer this horizontal force.","pp":"10","ex":"rc","tier":"常考","cross":1},{"id":"XC-013","doc":"concrete-2013-2020ed","t":"mcq","d":3,"tp":"跨規範 Cross-code","c":"2.3.1.4(b) / Steel EM E4.3.5","p":24,"q":"Concrete Code 2.3.1.4(b) 的 key element 設計荷載與 Steel EM 提到的 explosion pressure 均為？","o":["34 kN/m²（不加 partial factor）","34 kN/m² × 1.4","10 kPa","5 kPa × 1.6"],"a":0,"e":"34 kN/m² 為 design ultimate load，不再乘 γf；Steel EM 亦以 34 kN/m² 作 extreme event load。Exceptional combination 中其他 live/wind 取 1/3（Steel Table 4.3 用 0.35）。","x":"be capable of withstanding a design ultimate load of 34 kN/m2, to which no partial safety factor","r":[{"doc":"steel-explanatory-materials-2011","p":36,"c":"E4.3.5","x":"wind load factor of 1.05 x 0.33 = 0.35 is given in Table 4.3 of the Code for wind and live","pp":"30"}],"q_en":"The key element design load in Concrete Code 2.3.1.4(b) and the explosion pressure mentioned in the Steel EM are both:","o_en":["34 kN/m² (no partial factor)","34 kN/m² × 1.4","10 kPa","5 kPa × 1.6"],"e_en":"34 kN/m² is a design ultimate load with no further γf; the Steel EM also uses 34 kN/m² as the extreme event load. In the exceptional combination, other live/wind loads take 1/3 (Steel Table 4.3 uses 0.35).","pp":"10","ex":"rc","tier":"常考","cross":1},{"id":"XC-015","doc":"foundations-2017-2024ed","t":"tf","d":2,"tp":"跨規範 Cross-code","c":"Table 2.1 / Geoguide 3 Table 12","p":20,"q":"Foundations Code Table 2.1 的 presumed bearing value 分類（例如 dense: SPT N 30–50）與 Geoguide 3 Table 12 的 compactness 分級一致。","a":true,"e":"正確。Foundations Table 2.1 用 very dense > 50、dense 30–50、medium dense 10–30、loose 4–10，與 Geoguide 3 Table 12 的分界相同。鑽孔記錄用 Geoguide 3 描述，直接對應 Foundations Code 的承載力分類。","x":"4(b) Dense – SPT N-value 30-50; requires pick for 300 150","r":[{"doc":"geoguide3-rock-soil-descriptions","p":80,"c":"Table 12","x":"Very dense > 50","pp":"79"}],"q_en":"The presumed bearing value categories in Foundations Code Table 2.1 (e.g. dense: SPT N 30–50) are consistent with the compactness classes in Geoguide 3 Table 12.","e_en":"True. Foundations Table 2.1 uses very dense > 50, dense 30–50, medium dense 10–30, loose 4–10 — the same boundaries as Geoguide 3 Table 12. Borehole logs described per Geoguide 3 map directly onto the bearing categories of the Foundations Code.","pp":"12","ex":"fdn","tier":"常考","cross":1},{"id":"XC-016","doc":"precast-2016","t":"tf","d":1,"tp":"跨規範 Cross-code","c":"2.4.3","p":13,"q":"Precast Code 規定預製構件的 cover 不應少於 Concrete Code 對 RC 的規定。","a":true,"e":"正確。雖然工廠質量控制較好，但 cover 並無放寬；防火 cover 仍按 Fire Code。","x":"Cover for precast elements should be no less than those specified for reinforced concrete","q_en":"The Precast Code requires that the cover to precast members should not be less than that required by the Concrete Code for RC.","e_en":"True. Although factory quality control is better, cover is not relaxed; fire cover still follows the Fire Code.","pp":"5","ex":"precast","tier":"偶考","cross":1},{"id":"DIL-001","t":"tf","d":1,"tp":"總則 General","c":"1.1.3","p":5,"q":"Dead and Imposed Loads Code 內的荷載數值是 factored values，做 limit state design 時不可直接當 characteristic loads 使用。","a":false,"e":"錯。Code 1.1.3 明言所有荷載均為 unfactored values，可直接當 characteristic loads，再乘 Concrete/Steel Code 的 partial load factors (γf)。常見錯誤：把 Table 3.2 的數值當成已放大，漏乘 1.6。","x":"All values of loads given in this Code are unfactored values and may be taken as characteristic loads when carrying out design using limit state method.","q_en":"The load values in the Dead and Imposed Loads Code are factored values and cannot be used directly as characteristic loads in limit state design.","e_en":"False. Code 1.1.3 states that all loads are unfactored values and may be used directly as characteristic loads, to be multiplied by the partial load factors (γf) of the Concrete/Steel Codes. Common error: treating the Table 3.2 values as already factored and omitting the 1.6.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","ex":"loads","tier":"偶考"},{"id":"DIL-002","t":"tf","d":1,"tp":"總則 General","c":"1.1.4","p":5,"q":"Construction loads（施工荷載）已包括在 Dead and Imposed Loads Code 的 imposed loads 內，設計者毋須另行考慮。","a":false,"e":"錯。1.1.4 指 construction loads 不在 Code 範圍，設計者須自行考慮，例如 transfer plate 澆築時的濕混凝土、模板、堆料。提交圖則時如有特別施工次序（如 propping），應在計算書交代。","x":"Construction loads are not covered by this Code and the designer should consider the relevant construction loads and effect thereof as part of their design.","q_en":"Construction loads are included in the imposed loads of the Dead and Imposed Loads Code, so the designer need not consider them separately.","e_en":"False. 1.1.4 states that construction loads are outside the scope of the Code and must be considered by the designer, e.g. wet concrete, formwork and stacked materials when casting a transfer plate. Where a special construction sequence (e.g. propping) applies, explain it in the calculations submitted with the plans.","doc":"dead-imposed-loads-2011-2021ed","pp":"1","ex":"loads","tier":"偶考"},{"id":"DIL-003","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.1.2","p":6,"q":"水缸（tanks）及其儲水應如何分類？","o":["水缸重量及儲水均屬 dead load","水缸重量屬 dead load，儲水屬 imposed load","水缸重量及儲水均屬 imposed load","兩者均可不計"],"a":1,"e":"2.1.2：容器本身重量為 dead load，內容物為 imposed load。實務上天台水缸（roof tank）水重應按 imposed load 乘 γf=1.6，而且不應把它當永久荷載去抵抗 uplift 或 overturning。","x":"The weights of tanks and other receptacles shall be considered as dead loads. The contents of tanks and receptacles shall be considered as imposed loads.","q_en":"How should tanks and their stored water be classified?","o_en":["Both the tank weight and the stored water are dead load","The tank weight is dead load; the stored water is imposed load","Both the tank weight and the stored water are imposed load","Neither needs to be considered"],"e_en":"2.1.2: the self-weight of the container is dead load and its contents are imposed load. In practice, water in a roof tank should be treated as imposed load with γf=1.6, and should not be relied on as a permanent load to resist uplift or overturning.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","ex":"loads","tier":"常考"},{"id":"DIL-005","t":"mcq","d":1,"tp":"恆載 Dead loads","c":"2.2.2.2","p":6,"q":"建築圖則上未有顯示位置、但預計會有的 partitions，其重量應當作：","o":["Dead load，按實際排位計算","Imposed load，按 clause 3.6 計算","Wind load","毋須考慮"],"a":1,"e":"2.2.2.2：未在 building plans 顯示位置的間隔牆屬 imposed load（按 3.6 以 1/3 牆重/米計，office 不少於 1 kPa）。已顯示在核准圖則上的則屬 dead load（2.2.2.1）。","x":"Where partitions are envisaged but the location of which are not indicated on the building plans, the weights of these partitions shall be considered as imposed loads and to be calculated in accordance with clause 3.6.","q_en":"The weight of partitions that are expected but whose positions are not shown on the building plans should be treated as:","o_en":["Dead load, calculated from the actual layout","Imposed load, calculated per clause 3.6","Wind load","Need not be considered"],"e_en":"2.2.2.2: partitions whose positions are not shown on the building plans are imposed load (per 3.6, 1/3 of the wall weight per metre, not less than 1 kPa for offices). Those shown on approved plans are dead load (2.2.2.1).","doc":"dead-imposed-loads-2011-2021ed","pp":"2","ex":"loads","tier":"常考"},{"id":"DIL-006","t":"tf","d":1,"tp":"恆載 Dead loads","c":"2.2.3.2","p":6,"q":"天台綠化（roof greenery）的泥土、防水及排水系統與植物重量應當作 dead load。","a":true,"e":"對。2.2.3.2 規定 greenery 的泥土、防水、排水及植物屬 dead load。實務上要留意泥土飽和水重（saturated density）及日後加厚泥層的可能，並在圖則註明最大泥深。","x":"Where a roof is to be provided with greenery, the weight of soil, waterproofing and drainage system, and plants for greenery shall be taken as dead loads.","q_en":"The weight of soil, waterproofing, drainage systems and plants of roof greenery should be treated as dead load.","e_en":"True. 2.2.3.2 classifies the soil, waterproofing, drainage and plants of greenery as dead load. In practice, note the saturated density of the soil and the possibility of thicker soil later, and state the maximum soil depth on the drawings.","doc":"dead-imposed-loads-2011-2021ed","pp":"2","ex":"loads","tier":"常考"},{"id":"DIL-007","t":"num","d":2,"tp":"恆載 Dead loads","c":"2.2.5.1","p":7,"q":"骨灰龕場的重型龕位（如混凝土龕位），重量不應少於每米高每米長多少 kN/m？","a":4.5,"tol":0,"u":"kN/m per m height","e":"2.2.5.1：輕型龕位（木或輕金屬）≥2.0 kN/m 每米高，重型（混凝土）≥4.5 kN/m 每米高，另加骨灰甕重量。Columbaria 樓面走道（非龕位範圍）按 Table 3.2 取 4.0 kPa。","x":"For heavy weight niches, such as niches made of concrete, the weight shall be not less than 4.5 kN/m length for each metre height.","q_en":"For heavy niches in a columbarium (e.g. concrete niches), the weight should not be less than how many kN/m per metre height per metre length?","e_en":"2.2.5.1: light niches (timber or light metal) ≥2.0 kN/m per metre height, heavy (concrete) ≥4.5 kN/m per metre height, plus the weight of urns. Circulation areas of columbaria (outside niche areas) take 4.0 kPa per Table 3.2.","doc":"dead-imposed-loads-2011-2021ed","pp":"3","ex":"loads","tier":"常考"},{"id":"DIL-008","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"3.1.4","p":8,"q":"Table 3.2 中的 qk 與 Qk 應如何施加？","o":["兩者同時疊加施加","分開考慮（considered separately），取最不利者","只需考慮 qk","只需考慮 Qk"],"a":1,"e":"3.1.3–3.1.4：qk 與 Qk 分開考慮，取較不利者。Qk 主要控制局部 punching / 薄板 / 短跨構件；常見錯誤是把 Qk 疊加在 qk 上，過度保守。","x":"The uniformly distributed load, qk, and the concentrated load or line load, Qk, shall be considered separately.","q_en":"How should qk and Qk in Table 3.2 be applied?","o_en":["Both applied together, superimposed","Considered separately, taking the more onerous","Only qk need be considered","Only Qk need be considered"],"e_en":"3.1.3–3.1.4: qk and Qk are considered separately and the more onerous is taken. Qk mainly governs local punching / thin slabs / short-span members; a common error is to add Qk on top of qk, which is over-conservative.","doc":"dead-imposed-loads-2011-2021ed","pp":"4","ex":"loads","tier":"必考"},{"id":"DIL-009","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：一般用途寫字樓（Offices for general use）的 qk 是多少 kPa？","a":0,"u":"kPa","e":"Offices for general use：qk = 3.0 kPa，Qk = 4.5 kN。注意 office 內 storage/filing 用途要升至 5.0 kPa（Class 5），而且不可按 3.7 折減；另如間隔牆位置未定，須再加 ≥1 kPa。","x":"Offices for general use 3.0 4.5","o":["3.0 kPa","5.0 kPa","2.5 kPa","2.0 kPa"],"q_en":"Table 3.2: what is qk for offices for general use, in kPa?","e_en":"Offices for general use: qk = 3.0 kPa, Qk = 4.5 kN. Note that storage/filing use within offices must be raised to 5.0 kPa (Class 5) and cannot be reduced under 3.7; and if partition positions are undetermined, add ≥1 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"5","ex":"loads","tier":"必考"},{"id":"DIL-010","t":"mcq","d":1,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":9,"q":"Table 3.2：住宅用途（Domestic uses）樓面的 qk 是多少 kPa？","a":0,"u":"kPa","e":"Class 1 Domestic uses：qk 2.0 kPa、Qk 2.0 kN。住宅廚房、浴室亦同為 2.0 kPa，但 Jacuzzi 須另行評估。住宅 balconies 及 utility platforms 則按 Table 3.9（Class 8）另有下限。","x":"Domestic uses 2.0 2.0","o":["2.0 kPa","3.0 kPa","2.5 kPa","1.5 kPa"],"q_en":"Table 3.2: what is qk for floors for domestic uses, in kPa?","e_en":"Class 1 domestic uses: qk 2.0 kPa, Qk 2.0 kN. Domestic kitchens and bathrooms are also 2.0 kPa, but Jacuzzis must be assessed separately. Domestic balconies and utility platforms have separate lower bounds under Table 3.9 (Class 8).","doc":"dead-imposed-loads-2011-2021ed","pp":"5","ex":"loads","tier":"必考"},{"id":"DIL-011","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"以下哪一項用途在 Table 3.2 中 qk = 5.0 kPa？","o":["Classrooms","Restaurants","Public halls, theatres, cinemas","Childcare centers"],"a":2,"e":"Public halls、theatres、cinemas 屬 3B fixed seating 但 qk 5.0 kPa；Restaurants 4.0 kPa；Classrooms 3.0 kPa；Childcare centres 2.5 kPa。改變用途（例如商場改戲院）須重新檢核樓面荷載，屬 alteration and addition works 常見問題。","x":"Public halls, theatres, cinemas 5.0 4.5","q_en":"Which of the following uses has qk = 5.0 kPa in Table 3.2?","e_en":"Public halls, theatres and cinemas are 3B fixed seating but qk 5.0 kPa; restaurants 4.0 kPa; classrooms 3.0 kPa; child care centres 2.5 kPa. A change of use (e.g. mall to cinema) requires the floor loading to be rechecked — a common issue in alteration and addition works.","doc":"dead-imposed-loads-2011-2021ed","pp":"6","ex":"loads","tier":"必考"},{"id":"DIL-012","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":10,"q":"避難層（refuge floors）按 Table 3.2 的 qk 是多少 kPa？","a":2,"u":"kPa","e":"Refuge floor 歸入 3C（Assembly areas without fixed seating）qk = 5.0 kPa。高樓設計時 refuge floor 常同時是 transfer / outrigger 層，荷載取值要與 Fire Safety Code 的 refuge floor 要求一併考慮。","x":"Assembly areas without fixed 5.0 4.5","o":["4.0 kPa","3.0 kPa","5.0 kPa","7.5 kPa"],"q_en":"What is qk for refuge floors under Table 3.2, in kPa?","e_en":"Refuge floors fall under 3C (assembly areas without fixed seating), qk = 5.0 kPa. In tall buildings the refuge floor is often also a transfer / outrigger level; the loading must be considered together with the refuge floor requirements of the Fire Safety Code.","doc":"dead-imposed-loads-2011-2021ed","pp":"6","ex":"loads","tier":"必考"},{"id":"DIL-013","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":11,"q":"舞台（Stages）的 qk 是多少 kPa？","a":1,"u":"kPa","e":"Stages、television studios used as stages：qk 7.5 kPa，Qk 9.0 kN，是 Class 3 中最高值。學校禮堂舞台常被忽略而按 5.0 kPa 設計。","x":"Stages, television studios used as 7.5 9.0 stages","o":["5.0 kPa","7.5 kPa","4.0 kPa","10.0 kPa"],"q_en":"What is qk for stages, in kPa?","e_en":"Stages and television studios used as stages: qk 7.5 kPa, Qk 9.0 kN — the highest value in Class 3. School hall stages are often overlooked and designed for 5.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"7","ex":"loads","tier":"必考"},{"id":"DIL-014","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"機房（Plant rooms, boiler rooms, fan rooms, motor rooms）的最低 imposed load 是：","o":["5.0 kPa / 4.5 kN","7.5 kPa / 9.0 kN","10.0 kPa / 9.0 kN","3.0 kPa / 4.5 kN"],"a":1,"e":"Plant rooms 7.5 kPa、Qk 9.0 kN。實際設備如 chiller、transformer 往往更重，應向 BS/MEP 取得設備重量，按 3.1.2「minimum values」原則取較大者，並考慮設備基座（plinth）重量。","x":"Plant rooms, boiler rooms, fan 7.5 9.0","q_en":"The minimum imposed load for plant rooms (boiler rooms, fan rooms, motor rooms) is:","e_en":"Plant rooms 7.5 kPa, Qk 9.0 kN. Actual equipment such as chillers and transformers is often heavier; obtain equipment weights from the BS/MEP engineers, take the greater value under the \"minimum values\" principle of 3.1.2, and include the weight of equipment plinths.","doc":"dead-imposed-loads-2011-2021ed","pp":"8","ex":"loads","tier":"必考"},{"id":"DIL-015","t":"mcq","d":2,"tp":"外加荷載 Imposed loads","c":"Table 3.2","p":12,"q":"重型工業用途工場（workshops/factories for heavy weight loads）的 qk 是多少 kPa？","a":1,"u":"kPa","e":"工業樓面：light 5.0、medium 7.5、heavy 10.0、printing plants 12.5 kPa（Qk 均 9.0 kN）。工業大廈須按 3.11 在每層樓梯張貼 designed distributed imposed load 告示。","x":"(c) for heavy weight loads 10.0 9.0","o":["5.0 kPa","10.0 kPa","7.5 kPa","12.5 kPa"],"q_en":"What is qk for workshops/factories for heavy weight loads, in kPa?","e_en":"Industrial floors: light 5.0, medium 7.5, heavy 10.0, printing plants 12.5 kPa (Qk 9.0 kN in all cases). Industrial buildings must display notices of the designed distributed imposed load at the staircase on each floor per 3.11.","doc":"dead-imposed-loads-2011-2021ed","pp":"8","ex":"loads","tier":"必考"},{"id":"DIL-016","t":"mcq","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.3","p":13,"q":"消防車（Fire engines）可到達的區域屬哪一個 Area Class？","o":["6A","6B","6C","6D"],"a":3,"e":"Table 3.3：6D 為不超過 30,000 kg 的車輛，例子包括 fire engines、refuse collection vehicles。EVA 設計另須按 3.3.3 檢核 230 kN 及 100 kN 集中荷載。","x":"30,000 kg gross weight","q_en":"Areas accessible to fire engines belong to which Area Class?","e_en":"Table 3.3: 6D is for vehicles not exceeding 30,000 kg, with examples including fire engines and refuse collection vehicles. EVA design must additionally check concentrated loads of 230 kN and 100 kN per 3.3.3.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","ex":"loads","tier":"常考"},{"id":"DIL-018","t":"mcq","d":1,"tp":"車輛荷載 Vehicular loads","c":"Table 3.4","p":13,"q":"私家車停車場（Area Class 6A）的 Qk 是多少 kN？","a":2,"u":"kN","e":"Table 3.4：6A qk 3.0 kPa、Qk 20.0 kN（施加於 200 mm 方形面積）。雙層泊車（double-deck parking）時 qk 要加倍（3.3.5.3）。","x":"Class qk (kPa) Qk (kN) 6A 3.0 20.0","o":["10.0 kN","45.0 kN","20.0 kN","30.0 kN"],"q_en":"What is Qk for private car parks (Area Class 6A), in kN?","e_en":"Table 3.4: 6A qk 3.0 kPa, Qk 20.0 kN (applied over a 200 mm square). For double-deck parking, qk is doubled (3.3.5.3).","doc":"dead-imposed-loads-2011-2021ed","pp":"9","ex":"loads","tier":"常考"},{"id":"DIL-019","t":"tf","d":2,"tp":"車輛荷載 Vehicular loads","c":"3.3.5.3","p":13,"q":"6A 停車場如需提供雙層泊車（double-deck parking），qk 應取 Table 3.4 數值的兩倍。","a":true,"e":"對。3.3.5.3 規定 double-deck parking 時 qk 取兩倍（即 6.0 kPa）。機械泊車系統的支承點荷載亦應向供應商索取並檢核。","x":"Where provision for double-deck parking is required for Area Class 6A, the uniformly distributed load, qk, shall be twice the value given in Table 3.4.","q_en":"If a 6A car park needs to provide double-deck parking, qk should be taken as twice the value in Table 3.4.","e_en":"True. 3.3.5.3 requires qk to be doubled (i.e. 6.0 kPa) for double-deck parking. Support point loads of mechanical parking systems should also be obtained from the supplier and checked.","doc":"dead-imposed-loads-2011-2021ed","pp":"9","ex":"loads","tier":"常考"},{"id":"DIL-020","t":"mcq","d":2,"tp":"車輛荷載 Vehicular loads","c":"Table 3.5","p":13,"q":"Area Class 6C 的集中荷載 Qk 是多少 kN？","a":1,"u":"kN","e":"Table 3.5：6B 30 kN、6C 60 kN、6D 80 kN；qk 則按 Table 3.6 的 loaded length 決定。6C/6D 的 Qk 施加於 300 mm 方形（3.3.6.3）。","x":"6C See Table 3.6 60.0","o":["45.0 kN","60.0 kN","90.0 kN","30.0 kN"],"q_en":"What is the concentrated load Qk for Area Class 6C, in kN?","e_en":"Table 3.5: 6B 30 kN, 6C 60 kN, 6D 80 kN; qk depends on the loaded length per Table 3.6. Qk for 6C/6D is applied over a 300 mm square (3.3.6.3).","doc":"dead-imposed-loads-2011-2021ed","pp":"9","ex":"loads","tier":"常考"},{"id":"DIL-021","t":"mcq","d":3,"tp":"車輛荷載 Vehicular loads","c":"3.3.7","p":15,"q":"Area Class 6E 如不按 HB loading 設計而採用修改後的 HA loading，knife edge load 應取：","o":["20 kN/m","40 kN/m","100 kN/m","120 kN/m"],"a":1,"e":"3.3.7(b)：knife edge load 取 40 kN/m，垂直於 loaded length；notional lane width 取 3 m；single wheel load 100 kN 另行評估。車輛的 centrifugal、braking 等次要荷載在停車場結構毋須考慮。","x":"the knife edge load shall be taken as 40 kN/m applied in the direction perpendicular to","q_en":"If Area Class 6E is designed with modified HA loading instead of HB loading, the knife edge load should be taken as:","e_en":"3.3.7(b): knife edge load 40 kN/m, perpendicular to the loaded length; notional lane width 3 m; the 100 kN single wheel load is assessed separately. Secondary vehicle loads such as centrifugal and braking forces need not be considered for car park structures.","doc":"dead-imposed-loads-2011-2021ed","pp":"11","ex":"loads","tier":"常考"},{"id":"DIL-022","t":"mcq","d":1,"tp":"天台荷載 Roofs","c":"Table 3.8","p":15,"q":"Class 7A 不可到達天台（inaccessible roof），坡度 ≤ 5° 時 qk 是多少 kPa？","a":1,"u":"kPa","e":"Table 3.8：7A 坡度 ≤20° 時 qk 0.75 kPa（Qk 1.5 kN），20°–40° 之間線性內插至 0，≥40° 為 0。注意 inaccessible 指只供維修進出；如有住客可上落，要按 7B/7C 取 ≥2.0 kPa。","x":"Greater than 5º but of","o":["0.5 kPa","0.75 kPa","1.5 kPa","2.0 kPa"],"q_en":"For a Class 7A inaccessible roof with slope ≤ 5°, what is qk in kPa?","e_en":"Table 3.8: 7A with slope ≤20°: qk 0.75 kPa (Qk 1.5 kN), linearly interpolated to 0 between 20° and 40°, 0 at ≥40°. Note that inaccessible means access for maintenance only; if occupants have access, use 7B/7C at ≥2.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"11","ex":"loads","tier":"常考"},{"id":"DIL-023","t":"mcq","d":2,"tp":"天台荷載 Roofs","c":"Table 3.8","p":16,"q":"混凝土簷篷（Concrete canopy, Class 7D）的 qk 是：","o":["0.75 kPa","1.5 kPa","2.0 kPa","3.0 kPa"],"a":2,"e":"Table 3.8：lightweight canopy 0.75 kPa（不包括維修時堆積雜物），concrete canopy 2.0 kPa（已包括維修時堆積的建築物料及雜物）。常見錯誤：混凝土簷篷只用 0.75 kPa。","x":"The value of qk takes into account of additional loads due to accumulations of construction materials and","q_en":"The qk for a concrete canopy (Class 7D) is:","e_en":"Table 3.8: lightweight canopy 0.75 kPa (excluding accumulation of debris during maintenance); concrete canopy 2.0 kPa (including accumulation of building materials and debris during maintenance). Common error: using only 0.75 kPa for concrete canopies.","doc":"dead-imposed-loads-2011-2021ed","pp":"12","ex":"loads","tier":"常考"},{"id":"DIL-024","t":"mcq","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":16,"q":"Utility platforms 的 qk 不應少於多少 kPa？","a":0,"u":"kPa","e":"Table 3.9：Utility platforms「Same as the floors to which they give access but not less than 4.0」kPa，另加 2.0 kN/m 沿外緣線荷載；Balconies 下限 3.0 kPa。住宅設計常錯用 2.0 kPa。","x":"access but not less along the outer edge","o":["4.0 kPa","3.0 kPa","2.0 kPa","5.0 kPa"],"q_en":"The qk for utility platforms should not be less than how many kPa?","e_en":"Table 3.9: utility platforms \"Same as the floors to which they give access but not less than 4.0\" kPa, plus a 2.0 kN/m line load along the outer edge; balconies lower bound 3.0 kPa. Residential designs often wrongly use 2.0 kPa.","doc":"dead-imposed-loads-2011-2021ed","pp":"12","ex":"loads","tier":"偶考"},{"id":"DIL-025","t":"mcq","d":2,"tp":"附屬構件 Class 8","c":"Table 3.9","p":17,"q":"樓梯、平台及走廊（Stairs, landings and corridors）的集中荷載 Qk 是多少 kN？","a":0,"u":"kN","e":"Table 3.9：Stairs, landings and corridors qk 與所通往樓面相同，但不少於 3.0 及不多於 5.0 kPa；Qk 4.5 kN。住宅梯級板 Qk 4.5 kN 常控制薄 waist slab。","x":"Stairs, landings and corridors access but not less 4.5","o":["4.5 kN","3.0 kN","2.7 kN","5.0 kN"],"q_en":"What is the concentrated load Qk for stairs, landings and corridors, in kN?","e_en":"Table 3.9: stairs, landings and corridors qk same as the floors they serve, but not less than 3.0 and not more than 5.0 kPa; Qk 4.5 kN. For residential stair flights, Qk 4.5 kN often governs thin waist slabs.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","ex":"loads","tier":"偶考"},{"id":"DIL-027","t":"mcq","d":2,"tp":"荷載折減 Reduction","c":"3.7.1","p":17,"q":"以下哪種荷載可以按 clause 3.7 折減？","o":["寫字樓的 storage and filing 荷載","車輛荷載","一般寫字樓 3.0 kPa 樓面荷載","未定位置的間隔牆荷載"],"a":2,"e":"3.7.1 列明不可折減的荷載：指定的機器、工廠 <7.5 kPa、車輛、office storage/filing、動力、storage、未定位置間隔牆、不確定永久性荷載。一般 office 3.0 kPa 則可折減。","x":"(d) floor loads from storage and filing in offices;","q_en":"Which of the following loads may be reduced under clause 3.7?","o_en":["Storage and filing loads in offices","Vehicle loads","Ordinary office floor load of 3.0 kPa","Partition load with undetermined positions"],"e_en":"3.7.1 lists loads that may not be reduced: specified machinery, factories <7.5 kPa, vehicles, office storage/filing, dynamic loads, storage, partitions with undetermined positions and loads of uncertain permanency. The ordinary office 3.0 kPa may be reduced.","doc":"dead-imposed-loads-2011-2021ed","pp":"13","ex":"loads","tier":"常考"},{"id":"DIL-028","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.10","p":17,"q":"一條單跨樑承托 135 m² 樓面面積，其總分布 imposed load 可折減多少百分比？","a":15,"tol":0,"u":"%","e":"Table 3.10：<45 m² 0%、45 m² 5%、90 m² 10%、135 m² 15%、180 m² 20%（最多）。中間值可線性內插，但 45 m² 以下不可內插。樑的折減不能帶落柱（3.7.2.2）。","x":"90 10 135 15 180 20 maximum","q_en":"A single-span beam supports 135 m² of floor area. By what percentage may its total distributed imposed load be reduced?","e_en":"Table 3.10: <45 m² 0%, 45 m² 5%, 90 m² 10%, 135 m² 15%, 180 m² 20% (maximum). Intermediate values may be interpolated linearly, but not below 45 m². Beam reductions are not carried down to columns (3.7.2.2).","doc":"dead-imposed-loads-2011-2021ed","pp":"13","ex":"loads","tier":"常考"},{"id":"DIL-029","t":"tf","d":2,"tp":"荷載折減 Reduction","c":"3.7.2.2","p":18,"q":"樑按 Table 3.10 折減後的 imposed load 可直接用於設計承托該樑的柱。","a":false,"e":"錯。3.7.2.2：樑的折減只適用於該樑本身；柱要另按 Table 3.11 以樓層數折減。電腦模型中若同時開啟兩種折減要特別留意重複折減。","x":"The reduced imposed loads on beams shall not be applicable to the design of vertical members supporting the beams.","q_en":"The imposed load on a beam reduced per Table 3.10 may be used directly in designing the column supporting that beam.","e_en":"False. 3.7.2.2: the beam reduction applies only to the beam itself; columns are reduced separately by number of floors per Table 3.11. Beware of double reduction if both reductions are switched on in a computer model.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","ex":"loads","tier":"常考"},{"id":"DIL-030","t":"num","d":2,"tp":"荷載折減 Reduction","c":"Table 3.11","p":18,"q":"一條柱承托 6 層（包括天台）合資格折減的樓面，total distributed imposed load 可折減多少百分比？","a":25,"tol":0,"u":"%","e":"Table 3.11：1 層 0%，每多一層加 5%，8 層 35%，超過 8 層最多 40%。只計算合資格折減的樓層（例如停車場層不計）。","x":"4 15 5 20 6 25 7 30","q_en":"A column supports 6 floors (including the roof) that qualify for reduction. By what percentage may the total distributed imposed load be reduced?","e_en":"Table 3.11: 1 floor 0%, plus 5% per additional floor, 8 floors 35%, over 8 floors maximum 40%. Only floors qualifying for reduction are counted (e.g. car park floors are not).","doc":"dead-imposed-loads-2011-2021ed","pp":"14","ex":"loads","tier":"常考"},{"id":"DIL-031","t":"mcq","d":3,"tp":"荷載折減 Reduction","c":"Table 3.12","p":18,"q":"工場樓面（≥7.5 kPa）按 Table 3.12 折減時，每層折減後的 imposed load 最低不可少於：","o":["5.0 kPa","7.5 kPa","10.0 kPa","沒有下限"],"a":1,"e":"Table 3.12 註：折減後每層不可低於 7.5 kPa；超過 3 層最多折減 25%。工業大廈柱設計常用此表。","x":"Note: In no case can the reduced imposed load at each floor be less than 7.5 kPa.","q_en":"When workshop floors (≥7.5 kPa) are reduced per Table 3.12, the reduced imposed load on each floor must not be less than:","o_en":["5.0 kPa","7.5 kPa","10.0 kPa","No lower limit"],"e_en":"Table 3.12 note: after reduction, not less than 7.5 kPa per floor; maximum reduction 25% for more than 3 floors. Commonly used for column design in industrial buildings.","doc":"dead-imposed-loads-2011-2021ed","pp":"14","ex":"loads","tier":"常考"},{"id":"DIL-032","t":"mcq","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"容易擠擁區域（Areas susceptible to overcrowding）的護欄 line load 是多少 kN/m？","a":0,"u":"kN/m","e":"Table 3.13：不預期聚集 0.75 kN/m；可聚集但不擠擁 1.5 kN/m；易擠擁 3.0 kN/m。Line load 施加於樓面以上 1.1 m 或護欄頂（取較低者）。玻璃欄河設計（Glass Code）亦引用此表。","x":"Areas susceptible to 3.0 1.5 1.5 overcrowding","o":["3.0 kN/m","5.0 kN/m","1.5 kN/m","0.75 kN/m"],"q_en":"What is the barrier line load for areas susceptible to overcrowding, in kN/m?","e_en":"Table 3.13: congregation not expected 0.75 kN/m; people may congregate but overcrowding not expected 1.5 kN/m; susceptible to overcrowding 3.0 kN/m. The line load acts at 1.1 m above floor level or at the top of the barrier, whichever is lower. Glass balustrade design (Glass Code) also refers to this table.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","ex":"loads","tier":"常考"},{"id":"DIL-033","t":"mcq","d":2,"tp":"護欄荷載 Barriers","c":"3.8.1.3","p":19,"q":"住宅 balconies 的護欄應屬哪一個類別？","o":["Areas where congregation of people is not expected（0.75 kN/m）","Areas where people may congregate but overcrowding is not expected（1.5 kN/m）","Areas susceptible to overcrowding（3.0 kN/m）","毋須設計水平荷載"],"a":1,"e":"3.8.1.3：balconies、utility platforms、edges of roofs、≤3 m 寬行人天橋屬 1.5 kN/m 類別。住宅室內樓梯則屬 0.75 kN/m。","x":"with fixed seating or tables; balconies; utility platforms; edges of roofs; and footbridges or","q_en":"Which category do barriers to residential balconies fall into?","o_en":["Areas where congregation of people is not expected (0.75 kN/m)","Areas where people may congregate but overcrowding is not expected (1.5 kN/m)","Areas susceptible to overcrowding (3.0 kN/m)","No horizontal load design needed"],"e_en":"3.8.1.3: balconies, utility platforms, edges of roofs and footbridges ≤3 m wide fall into the 1.5 kN/m category. Internal stairs in dwellings are 0.75 kN/m.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","ex":"loads","tier":"常考"},{"id":"DIL-034","t":"mcq","d":2,"tp":"護欄荷載 Barriers","c":"Table 3.13","p":19,"q":"護欄 line load 的施加高度為樓面以上多少 m（或護欄頂，取較低者）？","a":1,"u":"m","e":"Table 3.13 Note：1.1 m 或護欄頂邊，取較低者。護欄底座錨栓及 cantilever 板邊的彎矩按此高度計算。","x":"The line load is to be applied at a height of 1.1m above the floor level or the top edge of the protective barrier","o":["1.0 m","1.1 m","1.2 m","0.9 m"],"q_en":"The barrier line load is applied at what height in m above floor level (or the top of the barrier, whichever is lower)?","e_en":"Table 3.13 Note: 1.1 m or the top edge of the barrier, whichever is lower. Barrier base anchors and cantilever slab edge moments are calculated at this height.","doc":"dead-imposed-loads-2011-2021ed","pp":"15","ex":"loads","tier":"常考"},{"id":"DIL-036","t":"mcq","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"Table 3.17","p":21,"q":"公共道路（Public Roads）對斜坡及擋土結構的最低附加荷載（surcharge）是多少 kPa？","a":1,"u":"kPa","e":"Table 3.17：Public roads 20 kPa、Private roads 10 kPa、行人路/單車徑/遊樂場 5 kPa。Geoguide 1 的擋土牆設計亦採用相同數值；淺基礎建築物無紀錄時每層不少於 10 kPa（3.9.2）。","x":"Public Roads 20","o":["25 kPa","20 kPa","5 kPa","10 kPa"],"q_en":"What is the minimum surcharge on slopes and retaining structures for public roads, in kPa?","e_en":"Table 3.17: public roads 20 kPa, private roads 10 kPa, footpaths/cycle tracks/playgrounds 5 kPa. Geoguide 1 retaining wall design uses the same values; for buildings on shallow foundations without records, not less than 10 kPa per storey (3.9.2).","doc":"dead-imposed-loads-2011-2021ed","pp":"17","ex":"ground","tier":"常考"},{"id":"DIL-037","t":"mcq","d":2,"tp":"擋土結構附加荷載 Surcharge","c":"3.9.2","p":21,"q":"評估淺基礎鄰近建築物對擋土結構的附加荷載，如無記錄，每層最少取多少 kPa？","a":0,"u":"kPa per storey","e":"3.9.2：有記錄用實際荷載；無記錄按現有用途及結構形式評估，最少每層 10 kPa。深挖工程（ELS）設計檢核鄰近舊樓時常用。","x":"structural forms with a minimum value of 10 kPa per storey.","o":["10 kPa per storey","15 kPa per storey","7.5 kPa per storey","5 kPa per storey"],"q_en":"When assessing the surcharge on a retaining structure from an adjacent building on shallow foundations with no records, what minimum per storey should be taken, in kPa?","e_en":"3.9.2: use the actual loads if records exist; without records, assess from the existing use and structural form, minimum 10 kPa per storey. Commonly used in deep excavation (ELS) design when checking adjacent old buildings.","doc":"dead-imposed-loads-2011-2021ed","pp":"17","ex":"ground","tier":"常考"},{"id":"DIL-039","t":"mcq","d":2,"tp":"荷載告示 Notice","c":"3.11.3","p":22,"q":"工業大廈樓面荷載告示以 kg/m² 表示時，1 kPa 應換算為多少 kg/m²？","a":1,"u":"kg/m²","e":"3.11.3：1 kPa = 102 kg/m²（不包括動力效應）。告示須中英文、字高 ≥15 mm，放於每層樓梯或適當位置。驗樓（Occupation Permit）時 BD 會查。","x":"1 kPa to 102 kilograms per square metre","o":["100 kg/m²","102 kg/m²","105 kg/m²","98 kg/m²"],"q_en":"When floor loading notices in industrial buildings are expressed in kg/m², 1 kPa should be converted to how many kg/m²?","e_en":"3.11.3: 1 kPa = 102 kg/m² (excluding dynamic effects). Notices must be in Chinese and English, with characters ≥15 mm high, displayed at the staircase on each floor or another suitable location. BD checks this at the Occupation Permit inspection.","doc":"dead-imposed-loads-2011-2021ed","pp":"18","ex":"loads","tier":"偶考"},{"id":"DIL-040","t":"mcq","d":2,"tp":"表現為本 Performance based","c":"4.2.1","p":23,"q":"以 performance based approach 從量度數據推算 design imposed load 時，設計荷載在使用年期內被超越的機率不應多於：","o":["1%","5%","10%","50%"],"a":1,"e":"4.2.1(a)：probability-based analysis 下被超越機率不多於 5%，須獲 Building Authority 接納。適用於 Code 未列明的特殊用途（如數據中心）。","x":"imposed load not more than 5 percent probability of the design imposed load being","q_en":"When deriving the design imposed load from measured data by a performance based approach, the probability of the design load being exceeded during the design life should not be more than:","e_en":"4.2.1(a): under probability-based analysis, probability of exceedance not more than 5%, subject to acceptance by the Building Authority. Applicable to special uses not listed in the Code (e.g. data centres).","doc":"dead-imposed-loads-2011-2021ed","pp":"19","ex":"loads","tier":"偶考"},{"id":"DIL-041","t":"mcq","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：鋼筋混凝土（Reinforced concrete）密度是多少 kN/m³？","a":3,"u":"kN/m³","e":"Appendix A：Plain 23.6、Reinforced 24.5、Prestressed 24.5 kN/m³。香港計算書普遍取 24.5 kN/m³；鋼 77.0、玻璃 26、泥土 20 kN/m³。","x":"Reinforced 24.5","o":["23.5 kN/m³","24.0 kN/m³","25.0 kN/m³","24.5 kN/m³"],"q_en":"Appendix A: what is the density of reinforced concrete, in kN/m³?","e_en":"Appendix A: plain 23.6, reinforced 24.5, prestressed 24.5 kN/m³. Hong Kong calculations generally take 24.5 kN/m³; steel 77.0, glass 26, soil 20 kN/m³.","doc":"dead-imposed-loads-2011-2021ed","pp":"20","ex":"loads","tier":"常考"},{"id":"DIL-042","t":"mcq","d":1,"tp":"材料密度 Densities","c":"Appendix A","p":24,"q":"Appendix A：玻璃（Glass）的密度是多少 kN/m³？","a":0,"u":"kN/m³","e":"Glass 26 kN/m³，幕牆及玻璃天幕 dead load 計算要用；Glass Code 設計時自重亦影響斜置玻璃的荷載組合。","x":"Other materials Glass 26","o":["26 kN/m³","27 kN/m³","24.5 kN/m³","22 kN/m³"],"q_en":"Appendix A: what is the density of glass, in kN/m³?","e_en":"Glass 26 kN/m³, used in dead load calculations for curtain walls and glass canopies; in Glass Code design, self-weight also affects the load combinations of inclined glass.","doc":"dead-imposed-loads-2011-2021ed","pp":"20","ex":"loads","tier":"常考"},{"id":"FIR-001","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"C4.1 / Table C1","p":87,"q":"Table C1：Use Classification 1 Residential 的 FRR 及 compartment 面積限制？","o":["60 min；不限","120 min；2,500 m²","60 min；10,500 m²","90 min；不限"],"a":0,"e":"住宅及酒店 60 分鐘、compartment 不限，但每個單位之間要以 fire barrier 分隔。結構工程師要確保所有 element of construction（柱、樑、樓板）達到 FRR 60 的保護層和尺寸。","x":"1. Residential Not limited 60","q_en":"Table C1: FRR and compartment size limit for Use Classification 1 Residential?","o_en":["60 min; unlimited","120 min; 2,500 m²","60 min; 10,500 m²","90 min; unlimited"],"e_en":"Residential and hotels: 60 minutes with unlimited compartment size, but each unit must be separated by fire barriers. The structural engineer must ensure all elements of construction (columns, beams, floors) achieve the cover and dimensions for FRR 60.","doc":"fire-safety-2011-2024ed","pp":"78","ex":"fire","tier":"必考"},{"id":"FIR-002","t":"mcq","d":1,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Carparks 的 FRR（分鐘）？","a":3,"u":"min","e":"停車場 60 分鐘、compartment ≤10,500 m²。注意停車場若在地庫則要按 C14 用 240 分鐘。","x":"7. Carparks Not exceeding 10,500m2 60","o":["240 min","90 min","120 min","60 min"],"q_en":"Table C1: FRR (minutes) for carparks?","e_en":"Carparks 60 minutes, compartment ≤10,500 m². Note that basement carparks must use 240 minutes per C14.","doc":"fire-safety-2011-2024ed","pp":"78","ex":"fire","tier":"必考"},{"id":"FIR-003","t":"mcq","d":2,"tp":"耐火等級 FRR","c":"Table C1","p":87,"q":"Table C1：Mercantile facilities（4b）compartment 面積超過 2,500 m² 但不超過 10,500 m² 時的 FRR？","o":["60 min","90 min","120 min","240 min"],"a":2,"e":"商場類 ≤2,500 m² 為 60 分鐘，超過則 120 分鐘。平台商場設計時 compartment 劃分直接影響結構保護層及樓板厚度。","x":"Exceeding 2,500m2 but not 120","q_en":"Table C1: FRR
